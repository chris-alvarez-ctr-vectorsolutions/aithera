<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin preview — Bloodborne Pathogens</title>
    <!-- Vector Web Components (core v1.22.3 / themes v1.9.3, the versions cached in context/) -->
    <script type="module" src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.22.3/core.iife.js"></script>
    <script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.9.3/styles.js"></script>
    <link rel="stylesheet" href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css" />
    <!-- Self-hosted Font Awesome Pro (repo root is four levels up from verN/) -->
    <link rel="stylesheet" href="../../../../assets/fontawesome/css/all.min.css" />
    <!-- Tokens, segmented control and switches shared with the assign flows -->
    <link rel="stylesheet" href="../../bbp-admin/ver1/admin.css?v=66" />
    <link rel="stylesheet" href="viewer.css?v=2" />
</head>
<body>
<!-- ==========================================================================
     Admin preview viewer. Opened from "Admin preview" in either assign flow
     (bbp-admin, le-launch) with the assignment's choices on the URL.

     Design mode: every screen of the module as a slide, in order. Where the
     course branches, its versions stack in a column; the ones this learner
     gets are lit and joined, the rest are greyed. Change the learner on the
     left and the path and the slides update. Click any slide to play it.
     Play mode: that screen full size, live, with Back/Next along the path.

     Every slide is the real module (lesson-presentation/clara/sharps.html) in
     a frame, loaded with js/preview-embed.js's profile, so nothing here is a
     copy that can drift from the module. Which slides light comes from the
     module itself: a hidden frame with the same profile reports its path.
     ========================================================================== -->

    <header class="av-bar">
        <div class="av-title"><small>Admin preview</small><b>Bloodborne Pathogens · Contain the Sharp</b></div>
        <span class="mini-seg av-mode" role="radiogroup" aria-label="Mode">
            <button type="button" role="radio" data-mode="design"><i class="fa-solid fa-table-cells-large"></i>Design</button>
            <button type="button" role="radio" data-mode="play"><i class="fa-solid fa-play"></i>Play</button>
        </span>
        <div class="av-right">
            <span class="av-path" id="pathInfo" aria-live="polite"></span>
            <vaadin-button theme="secondary" id="exitBtn"><i class="fa-solid fa-arrow-left" style="margin-right:8px"></i>Exit admin preview</vaadin-button>
        </div>
    </header>

    <div class="av-body">
        <!-- Learner options: who this learner is and how they answer -->
        <aside class="av-panel" aria-label="Learner options">
            <h2>Try it as a learner who…</h2>
            <p>Change any answer to see how the course responds.</p>
            <div id="panel"></div>
        </aside>

        <main class="av-canvas" id="canvas">
            <!-- Design mode -->
            <div class="av-design" id="design">
                <div class="av-scroll" id="scroll">
                    <div class="av-sizer" id="sizer">
                        <div class="av-board" id="board"></div>
                        <svg class="av-links" id="links" aria-hidden="true"></svg>
                    </div>
                </div>
                <div class="av-empty" id="empty" hidden></div>
                <div class="av-legend" aria-label="Key">
                    <span><b class="kfd k">K</b>Knowledge</span>
                    <span><b class="kfd f">F</b>Feeling</span>
                    <span><b class="kfd d">D</b>Doing</span>
                </div>
                <div class="av-zoom" role="group" aria-label="Zoom">
                    <button type="button" id="zoomOut" aria-label="Zoom out"><i class="fa-solid fa-minus"></i></button>
                    <output id="zoomPct">100%</output>
                    <button type="button" id="zoomIn" aria-label="Zoom in"><i class="fa-solid fa-plus"></i></button>
                    <button type="button" class="fit" id="zoomFit">Fit</button>
                </div>
            </div>

            <!-- Play mode -->
            <div class="av-play" id="play" hidden>
                <div class="pl-bar">
                    <button type="button" class="pl-btn" id="toDesign"><i class="fa-solid fa-table-cells-large"></i>Back to design</button>
                    <span class="pl-where" id="plWhere"></span>
                    <span class="pl-nav">
                        <button type="button" class="pl-btn" id="plPrev"><i class="fa-solid fa-arrow-left"></i>Previous</button>
                        <button type="button" class="pl-btn" id="plNext">Next<i class="fa-solid fa-arrow-right"></i></button>
                    </span>
                </div>
                <div class="pl-stage"><iframe id="plFrame" title="Learner view"></iframe><div class="pl-off" id="plOff" hidden></div></div>
                <nav class="pl-strip" id="plStrip" aria-label="This learner’s path"></nav>
            </div>
        </main>
    </div>

    <script src="viewer.js?v=2"></script>

<!-- ── Design Toolbox: Flow Map ─────────────────────────────────────────── -->
<script>
  function applyFlowState(id, opts) {
    opts = opts || {};
    if (window.AdminViewer) window.AdminViewer.state(id);
  }
  window.applyFlowState = applyFlowState;
  function bootFromHash() {
    var m = (location.hash || '').match(/fm=([\w-]+)/);
    if (m) { try { applyFlowState(decodeURIComponent(m[1]), { instant: true }); } catch (e) {} }
  }
  bootFromHash();
  window.addEventListener('hashchange', bootFromHash);
  window.TOOLBOX_CONFIG = {
    flowMap: {
      title: 'Admin preview — Flow Map',
      applyState: 'applyFlowState',
      canvas: { w: 1240, h: 300 },
      flows: [{ id: 'main', name: 'Admin preview', pill: 'A', color: '#c9b8f0', lane: { x: 20, y: 20, w: 1200, h: 260 }, labelXY: { x: 40, y: 40 } }],
      nodes: [
        { id: 'design', flow: 'main', entry: true, x: 60, y: 100, step: '1', name: 'Design: new learner', state: 'design',
          desc: 'Every screen as a slide, zoomed to fit. Base versions lit for a learner who misses both knowledge questions and agrees with both statements.' },
        { id: 'ahead', flow: 'main', x: 360, y: 100, step: '2', name: 'Design: already knows it', state: 'ahead',
          desc: 'Both knowledge questions right: the harder case versions light, and Your updated path appears.' },
        { id: 'struggles', flow: 'main', x: 660, y: 100, step: '3', name: 'Design: struggles', state: 'struggles',
          desc: 'Misses both checks and disagrees with both statements: remedial cases and the longer story and debrief light.' },
        { id: 'play', flow: 'main', x: 960, y: 100, step: '4', name: 'Play', state: 'play',
          desc: 'One screen full size and live. Back and Next follow the lit path; the strip below jumps anywhere on it.' }
      ],
      edges: [['design', 'ahead'], ['ahead', 'struggles'], ['struggles', 'play']]
    }
  };
</script>
<script src="../../../../designtoolbox/toolbox.js?v=1.4.0"></script>
</body>
</html>
