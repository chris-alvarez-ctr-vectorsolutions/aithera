<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terms to Remember — Lesson Presentation</title>

    <!-- Vector Web Components: Core -->
    <script type="module"
        src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.19.0/core.iife.js"></script>

    <!-- Vector Web Components: Themes (import as plain script) -->
    <script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.5.0/styles.js"></script>

    <!-- Open Sans -->
    <link rel="stylesheet"
        href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css" />

    <!-- Font Awesome 6 -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <link rel="stylesheet" href="css/lesson.css?v=18" />

    <style>
        /* Visually hidden but available to screen readers (heading + live region) */
        .sr-only {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: -1px; overflow: hidden;
            clip: rect(0 0 0 0); white-space: nowrap; border: 0;
        }
    </style>
</head>
<body>

    <!-- ===== Fixed header: course > lesson + progress ===================== -->
    <header class="lesson-header">
        <nav class="lesson-crumb" aria-label="Breadcrumb">
            <span class="crumb-course">Intro to Spirits &amp; Distillation</span>
            <span class="crumb-sep">›</span>
            <span class="crumb-lesson">Reading a Liquor Label</span>
        </nav>
        <div class="lesson-progress">
            <span class="progress-label">Step 3 of 8</span>
            <vaadin-progress-bar value="0.375" aria-label="Lesson progress"></vaadin-progress-bar>
        </div>
    </header>

    <!-- ===== Lesson shell ================================================= -->
    <div class="lesson-shell">
        <main class="lesson-body" id="main">

            <!-- Content type: Terms to Remember -->
            <h1 class="sr-only">Terms to remember: Proof</h1>
            <p class="terms-eyebrow">
                <i class="fa-solid fa-bookmark"></i> Remember this term
            </p>

            <button class="term-card" id="termCard" aria-pressed="false"
                    aria-label="Flip card to reveal the definition of Proof">
                <div class="term-card-inner">
                    <div class="term-face term-front" aria-hidden="false">
                        <span class="term-word">Proof</span>
                    </div>
                    <!-- The back face stays hidden from screen readers until the flip -->
                    <div class="term-face term-back" aria-hidden="true">
                        <p class="term-back-word">Proof</p>
                        <p class="term-back-def">
                            A measure of how much alcohol (ethanol) a spirit contains. In the U.S.,
                            proof is exactly twice the alcohol by volume (ABV) — so an 80-proof
                            whiskey is 40% alcohol.
                        </p>
                        <p class="term-back-tag">Tap the card to flip back</p>
                    </div>
                </div>
            </button>

            <!-- Subtle flip helper (fades out once flipped) -->
            <p class="term-flip-hint" id="flipHint">
                <i class="fa-solid fa-rotate"></i> Flip the card to see the definition
            </p>

            <!-- Revealed after the flip -->
            <div class="term-ask-row">
                <vaadin-button class="term-ask-btn" id="askBtn" theme="tertiary">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Ask about this
                </vaadin-button>
            </div>

        </main>
    </div>

    <!-- ===== Fixed footer: instructions + navigation ===================== -->
    <footer class="lesson-footer">
        <p class="lesson-instructions" id="instructions" aria-live="polite">
            Read the term, then flip the card to reveal its definition before continuing.
        </p>
        <div class="lesson-nav">
            <vaadin-button theme="secondary" id="backBtn">Back</vaadin-button>
            <vaadin-button theme="primary" id="continueBtn" disabled>Continue</vaadin-button>
        </div>
    </footer>

    <!-- Polite live region: announces the revealed definition on first flip -->
    <p class="sr-only" id="defAnnounce" aria-live="polite"></p>

    <script src="js/lesson.js?v=5"></script>
    <script>
        // ---- Card flip ---------------------------------------------------
        const card        = document.getElementById('termCard');
        const askBtn      = document.getElementById('askBtn');
        const continueBtn = document.getElementById('continueBtn');
        const instructions = document.getElementById('instructions');
        const frontFace   = card.querySelector('.term-front');
        const backFace    = card.querySelector('.term-back');
        const defAnnounce = document.getElementById('defAnnounce');
        let hasFlipped = false;

        card.addEventListener('click', () => {
            const flipped = card.classList.toggle('flipped');
            card.setAttribute('aria-pressed', flipped ? 'true' : 'false');

            // Only the visible face is exposed to screen readers.
            frontFace.setAttribute('aria-hidden', flipped ? 'true' : 'false');
            backFace.setAttribute('aria-hidden', flipped ? 'false' : 'true');

            // First reveal unlocks Continue + the "Ask about this" affordance.
            if (flipped && !hasFlipped) {
                hasFlipped = true;
                askBtn.classList.add('revealed');
                continueBtn.disabled = false;
                instructions.textContent =
                    'Nice — you can continue now, or ask the AI helper to go deeper on this term.';
                // Read the definition out through the live region for reliability.
                defAnnounce.textContent =
                    'Proof: ' + backFace.querySelector('.term-back-def').textContent.replace(/\s+/g, ' ').trim();
            }
        });

        // ---- Configure the simulated AI helper ---------------------------
        Lesson.chat.configure({
            title: 'Ask about “Proof”',
            subtitle: 'AI learning helper',
            intro: "Hi! You're looking at the term “Proof.” Ask me anything about it — " +
                   "here are a few things people often wonder:",
            suggestions: [
                {
                    q: 'Why is it called “proof”?',
                    a: 'It goes back to 16th–18th century England. To “prove” a spirit was strong ' +
                       'enough, it was soaked into gunpowder and lit. If the powder still ignited, ' +
                       'that was “proof” the alcohol content was high enough (around 57% ABV). ' +
                       'Too weak, and the wet powder wouldn’t catch.',
                },
                {
                    q: 'How does proof relate to ABV?',
                    a: 'In the United States it’s a simple 2:1 ratio: proof = ABV × 2.\n\n' +
                       '• 80 proof = 40% ABV\n• 100 proof = 50% ABV\n• 151 proof = 75.5% ABV\n\n' +
                       'So you can always halve the proof to get the percentage of alcohol.',
                },
                {
                    q: 'Give me an example',
                    a: 'Sure — pick up a standard bottle of vodka and the label might say “80 proof.” ' +
                       'That means it’s 40% alcohol by volume. A bottle of overproof rum labeled ' +
                       '“151” is 75.5% ABV — much stronger, which is why it’s often used sparingly.',
                },
                {
                    q: 'Is proof the same everywhere?',
                    a: 'No — that’s a common mix-up. The U.S. uses proof = 2 × ABV. The historical ' +
                       'British (Imperial) system set 100° proof at about 57.1% ABV, so their numbers ' +
                       'don’t line up with the U.S. scale. Most countries today just label ABV directly.',
                },
            ],
            fallback:
                'Good question! The key thing to remember: “proof” measures a spirit’s alcohol ' +
                'content, and in the U.S. it’s always twice the ABV. Want an example, or the ' +
                'story behind the name?',
        });

        askBtn.addEventListener('click', () => Lesson.chat.open());

        // ---- Navigation (prototype: visual only) -------------------------
        document.getElementById('backBtn').addEventListener('click', () => {
            console.log('Back');
        });
        continueBtn.addEventListener('click', () => {
            if (!continueBtn.disabled) console.log('Continue');
        });
    </script>
</body>
</html>
