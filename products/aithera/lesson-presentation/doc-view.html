<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Docs — readable views</title>
<!-- ==========================================================================
     UNCATALOGUED SIBLING of the scenario-simulator-* architecture notes.
     NOT in products.json. The generic readable view for the repo's markdown
     working documents: doc-view.html?doc=<relative .md path> fetches the
     source at load and renders it with js/md-doc-view.js, so these views
     never drift from their sources. With no ?doc= it lists the known docs.
     Requires http(s) — fetch does not run from file://.
     ========================================================================== -->
<link rel="stylesheet" href="css/md-doc.css?v=1">
</head>
<body>
<div class="wrap">

  <div class="pagebar">
    <span>Aithera · Scenario Simulator · docs</span>
    <span class="src" id="srcline"></span>
  </div>

  <div id="doc"><p>Loading…</p></div>

  <footer>
    Companions: <a href="scenario-simulator-alignment-notes.html">alignment notes</a> ·
    <a href="scenario-simulator-dev-conversation-guide.html">conversation guide</a> ·
    <a href="scenario-simulator-extensions-proposal.html">extensions proposal</a> ·
    <a href="index.html#docs">all docs</a>
  </footer>

</div>

<script src="js/md-doc-view.js?v=1"></script>
<script>
(function () {
  'use strict';

  /* The markdown working docs this viewer knows about — also the landing
     list when no ?doc= is given. Paths are relative to this page. */
  const KNOWN = [
    { path: 'docs/V4-ALIGNMENT-NOTES.md',           label: 'Scenario CML v4 Alignment — decisions, gaps, and state' },
    { path: 'docs/SCENE-SWEEP-CONVERGENCE-PLAN.md', label: 'Scene Sweep → Universal Player — convergence plan' },
    { path: 'docs/WRITER-STUDIO-DEV-BRIEF.md',      label: 'Writer Studio — dev review quick reference' },
    { path: 'js/README.writer-studio.md',           label: 'Writer Studio — architecture & contracts' }
  ];

  const doc = document.getElementById('doc');
  const src = document.getElementById('srcline');
  const param = new URLSearchParams(location.search).get('doc') || '';

  /* Same-origin relative .md paths only — no scheme, no leading slash,
     no parent-directory escapes. */
  const safe = /^[\w][\w./ -]*\.md$/.test(param) &&
    param.indexOf('..') < 0 && param.indexOf(':') < 0 && param.indexOf('//') < 0;

  if (!safe) {
    src.textContent = 'markdown sources, rendered at load';
    doc.innerHTML = '<h1>Docs</h1>' +
      '<p>Readable views of the markdown working documents in this folder. Each view fetches its source at load, so it is always current.</p>' +
      '<ul>' + KNOWN.map(function (d) {
        return '<li><a href="doc-view.html?doc=' + encodeURIComponent(d.path) + '">' +
          d.label + '</a><br><code>' + d.path + '</code></li>';
      }).join('') + '</ul>';
    return;
  }

  src.innerHTML = 'source: <a href="' + param + '">' + param + '</a> (rendered at load)';
  MdDocView.mount(doc, param);
}());
</script>
</body>
</html>
