<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Question — Lesson Presentation</title>

    <!-- Vector Web Components: Core -->
    <script type="module"
        src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.19.0/core.iife.js"></script>

    <!-- Vector Web Components: Themes (import as plain script) -->
    <script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.5.0/styles.js"></script>

    <!-- Open Sans -->
    <link rel="stylesheet"
        href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css" />

    <!-- Font Awesome 6 -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <link rel="stylesheet" href="css/lesson.css?v=18" />
</head>
<body>

    <!-- ===== Fixed header: course > lesson + progress ===================== -->
    <header class="lesson-header">
        <nav class="lesson-crumb" aria-label="Breadcrumb">
            <span class="crumb-course">Supporting Recovery in the Workplace</span>
            <span class="crumb-sep">›</span>
            <span class="crumb-lesson">A Quick Check-In</span>
        </nav>
        <div class="lesson-progress">
            <span class="progress-label">Step 2 of 6</span>
            <vaadin-progress-bar value="0.333" aria-label="Lesson progress"></vaadin-progress-bar>
        </div>
    </header>

    <!-- ===== Lesson shell ================================================= -->
    <div class="lesson-shell">
        <main class="lesson-body" id="main">

            <!-- Content type: Quick Question -->
            <section class="qq" role="group" aria-labelledby="qqQuestion">
                <p class="qq-eyebrow">
                    <i class="fa-solid fa-circle-question"></i> Quick question
                </p>

                <h1 class="qq-question" id="qqQuestion">Are you in recovery?</h1>

                <!-- Clarifier: opens a simple modal with "more info" -->
                <button class="qq-clarifier" id="clarifierBtn" type="button">
                    <i class="fa-solid fa-circle-info"></i> What&rsquo;s considered &ldquo;recovery&rdquo;?
                </button>

                <!-- Large, blocky single-select responses (max 4) -->
                <div class="qq-options" role="radiogroup" aria-labelledby="qqQuestion" id="qqOptions">
                    <button class="qq-option" type="button" role="radio" aria-checked="false" data-value="yes">
                        <span class="qq-check"><i class="fa-solid fa-check"></i></span>
                        <i class="qq-option-icon fa-solid fa-heart"></i>
                        <span class="qq-option-label">Yes</span>
                    </button>
                    <button class="qq-option" type="button" role="radio" aria-checked="false" data-value="no">
                        <span class="qq-check"><i class="fa-solid fa-check"></i></span>
                        <i class="qq-option-icon fa-solid fa-circle-xmark"></i>
                        <span class="qq-option-label">No</span>
                    </button>
                </div>
            </section>

        </main>
    </div>

    <!-- ===== Fixed footer: instructions + navigation ===================== -->
    <footer class="lesson-footer">
        <p class="lesson-instructions" id="instructions">
            Select an answer to continue.
        </p>
        <div class="lesson-nav">
            <vaadin-button theme="secondary" id="backBtn">Back</vaadin-button>
            <vaadin-button theme="primary" id="nextBtn" disabled>Next</vaadin-button>
        </div>
    </footer>

    <script src="js/lesson.js?v=5"></script>
    <script>
        // ---- Single-select option group ---------------------------------
        const options      = document.querySelectorAll('.qq-option');
        const nextBtn      = document.getElementById('nextBtn');
        const instructions = document.getElementById('instructions');
        let selected = null;

        options.forEach((opt) => {
            opt.addEventListener('click', () => {
                // Single-select: clear the others, mark this one.
                options.forEach((o) => o.setAttribute('aria-checked', 'false'));
                opt.setAttribute('aria-checked', 'true');
                selected = opt.dataset.value;

                nextBtn.disabled = false;
                instructions.textContent =
                    'Thanks for sharing — your answer stays private. You can continue when ready.';
            });
        });

        // ---- Clarifier modal --------------------------------------------
        document.getElementById('clarifierBtn').addEventListener('click', () => {
            Lesson.modal.open({
                title: 'What’s considered “recovery”?',
                icon: 'fa-circle-info',
                body:
                    'For this course, “recovery” means you’re actively working to ' +
                    'change a relationship with alcohol, drugs, or another addictive behavior — ' +
                    'whether that started last week or years ago.\n\n' +
                    'It includes people in formal treatment, those using mutual-support groups, ' +
                    'and anyone maintaining their own personal recovery. There’s no single ' +
                    '“right” path, and how you answer is entirely up to you.\n\n' +
                    'Your response is private and only helps tailor the rest of this lesson.',
                cta: 'Got it',
            });
        });

        // ---- Navigation (prototype: visual only) -------------------------
        document.getElementById('backBtn').addEventListener('click', () => {
            console.log('Back');
        });
        nextBtn.addEventListener('click', () => {
            if (!nextBtn.disabled) console.log('Next — answer:', selected);
        });
    </script>
</body>
</html>
