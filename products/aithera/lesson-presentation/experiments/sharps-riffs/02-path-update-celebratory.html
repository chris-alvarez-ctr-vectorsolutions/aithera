<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Path Update (gamified) — Riff 02</title>
<link rel="stylesheet" href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css" />
<link rel="stylesheet" href="../../../../../assets/fontawesome/css/all.min.css" />
<link rel="stylesheet" href="../../css/frame.css?v=5" />
<style>
  /* Tokens lifted from css/layered-learning.css so this riff reads as the same
     visual language as the real "Your Updated Path" screen it's riffing on —
     see clara/sharps.html's ADJUST_CONTENT / adjustInit for the original. */
  :root{
    --bg:        #070b14;
    --panel:     #111a2e;
    --ink:       #eaf0fb;
    --ink-soft:  #aab6cc;
    --ink-faint: #7a879e;
    --line:      rgba(255,255,255,.11);
    --teal:      #2ee6cf;
    --teal-2:    #14b8a6;
    --grad:      linear-gradient(135deg, #46f0dc 0%, #16b8a6 55%, #0c8f83 100%);
    --amber:     #f1b34a;
    --ease:      cubic-bezier(.2,.7,.2,1);
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow:hidden;
  }

  /* ---- Stage: same dark radial wash as .ll-stage, sits between the frame
     header and the footer bar. ---- */
  .stage{
    position:fixed; left:0; right:0; top:var(--header-h); bottom:80px;
    overflow:hidden;
    background: radial-gradient(130% 110% at 50% -10%, #0f1a2e 0%, #0a1120 52%, #05080f 100%);
  }
  .stage::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(60% 55% at 50% 42%, rgba(46,230,207,.06), transparent 70%),
      radial-gradient(100% 100% at 50% 120%, rgba(0,0,0,.55), transparent 60%);
  }
  #confettiCanvas{
    position:absolute; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:2;
  }

  .stage-inner{
    position:absolute; inset:0; z-index:1;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center;
  }

  .orb-slot{ width:104px; height:104px; margin-bottom:22px; }
  .orb-mount{ width:100%; height:100%; }

  /* ---- Loader phase: the same progress-style beat as riff 03, so the
     reward reads as the PAYOFF of a calculation rather than something that
     just pops the instant the page loads. Deterministic only (no toggle) —
     this page isn't the place to compare bar styles, it's the place to
     land the reward well. ----

     .loader-wrap exists so removing the loader doesn't move the orb with a
     snap: the stage centers its content as a flex column, so instantly
     `hidden`-ing the status/track/pct changed the group's total height in
     one frame, and the orb (centered above it) jumped straight to its new
     resting spot the instant the confetti fired. Animating THIS wrapper's
     max-height instead gives the browser something to reflow gradually, so
     the orb eases into place over the same beat the reward fades in on,
     rather than snapping the frame before. */
  .loader-wrap{
    display:flex; flex-direction:column; align-items:center;
    max-height:120px; overflow:hidden;
    transition:max-height .6s var(--ease), opacity .35s ease;
  }
  .loader-wrap.collapsed{ max-height:0; opacity:0; }
  .min-status{ margin:0 0 20px; font-size:15px; letter-spacing:.01em; color:var(--ink-soft); }
  .min-track{
    width:min(320px, 70vw); height:6px; border-radius:999px; overflow:hidden;
    background:rgba(255,255,255,.08); position:relative;
  }
  .min-fill{ position:absolute; top:0; left:0; height:100%; width:0%; border-radius:999px; background:var(--grad); }
  .min-fill.is-filling{ width:100%; transition:width 1.7s cubic-bezier(.3,.6,.2,1); }
  .min-pct{
    margin:10px 0 0; font-size:12px; font-variant-numeric:tabular-nums;
    color:var(--ink-faint);
  }
  @media (prefers-reduced-motion: reduce){
    .loader-wrap{ transition:opacity .2s linear; }
  }

  .cel-block{ max-width:520px; opacity:0; transform:translateY(10px); transition:opacity .5s var(--ease), transform .5s var(--ease); }
  .cel-block.in{ opacity:1; transform:none; }

  .cel-eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    margin:0 0 14px; padding:6px 14px; border-radius:999px;
    background:rgba(241,179,74,.14); border:1px solid rgba(241,179,74,.32);
    color:var(--amber); font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
  }
  .cel-eyebrow i{ font-size:11px; }

  .cel-headline{
    margin:0 0 12px; font-size:clamp(28px, 4vw, 40px); font-weight:800;
    line-height:1.18; letter-spacing:-.01em; color:#fff;
  }
  .cel-headline .stat{ color:var(--amber); }

  .cel-sub{ margin:0; font-size:15px; line-height:1.5; color:var(--ink-soft); }

  @media (prefers-reduced-motion: reduce){
    .cel-block{ transition:opacity .2s linear; transform:none; }
  }

  /* A quick radial "pop" behind the headline, timed with the confetti launch
     — the confetti alone read as underwhelming because nothing marked the
     instant of the reward; this gives the reveal a single flash to land on. */
  .cel-flash{
    position:absolute; left:50%; top:50%; width:6px; height:6px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(46,230,207,.55) 35%, transparent 72%);
    transform:translate(-50%, -50%) scale(0); opacity:0; pointer-events:none;
  }
  .cel-flash.pop{ animation:cel-flash-pop .65s ease-out forwards; }
  @keyframes cel-flash-pop{
    0%   { transform:translate(-50%, -50%) scale(0);  opacity:.95; }
    55%  { transform:translate(-50%, -50%) scale(46);  opacity:.4; }
    100% { transform:translate(-50%, -50%) scale(70);  opacity:0; }
  }

  /* ---- Footer ---- */
  .foot{
    position:fixed; left:0; right:0; bottom:0; height:80px; z-index:45;
    display:flex; align-items:center; justify-content:flex-end; gap:10px;
    padding:0 24px;
    background:linear-gradient(180deg, #0b1322 0%, #070c16 100%);
    border-top:1px solid var(--line);
  }
  .btn{
    display:inline-flex; align-items:center; gap:9px; height:44px; padding:0 20px;
    border-radius:11px; border:1px solid transparent; font:inherit; font-size:14px; font-weight:700;
    cursor:pointer; transition:background .16s ease, border-color .16s ease, transform .1s ease;
  }
  .btn:active{ transform:translateY(1px); }
  .btn--ghost{ background:transparent; border-color:var(--line); color:var(--ink-soft); }
  .btn--ghost:hover{ border-color:rgba(255,255,255,.3); color:var(--ink); }
  .btn--primary{ background:var(--grad); color:#052b27; box-shadow:0 6px 18px rgba(20,184,166,.34); }
  .btn--primary:hover{ filter:brightness(1.06); }
</style>
</head>
<body>
  <div class="stage">
    <canvas id="confettiCanvas" aria-hidden="true"></canvas>
    <div class="stage-inner">
      <div class="orb-slot"><div class="orb-mount" id="orbMount"></div></div>

      <div class="loader-wrap" id="loaderWrap">
        <p class="min-status" id="minStatus">Calibrating your path…</p>
        <div class="min-track" id="minTrack"><div class="min-fill" id="minFill"></div></div>
        <p class="min-pct" id="minPct">0%</p>
      </div>

      <!--
        Deliberately light on copy: this variant is the reward for a learner
        whose answers tested them out of content, so the page's one job is to
        make that feel good FAST — not to itemize what changed (that's the
        minimal riff's job, and the original screen's). Sample numbers below
        are illustrative placeholders.
      -->
      <div class="cel-flash" id="celFlash" aria-hidden="true"></div>
      <div class="cel-block" id="celBlock">
        <p class="cel-eyebrow"><i class="fa-solid fa-trophy" aria-hidden="true"></i> Nice work</p>
        <h1 class="cel-headline">You just saved <span class="stat">6 minutes</span>.</h1>
        <p class="cel-sub">Your path adjusted around what you already know.</p>
      </div>
    </div>
  </div>

  <footer class="foot">
    <button class="btn btn--ghost" type="button" id="backBtn">Back</button>
    <button class="btn btn--primary" type="button" id="nextBtn">Continue <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
  </footer>

  <script>
    window.LESSON_FRAME = {
      course: 'Bloodborne Pathogens',
      lesson: 'Your Updated Path',
      step: '',
      progress: null,
      backHref: 'index.html',
    };
  </script>
  <script src="../../js/mobius-orb.js?v=5"></script>
  <script src="../../js/frame.js?v=7"></script>
  <script>
    if (window.MobiusOrb) MobiusOrb.create(document.getElementById('orbMount'));

    document.getElementById('nextBtn').addEventListener('click', function () {
      // Riff only — the real screen advances to the next lesson.
    });

    // ---- Confetti: one quick burst, no library. Skipped under reduced-motion
    // so the celebration never becomes the thing that bothers someone. ----
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function fireConfetti() {
      var canvas = document.getElementById('confettiCanvas');
      var ctx = canvas.getContext('2d');
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      function resize() {
        canvas.width = canvas.clientWidth * dpr;
        canvas.height = canvas.clientHeight * dpr;
      }
      resize();
      window.addEventListener('resize', resize);

      var COLORS = ['#2ee6cf', '#5aa9f6', '#f1b34a', '#c4b5fd', '#ff8fa8', '#ffffff'];
      var DURATION = 3400;
      var GRAVITY = 0.34;
      var DRAG = 0.992;
      var w = canvas.clientWidth, h = canvas.clientHeight;

      // A fixed particle count read as sparse once this ran full-bleed on a
      // real monitor instead of a small preview frame — scale density to the
      // viewport instead, clamped so it never gets absurd on an ultrawide.
      var perCorner = Math.max(110, Math.min(260, Math.round(w / 7)));

      // Two party-popper cannons, firing from just inside the bottom corners
      // (not the literal edge) so more of the arc crosses the headline in the
      // middle instead of piling up off to the sides. dir flips which way a
      // corner's cone leans: the left corner arcs right, the right corner
      // arcs left, so the two bursts cross rather than mirror past each other.
      // ~30% of each burst is a longer "streamer" strip mixed in with the
      // small dots/squares — that mix of scales is most of what reads as a
      // real confetti pop rather than a sprinkle of confetti dust.
      function makeBurst(originX, dir) {
        var out = [];
        for (var i = 0; i < perCorner; i++) {
          var speed = 17 + Math.random() * 17;
          var spreadDeg = 14 + Math.random() * 58;            // 14°–72° off straight up
          var rad = (90 - spreadDeg) * Math.PI / 180;          // → angle from horizontal
          var streamer = Math.random() < 0.3;
          out.push({
            x: originX,
            y: h,
            vx: dir * Math.cos(rad) * speed,
            vy: -Math.sin(rad) * speed,
            size: streamer ? 11 + Math.random() * 11 : 5 + Math.random() * 7,
            streamer: streamer,
            rot: Math.random() * Math.PI * 2,
            vr: (Math.random() - 0.5) * 0.4,
            color: COLORS[(Math.random() * COLORS.length) | 0],
            shape: streamer || Math.random() < 0.55 ? 'rect' : 'circle'
          });
        }
        return out;
      }
      var particles = makeBurst(w * 0.06, 1).concat(makeBurst(w * 0.94, -1));

      var start = null;
      function frame(ts) {
        if (!start) start = ts;
        var elapsed = ts - start;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.scale(dpr, dpr);
        var fadeStart = DURATION - 800;
        var alpha = elapsed > fadeStart ? Math.max(0, (DURATION - elapsed) / 800) : 1;
        particles.forEach(function (p) {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += GRAVITY;
          p.vx *= DRAG;
          p.rot += p.vr;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.globalAlpha = alpha;
          ctx.fillStyle = p.color;
          if (p.shape === 'rect') {
            var len = p.streamer ? p.size * 2 : p.size;
            ctx.fillRect(-len / 2, -p.size * 0.28, len, p.size * 0.42);
          } else {
            ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2); ctx.fill();
          }
          ctx.restore();
        });
        ctx.restore();
        if (elapsed < DURATION) requestAnimationFrame(frame);
        else { ctx.clearRect(0, 0, canvas.width, canvas.height); window.removeEventListener('resize', resize); }
      }
      requestAnimationFrame(frame);
    }

    // ---- Loader → reveal: the bar is what earns the confetti. Popping it
    // the instant the page loads made the reward feel arbitrary; landing it
    // right as a brief "calibrating" beat resolves makes it read as the
    // PAYOFF of something, the same job the bar does on its own in riff 03. ----
    var loaderWrap = document.getElementById('loaderWrap');
    var fillEl   = document.getElementById('minFill');
    var pctEl    = document.getElementById('minPct');
    var celBlock = document.getElementById('celBlock');

    function animateCounter(durationMs) {
      var start = null;
      function step(ts) {
        if (!start) start = ts;
        var t = Math.min(1, (ts - start) / durationMs);
        var eased = 1 - Math.pow(1 - t, 3); // ease-out so it settles rather than ticking linearly
        pctEl.textContent = Math.round(eased * 100) + '%';
        if (t < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function reveal() {
      // Collapse the loader and bring in the reward at the same moment —
      // the orb eases up into its resting spot as the wrapper's height
      // animates away, instead of snapping there the instant the loader
      // gets hidden.
      loaderWrap.classList.add('collapsed');
      celBlock.classList.add('in');
      if (!reduceMotion) {
        document.getElementById('celFlash').classList.add('pop');
        fireConfetti();
      }
      setTimeout(function () { loaderWrap.hidden = true; }, 650); // tidy up once the collapse transition finishes
    }

    void fillEl.offsetWidth; // reflow so the width transition below actually animates
    requestAnimationFrame(function () { fillEl.classList.add('is-filling'); });
    animateCounter(1700);
    setTimeout(reveal, 1760);
  </script>
</body>
</html>
