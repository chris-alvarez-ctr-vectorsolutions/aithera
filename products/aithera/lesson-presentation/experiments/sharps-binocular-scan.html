<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sharps POV Scan — Prototype</title>
<style>
  *{ box-sizing:border-box; }
  html,body{
    margin:0; height:100%; background:#000; overflow:hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .stage{
    position:relative; width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
    background:#000;
  }
  .frame{
    filter: drop-shadow(0 0 40px rgba(0,0,0,.85));
  }
  /* Shape comes entirely from a mask (a union of two circles, feathered at
     the outer edge) — this is one continuous silhouette, not two circles
     stacked on top of each other, so there's no seam down the middle.
     mask-image is set by the script as two radial-gradients; overlapping
     mask layers union by default (mask-composite: add), which is what
     keeps the shape seamless at any viewport size. */
  .viewport{
    position:relative;
    background:#000;
    mask-repeat:no-repeat; -webkit-mask-repeat:no-repeat;
  }
  .depth-vignette{
    position:absolute; inset:0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.55) 100%);
    pointer-events:none;
  }

  .jitter{ position:absolute; inset:0; will-change:transform; }

  .scene-img{
    position:absolute; top:0; left:0;
    transform-origin:0 0;
    /* duration here must match TRANSITION_MS in the script below */
    transition: transform 1.8s cubic-bezier(.45,.05,.15,1);
    user-select:none; pointer-events:none;
    -webkit-user-drag:none;
  }

  .eyelid{
    position:absolute; inset:0;
    background:#050505;
    transform-origin:center;
    transform:scaleY(0);
    pointer-events:none;
  }
  .eyelid.blinking{ animation: blink-close 260ms ease-in-out; }
  @keyframes blink-close{
    0%   { transform:scaleY(0); }
    45%  { transform:scaleY(1); }
    55%  { transform:scaleY(1); }
    100% { transform:scaleY(0); }
  }

  .caption{
    position:absolute; left:20px; bottom:16px;
    color:#4a4a4a; font-size:12px; letter-spacing:.02em;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="frame">
      <div class="viewport">
        <div class="jitter"><img class="scene-img" src="images/sharps-decision-scene.jpg" alt="" /></div>
        <div class="depth-vignette"></div>
        <div class="eyelid"></div>
      </div>
    </div>
  </div>
  <div class="caption">Prototype — first-person binocular scan</div>

<script>
(() => {
  // Focal points as fractions of the source image (x,y from top-left).
  // hold = ms to linger at that point before panning to the next one.
  const FOCAL_POINTS = [
    { name:'sharp',      fx:0.52, fy:0.72, hold:2600 },
    { name:'supervisor', fx:0.27, fy:0.40, hold:2200 },
    { name:'container',  fx:0.90, fy:0.36, hold:2200 },
  ];
  const ZOOM = 2.0;            // telephoto factor on top of a "cover" fit
  const TRANSITION_MS = 1800;  // must match the CSS transition duration on .scene-img
  const LENS_FRACTION = 0.46;  // lens diameter, as a fraction of the smaller viewport dimension
  const OVERLAP = 0.36;        // fraction of lens diameter the two circles overlap by

  const viewport = document.querySelector('.viewport');
  const img = document.querySelector('.scene-img');
  const jitterEl = document.querySelector('.jitter');
  const eyelid = document.querySelector('.eyelid');

  let naturalW, naturalH;
  let current = FOCAL_POINTS[0];
  let seqIndex = 0;

  function layoutLenses(){
    const D = Math.min(window.innerWidth, window.innerHeight) * LENS_FRACTION;
    const d = D * (1 - OVERLAP); // distance between the two circle centers
    const width = D + d, height = D, r = D / 2;
    const feather = Math.max(14, r * 0.12); // soften the outer edge, proportional to radius
    const solidR = Math.max(0, r - feather);

    viewport.style.width = width + 'px';
    viewport.style.height = height + 'px';

    const lensGradient = cx =>
      `radial-gradient(circle at ${cx}px ${r}px, #fff 0, #fff ${solidR}px, transparent ${r}px)`;
    const maskImg = `${lensGradient(r)}, ${lensGradient(r + d)}`;
    viewport.style.maskImage = maskImg;
    viewport.style.webkitMaskImage = maskImg;

    return { width, height };
  }

  function applyFocal(fx, fy){
    const rect = viewport.getBoundingClientRect();
    const coverScale = Math.max(rect.width / naturalW, rect.height / naturalH);
    const scale = coverScale * ZOOM;
    const rw = naturalW * scale, rh = naturalH * scale;
    const tx = rect.width / 2 - fx * rw;
    const ty = rect.height / 2 - fy * rh;
    img.style.width = rw + 'px';
    img.style.height = rh + 'px';
    img.style.transform = `translate(${tx}px, ${ty}px)`;
  }

  function goTo(point, withTransition){
    current = point;
    if (!withTransition) img.style.transition = 'none';
    applyFocal(point.fx, point.fy);
    if (!withTransition){
      requestAnimationFrame(() => { img.style.transition = ''; });
    }
  }

  function nextWaypoint(){
    seqIndex = (seqIndex + 1) % FOCAL_POINTS.length;
    const wp = FOCAL_POINTS[seqIndex];
    goTo(wp, true);
    setTimeout(nextWaypoint, TRANSITION_MS + wp.hold);
  }

  // Subtle handheld drift layered on top of the scripted pan.
  function jitterLoop(t){
    const jx = Math.sin(t / 1300) * 2.4 + Math.sin(t / 370) * 0.8;
    const jy = Math.cos(t / 1500) * 2.0 + Math.sin(t / 430) * 0.6;
    jitterEl.style.transform = `translate(${jx}px, ${jy}px)`;
    requestAnimationFrame(jitterLoop);
  }

  function scheduleBlink(){
    const delay = 3200 + Math.random() * 4200;
    setTimeout(() => {
      eyelid.classList.remove('blinking');
      void eyelid.offsetWidth; // restart the animation
      eyelid.classList.add('blinking');
      scheduleBlink();
    }, delay);
  }
  eyelid.addEventListener('animationend', () => eyelid.classList.remove('blinking'));

  window.addEventListener('resize', () => {
    layoutLenses();
    goTo(current, false);
  });

  const probe = new Image();
  probe.onload = () => {
    naturalW = probe.naturalWidth;
    naturalH = probe.naturalHeight;
    layoutLenses();
    goTo(FOCAL_POINTS[0], false);
    setTimeout(nextWaypoint, FOCAL_POINTS[0].hold);
    requestAnimationFrame(jitterLoop);
    scheduleBlink();
  };
  probe.src = img.src;
})();
</script>
</body>
</html>
