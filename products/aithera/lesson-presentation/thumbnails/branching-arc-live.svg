<svg xmlns="http://www.w3.org/2000/svg" width="900" height="562" viewBox="0 0 900 562" role="img" aria-label="Reading the Warning Signs — a branching escalation-ladder scenario, live AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f14"/>
      <stop offset="0.55" stop-color="#0d0b0f"/>
      <stop offset="1" stop-color="#1a0f0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.85" r="0.9">
      <stop offset="0" stop-color="#e5484d" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#e5484d" stop-opacity="0"/>
    </radialGradient>
    <style>
      .fnt { font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="900" height="562" fill="url(#bg)"/>
  <rect width="900" height="562" fill="url(#glow)"/>

  <!-- (Top-left corner left clear for the card's own "Live AI" flag.) -->

  <!-- Kicker + title -->
  <g class="fnt" fill="#e8ecf4">
    <text x="48" y="150" font-size="15" letter-spacing="3" fill="#f5a524" font-weight="700">THE LADDER</text>
    <text x="48" y="205" font-size="42" font-weight="800">Reading the</text>
    <text x="48" y="258" font-size="42" font-weight="800">Warning Signs</text>
    <text x="48" y="300" font-size="17" fill="#9aa4b5">One evolving situation. The path depends on you.</text>
  </g>

  <!-- The escalation ladder: three rungs, climbing right, heating up -->
  <g class="fnt">
    <g>
      <rect x="48" y="360" width="200" height="64" rx="12" fill="#101a26" stroke="#2c3a4d"/>
      <circle cx="80" cy="392" r="10" fill="#3e9b4f"/>
      <text x="102" y="386" font-size="14" font-weight="700" fill="#e8ecf4">LEVEL 1</text>
      <text x="102" y="406" font-size="12" fill="#9aa4b5">Early warning signs</text>
    </g>
    <path d="M252 392 h34" stroke="#3e4a5d" stroke-width="2"/>
    <path d="M286 392 l-8 -5 v10 z" fill="#3e4a5d"/>
    <g>
      <rect x="292" y="330" width="200" height="64" rx="12" fill="#161320" stroke="#4d4130"/>
      <circle cx="324" cy="362" r="10" fill="#f5a524"/>
      <text x="346" y="356" font-size="14" font-weight="700" fill="#e8ecf4">LEVEL 2</text>
      <text x="346" y="376" font-size="12" fill="#9aa4b5">A credible threat</text>
    </g>
    <path d="M496 362 h34" stroke="#3e4a5d" stroke-width="2"/>
    <path d="M530 362 l-8 -5 v10 z" fill="#3e4a5d"/>
    <g>
      <rect x="536" y="300" width="200" height="64" rx="12" fill="#1d1113" stroke="#5d3034"/>
      <circle cx="568" cy="332" r="10" fill="#e5484d"/>
      <text x="590" y="326" font-size="14" font-weight="700" fill="#e8ecf4">LEVEL 3</text>
      <text x="590" y="346" font-size="12" fill="#9aa4b5">Decision point</text>
    </g>
    <!-- the de-escalation branch off Level 1 -->
    <path d="M148 424 v36 q0 12 12 12 h96" stroke="#2c5137" stroke-width="2" fill="none" stroke-dasharray="5 5"/>
    <text x="268" y="477" font-size="12" fill="#5f8f6c" class="fnt">handled early, it settles</text>
  </g>
</svg>
