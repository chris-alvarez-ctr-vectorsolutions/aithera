<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scenario Editor</title>
  <!-- ====================================================================
       MOVED — the editor now lives at ../scenario-simulator/scenario-editor/.
       It moved so that STABLE could own the bare folder URL: /scenario-editor/
       is always the editor authors rely on, and /scenario-editor/?v=2 is the
       experimental build. This file stays as a redirect because links to it are
       already out in Slack, Jira and the docs, and because "Edit in Writer
       Studio" deep-links carry ?type= and ?example= that must keep landing on
       the right scenario. See scenario-editor/RELEASE-NOTES.md.
       ==================================================================== -->
  <script>
    // Query string and hash ride along so an existing deep-link opens the same
    // scenario and mode it always did.
    location.replace('../scenario-simulator/scenario-editor/' + location.search + location.hash);
  </script>
  <meta http-equiv="refresh" content="0; url=../scenario-simulator/scenario-editor/">
  <style>
    body { font-family: 'Open Sans', system-ui, sans-serif; margin: 4rem auto;
           max-width: 32rem; padding: 0 1.5rem; color: #33475b; line-height: 1.6; }
    a { color: #0271ce; }
  </style>
</head>
<body>
  <p>The Scenario Editor moved to <code>../scenario-simulator/scenario-editor/</code>. Redirecting…
     If nothing happens, <a href="../scenario-simulator/scenario-editor/">open the editor</a>.</p>
</body>
</html>
