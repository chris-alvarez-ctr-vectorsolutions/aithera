<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layered Learning — Coaching Overlay</title>

    <!-- Vector Web Components -->
    <script type="module"
        src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.19.0/core.iife.js"></script>
    <script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.5.0/styles.js"></script>
    <link rel="stylesheet"
        href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css" />
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <link rel="stylesheet" href="css/frame.css?v=5" />
    <link rel="stylesheet" href="css/layered-learning.css?v=1" />
</head>
<body>
    <div class="ll-stage">
        <!-- The activity fills the stage; CLARA's coaching card overlays the
             bottom-centre with a text composer (the Marshall scenario shape). -->
        <main class="ll-object">
            <p class="ll-eyebrow">Practice</p>
            <h2>Your turn</h2>
            <div class="ll-prompt">
                <div class="said">
                    <span class="who">S</span>
                    <span>Sam says: <em>"You reassigned my project without even telling me."</em></span>
                </div>
            </div>
        </main>
    </div>

    <script>
      window.LAYERED = {
        mode:  'overlay',
        index: 4, total: 4,
        prev:  'layered-floating.html',
        next:  null,                        // last page → the Continue button reads "Finish"
        course:'Difficult Conversations at Work',
        lesson:'Getting Started',
        caption: {
          title: 'Coaching overlay',
          note:  'CLARA layers a coaching card over the activity, with a text composer — the same shape the Marshall scenario uses.'
        },
        coach: {
          say: "Take a breath and lead with what you understand before you explain yourself. " +
               "Give me your opening line.",
          placeholder: 'Type your response to Sam…',
          chips: ['Acknowledge how Sam feels', 'Ask a clarifying question'],
          reply: "Nice — you acknowledged Sam's frustration before defending the decision. That lowers the " +
                 "temperature. Now name the constraint you were working under."
        }
      };
    </script>
    <script src="js/mobius-orb.js?v=5"></script>
    <script src="js/layered-learning.js?v=2"></script>
    <script src="js/frame.js?v=4"></script>
</body>
</html>
