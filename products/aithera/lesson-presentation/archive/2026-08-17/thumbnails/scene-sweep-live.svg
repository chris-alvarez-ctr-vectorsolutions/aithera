<svg xmlns="http://www.w3.org/2000/svg" width="900" height="562" viewBox="0 0 900 562" role="img" aria-label="Spot the Hazard — a perception-grading scene sweep with a hazard-coverage rail, live AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="0.55" stop-color="#0d0f0b"/>
      <stop offset="1" stop-color="#141006"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#2ecc71" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#2ecc71" stop-opacity="0"/>
    </radialGradient>
    <style>.fnt { font-family: "Open Sans", system-ui, sans-serif; }</style>
  </defs>

  <rect width="900" height="562" fill="url(#bg)"/>
  <rect width="900" height="562" fill="url(#glow)"/>

  <!-- (Top-left corner left clear for the card's own "Live AI" flag.) -->

  <!-- Kicker + title -->
  <g class="fnt" fill="#e8ecf4">
    <text x="48" y="150" font-size="15" letter-spacing="3" fill="#f5a524" font-weight="700">THE SCENE</text>
    <text x="48" y="205" font-size="42" font-weight="800">Spot the Hazard</text>
    <text x="48" y="248" font-size="17" fill="#9aa4b5">Don’t recite the training — walk in and see what’s wrong.</text>
  </g>

  <!-- A schematic bench scene inside a framed panel, with a magnifier -->
  <g>
    <rect x="48" y="286" width="470" height="230" rx="14" fill="#11151b" stroke="#2c3a4d"/>
    <!-- bench -->
    <rect x="80" y="430" width="360" height="16" rx="3" fill="#9c703d"/>
    <rect x="96" y="446" width="12" height="54" fill="#7d5a30"/>
    <rect x="412" y="446" width="12" height="54" fill="#7d5a30"/>
    <!-- jug (blank label) -->
    <rect x="128" y="384" width="40" height="46" rx="6" fill="#cfe0ee"/>
    <rect x="136" y="398" width="24" height="14" fill="#ffffff"/>
    <!-- SDS clipboard -->
    <rect x="196" y="380" width="46" height="50" rx="4" fill="#f2f0e8"/>
    <rect x="196" y="380" width="46" height="9" fill="#b7bdc3"/>
    <text x="219" y="424" font-size="8" class="fnt" fill="#7a5b2e" text-anchor="middle" font-weight="700">2009</text>
    <!-- coworker (bare-handed) -->
    <circle cx="300" cy="392" r="13" fill="#e9be96"/>
    <path d="M284 430 q16 -22 32 0 z" fill="#c85a4a"/>
    <circle cx="286" cy="424" r="5" fill="#eabf98"/>
    <!-- drum (torn label) -->
    <rect x="372" y="392" width="52" height="54" rx="6" fill="#4d7db3"/>
    <path d="M382 404 h32 l3 12 -4 14 -28 1 2 -13 z" fill="#efe9db"/>
    <path d="M398 404 l14 27" stroke="#a89f88" stroke-width="2"/>
    <!-- magnifier over the scene -->
    <circle cx="392" cy="356" r="34" fill="#2ecc71" fill-opacity="0.10" stroke="#2ecc71" stroke-width="3"/>
    <line x1="416" y1="380" x2="446" y2="410" stroke="#2ecc71" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- the hazard-coverage rail -->
  <g class="fnt">
    <text x="556" y="312" font-size="13" letter-spacing="1" fill="#9aa4b5" font-weight="700">HAZARDS SPOTTED
      <tspan fill="#e8ecf4" font-size="15"> 3/4</tspan></text>
    <!-- spotted chips -->
    <g>
      <rect x="556" y="330" width="296" height="38" rx="19" fill="#12241a" stroke="#2c7a4a"/>
      <circle cx="580" cy="349" r="8" fill="#2ecc71"/>
      <text x="596" y="354" font-size="14" fill="#e8ecf4" class="fnt">Unlabeled container</text>
    </g>
    <g>
      <rect x="556" y="376" width="296" height="38" rx="19" fill="#12241a" stroke="#2c7a4a"/>
      <circle cx="580" cy="395" r="8" fill="#2ecc71"/>
      <text x="596" y="400" font-size="14" fill="#e8ecf4" class="fnt">No PPE in use</text>
    </g>
    <g>
      <rect x="556" y="422" width="296" height="38" rx="19" fill="#12241a" stroke="#2c7a4a"/>
      <circle cx="580" cy="441" r="8" fill="#2ecc71"/>
      <text x="596" y="446" font-size="14" fill="#e8ecf4" class="fnt">Out-of-date SDS</text>
    </g>
    <g>
      <rect x="556" y="468" width="296" height="38" rx="19" fill="#171a20" stroke="#3e4a5d"/>
      <circle cx="580" cy="487" r="8" fill="none" stroke="#5f6b7d" stroke-width="2"/>
      <text x="574" y="491" font-size="10" fill="#5f6b7d" class="fnt">?</text>
      <text x="596" y="492" font-size="14" fill="#7b8494" class="fnt">Not yet spotted</text>
    </g>
  </g>
</svg>
