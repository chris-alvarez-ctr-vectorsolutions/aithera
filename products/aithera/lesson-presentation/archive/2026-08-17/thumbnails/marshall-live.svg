<svg xmlns="http://www.w3.org/2000/svg" width="900" height="562" viewBox="0 0 900 562" role="img" aria-label="Bystander Intervention: The Marshall Scenario — Live AI conversation practice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140f0a"/>
      <stop offset="0.55" stop-color="#0d0b0f"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#f5a524" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
    <style>
      .fnt { font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="900" height="562" fill="url(#bg)"/>
  <rect width="900" height="562" fill="url(#glow)"/>

  <!-- (The card overlays its own "Live AI" flag at top-left, so the thumbnail
       deliberately leaves that corner clear — no baked-in chip here.) -->

  <!-- Kicker + title -->
  <g class="fnt" fill="#e8ecf4">
    <text x="48" y="150" font-size="15" letter-spacing="3" fill="#f5a524" font-weight="700">THE SCENARIO</text>
    <text x="46" y="212" font-size="52" font-weight="800">Bystander Intervention</text>
    <text x="48" y="262" font-size="30" font-weight="600" fill="rgba(232,236,244,0.72)">The Marshall Scenario</text>
    <text x="48" y="312" font-size="18" fill="rgba(232,236,244,0.5)">Sex-based harassment · empathy · the break-room moment</text>
  </g>

  <!-- Scene card echo -->
  <g class="fnt">
    <rect x="360" y="356" width="500" height="170" rx="18" fill="rgba(255,255,255,0.03)" stroke="rgba(245,165,36,0.35)" stroke-width="1.5"/>
    <circle cx="392" cy="392" r="6" fill="#f5a524"/>
    <text x="410" y="397" font-size="13" letter-spacing="2" fill="#f5a524" font-weight="700">SCENE</text>
    <!-- Jake avatar + bubble -->
    <circle cx="400" cy="446" r="20" fill="#b07bff"/>
    <text x="400" y="452" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">J</text>
    <text x="432" y="438" font-size="15" font-weight="700" fill="#e8ecf4">Jake</text>
    <rect x="432" y="452" width="404" height="54" rx="12" fill="rgba(255,255,255,0.06)"/>
    <text x="450" y="484" font-size="16" fill="#e8ecf4">“…guess that's what you're here for —</text>
    <text x="450" y="500" font-size="16" fill="#e8ecf4">living your best Marsha life.”</text>
  </g>

  <!-- Coach glyph bottom-left -->
  <g class="fnt">
    <text x="48" y="512" font-size="15" fill="rgba(232,236,244,0.55)">AI coach · Learn → Practice · JCOM-40198</text>
  </g>
</svg>
