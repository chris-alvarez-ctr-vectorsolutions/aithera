<svg xmlns="http://www.w3.org/2000/svg" width="900" height="562" viewBox="0 0 900 562" role="img" aria-label="The Call from Home — a multi-character role-play with earned disclosure, live AI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="0.55" stop-color="#0f0c14"/>
      <stop offset="1" stop-color="#140b16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.85" r="0.95">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <style>
      .fnt { font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    </style>
  </defs>

  <rect width="900" height="562" fill="url(#bg)"/>
  <rect width="900" height="562" fill="url(#glow)"/>

  <!-- (Top-left corner left clear for the card's own "Live AI" flag.) -->

  <!-- Kicker + title -->
  <g class="fnt" fill="#e8ecf4">
    <text x="48" y="150" font-size="15" letter-spacing="3" fill="#a78bfa" font-weight="700">ONE CAST · FOUR PHASES</text>
    <text x="48" y="205" font-size="42" font-weight="800">The Call from Home</text>
    <text x="48" y="248" font-size="17" fill="#9aa4b5">Different people each phase — they tell you more as you earn it.</text>
  </g>

  <!-- Two character chips with "earned disclosure" locks unlocking -->
  <g class="fnt">
    <!-- Ms. Reyes -->
    <g>
      <rect x="48" y="316" width="366" height="150" rx="16" fill="#141026" stroke="#3a2f5d"/>
      <circle cx="92" cy="360" r="22" fill="#8b5cf6"/>
      <text x="92" y="367" font-size="20" font-weight="700" fill="#0b0f14" text-anchor="middle">R</text>
      <text x="128" y="356" font-size="18" font-weight="700" fill="#e8ecf4">Ms. Reyes</text>
      <text x="128" y="378" font-size="13" fill="#9aa4b5">the parent · phases 1 &amp; 4</text>
      <text x="72" y="418" font-size="13" fill="#c9b8f0">🔒 the past she was brushed off with</text>
      <text x="72" y="443" font-size="13" fill="#7b6ba0">— surfaces only when you doubt her</text>
    </g>
    <!-- Bianca -->
    <g>
      <rect x="438" y="316" width="366" height="150" rx="16" fill="#141026" stroke="#3a2f5d"/>
      <circle cx="482" cy="360" r="22" fill="#f5a524"/>
      <text x="482" y="367" font-size="20" font-weight="700" fill="#0b0f14" text-anchor="middle">B</text>
      <text x="518" y="356" font-size="18" font-weight="700" fill="#e8ecf4">Bianca</text>
      <text x="518" y="378" font-size="13" fill="#9aa4b5">the student who bullied · phase 3</text>
      <text x="462" y="418" font-size="13" fill="#c9b8f0">🔒 why she did it</text>
      <text x="462" y="443" font-size="13" fill="#7b6ba0">— opens up only if you keep her dignity</text>
    </g>
  </g>

  <!-- carry-forward arrow: phase 1 → phase 4 -->
  <g class="fnt">
    <path d="M132 476 C 210 512, 700 512, 762 480" stroke="#3a2f5d" stroke-width="2" fill="none" stroke-dasharray="5 5"/>
    <text x="450" y="524" font-size="12" fill="#7b6ba0" text-anchor="middle">how you treat her in phase 1 shapes how she comes back in phase 4</text>
  </g>
</svg>
