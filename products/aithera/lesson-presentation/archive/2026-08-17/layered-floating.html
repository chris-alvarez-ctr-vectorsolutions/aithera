<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layered Learning — Floating Companion</title>

    <!-- Vector Web Components -->
    <script type="module"
        src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.19.0/core.iife.js"></script>
    <script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.5.0/styles.js"></script>
    <link rel="stylesheet"
        href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css" />
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <link rel="stylesheet" href="css/frame.css?v=4" />
    <link rel="stylesheet" href="css/layered-learning.css?v=1" />
</head>
<body>
    <div class="ll-stage">
        <!-- The learning object takes centre stage; CLARA tucks into the corner. -->
        <main class="ll-object">
            <p class="ll-eyebrow">Learning object</p>
            <h2>See it play out</h2>
            <p class="ll-sub">Watch how the three moves land in a real exchange, then we'll talk about it.</p>
            <div class="ll-media" role="img" aria-label="Video placeholder">
                <span class="play"><i class="fa-solid fa-play"></i></span>
                <span class="ll-media-cap">A 90-second clip: two coworkers, and one handoff that quietly slipped.</span>
            </div>
        </main>
    </div>

    <script>
      window.LAYERED = {
        mode:  'floating',
        index: 3, total: 4,
        prev:  'layered-sidebar.html',
        next:  'layered-overlay.html',
        course:'Difficult Conversations at Work',
        lesson:'Getting Started',
        caption: {
          title: 'Floating companion',
          note:  'CLARA tucks into the corner as an on-demand companion — tap the orb to expand or hide her. The content stays front and centre.'
        },
        coach: {
          say: "I'll watch along with you. When the clip ends, I'll ask what you'd have done differently — " +
               "just think out loud. Tap me to tuck me away any time."
        }
      };
    </script>
    <script src="js/mobius-orb.js?v=5"></script>
    <script src="js/layered-learning.js?v=2"></script>
    <script src="js/frame.js?v=3"></script>
</body>
</html>
