<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="A finishing bench on a shop floor. On the bench: a half-full clear jug with a blank unwritten label, and a clipboard holding a safety data sheet dated 2009. Beside the bench stands a chemical drum whose hazard label is torn and smudged. At the bench a coworker in short sleeves wipes a part with a rag, bare-handed, no gloves or goggles.">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe4ea"/>
      <stop offset="1" stop-color="#c7ced6"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa4b0"/>
      <stop offset="1" stop-color="#7c8792"/>
    </linearGradient>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98a52"/>
      <stop offset="1" stop-color="#9c703d"/>
    </linearGradient>
    <linearGradient id="drum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3f6ea5"/>
      <stop offset="0.5" stop-color="#5b8bc4"/>
      <stop offset="1" stop-color="#3a6499"/>
    </linearGradient>
    <linearGradient id="jug" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eaf2f8" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#cfe0ee" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#b6cfe2" stop-opacity="0.95"/>
    </linearGradient>
    <style>
      .fnt { font-family: "Open Sans", system-ui, sans-serif; }
    </style>
  </defs>

  <!-- room -->
  <rect width="1200" height="500" fill="url(#wall)"/>
  <rect y="500" width="1200" height="260" fill="url(#floor)"/>
  <!-- wall seams -->
  <g stroke="#b3bcc6" stroke-width="2" opacity="0.6">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="1000" y1="0" x2="1000" y2="500"/>
  </g>
  <!-- floor line -->
  <line x1="0" y1="500" x2="1200" y2="500" stroke="#6b757f" stroke-width="3"/>

  <!-- ===================== DRUM (right) — torn / unreadable label ===================== -->
  <g>
    <ellipse cx="1000" cy="690" rx="120" ry="24" fill="#000" opacity="0.15"/>
    <rect x="892" y="360" width="216" height="330" rx="14" fill="url(#drum)" stroke="#2f527d" stroke-width="3"/>
    <ellipse cx="1000" cy="360" rx="108" ry="22" fill="#6d9bce" stroke="#2f527d" stroke-width="3"/>
    <!-- rim bands -->
    <rect x="892" y="410" width="216" height="10" fill="#2f527d" opacity="0.5"/>
    <rect x="892" y="628" width="216" height="10" fill="#2f527d" opacity="0.5"/>
    <!-- the label: present but TORN and SMUDGED — pictogram/wording unreadable -->
    <g>
      <path d="M916 452 h150 l6 20 -8 26 6 24 -10 22 8 20 -150 2 4 -22 -6 -22 8 -24 -6 -24 z"
            fill="#f4f0e6" stroke="#b9b09a" stroke-width="2"/>
      <!-- smudges / missing ink -->
      <rect x="936" y="470" width="70" height="12" rx="3" fill="#c9c1ad"/>
      <rect x="936" y="492" width="110" height="10" rx="3" fill="#d7d0be"/>
      <path d="M1000 470 q30 20 -6 60 q-40 -20 -20 -58 z" fill="#6b6552" opacity="0.35"/>
      <rect x="936" y="520" width="52" height="10" rx="3" fill="#d7d0be"/>
      <path d="M1030 462 l40 78" stroke="#a89f88" stroke-width="3" opacity="0.6"/>
      <!-- a torn-off corner -->
      <path d="M1066 452 l6 20 -8 26" fill="none" stroke="#b9b09a" stroke-width="2" stroke-dasharray="4 5"/>
    </g>
  </g>

  <!-- ===================== BENCH ===================== -->
  <g>
    <rect x="120" y="470" width="760" height="40" rx="6" fill="url(#bench)" stroke="#7d5a30" stroke-width="3"/>
    <rect x="150" y="510" width="30" height="180" fill="#7d5a30"/>
    <rect x="820" y="510" width="30" height="180" fill="#7d5a30"/>
    <rect x="120" y="500" width="760" height="8" fill="#00000022"/>
  </g>

  <!-- ===================== JUG (on bench) — UNLABELED secondary container ===================== -->
  <g>
    <ellipse cx="300" cy="474" rx="52" ry="10" fill="#000" opacity="0.12"/>
    <!-- body -->
    <path d="M262 356 q0 -14 14 -14 h48 q14 0 14 14 v104 q0 12 -12 12 h-52 q-12 0 -12 -12 z" fill="url(#jug)" stroke="#8fa8bd" stroke-width="2.5"/>
    <!-- neck + cap -->
    <rect x="288" y="330" width="24" height="20" rx="3" fill="#cfe0ee" stroke="#8fa8bd" stroke-width="2"/>
    <rect x="284" y="322" width="32" height="12" rx="3" fill="#7e8a94"/>
    <!-- liquid, half full -->
    <path d="M264 408 h72 v50 q0 12 -12 12 h-48 q-12 0 -12 -12 z" fill="#8ec5e6" opacity="0.6"/>
    <!-- the BLANK label — a label area with nothing written on it -->
    <rect x="272" y="372" width="56" height="34" rx="4" fill="#ffffff" stroke="#c2ccd4" stroke-width="2"/>
    <!-- (intentionally empty: no name, no hazard, nothing) -->
  </g>

  <!-- ===================== SDS on a clipboard (on bench) — OUT OF DATE ===================== -->
  <g transform="rotate(-6 470 430)">
    <rect x="410" y="352" width="120" height="150" rx="6" fill="#f7f7f4" stroke="#9aa0a6" stroke-width="2.5"/>
    <rect x="410" y="352" width="120" height="20" fill="#b7bdc3"/>
    <rect x="452" y="346" width="36" height="12" rx="3" fill="#7e8a94"/>
    <text x="470" y="366" class="fnt" font-size="9" font-weight="700" fill="#2b2f33" text-anchor="middle">SAFETY DATA SHEET</text>
    <!-- content lines -->
    <g stroke="#c4cace" stroke-width="4" stroke-linecap="round">
      <line x1="424" y1="392" x2="516" y2="392"/>
      <line x1="424" y1="406" x2="516" y2="406"/>
      <line x1="424" y1="420" x2="496" y2="420"/>
      <line x1="424" y1="446" x2="516" y2="446"/>
      <line x1="424" y1="460" x2="500" y2="460"/>
    </g>
    <!-- the date, clearly old -->
    <text x="424" y="486" class="fnt" font-size="12" font-weight="700" fill="#7a5b2e">Rev. 2009</text>
  </g>

  <!-- ===================== COWORKER (at bench) — NO PPE (bare hands, no goggles) ===================== -->
  <g>
    <ellipse cx="690" cy="694" rx="70" ry="18" fill="#000" opacity="0.15"/>
    <!-- legs -->
    <rect x="662" y="560" width="24" height="130" rx="8" fill="#39424e"/>
    <rect x="694" y="560" width="24" height="130" rx="8" fill="#39424e"/>
    <!-- torso: short sleeves, no apron -->
    <path d="M642 430 q48 -22 96 0 l10 130 q-58 22 -116 0 z" fill="#c85a4a"/>
    <!-- short sleeves -->
    <path d="M642 432 l-30 60 30 14 20 -52 z" fill="#b84e3f"/>
    <path d="M738 432 l30 60 -30 14 -20 -52 z" fill="#b84e3f"/>
    <!-- BARE forearms + hands (skin, no gloves) -->
    <rect x="600" y="486" width="26" height="70" rx="12" fill="#e6b58c"/>
    <rect x="754" y="486" width="26" height="70" rx="12" fill="#e6b58c"/>
    <circle cx="613" cy="566" r="16" fill="#eabf98"/>   <!-- bare hand holding rag -->
    <circle cx="767" cy="566" r="16" fill="#eabf98"/>   <!-- bare hand -->
    <!-- the rag / part being wiped, over the bench -->
    <rect x="560" y="556" width="70" height="26" rx="6" fill="#e8e2d4" transform="rotate(-8 595 569)"/>
    <!-- head: no goggles, no eye protection -->
    <circle cx="690" cy="404" r="30" fill="#e9be96"/>
    <path d="M660 398 q30 -40 60 0 q-6 -26 -30 -26 q-24 0 -30 26 z" fill="#4a3b2e"/>
    <!-- eyes (plainly no goggles) -->
    <circle cx="680" cy="404" r="3" fill="#3a2f26"/>
    <circle cx="700" cy="404" r="3" fill="#3a2f26"/>
  </g>

  <!-- subtle vignette so it reads on a dark stage -->
  <rect width="1200" height="760" fill="none" stroke="#00000018" stroke-width="24"/>
</svg>
