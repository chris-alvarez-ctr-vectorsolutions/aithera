      app.classList.toggle('coach-up', coachUp);
      app.classList.toggle('trap', trap);

      modeIndicator.classList.toggle('is-hidden', !state.started);

      const busy = state.sending || state.delivering || state.closingStepperActive || state.resultsModalOpen || state.videoLive;
      const coachDisabled = mode !== 'coaching' && busy;
      const sceneDisabled = mode !== 'scene' && busy;
      const reactTip   = (mode !== 'coaching' && !coachDisabled) ? 'Talk with your AI coach' : '';
      const observeTip = (mode !== 'scene' && !sceneDisabled)
        ? (state.awaitingObserve ? 'Watch what happens next' : 'Review the scene') : '';
      modeIndicator.innerHTML =
        `<div class="mode-toggle" role="group" aria-label="Observe or react mode">
           <button class="seg ${mode === 'coaching' ? 'active' : ''}" data-seg="coaching"
                   ${reactTip ? `data-tip="${reactTip}"` : ''}
                   aria-pressed="${mode === 'coaching'}" ${coachDisabled ? 'disabled' : ''}>
             <i class="fa-solid fa-comments"></i> React
           </button>
           <button class="seg ${mode === 'scene' ? 'active' : ''}" data-seg="scene"
                   ${observeTip ? `data-tip="${observeTip}"` : ''}
                   aria-pressed="${mode === 'scene'}" ${sceneDisabled ? 'disabled' : ''}>
             <i class="fa-solid fa-video"></i> Observe
           </button>
         </div>`;

      stage.classList.toggle('is-frozen', coachUp);
      stage.toggleAttribute('inert', coachUp);
      stage.setAttribute('aria-hidden', coachUp ? 'true' : 'false');

      const videoAlreadyMounted = state.videoPlaying && stageInner.querySelector('.scene-video');
      if (!videoAlreadyMounted) {
        stageInner.innerHTML = '';
        if (state.videoPlaying) {
          stageInner.appendChild(videoNode());
          wireVideoControls();
        } else {
          const est = el('div', 'establishing');
          // Authored content when published (scenario.establishing); the
          // shipped demo keeps its inline copy when nothing is published.
          const EST = PUBLISHED ? PUBLISHED.establishing : {
            eyebrow: 'Scene size-up',
            title: 'I-65 Tanker Rollover',
            sub: 'A tanker went over on the interstate — and the scene you\'re about to watch was not run by the book. Watch how it really unfolded, then tell your AI coach what you saw: what was right, what wasn\'t, and what you\'d do differently.',
          };
          est.innerHTML =
            `<div class="est-eyebrow">${esc(EST.eyebrow || 'Scene size-up')}</div>
             <h2 class="est-title">${esc(EST.title || SCENARIO.title)}</h2>
             ${EST.sub ? `<p class="est-sub">${esc(EST.sub)}</p>` : ''}`;
          stageInner.appendChild(est);
        }
      }
      if (state.videoPlaying) {
        const replayBtn = document.getElementById('observeReplayBtn');
        if (replayBtn) {
          replayBtn.hidden = state.videoLive;
          replayBtn.innerHTML = state.awaitingObserve
            ? '<i class="fa-solid fa-video"></i> Watch what happens next'
            : '<i class="fa-solid fa-arrows-rotate"></i> Replay scene';
        }
      }

      coachPanel.toggleAttribute('inert', !coachUp);
      coachPanel.setAttribute('aria-hidden', coachUp ? 'false' : 'true');
      if (coachUp) {
        coachPanelBody.innerHTML = '';
        {
          // The recap stays visible here; the loading beats run in the CTA
          // slot below (see showClosing), not stacked over the conversation.
          // Lift the live question + group the coach run (name on first, avatar on last).
          const _last = messages[messages.length - 1];
          const _askMsg = (_last && _last.speaker === 'coach' && /\?/.test(String(_last.text || '')) && !complete) ? _last : null;
          messages.forEach((m, i) => {
            const node = m.speaker === 'you' ? youCoachNode(m) : coachNode(m);
            if (m.speaker === 'coach') {
              const prev = messages[i - 1], next = messages[i + 1];
              if (!prev || prev.speaker !== 'coach') node.classList.add('grp-first');
              if (!next || next.speaker !== 'coach') node.classList.add('grp-last');
              if (m === _askMsg) { node.classList.add('is-prompt'); if (m._enter) node.classList.add('just-asked'); }
            }
            coachPanelBody.appendChild(node);
          });
          if (complete && !state.delivering && state.resultsViewed) coachPanelBody.appendChild(checklistNode());
          composer.placeholder = coachPanelBody.querySelector('.coach-msg.is-prompt') ? 'Type your answer…' : 'Type your response…';
        }
      }
      resumeBtn.hidden = !coachUp;

      // The bar disappears only while a clip is actually PLAYING in Observe
      // (full-screen watch or contained replay). Reviewing the still frame
      // keeps it, holding the "Back to AI Coach" return — otherwise the top
      // toggle is the only way back to the conversation (a dead end).
      inputbar.hidden = state.started && mode === 'scene' && state.videoLive;

      const showStart    = !state.started && !state.videoLive;
      const showWatching = state.videoLive && !state.started;
      // Reviewing the scene: the footer carries the way back to the coach.
      const showReturn   = state.started && mode === 'scene' && !state.videoLive;
      // Chapter break: the coach has closed a chapter — the composer steps
      // aside for the "Watch what happens next" CTA until the segment plays.
      const showObserveNext = state.awaitingObserve && !state.videoLive && !state.delivering && !showReturn;
      const showRecap    = complete && !state.delivering && !state.closingStepperActive && !state.awaitingResults && !state.resultsViewed && !showReturn;
      const showResultsCta = state.awaitingResults && !state.resultsModalOpen && !showReturn;
      // The closing "Analyzing… Determining…" beats cycle in the CTA slot
      // (where "View full results" lands), replacing the composer meanwhile.
      const showClosing  = state.closingStepperActive;
      const showContinue = complete && state.resultsViewed && !state.delivering && !state.continued && !showReturn;
      const showDone      = state.continued && !showReturn;
      inputStart.hidden    = !showStart;
      inputWatching.hidden = !showWatching;
      inputReturn.hidden   = !showReturn;
      inputObserve.hidden  = !showObserveNext;
      inputRecap.hidden    = !showRecap;
      inputAnalyzing.hidden = !showClosing;
      inputResults.hidden  = !showResultsCta;
      inputContinue.hidden = !showContinue;
      inputDone.hidden      = !showDone;
      if (showClosing) inputAnalyzing.lastChild.textContent = DEBRIEF.closingLabel();
      inputMain.hidden = showStart || showWatching || showReturn || showObserveNext || showRecap || showClosing || showResultsCta || showContinue || showDone;

      composer.disabled = complete || state.sending || state.delivering || state.awaitingObserve || !state.started;
      sendBtn.disabled = composer.disabled || !composer.value.trim();
      inputHint.textContent = complete
        ? 'Size-up complete — press Restart to run it again.'
        : 'Enter to send · Shift+Enter for a new line';

      /* Results modal — painted by the shared debrief (one renderer for
         every simulator page, so pages/dots/nav labels never drift). */
      DEBRIEF.render();

      coachPanel.style.bottom = inputbar.hidden ? '0px' : inputbar.offsetHeight + 'px';

      messages.forEach((m) => { if (m._enter) m._enter = false; });

      manageFocus(trap);
      requestAnimationFrame(() => {
        if (followStage) { stage.scrollTop = stage.scrollHeight; followStage = false; }
        else { stage.scrollTop = prevStageScroll; }
      });
      // Coach thread: the shared coach-sheet module eases the sheet up as it
      // grows, or glides the body's scroll to the new bottom once it's maxed out
      // (instant fallback when motion is reduced or the tab is backgrounded).
      if (coachUp) coachSheet.follow({ nearBottom: true, delivering: state.delivering });
      else coachSheet.reset();
    }
    let followStage = false;

    /* Coach-sheet rise + follow-scroll motion — shared in js/sim-coach-sheet.js.
       coachSheet.follow({nearBottom,delivering}) from render(); .pin() for the
       typing dots; .reset() when the sheet lowers. */
    const coachSheet = SimCoachSheet.create({ app, panel: coachPanel, body: coachPanelBody });

    /* ---- typing indicator (always in the coach sheet — Observe never types) */
    function showTyping() {
      hideTyping();
      const node = el('div', 'typing', '<span></span><span></span><span></span>');
      node.id = 'typingNode';
      coachPanelBody.appendChild(node);
      coachSheet.pin();
    }
    function hideTyping() {
      const t = document.getElementById('typingNode');
      if (t) t.remove();
    }

    /* =====================================================================
       FOCUS MANAGEMENT  — trap focus in the coaching layer while it's up
       ===================================================================== */
    let lastSceneFocus = null;
    function focusables() {
      const sel = 'button, [href], textarea, input, select, [tabindex]:not([tabindex="-1"])';
      return [
        ...modeIndicator.querySelectorAll(sel),
        ...coachPanel.querySelectorAll(sel),
        ...document.querySelectorAll('.inputbar ' + sel),
      ].filter((n) => !n.disabled && n.offsetParent !== null);
    }
    function manageFocus(trap) {
      if (trap && !app.classList.contains('was-trap')) {
        app.classList.add('was-trap');
        lastSceneFocus = document.activeElement;
        setTimeout(() => { (composer.disabled ? resumeBtn : composer).focus(); }, 30);
      } else if (!trap && app.classList.contains('was-trap')) {
        app.classList.remove('was-trap');
        setTimeout(() => { if (!composer.disabled) composer.focus(); }, 30);
      }
    }
    document.addEventListener('keydown', (e) => {
      // The results dialog takes precedence: Escape closes IT, never the
      // mode switch underneath, while it's up.
      if (state.resultsModalOpen) {
        // Aligned with every simulator page: Escape closes via the shared
        // debrief (coach introduces the checklist), one linear way through.
        if (e.key === 'Escape') { e.preventDefault(); DEBRIEF.closeResults(); }
        return;
      }
      const trap = app.classList.contains('trap');
      if (!trap) return;
      if (e.key === 'Escape') { e.preventDefault(); state.mode = 'scene'; render(); return; }
      if (e.key === 'Tab') {
        const f = focusables();
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });

    function announce(msg) { liveRegion.textContent = ''; setTimeout(() => { liveRegion.textContent = msg; }, 30); }

    /* =====================================================================
       OBSERVE VIDEO — the locked, no-skip cold open on first watch; a
       replayable clip thereafter. Captions are chunked sentence-sized so
       they read like real captions.
       ===================================================================== */
    let introSeq = 0;

    function splitCaptionChunks(text) {
      const sentences = text.match(/[^.!?]+[.!?]*/g) || [text];
      const chunks = [];
      sentences.forEach((s) => {
        s = s.trim();
        if (!s) return;
        if (s.length <= 100) { chunks.push(s); return; }
        const mid = s.indexOf(',');
        if (mid > 10 && mid < s.length - 10) {
          chunks.push(s.slice(0, mid + 1).trim());
          chunks.push(s.slice(mid + 1).trim());
        } else {
          chunks.push(s);
        }
      });
      return chunks;
    }
    const captionMs = (chunk) => Math.max(1700, Math.min(5200, chunk.split(/\s+/).length * 330));

    async function showCaption(captionEl, text, mySeq) {
      captionEl.classList.remove('is-visible');
      await wait(reducedMotion() ? 0 : 160);
      if (mySeq !== introSeq) return;
      captionEl.textContent = text;
      captionEl.classList.add('is-visible');
    }
    async function runCaptions(captionEl, chunks, mySeq) {
      for (const chunk of chunks) {
        if (mySeq !== introSeq) return;
        await showCaption(captionEl, chunk, mySeq);
        if (mySeq !== introSeq) return;
        await wait(reducedMotion() ? 1400 : captionMs(chunk));
      }
    }

    // Resolves on real playback end immediately. On a load error (e.g. the
    // placeholder src hasn't been replaced with real footage yet), waits out
    // the caption's own reading time instead of cutting straight to black —
    // so the demo still plays at a sensible pace with no footage in place.
    function waitForVideoEnd(videoEl, mySeq, fallbackMs) {
      return new Promise((resolve) => {
        // Already-failed asset (its error event fired back at mount time, so
        // no listener would ever hear it) → pace by the captions instead.
        if (videoEl.error) { setTimeout(resolve, fallbackMs); return; }
        const onEnd = () => { cleanup(); resolve(); };
        const onError = () => { cleanup(); setTimeout(resolve, fallbackMs); };
        function cleanup() { videoEl.removeEventListener('ended', onEnd); videoEl.removeEventListener('error', onError); }
        videoEl.addEventListener('ended', onEnd, { once: true });
        videoEl.addEventListener('error', onError, { once: true });
        setTimeout(() => { if (mySeq === introSeq) resolve(); }, Math.max(12000, fallbackMs + 3000));
      });
    }
    function waitForTap(btn) {
      return new Promise((resolve) => {
        btn.hidden = false;
        btn.addEventListener('click', () => { btn.hidden = true; resolve(); }, { once: true });
      });
    }
    function preloadVideos(videos) {
      return Promise.all(videos.map((v) => new Promise((resolve) => {
        // Ready enough OR already failed (its error event fired at mount
        // time, before we were listening) — either way, nothing to wait on.
        if (v.readyState >= 3 || v.error || v.networkState === 3) return resolve();
        let t;
        const done = () => { clearTimeout(t); v.removeEventListener('canplaythrough', done); v.removeEventListener('error', done); resolve(); };
        v.addEventListener('canplaythrough', done, { once: true });
        v.addEventListener('error', done, { once: true });
        t = setTimeout(done, 9000);
      })));
    }

    // Plays the next UNSEEN segment full-screen. Used for the very first
    // watch AND every "Watch what happens next" chapter break.
    function watchNextSegment() {
      if (state.videoLive || state.sending || state.delivering) return;
      if (state.watched >= OBSERVE_SCENES.length) return;   // nothing left unseen
      const mySeq = ++introSeq;
      state.videoPlaying = true;
      state.videoLive = true;
      state.videoFirstRun = true;      // unseen footage → full-viewport takeover
      state.awaitingObserve = false;
      state.mode = 'scene';
      announce('Watching the scene.');
      render();
      runSegment(mySeq, state.watched);
    }
    // "Replay scene" — re-runs the LAST segment watched, contained in the
    // stage (never full-screen, never re-triggering the coach flow).
    function replayVideo() {
      if (state.videoLive || state.sending || state.delivering) return;
      if (state.watched === 0) return;
      const mySeq = ++introSeq;
      state.videoLive = true;
      state.videoFirstRun = false;
      render();
      runSegment(mySeq, state.watched - 1);
    }
    async function finishSegment(segIdx) {
      await wait(reducedMotion() ? 0 : 250);
      state.videoLive = false;
      const wasNew = state.videoFirstRun;
      state.videoFirstRun = false;
      if (!wasNew) { render(); return; }         // a replay just settles back to the still frame
      state.watched = segIdx + 1;
      // segment 1 chains into the coach — via the Section-1 coupler
      if (!state.started) { CONTEXT.done({ modality: 'video' }); return; }
      // Segments 2 and 3: the coach sheet rises again and reacts to the new footage.
      state.mode = 'coaching';
      announce('Back with your AI coach.');
      render();
      await deliverSegmentOpener(segIdx);
    }

    // Plays ONE segment's clip (with its captions), then hands off to
    // finishSegment. All clips stay mounted and buffering from first mount.
    async function runSegment(mySeq, segIdx) {
      const sceneVideo = document.querySelector('.scene-video');
      if (!sceneVideo) return;
      const videos = [...sceneVideo.querySelectorAll('.intro-video')];
      const v = videos[segIdx];
      if (!v) return;
      const introCaption  = document.getElementById('introCaption');
      const introBeginBtn = document.getElementById('introBeginBtn');
      const introLoading  = document.getElementById('introLoading');

      // Show THIS segment's frame (and drop the previous segment's caption)
      // immediately — the preload gate below must never hold a stale frame
      // from the last chapter on screen.
      introCaption.classList.remove('is-visible');
      videos.forEach((other, j) => other.classList.toggle('is-active', j === segIdx));

      await preloadVideos([v]);
      if (mySeq !== introSeq) return;
      introLoading.classList.add('is-out');
      await wait(reducedMotion() ? 0 : 260);
      if (mySeq !== introSeq) return;

      const scene = OBSERVE_SCENES[segIdx];
      const chunks = splitCaptionChunks(scene.text);
      const fallbackMs = chunks.reduce((sum, c) => sum + (reducedMotion() ? 1400 : captionMs(c)), 0);
      try { v.currentTime = 0; } catch (e) { /* nothing to rewind on a failed asset */ }
      try {
        await v.play();
      } catch (err) {
        if (err && err.name === 'NotAllowedError') {
          await waitForTap(introBeginBtn);
          if (mySeq !== introSeq) return;
          try { await v.play(); } catch (e2) { /* asset itself is the problem — the fallback timing below still carries it */ }
        }
      }
      if (mySeq !== introSeq) return;
      runCaptions(introCaption, chunks, mySeq);
      await waitForVideoEnd(v, mySeq, fallbackMs);
      if (mySeq !== introSeq) return;
      finishSegment(segIdx);
    }

    // Reveal the coach's reaction to segments 2/3 message-by-message, then
    // hand the composer back for the next React chapter.
    async function deliverSegmentOpener(segIdx) {
      const myseq = ++deliverSeq;
      const dead = () => myseq !== deliverSeq;
      const opener = SEGMENT_OPENERS[segIdx] || [];
      state.delivering = true;
      render();
      for (const m of opener) {
        hideTyping();
        showTyping(); await wait(reducedMotion() ? 250 : 900); hideTyping();
        if (dead()) return;
        state.messages.push({ ...m, _enter: true });
        render();
        await wait(reducedMotion() ? 80 : 300);
        if (dead()) return;
      }
      state.delivering = false;
      render();
      if (!composer.disabled) composer.focus();
    }

    /* =====================================================================
       ACTIONS
       ===================================================================== */
    async function send() {
      const text = composer.value.trim();
      if (!text || state.sending || state.complete) return;

      state.messages.push({ speaker: 'you', kind: 'coaching', text, _enter: true });
      composer.value = '';
      autoGrow();

      state.sending = true;
      render();
      await wait(reducedMotion() ? 80 : 700);   // a beat before the reply begins — a real response doesn't start the instant you hit send
      showTyping();

      let turn;
      try { turn = await getTurn(state.messages); }
      catch (err) {
        turn = { turn: [{ speaker: 'coach', kind: 'coaching', text:
          'Something hiccuped reaching the AI coach. Take a breath and try that again.' }] };
      }

      await deliverTurn(turn);

      state.sending = false;
      render();
      if (!composer.disabled && !inputMain.hidden) composer.focus();
    }

    // Shared pacing (js/sim-core.js) — one rhythm across every simulator page.
    const { wait, reducedMotion, thinkingTime } = SimCore;

    let deliverSeq = 0;

    async function deliverTurn(turn) {
      const myseq = ++deliverSeq;
      const dead = () => myseq !== deliverSeq;
      state.delivering = true;
      render();
      for (const m of turn.turn) {
        hideTyping();
        showTyping(); await wait(reducedMotion() ? 250 : 780); hideTyping();
        if (dead()) return;
        m._enter = true;
        state.messages.push(m);
        render();
        await wait(reducedMotion() ? 80 : 300);
        if (dead()) return;
      }
      // Chapter break: the coach closed this chapter — the composer steps
      // aside for "Watch what happens next" (the learner flips on their own
      // command; the video never auto-plays over the coach's send-off).
      if (turn.observeNext && state.watched < OBSERVE_SCENES.length) {
        state.awaitingObserve = true;
        announce('The scene has more to show. Watch what happens next when you’re ready.');
      }
      // LIVE completion: the model flags the final synthesis turn (the
      // scripted demo engine sets state.complete itself). Surfaces the
      // "See your results" CTA — the shared Section-3 debrief takes it from there.
      if (turn.complete) state.complete = true;
      state.delivering = false;
      render();
    }

    // "See your results" — the SHARED Section-3 debrief takes over: the
    // "Analyzing…" stepper, the paged results modal, the checklist hand-back
    // and the exit are one implementation across every simulator page.
    function revealResults() {
      if (!state.complete || state.delivering || state.closingStepperActive) return;
      DEBRIEF.openClosing([]);
    }

    function restart() {
      deliverSeq++;
      hideTyping();
      introSeq++;
      CONTEXT.reset();   // re-arm the Section-1 coupler for a fresh run
      Object.assign(state, {
        mode: 'coaching', started: false, messages: [], pendingOpening: initialMessages(),
        sending: false, delivering: false, complete: false, step: 0, stepNudges: 0,
        watched: 0, awaitingObserve: false,
        videoPlaying: false, videoLive: false, videoFirstRun: false, closingStepperActive: false,
        awaitingResults: false, resultsModalOpen: false, resultsPage: 0, resultsViewed: false, continued: false,
      });
      app.classList.remove('was-trap');
      followStage = true;
      announce('Practice restarted.');
      render();
    }

    // "Bring in the AI Coach" — the video IS the transition; the opening prep
    // types in one line at a time, as if the coach is talking.
    async function startSession(context) {
      if (state.started || state.sending || state.delivering) return;
      // Section 1 → Section 2, standardized: the cold-open segment arrives
      // here as ONE normalized ContextRecord (js/sim-context.js) — the same
      // coupler every simulator page flows through.
      SimContext.apply(context, {
        appendSystem: (t) => { SYSTEM_PROMPT += '\n\n' + t; },
        seed: (msgs) => { state.pendingOpening = [...msgs, ...(state.pendingOpening || [])]; },
      });
      state.started = true;
      state.mode = 'coaching';
      announce('Bringing in your AI coach.');
      render();
      await deliverOpening();
    }
    async function deliverOpening() {
      const myseq = ++deliverSeq;
      const dead = () => myseq !== deliverSeq;
      const opening = state.pendingOpening || [];
      state.pendingOpening = null;
      state.delivering = true;
      render();
      for (let i = 0; i < opening.length; i++) {
        const m = opening[i];
        const prev = i > 0 ? opening[i - 1] : null;
        hideTyping();
        showTyping(); await wait(thinkingTime(prev ? prev.text : '')); hideTyping();
        if (dead()) return;
        m._enter = true;
        state.messages.push(m);
        render();
        if (i < opening.length - 1) await wait(reducedMotion() ? 80 : 700);
        if (dead()) return;
      }
      state.delivering = false;
      render();
      if (!composer.disabled) composer.focus();
    }

    /* =====================================================================
       WIRING
       ===================================================================== */
    function autoGrow() {
      composer.style.height = 'auto';
      composer.style.height = Math.min(composer.scrollHeight, 120) + 'px';
    }
    composer.addEventListener('input', () => { autoGrow(); sendBtn.disabled = state.sending || state.complete || !composer.value.trim(); });
    composer.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    sendBtn.addEventListener('click', send);
    // Lowers the sheet to Observe — the panel header's own escape hatch.
    resumeBtn.addEventListener('click', () => { state.mode = 'scene'; render(); });
    scrim.addEventListener('click', () => { state.mode = 'scene'; render(); });

    recapCtaBtn.addEventListener('click', revealResults);
    // Results modal: opened, paged and closed by the shared debrief
    // (modal-footer nav is delegated INSIDE makeFlow).
    resultsCtaBtn.addEventListener('click', DEBRIEF.openResults);
    continueCtaBtn.addEventListener('click', DEBRIEF.finish);

    // "Full conversation" — the SHARED coach-sheet expander
    // (js/sim-chat-history.js): a pill in the panel head grows the sheet to
    // nearly full screen height and overlays the complete transcript —
    // earlier coaching exchanges AND the scene context — in one consistent
    // treatment; "Latest only" (or Escape, or the sheet lowering) collapses
    // it back to the focused view every page opens with.
    SimChatHistory.attach({
      panel: coachPanel,
      body: coachPanelBody,
      messages: () => state.messages,
      announce,
    });

    // Start bar: the Section-1 coupler — hazmat's context is its FIRST video
    // segment, played by this page's own segment player; finishing it hands
    // Section 2 a normalized ContextRecord via startSession(record).
    const CONTEXT = SimContext.create({
      modalities: {
        video: { available: true, enter: watchNextSegment },
      },
      onDone: startSession,
    });
    startCtaBtn.addEventListener('click', CONTEXT.begin);
    // Chapter break: flip back to Observe and play the next segment.
    observeNextBtn.addEventListener('click', watchNextSegment);
    // Reviewing the scene: back to the conversation on the learner's command
    // (mirrors the React toggle segment, but lives where every other "way
    // forward" does — the input bar).
    returnCoachBtn.addEventListener('click', () => {
      if (state.videoLive) return;
      state.mode = 'coaching';
      announce('Back with your AI coach.');
      render();
      setTimeout(() => { if (!composer.disabled) composer.focus(); }, 260);
    });

    // The mode toggle: tap the inactive segment to switch (delegated, since
    // the toggle is rebuilt on every render). Disabled segments don't fire.
    // During a chapter break, tapping Observe ADVANCES the scene — same as
    // the input bar's CTA — rather than just reviewing the last frame.
    modeIndicator.addEventListener('click', (e) => {
      const seg = e.target.closest('.seg');
      if (!seg || seg.disabled) return;
      const which = seg.dataset.seg;
      if (which === state.mode) return;
      if (which === 'scene' && state.awaitingObserve) { watchNextSegment(); return; }
      state.mode = which;
      announce(which === 'scene' ? 'Reviewing the scene.' : 'Back with your AI coach.');
      render();
      if (which === 'coaching') setTimeout(() => { if (!composer.disabled) composer.focus(); }, 260);
    });
    document.getElementById('restartBtn').addEventListener('click', restart);

    // Opening beat: anchor on the establishing card with a "Watch the scene"
    // prompt. The video and the coach sheet both stay down until the
    // learner chooses to begin.
    render();
    </script>
    <!-- ===== Course-delivery frame ===================================== -->
    <script>
      // Embed into the app shell; course/lesson auto-derive from #scenarioName.
      window.LESSON_FRAME = { mount: '#app' };
    </script>
    <script src="js/frame.js?v=3"></script>
    <script>
      // Relocate the app's Restart control onto the frame's actions slot; moving
      // the node preserves its click handler (attached above by element id).
      (function () {
        function relocate() {
          var slot = document.querySelector('.vt-frame .vt-actions');
          var btn  = document.getElementById('restartBtn');
          if (slot && btn) slot.appendChild(btn);
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', relocate);
        else relocate();
      })();
    </script>
</body>
</html>
