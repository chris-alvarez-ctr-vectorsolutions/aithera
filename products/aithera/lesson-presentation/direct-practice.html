      { icon: 'fa-share-nodes', title: 'You named real help, not just feelings', body: `Once the coach asked who you could connect her to, you named someone trained — not just "I'm here for you."` },
      { icon: 'fa-handshake', title: 'You made it concrete and shared', body: `Offering to go WITH her, not just telling her to get help, is what actually got her to say yes.` },
    ];
    const CLOSING_GROWTH = [
      { icon: 'fa-clock', title: 'Naming help took a nudge', body: `The coach had to ask "who could you connect her to?" before you named someone — getting there a beat sooner keeps the momentum she gave you.` },
      { icon: 'fa-shield-heart', title: 'Watch for the "case file" fear', body: `When Kendra said she didn't want to be "somebody's case file," that's a fear of being handed off — naming that you're not stepping back, just adding support, defuses it fastest.` },
    ];

    function closingStepperNode() {
      const wrap = el('div', 'closing-stepper');
      wrap.innerHTML = CLOSING_STEPS
        .map((label) => `<div class="closing-step"><span class="mark"><i class="fa-solid fa-check"></i></span>${esc(label)}</div>`)
        .join('');
      return wrap;
    }

    function reportListNode(cls, icon, heading, items) {
      const wrap = el('div', `report-section ${cls}`);
      wrap.innerHTML = `
        <h3><i class="fa-solid ${icon}"></i> ${esc(heading)}</h3>
        <ul class="res-list">
          ${items.map((it) => `<li><i class="fa-solid ${it.icon}"></i><div><b>${esc(it.title)}</b><span>${esc(it.body)}</span></div></li>`).join('')}
        </ul>`;
      return wrap;
    }
    const strengthsNode = () => reportListNode('strengths', 'fa-star', 'Strengths', CLOSING_STRENGTHS);
    const growthAreasNode = () => reportListNode('growth', 'fa-seedling', 'Growth areas', CLOSING_GROWTH);

    /* =====================================================================
       RENDER  — paint everything from state
       ===================================================================== */
    let typingHost = null;     // where the typing indicator currently lives

    function render() {
      const { mode, inputTarget, hasEnteredScene, messages, complete } = state;
      // remember where the practice is scrolled so toggling Learn/Practice never
      // jumps it — we only follow to the bottom when new scene content arrives.
      const prevStageScroll = stage.scrollTop;
      // the AI Coach sheet is up whenever we're learning — but ONLY after the learner
      // has chosen to begin (we anchor on the scene first; the sheet never auto-opens)
      const coachUp = mode === 'coaching' && state.started;
      const trap = coachUp && hasEnteredScene; // trap focus only when the coach pauses a live scene

      app.dataset.mode = mode;
      app.dataset.target = inputTarget;
      app.dataset.entered = String(hasEnteredScene);
      app.classList.toggle('coach-up', coachUp);
      app.classList.toggle('trap', trap);

      // Withheld through the establishing card — there's no real Learn/Practice
      // choice yet. Revealed once the coach actually begins.
      modeIndicator.classList.toggle('is-hidden', !state.started);

      /* —— Mode indicator: Learn | Practice toggle (raises/lowers the sheet) —— */
      const busy = state.transitioning || state.sending || state.delivering;
      // "Learn" is tappable from the scene to open a queued debrief (even at the end) or a manual timeout
      const coachDisabled = mode !== 'coaching' && (busy || (complete && !state.awaitingDebrief));
      // "Practice" lights up once the coach has invited entry, even before stepping in
      const sceneDisabled = mode !== 'scene' && (busy || complete || (!hasEnteredScene && !state.awaitingEntry));
      // hover tooltips clarify what tapping the inactive segment does (only meaningful
      // when it's enabled and not already the active mode)
      const learnTip = (mode !== 'coaching' && !coachDisabled)
        ? (state.awaitingDebrief ? (complete ? 'See your results' : 'See AI Coach feedback') : 'Talk with your AI coach') : '';
      const sceneTip = (mode !== 'scene' && !sceneDisabled)
        ? (hasEnteredScene ? 'Return to practice' : 'Begin practicing') : '';
      modeIndicator.innerHTML =
        `<div class="mode-toggle" role="group" aria-label="Learn or practice mode">
           <button class="seg ${mode === 'coaching' ? 'active' : ''}" data-seg="coaching"
                   ${learnTip ? `data-tip="${learnTip}"` : ''}
                   aria-pressed="${mode === 'coaching'}" ${coachDisabled ? 'disabled' : ''}>
             <i class="fa-solid fa-chalkboard-user"></i> Learn
           </button>
           <button class="seg ${mode === 'scene' ? 'active' : ''}" data-seg="scene"
                   ${sceneTip ? `data-tip="${sceneTip}"` : ''}
                   aria-pressed="${mode === 'scene'}" ${sceneDisabled ? 'disabled' : ''}>
             <i class="fa-solid fa-door-open"></i> Practice
           </button>
         </div>`;

      /* —— Practice base (ALWAYS the base layer) ——
         Pre-entry → an establishing card; entered → the live scene. Dimmed,
         lightly blurred + inert whenever the coach sheet is up over it. */
      stage.classList.toggle('is-frozen', coachUp);
      stage.toggleAttribute('inert', coachUp);
      stage.setAttribute('aria-hidden', coachUp ? 'true' : 'false');
      stageInner.innerHTML = '';
      if (hasEnteredScene) {
        // Retry controls render whenever the scene is live (not complete / mid-reveal),
        // REGARDLESS of mode — the stage is inert while the coach sheet is up, so they
        // aren't clickable there, but keeping them in the DOM means toggling Learn/Practice
        // never reflows the scene card (no jump/jitter).
        stageInner.appendChild(sceneCardAll(messages, !complete && !state.delivering && !state.sending));
        // resources live in the coach sheet (the practice never shows them)
      } else {
        const est = el('div', 'establishing');
        est.innerHTML =
          `<div class="est-eyebrow">The scene</div>
           <h2 class="est-title">Kendra’s room</h2>
           <p class="est-sub">Kendra’s been drinking alone since she lost her Nona. You’re about to check on her.</p>
           <div class="est-with">with <b>${esc(SCENARIO.character)}</b></div>`;
        stageInner.appendChild(est);
      }

      /* —— AI Coach sheet — up whenever we're in Learn mode (prep AND debriefs) —— */
      coachPanel.toggleAttribute('inert', !coachUp);
      coachPanel.setAttribute('aria-hidden', coachUp ? 'false' : 'true');
      if (coachUp) {
        coachPanelBody.innerHTML = '';
        if (state.closingStepperActive) {
          // the closing summary "builds" — no messages behind it yet
          coachPanelBody.appendChild(closingStepperNode());
        } else {
          const coachingRun = trailingRun(messages, 'coaching');
          coachingRun.forEach((m) => coachPanelBody.appendChild(m.speaker === 'you' ? youCoachNode(m) : coachNode(m)));
          // The full strengths/growth-areas report lives in its own modal (see
          // resultsModal below) — opened only when the learner taps "View full
          // results" in the footer, never dumped in here. Resources are the
          // one thing that still shows inline, and only once they've been
          // through that report, so the coach panel reads as ONE thing at a
          // time landing, not everything at once.
          if (complete && !state.delivering && state.resultsViewed) {
            coachPanelBody.appendChild(resourcesNode());
          }
        }
      }

      /* —— Input bar — the composer, OR a CTA/indicator that takes its place —— */
      // start CTA (bring the coach in) · entry CTA (step in) · "Analyzing…" beat · debrief CTA
      const showStart     = !state.started && !complete;
      const showEntry     = state.awaitingEntry && !hasEnteredScene && !state.entryPromptDismissed && !state.delivering;
      const showAnalyzing = state.analyzing;
      const showDebrief   = state.awaitingDebrief && !state.analyzing && !state.delivering;
      // The coach has replied and is ready to send the learner back into the
      // scene, but waits for this tap rather than auto-transitioning.
      const showReturn    = state.awaitingReturn && !state.delivering;
      // Once the recap lands, this replaces the composer just like every other
      // CTA here — tapping it is what opens the results modal (never auto-shown).
      const showResults   = state.awaitingResults && !state.resultsModalOpen;
      // The practice's actual last step: once the resources have landed, this
      // takes the composer's place instead of leaving it sitting there disabled
      // with nothing left to type.
      const showContinue  = complete && state.resultsViewed && !state.delivering && !state.continued;
      const showDone       = state.continued;
      inputStart.hidden     = !showStart;
      inputEntry.hidden     = !showEntry;
      inputAnalyzing.hidden = !showAnalyzing;
      inputDebrief.hidden   = !showDebrief;
      inputReturn.hidden    = !showReturn;
      inputResults.hidden   = !showResults;
      inputContinue.hidden  = !showContinue;
      inputDone.hidden      = !showDone;
      inputMain.hidden      = showStart || showEntry || showAnalyzing || showDebrief || showReturn || showResults || showContinue || showDone;
      if (showAnalyzing) {
        inputAnalyzing.lastChild.textContent = complete ? 'Wrapping up your practice…' : 'Analyzing your response…';
      }
      if (showDebrief) {
        debriefCtaBtn.innerHTML = complete
          ? '<i class="fa-solid fa-chalkboard-user"></i> See your results <i class="fa-solid fa-arrow-right arrow"></i>'
          : '<i class="fa-solid fa-chalkboard-user"></i> See AI Coach feedback <i class="fa-solid fa-arrow-right arrow"></i>';
      }

      if (inputTarget === 'character') {
        composer.placeholder = `Say this to ${SCENARIO.character}…`;
        inputIcon.className = 'fa-solid fa-microphone lead-icon';
      } else {
        composer.placeholder = 'Type your response…';
        inputIcon.className = 'fa-solid fa-comment lead-icon';
      }

      composer.disabled = complete || state.transitioning || state.sending || state.delivering || !state.started;
      sendBtn.disabled = composer.disabled || !composer.value.trim();
      // The coach panel's top-right control. Post-entry it lowers the sheet ("Back to
      // practice"). Pre-entry, while prepping (composer up, entry available), the SAME
      // slot becomes the primary "Begin practicing" CTA — so the way forward always
      // lives here rather than in a separate affordance.
      const headerBegin = !hasEnteredScene && state.awaitingEntry && !inputMain.hidden && !complete;
      const headerBack  = hasEnteredScene && !complete;
      resumeBtn.hidden = !(headerBegin || headerBack);
      resumeBtn.classList.toggle('is-begin', headerBegin);
      resumeBtn.dataset.action = headerBegin ? 'begin' : 'back';
      resumeBtn.innerHTML = headerBegin
        ? 'Begin practicing <i class="fa-solid fa-arrow-right"></i>'
        : 'Back to practice <i class="fa-solid fa-chevron-down"></i>';
      inputHint.textContent = complete
        ? 'Practice complete — press Restart to run it again.'
        : 'Enter to send · Shift+Enter for a new line';

      /* —— Results modal — strengths (page 0) or growth areas (page 1), one at
         a time. .app goes inert while this is open (they're siblings, so the
         modal itself is unaffected) so background content can't be tabbed into. —— */
      resultsModal.hidden = !state.resultsModalOpen;
      app.toggleAttribute('inert', state.resultsModalOpen);
      if (state.resultsModalOpen) {
        resultsModalBody.innerHTML = '';
        resultsModalBody.appendChild(state.resultsPage === 0 ? strengthsNode() : growthAreasNode());
        [...resultsDots.children].forEach((d, i) => d.classList.toggle('is-active', i === state.resultsPage));
        resultsModalFoot.innerHTML = state.resultsPage === 0
          ? `<span></span><button class="results-nav-btn primary" id="resultsNextBtn">Next: Growth areas <i class="fa-solid fa-arrow-right"></i></button>`
          : `<button class="results-nav-btn" id="resultsBackBtn"><i class="fa-solid fa-arrow-left"></i> Back</button>
             <button class="results-nav-btn primary" id="resultsContinueBtn">Continue <i class="fa-solid fa-arrow-right"></i></button>`;
      }

      // keep the sheet sitting exactly on top of the (variable-height) input bar
      coachPanel.style.bottom = inputbar.offsetHeight + 'px';
      // with the sheet up over a LIVE scene, reserve space below so the latest
      // line scrolls into the VISIBLE peek above the sheet (not behind it)
      stageInner.style.paddingBottom = (coachUp && hasEnteredScene) ? (coachPanel.offsetHeight + 20) + 'px' : '';

      // a freshly-delivered message animates in exactly once
      messages.forEach((m) => { if (m._enter) m._enter = false; });

      manageFocus(trap);
      requestAnimationFrame(() => {
        // follow the practice to the bottom ONLY when fresh scene content arrived;
        // otherwise hold position so a Learn/Practice toggle never jumps the scene
        if (followStage) { stage.scrollTop = stage.scrollHeight; followStage = false; }
        else { stage.scrollTop = prevStageScroll; }
        coachPanelBody.scrollTop = coachPanelBody.scrollHeight;
      });
    }
    // set true right before a render that appends scene content, so it follows down
    let followStage = false;

    /* ---- typing indicator (in the right world) ------------------------ */
    function showTyping() {
      hideTyping();
      const coachUp = state.mode === 'coaching';
      const node = el('div', 'typing' + (coachUp ? '' : ' scene'), '<span></span><span></span><span></span>');
      node.id = 'typingNode';
      // coach lines type in the sheet (prep AND debriefs); scene lines type in the practice
      if (coachUp) { typingHost = coachPanelBody; coachPanelBody.appendChild(node); }
      else { typingHost = stageInner; stageInner.appendChild(node); }
      requestAnimationFrame(() => {
        (typingHost === coachPanelBody ? coachPanelBody : stage).scrollTop = 1e9;
      });
    }
    function hideTyping() {
      const t = document.getElementById('typingNode');
      if (t) t.remove();
      typingHost = null;
    }

    /* =====================================================================
       FOCUS MANAGEMENT  — trap focus in the coaching layer while paused
       ===================================================================== */
    let lastSceneFocus = null;
    function focusables() {
      // the coaching "layer" = the mode toggle + panel + the (still-usable) input bar
      const sel = 'button, [href], textarea, input, select, [tabindex]:not([tabindex="-1"])';
      return [
        ...modeIndicator.querySelectorAll(sel),
        ...coachPanel.querySelectorAll(sel),
        ...document.querySelectorAll('.inputbar ' + sel),
      ].filter((n) => !n.disabled && n.offsetParent !== null);
    }
    function manageFocus(trap) {
      if (trap && !app.classList.contains('was-trap')) {
        app.classList.add('was-trap');
        lastSceneFocus = document.activeElement;
        // move focus into the coach sheet
        setTimeout(() => { (composer.disabled ? resumeBtn : composer).focus(); }, 30);
      } else if (!trap && app.classList.contains('was-trap')) {
        app.classList.remove('was-trap');
        // restore focus toward the practice/input
        setTimeout(() => { if (!composer.disabled) composer.focus(); }, 30);
      }
    }
    // Escape closes the results modal (same path as its Continue button, so
    // the flow keeps moving rather than stranding the learner)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && state.resultsModalOpen) { e.preventDefault(); closeResultsModal(); }
    });
    document.addEventListener('keydown', (e) => {
      const trap = app.classList.contains('trap');
      if (!trap) return;
      if (e.key === 'Escape') { e.preventDefault(); resumeScene(); return; }
      if (e.key === 'Tab') {
        const f = focusables();
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });

    function announce(msg) { liveRegion.textContent = ''; setTimeout(() => { liveRegion.textContent = msg; }, 30); }

    /* =====================================================================
       ACTIONS
       ===================================================================== */
    async function send() {
      const text = composer.value.trim();
      if (!text || state.sending || state.complete || state.transitioning) return;

      const kind = state.mode === 'scene' ? 'dialogue' : 'coaching';
      state.messages.push({ speaker: 'you', kind, text, _enter: true });
      if (kind === 'dialogue') followStage = true;   // a spoken line — follow the scene down
      composer.value = '';
      autoGrow();

      state.sending = true;
      render();          // shows the learner's line (faded in) and locks input
      showTyping();      // the AI is composing — covers the model round-trip

      let turn;
      try { turn = await getTurn(state.messages); }
      catch (err) {
        turn = { turn: [{ speaker: 'coach', kind: 'coaching', text:
          'Something hiccuped reaching the AI coach. Take a breath and try that again.' }], mode: 'coaching', inputTarget: 'coach' };
      }

      await deliverTurn(turn);

      state.sending = false;
      state.manualTimeout = false;     // any model turn ends a manual timeout
      render();
      // keep the cursor in the composer so the learner can reply without re-clicking
      // (skip when a CTA/indicator has taken the input bar's place — e.g. a queued debrief)
      if (!composer.disabled && !inputMain.hidden) composer.focus();
    }

    /* Reveal a turn believably rather than all at once: AI lines arrive through
       a "thinking" beat, the character's reaction plays out IN the scene, then
       "Analyzing response…" leads into the coaching layer with the scene line
       animating across — so coaching and scene stay two distinct moments that
       are visually connected. */
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const reducedMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    // How long the coach "thinks" (typing dots) before a message. This is the MAIN
    // beat: the dots tell the learner more is coming, so they read the message that's
    // already on screen while the next one composes. We therefore scale the thinking
    // time to the PREVIOUS message's length — that's what's being read right now. The
    // very first line has nothing to read yet, so it gets a short opening beat.
    const thinkingTime = (prevText) =>
      reducedMotion() ? 250
      : prevText ? Math.min(3800, 1000 + String(prevText).length * 15)
                 : 950;

    // a token so a Restart (or new send) mid-reveal cleanly cancels the old one
    let deliverSeq = 0;
    function abortDelivery() {
      hideTyping();
      state.delivering = false;
      state.analyzing = false;
    }

    async function deliverTurn(turn) {
      const myseq = ++deliverSeq;
      const dead = () => myseq !== deliverSeq;          // a newer turn / restart superseded us
      const items = turn.turn;
      const willEnter = !state.hasEnteredScene && (turn.mode === 'scene' || items.some((m) => worldOf(m) === 'scene'));

      // FIRST entry is LEARNER-TRIGGERED: reveal the coach's invitation, stash the
      // opening scene, and surface a "Step into the scene" control. We do NOT
      // auto-advance — the learner decides when to cross the threshold.
      if (willEnter) {
        state.delivering = true;
        const coachingItems = items.filter((m) => worldOf(m) === 'coaching');
        for (const m of coachingItems) {
          hideTyping();
          showTyping(); await wait(reducedMotion() ? 250 : 780); hideTyping();
          if (dead()) return;
          m._enter = true;
          state.messages.push(m);
          render();
          await wait(reducedMotion() ? 80 : 300);
          if (dead()) return;
        }
        state.pendingScene = items.filter((m) => worldOf(m) === 'scene');
        state.awaitingEntry = true;
        state.mode = 'coaching'; state.inputTarget = 'coach';
        state.delivering = false;
        render();
        announce(`Your AI coach says you're ready. Step into the scene when you are.`);
        return;
      }

      state.delivering = true;
      let i = 0;

      // Phase 1 — the character's reaction plays out IN the scene.
      while (i < items.length && worldOf(items[i]) === 'scene') {
        const m = items[i];
        if (state.mode !== 'scene') { state.mode = 'scene'; state.inputTarget = 'character'; }
        hideTyping();
        if (m.speaker === 'character' && m.kind === 'dialogue') {
          showTyping(); await wait(reducedMotion() ? 250 : 850); hideTyping();
        } else {
          await wait(reducedMotion() ? 80 : 280);
        }
        if (dead()) return;
        m._enter = true;
        state.messages.push(m);
        if (!state.hasEnteredScene) state.hasEnteredScene = true;
        followStage = true;            // a new scene line — follow it down
        render();
        await wait(reducedMotion() ? 80 : 340);
        if (dead()) return;
        i++;
      }

      // Phase 2 — a scene line just drew its reaction. Do NOT auto-open the coach.
      // Give the learner time to READ Kendra's reaction: show "Analyzing…" briefly
      // in the input bar, then offer the debrief as a choice they open when ready.
      const intoDebrief = (i < items.length) && state.mode === 'scene' && state.hasEnteredScene;
      if (intoDebrief) {
        state.analyzing = true;
        render();                                    // input bar: "Analyzing your response…"
        await wait(reducedMotion() ? 500 : 1600);
        if (dead()) return;
        state.analyzing = false;
        state.pendingDebrief = items.slice(i);       // queue the debrief; don't reveal it yet
        state.awaitingDebrief = true;
        state.delivering = false;
        render();                                    // input bar: "See what your AI coach noticed →"
        announce('Your AI coach noticed something. Open the coach when you’re ready.');
        return;
      }

      // Phase 3 — coach message(s) revealed in the sheet when we're ALREADY coaching
      // (a send-back reply, an escalation redirect, or a manual-timeout answer).
      while (i < items.length) {
        const m = items[i];
        hideTyping();
        showTyping(); await wait(reducedMotion() ? 250 : 780); hideTyping();
        if (dead()) return;
        m._enter = true;
        state.messages.push(m);
        render();
        await wait(reducedMotion() ? 80 : 300);
        if (dead()) return;
        i++;
      }

      // Finalize. If the coach is sending the learner back into the scene, dwell
      // briefly so the send-off reads, then lift the panel.
      // If the coach is sending the learner back into the scene, don't auto-cut
      // over — give them a beat to read the reply, then offer it as a choice
      // (same "learner decides when" pattern as every other transition here),
      // rather than yanking the panel closed out from under them.
      const resumingToScene = turn.mode === 'scene' && state.mode === 'coaching';
      if (resumingToScene) {
        state.pendingReturn = { mode: turn.mode, inputTarget: turn.inputTarget };
        state.awaitingReturn = true;
        state.delivering = false;
        render();                                     // input bar: "Continue practicing →"
        announce('Your AI coach is ready to send you back. Continue when you are.');
        return;
      }
      state.mode = turn.mode; state.inputTarget = turn.inputTarget;
      state.delivering = false;
      render();
    }

    // "Continue practicing" — the learner returns to the scene on their own
    // command, once they're done reading the coach's reply.
    function returnToScene() {
      if (!state.awaitingReturn || state.sending || state.delivering) return;
      const p = state.pendingReturn;
      state.pendingReturn = null;
      state.awaitingReturn = false;
      state.mode = p.mode; state.inputTarget = p.inputTarget;
      followStage = true;
      announce('Back in the scene.');
      render();
      setTimeout(() => { if (!composer.disabled) composer.focus(); }, 260);
    }

    // "See what your AI coach noticed" — the learner opens the queued debrief when
    // ready (after reading Kendra's reaction). The coach sheet RISES; the practice
    // (with the line) stays visible, dimmed, above it.
    function openDebrief() {
      if (!state.awaitingDebrief || state.sending || state.delivering) return;
      if (state.complete) { openClosingDebrief(); return; }
      (state.pendingDebrief || []).forEach((m) => { m._enter = true; state.messages.push(m); });
      state.pendingDebrief = null;
      state.awaitingDebrief = false;
      state.analyzing = false;
      state.mode = 'coaching'; state.inputTarget = 'coach';
      announce('Stepped out to your AI coach.');
      render();   // the coach sheet rises with the debrief
    }

    // The FINAL debrief gets a build-up instead of an instant reveal: the coach
    // sheet rises into a short "Analyzing… Determining…" stepper, THEN the recap
    // message + the strengths/growth-areas report land together.
    async function openClosingDebrief() {
      const myseq = ++deliverSeq;
      const dead = () => myseq !== deliverSeq;
      const pending = state.pendingDebrief || [];
      state.pendingDebrief = null;
      state.awaitingDebrief = false;
      state.analyzing = false;
      state.mode = 'coaching'; state.inputTarget = 'coach';
      state.closingStepperActive = true;
      announce('Analyzing the conversation.');
      render();   // the coach sheet rises, showing the stepper
      await runClosingStepper(dead);
      if (dead()) return;
      state.closingStepperActive = false;
      pending.forEach((m) => { m._enter = true; state.messages.push(m); });
      state.awaitingResults = true;   // footer offers "View full results" — the report opens in its own modal
      announce('Your AI coach has a recap. View your full results when ready.');
      render();   // just the recap message for now
    }

    function openResultsModal() {
      if (!state.awaitingResults) return;
      state.resultsPage = 0;
      state.resultsModalOpen = true;
      announce('Your results: strengths.');
      render();
      // move focus into the dialog so keyboard/SR users land in it
      document.getElementById('resultsModalCard').focus();
    }
    // Closing the modal doesn't just dump the resources in — the coach
    // "introduces" them first, as its own typed-in message, the same way any
    // other coach line arrives (see deliverTurn/deliverOpening).
    async function closeResultsModal() {
      const myseq = ++deliverSeq;
      const dead = () => myseq !== deliverSeq;
      state.resultsModalOpen = false;
      state.awaitingResults = false;
      state.delivering = true;
      announce('Back to your AI coach.');
      render();
      // the modal (and the CTA that opened it) are gone — hand focus to a
      // control that's still visible while the coach types the resources in
      document.getElementById('restartBtn').focus();
      showTyping(); await wait(reducedMotion() ? 250 : 900); hideTyping();
      if (dead()) return;
      state.messages.push({ speaker: 'coach', kind: 'coaching', _enter: true, text:
        `Great work! Here are some resources for dealing with situations just like this.` });
      render();
      await wait(reducedMotion() ? 80 : 500);
      if (dead()) return;
      showTyping(); await wait(reducedMotion() ? 250 : 900); hideTyping();
      if (dead()) return;
      state.resultsViewed = true;   // reveals the resources message — see render()
      state.delivering = false;
      announce('Here are some resources.');
      render();
      // settle focus on the practice's actual next step
      if (!inputContinue.hidden) continueCtaBtn.focus();
    }

    // "Continue" — the practice's actual last step. Nothing in this prototype
    // routes to a real next lesson, so this just settles the footer into a
    // clear, final "done" state rather than pretending to navigate anywhere.
    function finishPractice() {
      if (!state.resultsViewed || state.continued) return;
      state.continued = true;
      announce('Practice complete.');
      render();
    }
    function resultsNext() {
      state.resultsPage = 1;
      announce('Your results: growth areas.');
      render();
    }
    function resultsBack() {
      state.resultsPage = 0;
      announce('Your results: strengths.');
      render();
    }

    async function runClosingStepper(dead) {
      const steps = () => [...coachPanelBody.querySelectorAll('.closing-step')];
      for (let i = 0; i < CLOSING_STEPS.length; i++) {
        if (dead()) return;
        const els = steps();
        if (els[i]) els[i].classList.add('is-active');
        await wait(reducedMotion() ? 150 : 900);
        if (dead()) return;
        if (els[i]) { els[i].classList.remove('is-active'); els[i].classList.add('is-done'); }
      }
      await wait(reducedMotion() ? 0 : 350);
    }

    // "Step into the scene" — the learner crosses on their command. The coach
    // sheet LOWERS to reveal the live practice; the first scene line fades in.
    // (Same motion as every Learn→Practice switch — no special-case screen.)
    function enterScene() {
      if (!state.awaitingEntry || state.hasEnteredScene || state.sending || state.delivering) return;
      (state.pendingScene || []).forEach((m) => { m._enter = true; state.messages.push(m); });
      state.pendingScene = null;
      state.awaitingEntry = false;
      state.entryPromptDismissed = false;
      state.hasEnteredScene = true;
      state.mode = 'scene'; state.inputTarget = 'character';
      followStage = true;   // reveal the first scene line at the bottom
      announce(`You step into the scene with ${SCENARIO.character}.`);
      render();   // coach sheet lowers; the live scene is revealed beneath it
      setTimeout(() => { if (!composer.disabled) composer.focus(); }, 260);
    }

    // "Step out to AI coach" — a learner-initiated pause (not a coach debrief).
    function stepOut() {
      if (state.mode !== 'scene' || state.complete || state.sending || state.delivering || state.transitioning || state.awaitingDebrief) return;
      state.messages.push({ speaker: 'coach', kind: 'coaching', text:
`Timeout — we can pause here as long as you need. What's on your mind before you step back in?` });
      state.mode = 'coaching';
      state.inputTarget = 'coach';
      state.manualTimeout = true;
      announce('Scene paused. Timeout with your AI coach.');
      render();
      setTimeout(() => composer.focus(), 40);
    }

    // "Resume the scene" — go back into the roleplay (no message added).
    function resumeScene() {
      if (!state.hasEnteredScene || state.complete || state.delivering || state.sending) return;
      state.mode = 'scene';
      state.inputTarget = 'character';
      state.manualTimeout = false;
      state.awaitingReturn = false; state.pendingReturn = null;   // this covers it too
      announce('Back in the scene.');
      render();
    }

    // "Try a different approach" — truncate back to just before this YourSceneLine
    // and return to scene mode targeting the character (a pedagogical retry).
    function tryDifferentApproach(absIndex) {
      if (absIndex == null || absIndex < 0 || state.sending || state.delivering || state.transitioning) return;
      deliverSeq++;                          // cancel any in-flight reveal
      abortDelivery();
      state.messages = state.messages.slice(0, absIndex);
      state.complete = false;
      state.mode = 'scene';
      state.inputTarget = 'character';
      state.manualTimeout = false;
      state.awaitingDebrief = false; state.pendingDebrief = null; state.analyzing = false;
      // recompute hasEnteredScene from the truncated history
      state.hasEnteredScene = state.messages.some((m) => worldOf(m) === 'scene');
      followStage = true;
      announce('Rewound. Try that line again.');
      render();
      setTimeout(() => composer.focus(), 40);
    }

    function restart() {
      deliverSeq++;                                       // cancel any in-flight reveal
      abortDelivery();
      Object.assign(state, {
        mode: 'coaching', inputTarget: 'coach', hasEnteredScene: false,
        started: false, messages: [], pendingOpening: initialMessages(),
        sending: false, complete: false, manualTimeout: false,
        transitioning: false, delivering: false, awaitingEntry: false, pendingScene: null,
        entryPromptDismissed: false, awaitingDebrief: false, pendingDebrief: null, analyzing: false,
        closingStepperActive: false,
        awaitingResults: false, resultsModalOpen: false, resultsPage: 0, resultsViewed: false, continued: false,
        awaitingReturn: false, pendingReturn: null,
      });
      app.classList.remove('was-trap');
      followStage = true;
      announce('Practice restarted.');
      render();   // back to the scene anchor with an "Enter scenario" prompt
    }

    // "Chat with AI Coach" — the learner brings the coach in on their command. The
    // sheet rises over the scene anchor and the opening prep types in, one line at
    // a time, as if the coach is talking — never dumped in all at once.
    async function startSession() {
      if (state.started || state.sending || state.delivering) return;
      state.started = true;
      state.mode = 'coaching'; state.inputTarget = 'coach';
      announce('Bringing in your AI coach.');
      render();                 // the sheet rises (empty) over the scene anchor
      await deliverOpening();   // each opening line types into the sheet, one by one
    }

    // Reveal the coach's opening prep message-by-message (typing beat between each),
    // so the first thing the learner sees is the coach "talking," not a wall of text.
    async function deliverOpening() {
      const myseq = ++deliverSeq;
      const dead = () => myseq !== deliverSeq;     // a restart mid-stream supersedes us
      const opening = state.pendingOpening || [];
      state.pendingOpening = null;
      state.delivering = true;
      render();
      for (let i = 0; i < opening.length; i++) {
        const m = opening[i];
        const prev = i > 0 ? opening[i - 1] : null;
        // The dominant beat: "thinking" long enough to read the previous message,
        // with the typing dots signalling that more is on the way.
        hideTyping();
        showTyping(); await wait(thinkingTime(prev ? prev.text : '')); hideTyping();
        if (dead()) return;
        m._enter = true;
        state.messages.push(m);
        render();
        // just a short settle so the next "thinking" doesn't start the same instant
        if (i < opening.length - 1) await wait(reducedMotion() ? 80 : 480);
        if (dead()) return;
      }
      state.delivering = false;
      render();
      if (!composer.disabled) composer.focus();
    }

    /* =====================================================================
       WIRING
       ===================================================================== */
    function autoGrow() {
      composer.style.height = 'auto';
      composer.style.height = Math.min(composer.scrollHeight, 120) + 'px';
    }
    composer.addEventListener('input', () => { autoGrow(); sendBtn.disabled = state.sending || state.complete || !composer.value.trim(); });
    composer.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    sendBtn.addEventListener('click', send);
    // pre-entry this control begins the conversation; once entered it lowers the sheet
    resumeBtn.addEventListener('click', () => {
      if (resumeBtn.dataset.action === 'begin') enterScene();
      else resumeScene();
    });
    scrim.addEventListener('click', resumeScene);     // tap the dimmed scene to resume

    // Entry bar: the CTA steps in; "keep talking" hands the bar back to the composer.
    enterCtaBar.addEventListener('click', enterScene);
    keepTalkingBtn.addEventListener('click', () => {
      state.entryPromptDismissed = true;
      render();
      composer.focus();
    });
    // Debrief bar: open the queued coach debrief when the learner is ready.
    debriefCtaBtn.addEventListener('click', openDebrief);
    // Return bar: cross back into the scene on the learner's own command.
    returnCtaBtn.addEventListener('click', returnToScene);
    // Results bar: opens the strengths/growth-areas modal (never auto-shown).
    resultsCtaBtn.addEventListener('click', openResultsModal);
    // Modal nav — delegated since the footer's buttons are rebuilt every render.
    resultsModalFoot.addEventListener('click', (e) => {
      if (e.target.closest('#resultsNextBtn')) resultsNext();
      else if (e.target.closest('#resultsBackBtn')) resultsBack();
      else if (e.target.closest('#resultsContinueBtn')) closeResultsModal();
    });
    // The practice's actual last step, once the resources have landed.
    continueCtaBtn.addEventListener('click', finishPractice);
    // Start bar: "Enter scenario" brings the AI coach straight in — no intro
    // beat to sit through first.
    startCtaBtn.addEventListener('click', startSession);

    // The mode toggle: tap the inactive segment to switch states (delegated, as
    // the toggle is rebuilt on every render). Disabled segments don't fire.
    modeIndicator.addEventListener('click', (e) => {
      const seg = e.target.closest('.seg');
      if (!seg || seg.disabled) return;
      const which = seg.dataset.seg;
      if (which === 'coaching' && !state.started) { startSession(); return; }  // begin
      if (which === state.mode) return;               // already active
      if (which === 'coaching') {                     // → the coach layer
        if (state.awaitingDebrief) openDebrief();      // open the queued debrief
        else stepOut();                                // or a manual timeout
      } else if (which === 'scene') {                 // → the practice
        if (!state.hasEnteredScene && state.awaitingEntry) enterScene();  // first crossing
        else resumeScene();                           // back into the scene
      }
    });
    document.getElementById('restartBtn').addEventListener('click', restart);

    // Opening beat: anchor on the practice base ("Kendra's room") with an "Enter
    // scenario" prompt. The coach sheet stays down until the learner chooses
    // to begin.
    render();
    </script>
    <!-- ===== Course-delivery frame ===================================== -->
    <script>
      // Embed into the app shell; course/lesson auto-derive from #scenarioName.
      window.LESSON_FRAME = { mount: '#app' };
    </script>
    <script src="js/frame.js?v=3"></script>
    <script>
      // Relocate the app's Restart control onto the frame's actions slot; moving
      // the node preserves its click handler (attached above by element id).
      (function () {
        function relocate() {
          var slot = document.querySelector('.vt-frame .vt-actions');
          var btn  = document.getElementById('restartBtn');
          if (slot && btn) slot.appendChild(btn);
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', relocate);
        else relocate();
      })();
    </script>
</body>
</html>
