      render();              // mounts the narrated/reading card in the stage
      announce(AUDIO_INTRO_MODALITY === 'reading' ? 'Read the scene, then continue.' : 'Setting the scene. Listen or read along, then continue.');
    }
    function finishAudioIntro() {
      // Scene Sweep hands the reading context DIRECTLY to the full-bleed Observe
      // canvas (gated on !audioIntroPlaying), not to a coach sheet over the
      // context — so unlike the arc pages, clear the flag now so the canvas
      // mounts. (The forward CTA still lives in the bottom bar; see #inputIntroContinue.)
      if (!state.audioIntroPlaying) return;
      if (audioIntroHandle) { audioIntroHandle.stop(); audioIntroHandle = null; }
      state.audioIntroPlaying = false;   // the context's job is done — the Observe canvas takes the stage
      CONTEXT.done({ modality: AUDIO_INTRO_MODALITY });   // → startSession(record)
    }

    async function runIntroSequence(mySeq) {
      const sceneVideo = document.querySelector('.scene-video');
      if (!sceneVideo) return;
      const videos = [...sceneVideo.querySelectorAll('.intro-video')];
      const introCaption   = document.getElementById('introCaption');
      const introBeginBtn  = document.getElementById('introBeginBtn');
      const introLoading   = document.getElementById('introLoading');
      const introPlayPause = document.getElementById('introPlayPauseBtn');
      const introSkipBtn   = document.getElementById('introSkipBtn');

      // PROTOTYPE-ONLY skip: lets stakeholders jump past the cold open during
      // review. Bumping introSeq abandons the in-flight clip loop and its
      // captions (every await re-checks the seq), then we chain straight into
      // the coach exactly as a natural video ending would. The real design
      // keeps the intro unskippable — strip this for the build.
      introSkipBtn.addEventListener('click', () => {
        if (mySeq !== introSeq) return;
        introSeq++;
        const active = sceneVideo.querySelector('.intro-video.is-active');
        if (active) active.pause();
        introCaption.classList.remove('is-visible');
        introSkipBtn.hidden = true;
        introBeginBtn.hidden = true;   // in case the autoplay-block fallback was up
        finishVideoIntro();
      }, { once: true });

      // The only transport control offered: pause/resume the clip that's
      // currently active. No seek, no skip — that still isn't on the table.
      introPlayPause.addEventListener('click', () => {
        const active = sceneVideo.querySelector('.intro-video.is-active');
        if (!active) return;
        if (active.paused) active.play(); else active.pause();
        introPlayPause.innerHTML = active.paused ? '<i class="fa-solid fa-play"></i>' : '<i class="fa-solid fa-pause"></i>';
        introPlayPause.setAttribute('aria-label', active.paused ? 'Play' : 'Pause');
      });

      await preloadVideos(videos);
      if (mySeq !== introSeq) return;
      introLoading.classList.add('is-out');
      await wait(reducedMotion() ? 0 : 260);
      if (mySeq !== introSeq) return;

      for (let i = 0; i < videos.length; i++) {
        if (mySeq !== introSeq) return;
        const v = videos[i];
        const scene = INTRO_SCENES[i];
        introCaption.classList.remove('is-visible');
        videos.forEach((other, j) => other.classList.toggle('is-active', j === i));
        try {
          await v.play();
        } catch (err) {
          // Only an actual autoplay-policy block needs a tap to recover from —
          // a missing/corrupt asset (NotSupportedError etc.) should just move on
          // and let waitForVideoEnd's error handler advance the sequence below,
          // rather than stranding the learner on a button that can't help.
          if (err && err.name === 'NotAllowedError') {
            await waitForTap(introBeginBtn);
            if (mySeq !== introSeq) return;
            try { await v.play(); } catch (e2) { /* asset itself is the problem — move on */ }
          }
        }
        if (mySeq !== introSeq) return;
        runCaptions(introCaption, splitCaptionChunks(scene.text), mySeq);   // alongside the video, self-cancels
        await waitForVideoEnd(v, mySeq);
        if (mySeq !== introSeq) return;
      }
      if (mySeq !== introSeq) return;
      finishVideoIntro();
    }

    /* THE LADDER ENGINE — the app owns arc progression; the model only ever
       CLASSIFIES. It signals intent via turn.action ("continue" | "teach" |
       "redirect") and, on a teach, reports the phase's calibration tier. We
       decide, deterministically, whether the phase closes and what follows:

         reflection (phaseIdx < 0): a "teach" (the calibration) opens Phase 1;
                                    a "redirect" (off-script) re-asks, no advance.
         live phase k:  "continue" → stay in the phase (a scene reaction or an
                                     in-phase probe), until the cap forces close.
                        "teach"    → CLOSE the phase: record turn.tier on the
                                     ladder, apply the phase's authored
                                     transitions[] (state writes + routing), and
                                     deliver the next phase's entry — with the
                                     bridge variant the recorded tier selects.
                        "redirect" → stay, and don't count it against the cap.
       If the model omits action, we infer conservatively: the verbatim
       talk-it-through opener, a reported tier, or complete:true ⇒ teach;
       otherwise ⇒ continue. If the model ignores a forced close (cap + 1), we
       advance anyway so the learner is never stranded.
       We set turn.deliver ourselves; applyDeliver then appends the locked entry. */
    function runArcEngine(turn) {
      const phases = Array.isArray(ACTIVE_SCENARIO.phases) ? ACTIVE_SCENARIO.phases : [];
      if (!phases.length || state.complete) return;

      const norm = (t) => String(t || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 40);

      if (state.phaseIdx < 0) {               // reflection warm-up
        if (turn.action === 'redirect') { turn.deliver = null; return; }
        closePhase(null, turn);                // calibration done → open Phase 1
        return;
      }
      if (state.phaseIdx >= phases.length) return;   // ladder done — the model owns COMPLETION

      const p = phases[state.phaseIdx];
      const cap = Math.max(1, p.maxTurns || 3);
      const coachBubbles = (turn.turn || []).filter((m) => m.speaker === 'coach' && String(m.text || '').trim());
      const opener = coachBubbles[0] ? norm(coachBubbles[0].text) : '';
      const tit = (p.debrief && p.debrief.talkItThrough) ? norm(fillT(p.debrief.talkItThrough)) : '';
      const teachOpener = !!(tit && opener && opener.startsWith(tit));
      let intent = turn.action;
      if (!intent) intent = (teachOpener || turn.tier || turn.complete) ? 'teach' : 'continue';

      if (intent === 'redirect') { turn.deliver = null; return; }
      const overCap = state.turnsInPhase >= cap + 1;   // the forced close was ignored once already
      if (intent !== 'teach' && !teachOpener && !overCap) { turn.deliver = null; return; }   // stay in the phase

      closePhase(p, turn);
    }

    /* Close a phase: record the tier, apply its authored transitions (state
       writes + routing), and cue the next entry. `p` is null for the
       reflection warm-up (no tier, no transitions — straight to phase 0). */
    function closePhase(p, turn) {
      const phases = ACTIVE_SCENARIO.phases || [];
      let nextIdx = 0;
      if (p) {
        const tier = turn.tier || null;
        state.ladder[p.id] = tier || '(unreported)';
        state.lastTier = tier;
        const trans = (p.transitions || []).find((t) => t.onTier && tier && t.onTier === tier)
          || (p.transitions || []).find((t) => !t.onTier)
          || null;
        if (trans && trans.set) Object.keys(trans.set).forEach((k) => {
          if (k in state.vars) state.vars[k] = trans.set[k];
        });
        const curIdx = phases.indexOf(p);
        nextIdx = (trans && trans.next)
          ? phases.findIndex((x) => x.id === trans.next)
          : curIdx + 1;
        if (nextIdx < 0 || nextIdx >= phases.length) {   // terminal — the model completes this same turn
          turn.deliver = null;
          state.phaseIdx = phases.length;
          return;
        }
      }
      turn.deliver = (phases[nextIdx] || {}).id || null;   // app-authoritative (overrides any model deliver)
      state.phaseIdx = nextIdx;
      state.turnsInPhase = 0;
    }

    /* Append the LOCKED (app-owned) entry the ladder engine cued via
       turn.deliver: the bridge variant the recorded tier selects, the signpost,
       the task prompt (coaching) or scene beats (scene). The page owns these
       verbatim; the model never writes them. A scene-phase entry also flips the
       turn into scene mode — deliverTurn's entry handshake (first crossing) or
       the debrief-then-return flow (later crossings) present it on the
       learner's own tap, labeled with the phase's authored CTA. */
    function applyDeliver(turn) {
      if (!turn || !turn.deliver) return;
      const phases = ACTIVE_SCENARIO.phases || [];
      const p = phases.find((x) => x.id === turn.deliver);
      if (!p) return;
      const beat = entryBeatsFor(p, state.lastTier).map((m) => ({ ...m, locked: true }));

      // The model is told the locked text but sometimes reproduces it anyway;
      // drop any message it wrote that matches a locked beat so the app's copy
      // is the only one (prevents a duplicated bridge / scene open).
      const norm = (t) => String(t || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 40);
      const lockedKeys = new Set(beat.map((m) => norm(m.text)));
      turn.turn = (turn.turn || []).filter((m) => !lockedKeys.has(norm(m.text)));

      // A locked scene hand-off is the ONLY crossing into a scene phase. Models
      // sometimes tack a preview onto the debrief ("let's put you in the room"),
      // which then doubles the locked entry. Strip any preview SENTENCE from the
      // trailing coach bubbles, then drop a bubble left empty.
      if (p.world === 'scene') {
        const PREVIEW = /\b(put you in|into the (room|scene|moment)|step in(to)?|into practice|let'?s (practice|keep going|head in)|in the room|back (to|into) the scene|ready to (practice|go|step))\b/i;
        for (let i = turn.turn.length - 1; i >= 0 && turn.turn[i].speaker === 'coach'; i--) {
          turn.turn[i].text = String(turn.turn[i].text || '')
            .split(/(?<=[.!?])\s+/)
            .filter((s) => !PREVIEW.test(s))
            .join(' ').replace(/\s{2,}/g, ' ').trim();
        }
        turn.turn = turn.turn.filter((m) => String(m.text || '').trim().length);
      }

      turn.turn = turn.turn.concat(beat);
      state.scenePlaceholder = fillT(p.inputPlaceholder || '');
      state.entryLabel = fillT((p.entry || {}).cta || '');
      if (p.world === 'scene') {
        turn.mode = 'scene';
        turn.inputTarget = 'character';
        turn.returnLabel = state.entryLabel || null;
        turn.sceneTarget = (p.counterpart && p.counterpart !== 'Narrator') ? fillT(p.counterpart) : null;
      } else {
        turn.mode = 'coaching';
        turn.inputTarget = 'coach';
      }
    }

    /* =====================================================================
       ACTIONS
       ===================================================================== */
    async function send() {
      const text = composer.value.trim();
      if (!text || state.sending || state.complete || state.transitioning) return;
      state.lookAgainDismissed = false;   // a fresh turn re-arms the sweep "look again" CTA

      let youMsg = null;
      if (state.mode === 'scene') {
        // The learner's move renders SPLIT (what they DO vs what they SAY). While
        // that split resolves we stand in a "considering…" loader and render the
        // move ONCE — never the raw text flashed then re-split. The reaction model
        // still receives the raw text verbatim (via .text).
        youMsg = { speaker: 'you', kind: 'dialogue', text, _enter: true };
        // Snapshot the ladder state BEFORE this move counts, so "Try a different
        // approach" can rewind the arc (tier records, session state, phase turn
        // count) along with the transcript — never just the messages.
        youMsg._arc = {
          phaseIdx: state.phaseIdx, turnsInPhase: state.turnsInPhase,
          ladder: { ...state.ladder }, vars: { ...state.vars }, lastTier: state.lastTier,
          scenePlaceholder: state.scenePlaceholder, entryLabel: state.entryLabel,
          sceneTarget: state.sceneTarget,
        };
        if (SCENE_SAYDO) youMsg._pending = true;
        else youMsg._display = [{ kind: 'dialogue', text }];
        state.messages.push(youMsg);
        followStage = true;   // new scene content — follow it down
      } else {
        state.messages.push({ speaker: 'you', kind: 'coaching', text, _enter: true });
      }
      composer.value = '';
      autoGrow();

      // Count this learner turn against the LIVE phase's cap — but only when it
      // was spent IN that phase's world (a manual-timeout chat with the coach
      // never burns scene turns).
      {
        const phases = ACTIVE_SCENARIO.phases || [];
        const p = (state.phaseIdx >= 0 && state.phaseIdx < phases.length) ? phases[state.phaseIdx] : null;
        const inPhaseWorld = p && !state.manualTimeout && ((p.world === 'scene') === (state.mode === 'scene'));
        if (inPhaseWorld) state.turnsInPhase++;
      }

      state.sending = true;
      render();          // shows the learner's line (or the loader) and locks input

      // Kick the reaction off NOW so it composes while we resolve the learner's own
      // move — both read the same raw text. Failures resolve to a graceful turn.
      const turnP = getTurn(state.messages).catch(() => {
        announce('Something hiccuped reaching the AI coach. Take a breath and try that again.');
        return { turn: [{ speaker: 'coach', kind: 'coaching', text:
          'Something hiccuped reaching the AI coach. Take a breath and try that again.' }], mode: 'coaching', inputTarget: 'coach' };
      });

      // Resolve + render the learner's OWN move first (loader → split, one render).
      if (youMsg && youMsg._pending) { await finalizeYouDisplay(youMsg); render(); }

      // The wait for the scene/coach reply now carries a visible indicator.
      await wait(reducedMotion() ? 80 : 700);   // a beat before the reply begins — a real response doesn't start the instant you hit send
      showTyping(state.mode === 'scene' ? 'Updating the scene…' : '');

      const turn = await turnP;

      // COVERAGE — accumulate the hazards the model just credited into the
      // running set BEFORE the beat can advance, so the rail and the next state
      // line reflect this turn. (Validated to real rubric ids by the parser.)
      if (Array.isArray(turn.spotted)) turn.spotted.forEach((id) => state.covered.add(id));

      // LOCKED (grey) beats: the model only writes the dynamic feedback, then
      // asks us to show the next app-owned beat via turn.deliver. We append that
      // beat VERBATIM to this turn's messages so it renders right after the coach's line.
      runArcEngine(turn);           // app owns the arc: tier capture, transitions, routing
      applyDeliver(turn);

      // Live mode signals the end of the practice on the turn itself (the demo
      // engine sets state.complete directly). The report feeds the results modal.
      if (turn.complete) state.complete = true;
      if (turn.report) state.report = turn.report;

      await deliverTurn(turn);

      state.sending = false;
      state.manualTimeout = false;     // any model turn ends a manual timeout
      render();
      // keep the cursor in the composer so the learner can reply without re-clicking
      // (skip when a CTA/indicator has taken the input bar's place — e.g. a queued debrief)
      if (!composer.disabled && !inputMain.hidden) composer.focus();
    }

    /* Reveal a turn believably rather than all at once: AI lines arrive through
       a "thinking" beat, the character's reaction plays out IN the scene, then
       "Analyzing response…" leads into the coaching layer with the scene line
       animating across — so coaching and scene stay two distinct moments that
       are visually connected. */
    // Shared pacing (js/sim-core.js): wait/reducedMotion plus thinkingTime —
    // the coach "thinks" long enough for the learner to read the PREVIOUS
    // message; the very first line gets a short opening beat. One rhythm
    // across every simulator page.
    const { wait, reducedMotion, thinkingTime } = SimCore;

    // a token so a Restart (or new send) mid-reveal cleanly cancels the old one
    let deliverSeq = 0;
    function abortDelivery() {
      hideTyping();
      state.delivering = false;
      state.analyzing = false;
    }

    async function deliverTurn(turn) {
      const myseq = ++deliverSeq;
      const dead = () => myseq !== deliverSeq;          // a newer turn / restart superseded us
      const items = turn.turn;
      const willEnter = !state.hasEnteredScene && (turn.mode === 'scene' || items.some((m) => worldOf(m) === 'scene'));

      // FIRST entry is LEARNER-TRIGGERED: reveal the coach's invitation, stash the
      // opening scene, and surface a "Step into the scene" control. We do NOT
      // auto-advance — the learner decides when to cross the threshold.
      if (willEnter) {
        state.delivering = true;
        const coachingItems = items.filter((m) => worldOf(m) === 'coaching');
        for (let ci = 0; ci < coachingItems.length; ci++) {
          const m = coachingItems[ci];
          const prev = ci > 0 ? coachingItems[ci - 1] : null;
          hideTyping();
          // Dots scaled to the PREVIOUS line's length (thinkingTime) rather than a
          // flat beat — so a burst of coach messages leaves the learner room to
          // start reading each one before the next composes.
          showTyping(); await wait(thinkingTime(prev ? prev.text : '')); hideTyping();
          if (dead()) return;
          m._enter = true;
          state.messages.push(m);
          render();
          if (ci < coachingItems.length - 1) await wait(reducedMotion() ? 80 : 700);
          if (dead()) return;
        }
        state.pendingScene = items.filter((m) => worldOf(m) === 'scene');
        // Safety net (live mode): if the model invited us in without painting the
        // room, establish the scene ourselves from the writer's opening image so
        // the learner never enters a blank stage — in ANY scenario.
        if (!state.pendingScene.length) {
          state.pendingScene = [{ speaker: 'character', kind: 'narration', text:
`You step in. ${AitheraScenario.fill(ACTIVE_SCENARIO.openingImage, ACTIVE_SCENARIO)}.` }];
        }
        state.awaitingEntry = true;
        state.mode = 'coaching'; state.inputTarget = 'coach';
        state.delivering = false;
        render();
        announce(`Your AI coach says you're ready. Step into the scene when you are.`);
        return;
      }

      state.delivering = true;
      let i = 0;

      // Phase 1 — the scene's reaction plays out IN the stage, one beat at a time
      // (shared pacing via revealScene, same as the setup).
      const leadScene = [];
      while (i < items.length && worldOf(items[i]) === 'scene') { leadScene.push(items[i]); i++; }
      if (leadScene.length) { await revealScene(leadScene, dead); if (dead()) return; }

      // Phase 2 — a scene line just drew its reaction. Do NOT auto-open the coach.
      // Give the learner time to READ Kendra's reaction: show "Analyzing…" briefly
      // in the input bar, then offer the debrief as a choice they open when ready.
      // Queue the coaching items as a "debrief" (gated behind a tap) either when
      // a scene line just drew its reaction, OR on the FINAL turn — so a
      // completion delivered in coaching (Beat C ends with a coach recap, not a
      // scene beat) still routes through the closing build-up + results.
      // Scene Sweep is coach-only (hasEnteredScene never flips), so gate the
      // closing flow on completion directly — otherwise the guaranteed close
      // (stepper → results → playbook → resources) would never fire. Character
      // sims still route their in-scene reactions + completion through here.
      const intoDebrief = (i < items.length)
        && (state.complete || (state.hasEnteredScene && state.mode === 'scene'));
      if (intoDebrief) {
        hideTyping();                                // clear the send() "thinking" dots — the closing/debrief flow owns the beat now (they'd otherwise linger forever beside the CTA)
        state.analyzing = true;
        followStage = true;                          // the input bar swaps height here → keep the last beat pinned in view
        render();                                    // input bar: "Analyzing your response…"
        announce(state.complete ? 'Wrapping up your practice.' : 'Analyzing your response.');
        await wait(reducedMotion() ? 500 : 1600);
        if (dead()) return;
        state.analyzing = false;
        state.pendingDebrief = items.slice(i);       // queue the debrief; don't reveal it yet
        state.awaitingDebrief = true;
        // If this debrief is a coach-led hand-off BACK into the scene (a scene-
        // mode, non-final turn — e.g. "let's check in with Marshall now"), arm a
        // scene-return CTA to show once the coach's line has been read.
        state.debriefReturn = (!state.complete && turn.mode === 'scene')
          ? { mode: turn.mode, inputTarget: turn.inputTarget, label: turn.returnLabel || null, sceneTarget: turn.sceneTarget || null, sceneSetup: turn.sceneSetup || null }
          : null;
        state.delivering = false;
        followStage = true;                          // the taller debrief CTA shrinks the stage → re-pin so the last beat isn't cut off
        render();                                    // input bar: "See what your AI coach noticed →"
        announce('Your AI coach noticed something. Open the coach when you’re ready.');
        return;
      }

      // Phase 3 — coach message(s) revealed in the sheet when we're ALREADY coaching
      // (a send-back reply, an escalation redirect, or a manual-timeout answer).
      let prevText = (i > 0 && items[i - 1]) ? (items[i - 1].text || '') : '';
      while (i < items.length) {
        const m = items[i];
        hideTyping();
        // Dots scaled to what was just shown (thinkingTime) instead of a flat beat,
        // so consecutive coach lines give the learner room to start reading.
        showTyping(); await wait(thinkingTime(prevText)); hideTyping();
        if (dead()) return;
        m._enter = true;
        state.messages.push(m);
        render();
        prevText = m.text || '';
        i++;
        if (i < items.length) await wait(reducedMotion() ? 80 : 700);
        if (dead()) return;
      }

      // Finalize. If the coach is sending the learner back into the scene, dwell
      // briefly so the send-off reads, then lift the panel.
      // If the coach is sending the learner back into the scene, don't auto-cut
      // over — give them a beat to read the reply, then offer it as a choice
      // (same "learner decides when" pattern as every other transition here),
      // rather than yanking the panel closed out from under them.
      const resumingToScene = turn.mode === 'scene' && state.mode === 'coaching';
      if (resumingToScene) {
        state.pendingReturn = { mode: turn.mode, inputTarget: turn.inputTarget, sceneTarget: turn.sceneTarget || null, sceneSetup: turn.sceneSetup || null };
        state.returnLabel = turn.returnLabel || null;
        state.awaitingReturn = true;
        state.delivering = false;
        render();                                     // input bar: "Continue practicing →"
        announce('Your AI coach is ready to send you back. Continue when you are.');
        return;
      }
      state.mode = turn.mode; state.inputTarget = turn.inputTarget;
      state.delivering = false;
      render();
    }

    // "Continue practicing" — the learner returns to the scene on their own
    // command, once they're done reading the coach's reply.
    async function returnToScene() {
      if (!state.awaitingReturn || state.sending || state.delivering) return;
      const p = state.pendingReturn;
      state.pendingReturn = null;
      state.awaitingReturn = false;
      state.returnLabel = null;
      state.mode = p.mode; state.inputTarget = p.inputTarget;
      state.sceneTarget = p.sceneTarget || null;   // who (if anyone) the learner now faces
      followStage = true;
      announce(p.sceneTarget ? `Back in with ${p.sceneTarget}.` : 'Back in the scene.');
      // Paint the NEW moment in the scene pane — the next phase's locked entry
      // beats (held by openDebrief), revealed with the shared scene pacing; a
      // legacy single-string sceneSetup still works.
      const beats = (Array.isArray(p.beats) && p.beats.length) ? p.beats
        : (p.sceneSetup ? [{ speaker: 'character', kind: 'narration', text: p.sceneSetup }] : []);
      if (beats.length) {
        state.delivering = true;
        render();
        const myseq = ++deliverSeq;
        const dead = () => myseq !== deliverSeq;
        await revealScene(beats, dead);
        if (dead()) return;
        state.delivering = false;
      }
      render();
      setTimeout(() => { if (!composer.disabled) composer.focus(); }, 260);
    }

    // "See what your AI coach noticed" — the learner opens the queued debrief when
    // ready (after reading Kendra's reaction). The coach sheet RISES; the practice
    // (with the line) stays visible, dimmed, above it.
    async function openDebrief() {
      if (!state.awaitingDebrief || state.sending || state.delivering) return;
      const pending = state.pendingDebrief || [];
      state.pendingDebrief = null;
      state.awaitingDebrief = false;
      state.analyzing = false;
      state.mode = 'coaching'; state.inputTarget = 'coach';
      if (state.complete) { DEBRIEF.openClosing(pending); return; }   // final → the SHARED Section-3 debrief
      // The queued run is the phase DEBRIEF (coaching bubbles, including the next
      // entry's bridge) plus — when the next phase is a scene — its locked scene
      // open. The coaching lands in the sheet now; the scene beats are HELD for
      // the learner's own crossing (the return CTA), so a stimulus never paints
      // behind the sheet before they choose to step back in.
      const coachPart = [], scenePart = [];
      pending.forEach((m) => (worldOf(m) === 'scene' ? scenePart : coachPart).push(m));
      // If the coach's message is a hand-off back into the scene, offer the
      // return as its own reinforcing CTA (e.g. "Keep going →") rather than
      // making the learner type — the coach steps them across. Armed now, but the
      // CTA stays hidden (gated on state.delivering) until the coach finishes.
      if (state.debriefReturn) {
        state.pendingReturn = { mode: state.debriefReturn.mode, inputTarget: state.debriefReturn.inputTarget, sceneTarget: state.debriefReturn.sceneTarget, sceneSetup: state.debriefReturn.sceneSetup, beats: scenePart };
        state.returnLabel = state.debriefReturn.label;
        state.debriefReturn = null;
        state.awaitingReturn = true;
      } else if (scenePart.length) {
        // No return context armed but scene beats arrived — never drop them.
        scenePart.forEach((m) => { m._enter = true; state.messages.push(m); });
      }
      announce('Stepped out to your AI coach.');
      // Reveal the debrief one bubble at a time (typing beat between each), the
      // SAME as the opening prep — not a wall of text dumped in at once. The sheet
      // rises first (empty), each line types in, then the return CTA appears.
      const myseq = ++deliverSeq;
      const dead = () => myseq !== deliverSeq;
      state.delivering = true;
      render();   // the coach sheet rises (empty); the return CTA is held while delivering
      let prevText = '';
      for (let k = 0; k < coachPart.length; k++) {
        const m = coachPart[k];
        hideTyping();
        showTyping(); await wait(thinkingTime(prevText)); hideTyping();
        if (dead()) return;
        m._enter = true;
        state.messages.push(m);
        render();
        prevText = m.text || '';
        if (k < coachPart.length - 1) await wait(reducedMotion() ? 80 : 700);
        if (dead()) return;
      }
      state.delivering = false;
      render();   // now the return CTA (e.g. "Continue →") appears beneath the debrief
    }

    /* The FINAL debrief — stepper build-up, results modal paging, the
       resources hand-back and the exit — is the SHARED Section-3 flow
       (DEBRIEF, js/sim-debrief.js). Nothing close-shaped lives here anymore. */

    // "Step into the scene" — the learner crosses on their command. The coach
    // sheet LOWERS to reveal the live practice; the first scene line fades in.
    // (Same motion as every Learn→Practice switch — no special-case screen.)
    async function enterScene() {
      if (!state.awaitingEntry || state.hasEnteredScene || state.sending || state.delivering) return;
      const beats = (state.pendingScene || []).slice();
      state.pendingScene = null;
      state.awaitingEntry = false;
      state.entryPromptDismissed = false;
      state.hasEnteredScene = true;
      state.videoPlaying = false;   // the cold-open's job is done — swap its frozen frame for the real scene
      state.mode = 'scene'; state.inputTarget = 'character';
      state.delivering = true;
      announce('You step into the moment.');
      render();   // coach sheet lowers; the (empty) live scene is revealed beneath it
      // Reveal the break-room setup one beat at a time (narration → Jake behind a
      // typing indicator → the "what do you do?" cue), not all at once.
      const myseq = ++deliverSeq;
      const dead = () => myseq !== deliverSeq;
      await revealScene(beats, dead);
      if (dead()) return;
      state.delivering = false;
      render();
      setTimeout(() => { if (!composer.disabled) composer.focus(); }, 200);
    }

    // "Step out to AI coach" — a learner-initiated pause (not a coach debrief).
    function stepOut() {
      if (state.mode !== 'scene' || state.complete || state.sending || state.delivering || state.transitioning || state.awaitingDebrief) return;
      state.messages.push({ speaker: 'coach', kind: 'coaching', text:
`Timeout — we can pause here as long as you need. What's on your mind before you step back in?` });
      state.mode = 'coaching';
      state.inputTarget = 'coach';
      state.manualTimeout = true;
      announce('Scene paused. Timeout with your AI coach.');
      render();
      setTimeout(() => composer.focus(), 40);
    }

    // "Resume the scene" — go back into the roleplay (no message added).
    function resumeScene() {
      if (!state.hasEnteredScene || state.complete || state.delivering || state.sending) return;
      state.mode = 'scene';
      state.inputTarget = 'character';
      state.manualTimeout = false;
      state.awaitingReturn = false; state.pendingReturn = null;   // this covers it too
      announce('Back in the scene.');
      render();
    }

    // "Try a different approach" — truncate back to just before this YourSceneLine
    // and return to scene mode targeting the character (a pedagogical retry).
    function tryDifferentApproach(absIndex) {
      if (absIndex == null || absIndex < 0 || state.sending || state.delivering || state.transitioning) return;
      deliverSeq++;                          // cancel any in-flight reveal
      abortDelivery();
      // Rewind the LADDER too: the retried line may have closed a phase (tier
      // recorded, transitions applied) — restore the snapshot taken when it was
      // sent, so the model's [SYSTEM STATE] matches the truncated transcript.
      const target = state.messages[absIndex];
      if (target && target._arc) {
        const a = target._arc;
        state.phaseIdx = a.phaseIdx; state.turnsInPhase = a.turnsInPhase;
        state.ladder = { ...a.ladder }; state.vars = { ...a.vars }; state.lastTier = a.lastTier;
        state.scenePlaceholder = a.scenePlaceholder; state.entryLabel = a.entryLabel;
        state.sceneTarget = a.sceneTarget;
      }
      state.messages = state.messages.slice(0, absIndex);
      state.complete = false;
      state.mode = 'scene';
      state.inputTarget = 'character';
      state.manualTimeout = false;
      state.awaitingDebrief = false; state.pendingDebrief = null; state.analyzing = false;
      state.awaitingReturn = false; state.pendingReturn = null; state.returnLabel = null; state.debriefReturn = null;
      // recompute hasEnteredScene from the truncated history
      state.hasEnteredScene = state.messages.some((m) => worldOf(m) === 'scene');
      followStage = true;
      announce('Rewound. Try that line again.');
      render();
      setTimeout(() => composer.focus(), 40);
    }

    function restart() {
      deliverSeq++;                                       // cancel any in-flight reveal
      abortDelivery();
      introSeq++;   // abandon any in-flight video sequence
      document.querySelectorAll('#stage .intro-video').forEach((v) => { try { v.pause(); v.muted = true; } catch (e) {} });  // silence a mid-play cold open
      if (audioIntroHandle) { audioIntroHandle.stop(); audioIntroHandle = null; }  // stop any narration
      CONTEXT.reset();   // re-arm the Section-1 coupler for a fresh run
      Object.assign(state, {
        mode: 'coaching', inputTarget: 'coach', hasEnteredScene: false,
        started: false, messages: [], pendingOpening: initialMessages(),
        sending: false, complete: false, report: null, manualTimeout: false,
        transitioning: false, delivering: false, awaitingEntry: false, pendingScene: null,
        entryPromptDismissed: false, awaitingDebrief: false, pendingDebrief: null, analyzing: false,
        videoPlaying: false, audioIntroPlaying: false, closingStepperActive: false,
        awaitingResults: false, resultsModalOpen: false, resultsPage: 0, resultsViewed: false, continued: false,
        awaitingReturn: false, pendingReturn: null,
        debriefReturn: null, returnLabel: null, sceneTarget: null,
        // reset the app-owned arc engine + coverage
        phaseIdx: -1, turnsInPhase: 0, ladder: {}, vars: {}, lastTier: null,
        scenePlaceholder: '', entryLabel: '', covered: new Set(),
        // reset the Scene Sweep Observe phase
        marking: false, markStarted: false, briefUp: false, misses: 0,
        coachStarted: false, reportedToCoach: new Set(), lookAgainDismissed: false,
      });
      (ACTIVE_SCENARIO.state || []).forEach((v) => { if (v && v.key) state.vars[v.key] = v.initial || ''; });
      app.classList.remove('was-trap');
      followStage = true;
      announce('Practice restarted.');
      render();   // back to the scene anchor with an "Enter scenario" prompt
    }

    // "Chat with AI Coach" — the learner brings the coach in on their command. The
    // sheet rises over the scene anchor and the opening prep types in, one line at
    // a time, as if the coach is talking — never dumped in all at once.
    async function startSession(context) {
      if (state.started || state.sending || state.delivering) return;
      // Section 1 → Section 2, standardized: whatever intro modality ran, it
      // arrives here as ONE normalized ContextRecord (js/sim-context.js) —
      // the same coupler every simulator page flows through.
      SimContext.apply(context, {
        appendSystem: (t) => { SYSTEM_PROMPT += '\n\n' + t; },
        seed: (msgs) => { state.pendingOpening = [...msgs, ...(state.pendingOpening || [])]; },
      });
      // SCENE SWEEP diverges here: rather than raising the coach with a reflection
      // prompt, the learner first OBSERVES — a full-bleed photo they sweep for
      // hazards. The coach comes in later (React), on the learner's own crossing.
      if (IS_SWEEP) { enterMarking(); return; }
      state.started = true;
      state.mode = 'coaching'; state.inputTarget = 'coach';
      announce('Bringing in your AI coach.');
      render();                 // the sheet rises (empty) over the scene anchor
      await deliverOpening();   // each opening line types into the sheet, one by one
    }

    /* =====================================================================
       SCENE SWEEP — the Observe (mark) ⇄ React (coach) crossings.
       ===================================================================== */
    // Land in Observe: the full-bleed photo with the "Start looking" briefing.
    function enterMarking() {
      state.started = true;         // reveals the Observe|React toggle
      state.marking = true;
      state.mode = 'scene'; state.inputTarget = 'coach';   // footer is hidden in Observe anyway
      state.briefUp = true;
      announce('Take a slow look around the work area. Tap anything that looks unsafe.');
      render();                     // mounts the full-bleed Observe canvas
    }

    // Toggle → Observe: return to the photo to keep looking (mid-conversation too).
    function enterObserve() {
      if (!state.started || state.sending || state.delivering) return;
      state.marking = true;
      state.lookAgainDismissed = false;   // re-arm the nudge CTA for the next return
      state.mode = 'scene'; state.inputTarget = 'coach';
      announce('Back at the scene. Tap anything you missed.');
      render();
    }

    // Build the first-person summary of NEWLY-marked hazards to hand the coach.
    function freshMarkSummary(reason) {
      const fresh = HAZARDS.filter((h) => state.covered.has(h.id) && !state.reportedToCoach.has(h.id));
      fresh.forEach((h) => state.reportedToCoach.add(h.id));
      if (fresh.length) {
        return 'I marked ' + listJoin(fresh.map((h) => MARK_PHRASE[h.id] || String(h.short || '').toLowerCase())) + '.';
      }
      if (reason === 'stuck') return 'I’ve looked around, but I’m not sure what else is unsafe here.';
      return 'I’ve taken a look around the work area.';
    }

    // Cross to React: hand the coach what the learner marked. First crossing
    // raises the sheet, opens the Observe beat, and auto-sends the marks so the
    // coach credits them; a later crossing (after a "look again") sends only the
    // NEW finds, or just returns to the thread if nothing new was marked.
    async function crossToReact(reason) {
      if (state.sending || state.delivering) return;
      state.marking = false;
      state.mode = 'coaching'; state.inputTarget = 'coach';
      const fresh = HAZARDS.filter((h) => state.covered.has(h.id) && !state.reportedToCoach.has(h.id));

      if (!state.coachStarted) {
        state.coachStarted = true;
        state.phaseIdx = 0; state.turnsInPhase = 0;   // straight into Observe (marking replaced the free-text reflection)
        // a short, warm opener instead of the reflection prompt
        state.pendingOpening = [{ speaker: 'coach', kind: 'coaching',
          text: 'Good — you’ve had a look around. Let’s talk through what you flagged.' }];
        render();                 // the sheet rises (empty) over the blurred scene
        await deliverOpening();   // the opener types in
        composer.value = freshMarkSummary(reason);
        send();                   // hand the marks to the coach as the Observe input
        return;
      }
      // returning from a look-again
      if (fresh.length && state.phaseIdx === 0 && !state.complete) {
        render();
        composer.value = freshMarkSummary(reason);
        send();
      } else {
        announce('Back with your coach.');
        render();
      }
    }

    // Reveal the coach's opening prep message-by-message (typing beat between each),
    // so the first thing the learner sees is the coach "talking," not a wall of text.
    async function deliverOpening() {
      const myseq = ++deliverSeq;
      const dead = () => myseq !== deliverSeq;     // a restart mid-stream supersedes us
      const opening = state.pendingOpening || [];
      state.pendingOpening = null;
      state.delivering = true;
      render();
      for (let i = 0; i < opening.length; i++) {
        const m = opening[i];
        const prev = i > 0 ? opening[i - 1] : null;
        // The dominant beat: "thinking" long enough to read the previous message,
        // with the typing dots signalling that more is on the way.
        hideTyping();
        showTyping(); await wait(thinkingTime(prev ? prev.text : '')); hideTyping();
        if (dead()) return;
        m._enter = true;
        state.messages.push(m);
        render();
        // just a short settle so the next "thinking" doesn't start the same instant
        if (i < opening.length - 1) await wait(reducedMotion() ? 80 : 700);
        if (dead()) return;
      }
      state.delivering = false;
      render();
      if (!composer.disabled) composer.focus();
    }

    /* =====================================================================
       WIRING
       ===================================================================== */
    function autoGrow() {
      composer.style.height = 'auto';
      composer.style.height = Math.min(composer.scrollHeight, 120) + 'px';
    }
    composer.addEventListener('input', () => { autoGrow(); sendBtn.disabled = state.sending || state.complete || !composer.value.trim(); });
    composer.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
    sendBtn.addEventListener('click', send);
    // pre-entry this control begins the conversation; once entered it lowers the sheet
    resumeBtn.addEventListener('click', () => {
      if (resumeBtn.dataset.action === 'begin') enterScene();
      else resumeScene();
    });
    // Tap the dimmed peek behind the coach: sweep goes back to the photo (Observe),
    // every other scenario resumes its live scene.
    scrim.addEventListener('click', () => { if (IS_SWEEP) enterObserve(); else resumeScene(); });

    // Entry bar: the CTA steps in; "keep talking" hands the bar back to the composer.
    enterCtaBar.addEventListener('click', enterScene);
    keepTalkingBtn.addEventListener('click', () => {
      state.entryPromptDismissed = true;
      render();
      composer.focus();
    });
    // Sweep "look again" bar: the CTA drops back onto the photo; the escape hands
    // the composer back for a learner who'd rather tell the coach they're done.
    lookAgainCta.addEventListener('click', enterObserve);
    lookAgainType.addEventListener('click', () => {
      state.lookAgainDismissed = true;
      render();
      composer.focus();
    });
    // Debrief bar: open the queued coach debrief when the learner is ready.
    debriefCtaBtn.addEventListener('click', openDebrief);
    // Return bar: cross back into the scene on the learner's own command.
    returnCtaBtn.addEventListener('click', returnToScene);
    // Results bar: opens the shared debrief's results modal (never auto-shown).
    // Modal-footer nav is delegated INSIDE the shared debrief (makeFlow).
    resultsCtaBtn.addEventListener('click', DEBRIEF.openResults);
    // The practice's actual last step, once the resources have landed.
    continueCtaBtn.addEventListener('click', DEBRIEF.finish);

    // "Full conversation" — the SHARED coach-sheet expander
    // (js/sim-chat-history.js): a pill in the panel head grows the sheet to
    // nearly full screen height and overlays the complete transcript —
    // earlier coaching exchanges AND the scene context — in one consistent
    // treatment; "Latest only" (or Escape, or the sheet lowering) collapses
    // it back to the focused view every page opens with.
    SimChatHistory.attach({
      panel: coachPanel,
      body: coachPanelBody,
      messages: () => state.messages,
      characterName: (m) => m.name || SCENARIO.character,
      announce,
    });

    // Start bar: the Section-1 coupler (js/sim-context.js) picks the authored
    // intro modality — audio/reading via SceneContext, video via this page's
    // cold-open player, else none — and, whichever runs, hands Section 2 ONE
    // normalized ContextRecord via startSession(record).
    const CONTEXT = SimContext.create({
      intro: ACTIVE_SCENARIO.intro,
      modalities: {
        audio: { available: HAS_AUDIO_INTRO, enter: enterAudioIntro },
        video: { available: HAS_VIDEO_INTRO, enter: enterVideoIntro },
      },
      onDone: startSession,
    });
    startCtaBtn.addEventListener('click', CONTEXT.begin);
    introContinueBtn.addEventListener('click', finishAudioIntro);   // reading/audio context → bring the coach in

    // The mode toggle: tap the inactive segment to switch states (delegated, as
    // the toggle is rebuilt on every render). Disabled segments don't fire.
    modeIndicator.addEventListener('click', (e) => {
      const seg = e.target.closest('.seg');
      if (!seg || seg.disabled) return;
      const which = seg.dataset.seg;
      // SCENE SWEEP: the toggle swaps Observe (the photo) ⇄ React (the coach).
      if (IS_SWEEP) {
        if (which === state.mode) return;
        if (which === 'scene') enterObserve();          // → look at the scene again
        else crossToReact('toggle');                    // → the coach (credits new marks)
        return;
      }
      if (which === 'coaching' && !state.started) { CONTEXT.done({ modality: 'none' }); return; }  // begin (skips the intro)
      if (which === state.mode) return;               // already active
      if (which === 'coaching') {                     // → the coach layer
        if (state.awaitingDebrief) openDebrief();      // open the queued debrief
        else stepOut();                                // or a manual timeout
      } else if (which === 'scene') {                 // → the practice
        if (!state.hasEnteredScene && state.awaitingEntry) enterScene();  // first crossing
        else resumeScene();                           // back into the scene
      }
    });
    document.getElementById('restartBtn').addEventListener('click', restart);

    // Opening beat: anchor on the practice base ("Kendra's room") with an "Enter
    // scenario" prompt. The cold-open video and the coach sheet both stay down
    // until the learner chooses to begin.
    render();
    </script>

    <!-- ===== Course-delivery frame ===================================== -->
    <!-- Embedded into the .app flex column (not a fixed overlay), so it sits
         above the practice stage without fighting the app's fixed panels. No
         progress bar (this is a conversational sim, not a stepped lesson). -->
    <script>
      // Embed into the app shell; course/lesson auto-derive from #scenarioName.
      window.LESSON_FRAME = { mount: '#app' };
    </script>
    <script src="js/frame.js?v=3"></script>
    <script>
      // Relocate the app's Restart control onto the frame's actions slot so it
      // rides the frame instead of a second bar. Moving the node preserves its
      // click handler (attached above by element id).
      (function () {
        function relocate() {
          var slot = document.querySelector('.vt-frame .vt-actions');
          var btn  = document.getElementById('restartBtn');
          if (slot && btn) slot.appendChild(btn);
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', relocate);
        } else {
          relocate();
        }
      })();
    </script>
</body>
</html>
