    let SYSTEM_PROMPT = SS_TYPE ? SS_TYPE.compile(SS_TYPE.normalize(SS_SOURCE)) : '';   // let: the Section-1 coupler may append context addenda

    /* ---- STATE -------------------------------------------------------- */
    /* The coach's opening beat is SEEDED (not model-generated) so every
       learner meets the same SME-authored framing: the situation, then the
       non-evaluated reflection prompt. The learner's first reply kicks off
       Phase 1. */
    const initialMessages = () => ACTIVE_SCENARIO.opening.map((text) => (
      { speaker: 'coach', kind: 'coaching', text }
    ));

    const state = {
      mode: 'coaching',          // 'coaching' | 'scene'
      inputTarget: 'coach',      // 'coach' | 'character'
      hasEnteredScene: false,
      started: false,            // false until the learner taps "Chat with AI Coach" — we anchor on the scene first
      messages: [],              // empty until the learner begins; the opening prep streams in then
      pendingOpening: initialMessages(),  // the coach's opening prep, held until the learner begins
      sending: false,
      complete: false,
      report: null,              // live mode: model-written {strengths, growthAreas} for the results modal
      manualTimeout: false,      // true when the learner pressed "Step out to AI coach"
      transitioning: false,      // true during the "stepping into the scene" beat
      delivering: false,         // true while a turn is being revealed message-by-message
      awaitingEntry: false,      // coach has invited entry; waiting for the learner to step in
      pendingScene: null,        // the opening scene messages, held until the learner steps in
      entryPromptDismissed: false, // learner chose "keep talking" — show the composer, not the CTA
      awaitingDebrief: false,    // Kendra has reacted; a coach debrief is queued for when the learner is ready
      pendingDebrief: null,      // the queued coach debrief messages
      analyzing: false,          // transient: "Analyzing your response…" shows in the input bar
      videoPlaying: false,       // true while the cold-open video sequence owns the stage
      audioIntroPlaying: false,  // true while the narrated/reading context owns the stage (pre-coach)
      closingStepperActive: false, // true while the closing "Analyzing… Determining…" stepper runs
      awaitingResults: false,   // the closing recap has landed; footer offers "View full results"
      resultsModalOpen: false,  // the strengths/growth-areas modal is open
      resultsPage: 0,           // 0 = strengths, 1 = growth areas
      resultsViewed: false,     // learner has been through the modal (unlocks the resources message)
      continued: false,         // learner tapped the final "Continue" — the practice is fully settled
      awaitingReturn: false,    // the coach is ready to send the learner back into the scene; waiting for them to choose
      pendingReturn: null,      // { mode, inputTarget, sceneTarget } to apply once they do
      debriefReturn: null,      // if the debrief the learner is about to open is a coach-led transition BACK into the scene (e.g. "check in with Marshall"), the return context to arm once it's read
      returnLabel: null,        // custom label for the scene-return CTA (e.g. "Check in with Marshall")
      sceneTarget: null,        // who the learner is speaking to in the scene now (e.g. "Marshall") — drives the composer placeholder
      // —— THE LADDER ENGINE (app-owned; the model classifies, the app routes) ——
      phaseIdx: -1,             // -1 = reflection warm-up; 0..N-1 = live phases[phaseIdx]; >=N = ladder complete (model closes)
      turnsInPhase: 0,          // learner turns spent in the CURRENT phase (vs. its maxTurns cap)
      ladder: {},               // phase id → the tier the model reported when it closed that phase
      vars: {},                 // session-state variables (seeded from ACTIVE_SCENARIO.state below)
      lastTier: null,           // the most recently recorded tier — picks the next entry's bridge variant
      scenePlaceholder: '',     // the live phase's authored composer placeholder
      entryLabel: '',           // the live phase's authored crossing CTA ("Step into the room")
      covered: new Set(),       // scene sweep: rubric hazard ids the learner has spotted (drives the coverage rail)
      // —— SCENE SWEEP: the Observe (tap-to-mark) phase ——
      marking: false,           // true while the learner is in the Observe canvas (pre/return, tapping the photo)
      markStarted: false,       // they dismissed the briefing / made a first mark (bottom CTA appears)
      briefUp: false,           // the "Start looking" briefing overlay is up
      misses: 0,                // taps that hit nothing — a couple reveals the "stuck?" escape hatch
      coachStarted: false,      // the coach conversation has begun (first cross to React)
      reportedToCoach: new Set(), // hazard ids already summarized to the coach (re-cross only mentions new finds)
      lookAgainDismissed: false, // learner chose to type instead of going back to the photo on a nudge
    };
    // Seed the declared session state with its authored initial values.
    (ACTIVE_SCENARIO.state || []).forEach((v) => { if (v && v.key) state.vars[v.key] = v.initial || ''; });

    /* ---- helpers: classify + group ------------------------------------ */
    const worldOf = (m) => (m.kind === 'coaching' ? 'coaching' : 'scene');

    // trailing contiguous run of a given world at the end of the array
    function trailingRun(msgs, world) {
      const out = [];
      for (let i = msgs.length - 1; i >= 0 && worldOf(msgs[i]) === world; i--) out.unshift(msgs[i]);
      return out;
    }

    /* =====================================================================
       NO DEMO ENGINE — Marshall runs LIVE only (see WORKER_URL above). The
       five-phase coaching arc is model-driven end to end, so there is no
       scripted fallback to maintain. This stub exists solely so getTurn's
       demo branch stays defined; if the Worker is ever unset, it surfaces a
       plain notice rather than pretending to run the arc offline.
       ===================================================================== */
    function scriptedTurn() {
      return {
        turn: [{ speaker: 'coach', kind: 'coaching', text:
          'This scenario runs on a live AI coach, which isn’t reachable right now. Please try again in a moment.' }],
        mode: 'coaching', inputTarget: 'coach',
      };
    }

    /* ---- LIVE path — the shared turn engine (js/sim-core.js) ---------- */
    /* This page speaks the BRANCHING-ARC contract: the roleplay turn shape
       PLUS "action" ("continue" | "teach" | "redirect"), a calibration "tier"
       on every teach (recorded onto the ladder), per-message character names,
       and scene-transition hints. JSON repair, strict parse → retry-once →
       safe fallback, and the JSON-history serializer are the ONE shared
       implementation every simulator page uses. */
    const TIER_SET = new Set(
      (ACTIVE_SCENARIO.phases || []).flatMap((p) => (p.calibration || [])
        .map((t) => String(t.tier || '').trim().toUpperCase()).filter(Boolean)));
    const TURN_PARSER = SimCore.makeTurnParser({
      deliver: (id) => (ACTIVE_SCENARIO.phases || []).some((p) => p.id === id),
      action: true,                  // "continue" | "teach" | "redirect" — the app owns routing
      tier: (t) => { t = String(t || '').trim().toUpperCase(); return TIER_SET.has(t) ? t : null; },
      spotted: (id) => HAZARD_IDS.has(id),   // perception-grading: which hazards the learner has named
    });

    /* The per-turn [SYSTEM STATE] line: the app is the source of truth for
       WHICH phase is live, how many learner turns it has consumed vs. its cap,
       what the ladder recorded so far, and the session-state variables. We
       append it to the (otherwise static, cache-friendly) system prompt every
       call so the model reads its state instead of inferring it. */
    function arcStateBlock() {
      const phases = Array.isArray(ACTIVE_SCENARIO.phases) ? ACTIVE_SCENARIO.phases : [];
      if (!phases.length || state.complete) return '';
      const vars = (ACTIVE_SCENARIO.state || [])
        .map((v) => (v.label || v.key) + ': ' + (state.vars[v.key] || v.initial || '—')).join(' · ');
      if (state.phaseIdx < 0) {
        return '\n\n[SYSTEM STATE — Reflection warm-up. Calibrate only (do NOT evaluate, no tier); set "action":"teach". The app then opens Phase 1.]';
      }
      if (state.phaseIdx >= phases.length) {
        return '\n\n[SYSTEM STATE — the ladder is complete. You MUST set complete:true with the report on this turn (see COMPLETION).]';
      }
      const p = phases[state.phaseIdx];
      const cap = Math.max(1, p.maxTurns || 3);
      const used = state.turnsInPhase;
      const ladder = phases.filter((x) => state.ladder[x.id])
        .map((x) => (x.label || x.id) + ' = ' + state.ladder[x.id]).join(', ');
      // COVERAGE — only on the spot/observe beat. The app tracks which rubric
      // hazards are spotted (state.covered) and hands the model the running
      // count + the REMAINING hazards' zones, so its "look again" nudges point
      // at real misses and it closes once the target (or cap) is met.
      let coverage = '';
      if (p.kind === 'spot' && HAZARDS.length) {
        const remaining = HAZARDS.filter((h) => !state.covered.has(h.id));
        const spotN = HAZARDS.length - remaining.length;
        coverage = ' COVERAGE: ' + spotN + '/' + (COVERAGE.total || HAZARDS.length)
          + ' spotted (target ' + (COVERAGE.required || HAZARDS.length) + ').'
          + (remaining.length
              ? ' Still unspotted — nudge toward these ZONES without naming them: '
                + remaining.map((h) => '[' + h.id + '] ' + fillT(h.zone)).join('; ') + '.'
              : ' All hazards spotted — credit the last one and close the beat.');
      }
      return '\n\n[SYSTEM STATE — Beat ' + (state.phaseIdx + 1) + '/' + phases.length + ': ' + (p.label || p.id)
        + ' (' + (p.world === 'scene' ? 'SCENE' + (p.counterpart ? ' · ' + p.counterpart : '') : 'COACHING') + ').'
        + ' Learner turns used: ' + used + '/' + cap + '.'
        + coverage
        + (ladder ? ' Beats so far: ' + ladder + '.' : '')
        + (vars ? ' Session state — ' + vars + '.' : '')
        + (used >= cap
            ? ' THE CAP IS REACHED — you MUST set "action":"teach" on this turn: open with the verbatim talk-it-through line, deliver the debrief, and report the "tier". Do NOT continue.'
            : ' Set "action":"continue" to stay in the beat, or "action":"teach" (with a "tier") once the exit criteria are met.')
        + ']';
    }

    const TURN_ENGINE = SimCore.makeTurnEngine({
      // static compiled arc + the coupler's context addenda + the per-turn state
      // line. The big arc stays byte-identical across turns (prompt cache stays
      // warm); only the short [SYSTEM STATE] tail changes.
      system: () => SYSTEM_PROMPT + arcStateBlock(),
      maxTokens: 1600,
      parser: TURN_PARSER,
      history: SimCore.turnHistory({ name: true, owner: true }),
      scripted: scriptedTurn,        // "coach unreachable" stub — this arc is live end to end
    });
    const getTurn = TURN_ENGINE.getTurn;

    /* =====================================================================
       DOM REFS + tiny element helper
       ===================================================================== */
    const app           = document.getElementById('app');
    const modeIndicator = document.getElementById('modeIndicator');
    const stage         = document.getElementById('stage');
    const stageInner    = document.getElementById('stageInner');
    const scrim         = document.getElementById('scrim');
    const coachPanel    = document.getElementById('coachPanel');
    const coachPanelBody= document.getElementById('coachPanelBody');
    const resumeBtn     = document.getElementById('resumeBtn');
    const inputbar      = document.querySelector('.inputbar');
    const composer      = document.getElementById('composer');
    const sendBtn       = document.getElementById('sendBtn');
    const inputMain     = document.getElementById('inputMain');
    const inputEntry    = document.getElementById('inputEntry');
    const inputAnalyzing= document.getElementById('inputAnalyzing');
    const inputWatching = document.getElementById('inputWatching');
    const inputIntroContinue = document.getElementById('inputIntroContinue');
    const introContinueBtn   = document.getElementById('introContinueBtn');
    const inputDebrief  = document.getElementById('inputDebrief');
    const inputReturn   = document.getElementById('inputReturn');
    const returnCtaBtn  = document.getElementById('returnCtaBtn');
    const inputLookAgain= document.getElementById('inputLookAgain');
    const lookAgainCta  = document.getElementById('lookAgainCta');
    const lookAgainType = document.getElementById('lookAgainType');
    const inputStart    = document.getElementById('inputStart');
    const startCtaBtn   = document.getElementById('startCtaBtn');
    const enterCtaBar   = document.getElementById('enterCtaBar');
    const debriefCtaBtn = document.getElementById('debriefCtaBtn');
    const keepTalkingBtn= document.getElementById('keepTalkingBtn');
    const inputIcon     = document.getElementById('inputIcon');
    const inputHint     = document.getElementById('inputHint');
    const liveRegion    = document.getElementById('liveRegion');
    const inputResults  = document.getElementById('inputResults');
    const resultsCtaBtn = document.getElementById('resultsCtaBtn');
    // (the results modal's elements are owned by the shared debrief —
    //  SimDebrief.ensureModal() adopts the markup below)
    const inputContinue = document.getElementById('inputContinue');
    const continueCtaBtn= document.getElementById('continueCtaBtn');
    const inputDone      = document.getElementById('inputDone');

    function el(tag, cls, html) {
      const n = document.createElement(tag);
      if (cls) n.className = cls;
      if (html != null) n.innerHTML = html;
      return n;
    }
    const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

    /* —— SCENE SWEEP: the OBSERVE canvas (a full-bleed photo the learner taps
       to mark hazards) + the coverage rail (perception-grading made visible).

       The photo is the persistent base layer, mounted ONCE (render's mount
       guard) so it never reloads. In OBSERVE mode the learner taps it: a hit
       inside a hazard's hotspot drops a numbered pin and lights its chip; a
       miss shows a "nothing there" toast. Once the coverage TARGET is met (or
       they say they're stuck), a CTA hands off to the coach — REACT mode —
       where the coach credits what they marked (state.covered already feeds the
       [SYSTEM STATE] coverage line) and works Remediate → Prevent → close.
       The Observe|React toggle swaps between the two at will. */

    // A first-person phrase per hazard for the summary handed to the coach on
    // crossing (reads like the learner reporting, not a rubric dump).
    const MARK_PHRASE = {
      jug: 'the unlabeled jug on the bench',
      ppe: 'my coworker working with no gloves',
      sds: 'the out-of-date safety data sheet',
      label: 'the torn, unreadable label on the drum',
    };
    const SWEEP_REQUIRED = (COVERAGE && COVERAGE.required) || Math.max(1, HAZARDS.length - 1);
    const SWEEP_TOTAL = (COVERAGE && COVERAGE.total) || HAZARDS.length;
    function listJoin(items) {
      items = items.filter(Boolean);
      if (items.length <= 1) return items.join('');
      if (items.length === 2) return items[0] + ' and ' + items[1];
      return items.slice(0, -1).join(', ') + ', and ' + items[items.length - 1];
    }

    let sweepPhotoEl = null;
    function sweepSceneNode() {
      const wrap = el('div', 'sweep-scene');
      wrap.innerHTML =
        `<div class="sweep-stage">
           <img class="sweep-photo" id="sweepPhoto" src="${esc(SCENE_IMG)}" alt="${esc(SCENE_ALT)}" draggable="false" />
           <div class="sweep-hits" id="sweepHits"></div>
           <div class="sweep-pins" id="sweepPins"></div>
           <div class="sweep-toast" id="sweepToast">Nothing unsafe there</div>
           <div class="sweep-progress" id="sweepProgress" aria-live="polite"></div>
           <div class="sweep-cta-wrap" id="sweepCtaWrap"></div>
           <div class="sweep-brief" id="sweepBrief">
             <div class="sweep-brief-card">
               <div class="sweep-brief-eyebrow">Spot the hazard</div>
               <h2 class="sweep-brief-title">Take a slow look around.</h2>
               <p class="sweep-brief-sub">You just finished the training — now you’re on the floor. Tap anything that looks unsafe. Find at least ${SWEEP_REQUIRED}, then talk it through with your coach.</p>
               <button class="sweep-brief-btn" id="sweepBriefBtn"><i class="fa-solid fa-magnifying-glass"></i> Start looking</button>
             </div>
           </div>
         </div>`;
      sweepPhotoEl = wrap.querySelector('#sweepPhoto');
      wrap.querySelector('#sweepHits').addEventListener('click', onSweepTap);
      wrap.querySelector('#sweepBriefBtn').addEventListener('click', dismissBrief);
      // keep pins glued to their spots as the photo's drawn rect changes
      sweepPhotoEl.addEventListener('load', repositionPins);
      return wrap;
    }

    // The photo is object-fit:contain, so it's letterboxed inside its box.
    // Compute the DRAWN image rect (offset + size) within the <img> element so
    // taps and pins map to the picture, not the letterbox bars.
    // The letterbox geometry + hit-test are the SHARED module (window.SceneSweepGeo,
    // defined in scene-sweep.js) so the learner's "tap it" math is byte-identical
    // to the Studio author's "place it" math — they can never drift.
    function imgDrawRect() { return SceneSweepGeo.drawRect(sweepPhotoEl); }

    // author helper: append ?author=1 to log normalized tap coords for placing
    // hazard hotspots without guessing (mirrors immersive.html's authoring mode).
    const SWEEP_AUTHOR = new URLSearchParams(location.search).has('author');

    function onSweepTap(e) {
      if (state.mode !== 'scene' || state.briefUp) return;
      const img = sweepPhotoEl; if (!img) return;
      const n = SceneSweepGeo.toNormalized(img, e.clientX, e.clientY);
      if (!n) return;   // tap landed in the letterbox, not the picture
      if (SWEEP_AUTHOR) { console.log(`[author] x:${n.x.toFixed(3)}, y:${n.y.toFixed(3)}`); showSweepMiss('x ' + n.x.toFixed(2) + ', y ' + n.y.toFixed(2)); return; }
      const hit = SceneSweepGeo.hitTest(HAZARDS, n.x, n.y, state.covered);
      if (hit) markHazard(hit);
      else showSweepMiss();
    }

    function markHazard(h) {
      state.covered.add(h.id);
      state.markStarted = true;
      dropPin(h);
      updateObserveHud();
      updateCoachRail();
      const n = HAZARDS.filter((x) => state.covered.has(x.id)).length;
      announce('Marked ' + h.short + '. ' + n + ' of ' + SWEEP_TOTAL + ' found.');
    }

    function dropPin(h) {
      const pins = document.getElementById('sweepPins'); if (!pins) return;
      const idx = HAZARDS.filter((x) => state.covered.has(x.id)).length;   // 1-based order marked
      const pin = el('div', 'sweep-pin');
      pin.dataset.hz = h.id;
      pin.innerHTML = `<div class="sweep-pin-ring"><span class="n">${idx}</span></div><div class="sweep-pin-label">${esc(h.short)}</div>`;
      pins.appendChild(pin);
      positionPin(pin, h, imgDrawRect());
    }
    function positionPin(pin, h, dr) {
      dr = dr || imgDrawRect();
      if (!dr || !h.spot) return;
      pin.style.left = (dr.left + h.spot.x * dr.width) + 'px';
      pin.style.top  = (dr.top + h.spot.y * dr.height) + 'px';
    }
    function repositionPins() {
      const pins = document.getElementById('sweepPins'); if (!pins) return;
      const dr = imgDrawRect(); if (!dr) return;
      Array.from(pins.children).forEach((pin) => {
        const h = HAZARDS.find((x) => x.id === pin.dataset.hz);
        if (h) positionPin(pin, h, dr);
      });
    }

    let sweepToastTimer = 0;
    function showSweepMiss(msg) {
      if (!SWEEP_AUTHOR) state.misses = (state.misses || 0) + 1;
      const t = document.getElementById('sweepToast');
      if (t) {
        t.textContent = msg || 'Nothing unsafe there';
        t.classList.add('on');
        clearTimeout(sweepToastTimer);
        sweepToastTimer = setTimeout(() => t.classList.remove('on'), 1300);
      }
      updateObserveHud();   // a couple of misses reveals the "stuck?" escape hatch
    }

    function dismissBrief() {
      state.briefUp = false;
      state.markStarted = true;
      const b = document.getElementById('sweepBrief'); if (b) b.classList.add('is-out');
      updateObserveHud();
    }

    // Refresh the Observe HUD (top progress pill + bottom CTA cluster). Called
    // on every mark/miss and on render while the canvas is mounted.
    function updateObserveHud() {
      const n = HAZARDS.filter((h) => state.covered.has(h.id)).length;
      const prog = document.getElementById('sweepProgress');
      if (prog) {
        const dots = HAZARDS.map((h) => `<span class="dot ${state.covered.has(h.id) ? 'on' : ''}"></span>`).join('');
        prog.innerHTML = `<span class="lbl"><i class="fa-solid fa-magnifying-glass"></i> Found ${n} of ${SWEEP_TOTAL}</span><span class="dots">${dots}</span>`;
      }
      const wrap = document.getElementById('sweepCtaWrap');
      if (wrap) {
        const met = n >= SWEEP_REQUIRED;
        const stuck = !met && (state.misses >= 2 || n >= 1);
        let html = '';
        if (!state.markStarted) {
          html = '';   // briefing still owns the moment
        } else if (met) {
          html = `<button class="sweep-react-cta" id="sweepReactCta"><i class="fa-solid fa-comments"></i> Talk it through with your coach <i class="fa-solid fa-arrow-right arrow"></i></button>`;
        } else {
          html = `<div class="sweep-hint">Keep looking — tap anything unsafe</div>`;
          if (stuck) html += `<button class="sweep-stuck" id="sweepStuckBtn"><i class="fa-solid fa-comment"></i> Stuck? Talk it through with your coach</button>`;
        }
        wrap.innerHTML = html;
        const rc = wrap.querySelector('#sweepReactCta'); if (rc) rc.addEventListener('click', () => crossToReact('found'));
        const sc = wrap.querySelector('#sweepStuckBtn'); if (sc) sc.addEventListener('click', () => crossToReact('stuck'));
      }
    }

    // The coverage chip rail — lives at the top of the coach sheet in React mode
    // so the coach's credit maps to the chips. Managed by id (reconcile leaves it).
    function updateCoachRail() {
      const coachUp = state.mode === 'coaching' && state.started;
      let rail = document.getElementById('sweepRail');
      if (IS_SWEEP && coachUp && state.coachStarted) {
        if (!rail) { rail = el('div', 'sweep-rail'); rail.id = 'sweepRail'; rail.setAttribute('aria-label', 'Hazards spotted'); }
        if (rail.parentNode !== coachPanelBody || coachPanelBody.firstChild !== rail) coachPanelBody.insertBefore(rail, coachPanelBody.firstChild);
        renderRailInto(rail);
      } else if (rail) {
        rail.remove();
      }
    }
    function renderRailInto(rail) {
      const spotN = HAZARDS.filter((h) => state.covered.has(h.id)).length;
      // labels stay hidden until caught during the spot beat (spot-the-hazard);
      // once the Observe debrief has run (past the spot beat) every hazard is named.
      const spotIdx = (ACTIVE_SCENARIO.phases || []).findIndex((p) => p.id === SPOT_PHASE_ID);
      const revealAll = state.phaseIdx > spotIdx || state.complete;
      const chips = HAZARDS.map((h) => {
        const got = state.covered.has(h.id);
        const label = (got || revealAll) ? esc(h.short) : 'Not yet spotted';
        return `<div class="sweep-chip${got ? ' got' : (revealAll ? ' missed' : '')}">
            <i class="fa-solid ${got ? 'fa-circle-check' : (revealAll ? 'fa-circle-exclamation' : 'fa-circle-question')}"></i>
            <span>${label}</span>
          </div>`;
      }).join('');
      rail.innerHTML =
        `<div class="sweep-rail-head">
           <span class="sweep-rail-ttl"><i class="fa-solid fa-magnifying-glass"></i> Hazards spotted</span>
           <span class="sweep-rail-count">${spotN}<span>/${SWEEP_TOTAL}</span></span>
         </div>
         <div class="sweep-chips">${chips}</div>`;
    }

    // keep pins aligned when the viewport resizes (the drawn photo rect moves)
    addEventListener('resize', () => { if (IS_SWEEP) repositionPins(); });

    // Built ONCE per video phase and never re-rendered mid-playback (render()
    // isn't called again until finishVideoIntro) — every clip gets its own
    // <video preload="auto">, so all six start buffering in the background the
    // moment this mounts, well before any of them needs to actually play.
    function videoNode() {
      const wrap = el('div', 'scene-video');
      const videos = INTRO_SCENES.map((s, i) =>
        `<video class="intro-video" data-idx="${i}" ${INTRO_VIDEO_SOUND ? '' : 'muted'} playsinline preload="auto" src="${esc(s.src)}" aria-label="Scene-setting video, part ${i + 1} of ${INTRO_SCENES.length}"></video>`
      ).join('');
      wrap.innerHTML = videos +
        `<div class="intro-caption-wrap"><p class="intro-caption" id="introCaption" aria-live="polite"></p></div>
         <button class="intro-playpause" id="introPlayPauseBtn" aria-label="Pause">
           <i class="fa-solid fa-pause"></i>
         </button>
         <button class="intro-skip" id="introSkipBtn" aria-label="Skip intro video">
           Skip <i class="fa-solid fa-forward"></i>
         </button>
         <button class="intro-begin" id="introBeginBtn" hidden>
           <i class="fa-solid fa-circle-play"></i> Tap to begin
         </button>
         <div class="intro-loading" id="introLoading"><span class="dots"><span></span><span></span><span></span></span></div>`;
      return wrap;
    }

    /* ---- message node builders (used by the practice stage and coach sheet) --
       A transient `_enter` flag (set when a message is freshly delivered) adds
       the .enter class so the node fades in once; render() clears the flag. */
    const ec = (m) => (m && m._enter ? ' enter' : '');

    /* Word-by-word reveal HTML for a NARRATION line — each word fades/de-blurs
       on a short stagger so the line reads as if it's being narrated. Only used
       on the freshly-delivered render (m._enter); plain text otherwise, so a
       re-render doesn't replay it. */
    function revealHTML(text) {
      let i = 0;
      return esc(text).split(/(\s+)/).map((tok) => {
        if (!tok || /^\s+$/.test(tok)) return tok;
        const d = Math.min(i * 28, 480); i++;   // brisk cascade, finishes within the settle window
        return `<span class="rvl" style="animation-delay:${d}ms">${tok}</span>`;
      }).join('');
    }
    const narrationHTML = (m) => (m && m._enter ? revealHTML(m.text) : esc(m.text));

    /* Restage a first-person action into the second-person cinematic voice
       ("I step in beside Marshall" → "You step in beside Marshall"). Pure
       pronoun/verb transform — it never rewrites content, so there's no
       distortion (and no LLM round-trip). Applied ONLY to the learner's action
       narration; their spoken words (in quotes) are always kept verbatim. */
    function toSecondPerson(text) {
      let s = String(text || '').trim();
      const rules = [
        [/\bI['’]m\b/gi, "you're"],
        [/\bI am\b/g, 'you are'],
        [/\bI was\b/g, 'you were'],
        [/\bI['’]d\b/gi, "you'd"],
        [/\bI['’]ll\b/gi, "you'll"],
        [/\bI['’]ve\b/gi, "you've"],
        [/\bI\b/g, 'you'],
        [/\bmyself\b/gi, 'yourself'],
        [/\bmine\b/gi, 'yours'],
        [/\bMy\b/g, 'Your'], [/\bmy\b/g, 'your'],
        [/\bMe\b/g, 'You'], [/\bme\b/g, 'you'],
      ];
      rules.forEach(([re, rep]) => { s = s.replace(re, rep); });
      // capitalize the first letter of each sentence (e.g. "you step" → "You step")
      return s.replace(/(^|[.!?]\s+)([a-z])/g, (m, p, c) => p + c.toUpperCase());
    }

    /* Split a learner's scene input into ACTION (what they do → narration) and
       SPEECH (what they say → a bubble). Rule the placeholder teaches: anything
       in "quotes" is spoken aloud; a line starting with "I …" is an action;
       otherwise a bare line is treated as speech. The raw text still goes to the
       model verbatim (this only drives DISPLAY, via the message's _display). */
    function splitSceneInput(raw) {
      const t = String(raw || '').trim();
      const quoteRe = /[“”][^“”]*[“”]|"[^"]*"|'[^']*'/g;
      const found = t.match(quoteRe);
      if (found && found.length) {
        const speech = found.map((q) => q.replace(/^[\s"'“”]+|[\s"'“”]+$/g, '').trim()).filter(Boolean);
        let action = t.replace(quoteRe, ' ').replace(/\s{2,}/g, ' ').trim();
        // drop a dangling speech connector ("… and say", "… tells him:", "…:")
        action = action.replace(/[,:—-]*\s*(and|then|,)?\s*(says?|said|yells?|shouts?|adds?|tells?\s+\w+)\s*[:,]?\s*$/i, '').replace(/[\s,:—-]+$/, '').trim();
        const beats = [];
        if (action && /[a-z0-9]/i.test(action)) beats.push({ kind: 'narration', text: toSecondPerson(action) });
        speech.forEach((s) => beats.push({ kind: 'dialogue', text: s }));
        return beats.length ? beats : [{ kind: 'dialogue', text: t }];
      }
      if (/^(i |i'd |i would |i'll |i'm |i am |i just )/i.test(t)) return [{ kind: 'narration', text: toSecondPerson(t) }];
      return [{ kind: 'dialogue', text: t }];
    }

    /* AI split — the reliable path for free-form input (no quotes needed). A fast
       Haiku call returns {action, speech}; we render action as a second-person
       stage line and speech as the "You" bubble. The learner's RAW text still
       goes to the reaction model verbatim — this only refines the DISPLAY, and on
       any failure the line stays as the learner typed it, so input is never lost. */
    /* The say/do split system prompt — a small, scenario-NEUTRAL splitter shared by
       every Guided Arc scene (the author toggles it via scene.sayDoSplit, and names
       the people via scene.characters; the splitter itself needs no scenario detail).
       Kept static so the FAST-model call stays cache-friendly. */
    const SPLIT_SYSTEM = 'You split a person\'s move in a live role-play scene into what they DO and what they SAY, for display. ALWAYS return ONLY a JSON object — start with { and end with } — never ask a question, never explain, never refuse, even if the move is short or ambiguous. Shape: {"action":"...","speech":"..."}.\n- "action": what they physically do (step, look, turn, stand, move toward someone), rewritten in SECOND person ("You step in beside them"). Use "" if they only speak.\n- "speech": the words they say out loud. If they already quoted themselves, use those words VERBATIM. If they only DESCRIBED what they would say ("I\'d tell him to knock it off", "ask her to stop"), TRANSPOSE it into the plainest first-person line they would actually speak in the moment — keep their exact tone, directness, and content.\n- TRANSPOSE, NEVER IMPROVE: do not soften, sharpen, add courtesy or tact, clean up, or make them sound more articulate than they wrote. Match their register — blunt stays blunt, rude stays rude. Never invent words for a purely physical action, and never add content they did not express. Use "" if they only act.\n- A speech verb (tell/say/ask/warn/snap/yell) signals SAY → transpose it to speech. Only truly physical, non-verbal moves are action.\nExamples:\n"step between them" -> {"action":"You step between them","speech":""}\n"knock it off" -> {"action":"","speech":"Knock it off"}\n"I\'d tell him to shut up" -> {"action":"","speech":"Shut up"}\n"tell him to drop it and then check on her after" -> {"action":"You turn to check on her after","speech":"Drop it"}\n"I\'d calmly ask him to please stop" -> {"action":"","speech":"Please stop"}\n"I look over and say cut it out" -> {"action":"You look over","speech":"Cut it out"}';
    async function splitSceneInputAI(text) {
      const raw = await SimCore.callModel({
        model: SimCore.MODELS.FAST,
        maxTokens: 200,
        system: SPLIT_SYSTEM,
        messages: [{ role: 'user', content: String(text || '') }],
      });
      const obj = SimCore.parseJson(raw) || {};
      const action = String(obj.action || '').trim();
      const speech = String(obj.speech || '').trim();
      const beats = [];
      if (action) beats.push({ kind: 'narration', text: action });
      if (speech) beats.push({ kind: 'dialogue', text: speech });
      return beats.length ? beats : null;
    }
    /* Resolve the learner's scene move for display ONCE: try the fast AI split
       (what they DO vs SAY), fall back to the deterministic local split, and never
       lose their words. Awaited by send() while a "considering…" loader stands in,
       so the finished move renders a single time — no raw-text-then-re-split flash. */
    async function finalizeYouDisplay(msg) {
      let beats = null;
      try { beats = await splitSceneInputAI(msg.text); } catch (e) { /* fall through */ }
      if (!beats || !beats.length) beats = splitSceneInput(msg.text);   // deterministic fallback
      msg._display = (beats && beats.length) ? beats : [{ kind: 'dialogue', text: msg.text }];
      msg._pending = false;
      msg._enter = true;   // re-arm so the resolved move fades in as it replaces the loader
    }

    function coachNode(m) {
      const wrap = el('div', 'coach-msg' + ec(m));
      wrap.appendChild(el('div', 'coach-avatar', '<i class="fa-solid fa-chalkboard-user"></i>'));
      const body = el('div', 'coach-body');
      body.appendChild(el('div', 'coach-label', 'AI Coach'));
      body.appendChild(el('div', 'coach-bubble', esc(m.text)));
      wrap.appendChild(body);
      return wrap;
    }
    function youCoachNode(m) {
      const wrap = el('div', 'you-coach' + ec(m));
      wrap.appendChild(el('div', 'cap', 'You'));
      wrap.appendChild(el('div', 'bubble', esc(m.text)));
      return wrap;
    }
    function charNode(m, isConsequence) {
      // narration-only line (no dialogue) → quiet centered scene-setting text.
      // The outcome narration that lands right after the learner acts is the
      // CONSEQUENCE tier (larger, spotlit) — flagged by the caller.
      if (m.kind === 'narration') return el('div', 'scene-narration' + (isConsequence ? ' consequence' : '') + ec(m), narrationHTML(m));
      const wrap = el('div', 'char-line' + ec(m));
      // Per-message speaker (m.name) so a second in-scene character (Marshall)
      // is labeled correctly; falls back to the scenario's default character.
      const speaker = m.name || SCENARIO.character;
      wrap.appendChild(el('div', 'char-avatar', esc(speaker.charAt(0))));
      const body = el('div', 'char-body');
      const head = el('div', 'char-head');
      head.appendChild(el('span', 'char-name', esc(speaker)));
      // emotionalState is intentionally NOT rendered as a chip in this scenario —
      // the emotion lives in the words + narration, not a clinical label.
      body.appendChild(head);
      body.appendChild(el('div', 'char-bubble', esc(m.text)));
      wrap.appendChild(body);
      return wrap;
    }
    /* Render the learner's scene contribution, SPLIT: what they DO renders as a
       centered action line (you-narration); what they SAY renders in the amber
       "You" bubble. Driven by m._display (set in send() via splitSceneInput);
       falls back to one bubble for older/plain messages. One retry per turn. */
    function appendYouBeats(card, m, absIndex, interactive) {
      // While the say/do split is still resolving, stand in with a "considering…"
      // loader on the You side — the move then renders ONCE (never raw-then-split).
      if (m._pending) {
        const wrap = el('div', 'you-scene' + ec(m));
        wrap.appendChild(el('div', 'cap', `<i class="fa-solid fa-quote-right"></i> ${esc(ACTIVE_SCENARIO.sceneLineCaption || 'You')}`));
        wrap.appendChild(el('div', 'you-loading', '<span></span><span></span><span></span>'));
        card.appendChild(wrap);
        return;
      }
      const disp = (Array.isArray(m._display) && m._display.length)
        ? m._display
        : [{ kind: (m.kind === 'narration' ? 'narration' : 'dialogue'), text: m.text }];
      const showRetry = interactive && !state.complete;
      const retryNode = () => {
        const r = el('button', 'retry', '<i class="fa-solid fa-arrows-rotate"></i> Try a different approach');
        r.addEventListener('click', () => tryDifferentApproach(absIndex));
        return r;
      };
      // ACTION lines first (centered), in order.
      disp.filter((b) => b.kind === 'narration').forEach((b) => {
        card.appendChild(el('div', 'you-narration' + ec(m), esc(b.text)));
      });
      // SPEECH lines grouped under one "You" bubble stack (retry lives here).
      const speech = disp.filter((b) => b.kind === 'dialogue');
      if (speech.length) {
        const wrap = el('div', 'you-scene' + ec(m));
        wrap.appendChild(el('div', 'cap', `<i class="fa-solid fa-quote-right"></i> ${esc(ACTIVE_SCENARIO.sceneLineCaption || 'You')}`));
        speech.forEach((b) => wrap.appendChild(el('div', 'bubble', esc(b.text))));
        if (showRetry) wrap.appendChild(retryNode());
        card.appendChild(wrap);
      } else if (showRetry) {
        const holder = el('div', 'you-narration-actions');
        holder.appendChild(retryNode());
        card.appendChild(holder);
      }
    }
    // narration that belongs to a character line WITH dialogue is rendered inside
    // the card as italic lead-in; we handle that by emitting it as its own node.

    // The LIVE immersive stage shows the scene as ONE continuous stage — every
    // scene-world message, in order, with coaching omitted (coaching happens as
    // overlays/timeouts, never fragmenting the scene). Each YourSceneLine keeps
    // its TRUE index so "Try a different approach" truncates to the right place.
    function sceneCardAll(msgs, interactive) {
      const card = el('div', 'stage-card');
      card.appendChild(el('div', 'scene-tag', '<i class="fa-solid fa-circle"></i> Scene'));
      // Track the previous scene speaker so the FIRST narration after a learner
      // action renders as the emphasized CONSEQUENCE tier (the outcome of what
      // they just did) — ambient scene-setting narration stays quiet.
      let prevSceneSpeaker = null;
      msgs.forEach((m, idx) => {
        if (worldOf(m) !== 'scene') return;
        if (m.speaker === 'character') {
          const isConsequence = m.kind === 'narration' && prevSceneSpeaker === 'you';
          card.appendChild(charNode(m, isConsequence));
        } else if (m.speaker === 'you') {
          appendYouBeats(card, m, idx, interactive);
        }
        prevSceneSpeaker = m.speaker;
      });
      return card;
    }

    /* ---- the resources card, presented AS a coach message (same avatar +
       label + bubble as every other coach line) rather than a separate boxed
       widget — it's the coach sharing something, not a bolted-on component. -- */
    /* ---- the resources card, presented AS a coach message — built by the
       SHARED Section-3 debrief (js/sim-debrief.js). Marshall's resources are
       HR/policy/EEOC; elevatedStakes is false so no crisis floor is added. */
    const fillTxt = (t) => AitheraScenario.fill(t, ACTIVE_SCENARIO);
    const resourcesNode = () => SimDebrief.resourcesNode({
      lead: ACTIVE_SCENARIO.resources.lead,
      items: ACTIVE_SCENARIO.resources.items,
      crisisFloor: ACTIVE_SCENARIO.elevatedStakes ? AitheraScenario.CRISIS_FLOOR : null,
      fill: fillTxt,
    });

    /* ---- the closing summary — the SHARED Section-3 debrief ------------
       (js/sim-debrief.js). This page supplies only CONTENT — the safety-net
       lists below and the guaranteed nine-component playbook — plus hooks. */
    // Safety-net lists, shown only if a live turn ever arrives WITHOUT a
    // report. In normal operation the model writes strengths and growth areas
    // from what the learner actually said (state.report).
    // Generic safety-net lists — shown ONLY if a live turn ever arrives without a
    // report (in normal operation the model writes strengths/growth from what the
    // learner actually said). Kept scenario-neutral so any Guided Arc can use them.
    const CLOSING_STRENGTHS = [
      { icon: 'fa-circle-check', title: 'You engaged the questions', body: `You worked the reasoning through rather than brushing past it.` },
      { icon: 'fa-comments', title: 'You thought it through out loud', body: `You committed to a real answer at each step, which is where the learning lands.` },
    ];
    const CLOSING_GROWTH = [
      { icon: 'fa-arrow-trend-up', title: 'Keep going a step further', body: `Push past the first read — the strongest responses name the impact and the concrete next move.` },
    ];

    /* Pages: strengths → growth areas → the playbook. The playbook is the
       expert-validated toolkit every learner leaves with, IDENTICAL for
       everyone regardless of path — writer-authored (nine components); the
       shared debrief guarantees it renders on completion, never generated.
       Marshall keeps its own playbook icon set (legal/workplace themed). */
    const PLAYBOOK_ICONS = ['fa-list-check', 'fa-triangle-exclamation', 'fa-phone-volume', 'fa-stairs', 'fa-file-lines', 'fa-people-group'];
    const DEBRIEF_PAGES = SimDebrief.reportPages({
      report: () => state.report,                 // read at open time — it rides the final turn
      fallbackStrengths: CLOSING_STRENGTHS,
      fallbackGrowth: CLOSING_GROWTH,
      playbook: (ACTIVE_SCENARIO.playbook || []).map((p, i) => ({
        icon: PLAYBOOK_ICONS[i % PLAYBOOK_ICONS.length],
        title: fillTxt(p.title || ''), body: fillTxt(p.body || ''),
      })),
    });
    const DEBRIEF = SimDebrief.makeFlow({
      state,
      appEl: app,
      refs: SimDebrief.ensureModal(),             // adopts the #resultsModal markup below
      steps: SimDebrief.STEPS,
      pages: DEBRIEF_PAGES,
      results: { source: 'final-turn' },          // the report rode the complete:true turn
      seq: { guard: () => { const my = ++deliverSeq; return () => my !== deliverSeq; } },
      ui: {
        render, announce, showTyping, hideTyping,
        stepperContainer: () => coachPanelBody,
        pushMessage: (m) => { m._enter = true; state.messages.push(m); },
        pushCoachLine: (text) => state.messages.push({ speaker: 'coach', kind: 'coaching', _enter: true, text }),
        focusFallback: () => continueCtaBtn.focus(),
      },
    });

    /* =====================================================================
       RENDER  — paint everything from state
       ===================================================================== */
    let typingHost = null;     // where the typing indicator currently lives

    /* Render the coach sheet INCREMENTALLY instead of wiping + rebuilding its
       innerHTML every render (which reset scrollTop to 0, so every new bubble
       slammed the thread from the top). Each coach message keeps ONE node, cached
       by message identity; a render just appends the new ones and drops stale
       ones — the typing indicator and resources card are left in place. Scroll
       position is preserved, so following the thread is a small, gentle move. */
    const coachNodeMap = new WeakMap();
    function reconcileCoachBody(run) {
      const desired = run.map((m) => {
        let node = coachNodeMap.get(m);
        if (!node) {
          node = (m.speaker === 'you') ? youCoachNode(m) : coachNode(m);
          node.dataset.coachMsg = '1';
          coachNodeMap.set(m, node);
        }
        return node;
      });
      const keep = new Set(desired);
      Array.from(coachPanelBody.children).forEach((child) => {
        if (child.dataset && child.dataset.coachMsg === '1' && !keep.has(child)) child.remove();
      });
      const typing = document.getElementById('typingNode');
      desired.forEach((node) => {
        if (node.parentNode !== coachPanelBody) coachPanelBody.insertBefore(node, typing || null);
      });
      if (typing && typing.parentNode === coachPanelBody) coachPanelBody.appendChild(typing);  // keep dots last
    }

    /* Lift the coach's ACTIVE question out of the teaching stream. The coach mixes
       teaching and asking; the ONE bubble the learner must answer right now is the
       latest coach line that hands a "?" back with no reply yet. We tag its cached
       node .is-prompt (float + faint lit edge) and, the first render it becomes
       active, .just-asked for a one-time settle. It clears the
       moment the learner replies (the last coaching message becomes their own) — an
       answered probe is history, not a task. Works off text alone (a "?" anywhere
       in the handed-back line — a question may trail an imperative, e.g. "…does
       this qualify? Walk me through it."), so it needs nothing new from the model
       and degrades gracefully everywhere. */
    let activePromptMsg = null;
    function markActivePrompt(msgs, complete) {
      // Only the LAST coaching-world message can be the live prompt: if it's a
      // coach bubble that poses a question (a "?" anywhere in it), the turn was
      // handed back and is unanswered; a 'you' reply sitting last means it was
      // already answered → nothing active.
      let cand = null;
      if (!complete) {
        for (let i = msgs.length - 1; i >= 0; i--) {
          if (worldOf(msgs[i]) !== 'coaching') continue;   // skip a trailing scene run
          const m = msgs[i];
          if (m.speaker === 'coach' && /\?/.test(String(m.text || ''))) cand = m;
          break;   // decided by the last coaching message only
        }
      }
      if (cand === activePromptMsg) return;                // unchanged → don't re-glow
      const prev = activePromptMsg && coachNodeMap.get(activePromptMsg);
      if (prev) prev.classList.remove('is-prompt', 'just-asked');
      activePromptMsg = cand;
      const node = cand && coachNodeMap.get(cand);
      if (node) {
        node.classList.add('is-prompt');
        // Glow ONCE, only when it's freshly delivered — never on resume/re-render.
        if (cand._enter) {
          node.classList.add('just-asked');
          setTimeout(() => node.classList.remove('just-asked'), 1400);
        }
      }
    }

    /* WhatsApp-style grouping: within the trailing coaching run, a contiguous
       block of coach messages is ONE identity — the "AI Coach" name shows on the
       FIRST, the avatar attaches to the LAST. We toggle grp-first/grp-last per
       render, so the avatar hops to the newest bubble as a burst streams and the
       run re-splits when a learner reply lands between coach turns. A 'you' reply
       (or any non-coach message) breaks the group. */
    function markCoachGroups(run) {
      for (let i = 0; i < run.length; i++) {
        const m = run[i];
        if (m.speaker !== 'coach') continue;
        const node = coachNodeMap.get(m);
        if (!node) continue;
        const prev = run[i - 1], next = run[i + 1];
        node.classList.toggle('grp-first', !prev || prev.speaker !== 'coach');
        node.classList.toggle('grp-last',  !next || next.speaker !== 'coach');
      }
    }

    /* —— The coach sheet's rise + follow-scroll motion ————————————————————————
       Bottom-anchored, it eases the WHOLE sheet (header + thread) up as it grows
       and glides the thread smoothly once it's maxed out. That logic is shared
       across every simulator page in js/sim-coach-sheet.js — see that file's
       header for the mechanics (and the snap bug it was extracted to kill).
         coachSheet.follow({nearBottom, delivering})  — call from render()
         coachSheet.pin()                             — grow-or-pin (typing dots)
         coachSheet.reset()                           — forget height (sheet lowered) */
    const coachSheet = SimCoachSheet.create({ app, panel: coachPanel, body: coachPanelBody });

    function render() {
      const { mode, inputTarget, hasEnteredScene, messages, complete } = state;
      // remember where the practice is scrolled so toggling Learn/Practice never
      // jumps it — we only follow to the bottom when new scene content arrives.
      const prevStageScroll = stage.scrollTop;
      // Was the coach sheet already at/near the bottom before this render? Only
      // then do we follow new content down — if the learner scrolled up to read,
      // leave them there instead of yanking the thread.
      const coachNearBottom = (coachPanelBody.scrollHeight - coachPanelBody.scrollTop - coachPanelBody.clientHeight) < 80;
      // the AI Coach sheet is up whenever we're learning — but ONLY after the learner
      // has chosen to begin (we anchor on the scene first; the sheet never auto-opens)
      const coachUp = mode === 'coaching' && state.started;
      const trap = coachUp && hasEnteredScene; // trap focus only when the coach pauses a live scene

      app.dataset.mode = mode;
      app.dataset.target = inputTarget;
      app.dataset.entered = String(hasEnteredScene);
      app.classList.toggle('coach-up', coachUp);
      app.classList.toggle('trap', trap);
      app.classList.toggle('sweep', IS_SWEEP);

      // Withheld through the establishing card and the cold-open video — there's
      // no real Learn/Practice choice yet. Revealed once the coach actually begins.
      // aria-hidden + inert must track visibility, or the toggle stays invisible
      // to screen readers (while its buttons stay tabbable) for the whole session.
      modeIndicator.classList.toggle('is-hidden', !state.started);
      modeIndicator.setAttribute('aria-hidden', String(!state.started));
      modeIndicator.inert = !state.started;

      /* —— Mode indicator: the two-world toggle. Sweep relabels it OBSERVE
         (the tap-to-mark photo) | REACT (the coach), and keeps both live once
         the experience has started so the learner can swap at will. Other
         scenarios keep Learn | Practice (raises/lowers the coach sheet). —— */
      const busy = state.transitioning || state.sending || state.delivering;
      let coachDisabled, sceneDisabled, learnTip, sceneTip, coachSeg, sceneSeg;
      if (IS_SWEEP) {
        coachSeg = { label: 'React', icon: 'fa-comments' };
        sceneSeg = { label: 'Observe', icon: 'fa-magnifying-glass-location' };
        // both live once started; only busy (a reveal in flight) locks them
        coachDisabled = mode !== 'coaching' && (busy || !state.started);
        sceneDisabled = mode !== 'scene' && (busy || !state.started);
        learnTip = (mode !== 'coaching' && !coachDisabled)
          ? (state.coachStarted ? 'Back to your coach' : 'Talk it through with your coach') : '';
        sceneTip = (mode !== 'scene' && !sceneDisabled) ? 'Look at the scene again' : '';
      } else {
        coachSeg = { label: 'Learn', icon: 'fa-chalkboard-user' };
        sceneSeg = { label: 'Practice', icon: 'fa-door-open' };
        // "Learn" is tappable from the scene to open a queued debrief (even at the end) or a manual timeout
        coachDisabled = mode !== 'coaching' && (busy || (complete && !state.awaitingDebrief));
        // "Practice" lights up once the coach has invited entry, even before stepping in
        sceneDisabled = mode !== 'scene' && (busy || complete || (!hasEnteredScene && !state.awaitingEntry));
        learnTip = (mode !== 'coaching' && !coachDisabled)
          ? (state.awaitingDebrief ? (complete ? 'See your results' : 'See AI Coach feedback') : 'Talk with your AI coach') : '';
        sceneTip = (mode !== 'scene' && !sceneDisabled)
          ? (hasEnteredScene ? 'Return to practice' : 'Begin practicing') : '';
      }
      modeIndicator.innerHTML =
        `<div class="mode-toggle" role="group" aria-label="${IS_SWEEP ? 'Observe or react mode' : 'Learn or practice mode'}">
           <button class="seg ${mode === 'coaching' ? 'active' : ''}" data-seg="coaching"
                   ${learnTip ? `data-tip="${learnTip}"` : ''}
                   aria-pressed="${mode === 'coaching'}" ${coachDisabled ? 'disabled' : ''}>
             <i class="fa-solid ${coachSeg.icon}"></i> ${coachSeg.label}
           </button>
           <button class="seg ${mode === 'scene' ? 'active' : ''}" data-seg="scene"
                   ${sceneTip ? `data-tip="${sceneTip}"` : ''}
                   aria-pressed="${mode === 'scene'}" ${sceneDisabled ? 'disabled' : ''}>
             <i class="fa-solid ${sceneSeg.icon}"></i> ${sceneSeg.label}
           </button>
         </div>`;

      /* —— Practice base (ALWAYS the base layer) ——
         Pre-entry → an establishing card; entered → the live scene. Dimmed,
         lightly blurred + inert whenever the coach sheet is up over it. */
      // In React mode the full-bleed photo is blurred + dimmed behind the coach
      // sheet (CSS .app.sweep .stage.is-frozen) so the coach reads clearly over
      // the busy scene; tapping the dimmed peek (or the Observe toggle) returns.
      stage.classList.toggle('is-frozen', coachUp);
      stage.toggleAttribute('inert', coachUp);
      stage.setAttribute('aria-hidden', coachUp ? 'true' : 'false');
      // While the video is up, only mount it once — re-rendering for OTHER
      // reasons (the coach sheet rising, opening prep typing in) must NOT
      // rebuild it. Once it ends, the coach sheet rises immediately and this
      // keeps the video's frozen final frame as the blurred backdrop through
      // the whole coach-prep phase, instead of swapping back to the
      // establishing card, which read as a flash mid-transition. The real
      // swap to the establishing/scene card happens once enterScene() turns
      // videoPlaying off for good.
      // Same "mount once" guard for the narrated/reading context: re-renders for
      // other reasons (the coach sheet rising) must not tear down a playing card.
      const videoAlreadyMounted = state.videoPlaying && stageInner.querySelector('.scene-video');
      const audioAlreadyMounted = state.audioIntroPlaying && stageInner.querySelector('.sc-wrap');
      // Scene Sweep: the illustrated work area is a PERSISTENT panel — mount it
      // once (so the image never reloads/flickers on re-render) and only refresh
      // the coverage rail afterward. It shows the moment the reading intro is
      // done (state.started), and stays up through every beat and the close.
      const sweepShouldMount = IS_SWEEP && state.started && SCENE_IMG && !state.audioIntroPlaying;
      const sweepAlreadyMounted = sweepShouldMount && stageInner.querySelector('.sweep-scene');
      if (!videoAlreadyMounted && !audioAlreadyMounted && !sweepAlreadyMounted) {
        stageInner.innerHTML = '';
        if (state.videoPlaying) {
          stageInner.appendChild(videoNode());
        } else if (state.audioIntroPlaying) {
          mountAudioIntro(stageInner);
        } else if (sweepShouldMount) {
          stageInner.appendChild(sweepSceneNode());
        } else if (hasEnteredScene) {
          // Retry controls render whenever the scene is live (not complete / mid-reveal),
          // REGARDLESS of mode — the stage is inert while the coach sheet is up, so they
          // aren't clickable there, but keeping them in the DOM means toggling Learn/Practice
          // never reflows the scene card (no jump/jitter).
          stageInner.appendChild(sceneCardAll(messages, !complete && !state.delivering && !state.sending));
          // resources live in the coach sheet (the practice never shows them)
        } else {
          const est = el('div', 'establishing');
          const estab = ACTIVE_SCENARIO.establishing || {};
          est.innerHTML =
            `<div class="est-eyebrow">${esc(estab.eyebrow || 'The scenario')}</div>
             <h2 class="est-title">${esc(estab.title || SCENARIO.title)}</h2>
             <p class="est-sub">${esc(estab.sub || '')}</p>
             ${ACTIVE_SCENARIO.course ? `<div class="est-with">${esc(ACTIVE_SCENARIO.course)}</div>` : ''}`;
          stageInner.appendChild(est);
        }
      }
      // Refresh the Observe HUD every render (progress pill + bottom CTA) while
      // the full-bleed photo canvas is mounted; the photo itself stays untouched.
      if (IS_SWEEP && stageInner.querySelector('.sweep-scene')) { updateObserveHud(); repositionPins(); }

      /* —— AI Coach sheet — up whenever we're in Learn mode (prep AND debriefs) —— */
      coachPanel.toggleAttribute('inert', !coachUp);
      coachPanel.setAttribute('aria-hidden', coachUp ? 'false' : 'true');
      // Scene Sweep: keep the coverage chip rail pinned to the top of the coach
      // sheet in React mode (and remove it otherwise). Runs before the body
      // reconcile so the rail stays the first child.
      if (IS_SWEEP) updateCoachRail();
      if (coachUp) {
        // Incremental — preserves scroll (see reconcileCoachBody). The closing
        // recap shows here like any other coach line; loading beats live in the
        // CTA slot below (see showAnalyzing), not stacked over the conversation.
        const coachRun = trailingRun(messages, 'coaching');
        reconcileCoachBody(coachRun);
        markCoachGroups(coachRun);   // name on the run's first, avatar on its last
        markActivePrompt(messages, complete);   // flag the live question as the thing to answer
        // The full strengths/growth-areas report lives in its own modal — opened
        // only when the learner taps "View full results", never dumped here.
        // Resources are the one thing that shows inline, and only once they've
        // been through that report. Managed by id so the reconcile leaves it be.
        const showRes = complete && !state.delivering && state.resultsViewed;
        let resNode = document.getElementById('coachResources');
        if (showRes && !resNode) { resNode = resourcesNode(); resNode.id = 'coachResources'; coachPanelBody.appendChild(resNode); }
        else if (!showRes && resNode) { resNode.remove(); }
      }

      /* —— Input bar — the composer, OR a CTA/indicator that takes its place —— */
      // start CTA (bring the coach in) · entry CTA (step in) · "Analyzing…"/"Watching…" beats · debrief CTA
      const showStart     = !state.started && !complete && !state.videoPlaying && !state.audioIntroPlaying;
      const showEntry     = state.awaitingEntry && !hasEnteredScene && !state.entryPromptDismissed && !state.delivering;
      // The closing "Analyzing… Determining…" beats now cycle in THIS slot
      // (where "View full results" will land), not stacked in the chat body.
      const showAnalyzing = state.analyzing || state.closingStepperActive;
      // videoPlaying stays true after the clips end too (it lingers as the
      // blurred coach-prep backdrop — see the render() guard above), so this
      // needs its own check rather than just mirroring state.videoPlaying.
      const showWatching      = state.videoPlaying && !state.started;
      const showIntroContinue = state.audioIntroPlaying && !state.started;
      const showDebrief   = state.awaitingDebrief && !state.analyzing && !state.delivering;
      // The coach has replied and is ready to send the learner back into the
      // scene, but waits for this tap rather than auto-transitioning.
      const showReturn    = state.awaitingReturn && !state.delivering;
      // SCENE SWEEP: the coach is nudging back to the photo (still in the Observe
      // beat, hazards left to find) but the sheet covers it — offer the way back
      // as the PRIMARY action, right under the nudge, unless they've opted to type.
      const sweepSpotIdx  = (ACTIVE_SCENARIO.phases || []).findIndex((p) => p.id === SPOT_PHASE_ID);
      const sweepUnspotted = HAZARDS.filter((h) => !state.covered.has(h.id)).length;
      const showLookAgain = IS_SWEEP && state.coachStarted && mode === 'coaching'
        && !complete && !state.delivering && !state.sending && !state.analyzing
        && !state.awaitingDebrief && !state.awaitingResults && !state.awaitingReturn
        && state.phaseIdx === sweepSpotIdx && sweepUnspotted > 0 && !state.lookAgainDismissed;
      // Once the recap lands, this replaces the composer just like every other
      // CTA here — tapping it is what opens the results modal (never auto-shown).
      const showResults   = state.awaitingResults && !state.resultsModalOpen;
      // The practice's actual last step: once the resources have landed, this
      // takes the composer's place instead of leaving it sitting there disabled
      // with nothing left to type.
      const showContinue  = complete && state.resultsViewed && !state.delivering && !state.continued;
      const showDone       = state.continued;
      inputStart.hidden     = !showStart;
      inputEntry.hidden     = !showEntry;
      inputAnalyzing.hidden = !showAnalyzing;
      inputWatching.hidden  = !showWatching;
      inputIntroContinue.hidden = !showIntroContinue;
      inputDebrief.hidden   = !showDebrief;
      inputReturn.hidden    = !showReturn;
      inputLookAgain.hidden = !showLookAgain;
      inputResults.hidden   = !showResults;
      inputContinue.hidden  = !showContinue;
      inputDone.hidden      = !showDone;
      inputMain.hidden      = showStart || showEntry || showAnalyzing || showWatching || showIntroContinue || showDebrief || showReturn || showLookAgain || showResults || showContinue || showDone;
      if (showAnalyzing) {
        inputAnalyzing.lastChild.textContent = state.closingStepperActive
          ? DEBRIEF.closingLabel()
          : (complete ? 'Wrapping up your practice…' : 'Analyzing your response…');
      }
      if (showWatching) {
        inputWatching.lastChild.textContent = 'Watching the scene…';
      }
      if (showIntroContinue) {
        introContinueBtn.innerHTML = `${esc(AUDIO_INTRO.continueLabel || 'Continue')} <i class="fa-solid fa-arrow-right arrow"></i>`;
      }
      if (showDebrief) {
        debriefCtaBtn.innerHTML = complete
          ? '<i class="fa-solid fa-chalkboard-user"></i> See your results <i class="fa-solid fa-arrow-right arrow"></i>'
          : '<i class="fa-solid fa-chalkboard-user"></i> See AI Coach feedback <i class="fa-solid fa-arrow-right arrow"></i>';
      }
      if (showReturn) {
        // The next phase's authored crossing CTA (e.g. "Keep going", "Step into the moment").
        const rl = state.returnLabel || 'Continue practicing';
        returnCtaBtn.innerHTML = `<i class="fa-solid fa-door-open"></i> ${esc(rl)} <i class="fa-solid fa-arrow-right arrow"></i>`;
      }
      if (showEntry) {
        // The FIRST crossing carries the phase's authored CTA too ("Step into the room").
        const el2 = state.entryLabel || 'Begin practicing';
        enterCtaBar.innerHTML = `<i class="fa-solid fa-door-open"></i> ${esc(el2)} <i class="fa-solid fa-arrow-right arrow"></i>`;
      }

      if (inputTarget === 'character') {
        // Scene phases are ACTION consoles — the composer asks what the learner
        // DOES. Each phase authors its own placeholder ("Respond to Ray…",
        // "What do you do — specifically?").
        composer.placeholder = state.scenePlaceholder
          || (state.sceneTarget ? `Say something to ${state.sceneTarget}…` : 'What do you do or say?');
        inputIcon.className = 'fa-solid fa-hand lead-icon';
        sendBtn.classList.add('is-respond');
        sendBtn.setAttribute('aria-label', 'Respond');
        sendBtn.innerHTML = 'Respond <i class="fa-solid fa-arrow-right"></i>';
      } else {
        composer.placeholder = coachPanelBody.querySelector('.coach-msg.is-prompt') ? 'Type your answer…' : 'Type your response…';
        inputIcon.className = 'fa-solid fa-comment lead-icon';
        sendBtn.classList.remove('is-respond');
        sendBtn.setAttribute('aria-label', 'Send');
        sendBtn.innerHTML = '<i class="fa-solid fa-arrow-up"></i>';
      }

      composer.disabled = complete || state.transitioning || state.sending || state.delivering || !state.started;
      sendBtn.disabled = composer.disabled || !composer.value.trim();
      // The coach panel's top-right control. Post-entry it lowers the sheet ("Back to
      // practice"). Pre-entry, while prepping (composer up, entry available), the SAME
      // slot becomes the primary "Begin practicing" CTA — so the way forward always
      // lives here rather than in a separate affordance.
      const headerBegin = !hasEnteredScene && state.awaitingEntry && !inputMain.hidden && !complete;
      const headerBack  = hasEnteredScene && !complete;
      resumeBtn.hidden = !(headerBegin || headerBack);
      resumeBtn.classList.toggle('is-begin', headerBegin);
      resumeBtn.dataset.action = headerBegin ? 'begin' : 'back';
      resumeBtn.innerHTML = headerBegin
        ? `${esc(state.entryLabel || 'Begin practicing')} <i class="fa-solid fa-arrow-right"></i>`
        : 'Back to practice <i class="fa-solid fa-chevron-down"></i>';
      inputHint.textContent = complete
        ? 'Practice complete — press Restart to run it again.'
        : 'Enter to send · Shift+Enter for a new line';

      /* —— Results modal — painted by the shared debrief (one renderer for
         every simulator page, so pages/dots/nav labels never drift). .app
         goes inert while it's open so background content can't be tabbed. —— */
      DEBRIEF.render();

      // keep the sheet sitting exactly on top of the (variable-height) input bar
      coachPanel.style.bottom = inputbar.offsetHeight + 'px';
      // with the sheet up over a LIVE scene, reserve space below so the latest
      // line scrolls into the VISIBLE peek above the sheet (not behind it)
      stageInner.style.paddingBottom = (coachUp && hasEnteredScene) ? (coachPanel.offsetHeight + 20) + 'px' : '';

      // Follow the coach thread to the bottom — but SMOOTHLY, not in a snap. The
      // shared coach-sheet module eases the sheet up as it grows, or glides the
      // body's scroll when it's maxed out. Either way it only follows when a reveal
      // is delivering or we were already near the bottom; if the learner scrolled
      // up to re-read, it leaves them be.
      if (coachUp) coachSheet.follow({ nearBottom: coachNearBottom, delivering: state.delivering });
      else coachSheet.reset();

      // The SCENE stage follows the same synchronous pin (the rAF version jumped:
      // it scrolled to the new bottom a frame AFTER the wipe/rebuild reset it to 0,
      // so you saw the thread drop down and then the beat slide up). Follow to the
      // bottom only when fresh scene content just arrived; otherwise hold position
      // so a Learn/Practice toggle never moves the scene.
      if (followStage) { stage.scrollTop = stage.scrollHeight; followStage = false; }
      else { stage.scrollTop = prevStageScroll; }

      // a freshly-delivered message animates in exactly once
      messages.forEach((m) => { if (m._enter) m._enter = false; });

      manageFocus(trap);
    }
    // set true right before a render that appends scene content, so it follows down
    let followStage = false;

    /* Reveal a run of SCENE beats one at a time with deliberate offsets — a breath
       of air before narration/context lands, a typing indicator before a spoken
       line — then a settle so each beat is read before the next. Shared by the
       break-room setup (enterScene) and every in-scene reaction (deliverTurn) so
       they feel identical. `dead` is an optional stale-guard from the caller. */
    async function revealScene(items, dead) {
      for (const m of items) {
        if (state.mode !== 'scene') { state.mode = 'scene'; state.inputTarget = 'character'; }
        hideTyping();
        if (m.speaker === 'character' && m.kind === 'dialogue') {
          showTyping(); await wait(reducedMotion() ? 300 : 950); hideTyping();   // spoken line arrives behind the dots
        } else {
          await wait(reducedMotion() ? 140 : 650);   // a breath before narration/context lands
        }
        if (dead && dead()) return;
        m._enter = true;
        if (!state.hasEnteredScene) state.hasEnteredScene = true;
        followStage = true;
        state.messages.push(m);
        render();
        await wait(reducedMotion() ? 140 : 700);      // settle so it reads before the next beat
        if (dead && dead()) return;
      }
    }

    /* ---- typing indicator (in the right world) ------------------------ */
    function showTyping(label) {
      hideTyping();
      const coachUp = state.mode === 'coaching';
      const dots = '<span class="tdots"><span></span><span></span><span></span></span>';
      const lbl = label ? `<span class="tlabel">${esc(label)}</span>` : '';
      const node = el('div', 'typing' + (coachUp ? '' : ' scene'), dots + lbl);
      node.id = 'typingNode';
      // coach lines type in the sheet (prep AND debriefs); scene lines type in the practice
      if (coachUp) {
        typingHost = coachPanelBody; coachPanelBody.appendChild(node);
        // The dots grow the sheet too — tween that growth, or pin if maxed out.
        coachSheet.pin();
      } else {
        typingHost = stageInner; stageInner.appendChild(node);
        requestAnimationFrame(() => { stage.scrollTop = 1e9; });
      }
    }
    function hideTyping() {
      const t = document.getElementById('typingNode');
      if (t) t.remove();
      typingHost = null;
    }

    /* =====================================================================
       FOCUS MANAGEMENT  — trap focus in the coaching layer while paused
       ===================================================================== */
    let lastSceneFocus = null;
    function focusables() {
      // the coaching "layer" = the mode toggle + panel + the (still-usable) input bar
      const sel = 'button, [href], textarea, input, select, [tabindex]:not([tabindex="-1"])';
      return [
        ...modeIndicator.querySelectorAll(sel),
        ...coachPanel.querySelectorAll(sel),
        ...document.querySelectorAll('.inputbar ' + sel),
      ].filter((n) => !n.disabled && n.offsetParent !== null);
    }
    function manageFocus(trap) {
      if (trap && !app.classList.contains('was-trap')) {
        app.classList.add('was-trap');
        lastSceneFocus = document.activeElement;
        // move focus into the coach sheet
        setTimeout(() => { (composer.disabled ? resumeBtn : composer).focus(); }, 30);
      } else if (!trap && app.classList.contains('was-trap')) {
        app.classList.remove('was-trap');
        // restore focus toward the practice/input
        setTimeout(() => { if (!composer.disabled) composer.focus(); }, 30);
      }
    }
    // Escape closes the results modal while it's open (checked before the
    // coach-sheet trap below, which is inert-blocked anyway while it's up).
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && state.resultsModalOpen) {
        e.preventDefault();
        DEBRIEF.closeResults();
      }
    });
    document.addEventListener('keydown', (e) => {
      if (state.resultsModalOpen) return;   // the results modal owns Escape/Tab while open
      const trap = app.classList.contains('trap');
      if (!trap) return;
      if (e.key === 'Escape') { e.preventDefault(); resumeScene(); return; }
      if (e.key === 'Tab') {
        const f = focusables();
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });

    function announce(msg) { liveRegion.textContent = ''; setTimeout(() => { liveRegion.textContent = msg; }, 30); }

    /* =====================================================================
       VIDEO INTRO — the locked, no-skip cold open (see INTRO_SCENES above).
       Captions are chunked smaller than the full paragraph (sentence-sized,
       splitting overlong sentences on a comma too) so they read like real
       captions rather than a wall of text, the same "reveal gradually" idea
       as the Audio Summary experiment — just timer-paced since there's no
       narration audio to follow.
       ===================================================================== */
    let introSeq = 0;   // bumped on restart so an in-flight sequence abandons itself

    function splitCaptionChunks(text) {
      const sentences = text.match(/[^.!?]+[.!?]*/g) || [text];
      const chunks = [];
      sentences.forEach((s) => {
        s = s.trim();
        if (!s) return;
        if (s.length <= 100) { chunks.push(s); return; }
        // an overlong sentence reads better split on its first comma
        const mid = s.indexOf(',');
        if (mid > 10 && mid < s.length - 10) {
          chunks.push(s.slice(0, mid + 1).trim());
          chunks.push(s.slice(mid + 1).trim());
        } else {
          chunks.push(s);
        }
      });
      return chunks;
    }
    const captionMs = (chunk) => Math.max(1700, Math.min(5200, chunk.split(/\s+/).length * 330));

    async function showCaption(captionEl, text, mySeq) {
      captionEl.classList.remove('is-visible');
      await wait(reducedMotion() ? 0 : 160);
      if (mySeq !== introSeq) return;
      captionEl.textContent = text;
      captionEl.classList.add('is-visible');
    }

    // Fire-and-forget: cancels itself (via the seq check) the moment the video
    // ends or a restart supersedes it, rather than racing the video for control.
    async function runCaptions(captionEl, chunks, mySeq) {
      for (const chunk of chunks) {
        if (mySeq !== introSeq) return;
        await showCaption(captionEl, chunk, mySeq);
        if (mySeq !== introSeq) return;
        await wait(reducedMotion() ? 1400 : captionMs(chunk));
      }
    }

    function waitForVideoEnd(videoEl, mySeq) {
      return new Promise((resolve) => {
        let done = false;
        const finish = () => { if (done) return; done = true; cleanup(); resolve(); };
        function cleanup() { videoEl.removeEventListener('ended', finish); videoEl.removeEventListener('error', finish); clearInterval(watch); }
        // If the element already errored (e.g. the 'error' fired while play() was
        // rejecting, before we attached), don't wait — move on to the coach.
        if (videoEl.error) { resolve(); return; }
        videoEl.addEventListener('ended', finish);
        videoEl.addEventListener('error', finish);
        // Safety net is a STALL watchdog, not a fixed cap — so a long clip plays
        // fully, but a missing/frozen asset (or an abandoned sequence) still can't
        // trap the learner. Finish only if the sequence was superseded, or
        // playback made no progress for ~10s while trying to play (not merely
        // paused by the learner).
        let last = -1, stalls = 0;
        const watch = setInterval(() => {
          if (mySeq !== introSeq || videoEl.error) { finish(); return; }
          const t = videoEl.currentTime || 0;
          if (t > last + 0.25) { last = t; stalls = 0; return; }
          if (!videoEl.paused && !videoEl.ended) stalls++;
          if (stalls >= 5) finish();
        }, 2000);
      });
    }

    function waitForTap(btn) {
      return new Promise((resolve) => {
        btn.hidden = false;
        btn.addEventListener('click', () => { btn.hidden = true; resolve(); }, { once: true });
      });
    }

    // Waits for every clip's OWN element to report ready (or its individual
    // timeout, so one slow/bad asset can't hold up the rest). Each element
    // already has its real src and preload="auto" from the moment videoNode()
    // mounted, so they've been buffering in the background this whole time —
    // this is just the gate that makes sure clip 1 doesn't start before its
    // (and everyone else's) data has actually arrived.
    function preloadVideos(videos) {
      return Promise.all(videos.map((v) => new Promise((resolve) => {
        if (v.readyState >= 3) return resolve();   // HAVE_FUTURE_DATA already
        let t;
        const done = () => { clearTimeout(t); v.removeEventListener('canplaythrough', done); v.removeEventListener('error', done); resolve(); };
        v.addEventListener('canplaythrough', done, { once: true });
        v.addEventListener('error', done, { once: true });
        t = setTimeout(done, 9000);
      })));
    }

    // Brings the cold-open video into the stage (the practice layer), not as a
    // separate full-screen player. Six clips play back to back with a hard cut
    // and no counter/progress UI of any kind, so it reads as one continuous video.
    function enterVideoIntro() {
      if (state.videoPlaying || state.delivering) return;
      const mySeq = ++introSeq;
      state.videoPlaying = true;
      render();              // mounts all six <video> elements — they start buffering now
      announce('Watching the scene.');
      runIntroSequence(mySeq);
    }

    async function finishVideoIntro() {
      // videoPlaying stays true here on purpose — the coach sheet rises over
      // the video's frozen final frame (now blurred/dimmed), not the
      // establishing card. See the render() guard above for why that avoids
      // a flash back to "Kendra's room" mid-transition.
      // Freeze + silence the clip so a not-yet-ended (or sound-on) video can't
      // keep playing audio under the coaching that follows.
      document.querySelectorAll('#stage .intro-video').forEach((v) => { try { v.pause(); v.muted = true; } catch (e) {} });
      await wait(reducedMotion() ? 0 : 250);   // a short breath, not a second decision point
      CONTEXT.done({ modality: 'video' });   // the video IS the transition — the coupler hands off
    }

    /* =====================================================================
       AUDIO / READING INTRO — the context modality (see scene-context.js).
       Mirrors the video cold-open: it takes over the stage, and when the
       learner continues it hands straight off to the coach's reflection prompt.
       ===================================================================== */
    let audioIntroHandle = null;
    function mountAudioIntro(host) {
      if (audioIntroHandle) { audioIntroHandle.stop(); audioIntroHandle = null; }
      audioIntroHandle = SceneContext.mount(host, {
        modality: AUDIO_INTRO_MODALITY,
        eyebrow: AUDIO_INTRO.eyebrow,
        title: AUDIO_INTRO.title,
        text: AitheraScenario.fill(AUDIO_INTRO.text || '', ACTIVE_SCENARIO),
        continueLabel: AUDIO_INTRO.continueLabel || 'Continue',
        onContinue: finishAudioIntro,
      });
      // The forward CTA lives in the bottom input bar (#inputIntroContinue),
      // consistent with every other step here — so hide the module's own in-card
      // button to avoid a duplicate. The bottom CTA calls finishAudioIntro too.
      if (audioIntroHandle && audioIntroHandle.continueEl) audioIntroHandle.continueEl.style.display = 'none';
    }
    function enterAudioIntro() {
      if (state.audioIntroPlaying || state.started || state.delivering) return;
      state.audioIntroPlaying = true;
