      .pu { position: relative; z-index: 1; width: min(520px, 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        min-height: var(--pu-h); margin-top: var(--pu-orb); }
      .pu-load { display: flex; flex-direction: column; align-items: center; max-height: 120px; overflow: hidden;
        transition: max-height .6s var(--ll-ease), opacity .35s ease; }
      .pu-load.is-done { max-height: 0; opacity: 0; }
      .pu-status { margin: 0 0 20px; font-size: 15px; color: var(--ll-ink-soft); }
      .pu-track { position: relative; width: min(320px, 70vw); height: 6px; border-radius: 999px; overflow: hidden; background: rgba(var(--ll-surface-rgb), .08); }
      .pu-fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit;
        background: linear-gradient(135deg, var(--ll-teal) 0%, rgba(var(--ll-teal-rgb), .7) 100%); }
      .pu-pct { margin: 10px 0 0; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ll-ink-faint); }
      .pu-result { opacity: 0; transform: translateY(8px); transition: opacity .5s var(--ll-ease), transform .5s var(--ll-ease); }
      .pu-result.in { opacity: 1; transform: none; }
      .pu-eyebrow { margin-bottom: 12px; }
      .ll-object .pu-head { margin: 0 0 10px; font-size: clamp(26px, 3.4vw, 36px); font-weight: 800; line-height: 1.18; letter-spacing: -.01em; color: var(--ll-ink-strong); }
      .pu-sub { margin: 0 auto; max-width: 40ch; font-size: 15px; line-height: 1.55; color: var(--ll-ink-soft); }
      .pu-chip { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 14px; padding: 6px 14px; border-radius: 999px;
        background: rgba(241, 179, 74, .14); border: 1px solid rgba(241, 179, 74, .32); color: #f1b34a;
        font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      .pu-chip i { font-size: 11px; }
      .pu-confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
      /* One flash behind the headline, timed with the confetti, so the
         reward has an instant to land on. */
      .pu-flash { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; border-radius: 50%; pointer-events: none; opacity: 0;
        transform: translate(-50%, -50%) scale(0);
        background: radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(var(--ll-teal-rgb), .55) 35%, transparent 72%); }
      .pu-flash.pop { animation: pu-flash .65s ease-out forwards; }
      @keyframes pu-flash {
        0%   { transform: translate(-50%, -50%) scale(0);  opacity: .95; }
        55%  { transform: translate(-50%, -50%) scale(46); opacity: .4; }
        100% { transform: translate(-50%, -50%) scale(70); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .pu-load, .pu-result { transition: opacity .2s linear; transform: none; }
      }

      /* ==== Ask CLARA off (Demo menu, 2026-09-24) ==========================
         Off by default: stakeholders see the module without the bottom-right
         launcher, and the presenter switches it on to ask "does this add
         value?". Only the tucked launcher goes — when a screen raises CLARA
         with something to say (the bubble is open), they still show. The
         class is set before first paint in <head>; the toggle lives in
         js/layered-sharps.js (shAskBtn). */
      html.sh-ask-off .ll-stage[data-float="closed"] .clara-chrome--floating,
      html.sh-ask-off body:has(.ll-stage[data-mode="floating"][data-float="closed"]) .clara-orb[data-launcher] { display: none !important; }

      /* Over the video: the question card and its feedback. */
      .dk-check .cs-q--lead { margin-bottom: 16px; }
      .dk-hint { margin: -6px 0 16px; font-size: 13.5px; color: var(--ll-ink-faint); }
      .dk-submit { align-self: flex-start; margin-top: 18px; }
      .dk-fb {
        margin: 16px 0 0; padding: 12px 14px; border-radius: 10px;
        font-size: 14.5px; line-height: 1.55; color: var(--ll-ink);
        background: rgba(var(--ll-surface-rgb), .05); border: 1px solid var(--ll-line);
      }
      .dk-fb.is-ok  { border-color: rgba(var(--ll-teal-rgb), .45); background: rgba(var(--ll-teal-rgb), .08); }
      .dk-fb.is-bad { border-color: rgba(255, 107, 107, .4); background: rgba(255, 107, 107, .07); }
      /* The verdict in words, on its own line above the deck's feedback. */
      .dk-fb-h { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; }
      .dk-fb.is-ok  .dk-fb-h { color: var(--ll-teal); }
      .dk-fb.is-bad .dk-fb-h { color: #ff8a8a; }
      html.ll-vector-light .dk-fb.is-bad .dk-fb-h { color: var(--sh-decline); }
      .dk-fb-b { display: block; margin-top: 6px; }
      .dk-check { display: flex; flex-direction: column; }
      .dk-check[hidden] { display: none; }

      /* ==== The stage (deck screens) ======================================
         One 16:9 frame for all three carriers, sized to the room between
         the header and the footer (the 300px is header + footer + the title
         row + breathing room). Watch / Read / Listen cross-fade INSIDE it;
         the title row above and the rail along its bottom never move, which
         is what makes switching feel like changing channel rather than
         leaving the page. The question rises over the stage itself. */
      .ll-object.dk-object { justify-content: safe center; padding-top: clamp(14px, 3vh, 32px); padding-bottom: clamp(14px, 3vh, 32px); }
      .dk-theater {
        --dk-w: min(100%, 1360px, calc((100vh - 330px) * 16 / 9));
        width: var(--dk-w); min-width: min(100%, 560px);
        display: flex; flex-direction: column; gap: 14px;
      }
      .dk-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
      .dk-head .ll-eyebrow { margin: 0 0 4px; }
      .ll-object .dk-title {
        margin: 0; font-size: clamp(22px, 2.6vw, 30px); font-weight: 800;
        letter-spacing: -.015em; color: var(--ll-ink-strong); line-height: 1.15;
      }

      /* The carrier switch: a segmented control, always open — three
         options is few enough that a dropdown only hid them. */
      .dk-switch {
        display: inline-flex; padding: 4px; gap: 2px; border-radius: 999px;
        background: rgba(var(--ll-surface-rgb), .06); border: 1px solid var(--ll-line);
      }
      .dk-sw {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 8px 16px; border: 0; border-radius: 999px; background: transparent;
        font: inherit; font-size: 13px; font-weight: 700; color: var(--ll-ink-soft); cursor: pointer;
        transition: background .2s ease, color .2s ease;
      }
      .dk-sw i { font-size: 13px; }
      .dk-sw:hover { color: var(--ll-ink-strong); }
      .dk-sw:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(var(--ll-teal-rgb), .3); }
      .dk-sw[aria-pressed="true"] { background: rgba(var(--ll-teal-rgb), .16); color: var(--ll-teal); }

      .dk-stagewrap { position: relative; }
      .dk-stage {
        position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden;
        border-radius: 18px; border: 1px solid var(--ll-line);
        background: radial-gradient(120% 120% at 30% 10%, #13213c 0%, #0a1224 55%, #060b16 100%);
        box-shadow: var(--ll-shadow);
      }
      .dk-layer {
        position: absolute; inset: 0; opacity: 0; visibility: hidden;
        transition: opacity .38s ease, visibility 0s linear .38s;
      }
      .dk-stage[data-mode="video"]   .dk-layer--video,
      .dk-stage[data-mode="article"] .dk-layer--read,
      .dk-stage[data-mode="podcast"] .dk-layer--listen {
        opacity: 1; visibility: visible; transition: opacity .38s ease, visibility 0s;
      }
      /* The rail: every carrier's progress, on the stage's bottom edge. */
      .dk-rail { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(var(--ll-surface-rgb), .08); z-index: 6; pointer-events: none; }
      .dk-rail-fill { display: block; height: 100%; background: var(--ll-teal); transform-origin: left; transform: scaleX(0); transition: transform .25s linear; }
      /* Watch showed two progress bars: the video's own white scrubber and
         this teal rail. The rail is the one every format shares, so the
         player's timeline goes instead (the play/time/volume controls stay).
         Chromium and Safari honour this; Firefox has no hook for it and
         keeps both. Nothing is lost for the learner: Continue waits for the
         clip to end either way. */
      .dk-layer--video video::-webkit-media-controls-timeline { display: none; }

      /* Watch: the player fills the stage. */
      .dk-layer--video .ll-media { width: 100%; height: 100%; aspect-ratio: auto; border: 0; border-radius: 0; box-shadow: none; background: #05080f; }
      .dk-layer--video .ll-media::before, .dk-layer--video .ll-media::after { display: none; }
      .dk-layer--video .pr-vfall { position: absolute; left: 20px; right: 20px; bottom: 16px; margin: 0; }

      /* Read: an immersive reader. Large type on the dark stage, one
         paragraph in focus and the rest dimmed, centred in the frame as the
         learner steps through; the edges fade so text slides in and out of
         view rather than being cut. */
      .dk-read-scroll {
        position: absolute; inset: 0; overflow-y: auto; scrollbar-width: none;
        padding: 18% 8% 22%;
        -webkit-mask-image: linear-gradient(transparent 0, #000 16%, #000 80%, transparent 100%);
                mask-image: linear-gradient(transparent 0, #000 16%, #000 80%, transparent 100%);
      }
      .dk-read-scroll::-webkit-scrollbar { display: none; }
      /* Measure in the reader's own type size, so it scales with A−/A+. */
      .dk-read-col { max-width: 40ch; margin: 0 auto; font-size: var(--dk-fs); }
      .dk-layer--read { --dk-fs: clamp(19px, 1.9vw, 26px); }
      .dk-layer--read[data-size="0"] { --dk-fs: clamp(16px, 1.5vw, 21px); }
      .dk-layer--read[data-size="2"] { --dk-fs: clamp(22px, 2.3vw, 31px); }
      .dk-layer--read[data-size="3"] { --dk-fs: clamp(25px, 2.7vw, 36px); }
      .dk-para {
        margin: 0 0 .5em; font-size: 1em; line-height: 1.55; font-weight: 500;
        color: var(--ll-ink-strong); opacity: .26; cursor: pointer;
        transition: opacity .35s ease, filter .35s ease;
        filter: blur(.4px);
      }
      .dk-para.is-past { opacity: .34; }
      .dk-para.is-on { opacity: 1; filter: none; cursor: default; }
      .dk-src { margin: 1.4em 0 0; font-size: 12.5px; line-height: 1.5; color: var(--ll-ink-faint); }
      /* The podcast transcript: the speaker's name above each turn, one
         colour per voice so a back-and-forth is easy to follow. Turns are
         short, so they sit closer together than prose paragraphs. */
      .dk-who {
        display: block; margin-bottom: .25em; font-size: max(12px, .52em); font-weight: 800;
        letter-spacing: .1em; text-transform: uppercase; color: var(--ll-ink-soft);
      }
      [data-who="ray"] > .dk-who, .dk-cap-who[data-who="ray"] { color: var(--ll-teal); }
      [data-who="jacob"] > .dk-who, .dk-cap-who[data-who="jacob"] { color: #f1b34a; }
      html.ll-vector-light [data-who="jacob"] > .dk-who, html.ll-vector-light .dk-cap-who[data-who="jacob"] { color: #9a6200; }
      .dk-turn, .dk-ppar { margin: 0; }
      .dk-ppar + .dk-ppar { margin-top: .7em; }
      .dk-turn + .dk-turn { margin-top: .7em; }
      .dk-tools {
        position: absolute; right: 16px; bottom: 16px; z-index: 5;
        display: flex; align-items: center; gap: 2px; padding: 4px;
        border-radius: 999px; background: rgba(6, 11, 22, .72); border: 1px solid var(--ll-line);
        backdrop-filter: blur(6px);
      }
      .dk-tool {
        width: 34px; height: 34px; display: grid; place-items: center;
        border: 0; border-radius: 50%; background: transparent; color: var(--ll-ink-soft);
        font: inherit; font-size: 13px; cursor: pointer;
      }
      .dk-tool:hover:not(:disabled) { color: var(--ll-teal); background: rgba(var(--ll-teal-rgb), .1); }
      .dk-tool:disabled { opacity: .3; cursor: default; }
      .dk-tool:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(var(--ll-teal-rgb), .5); }
      .dk-tool-n { min-width: 44px; text-align: center; font-size: 12px; font-weight: 700; color: var(--ll-ink-soft); font-variant-numeric: tabular-nums; }
      .dk-tool-sep { width: 1px; height: 18px; margin: 0 4px; background: var(--ll-line); }
      /* Upcoming / earlier paragraphs answer the pointer, so it's visible
         that they can be clicked into focus. */
      .dk-para:not(.is-on):hover { opacity: .6; filter: none; }
      /* The in-flow step: sits right under the paragraph in focus, so the way
         forward is where the eye already is rather than only in the corner
         toolbar. On the last paragraph it becomes the "Done reading". */
      .dk-next {
        display: inline-flex; align-items: center; gap: 8px;
        margin: 0; padding: 8px 16px; border-radius: 999px;
        border: 1px solid rgba(var(--ll-teal-rgb), .45); background: rgba(var(--ll-teal-rgb), .1);
        font: inherit; font-size: 14px; font-weight: 700; color: var(--ll-teal); cursor: pointer;
        animation: dk-next-in .35s var(--ll-ease) both;
        transition: background .2s ease, border-color .2s ease;
      }
      /* Fixed height whether or not the button is in it — the button moving
         between slots used to add and remove ~40px mid-text and jump the
         paragraph being read. */
      .dk-slot { height: 38px; margin-bottom: 1.1em; }
      .dk-next:hover { background: rgba(var(--ll-teal-rgb), .18); border-color: var(--ll-teal); }
      .dk-next:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(var(--ll-teal-rgb), .35); }
      .dk-next i { font-size: 12px; }
      .dk-next[hidden] { display: none; }
      @keyframes dk-next-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
      .dk-a { font-weight: 800; line-height: 1; }
      .dk-a.sm { font-size: 12px; } .dk-a.lg { font-size: 17px; }

      /* Listen: the narration's real loudness scrolling past a playhead, and
         the sentence being spoken as a large caption, word by word. */
      .dk-layer--listen { display: grid; grid-template-rows: 1fr auto auto; padding: 5% 7% 4.5%; gap: 3%; }
      .dk-wave-wrap { position: relative; min-height: 80px; cursor: pointer; }
      .dk-wave { position: absolute; inset: 0; width: 100%; height: 100%; }
      .dk-playhead {
        position: absolute; left: 50%; top: 4%; bottom: 4%; width: 2px; margin-left: -1px;
        background: linear-gradient(transparent, rgba(var(--ll-teal-rgb), .9), transparent);
        box-shadow: 0 0 18px rgba(var(--ll-teal-rgb), .55); opacity: .5; transition: opacity .3s ease;
      }
      .dk-stage.is-playing .dk-playhead { opacity: 1; }
      .dk-caps { text-align: center; min-height: 6.2em; display: flex; flex-direction: column; justify-content: flex-end; }
      .dk-cap-now {
        margin: 0 auto; max-width: 40ch; font-size: clamp(19px, 2vw, 28px); line-height: 1.4; font-weight: 700;
        color: rgba(var(--ll-surface-rgb), .42); text-wrap: balance;
      }
      .dk-cap-now.is-in { animation: dk-cap-in .35s var(--ll-ease) both; }
      .dk-cap-who {
        margin: 0 auto 6px; min-height: 1.4em; font-size: 12px; font-weight: 800; letter-spacing: .12em;
        text-transform: uppercase; color: var(--ll-ink-soft);
      }
      .dk-cap-now span { transition: color .18s ease; }
      .dk-cap-now span.is-said { color: var(--ll-ink-strong); }
      @keyframes dk-cap-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      .dk-player { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
      .dk-player .dk-voice-note { justify-self: start; }
      .dk-player-end { justify-self: end; display: flex; align-items: center; gap: 12px; }
      .dk-play {
        width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
        border: 0; cursor: pointer; font-size: 18px; color: #04121a;
        background: var(--ll-teal); box-shadow: 0 0 0 0 rgba(var(--ll-teal-rgb), .5);
        transition: transform .15s ease, box-shadow .3s ease;
      }
      .dk-play:hover { transform: scale(1.05); }
      .dk-play:focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(var(--ll-teal-rgb), .35); }
      .dk-stage:not(.is-playing) .dk-play { animation: dk-pulse 2.4s ease-out infinite; }
      @keyframes dk-pulse { 0% { box-shadow: 0 0 0 0 rgba(var(--ll-teal-rgb), .45); } 70%, 100% { box-shadow: 0 0 0 16px rgba(var(--ll-teal-rgb), 0); } }
      .dk-time { font-size: 13px; font-weight: 700; color: var(--ll-ink-soft); font-variant-numeric: tabular-nums; }
      .dk-voice-note { font-size: 11px; color: var(--ll-ink-faint); letter-spacing: .04em; text-transform: uppercase; }
      /* Review mode only (same rule as the clip's .cv-skip). */
      .dk-skip {
        display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px;
        border: 1px solid var(--ll-line); border-radius: 999px; background: transparent;
        font: inherit; font-size: 12px; font-weight: 700; color: var(--ll-ink-soft); cursor: pointer;
      }
      .dk-skip:hover { color: var(--ll-ink-strong); border-color: rgba(var(--ll-teal-rgb), .5); }
      .dk-skip:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(var(--ll-teal-rgb), .3); }
      .dk-skip[hidden] { display: none; }
      .dk-skip i { font-size: 10px; }

      /* Light mode. The stage was a fixed dark "screen" while the ink tokens
         flipped to black, so Read and Listen rendered black on navy. Watch
         keeps its own dark player surface (.ll-media); the reading and
         listening surfaces follow the page's panel tokens instead. */
      html.ll-vector-light .dk-stage {
        background: radial-gradient(120% 120% at 30% 10%, var(--ll-panel) 0%, var(--ll-panel-2) 100%);
      }
      html.ll-vector-light .dk-tools {
        background: rgba(var(--ll-panel-rgb), .9); box-shadow: var(--ll-shadow-sm);
      }
      html.ll-vector-light .dk-play { color: #fff; }
      html.ll-vector-light .dk-check.rf-layer { background: rgba(var(--ll-panel-rgb), .35); }
      html.ll-vector-light .dk-card { background: var(--ll-panel); }

      /* A carrier the podcast path doesn't offer (Listen, on a remedial
         screen), and the whole switch on a question-only screen. */
      .dk-sw[hidden], .dk-switch[hidden] { display: none; }

      /* ==== The podcast path (2026-09-25) =================================
         The offer after the pre-check, and the continuous episode. The
         episode reuses the Listen carrier's stage, waveform and captions
         (.dk-*) as they are; only the chapter list and back-15 are new. */
      .ll-stage:has(.po) .ll-object { justify-content: center; }
      .po { width: min(780px, 100%); margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
      /* Balanced, so the title never strands one word on its own line. */
      .ll-object .po-head { margin: 0; font-size: clamp(24px, 3vw, 32px); font-weight: 800; line-height: 1.2;
        letter-spacing: -.01em; color: var(--ll-ink-strong); text-wrap: balance; }
      /* Headline block (also the "Next, try it in a scenario" screen). */
      .po-top { display: flex; flex-direction: column; gap: 6px; }
      /* Three tall cards side by side: icon + radio on top, name, then a quiet
         picture of the experience's shape pinned to the bottom. */
      .po-opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
      .po-opt {
        display: flex; flex-direction: column; gap: 14px; min-height: 230px; padding: 18px; text-align: left;
        border: 1px solid var(--ll-line); border-radius: 8px; background: rgba(var(--ll-surface-rgb), .04);
        font: inherit; color: inherit; cursor: pointer; transition: border-color .2s ease, background .2s ease;
      }
      .po-opt:hover { border-color: rgba(var(--ll-teal-rgb), .6); }
      .po-opt:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(var(--ll-teal-rgb), .3); }
      .po-opt[aria-checked="true"] { border-color: var(--ll-teal); background: rgba(var(--ll-teal-rgb), .1);
        box-shadow: 0 0 0 1px var(--ll-teal); }
      .po-opt-top { display: flex; align-items: flex-start; justify-content: space-between; }
      .po-ico { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center;
        background: rgba(var(--ll-teal-rgb), .14); color: var(--ll-teal); font-size: 24px; }
      .po-radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ll-line); display: grid; place-items: center; }
      .po-opt[aria-checked="true"] .po-radio { border-color: var(--ll-teal); background: var(--ll-teal); }
      .po-opt[aria-checked="true"] .po-radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ll-panel); }
      .po-txt { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
      .po-txt b { font-size: 19px; font-weight: 700; line-height: 1.25; color: var(--ll-ink-strong); }
      .po-txt small { display: block; font-size: 14px; line-height: 1.45; color: var(--ll-ink-soft); text-wrap: balance; }
      .po-tag { flex: none; padding: 1px 10px; border-radius: 999px; border: 1px solid rgba(var(--ll-teal-rgb), .6);
        font-size: 11.5px; line-height: 18px; font-weight: 700; color: var(--ll-teal); }
      /* The pictures: flat and quiet, clearly not controls. */
      .po-vis { margin-top: auto; display: grid; grid-template-columns: 1fr clamp(32px, 22%, 56px); gap: 6px;
        pointer-events: none; user-select: none; }
      .po-vis--std { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .po-pair { display: flex; gap: 3px; }
      .po-pair .w { display: block; flex: 1; height: 8px; border-radius: 4px; background: var(--ll-ink-soft); opacity: .45; }
      .po-pair .k { display: block; width: 18%; min-width: 8px; height: 8px; border-radius: 4px; background: #f5b94a; opacity: .85; }
      .po-wave { display: flex; align-items: center; justify-content: space-between; height: 30px; overflow: hidden; min-width: 0; }
      .po-wave i { display: block; width: 3px; flex: none; border-radius: 2px; background: var(--ll-teal); opacity: .6; }
      .po-kz { align-self: center; height: 8px; border-radius: 4px; background: #f5b94a; opacity: .85; }
      /* Narrow screens: one card per row, icon beside the name. */
      @media (max-width: 640px) {
        .po-opts { grid-template-columns: 1fr; }
        .po-opt { min-height: 0; display: grid; grid-template-columns: 56px minmax(0, 1fr) 22px; align-items: center; gap: 8px 14px; }
        .po-opt-top { display: contents; }
        .po-opt-top .po-ico { grid-column: 1; grid-row: 1; }
        .po-opt-top .po-radio { grid-column: 3; grid-row: 1; }
        .po-txt { grid-column: 2; grid-row: 1; }
        .po-vis { grid-column: 1 / -1; margin-top: 0; }
      }
      .po-save { display: inline-flex; align-items: center; gap: 10px; align-self: flex-start; cursor: pointer;
        font-size: 14px; color: var(--ll-ink-soft); }
      .po-save[hidden] { display: none; }
      .po-save input { width: 18px; height: 18px; margin: 0; accent-color: var(--ll-teal); cursor: pointer; }
      .po-save:hover { color: var(--ll-ink-strong); }

      /* The episode never scrolls (2026-09-25): no video, so no 16:9 —
         the stage takes whatever height is left under the header. */
      .ep-object .dk-theater { flex: 1 1 auto; min-height: 0; max-height: 860px; width: min(100%, 1100px); }
      .ep-object .dk-stagewrap { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
      .ep-object .dk-stage { flex: 1 1 auto; aspect-ratio: auto; height: auto; min-height: 300px; }
      .ep-wave-wrap { cursor: default; }
      /* Recorded audio (2026-10-01): preparing / error over the stage, speed,
         and spoken emphasis in the captions. */
      .ep-prep { position: absolute; inset: 0; z-index: 6; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 16px; padding: 24px; background: rgba(6, 11, 22, .82); text-align: center; }
      html.ll-vector-light .ep-prep { background: rgba(var(--ll-panel-rgb), .9); }
      .ep-prep[hidden] { display: none; }
      .ep-prep-t { margin: 0; max-width: 46ch; font-size: 15px; line-height: 1.5; color: var(--ll-ink-soft); }
      .ep-prep.is-error .ep-prep-t { color: var(--ll-ink-strong); }
      .ep-prep.is-error .ep-prep-track { display: none; }
      .ep-prep-track { width: min(280px, 70%); }
      .ep-prep-retry { margin-top: 0; }
      .ep-speed { min-width: 48px; justify-content: center; font-variant-numeric: tabular-nums; }
      .ep-speed[hidden] { display: none; }
      .dk-cap-now span.is-em { font-style: italic; }
      .ep-back:disabled, .dk-play:disabled, .ep-ch-btn:disabled { opacity: .35; cursor: default; }

      /* The review set and the completion screen (Listen mode). */
      .po-sub { margin: 4px 0 0; font-size: 15px; line-height: 1.5; color: var(--ll-ink-soft); }
      .rv-object { justify-content: safe center; }
      .rv-cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
      .rv-card { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 14px 16px; border: 1px solid var(--ll-line);
        border-radius: 4px; background: rgba(var(--ll-surface-rgb), .04); }
      .rv-card p { margin: 0; font-size: 15px; line-height: 1.55; color: var(--ll-ink); }
      .ll-object .rv-card-h { margin: 0 0 4px; font-size: 15px; font-weight: 700; color: var(--ll-ink-strong); }
      .rv-n { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800;
        background: rgba(var(--ll-teal-rgb), .14); color: var(--ll-teal); }
      .rv-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
      .rv-actions .bl-check { margin-top: 0; }
      .rv-recap { padding: 9px 14px; font-size: 13px; }
      .rv-q { display: flex; flex-direction: column; }
      .rv-q .bl-check { align-self: flex-start; margin-top: 18px; }
      .rv-note { color: var(--ll-ink-soft); }

      /* Splice test (Demo menu, review only). */
      .sp-panel { position: fixed; left: 16px; bottom: 96px; z-index: 60; width: min(380px, calc(100vw - 32px));
        display: grid; gap: 10px; padding: 14px 16px; border-radius: 6px; border: 1px solid var(--ll-line);
        background: var(--ll-panel); box-shadow: var(--ll-shadow); font-size: 13px; color: var(--ll-ink-soft); }
      .sp-head { display: flex; align-items: center; gap: 10px; }
      .sp-head b { color: var(--ll-ink-strong); font-size: 14px; }
      .sp-head span { flex: 1; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ll-ink-faint); }
      .sp-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .sp-row select, .sp-row input { font: inherit; padding: 5px 8px; border-radius: 4px; border: 1px solid var(--ll-line);
        background: rgba(var(--ll-surface-rgb), .06); color: var(--ll-ink-strong); }
      .sp-row input { width: 90px; }
      .sp-code { display: block; padding: 8px 10px; border-radius: 4px; background: rgba(var(--ll-surface-rgb), .08);
        font-size: 13px; color: var(--ll-ink-strong); user-select: all; }
      .sp-note { margin: 0; font-size: 12px; color: var(--ll-ink-faint); }
      .ep-player-start { justify-self: start; display: flex; align-items: center; gap: 12px; }
      .ep-back {
        display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border: 1px solid var(--ll-line);
        border-radius: 999px; background: transparent; font: inherit; font-size: 12px; font-weight: 700;
        color: var(--ll-ink-soft); cursor: pointer;
      }
      .ep-back:hover { color: var(--ll-ink-strong); border-color: rgba(var(--ll-teal-rgb), .5); }
      .ep-back:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(var(--ll-teal-rgb), .3); }
      .ep-back i { font-size: 11px; }
      .ep-ch-btn {
        display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border: 1px solid var(--ll-line);
        border-radius: 999px; background: rgba(var(--ll-surface-rgb), .06); font: inherit; font-size: 13px; font-weight: 700;
        color: var(--ll-ink-soft); cursor: pointer; transition: color .2s ease, border-color .2s ease, background .2s ease;
      }
      .ep-ch-btn:hover { color: var(--ll-ink-strong); }
      .ep-ch-btn[aria-expanded="true"] { background: rgba(var(--ll-teal-rgb), .16); color: var(--ll-teal); border-color: transparent; }
      .ep-ch-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(var(--ll-teal-rgb), .3); }
      /* Over the stage: the waveform and captions blur behind the list, and
         keep running — the episode doesn't pause to show it. */
      .ep-ch-panel {
        position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; gap: 10px;
        padding: 4% 6%; overflow-y: auto; background: rgba(6, 11, 22, .72);
        -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
        animation: ep-ch-in .25s var(--ll-ease) both;
      }
      .ep-ch-panel[hidden] { display: none; }
      html.ll-vector-light .ep-ch-panel { background: rgba(var(--ll-panel-rgb), .82); }
      @keyframes ep-ch-in { from { opacity: 0; } to { opacity: 1; } }
      .ep-ch-head { display: flex; align-items: center; justify-content: space-between; }
      .ll-object .ep-ch-head h2 { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ll-ink-soft); }
      .ep-ch-close { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--ll-line);
        background: transparent; color: var(--ll-ink-soft); cursor: pointer; font-size: 14px; }
      .ep-ch-close:hover { color: var(--ll-ink-strong); }
      .ep-ch-close:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(var(--ll-teal-rgb), .3); }
      .ep-chapters { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
      .ep-ch { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 12px; padding: 9px 12px;
        border-radius: 4px; font-size: 14px; color: var(--ll-ink-soft); }
      .ep-ch-n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800;
        border: 1px solid var(--ll-line); color: var(--ll-ink-faint); }
      .ep-ch-d { font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ll-ink-faint); }
      .ep-ch.is-now { background: rgba(var(--ll-teal-rgb), .1); color: var(--ll-ink-strong); font-weight: 700; }
      .ep-ch.is-now .ep-ch-n { border-color: var(--ll-teal); color: var(--ll-teal); }
      .ep-ch.is-done .ep-ch-n { background: rgba(var(--ll-teal-rgb), .16); border-color: transparent; color: var(--ll-teal); }
      @media (max-width: 640px) {
        .ep-player-start .dk-voice-note { display: none; }
        /* Phones: Chapters goes icon-only and stays top-right of the title
           instead of wrapping under it. */
        .ep-object .dk-head { flex-wrap: nowrap; align-items: flex-start; }
        .ep-ch-btn { flex: none; width: 40px; height: 40px; padding: 0; justify-content: center; }
        .ep-ch-btn span { display: none; }
      }

      /* The question, over the stage. The layer spans the stage; the card
         inside it is the ask. Tall questions scroll inside the layer. */
      .dk-check.rf-layer {
        position: absolute; inset: 0; margin: 0; padding: clamp(12px, 3vh, 36px) 16px;
        box-sizing: border-box; border: 0; border-radius: 18px; background: rgba(4, 8, 16, .35);
        box-shadow: none; display: flex; align-items: safe center; justify-content: center; overflow-y: auto;
      }
      .dk-check.rf-layer:focus-visible { box-shadow: none; }
      /* Over the whole page, not just the frame. When the question rises,
         the layer is moved to <body> (deckInit → finished) and fixed to the
         viewport: a scrim over the site header, the title row and the stage,
         with the card centred in it. The footer (z 45) stays above so Back /
         Continue remain reachable; the layer stops at its top edge. Fixed to
         the viewport, the card is never limited by the frame's height, and a
         card taller than the window scrolls inside the scrim. */
      .dk-check.dk-check--page {
        position: fixed; top: 0; left: 0; right: 0; bottom: var(--ll-footer-h);
        z-index: 44; margin: 0; padding: clamp(16px, 4vh, 48px) 16px;
        border-radius: 0; box-shadow: none;
        background: rgba(4, 8, 16, .55);
        -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
        overflow-y: auto; overscroll-behavior: contain;
      }
      html.ll-vector-light .dk-check.dk-check--page { background: rgba(var(--ll-panel-rgb), .5); }
      .dk-card {
        width: min(720px, 100%); box-sizing: border-box; margin: auto 0;
        display: flex; flex-direction: column; text-align: left;
        padding: 24px 26px 26px; border-radius: 18px;
        border: 1px solid rgba(var(--ll-teal-rgb), .3);
        background: linear-gradient(180deg, var(--ll-panel-2), var(--ll-bg));
        box-shadow: var(--ll-shadow);
      }
      .dk-card > :first-child { margin-top: 0; }
      /* .rf-layer > :first-child zeroes the top margin, which left only the
         bottom auto margin and pinned the card to the top of the stage. */
      .dk-check.rf-layer > .dk-card { margin: auto 0; }

      /* ==== The simulation (deck slides 23–27) ============================
         The "A Critical Choice" riff's binocular view on the stage, with the
         coach panel over the scene's right side. Binocular while a moment is
         being set; the full shot while the learner answers. */
      .sc-ph {
        align-self: flex-end; display: inline-flex; align-items: center; gap: 6px;
        font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        color: #f1b34a; border: 1px solid rgba(241, 179, 74, .45); border-radius: 999px; padding: 5px 11px;
      }
      .sc-stage { display: grid; grid-template-columns: minmax(0, 1fr) min(380px, 36%); background: #05080f; }
      .sc-scene { position: relative; overflow: hidden; }
      /* Three views; the active one (data-view) is shown. Leaving a view
         scales it slightly past the viewer as it fades — lowering the
         binoculars grows the lens away while the wide shot settles back in
         from a touch closer; raising them does the reverse. */
      .sc-view {
        position: absolute; opacity: 0; pointer-events: none;
        transition: opacity .75s ease, transform .9s cubic-bezier(.65, 0, .35, 1);
      }
      .sc-wide, .sc-close { inset: 0; transform: scale(1.05); }
      .sc-wide .sc-img, .sc-close .sc-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .sc-wide .sc-img-bg { filter: blur(22px) brightness(.42); transform: scale(1.1); }
      .sc-wide .sc-img-fit { object-fit: contain; }
      .sc-bino { left: 50%; top: 50%; transform: translate(-50%, -50%) scale(1.14); overflow: hidden; }
      .sc-scene[data-view="wide"] .sc-wide,
      .sc-scene[data-view="close"] .sc-close { opacity: 1; transform: none; }
      .sc-scene[data-view="bino"] .sc-bino { opacity: 1; transform: translate(-50%, -50%); }
      .sc-bino .sc-img { position: absolute; left: 0; top: 0; max-width: none; transform-origin: 0 0; will-change: transform; transition: transform 1.6s cubic-bezier(.65, 0, .35, 1); }
      .sc-jitter { position: absolute; inset: 0; }
      .sc-vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0, 0, 0, .55) 100%); }

      .sc-panel {
        position: relative; z-index: 3; display: flex; flex-direction: column; min-height: 0;
        background: rgba(10, 16, 30, .9); border-left: 1px solid var(--ll-line);
        /* the shared mic component reads these */
        --c-ink: var(--ll-ink-strong); --c-ink-soft: var(--ll-ink-soft); --c-ink-faint: var(--ll-ink-faint);
        --c-surface-2: rgba(255, 255, 255, .08); --c-accent: var(--ll-teal);
      }
      /* Light mode: the panel was a fixed navy while its ink flipped to
         black. It follows the page's panel tokens instead; the scene beside
         it is a photograph and stays as it is. */
      html.ll-vector-light .sc-panel {
        background: rgba(var(--ll-panel-rgb), .96);
        --c-surface-2: rgba(0, 0, 0, .06);
      }
      html.ll-vector-light .sc-send { color: #fff; }
      /* The scene stage shares .dk-stage, so the light reading-stage rule
         turned the binocular surround white. A photograph through
         binoculars stays dark in every style. */
      html.ll-vector-light .dk-stage.sc-stage { background: #05080f; }
      .sc-panel-head {
        display: flex; align-items: center; gap: 8px; padding: 14px 16px;
        font-size: 11px; font-weight: 800; letter-spacing: .1em; color: var(--ll-ink-soft);
        border-bottom: 1px solid var(--ll-line);
      }
      .sc-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ll-teal); box-shadow: 0 0 10px rgba(var(--ll-teal-rgb), .7); }
      .sc-beat { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--ll-ink-faint); }
      .sc-thread { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
      .sc-msg {
        max-width: 94%; padding: 10px 13px; border-radius: 14px; font-size: 14.5px; line-height: 1.55;
        animation: sc-in .3s var(--ll-ease) both;
      }
      .sc-coach { align-self: flex-start; background: rgba(var(--ll-surface-rgb), .07); color: var(--ll-ink-strong); border-bottom-left-radius: 4px; }
      .sc-you { align-self: flex-end; background: rgba(var(--ll-teal-rgb), .16); color: var(--ll-ink-strong); border-bottom-right-radius: 4px; }
      @keyframes sc-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .tdots { display: inline-flex; gap: 4px; padding: 3px 0; }
      .tdots span { width: 6px; height: 6px; border-radius: 50%; background: var(--ll-ink-faint); animation: sc-dots 1.1s ease-in-out infinite; }
      .tdots span:nth-child(2) { animation-delay: .15s; } .tdots span:nth-child(3) { animation-delay: .3s; }
      @keyframes sc-dots { 0%, 80%, 100% { opacity: .3; transform: none; } 40% { opacity: 1; transform: translateY(-3px); } }
      .sc-compose { padding: 12px; border-top: 1px solid var(--ll-line); }
      .sc-shell {
        display: flex; align-items: flex-end; gap: 6px; padding: 8px 8px 8px 12px;
        border: 1px solid var(--ll-line); border-radius: 14px; background: rgba(var(--ll-surface-rgb), .05);
      }
      .sc-shell:focus-within { border-color: rgba(var(--ll-teal-rgb), .6); }
      .sc-shell textarea {
        flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: transparent;
        font: inherit; font-size: 14.5px; line-height: 1.45; color: var(--ll-ink-strong); max-height: 140px;
      }
      .sc-shell textarea::placeholder { color: var(--ll-ink-faint); }
      .sc-shell textarea:disabled { opacity: .5; }
      .sc-send {
        width: 34px; height: 34px; flex: none; border-radius: 50%; border: 0; cursor: pointer;
        background: var(--ll-teal); color: #04121a; display: grid; place-items: center; font-size: 13px;
      }
      .sc-send:disabled { opacity: .3; cursor: default; }
      .sc-hint { margin: 6px 2px 0; min-height: 1.2em; font-size: 11.5px; color: var(--ll-ink-faint); }

      /* The rubric card, over the scene. */
      .sc-rows { display: flex; flex-direction: column; gap: 10px; }
      .sc-row { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; }
      .sc-mark {
        width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12px;
        border: 1.5px solid var(--ll-line-soft); color: var(--ll-ink-faint);
      }
      .sc-row.is-met  .sc-mark { background: var(--ll-teal); border-color: var(--ll-teal); color: #04121a; }
      .sc-row.is-part .sc-mark { background: #f1b34a; border-color: #f1b34a; color: #231602; }
      .sc-row.is-miss .sc-mark { background: #ff6b6b; border-color: #ff6b6b; color: #2a0707; }
      .sc-row-t { display: flex; flex-direction: column; gap: 2px; }
      .sc-row-t b { font-size: 15px; color: var(--ll-ink-strong); }
      .sc-row-t span { font-size: 13.5px; line-height: 1.5; color: var(--ll-ink-soft); }
      .sc-row-t q { margin-top: 4px; font-size: 13px; font-style: italic; color: var(--ll-ink); }
      .sc-rule { height: 1px; background: var(--ll-line); margin: 4px 0; }

      /* ---- Sizing. The scene doesn't share the video stage's 16:9 frame:
         that frame is sized from the window's height, so on a laptop-short
         window it shrank the whole scene and left the CLARA panel ~200px
         wide. The scene instead fills the room between the title row and
         the footer, and the panel never drops below a readable width. The
         side gutters keep the Ask CLARA launcher (bottom-right of the
         stage) off the composer. */
      .ll-object.sc-object { padding-inline: 100px; justify-content: flex-start; }
      .sc-object .dk-theater { --dk-w: min(100%, 1360px); min-width: 0; flex: 1 1 0; max-height: 880px; }
      .sc-object .dk-stagewrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .sc-object .dk-stage.sc-stage { flex: 1; aspect-ratio: auto; height: auto; min-height: 380px; }
      /* rows pinned to the frame, so a long thread scrolls inside the panel
         instead of stretching the frame past the footer */
      .sc-stage { grid-template-columns: minmax(0, 1fr) clamp(320px, 34%, 400px); grid-template-rows: minmax(0, 1fr); }

      /* ---- Breakout. Below ~900px, or on any portrait window (a tablet
         held upright), a framed scene beside a panel leaves the picture a
         tall narrow column of black, so the scene leaves the frame: it runs
         edge to edge between the header and the footer, the picture as a
         band across the top and the CLARA thread under it. The title row
         goes (the header band above already names the step) but stays for
         screen readers; the placeholder chip rides on the picture. */
      /* Short windows fold the title row away too — it only repeats the
         header band — so the frame gets the height. */
      @media (max-width: 900px), (orientation: portrait), (max-height: 720px) {
        .sc-object .dk-theater { gap: 0; }
        .sc-object .dk-head { position: absolute; top: 12px; right: 12px; z-index: 4; }
        .sc-object .dk-head-t {
          position: absolute; width: 1px; height: 1px; overflow: hidden;
          clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
        }
        .sc-object .sc-ph { background: rgba(5, 8, 15, .7); }
      }
      @media (min-width: 901px) and (orientation: landscape) and (max-height: 720px) {
        .sc-object .dk-head { top: calc(clamp(14px, 3vh, 32px) + 12px); right: 112px; }
        .sc-object .dk-stage.sc-stage { min-height: 320px; }
      }
      @media (max-width: 900px), (orientation: portrait) {
        .ll-object.sc-object { padding: 0; }
        .sc-object .dk-theater { --dk-w: 100%; width: 100%; max-height: none; }
        .sc-object .dk-stage.sc-stage {
          grid-template-columns: 1fr; grid-template-rows: clamp(190px, 42%, 460px) minmax(0, 1fr);
          min-height: 460px; border: 0; border-radius: 0; box-shadow: none;
        }
        .sc-scene { --sc-lens-h: .78; }
        .sc-msg { max-width: min(94%, 64ch); }   /* a readable measure on a wide tablet */
        .sc-panel { border-left: 0; border-top: 1px solid var(--ll-line); }
        /* clear of the Ask CLARA launcher, which now sits over the panel */
        .sc-compose { padding-right: 88px; }
        .ll-stage:has(.sc-object) .clara-cue { display: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sc-bino .sc-img, .sc-view { transition: none; }
        .sc-msg, .tdots span { animation: none; }
      }

      /* Short windows: the stage can't be both 16:9 and tall enough for the
         reader, so it drops the ratio and takes the height instead. Phones
         get the same treatment. */
      @media (max-height: 640px), (max-width: 700px) {
        .dk-theater { --dk-w: 100%; }
        .dk-stage { aspect-ratio: auto; height: max(420px, calc(100vh - 320px)); }
        .dk-stage[data-mode="video"] { aspect-ratio: 16 / 9; height: auto; }
        .dk-check.dk-check--page { padding: 12px 10px; }
        .dk-card { padding: 18px 16px 20px; }
        .dk-sw span { display: none; }
        .dk-sw { padding: 8px 12px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .dk-layer, .dk-para, .dk-rail-fill { transition: none; }
        .dk-next { animation: none; }
        .dk-cap-now.is-in, .dk-stage:not(.is-playing) .dk-play { animation: none; }
      }

      /* ==== Reinforcement layer ============================================
         One extra question laid OVER the content that motivates it. Used by
         the three screens that ask twice (the account, the budget choice, the
         cohort figures). The content is HELD rather than replaced: it stays
         legible behind a light blur, so the learner can see WHAT the second
         question is about — the same language the Scenario Simulator uses
         when its coach panel comes forward over a live scene.

         Everything except the layer is what recedes, so no screen needed its
         markup restructured to adopt this. */
      .rf-on > *:not(.rf-layer) {
        filter: blur(2.4px);
        opacity: .42;
        pointer-events: none;
        user-select: none;
        transition: filter .42s ease, opacity .42s ease;
      }
      .rf-layer {
        position: relative;
        margin-top: 30px;
        padding: 24px 26px 26px;
        /* The card holds a question ABOUT the content behind it, so it keeps
           that content's own measure and alignment. Two things went wrong
           when it didn't: border-box let 52px of padding eat into the
           column, so the question wrapped where the chart it refers to does
           not; and .ef-wrap centres its children, so the card came out as a
           narrow centred stack in a module that left-aligns everything. */
        box-sizing: content-box;
        align-items: stretch;
        text-align: left;
        border: 1px solid rgba(var(--ll-teal-rgb), .3);
        border-radius: 18px;
        background: linear-gradient(180deg, var(--ll-panel-2), var(--ll-bg));
        box-shadow: var(--ll-shadow);
        animation: rf-rise .44s var(--ll-ease) both;
      }
      /* The card carries its own edge, so the divider .ct-second draws when it
         is stacked underneath would be a second line in the same place. */
      .rf-layer.ct-second { border-top: 1px solid rgba(var(--ll-teal-rgb), .3); padding-top: 24px; }
      .rf-layer > :first-child { margin-top: 0; }
      /* Where you are in a screen that asks twice. Top-right of the card so it
         reads as a property of the card rather than as another line of copy
         competing with the question. */
      .rf-step {
        position: absolute; top: 14px; right: 18px;
        font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
        color: var(--ll-ink-faint);
        padding: 3px 9px; border-radius: 999px;
        background: rgba(var(--ll-surface-rgb), .04); border: 1px solid var(--ll-line);
      }
      /* The card takes focus when it appears, and a focus ring on a whole card
         reads as an error state — the reveal animation is the cue instead. */
      .rf-layer:focus { outline: none; }
      .rf-layer:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(var(--ll-teal-rgb), .28), 0 20px 54px rgba(0, 0, 0, .55); }
      @keyframes rf-rise {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: none; }
      }
      /* Reduced motion: drop the blur and the rise, keep the dim. Same call
         the simulator makes on its frozen stage — a static dim still says
         "held" without animating or softening anything. */
      @media (prefers-reduced-motion: reduce) {
        .rf-layer { animation: none; }
        .rf-on > *:not(.rf-layer) { filter: none; opacity: .5; transition: none; }
      }

      /* ==== The Sustain commit, inside the rehearsal card ==================
         Two fields: which shift breaks it for you, and where your container
         is in your own words. Replaced a separate screen that asked the
         learner to pick a follow-up date. */
      .wk-field-h {
        margin: 18px 0 10px; max-width: var(--sh-measure, 62ch);
        font-size: 14px; font-weight: 700; color: var(--ll-ink-strong); text-align: left;
      }
      /* The sentence the field completes, shown above it. One weight, one
         size, italic — it is a quotation, not another instruction. */
      .wk-stem {
        margin: 0 0 12px; max-width: var(--sh-measure, 62ch);
        font-size: 16px; line-height: 1.5; color: var(--ll-ink-soft);
        font-style: italic; text-align: left;
      }
      .wk-conds { display: grid; gap: 8px; max-width: 560px; }
      .wk-cond {
        padding: 12px 15px; border-radius: 11px; text-align: left;
        border: 1px solid var(--ll-line); background: rgba(var(--ll-surface-rgb), .03);
        color: var(--ll-ink); font: inherit; font-size: 14px; cursor: pointer;
        transition: border-color .15s ease, background .15s ease;
      }
      .wk-cond:hover:not(:disabled) { border-color: rgba(var(--ll-teal-rgb), .4); background: rgba(var(--ll-teal-rgb), .05); }
      .wk-cond:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(var(--ll-teal-rgb), .3); }
      .wk-cond.picked { border-color: rgba(var(--ll-teal-rgb), .6); background: rgba(var(--ll-teal-rgb), .09); color: var(--ll-ink-strong); }
      .wk-cond:disabled { cursor: default; opacity: .5; }
      .wk-cond.picked:disabled { opacity: 1; }
      .wk-route {
        width: 100%; max-width: 560px; padding: 13px 15px;
        border-radius: 11px; border: 1px solid var(--ll-line);
        /* A recessed "well" a shade darker than the panel it sits on. --sh-recess-a
           is the darkening amount, not a fixed colour, so the light variant can
           turn it down instead of inverting it to a muddy black-on-white fill. */
        background: rgba(0, 0, 0, var(--sh-recess-a, .25)); color: var(--ll-ink-strong); font: inherit; font-size: 15px;
      }
      .wk-route::placeholder { color: var(--ll-ink-faint); }
      .wk-route:focus { outline: none; border-color: rgba(var(--ll-teal-rgb), .5); }
      .wk-route:disabled { opacity: .8; }
      #wkCommit { margin-top: 16px; }

      /* ==== The chain — one decision, followed through =======================
         F1's screen, and the module's first content. Local to this module
         rather than in layered-beats.css: that file is strictly the patterns
         the Bystander course shares, and nothing else uses this yet. Promote
         it there if a second module adopts the mechanic.

         Vertical, not the horizontal strip the spec drew. Four nodes of two
         lines each do not survive a phone laid out left to right, and this
         module gets reviewed on both. */
      .ch-wrap { width: min(660px, 100%); margin-top: 8px; display: flex; flex-direction: column; align-items: stretch; }

      /* The frame: one imperative, no chrome, tapped past rather than read
         around. It is the line the debrief closes back on. */
      .ch-frame { display: flex; flex-direction: column; align-items: flex-start; padding: 26px 0 8px; }
      /* A mark, so the activity has a shape before it has any content. The
         frame was three lines of text on an empty field and read as a title
         card rather than the front of something you are about to do. */
      .ch-frame-mark {
        display: grid; place-items: center;
        width: 52px; height: 52px; margin-bottom: 22px;
        border-radius: 14px;
        background: rgba(var(--ll-teal-rgb), .12);
        border: 1px solid rgba(var(--ll-teal-rgb), .3);
        color: var(--ll-teal); font-size: 21px;
      }
      /* Cross-fade into the timeline. The frame used to be switched off and
         the run switched on in the same tick, which read as a cut. */
      .ch-frame { transition: opacity .24s ease, transform .24s var(--ll-ease); }
      .ch-frame.is-leaving { opacity: 0; transform: translateY(-6px); }
      .ch-run { transition: opacity .3s ease, transform .3s var(--ll-ease); }
      .ch-run.is-entering { opacity: 0; transform: translateY(8px); }
      @media (prefers-reduced-motion: reduce) {
        .ch-frame, .ch-run { transition: none; }
        .ch-frame.is-leaving, .ch-run.is-entering { transform: none; }
      }
      .ch-lead {
        margin: 0; max-width: 30ch;
        font-size: clamp(26px, 5vw, 38px); font-weight: 800; line-height: 1.18;
        letter-spacing: -.015em; color: var(--ll-ink-strong); text-align: left;
      }
      .ch-lead-sub {
        margin: 16px 0 0; max-width: 44ch;
        font-size: 16.5px; line-height: 1.6; color: var(--ll-ink-soft); text-align: left;
      }
      .ch-start {
        margin-top: 30px; align-self: flex-start;
        font: inherit; font-size: 14px; font-weight: 700; color: #04121a;
        background: var(--ll-teal); border: 0; border-radius: var(--sh-ctrl-radius, 999px);
        padding: 11px 26px; cursor: pointer;
        transition: filter .16s ease, transform .16s ease;
      }
      .ch-start:hover { filter: brightness(1.08); transform: translateY(-1px); }
      .ch-start:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(var(--ll-teal-rgb), .35); }
      @media (prefers-reduced-motion: reduce) { .ch-start:hover { transform: none; } }

      /* Item 31/D11: the bridge into the culminating scenario. Same shape as
         the timeline's own frame (a mark, a lead line, a sub-line) since both
         are "here is the moment you are about to step into" screens — but its
         own class names, since this one carries no transition of its own and
         adds the "what will happen" block the frame never needed. */
      .ho-wrap { display: flex; flex-direction: column; align-items: flex-start; padding: 26px 0 8px; }
      .ho-mark {
        display: grid; place-items: center;
        width: 52px; height: 52px; margin-bottom: 22px;
        border-radius: 14px;
        background: rgba(var(--ll-teal-rgb), .12);
        border: 1px solid rgba(var(--ll-teal-rgb), .3);
        color: var(--ll-teal); font-size: 21px;
      }
      .ho-lead {
        margin: 0; max-width: 34ch;
        font-size: clamp(24px, 4.5vw, 34px); font-weight: 800; line-height: 1.2;
        letter-spacing: -.015em; color: var(--ll-ink-strong); text-align: left;
      }
      .ho-lead-sub {
        margin: 16px 0 0; max-width: 46ch;
        font-size: 16px; line-height: 1.6; color: var(--ll-ink-soft); text-align: left;
      }
      .ho-what {
        margin-top: 28px; padding: 16px 18px; max-width: 46ch;
        border-radius: 14px; border: 1px solid var(--ll-line); background: rgba(var(--ll-surface-rgb), .03);
      }
      .ho-what-h { margin: 0 0 8px; font-size: 12.5px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; color: var(--ll-teal); }
      .ho-what-d { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--ll-ink-soft); }

      /* The hero version: the scene's still runs full-bleed behind the copy,
         framed the way the scenario player frames its own backdrop
         (center / cover), so this screen reads as the simulator's first frame.
         .ho-read is the reading wash (heavy on the copy side, light over the
         sharp); .ho-sim is the player's coach-up state — its has-hero
         gradient plus its coach scrim — faded in on "Enter the scenario"
         while the copy leaves and the still takes the player's 2.5px blur. */
      /* Copy pinned LEFT, not centred: at wide windows the still fills the
         width (cover crops only top/bottom), so it can't slide over — the sharp
         sits just right of centre, and the copy has to stay clear of it. */
      .ll-object.ho-object {
        isolation: isolate; justify-content: center; align-items: flex-start;
        padding-inline: clamp(24px, 6vw, 104px);
      }
      .ho-object .ho-wrap { max-width: min(500px, 42vw); }
      .ho-object .ho-lead { font-size: clamp(24px, 2.5vw, 34px); }
      .ho-bg, .ho-read, .ho-sim { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
      .ho-bg {
        background-position: center; background-size: cover; background-repeat: no-repeat;
        transition: filter .6s ease;
      }
      .ho-read {
        background:
          linear-gradient(90deg, rgba(7, 11, 20, .94) 0%, rgba(7, 11, 20, .86) 34%, rgba(7, 11, 20, .35) 62%, rgba(7, 11, 20, .12) 100%),
          linear-gradient(0deg, rgba(7, 11, 20, .45), transparent 30%);
        transition: opacity .6s ease;
      }
      .ho-sim {
        background:
          linear-gradient(rgba(8, 7, 5, .55), rgba(8, 7, 5, .55)),
          linear-gradient(rgba(8, 12, 22, .62), rgba(8, 12, 22, .82));
        opacity: 0; transition: opacity .6s ease;
      }
      .ho-object .ho-wrap { position: relative; text-shadow: 0 1px 12px rgba(0, 0, 0, .5); transition: opacity .35s ease, transform .35s ease; }
      .ho-object .ho-what { background: rgba(7, 11, 20, .55); backdrop-filter: blur(6px); }
      .ho-object.ho-entering .ho-wrap { opacity: 0; transform: translateY(-10px); }
      .ho-object.ho-entering .ho-bg { filter: blur(2.5px); }
      .ho-object.ho-entering .ho-read { opacity: 0; }
      .ho-object.ho-entering .ho-sim { opacity: 1; }
      /* narrow: no room beside the copy, so the wash evens out top to bottom */
      @media (max-width: 760px) {
        .ho-object .ho-wrap { max-width: none; }
        .ho-read { background: linear-gradient(rgba(7, 11, 20, .55), rgba(7, 11, 20, .9) 45%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .ho-bg, .ho-read, .ho-sim, .ho-object .ho-wrap { transition: none; }
      }

      /* The nodes are APPENDED as they are revealed, not pre-rendered and
         un-hidden. Holding all of them in the DOM kept the list from
         reflowing, but it also parked the advance button hundreds of pixels
         below the last readable line — at its worst on the opening node,
         when the learner has the least to go on. The object is top-aligned
         for this beat (.ll-object--chain) so growth appends downward and
         nothing above the read point moves. */
      .ll-object--chain { justify-content: flex-start; }
      .ch-chain { list-style: none; margin: 18px 0 0; padding: 0; }
      .ch-node {
        display: grid; grid-template-columns: 26px 1fr; gap: 16px;
        position: relative;
        /* A CSS animation, not a class flipped on the next frame: a hidden or
           backgrounded tab never fires rAF, and a node whose reveal depended
           on one would sit at opacity 0 indefinitely. */
        animation: chNodeIn .42s var(--ll-ease) both;
      }
      @keyframes chNodeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      /* Earlier nodes stay VISIBLE and recede rather than being removed: the
         sequence has to be in view for the last node to mean anything. The
         dim lands on the TEXT so the connector keeps its full opacity. */
      .ch-node.is-past .ch-main { opacity: .5; }
      .ch-node.is-past.is-open .ch-main { opacity: .72; }
      .ch-node.is-past .ch-dot { opacity: .6; }
      @media (prefers-reduced-motion: reduce) { .ch-node { animation: none; } }

      /* ==== Folding a node the learner has moved past ====================
         Five expanded nodes plus their gap rows do not fit a laptop viewport,
         and the newest node is always the one that matters. A past node folds
         to its clock time and one peek line, and reopens on click. Reopening
         is sticky: advancing does not slam shut something the learner chose
         to open. */
      .ch-head {
        display: flex; align-items: baseline; gap: 12px; width: 100%;
        margin: 0; padding: 0; text-align: left;
        font: inherit; color: inherit; background: none; border: 0;
        border-radius: 7px;
      }
      .ch-head:disabled { cursor: default; }
      .ch-node.is-past .ch-head { cursor: pointer; }
      .ch-head:not(:disabled):focus-visible {
        outline: none; box-shadow: 0 0 0 3px rgba(var(--ll-teal-rgb), .28);
      }
      .ch-time { flex: 0 0 auto; }
      /* Hidden while the node is expanded — the body is saying it already. */
      .ch-peek { display: none; }
      .ch-chev {
        display: none; flex: 0 0 auto; margin-left: auto;
        font-size: 10px; color: var(--ll-ink-faint); transition: transform .2s ease;
      }
      .ch-node.is-past .ch-chev { display: block; }
      .ch-node.is-past.is-open .ch-chev { transform: rotate(180deg); }

      .ch-node.is-past:not(.is-open) .ch-body { display: none; }
      .ch-node.is-past:not(.is-open) .ch-peek {
        display: block; flex: 1 1 auto; min-width: 0;
        font-size: 14px; line-height: 1.5; color: var(--ll-ink-soft);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .ch-node.is-past .ch-head:hover .ch-time,
      .ch-node.is-past .ch-head:hover .ch-peek,
      .ch-node.is-past .ch-head:hover .ch-chev { color: var(--ll-teal); }
      @media (prefers-reduced-motion: reduce) { .ch-chev { transition: none; } }

      /* ==== The gap between two nodes, named and to scale =================
         The clocks alone never showed time passing: a one-minute gap, a
         four-hour gap and a twelve-week gap all rendered as the same 22px of
         padding, and the labels mixed a 24-hour clock, a 12-hour clock and a
         relative duration. The gap is now its own row carrying the elapsed
         time in words, and its height scales with the size of the jump — so
         the connector itself is the thing that shows the wait. */
      .ch-gapline {
        position: relative; display: grid; grid-template-columns: 26px 1fr; gap: 16px;
        align-items: center;
      }
      .ch-gapline::before {
        content: ''; position: absolute; left: 12.5px; top: 0; bottom: 0; width: 1px;
        background: rgba(var(--ll-teal-rgb), .45);
        animation: chLineIn .5s var(--ll-ease) both; transform-origin: top;
      }
      @keyframes chLineIn { from { transform: scaleY(0); } to { transform: scaleY(1); } }
      .ch-gapline span {
        grid-column: 2; font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
        text-transform: uppercase; color: var(--ll-ink-faint); text-align: left;
      }
      .ch-gapline.gap-s { min-height: 38px; }
      .ch-gapline.gap-m { min-height: 68px; }
      .ch-gapline.gap-l { min-height: 104px; }
      /* The tall connector exists to make the wait felt as it lands. Once the
         learner is past it, it has done that job and only costs height. */
      .ch-gapline.is-past.gap-s,
      .ch-gapline.is-past.gap-m,
      .ch-gapline.is-past.gap-l { min-height: 26px; }
      .ch-gapline.is-past span { font-size: 9.5px; opacity: .68; }
      @media (prefers-reduced-motion: reduce) { .ch-gapline::before { animation: none; } }

      /* ==== The decision ==================================================
         The screen promised one and never had one. Two options, both within
         reach in the scene above, and the chain runs from whichever is
         picked. */
      .ch-pick { margin-top: 22px; }
      /* ONE lockup: the scene and the two destinations in a single bounded
         card, image flush to the top corners. The point is that the choice is
         read off the frame — both destinations are visible in it — rather than
         off the prose above. Sectors without a hero get the same card minus
         the image, so nothing has to branch in CSS. */
      .ch-lockup {
        border: 1px solid var(--ll-line); border-radius: 16px; overflow: hidden;
        background: rgba(var(--ll-surface-rgb), .035);
      }
      .ch-hero {
        display: block; width: 100%; height: auto;
        /* Capped and cropped rather than left at its natural 16:9, which ran
           to 371px at this measure. Biased upward so the wall container near
           the top edge survives the crop — it is one of the two answers. */
        max-height: 268px; object-fit: cover; object-position: 50% 38%;
        /* Letterbox backdrop for a real photo, not page chrome — same
           reasoning as .cv-video above, left dark in every variant. */
        background: #060a11;
      }
      .ch-lockup-body { padding: 17px 18px 18px; }
      .ch-pick-q { margin: 0 0 13px; font-size: 18px; font-weight: 800; color: var(--ll-ink-strong); text-align: left; }
      /* Two abreast: it is a binary choice and side-by-side says so, while
         also keeping the lockup short. Stacks under 560px. */
      .ch-pick-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      @media (max-width: 559px) { .ch-pick-opts { grid-template-columns: 1fr; } }
      .ch-pick-opt {
        display: grid; grid-template-columns: 20px 1fr; gap: 12px; align-items: center;
        font: inherit; font-size: 14.5px; line-height: 1.4; text-align: left;
        color: var(--ll-ink); cursor: pointer;
        padding: 14px 16px; border-radius: 12px;
        background: rgba(var(--ll-surface-rgb), .05); border: 1px solid var(--ll-line);
        transition: border-color .16s ease, background .16s ease;
      }
      .ch-pick-opt:hover { border-color: rgba(var(--ll-teal-rgb), .55); background: rgba(var(--ll-teal-rgb), .08); }
      .ch-pick-opt:focus-visible { outline: none; border-color: var(--ll-teal); box-shadow: 0 0 0 3px rgba(var(--ll-teal-rgb), .25); }
      .ch-pick-opt i { color: var(--ll-teal); font-size: 15px; justify-self: center; }

      /* Take the other route. On the UNSAFE route this is what it has always
         been — a quiet offer, because the footer Continue is also live and
         moving on is the main thing. On the SAFE route it flips: seeing what
         the shortcut costs is worth more than just continuing, so `.is-primary`
         (toggled in chainInit's settle(), alongside demoting the footer button
         via ctx.els.next) makes it the stronger of the two calls instead. */
      .ch-retry {
        align-self: flex-start; margin-top: 20px;
        font: inherit; font-size: 13.5px; font-weight: 600; color: #f1b34a;
        background: rgba(241, 179, 74, .1); border: 1px solid rgba(241, 179, 74, .38);
        border-radius: 999px; padding: 10px 22px; cursor: pointer;
        transition: background .15s ease, border-color .15s ease, box-shadow .15s ease;
      }
      .ch-retry:hover { background: rgba(241, 179, 74, .18); border-color: rgba(241, 179, 74, .6); }
      .ch-retry:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(241, 179, 74, .3); }
      .ch-retry i { margin-right: 8px; font-size: 12px; }
      .ch-retry.is-primary {
        color: #052b27; background: var(--ll-grad); border-color: transparent;
        box-shadow: 0 6px 18px rgba(var(--ll-teal-2-rgb), .34);
      }
      .ch-retry.is-primary:hover { background: var(--ll-grad); filter: brightness(1.06); }
      .ch-retry.is-primary:focus-visible { box-shadow: 0 0 0 3px rgba(var(--ll-teal-rgb), .35); }

      /* ==== The downstream question, on its own screen ==================== */
      .dn-wrap { width: min(620px, 100%); display: flex; flex-direction: column; align-items: stretch; }
      .dn-hint { margin: 0; font-size: 14px; line-height: 1.6; color: var(--ll-ink-faint); text-align: left; }

      .ch-dot {
        width: 26px; height: 26px; margin-top: 2px; border-radius: 50%;
        display: grid; place-items: center;
        background: rgba(var(--ll-teal-rgb), .14); border: 1px solid rgba(var(--ll-teal-rgb), .42);
      }
      .ch-dot::after {
        content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--ll-teal);
      }
      .ch-main { display: flex; flex-direction: column; gap: 5px; min-width: 0; transition: opacity .42s ease; }
      .ch-time {
        font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
        color: var(--ll-teal); font-variant-numeric: tabular-nums;
      }
      .ch-body { font-size: 16px; line-height: 1.62; color: var(--ll-ink); text-align: left; }

      /* ==== The injury node — the one dot in the chain that isn't just
         another timestamp. Same amber this module already uses for a wrong
         answer (.ord-item.is-wrong, .ch-retry), not a new colour, so it reads
         as "this is the alarm state" rather than a one-off decoration. The
         tag sits outside the fold/unfold pair (see push(n) in
         js/layered-sharps.js) so it survives folding into a past node — the
         marker should still be visible even once the sentence collapses. */
      .ch-dot--injury {
        background: rgba(241, 179, 74, .16); border-color: rgba(241, 179, 74, .55);
      }
      .ch-dot--injury::after { background: #f1b34a; }
      .ch-alarm {
        display: inline-flex; align-self: flex-start; align-items: center; gap: 7px;
        font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
        color: #f1b34a; background: rgba(241, 179, 74, .12);
        border: 1px solid rgba(241, 179, 74, .4); border-radius: 999px;
        padding: 5px 13px 5px 10px; margin: 1px 0;
      }
      .ch-alarm i { font-size: 11px; }
      .ch-node--injury .ch-body { color: var(--sh-injury, #ffd9a3); font-weight: 600; }

      .ch-next {
        align-self: flex-start; margin-top: 22px;
        font: inherit; font-size: 13.5px; font-weight: 600; color: var(--ll-ink);
        background: rgba(var(--ll-surface-rgb), .05); border: 1px solid var(--ll-line);
        border-radius: 999px; padding: 10px 22px; cursor: pointer;
        transition: border-color .15s ease, background .15s ease, color .15s ease;
      }
      .ch-next:hover { border-color: var(--ll-teal); color: var(--ll-teal); background: rgba(var(--ll-teal-rgb), .1); }
      .ch-next:focus-visible { outline: none; border-color: var(--ll-teal); box-shadow: 0 0 0 3px rgba(var(--ll-teal-rgb), .25); }
      .ch-next i { margin-left: 7px; font-size: 11px; }

      /* The close. Two lines, quoted rather than carded — the same register
         the account uses, so nothing about it invites a click. */
      .ch-close {
        margin-top: 26px; padding: 2px 0 2px 20px;
        border-left: 2px solid rgba(var(--ll-teal-rgb), .35);
        animation: ct-rise .38s ease both;
      }
      .ch-close p {
        margin: 0; font-size: 17px; line-height: 1.6; color: var(--ll-ink-strong); text-align: left; font-weight: 600;
      }
      .ch-close p + p { margin-top: 10px; color: var(--ll-ink-soft); font-weight: 400; font-size: 16px; }
      @media (prefers-reduced-motion: reduce) { .ch-close { animation: none; } }

      /* The open prompt. A textarea rather than three options on purpose:
         the answer IS the evidence, and no option list can contain a name. */
      .ch-input {
        width: 100%; margin-top: 16px; padding: 13px 15px;
        font: inherit; font-size: 15px; line-height: 1.55; color: var(--ll-ink);
        background: rgba(var(--ll-surface-rgb), .05); border: 1px solid var(--ll-line);
        border-radius: 13px; resize: vertical;
      }
      .ch-input::placeholder { color: var(--ll-ink-faint); }
      .ch-input:focus { outline: none; border-color: var(--ll-teal); box-shadow: 0 0 0 3px rgba(var(--ll-teal-rgb), .2); }
      .ch-input:disabled { opacity: .6; }
      .ch-send {
        margin-top: 14px; align-self: flex-start;
        font: inherit; font-size: 14px; font-weight: 700; color: #04121a;
        background: var(--ll-teal); border: 0; border-radius: var(--sh-ctrl-radius, 999px);
        padding: 10px 24px; cursor: pointer; transition: filter .16s ease;
      }
      .ch-send:hover:not(:disabled) { filter: brightness(1.08); }
      .ch-send:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(var(--ll-teal-rgb), .35); }
      .ch-send:disabled { opacity: .4; cursor: default; }
      .ch-echo {
        margin: 16px 0 0; max-width: 62ch;
        font-size: 14px; line-height: 1.6; color: var(--ll-ink-soft); text-align: left;
      }

      /* ==== Modality chooser — shared by any beat offering a choice =========
         A segmented control, not a gate. The learner arrives on the default
         carrier and can still see what the other option is. */
      .md-pick {
        /* align-self as well as inline-flex: .pr-wrap is a stretch flex
           column, so an inline-flex child still spans the full measure. */
        display: inline-flex; align-self: flex-start; gap: 3px; margin: 0 0 20px;
        padding: 3px; border-radius: 13px;
        border: 1px solid var(--ll-line); background: rgba(var(--ll-surface-rgb), .04);
      }
      .md-opt {
        display: grid; grid-template-columns: 16px auto; gap: 9px; align-items: center;
        font: inherit; text-align: left; cursor: pointer; color: var(--ll-ink-soft);
        padding: 7px 14px; border-radius: 10px;
        background: none; border: 1px solid transparent;
        transition: background .16s ease, color .16s ease, border-color .16s ease;
      }
      .md-opt i { font-size: 14px; justify-self: center; }
      .md-opt-t { min-width: 0; }
      .md-opt b { font-size: 14.5px; font-weight: 700; }
      .md-opt:hover { color: var(--ll-ink); background: rgba(var(--ll-surface-rgb), .05); }
      .md-opt.is-on {
        color: var(--ll-ink-strong); background: rgba(var(--ll-teal-rgb), .13);
        border-color: rgba(var(--ll-teal-rgb), .42);
      }
      .md-opt.is-on i { color: var(--ll-teal); }
      .md-opt:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(var(--ll-teal-rgb), .28); }
      @media (max-width: 479px) { .md-pick { display: flex; flex-direction: column; } }
      /* Stacked column everywhere a dropdown reveals this list — see
         .md-now .md-pick above, which now covers the rail too. */

      /* ==== Capability under pressure — F4's if-then card ===================
         The rating itself runs on the shared .ef-* slider in
         css/layered-beats.css. Only the threshold-gated card is local. */
      .wk-plan {
        padding: 18px 20px; border-radius: 14px;
        border: 1px solid rgba(var(--ll-teal-rgb), .32); background: rgba(var(--ll-teal-rgb), .07);
      }
      .wk-plan-h {
        margin: 0 0 12px; font-size: 14.5px; font-weight: 700; color: var(--ll-ink-strong); text-align: left;
      }
      .wk-plan-h i { margin-right: 9px; color: var(--ll-teal); font-size: 13px; }
      .wk-say {
        margin: 0; font-size: 16px; line-height: 1.62; color: var(--ll-ink); text-align: left;
      }
      .wk-say b { color: var(--ll-ink-strong); font-weight: 700; }
      .wk-plan-note {
        margin: 12px 0 0 !important; padding-top: 12px;
        border-top: 1px solid rgba(var(--ll-teal-rgb), .2);
        font-size: 13.5px !important; line-height: 1.6; color: var(--ll-ink-soft) !important; text-align: left;
      }
      .wk-held {
        margin: 0; max-width: 62ch;
        font-size: 14.5px; line-height: 1.62; color: var(--ll-ink-soft); text-align: left;
      }

      /* Reviewer label to the LEFT of the Demo button on screens serving a
         non-base version of their content (layered-engine.js
         updateVariantTag). Quieter than Demo: no fill, dashed edge, so it
         reads as a status, not a control. */
      .ll-variant-tag {
        display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px;
        border: 1px dashed rgba(255, 255, 255, .45); border-radius: 999px;
        font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
        color: rgba(255, 255, 255, .85); white-space: nowrap;
      }
      .ll-variant-tag[hidden] { display: none; }
      .ll-variant-tag i { font-size: 10px; }
    </style>
</head>
<body>

         footer and the orb are built once and never re-rendered. The only
         difference between the two courses is which content file registers. -->
    <div class="ll-stage"></div>

    <script>
      window.LESSON_FRAME = { course: 'Bloodborne Pathogens', lesson: 'Welcome' };
    </script>

    <script src="../../scenario-simulator/js/sim-core.js?v=12"></script>
    <script src="../../scenario-simulator/js/sim-voice-input.js?v=1"></script>
    <script src="../js/sharps-narration.js?v=3"></script>
    <script src="../js/layered-sharps.js?v=293"></script>
</body>
