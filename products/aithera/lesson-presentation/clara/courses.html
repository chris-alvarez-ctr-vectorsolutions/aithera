<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses — Vector Training Reporting</title>

    <link rel="stylesheet"
        href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css" />
    <link rel="stylesheet" href="../../../../assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="reporting.css?v=4" />
</head>
<body>

    <header class="rp-head rp-head--tabs">
        <div class="rp-brand">
            <i class="fa-solid fa-layer-group"></i> Vector Training <small>· Reporting</small>
            <a class="hub-link" href="index.html"><i class="fa-solid fa-arrow-left"></i>CLARA end-to-end hub</a>
        </div>
        <div class="rp-head-row">
            <h1>Courses</h1>
            <div class="rp-head-meta">
                <span class="rp-chip"><i class="fa-solid fa-building"></i> Acme Manufacturing</span>
                <span class="rp-chip"><i class="fa-solid fa-layer-group"></i> 3 assigned</span>
            </div>
        </div>
        <nav class="rp-nav" aria-label="Reporting sections">
            <a href="reporting.html" data-nav="overview">Overview</a>
            <a href="courses.html" data-nav="courses">Courses</a>
            <a href="learners.html" data-nav="learners">Learners</a>
        </nav>
    </header>

    <main class="rp-main">
        <div class="course-grid" id="courseGrid"></div>
        <p class="rp-footline"><i class="fa-solid fa-fingerprint"></i> Construct-mapped · fully auditable · representative data</p>
    </main>

    <script src="reporting-ui.js?v=2"></script>
    <script>
      (function () {
        var R = window.ClaraReporting;
        R.nav('courses');

        function pct(a, b) { return Math.round(a / b * 100); }
        function bars(c) {
          var comp = pct(c.completed, c.assigned);
          var demo = c.demonstrated == null ? null : pct(c.demonstrated, c.assigned);
          return '<span class="cc-bars">' +
            '<span class="dbar"><span class="dbar-track"><span class="dbar-fill comp" style="width:' + comp + '%"></span></span>' +
              '<span class="dbar-val"><b>' + comp + '%</b> completed</span></span>' +
            (demo == null
              ? '<span class="dbar-note" title="Standard courses report completion only — no construct evidence"><i class="fa-solid fa-circle-info"></i>Completion only — standard course</span>'
              : '<span class="dbar"><span class="dbar-track"><span class="dbar-fill demo" style="width:' + demo + '%"></span></span>' +
                '<span class="dbar-val"><b>' + demo + '%</b> demonstrated</span></span>') +
          '</span>';
        }

        document.getElementById('courseGrid').innerHTML = R.COURSES.map(function (c) {
          var demoPct = c.demonstrated == null ? null : pct(c.demonstrated, c.assigned);
          var hero = c.demonstrated == null
            ? '<span class="cc-hero na">Completion only</span>'
            : '<span class="cc-hero">' + demoPct + '%<small>demonstrated</small></span>';
          var chips =
            '<span class="cc-chips">' +
              '<span class="course-tag due">Due ' + c.due + '</span>' +
              '<span class="course-tag ' + (c.ai ? 'ai">AI-guided' : 'std">Standard') + '</span>' +
              '<span class="course-tag std">' + c.assigned + ' assigned</span>' +
              (c.recomposed ? '<span class="path-tag recomp" title="Paths the Knowledge Layer recomposed">' +
                pct(c.recomposed, c.completed) + '% recomposed</span>' : '') +
            '</span>';
          var gap = c.topGap
            ? '<span class="cc-gap"><i class="fa-solid fa-magnifying-glass-chart"></i>Top gap: <b>' + c.topGap + '</b> · ' + R.esc(c.gapNote) + '</span>'
            : '<span class="cc-gap"><i class="fa-solid fa-circle-info"></i>' + R.esc(c.gapNote) + '</span>';
          var head =
            '<span class="cc-head"><span class="ci ' + c.iconCls + '"><i class="fa-solid ' + c.icon + '"></i></span>' +
            '<h2>' + R.esc(c.name) + '</h2></span>';
          var inner = head + chips + hero + bars(c) + gap;
          return c.href
            ? '<a class="rp-card course-card" href="' + c.href + '">' + inner + '</a>'
            : '<div class="rp-card course-card" title="Detail view opens once enough learners are in">' + inner + '</div>';
        }).join('');
      })();
    </script>
</body>
</html>
