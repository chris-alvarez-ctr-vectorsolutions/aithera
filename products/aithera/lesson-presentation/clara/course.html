<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bystander Intervention — Course</title>

    <!-- Vector Web Components -->
    <script type="module"
        src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.19.0/core.iife.js"></script>
    <script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.5.0/styles.js"></script>
    <link rel="stylesheet"
        href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css" />
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <!-- Production frame + the shared Layered Learning styling (shared modules
         live one level up — this page sits in clara/) -->
    <link rel="stylesheet" href="../css/frame.css?v=5" />
    <link rel="stylesheet" href="../css/layered-learning.css?v=1" />

    <style>
      /* ==== Seamless boundary into/out of the Marshall scenario page ====
         Cross-document View Transitions animate the navigation as a clean
         full-page CROSS-FADE — the old screen fades out, the new one fades in.
         We deliberately DON'T give the top frame its own view-transition-name:
         its layout differs between the two pages (fixed overlay here vs. embedded
         in #app on the scenario page), so a shared name made the browser morph it
         and drag CLARA + all the content toward a corner. A plain fade is calmer
         and has no slide. (Chrome/Edge; other browsers just navigate cleanly.)
         The scenario page opts in the same way. */
      @view-transition { navigation: auto; }
      ::view-transition-old(root),
      ::view-transition-new(root) { animation-duration: 320ms; animation-timing-function: ease; }
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-old(root),
        ::view-transition-new(root) { animation-duration: 1ms; }
      }

      /* ==== Video steps: real <video> loaded fully up front ==== */
      .cv-video {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: contain; background: #05080f; visibility: hidden;
      }
      .ll-media.is-ready .cv-video { visibility: visible; }
      .cv-loader {
        position: absolute; inset: 0; z-index: 2;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        color: #aab6cc; font-size: 13px;
      }
      .ll-media.is-ready .cv-loader { display: none; }
      .cv-spinner {
        width: 42px; height: 42px; border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, .14); border-top-color: #2ee6cf;
        animation: cv-spin .8s linear infinite;
      }
      @keyframes cv-spin { to { transform: rotate(360deg); } }
      .cv-loader b { color: #2ee6cf; font-weight: 700; }
      /* Prototype-only skip ON the video — matches the scenario's cold-open
         .intro-skip. Top-right so it clears the native player controls. */
      .cv-skip {
        position: absolute; top: 12px; right: 12px; z-index: 4;
        display: inline-flex; align-items: center; gap: 7px;
        border: 0; border-radius: 999px; padding: 7px 14px;
        background: rgba(0, 0, 0, .5); color: #fff;
        font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
        transition: background .15s ease;
      }
      .cv-skip:hover { background: rgba(0, 0, 0, .7); }
      .cv-skip:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(255, 255, 255, .4); }
      .cv-skip i { font-size: 11px; }

      /* ==== Video step: CLARA's comprehension check in the floating bubble ==== */
      .vq-chips { margin-top: 12px; }
      .clara-chip.is-correct { border-color: #2ee6cf; color: #eaf0fb; background: rgba(46, 230, 207, .16); }
      .clara-chip.is-wrong   { border-color: #ff6b6b; color: #eaf0fb; background: rgba(255, 107, 107, .12); text-decoration: line-through; }
      .vq-chips .clara-chip:disabled { cursor: default; }
      .vq-chips .clara-chip:disabled:not(.is-correct) { opacity: .4; }
      .vq-feedback { margin-top: 10px; font-size: 13px; line-height: 1.5; }
      .vq-feedback.ok  { color: #2ee6cf; }
      .vq-feedback.bad { color: #ffb4a2; }

      /* ==== Scene step: detail chips injected into the ambient chrome ==== */
      .ll-scene-facts { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 26px; max-width: 640px; }
      .ll-scene-fact {
        display: inline-flex; align-items: center; gap: 9px; padding: 10px 15px;
        background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .12);
        border-radius: 12px; font-size: 13.5px; color: #eaf0fb; backdrop-filter: blur(4px);
      }
      .ll-scene-fact i { color: #2ee6cf; font-size: 13px; }
      .ll-scene-fact b { color: #7a879e; font-weight: 700; margin-right: 2px; }

      /* ==== Results step ==== */
      .res-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: clamp(24px, 5vw, 56px); width: min(760px, 100%); }
      .res-ring { position: relative; flex: 0 0 auto; width: 180px; height: 180px; }
      .res-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
      .res-ring .track { fill: none; stroke: rgba(255,255,255,.10); stroke-width: 14; }
      .res-ring .val   { fill: none; stroke: url(#resGrad); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset 1.1s cubic-bezier(.2,.7,.2,1); }
      .res-ring .res-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      .res-score { font-size: 46px; font-weight: 800; color: #fff; line-height: 1; }
      .res-score small { font-size: 20px; color: var(--ll-ink-soft); font-weight: 700; }
      .res-score-label { margin-top: 6px; font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--ll-teal); }
      .res-breakdown { flex: 1 1 300px; list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; min-width: 260px; }
      .res-card { display: grid; grid-template-columns: 40px 1fr auto; gap: 14px; align-items: start; padding: 15px 17px; background: rgba(255,255,255,.035); border: 1px solid var(--ll-line-soft); border-radius: 14px; }
      .res-ico { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; background: rgba(46,230,207,.12); border: 1px solid rgba(46,230,207,.28); color: var(--ll-teal); font-size: 16px; }
      .res-card h3 { margin: 1px 0 3px; font-size: 15px; color: #fff; }
      .res-card p  { margin: 0; font-size: 13px; line-height: 1.5; color: var(--ll-ink-soft); }
      .res-pill { align-self: center; font-size: 11px; font-weight: 800; letter-spacing: .04em; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
      .res-pill.ok   { background: rgba(46,230,207,.14); color: var(--ll-teal); border: 1px solid rgba(46,230,207,.3); }
      .res-pill.warn { background: rgba(241,179,74,.14); color: #f1b34a; border: 1px solid rgba(241,179,74,.32); }
      .res-pill.mut  { background: rgba(255,255,255,.05); color: var(--ll-ink-faint); border: 1px solid var(--ll-line); }
      .res-tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
      .res-tag { font-size: 11.5px; color: var(--ll-ink-soft); background: rgba(255,255,255,.04); border: 1px solid var(--ll-line-soft); border-radius: 999px; padding: 3px 9px; }
      .res-basis { margin-top: 20px; font-size: 11.5px; color: var(--ll-ink-faint); max-width: 62ch; }

      /* Docked CLARA becomes a canned, scrollable chat (results step): a
         greeting up top, a Q&A thread that grows + scrolls, composer pinned
         at the bottom. Auto-scrolls to the newest message (coach-panel feel). */
      .clara-chrome--sidebar .clara-echo {
        width: 100%; flex: 1 1 auto; min-height: 0; overflow-y: auto;
        display: flex; flex-direction: column; gap: 8px;
        margin: 14px 0 12px; padding-right: 4px;
      }
      /* Speech bubbles — CLARA left, learner right (matches the coach panel). */
      .clara-chrome--sidebar .cbub {
        max-width: 88%; padding: 9px 12px; border-radius: 14px;
        font-size: 13.5px; line-height: 1.5; color: var(--ll-ink); text-align: left;
      }
      .clara-chrome--sidebar .cbub.clara {
        align-self: flex-start; background: var(--ll-panel-2);
        border: 1px solid var(--ll-line); border-bottom-left-radius: 5px;
      }
      .clara-chrome--sidebar .cbub.you {
        align-self: flex-end; background: rgba(46, 230, 207, .14);
        border: 1px solid rgba(46, 230, 207, .3); border-bottom-right-radius: 5px;
      }
      /* Typing indicator — three pulsing dots shown in a CLARA bubble while a
         message "types in" (see resultsInit's typed feedback sequence). */
      .clara-chrome--sidebar .cbub.typing { display: inline-flex; align-items: center; gap: 5px; }
      .clara-chrome--sidebar .cbub.typing span {
        width: 6px; height: 6px; border-radius: 50%; background: currentColor;
        opacity: .45; animation: cbub-typing 1.1s ease-in-out infinite;
      }
      .clara-chrome--sidebar .cbub.typing span:nth-child(2) { animation-delay: .18s; }
      .clara-chrome--sidebar .cbub.typing span:nth-child(3) { animation-delay: .36s; }
      @keyframes cbub-typing { 0%, 70%, 100% { transform: translateY(0); opacity: .35; } 35% { transform: translateY(-4px); opacity: .95; } }
      @media (prefers-reduced-motion: reduce) { .clara-chrome--sidebar .cbub.typing span { animation: none; } }
      .clara-chrome--sidebar .clara-composer { width: 100%; }

      /* Results (sidebar) step tweaks: give the docked CLARA panel top breathing
         room, and center the results content in the space beside the panel
         (instead of jammed against the rail with a big void on the right). */
      @media (min-width: 721px) {
        .ll-stage[data-mode="sidebar"] .clara-chrome--sidebar { padding-top: 28px; }
        .ll-stage[data-mode="sidebar"] .clara-chrome--sidebar .clara-slot { margin-top: 0; }
        .ll-stage[data-mode="sidebar"] .ll-object {
          align-items: center;
          padding-left: 360px;
          padding-right: clamp(24px, 4vw, 56px);
        }
        /* Align the honesty note with the results block (under the ring + cards),
           left-aligned prose — not floating off to the side. */
        .ll-stage[data-mode="sidebar"] .res-basis { width: min(760px, 100%); max-width: none; text-align: left; }
      }

      /* ==== Entry check: one question at a time, centered on the stage ====
         The Quick Question pattern from Basic Interactions, restyled for the
         dark stage: eyebrow, the question AS the headline, large blocky
         choices. Nothing else is on screen — CLARA's reaction arrives in the
         floating bubble, and the framework rationale is presenter material
         that lives in the step caption behind the footer "?". */
      .bl-ask {
        width: min(760px, 100%);
        display: flex; flex-direction: column; align-items: center;
        transition: opacity .3s ease, transform .3s var(--ll-ease);
      }
      .bl-ask.swapping { opacity: 0; transform: translateY(-8px); }
      /* Centering a question (a title, not body prose) is the point here. */
      .ll-object .bl-q {
        margin: 0 0 10px; max-width: 30ch;
        font-size: clamp(24px, 3.4vw, 34px); font-weight: 800; line-height: 1.2;
        letter-spacing: -.01em; text-align: center; color: #fff;
      }
      .bl-hint { margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--ll-ink-faint); }

      .bl-options {
        margin-top: 30px; width: 100%;
        display: flex; flex-wrap: wrap; justify-content: center; gap: 14px;
      }
      .bl-option {
        flex: 1 1 190px; max-width: 236px; min-height: 134px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 13px;
        padding: 22px 18px;
        border: 1.5px solid var(--ll-line); border-radius: 16px;
        background: rgba(255, 255, 255, .04);
        font: inherit; font-size: 15px; font-weight: 600; line-height: 1.32;
        color: var(--ll-ink); text-align: center; cursor: pointer;
        transition: border-color .16s ease, background .16s ease, transform .16s ease, opacity .32s ease;
      }
      .bl-option i { font-size: 23px; color: var(--ll-ink-faint); transition: color .16s ease; }
      .bl-option:hover { border-color: rgba(46, 230, 207, .5); background: rgba(255, 255, 255, .07); transform: translateY(-2px); }
      .bl-option:hover i { color: var(--ll-ink-soft); }
      .bl-option:focus-visible { outline: none; border-color: var(--ll-teal); box-shadow: 0 0 0 3px rgba(46, 230, 207, .25); }
      .bl-option[aria-checked="true"] { border-color: var(--ll-teal); background: rgba(46, 230, 207, .13); color: #fff; }
      .bl-option[aria-checked="true"] i { color: var(--ll-teal); }
      /* Answered: the pick stays lit, the rest recede but stay readable. */
      .bl-options.answered .bl-option { cursor: default; transform: none; }
      .bl-options.answered .bl-option:not([aria-checked="true"]) { opacity: .3; }
      .bl-options.answered .bl-option:hover { border-color: var(--ll-line); background: rgba(255, 255, 255, .04); }
      .bl-options.answered .bl-option[aria-checked="true"]:hover { border-color: var(--ll-teal); background: rgba(46, 230, 207, .13); }
      @media (prefers-reduced-motion: reduce) {
        .bl-ask, .bl-option { transition: none; }
        .bl-option:hover { transform: none; }
      }
      /* Narrow: stack the choices, shorter cards so all three stay in view. */
      @media (max-width: 620px) {
        .ll-object .bl-q { font-size: 22px; max-width: 22ch; }
        .bl-options { margin-top: 24px; gap: 10px; }
        .bl-option {
          flex: 1 1 100%; max-width: none; min-height: 0;
          flex-direction: row; justify-content: flex-start; gap: 14px;
          padding: 15px 18px; text-align: left;
        }
        .bl-option i { font-size: 18px; }
      }

      /* ==== Path adjustment: the learning-path map ==== */
      .path-rail { list-style: none; margin: 28px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px; width: min(860px, 100%); }
      .path-node {
        display: flex; align-items: center; gap: 10px; padding: 10px 14px;
        background: rgba(255, 255, 255, .035); border: 1px solid var(--ll-line-soft); border-radius: 13px;
        transition: opacity .5s var(--ll-ease), transform .5s var(--ll-ease), border-color .5s ease, box-shadow .5s ease;
      }
      .pn-ico {
        width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
        background: rgba(255, 255, 255, .05); border: 1px solid var(--ll-line);
        color: var(--ll-ink-soft); font-size: 14px; flex: 0 0 auto;
      }
      .path-node[data-state="done"] .pn-ico { color: var(--ll-teal); border-color: rgba(46, 230, 207, .3); }
      .pn-main { display: flex; flex-direction: column; gap: 2px; text-align: left; }
      .pn-label { font-size: 13px; font-weight: 600; color: #fff; }
      .pn-sub { font-size: 10.5px; color: var(--ll-ink-faint); letter-spacing: .03em; }
      .pn-chip { font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
      .pn-chip i { font-size: 9px; margin-right: 2px; }
      .pn-done    { background: rgba(46, 230, 207, .12); color: var(--ll-teal); border: 1px solid rgba(46, 230, 207, .28); }
      .pn-planned { background: rgba(255, 255, 255, .05); color: var(--ll-ink-faint); border: 1px solid var(--ll-line); }
      .pn-next    { background: rgba(255, 255, 255, .05); color: var(--ll-ink-soft); border: 1px solid var(--ll-line); }
      .pn-added   { background: rgba(167, 139, 250, .14); color: #c4b5fd; border: 1px solid rgba(167, 139, 250, .35); }
      .pn-skipped { background: rgba(241, 179, 74, .14); color: #f1b34a; border: 1px solid rgba(241, 179, 74, .32); }
      /* Compliance-locked content — recomposition never removes it. */
      .pn-locked  { background: rgba(255, 255, 255, .05); color: #f1b34a; border: 1px solid rgba(241, 179, 74, .4); margin-left: 6px; }
      /* The Perform floor — the simulation is the minimum experience. */
      .pn-floor   { background: rgba(46, 230, 207, .08); color: var(--ll-teal); border: 1px solid rgba(46, 230, 207, .3); margin-left: 6px; }
      .path-node.is-leaving  { opacity: 0; transform: translateY(-10px) scale(.97); }
      .path-node.is-entering { opacity: 0; transform: translateY(12px) scale(.97); }
      .path-node.is-added    { border-color: rgba(167, 139, 250, .45); box-shadow: 0 0 0 1px rgba(167, 139, 250, .18), 0 6px 24px rgba(167, 139, 250, .14); }
      .path-node.is-skipped  { opacity: .55; }
      .path-node.is-skipped .pn-label { text-decoration: line-through; text-decoration-color: rgba(255, 255, 255, .4); }

      /* The provenance chain — the paper trail under the recomposition. */
      .prov-card {
        margin-top: 24px; width: min(760px, 100%);
        background: rgba(255, 255, 255, .03); border: 1px solid var(--ll-line-soft); border-radius: 14px;
        padding: 16px 18px; opacity: 0; transform: translateY(10px);
        transition: opacity .5s var(--ll-ease), transform .5s var(--ll-ease);
      }
      .prov-card.in { opacity: 1; transform: none; }
      .prov-head { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ll-teal); display: flex; align-items: center; gap: 8px; }
      .prov-chain { list-style: none; margin: 12px 0 0; padding: 0; }
      .prov-chain li { position: relative; padding: 0 0 14px 26px; font-size: 13px; line-height: 1.55; color: var(--ll-ink-soft); text-align: left; }
      .prov-chain li:last-child { padding-bottom: 2px; }
      .prov-chain li::before { content: ''; position: absolute; left: 7px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--ll-teal); }
      .prov-chain li:not(:last-child)::after { content: ''; position: absolute; left: 10.5px; top: 18px; bottom: 2px; width: 1px; background: var(--ll-line); }
      .prov-chain b { color: #fff; }
      .prov-chain em { color: #f1b34a; font-style: normal; font-weight: 600; }
      .prov-ok { color: var(--ll-teal); }

      /* ==== Inserted micro-practice: the mini-scene card ==== */
      .mp-scene {
        margin-top: 26px; width: min(640px, 100%); text-align: left;
        background: rgba(255, 255, 255, .035); border: 1px solid var(--ll-line-soft);
        border-radius: 14px; padding: 16px 18px;
      }
      .mp-scene-tag { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #f1b34a; display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
      .mp-scene p { margin: 0; font-size: 14.5px; line-height: 1.6; color: var(--ll-ink); }

      /* ==== Aptitude profile (results step) ==== */
      .apt-side { flex: 1 1 300px; min-width: 260px; display: grid; gap: 12px; text-align: left; }
      .apt-pass, .apt-path { margin: 0; font-size: 13.5px; line-height: 1.55; color: var(--ll-ink-soft); }
      .apt-pass i, .apt-path i { color: var(--ll-teal); margin-right: 6px; }
      .apt-pass b { color: #fff; }
      .apt-path b { color: #c4b5fd; }
      .apt-list { list-style: none; margin: 26px 0 0; padding: 0; display: grid; gap: 12px; width: min(760px, 100%); }
      .apt-row {
        display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: start;
        padding: 15px 17px; background: rgba(255, 255, 255, .035);
        border: 1px solid var(--ll-line-soft); border-radius: 14px;
      }
      .apt-ico {
        width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center;
        background: rgba(46, 230, 207, .12); border: 1px solid rgba(46, 230, 207, .28);
        color: var(--ll-teal); font-size: 16px;
      }
      .apt-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
      .apt-head h3 { margin: 0; font-size: 15px; color: #fff; text-align: left; }
      .apt-mom { font-size: 11px; font-weight: 700; display: inline-flex; gap: 5px; align-items: center; }
      .apt-mom.up   { color: var(--ll-teal); }
      .apt-mom.held { color: var(--ll-ink-faint); }
      .apt-mom.down { color: #ff9d8f; }
      .apt-bands { margin-top: 8px; display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
      .band { font-size: 11px; font-weight: 800; letter-spacing: .04em; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
      .band-warn { background: rgba(241, 179, 74, .14); color: #f1b34a; border: 1px solid rgba(241, 179, 74, .32); }
      .band-ok   { background: rgba(46, 230, 207, .14); color: var(--ll-teal); border: 1px solid rgba(46, 230, 207, .3); }
      .band-exc  { background: rgba(167, 139, 250, .16); color: #c4b5fd; border: 1px solid rgba(167, 139, 250, .4); }
      .apt-arrow { color: var(--ll-ink-faint); font-size: 12px; }
      .apt-evidence { margin: 9px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--ll-ink-soft); text-align: left; }
      .apt-evidence i { color: var(--ll-ink-faint); font-size: 10px; margin-right: 5px; }

      /* ==== Learn beats — Terms to Remember: the five Ds as flip cards ==== */
      .tr-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 26px; width: min(860px, 100%); }
      .tr-card { width: 156px; height: 190px; perspective: 900px; cursor: pointer; background: none; border: 0; padding: 0; font: inherit; color: inherit; }
      .tr-inner { display: block; position: relative; width: 100%; height: 100%; transition: transform .55s var(--ll-ease); transform-style: preserve-3d; }
      .tr-card.flipped .tr-inner { transform: rotateY(180deg); }
      .tr-face {
        position: absolute; inset: 0; backface-visibility: hidden; border-radius: 14px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        padding: 14px; text-align: center;
        background: rgba(255, 255, 255, .04); border: 1px solid var(--ll-line);
      }
      .tr-face i { font-size: 22px; color: var(--ll-teal); }
      .tr-face b { font-size: 16px; color: #fff; letter-spacing: .01em; }
      .tr-face .hint { font-size: 10.5px; color: var(--ll-ink-faint); letter-spacing: .06em; text-transform: uppercase; }
      .tr-back { transform: rotateY(180deg); background: rgba(46, 230, 207, .07); border-color: rgba(46, 230, 207, .35); justify-content: flex-start; padding-top: 16px; }
      .tr-back p { margin: 0; font-size: 12px; line-height: 1.5; color: var(--ll-ink); text-align: left; }
      .tr-back .ex { margin-top: 8px; font-size: 11.5px; line-height: 1.5; color: var(--ll-ink-soft); font-style: italic; text-align: left; }
      .tr-card.flipped .tr-face:not(.tr-back) { pointer-events: none; }
      .tr-progress { margin-top: 18px; font-size: 12px; color: var(--ll-ink-faint); }
      .tr-progress b { color: var(--ll-teal); }
      @media (prefers-reduced-motion: reduce) { .tr-inner { transition: none; } }

      /* ==== Learn beats — Peer Results: guess, then the norms reveal ==== */
      .pr-wrap { width: min(640px, 100%); margin-top: 24px; }
      .pr-choices { display: grid; gap: 10px; }
      .pr-choice {
        font: inherit; text-align: left; cursor: pointer; color: var(--ll-ink);
        background: rgba(255, 255, 255, .04); border: 1px solid var(--ll-line);
        border-radius: 13px; padding: 14px 17px; font-size: 14.5px;
        transition: border-color .2s ease, background .2s ease;
      }
      .pr-choice:hover { border-color: rgba(46, 230, 207, .5); }
      .pr-choice.picked { border-color: var(--ll-teal); background: rgba(46, 230, 207, .1); }
      .pr-choice:disabled { cursor: default; }
      .pr-results { display: grid; gap: 14px; margin-top: 6px; }
      .pr-row { display: grid; gap: 6px; }
      .pr-row .lab { display: flex; justify-content: space-between; font-size: 13px; color: var(--ll-ink); }
      .pr-row .lab .pct { font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; }
      .pr-row .lab .you { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; color: var(--ll-teal); }
      .pr-track { height: 14px; border-radius: 5px; background: rgba(255, 255, 255, .06); overflow: hidden; }
      .pr-fill { height: 100%; width: 0; border-radius: 0 5px 5px 0; background: rgba(255, 255, 255, .25); transition: width 1s var(--ll-ease); }
      .pr-row.is-top .pr-fill { background: var(--ll-teal); }
      .pr-src { margin-top: 12px; font-size: 11px; color: var(--ll-ink-faint); }

      /* ==== Learn beats — Conversation Step-In: the follow-up, as texts ==== */
      .sms-wrap { width: min(560px, 100%); margin-top: 22px; }
      .sms-thread {
        display: flex; flex-direction: column; gap: 8px;
        background: rgba(255, 255, 255, .03); border: 1px solid var(--ll-line-soft);
        border-radius: 16px; padding: 16px;
      }
      .sms-head { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--ll-line-soft); margin-bottom: 4px; }
      .sms-ava { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: rgba(167, 139, 250, .18); color: #c4b5fd; font-size: 11px; font-weight: 800; }
      .sms-head b { font-size: 13px; color: #fff; }
      .sms-head small { color: var(--ll-ink-faint); font-size: 11px; margin-left: auto; }
      .sms-msg { max-width: 82%; padding: 9px 13px; border-radius: 15px; font-size: 13.5px; line-height: 1.5; opacity: 0; transform: translateY(6px); transition: opacity .35s ease, transform .35s var(--ll-ease); }
      .sms-msg.in { opacity: 1; transform: none; }
      .sms-msg.them { align-self: flex-start; background: rgba(255, 255, 255, .07); color: var(--ll-ink); border-bottom-left-radius: 5px; }
      .sms-msg.you  { align-self: flex-end; background: rgba(46, 230, 207, .16); border: 1px solid rgba(46, 230, 207, .3); color: #eaf0fb; border-bottom-right-radius: 5px; }
      .sms-takeover { margin: 10px 0 4px; text-align: center; font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ll-teal); }
      .sms-replies { display: grid; gap: 8px; margin-top: 10px; }
      .sms-reply {
        font: inherit; text-align: left; cursor: pointer; color: var(--ll-ink);
        background: rgba(255, 255, 255, .04); border: 1px solid var(--ll-line);
        border-radius: 12px; padding: 11px 14px; font-size: 13px; line-height: 1.45;
        transition: border-color .2s ease, opacity .2s ease;
      }
      .sms-reply:hover { border-color: rgba(46, 230, 207, .5); }
      .sms-reply:disabled { opacity: .35; cursor: default; }
      .sms-anatomy { margin-top: 14px; display: none; }
      .sms-anatomy.show { display: block; }
      .sms-anatomy .an-head { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ll-teal); margin-bottom: 8px; }
      .sms-anatomy ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
      .sms-anatomy li { font-size: 12.5px; color: var(--ll-ink-soft); display: flex; gap: 8px; align-items: baseline; }
      .sms-anatomy li i { color: var(--ll-teal); font-size: 11px; }
      .sms-anatomy li b { color: #fff; }

      /* ==== Learn beats — Audio Summary: narrated text, word-by-word ==== */
      .aud-wrap { width: min(640px, 100%); margin-top: 22px; text-align: left; }
      .aud-controls { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
      .aud-play {
        display: inline-flex; align-items: center; gap: 9px;
        font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer;
        background: rgba(46, 230, 207, .14); color: var(--ll-teal);
        border: 1px solid rgba(46, 230, 207, .35); border-radius: 999px; padding: 9px 18px;
      }
      .aud-play:hover { background: rgba(46, 230, 207, .22); }
      .aud-mode {
        margin-left: auto; display: inline-flex; align-items: center; gap: 7px;
        font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
        background: rgba(255, 255, 255, .04); color: var(--ll-ink-soft);
        border: 1px solid var(--ll-line); border-radius: 999px; padding: 7px 14px;
      }
      .aud-mode:hover { border-color: rgba(46, 230, 207, .5); color: var(--ll-ink); }
      .aud-text {
        background: rgba(255, 255, 255, .03); border: 1px solid var(--ll-line-soft);
        border-radius: 14px; padding: 20px 22px;
        font-size: 16.5px; line-height: 1.85; color: var(--ll-ink-soft);
      }
      .aud-text .w { border-radius: 4px; padding: 0 1px; transition: background .12s ease, color .12s ease; }
      .aud-text .w.hot { background: rgba(46, 230, 207, .25); color: #fff; }
      .aud-text.read-mode { color: var(--ll-ink); }
      .aud-note { margin-top: 10px; font-size: 11px; color: var(--ll-ink-faint); }

      /* ==== Learn beats — Pick your move: which D fits the moment ==== */
      .dr-wrap { width: min(620px, 100%); margin-top: 22px; }
      .dr-card {
        background: rgba(255, 255, 255, .035); border: 1px solid var(--ll-line-soft);
        border-radius: 14px; padding: 18px 20px; text-align: left; min-height: 92px;
      }
      .dr-card .tag { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #f1b34a; margin-bottom: 7px; display: block; }
      .dr-card p { margin: 0; font-size: 15px; line-height: 1.6; color: var(--ll-ink); }
      .dr-ds { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 14px; }
      .dr-d {
        font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--ll-ink);
        background: rgba(255, 255, 255, .04); border: 1px solid var(--ll-line);
        border-radius: 999px; padding: 9px 17px;
        transition: border-color .2s ease, background .2s ease, opacity .2s ease;
      }
      .dr-d:hover { border-color: rgba(46, 230, 207, .5); }
      .dr-d.hit { border-color: var(--ll-teal); background: rgba(46, 230, 207, .16); color: #fff; }
      .dr-d.near { border-color: rgba(241, 179, 74, .5); background: rgba(241, 179, 74, .1); }
      .dr-d.miss { border-color: rgba(255, 107, 107, .5); opacity: .45; }
      .dr-d:disabled { cursor: default; }
      .dr-fb { margin-top: 12px; font-size: 13px; line-height: 1.55; min-height: 20px; }
      .dr-fb.ok { color: var(--ll-teal); }
      .dr-fb.near { color: #f1b34a; }
      .dr-fb.bad { color: #ffb4a2; }
      .dr-progress { margin-top: 14px; font-size: 12px; color: var(--ll-ink-faint); }
      .dr-progress b { color: var(--ll-teal); }

      /* ==== Course title page (the upgraded Welcome step) ==== */
      .cp-page { width: min(1080px, 100%); text-align: left; }
      /* Full-width hero band: title block left, course art right, blended. */
      .cp-hero-band {
        position: relative; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
        min-height: 232px; border-radius: 18px; overflow: hidden;
        background: linear-gradient(115deg, rgba(9, 16, 30, .96) 0%, rgba(13, 26, 44, .92) 60%, rgba(10, 18, 34, .6) 100%);
        border: 1px solid var(--ll-line-soft); margin-bottom: 26px;
      }
      .cp-hero { padding: 26px 28px; position: relative; z-index: 2; }
      .cp-hero-img {
        position: relative; min-height: 180px;
        background: url('../../assets/courses/bystander-hero.jpg') center right / cover no-repeat;
        -webkit-mask-image: linear-gradient(to right, transparent 0, black 42%);
        mask-image: linear-gradient(to right, transparent 0, black 42%);
        opacity: .85;
      }
      @media (max-width: 760px) {
        .cp-hero-band { grid-template-columns: 1fr; }
        .cp-hero-img { min-height: 150px; order: -1;
          -webkit-mask-image: linear-gradient(to top, transparent 0, black 55%);
          mask-image: linear-gradient(to top, transparent 0, black 55%); }
      }
      .cp-grid {
        display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
        gap: 26px; width: 100%; align-items: start; text-align: left;
      }
      .cp-grid > * { min-width: 0; }
      @media (max-width: 900px) { .cp-grid { grid-template-columns: 1fr; } }
      .cp-hero h1 { margin: 4px 0 12px; font-size: clamp(26px, 3.4vw, 38px); font-weight: 800; color: #fff; letter-spacing: -.015em; }
      .cp-desc { margin: 0 0 16px; max-width: 62ch; font-size: 14.5px; line-height: 1.65; color: var(--ll-ink-soft); }
      .cp-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
      .cp-chip {
        display: inline-flex; align-items: center; gap: 7px;
        font-size: 12px; font-weight: 600; color: var(--ll-ink-soft);
        background: rgba(255, 255, 255, .04); border: 1px solid var(--ll-line);
        border-radius: 999px; padding: 5px 12px;
      }
      .cp-chip i { color: var(--ll-teal); font-size: 11px; }
      .cp-chip.due { color: #f1b34a; border-color: rgba(241, 179, 74, .4); }
      .cp-chip.due i { color: #f1b34a; }

      /* Sections card — rendered live from the actual path. */
      .cp-sections { margin-top: 0; background: rgba(255, 255, 255, .03); border: 1px solid var(--ll-line-soft); border-radius: 16px; padding: 16px 18px; }
      .cp-sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
      .cp-sec-head h2 { margin: 0; font-size: 15px; font-weight: 800; color: #fff; }
      .cp-progress { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--ll-ink-soft); }
      .cp-dots { display: inline-flex; gap: 4px; }
      .cp-dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255, 255, 255, .12); border: 1px solid var(--ll-line); }
      .cp-dots i.done { background: var(--ll-teal); border-color: var(--ll-teal); }
      .cp-row { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 11px 0; border-top: 1px solid var(--ll-line-soft); }
      .cp-row:first-of-type { border-top: 0; }
      .cp-row-ico {
        width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
        background: rgba(255, 255, 255, .05); border: 1px solid var(--ll-line);
        color: var(--ll-ink-soft); font-size: 13px;
      }
      .cp-row.done .cp-row-ico { color: var(--ll-teal); border-color: rgba(46, 230, 207, .35); }
      .cp-row-main b { display: block; font-size: 13.5px; color: #fff; font-weight: 700; }
      .cp-row-meta { font-size: 11.5px; color: var(--ll-ink-faint); display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 2px; }
      .cp-row-meta .stage { color: var(--ll-teal); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 10px; }
      .cp-row-meta .adapt { color: #c4b5fd; }
      .cp-row-meta .adapt i { font-size: 9px; margin-right: 3px; }
      .cp-row-state { font-size: 10.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
      .cp-row-state.done { background: rgba(46, 230, 207, .12); color: var(--ll-teal); border: 1px solid rgba(46, 230, 207, .3); }
      .cp-row-state.todo { background: rgba(255, 255, 255, .04); color: var(--ll-ink-faint); border: 1px solid var(--ll-line); }
      .cp-adapt-note { margin: 12px 0 0; font-size: 11.5px; color: var(--ll-ink-faint); }
      .cp-adapt-note i { color: #c4b5fd; margin-right: 5px; }

      /* Details rail. */
      .cp-rail { display: grid; gap: 14px; }
      .cp-card { background: rgba(255, 255, 255, .03); border: 1px solid var(--ll-line-soft); border-radius: 16px; padding: 15px 17px; }
      .cp-card h3 { margin: 0 0 10px; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--ll-teal); }
      .cp-req { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
      .cp-req li { display: flex; gap: 10px; align-items: baseline; font-size: 12.5px; line-height: 1.5; color: var(--ll-ink-soft); }
      .cp-req li i { color: var(--ll-teal); font-size: 11px; flex: 0 0 auto; }
      .cp-req b { color: #fff; }
      .cp-kv { display: grid; gap: 9px; }
      .cp-kv .kv { font-size: 12.5px; line-height: 1.5; color: var(--ll-ink-soft); }
      .cp-kv .kv b { display: block; color: #fff; font-size: 12px; }
      .cp-res a { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ll-ink); text-decoration: none; padding: 6px 0; }
      .cp-res a:hover { color: var(--ll-teal); }
      .cp-res a i.ext { margin-left: auto; font-size: 10px; color: var(--ll-ink-faint); }
      .cp-res-note { margin: 8px 0 0; font-size: 10.5px; color: var(--ll-ink-faint); font-style: italic; }
      .cp-coord { display: flex; gap: 11px; align-items: center; }
      .cp-coord .ava { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(46, 230, 207, .12); border: 1px solid rgba(46, 230, 207, .3); color: var(--ll-teal); font-size: 12px; font-weight: 800; }
      .cp-coord b { display: block; font-size: 13px; color: #fff; }
      .cp-coord small { font-size: 11.5px; color: var(--ll-ink-soft); }

      /* ==== "CLARA noticed" evidence toasts (bottom-right, above the bar) ==== */
      .ll-notices { position: fixed; right: 18px; bottom: 76px; z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
      .ll-notice {
        display: inline-flex; align-items: center; gap: 9px; max-width: min(380px, 80vw);
        padding: 9px 14px; background: rgba(10, 16, 28, .92);
        border: 1px solid rgba(46, 230, 207, .35); border-radius: 12px;
        font-size: 12.5px; line-height: 1.45; color: var(--ll-ink); text-align: left;
        box-shadow: 0 8px 28px rgba(0, 0, 0, .4);
        opacity: 0; transform: translateY(8px);
        transition: opacity .35s ease, transform .35s var(--ll-ease);
      }
      .ll-notice.in { opacity: 1; transform: none; }
      .ll-notice i { color: var(--ll-teal); font-size: 12px; flex: 0 0 auto; }
      .ll-notice b { color: #fff; }

      /* ==== Bottom bar as the unified "flow" zone (course-page only) ====
         Scoped HERE — not in the shared layered-learning.css — because
         js/layered-learning.js reuses .ll-footer-meta / .ll-info / .ll-pop for
         the four standalone CLARA demos, which keep the original stacked layout.
         On THIS page the section counter + progress bar moved down beside
         Back/Continue, with the "?" tucked in right after the bar. The "?" keeps
         its shared .ll-info styling + bottom-left .ll-pop popover — only the
         META container flips from a text stack to a row. */
      .ll-footer-meta { flex-direction: row; align-items: center; }   /* was a stacked text block */
      .ll-foot-progress { display: flex; align-items: center; gap: 13px; }
      .ll-foot-count {
        font-size: 12px; font-weight: 600; color: var(--ll-ink-soft);
        white-space: nowrap; letter-spacing: .01em;
      }
      .ll-foot-bar {
        width: 200px;
        --lumo-contrast-10pct: rgba(255, 255, 255, .14);   /* track on the dark bar */
      }
      .ll-foot-bar::part(value) { background-color: var(--ll-teal); }

      @media (max-width: 720px) {
        /* Keep the relocated progress from crowding Back/Continue on phones. */
        .ll-foot-progress { gap: 9px; }
        .ll-foot-bar { width: 96px; }
      }
    </style>
</head>
<body>
    <!-- ============================================================
         The SPA shell. The frame (frame.js), the stage, the footer, and the
         CLARA orb are built ONCE. js/layered-course.js swaps each step's
         content + coach chrome in place and glides the single persistent orb —
         no document reload between the light steps. The Marshall scenario is
         reached across a cross-document View Transition (see the CSS above).
         ============================================================ -->
    <div class="ll-stage"></div>

    <script>
      // Seed the production frame once; js/layered-course.js updates the lesson
      // title + step + progress in place as steps change (never rebuilding it).
      // Progress moved OUT of the top band into the bottom "flow" bar (see
      // js/layered-course.js). No step/progress here → the band stays pure
      // title + wayfinding; the ? review aid takes the band's right slot.
      window.LESSON_FRAME = { course: 'Bystander Intervention', lesson: 'Welcome' };
    </script>
    <script src="../js/mobius-orb.js?v=5"></script>
    <script src="../js/frame.js?v=4"></script>
    <script src="../js/layered-course.js?v=27"></script>
</body>
</html>
