<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Guided Arc — Conversation Coach (Live AI)</title>

    <!-- Vector Web Components: Core -->
    <script type="module"
        src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.19.0/core.iife.js"></script>

    <!-- Vector Web Components: Themes (import as plain script) -->
    <script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.5.0/styles.js"></script>

    <!-- Open Sans -->
    <link rel="stylesheet"
        href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css" />

    <!-- Font Awesome 6 -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <!-- Course-delivery frame (production Vector Training chrome) -->
    <link rel="stylesheet" href="../css/frame.css?v=5" />
    <style>
      /* Frame integration for this full-viewport app shell:
         the frame is embedded as the first flex child of .app (see the
         window.LESSON_FRAME config near </body>), so the app's own slim
         .topbar would just duplicate it — hide it and let its Restart button
         ride the frame's actions slot instead. The fixed .scrim must also start
         BELOW the frame so it dims only the practice stage, not the brand bar. */
      .topbar { display: none !important; }
      /* .app .scrim beats the app's own `.scrim { inset: var(--topbar-h)… }`
         (which loads later) so the scrim dims only the stage, not the brand band. */
      .app .scrim { inset: var(--header-h) 0 0 0; }
    </style>

    <!-- ====================================================================
         ACTION PRACTICE — rebuilt conversation-practice module.

         The whole experience is TWO interleaving MODES, made unmistakable by
         giving each its own world:

           COACHING  — a calm, clean, theme-aware "studio." You talk ABOUT the
                       conversation with the coach (prep / debrief). Cool indigo.
           SCENE     — a warm, dark, intimate "stage" you step INTO. Always dark
                       (in light *and* dark theme) so being in-fiction always
                       feels like a different place. Warm amber + violet.

         The practice scene is the persistent base layer. Coaching does not swap it
         out — the AI Coach is a bottom sheet that rises over the scene (which stays
         visible, dimmed, above it) and lowers to hand the scene back. The full
         practice stays scrollable in the scene, so it's always the reviewable record.

         Self-contained vanilla JS render-by-state (no framework, no build, no
         storage). Runs in DEMO mode by default (scripted engine that mirrors the
         real loop and enforces the safety escalation beat); point WORKER_URL at a
         proxy Worker to talk to live Claude. Theming via CSS variables.
         ==================================================================== */ -->
    <style>
      /* ===================================================================
         1. TOKENS  — coaching world is theme-aware; scene world is always a
            dark "stage" so the two modes never look alike.
         =================================================================== */
      :root {
        color-scheme: light dark;

        /* —— Coaching world (light theme defaults) —— */
        --c-bg:          #f5f7fb;
        --c-surface:     #ffffff;
        --c-surface-2:   #eef1f7;
        --c-ink:         #1a2030;
        --c-ink-soft:    #5a6379;
        --c-ink-faint:   #67718a;   /* darkened for ≥4.5:1 on light surfaces (was #8b94a8) */
        --c-line:        #e3e7f0;
        --c-accent:      #4b63e6;   /* indigo — the coach */
        --c-accent-strong:#3a4fce;
        --c-accent-soft: #eef1fe;
        --c-on-accent:   #ffffff;

        /* —— Scene world (constant across themes: a lit set in a dark room) —— */
        --s-ink:         #f3ede5;
        --s-ink-soft:    #c3b6a8;
        --s-ink-faint:   #a89b8c;   /* lightened for ≥4.5:1 on the dark stage (was #8d8175) */
        --s-surface:     #211a16;   /* stage panel */
        --s-surface-2:   #2c241e;
        --s-line:        #43372e;
        --s-char:        #c79bff;   /* the character — violet */
        --s-char-soft:   rgba(199,155,255,.16);
        --s-you:         #f1b34a;   /* your spoken voice — warm amber */
        --s-you-soft:    rgba(241,179,74,.16);
        --s-you-ink:     #2a1d08;   /* readable ink on the amber bubble */

        /* The scene's atmospheric paint — shared by the live stage AND the
           "stepping in" overlay so the overlay dissolves seamlessly into it. */
        --scene-paint:
          radial-gradient(120% 80% at 80% 0%, rgba(241,179,74,.10), transparent 60%),
          radial-gradient(120% 90% at 10% 100%, rgba(199,155,255,.10), transparent 55%),
          linear-gradient(170deg, #1a1410 0%, #120d0a 100%);

        --radius:   16px;
        --radius-sm:10px;
        --shadow-sm: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.10);
        --shadow-md: 0 6px 18px rgba(16,24,40,.12), 0 2px 6px rgba(16,24,40,.07);
        --shadow-lg: 0 18px 48px rgba(8,10,20,.28);
        --ease: cubic-bezier(.4, 0, .2, 1);

        --topbar-h: 52px;
        --input-h:  84px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg:          #0c0f17;
          --c-surface:     #161b27;
          --c-surface-2:   #1e2433;
          --c-ink:         #e9ecf4;
          --c-ink-soft:    #9aa3b8;
          --c-ink-faint:   #8b94a8;   /* ≥4.5:1 on the dark surfaces (was #6b7488 ≈ 3.3:1) */
          --c-line:        #29303f;
          --c-accent:      #8092ff;
          --c-accent-strong:#9aa8ff;
          --c-accent-soft: #1b2236;
          --c-on-accent:   #0c0f17;
          --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
          --shadow-md: 0 6px 18px rgba(0,0,0,.45);
          --shadow-lg: 0 18px 48px rgba(0,0,0,.6);
        }
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: 'Open Sans', system-ui, sans-serif;
        background: var(--c-bg);
        color: var(--c-ink);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;        /* the stage / panels own their own scroll */
      }
      button { font-family: inherit; }

      /* Visually-hidden but screen-reader available (the aria-live region) */
      .sr-only {
        position: absolute; width: 1px; height: 1px;
        padding: 0; margin: -1px; overflow: hidden;
        clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }

      /* ===================================================================
         2. APP SHELL
         =================================================================== */
      .app {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
      }

      /* —— Top bar (slim, so the experience stays immersive) —— */
      .topbar {
        flex: 0 0 auto;
        height: var(--topbar-h);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
        background: var(--c-surface);
        border-bottom: 1px solid var(--c-line);
        z-index: 60;
      }
      .topbar .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        flex: 0 0 auto;   /* keep the wordmark intact; let the scenario ellipsize instead */
      }
      /* Product wordmark — a plain mark, NOT a filled pill, so it doesn't read
         as a twin of the "Coaching" toggle segment below it. */
      .topbar .brand .badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--c-ink);
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: .01em;
        white-space: nowrap;
      }
      .topbar .brand .badge i { color: var(--c-accent); font-size: 13px; }
      .topbar .scenario {
        font-size: 13px;
        color: var(--c-ink-faint);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      /* a hairline divider sets the scenario apart from the wordmark */
      .topbar .scenario::before {
        content: "";
        display: inline-block;
        width: 1px;
        height: 15px;
        margin-right: 12px;
        background: var(--c-line);
        vertical-align: -2px;
      }
      .topbar .spacer { flex: 1 1 auto; }
      .topbar .tb-btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 34px;
        padding: 0 13px;
        border: 1px solid var(--c-line);
        border-radius: 9px;
        background: var(--c-surface);
        color: var(--c-ink-soft);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: border-color .15s var(--ease), color .15s var(--ease);
      }
      .topbar .tb-btn:hover { border-color: var(--c-accent); color: var(--c-ink); }
      .topbar .tb-btn i { font-size: 12px; }
      @media (max-width: 560px) {
        .topbar .scenario { display: none; }
        .topbar .tb-btn .label { display: none; }
        .topbar .tb-btn { padding: 0 10px; }
      }

      /* —— The viewport that holds the mode indicator + the live stage —— */
      .viewport {
        flex: 1 1 auto;
        position: relative;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }

      /* ===================================================================
         3. MODE INDICATOR  — persistent; the single source of "where am I"
         =================================================================== */
      .mode-indicator {
        flex: 0 0 auto;
        position: relative;
        z-index: 56;            /* stays above the pause scrim so the toggle stays tappable */
        display: flex;
        align-items: center;
        justify-content: center;   /* the toggle is centered on the page */
        gap: 12px;
        padding: 9px 16px;
        font-size: 12px;
        /* sits on the CONTENT background (not chrome surface) so it reads as the
           practice's status strip rather than a second top bar */
        background: var(--c-bg);
        border-bottom: 1px solid var(--c-line);
        color: var(--c-ink-soft);
        max-height: 64px;
        overflow: hidden;
        transition: background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease),
                    max-height .45s var(--ease), opacity .4s var(--ease), padding .45s var(--ease),
                    transform .45s var(--ease);
      }
      /* Withheld until the learner is past the establishing card / cold-open video
         — the Learn|Practice choice isn't meaningful before then. Drops down and
         fades in once the AI coach actually begins. */
      .mode-indicator.is-hidden {
        max-height: 0;
        opacity: 0;
        padding-top: 0;
        padding-bottom: 0;
        border-bottom-color: transparent;
        transform: translateY(-10px);
        pointer-events: none;
      }

      /* Segmented "Learn | Practice" toggle — both shown, one active,
         tap the inactive one to switch states. */
      .mode-toggle {
        display: inline-flex;
        padding: 3px;
        gap: 3px;
        border-radius: 999px;
        background: var(--c-surface-2);
        border: 1px solid var(--c-line);
      }
      .seg {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 6px 13px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--c-ink-soft);
        font: inherit;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .02em;
        cursor: pointer;
        transition: background .18s var(--ease), color .18s var(--ease), opacity .18s var(--ease);
      }
      .seg i { font-size: 11px; }
      .seg:hover:not(.active):not([disabled]) { color: var(--c-ink); background: var(--c-surface); }
      .seg.active { background: var(--c-accent); color: var(--c-on-accent); box-shadow: var(--shadow-sm); cursor: default; }
      .seg[disabled] { opacity: .38; cursor: default; }
      .seg:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--c-accent-soft); }

      /* scene look — warm, on the dark stage chrome */
      .app[data-mode="scene"] .mode-indicator {
        background: #15100c;
        border-bottom-color: #2c2118;
        color: var(--s-ink-soft);
      }
      .app[data-mode="scene"] .mode-toggle { background: #221a13; border-color: #3a2f28; }
      .app[data-mode="scene"] .seg { color: var(--s-ink-soft); }
      .app[data-mode="scene"] .seg:hover:not(.active):not([disabled]) { color: var(--s-ink); background: rgba(255,255,255,.06); }
      .app[data-mode="scene"] .seg.active { background: var(--s-you); color: var(--s-you-ink); }
      .app[data-mode="scene"] .seg:focus-visible { box-shadow: 0 0 0 3px var(--s-you-soft); }

      /* ===================================================================
         4. THE STAGE  — the live "current beat" canvas
         =================================================================== */
      .stage {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        position: relative;
        transition: filter .2s var(--ease), opacity .2s var(--ease);
      }
      .stage-inner {
        max-width: 720px;
        margin: 0 auto;
        padding: 24px 18px 32px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-height: 100%;
      }

      /* When the coach sheet is up, the practice peek behind it is frozen with a
         light blur; the scrim (over the top) does the dimming, so no brightness
         here (avoids double-darkening). */
      .stage.is-frozen {
        filter: blur(2.5px);
        pointer-events: none;
        user-select: none;
      }

      /* The stage IS the practice base — always the warm, dark, vignetted room. */
      .stage { background: var(--scene-paint); }

      /* —— Establishing card — the practice base before the scene begins.
         Anchors the learner to what they're about to practice while the coach
         sheet preps them above it. */
      .establishing {
        margin: auto;             /* centered in the stage — the scene anchor on landing */
        max-width: 460px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 24px 24px;
      }
      .est-eyebrow {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .18em;
        text-transform: uppercase;
        color: var(--s-ink-faint);
      }
      .est-title {
        margin: 0;
        font-size: clamp(22px, 4.2vw, 30px);
        font-weight: 700;
        letter-spacing: -.01em;
        color: var(--s-ink);
      }
      .est-sub {
        margin: 0;
        font-size: 15px;
        line-height: 1.6;
        color: var(--s-ink-soft);
      }
      .est-with {
        margin-top: 4px;
        font-size: 13px;
        color: var(--s-ink-faint);
      }
      .est-with b { color: var(--s-char); font-weight: 700; }

      /* "Step into the scene" — the learner-triggered entry CTA. Wears the scene's
         warm amber so it previews the destination. It TAKES OVER the input bar
         once the AI coach invites you in (rather than adding a second interaction
         area in the thread); the scene never auto-advances. */
      .enter-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 11px;
        padding: 13px 22px;
        border: 0;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--s-you), #e3a02f);
        color: var(--s-you-ink);
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(241,179,74,.26);
        transition: filter .15s var(--ease), transform .1s var(--ease);
      }
      .enter-cta:hover { filter: brightness(1.05); }
      .enter-cta:active { transform: scale(.98); }
      .enter-cta:focus-visible { outline: none; box-shadow: 0 6px 18px rgba(241,179,74,.26), 0 0 0 3px var(--s-you-soft); }
      .enter-cta .arrow { transition: transform .15s var(--ease); }
      .enter-cta:hover .arrow { transform: translateX(3px); }

      /* —— Scene video — a cold-open that plays INSIDE the practice layer (the
         stage) as a contained card, not a standalone full-screen player and not
         edge-to-edge either. Six clips play back-to-back with a hard cut between
         them and no progress/counter of any kind, so it reads as one continuous
         video — the learner can pause/resume, but can't skip ahead between clips.
         Narration is shown as short caption chunks (not the whole paragraph at
         once) fading at the bottom — the same "reveal a little at a time" idea
         as the Audio Summary experiment, just timer-paced since there's no
         narration audio to follow. Centered the same way .establishing is
         (margin: auto inside .stage-inner's flex column). —— */
      .scene-video {
        position: relative;
        margin: auto;
        width: 100%;
        max-width: 560px;
        aspect-ratio: 16 / 9;
        border-radius: var(--radius);
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        box-shadow: var(--shadow-md);
      }
      /* All six get their own element, stacked, all preloading from the moment
         the phase mounts — only the active one is opaque. Swapping opacity
         instead of swapping one element's src is what lets every clip buffer
         in the background while an earlier one plays, and avoids re-triggering
         a fresh decode pipeline on every cut. */
      .intro-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
      }
      .intro-video.is-active { opacity: 1; }
      /* Vignette so white caption text stays legible over a bright clip */
      .scene-video::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0) 60%, rgba(0,0,0,.65) 100%);
        pointer-events: none;
      }
      .intro-caption-wrap {
        position: absolute;
        left: 0; right: 0; bottom: 28px;
        display: flex;
        justify-content: center;
        padding: 0 24px;
        z-index: 1;
      }
      .intro-caption {
        margin: 0;
        max-width: 560px;
        text-align: center;
        font-size: clamp(15px, 2.4vw, 18px);
        line-height: 1.45;
        font-weight: 600;
        color: #fff;
        text-shadow: 0 1px 3px rgba(0,0,0,.6);
        background: rgba(0,0,0,.42);
        border-radius: 10px;
        padding: 9px 16px;
        opacity: 0;
        transition: opacity .35s var(--ease);
      }
      .intro-caption.is-visible { opacity: 1; }
      /* Play/pause — the one transport control the learner gets. No seek, no
         skip-ahead between clips; just the ability to pause and resume. */
      .intro-playpause {
        position: absolute;
        left: 12px; top: 12px;
        z-index: 1;
        width: 34px; height: 34px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 0;
        background: rgba(0,0,0,.5);
        color: #fff;
        font-size: 14px;
        cursor: pointer;
        transition: background .15s var(--ease);
      }
      .intro-playpause:hover { background: rgba(0,0,0,.7); }
      .intro-playpause:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(255,255,255,.4); }
      /* Skip — PROTOTYPE-ONLY review affordance so stakeholders can jump past
         the cold open without watching all six clips. The actual design keeps
         the intro unskippable (see the note above) — do NOT carry this into
         the real build. Sits above the loading beat too, so a reviewer can
         bail even while clips are still buffering. */
      .intro-skip {
        position: absolute;
        right: 12px; bottom: 12px;
        z-index: 4;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        border: 0;
        border-radius: 999px;
        padding: 7px 14px;
        background: rgba(0,0,0,.5);
        color: #fff;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background .15s var(--ease);
      }
      .intro-skip:hover { background: rgba(0,0,0,.7); }
      .intro-skip:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(255,255,255,.4); }
      .intro-skip i { font-size: 11px; }
      /* One-time fallback if the browser blocks autoplay even muted */
      .intro-begin {
        position: absolute;
        inset: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,.35);
        border: 0;
        color: #fff;
        font: inherit;
        font-size: 17px;
        font-weight: 700;
        gap: 10px;
        cursor: pointer;
      }
      .intro-begin i { font-size: 28px; }
      .intro-begin[hidden] { display: none; }
      /* Quiet loading beat while all six clips preload, before the first plays.
         Sits ABOVE the (still-buffering, invisible) videos and fades out once
         every one of them reports ready — see preloadVideos(). */
      .intro-loading {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        transition: opacity .3s var(--ease);
      }
      .intro-loading.is-out { opacity: 0; pointer-events: none; }
      .intro-loading .dots { display: inline-flex; gap: 6px; }
      .intro-loading .dots span {
        width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.85);
        animation: bob 1.2s infinite ease-in-out;
      }
      .intro-loading .dots span:nth-child(2) { animation-delay: .15s; }
      .intro-loading .dots span:nth-child(3) { animation-delay: .3s; }

      /* ===================================================================
         5. MESSAGES — coaching world
         =================================================================== */
      /* Coach message: avatar + label + bubble (out-of-fiction) */
      .coach-msg { display: flex; gap: 11px; align-items: flex-start; max-width: 78%; }
      .coach-avatar {
        flex: 0 0 auto;
        width: 34px; height: 34px;
        border-radius: 50%;
        display: grid; place-items: center;
        overflow: visible;   /* CLARA's orb (transparent, soft aura) hosts here — no disc behind it */
      }
      .coach-body { min-width: 0; }
      .coach-label {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--c-ink-faint);
        margin: 3px 0 5px;
      }
      .coach-bubble {
        background: var(--c-surface);
        border: 1px solid var(--c-line);
        border-radius: 16px 16px 16px 4px;   /* sharp corner bottom-left — points down to CLARA's orb */
        padding: 12px 15px;
        font-size: 15px;
        line-height: 1.55;
        color: var(--c-ink);
        white-space: pre-wrap;
        box-shadow: var(--shadow-sm);
        /* smooth both directions: floats forward when it's the live question,
           settles back to flat when the learner answers it (see .is-prompt). */
        transition: box-shadow .45s var(--ease), border-color .45s var(--ease);
      }

      /* ---- The coach's ACTIVE question ---------------------------------------
         The coach mixes teaching and asking, so the ONE line the learner must
         answer right now is easy to lose. We DON'T decorate it — no chip, no
         accent spine. We just LIFT it: the live question drops its flat outline
         and floats a touch above the teaching bubbles on a soft, faintly indigo
         shadow, blooming forward as it lands. It flattens back to a plain bubble
         the instant the learner replies — an answered probe is history, not a
         task. Driven by markActivePrompt() at render. */
      .coach-msg.is-prompt .coach-bubble {
        /* a faint hairline in the glow color — a lit edge, not an outline — plus
           the soft float shadow; together they lift the live question forward. */
        border-color: color-mix(in srgb, var(--c-accent) 38%, transparent);
        box-shadow: 0 8px 24px -6px color-mix(in srgb, var(--c-accent) 45%, transparent),
                    0 2px 6px rgba(16,24,40,.10);
      }
      @media (prefers-reduced-motion: no-preference) {
        .coach-msg.just-asked .coach-bubble { animation: promptSettle .7s var(--ease); }
      }
      @keyframes promptSettle {
        0%   { box-shadow: 0 1px 2px rgba(16,24,40,.06); }
        55%  { box-shadow: 0 13px 30px -6px color-mix(in srgb, var(--c-accent) 58%, transparent),
                           0 2px 6px rgba(16,24,40,.10); }
        100% { box-shadow: 0 8px 24px -6px color-mix(in srgb, var(--c-accent) 45%, transparent),
                           0 2px 6px rgba(16,24,40,.10); }
      }

      /* ---- Coach run = ONE identity (WhatsApp-style grouping) ----------------
         A contiguous block of coach messages shows the "AI Coach" name once, at
         the TOP (grp-first), and attaches the avatar once, to the LAST message
         (grp-last) — bottom-aligned by its tail. In-between bubbles keep the
         avatar's column reserved so they stay aligned, hide the disc, and tuck
         closer together. A learner reply breaks the run. grp-first / grp-last are
         toggled per render by markCoachGroups(). */
      .coach-msg:not(.grp-first) .coach-label { display: none; }
      .coach-msg:not(.grp-last) .coach-avatar { visibility: hidden; }   /* reserve the 34px column */
      .coach-msg.grp-last { align-items: flex-end; }                    /* avatar hugs the last bubble */
      .coach-msg + .coach-msg:not(.grp-first) { margin-top: -8px; }     /* tuck grouped bubbles closer */

      /* Your coaching reply: right-aligned accent bubble */
      .you-coach { display: flex; flex-direction: column; align-items: flex-end; max-width: 78%; margin-left: auto; }
      .you-coach .cap {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .06em;
        text-transform: uppercase;
        color: var(--c-ink-faint);
        margin: 0 2px 5px 0;
      }
      .you-coach .bubble {
        background: var(--c-accent);
        color: var(--c-on-accent);
        border-radius: 16px 16px 4px 16px;   /* sharp corner bottom-right — mirrors the coach bubble */
        padding: 11px 15px;
        font-size: 15px;
        line-height: 1.5;
        white-space: pre-wrap;
        box-shadow: var(--shadow-sm);
      }

      /* ===================================================================
         6. STAGE CARD  — wraps a contiguous run of SCENE messages.
            Bordered, recessed; reads as a continuous stage.
         =================================================================== */
      .stage-card {
        position: relative;
        background: linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.30));
        border: 1px solid var(--s-line);
        border-radius: var(--radius);
        padding: 16px 16px 18px;
        box-shadow: inset 0 2px 18px rgba(0,0,0,.45);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .stage-card .scene-tag {
        position: absolute;
        top: -9px; left: 16px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 10px;
        border-radius: 999px;
        background: var(--s-surface-2);
        border: 1px solid var(--s-line);
        color: var(--s-ink-soft);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      .stage-card .scene-tag i { color: var(--s-you); font-size: 9px; }

      /* Character line: avatar + name + state chip; optional narration; bubble */
      .char-line { display: flex; gap: 11px; align-items: flex-start; max-width: 78%; }
      .char-avatar {
        flex: 0 0 auto;
        width: 36px; height: 36px;
        border-radius: 50%;
        display: grid; place-items: center;
        background: linear-gradient(135deg, #7c5bb0, #c79bff);
        color: #fff;
        font-size: 15px;
        font-weight: 700;
      }
      /* don't grow to fill the row — let the bubble hug its text (capped by the
         .char-line max-width), so short lines read as short bubbles */
      .char-body { min-width: 0; flex: 0 1 auto; }
      .char-head {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 2px 0 6px;
        flex-wrap: wrap;
      }
      .char-name {
        font-size: 13px;
        font-weight: 700;
        color: var(--s-char);
        letter-spacing: .01em;
      }
      .char-state {
        padding: 2px 9px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        text-transform: lowercase;
        background: var(--s-char-soft);
        color: var(--s-char);
      }
      .char-narration {
        font-style: italic;
        color: var(--s-ink-soft);
        font-size: 13.5px;
        line-height: 1.5;
        margin: 0 0 8px;
        padding-left: 1px;
      }
      .char-bubble {
        background: var(--s-surface);
        border: 1px solid var(--s-line);
        border-radius: 4px 16px 16px 16px;
        padding: 12px 15px;
        font-size: 15px;
        line-height: 1.55;
        color: var(--s-ink);
        white-space: pre-wrap;
      }
      /* A standalone narration (no dialogue) sets the scene quietly */
      .scene-narration {
        font-style: italic;
        color: var(--s-ink-soft);
        font-size: 14px;
        line-height: 1.6;
        text-align: center;
        max-width: 52ch;
        margin: 2px auto;
        padding: 4px 8px;
      }
      /* CONSEQUENCE tier — the narration beat that lands right after the learner
         acts is the payoff ("here's what your choice did"). It gets its own
         weight: larger, brighter, more air, and a slow settle-in from slightly
         oversized, with a faint warm lift (no neon — gravity, not sparkle). */
      .scene-narration.consequence {
        font-style: normal;
        color: var(--s-ink);
        font-size: 19px;
        line-height: 1.5;
        font-weight: 500;
        max-width: 44ch;
        margin: 18px auto;
        padding: 8px 10px;
        text-shadow: 0 0 24px rgba(255, 214, 168, .14);
      }
      .scene-narration.consequence.enter { animation: consequence-land .95s cubic-bezier(.2,.7,.2,1) both; }
      @keyframes consequence-land { from { transform: translateY(10px) scale(1.04); } to { transform: none; } }
      @media (prefers-reduced-motion: reduce) { .scene-narration.consequence.enter { animation: none; } }

      /* Your scene line: caption + mic icon; amber "spoken" bubble; retry control */
      .you-scene { display: flex; flex-direction: column; align-items: flex-end; max-width: 78%; margin-left: auto; }
      .you-scene .cap {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .04em;
        color: var(--s-ink-faint);
        margin: 0 2px 5px 0;
      }
      .you-scene .cap i { color: var(--s-you); font-size: 11px; }
      .you-scene .bubble {
        background: linear-gradient(135deg, var(--s-you), #e3a02f);
        color: var(--s-you-ink);
        border-radius: 16px 4px 16px 16px;
        padding: 11px 15px;
        font-size: 15px;
        line-height: 1.5;
        font-weight: 600;
        white-space: pre-wrap;
        box-shadow: 0 4px 14px rgba(241,179,74,.22);
      }
      .you-scene .retry {
        margin: 7px 2px 0 0;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 5px 11px;
        border: 1px solid var(--s-line);
        border-radius: 999px;
        background: transparent;
        color: var(--s-ink-soft);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: border-color .15s var(--ease), color .15s var(--ease), background .15s var(--ease);
      }
      .you-scene .retry:hover { border-color: var(--s-you); color: var(--s-you); background: var(--s-you-soft); }
      .you-scene .retry i { font-size: 11px; }

      /* The learner's ACTION (what they do, not what they say) — a centered,
         accent-tinted stage direction, distinct from world narration (muted
         white) and their spoken lines (the amber bubble). */
      .you-narration {
        font-style: italic;
        color: var(--s-you);
        opacity: .95;
        font-size: 14px;
        line-height: 1.6;
        text-align: center;
        max-width: 52ch;
        margin: 8px auto 2px;
        padding: 2px 8px;
      }
      .you-narration-actions { display: flex; justify-content: flex-end; margin-top: 4px; }

      /* Word-by-word reveal for NARRATION — mimics the line being "read" as it
         lands (placeholder for real TTS later). Each word fades+de-blurs on a
         short stagger; gated to the freshly-delivered render only. */
      .rvl { opacity: 0; animation: rvl-in .34s var(--ease) forwards; }
      @keyframes rvl-in { from { opacity: 0; filter: blur(3px); } to { opacity: 1; filter: none; } }
      @media (prefers-reduced-motion: reduce) { .rvl { animation: none; opacity: 1; } }

      /* Scene-mode send button reads as an action CTA ("Respond"), not a chat arrow. */
      .send-btn.is-respond { width: auto; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; white-space: nowrap; }

      /* ===================================================================
         8. THE AI COACH LAYER  — one consistent bottom sheet that rises over
            the practice base (which stays visible, dimmed, above it). Same
            presentation for opening prep AND debriefs; the Learn/Practice
            toggle just raises/lowers it.
         =================================================================== */
      /* scrim dims the practice peek above the sheet whenever the coach is up */
      .scrim {
        position: fixed;
        inset: var(--topbar-h) 0 0 0;
        z-index: 40;
        background: rgba(8, 7, 5, .55);
        opacity: 0;
        pointer-events: none;
        transition: opacity .22s var(--ease);
      }
      .app.coach-up .scrim { opacity: 1; pointer-events: auto; }

      /* The coach sheet — bottom sheet on ALL breakpoints. `bottom` is set in JS
         to the input bar's height so it sits right on top of it; together they
         read as the coach layer. Hidden by sliding below; shown by sliding up. */
      .coach-panel {
        position: fixed;
        left: 0; right: 0;
        bottom: var(--input-h);            /* JS keeps this in sync with the input bar */
        z-index: 50;
        height: auto;                       /* grows to fit its content... */
        max-height: 56vh;                   /* ...until this, where the body scrolls instead */
        max-width: 860px;
        margin: 0 auto;
        background: var(--c-surface);
        border: 1px solid var(--c-line);
        border-bottom: 0;
        border-radius: var(--radius) var(--radius) 0 0;
        box-shadow: var(--shadow-lg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transform: translateY(120%);
        transition: transform .24s var(--ease);
      }
      .app.coach-up .coach-panel { transform: none; }
      @media (max-height: 620px) { .coach-panel { max-height: 62vh; } }

      .coach-panel-head {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 13px 16px 12px;
        border-bottom: 1px solid var(--c-line);
      }
      .coach-panel-head .ttl {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--c-accent-strong);
      }
      .coach-panel-head .spacer { flex: 1 1 auto; }
      /* lower-the-sheet / back-to-practice control (only meaningful once entered) */
      .coach-panel-resume {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 13px;
        border: 1px solid var(--c-line);
        border-radius: 999px;
        background: var(--c-surface);
        color: var(--c-ink-soft);
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        transition: border-color .15s var(--ease), color .15s var(--ease);
      }
      .coach-panel-resume:hover { border-color: var(--s-you); color: var(--c-ink); }
      .coach-panel-resume i { font-size: 11px; }
      .coach-panel-resume[hidden] { display: none; }   /* class display would otherwise override [hidden] */
      /* "Begin practicing" variant — pre-entry, this same slot reads as the primary
         CTA (amber, previewing the scene) rather than the quiet "back" control. */
      .coach-panel-resume.is-begin {
        background: linear-gradient(135deg, var(--s-you), #e3a02f);
        border-color: transparent;
        color: var(--s-you-ink);
        font-weight: 700;
      }
      .coach-panel-resume.is-begin:hover { filter: brightness(1.06); color: var(--s-you-ink); }

      .coach-panel-body {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        overflow-anchor: none;   /* don't let the browser pin scroll to old content when new bubbles append — we follow the bottom ourselves */
        padding: 16px 16px 22px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      /* ===================================================================
         9. INPUT BAR  — placeholder + accent driven by inputTarget
         =================================================================== */
      .inputbar {
        position: relative;
        z-index: 55;       /* above the scrim, so coaching input stays usable */
        flex: 0 0 auto;
        /* A CTA, a status line, and the composer+hint are different heights —
           without a shared floor, switching between them visibly jumps the
           whole page (this bar, the coach sheet sitting on it, and the stage
           above). Centering a single-line state inside the composer's own
           height (the tallest common case) makes most transitions height-
           neutral; only the rare two-line entry state still grows a touch. */
        min-height: 104px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: var(--c-surface);
        border-top: 1px solid var(--c-line);
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
        transition: background .2s var(--ease), border-color .2s var(--ease);
      }
      .input-row {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        align-items: flex-end;
        gap: 10px;
      }
      .input-shell {
        flex: 1 1 auto;
        display: flex;
        align-items: flex-end;
        gap: 8px;
        border: 1.5px solid var(--c-line);
        border-radius: 14px;
        background: var(--c-bg);
        padding: 4px 6px 4px 14px;
        transition: border-color .15s var(--ease), box-shadow .15s var(--ease);
      }
      .input-shell:focus-within {
        border-color: var(--c-accent);
        box-shadow: 0 0 0 3px var(--c-accent-soft);
      }
      .input-shell .lead-icon {
        flex: 0 0 auto;
        align-self: center;
        color: var(--c-ink-faint);
        font-size: 14px;
        margin-bottom: 1px;
      }
      .inputbar textarea {
        flex: 1 1 auto;
        resize: none;
        border: 0;
        background: transparent;
        outline: none;
        font: inherit;
        font-size: 15px;
        line-height: 1.45;
        color: var(--c-ink);
        max-height: 120px;
        padding: 9px 0;
      }
      .inputbar textarea::placeholder { color: var(--c-ink-faint); }
      .send-btn {
        flex: 0 0 auto;
        width: 40px;
        align-self: stretch;     /* match the text field's height (row is align-end) */
        min-height: 40px;
        border: 0;
        border-radius: 11px;
        background: var(--c-accent);
        color: var(--c-on-accent);
        font-size: 15px;
        cursor: pointer;
        transition: background .15s var(--ease), transform .1s var(--ease);
      }
      .send-btn:hover { background: var(--c-accent-strong); }
      .send-btn:active { transform: scale(.95); }
      .send-btn:disabled { opacity: .45; cursor: default; }

      .input-main[hidden], .input-entry[hidden], .input-analyzing[hidden], .input-done[hidden] { display: none; }

      /* hint line under the composer */
      .input-foot {
        max-width: 720px;
        margin: 8px auto 0;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 11.5px;
        color: var(--c-ink-faint);
      }
      .input-foot .hint { flex: 1 1 auto; }

      /* Tooltip on the mode-toggle segments — clarifies what tapping does (esp. the
         Practice segment as a way to begin / return). Hover-only, so it's a desktop
         nicety layered on top of the always-visible affordances. */
      .seg[data-tip] { position: relative; }
      .seg[data-tip]:hover::after {
        content: attr(data-tip);
        position: absolute;
        bottom: calc(100% + 8px);
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        padding: 5px 9px;
        border-radius: 7px;
        background: var(--c-ink);
        color: var(--c-surface);
        font-size: 11.5px;
        font-weight: 600;
        letter-spacing: .01em;
        box-shadow: var(--shadow-md);
        pointer-events: none;
        z-index: 70;
      }

      /* Entry state — the CTA stands in for the composer, with a quiet
         "keep talking" escape hatch beneath it. */
      .input-entry {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 9px;
      }
      /* Sized to its own text (not the full input bar) — .input-entry's
         align-items:center keeps it centered either way. */
      .enter-cta-bar { width: auto; }
      .keep-talking {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 0;
        background: none;
        color: var(--c-ink-soft);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 8px;
        transition: color .15s var(--ease), background .15s var(--ease);
      }
      .keep-talking:hover { color: var(--c-ink); background: var(--c-surface-2); }
      .keep-talking i { font-size: 12px; opacity: .8; }

      /* —— Scene-targeted input gets the warm amber treatment —— */
      .app[data-target="character"] .inputbar {
        background: #15100c;
        border-top-color: #2c2118;
      }
      .app[data-target="character"] .input-shell {
        background: #221a13;
        border-color: #43372e;
      }
      .app[data-target="character"] .input-shell:focus-within {
        border-color: var(--s-you);
        box-shadow: 0 0 0 3px var(--s-you-soft);
      }
      .app[data-target="character"] .input-shell .lead-icon { color: var(--s-you); }
      .app[data-target="character"] .inputbar textarea { color: var(--s-ink); }
      .app[data-target="character"] .inputbar textarea::placeholder { color: var(--s-ink-faint); }
      .app[data-target="character"] .send-btn { background: var(--s-you); color: var(--s-you-ink); }
      .app[data-target="character"] .send-btn:hover { filter: brightness(1.06); background: var(--s-you); }
      .app[data-target="character"] .input-foot { color: var(--s-ink-faint); }

      /* Typing / working indicator (in stage or panel). Takes an optional label —
         e.g. "Updating the scene…" — so a live-model wait never reads as frozen. */
      .typing {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 13px 15px;
        border-radius: 14px;
        background: var(--c-surface);
        border: 1px solid var(--c-line);
        box-shadow: var(--shadow-sm);
        animation: typing-in .3s var(--ease) both;   /* fade/rise in softly, not a pop */
      }
      @keyframes typing-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) { .typing, .you-loading { animation: none; } }
      .typing.scene { background: var(--s-surface); border-color: var(--s-line); }
      .typing .tdots { display: inline-flex; gap: 5px; }
      .typing .tdots span {
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--c-ink-faint);
        animation: bob 1.2s infinite ease-in-out;
      }
      .typing.scene .tdots span { background: var(--s-ink-faint); }
      .typing .tdots span:nth-child(2) { animation-delay: .15s; }
      .typing .tdots span:nth-child(3) { animation-delay: .3s; }
      .typing .tlabel { font-size: 13px; font-weight: 600; color: var(--s-ink-soft); letter-spacing: .01em; }
      @keyframes bob { 0%,60%,100% { transform: translateY(0); opacity:.5; } 30% { transform: translateY(-5px); opacity:1; } }

      /* Learner's move "considering…" loader — stands in for their scene line while
         the say/do split resolves, so the move renders ONCE (never raw-then-split). */
      .you-loading {
        align-self: flex-end;
        display: inline-flex;
        gap: 5px;
        align-items: center;
        padding: 12px 15px;
        border-radius: 16px 16px 4px 16px;
        background: var(--s-you-soft);
        border: 1px solid var(--s-you);
        animation: typing-in .3s var(--ease) both;
      }
      .you-loading span {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--s-you);
        animation: bob 1.2s infinite ease-in-out;
      }
      .you-loading span:nth-child(2) { animation-delay: .15s; }
      .you-loading span:nth-child(3) { animation-delay: .3s; }

      /* —— Content enter animation (fade + slight rise; runs once per node) —— */
      .coach-msg.enter, .you-coach.enter, .char-line.enter,
      .you-narration.enter, .you-scene.enter {
        animation: msg-enter .34s var(--ease) both;
      }
      @keyframes msg-enter { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

      /* —— Chat-panel transitions — everything swaps by PHASING IN, never a hard cut.
         Two swaps used to snap in a single frame: a coach line replacing the typing
         dots, and the composer flipping to a bottom CTA. Both now fade in. Coach
         bubbles fade with NO vertical hop — the old translateY(7px) fought the coach
         sheet's own rise/scroll and read as the "jump". The input bar's incoming
         state (composer <-> CTA / "Analyzing..." / "Continue practicing ->") fades
         up into place; min-height on .inputbar holds the floor, so no reflow. Scene
         lines keep their typewriter reveal. Duplicated per page — keep in sync. */
      .coach-msg.enter, .you-coach.enter { animation: chat-fade-in .28s var(--ease) both; }
      .input-main:not([hidden]), .input-entry:not([hidden]),
      .input-analyzing:not([hidden]), .input-done:not([hidden]) { animation: input-fade-in .3s var(--ease) both; }
      @keyframes chat-fade-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes input-fade-in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .coach-msg.enter, .you-coach.enter,
        .input-main:not([hidden]), .input-entry:not([hidden]),
        .input-analyzing:not([hidden]), .input-done:not([hidden]) { animation: none; }
      }


      /* —— "Analyzing your response…" — shown IN the input area (not over the
         scene), so the learner keeps reading the reaction while the coach reviews —— */
      .input-analyzing {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 11px;
        padding: 15px 14px;
        color: var(--c-ink-soft);
        font-size: 14px;
        font-weight: 600;
      }
      .input-analyzing .dots { display: inline-flex; gap: 4px; }
      .input-analyzing .dots span {
        width: 6px; height: 6px; border-radius: 50%; background: var(--c-accent);
        animation: bob 1.2s infinite ease-in-out;
      }
      .input-analyzing .dots span:nth-child(2) { animation-delay: .15s; }
      .input-analyzing .dots span:nth-child(3) { animation-delay: .3s; }

      /* Settled state after "Continue" — no dots, no CTA, just confirmation
         that this practice is done. */
      .input-done {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        padding: 15px 14px;
        color: var(--c-ink-soft);
        font-size: 14px;
        font-weight: 600;
      }
      .input-done i { color: #16a34a; }

      /* Debrief CTA — opens the queued coach debrief. Wears the coach indigo to
         preview the destination (mirroring the amber "Step into the scene"). */
      .debrief-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 11px;
        padding: 13px 22px;
        border: 0;
        border-radius: 12px;
        background: var(--c-accent);
        color: var(--c-on-accent);
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(75, 99, 230, .26);
        transition: filter .15s var(--ease), transform .1s var(--ease);
      }
      .debrief-cta:hover { filter: brightness(1.06); }
      .debrief-cta:active { transform: scale(.98); }
      .debrief-cta:focus-visible { outline: none; box-shadow: 0 6px 18px rgba(75,99,230,.26), 0 0 0 3px var(--c-accent-soft); }
      .debrief-cta .arrow { transition: transform .15s var(--ease); }
      .debrief-cta:hover .arrow { transform: translateX(3px); }

      /* ===================================================================
         10. COMPLETION / RESOURCES  (shown at the end, as a coach message —
             see resourcesNode() — not a separate boxed widget)
         =================================================================== */
      /* The debrief presentation — resources bubble, closing stepper, report
         sections, results modal, score ring — is styled by the SHARED
         Section-3 module (js/sim-debrief.js injects one canonical stylesheet)
         so the close renders identically on every simulator page. Theme
         colors still resolve from this page's CSS variables above. */

      /* ===================================================================
         11. REDUCED MOTION  — instant cross-fade, no scale, static dim
         =================================================================== */
      @media (prefers-reduced-motion: reduce) {
        * { transition-duration: .001ms !important; animation-duration: .001ms !important; }
        .stage.is-frozen { filter: brightness(.7); }   /* drop the blur; keep static dim */
        /* the sheet still hides/shows, just instantly (global rule zeroes the slide) */
      }
    </style>

    <!-- =====================================================================
         COURSE SKIN — remaps this scenario's private coaching/scene tokens to
         the "Layered Learning" navy/teal palette (css/layered-learning.css) so
         it reads as the same design world as the rest of the layered-course-*
         flow. Placed AFTER the base + dark :root blocks above, so a plain
         :root{} here wins in BOTH OS themes (constant navy, like .ll-stage).
         Nothing here touches the scenario's logic — pure CSS-variable remap
         plus a few overrides for the handful of hard-coded (non-token) colors.
         ===================================================================== -->
    <style id="ll-scenario-skin">
      /* Seamless boundary with the course shell: this page is reached across a
         cross-document View Transition, animated as a clean full-page CROSS-FADE.
         We intentionally DON'T name the top frame — its layout differs between
         the two pages (embedded in #app here vs. a fixed overlay on the course
         shell), so a shared name made the browser morph it and slide the content
         toward a corner. A plain fade is calmer and has no slide. */
      @view-transition { navigation: auto; }
      ::view-transition-old(root),
      ::view-transition-new(root) { animation-duration: 320ms; animation-timing-function: ease; }
      @media (prefers-reduced-motion: reduce) {
        ::view-transition-old(root),
        ::view-transition-new(root) { animation-duration: 1ms; }
      }

      :root {
        color-scheme: dark;
        /* —— Coaching world → Layered navy/teal —— */
        --c-bg:           #070b14;
        --c-surface:      #111a2e;
        --c-surface-2:    #16203a;
        --c-ink:          #eaf0fb;
        --c-ink-soft:     #aab6cc;
        --c-ink-faint:    #7a879e;
        --c-line:         rgba(255,255,255,.11);
        --c-accent:       #2ee6cf;   /* teal — CLARA */
        --c-accent-strong:#14b8a6;
        --c-accent-soft:  rgba(46,230,207,.12);
        --c-on-accent:    #052b27;
        /* —— Scene world → same cool navy stage (keep the character violet) —— */
        --s-ink:          #eaf0fb;
        --s-ink-soft:     #aab6cc;
        --s-ink-faint:    #7a879e;
        --s-surface:      #111a2e;
        --s-surface-2:    #16203a;
        --s-line:         rgba(255,255,255,.11);
        --s-char:         #c79bff;   /* the character keeps a distinct violet voice */
        --s-char-soft:    rgba(199,155,255,.16);
        --s-you:          #2ee6cf;   /* the learner's voice → teal */
        --s-you-soft:     rgba(46,230,207,.16);
        --s-you-ink:      #052b27;
        /* Stage backdrop = the .ll-stage radial (the biggest scene surface). */
        --scene-paint:
          radial-gradient(130% 110% at 50% -10%, #0f1a2e 0%, #0a1120 52%, #05080f 100%);
        --shadow-lg: 0 24px 60px rgba(0,0,0,.5);
      }
      /* Overrides for colors that are hard-coded (not read from a token): */
      .enter-cta {
        background: linear-gradient(135deg, #46f0dc 0%, #16b8a6 55%, #0c8f83 100%);
        color: #052b27;
        box-shadow: 0 6px 18px rgba(20,184,166,.34);
      }
      /* The scene-addressed input bar is hard-coded warm-dark; cool it to navy. */
      .app[data-target="character"] .inputbar { background: #0b1322; border-top-color: rgba(255,255,255,.11); }
      .app[data-target="character"] .input-shell { background: rgba(255,255,255,.04); border-color: rgba(255,255,255,.11); }
      /* Footer bar → match the .ll-footer family across the course. */
      .inputbar { background: linear-gradient(180deg, #0b1322 0%, #070c16 100%); }
      /* Debrief modal accents (sim-debrief.js injects these hard-coded) —
         re-scope by #resultsModal id so we beat its runtime-injected rules. */
      #resultsModal .report-section.playbook { --accent-color: #2ee6cf; }
      #resultsModal .report-section.growth   { --accent-color: #f1b34a; }
      /* CLARA continuity: the shared Möbius orb, hosted as CLARA's message avatar
         (see placeClaraOrb()). No longer in the panel header. position:relative is
         required — MobiusOrb's canvas is absolute/inset:0, so it sizes to the
         nearest positioned ancestor; without this it balloons past the 34px slot. */
      .clara-orb-avatar { position: relative; width: 34px; height: 34px; }
      /* At 34px the orb's fine detail muddies against the dark navy panel, so a
         soft bloom sits BEHIND it — same treatment as the title page's .clara-aura
         (overlapping green + blue radials, blurred, organic blob — NOT a bordered
         disc with a ring). It's a ::before so it's literally behind the orb canvas. */
      .clara-orb-avatar::before {
        content: ''; position: absolute; left: 50%; top: 50%;
        width: 76px; height: 70px; transform: translate(-50%, -50%);
        border-radius: 46% 54% 48% 52% / 54% 46% 54% 46%;
        background:
          radial-gradient(45% 45% at 42% 40%, rgba(102, 247, 41, .34), transparent 70%),
          radial-gradient(60% 60% at 62% 66%, rgba(8, 115, 235, .26), transparent 72%);
        filter: blur(8px);
        pointer-events: none;
      }
      /* Review-only demo-skip control in the frame's actions slot. */
      #llDemoSkip { opacity: .85; }
      #llDemoSkip:hover { opacity: 1; }
    </style>
</head>
<body>
    <div class="app" id="app" data-mode="coaching" data-target="coach" data-entered="false">

      <!-- Page name for screen readers (the visible title lives in the top bar) -->
      <h1 class="sr-only" id="pageTitle">Practice scenario: Bystander Intervention: The Marshall Scenario</h1>

      <!-- Top bar ------------------------------------------------------- -->
      <header class="topbar">
        <span class="brand">
          <span class="badge"><i class="fa-solid fa-comments"></i> Practice chat</span>
        </span>
        <span class="scenario" id="scenarioName">Bystander Intervention: The Marshall Scenario</span>
        <span class="spacer"></span>
        <button class="tb-btn" id="restartBtn" aria-label="Restart practice">
          <i class="fa-solid fa-rotate-left"></i><span class="label">Restart</span>
        </button>
      </header>

      <!-- Viewport: mode indicator + live stage ------------------------- -->
      <main class="viewport">
        <div class="mode-indicator is-hidden" id="modeIndicator" aria-hidden="true"><!-- built by JS --></div>
        <section class="stage" id="stage" aria-label="Practice conversation">
          <div class="stage-inner" id="stageInner" aria-live="polite"><!-- built by JS --></div>
        </section>
      </main>

      <!-- AI Coach layer: scrim dims the practice peek; the sheet rises over it -->
      <div class="scrim" id="scrim"></div>
      <aside class="coach-panel" id="coachPanel" role="region" aria-label="Discussion with CLARA" aria-hidden="true" inert>
        <div class="coach-panel-head">
          <span class="ttl">Let’s discuss…</span>
          <span class="spacer"></span>
          <button class="coach-panel-resume" id="resumeBtn">
            Back to practice <i class="fa-solid fa-chevron-down"></i>
          </button>
        </div>
        <div class="coach-panel-body" id="coachPanelBody" aria-live="polite"><!-- built by JS --></div>
      </aside>

      <!-- Input bar ----------------------------------------------------- -->
      <footer class="inputbar">
        <!-- Start state: before anything begins we ANCHOR on the scene ("Kendra's
             room") with the coach sheet down and the composer hidden. The learner
             chooses when to bring the AI coach in — it does not open on its own. -->
        <div class="input-entry" id="inputStart">
          <button class="debrief-cta" id="startCtaBtn">
            <i class="fa-solid fa-door-open"></i> Enter scenario <i class="fa-solid fa-arrow-right arrow"></i>
          </button>
        </div>
        <!-- Normal composer -->
        <div class="input-main" id="inputMain">
          <div class="input-row">
            <div class="input-shell">
              <i class="fa-solid fa-comment lead-icon" id="inputIcon" aria-hidden="true"></i>
              <textarea id="composer" rows="1" placeholder="Type your response…"
                        aria-label="Your message"></textarea>
            </div>
            <button class="send-btn" id="sendBtn" aria-label="Send"><i class="fa-solid fa-arrow-up"></i></button>
          </div>
          <div class="input-foot">
            <span class="hint" id="inputHint">Enter to send · Shift+Enter for a new line</span>
          </div>
        </div>
        <!-- Entry state: the CTA takes the input bar's place once the coach invites
             you in, with a quiet option to keep talking instead -->
        <div class="input-entry" id="inputEntry" hidden>
          <button class="enter-cta enter-cta-bar" id="enterCtaBar">
            <i class="fa-solid fa-door-open"></i> Begin practicing <i class="fa-solid fa-arrow-right arrow"></i>
          </button>
          <button class="keep-talking" id="keepTalkingBtn">
            <i class="fa-solid fa-comment"></i> Or, do you need more prep?
          </button>
        </div>
        <!-- "Analyzing…" beat: shown in the input area while the learner reads the
             reaction; the scene stays full so nothing is missed -->
        <div class="input-analyzing" id="inputAnalyzing" hidden>
          <span class="dots"><span></span><span></span><span></span></span>
          Analyzing your response…
        </div>
        <!-- Cold-open video: the bar stays present (not empty) while it plays —
             there's nothing to tap yet, just a quiet status. -->
        <div class="input-analyzing" id="inputWatching" hidden>
          <span class="dots"><span></span><span></span><span></span></span>
          Watching the scene…
        </div>
        <!-- Debrief CTA: the coach is ready, opened only when the learner chooses -->
        <div class="input-entry" id="inputDebrief" hidden>
          <button class="debrief-cta" id="debriefCtaBtn">
            <i class="fa-solid fa-chalkboard-user"></i> See CLARA’s feedback <i class="fa-solid fa-arrow-right arrow"></i>
          </button>
        </div>
        <!-- Return CTA: the coach has replied and is ready to send the learner
             back into the scene — but they cross back on their own command,
             same as every other transition here. -->
        <div class="input-entry" id="inputReturn" hidden>
          <button class="enter-cta enter-cta-bar" id="returnCtaBtn">
            <i class="fa-solid fa-door-open"></i> Continue practicing <i class="fa-solid fa-arrow-right arrow"></i>
          </button>
        </div>
        <!-- Results CTA: shown once the closing recap has landed — the full
             strengths/growth-areas report opens in its own modal, not dumped
             into the chat thread. -->
        <div class="input-entry" id="inputResults" hidden>
          <button class="debrief-cta" id="resultsCtaBtn">
            <i class="fa-solid fa-chart-simple"></i> View full results <i class="fa-solid fa-arrow-right arrow"></i>
          </button>
        </div>
        <!-- Continue: the practice's actual last step — replaces the composer
             once the resources have landed, rather than leaving it sitting
             there disabled with nothing left to type. -->
        <div class="input-entry" id="inputContinue" hidden>
          <button class="debrief-cta" id="continueCtaBtn">
            Continue <i class="fa-solid fa-arrow-right arrow"></i>
          </button>
        </div>
        <!-- Settled state after Continue — no further action, just confirmation. -->
        <div class="input-done" id="inputDone" hidden>
          <i class="fa-solid fa-circle-check"></i> Practice complete
        </div>
      </footer>

      <!-- Polite live region for mode-change announcements -------------- -->
      <div class="sr-only" id="liveRegion" aria-live="polite"></div>
    </div>

    <!-- Results modal — a sibling of .app (not a descendant), so .app can be
         made inert while this is open without inerting itself. -->
    <div class="results-modal" id="resultsModal" hidden role="dialog" aria-modal="true" aria-label="Your results">
      <div class="results-modal-card" tabindex="-1">
        <div class="results-modal-head">
          <span class="results-modal-eyebrow">Your results</span>
          <div class="results-modal-dots" id="resultsDots"><span></span><span></span><span></span></div>
        </div>
        <div class="results-modal-body" id="resultsModalBody"><!-- built by JS --></div>
        <div class="results-modal-foot" id="resultsModalFoot"><!-- built by JS --></div>
      </div>
    </div>

    <!-- Kendra engine: the locked output contract + fill() helper we reuse -->
    <script src="../../scenario-simulator/js/scenario.js?v=16"></script>
    <!-- Reusable context-setter (narrated audio / reading) for the opening scene -->
    <script src="../../scenario-simulator/js/scene-context.js?v=3"></script>
    <!-- Shared simulator framework — one implementation under every mode:
         sim-core     the AI turn engine (proxy, models, JSON repair, retry, pacing)
         sim-context  the Section-1 → Section-2 coupler (ContextRecord)
         sim-debrief  the Section-3 close (stepper, results modal, playbook, resources) -->
    <script src="../../scenario-simulator/js/sim-core.js?v=12"></script>
    <script src="../../scenario-simulator/js/sim-context.js?v=1"></script>
    <script src="../../scenario-simulator/js/sim-debrief.js?v=6"></script>
    <script src="../../scenario-simulator/js/sim-chat-history.js?v=5"></script>
    <script src="../../scenario-simulator/js/sim-coach-sheet.js?v=4"></script>
    <!-- Writer Studio engine + the Guided Arc type: this page RUNS whatever
         guided-arc scenario the Studio published (falls back to the type's
         DEFAULT — the Marshall reference build — when nothing is published). -->
    <script src="../../scenario-simulator/js/studio-engine.js?v=5"></script>
    <script src="../../scenario-simulator/js/scenario-types/guided-arc.js?v=25"></script>

    <script>
    /* =====================================================================
       ACTION PRACTICE — engine + render-by-state (vanilla, no framework)

       MESSAGE SCHEMA (what the model returns, JSON only):
         { turn: [ { speaker:'coach'|'you'|'character',
                     kind:'coaching'|'dialogue'|'narration',
                     text:string, emotionalState?:string } ],
           mode: 'coaching'|'scene',          // mode for the learner's NEXT input
           inputTarget: 'coach'|'character',  // who the input box is addressed to
           complete?: true,                   // only on the final turn
           report?: { strengths:[{title,body}],      // only on the final turn —
                      growthAreas:[{title,body}] } } // feeds the results modal

       We render PURELY by speaker + kind — never by inspecting text:
         kind==='coaching'                  → coaching world (CoachMessage / YourCoachingReply)
         kind==='dialogue' | 'narration'    → scene world  (CharacterLine / YourSceneLine / narration)
       ===================================================================== */

    /* ---- LIVE ---------------------------------------------------------
       This page runs LIVE against real Claude through the shared proxy
       Worker (js/sim-core.js owns the URL, the model registry, JSON repair
       and the retry-once turn cycle). Unlike the Kendra practice pages there
       is no scripted demo fallback for Marshall — the coaching arc is
       model-driven end to end; offline it shows a "coach unreachable" stub. */

    /* ---- SCENARIO DATA (data-driven from Writer Studio) ----------------
       This is the GENERIC Guided Arc live engine. It runs whatever guided-arc
       scenario the Studio published (aithera.scenario.published.guided-arc.v1);
       with nothing published it plays the type's DEFAULT — the Marshall v3
       reference build — so the page is never empty. The Studio's v3 schema
       (reflection + phases[] + optional scene) is adapted here into the shape
       this Kendra-derived shell already consumes: `opening` (seeded coach
       messages) + `locked` (a map of app-owned beats keyed by phase id + "scene",
       which applyDeliver/the deliver-whitelist read generically). The compiled
       SYSTEM_PROMPT comes straight from the type's compile(). */
    const GA_TYPE = window.AitheraStudio && AitheraStudio.get('guided-arc');
    function fromPublishedGuidedArc(raw) {
      const g = GA_TYPE.normalize(raw);
      const fillT = (t) => GA_TYPE.fill(t, g);
      const locked = {};
      (g.phases || []).forEach((p) => {
        if (!p || !p.id) return;
        locked[p.id] = [
          String(p.signpost || '').trim() ? { speaker: 'coach', kind: 'coaching', text: fillT(p.signpost) } : null,
          { speaker: 'coach', kind: 'coaching', text: fillT(p.prompt) },
        ].filter(Boolean);
      });
      if (g.scene && typeof g.scene === 'object') {
        locked.scene = [{ speaker: 'coach', kind: 'coaching', text: fillT(g.scene.pivot) }]
          .concat((g.scene.setup || []).map((b) => {
            const beat = { speaker: b.speaker || 'character', kind: b.kind || 'narration', text: fillT(b.text) };
            if (b.name) beat.name = fillT(b.name);
            return beat;
          }));
      }
      return Object.assign({}, g, {
        opening: [(g.reflection || {}).prompt].filter((t) => String(t || '').trim()).map(fillT),
        locked,
        sceneInputPlaceholder: g.scene ? fillT(g.scene.inputPlaceholder || 'What do you do or say?') : 'What do you do or say?',
        sceneLineCaption: g.scene ? (g.scene.lineCaption || 'You') : 'You',
      });
    }
    const GA_PUBLISHED = GA_TYPE && GA_TYPE.store.loadPublished();
    // COURSE BUILD: pin to the Marshall DEFAULT so a locally-published Writer
    // Studio guided-arc can't hijack this course page (single-sourced content).
    const GA_SOURCE = GA_TYPE ? GA_TYPE.DEFAULT : {};
    const ACTIVE_SCENARIO = fromPublishedGuidedArc(GA_SOURCE);
    // Whether the scene splits the learner's input into DO (narration) + SAY (bubble).
    const SCENE_SAYDO = !!(ACTIVE_SCENARIO.scene && ACTIVE_SCENARIO.scene.sayDoSplit !== false);
    const SCENARIO = {
      learner: ACTIVE_SCENARIO.learnerName,
      character: ACTIVE_SCENARIO.characterName,
      title: ACTIVE_SCENARIO.title,
    };
    document.getElementById('scenarioName').textContent = SCENARIO.title;
    document.getElementById('pageTitle').textContent = 'Practice scenario: ' + SCENARIO.title;

    /* Cold-open VIDEO (the Kendra "with video" player). Marshall sets its
       context with one dramatized clip that has its own audio (video.sound). */
    const HAS_VIDEO_INTRO = ACTIVE_SCENARIO.intro.type === 'video'
      && (ACTIVE_SCENARIO.intro.video.scenes || []).some((s) => s && s.src);
    const INTRO_SCENES = !HAS_VIDEO_INTRO ? [] :
      ACTIVE_SCENARIO.intro.video.scenes
        .filter((s) => s && s.src)
        .map((s) => ({
          // This page lives in clara/, one level deeper than the pages the
          // shared guided-arc DEFAULT was authored for — its page-relative
          // '../assets/…' video paths need one more hop up from here.
          src: AitheraScenario.fill(s.src, ACTIVE_SCENARIO).replace(/^\.\.\/assets\//, '../../assets/'),
          text: AitheraScenario.fill(s.caption || '', ACTIVE_SCENARIO),
        }));
    // Whether the cold-open clip plays with its own sound (vs muted + captions).
    const INTRO_VIDEO_SOUND = !!(ACTIVE_SCENARIO.intro.video && ACTIVE_SCENARIO.intro.video.sound);

    /* AUDIO / READING context modality — the opening "scene" is narrated (or
       read) instead of delivered as coach chat text. When it finishes, the
       coach appears with the reflection prompt (see enterAudioIntro below). */
    const HAS_AUDIO_INTRO = (ACTIVE_SCENARIO.intro.type === 'audio' || ACTIVE_SCENARIO.intro.type === 'reading')
      && !!(ACTIVE_SCENARIO.intro.audio && ACTIVE_SCENARIO.intro.audio.text);
    const AUDIO_INTRO = ACTIVE_SCENARIO.intro.audio || {};
    const AUDIO_INTRO_MODALITY = ACTIVE_SCENARIO.intro.type === 'reading' ? 'reading' : 'audio';

    /* =====================================================================
       THE SYSTEM PROMPT (live) — the conversation arc, guardrails, and
       conversation guiding for the Marshall experience. Authored from the
       Content Design LO + POC deck in js/marshall-scenario.js, it drives the
       same strict JSON turn contract the Kendra engine renders. The
       break-room outcomes, the legal/empathy calibration, and the guaranteed
       nine-component close all live there.
       ===================================================================== */
    let SYSTEM_PROMPT = GA_TYPE ? GA_TYPE.compile(GA_TYPE.normalize(GA_SOURCE)) : '';   // let: the Section-1 coupler may append context addenda

    /* ---- STATE -------------------------------------------------------- */
    /* The coach's opening beat is SEEDED (not model-generated) so every
       learner meets the same SME-authored framing: the situation, then the
       non-evaluated reflection prompt. The learner's first reply kicks off
       Phase 1. */
    const initialMessages = () => ACTIVE_SCENARIO.opening.map((text) => (
      { speaker: 'coach', kind: 'coaching', text }
    ));

    const state = {
      mode: 'coaching',          // 'coaching' | 'scene'
      inputTarget: 'coach',      // 'coach' | 'character'
      hasEnteredScene: false,
      started: false,            // false until the learner taps "Chat with AI Coach" — we anchor on the scene first
      messages: [],              // empty until the learner begins; the opening prep streams in then
      pendingOpening: initialMessages(),  // the coach's opening prep, held until the learner begins
      sending: false,
      complete: false,
      report: null,              // live mode: model-written {strengths, growthAreas} for the results modal
      manualTimeout: false,      // true when the learner pressed "Step out to AI coach"
      transitioning: false,      // true during the "stepping into the scene" beat
      delivering: false,         // true while a turn is being revealed message-by-message
      awaitingEntry: false,      // coach has invited entry; waiting for the learner to step in
      pendingScene: null,        // the opening scene messages, held until the learner steps in
      entryPromptDismissed: false, // learner chose "keep talking" — show the composer, not the CTA
      awaitingDebrief: false,    // Kendra has reacted; a coach debrief is queued for when the learner is ready
      pendingDebrief: null,      // the queued coach debrief messages
      analyzing: false,          // transient: "Analyzing your response…" shows in the input bar
      videoPlaying: false,       // true while the cold-open video sequence owns the stage
      audioIntroPlaying: false,  // true while the narrated/reading context owns the stage (pre-coach)
      closingStepperActive: false, // true while the closing "Analyzing… Determining…" stepper runs
      awaitingResults: false,   // the closing recap has landed; footer offers "View full results"
      resultsModalOpen: false,  // the strengths/growth-areas modal is open
      resultsPage: 0,           // 0 = strengths, 1 = growth areas
      resultsViewed: false,     // learner has been through the modal (unlocks the resources message)
      continued: false,         // learner tapped the final "Continue" — the practice is fully settled
      awaitingReturn: false,    // the coach is ready to send the learner back into the scene; waiting for them to choose
      pendingReturn: null,      // { mode, inputTarget, sceneTarget } to apply once they do
      debriefReturn: null,      // if the debrief the learner is about to open is a coach-led transition BACK into the scene (e.g. "check in with Marshall"), the return context to arm once it's read
      returnLabel: null,        // custom label for the scene-return CTA (e.g. "Check in with Marshall")
      sceneTarget: null,        // who the learner is speaking to in the scene now (e.g. "Marshall") — drives the composer placeholder
      // —— PHASE ENGINE (app-owned; the model no longer counts turns or picks the
      // next hand-off) ——————————————————————————————————————————————————————
      phaseIdx: -1,             // -1 = reflection warm-up; 0..N-1 = working phases[phaseIdx]; >=N = past the phases (scene / close)
      probeUsed: false,         // has the coach spent its ONE Socratic probe in the current phase? (reset on every advance)
    };

    /* ---- helpers: classify + group ------------------------------------ */
    const worldOf = (m) => (m.kind === 'coaching' ? 'coaching' : 'scene');

    // trailing contiguous run of a given world at the end of the array
    function trailingRun(msgs, world) {
      const out = [];
      for (let i = msgs.length - 1; i >= 0 && worldOf(msgs[i]) === world; i--) out.unshift(msgs[i]);
      return out;
    }

    /* =====================================================================
       NO DEMO ENGINE — Marshall runs LIVE only (see WORKER_URL above). The
       five-phase coaching arc is model-driven end to end, so there is no
       scripted fallback to maintain. This stub exists solely so getTurn's
       demo branch stays defined; if the Worker is ever unset, it surfaces a
       plain notice rather than pretending to run the arc offline.
       ===================================================================== */
    function scriptedTurn() {
      return {
        turn: [{ speaker: 'coach', kind: 'coaching', text:
          'This scenario runs on a live AI coach, which isn’t reachable right now. Please try again in a moment.' }],
        mode: 'coaching', inputTarget: 'coach',
      };
    }

    /* ---- LIVE path — the shared turn engine (js/sim-core.js) ---------- */
    /* This page speaks the GUIDED-ARC contract: the roleplay turn shape PLUS
       "deliver" (a whitelisted LOCKED beat id the model may cue — see
       applyDeliver), per-message character names (a second in-scene voice
       like "Marshall"), and scene-transition hints (returnLabel /
       sceneTarget / sceneSetup). JSON repair, strict parse → retry-once →
       safe fallback, and the JSON-history serializer are the ONE shared
       implementation every simulator page uses. */
    const TURN_PARSER = SimCore.makeTurnParser({
      name: true,
      sceneHints: true,
      deliver: (id) => Boolean((ACTIVE_SCENARIO.locked || {})[id]),
      action: true,                  // "probe" | "teach" intent — the app owns advancement
    });

    /* The per-turn [SYSTEM STATE] line (Prompt Architecture #2): the app is the
       source of truth for WHICH phase is live and whether the coach has already
       spent its one probe — the model can't reliably count turns over a rolling
       window. We append this to the (otherwise static, cache-friendly) system
       prompt every call so the model reads its state instead of inferring it. */
