<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Marshall Scenario — Choose how you practice</title>

    <!-- Vector Web Components: Core -->
    <script type="module"
        src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.19.0/core.iife.js"></script>
    <!-- Vector Web Components: Themes -->
    <script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.5.0/styles.js"></script>
    <!-- Open Sans -->
    <link rel="stylesheet"
        href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css" />
    <!-- Font Awesome 6 -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
    <!-- Course-delivery frame (production Vector Training chrome) -->
    <link rel="stylesheet" href="css/frame.css?v=4" />

    <style>
      /* ===================================================================
         MARSHALL — MODE SELECT + NO-AI GUIDED LADDER

         Two decisions live on this page:
           1) A pre-scenario MODE-SELECT card — the actual UX artifact under
              review. It offers two EQUAL-STATUS ways to do the same practice:
                · Conversation practice (AI)  — default, hands off to the live
                  guided-arc-live.html experience.
                · Guided scenario (no AI)     — a branching consequence ladder
                  rendered on this page. No model calls; genuinely AI-free.
           2) The no-AI ladder itself, deliberately built as an EQUAL — same
              beats, non-obvious choices, consequence teaching, competency
              gates (you cannot click straight through), and the IDENTICAL
              closing toolkit. Not a "lite" multiple-choice speed-run.

         Palette borrowed from the coaching world of guided-arc-live.html so
         this reads as part of the same Marshall experience. Vanilla JS,
         render-by-append, no build, no storage.
         =================================================================== */
      :root {
        color-scheme: light dark;
        --c-bg:          #f5f7fb;
        --c-surface:     #ffffff;
        --c-surface-2:   #eef1f7;
        --c-ink:         #1a2030;
        --c-ink-soft:    #5a6379;
        --c-ink-faint:   #67718a;
        --c-line:        #e3e7f0;
        --c-accent:      #4b63e6;
        --c-accent-strong:#3a4fce;
        --c-accent-soft: #eef1fe;
        --c-on-accent:   #ffffff;
        --c-ok:          #1f8a5b;
        --c-ok-soft:     #e6f6ee;

        /* Scene world — a lit set in a dark room, constant across themes. */
        --s-ink:         #f3ede5;
        --s-ink-soft:    #c3b6a8;
        --s-surface:     #211a16;
        --s-surface-2:   #2c241e;
        --s-line:        #43372e;
        --s-char:        #c79bff;   /* Jake / the room — violet */
        --s-you:         #f1b34a;   /* your voice — amber */
        --s-you-ink:     #2a1d08;
        --scene-paint:
          radial-gradient(120% 80% at 80% 0%, rgba(241,179,74,.10), transparent 60%),
          radial-gradient(120% 90% at 10% 100%, rgba(199,155,255,.10), transparent 55%),
          linear-gradient(170deg, #1a1410 0%, #120d0a 100%);

        --radius:   16px;
        --radius-sm:10px;
        --shadow-sm: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.10);
        --shadow-md: 0 6px 18px rgba(16,24,40,.12), 0 2px 6px rgba(16,24,40,.07);
        --ease: cubic-bezier(.4, 0, .2, 1);
        --measure: 62ch;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg:#0c0f17; --c-surface:#161b27; --c-surface-2:#1e2434;
          --c-ink:#eef1f8; --c-ink-soft:#aab2c5; --c-ink-faint:#9aa3b8;
          --c-line:#2a3142; --c-accent:#7b8dff; --c-accent-strong:#98a6ff;
          --c-accent-soft:#1c2233; --c-on-accent:#0c0f17;
          --c-ok:#4cd08a; --c-ok-soft:#12271d;
          --shadow-md: 0 6px 18px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.3);
        }
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: "Open Sans", system-ui, sans-serif;
        background: var(--c-bg);
        color: var(--c-ink);
        -webkit-font-smoothing: antialiased;
      }
      .app { display: flex; flex-direction: column; height: 100dvh; }
      .stage {
        flex: 1 1 auto;
        min-height: 0;          /* lets the flex child scroll internally instead of growing the page */
        overflow-y: auto;
        display: flex;
        justify-content: center;
        padding: clamp(20px, 4vw, 48px) 20px 96px;
      }
      .col { width: 100%; max-width: 720px; }

      /* ============================ MODE SELECT ========================= */
      .mode-select { animation: rise .4s var(--ease) both; }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
      .ms-eyebrow {
        font-size: .72rem; font-weight: 700; letter-spacing: .09em;
        text-transform: uppercase; color: var(--c-accent); margin: 0 0 8px;
      }
      .ms-title { font-size: clamp(1.5rem, 3.4vw, 2rem); line-height: 1.15; margin: 0 0 12px; letter-spacing: -.01em; }
      .ms-sub {
        font-size: 1.02rem; line-height: 1.55; color: var(--c-ink-soft);
        margin: 0 0 28px; max-width: var(--measure);
      }
      .ms-options { display: grid; gap: 14px; }
      @media (min-width: 720px) { .ms-options { grid-template-columns: 1fr 1fr; } }

      /* Each option is a full radio label. NEITHER carries a "recommended"
         badge — the AI option is only the DEFAULT selection, never framed as
         the better one. Both show identical time + credit so they read as
         genuine equals. */
      .ms-opt {
        position: relative; display: flex; flex-direction: column; cursor: pointer;
        background: var(--c-surface);
        border: 1.5px solid var(--c-line);
        border-radius: var(--radius);
        padding: 20px 20px 18px;
        box-shadow: var(--shadow-sm);
        transition: border-color .18s var(--ease), box-shadow .18s var(--ease), transform .18s var(--ease);
      }
      .ms-opt:hover { border-color: var(--c-accent); transform: translateY(-1px); box-shadow: var(--shadow-md); }
      .ms-opt:focus-within { outline: 2px solid var(--c-accent); outline-offset: 2px; }
      .ms-opt input { position: absolute; opacity: 0; pointer-events: none; }
      .ms-opt:has(input:checked) { border-color: var(--c-accent); box-shadow: 0 0 0 3px var(--c-accent-soft), var(--shadow-md); }
      .ms-opt-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
      .ms-opt-icon {
        width: 38px; height: 38px; flex: none; border-radius: 10px;
        display: grid; place-items: center; font-size: 1.05rem;
        background: var(--c-accent-soft); color: var(--c-accent);
      }
      .ms-opt-name { font-weight: 700; font-size: 1.08rem; flex: 1; }
      .ms-radio {
        width: 20px; height: 20px; flex: none; border-radius: 50%;
        border: 2px solid var(--c-line); display: grid; place-items: center;
        transition: border-color .18s var(--ease);
      }
      .ms-opt:has(input:checked) .ms-radio { border-color: var(--c-accent); }
      .ms-radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c-accent); transform: scale(0); transition: transform .18s var(--ease); }
      .ms-opt:has(input:checked) .ms-radio::after { transform: scale(1); }
      .ms-opt-desc { font-size: .95rem; line-height: 1.5; color: var(--c-ink-soft); margin: 0 0 14px; }
      .ms-tag {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: .74rem; font-weight: 600; letter-spacing: .01em;
        padding: 3px 9px; border-radius: 999px; margin-bottom: 12px;
        background: var(--c-surface-2); color: var(--c-ink-faint);
      }
      .ms-tag i { font-size: .82em; }
      .ms-meta {
        list-style: none; margin: auto 0 0; padding: 12px 0 0; border-top: 1px solid var(--c-line);
        display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .82rem; color: var(--c-ink-faint);
      }
      .ms-meta li { display: flex; align-items: center; gap: 6px; }
      .ms-meta i { color: var(--c-accent); font-size: .82em; }

      .ms-note {
        display: flex; align-items: flex-start; gap: 9px;
        font-size: .86rem; line-height: 1.5; color: var(--c-ink-faint);
        margin: 22px 0 26px; padding: 12px 14px;
        background: var(--c-surface-2); border-radius: var(--radius-sm);
        max-width: var(--measure);
      }
      .ms-note i { color: var(--c-ink-soft); margin-top: 2px; }

      .btn-primary {
        display: inline-flex; align-items: center; gap: 10px;
        font: inherit; font-weight: 700; font-size: 1rem;
        padding: 13px 24px; border: none; border-radius: 999px; cursor: pointer;
        background: var(--c-accent); color: var(--c-on-accent);
        box-shadow: var(--shadow-md); transition: background .16s var(--ease), transform .16s var(--ease);
      }
      .btn-primary:hover { background: var(--c-accent-strong); transform: translateY(-1px); }
      .btn-primary:active { transform: translateY(0); }
      .btn-primary:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 3px; }

      /* ============================ LADDER ============================= */
      .ladder { display: flex; flex-direction: column; gap: 14px; }
      .ladder-head { margin-bottom: 6px; }
      .ladder-eyebrow {
        font-size: .72rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
        color: var(--c-ink-faint); margin: 0 0 4px;
        display: flex; align-items: center; gap: 8px;
      }
      .ladder-eyebrow .switch {
        margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 600;
        font-size: .8rem; color: var(--c-accent); background: none; border: none;
        cursor: pointer; padding: 0; display: inline-flex; align-items: center; gap: 5px;
      }
      .ladder-eyebrow .switch:hover { text-decoration: underline; }

      .msg { display: flex; gap: 10px; align-items: flex-start; animation: rise .34s var(--ease) both; }
      .avatar {
        width: 32px; height: 32px; flex: none; border-radius: 50%;
        display: grid; place-items: center; font-size: .85rem;
        background: var(--c-accent-soft); color: var(--c-accent);
      }
      .bubble {
        max-width: var(--measure);
        background: var(--c-surface); border: 1px solid var(--c-line);
        border-radius: 4px 14px 14px 14px; padding: 12px 15px;
        font-size: .98rem; line-height: 1.55; box-shadow: var(--shadow-sm);
      }
      .msg.you { flex-direction: row-reverse; }
      .msg.you .bubble {
        background: var(--c-accent); color: var(--c-on-accent);
        border-color: transparent; border-radius: 14px 4px 14px 14px;
      }
      .msg.you .avatar { background: var(--c-ink); color: #fff; }

      .decide { animation: rise .34s var(--ease) both; margin: 4px 0 2px; }
      .decide-prompt { font-weight: 600; font-size: 1rem; line-height: 1.5; margin: 0 0 12px; max-width: var(--measure); }
      .options { display: flex; flex-direction: column; gap: 10px; }
      .opt {
        text-align: left; font: inherit; font-size: .96rem; line-height: 1.5;
        background: var(--c-surface); color: var(--c-ink);
        border: 1.5px solid var(--c-line); border-radius: var(--radius-sm);
        padding: 13px 16px; cursor: pointer; box-shadow: var(--shadow-sm);
        transition: border-color .15s var(--ease), transform .15s var(--ease), box-shadow .15s var(--ease);
        display: flex; gap: 11px; align-items: flex-start;
      }
      .opt:hover { border-color: var(--c-accent); transform: translateY(-1px); box-shadow: var(--shadow-md); }
      .opt:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }
      .opt .dot { width: 8px; height: 8px; margin-top: 7px; flex: none; border-radius: 50%; background: var(--c-line); transition: background .15s; }
      .opt:hover .dot { background: var(--c-accent); }
      .opt[disabled] { opacity: .5; cursor: default; transform: none; box-shadow: var(--shadow-sm); border-color: var(--c-line); }

      .continue-row { margin: 6px 0 2px; }
      .btn-continue {
        font: inherit; font-weight: 600; font-size: .95rem;
        display: inline-flex; align-items: center; gap: 8px;
        background: var(--c-accent-soft); color: var(--c-accent);
        border: 1.5px solid transparent; border-radius: 999px; padding: 9px 18px; cursor: pointer;
        transition: background .15s var(--ease), transform .15s var(--ease);
      }
      .btn-continue:hover { background: var(--c-accent); color: var(--c-on-accent); transform: translateY(-1px); }
      .btn-continue:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }

      /* Gate note — the "you must show you got it" follow-up. */
      .gate {
        border-left: 3px solid var(--c-accent); padding-left: 14px; margin-top: 4px;
        animation: rise .3s var(--ease) both;
      }
      .gate-flag {
        font-size: .74rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
        color: var(--c-accent); margin: 0 0 8px; display: flex; align-items: center; gap: 6px;
      }

      /* ============================ SCENE PANEL ======================== */
      .scene-stage {
        background: var(--scene-paint); background-color: #14100c;
        border: 1px solid var(--s-line); border-radius: var(--radius);
        padding: 20px; margin: 6px 0; color: var(--s-ink);
        display: flex; flex-direction: column; gap: 12px;
        animation: rise .4s var(--ease) both;
      }
      .scene-flag {
        font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
        color: var(--s-ink-soft); display: flex; align-items: center; gap: 8px; margin-bottom: 2px;
      }
      .scene-narr { font-size: .96rem; line-height: 1.55; color: var(--s-ink-soft); font-style: italic; max-width: var(--measure); }
      .scene-line { display: flex; gap: 10px; align-items: flex-start; }
      .scene-line .who { font-weight: 700; font-size: .8rem; color: var(--s-char); flex: none; width: 42px; padding-top: 2px; }
      .scene-line .said {
        background: var(--s-char-soft, rgba(199,155,255,.16)); color: var(--s-ink);
        border-radius: 4px 12px 12px 12px; padding: 10px 14px; font-size: .98rem; line-height: 1.5; max-width: var(--measure);
      }
      .scene-you { display: flex; flex-direction: row-reverse; gap: 10px; }
      .scene-you .said {
        background: var(--s-you); color: var(--s-you-ink); border-radius: 12px 4px 12px 12px;
        padding: 10px 14px; font-size: .98rem; line-height: 1.5; font-weight: 600; max-width: var(--measure);
      }
      .scene-stage .decide-prompt { color: var(--s-ink); }
      .scene-stage .opt {
        background: var(--s-surface-2); color: var(--s-ink); border-color: var(--s-line);
        box-shadow: none;
      }
      .scene-stage .opt:hover { border-color: var(--s-you); }
      .scene-stage .opt .dot { background: var(--s-line); }
      .scene-stage .opt:hover .dot { background: var(--s-you); }

      /* ============================ CLOSE ============================= */
      .close-block { animation: rise .4s var(--ease) both; margin-top: 8px; }
      .close-banner {
        display: flex; align-items: center; gap: 12px; margin-bottom: 18px;
        padding: 14px 16px; border-radius: var(--radius-sm);
        background: var(--c-ok-soft); color: var(--c-ok);
        font-weight: 700; font-size: 1rem;
      }
      .close-banner i { font-size: 1.3rem; }
      .close-lead { font-size: 1.05rem; line-height: 1.5; margin: 0 0 6px; }
      .close-sub { font-size: .92rem; color: var(--c-ink-soft); margin: 0 0 20px; max-width: var(--measure); }
      .toolkit { display: grid; gap: 12px; }
      @media (min-width: 640px) { .toolkit { grid-template-columns: 1fr 1fr; } }
      .tk {
        background: var(--c-surface); border: 1px solid var(--c-line);
        border-radius: var(--radius-sm); padding: 14px 16px; box-shadow: var(--shadow-sm);
      }
      .tk.framework { border-color: var(--c-accent); background: var(--c-accent-soft); }
      .tk-title { font-weight: 700; font-size: .96rem; margin: 0 0 5px; display: flex; align-items: center; gap: 8px; }
      .tk.framework .tk-title { color: var(--c-accent-strong); }
      .tk-num {
        width: 22px; height: 22px; flex: none; border-radius: 6px; display: grid; place-items: center;
        font-size: .72rem; font-weight: 700; background: var(--c-surface-2); color: var(--c-ink-faint);
      }
      .tk.framework .tk-num { background: var(--c-accent); color: var(--c-on-accent); }
      .tk-body { font-size: .88rem; line-height: 1.5; color: var(--c-ink-soft); margin: 0; }
      .tk-section-label {
        grid-column: 1 / -1; font-size: .76rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
        color: var(--c-ink-faint); margin: 12px 0 -2px;
      }
      .resources { margin-top: 24px; }
      .resources h3 { font-size: 1.05rem; margin: 0 0 4px; }
      .resources .lead { font-size: .92rem; color: var(--c-ink-soft); margin: 0 0 14px; }
      .res { padding: 12px 0; border-top: 1px solid var(--c-line); }
      .res-title { font-weight: 700; font-size: .94rem; margin: 0 0 4px; }
      .res-body { font-size: .88rem; line-height: 1.5; color: var(--c-ink-soft); margin: 0; }
      .restart-row { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--c-line); }
      .btn-ghost {
        font: inherit; font-weight: 600; font-size: .92rem;
        display: inline-flex; align-items: center; gap: 8px;
        background: none; color: var(--c-ink-soft); border: 1.5px solid var(--c-line);
        border-radius: 999px; padding: 9px 18px; cursor: pointer; transition: border-color .15s, color .15s;
      }
      .btn-ghost:hover { border-color: var(--c-accent); color: var(--c-accent); }

      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    </style>
</head>
<body>
    <div class="app" id="app">
      <main class="stage" id="stage">
        <div class="col" id="col"><!-- mode-select card, then ladder, render here --></div>
      </main>
    </div>

    <script>
    /* ==================================================================
       CONTENT — the no-AI ladder, authored from the Marshall v3 scenario
       (js/scenario-types/guided-arc.js DEFAULT). Every option maps to one
       of the scenario's calibration tiers; weak/mid answers on the graded
       beats route through a GATE the learner must clear before advancing.
       ================================================================== */
    const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

    // A NODE is one of: {say:[...]}, {decide:{...}}, {sceneStart:{...}},
    // {sceneStep:{...}}, {close:true}. Decisions may nest a `gate`.
    const LADDER = [
      { say: [
        "Whichever way you practice, you’ll work through the same four moments — your gut read, the law, the human cost, and a live moment in the break room — and finish with the very same toolkit.",
        "There’s no AI here: you choose how to respond, and I’ll talk every choice through. No gotcha answers — only the reasoning underneath them."
      ]},

      /* ---- Reflection — calibration only, no right answer, no gate ---- */
      { decide: {
        prompt: "Before the specifics — what’s closest to your honest first reaction to what you’ve been watching happen to Marshall?",
        options: [
          { text: "Honestly, it reads like guys ribbing each other. Marshall probably expects some of it by now.",
            reply: ["That’s a really common first read — and I’m not going to argue you out of your instinct. I’m going to test it against what the law actually says. Hold onto it."] },
          { text: "Something’s off about it — I just can’t tell if it’s a ‘harassment’ thing or only an uncomfortable one.",
            reply: ["That sense that something’s off is worth trusting. Let’s give it some sharper edges over the next few minutes."] },
          { text: "It’s targeting him for not fitting someone’s idea of ‘a guy.’ That isn’t banter.",
            reply: ["You’ve already named the thing most people take a while to see. Let’s make it airtight."] },
        ]
      }},

      /* ---- Phase 1 · The Law — graded, with a gate ---- */
      { say: ["Now let’s take a closer look at what’s actually happening here."] },
      { decide: {
        prompt: "Does what Marshall’s living with meet the bar for sexual harassment? Here’s how three co-workers might reason it — which is closest to yours?",
        options: [
          { text: "Not in the legal sense — nobody’s demanding sex or threatening his job. It’s crude, but it isn’t that.",
            reply: ["Let me correct this one carefully, because it’s the most common misread. Harassment doesn’t need anyone to demand sex. There are two kinds: quid pro quo — a this-for-that — and a hostile work environment: gender-based conduct pervasive enough to make work intimidating. The ‘Marsha’ jabs and the public images are squarely the second kind."],
            gate: {
              prompt: "So, taking that in — does this clear the legal bar?",
              options: [
                { text: "Yes — as a hostile work environment.", correct: true, reply: ["Exactly. No demand, no job threat required."] },
                { text: "Only if Marshall tells them to stop first.", correct: false, reply: ["Not quite — a target never has to object first for conduct to qualify. Have another look."] },
                { text: "No — it still needs a direct demand to count.", correct: false, reply: ["That’s the quid-pro-quo test, and it’s real — but it isn’t the only one. The hostile-environment standard needs no demand at all. Try again."] },
              ]
            }},
          { text: "It’s wrong, and it’s aimed at him for being a man who doesn’t fit the mold — but ‘harassment’ feels strong when no one’s asking him for anything.",
            reply: ["You’ve got the hard part already: it’s targeted at his gender. Here’s the piece to add — you don’t need anyone asking for anything. Pervasive, gender-based conduct that makes work intimidating is a hostile work environment on its own."],
            gate: {
              prompt: "So where does that leave you — does it qualify?",
              options: [
                { text: "Yes — it’s a hostile work environment.", correct: true, reply: ["That’s it."] },
                { text: "Only if it keeps up after he objects.", correct: false, reply: ["He doesn’t have to object first — and ‘pervasive’ is already met here, eight months running. Look again."] },
              ]
            }},
          { text: "It’s gender-stereotype harassment — going after him for not matching an image of ‘a man.’ It needn’t be sexual, same-sex is covered, and the public images make it a hostile work environment that needs reporting.",
            reply: ["That’s the whole picture — and you caught the part people miss: Title VII covers this regardless of anyone’s gender. One thing to underline: those public images are a major escalation, which makes prompt, documented reporting urgent."] },
        ]
      }},
      { say: ["To lock it in: gender-stereotype conduct is covered, no advance or job threat required, same-sex included — and Marshall should report it to HR, documented, soon."] },

      /* ---- Phase 2 · The Person — the brush-off gets challenged ---- */
      { say: ["Now let’s set the law aside and make this human."] },
      { decide: {
        prompt: "Forget the statute for a second. What do you think this is doing to Marshall — and to everyone else who works there?",
        options: [
          { text: "He seems to shrug it off. He’s probably learned to just let it roll.",
            reply: ["Let me push on that gently — after those images went public, are you sure it just rolls off? ‘Staying professional’ through this every day has a cost."],
            gate: {
              prompt: "What’s the more honest read?",
              options: [
                { text: "It’s wearing on him — he just doesn’t show it at work.", correct: true, reply: ["Yes. The composure is the performance, not the absence of harm. And he’s eight months in — the exact window where you’re trying to build credibility."] },
                { text: "He’s fine as long as nobody makes it a big deal.", correct: false, reply: ["That quietly puts the burden back on him to absorb it — which is exactly the trap. Try the other read."] },
              ]
            }},
          { text: "It’s grinding him down — dread walking in, pulling back from people, and after the images, a humiliation he can’t un-see.",
            reply: ["That’s the real cost. Add two things: he’s eight months in — the window where you build credibility — and every unchallenged jab quietly resets what the whole team treats as normal."] },
        ]
      }},
      { say: ["Which is exactly where someone like you — a witness — matters most. Let’s put that into practice."] },

      /* ---- The scene · break room (immersive, two decisions) ---- */
      { sceneStart: {
        flag: "In the scene · the break room",
        lines: [
          { narr: "The break room. Marshall’s at the coffee machine. Jake walks in, pours himself a cup, and — loud enough for the whole room:" },
          { who: "Jake", said: "Hey, did you make this? Guess that’s what you’re here for — living your best Marsha life." },
          { narr: "He grins and glances around as you walk in. What do you do — specifically?" },
        ]
      }},
      { sceneStep: {
        prompt: "You’re standing there, coffee in reach, the room half-watching.",
        options: [
          { text: "Keep my head down, grab my coffee. It’s not really my place.",
            you: "…(you grab your coffee and say nothing)",
            reply: ["The moment passes without a signal. Jake keeps going; the room half-laughs. Marshall goes quiet — and clocks that no one said anything."] },
          { text: "Catch Jake’s eye and change the subject — “anyway, coffee’s fresh.”",
            you: "“Anyway — coffee’s fresh, right?”",
            reply: ["The redirect half-lands. Jake breezes past it and loops back to the joke — your signal’s there, but muddy."] },
          { text: "Say it plainly, to his face: “Not cool, Jake.”",
            you: "“Not cool, Jake.”",
            reply: ["Direct and clear — the signal lands. Jake’s grin tightens."] },
          { text: "Cut it off sideways: “Hey Jake — what’s the update on Henderson?”",
            you: "“Hey Jake — what’s the update on Henderson?”",
            reply: ["Nicely done — an indirect redirect works just as well as a direct call-out. The room’s attention moves; Jake’s grin tightens. (Direct confrontation is one tool, not the only one.)"] },
        ]
      }},
      { sceneLines: [
        { who: "Jake", said: "Whoa, relax — it was a joke. Right, Marshall? Tell ’em you’re not offended." },
        { narr: "The room’s still watching. Marshall’s looking at the floor. This is the part that decides it." },
      ]},
      { sceneStep: {
        prompt: "Jake just tried to make Marshall vouch for the joke. What now?",
        options: [
          { text: "Let it drop — you’ve made your point.",
            you: "…(you let it go)",
            reply: ["Jake’s ‘it was a joke’ becomes the last word, and the room lets it settle there. Marshall stays quiet."] },
          { text: "Say nothing now, but catch Marshall afterward to say you’re sorry that happened.",
            you: "…(you stay quiet, planning to check in later)",
            reply: ["That private check-in genuinely matters — but on its own, with no public signal, the room still reads Jake’s version as the normal one."] },
          { text: "Hold the line: “I’m not putting this on Marshall. It wasn’t a joke, and it needs to stop.”",
            you: "“I’m not putting this on Marshall. It wasn’t a joke, and it needs to stop.”",
            reply: ["You refuse to let Jake make Marshall the referee, and you keep the line public. That’s the move: the room just saw this isn’t acceptable, and Marshall saw that someone stepped in."] },
        ]
      }},
      { sceneEnd: true },

      /* ---- Scene debrief (back in coaching) ---- */
      { say: [
        "Moments like that are worth unpacking. Here’s the through-line: silence is never neutral — to Jake it reads as permission, and to Marshall as no one seeing it. A single witness stepping in resets what the team treats as normal.",
        "Three moves to carry out of here — Pick an action in the moment · Offer support (check in with Marshall privately after) · Consider escalating (a witness can report to HR, documented — check your org’s policy)."
      ]},

      { close: true },
    ];

    /* The GUARANTEED CLOSE — identical to what the AI path lands on, verbatim
       from the scenario's playbook + resources. This is what makes the two
       paths equal: same nine components, same framework, same resources. */
    const PLAYBOOK = [
      { title: "Know what actually qualifies", body: "Gender-stereotype-based conduct is sex-based harassment under Title VII — even without explicit sexual advances or a quid pro quo exchange." },
      { title: "Apply the hostile-work-environment standard", body: "Pervasive, gender-based conduct that makes the workplace intimidating qualifies — and it affects everyone in that environment, not only the primary target." },
      { title: "Same-sex harassment is fully covered", body: "Title VII protections apply regardless of the gender relationship between the harasser and the target." },
      { title: "Intent doesn’t determine harassment", body: "The test is impact and context — not whether the harasser meant it as a joke." },
      { title: "The cumulative weight is real", body: "Sustained harassment causes documented psychological and career harm and reshapes the whole team’s sense of what’s normal. “Just jokes” is never an accurate frame." },
      { title: "Marshall should report — immediately", body: "To HR, documented, with specific incidents, dates, and witnesses. The public images make it urgent." },
    ];
    const FRAMEWORK = [
      { title: "Pick an action in the moment", body: "A direct signal (“that’s not cool”) or an indirect redirect (“what’s the update on Henderson?”) changes the dynamic. Direct confrontation is one option — not the only one." },
      { title: "Offer support", body: "Check in with the targeted person privately after the moment passes — it tells them they aren’t invisible." },
      { title: "Consider escalating", body: "Review your organization’s harassment policy — bystanders can report independently of what Marshall decides to do." },
    ];
    const RESOURCES = {
      lead: "Whenever you witness or experience conduct like this, here’s where to turn.",
      items: [
        { title: "Your HR team", body: "Report incidents with specific dates, what was said, and who was present. You can raise a concern as a witness — you don’t have to wait for the person targeted to act first." },
        { title: "Your organization’s harassment policy", body: "It may define specific obligations for employees who witness harassment. Read it so you know your role before a moment like this happens." },
        { title: "The EEOC", body: "The U.S. Equal Employment Opportunity Commission enforces Title VII and explains your rights and how to file a charge at eeoc.gov." },
      ],
    };

    /* ==================================================================
       RENDER
       ================================================================== */
    const col = document.getElementById('col');
    const stage = document.getElementById('stage');
    const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };
    const scrollEnd = () => requestAnimationFrame(() => stage.scrollTo({ top: stage.scrollHeight, behavior: 'smooth' }));

    /* ---------- The mode-select card (the UX artifact under review) ---------- */
    function renderModeSelect() {
      col.innerHTML = '';
      const s = el('section', 'mode-select');
      s.innerHTML = `
        <p class="ms-eyebrow">Before you begin</p>
        <h1 class="ms-title">Choose how you’d like to practice</h1>
        <p class="ms-sub">Both options cover the same situation and the same takeaways, and both count the same toward completion. Pick whichever fits you.</p>

        <div class="ms-options" role="radiogroup" aria-label="How would you like to practice?">
          <label class="ms-opt">
            <input type="radio" name="mode" value="ai" checked>
            <div class="ms-opt-top">
              <span class="ms-opt-icon"><i class="fa-solid fa-comments"></i></span>
              <span class="ms-opt-name">Conversation practice</span>
              <span class="ms-radio" aria-hidden="true"></span>
            </div>
            <span class="ms-tag"><i class="fa-solid fa-microchip"></i> Powered by AI</span>
            <p class="ms-opt-desc">Respond in your own words. A coach preps you before each moment, and an in-character colleague reacts to what you actually say.</p>
            <ul class="ms-meta">
              <li><i class="fa-regular fa-clock"></i> About 12 minutes</li>
              <li><i class="fa-solid fa-circle-check"></i> Counts toward completion</li>
            </ul>
          </label>

          <label class="ms-opt">
            <input type="radio" name="mode" value="guided">
            <div class="ms-opt-top">
              <span class="ms-opt-icon"><i class="fa-solid fa-hand-pointer"></i></span>
              <span class="ms-opt-name">Guided scenario</span>
              <span class="ms-radio" aria-hidden="true"></span>
            </div>
            <p class="ms-opt-desc">Work through the same situation by choosing how to respond. Every choice plays out its consequence, and the coach talks each one through.</p>
            <ul class="ms-meta">
              <li><i class="fa-regular fa-clock"></i> About 12 minutes</li>
              <li><i class="fa-solid fa-circle-check"></i> Counts toward completion</li>
            </ul>
          </label>
        </div>

        <p class="ms-note">
          <i class="fa-solid fa-lock"></i>
          <span>Your choice is private — it isn’t recorded against you or shared with your manager, and both paths earn the same credit. You can switch at any time.</span>
        </p>

        <button class="btn-primary" id="beginBtn">Continue <i class="fa-solid fa-arrow-right"></i></button>
      `;
      col.appendChild(s);
      s.querySelector('#beginBtn').addEventListener('click', () => {
        const mode = s.querySelector('input[name="mode"]:checked').value;
        if (mode === 'ai') {
          // Hand off to the existing LIVE Marshall (guided arc). Untouched.
          window.location.href = 'guided-arc-live.html';
        } else {
          startLadder();
        }
      });
      stage.scrollTo({ top: 0 });
    }

    /* ---------- The no-AI ladder engine ---------- */
    let ladderEl = null;   // the transcript container
    let sceneEl  = null;   // active scene panel (null when in coaching world)

    const target = () => sceneEl || ladderEl;

    function coachBubble(text) {
      const m = el('div', 'msg coach');
      m.appendChild(el('div', 'avatar', '<i class="fa-solid fa-chalkboard-user"></i>'));
      m.appendChild(el('div', 'bubble', esc(text)));
      ladderEl.appendChild(m);
    }
    function youBubble(text) {
      const m = el('div', 'msg you');
      m.appendChild(el('div', 'avatar', '<i class="fa-solid fa-user"></i>'));
      m.appendChild(el('div', 'bubble', esc(text)));
      ladderEl.appendChild(m);
    }

    function sceneNarr(text) { sceneEl.appendChild(el('div', 'scene-narr', esc(text))); }
    function sceneSaid(who, text) {
      const row = el('div', 'scene-line');
      row.appendChild(el('div', 'who', esc(who)));
      row.appendChild(el('div', 'said', esc(text)));
      sceneEl.appendChild(row);
    }
    function sceneYou(text) {
      const row = el('div', 'scene-you');
      row.appendChild(el('div', 'said', esc(text)));
      sceneEl.appendChild(row);
    }

    function startLadder() {
      col.innerHTML = '';
      sceneEl = null;
      const head = el('div', 'ladder-head');
      head.innerHTML = `<p class="ladder-eyebrow"><i class="fa-solid fa-hand-pointer"></i> Guided scenario · no AI
        <button class="switch" id="switchBtn"><i class="fa-solid fa-arrow-left"></i> Switch mode</button></p>`;
      col.appendChild(head);
      ladderEl = el('div', 'ladder');
      col.appendChild(ladderEl);
      head.querySelector('#switchBtn').addEventListener('click', renderModeSelect);
      runNode(0);
    }

    function runNode(i) {
      if (i >= LADDER.length) return;
      const node = LADDER[i];
      const next = () => runNode(i + 1);

      if (node.say) {
        node.say.forEach(coachBubble);
        addContinue(next);
      } else if (node.decide) {
        renderDecide(node.decide, next);
      } else if (node.sceneStart) {
        sceneEl = el('div', 'scene-stage');
        sceneEl.appendChild(el('div', 'scene-flag', `<i class="fa-solid fa-mug-hot"></i> ${esc(node.sceneStart.flag)}`));
        ladderEl.appendChild(sceneEl);
        node.sceneStart.lines.forEach(l => l.narr ? sceneNarr(l.narr) : sceneSaid(l.who, l.said));
        next();
      } else if (node.sceneLines) {
        node.sceneLines.forEach(l => l.narr ? sceneNarr(l.narr) : sceneSaid(l.who, l.said));
        next();
      } else if (node.sceneStep) {
        renderSceneStep(node.sceneStep, next);
      } else if (node.sceneEnd) {
        sceneEl = null;   // back to the coaching world
        next();
      } else if (node.close) {
        renderClose();
      }
      scrollEnd();
    }

    // A continue affordance so the learner paces their own reading.
    function addContinue(cb) {
      const row = el('div', 'continue-row');
      const btn = el('button', 'btn-continue', 'Continue <i class="fa-solid fa-arrow-down"></i>');
      row.appendChild(btn);
      (sceneEl || ladderEl).appendChild(row);
      btn.addEventListener('click', () => { row.remove(); cb(); });
      btn.focus();
    }

    // A coaching-world decision. Weak options may nest a gate.
    function renderDecide(d, done) {
      const wrap = el('div', 'decide');
      wrap.appendChild(el('p', 'decide-prompt', esc(d.prompt)));
      const opts = el('div', 'options');
      d.options.forEach(o => {
        const b = el('button', 'opt', `<span class="dot"></span><span>${esc(o.text)}</span>`);
        b.addEventListener('click', () => {
          // lock the choice set
          opts.querySelectorAll('.opt').forEach(x => x.disabled = true);
          youBubble(o.you || o.text);
          (o.reply || []).forEach(coachBubble);
          if (o.gate) {
            renderGate(o.gate, done);
          } else {
            addContinue(done);
          }
          scrollEnd();
        });
        opts.appendChild(b);
      });
      wrap.appendChild(opts);
      ladderEl.appendChild(wrap);
    }

    // The competency gate: you must pick the correct follow-up to advance.
    // Wrong picks are coached and re-offered — no clicking straight through.
    function renderGate(gate, done) {
      const wrap = el('div', 'gate');
      wrap.appendChild(el('p', 'gate-flag', '<i class="fa-solid fa-turn-down"></i> One more'));
      wrap.appendChild(el('p', 'decide-prompt', esc(gate.prompt)));
      const opts = el('div', 'options');
      const build = () => {
        opts.innerHTML = '';
        gate.options.forEach(o => {
          const b = el('button', 'opt', `<span class="dot"></span><span>${esc(o.text)}</span>`);
          b.addEventListener('click', () => {
            youBubble(o.text);
            (o.reply || []).forEach(coachBubble);
            if (o.correct) {
              opts.querySelectorAll('.opt').forEach(x => x.disabled = true);
              addContinue(done);
            } else {
              build();   // re-offer the gate after coaching
            }
            scrollEnd();
          });
          opts.appendChild(b);
        });
      };
      build();
      wrap.appendChild(opts);
      ladderEl.appendChild(wrap);
    }

    // A scene decision — same shape, rendered inside the dark stage panel.
    function renderSceneStep(step, done) {
      const wrap = el('div', 'decide');
      wrap.appendChild(el('p', 'decide-prompt', esc(step.prompt)));
      const opts = el('div', 'options');
      step.options.forEach(o => {
        const b = el('button', 'opt', `<span class="dot"></span><span>${esc(o.text)}</span>`);
        b.addEventListener('click', () => {
          opts.querySelectorAll('.opt').forEach(x => x.disabled = true);
          sceneYou(o.you || o.text);
          (o.reply || []).forEach(sceneNarr);
          addContinue(done);
          scrollEnd();
        });
        opts.appendChild(b);
      });
      wrap.appendChild(opts);
      sceneEl.appendChild(wrap);
    }

    /* ---------- The guaranteed close (identical for both paths) ---------- */
    function renderClose() {
      const c = el('div', 'close-block');
      c.appendChild(el('div', 'close-banner', '<i class="fa-solid fa-circle-check"></i> Practice complete'));
      c.appendChild(el('p', 'close-lead', 'Whatever path you took, here’s the toolkit everyone leaves with.'));
      c.appendChild(el('p', 'close-sub', 'This is the same SME-validated close the conversation-practice version ends on — the nine components and the three-move framework, word for word.'));

      const grid = el('div', 'toolkit');
      grid.appendChild(el('div', 'tk-section-label', 'The nine components'));
      PLAYBOOK.forEach((p, i) => {
        grid.appendChild(el('div', 'tk',
          `<p class="tk-title"><span class="tk-num">${i + 1}</span> ${esc(p.title)}</p><p class="tk-body">${esc(p.body)}</p>`));
      });
      grid.appendChild(el('div', 'tk-section-label', 'In the moment — the three moves'));
      FRAMEWORK.forEach((p, i) => {
        grid.appendChild(el('div', 'tk framework',
          `<p class="tk-title"><span class="tk-num">${i + 7}</span> ${esc(p.title)}</p><p class="tk-body">${esc(p.body)}</p>`));
      });
      c.appendChild(grid);

      const res = el('div', 'resources');
      res.innerHTML = `<h3>Where to turn</h3><p class="lead">${esc(RESOURCES.lead)}</p>`;
      RESOURCES.items.forEach(r => {
        res.appendChild(el('div', 'res', `<p class="res-title">${esc(r.title)}</p><p class="res-body">${esc(r.body)}</p>`));
      });
      c.appendChild(res);

      const rr = el('div', 'restart-row');
      const again = el('button', 'btn-ghost', '<i class="fa-solid fa-rotate-left"></i> Back to mode select');
      again.addEventListener('click', renderModeSelect);
      rr.appendChild(again);
      c.appendChild(rr);

      ladderEl.appendChild(c);
      scrollEnd();
    }

    // Boot on the mode-select card.
    renderModeSelect();
    </script>

    <!-- ===== Course-delivery frame (production Vector Training chrome) ===== -->
    <script>
      window.LESSON_FRAME = {
        mount: '#app',
        course: 'Harassment Prevention for Employees',
        lesson: 'Bystander Intervention: The Marshall Scenario',
      };
    </script>
    <script src="js/frame.js?v=3"></script>
</body>
</html>
