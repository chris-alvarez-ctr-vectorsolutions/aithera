<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learner — Vector Training Admin</title>

    <!-- Vector Web Components (core v1.22.3 / themes v1.9.3, the versions cached in context/) -->
    <script type="module" src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.22.3/core.iife.js"></script>
    <script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.9.3/styles.js"></script>
    <link rel="stylesheet" href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css" />
    <!-- Self-hosted Font Awesome Pro (repo root is four levels up from verN/) -->
    <link rel="stylesheet" href="../../../../assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="admin.css?v=66" />
</head>
<body>
    <div id="head"></div>
    <main class="rp-main" id="main">

        <!-- Who needs what: the person's whole journey, across every course they are assigned -->
        <section class="rp-card lp-stats" id="stats" aria-label="At a glance"></section>

        <div class="rp-grid-2">
            <div class="col-stack">
                <section class="rp-card" aria-label="Needs attention">
                    <div class="rp-card-head"><h2>Needs attention</h2></div>
                    <div id="attn"></div>
                </section>
                <section class="rp-card" aria-label="Courses">
                    <div class="rp-card-head"><h2>Courses</h2><span id="courseCount" class="rp-card-sub" style="margin:0"></span></div>
                    <div id="courses"></div>
                </section>
            </div>
            <div class="col-stack">
                <section class="rp-card" aria-label="Journey">
                    <div class="rp-card-head"><h2>Journey</h2></div>
                    <div id="journey"></div>
                </section>
                <section class="rp-card" aria-label="Requirements and engagement">
                    <div class="rp-card-head"><h2>Role requirements</h2><span id="reqInfo"></span></div>
                    <div id="req"></div>
                    <div class="rp-card-head" style="margin-top:18px"><h2>Engagement</h2></div>
                    <div id="engage"></div>
                </section>
            </div>
        </div>

    </main>

    <script src="data.js?v=15"></script>
    <script src="admin-ui.js?v=11"></script>
    <script>

      (function () {
        var B = window.BBP, A = window.Admin, S = B.sector, TODAY = 20;
        var q = new URLSearchParams(location.search);
        var l = B.LEARNERS.filter(function (x) { return x.name === q.get('learner'); })[0] || B.LEARNERS[0];
        var unit = B.node(l.unit), first = A.esc(l.name.split(' ')[0]), E = A.esc;
        document.title = l.name + ' — Learner';
        function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 997; return h; }
        A.head({ active: 'learners', title: l.name, crumbs: [{ label: 'Learners', href: 'learners.html' }, { label: l.name }],
                 sub: E(l.role) + ' · ' + E(unit.name) + ' · assigned Sep 28', assignLabel: 'Assign a course', assignHref: 'assign.html' });
        A.wirePops();

        var cs = B.learnerCourses(l);
        var RECORD = function (c) { return c.id === 'bbp' ? 'learner-report.html?learner=' + encodeURIComponent(l.name) + '&from=profile' : null; };
        var STATE = { done: 'Finished', progress: 'In progress', notstarted: 'Not started' };
        var open = cs.filter(function (c) { return c.state !== 'done'; }).sort(function (a, b) { return a.order - b.order; });
        var support = cs.filter(function (c) { return c.support; });
        var done = cs.length - open.length;
        var lastD = Math.max.apply(null, [0].concat(cs.map(function (c) { return c.lastD || 0; })));
        var idle = lastD ? TODAY - lastD : null;
        var next = open[0];

        /* ---- At a glance ---- */
        function bar() {
          return '<span class="cbar cbar--lg" role="img" aria-label="' + done + ' of ' + cs.length + ' finished">' + cs.map(function (c) {
            return '<i class="' + c.state + (c.support ? ' support' : '') + '" title="' + E(c.name) + ': ' + STATE[c.state].toLowerCase() + '"></i>';
          }).join('') + '</span>';
        }
        document.getElementById('stats').innerHTML =
          '<div class="lp-stat"><span class="lp-k">Progress</span><span class="lp-v">' + done + ' <small>of ' + cs.length + ' finished</small></span>' + bar() + '</div>' +
          '<div class="lp-stat ' + (support.length ? 'warn' : '') + '"><span class="lp-k">Needs support</span><span class="lp-v">' + (support.length ? support.length + '<small> ' + (support.length === 1 ? 'course' : 'courses') + '</small>' : 'None') + '</span>' +
            '<span class="lp-s">' + (support.length ? E(support.map(function (c) { return c.name; }).join(', ')) : 'Everything finished is going well') + '</span></div>' +
          '<div class="lp-stat"><span class="lp-k">Next due</span><span class="lp-v">' + (next ? next.due : 'All finished') + '</span><span class="lp-s">' + (next ? E(next.name) + ' · in ' + next.days + ' days' + (open.length > 1 ? ' · ' + (open.length - 1) + ' more' : '') : 'Nothing outstanding') + '</span></div>' +
          '<div class="lp-stat"><span class="lp-k">Last active</span><span class="lp-v">' + (lastD ? 'Oct ' + lastD : '—') + '</span><span class="lp-s">' + (idle == null ? 'Has not started anything' : (idle === 0 ? 'Today' : idle + ' days ago')) + '</span></div>';

        /* ---- Needs attention: support first, then stalled, then due soon and not started ---- */
        var items = [];
        support.forEach(function (c) {
          items.push({ ico: 'fa-flag', cls: 'warn', title: 'Needs support in ' + c.name, sub: 'Still open: ' + (c.openAreas && c.openAreas.length ? E(c.openAreas.join(', ')) : 'a key area') + '. A follow-up check-in is queued.', href: RECORD(c) });
        });
        open.forEach(function (c) {
          if (c.state === 'progress' && TODAY - c.lastD >= 6) items.push({ ico: 'fa-hourglass-half', cls: 'mut', title: 'Stalled in ' + c.name, sub: 'No activity in ' + (TODAY - c.lastD) + ' days · at ' + E(c.at) + ' · due ' + c.due, remind: c.id });
          else if (c.state === 'notstarted' && c.days <= 30) items.push({ ico: 'fa-clock', cls: 'mut', title: c.name + ' not started', sub: 'Due ' + c.due + ' · in ' + c.days + ' days', remind: c.id });
        });
        var sent = {};
        function drawAttn() {
          document.getElementById('attn').innerHTML = items.length ? items.map(function (it) {
            var act = it.href ? '<a class="card-link" href="' + it.href + '">Open record <i class="fa-solid fa-arrow-right"></i></a>'
              : (it.remind ? (sent[it.remind] ? '<span class="remind-done"><i class="fa-solid fa-check"></i> Reminder sent</span>' : '<vaadin-button theme="secondary" class="remind" data-r="' + it.remind + '"><i class="fa-solid fa-bell" style="margin-right:7px"></i>Remind ' + first + '</vaadin-button>') : '');
            return '<div class="at-item ' + it.cls + '"><span class="at-ico"><i class="fa-solid ' + it.ico + '"></i></span><span class="at-main"><b>' + E(it.title) + '</b><small>' + it.sub + '</small></span><span class="at-act">' + act + '</span></div>';
          }).join('') : '<p class="at-none"><i class="fa-solid fa-circle-check"></i> Nothing needs attention right now.</p>';
          document.querySelectorAll('#attn [data-r]').forEach(function (b) { b.addEventListener('click', function () { sent[b.dataset.r] = true; drawAttn(); drawEngage(); }); });
        }
        drawAttn();

        /* ---- Courses ---- */
        var ROUTE_NOTE = { std: '', short: 'Skipped ahead', extra: 'Extra practice', up: 'Harder checks' };
        function dots(c) {
          return '<span class="dotset" title="' + E(c.areas.map(function (a) { return a.name + ': ' + B.BAND[a.band].label; }).join(' · ')) + '">' +
            c.areas.map(function (a) { return '<span class="dot ' + B.BAND[a.band].dot + '"></span>'; }).join('') + '</span>';
        }
        function courseRow(c) {
          var ico = '<span class="ci ' + (c.adaptive ? 'ci-blue' : 'ci-gray') + '" title="' + (c.adaptive ? 'Adaptive course' : 'Standard course') + '"><i class="fa-solid ' + (c.adaptive ? 'fa-route' : 'fa-list-ol') + '"></i></span>';
          var chip = '<span class="lc-state ' + c.state + '">' + STATE[c.state] + '</span>' + (c.support ? ' <span class="band band-warn">Needs support</span>' : '');
          var meta, mid;
          if (c.state === 'done') {
            meta = 'Finished Oct ' + c.finishedD + ' · ' + c.mins + ' min' + (c.typical ? ' (typical ' + c.typical + ')' : '');
            if (c.areas) {
              var good = c.areas.filter(function (a) { return a.band >= 2; }).length;
              mid = dots(c) + '<span class="lc-txt">Good or better in ' + good + ' of ' + c.areas.length + ' areas</span>' + (c.route && c.route !== 'std' ? ' ' + A.pathTag(c.route) : '');
              if (c.openAreas && c.openAreas.length) mid += '<small class="lc-open">Open: ' + E(c.openAreas.join(', ')) + '</small>';
            } else mid = '<span class="lc-txt dim">Completion only</span>';
          } else if (c.state === 'progress') {
            meta = 'Started Oct ' + c.startedD + ' · last active Oct ' + c.lastD;
            mid = '<span class="lc-prog"><i style="width:' + c.pct + '%"></i></span><span class="lc-txt">At ' + E(c.at) + '</span>';
          } else {
            meta = 'Not started';
            mid = '<span class="lc-txt dim">Assigned Sep 28</span>';
          }
          var link = RECORD(c);
          return '<div class="lc-row ' + c.state + '"><div class="lc-name">' + ico + '<span><b>' + E(c.name) + '</b><small>' + meta + '</small></span></div>' +
            '<div class="lc-mid">' + mid + '</div><div class="lc-end">' + chip + (c.state !== 'done' ? '<small class="lc-due">Due ' + c.due + ' · ' + c.days + ' days</small>' : '') + (link ? '<a class="card-link" href="' + link + '">Open record <i class="fa-solid fa-arrow-right"></i></a>' : '') + '</div></div>';
        }
        var ORDER = { progress: 0, notstarted: 1, done: 2 };
        var sorted = cs.slice().sort(function (a, b) { return (b.support - a.support) || (ORDER[a.state] - ORDER[b.state]) || (a.order - b.order); });
        document.getElementById('courses').innerHTML = sorted.map(courseRow).join('');
        document.getElementById('courseCount').textContent = cs.length + ' assigned';

        /* ---- Journey: what is coming, then what happened ---- */
        var ev = [{ d: -2, t: 'Assigned ' + cs.length + ' courses', ico: 'fa-paper-plane' }];
        cs.forEach(function (c) {
          if (c.startedD) ev.push({ d: c.startedD, t: 'Started ' + c.name, ico: 'fa-play' });
          if (c.state === 'done') ev.push({ d: c.finishedD, t: 'Finished ' + c.name, ico: 'fa-circle-check', cls: c.support ? 'warn' : 'ok', sub: c.support ? 'Needs support' : '' });
        });
        ev.sort(function (a, b) { return b.d - a.d; });
        var upcoming = [];
        if (l.status === 'followup') upcoming.push({ when: 'Nov 15', t: '30-day check-in · Bloodborne Pathogens', ico: 'fa-calendar-check' });
        open.slice(0, 2).forEach(function (c) { upcoming.push({ when: c.due, t: c.name + ' due', ico: 'fa-flag-checkered' }); });
        function dl(d) { return d < 0 ? 'Sep ' + (30 + d) : 'Oct ' + d; }
        document.getElementById('journey').innerHTML =
          (upcoming.length ? '<p class="jr-cap">Coming up</p><ul class="jr">' + upcoming.map(function (u) { return '<li class="soon"><i class="fa-solid ' + u.ico + '"></i><span><b>' + E(u.t) + '</b></span><em>' + u.when + '</em></li>'; }).join('') + '</ul>' : '') +
          '<p class="jr-cap">So far</p><ul class="jr">' + ev.slice(0, 8).map(function (e) {
            return '<li class="' + (e.cls || '') + '"><i class="fa-solid ' + e.ico + '"></i><span><b>' + E(e.t) + '</b>' + (e.sub ? '<small>' + e.sub + '</small>' : '') + '</span><em>' + dl(e.d) + '</em></li>';
          }).join('') + '</ul>';

        /* ---- Role requirements ---- */
        var cr = B.credit(l);
        document.getElementById('reqInfo').innerHTML = A.info('<p>Objectives shared between courses count once. When someone proves one in a course, it counts toward every other course that asks for it.</p>', 'About role requirements');
        A.wirePops();
        document.getElementById('req').innerHTML = l.profile
          ? '<p class="rq-n"><b>' + cr.overall.done + '</b> of ' + cr.overall.total + ' objectives done toward ' + E(l.role) + ' requirements</p><span class="rq-bar"><i style="width:' + Math.round(cr.overall.done / cr.overall.total * 100) + '%"></i></span>' +
            '<a class="card-link" href="learner-report.html?learner=' + encodeURIComponent(l.name) + '&from=profile#beyond">See what counts where <i class="fa-solid fa-arrow-right"></i></a>'
          : '<p class="rp-card-sub">Counts toward ' + E(l.role) + ' requirements once ' + first + ' finishes a course.</p>';

        /* ---- Engagement ---- */
        var totalMins = cs.reduce(function (a, c) { return a + (c.mins || 0); }, 0);
        var remindedBefore = open.length && hash(l.name) % 2 === 0;
        function drawEngage() {
          var n = Object.keys(sent).length;
          document.getElementById('engage').innerHTML = '<dl class="eg">' +
            '<dt>Time spent</dt><dd>' + (totalMins ? totalMins + ' min in finished courses' : '—') + '</dd>' +
            '<dt>Reminders</dt><dd>' + (n ? 'Reminder sent today' + (remindedBefore ? ' · last before that Oct 17' : '') : (remindedBefore ? 'Last reminded Oct 17' : (open.length ? 'None sent yet' : 'Not needed'))) + '</dd></dl>';
        }
        drawEngage();
      })();

    </script>
</body>
</html>
