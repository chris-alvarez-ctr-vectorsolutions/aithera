<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overview — Vector Training Admin</title>

    <!-- Vector Web Components (core v1.22.3 / themes v1.9.3, the versions cached in context/) -->
    <script type="module" src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.22.3/core.iife.js"></script>
    <script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.9.3/styles.js"></script>
    <link rel="stylesheet" href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css" />
    <!-- Self-hosted Font Awesome Pro (repo root is four levels up from verN/) -->
    <link rel="stylesheet" href="../../../../assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="admin.css?v=53" />
</head>
<body>
    <div id="head"></div>
    <main class="rp-main">

        <!-- The headline: did the training work, across every adaptive course? -->
        <section class="rp-card hero" aria-label="Outcome achievement" id="hero"></section>

        <!-- Org-wide numbers across every active course; the trend rides inside the second tile -->
        <section class="rp-kpis rp-kpis--3" id="kpis" aria-label="Key figures"></section>

        <!-- Attention lives inside each course: if someone needs help, it is in the context of a course -->
        <section class="rp-card" aria-label="Active courses">
            <div class="rp-card-head">
                <div><h2>Active courses</h2><p class="rp-card-sub" style="margin:2px 0 0">Soonest due first</p></div>
                <a href="courses.html" class="card-link">All courses <i class="fa-solid fa-arrow-right"></i></a>
            </div>
            <div id="courseRows"></div>
            <div class="dual-legend">
                <span><i style="background:#7fb8e6"></i> Finished</span>
                <span><i style="background:var(--rp-primary)"></i> Showed competency (of those who finished)</span>
            </div>
        </section>

    </main>

    <script src="data.js?v=14"></script>
    <script src="admin-ui.js?v=10"></script>
    <script>

      (function () {
        var B = window.BBP, A = window.Admin, S = B.sector, E = A.esc;
        var scope = A.getScope(), node = B.node(scope);
        A.head({ active: 'overview', title: 'Overview', scope: true,
                 chips: ['<span class="rp-chip"><i class="fa-solid fa-calendar"></i> Sep 28 – Oct 19</span>'] });
        A.wirePops();

        function tile(label, value, sub, cls, extra) {
          return '<div class="rp-card tile' + (cls || '') + '"><span class="tile-label">' + label + '</span><span class="tile-value">' + value + '</span><span class="tile-delta flat">' + sub + '</span>' + (extra || '') + '</div>';
        }
        // One summary per course, the same numbers the Courses page shows.
        var courses = B.courseSummary(scope).sort(function (a, b) { return a.days - b.days; });
        var totA = 0, totC = 0, adC = 0, adD = 0, sup = 0;
        courses.forEach(function (c) { totA += c.assigned; totC += c.completed; if (c.adaptive) { adC += c.completed; adD += c.demo; sup += c.support; } });
        var soon = courses[0];

        /* ---- Outcome achievement: skill-area results at Good or better, now vs. at the start, over every adaptive course ---- */
        var scored = courses.filter(function (c) { return c.adaptive && c.areas; });
        var live = scored.filter(function (c) { return !c.early && c.completed >= 8; });
        var wB = 0, wA = 0, w = 0;
        live.forEach(function (c) { wB += c.before * c.completed; wA += c.after * c.completed; w += c.completed; });
        var before = w ? Math.round(wB / w) : 0, after = w ? Math.round(wA / w) : 0;
        function pos(v) { return Math.max(0, Math.min(100, (v - 50) / 50 * 100)); }
        function row(c) {
          var tooEarly = !(c.completed >= 8 && !c.early);
          var track = tooEarly ? '<div class="dm-track dim"></div>' :
            '<div class="dm-track" role="img" aria-label="' + E(c.name) + ': ' + c.before + '% at Good or better before, ' + c.after + '% after"><span class="dm-line" style="left:' + pos(c.before) + '%;width:' + (pos(c.after) - pos(c.before)) + '%"></span>' +
            '<span class="dm-dot before" style="left:' + pos(c.before) + '%"></span><span class="dm-dot after" style="left:' + pos(c.after) + '%"></span></div>';
          var val = tooEarly ? '<div class="dm-val"><b class="dim">Too early</b><em class="dim">' + c.completed + ' finished</em></div>'
                             : '<div class="dm-val"><b>' + c.before + '% → ' + c.after + '%</b><em>+' + (c.after - c.before) + ' pts</em></div>';
          return '<div class="dm-row"><div class="dm-name"><h3>' + (c.id === 'bbp' ? '<a href="course-report.html">' + E(c.name) + '</a>' : E(c.name)) + '</h3><small>' + c.completed + ' of ' + c.assigned + ' finished</small></div>' + track + val + '</div>';
        }
        document.getElementById('hero').innerHTML =
          '<div class="hero-main"><span class="tile-label">Outcome achievement ' + A.info('<p><b>Of everything people were measured on</b> in adaptive courses, the share at <b>Good or better</b> now, compared with where they started (the opening questions).</p><p>Weighted by who has finished. Courses with only a few finishers are shown but not counted yet. Standard courses report completion only, so they are not scored here.</p>', 'How outcome achievement is measured') + '</span>' +
            '<span class="hero-n">' + after + '<small>%</small></span>' +
            '<span class="hero-s">of skill areas at <b>Good or better</b> after training</span>' +
            '<span class="hero-lift"><i class="fa-solid fa-arrow-trend-up"></i> +' + (after - before) + ' pts from ' + before + '% at the start</span>' +
            '<small class="hero-f">' + live.length + ' adaptive courses · ' + w + ' finishers counted</small></div>' +
          '<div class="hero-rows"><div class="dm-head"><span></span><div class="dm-axis-lbl"><span>50%</span><span>75%</span><span>100%</span></div><span></span></div>' + scored.map(row).join('') + '</div>';
        A.wirePops();

        /* ---- Key figures ---- */
        var spark = '<svg class="spark" viewBox="0 0 120 28" preserveAspectRatio="none" role="img" aria-label="Rising over the last three weeks"><polygon class="area" points="0,28 0,28 24,23.6 48,18.4 72,13.2 96,9.6 120,7 120,28"/><polyline points="0,28 24,23.6 48,18.4 72,13.2 96,9.6 120,7"/><circle cx="120" cy="7" r="3"/></svg>';
        var finBar = '<span class="tile-meter" role="img" aria-label="' + B.pct(totC, totA) + ' percent finished"><span style="width:' + B.pct(totC, totA) + '%"></span></span>';
        document.getElementById('kpis').innerHTML =
          tile('Finished', B.pct(totC, totA) + '<small>%</small>', totC + ' of ' + totA + ' assignments · ' + courses.length + ' courses', '', finBar +
            '<span class="tile-foot"><i class="fa-regular fa-clock"></i> Next due <b>' + soon.due + '</b> · ' + E(soon.name) + '</span>') +
          tile('Showed competency', B.pct(adD, adC) + '<small>%</small>', adD + ' of ' + adC + ' who finished adaptive courses', '', spark) +
          '<a class="rp-card tile tile--link" href="learners.html?f=support"><span class="tile-label">Need support</span><span class="tile-value">' + sup + '<small> people</small></span><span class="tile-delta flat">still working on a key area</span><span class="tile-foot tile-foot--link">See who <i class="fa-solid fa-arrow-right"></i></span></a>';

        /* ---- Active courses ---- */
        function bar(kind, v, title) {
          return '<span class="dbar"><span class="dbar-track"><span class="dbar-fill ' + kind + '" style="width:' + v + '%"></span></span><span class="dbar-val" title="' + title + '"><b>' + v + '%</b></span></span>';
        }
        function chip(n, label, cls, href) {
          if (!n) return '';
          var inner = '<b>' + n + '</b> ' + label;
          return href ? '<a class="att-chip ' + cls + '" href="' + href + '">' + inner + '</a>' : '<span class="att-chip ' + cls + '">' + inner + '</span>';
        }
        document.getElementById('courseRows').innerHTML = courses.map(function (c) {
          var urgent = c.days <= 21 ? ' urgent' : '', href = c.id === 'bbp' ? 'course-report.html' : null;
          var ico = '<span class="ci ' + (c.adaptive ? 'ci-blue' : 'ci-gray') + '" role="img" aria-label="' + (c.adaptive ? 'Adaptive course' : 'Standard course') + '" title="' + (c.adaptive ? 'Adaptive course' : 'Standard course') + '"><i class="fa-solid ' + (c.adaptive ? 'fa-route' : 'fa-list-ol') + '"></i></span>';
          return '<div class="course-row"><span class="dual-name">' + ico + '<span>' + (href ? '<a href="' + href + '">' + E(c.name) + '</a>' : E(c.name)) + '<span class="due' + urgent + '">Due ' + c.due + ' · ' + c.days + ' days</span></span></span>' +
            '<span class="dual-bars">' + bar('comp', B.pct(c.completed, c.assigned), 'Finished') +
              (c.demo == null ? '<span class="dbar-note" title="Standard courses report completion only"><i class="fa-solid fa-circle-info"></i>Completion only</span>' : bar('demo', B.pct(c.demo, c.completed), 'Showed competency, as a share of those who finished')) + '</span>' +
            '<span class="course-att">' + (chip(c.support, 'need support', 'warn', href ? href + '?people=support' : '') + chip(c.open, 'not finished', 'mut', href ? href + '?people=open' : '') || '<span class="att-none">Nothing needs attention</span>') + '</span></div>';
        }).join('');
      })();

    </script>
    <script src="../../../../designtoolbox/toolbox.js?v=1.1.0"></script>
</body>
</html>
