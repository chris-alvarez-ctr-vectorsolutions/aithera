<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learners — Vector Training Admin</title>

    <!-- Vector Web Components (core v1.22.3 / themes v1.9.3, the versions cached in context/) -->
    <script type="module" src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.22.3/core.iife.js"></script>
    <script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.9.3/styles.js"></script>
    <link rel="stylesheet" href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css" />
    <!-- Self-hosted Font Awesome Pro (repo root is four levels up from verN/) -->
    <link rel="stylesheet" href="../../../../assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="admin.css?v=58" />
</head>
<body>
    <div id="head"></div>
    <main class="rp-main">

        <section class="rp-card" aria-label="Learners">
            <div class="list-tools">
                <div class="chips-row" id="filterChips" role="group" aria-label="Status"></div>
                <div class="list-filters">
                    <input type="search" id="q" class="fsearch" placeholder="Search learners" aria-label="Search learners">
                    <label class="fsel"><span>Enrolled in</span><select id="courseSel" aria-label="Enrolled in"></select></label>
                    <label class="fsel"><span>Role</span><select id="roleSel" aria-label="Role"></select></label>
                </div>
            </div>
            <div class="table-scroll">
                <table class="rp-table">
                    <thead><tr>
                        <th>Learner</th>
                        <th>Progress</th>
                        <th>Needs support</th>
                        <th>Next due</th>
                        <th>Last active</th>
                        <th class="th-go"><span class="sr-only">Details</span></th>
                    </tr></thead>
                    <tbody id="learnerRows"></tbody>
                </table>
            </div>
        </section>
        <p class="rp-footline" id="foot"></p>

    </main>

    <script src="data.js?v=15"></script>
    <script src="admin-ui.js?v=10"></script>
    <script>

      (function () {
        var B = window.BBP, A = window.Admin, S = B.sector;
        var scope = A.getScope();
        A.head({ active: 'learners', title: 'Learners', scope: true });
        A.wirePops();
        // A learner is a person, not a course. Each row summarizes all of their assignments in a fixed-size
        // footprint (a segmented bar, a count, one date), so it reads the same with 3 courses or 30. The
        // per-course detail opens inline. Course-level results live on each course's report and the learner record.
        var roster = B.LEARNERS.filter(function (l) { return B.inScope(l, scope); }).map(function (l) {
          return { l: l, all: B.learnerCourses(l) };
        });
        var STATE = { done: 'Finished', progress: 'In progress', notstarted: 'Not started' };
        var active = 'all', role = 'any', course = 'any', query = '', openRows = {};
        var pf = new URLSearchParams(location.search).get('f');
        // With a course chosen the whole row speaks about that course only; otherwise about everything assigned.
        function view(r) {
          var cs = course === 'any' ? r.all : r.all.filter(function (c) { return c.id === course; });
          var open = cs.filter(function (c) { return c.state !== 'done'; }).sort(function (a, b) { return a.order - b.order; });
          return { l: r.l, cs: cs, done: cs.length - open.length, open: open, support: cs.filter(function (c) { return c.support; }) };
        }
        var FILTERS = [
          { key: 'all',        label: 'All',             test: function () { return true; } },
          { key: 'support',    label: 'Needs support',   test: function (v) { return v.support.length > 0; } },
          { key: 'progress',   label: 'In progress',     test: function (v) { return v.cs.some(function (c) { return c.state === 'progress'; }); } },
          { key: 'notstarted', label: 'Has not started', test: function (v) { return v.cs.some(function (c) { return c.state === 'notstarted'; }); } }
        ];
        if (pf && FILTERS.some(function (x) { return x.key === pf; })) active = pf;
        var roles = S.roles.filter(function (x) { return roster.some(function (r) { return r.l.role === x; }); });
        document.getElementById('roleSel').innerHTML = '<option value="any">All roles</option>' + roles.map(function (x) { return '<option>' + A.esc(x) + '</option>'; }).join('');
        document.getElementById('courseSel').innerHTML = '<option value="any">Any course</option>' + B.COURSES.map(function (c) { return '<option value="' + c.id + '">' + A.esc(c.name) + '</option>'; }).join('');

        function bar(v) {
          return '<span class="cbar" role="img" aria-label="' + v.done + ' of ' + v.cs.length + ' finished">' + v.cs.map(function (c) {
            return '<i class="' + c.state + (c.support ? ' support' : '') + '" title="' + A.esc(c.name) + ': ' + STATE[c.state].toLowerCase() + (c.support ? ' · needs support' : '') + '"></i>';
          }).join('') + '</span><span class="cp-txt">' + v.done + ' of ' + v.cs.length + ' finished</span>';
        }
        function detail(v) {
          var rows = v.cs.slice().sort(function (a, b) { return (b.support - a.support) || (a.state === 'done') - (b.state === 'done') || a.order - b.order; });
          return '<ul class="cd-list">' + rows.map(function (c) {
            return '<li><span class="cd-name">' + A.esc(c.name) + '</span><span class="cd-state ' + c.state + '">' + STATE[c.state] + '</span>' +
              '<span class="cd-due">' + (c.state === 'done' ? '' : 'Due ' + c.due) + '</span>' + (c.support ? '<span class="band band-warn">Needs support</span>' : '<span></span>') + '</li>';
          }).join('') + '</ul>';
        }
        function row(v) {
          var l = v.l, u = B.node(l.unit), href = A.learnerProfileHref(l), key = l.name, isOpen = !!openRows[key];
          var n = v.support.length;
          var attn = n ? '<span class="band band-warn" title="' + A.esc(v.support.map(function (c) { return c.name; }).join(', ')) + '">' + n + (n === 1 ? ' course' : ' courses') + '</span>' : '<span class="dots-none">—</span>';
          var next = v.open[0];
          var due = next ? '<b class="nd">' + next.due + '</b><small class="row-sub" title="' + A.esc(v.open.map(function (c) { return c.name + ' · ' + c.due; }).join('\n')) + '"><span class="ell">' + A.esc(next.name) + '</span>' + (v.open.length > 1 ? '<span class="more">+' + (v.open.length - 1) + '</span>' : '') + '</small>' : '<span class="dots-none">All finished</span>';
          var lastD = Math.max.apply(null, [0].concat(v.cs.map(function (c) { return c.lastD || 0; })));
          var last = lastD ? 'Oct ' + lastD : null;
          return '<tr class="row-main' + (isOpen ? ' open' : '') + '" data-k="' + A.esc(key) + '">' +
            '<td class="rp-name"><span class="row-avatar">' + A.initials(l.name) + '</span><a href="' + href + '">' + A.esc(l.name) + '</a><small class="row-role">' + A.esc(l.role) + ' · ' + A.esc(u.name) + '</small></td>' +
            '<td>' + bar(v) + '</td><td>' + attn + '</td><td>' + due + '</td><td>' + (last || '<span class="dots-none">—</span>') + '</td>' +
            '<td class="td-go"><button type="button" class="rowtoggle" aria-expanded="' + isOpen + '" aria-label="Show courses for ' + A.esc(l.name) + '"><i class="fa-solid fa-chevron-down"></i></button></td></tr>' +
            '<tr class="row-detail"' + (isOpen ? '' : ' hidden') + '><td colspan="6">' + (isOpen ? detail(v) : '') + '</td></tr>';
        }
        function render() {
          var f = FILTERS.filter(function (x) { return x.key === active; })[0];
          var base = roster.map(view).filter(function (v) { return v.cs.length; });
          document.getElementById('filterChips').innerHTML = FILTERS.map(function (x) {
            return '<button class="fchip' + (x.key === active ? ' active' : '') + '" data-f="' + x.key + '">' + x.label + '<small>' + base.filter(x.test).length + '</small></button>';
          }).join('');
          var q = query.trim().toLowerCase();
          var rows = base.filter(f.test).filter(function (v) { return (role === 'any' || v.l.role === role) && (!q || v.l.name.toLowerCase().indexOf(q) >= 0); });
          document.getElementById('learnerRows').innerHTML = rows.length ? rows.map(row).join('') : '<tr><td colspan="6" class="dots-none" style="padding:22px">No one matches.</td></tr>';
          document.querySelectorAll('#filterChips .fchip').forEach(function (b) { b.addEventListener('click', function () { active = b.dataset.f; render(); }); });
          document.querySelectorAll('#learnerRows .row-main').forEach(function (tr) {
            tr.addEventListener('click', function (e) {
              if (e.target.closest('a')) return;
              var k = tr.dataset.k, v = rows.filter(function (x) { return x.l.name === k; })[0], d = tr.nextElementSibling, o = !openRows[k];
              openRows[k] = o; tr.classList.toggle('open', o); d.hidden = !o;
              tr.querySelector('.rowtoggle').setAttribute('aria-expanded', String(o));
              d.firstChild.innerHTML = o ? detail(v) : '';
            });
          });
        }
        document.getElementById('roleSel').addEventListener('change', function (e) { role = e.target.value; render(); });
        document.getElementById('courseSel').addEventListener('change', function (e) { course = e.target.value; render(); });
        document.getElementById('q').addEventListener('input', function (e) { query = e.target.value; render(); });
        render();
        document.getElementById('foot').innerHTML = '<i class="fa-solid fa-circle-info"></i> One segment per assigned course: filled = finished, half = in progress, empty = not started, amber = needs support';
      })();

    </script>
    <script src="../../../../designtoolbox/toolbox.js?v=1.1.0"></script>
</body>
</html>
