<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses — Vector Training Admin</title>

    <!-- Vector Web Components (core v1.22.3 / themes v1.9.3, the versions cached in context/) -->
    <script type="module" src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.22.3/core.iife.js"></script>
    <script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.9.3/styles.js"></script>
    <link rel="stylesheet" href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css" />
    <!-- Self-hosted Font Awesome Pro (repo root is four levels up from verN/) -->
    <link rel="stylesheet" href="../../../../assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="admin.css?v=53" />
</head>
<body>
    <div id="head"></div>
    <main class="rp-main">

        <div class="course-grid" id="courseGrid"></div>

    </main>

    <script src="data.js?v=14"></script>
    <script src="admin-ui.js?v=10"></script>
    <script>

      (function () {
        var B = window.BBP, A = window.Admin, S = B.sector;
        var scope = A.getScope(), t = B.stats(scope), n = B.headcount(scope);
        A.head({ active: 'courses', title: 'Courses', scope: true });
        A.wirePops();
        // Each card is a small copy of the course report's Learner performance card: same bar, same group names,
        // same phrase for the headline, so clicking in shows the same picture at full size.
        var courses = B.courseSummary(scope).map(function (c) {
          c.href = c.id === 'bbp' ? 'course-report.html' : null;
          return c;
        });
        function seg(key, n, label, total) {
          return n ? '<span class="seg-' + key + '" style="flex:' + n + ' 1 0" title="' + label + ': ' + n + ' of ' + total + '"></span>' : '';
        }
        document.getElementById('courseGrid').innerHTML = courses.map(function (c) {
          var comp = B.pct(c.completed, c.assigned), demo = c.demo == null ? null : B.pct(c.demo, c.completed);
          var title = c.href ? '<a class="cc-link" href="' + c.href + '">' + c.name + '</a>' : c.name;
          // Status reads like the report's strip: open with people still to go, or everyone done.
          var status = c.open
            ? '<span class="st-badge live"><i></i> Open</span><span class="cc-status-txt"><b>' + c.open + ' still to go</b> · Due ' + c.due + '</span>'
            : '<span class="st-badge closed"><i class="fa-solid fa-check"></i> All finished</span><span class="cc-status-txt">Due ' + c.due + '</span>';
          var bar, groups, hero;
          if (demo == null) {
            // Standard courses report completion only: finished and not finished.
            hero = '<span class="cc-hero">' + comp + '%<small>finished</small></span>';
            bar = seg('done', c.completed, 'Finished', c.assigned) + seg('open', c.open, 'Not finished', c.assigned);
            groups = '<span class="cc-g"><i class="cc-k seg-done"></i><b>' + c.completed + '</b> Finished</span>' +
                     '<span class="cc-g"><i class="cc-k seg-open"></i><b>' + c.open + '</b> Not finished</span>';
          } else {
            hero = '<span class="cc-hero">' + demo + '%<small>of finishers showed competency</small></span>';
            bar = seg('strong', c.strong, 'Doing well', c.assigned) + seg('ontrack', c.ontrack, 'On track', c.assigned) +
                  seg('support', c.support, 'Needs support', c.assigned) + seg('open', c.open, 'Not finished', c.assigned);
            groups = '<span class="cc-g good"><i class="cc-k seg-strong"></i><b>' + c.strong + '</b> Doing well</span>' +
                     '<span class="cc-g ontrack"><i class="cc-k seg-ontrack"></i><b>' + c.ontrack + '</b> On track</span>' +
                     '<span class="cc-g warn"><i class="cc-k seg-support"></i><b>' + c.support + '</b> Needs support</span>' +
                     '<span class="cc-g mut"><i class="cc-k seg-open"></i><b>' + c.open + '</b> Not finished</span>';
          }
          // Weakest area = the one with the most people still at Practice Needed, worded like its By section row (Good or better) and linked to it.
          var weak = c.gap
            ? 'Weakest area' + (c.early ? ' so far' : '') + ': <b>' + c.gap.name + '</b> · ' + (100 - c.gap.before) + '% → ' + (100 - c.gap.after) + '% at Good or better'
            : 'A standard course reports completion only.';
          weak = '<i class="fa-solid ' + (c.gap ? 'fa-magnifying-glass-chart' : 'fa-circle-info') + '"></i>' + weak;
          var foot = c.gap && c.href ? '<a class="cc-gap cc-gap-link" href="' + c.href + '#bySection">' + weak + ' <i class="fa-solid fa-arrow-right cc-go"></i></a>' : '<p class="cc-gap">' + weak + '</p>';
          return '<div class="rp-card course-card' + (c.href ? ' is-link' : '') + '">' +
            '<div class="cc-head"><span class="ci ' + (c.adaptive ? 'ci-blue' : 'ci-gray') + '" role="img" aria-label="' + (c.adaptive ? 'Adaptive course' : 'Standard course') + '" title="' + (c.adaptive ? 'Adaptive course' : 'Standard course') + '"><i class="fa-solid ' + (c.adaptive ? 'fa-route' : 'fa-list-ol') + '"></i></span><h2>' + title + '</h2></div>' +
            '<div class="cc-status">' + status + '</div>' +
            hero +
            '<p class="cc-sum">' + comp + '% finished · ' + c.completed + ' of ' + c.assigned + '</p>' +
            '<div class="pg-bar cc-bar" role="img" aria-label="' + (demo == null
              ? c.completed + ' finished, ' + c.open + ' not finished'
              : c.strong + ' doing well, ' + c.ontrack + ' on track, ' + c.support + ' needs support, ' + c.open + ' not finished') + ', of ' + c.assigned + ' enrolled">' + bar + '</div>' +
            '<div class="cc-groups">' + groups + '</div>' +
            foot + '</div>';
        }).join('');
      })();

    </script>
    <script src="../../../../designtoolbox/toolbox.js?v=1.1.0"></script>
</body>
</html>
