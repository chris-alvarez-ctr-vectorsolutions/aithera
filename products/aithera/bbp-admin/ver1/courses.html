<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses — Vector Training Admin</title>

    <!-- Vector Web Components (core v1.22.3 / themes v1.9.3, the versions cached in context/) -->
    <script type="module" src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.22.3/core.iife.js"></script>
    <script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.9.3/styles.js"></script>
    <link rel="stylesheet" href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css" />
    <!-- Self-hosted Font Awesome Pro (repo root is four levels up from verN/) -->
    <link rel="stylesheet" href="../../../../assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="admin.css?v=58" />
</head>
<body>
    <div id="head"></div>
    <main class="rp-main">

        <!-- Active vs past: the same segmented control the course report uses for Outcomes / Pacing -->
        <div class="cc-toolbar">
            <span class="sec-toggle" role="group" aria-label="Show courses">
                <button type="button" class="on" data-when="active" aria-pressed="true">Active <span class="tg-n" id="nActive"></span></button>
                <button type="button" data-when="past" aria-pressed="false">Past <span class="tg-n" id="nPast"></span></button>
            </span>
            <span class="cc-toolbar-note" id="gridNote"></span>
        </div>
        <!-- One list, not a grid of cards: column labels and the bar legend are said once, every row compares
             like with like, and it scales to any number of courses. The bar is the report's Learner performance bar. -->
        <section class="rp-card cl" aria-label="Courses">
            <div class="cl-row cl-headrow" aria-hidden="true">
                <span>Course</span><span>Results</span><span class="num">Showed competency</span><span class="num">Need support</span><span>Weakest area</span><span></span>
            </div>
            <div id="courseList" role="list"></div>
            <div class="cl-legend">
                <span><i class="seg-strong"></i>Doing well</span><span><i class="seg-ontrack"></i>On track</span><span><i class="seg-support"></i>Needs support</span>
                <span><i class="seg-done"></i>Finished (standard course)</span><span><i class="seg-open"></i>Not finished</span>
            </div>
        </section>

    </main>

    <script src="data.js?v=15"></script>
    <script src="admin-ui.js?v=10"></script>
    <script>

      (function () {
        var B = window.BBP, A = window.Admin, S = B.sector;
        var scope = A.getScope(), t = B.stats(scope), n = B.headcount(scope);
        A.head({ active: 'courses', title: 'Courses', scope: true });
        A.wirePops();
        var active = B.courseSummary(scope).map(function (c) { c.href = c.id === 'bbp' ? 'course-report.html' : null; return c; });
        var past = B.pastCourseSummary(scope);
        function seg(key, n, label, total) {
          return n ? '<span class="seg-' + key + '" style="flex:' + n + ' 1 0" title="' + label + ': ' + n + ' of ' + total + '"></span>' : '';
        }
        var NONE = '<span class="cl-none">—</span>';
        function row(c) {
          var comp = B.pct(c.completed, c.assigned), demo = c.demo == null ? null : B.pct(c.demo, c.completed);
          var name = c.href ? '<a class="cl-link" href="' + c.href + '">' + A.esc(c.name) + '</a>' : A.esc(c.name);
          var when = c.closed
            ? 'Ended ' + c.ended + (c.open ? ' · ' + c.open + ' did not finish' : ' · everyone finished')
            : 'Due ' + c.due + ' · <b>' + c.open + ' still to go</b>';
          var bar = demo == null
            ? seg('done', c.completed, 'Finished', c.assigned) + seg('open', c.open, 'Not finished', c.assigned)
            : seg('strong', c.strong, 'Doing well', c.assigned) + seg('ontrack', c.ontrack, 'On track', c.assigned) +
              seg('support', c.support, 'Needs support', c.assigned) + seg('open', c.open, 'Not finished', c.assigned);
          var label = demo == null
            ? c.completed + ' finished, ' + c.open + ' not finished'
            : c.strong + ' doing well, ' + c.ontrack + ' on track, ' + c.support + ' need support, ' + c.open + ' not finished';
          // Weakest area = most people still at Practice Needed, worded like its Performance by section row and linked to it.
          var weak = c.gap
            ? '<b>' + A.esc(c.gap.name) + '</b><small>' + (100 - c.gap.after) + '% at Good or better' + (c.early ? ' so far' : '') + '</small>'
            : NONE;
          if (c.gap && c.href) weak = '<a class="cl-weak-link" href="' + c.href + '#bySection">' + weak + '</a>';
          return '<div class="cl-row' + (c.href ? ' is-link' : '') + '" role="listitem">' +
            '<span class="cl-course"><span class="ci ' + (c.adaptive ? 'ci-blue' : 'ci-gray') + '" role="img" aria-label="' + (c.adaptive ? 'Adaptive course' : 'Standard course') + '" title="' + (c.adaptive ? 'Adaptive course' : 'Standard course') + '"><i class="fa-solid ' + (c.adaptive ? 'fa-route' : 'fa-list-ol') + '"></i></span>' +
              '<span><span class="cl-name">' + name + '</span><small>' + when + '</small></span></span>' +
            '<span class="cl-results"><span class="pg-bar" role="img" aria-label="' + label + ', of ' + c.assigned + ' enrolled">' + bar + '</span>' +
              '<small><b>' + comp + '% finished</b> · ' + c.completed + ' of ' + c.assigned + '</small></span>' +
            '<span class="num cl-demo"><span class="cl-k">Showed competency</span>' + (demo == null ? '<span class="cl-only">Completion only</span>' : '<b>' + demo + '%</b>') + '</span>' +
            '<span class="num cl-sup"><span class="cl-k">Need support</span>' + (c.support == null ? NONE : '<b' + (c.support ? ' class="warn"' : '') + '>' + c.support + '</b>') + '</span>' +
            '<span class="cl-weak"><span class="cl-k">Weakest area</span>' + weak + '</span>' +
            '<span class="cl-go">' + (c.href ? '<i class="fa-solid fa-chevron-right"></i>' : '') + '</span></div>';
        }
        document.getElementById('nActive').textContent = active.length;
        document.getElementById('nPast').textContent = past.length;
        function draw(when) {
          var list = when === 'past' ? past : active;
          document.getElementById('courseList').innerHTML = list.map(row).join('');
          document.getElementById('gridNote').textContent = when === 'past'
            ? 'Closed assignments, most recent first. Numbers are final.'
            : 'Open assignments, soonest due first.';
          document.querySelectorAll('[data-when]').forEach(function (b) { var on = b.dataset.when === when; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
        }
        document.querySelectorAll('[data-when]').forEach(function (b) { b.addEventListener('click', function () { draw(b.dataset.when); }); });
        draw(new URLSearchParams(location.search).get('show') === 'past' ? 'past' : 'active');
      })();

    </script>
    <script src="../../../../designtoolbox/toolbox.js?v=1.1.0"></script>
</body>
</html>
