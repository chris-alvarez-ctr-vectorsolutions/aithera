<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses — Vector Training Admin</title>

    <!-- Vector Web Components (core v1.22.3 / themes v1.9.3, the versions cached in context/) -->
    <script type="module" src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.22.3/core.iife.js"></script>
    <script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.9.3/styles.js"></script>
    <link rel="stylesheet" href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css" />
    <!-- Self-hosted Font Awesome Pro (repo root is four levels up from verN/) -->
    <link rel="stylesheet" href="../../../../assets/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="admin.css?v=22" />
</head>
<body>
    <div id="head"></div>
    <main class="rp-main">

        <div class="course-grid" id="courseGrid"></div>
        <p class="rp-footline"><i class="fa-solid fa-circle-info"></i> Representative data for the prototype.</p>

    </main>

    <script src="data.js?v=9"></script>
    <script src="admin-ui.js?v=8"></script>
    <script>

      (function () {
        var B = window.BBP, A = window.Admin, S = B.sector;
        var scope = A.getScope(), t = B.stats(scope), n = B.headcount(scope);
        A.head({ active: 'courses', title: 'Courses', scope: true });
        A.wirePops();
        var share = n / B.headcount(S.tree.id);
        function sc(x) { return Math.round(x * share); }
        var courses = [
          { name: 'Bloodborne Pathogens', icon: 'fa-droplet', cls: 'ci-blue', ai: true, due: 'Nov 6', assigned: t.assigned, completed: t.completed, demo: t.demonstrated,
            adjusted: t.adjusted, gap: 'Doing it right', gapNote: '41% → 9% at Practice Needed', href: 'course-report.html' },
          { name: 'Hazard Communication', icon: 'fa-triangle-exclamation', cls: 'ci-amber', ai: true, due: 'Nov 20', assigned: n, completed: sc(41), demo: sc(24), adjusted: sc(15), gap: 'Cues to action', gapNote: 'early signal, 32% in' },
          { name: 'Lockout/Tagout', icon: 'fa-bolt', cls: 'ci-violet', ai: false, due: 'Dec 4', assigned: sc(96), completed: sc(12), demo: null, adjusted: null, gapNote: 'A standard course reports completion only.' }
        ];
        document.getElementById('courseGrid').innerHTML = courses.map(function (c) {
          var comp = B.pct(c.completed, c.assigned), demo = c.demo == null ? null : B.pct(c.demo, c.assigned);
          var inner =
            '<span class="cc-head"><span class="ci ' + c.cls + '"><i class="fa-solid ' + c.icon + '"></i></span><h2>' + c.name + '</h2></span>' +
            '<span class="cc-chips"><span class="course-tag due">Due ' + c.due + '</span>' +
              '<span class="course-tag ' + (c.ai ? 'ai">Adaptive' : 'std">Standard') + '</span>' +
              '<span class="course-tag std">' + c.assigned + ' assigned</span>' +
              (c.adjusted ? '<span class="path-tag recomp" title="Learners whose path was adjusted">' + B.pct(c.adjusted, c.completed) + '% adjusted</span>' : '') + '</span>' +
            (demo == null ? '<span class="cc-hero na">Completion only</span>' : '<span class="cc-hero">' + demo + '%<small>showed they can do it</small></span>') +
            '<span class="cc-bars"><span class="dbar"><span class="dbar-track"><span class="dbar-fill comp" style="width:' + comp + '%"></span></span><span class="dbar-val"><b>' + comp + '%</b> completed</span></span>' +
            (demo == null ? '' : '<span class="dbar"><span class="dbar-track"><span class="dbar-fill demo" style="width:' + demo + '%"></span></span><span class="dbar-val"><b>' + demo + '%</b> demonstrated</span></span>') + '</span>' +
            '<span class="cc-gap"><i class="fa-solid ' + (c.gap ? 'fa-magnifying-glass-chart' : 'fa-circle-info') + '"></i>' +
              (c.gap ? 'Biggest gap: <b>' + c.gap + '</b> · ' + c.gapNote : c.gapNote) + '</span>';
          return c.href ? '<a class="rp-card course-card" href="' + c.href + '">' + inner + '</a>' : '<div class="rp-card course-card">' + inner + '</div>';
        }).join('');
      })();

    </script>
    <script src="../../../../designtoolbox/toolbox.js?v=1.1.0"></script>
</body>
</html>
