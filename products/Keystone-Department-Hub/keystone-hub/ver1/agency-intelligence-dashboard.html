<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agency Intelligence — Readiness Hub</title>

<!--
  Agency Intelligence — the build surface from the Readiness Hub PRD.

  Views:
    · Agency Intelligence home — Dashboards tab (dense sortable/filterable/paginated
      management table, plus a card view), AI access tab (homepage Agency Intelligence
      grants + a full audit log of every question answered) and AI groups tab (the one
      place live-rule groups are created, edited, duplicated and deleted)
    · Build view — the two-pane dashboard canvas + Agency Intelligence, the docked
      text-only chat. Charts land on the canvas, never in the chat.

  Admin-facing: dashboards are published to job titles / individuals with
  access reconciliation, or scheduled out as a report. Reuses the Readiness Hub
  data layer, primitives, and chart renderers.

  Reskinned on Vector web components: vaadin-text-field for search and naming,
  vaadin-button throughout, vwc-paginator for the table pager,
  vwc-sortable-header for column sorting, vaadin-dialog for the publish and
  export flows, vwc-toggle-button-group for the view/mode switches. The publish
  dialog's audience tabs are the Vector "Selection List" design pattern:
  vaadin-grid + vaadin-grid-selection-column on the left, a vwc-drawer with a
  vwc-headline on the right itemising the selection.
-->

<link rel="stylesheet" href="styles.css">

<!-- Vector Web Components — core + themes + Open Sans + Font Awesome -->
<script type="module" src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.22.3/core.iife.js"></script>
<script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.9.3/styles.js"></script>
<link rel="stylesheet" href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
  /* ====================================================================
     PAGE HEADER + TABS
     ==================================================================== */
  /* Back to the hub — same pill the Prioritization settings page uses. */
  .cp-topbar { display: flex; align-items: center; gap: 14px; padding: 18px 0 0; flex-wrap: wrap; }
  .cp-backlink {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 13px 7px 9px; border-radius: 999px;
    background: var(--surface-1); border: 1px solid var(--ink-200);
    color: var(--ink-800); font-size: 13px; font-weight: 600;
    text-decoration: none; box-shadow: var(--elev-1); cursor: pointer;
    transition: background 0.15s;
  }
  .cp-backlink:hover { background: var(--surface-3); color: var(--ink-900); }
  .cp-page { padding: 4px 0 40px; }
  .cp-page-head { display: flex; align-items: flex-end; gap: 16px; padding: 20px 0 14px; }
  /* Page title at the design system's 40px H1 — same rung as the hub greeting. */
  .cp-page-head h1 {
    font-family: var(--font-display); font-weight: 600; font-size: 40px;
    line-height: 1.1; letter-spacing: -1px; color: var(--ink-900); margin: 0;
  }
  .cp-page-head p { font-size: 14px; color: var(--ink-500); margin: 8px 0 0; max-width: 640px; line-height: 1.5; }
  .cp-tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--ink-100); margin-bottom: 20px; }
  .cp-tab {
    display: inline-flex; align-items: center; gap: 7px; padding: 9px 2px 11px;
    background: transparent; border: none; cursor: pointer; font-family: inherit;
    font-size: 14.5px; font-weight: 600; color: var(--ink-500);
  }
  .cp-tab:hover { color: var(--ink-700); }
  .cp-tab.is-on { color: var(--ink-900); box-shadow: inset 0 -2px 0 var(--lumo-primary-color); }
  .cp-tab .attn {
    font-family: var(--font-numeric); font-size: 11px; font-weight: 700;
    color: var(--lumo-error-text-color); background: var(--lumo-error-color-10pct);
    border-radius: 999px; padding: 1px 7px; font-variant-numeric: tabular-nums;
  }

  /* ====================================================================
     DASHBOARDS TABLE + CARDS
     ==================================================================== */
  .cp-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .cp-search { flex: 1 1 260px; max-width: 360px; min-width: 200px; }
  .cp-seg {
    display: inline-flex; align-items: stretch; border: 1px solid var(--ink-200);
    border-radius: 999px; background: var(--surface-1); overflow: hidden; box-shadow: var(--elev-1);
  }
  .cp-seg button {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; cursor: pointer;
    border: none; background: transparent; color: var(--ink-700);
    font-size: 14px; font-weight: 500; font-family: inherit; transition: background 0.15s;
  }
  .cp-seg button + button { border-left: 1px solid var(--ink-100); }
  .cp-seg button:hover:not(.is-on) { background: var(--surface-3); }
  .cp-seg button .n {
    font-family: var(--font-numeric); font-weight: 700; font-size: 13px; line-height: 1;
    color: var(--ink-500); font-variant-numeric: tabular-nums;
  }
  .cp-seg button.is-on .n { color: inherit; }

  .cp-table-card {
    background: var(--surface-1); border-radius: 16px; border: 1px solid var(--ink-100);
    overflow: hidden; box-shadow: var(--elev-1);
  }
  .cp-table-scroll { overflow-x: auto; }
  table.cp-table { width: 100%; border-collapse: collapse; min-width: 1010px; }
  table.cp-table thead th {
    padding: 10px 8px; text-align: left; background: var(--surface-2);
    border-bottom: 1px solid var(--ink-100);
    font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--ink-500);
  }
  table.cp-table thead th.is-num { text-align: right; }
  .cp-table vwc-sortable-header::part(button) {
    font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
    color: var(--ink-500); padding: 0;
  }
  tr.cp-row { cursor: pointer; transition: background 0.12s; }
  tr.cp-row > td { padding: 10px 8px; border-bottom: 1px solid var(--ink-100); vertical-align: middle; }
  tr.cp-row:last-child > td { border-bottom: none; }
  tr.cp-row:hover > td { background: var(--surface-3); }
  tr.cp-row > td:first-child { border-left: 3px solid transparent; padding-left: 11px; }
  .cp-dash-name { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .cp-dash-icon {
    width: 32px; height: 32px; border-radius: 8px; background: var(--amber-100); color: var(--amber-700);
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .cp-dash-name .t {
    font-size: 14px; font-weight: 600; color: var(--ink-900); line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cp-dash-name .s { font-size: 11px; color: var(--ink-500); }
  .cp-num { font-family: var(--font-numeric); font-size: 14px; font-weight: 600; color: var(--ink-700); text-align: right; font-variant-numeric: tabular-nums; }
  .cp-status {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 700; white-space: nowrap;
  }
  /* The build bar's status badge when it carries the Unpublish menu. Same pill
     as the read-out — the colour still has to say "published" at a glance —
     plus the affordances a <button> needs to stop looking like a label: the
     caret, a pointer, and a hover/open state. font: inherit because a <button>
     otherwise drops to the UA font and the pill stops matching its twin in the
     table. */
  .cp-status--menu {
    font-family: inherit; font-size: 11px; font-weight: 700;
    cursor: pointer; padding-right: 6px;
    transition: filter 0.12s, box-shadow 0.12s;
  }
  .cp-status--menu:hover { filter: brightness(0.97); }
  .cp-status--menu[aria-expanded="true"] { box-shadow: 0 0 0 3px var(--teal-50); }
  .cp-status--menu:focus-visible { outline: 2px solid var(--lumo-primary-color); outline-offset: 2px; }
  .cp-sources { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; align-items: center; }
  .cp-sources .dot { width: 12px; height: 12px; border-radius: 4px; margin: 0 auto; }
  .cp-pill-count {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
    background: var(--surface-3); border: 1px solid var(--ink-100);
    font-size: 12px; font-weight: 600; color: var(--ink-700); white-space: nowrap;
  }
  .cp-aud-title {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700;
    color: var(--teal-600); background: var(--teal-50); border: 1px solid var(--teal-100);
    padding: 3px 8px; border-radius: 999px;
  }
  .cp-aud-ind {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600;
    color: var(--ink-600); background: var(--surface-3); padding: 3px 8px; border-radius: 999px;
  }
  /* Access-list mode: does this audience keep itself current? Outline + dot
     rather than a filled chip, so it reads as a different CLASS of fact from the
     composition chips beside it (which are all filled). The dot colour is set
     inline from AUDIENCE_MODES so the vocabulary lives in one place. */
  .cp-aud-mode {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 700;
    color: var(--ink-700); background: transparent; border: 1px solid var(--ink-200);
    padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  }
  .cp-aud-mode .dot { width: 6px; height: 6px; border-radius: 999px; flex-shrink: 0; }
  .cp-cardgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(288px, 1fr)); gap: 14px; }
  .cp-dcard {
    display: flex; flex-direction: column; background: var(--surface-1); border-radius: 14px;
    border: 1px solid var(--ink-100); box-shadow: var(--elev-1); cursor: pointer; overflow: hidden;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.08s;
  }
  .cp-dcard:hover { border-color: var(--amber-300); box-shadow: var(--elev-2); transform: translateY(-2px); }
  .cp-dcard-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 16px; border-top: 1px solid var(--ink-100); background: var(--surface-2);
  }
  .cp-empty-table {
    background: var(--surface-1); border-radius: 16px; border: 1px solid var(--ink-100);
    padding: 48px 20px; text-align: center;
  }
  /* Centred under the table, with no card of its own. vwc-paginator's :host sets
     `width:100%`, `justify-content:flex-end` and a `--lumo-base-color` background
     — that background IS the white box, and flex-end is what pins the controls
     right. Since the host stays full width, centring means overriding the host's
     OWN justification, not centring the host inside the row. Outer-page rules
     beat :host rules, so plain selectors are enough here. */
  .cp-pager-row { display: flex; margin-top: 14px; }
  .cp-pager-row vwc-paginator { background: transparent; justify-content: center; }

  /* Dashboards empty state */
  .cp-first-run {
    background: var(--surface-1); border: 1px dashed var(--ink-200); border-radius: 22px;
    padding: 72px 24px; text-align: center;
  }
  .cp-first-run h2 { font-family: var(--font-display); font-weight: 600; font-size: 34px; color: var(--ink-900); margin: 20px 0 8px; }
  .cp-first-run p { font-size: 15.5px; color: var(--ink-500); max-width: 480px; margin: 0 auto 26px; line-height: 1.55; }

  /* ====================================================================
     BUILD VIEW
     ==================================================================== */
  .cp-build { display: flex; flex-direction: column; min-height: calc(100vh - 120px); }
  /* Wraps rather than overflowing. The bar carries a lot — back, name, saved
     chip, status, export, publish, the mode toggle, and now the dashboard's
     date range — and at laptop widths that total can exceed the column. Left
     unwrapped it pushed the page into a horizontal scroll instead of moving
     the trailing controls onto a second line. No effect at widths where it
     already fits. */
  .cp-build-bar {
    display: flex; align-items: center; gap: 14px; padding: 18px 0 14px;
    flex-wrap: wrap; row-gap: 10px;
  }
  /* ---- One control height across the bar ----
     The range picker, Export, Manage audience / Publish, the status badge and
     the Edit/Preview group read as a single band of controls, so they share a
     single height. Each was previously sized by whatever rule happened to own
     it, and they landed on four different values — 40px Vector buttons, a 35px
     segmented group, a 28px badge and a 32px range picker — which is what made
     the row look assembled rather than designed.

     The Vector button takes a direct height and nothing else: measured against
     this build, --vaadin-button-height, --lumo-size-m and --lumo-button-size
     all leave it at 40px, because the theme pins the height inside the
     component. So `height` it is. Its internal label box is 28px, which clears
     32 without clipping. Everything else is a plain element and takes an
     explicit height with border-box, since these pills carry a 1px border.
     Scoped to .cp-build-bar on purpose: the same controls appear at their own
     scale elsewhere. */
  .cp-build-bar vaadin-button { height: 32px; }
  /* ---- Secondary buttons wear the range picker's neutral ----
     Export, Manage audience and the Back pill were outlined and lettered in
     primary blue, which reads as three calls to action sitting beside a date
     control that is plainly a control. They take .kx-dashrange-btn's palette
     instead — --ink-200 border, --ink-800 text, white ground — so the bar has
     one neutral register and the only blue left in it is Publish, which IS the
     call to action.

     Both properties are needed and they are not redundant: the Vector theme
     draws the secondary border from currentColor, so --vaadin-button-text-color
     alone would recolour the border too, and --vaadin-button-border is what
     lets the outline sit a step lighter than the label. Verified against this
     build — --vaadin-button-background is ignored here, but the secondary
     ground is already #fff, which is what --surface-1 is anyway.

     Hover matches the range picker rather than Lumo's default, which is a 2%
     wash of currentColor and nearly invisible once the text is grey. */
  .cp-build-bar vaadin-button[theme~="secondary"] {
    --vaadin-button-text-color: var(--ink-800);
    --vaadin-button-border: 1px solid var(--ink-200);
  }
  .cp-build-bar vaadin-button[theme~="secondary"]:hover {
    --vaadin-button-border: 1px solid var(--ink-300);
    background: var(--surface-3);
  }
  /* Icons are deliberately NOT given a lighter colour of their own: the range
     picker draws its calendar glyph in the same --ink-800 as its label, so
     inheriting is what actually matches it. */
  .cp-build-bar .kx-dashrange-btn,
  .cp-build-bar .cp-status,
  .cp-build-bar .cp-modes { height: 32px; box-sizing: border-box; }
  /* The segmented group is a 32px shell with 3px of padding, so its buttons
     fill the 26px that leaves rather than setting their own height. */
  .cp-build-bar .cp-modes { align-items: center; }
  .cp-build-bar .cp-modes button { height: 26px; padding: 0 11px; }
  .cp-build-name {
    font-family: var(--font-display); font-weight: 600; font-size: 24px; color: var(--ink-900);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cp-saved { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-400); white-space: nowrap; }
  /* Segmented control — pill track with pill segments, matching .cp-seg. */
  .cp-modes { display: flex; gap: 3px; background: var(--surface-3); padding: 3px; border-radius: var(--radius-pill); }
  .cp-modes button {
    display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: var(--radius-pill);
    border: none; cursor: pointer; font-size: 12px; font-weight: 600; font-family: inherit;
    background: transparent; color: var(--ink-500);
  }
  .cp-modes button.is-on { background: var(--surface-1); color: var(--ink-900); box-shadow: var(--elev-1); }
  /* Three panes: chat · Parameters · canvas (DOM order is reversed by
     .dock-left so the chat lands on the left). Chat and Parameters are sticky,
     viewport-tall columns; the canvas scrolls with the page. */
  .cp-panes { flex: 1; display: flex; gap: 14px; min-height: 0; align-items: flex-start; }
  .cp-panes.dock-left { flex-direction: row-reverse; }
  .cp-canvas { flex: 1; min-width: 0; }
  /* Rows are a fixed 48px track (KXCanvas.GRID.ROW) and every card spans a whole
     number of them, so cards in a row always end level. `stretch` — not `start` —
     is what makes a card actually fill the rows it claims. Keep ROW/GAP here in
     sync with GRID in agency-intel-canvas.js; the resize drag does its snapping
     off those numbers. */
  .cp-grid {
    display: grid; grid-template-columns: repeat(12, 1fr); grid-auto-rows: 48px;
    column-gap: 14px; row-gap: 14px; align-items: stretch;
  }
  /* Below 900px everything goes full width and heights go back to content —
     a fixed row span on a one-column stack just clips things. */
  @media (max-width: 900px) {
    .cp-grid { grid-auto-rows: auto; }
    .cp-grid > * { grid-column: 1 / -1 !important; grid-row: auto !important; }
    /* Both selectors, because .cp-panes.dock-left (two classes) out-specifies a
       bare .cp-panes and a media query adds no specificity of its own. Without
       the second selector the left-docked layout never stacks, and .cpv-panel's
       width:100% below then eats the whole row and starves the canvas to 0px.
       align-items:stretch because the cross axis is horizontal once stacked, and
       the wide layout's flex-start would otherwise shrink-wrap the canvas to its
       content instead of filling the column. */
    .cp-panes, .cp-panes.dock-left { flex-direction: column; align-items: stretch; }
  }

  .cpw-card {
    background: var(--surface-1); border: 1px solid var(--ink-100); border-radius: 14px;
    box-shadow: var(--elev-1); padding: 14px; display: flex; flex-direction: column; min-width: 0;
    transition: border-color 0.15s, box-shadow 0.15s;
    /* min-height:0 lets the card shrink to its row span instead of its content;
       overflow:hidden keeps a too-tall chart from spilling past the border. */
    position: relative; min-height: 0; overflow: hidden;
  }
  .cpw-card:hover { border-color: var(--ink-200); }
  /* The ⋮ menu is positioned inside the card, and the card clips its content
     to keep tall charts within the border — which also cut the menu off at
     the card's bottom edge, hiding its last rows (Export, Remove widget).
     While the menu is open the card stops clipping and rises above its
     neighbours so the whole menu shows, whatever the card's height. */
  .cpw-card.is-menu-open { overflow: visible; z-index: 20; }
  .cpw-card.is-selected { border-color: var(--amber-400); box-shadow: 0 0 0 3px var(--amber-50); }
  .cpw-card:focus-visible { outline: 2px solid var(--lumo-primary-color); outline-offset: 2px; }
  .cpw-card-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .cpw-icon {
    width: 24px; height: 24px; border-radius: 6px; background: var(--amber-100); color: var(--amber-700);
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .cpw-title {
    font-size: 13.5px; font-weight: 700; color: var(--ink-900);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  .cpw-kebab {
    width: 28px; height: 28px; border-radius: var(--radius-pill); border: none; background: transparent;
    color: var(--ink-400); display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .cpw-kebab:hover { background: var(--surface-3); color: var(--ink-700); }
  /* Only rendered when a widget sits OUTSIDE the dashboard's window — see
     .cpw-horizon in styles.css. Widgets that follow the dashboard range show
     nothing here; the range is stated once, on the dashboard bar. */
  .cpw-range { margin-top: 6px; }

  /* Step 3 of the widget builder: what used to be a date-range select is now
     a statement of which window the widget will inherit. */
  .cp-range-note {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 12px; border-radius: 10px;
    background: var(--surface-2); border: 1px solid var(--ink-100);
    font-size: 12px; color: var(--ink-600); line-height: 1.5;
  }
  .cp-range-note b { color: var(--ink-800); font-weight: 700; }
  .cpw-body { margin-top: 12px; flex: 1; min-height: 0; overflow: auto; }

  /* ---------------------------------------------------------------------
     Edit mode: drag the header to reorder, drag the corner to resize.
     Both are pointer affordances; the keyboard equivalent is Enter to pick a
     card up, then arrows to move it and Shift+arrows to resize it (see
     agency-intel-page.js). Nothing here renders outside edit mode.
     --------------------------------------------------------------------- */
  .cpw-card.is-editable .cpw-card-head { cursor: grab; }
  .cpw-card.is-editable .cpw-card-head:active { cursor: grabbing; }
  /* The kebab and the range control sit inside the drag surface, so they have
     to opt back out of the grab cursor. */
  .cpw-card.is-editable .cpw-card-head button { cursor: pointer; }

  .cpw-grip {
    display: inline-flex; align-items: center; flex-shrink: 0; margin-left: -4px;
    color: var(--ink-300); opacity: 0; transition: opacity 0.15s;
  }
  .cpw-card.is-editable:hover .cpw-grip,
  .cpw-card.is-editable:focus-within .cpw-grip,
  .cpw-card.is-grabbed .cpw-grip { opacity: 1; }

  .cpw-resize {
    position: absolute; right: 1px; bottom: 1px; width: 22px; height: 22px;
    padding: 0; border: none; background: none; cursor: nwse-resize;
    opacity: 0; transition: opacity 0.15s;
  }
  .cpw-resize::after {
    content: ''; position: absolute; right: 6px; bottom: 6px; width: 8px; height: 8px;
    border-right: 2px solid var(--ink-300); border-bottom: 2px solid var(--ink-300);
    border-bottom-right-radius: 3px;
  }
  .cpw-card.is-editable:hover .cpw-resize,
  .cpw-card.is-editable:focus-within .cpw-resize { opacity: 1; }
  .cpw-resize:hover::after { border-color: var(--amber-500); }

  /* Lifted while dragging. The card keeps its place in the grid and is moved in
     the DOM as the pointer crosses its neighbours, so the layout you see during
     the drag is the layout you get on drop. */
  .cpw-card.is-dragging {
    opacity: 0.55; border-style: dashed; border-color: var(--amber-400);
    box-shadow: none; z-index: 2;
  }
  .cpw-card.is-resizing {
    border-color: var(--amber-400); box-shadow: 0 0 0 3px var(--amber-50); z-index: 2;
    user-select: none;
  }
  /* Picked up by keyboard — needs to read as "held" without a cursor to explain it. */
  .cpw-card.is-grabbed {
    border-color: var(--amber-500); border-style: dashed;
    box-shadow: 0 0 0 3px var(--amber-50); z-index: 2;
  }
  .cpw-card.is-dragging *, .cpw-card.is-resizing * { pointer-events: none; }

  /* Follows the cursor during a drag: "8 x 5" while resizing, "Position 3 of 6"
     while reordering. One element, reused by both. */
  .cp-drag-chip {
    position: fixed; z-index: 9999; pointer-events: none;
    background: var(--ink-900); color: var(--surface-1);
    font-family: var(--font-numeric); font-size: 12px; font-weight: 700;
    letter-spacing: 0.3px; padding: 5px 9px; border-radius: 7px;
    box-shadow: var(--elev-2); white-space: nowrap;
  }

  /* Keyboard help + the reorder/resize announcements. Present for screen
     readers, never painted. */
  /* Row actions column — fixed narrow, never grows with the table. */
  .cp-row-act { width: 44px; text-align: right; padding-right: 10px !important; }
  .cp-kebab {
    width: 28px; height: 28px; border-radius: 7px; border: none; background: transparent;
    color: var(--ink-400); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.12s, color 0.12s;
  }
  .cp-kebab:hover { background: var(--surface-3); color: var(--ink-800); }
  .cp-kebab[aria-expanded="true"] { background: var(--surface-3); color: var(--ink-900); }

  /* The "Published to" cell is a button: it answers "who has this?" and is
     therefore also the place to act on the answer. Styled as the plain cell
     it replaced until hovered, so the table doesn't grow a row of buttons. */
  .cp-aud-cell {
    display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 3px 6px; margin: -3px -6px; border: 1px solid transparent;
    border-radius: 8px; background: none; cursor: pointer;
    font-family: inherit; text-align: left;
  }
  .cp-aud-cell:hover { background: var(--surface-3); border-color: var(--ink-200); }
  .cp-aud-cell:focus-visible { outline: 2px solid var(--lumo-primary-color); outline-offset: 1px; }

  /* Permission-level pill on a dashboard-access grant row. "Manage all" is
     amber because it is the consequential one — it reaches other people's
     work — and should never look like the quiet default. */
  .cp-lvl {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 8px; border-radius: 999px;
    background: var(--surface-3); color: var(--ink-600);
    border: 1px solid var(--ink-200);
    font-size: 11px; font-weight: 700; white-space: nowrap;
  }
  .cp-lvl.is-manage {
    background: var(--amber-50); color: var(--amber-700); border-color: var(--amber-300);
  }
  .cp-lvl-btn {
    display: inline-flex; align-items: center; gap: 2px; flex-shrink: 0;
    background: none; border: none; padding: 2px; border-radius: 8px;
    cursor: pointer; font-family: inherit;
  }
  .cp-lvl-btn:hover { background: var(--surface-3); }

  /* Level chooser in the grant dialog. */
  .cp-lvl-pick { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .cp-lvl-opt {
    display: flex; align-items: center; gap: 11px; text-align: left;
    padding: 11px 12px; border-radius: 11px; cursor: pointer; font-family: inherit;
    border: 1.5px solid var(--ink-200); background: var(--surface-1);
    transition: border-color 0.12s, background 0.12s;
  }
  .cp-lvl-opt:hover { border-color: var(--ink-300); }
  .cp-lvl-opt.is-on { border-color: var(--teal-400); background: var(--teal-50); }
  .cp-lvl-opt .ic {
    width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
    background: var(--surface-3); color: var(--ink-600);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cp-lvl-opt.is-on .ic { background: var(--teal-100); color: var(--teal-600); }
  .cp-lvl-opt .t { display: block; font-size: 13.5px; font-weight: 700; color: var(--ink-900); }
  .cp-lvl-opt .s { display: block; font-size: 11.5px; color: var(--ink-500); margin-top: 1px; line-height: 1.4; }

  /* "You can build, but not grant" — what a non-admin with build rights sees
     where the Access tab would be. */
  .cp-access-note {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 11px 13px; margin-bottom: 14px;
    background: var(--surface-2); border: 1px solid var(--ink-100);
    border-radius: 11px; font-size: 12.5px; color: var(--ink-600); line-height: 1.5;
  }

  .cp-sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .cpw-grip, .cpw-resize { transition: none; }
  }

  /* Table-widget controls (.cpw-tbar / .cpw-tfoot / table.cpw-table) live in
     styles.css — the Hub's published dashboards render the same engine, and
     styles.css is the sheet both pages load. */
  .cpw-shimmer {
    background: linear-gradient(90deg, var(--ink-100) 25%, var(--surface-3) 37%, var(--ink-100) 63%);
    background-size: 400% 100%; animation: shimmer 1.4s ease infinite;
  }
  .cpw-text::part(input-field) { background: var(--surface-2); }

  /* ---------------------------------------------------------------------
     The ghost slot where the next widget lands. Lives in .cp-grid as a
     sibling of the cards, sized like a small widget (6 of 12 columns, 4 row
     tracks), and is replaced by the draft card the moment a widget is in
     progress. Deliberately quiet — Parameters is always live, so this opens
     nothing; it only marks the spot and hands focus to Parameters on click.
     --------------------------------------------------------------------- */
  .cpw-add {
    grid-column: span 6; grid-row: span 4;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; padding: 18px; min-width: 0; min-height: 0; text-align: center;
    font-family: inherit; cursor: pointer;
    background: transparent; border: 1.5px dashed var(--ink-200); border-radius: 14px;
    transition: border-color 0.15s;
  }
  .cpw-add:hover { border-color: var(--amber-300); }
  .cpw-add:focus-visible { outline: 2px solid var(--lumo-primary-color); outline-offset: 2px; }
  .cpw-add-title { font-size: 13px; font-weight: 700; color: var(--ink-400); }
  .cpw-add:hover .cpw-add-title { color: var(--ink-600); }
  /* Capped in ch so the sentence wraps to two tidy lines at any tile width. */
  .cpw-add-sub { font-size: 12px; line-height: 1.45; max-width: 34ch; color: var(--ink-400); }
  /* Stacked single-column, the grid's row track is gone (see .cp-grid above),
     so the slot needs a height of its own. */
  @media (max-width: 900px) { .cpw-add { min-height: 140px; } }
  @media (prefers-reduced-motion: reduce) { .cpw-add { transition: none; } }

  .cp-canvas-empty {
    background: var(--surface-1); border: 1px dashed var(--ink-200); border-radius: 18px;
    min-height: 460px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px;
  }
  .cp-canvas-empty h2 { font-family: var(--font-display); font-weight: 600; font-size: 24px; color: var(--ink-900); margin: 14px 0 6px; }
  .cp-canvas-empty p { font-size: 13.5px; color: var(--ink-500); max-width: 420px; margin: 0; line-height: 1.55; }
  .cp-canvas-empty p b { color: var(--ink-800); font-weight: 700; }

  /* Agency Intelligence dock.

     FIXED height, not stretched. It used to carry `align-self: stretch`, so it
     took the height of the canvas beside it and changed size whenever the
     canvas did — add a widget from chat and the panel you were typing into
     grew under your hands; open a two-widget dashboard and it was 544px, a
     six-widget one and it was 610. The conversation is not a function of what
     is on the canvas, so its container should not be either.

     Sticky because a fixed height needs it: on a long dashboard the canvas
     scrolls well past one viewport, and a panel that is exactly one viewport
     tall would scroll away and leave you typing off-screen. Stretching used to
     hide that by making the panel as tall as the canvas. */
  .cpv-panel {
    width: 376px; flex-shrink: 0; align-self: flex-start; display: flex; flex-direction: column;
    background: var(--surface-1); border: 1px solid var(--ink-100); border-radius: 16px;
    box-shadow: var(--elev-1); overflow: hidden; min-height: 0;
    height: calc(100vh - 160px);
    position: sticky; top: 16px;
  }
  /* Stacked layout: the panel sits above/below the canvas rather than beside
     it, so a viewport-tall box and a sticky offset both stop making sense. */
  @media (max-width: 900px) {
    .cpv-panel {
      width: 100%; height: auto; max-height: 520px;
      position: static; align-self: stretch;
    }
  }
  /* Header icon buttons. Plain <button>, deliberately NOT vaadin-button
     theme="tertiary" — that theme underlines its label, which on an icon-only
     button renders as a rule under the glyph. Mirrors .kx-ai-iconbtn, the same
     control on the Hub's panel. */
  .cpv-iconbtn {
    width: 28px; height: 28px; flex-shrink: 0; border-radius: 7px; cursor: pointer;
    border: none; background: transparent; color: var(--ink-500); font-size: 14px;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.12s, color 0.12s;
  }
  .cpv-iconbtn:hover { background: var(--surface-3); color: var(--ink-800); }
  .cpv-iconbtn:focus-visible { outline: 2px solid var(--lumo-primary-color); outline-offset: 1px; }
  .cpv-collapsed-chev { margin-top: auto; color: var(--ink-400); font-size: 14px; }

  /* A column of two rows: the title line (mark, name, icon buttons) and the
     full-width intro note under it. The note used to be a short subtitle
     sharing the title's narrow middle column; at its current length that
     column wrapped it four deep and pushed the buttons to the middle of the
     stack, so it gets its own row and the panel's whole width. */
  .cpv-head {
    display: flex; flex-direction: column; gap: 8px; padding: 10px 14px 11px;
    border-bottom: 1px solid var(--ink-100); background: var(--surface-1);
  }
  .cpv-head-row { display: flex; align-items: center; gap: 11px; }
  .cpv-head-note {
    margin: 0; font-size: 12px; line-height: 1.5; color: var(--ink-500);
  }
  .cpv-thread { flex: 1; min-height: 220px; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 14px; }
  .cpv-user { display: flex; justify-content: flex-end; }
  .cpv-user .bubble {
    max-width: 85%; padding: 8px 12px; border-radius: 12px 12px 3px 12px;
    background: var(--surface-3); color: var(--ink-900); font-size: 13px; line-height: 1.45;
  }
  .cpv-ai { display: flex; gap: 10px; align-items: flex-start; }
  /* Replies are plain text beside the mark — no bubble — so the thread reads
     as a conversation, and the only boxed things in it are references. */
  .cpv-ai .bubble { padding: 3px 0 0; font-size: 13px; line-height: 1.5; color: var(--ink-800); }
  .cpv-ref {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px;
    border-radius: 9px; border: 1px solid var(--amber-300); background: var(--amber-50);
    font-family: inherit; color: var(--ink-800); cursor: pointer;
  }
  .cpv-ref:hover { border-color: var(--amber-400); }
  .cpv-ref-ic {
    width: 28px; height: 28px; flex-shrink: 0; border-radius: 7px; background: var(--surface-1);
    border: 1px solid var(--amber-200); color: var(--amber-700); display: inline-flex; align-items: center; justify-content: center;
  }
  .cpv-ref-t { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 12px; line-height: 16px; }
  .cpv-ref-t b { color: var(--amber-700); font-weight: 700; }
  .cpv-ref-t small { font-size: 12px; color: var(--ink-500); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cpv-note {
    display: flex; align-items: center; gap: 8px; padding-left: 36px;
    font-size: 11px; line-height: 14px; color: var(--ink-500);
  }
  .cpv-note strong { font-weight: 700; color: var(--ink-700) !important; }
  .cpv-note-ic {
    flex-shrink: 0; width: 14px; height: 14px; border-radius: 999px; border: 1.5px solid var(--ink-300);
    box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 7px;
  }
  .cpv-added {
    display: inline-flex; align-items: center; gap: 7px; align-self: flex-start;
    padding: 5px 10px; background: var(--teal-50); border: 1px solid var(--teal-100);
    border-radius: 8px; font-size: 11.5px; color: var(--teal-600); font-weight: 600;
  }
  .cpv-choice {
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--ink-200);
    background: var(--surface-1); color: var(--ink-800); font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .cpv-choice:hover { border-color: var(--amber-400); background: var(--amber-50); }
  .cpv-input-wrap { border-top: 1px solid var(--ink-100); padding: 10px 11px 9px; background: var(--surface-1); }
  .cpv-input {
    display: flex; align-items: flex-end; gap: 8px; background: var(--surface-1);
    border: 1px solid var(--ink-300); border-radius: 11px; padding: 5px 6px 5px 12px;
  }
  .cpv-input:focus-within { border-color: var(--amber-400); box-shadow: 0 0 0 3px var(--amber-50); }
  .cpv-input textarea {
    flex: 1; resize: none; border: none; outline: none; background: transparent;
    font-family: inherit; font-size: 13px; color: var(--ink-900);
    padding: 5px 0; min-height: 44px; max-height: 140px; line-height: 1.4;
  }
  .cpv-dot { width: 6px; height: 6px; border-radius: 99px; background: var(--ink-500); display: inline-block; animation: cpv-bounce 1s ease-in-out infinite; }
  @keyframes cpv-bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-3px); opacity: 1; } }
  .cpv-collapsed {
    width: 56px; align-self: flex-start; flex-shrink: 0;
    height: calc(100vh - 160px); position: sticky; top: 16px; box-sizing: border-box;
    background: var(--surface-1); border: 1px solid var(--ink-100); border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 0;
    cursor: pointer; box-shadow: var(--elev-1);
  }
  .cpv-collapsed .vlabel { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--ink-600); }

  /* ====================================================================
     PARAMETERS PANE — the widget builder
     Three panes after the reusable AI chat component's "Full" preset:
     Agency Intelligence (chat) · Parameters · canvas. Every control that
     defines a widget lives in this pane; the canvas only previews it.
     ==================================================================== */
  .cp-params {
    width: 380px; flex-shrink: 0; align-self: flex-start; display: flex; flex-direction: column;
    background: var(--surface-2); border: 1px solid var(--ink-100); border-radius: 16px;
    box-shadow: var(--elev-1); overflow: hidden; min-height: 0;
    height: calc(100vh - 160px); position: sticky; top: 16px;
  }
  /* Below 1500px the canvas is the pane that gives: chat and Parameters narrow
     a little so the draft widget still reads at widget scale. */
  @media (max-width: 1500px) { .cp-params { width: 350px; } .cpv-panel { width: 340px; } }
  @media (max-width: 900px) { .cp-params { width: 100%; height: auto; max-height: 560px; position: static; align-self: stretch; } }
  .cp-params-h {
    flex-shrink: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; min-height: 46px; padding: 6px 14px;
    background: var(--surface-1); border-bottom: 1px solid var(--ink-100); font-size: 13px;
  }
  .cp-params-h .t { font-weight: 700; font-size: 14px; color: var(--ink-900); }
  .cp-params-h .sp, .cp-pcard-h .sp { flex: 1; }
  .cp-params-pill { flex-shrink: 0; display: flex; justify-content: center; padding: 10px 14px 0; }
  .cp-params-modes button { font-size: 12px; padding: 5px 12px; }
  .cp-params-body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px 16px; }
  .cp-params-foot {
    flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    background: var(--surface-1); border-top: 1px solid var(--ink-100);
  }
  .cp-params-foot vaadin-button { height: 34px; flex-shrink: 0; }
  .cp-plink {
    border: none; background: none; padding: 0; font-family: inherit; font-size: 11.5px; font-weight: 700;
    color: var(--lumo-primary-text-color); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap;
  }
  .cp-plink:hover { text-decoration: underline; }
  .cp-vsep { width: 1px; height: 14px; background: var(--ink-200); }
  .cp-cnt {
    min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--lumo-primary-color);
    color: white; font-size: 10px; line-height: 16px; text-align: center;
  }
  .cp-plink[aria-pressed="true"] .cp-cnt { background: var(--ink-900); }
  /* one white card per parameter */
  .cp-pcard { background: var(--surface-1); border: 1px solid var(--ink-200); border-radius: 10px; padding: 9px 10px 10px; }
  .cp-pcard + .cp-pcard { margin-top: 10px; }
  .cp-pcard.is-changed { border-color: var(--lumo-primary-color); box-shadow: 0 0 0 2px var(--lumo-primary-color-10pct); }
  .cp-pcard-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12.5px; }
  .cp-pcard-h .t { font-weight: 700; color: var(--ink-900); }
  .cp-req { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--coral-500, var(--lumo-error-text-color)); }
  .cp-pcount { font-size: 11px; color: var(--ink-500); }
  .cp-prov { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; }
  .cp-prov.chat { color: var(--amber-600); }
  .cp-prov.you { color: var(--ink-500); }
  .cp-phint { margin: 8px 0 0; font-size: 11.5px; line-height: 1.45; color: var(--ink-500); }
  .cp-pintro { margin: 0 0 10px; font-size: 12.5px; line-height: 1.5; color: var(--ink-500); }
  .cp-ptitle { font-size: 14px; font-weight: 700; color: var(--ink-900); margin-bottom: 4px; }
  .cp-pask { margin: 14px 0 0; text-align: center; font-size: 12px; color: var(--ink-500); }
  .cp-pask button { background: none; border: none; padding: 0; color: var(--lumo-primary-text-color); font-weight: 700; cursor: pointer; font-size: 12px; font-family: inherit; }
  .cp-pwarn {
    display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; padding: 10px 12px; border-radius: 9px;
    background: var(--amber-50); border: 1px solid var(--amber-200); color: var(--amber-700); font-size: 12px; line-height: 1.5;
  }
  .cp-pwarn span { color: var(--ink-800); }
  /* the metric list: flat rows, grouped by category */
  .cp-pcard.metric { padding-bottom: 4px; }
  .cp-prows { margin: 0 -10px; }
  .cp-pgroup { padding: 5px 10px 2px; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-400); }
  .cp-prow {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 4px 10px; border: none; background: none;
    font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--ink-800); text-align: left; cursor: pointer;
  }
  .cp-prow:hover { background: var(--surface-3); }
  .cp-prow:focus-visible { outline: 2px solid var(--lumo-primary-color); outline-offset: -2px; }
  .cp-prow .ic {
    width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0; background: var(--amber-100); color: var(--amber-700);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cp-prow .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cp-prow.is-on { background: var(--amber-50); box-shadow: inset 3px 0 0 var(--amber-500); color: var(--ink-900); }
  .cp-prow.is-on .ic { background: var(--amber-500); color: white; }
  /* segmented control: dark when selected, dashed when not available */
  .cp-seg2 { display: flex; flex-wrap: wrap; gap: 4px; }
  .cp-seg2 button {
    display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 7px;
    border: 1px solid var(--ink-200); background: var(--surface-1); font-family: inherit; font-size: 12px; font-weight: 600;
    color: var(--ink-700); cursor: pointer; white-space: nowrap;
  }
  .cp-seg2 button:hover:not([disabled]) { border-color: var(--ink-300); }
  .cp-seg2 button[aria-pressed="true"] { background: var(--ink-900); border-color: var(--ink-900); color: white; }
  .cp-seg2 button[disabled] { border-style: dashed; background: var(--surface-2); color: var(--ink-300); cursor: not-allowed; }
  .cp-seg2 button:focus-visible { outline: 2px solid var(--lumo-primary-color); outline-offset: 1px; }
  /* the suggestion the chat (or the catalog) makes, ghosted where it would land */
  .cp-sugg {
    display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 10px; border-radius: 7px;
    border: 1px dashed var(--amber-300); font-size: 12px; color: var(--ink-600); line-height: 1.4;
  }
  .cp-sugg > span { flex: 1; }
  .cp-sugg b { color: var(--ink-900); }
  .cp-sugg-accept {
    height: 24px; padding: 0 9px; border-radius: 6px; border: none; background: var(--ink-900); color: white;
    font-family: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer;
  }
  /* inherited time range: tinted, linked, read-only here */
  .cp-inh { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--ink-500); }
  .cp-inh-box {
    display: flex; flex-direction: column; gap: 3px; padding: 7px 10px 8px; border: 1px solid var(--ink-100);
    border-radius: 7px; background: var(--surface-2); font-size: 12.5px;
  }
  .cp-inh-box .v { color: var(--ink-900); font-weight: 600; }
  .cp-inh-box .r { font-size: 11px; line-height: 1.45; color: var(--ink-500); }
  .cp-catchips { display: flex; flex-wrap: wrap; gap: 6px; }
  .cp-cat-chip {
    display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px;
    cursor: pointer; font-family: inherit; font-size: 11.5px; font-weight: 600;
    background: var(--surface-1); color: var(--ink-600); border: 1px solid var(--ink-200);
  }
  .cp-cat-chip.is-on { background: var(--amber-50); color: var(--amber-700); border-color: var(--amber-400); }
  /* Advanced — the option list, then a drill-in panel per option */
  .cp-adv-list { display: flex; flex-direction: column; gap: 8px; }
  .cp-adv-opt {
    display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px; border-radius: 10px;
    cursor: pointer; text-align: left; width: 100%; font-family: inherit;
    background: var(--surface-1); border: 1px solid var(--ink-200); transition: border-color .15s, background .15s;
  }
  .cp-adv-opt:hover { border-color: var(--amber-400); background: var(--amber-50); }
  .cp-adv-opt .ico {
    width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; background: var(--amber-100); color: var(--amber-700);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cp-adv-opt .txt { flex: 1; min-width: 0; }
  .cp-adv-opt .t { display: block; font-size: 13px; font-weight: 700; color: var(--ink-900); }
  .cp-adv-opt .d { display: block; font-size: 11.5px; color: var(--ink-500); line-height: 1.45; margin-top: 2px; }
  .cp-adv-opt .chev { flex-shrink: 0; align-self: center; color: var(--ink-300); display: inline-flex; }
  .cp-adv-back {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; margin-bottom: 10px;
    background: var(--surface-1); border: 1px solid var(--ink-200); color: var(--ink-600);
    font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .cp-adv-back:hover { border-color: var(--ink-300); }
  .cp-b-field {
    width: 100%; padding: 8px 11px; font-size: 13px; font-family: inherit; box-sizing: border-box;
    border: 1px solid var(--ink-200); border-radius: 8px; background: var(--surface-1); outline: none; color: var(--ink-900);
  }
  .cp-b-field:focus { border-color: var(--amber-400); box-shadow: 0 0 0 3px var(--amber-50); }
  textarea.cp-b-field { line-height: 1.6; resize: vertical; }
  .cp-ideas { display: flex; flex-direction: column; gap: 8px; }
  .cp-idea {
    display: flex; align-items: center; gap: 9px; padding: 9px 10px; border-radius: 10px; width: 100%;
    text-align: left; cursor: pointer; font-family: inherit;
    background: var(--surface-1); border: 1px solid var(--ink-200); transition: border-color .15s;
  }
  .cp-idea.is-on { background: var(--amber-50); border-color: var(--amber-400); }
  .cp-idea .box {
    width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0; background: var(--surface-1); border: 1px solid var(--ink-300);
    display: inline-flex; align-items: center; justify-content: center; color: white;
  }
  .cp-idea.is-on .box { background: var(--amber-500); border-color: var(--amber-500); }
  .cp-idea .ico {
    width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0; background: var(--amber-100); color: var(--amber-700);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cp-idea .txt { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; color: var(--ink-900); line-height: 1.35; }

  /* The draft widget on the canvas: the real card, dashed, badged, inert */
  .cpw-card.is-draft { border: 1.5px dashed var(--amber-400); box-shadow: 0 0 0 3px var(--amber-50); cursor: default; }
  .cpw-card.is-draft:hover { border-color: var(--amber-400); }
  .cpw-card.is-draft .cpw-kebab { display: none; }
  .cpw-card.is-draft.is-flash { animation: cpw-flash 1s ease-out; }
  @keyframes cpw-flash { 0% { box-shadow: 0 0 0 4px var(--amber-400); } 100% { box-shadow: 0 0 0 3px var(--amber-50); } }
  @media (prefers-reduced-motion: reduce) { .cpw-card.is-draft.is-flash { animation: none; } }
  .cpw-draft-badge {
    position: absolute; top: 10px; right: 12px; z-index: 2; font-size: 10px; font-weight: 700; letter-spacing: .05em;
    text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: var(--amber-100); color: var(--amber-700);
  }

  /* ====================================================================
     PRINT / PDF EXPORT
     "Export as PDF" renders the delivered-report layout into #kxPrint and
     opens the print dialog, where the browser offers Save as PDF. On
     screen #kxPrint is hidden; when printing it is the ONLY thing shown,
     so none of the app chrome (dock, dialogs, chat) reaches the page.
     ==================================================================== */
  #kxPrint { display: none; }
  @media print {
    body.kx-printing > *:not(#kxPrint) { display: none !important; }
    body.kx-printing #kxPrint { display: block !important; }
    body.kx-printing { background: white; }
    /* Let charts and cards break sensibly across pages. */
    body.kx-printing .cpw-card { break-inside: avoid; page-break-inside: avoid; box-shadow: none; }
    /* Print is paginated: a fixed row unit would slice cards across page breaks,
       so heights go back to content and only the column spans survive. */
    body.kx-printing .cp-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px;
      grid-auto-rows: auto; align-items: start; }
    body.kx-printing .cp-grid > * { grid-row: auto !important; }
    /* The dashboard's window is printed once in the document header, so a
       card carries text here only when it reports on a DIFFERENT window —
       a fixed forward horizon. That is already static text, so there is no
       control left to flatten; just size it for paper. */
    body.kx-printing .cpw-range { font-size: 11px; color: var(--ink-500); }
    body.kx-printing .cpw-kebab { display: none !important; }
    body.kx-printing .cpw-resize,
    body.kx-printing .cpw-grip { display: none !important; }
    /* A print page is paginated, not tiled — let cards take the height they need. */
    body.kx-printing .cpw-card { overflow: visible; }
    body.kx-printing .cpw-body { overflow: visible; }
    /* Table controls are screen affordances — a filter box and a pager on
       paper are furniture nobody can use. The report path already renders
       every row unpaginated; this is the belt to that braces, covering any
       table that reaches print through a path that kept its chrome. */
    body.kx-printing .cpw-tbar,
    body.kx-printing .cpw-tfoot { display: none !important; }
    body.kx-printing .cpw-tscroll { overflow: visible !important; }
    body.kx-printing table.cpw-table { break-inside: auto; }
    body.kx-printing table.cpw-table tr { break-inside: avoid; page-break-inside: avoid; }
    @page { margin: 14mm; }
  }

  /* ====================================================================
     AUDIENCE DIALOG — "Who sees it live?"
     Three tabs (job titles / named individuals / AI groups), a chat
     panel for building dynamic groups, and a sticky summary footer.
     ==================================================================== */
  .au-tabs { display: flex; gap: 3px; background: var(--surface-3); padding: 4px; border-radius: var(--radius-pill); margin-bottom: 16px; }
  .au-tabs button {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 10px; border-radius: var(--radius-pill); border: none; cursor: pointer;
    font-size: 12.5px; font-weight: 600; font-family: inherit;
    background: transparent; color: var(--ink-500);
  }
  .au-tabs button.is-on { background: var(--surface-1); color: var(--ink-900); box-shadow: var(--elev-1); }
  .au-pip {
    min-width: 17px; height: 17px; padding: 0 5px; border-radius: 99px;
    background: var(--teal-500); color: white; font-size: 10.5px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .au-tabbody { min-height: 330px; max-height: 46vh; overflow-y: auto; padding-right: 4px; }
  /* The min-height above keeps the audience picker from jumping as its list
     filters. The review step has no list — and with report delivery behind the
     Future-functionality flag it holds only the audience summary — so it sizes
     to its content instead of leaving a void above the footer. */
  .au-tabbody.is-short { min-height: 0; }
  .au-promise { font-size: 11.5px; color: var(--ink-500); margin: -8px 0 14px; }
  .au-saved-toggle {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: var(--radius-pill);
    cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; margin-bottom: 12px;
    background: var(--surface-2); border: 1px solid var(--ink-200); color: var(--ink-600);
  }
  .au-saved-toggle:hover { border-color: var(--ink-300); }
  /* Editing a saved group changes a live rule other dashboards may ride on. */
  .au-editing {
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
    padding: 9px 12px; border-radius: 10px; font-size: 12px; line-height: 1.45;
    background: var(--amber-50); border: 1px solid var(--amber-400); color: var(--ink-800);
  }
  .au-editing-text { flex: 1; }

  /* Job-title cards */
  .au-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .au-card, .au-row {
    display: flex; align-items: flex-start; gap: 10px; padding: 12px 13px; border-radius: 12px;
    cursor: pointer; text-align: left; width: 100%; font-family: inherit;
    background: var(--surface-1); border: 1px solid var(--ink-100);
    transition: border-color .13s, background .13s;
  }
  .au-card:hover, .au-row:hover { border-color: var(--teal-400); background: var(--teal-50); }
  .au-card.is-on, .au-row.is-on { border-color: var(--teal-400); background: var(--teal-50); }
  .au-check {
    width: 20px; height: 20px; border-radius: 6px; flex-shrink: 0; margin-top: 1px;
    border: 1px solid var(--ink-300); background: var(--surface-1);
    display: inline-flex; align-items: center; justify-content: center; color: white;
  }
  .au-card.is-on .au-check, .au-row.is-on .au-check { background: var(--teal-500); border-color: var(--teal-500); }
  .au-card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .au-card-title, .au-row-name { font-size: 13.5px; font-weight: 700; color: var(--ink-900); display: block; }
  .au-card-sub, .au-row-sub { font-size: 11.5px; color: var(--ink-500); display: block; }

  /* Individuals + saved-group rows */
  .au-row { align-items: center; padding: 9px 12px; }
  .au-list { display: flex; flex-direction: column; gap: 6px; }
  .au-saved { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .au-search {
    width: 100%; padding: 9px 12px; font-size: 13px; font-family: inherit; margin-bottom: 10px;
    border: 1px solid var(--ink-200); border-radius: 9px; background: var(--surface-1);
    outline: none; color: var(--ink-900);
  }
  .au-search:focus { border-color: var(--teal-400); box-shadow: 0 0 0 3px var(--teal-50); }
  .au-empty { padding: 24px; text-align: center; font-size: 12.5px; color: var(--ink-500); }
  .au-dup {
    flex-shrink: 0; font-size: 11px; font-weight: 600; color: var(--lumo-primary-text-color);
    padding: 4px 8px; border-radius: 7px;
  }
  .au-dup:hover { background: var(--surface-3); }
  .au-sec {
    font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase;
    color: var(--ink-500); margin-bottom: 8px;
  }
  .au-sec-n {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 17px; height: 17px; padding: 0 5px; margin-left: 7px;
    border-radius: 999px; background: var(--ink-100); color: var(--ink-600);
    font-size: 10.5px; letter-spacing: 0;
  }

  /* "Published to" — the itemised audience on the review step. One row per
     group / title / person, each with its own Remove, because a count chip
     ("2 groups") tells you how many but never who, and an audience you cannot
     enumerate is one you cannot revoke. */
  .au-roster {
    display: flex; flex-direction: column; gap: 1px;
    border: 1px solid var(--ink-100); border-radius: 10px; overflow: hidden;
    background: var(--ink-100);
  }
  .au-rrow {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; background: var(--surface-1);
  }
  /* The mark says which KIND of audience this is at a glance — a live rule
     behaves differently from a named person, and the row has to show that
     before the sub-line is read. */
  .au-rmark {
    width: 26px; height: 26px; border-radius: 7px; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .au-rmark--group  { background: var(--amber-50);  color: var(--amber-700); }
  .au-rmark--title  { background: var(--azure-300); color: var(--azure-600); }
  .au-rmark--person { background: var(--teal-50);   color: var(--teal-500); }
  .au-rdrop {
    width: 26px; height: 26px; flex-shrink: 0; border: none; background: none;
    border-radius: 7px; color: var(--ink-400); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.12s, color 0.12s;
  }
  .au-rdrop:hover { background: var(--coral-50); color: var(--coral-500); }
  .au-rdrop:focus-visible { outline: 2px solid var(--coral-400); outline-offset: 1px; }

  /* The "n of m selected — Select all" strip above the job-title grid and the
     roster list. Sits flush with the list it governs; the action is an .au-link
     so bulk selection reads as secondary to picking rows one at a time. */
  .au-bulk {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 9px; font-size: 11.5px; font-weight: 600; color: var(--ink-500);
  }
  .au-bulk .au-link { margin-right: -6px; }

  /* Selection + criteria chips */
  .au-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .au-chip {
    display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px 4px 10px;
    border-radius: 999px; background: var(--teal-50); border: 1px solid var(--teal-400);
    font-size: 11.5px; font-weight: 600; color: var(--ink-800);
  }
  .au-chip.is-neg { background: var(--amber-50); border-color: var(--amber-400); }
  .au-chip button {
    border: none; background: none; cursor: pointer; padding: 0; display: inline-flex;
    color: var(--ink-500); border-radius: 99px;
  }
  .au-chip button:hover { color: var(--ink-900); }

  /* Chat */
  .au-chat { border: 1px solid var(--ink-100); border-radius: 14px; background: var(--surface-2); padding: 12px; }
  .au-thread { max-height: 190px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .au-hint { font-size: 12.5px; color: var(--ink-500); line-height: 1.55; }
  .au-msg { display: flex; gap: 8px; align-items: flex-start; }
  .au-msg--me { justify-content: flex-end; }
  .au-msg--me span {
    background: var(--ink-900); color: white; padding: 8px 12px; border-radius: 13px 13px 3px 13px;
    font-size: 12.5px; max-width: 78%; line-height: 1.45;
  }
  .au-ai-mark {
    width: 22px; height: 22px; border-radius: 7px; flex-shrink: 0; color: white;
    background: linear-gradient(135deg, var(--amber-400), var(--coral-400));
    display: inline-flex; align-items: center; justify-content: center;
  }
  .au-bubble {
    background: var(--surface-1); border: 1px solid var(--ink-100); padding: 8px 12px;
    border-radius: 13px 13px 13px 3px; font-size: 12.5px; line-height: 1.45; max-width: 82%;
    color: var(--ink-800);
  }
  .au-choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .au-choices button {
    padding: 5px 11px; border-radius: 999px; cursor: pointer; font-family: inherit;
    font-size: 11.5px; font-weight: 600; background: var(--surface-1);
    border: 1px solid var(--ink-300); color: var(--ink-800);
  }
  .au-choices button:hover { border-color: var(--teal-400); background: var(--teal-50); }
  .au-starters { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .au-starters button {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: var(--radius-pill);
    cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600; text-align: left;
    background: var(--surface-1); border: 1px solid var(--ink-200); color: var(--ink-700);
  }
  .au-starters button:hover { border-color: var(--amber-400); background: var(--amber-50); }
  .au-rule { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 12px; }
  .au-rule-lbl {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
    color: var(--ink-400); margin-right: 2px;
  }
  .au-count {
    display: flex; align-items: center; gap: 7px; margin-top: 10px;
    font-size: 12.5px; color: var(--teal-600);
  }
  .au-count.is-zero { color: var(--amber-700); }
  .au-warn { color: var(--amber-700); font-size: 11.5px; display: inline-flex; align-items: center; gap: 3px; }
  .au-link {
    background: none; border: none; cursor: pointer; font-family: inherit; font-size: 12px;
    font-weight: 600; color: var(--lumo-primary-text-color); display: inline-flex;
    align-items: center; gap: 4px; padding: 4px 6px; border-radius: var(--radius-pill);
  }
  .au-link:hover { background: var(--surface-3); }
  .au-names {
    margin-top: 8px; display: flex; flex-direction: column; gap: 4px;
    font-size: 12px; color: var(--ink-700); padding-left: 22px;
  }
  .au-names i { color: var(--ink-400); font-style: normal; font-size: 11px; }
  .au-more { color: var(--ink-400); font-size: 11.5px; }
  .au-save { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .au-save .au-search { margin-bottom: 0; }
  .au-input { display: flex; gap: 8px; align-items: flex-end; margin-top: 12px; }
  .au-input textarea {
    flex: 1; resize: none; padding: 9px 12px; border-radius: 10px; font-family: inherit;
    font-size: 12.5px; line-height: 1.5; border: 1px solid var(--ink-200);
    background: var(--surface-1); color: var(--ink-900); outline: none; min-height: 38px;
  }
  .au-input textarea:focus { border-color: var(--teal-400); box-shadow: 0 0 0 3px var(--teal-50); }
  .au-input button {
    /* Circular send action — square footprint under full rounding. */
    width: 34px; height: 34px; border-radius: var(--radius-pill); border: none; cursor: pointer; flex-shrink: 0;
    background: var(--ink-900); color: white; display: inline-flex; align-items: center; justify-content: center;
  }

  /* Review step + footer */
  .au-review {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px;
    background: var(--teal-50); border: 1px solid var(--teal-400); color: var(--ink-800);
    font-size: 13px;
  }
  .au-review span { flex: 1; }
  .au-note {
    display: flex; align-items: center; gap: 6px; margin-top: 10px;
    font-size: 11.5px; color: var(--ink-500);
  }
  .au-sched {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--ink-100); background: var(--surface-2); cursor: pointer;
  }
  .au-sched b { display: block; font-size: 13px; }
  .au-sched span span { display: block; font-size: 11px; color: var(--ink-500); }
  .au-foot {
    display: flex; align-items: center; gap: 10px; margin-top: 16px; padding-top: 6px;
  }
  .au-sum { flex: 1; font-size: 12.5px; color: var(--ink-600); }

  /* ---- Selection List (Vector design pattern) ----
     Each audience tab is a vaadin-grid with a selection column on the left and
     a vwc-drawer on the right that itemises the selection. The drawer rides
     the `relative-drawer` theme so it stays inside this box rather than the
     viewport, and flips to an overlay below its breakpoint. Heights are fixed
     because the grid virtualises — it needs a box to fill. */
  .au-tabbody--list { min-height: 0; max-height: none; overflow: visible; padding-right: 0; }
  .au-sel {
    height: min(440px, 52vh);
    --vwc-drawer-offset-top: 0px; --vwc-drawer-width: fit-content;
    border: 1px solid var(--ink-100); border-radius: 12px; overflow: hidden;
    background: var(--surface-1);
  }
  .au-sel-content { height: 100%; position: relative; }
  .au-grid { height: 100%; border: none; font-size: 13px; }
  .au-cell-name { font-weight: 600; color: var(--ink-900); }
  .au-cell-dim { color: var(--ink-500); }
  .au-cell-num { font-family: var(--font-numeric); font-weight: 600; font-variant-numeric: tabular-nums; }
  /* "Show selection" only matters once the panel is hidden — mirrors the
     pattern's external toggle, which disappears while the drawer is docked. */
  .au-sel-open { position: absolute; bottom: 12px; right: 12px; box-shadow: var(--elev-2); }
  .au-sel[open]:not([overlay]) .au-sel-open { display: none; }
  .au-sel-open-pip { background: white; color: var(--teal-600); margin-left: 6px; }
  .au-side {
    width: 264px; height: 100%; background: var(--surface-1);
    border-left: 1px solid var(--ink-100);
  }
  .au-side-head {
    padding: 8px 10px 8px 14px; background: var(--surface-1);
    box-shadow: var(--lumo-box-shadow-xs); position: relative; z-index: 1;
  }
  .au-side-icon { display: inline-flex; color: var(--teal-600); }
  .au-side-list {
    list-style: none; margin: 0; padding: 10px 12px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 6px;
  }
  .au-side-item {
    display: flex; align-items: center; gap: 6px; padding: 6px 4px 6px 10px;
    border: 1px solid var(--lumo-contrast-20pct); border-radius: 8px;
  }
  .au-side-name { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-900); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .au-side-sub { display: block; font-size: 11px; color: var(--ink-500); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .au-side-empty { padding: 16px 8px; text-align: center; font-size: 12px; color: var(--ink-500); line-height: 1.5; }
  /* The AI groups tab explains where groups come from and links there. */
  .au-manage {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    padding: 8px 12px; border-radius: 10px; font-size: 11.5px; line-height: 1.45;
    background: var(--amber-50); border: 1px solid var(--amber-400); color: var(--ink-700);
  }
  .au-manage-text { flex: 1; }
  .au-manage .au-link { white-space: nowrap; }

  /* ====================================================================
     DATA EXPLORER
     ==================================================================== */
  .ex-quickstart {
    display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px;
    border-radius: 12px; cursor: pointer; text-align: left; font-family: inherit;
    background: var(--surface-1); border: 1px solid var(--ink-200);
    transition: background 0.15s, border-color 0.15s;
  }
  .ex-quickstart:hover { border-color: var(--amber-400); background: var(--amber-50); }
  .ex-quickstart .ic {
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--amber-100); color: var(--amber-700);
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .ex-card {
    background: var(--surface-1); border: 1px solid var(--ink-100); border-radius: 14px;
    box-shadow: var(--elev-1); padding: 16px;
  }
  .ex-action {
    display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px;
    background: var(--surface-1); border: 1px solid var(--ink-200); color: var(--ink-600);
    font-size: 11.5px; font-weight: 600; cursor: pointer; font-family: inherit; flex-shrink: 0;
  }
  .ex-action:hover { border-color: var(--amber-400); background: var(--amber-50); }

  /* Send-as-report dialog controls */
  .ex-cad {
    display: flex; flex-direction: column; align-items: flex-start; gap: 5px;
    padding: 11px 12px; border-radius: 11px; cursor: pointer; font-family: inherit; text-align: left;
    background: var(--surface-1); border: 1px solid var(--ink-200);
  }
  .ex-cad.is-on { background: var(--amber-50); border-color: var(--amber-400); box-shadow: 0 0 0 2px var(--amber-50); }
  .ex-chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px;
    background: var(--surface-1); border: 1px solid var(--ink-200); color: var(--ink-700);
    font-size: 11.5px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .ex-chip:hover { border-color: var(--amber-400); }
  .ex-chip.is-on { background: var(--amber-50); border-color: var(--amber-400); color: var(--amber-700); }
  .ex-fmt {
    display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: 11px;
    cursor: pointer; font-family: inherit; text-align: left;
    background: var(--surface-1); border: 1px solid var(--ink-200);
  }
  .ex-fmt.is-on { background: var(--amber-50); border-color: var(--amber-400); }
  .ex-fmt .radio {
    width: 18px; height: 18px; border-radius: 999px; flex-shrink: 0;
    border: 1.5px solid var(--ink-300);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .ex-fmt.is-on .radio { border-color: var(--amber-400); }
  .ex-fmt .radio .dot { width: 9px; height: 9px; border-radius: 999px; background: var(--amber-400); }

  /* ====================================================================
     AI ACCESS TAB
     ==================================================================== */
  .cp-ai-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 18px; align-items: start; }
  @media (max-width: 1000px) { .cp-ai-grid { grid-template-columns: 1fr; } }
  .cp-panel {
    background: var(--surface-1); border: 1px solid var(--ink-100); border-radius: 16px;
    box-shadow: var(--elev-1); overflow: hidden;
  }
  .cp-panel-head { padding: 16px 18px 14px; border-bottom: 1px solid var(--ink-100); }
  .cp-panel-head h3 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: -0.3px; color: var(--ink-900); }
  .cp-panel-head p { margin: 5px 0 0; font-size: 12.5px; color: var(--ink-500); line-height: 1.5; }
  .cp-grant-row {
    display: flex; align-items: center; gap: 11px; padding: 11px 18px;
    border-bottom: 1px solid var(--ink-100);
  }
  .cp-grant-row:last-child { border-bottom: none; }
  /* AI groups tab — one row per saved live rule, same rhythm as a grant row. */
  .cp-groups-panel { max-width: 1040px; }
  .cp-group-mark {
    width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
    background: var(--amber-50); color: var(--amber-700);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cp-group-rule { font-size: 12px; color: var(--ink-600); margin-top: 2px; }
  .cp-group-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .cp-ent-dots { display: inline-flex; gap: 3px; }
  .cp-ent-dots .d { width: 10px; height: 10px; border-radius: 3px; }
  .cp-log-row { padding: 12px 18px; border-bottom: 1px solid var(--ink-100); }
  .cp-log-row:last-child { border-bottom: none; }
  .cp-outcome {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px;
    font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; white-space: nowrap;
  }
</style>
</head>
