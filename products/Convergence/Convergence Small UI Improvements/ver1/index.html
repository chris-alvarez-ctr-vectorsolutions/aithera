<!-- ===========================================================================
     CONVERGENCE - SMALL UI IMPROVEMENTS
     All seven areas in one navigable file. Use the top nav and the side nav to
     move between them exactly as a user would, and the bottom-centre flow map
     to see every screen side by side.

     Each area also has its own standalone file for sharing on its own:
       home.html            Area 7, the Home dashboard
       dashboard.html       Areas 1 + 2, the chrome and the shared token set
       training-plan.html   Areas 3 + 4, accordion list and card view
       catalog.html         Area 5, catalog table
       content-wizard.html  Area 6, the four wizard steps

     Everything shared lives in shared/ - styles.css (all tokens and rules),
     chrome.js (the app shell markup), data.js, views.js, app.js. Edit the
     design there once and every page in this folder picks it up.
     ======================================================================== -->
<script>window.PAGE = { route: 'guide', standalone: false };</script>
<script src="shared/data.js"></script>
<script src="shared/chrome.js"></script>
<script src="shared/views.js"></script>
<script src="shared/app.js"></script>
