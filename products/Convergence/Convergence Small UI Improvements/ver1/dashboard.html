<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convergence - Redesign guide</title>

    <script
    type="module"
    src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.19.0/core.iife.js">
    </script>

    <!-- Vector Web Components JavaScript -->
    <!-- Important! This should always be imported as script -->
    <script
    src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.5.0/styles.js">
    </script>

    <!-- Our Standard font face - Open Sans -->
    <link
    rel="stylesheet"
    href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css"
    />

    <!-- Font Awesome 6 Icons (Default Icon Library) -->
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <link rel="stylesheet" href="shared/styles.css"/>
</head>
<body>
<!-- ===========================================================================
     REDESIGN GUIDE (Areas 1 + 2: the chrome)

     Standalone page. The chrome (Area 1 side nav, Area 2 top nav + location
     picker + page header) and every render function live in shared/, so this
     file only declares which page it is. Top-nav and side-nav clicks navigate
     to the sibling page files, so each page opens and shares on its own.

     All six areas together in one navigable file: index.html

     Shows the redesigned side nav, the top-nav location picker and the shared token set.
     ======================================================================== -->
<script>window.PAGE = { route: 'guide', standalone: true };</script>
<script src="shared/data.js"></script>
<script src="shared/chrome.js"></script>
<script src="shared/views.js"></script>
<script src="shared/app.js"></script>

<!-- Review tooling: comment widget only. The flow map lives on index.html,
     which holds all six areas. NOT part of the product - do not ship this. -->
<script>window.TOOLBOX = { flowMap: false };</script>
<script src="../../../../designtoolbox/toolbox.js"></script>
</body>
</html>
