<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activities | Convergence LMS</title>

  <!-- Convergence chrome (topnav + admin sidenav + breadcrumb) -->
  <link rel="stylesheet" href="../_shell/chrome.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
  <!-- Vector design system: provides the themed badge (theme="badge ...") used for Type/Status pills -->
  <script type="module" src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.19.0/core.iife.js"></script>
  <script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.5.0/styles.js"></script>
  <!-- AG Grid (community) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.4/styles/ag-grid.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.4/styles/ag-theme-quartz.css"/>
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.4/dist/ag-grid-community.min.js"></script>

  <style>
    :root { --vblue:#0271ce; --vblue-hover:#015ba6; --vblue-10:#0271ce1a; }
    #cv-page { font-family:"Open Sans","Segoe UI",Arial,sans-serif; color:#1a1a2e; background:#f4f6f8; }
    .mgmt-page { padding:24px 28px 40px; max-width:1400px; }

    .mgmt-header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; }
    .mgmt-header h1 { font-size:22px; font-weight:700; color:#1a1a2e; }
    .mgmt-header .sub { font-size:13px; color:#6b7280; margin-top:3px; }

    .btn { font-family:inherit; font-size:13px; font-weight:600; border-radius:7px; padding:9px 15px; cursor:pointer; border:1px solid transparent; display:inline-flex; align-items:center; gap:7px; transition:background .12s,border-color .12s,color .12s; }
    .btn-primary { background:var(--vblue); color:#fff; }
    .btn-primary:hover { background:var(--vblue-hover); }
    .btn-secondary { background:#fff; color:#374151; border-color:#d4d9e0; }
    .btn-secondary:hover { background:#f3f4f6; }
    .btn-sm { padding:7px 12px; font-size:12.5px; }

    .mgmt-toolbar { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
    .search-wrap { position:relative; }
    .search-wrap i { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:#9ca3af; font-size:12px; }
    .search-wrap input { width:300px; height:36px; border:1px solid #d4d9e0; border-radius:7px; padding:0 12px 0 32px; font-family:inherit; font-size:13px; outline:none; background:#fff; }
    .search-wrap input:focus { border-color:var(--vblue); box-shadow:0 0 0 3px var(--vblue-10); }
    .filter-select { height:36px; border:1px solid #d4d9e0; border-radius:7px; padding:0 10px; font-family:inherit; font-size:13px; background:#fff; color:#374151; cursor:pointer; }

    /* AG Grid theming */
    .ag-theme-quartz {
      --ag-font-family:"Open Sans","Segoe UI",Arial,sans-serif;
      --ag-font-size:13px;
      --ag-header-background-color:#f8fafc;
      --ag-header-foreground-color:#475569;
      --ag-header-font-weight:600;
      --ag-row-hover-color:var(--vblue-10);
      --ag-selected-row-background-color:var(--vblue-10);
      --ag-border-color:#e5e9ef;
      --ag-row-border-color:#eef1f5;
      --ag-accent-color:var(--vblue);
      --ag-cell-horizontal-padding:16px;
      border:1px solid #e5e9ef; border-radius:10px; overflow:hidden; background:#fff;
      box-shadow:0 1px 3px rgba(16,24,40,.04);
    }
    /* Vertically center custom renderer content within each row */
    .ag-theme-quartz .ag-cell { display:flex; align-items:center; }

    /* Cell renderers */
    .cell-name-wrap { line-height:1.35; padding:7px 0; }
    .cell-name { font-weight:600; font-size:13.5px; color:#1a1a2e; }
    .cell-desc { font-size:11.5px; color:#9ca3af; margin-top:1px; max-width:480px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; white-space:normal; }
    .cell-version { font-size:12px; color:#475569; font-family:ui-monospace,"SF Mono",monospace; }
    .cell-loc { display:flex; align-items:flex-start; gap:6px; font-size:12.5px; color:#6b7280; }
    .cell-loc i { color:#9ca3af; font-size:11px; flex-shrink:0; margin-top:3px; }
    .cell-loc .loc-text { line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; white-space:normal; }

    /* Row actions */
    .row-actions { display:flex; gap:4px; align-items:center; }
    .row-action-btn { width:30px; height:30px; border:none; background:transparent; border-radius:6px; color:#6b7280; cursor:pointer; font-size:13px; display:inline-flex; align-items:center; justify-content:center; }
    .row-action-btn:hover { background:#eef1f5; color:#374151; }

    /* Floating row dropdown */
    .row-dropdown { position:fixed; background:#fff; border:1px solid #e5e9ef; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.14); z-index:9999; min-width:168px; padding:4px; }
    .row-dropdown-item { display:flex; align-items:center; gap:9px; width:100%; padding:8px 12px; border:none; background:none; font-family:inherit; font-size:13px; color:#374151; cursor:pointer; border-radius:6px; text-align:left; }
    .row-dropdown-item:hover { background:#f3f4f6; }
    .row-dropdown-item.danger { color:#dc2626; }
    .row-dropdown-item.danger:hover { background:#fee2e2; }
    .row-dropdown-item i { width:14px; text-align:center; font-size:12px; color:#9ca3af; }
    .row-dropdown-item.danger i { color:#dc2626; }
    .row-dropdown-divider { height:1px; background:#e5e9ef; margin:4px 0; }

    /* Requirement filter banner */
    .req-filter-banner { display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--vblue-10); border:1px solid #b6dcfa; border-radius:8px; padding:10px 14px; margin-bottom:12px; font-size:13px; color:#0b3d66; }
    .req-filter-banner.hidden { display:none; }
    .req-filter-banner > span > i { color:var(--vblue); margin-right:4px; }
    .rfb-clear { color:var(--vblue); font-weight:600; text-decoration:none; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
    .rfb-clear:hover { text-decoration:underline; }

    .grid-footer { display:flex; align-items:center; justify-content:space-between; font-size:12px; color:#6b7280; padding:10px 2px 0; }
  </style>
</head>
<body>

<div id="cv-page">
  <div class="mgmt-page">

    <div class="mgmt-header">
      <div>
        <h1>Activities</h1>
        <div class="sub">Manage the activity library. Activities are the building blocks of requirements.</div>
      </div>
      <div>
        <button class="btn btn-primary" onclick="alert('Activity creation is out of scope for this prototype.')">
          <i class="fa-solid fa-plus"></i> Create Activity
        </button>
      </div>
    </div>

    <div class="mgmt-toolbar">
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="quick-filter" placeholder="Search activities..." oninput="onSearch(this.value)"/>
      </div>
      <select class="filter-select" id="type-filter" onchange="onTypeFilter(this.value)">
        <option value="">All Types</option>
        <option value="Course">Course</option>
        <option value="Quiz">Quiz</option>
        <option value="Tasklist">Tasklist</option>
        <option value="Classroom">Classroom</option>
        <option value="Signature">Signature</option>
        <option value="Document">Document</option>
      </select>
      <div style="margin-left:auto">
        <button class="btn btn-secondary btn-sm"><i class="fa-solid fa-download"></i> Export</button>
      </div>
    </div>

    <div id="req-filter-banner" class="req-filter-banner hidden">
      <span><i class="fa-solid fa-filter"></i> Showing activities in requirement: <strong id="req-filter-name"></strong></span>
      <a href="Manage-Activities.html" class="rfb-clear">Show all activities <i class="fa-solid fa-xmark"></i></a>
    </div>

    <div id="act-grid" class="ag-theme-quartz" style="width:100%;"></div>
    <div class="grid-footer">
      <span id="row-count"></span>
      <span>Vector LMS, Convergence Training Edition</span>
    </div>

  </div>
</div>

<!-- Convergence chrome -->
<script>
  window.SHELL_CONFIG = { active: 'act-activities', parent: 'Activities', title: 'Activities' };
</script>
<script src="../_shell/chrome.js"></script>

<script>
const ACTS = [
  // Energy Isolation Fundamentals (3)
  { name:'Lockout/Tagout Basics',               desc:'Core training on energy isolation and tagout procedures',      type:'Course',    version:'v2.1', status:'Active', location:'Safety > Lockout/Tagout',           requirement:'Energy Isolation Fundamentals' },
  { name:'LOTO Knowledge Check',                desc:'Knowledge assessment for lockout/tagout fundamentals',         type:'Quiz',      version:'v1.4', status:'Active', location:'Safety > Lockout/Tagout',           requirement:'Energy Isolation Fundamentals' },
  { name:'Energy Isolation Field Verification', desc:'Verify zero-energy state in the field before service',         type:'Tasklist',  version:'v1.0', status:'Active', location:'Safety > Lockout/Tagout',           requirement:'Energy Isolation Fundamentals' },
  // Lockout Device Application (3)
  { name:'Lockout Device Selection',            desc:'Choosing the correct lock and tag for each energy source',     type:'Course',    version:'v1.2', status:'Active', location:'Safety > Lockout/Tagout',           requirement:'Lockout Device Application' },
  { name:'Device Application Demonstration',    desc:'Supervised demonstration of applying lockout devices',          type:'Tasklist',  version:'v1.0', status:'Active', location:'Safety > Lockout/Tagout',           requirement:'Lockout Device Application' },
  { name:'Lockout Device Quiz',                 desc:'Assessment on lockout device selection and use',               type:'Quiz',      version:'v1.1', status:'Active', location:'Safety > Lockout/Tagout',           requirement:'Lockout Device Application' },
  // Confined Space Atmospheric Testing (2)
  { name:'Atmospheric Testing Procedure',       desc:'Gas monitoring, sampling order, and entry thresholds',         type:'Course',    version:'v3.0', status:'Active', location:'Safety > Confined Space',           requirement:'Confined Space Atmospheric Testing' },
  { name:'Gas Meter Calibration',               desc:'Calibrate and bump-test the multi-gas meter before entry',     type:'Tasklist',  version:'v1.3', status:'Active', location:'Safety > Confined Space',           requirement:'Confined Space Atmospheric Testing' },
  // PPE Selection & Inspection (2)
  { name:'PPE Selection Fundamentals',          desc:'Choosing the right protective equipment for the hazard',       type:'Course',    version:'v2.0', status:'Active', location:'Safety > PPE',                      requirement:'PPE Selection & Inspection' },
  { name:'PPE Inspection Checklist',            desc:'Pre-use inspection of personal protective equipment',          type:'Tasklist',  version:'v1.5', status:'Active', location:'Safety > PPE',                      requirement:'PPE Selection & Inspection' },
  // Forklift Pre-Operation Inspection (3)
  { name:'Forklift Daily Inspection',           desc:'Pre-shift inspection checklist for powered industrial trucks',  type:'Tasklist',  version:'v2.2', status:'Active', location:'Operations > Forklift',             requirement:'Forklift Pre-Operation Inspection' },
  { name:'Forklift Safety Course',              desc:'Operating fundamentals and stability for forklifts',           type:'Course',    version:'v4.1', status:'Active', location:'Operations > Forklift',             requirement:'Forklift Pre-Operation Inspection' },
  { name:'Forklift Operation Quiz',             desc:'Assessment on safe forklift operation',                        type:'Quiz',      version:'v1.0', status:'Draft',  location:'Operations > Forklift',             requirement:'Forklift Pre-Operation Inspection' },
  // Fire Watch Procedures (1)
  { name:'Fire Watch Responsibilities',         desc:'Instructor-led walkthrough of fire-watch and permit steps',   type:'Classroom', version:'v1.1', status:'Draft',  location:'Safety > Hot Work',                 requirement:'Fire Watch Procedures' },
  // Respirator Fit Test (2)
  { name:'Respirator Fit Test Record',          desc:'Capture and acknowledge respirator fit test results',          type:'Signature', version:'v2.0', status:'Active', location:'Safety > Respiratory Protection',   requirement:'Respirator Fit Test' },
  { name:'Respirator Selection Guide',          desc:'Reference for selecting the appropriate respirator',           type:'Document',  version:'v1.3', status:'Active', location:'Safety > Respiratory Protection',   requirement:'Respirator Fit Test' },
  // Rigging & Load Charts (3)
  { name:'Rigging Load Chart Reading',          desc:'Reading load charts and selecting rigging hardware',           type:'Course',    version:'v2.3', status:'Active', location:'Operations > Rigging',              requirement:'Rigging & Load Charts' },
  { name:'Sling & Hardware Inspection',         desc:'Inspect slings, shackles, and hardware before a lift',         type:'Tasklist',  version:'v1.2', status:'Active', location:'Operations > Rigging',              requirement:'Rigging & Load Charts' },
  { name:'Rigging Safety Quiz',                 desc:'Assessment on rigging selection and load handling',            type:'Quiz',      version:'v1.0', status:'Active', location:'Operations > Rigging',              requirement:'Rigging & Load Charts' },
];

function nameRenderer(p){
  const a = p.data;
  return `<div class="cell-name-wrap">
    <div class="cell-name">${a.name}</div>
    <div class="cell-desc">${a.desc}</div>
  </div>`;
}
function typeRenderer(p){
  return `<span theme="badge">${p.value}</span>`;
}
function versionRenderer(p){
  return `<span class="cell-version">${p.value}</span>`;
}
function statusRenderer(p){
  const conn = p.value === 'Active' ? 'success' : (p.value === 'Draft' ? 'contrast' : 'warning');
  return `<span theme="badge dot ${conn}">${p.value}</span>`;
}
function locationRenderer(p){
  return `<span class="cell-loc"><i class="fa-solid fa-folder"></i><span class="loc-text">${p.value}</span></span>`;
}

/* Shared floating dropdown */
let activeDropdown = null;
function closeDropdown(){ if (activeDropdown){ activeDropdown.remove(); activeDropdown = null; } }
function showDropdown(btn, items){
  closeDropdown();
  const dd = document.createElement('div');
  dd.className = 'row-dropdown';
  items.forEach(item => {
    if (item.divider){
      const d = document.createElement('div');
      d.className = 'row-dropdown-divider';
      dd.appendChild(d);
    } else {
      const b = document.createElement('button');
      b.className = 'row-dropdown-item' + (item.danger ? ' danger' : '');
      b.innerHTML = `<i class="${item.icon}"></i> ${item.label}`;
      b.addEventListener('click', e => { e.stopPropagation(); closeDropdown(); item.action(); });
      dd.appendChild(b);
    }
  });
  document.body.appendChild(dd);
  activeDropdown = dd;
  const rect = btn.getBoundingClientRect();
  dd.style.top = (rect.bottom + 4) + 'px';
  dd.style.right = (window.innerWidth - rect.right) + 'px';
  setTimeout(() => document.addEventListener('click', closeDropdown, { once:true }), 0);
}

function actionsRenderer(p){
  const e = document.createElement('div');
  e.className = 'row-actions';
  e.innerHTML =
    `<button class="row-action-btn" title="Edit"><i class="fa-solid fa-pencil"></i></button>
     <button class="row-action-btn" title="More actions"><i class="fa-solid fa-ellipsis-vertical"></i></button>`;
  const [editBtn, moreBtn] = e.querySelectorAll('button');
  editBtn.addEventListener('click', () => alert('Activity editor is out of scope for this prototype.'));
  moreBtn.addEventListener('click', ev => {
    ev.stopPropagation();
    showDropdown(moreBtn, [
      { icon:'fa-regular fa-eye', label:'Preview', action: () => alert('Preview "' + p.data.name + '" (prototype).') },
      { icon:'fa-regular fa-copy', label:'Duplicate', action: () => alert('Duplicate "' + p.data.name + '" (prototype).') },
      { divider: true },
      { icon:'fa-regular fa-trash-can', label:'Delete', danger:true, action: () => {
        if (confirm('Delete "' + p.data.name + '"? This is a prototype and will only remove the row.')) {
          gridApi.applyTransaction({ remove:[p.data] }); updateCount();
        }
      }},
    ]);
  });
  return e;
}

let gridApi = null;
let typeValue = '';
let reqValue  = '';

const gridOptions = {
  rowData: ACTS,
  columnDefs: [
    { headerName:'Activity',    field:'name',     flex:2, minWidth:280, cellRenderer:nameRenderer, getQuickFilterText:p=>p.data.name+' '+p.data.desc },
    { headerName:'Type',        field:'type',     width:130, cellRenderer:typeRenderer },
    { headerName:'Version',     field:'version',  width:100, cellRenderer:versionRenderer },
    { headerName:'Status',      field:'status',   width:120, cellRenderer:statusRenderer },
    { headerName:'Location',    field:'location', flex:2, minWidth:220, cellRenderer:locationRenderer },
    { headerName:'Actions', colId:'actions', width:110, cellRenderer:actionsRenderer, sortable:false, filter:false, resizable:false, pinned:'right' },
  ],
  defaultColDef: { sortable:true, resizable:true, filter:true },
  rowHeight: 68,
  headerHeight: 44,
  animateRows: true,
  suppressCellFocus: true,
  pagination: true,
  paginationPageSize: 10,
  paginationPageSizeSelector: [10, 25, 50],
  domLayout: 'autoHeight',
  isExternalFilterPresent: () => typeValue !== '' || reqValue !== '',
  doesExternalFilterPass: (node) =>
    (!typeValue || node.data.type === typeValue) &&
    (!reqValue  || node.data.requirement === reqValue),
  onGridReady: () => updateCount(),
  onModelUpdated: () => updateCount(),
};

function onSearch(v){ if (gridApi) gridApi.setGridOption('quickFilterText', v); }
function onTypeFilter(v){ typeValue = v; if (gridApi) gridApi.onFilterChanged(); }
function updateCount(){
  if (!gridApi) return;
  const shown = gridApi.getDisplayedRowCount();
  const el = document.getElementById('row-count');
  if (el) el.textContent = 'Showing ' + shown + ' of ' + ACTS.length + ' activities';
}

document.addEventListener('click', () => closeDropdown());

document.addEventListener('DOMContentLoaded', () => {
  const rq = new URLSearchParams(location.search).get('requirement');
  if (rq){
    reqValue = decodeURIComponent(rq);
    const banner = document.getElementById('req-filter-banner');
    const nm = document.getElementById('req-filter-name');
    if (nm) nm.textContent = reqValue;
    if (banner) banner.classList.remove('hidden');
  }
  const el = document.getElementById('act-grid');
  if (window.agGrid && el) gridApi = agGrid.createGrid(el, gridOptions);
});
</script>
</body>
</html>
