<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qualifications | Convergence LMS</title>

  <!-- Convergence chrome (topnav + admin sidenav + breadcrumb) -->
  <link rel="stylesheet" href="../_shell/chrome.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
  <!-- Vector design system: provides the themed badge (theme="badge ...") used for Status pills -->
  <script type="module" src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.19.0/core.iife.js"></script>
  <script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.5.0/styles.js"></script>
  <!-- AG Grid (community) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.4/styles/ag-grid.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.4/styles/ag-theme-quartz.css"/>
  <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.4/dist/ag-grid-community.min.js"></script>

  <style>
    :root { --vblue:#0271ce; --vblue-hover:#015ba6; --vblue-10:#0271ce1a; }
    #cv-page { font-family:"Open Sans","Segoe UI",Arial,sans-serif; color:#1a1a2e; background:#f4f6f8; }
    .mgmt-page { padding:24px 28px 40px; max-width:1400px; }

    .mgmt-header { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; }
    .mgmt-header h1 { font-size:22px; font-weight:700; color:#1a1a2e; }
    .mgmt-header .sub { font-size:13px; color:#6b7280; margin-top:3px; }

    .btn { font-family:inherit; font-size:13px; font-weight:600; border-radius:7px; padding:9px 15px; cursor:pointer; border:1px solid transparent; display:inline-flex; align-items:center; gap:7px; transition:background .12s,border-color .12s,color .12s; }
    .btn-primary { background:var(--vblue); color:#fff; }
    .btn-primary:hover { background:var(--vblue-hover); }
    .btn-secondary { background:#fff; color:#374151; border-color:#d4d9e0; }
    .btn-secondary:hover { background:#f3f4f6; }
    .btn-sm { padding:7px 12px; font-size:12.5px; }

    .create-wrap { position:relative; flex-shrink:0; }
    .create-menu { position:absolute; top:calc(100% + 6px); right:0; background:#fff; border:1px solid #e5e9ef; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.14); z-index:50; min-width:280px; overflow:hidden; padding:6px; }
    .create-menu.hidden { display:none; }
    .create-menu a { display:flex; gap:11px; padding:10px 11px; border-radius:6px; text-decoration:none; color:#1a1a2e; align-items:flex-start; }
    .create-menu a:hover { background:var(--vblue-10); }
    .create-menu a i { color:var(--vblue); font-size:14px; width:18px; text-align:center; margin-top:2px; }
    .create-menu a strong { display:block; font-size:13px; font-weight:600; }
    .create-menu a span { display:block; font-size:11.5px; color:#6b7280; margin-top:1px; }

    .mgmt-toolbar { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
    .search-wrap { position:relative; }
    .search-wrap i { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:#9ca3af; font-size:12px; }
    .search-wrap input { width:300px; height:36px; border:1px solid #d4d9e0; border-radius:7px; padding:0 12px 0 32px; font-family:inherit; font-size:13px; outline:none; background:#fff; }
    .search-wrap input:focus { border-color:var(--vblue); box-shadow:0 0 0 3px var(--vblue-10); }
    .filter-select { height:36px; border:1px solid #d4d9e0; border-radius:7px; padding:0 10px; font-family:inherit; font-size:13px; background:#fff; color:#374151; cursor:pointer; }

    /* AG Grid theming */
    .ag-theme-quartz {
      --ag-font-family:"Open Sans","Segoe UI",Arial,sans-serif;
      --ag-font-size:13px;
      --ag-header-background-color:#f8fafc;
      --ag-header-foreground-color:#475569;
      --ag-header-font-weight:600;
      --ag-row-hover-color:var(--vblue-10);
      --ag-selected-row-background-color:var(--vblue-10);
      --ag-border-color:#e5e9ef;
      --ag-row-border-color:#eef1f5;
      --ag-accent-color:var(--vblue);
      --ag-cell-horizontal-padding:16px;
      border:1px solid #e5e9ef; border-radius:10px; overflow:hidden; background:#fff;
      box-shadow:0 1px 3px rgba(16,24,40,.04);
    }

    /* Cell renderers */
    .cell-name-wrap { line-height:1.35; padding:7px 0; }
    .cell-name { font-weight:600; font-size:13.5px; }
    .cell-name a { color:#1a1a2e; text-decoration:none; }
    .cell-name a:hover { color:var(--vblue); text-decoration:underline; }
    .cell-desc { font-size:11.5px; color:#9ca3af; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:480px; }
    .ai-tag-sm { display:inline-flex; align-items:center; gap:4px; font-size:9.5px; font-weight:700; color:#6d28d9; background:#f3e8ff; padding:1px 6px; border-radius:10px; margin-left:7px; vertical-align:middle; }

    /* Criteria / order cells */
    .cell-meta { display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:#374151; }
    .cell-meta i { color:#9ca3af; font-size:12px; }
    /* Requirements count link */
    .req-link { display:inline-flex; align-items:center; gap:6px; color:var(--vblue); font-weight:600; font-size:13px; text-decoration:none; }
    .req-link:hover { text-decoration:underline; }
    .req-link i { font-size:10px; }
    /* Location path cell */
    .cell-loc { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:#6b7280; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cell-loc i { color:#9ca3af; font-size:11px; flex-shrink:0; }

    /* Row actions */
    .row-actions { display:flex; gap:4px; align-items:center; }
    .row-action-btn { width:30px; height:30px; border:none; background:transparent; border-radius:6px; color:#6b7280; cursor:pointer; font-size:13px; display:inline-flex; align-items:center; justify-content:center; }
    .row-action-btn:hover { background:#eef1f5; color:#374151; }

    /* Floating row dropdown */
    .row-dropdown { position:fixed; background:#fff; border:1px solid #e5e9ef; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.14); z-index:9999; min-width:168px; padding:4px; }
    .row-dropdown-item { display:flex; align-items:center; gap:9px; width:100%; padding:8px 12px; border:none; background:none; font-family:inherit; font-size:13px; color:#374151; cursor:pointer; border-radius:6px; text-align:left; }
    .row-dropdown-item:hover { background:#f3f4f6; }
    .row-dropdown-item.danger { color:#dc2626; }
    .row-dropdown-item.danger:hover { background:#fee2e2; }
    .row-dropdown-item i { width:14px; text-align:center; font-size:12px; color:#9ca3af; }
    .row-dropdown-item.danger i { color:#dc2626; }

    .grid-footer { display:flex; align-items:center; justify-content:space-between; font-size:12px; color:#6b7280; padding:10px 2px 0; }
  </style>
</head>
<body>

<div id="cv-page">
  <div class="mgmt-page">

    <div class="mgmt-header">
      <div>
        <h1>Qualifications</h1>
        <div class="sub">Manage qualifications for your organization. Click a name to open it in the builder.</div>
      </div>
      <div class="create-wrap">
        <button class="btn btn-primary" onclick="toggleCreate(event)">
          <i class="fa-solid fa-plus"></i> Create Qualification <i class="fa-solid fa-chevron-down" style="font-size:10px"></i>
        </button>
        <div class="create-menu hidden" id="create-menu">
          <a href="Manual-Qualification-Builder.html">
            <i class="fa-solid fa-pen-to-square"></i>
            <div><strong>Create manually</strong><span>Start from a blank builder</span></div>
          </a>
          <a href="AI-Qualification-Builder.html?ai=1">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
            <div><strong>Build with AI</strong><span>Describe it and let AI draft it</span></div>
          </a>
        </div>
      </div>
    </div>

    <div class="mgmt-toolbar">
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="quick-filter" placeholder="Search qualifications..." oninput="onSearch(this.value)"/>
      </div>
      <select class="filter-select" id="status-filter" onchange="onStatusFilter(this.value)">
        <option value="">All Statuses</option>
        <option value="Active">Active</option>
        <option value="Under Review">Under Review</option>
        <option value="Draft">Draft</option>
      </select>
      <div style="margin-left:auto">
        <button class="btn btn-secondary btn-sm"><i class="fa-solid fa-download"></i> Export</button>
      </div>
    </div>

    <div id="qual-grid" class="ag-theme-quartz" style="height:560px; width:100%;"></div>
    <div class="grid-footer">
      <span id="row-count"></span>
      <span>Vector LMS, Convergence Training Edition</span>
    </div>

  </div>
</div>

<!-- Convergence chrome -->
<script>
  window.SHELL_CONFIG = { active: 'qual-quals', parent: 'Qualifications', title: 'Qualifications' };
</script>
<script src="../_shell/chrome.js"></script>

<script>
const QUALS = [
  { name:'AC Motor Controller Operation',   desc:'Certify safe operation of Line 3 AC motor controllers',                   ai:true,  status:'Active',       requirements:4,  criteria:'All requirements', order:'Sequential', location:'Orlando Organization › Manufacturing › Line 3' },
  { name:'Lockout/Tagout Authorization',    desc:'Competency check for energy isolation procedures',                         ai:false, status:'Active',       requirements:3,  criteria:'All requirements', order:'Sequential', location:'Orlando Organization › Manufacturing' },
  { name:'Forklift Operator Certification', desc:'Fundamentals through licensed operation and a practical assessment',       ai:true,  status:'Active',       requirements:5,  criteria:'3 of 5',          order:'Any order',  location:'Orlando Organization › Warehouse' },
  { name:'Confined Space Entry',            desc:'Authorization to enter and work in permit-required confined spaces',       ai:false, status:'Under Review',  requirements:7,  criteria:'All requirements', order:'Sequential', location:'Orlando Organization › Facilities' },
  { name:'OSHA 30-Hour General Industry',   desc:'Comprehensive OSHA compliance for general industry workers',               ai:false, status:'Active',       requirements:12, criteria:'All requirements', order:'Any order',  location:'Orlando Organization' },
  { name:'Crane & Hoist Operation',         desc:'Overhead crane and hoist operation with rigging fundamentals',             ai:true,  status:'Under Review',  requirements:6,  criteria:'4 of 6',          order:'Sequential', location:'Orlando Organization › Maintenance' },
  { name:'Arc Welding Certification',       desc:'Certify safe arc welding technique and PPE compliance',                   ai:false, status:'Active',       requirements:5,  criteria:'All requirements', order:'Sequential', location:'Orlando Organization › Manufacturing › Welding Shop' },
  { name:'Respirator Fit & Use',            desc:'Respirator selection, fit testing, and proper use',                       ai:false, status:'Draft',        requirements:3,  criteria:'All requirements', order:'Any order',  location:'Orlando Organization › Safety › Industrial Hygiene' },
  { name:'Fall Protection Competency',      desc:'Working-at-height anchor, harness, and rescue planning',                  ai:false, status:'Active',       requirements:4,  criteria:'3 of 4',          order:'Sequential', location:'Orlando Organization › Construction' },
  { name:'Hot Work Permit Authorization',   desc:'Fire-watch and permit procedures for welding and cutting',                ai:true,  status:'Draft',        requirements:3,  criteria:'All requirements', order:'Sequential', location:'Orlando Organization › Facilities › Hot Work' },
];

function editHref(q){ return 'AI-Qualification-Builder.html?qual=' + encodeURIComponent(q.name) + '&enrolled=0'; }
function requirementsHref(q){ return 'Manage-Requirements.html?qualification=' + encodeURIComponent(q.name); }

function nameRenderer(p){
  const q = p.data;
  const ai = q.ai ? `<span class="ai-tag-sm"><i class="fa-solid fa-wand-magic-sparkles"></i> AI</span>` : '';
  return `<div class="cell-name-wrap">
    <div class="cell-name"><a href="${editHref(q)}">${q.name}</a>${ai}</div>
    <div class="cell-desc">${q.desc}</div>
  </div>`;
}
function criteriaRenderer(p){
  const allItems = /^all/i.test(p.value);
  return `<span class="cell-meta"><i class="fa-solid ${allItems ? 'fa-list-check' : 'fa-circle-half-stroke'}"></i> ${p.value}</span>`;
}
function orderRenderer(p){
  const seq = p.value === 'Sequential';
  return `<span class="cell-meta"><i class="fa-solid ${seq ? 'fa-list-ol' : 'fa-shuffle'}"></i> ${p.value}</span>`;
}
function requirementsRenderer(p){
  const n = p.value;
  return `<a class="req-link" href="${requirementsHref(p.data)}" title="View requirements for this qualification">${n} requirement${n!==1?'s':''} <i class="fa-solid fa-arrow-up-right-from-square"></i></a>`;
}
function statusRenderer(p){
  const conn = p.value === 'Active' ? 'success' : (p.value === 'Draft' ? 'contrast' : 'warning');
  return `<span theme="badge dot ${conn}">${p.value}</span>`;
}
function locationRenderer(p){
  return `<span class="cell-loc"><i class="fa-solid fa-location-dot"></i> ${p.value}</span>`;
}

/* Shared floating dropdown */
let activeDropdown = null;
function closeDropdown(){ if (activeDropdown){ activeDropdown.remove(); activeDropdown = null; } }
function showDropdown(btn, items){
  closeDropdown();
  const dd = document.createElement('div');
  dd.className = 'row-dropdown';
  items.forEach(item => {
    const b = document.createElement('button');
    b.className = 'row-dropdown-item' + (item.danger ? ' danger' : '');
    b.innerHTML = `<i class="${item.icon}"></i> ${item.label}`;
    b.addEventListener('click', e => { e.stopPropagation(); closeDropdown(); item.action(); });
    dd.appendChild(b);
  });
  document.body.appendChild(dd);
  activeDropdown = dd;
  const rect = btn.getBoundingClientRect();
  dd.style.top = (rect.bottom + 4) + 'px';
  dd.style.right = (window.innerWidth - rect.right) + 'px';
  setTimeout(() => document.addEventListener('click', closeDropdown, { once:true }), 0);
}

function actionsRenderer(p){
  const e = document.createElement('div');
  e.className = 'row-actions';
  e.innerHTML =
    `<button class="row-action-btn" title="Edit"><i class="fa-solid fa-pencil"></i></button>
     <button class="row-action-btn" title="More actions"><i class="fa-solid fa-ellipsis-vertical"></i></button>`;
  const [editBtn, moreBtn] = e.querySelectorAll('button');
  editBtn.addEventListener('click', () => { location.href = editHref(p.data); });
  moreBtn.addEventListener('click', ev => {
    ev.stopPropagation();
    showDropdown(moreBtn, [
      { icon:'fa-regular fa-copy', label:'Duplicate', action: () => alert('Duplicate "' + p.data.name + '" (prototype).') },
      { icon:'fa-regular fa-trash-can', label:'Delete', danger:true, action: () => {
        if (confirm('Delete "' + p.data.name + '"? This is a prototype and will only remove the row.')) {
          gridApi.applyTransaction({ remove:[p.data] }); updateCount();
        }
      }},
    ]);
  });
  return e;
}

let gridApi = null;
let statusValue = '';
const gridOptions = {
  rowData: QUALS,
  columnDefs: [
    { headerName:'Qualification',         field:'name',         flex:2, minWidth:280, cellRenderer:nameRenderer, getQuickFilterText:p=>p.data.name+' '+p.data.desc },
    { headerName:'Completion Criteria',   field:'criteria',     width:175, cellRenderer:criteriaRenderer },
    { headerName:'Completion Order',      field:'order',        width:160, cellRenderer:orderRenderer },
    { headerName:'Requirements',          field:'requirements', width:150, cellRenderer:requirementsRenderer },
    { headerName:'Status',                field:'status',       width:140, cellRenderer:statusRenderer },
    { headerName:'Location',              field:'location',     flex:2, minWidth:240, cellRenderer:locationRenderer },
    { headerName:'', colId:'actions',     width:90,  cellRenderer:actionsRenderer, sortable:false, filter:false, resizable:false },
  ],
  defaultColDef: { sortable:true, resizable:true, filter:true },
  rowHeight: 56,
  headerHeight: 44,
  animateRows: true,
  suppressCellFocus: true,
  isExternalFilterPresent: () => statusValue !== '',
  doesExternalFilterPass: (node) => !statusValue || node.data.status === statusValue,
  onGridReady: () => updateCount(),
  onModelUpdated: () => updateCount(),
};

function onSearch(v){ if (gridApi) gridApi.setGridOption('quickFilterText', v); }
function onStatusFilter(v){ statusValue = v; if (gridApi) gridApi.onFilterChanged(); }
function updateCount(){
  if (!gridApi) return;
  const shown = gridApi.getDisplayedRowCount();
  const el = document.getElementById('row-count');
  if (el) el.textContent = 'Showing ' + shown + ' of ' + QUALS.length + ' qualifications';
}

function toggleCreate(e){ e.stopPropagation(); document.getElementById('create-menu').classList.toggle('hidden'); }
document.addEventListener('click', () => { document.getElementById('create-menu')?.classList.add('hidden'); closeDropdown(); });

document.addEventListener('DOMContentLoaded', () => {
  const el = document.getElementById('qual-grid');
  if (window.agGrid && el) gridApi = agGrid.createGrid(el, gridOptions);
});
</script>
</body>
</html>
