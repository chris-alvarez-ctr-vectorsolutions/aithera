<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script
    type="module"
    src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.19.0/core.iife.js">
    </script>

    <!-- Vector Web Components JavaScript -->
    <!-- Important! This should always be imported as script -->
    <script
    src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.5.0/styles.js">
    </script>

    <!-- Our Standard font face - Open Sans -->
    <link
    rel="stylesheet"
    href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css"
    />

    <!-- Font Awesome 6 Icons (Default Icon Library) -->
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
</head>
<body>
    <vaadin-button id="home-btn" theme="primary">
        <i class="fa-solid fa-house" slot="prefix"></i>
        Home
    </vaadin-button>

    <vaadin-button theme="secondary" onclick="window.location.href='page2.html'">
        Page 2
    </vaadin-button>

    <vaadin-dialog id="home-dialog" header-title="Home"></vaadin-dialog>

    <vaadin-grid id="main-grid">
        <vaadin-grid-column path="name" header="Name"></vaadin-grid-column>
        <vaadin-grid-column path="age" header="Age"></vaadin-grid-column>
        <vaadin-grid-column path="location" header="Location"></vaadin-grid-column>
    </vaadin-grid>

    <vwc-paginator id="paginator" page-size="10"></vwc-paginator>

    <script>
        const allItems = [
            { name: 'Alice Johnson',  age: 32, location: 'New York, NY' },
            { name: 'Bob Martinez',   age: 45, location: 'Austin, TX' },
            { name: 'Carol White',    age: 28, location: 'Seattle, WA' },
            { name: 'David Lee',      age: 51, location: 'Chicago, IL' },
            { name: 'Eva Nguyen',     age: 37, location: 'San Francisco, CA' },
            { name: 'Frank Patel',    age: 23, location: 'Denver, CO' },
            { name: 'Grace Kim',      age: 41, location: 'Boston, MA' },
            { name: 'Henry Brown',    age: 29, location: 'Miami, FL' },
            { name: 'Isla Torres',    age: 34, location: 'Portland, OR' },
            { name: 'James Okonkwo',  age: 48, location: 'Atlanta, GA' },
            { name: 'Karen Schmidt',  age: 26, location: 'Phoenix, AZ' },
            { name: 'Liam Chen',      age: 55, location: 'Los Angeles, CA' },
        ];

        const grid = document.getElementById('main-grid');
        const paginator = document.getElementById('paginator');

        paginator.total = allItems.length;

        function updatePage(page, pageSize) {
            const start = page * pageSize;
            grid.items = allItems.slice(start, start + pageSize);
        }

        // page-change fires on init, so this also sets the initial grid items
        paginator.addEventListener('page-change', (e) => {
            updatePage(e.detail.page, e.detail.pageSize);
        });

        const dialog = document.getElementById('home-dialog');
        const homeBtn = document.getElementById('home-btn');

        homeBtn.addEventListener('click', () => {
            dialog.opened = true;
        });

        dialog.renderer = (root) => {
            if (root.firstChild) return;
            const p = document.createElement('p');
            p.textContent = 'Welcome home!';
            root.appendChild(p);
        };

        dialog.footerRenderer = (root) => {
            if (root.firstChild) return;

            const cancelBtn = document.createElement('vaadin-button');
            cancelBtn.setAttribute('theme', 'secondary');
            cancelBtn.textContent = 'Cancel';
            cancelBtn.addEventListener('click', () => { dialog.opened = false; });

            const okBtn = document.createElement('vaadin-button');
            okBtn.setAttribute('theme', 'primary');
            okBtn.textContent = 'Ok';
            okBtn.addEventListener('click', () => { dialog.opened = false; });

            root.appendChild(cancelBtn);
            root.appendChild(okBtn);
        };
    </script>
</body>
</html>
