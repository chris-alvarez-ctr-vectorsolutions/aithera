<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EHS Prevent — Navigation Prototype</title>

    <script type="module"
        src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.19.0/core.iife.js">
    </script>
    <script
        src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.5.0/styles.js">
    </script>
    <link rel="stylesheet"
        href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css"/>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Open Sans', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: #f8fafc;
        }

        /* ── Topnav ── */
        vwc-topnav { flex-shrink: 0; z-index: 100; }

        /* Product accent */
        body.app-ehs vwc-topnav { border-bottom: 3px solid #dc2626; }
        body.app-ct  vwc-topnav { border-bottom: 3px solid #0057b8; }

        /* ── App shell ── */
        .app-shell { display: flex; flex: 1; min-height: 0; }

        /* ── Topnav left ── */
        .topnav-left { display: flex; align-items: center; gap: 0; }

        .topnav-brand { display: flex; align-items: center; }

        .topnav-logo-img {
            height: 32px;
            width: auto;
            display: block;
            flex-shrink: 0;
        }

        .topnav-pipe {
            width: 1px; height: 20px; background: #e2e8f0;
            margin: 0 12px; flex-shrink: 0;
        }

        .product-label {
            font-size: 13px; font-weight: 600; color: #334155; white-space: nowrap;
        }

        /* EHS label */
        #ehsLabel { display: inline; }
        body.app-ct #ehsLabel { display: none; }

        /* CT loc wrap */
        .ct-loc-wrap {
            display: none;
            align-items: center;
            gap: 8px;
        }
        body.app-ct .ct-loc-wrap { display: flex; }

        .ct-loc-sep { width: 1px; height: 20px; background: #e2e8f0; flex-shrink: 0; }

        .ct-loc-btn {
            display: flex; align-items: center; gap: 7px;
            padding: 5px 10px;
            border: 1px solid #e2e8f0; border-radius: 6px;
            background: #f8fafc; cursor: pointer; font-family: inherit;
            transition: background 0.12s, border-color 0.12s; white-space: nowrap;
        }
        .ct-loc-btn:hover { background: #f1f5f9; border-color: #cbd5e1; }
        .ct-loc-icon { color: #0057b8; font-size: 13px; }
        .ct-loc-text { display: flex; flex-direction: column; text-align: left; line-height: 1.2; }
        .ct-loc-name { font-size: 12px; font-weight: 600; color: #1e293b; }
        .ct-loc-path { font-size: 10px; color: #64748b; }

        /* ── CT Module tabs ── */
        .ct-module-tabs { display: none; align-self: stretch; margin-right: 4px; }
        body.app-ct .ct-module-tabs { display: flex; }

        .module-tab {
            display: flex; align-items: center; gap: 6px;
            padding: 0 14px; align-self: stretch;
            background: none; border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer; font-family: inherit;
            font-size: 13px; font-weight: 500; color: #64748b;
            transition: color 0.12s, border-color 0.12s; white-space: nowrap;
        }
        .module-tab:hover { color: #1e293b; }
        .module-tab.active { color: #0057b8; border-bottom-color: #0057b8; font-weight: 600; }

        .beta-pill {
            font-size: 9px; font-weight: 700;
            background: #7c3aed; color: #fff;
            padding: 1px 5px; border-radius: 4px; letter-spacing: 0.4px;
        }

        /* ── Custom Sidebar ── */
        .sidebar {
            width: 274px; min-width: 274px;
            background: #fff;
            border-right: 1px solid #e8ecf0;
            display: flex; flex-direction: column;
            transition: width 0.2s ease, min-width 0.2s ease;
            flex-shrink: 0;
            align-self: stretch;
            z-index: 50;
            position: relative;
        }

        .sidebar.collapsed { width: 56px; min-width: 56px; }

        .sidebar-top {
            flex-shrink: 0;
            border-bottom: 1px solid #e8ecf0;
            position: relative;
        }

        .sidebar-logo-area {
            width: 274px; height: 208px;
            padding: 16px;
            display: flex; align-items: center; justify-content: center;
            box-sizing: border-box;
        }
        .sidebar.collapsed .sidebar-logo-area {
            width: 56px; height: auto;
            padding: 12px 10px;
        }

        .customer-logo-row {
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%;
        }
        .sidebar.collapsed .customer-logo-row { padding: 0; }

        /* EHS-style collapse handle — small chevron pill on the sidebar edge */
        .sidebar-collapse-btn {
            position: absolute;
            top: 50%;
            right: -12px;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #fff;
            border: 1px solid #cbd5e1;
            color: #475569;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            z-index: 5;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
            transition: background 0.12s, color 0.12s, border-color 0.12s;
            padding: 0;
        }
        .sidebar-collapse-btn:hover { background: #f1f5f9; color: #0f172a; border-color: #94a3b8; }
        .sidebar-collapse-btn i { pointer-events: none; transition: transform 0.2s; }
        .sidebar.collapsed .sidebar-collapse-btn i { transform: rotate(180deg); }

        .customer-logo-img.expanded-only {
            width: 242px; height: 176px;
            display: block; object-fit: contain;
        }
        .customer-logo-img.collapsed-only { display: none; width: 36px; height: 36px; object-fit: contain; }
        .sidebar.collapsed .customer-logo-img.expanded-only { display: none; }
        .sidebar.collapsed .customer-logo-img.collapsed-only { display: block; }

        .sidebar-nav { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 6px 0; min-height: 0; }

        /* ── Sidebar items ── */
        .sb-item {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 16px;
            color: #475569; text-decoration: none;
            font-size: 13px; font-weight: 500;
            cursor: pointer; border: none; background: none;
            width: 100%; text-align: left; font-family: inherit;
            transition: background 0.1s, color 0.1s;
            border-left: 3px solid transparent;
            white-space: nowrap; overflow: hidden;
        }
        .sb-item:hover { background: #f8fafc; color: #1e293b; }
        .sb-item.active { background: #eff6ff; color: #1d4ed8; border-left-color: #1d4ed8; font-weight: 600; }

        .sb-icon { width: 18px; text-align: center; flex-shrink: 0; font-size: 14px; }
        .sb-text { flex: 1; overflow: hidden; text-overflow: ellipsis; }
        .sb-chevron { font-size: 10px; color: #94a3b8; transition: transform 0.2s; flex-shrink: 0; margin-left: auto; }
        .sb-group-trigger.open .sb-chevron { transform: rotate(180deg); }

        .sidebar.collapsed .sb-text    { display: none; }
        .sidebar.collapsed .sb-chevron { display: none; }
        .sidebar.collapsed .sb-item    { padding: 10px; justify-content: center; }

        /* ── Group children ── */
        .sb-children { display: none; }
        .sb-children.open { display: block; }
        .sidebar.collapsed .sb-children { display: none !important; }

        /* Child items */
        .sb-child {
            display: flex; align-items: center; gap: 10px;
            padding: 7px 16px 7px 44px;
            color: #64748b; text-decoration: none;
            font-size: 13px; font-weight: 400;
            cursor: pointer; border: none; background: none;
            width: 100%; text-align: left; font-family: inherit;
            transition: background 0.1s, color 0.1s;
            border-left: 3px solid transparent;
            white-space: nowrap; overflow: hidden;
        }
        .sb-child:hover { background: #f8fafc; color: #334155; }
        .sb-child.active { background: #eff6ff; color: #1d4ed8; border-left-color: #1d4ed8; font-weight: 500; }
        .sb-child .sb-icon { font-size: 12px; width: 16px; }

        /* Sub-group children (nested 2 levels) */
        .sb-subchild { padding-left: 64px; }

        .sidebar.collapsed .sb-child { display: none; }

        /* ── Location Dropdown ── */
        .loc-dropdown {
            display: none; position: fixed;
            width: 300px; max-height: 420px;
            background: #fff;
            border: 1px solid #e2e8f0; border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.06);
            z-index: 9999; flex-direction: column; overflow: hidden;
        }
        .loc-dropdown.open { display: flex; }

        .loc-dd-head { padding: 14px 14px 10px; border-bottom: 1px solid #f1f5f9; flex-shrink: 0; }
        .loc-dd-label { font-size: 13px; font-weight: 600; color: #1e293b; margin-bottom: 10px; }
        .loc-search-wrap { position: relative; }
        .loc-search-wrap i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: #94a3b8; }
        .loc-search {
            width: 100%; padding: 7px 10px 7px 32px;
            border: 1px solid #e2e8f0; border-radius: 6px;
            font-family: inherit; font-size: 13px; color: #1e293b; outline: none;
        }
        .loc-search:focus { border-color: #0057b8; }
        .loc-dd-tree { flex: 1; overflow-y: auto; padding: 8px 0; }
        .loc-dd-foot {
            padding: 10px 14px; border-top: 1px solid #f1f5f9;
            font-size: 12px; color: #64748b;
            display: flex; align-items: center; gap: 8px; flex-shrink: 0;
        }
        .loc-active-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; flex-shrink: 0; }

        /* ── Main content ── */
        .main-content { flex: 1; overflow-y: auto; background: #f8fafc; display: flex; flex-direction: column; }

        .content-topbar {
            display: flex; align-items: center;
            padding: 12px 24px; background: #fff;
            border-bottom: 1px solid #e2e8f0;
            min-height: 52px; flex-shrink: 0; gap: 12px;
        }
        .page-title { font-size: 16px; font-weight: 600; color: #1e293b; flex: 1; }

        .content-body { padding: 24px; }

        .placeholder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px; margin-bottom: 16px;
        }
        .placeholder-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; }
        .placeholder-card-title {
            font-size: 13px; font-weight: 600; color: #1e293b;
            margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
        }
        .placeholder-card-title i { font-size: 14px; color: #64748b; }
        .ph-row { height: 10px; background: #f1f5f9; border-radius: 4px; margin-bottom: 7px; }
        .ph-row:last-child { margin-bottom: 0; }
        .ph-row.w-full { width: 100%; } .ph-row.w-75 { width: 75%; }
        .ph-row.w-55  { width: 55%; }  .ph-row.w-40 { width: 40%; }
        .wide-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
    </style>
</head>
<body class="app-ehs">

<!-- ── Top Navigation ── -->
<vwc-topnav id="topnav">

    <div slot="leftSide" class="topnav-left">
        <div class="topnav-brand">
            <img src="assets/vector-solutions-logo.svg" alt="Vector Solutions" class="topnav-logo-img"/>
        </div>

        <div class="topnav-pipe"></div>

        <!-- EHS product label -->
        <span class="product-label" id="ehsLabel">Vector EHS</span>

        <!-- CT: product name + location trigger -->
        <div class="ct-loc-wrap">
            <span class="product-label">Convergence Training</span>
            <div class="ct-loc-sep"></div>
            <button class="ct-loc-btn" id="locationTrigger" aria-haspopup="true" aria-expanded="false">
                <i class="fa-solid fa-location-dot ct-loc-icon"></i>
                <div class="ct-loc-text">
                    <span class="ct-loc-name" id="triggerName">Boston Site</span>
                    <span class="ct-loc-path" id="triggerPath">CSM Org › NE Region</span>
                </div>
                <i class="fa-solid fa-chevron-down" style="font-size:10px; color:#94a3b8; margin-left:2px;"></i>
            </button>
        </div>
    </div>

    <!-- CT Module tabs -->
    <div slot="rightSide" class="ct-module-tabs" id="moduleTabs">
        <button class="module-tab" data-module="home">Home</button>
        <button class="module-tab" data-module="training">Training</button>
        <button class="module-tab" data-module="catalog">Catalog</button>
        <button class="module-tab" data-module="insights">Insights <span class="beta-pill">BETA</span></button>
        <button class="module-tab active" data-module="admin">Administration</button>
    </div>

    <!-- App Switcher — uses vwc-app-switcher-menu with products API -->
    <vwc-app-switcher-menu slot="app-switcher" id="appSwitcher"></vwc-app-switcher-menu>

    <vwc-user-menu slot="user-menu" id="userMenu"></vwc-user-menu>

</vwc-topnav>

<!-- ── App Shell ── -->
<div class="app-shell">

    <!-- Custom sidebar with FA icons (replaces vwc-sidenav for full icon support) -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-top">
            <div class="sidebar-logo-area">
                <div class="customer-logo-row">
                    <img src="assets/vector-solutions-logo.svg" alt="Tenant logo" class="customer-logo-img expanded-only"/>
                    <img src="assets/vector-solutions-logo.svg" alt="Tenant logo" class="customer-logo-img collapsed-only"/>
                </div>
            </div>
            <button class="sidebar-collapse-btn" id="sidebarToggle" aria-label="Collapse sidebar" title="Collapse sidebar">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
        </div>
        <nav class="sidebar-nav" id="sidebarNav" aria-label="Main navigation"></nav>
    </aside>

    <main class="main-content">

        <!-- EHS content -->
        <div id="ehsContent" style="display:flex; flex-direction:column; flex:1;">
            <div class="content-topbar">
                <span class="page-title" id="ehsPageTitle">Home</span>
                <vaadin-button theme="primary">
                    <i class="fa-solid fa-plus" slot="prefix"></i> Add New
                </vaadin-button>
            </div>
            <div class="content-body">
                <div class="placeholder-grid">
                    <div class="placeholder-card">
                        <div class="placeholder-card-title"><i class="fa-solid fa-triangle-exclamation"></i> Open Incidents</div>
                        <div class="ph-row w-full"></div><div class="ph-row w-75"></div><div class="ph-row w-55"></div><div class="ph-row w-40"></div>
                    </div>
                    <div class="placeholder-card">
                        <div class="placeholder-card-title"><i class="fa-solid fa-clipboard-list"></i> Pending Inspections</div>
                        <div class="ph-row w-full"></div><div class="ph-row w-75"></div><div class="ph-row w-55"></div>
                    </div>
                    <div class="placeholder-card">
                        <div class="placeholder-card-title"><i class="fa-solid fa-shield-halved"></i> Hazard Reports</div>
                        <div class="ph-row w-full"></div><div class="ph-row w-75"></div><div class="ph-row w-40"></div>
                    </div>
                    <div class="placeholder-card">
                        <div class="placeholder-card-title"><i class="fa-solid fa-circle-check"></i> Corrective Actions</div>
                        <div class="ph-row w-full"></div><div class="ph-row w-55"></div>
                    </div>
                </div>
                <div class="wide-card">
                    <div class="placeholder-card-title"><i class="fa-regular fa-calendar"></i> Compliance Calendar</div>
                    <div class="ph-row w-full"></div><div class="ph-row w-75"></div><div class="ph-row w-full"></div><div class="ph-row w-55"></div>
                </div>
                <div class="wide-card">
                    <div class="placeholder-card-title"><i class="fa-solid fa-chart-bar"></i> Recent Activity</div>
                    <div class="ph-row w-full"></div><div class="ph-row w-75"></div><div class="ph-row w-55"></div><div class="ph-row w-full"></div>
                </div>
            </div>
        </div>

        <!-- CT content -->
        <div id="ctContent" style="display:none; flex-direction:column; flex:1;">
            <div class="content-topbar">
                <span class="page-title" id="ctPageTitle">Administration</span>
            </div>
            <div class="content-body">
                <div class="wide-card">
                    <div class="placeholder-card-title"><i class="fa-solid fa-gauge-high"></i> Dashboard Overview</div>
                    <div class="ph-row w-full"></div><div class="ph-row w-75"></div><div class="ph-row w-55"></div>
                </div>
                <div class="placeholder-grid">
                    <div class="placeholder-card">
                        <div class="placeholder-card-title"><i class="fa-solid fa-users"></i> Active Learners</div>
                        <div class="ph-row w-full"></div><div class="ph-row w-75"></div><div class="ph-row w-40"></div>
                    </div>
                    <div class="placeholder-card">
                        <div class="placeholder-card-title"><i class="fa-solid fa-route"></i> Learning Paths</div>
                        <div class="ph-row w-full"></div><div class="ph-row w-75"></div><div class="ph-row w-55"></div>
                    </div>
                    <div class="placeholder-card">
                        <div class="placeholder-card-title"><i class="fa-solid fa-chart-line"></i> Completion Rate</div>
                        <div class="ph-row w-full"></div><div class="ph-row w-55"></div>
                    </div>
                </div>
            </div>
        </div>

    </main>
</div>

<!-- Location dropdown (position set via JS on trigger click) -->
<div class="loc-dropdown" id="locDropdown">
    <div class="loc-dd-head">
        <div class="loc-dd-label">Switch Location</div>
        <div class="loc-search-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" class="loc-search" placeholder="Search locations…" autocomplete="off"/>
        </div>
    </div>
    <div class="loc-dd-tree">
        <vwc-tree-list id="locTree"></vwc-tree-list>
    </div>
    <div class="loc-dd-foot">
        <div class="loc-active-dot"></div>
        <span>Viewing: <strong id="footerLocName">Boston Site</strong></span>
    </div>
</div>

<script>
// ─── Nav data (FA icon class strings) ────────────────────────────────────────
const EHS_NAV = [
    { type: 'link',  id: 'ehs-home',  text: 'Home',           fa: 'fa-solid fa-house'           },

    {
        type: 'group', id: 'safety-mgmt', text: 'Safety Management', fa: 'fa-solid fa-shield-halved', open: true,

            {

                children: [

                    { type: 'link', id: 'obs-summary',   text: 'Observations Summary',   fa: 'fa-solid fa-list'       },

const CT_TITLES = { home: 'Home', training: 'My Training', catalog: 'Course Catalog', insights: 'Insights', admin: 'Administration' };

// ─── State ────────────────────────────────────────────────────────────────────
let currentApp      = 'ehs';
let currentCTModule = 'admin';
let activeItemId    = 'ehs-home';

const sidebar    = document.getElementById('sidebar');
const sidebarNav = document.getElementById('sidebarNav');

// ─── Sidebar builder ──────────────────────────────────────────────────────────
function renderNav(items) {
    sidebarNav.innerHTML = '';
    items.forEach(item => sidebarNav.appendChild(
        item.type === 'group' ? buildGroup(item, 0) : buildLink(item, 0)
    ));
}

function buildLink(item, level) {
    const el = document.createElement('a');
    el.href = '#';
    el.className = level === 0 ? 'sb-item' : (level === 1 ? 'sb-item sb-child' : 'sb-item sb-child sb-subchild');
    el.dataset.id = item.id;
    if (item.id === activeItemId) el.classList.add('active');
    el.innerHTML = `<i class="${item.fa} sb-icon"></i><span class="sb-text">${item.text}</span>`;
    el.addEventListener('click', e => {
        e.preventDefault();
        setActive(item.id);
        const titleEl = currentApp === 'ehs'
            ? document.getElementById('ehsPageTitle')
            : document.getElementById('ctPageTitle');
        if (titleEl) titleEl.textContent = item.text;
    });
    return el;
}

function buildGroup(item, level) {
    const wrapper = document.createElement('div');

    const trigger = document.createElement('button');
    trigger.className = level === 0
        ? 'sb-item sb-group-trigger'
        : 'sb-item sb-child sb-group-trigger';
    if (item.open) trigger.classList.add('open');
    trigger.innerHTML = `<i class="${item.fa} sb-icon"></i><span class="sb-text">${item.text}</span><i class="fa-solid fa-chevron-down sb-chevron"></i>`;

    const childrenEl = document.createElement('div');
    childrenEl.className = 'sb-children' + (item.open ? ' open' : '');

    item.children.forEach(child => childrenEl.appendChild(
        child.type === 'group' ? buildGroup(child, level + 1) : buildLink(child, level + 1)
    ));

    trigger.addEventListener('click', () => {
        const isOpen = childrenEl.classList.contains('open');
        childrenEl.classList.toggle('open', !isOpen);
        trigger.classList.toggle('open', !isOpen);
    });

    wrapper.appendChild(trigger);
    wrapper.appendChild(childrenEl);
    return wrapper;
}

function setActive(id) {
    activeItemId = id;
    document.querySelectorAll('.sb-item[data-id]').forEach(el =>
        el.classList.toggle('active', el.dataset.id === id)
    );
}

// ─── Sidebar collapse ─────────────────────────────────────────────────────────
document.getElementById('sidebarToggle').addEventListener('click', () => {
    sidebar.classList.toggle('collapsed');
});

// ─── App switcher ─────────────────────────────────────────────────────────────
customElements.whenDefined('vwc-app-switcher-menu').then(() => {
    const appSwitcher = document.getElementById('appSwitcher');
    appSwitcher.products = [
        { id: 'ehs', text: 'Vector EHS' },
        { id: 'ct',  text: 'Convergence Training' },
    ];
    appSwitcher.addEventListener('product-click', e => switchApp(e.detail.id));
});

// ─── User menu ────────────────────────────────────────────────────────────────
customElements.whenDefined('vwc-user-menu').then(() => {
    try { const u = document.getElementById('userMenu'); u.userName = 'Andy Xia'; u.userInitials = 'AX'; } catch(e){}
});

// ─── App switching ────────────────────────────────────────────────────────────
function switchApp(appId) {
    if (!appId) return;
    currentApp = appId;
    document.body.className = 'app-' + appId;

    if (appId === 'ehs') {
        activeItemId = 'ehs-home';
        renderNav(EHS_NAV);
        document.getElementById('ehsContent').style.display = 'flex';
        document.getElementById('ctContent').style.display  = 'none';
        document.getElementById('ehsPageTitle').textContent = 'Home';
    } else {
        loadCTNav(currentCTModule);
        document.getElementById('ehsContent').style.display = 'none';
        document.getElementById('ctContent').style.display  = 'flex';
    }
}

function loadCTNav(module) {
    currentCTModule = module;
    const items = CT_NAV[module] || CT_NAV.admin;
    activeItemId = items[0]?.id || null;
    renderNav(items);
    document.querySelectorAll('.module-tab').forEach(t =>
        t.classList.toggle('active', t.dataset.module === module)
    );
    document.getElementById('ctPageTitle').textContent = CT_TITLES[module] || module;
}

// ─── Module tab clicks ────────────────────────────────────────────────────────
document.querySelectorAll('.module-tab').forEach(tab =>
    tab.addEventListener('click', () => { if (currentApp === 'ct') loadCTNav(tab.dataset.module); })
);

// ─── Location dropdown ────────────────────────────────────────────────────────
const locationTrigger = document.getElementById('locationTrigger');
const locDropdown     = document.getElementById('locDropdown');

function openLoc() {
    const r = locationTrigger.getBoundingClientRect();
    locDropdown.style.top  = (r.bottom + 4) + 'px';
    locDropdown.style.left = r.left + 'px';
    locDropdown.classList.add('open');
    locationTrigger.setAttribute('aria-expanded', 'true');
}
function closeLoc() {
    locDropdown.classList.remove('open');
    locationTrigger.setAttribute('aria-expanded', 'false');
}

locationTrigger.addEventListener('click', e => {
    e.stopPropagation();
    locDropdown.classList.contains('open') ? closeLoc() : openLoc();
});
document.addEventListener('click', closeLoc);
locDropdown.addEventListener('click', e => e.stopPropagation());

// ─── Location tree ────────────────────────────────────────────────────────────
const LOC_LABELS = { boston:'Boston Site', providence:'Providence Site', atlanta:'Atlanta Site', miami:'Miami Site', ne:'NE Region', se:'SE Region', org:'CSM Organization' };

    const locTree = document.getElementById('locTree');
    locTree.items = [
        { id:'org', text:'CSM Organization', children:[
            { id:'ne', text:'NE Region', children:[
                { id:'boston',     text:'Boston Site'     },
                { id:'providence', text:'Providence Site' },
            ]},
            { id:'se', text:'SE Region', children:[
                { id:'atlanta', text:'Atlanta Site' },
                { id:'miami',   text:'Miami Site'   },
            ]},
        ]}
    ];
    locTree.value = 'boston';
    locTree.addEventListener('value-change', e => {
        const id = e.detail;
        if (!LOC_LABELS[id]) return;
        document.getElementById('triggerName').textContent   = LOC_LABELS[id];
        document.getElementById('triggerPath').textContent   = LOC_PATHS[id];
        document.getElementById('footerLocName').textContent = LOC_LABELS[id];
        closeLoc();
    });
});
