<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prioritization Settings — Readiness Hub</title>

<!--
  Prioritization Settings — the configuration surface behind the Readiness Hub's
  priority score. Lives inside the Readiness Hub's visual world: Open Sans
  headlines at the design system's 40px H1, Arvo numerals, paper-textured
  surface, Material-3 elevation, and the amber / coral / teal accent system.

  Knob sets:
    1. Task-type importance — per-type weight from the registry (always shown)
    2. Advanced ▾
         a. Score weights (Time / Importance / Effort)
         b. Time-pressure tiers (overdue / ≤24h / ≤7d / beyond)
         c. Priority bands — 2–5 named, admin-editable buckets
    3. Per-type overrides — each task type can override the time-pressure
       curve AND set its own no-due-date SLA fall-through

  A floating live-preview rail on the right re-scores a representative sample
  so admins see the effect of their tuning before saving.

  Reskinned on Vector web components: vaadin-number-field for every numeric
  knob, vwc-toggle-button-group for the hrs/days unit toggles, vaadin-details
  for the advanced section, vaadin-tabs for the preview tabs, vaadin-button
  throughout. Range sliders stay native (Vector ships no slider) and the band
  name stays an inline borderless input by design.
-->

<link rel="stylesheet" href="styles.css">

<!-- Vector Web Components — core + themes + Open Sans + Font Awesome -->
<script type="module" src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.5.1/core.iife.js"></script>
<script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.1.1/styles.js"></script>
<link rel="stylesheet" href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
  /* ---------- Page grid: settings column + floating preview rail ---------- */
  .pf-main {
    width: 100%; padding: 0 0 40px;
    display: grid; grid-template-columns: minmax(0, 1fr) 380px;
    gap: 32px; align-items: start;
  }
  @media (max-width: 1100px) {
    .pf-main { grid-template-columns: 1fr; }
    .pf-preview-floater { transform: none !important; }
    .pf-preview-track { align-self: start !important; }
  }

  /* ---------- Page intro ---------- */
  .pf-topbar { display: flex; align-items: center; gap: 14px; padding: 22px 0 0; flex-wrap: wrap; }
  .pf-backlink {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 13px 7px 9px; border-radius: 999px;
    background: var(--surface-1); border: 1px solid var(--ink-200);
    color: var(--ink-800); font-size: 13px; font-weight: 600;
    text-decoration: none; box-shadow: var(--elev-1); cursor: pointer;
    transition: background 0.15s;
  }
  .pf-backlink:hover { background: var(--surface-3); color: var(--ink-900); }
  .pf-intro { padding: 16px 0 18px; margin-bottom: 4px; }
  /* Page title at the design system's 40px H1 — same rung as the hub greeting. */
  .pf-intro h1 {
    margin: 0; font-family: var(--font-display); font-weight: 600;
    font-size: 40px; line-height: 1.1; letter-spacing: -1px; color: var(--ink-900);
  }
  .pf-intro p { margin: 8px 0 0; font-size: 14px; color: var(--ink-600); max-width: 640px; line-height: 1.5; }

  /* ---------- Card chrome — matches the hub ---------- */
  .pf-card {
    background: var(--surface-1); border: 1px solid var(--ink-100);
    border-radius: var(--radius-lg); padding: 24px 28px;
    box-shadow: var(--elev-1); position: relative;
  }
  .pf-card + .pf-card { margin-top: 18px; }
  .pf-card-head {
    display: flex; align-items: flex-start; gap: 14px;
    margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--surface-3);
  }
  .pf-card-icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .pf-card-title { flex: 1; min-width: 0; }
  .pf-card-title h2 {
    font-family: var(--font-display); font-weight: 600; font-size: 24px;
    margin: 0; letter-spacing: -0.4px; color: var(--ink-900);
  }
  .pf-card-title .pf-card-sub { font-size: 13px; color: var(--ink-500); line-height: 1.5; margin-top: 4px; max-width: 620px; }

  /* ---------- Slider row (score weights) ---------- */
  .pf-slider-row { display: grid; grid-template-columns: 180px 1fr 76px; align-items: center; gap: 16px; padding: 10px 0; }
  .pf-slider-row + .pf-slider-row { border-top: 1px solid var(--surface-3); }
  .pf-slider-row > label { font-size: 13px; font-weight: 600; color: var(--ink-800); display: flex; align-items: center; gap: 10px; }
  .pf-slider-row > label .swatch { width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0; }
  .pf-slider-row > .pf-num {
    font-family: var(--font-numeric); font-weight: 700; font-size: 18px;
    text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-900);
  }
  .pf-slider-row > .pf-num small { font-family: var(--font-sans); font-weight: 500; font-size: 11px; color: var(--ink-500); margin-left: 2px; }

  /* ---------- Range slider ----------
     Explicitly styled so the fill colour survives everywhere — native
     accent-color is not reliably honoured across browsers. Vector ships no
     slider component, so this stays a native input. */
  input[type=range].pf-range {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 22px; background: transparent; cursor: pointer; margin: 0;
  }
  input[type=range].pf-range:focus { outline: none; }
  input[type=range].pf-range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px rgba(224,120,46,0.35); }
  input[type=range].pf-range:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px rgba(224,120,46,0.35); }
  input[type=range].pf-range::-webkit-slider-runnable-track { height: 4px; border-radius: 999px; background: var(--surface-3); }
  input[type=range].pf-range::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; margin-top: -7px; border-radius: 50%;
    background: var(--amber-500); border: 2px solid #fff; box-shadow: var(--elev-1);
  }
  input[type=range].pf-range::-moz-range-track { height: 4px; border-radius: 999px; background: var(--surface-3); }
  input[type=range].pf-range::-moz-range-progress { height: 4px; border-radius: 999px; background: var(--amber-500); }
  input[type=range].pf-range::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--amber-500); border: 2px solid #fff; box-shadow: var(--elev-1);
  }

  /* ---------- Vector number fields in the knob tables ---------- */
  .pf-num-field {
    width: 88px;
    --vaadin-input-field-height: 34px;
  }
  .pf-num-field::part(input-field) { border-radius: 8px; font-family: var(--font-mono); font-size: 13px; }
  .pf-num-field input { text-align: right; font-variant-numeric: tabular-nums; }
  .pf-dur { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pf-dur .pf-num-field { width: 78px; }

  /* ---------- Unit toggle (hrs / days) ---------- */
  .pf-unit-toggle {
    --vwc-toggle-button-height: 30px;
  }
  .pf-unit-toggle vwc-toggle-button {
    font-family: var(--font-mono); font-size: 11px;
    letter-spacing: 0.3px; text-transform: uppercase; font-weight: 600;
  }

  /* ---------- Per-type timing button (compact, column-aligned) ---------- */
  .pf-imp-timing {
    width: 30px; height: 30px; border-radius: var(--radius-pill);
    border: 1px solid var(--ink-200); background: var(--surface-1); color: var(--ink-500);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
    transition: background 0.12s, border-color 0.12s, color 0.12s;
  }
  .pf-imp-timing:hover { background: var(--surface-3); color: var(--ink-700); border-color: var(--ink-300); }
  .pf-imp-timing.has-override { background: var(--amber-50); border-color: var(--amber-300); color: var(--amber-700); }

  /* ---------- Per-type override panel ---------- */
  .pf-imp-override {
    grid-column: 1 / -1; margin-top: 8px; padding: 14px 16px;
    background: var(--surface-2); border: 1px solid var(--ink-100);
    border-left: 3px solid var(--amber-400); border-radius: 10px;
  }
  .pf-imp-override-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .pf-imp-override-head .lbl { font-size: 11px; font-weight: 700; color: var(--ink-700); letter-spacing: 0.8px; text-transform: uppercase; }
  .pf-imp-override-sub {
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
    color: var(--ink-500); margin-bottom: 8px;
  }
  .pf-imp-override .pf-tier-grid { font-size: 12px; }
  .pf-imp-override .pf-tier-grid .pf-tier-row > * { padding: 10px 0; }

  /* ---------- Tier table ---------- */
  .pf-tier-grid { display: grid; grid-template-columns: 1.3fr 1.4fr 0.9fr; gap: 0 20px; align-items: center; font-size: 13px; }
  .pf-tier-grid .pf-tier-h {
    font-size: 10.5px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--ink-500); padding: 0 0 10px; border-bottom: 1px solid var(--ink-100);
  }
  .pf-tier-grid .pf-tier-row { display: contents; }
  .pf-tier-grid .pf-tier-row > * { padding: 10px 0; }
  .pf-tier-grid .pf-tier-row + .pf-tier-row > * { border-top: 1px solid var(--surface-3); }
  .pf-tier-grid .pf-tier-label { display: flex; align-items: center; gap: 12px; font-weight: 500; color: var(--ink-800); }
  .pf-tier-grid .pf-tier-dot { width: 10px; height: 10px; border-radius: 99px; flex-shrink: 0; }
  .pf-tier-grid .pf-tier-static { color: var(--ink-400); font-size: 12px; }

  /* ---------- Importance table ---------- */
  .pf-imp-section + .pf-imp-section { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--ink-100); }
  .pf-imp-section-head {
    display: flex; align-items: center; gap: 10px; margin-bottom: 4px;
    font-size: 11px; font-weight: 700; letterspacing: 1.4px; letter-spacing: 1.4px;
    text-transform: uppercase; color: var(--ink-700);
  }
  .pf-imp-section-head .src-bar { width: 3px; height: 14px; border-radius: 2px; }
  .pf-imp-section-head .count { color: var(--ink-400); font-weight: 600; letter-spacing: 0; text-transform: none; margin-left: 4px; }

  .pf-imp-row {
    display: grid; grid-template-columns: 34px minmax(140px, 1.2fr) minmax(150px, 1.6fr) 46px 34px;
    align-items: center; gap: 12px; padding: 9px 0;
  }
  .pf-imp-row + .pf-imp-row { border-top: 1px solid var(--surface-3); }
  .pf-imp-icon { width: 34px; height: 34px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; }
  .pf-imp-name { font-size: 13.5px; font-weight: 500; color: var(--ink-900); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pf-imp-val {
    font-family: var(--font-numeric); font-weight: 700; font-size: 16px;
    text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-900);
  }

  /* ---------- Priority bands ---------- */
  .pf-bandlist { display: flex; flex-direction: column; gap: 8px; }
  .pf-bandrow {
    display: grid; grid-template-columns: 14px minmax(0, 1fr) auto auto;
    align-items: center; gap: 12px; border-radius: 12px; padding: 12px 14px;
    border: 1px solid rgba(0,0,0,0.06);
  }
  .pf-bandrow-swatch { width: 14px; height: 14px; border-radius: 5px; }
  .pf-bandrow-name {
    font-family: var(--font-numeric); font-weight: 700; font-size: 15px; letter-spacing: 0.2px;
    background: transparent; border: none; border-bottom: 1px dashed transparent;
    padding: 3px 2px; min-width: 0; width: 100%;
  }
  .pf-bandrow-name:hover { border-bottom-color: rgba(0,0,0,0.18); }
  .pf-bandrow-name:focus { outline: none; border-bottom-color: currentColor; }
  .pf-bandrow-range { font-family: var(--font-mono); font-size: 12px; opacity: 0.85; justify-self: end; white-space: nowrap; }
  .pf-bandrow-cut { display: inline-flex; align-items: center; gap: 8px; justify-self: end; }
  .pf-bandrow-cut .ge { font-family: var(--font-mono); font-size: 14px; opacity: 0.7; }
  .pf-bandrow-cut .pf-num-field { width: 76px; }
  .pf-bandrow-floorlbl { font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; opacity: 0.55; padding-right: 4px; }
  .pf-addband {
    margin-top: 12px; width: 100%; padding: 11px;
    border: 1px dashed var(--ink-200); background: var(--surface-2);
    border-radius: var(--radius-pill); color: var(--ink-600); font-family: inherit;
    font-size: 13px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: background 0.12s, border-color 0.12s;
  }
  .pf-addband:hover { background: var(--surface-3); border-color: var(--ink-300); color: var(--ink-800); }

  /* ---------- Formula chip ---------- */
  .pf-formula {
    font-family: var(--font-mono); font-size: 12.5px;
    background: var(--surface-2); border: 1px dashed var(--ink-200);
    padding: 14px 18px; border-radius: 12px; margin-top: 18px;
    line-height: 1.7; color: var(--ink-700);
  }
  .pf-formula b { color: var(--ink-900); font-weight: 600; }
  .pf-formula em { font-style: normal; color: var(--amber-600); font-weight: 700; font-family: var(--font-numeric); }
  .pf-formula .footnote { margin-top: 8px; font-family: var(--font-sans); color: var(--ink-500); font-size: 11.5px; }

  /* ---------- Warn callout ---------- */
  .pf-warn {
    background: var(--coral-50); color: var(--coral-500); border: 1px solid var(--coral-200);
    padding: 10px 14px; border-radius: 10px; font-size: 12.5px;
    display: flex; align-items: center; gap: 8px; margin-top: 14px;
  }

  /* ---------- Preview rail ----------
     The preview floats: a full-height track holds the card, and JS eases the
     card's translateY so it drifts to stay beside whatever the admin is
     looking at as they scroll. */
  .pf-preview { padding: 22px 22px 18px; }
  .pf-preview-track { align-self: stretch; position: relative; }
  .pf-preview-floater { will-change: transform; }
  .pf-preview .pf-card-head { margin-bottom: 14px; padding-bottom: 12px; }
  .pf-preview .pf-card-title h2 { font-size: 20px; }
  .pf-preview-task {
    padding: 12px 14px; border-radius: 12px;
    background: var(--surface-2); border: 1px solid var(--ink-100);
    margin-bottom: 8px; display: grid; grid-template-columns: 1fr auto;
    gap: 4px 12px; transition: background 0.15s;
  }
  .pf-preview-task:hover { background: var(--surface-3); }
  .pf-preview-task .pf-preview-title { font-size: 12.5px; font-weight: 600; line-height: 1.3; color: var(--ink-900); }
  .pf-preview-task .pf-preview-meta {
    font-size: 10.5px; color: var(--ink-500); font-family: var(--font-mono);
    letter-spacing: 0.3px; text-transform: uppercase; grid-column: 1 / 2;
  }
  /* Band-name pill, not a score. Sized to sit quietly beside the task title
     rather than shouting a 24px number at it. */
  .pf-preview-task .pf-preview-score {
    font-weight: 600; font-size: 11.5px; line-height: 1;
    padding: 5px 10px; border-radius: 999px; white-space: nowrap;
    align-self: center; justify-self: end; grid-row: 1 / 3; grid-column: 2;
  }
  .pf-preview-type { grid-template-columns: 32px 1fr auto; }
  .pf-preview-type .pf-ptype-icon {
    grid-row: 1 / 3; grid-column: 1; width: 32px; height: 32px; border-radius: 9px;
    display: inline-flex; align-items: center; justify-content: center; align-self: center;
  }
  .pf-preview-type .pf-preview-title { grid-column: 2; }
  .pf-preview-type .pf-preview-meta { grid-column: 2 / 3; }
  .pf-preview-type .pf-preview-score { grid-column: 3; grid-row: 1 / 3; }
  .pf-preview-foot {
    font-size: 11.5px; margin-top: 14px; padding: 12px 14px;
    background: var(--ink-900); color: rgba(255,255,255,0.85);
    border-radius: 10px; line-height: 1.5;
  }
  .pf-preview-foot b { color: var(--amber-200); font-weight: 600; }

  /* Preview tabs — vaadin-tabs restyled to the design's segmented look */
  .pf-preview-tabs {
    background: var(--surface-3); border-radius: var(--radius-pill); padding: 4px; margin-bottom: 14px;
    --vaadin-tabs-gap: 4px;
  }
  .pf-preview-tabs::part(tabs) { gap: 4px; }
  .pf-preview-tabs vaadin-tab {
    flex: 1; justify-content: center; border-radius: var(--radius-pill);
    font-size: 12.5px; font-weight: 600; color: var(--ink-500); min-height: 34px;
    padding: 0 8px;
  }
  .pf-preview-tabs vaadin-tab[selected] { background: var(--surface-1); color: var(--ink-900); box-shadow: var(--elev-1); }
  .pf-preview-tabs vaadin-tab::before, .pf-preview-tabs vaadin-tab::after { display: none !important; }

  /* ---------- Advanced section (vaadin-details) ---------- */
  .pf-advanced {
    margin-top: 18px; background: var(--surface-1);
    border: 1px solid var(--ink-100); border-radius: var(--radius-lg);
    box-shadow: var(--elev-1); overflow: hidden;
  }
  .pf-advanced::part(content) { padding: 0; border: none; }
  /* vaadin-details renders <slot name="summary">, so the summary is a LIGHT-DOM
     child — ::part(summary) never reaches it. Style the element directly. */
  .pf-advanced > vaadin-details-summary { padding: 16px 20px; border-radius: 0; }
  /* Lumo hangs the chevron 3.5px outside the summary box (negative margin-left),
     which pushed it past the card's left edge. Align it with the 20px padding and
     give it the same 12px gap the icon tile has from the text. */
  .pf-advanced > vaadin-details-summary::part(toggle) { margin-left: 0; margin-right: 12px; }
  .pf-adv-summary { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; }
  .pf-adv-icon {
    width: 32px; height: 32px; border-radius: 8px;
    background: var(--surface-1); color: var(--ink-600);
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .pf-adv-text b { display: block; font-size: 13.5px; font-weight: 600; color: var(--ink-900); margin-bottom: 2px; }
  .pf-adv-text span { font-size: 12px; color: var(--ink-500); font-weight: 400; }
  /* Sub-cards render flat inside the container so they read as nested
     children rather than disconnected siblings. */
  .pf-advanced .pf-card { margin-top: 0; border: none; border-radius: 0; box-shadow: none; padding: 22px 28px; }
  .pf-advanced .pf-card + .pf-card { border-top: 6px solid var(--surface-3); }
  .pf-advanced .pf-card .pf-card-head { padding-bottom: 14px; margin-bottom: 16px; }

  /* ---------- Sticky toolbar ---------- */
  .pf-toolbar {
    position: sticky; bottom: 0; z-index: 20;
    background: var(--surface-1); border-top: 1px solid var(--ink-100);
    padding: 14px 28px; box-shadow: 0 -2px 10px rgba(19, 29, 39,0.04);
  }
  .pf-toolbar-inner { max-width: 1520px; margin: 0 auto; width: 100%; display: flex; align-items: center; gap: 12px; }
  .pf-status { margin-right: auto; font-size: 12.5px; color: var(--ink-500); display: flex; align-items: center; gap: 8px; }
  .pf-status.dirty { color: var(--amber-600); }
  .pf-status .pf-dirty-dot { width: 8px; height: 8px; border-radius: 99px; background: var(--amber-400); animation: pf-pulse 1.5s ease-in-out infinite; }
  @keyframes pf-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.6; } }
</style>
</head>
<body>

<div id="root"></div>

<script>
  // Pick up the theme the user chose in the hub so sibling pages stay in sync.
  try {
    var t = localStorage.getItem('keystone.theme');
    if (t && t !== 'ember') document.body.setAttribute('data-theme', t);
  } catch (e) {}
</script>

<script src="data.js"></script>
<script src="keystone-shared.js"></script>
<script src="prioritization.js"></script>

<!-- Design Toolbox: review tooling (comment widget). NOT part of the product design —
     developers must strip this include for production. -->
<script src="../../../../designtoolbox/toolbox.js?v=1.1.0"></script>

</body>
</html>
