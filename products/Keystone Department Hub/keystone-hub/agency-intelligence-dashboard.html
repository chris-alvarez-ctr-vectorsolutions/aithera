<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copilot — Keystone</title>

<!--
  AI Reporting Copilot — the build surface from the Keystone PRD.

  Views:
    · Copilot home — Dashboards tab (dense sortable/filterable/paginated
      management table, plus a card view) and AI access tab (homepage Vectoria
      grants + a full audit log of every question answered)
    · Build view — the two-pane dashboard canvas + Vectoria, the docked
      text-only chat. Charts land on the canvas, never in the chat.

  Admin-facing: dashboards are published to job titles / individuals with
  access reconciliation, or scheduled out as a report. Reuses the Keystone
  data layer, primitives, and chart renderers.

  Reskinned on Vector web components: vaadin-text-field for search and naming,
  vaadin-button throughout, vwc-paginator for the table pager,
  vwc-sortable-header for column sorting, vaadin-dialog for the publish and
  export flows, vwc-toggle-button-group for the view/mode switches.
-->

<link rel="stylesheet" href="styles.css">

<!-- Vector Web Components — core + themes + Open Sans + Font Awesome -->
<script type="module" src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.5.1/core.iife.js"></script>
<script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.1.1/styles.js"></script>
<link rel="stylesheet" href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
  /* ====================================================================
     PAGE HEADER + TABS
     ==================================================================== */
  .cp-page { padding: 4px 0 40px; }
  .cp-page-head { display: flex; align-items: flex-end; gap: 16px; padding: 20px 0 14px; }
  .cp-page-head h1 { font-family: var(--font-display); font-weight: 500; font-size: 30px; color: var(--ink-900); margin: 0; }
  .cp-page-head p { font-size: 14px; color: var(--ink-500); margin: 8px 0 0; max-width: 640px; line-height: 1.5; }
  .vectoria-mark {
    border-radius: 9px; flex-shrink: 0; color: white;
    background: linear-gradient(135deg, var(--amber-400) 0%, var(--coral-400) 100%);
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(245,158,11,0.4), inset 0 -2px 0 rgba(0,0,0,0.16);
  }
  .cp-tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--ink-100); margin-bottom: 20px; }
  .cp-tab {
    display: inline-flex; align-items: center; gap: 7px; padding: 9px 2px 11px;
    background: transparent; border: none; cursor: pointer; font-family: inherit;
    font-size: 14.5px; font-weight: 600; color: var(--ink-500);
  }
  .cp-tab:hover { color: var(--ink-700); }
  .cp-tab.is-on { color: var(--ink-900); box-shadow: inset 0 -2px 0 var(--lumo-primary-color); }
  .cp-tab .attn {
    font-family: var(--font-numeric); font-size: 11px; font-weight: 700;
    color: var(--lumo-error-text-color); background: var(--lumo-error-color-10pct);
    border-radius: 999px; padding: 1px 7px; font-variant-numeric: tabular-nums;
  }

  /* ====================================================================
     DASHBOARDS TABLE + CARDS
     ==================================================================== */
  .cp-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .cp-search { flex: 1 1 260px; max-width: 360px; min-width: 200px; }
  .cp-seg {
    display: inline-flex; align-items: stretch; border: 1px solid var(--ink-200);
    border-radius: 999px; background: var(--surface-1); overflow: hidden; box-shadow: var(--elev-1);
  }
  .cp-seg button {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; cursor: pointer;
    border: none; background: transparent; color: var(--ink-700);
    font-size: 14px; font-weight: 500; font-family: inherit; transition: background 0.15s;
  }
  .cp-seg button + button { border-left: 1px solid var(--ink-100); }
  .cp-seg button:hover:not(.is-on) { background: var(--surface-3); }
  .cp-seg button .n {
    font-family: var(--font-numeric); font-weight: 700; font-size: 13px; line-height: 1;
    color: var(--ink-500); font-variant-numeric: tabular-nums;
  }
  .cp-seg button.is-on .n { color: inherit; }

  .cp-table-card {
    background: var(--surface-1); border-radius: 16px; border: 1px solid var(--ink-100);
    overflow: hidden; box-shadow: var(--elev-1);
  }
  .cp-table-scroll { overflow-x: auto; }
  table.cp-table { width: 100%; border-collapse: collapse; min-width: 1010px; }
  table.cp-table thead th {
    padding: 10px 8px; text-align: left; background: var(--surface-2);
    border-bottom: 1px solid var(--ink-100);
    font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--ink-500);
  }
  table.cp-table thead th.is-num { text-align: right; }
  .cp-table vwc-sortable-header::part(button) {
    font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
    color: var(--ink-500); padding: 0;
  }
  tr.cp-row { cursor: pointer; transition: background 0.12s; }
  tr.cp-row > td { padding: 10px 8px; border-bottom: 1px solid var(--ink-100); vertical-align: middle; }
  tr.cp-row:last-child > td { border-bottom: none; }
  tr.cp-row:hover > td { background: var(--surface-3); }
  tr.cp-row > td:first-child { border-left: 3px solid transparent; padding-left: 11px; }
  .cp-dash-name { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .cp-dash-icon {
    width: 32px; height: 32px; border-radius: 8px; background: var(--amber-100); color: var(--amber-700);
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .cp-dash-name .t {
    font-size: 14px; font-weight: 600; color: var(--ink-900); line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cp-dash-name .s { font-size: 11px; color: var(--ink-500); }
  .cp-num { font-family: var(--font-numeric); font-size: 14px; font-weight: 600; color: var(--ink-700); text-align: right; font-variant-numeric: tabular-nums; }
  .cp-status {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 700; white-space: nowrap;
  }
  .cp-sources { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; align-items: center; }
  .cp-sources .dot { width: 12px; height: 12px; border-radius: 4px; margin: 0 auto; }
  .cp-pill-count {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px;
    background: var(--surface-3); border: 1px solid var(--ink-100);
    font-size: 12px; font-weight: 600; color: var(--ink-700); white-space: nowrap;
  }
  .cp-aud-title {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 700;
    color: var(--teal-600); background: var(--teal-50); border: 1px solid var(--teal-100);
    padding: 3px 8px; border-radius: 999px;
  }
  .cp-aud-ind {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600;
    color: var(--ink-600); background: var(--surface-3); padding: 3px 8px; border-radius: 999px;
  }
  .cp-cardgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(288px, 1fr)); gap: 14px; }
  .cp-dcard {
    display: flex; flex-direction: column; background: var(--surface-1); border-radius: 14px;
    border: 1px solid var(--ink-100); box-shadow: var(--elev-1); cursor: pointer; overflow: hidden;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.08s;
  }
  .cp-dcard:hover { border-color: var(--amber-300); box-shadow: var(--elev-2); transform: translateY(-2px); }
  .cp-dcard-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 16px; border-top: 1px solid var(--ink-100); background: var(--surface-2);
  }
  .cp-empty-table {
    background: var(--surface-1); border-radius: 16px; border: 1px solid var(--ink-100);
    padding: 48px 20px; text-align: center;
  }
  .cp-pager-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; flex-wrap: wrap; }

  /* Dashboards empty state */
  .cp-first-run {
    background: var(--surface-1); border: 1px dashed var(--ink-200); border-radius: 22px;
    padding: 72px 24px; text-align: center;
  }
  .cp-first-run h2 { font-family: var(--font-display); font-weight: 500; font-size: 34px; color: var(--ink-900); margin: 20px 0 8px; }
  .cp-first-run p { font-size: 15.5px; color: var(--ink-500); max-width: 480px; margin: 0 auto 26px; line-height: 1.55; }

  /* ====================================================================
     BUILD VIEW
     ==================================================================== */
  .cp-build { display: flex; flex-direction: column; min-height: calc(100vh - 120px); }
  .cp-build-bar { display: flex; align-items: center; gap: 14px; padding: 18px 0 14px; }
  .cp-build-name {
    font-family: var(--font-display); font-weight: 500; font-size: 24px; color: var(--ink-900);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cp-saved { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--ink-400); white-space: nowrap; }
  .cp-modes { display: flex; gap: 3px; background: var(--surface-3); padding: 3px; border-radius: 9px; }
  .cp-modes button {
    display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 7px;
    border: none; cursor: pointer; font-size: 12px; font-weight: 600; font-family: inherit;
    background: transparent; color: var(--ink-500);
  }
  .cp-modes button.is-on { background: var(--surface-1); color: var(--ink-900); box-shadow: var(--elev-1); }
  .cp-panes { flex: 1; display: flex; gap: 16px; min-height: 0; align-items: flex-start; }
  .cp-panes.dock-left { flex-direction: row-reverse; }
  .cp-canvas { flex: 1; min-width: 0; }
  .cp-grid { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: 14px; row-gap: 14px; align-items: start; }
  @media (max-width: 900px) { .cp-grid > * { grid-column: 1 / -1 !important; } .cp-panes { flex-direction: column; } }

  .cpw-card {
    background: var(--surface-1); border: 1px solid var(--ink-100); border-radius: 14px;
    box-shadow: var(--elev-1); padding: 14px; display: flex; flex-direction: column; min-width: 0;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .cpw-card:hover { border-color: var(--ink-200); }
  .cpw-card.is-selected { border-color: var(--amber-400); box-shadow: 0 0 0 3px var(--amber-50); }
  .cpw-card:focus-visible { outline: 2px solid var(--lumo-primary-color); outline-offset: 2px; }
  .cpw-card-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .cpw-icon {
    width: 24px; height: 24px; border-radius: 6px; background: var(--amber-100); color: var(--amber-700);
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .cpw-title {
    font-size: 13.5px; font-weight: 700; color: var(--ink-900);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  .cpw-kebab {
    width: 28px; height: 28px; border-radius: 7px; border: none; background: transparent;
    color: var(--ink-400); display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .cpw-kebab:hover { background: var(--surface-3); color: var(--ink-700); }
  .cpw-range { margin-top: 6px; }
  .cpw-body { margin-top: 12px; flex: 1; }
  .cpw-shimmer {
    background: linear-gradient(90deg, var(--ink-100) 25%, var(--surface-3) 37%, var(--ink-100) 63%);
    background-size: 400% 100%; animation: shimmer 1.4s ease infinite;
  }
  .cpw-text::part(input-field) { background: var(--surface-2); }

  .cp-canvas-empty {
    background: var(--surface-1); border: 1px dashed var(--ink-200); border-radius: 18px;
    min-height: 460px; display: flex; align-items: center; justify-content: center; padding: 20px;
  }

  /* Vectoria dock */
  .cpv-panel {
    width: 376px; flex-shrink: 0; align-self: stretch; display: flex; flex-direction: column;
    background: var(--surface-1); border: 1px solid var(--ink-100); border-radius: 16px;
    box-shadow: var(--elev-1); overflow: hidden; min-height: 0; max-height: calc(100vh - 160px);
  }
  @media (max-width: 900px) { .cpv-panel { width: 100%; max-height: 520px; } }
  .cpv-head {
    display: flex; align-items: center; gap: 11px; padding: 13px 14px;
    border-bottom: 1px solid var(--ink-100);
    background: linear-gradient(180deg, var(--surface-1), var(--surface-2));
  }
  .cpv-thread { flex: 1; min-height: 220px; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 14px; }
  .cpv-user { display: flex; justify-content: flex-end; }
  .cpv-user .bubble {
    max-width: 86%; padding: 8px 12px; border-radius: 14px 14px 4px 14px;
    background: var(--ink-900); color: white; font-size: 13px; line-height: 1.45;
  }
  .cpv-ai { display: flex; gap: 9px; align-items: flex-start; }
  .cpv-ai .bubble {
    background: var(--surface-2); border: 1px solid var(--ink-100);
    border-radius: 14px 14px 14px 4px; padding: 9px 12px;
    font-size: 13px; line-height: 1.5; color: var(--ink-700);
  }
  .cpv-added {
    display: inline-flex; align-items: center; gap: 7px; align-self: flex-start;
    padding: 5px 10px; background: var(--teal-50); border: 1px solid var(--teal-100);
    border-radius: 8px; font-size: 11.5px; color: var(--teal-600); font-weight: 600;
  }
  .cpv-choice {
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--ink-200);
    background: var(--surface-1); color: var(--ink-800); font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .cpv-choice:hover { border-color: var(--amber-400); background: var(--amber-50); }
  .cpv-input-wrap { border-top: 1px solid var(--ink-100); padding: 11px; background: var(--surface-2); }
  .cpv-input {
    display: flex; align-items: flex-end; gap: 8px; background: var(--surface-1);
    border: 1px solid var(--ink-200); border-radius: 13px; padding: 7px 8px 7px 13px;
  }
  .cpv-input:focus-within { border-color: var(--amber-400); box-shadow: 0 0 0 3px var(--amber-50); }
  .cpv-input textarea {
    flex: 1; resize: none; border: none; outline: none; background: transparent;
    font-family: inherit; font-size: 13px; color: var(--ink-900);
    padding: 5px 0; min-height: 60px; max-height: 140px; line-height: 1.4;
  }
  .cpv-dot { width: 6px; height: 6px; border-radius: 99px; background: var(--ink-500); display: inline-block; animation: cpv-bounce 1s ease-in-out infinite; }
  @keyframes cpv-bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-3px); opacity: 1; } }
  .cpv-collapsed {
    width: 56px; align-self: stretch; flex-shrink: 0;
    background: var(--surface-1); border: 1px solid var(--ink-100); border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 16px 0;
    cursor: pointer; box-shadow: var(--elev-1);
  }
  .cpv-collapsed .vlabel { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 12px; font-weight: 700; letter-spacing: 1px; color: var(--ink-600); }

  /* Widget builder (empty canvas) */
  .cp-builder { width: 100%; max-width: 860px; }
  .cp-builder-modes { display: flex; gap: 3px; background: var(--surface-3); padding: 3px; border-radius: 9px; align-self: flex-start; }
  .cp-step { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .cp-step .n {
    width: 20px; height: 20px; border-radius: 99px; background: var(--ink-900); color: white;
    font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .cp-step .t { font-size: 13px; font-weight: 700; color: var(--ink-800); }
  .cp-metric-btn {
    display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 9px;
    cursor: pointer; font-family: inherit; text-align: left; width: 100%;
    background: var(--surface-1); border: 1px solid var(--ink-100);
    font-size: 12.5px; font-weight: 600; color: var(--ink-800);
    transition: border-color .12s;
  }
  .cp-metric-btn:hover { border-color: var(--ink-300); }
  .cp-metric-btn.is-on { background: var(--amber-50); border-color: var(--amber-400); box-shadow: 0 0 0 2px var(--amber-50); }
  .cp-metric-btn .ic {
    width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0;
    background: var(--amber-100); color: var(--amber-700);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cp-metric-btn.is-on .ic { background: var(--amber-400); color: white; }
  .cp-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 11px; border-radius: 8px;
    cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 600;
    background: var(--surface-1); color: var(--ink-700); border: 1px solid var(--ink-200);
    transition: background .12s;
  }
  .cp-chip.is-on { background: var(--ink-900); color: white; border-color: var(--ink-900); }
  .cp-param-panel { margin-top: 14px; padding: 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--ink-100); }
  .cp-cat-chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 999px;
    cursor: pointer; font-family: inherit; font-size: 11.5px; font-weight: 600;
    background: var(--surface-1); color: var(--ink-600); border: 1px solid var(--ink-200);
  }
  .cp-cat-chip.is-on { background: var(--amber-50); color: var(--amber-700); border-color: var(--amber-400); }
  .cp-idea {
    display: flex; align-items: flex-start; gap: 11px; padding: 13px; border-radius: 13px;
    text-align: left; cursor: pointer; font-family: inherit;
    background: var(--surface-1); border: 1px solid var(--ink-100); box-shadow: var(--elev-1);
    transition: border-color .15s, box-shadow .15s;
  }
  .cp-idea.is-on { background: var(--amber-50); border-color: var(--amber-400); box-shadow: 0 0 0 3px var(--amber-50); }
  .cp-idea .box {
    width: 22px; height: 22px; border-radius: 6px; margin-top: 1px; flex-shrink: 0;
    background: var(--surface-1); border: 1px solid var(--ink-300);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .cp-idea.is-on .box { background: var(--amber-400); border-color: var(--amber-400); color: white; }

  /* ====================================================================
     DATA EXPLORER
     ==================================================================== */
  .ex-quickstart {
    display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px;
    border-radius: 12px; cursor: pointer; text-align: left; font-family: inherit;
    background: var(--surface-1); border: 1px solid var(--ink-200);
    transition: background 0.15s, border-color 0.15s;
  }
  .ex-quickstart:hover { border-color: var(--amber-400); background: var(--amber-50); }
  .ex-quickstart .ic {
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--amber-100); color: var(--amber-700);
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .ex-card {
    background: var(--surface-1); border: 1px solid var(--ink-100); border-radius: 14px;
    box-shadow: var(--elev-1); padding: 16px;
  }
  .ex-action {
    display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px;
    background: var(--surface-1); border: 1px solid var(--ink-200); color: var(--ink-600);
    font-size: 11.5px; font-weight: 600; cursor: pointer; font-family: inherit; flex-shrink: 0;
  }
  .ex-action:hover { border-color: var(--amber-400); background: var(--amber-50); }

  /* Send-as-report dialog controls */
  .ex-cad {
    display: flex; flex-direction: column; align-items: flex-start; gap: 5px;
    padding: 11px 12px; border-radius: 11px; cursor: pointer; font-family: inherit; text-align: left;
    background: var(--surface-1); border: 1px solid var(--ink-200);
  }
  .ex-cad.is-on { background: var(--amber-50); border-color: var(--amber-400); box-shadow: 0 0 0 2px var(--amber-50); }
  .ex-chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px;
    background: var(--surface-1); border: 1px solid var(--ink-200); color: var(--ink-700);
    font-size: 11.5px; font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .ex-chip:hover { border-color: var(--amber-400); }
  .ex-chip.is-on { background: var(--amber-50); border-color: var(--amber-400); color: var(--amber-700); }
  .ex-fmt {
    display: flex; align-items: center; gap: 11px; padding: 11px 13px; border-radius: 11px;
    cursor: pointer; font-family: inherit; text-align: left;
    background: var(--surface-1); border: 1px solid var(--ink-200);
  }
  .ex-fmt.is-on { background: var(--amber-50); border-color: var(--amber-400); }
  .ex-fmt .radio {
    width: 18px; height: 18px; border-radius: 999px; flex-shrink: 0;
    border: 1.5px solid var(--ink-300);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .ex-fmt.is-on .radio { border-color: var(--amber-400); }
  .ex-fmt .radio .dot { width: 9px; height: 9px; border-radius: 999px; background: var(--amber-400); }

  /* ====================================================================
     AI ACCESS TAB
     ==================================================================== */
  .cp-ai-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 18px; align-items: start; }
  @media (max-width: 1000px) { .cp-ai-grid { grid-template-columns: 1fr; } }
  .cp-panel {
    background: var(--surface-1); border: 1px solid var(--ink-100); border-radius: 16px;
    box-shadow: var(--elev-1); overflow: hidden;
  }
