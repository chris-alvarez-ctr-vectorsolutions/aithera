<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keystone — Department Hub</title>

<!--
  Keystone — a role-adaptive task & readiness hub that unifies open work
  across Vector's first-responder products (TargetSolutions, Check It,
  Guardian Tracking, Scheduling, EV+). Designed standalone with its own
  identity rather than dressed in the Vector LMS shell.

  Four personas, one surface. The role switcher (in the prototype FAB, lower
  right) swaps the hero, the default saved view, and the KPI emphasis:
    1. Battalion Chief  → Coverage & exceptions
    2. Training Officer → Compliance health      (v2, gated)
    3. Lieutenant       → Crew view              (v2, gated)
    4. Firefighter      → Personal queue (hard-scoped to their own tasks)

  v1 ships the greeting header, a published dashboard for the Chief and the
  Firefighter, and the task table. Both dashboards are deliberately one widget
  row tall so the top of the task list clears the fold — which is the whole
  reason they can be on by default. The Firefighter's is the safe-for-everyone
  set: only their own record, nothing about anybody else.

  The "Future functionality" flag in the FAB reveals the phase-2 surfaces: the
  two gated roles and their heroes, saved-view management, the density switcher,
  and reminder/reassign actions. The Battalion Pulse / readiness-facet hero is
  RETIRED — the Chief's published dashboard replaced it.

  Reskinned on Vector web components: the task list is a real table using
  vwc-sortable-header, filters use vaadin-checkbox in popovers, the status
  buckets are a vwc-toggle-button-group, modals are vaadin-dialog, and every
  button is a vaadin-button.
-->

<link rel="stylesheet" href="styles.css">

<!-- Vector Web Components — core + themes + Open Sans + Font Awesome -->
<script type="module" src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.5.1/core.iife.js"></script>
<script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.1.1/styles.js"></script>
<link rel="stylesheet" href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
  /* ====================================================================
     GREETING HEADER
     Slimmed to roughly half its former height. It used to be a two-column
     editorial layout — oversized serif headline balanced by a right rail of
     three big-number "vital sign" tiles. The published dashboard below is now
     what we want the eye to land on, so the greeting gives back both the rail
     and most of its type scale: one column, a smaller (still serif) headline,
     and the day's counts compressed into a single inline stat line.

     Budget: ~175px before, ~90px after. That reclaimed height is what keeps the
     top of the task list above the fold once the dashboard is in place.
     ==================================================================== */
  .kx-hero {
    background: linear-gradient(180deg, var(--surface-1) 0%, var(--surface-1) 70%, transparent 100%);
    padding-bottom: 6px;
  }
  .kx-hero-inner { padding: 16px 24px 6px; }
  .kx-greeting { padding: 4px 0 12px; margin-bottom: 10px; min-width: 0; }
  .kx-eyebrow { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .kx-eyebrow .pip { width: 6px; height: 6px; border-radius: 99px; }
  .kx-eyebrow .txt {
    font-size: 11px; color: var(--ink-500); font-weight: 700;
    letter-spacing: 1.2px; text-transform: uppercase;
  }
  .kx-greeting h1 {
    margin: 0; font-family: var(--font-display); font-weight: 500;
    font-size: clamp(20px, 2.1vw, 26px); line-height: 1.12; letter-spacing: -0.6px;
    color: var(--ink-900); text-wrap: balance;
  }
  .kx-greeting h1 .num { font-variant-numeric: lining-nums tabular-nums; }
  .kx-greeting h1 .muted { color: var(--ink-500); }
  .kx-greeting-sub {
    margin-top: 6px; font-size: 13px; color: var(--ink-600); line-height: 1.45;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .kx-greeting-scope { font-weight: 600; color: var(--ink-700); }

  /* The day overview, inline — replaces the ~70px tile rail with a ~20px line.
     These are task-queue counts, a different layer from the dashboard's
     readiness metrics, so the two never say the same thing. */
  .kx-vitalline { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .kx-vitalline__sep { color: var(--ink-300); }
  .kx-vitalline__stat { display: inline-flex; align-items: baseline; gap: 5px; }
  .kx-vitalline__stat .dot {
    width: 6px; height: 6px; border-radius: 99px; align-self: center; flex-shrink: 0;
  }
  .kx-vitalline__stat .n {
    font-family: var(--font-numeric); font-weight: 700; font-size: 14px;
    letter-spacing: -0.2px; font-variant-numeric: tabular-nums;
  }
  .kx-vitalline__stat .lbl { font-size: 12.5px; color: var(--ink-600); }

  @media (max-width: 860px) {
    .kx-hero-inner { padding: 14px 0 6px; }
    .kx-greeting h1 { font-size: clamp(19px, 5vw, 24px); }
  }

  /* ====================================================================
     FILTER BAR
     ==================================================================== */
  .kx-filterbar { display: flex; flex-direction: column; gap: 10px; padding: 10px 0; }
  .kx-filterbar-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .kx-count {
    font-size: 16px; font-weight: 400; color: var(--ink-700);
    min-width: 72px; font-variant-numeric: tabular-nums; flex-shrink: 0;
  }
  .kx-count span { color: var(--ink-500); font-weight: 500; }

  /* Status buckets — vwc-toggle-button-group standing in for the design's
     segmented control. Tones are applied per button via data-tone. */
  .kx-buckets { --vwc-toggle-button-height: 36px; }
  .kx-buckets vwc-toggle-button { font-size: 15px; font-weight: 400; }
  .kx-buckets vwc-toggle-button .bn {
    font-family: var(--font-numeric); font-weight: 700; font-size: 14px;
    margin-left: 6px; font-variant-numeric: tabular-nums;
  }

  .kx-filter-panel {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 10px 12px; background: var(--surface-2);
    border-radius: 12px; border: 1px solid var(--ink-100);
  }
  .kx-chips { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .kx-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 4px 4px 9px; border-radius: 99px;
    background: var(--ink-900); color: white; font-size: 14px; font-weight: 600;
  }
  .kx-chip .kind { color: var(--amber-200); }
  .kx-chip button {
    background: rgba(255,255,255,0.15); border: none; color: white;
    width: 16px; height: 16px; border-radius: 99px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .kx-clear-all {
    background: transparent; border: none; color: var(--ink-600);
    font-size: 16px; font-weight: 400; padding: 6px 8px; cursor: pointer;
    margin-left: auto; display: inline-flex; align-items: center; gap: 4px;
  }

  /* ====================================================================
     TASK TABLE
     A real <table> so the column headers can be vwc-sortable-header (the
     Vector component built for exactly this). Column widths come from
     <colgroup> and match the prototype's grid track sizes.
     ==================================================================== */
  .kx-table-card {
    background: var(--surface-1); border-radius: 16px;
    border: 1px solid var(--ink-100); overflow: hidden; box-shadow: var(--elev-1);
  }
  table.kx-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  /* Task is the only <col> hub.js leaves width-less, so before this rule it
     absorbed EVERY pixel the page gained once .kx-main lost its 1200px cap —
     1024px at a 1700px viewport, against a longest task title of 426px, which
     left a ~760px hole before the Assignee column. Constraining the column here
     (rather than re-capping the page, which is deliberately uncapped) hands the
     slack back to the fixed-width columns instead: a percentage column takes
     exactly its share and the px columns grow proportionally to fill the rest.
     46% keeps Task comfortably the widest column with no title ellipsised. */
  table.kx-table colgroup col:nth-child(3) { width: 46%; }
  table.kx-table thead th {
    padding: 10px 5px; text-align: left;
    font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
    color: var(--ink-500); background: var(--surface-2);
    border-bottom: 1px solid var(--ink-100);
  }
  table.kx-table thead th:first-child { padding-left: 17px; }
  table.kx-table thead th:last-child { padding-right: 14px; }
  table.kx-table thead th.is-num { text-align: right; }
  .kx-table vwc-sortable-header { font: inherit; color: inherit; letter-spacing: inherit; }
  .kx-table vwc-sortable-header::part(button) {
    font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
    color: var(--ink-500); padding: 0;
  }
  .kx-table th[aria-sort] vwc-sortable-header::part(button) { color: var(--ink-900); }

  tr.kx-task-row { cursor: pointer; transition: background 0.15s; }
  tr.kx-task-row > td {
    padding: 14px 5px; vertical-align: middle;
    border-bottom: 1px solid var(--ink-100);
  }
  tr.kx-task-row > td:first-child { padding-left: 14px; }
  tr.kx-task-row > td:last-child { padding-right: 14px; text-align: right; }
  .kx-table.is-compact tr.kx-task-row > td { padding-top: 8px; padding-bottom: 8px; }
  tr.kx-task-row:hover > td { background: var(--surface-3); }
  tr.kx-task-row.is-open > td { background: var(--surface-2); }
  /* Status stripe on the leading edge — coral for late, amber for at-risk. */
  tr.kx-task-row > td:first-child { border-left: 3px solid transparent; }
  tr.kx-task-row.is-late > td:first-child { border-left-color: var(--coral-400); }
  tr.kx-task-row.is-risk > td:first-child { border-left-color: var(--amber-400); }

  .kx-chevron {
    width: 28px; height: 28px; border-radius: var(--radius-pill); padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink-500); background: transparent; border: 1px solid transparent;
    cursor: pointer; transition: transform 0.18s, background 0.15s, border-color 0.15s;
  }
  .kx-chevron:hover { background: var(--surface-1); border-color: var(--ink-200); }
  tr.kx-task-row.is-open .kx-chevron { transform: rotate(90deg); }

  .kx-task-cell { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .kx-task-title {
    font-weight: 400; font-size: 16px; color: var(--ink-900);
    display: flex; align-items: center; gap: 6px; min-width: 0;
  }
  .kx-task-title > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .kx-task-type { font-size: 13px; color: var(--ink-500); margin-top: 1px; }
  .kx-mandatory {
    flex-shrink: 0; padding: 0 6px; background: var(--amber-100); color: var(--amber-700);
    border-radius: 4px; font-weight: 700; font-size: 10px;
  }
  .kx-assignees { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .kx-assignees .nm {
    font-size: 15px; font-weight: 400; color: var(--ink-900);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .kx-assignees .rk, .kx-assignees .st, .kx-assignees .more {
    font-size: 10px; color: var(--ink-500);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .kx-assignees .more { font-weight: 600; }
  .kx-assignees .none { font-size: 12px; color: var(--ink-500); font-style: italic; }

  /* Expanded detail */
  tr.kx-detail-row > td { padding: 0 14px 18px 60px; background: var(--surface-2); border-bottom: 1px solid var(--ink-100); }
  .kx-detail {
    background: var(--surface-1); border: 1px solid var(--ink-100); border-radius: 12px;
    overflow: hidden; display: grid; grid-template-columns: 1.4fr 1fr;
    animation: kx-expand-in 0.25s ease-out;
  }
  .kx-detail-left { padding: 18px; }
  .kx-detail-right { padding: 18px; background: var(--surface-2); border-left: 1px solid var(--ink-100); }
  .kx-detail-eyebrow {
    display: flex; align-items: center; gap: 10px;
    font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--ink-500); margin-bottom: 12px;
  }
  .kx-meta-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .kx-field-lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: var(--ink-500); }
  .kx-field-val { font-size: 13px; font-weight: 500; margin-top: 2px; color: var(--ink-900); font-variant-numeric: tabular-nums; }
  .kx-field-val.is-big { font-size: 16px; font-weight: 600; }
  .kx-field-val.is-mono { font-family: var(--font-mono); }
  .kx-assignee-card {
    display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px;
    background: var(--surface-1); border: 1px solid var(--ink-100);
  }
  .kx-info-note {
    display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-600);
    font-style: italic; background: var(--amber-50); padding: 10px 12px;
    border-radius: 8px; border: 1px solid var(--amber-100);
  }
  .kx-activity { display: flex; flex-direction: column; position: relative; padding-left: 12px; }
  .kx-activity::before { content: ""; position: absolute; left: 10px; top: 8px; bottom: 8px; width: 1px; background: var(--ink-200); }
  .kx-activity-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; position: relative; }
  .kx-activity-row .pip {
    position: absolute; left: -7px; width: 12px; height: 12px; border-radius: 99px;
    background: var(--surface-2); border: 2px solid var(--ink-300);
  }
  .kx-activity-row.is-bad .pip { border-color: var(--coral-400); }
  .kx-activity-row .txt { margin-left: 12px; font-size: 12px; color: var(--ink-700); flex: 1; }
  .kx-activity-row .when { font-size: 11px; color: var(--ink-500); font-variant-numeric: tabular-nums; }
  .kx-checklist { display: flex; flex-wrap: wrap; gap: 3px; }
  .kx-checklist span { width: 12px; height: 12px; border-radius: 3px; background: var(--ink-100); }
  .kx-checklist span.is-done { background: var(--teal-400); }
  .kx-progress-track { height: 10px; background: var(--ink-100); border-radius: 99px; overflow: hidden; }
  .kx-progress-fill { height: 100%; background: linear-gradient(90deg, var(--teal-400), var(--teal-300)); transition: width 0.6s; }

  /* Mobile card surface — same data, restructured below the breakpoint */
  .kx-mobile-cards { display: none; }
  .kx-mcard { padding: 14px; border-bottom: 1px solid var(--ink-100); border-left: 3px solid transparent; cursor: pointer; }
  .kx-mcard.is-late { border-left-color: var(--coral-400); }
  .kx-mcard.is-risk { border-left-color: var(--amber-400); }
  @media (max-width: 860px) {
    .kx-table { display: none; }
    .kx-mobile-cards { display: block; }
    .kx-detail { grid-template-columns: 1fr; }
    .kx-detail-right { border-left: none; border-top: 1px solid var(--ink-100); }
  }

  /* Empty states */
  .kx-empty {
    padding: 60px; text-align: center; background: var(--surface-1);
    border-radius: 16px; border: 1px dashed var(--ink-200); margin-top: 16px;
  }
  .kx-empty .t { font-size: 16px; font-weight: 600; margin-top: 10px; }
  .kx-empty .s { font-size: 13px; color: var(--ink-500); margin-top: 4px; }
  .kx-allclear {
    margin-top: 16px; border-radius: 16px; overflow: hidden;
    background: var(--surface-1); border: 1px solid var(--ink-100); box-shadow: var(--elev-1);
  }
  .kx-allclear-inner {
    position: relative; padding: 60px 32px 56px; text-align: center;
    background: radial-gradient(130% 100% at 50% -20%, var(--teal-50) 0%, rgba(230,244,241,0) 60%);
  }
  .kx-allclear h2 {
    margin: 26px 0 0; font-family: var(--font-display); font-size: 32px; font-weight: 600;
    letter-spacing: -0.5px; color: var(--ink-900); line-height: 1.1;
  }
  .kx-allclear p { margin: 12px auto 0; max-width: 420px; font-size: 16px; color: var(--ink-600); line-height: 1.55; text-wrap: pretty; }
  .kx-allclear .badge {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 22px;
    padding: 8px 16px; border-radius: 999px; background: var(--teal-50);
    border: 1px solid var(--teal-100); color: var(--teal-500); font-size: 14px; font-weight: 500;
  }

  /* ====================================================================
     V2 HERO SURFACES (behind the Future-functionality flag)
     ==================================================================== */
  .kx-coverage-hero { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 16px; align-items: stretch; }
  .kx-pulse-panel {
    background: linear-gradient(160deg, #14201f 0%, #1f2d2c 50%, #2f3f3e 100%);
    color: white; border-radius: 20px; padding: 24px;
    position: relative; overflow: hidden; box-shadow: var(--elev-1);
  }
  .kx-pulse-glow {
    position: absolute; top: -40px; width: 220px; height: 220px; border-radius: 50%;
    pointer-events: none; transition: background 400ms;
  }
  .kx-pulse-eyebrow { font-size: 11px; color: var(--amber-200); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; }
  .kx-pulse-verdict {
    font-family: var(--font-display); font-weight: 600; font-size: 30px;
    line-height: 1; letter-spacing: -0.8px; text-wrap: balance;
  }
  .kx-pulse-demand-lbl { font-size: 11px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; margin-bottom: 2px; }
  .kx-pulse-demand-n { font-family: var(--font-numeric); font-size: 28px; font-weight: 700; color: white; font-variant-numeric: tabular-nums; line-height: 1; }
  .kx-pulse-blurb { font-size: 12px; color: rgba(255,255,255,0.65); margin-bottom: 14px; }
  .kx-pulse-bar { position: relative; height: 32px; margin-bottom: 8px; }
  .kx-pulse-track {
    position: absolute; inset: 12px 0; border-radius: 99px; opacity: 0.85;
    background: linear-gradient(90deg, #e8554a 0%, #e8a04a 22%, #cbd2da 44%, #bcc5ce 50%, #a9c8c4 56%, #6cb9a4 78%, #4f9a8a 100%);
  }
  .kx-pulse-center { position: absolute; left: 50%; top: 4px; bottom: 4px; width: 2px; margin-left: -1px; background: rgba(255,255,255,0.55); border-radius: 1px; }
  .kx-pulse-ghost { position: absolute; top: 8px; bottom: 8px; width: 2px; background: rgba(255,255,255,0.32); border-radius: 1px; transition: left 600ms; }
  .kx-pulse-needle {
    position: absolute; top: 0; bottom: 0; width: 20px;
    display: flex; flex-direction: column; align-items: center;
    transition: left 600ms cubic-bezier(.2,.8,.2,1);
  }
  .kx-pulse-zones {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    font-size: 9px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
    color: rgba(255,255,255,0.55);
  }
  .kx-pulse-delta {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; color: rgba(255,255,255,0.6);
  }
  .kx-facets { margin-top: 22px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.10); }
  .kx-facet-row {
    display: grid; grid-template-columns: 78px 1fr 30px 40px;
    align-items: center; gap: 8px; padding: 7px 9px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
    border-radius: 8px; color: white; text-align: left; cursor: pointer;
    transition: background 120ms; font-family: inherit; width: 100%;
  }
  .kx-facet-row:hover { background: rgba(255,255,255,0.09); }
  .kx-facet-row .nm { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.88); }
  .kx-facet-row .nm .sw { width: 6px; height: 6px; border-radius: 2px; flex-shrink: 0; }
  .kx-facet-row .n { font-family: var(--font-numeric); font-weight: 700; font-size: 16px; text-align: right; font-variant-numeric: tabular-nums; }
  .kx-facet-row .d { font-size: 10px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; letter-spacing: 0.2px; }
  .kx-facet-back {
    background: rgba(255,255,255,0.08); border: none; width: 26px; height: 26px;
    border-radius: var(--radius-pill); color: white; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .kx-facet-item {
    display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 8px;
    padding: 7px 9px; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.07); border-radius: 7px;
    color: white; text-align: left; cursor: pointer; font-size: 11px;
    font-family: inherit; width: 100%;
  }
  .kx-facet-cta {
    width: 100%; padding: 9px 12px; background: var(--amber-400); color: var(--ink-900);
    border: none; border-radius: var(--radius-pill); font-size: 11px; font-weight: 700;
    cursor: pointer; letter-spacing: 0.3px;
    display: flex; align-items: center; justify-content: center; gap: 6px; font-family: inherit;
  }
  @media (max-width: 860px) { .kx-coverage-hero { grid-template-columns: 1fr; } }

  /* Compliance hero (Training Officer) */
  .kx-compliance-grid { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 16px; }
  @media (max-width: 860px) { .kx-compliance-grid { grid-template-columns: 1fr; } }
  .kx-cohort-card {
    background: linear-gradient(160deg, var(--teal-500) 0%, var(--teal-600) 100%);
    color: white; border-radius: 20px; padding: 22px;
    position: relative; overflow: hidden; box-shadow: var(--elev-1);
  }
  .kx-panel { background: var(--surface-1); border-radius: 20px; padding: 22px; border: 1px solid var(--ink-100); }
  .kx-expiry-row { display: flex; align-items: center; gap: 10px; }

  /* ====================================================================
     PUBLISHED DASHBOARD (Chief / Lieutenant / Firefighter heroes)
     The Chief's and Firefighter's are single-row, three-widget cards sized to
     land at ~250px so the task list top clears the fold. The header carries the
     controls that used to live in the retired coverage hero's right-hand rail.
     ==================================================================== */
  .kx-pubdash { background: var(--surface-2); border: 1px solid var(--ink-100); border-radius: 20px; padding: 14px; }

  /* Dashboard body: Agency Intelligence panel (left) + widget grid (right).
     The grid keeps its own 12-column definition so every w:4 widget spec and
     pubWidget() work untouched. */
  .kx-pubbody { display: flex; gap: 12px; align-items: stretch; min-width: 0; }
  .kx-pubbody > .kx-pubgrid { flex: 1; min-width: 0; }
  /* Expanded: the container grows downward, but the widget row must NOT
     stretch to fill it — rows keep natural height and stack from the top,
     leaving the second row free for widgets added from chat. */
  .kx-pubbody.is-expanded { min-height: 520px; }
  .kx-pubbody.is-expanded > .kx-pubgrid { align-content: start; }
  @media (max-width: 980px) {
    .kx-pubbody { flex-direction: column; }
    .kx-pubbody.is-expanded { min-height: 0; }
  }

  /* Widget wrapping. Spans are inline styles from pubWidget(), so these
     overrides need !important — same technique as the 860px rule below.
     Thresholds are viewport-based because the grid's own width depends on
     whether the AI panel is docked beside it.

     Task 2c moved the date-range control out of the widget-head row into its
     own footer row (see pubWidget() in hub-hero.js), so a title no longer has
     to share its row with a ~105px control. A widget's legible minimum
     dropped from ~310px to ~205px, and BOTH thresholds below were re-measured
     in-browser from scratch (forcing spans with browser_evaluate + stepping
     browser_resize, never computed) because Task 2b's numbers (1450px /
     1090px) were calibrated against the old ~310px minimum and are now far
     too conservative.

     Task 8 re-measured this threshold from scratch (forcing browser_resize,
     never computed) because Task 7 put mixed spans — scatter w:5, bar w:3,
     donut w:4 — on CHIEF_DASH in place of the uniform w:4 tiles this number
     was originally calibrated against, and the w:3 bar was suspected to hit
     its legible floor sooner. Probing 1400 down to 1100 in the increments the
     brief specified, then continuing to 1075 and 1065 to re-confirm the
     three-across/two-across boundary itself, found NO clipping anywhere in
     that range at these widths (rounded): 1400→374/220/297, 1350→353/207/280,
     1300→333/195/264, 1250→312/182/247, 1200→291/170/230, 1150→270/157/214,
     1100→261/152/206, 1075→251/146/198, all the way through 1065→298/298/298
     (already two-across) and 900→382/382/382 (stacked-above-panel). The
     reason the suspected regression didn't reappear: the scatter's own
     combined title ("Overdue inspections × Avg response time") turned out to
     clip even at 1400px, in the natural one-row layout, above every
     breakpoint here — no threshold could have fixed that, so `.kx-pubwidget
     .title` below was changed to wrap instead of ellipsis-truncate. That
     fix's side effect is that the narrower bar and donut titles also wrap
     instead of clip if they ever run short on room, which is what actually
     neutralizes the w:3-hits-its-floor-sooner regression this threshold was
     re-measured to address. Because no clipping was measured at any width in
     the natural three-across range, 1070px stays as the measured-and-
     rounded-up threshold below which three-across gives way to two-across
     (span 6) — the number is unchanged from Task 2c, but the reasoning is
     new: it no longer rests on the old uniform-w:4 assumption, it rests on
     this task's own remeasurement finding no clip-free ceiling was crossed.
     Two across (span 6 forced) stayed clip-free down to 470px viewport and
     first clipped at 465px — so 470px is the measured-and-rounded-up
     threshold below which two-across gives way to one-per-row (unchanged;
     Task 8 did not re-measure this one, since the bar/donut titles that
     motivated re-checking the 1070px boundary are even less cramped once
     forced to span 6 than they are in the natural three-across layout). */
  @media (max-width: 1070px) {
    .kx-pubbody .kx-pubgrid > .kx-pubwidget { grid-column: span 6 !important; }
  }
  /* One across. Measurement shows two-across no longer has a dead zone
     anywhere between here and 1070px — neither docked-beside-the-panel
     widths (e.g. 981px, widget 256px wide) nor stacked-above-the-panel
     widths (e.g. 861px, widget 362px wide) come close to clipping. So unlike
     Task 2b, which forced one-per-row all the way from 1090px down through
     the pre-existing 860px rule as a blunt simplification, this reclaims
     two-across density for the whole 470-1070px range and only drops to one-
     per-row where measurement actually requires it (below 470px).

     That reclaim works automatically, without touching the 860px rule below:
     this selector, `.kx-pubbody .kx-pubgrid > .kx-pubwidget`, has specificity
     (0,3,0) versus the 860px rule's `.kx-pubgrid > *` at (0,1,0), so this
     rule always wins when both match, regardless of which comes first in the
     file. In the 470-860px band both rules match (this one says span 6, the
     860px rule says 1 / -1) and specificity — not source order — is why
     span 6 is what actually renders. Below 470px this rule also says 1 / -1,
     so the two rules agree again and there is no conflict. Caution for
     future edits: because specificity decides here, not order, a future
     breakpoint that wants a *different* value at ≤860px than this rule
     provides would silently lose to this rule no matter where it's placed
     in the file — it would need higher specificity, not just later
     placement. */
  @media (max-width: 470px) {
    .kx-pubbody .kx-pubgrid > .kx-pubwidget { grid-column: 1 / -1 !important; }
  }

  .kx-pubhead { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }

  .kx-pubfoot {

  /* Completion bar for the 'progress' widget kind — progress against a fixed

  .kx-pubprogress {

  .kx-pubgrid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 12px; align-items: stretch; }

  .kx-pubwidget {
    background: var(--surface-1); border: 1px solid var(--ink-100); border-radius: 14px;
    box-shadow: var(--elev-1); padding: 12px;
    display: flex; flex-direction: column; min-width: 0;
  }
  /* Single header ROW at every width — icon and source chips hold their size on
     the left/right; the title is the only flexible piece. The range control is
     NOT here: it moved to .kx-pubwidget-foot, below the value, which is what
     dropped a widget's legible minimum from ~310px to ~205px.

     The title itself wraps rather than ellipsis-truncates (see .kx-pubwidget
     .title below) — added in Task 8, which put a combined two-metric scatter
     title ("Overdue inspections × Avg response time") into a w:5 widget
     (376px). At that width, in its natural one-row layout, the title needs
     ~277px but the icon+chips leave only ~231px: it clipped at 1400px, above
     every grid-wrap breakpoint, so no threshold could ever have fixed it —
     only the title itself could. Wrapping to a second line costs the row some
     height (which this card already accommodates, per the height comment on

  .kx-pubwidget-head {
    display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: nowrap;
  }
  .kx-pubwidget-head .srcs { display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0; }

  .kx-pubwidget-rm {

  .kx-pubwidget-rm:hover { background: var(--surface-3); color: var(--ink-800); }
  .kx-pubwidget-rm:focus-visible { outline: 2px solid var(--amber-400); outline-offset: 1px; }
  /* Range control's new home: its own compact row under the value, so the
     title above it never has to share horizontal space with it. */
  .kx-pubwidget-foot { display: flex; align-items: center; margin-top: 8px; min-width: 0; }
  .kx-pubwidget .icon-chip {
    width: 24px; height: 24px; border-radius: 6px; background: var(--amber-100); color: var(--amber-700);
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .kx-pubwidget .title {
    font-size: 13.5px; font-weight: 700; color: var(--ink-900); line-height: 1.25;
    overflow-wrap: break-word; min-width: 0;
  }
  /* Donut legend fits at w:4 (299px) for every row except the worst case:
     "TargetSolutions" is one unbreakable word, and pdDonut() (charts.js,
     off-limits to edit here) hard-codes an 18px arc-to-legend gap plus an
     8px per-item gap and a 10px percentage padding inline. Measured, that
     row needs 148px but only 127px was available — 21px short. charts.js
     can't change, but its inline, non-!important gaps/font-size CAN be
     overridden from here: tightening them (never widening the widget itself,
     which stays the designer-specified 299px) recovers the 21px without
     shrinking anything below a legible size. Selectors key off pdDonut's
     literal inline `style` strings, which are unique to it in this file. */
  .kx-pubwidget div[style*="gap:18px"] { gap: 12px !important; }
  .kx-pubwidget div[style*="gap:8px;font-size:12px"] {
    gap: 4px !important; font-size: 11px !important;
