<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url=content-library.html">
    <title>LearningStudio Content Portal</title>
    <script type="module" src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.19.0/core.iife.js"></script>
    <script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.5.0/styles.js"></script>
    <link rel="stylesheet" href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Open Sans', -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background:
                linear-gradient(140.604deg, rgba(125,205,238,0.35) 4%, rgba(213,236,181,0.35) 100%),
                #f0f7fb;
            color: #0f2e3d;
        }
        .loading-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .loading-title {
            font-size: 18px;
            font-weight: 700;
            color: #0f2e3d;
        }
        .loading-subtitle {
            font-size: 13px;
            color: var(--lumo-secondary-text-color);
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <vwc-spinner></vwc-spinner>
        <div class="loading-title">LearningStudio Content Portal</div>
        <div class="loading-subtitle">Loading&hellip;</div>
        <p style="font-size:12px; color: var(--lumo-disabled-text-color);">
            If you are not redirected automatically, <a href="content-library.html" style="color:var(--lumo-primary-color)">click here</a>.
        </p>
    </div>
</body>
</html>
