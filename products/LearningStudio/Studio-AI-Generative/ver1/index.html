<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio AI — Generative Review</title>

<!-- Exploration mock: hand-rolled UI, no Vector components by design
     (see ../README.md). Open Sans + self-hosted Font Awesome Pro only. -->
<link rel="stylesheet" href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css" />
<link rel="stylesheet" href="../../../../assets/fontawesome/css/all.min.css" />

<style>
/* ════════════════════════════════════════════════════════════════════
   TOKENS
   --accent  = requested / "you are editing this"
   --unreq   = unrequested change (G6) — deliberately louder than accent
   ════════════════════════════════════════════════════════════════════ */
:root {
  --bg:       #10151c;
  --chrome:   #161c25;
  --surface:  #1c2330;
  --surface2: #242c3a;
  --surface3: #2c3647;
  --line:     #2e3847;
  --text:     #e6ebf2;
  --muted:    #9aa6b6;
  --faint:    #6d7a8c;
  --accent:   #7c9cff;
  --accent-bg: rgba(124,156,255,.14);
  --unreq:    #ffb547;
  --unreq-bg: rgba(255,181,71,.14);
  --ok:       #4fc48a;
  --ok-bg:    rgba(79,196,138,.14);
  --lock:     #c3a6ff;
  --danger:   #ff7a7a;
  --radius:   8px;
  --panel-w:  380px;
  --panel-h:  300px;
  --rail-w:   56px;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 13px/1.45 'Open Sans', system-ui, sans-serif;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }

/* ── Top bar ─────────────────────────────────────────────────────── */
.topbar {
  height: 52px; display: flex; align-items: center; gap: 14px;
  padding: 0 14px; background: var(--chrome); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; white-space: nowrap; }
.brand i { color: var(--accent); }
.crumbs { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumbs b { color: var(--text); font-weight: 600; }
.brief-chip {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 10px; color: var(--muted); font-size: 12px;
}
.brief-chip:hover { border-color: var(--accent); color: var(--text); }
.spacer { flex: 1; }
.gen-switch { display: flex; align-items: center; gap: 4px; }
.gen-switch .lbl { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin-right: 4px; }
.gen-btn {
  min-width: 34px; height: 28px; padding: 0 8px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-weight: 600;
}
.gen-btn.active { background: var(--accent-bg); border-color: var(--accent); color: var(--text); }
.gen-btn.latest::after { content: ''; display: inline-block; width: 6px; height: 6px; margin-left: 5px; border-radius: 50%; background: var(--ok); vertical-align: middle; }
.ready-chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
  border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
}
.ready-chip.warn { background: var(--unreq-bg); color: var(--unreq); }
.ready-chip.ok   { background: var(--ok-bg); color: var(--ok); }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px;
  border-radius: 6px; border: 1px solid var(--line); background: var(--surface2);
  font-weight: 600; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #0d1424; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; }
.icon-btn {
  width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
  border-radius: 6px; border: 1px solid transparent; background: transparent; color: var(--muted);
}
.icon-btn:hover { background: var(--surface2); color: var(--text); }
.icon-btn.on { background: var(--accent-bg); color: var(--accent); border-color: rgba(124,156,255,.35); }

/* ── Workspace grid — the panel's dock position rearranges it (G8) ── */
.workspace {
  height: calc(100% - 52px); display: grid;
  grid-template-columns: var(--rail-w) 1fr var(--panel-w);
  grid-template-rows: 1fr;
  grid-template-areas: "rail stage panel";
}
body.dock-left   .workspace { grid-template-columns: var(--rail-w) var(--panel-w) 1fr; grid-template-areas: "rail panel stage"; }
body.dock-bottom .workspace { grid-template-columns: var(--rail-w) 1fr; grid-template-rows: 1fr var(--panel-h); grid-template-areas: "rail stage" "rail panel"; }
body.dock-float  .workspace,
body.dock-min    .workspace { grid-template-columns: var(--rail-w) 1fr; grid-template-areas: "rail stage"; }

/* ── Layer rail ──────────────────────────────────────────────────── */
.rail {
  grid-area: rail; background: var(--chrome); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 10px;
}
.rail-btn {
  width: 42px; height: 46px; border-radius: 8px; border: 0; background: transparent;
  color: var(--faint); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 9px; font-weight: 600; letter-spacing: .02em;
}
.rail-btn i { font-size: 16px; }
.rail-btn:hover { color: var(--text); background: var(--surface); }
.rail-btn.active { color: var(--accent); background: var(--accent-bg); }
.rail-sep { width: 26px; height: 1px; background: var(--line); margin: 4px 0; }

/* ── Stage ───────────────────────────────────────────────────────── */
.stage { grid-area: stage; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.stage-bar {
  display: flex; align-items: center; gap: 10px; padding: 8px 16px;
  border-bottom: 1px solid var(--line); background: var(--bg);
}
.act-title { font-weight: 700; font-size: 14px; white-space: nowrap; }
.act-meta  { color: var(--muted); font-size: 12px; white-space: nowrap; }
.tool-group { display: flex; gap: 2px; padding: 2px; background: var(--surface); border-radius: 8px; border: 1px solid var(--line); }
.toggle {
  display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 600;
  background: none; border: 0; padding: 4px 6px; border-radius: 6px;
}
.toggle .sw { width: 28px; height: 16px; border-radius: 999px; background: var(--surface3); position: relative; transition: background .15s; }
.toggle .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.toggle.on { color: var(--text); }
.toggle.on .sw { background: var(--accent); }
.toggle.on .sw::after { transform: translateX(12px); background: #fff; }

.readonly-banner {
  display: flex; align-items: center; gap: 10px; padding: 8px 16px;
  background: var(--surface2); border-bottom: 1px solid var(--line); color: var(--muted);
}
.readonly-banner b { color: var(--text); }

.stage-scroll { flex: 1; min-height: 0; overflow: auto; padding: 18px 22px 90px; }
/* Frame width follows the available HEIGHT, so the timeline under it is always
   on screen — that's what the bottom dock is for (G8). */
.stage-inner { max-width: min(960px, calc((100vh - 52px - 200px) * 16 / 9)); margin: 0 auto; }
body.dock-bottom .stage-inner { max-width: min(960px, calc((100vh - 52px - var(--panel-h) - 150px) * 16 / 9)); }
body.dock-bottom .stage-scroll { padding-top: 12px; }
/* Bottom dock: cards flow across the width instead of stacking */
body.dock-bottom .panel-body { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; align-content: start; }
body.dock-bottom .panel-body > .sec-title,
body.dock-bottom .panel-body > .summary,
body.dock-bottom .panel-body > .empty,
body.dock-bottom .panel-body > .hist { grid-column: 1 / -1; margin-bottom: 0; }
body.dock-bottom .panel-body > .card { margin-bottom: 0; }

/* ── The frame — a COMPOSED scene of addressable elements (G4) ────── */
.frame {
  position: relative; aspect-ratio: 16 / 9; border-radius: var(--radius); overflow: hidden;
  background: #222; box-shadow: 0 10px 40px rgba(0,0,0,.45); user-select: none;
}
.frame.tool-region { cursor: crosshair; }
.frame .decor { position: absolute; inset: 0; pointer-events: none; }
.scene-tag {
  position: absolute; top: 10px; right: 10px; z-index: 6; font-size: 11px; font-weight: 600;
  background: rgba(0,0,0,.55); color: #dfe6ef; padding: 3px 8px; border-radius: 999px; pointer-events: none;
}

/* Every targetable element carries .el and data-el */
.el { position: absolute; cursor: pointer; border-radius: 4px; transition: box-shadow .15s; }
.el:hover { box-shadow: 0 0 0 2px rgba(124,156,255,.7); }
.el.selected { box-shadow: 0 0 0 2px var(--accent), 0 0 0 6px rgba(124,156,255,.25); }
.frame.tool-region .el { pointer-events: none; }
.readonly .el:hover { box-shadow: none; }
.readonly .el { cursor: default; }

.el-object { display: flex; align-items: center; justify-content: center; padding: 6px; }
.el-object i { font-size: 92px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
.el-sign {
  background: #f4f1e6; color: #1b1b1b; border: 3px solid #1b1b1b; font-weight: 800;
  text-align: center; line-height: 1.15; padding: 8px 10px; letter-spacing: .02em;
  display: flex; align-items: center; justify-content: center;
}
.el-sign .sign-band { position: absolute; left: 0; right: 0; top: 0; height: 9px; background: repeating-linear-gradient(45deg,#1b1b1b 0 8px,#f2c230 8px 16px); }
.el-ov-lower { left: 4%; bottom: 8%; padding: 10px 16px; border-left: 4px solid var(--accent); background: rgba(13,26,46,.88); color: #fff; min-width: 34%; }
.el-ov-lower .t { font-weight: 700; font-size: 17px; }
.el-ov-lower .s { font-size: 12px; color: #b9c6d8; }
.el-ov-callout { left: 4%; top: 7%; max-width: 42%; padding: 9px 13px; background: rgba(46,36,21,.92); color: #ffe2a8; font-weight: 700; border: 1px solid rgba(255,181,71,.6); }
.el-ov-bullets { right: 4%; top: 18%; padding: 12px 16px; background: rgba(20,18,38,.86); color: #fff; min-width: 24%; }
.el-ov-bullets div { padding: 3px 0; font-weight: 600; }
.el-ov-bullets div::before { content: '▸ '; color: var(--accent); }
.patch {
  position: absolute; pointer-events: none; border-radius: 3px;
  background: radial-gradient(ellipse at center, rgba(160,200,255,.18), rgba(0,0,0,0) 70%);
}
.chg-on .patch { outline: 2px dashed var(--accent); outline-offset: 2px; }
.region-draft { position: absolute; border: 2px dashed var(--accent); background: rgba(124,156,255,.12); pointer-events: none; z-index: 8; }
.region-pending { position: absolute; border: 2px dashed var(--accent); pointer-events: none; z-index: 5; }

/* Pending-annotation pins */
.pin {
  position: absolute; top: -10px; right: -10px; z-index: 7; width: 20px; height: 20px; border-radius: 50%;
  background: var(--accent); color: #0d1424; font-size: 11px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,.4); pointer-events: none;
}
.lock-badge {
  position: absolute; top: -9px; left: -9px; z-index: 7; width: 18px; height: 18px; border-radius: 50%;
  background: var(--lock); color: #1d1430; font-size: 9px; display: flex; align-items: center; justify-content: center; pointer-events: none;
}

/* ── Change map (G5/G6) — the visual layer, toggleable ───────────── */
@keyframes glowReq   { 0%,100% { box-shadow: 0 0 0 2px var(--accent), 0 0 14px 2px rgba(124,156,255,.45); } 50% { box-shadow: 0 0 0 2px var(--accent), 0 0 26px 6px rgba(124,156,255,.6); } }
@keyframes glowUnreq { 0%,100% { box-shadow: 0 0 0 3px var(--unreq), 0 0 16px 4px rgba(255,181,71,.55); } 50% { box-shadow: 0 0 0 3px var(--unreq), 0 0 34px 10px rgba(255,181,71,.75); } }
.chg-on .chg-req   { animation: glowReq 2.4s ease-in-out infinite; }
.chg-on .chg-unreq { animation: glowUnreq 1.4s ease-in-out infinite; }
@keyframes jumpPulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,.9); } 100% { box-shadow: 0 0 0 22px rgba(255,255,255,0); } }
.jump-pulse { animation: jumpPulse .9s ease-out 2 !important; }

@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
.is-working::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(100deg, transparent 30%, rgba(124,156,255,.35) 50%, transparent 70%);
  background-size: 200% 100%; animation: shimmer 1.2s linear infinite;
}

/* ── Transport + timeline ───────────────────────────────────────── */
.transport { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.tc { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; min-width: 92px; }
.timeline { position: relative; flex: 1; height: 38px; cursor: pointer; }
.tl-scenes { position: absolute; left: 0; right: 0; top: 10px; height: 18px; display: flex; gap: 2px; }
.tl-scene { background: var(--surface2); border-radius: 3px; font-size: 10px; color: var(--muted); padding: 2px 6px; overflow: hidden; white-space: nowrap; }
.tl-scene.cur { background: var(--surface3); color: var(--text); }
.tl-head { position: absolute; top: 4px; bottom: 4px; width: 2px; background: #fff; border-radius: 2px; pointer-events: none; }
.tl-mark { position: absolute; top: 0; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; border: 2px solid var(--bg); pointer-events: none; }
.tl-mark.req { background: var(--accent); }
.tl-mark.unreq { background: var(--unreq); }

/* ── Narration (each line is an element) ─────────────────────────── */
.narr { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.narr-head { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.narr-head .voice { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 600; }
.line {
  position: relative; display: flex; gap: 12px; padding: 7px 9px; border-radius: 6px; cursor: pointer;
  font-size: 14px; line-height: 1.55; max-width: 75ch;
}
.line .ts { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; padding-top: 3px; min-width: 38px; }
.line:hover { background: var(--surface2); }
.line.cur { background: var(--surface2); }
.line.cur .txt { color: #fff; }
.line .txt { color: #cfd7e3; }
.line.selected { box-shadow: inset 0 0 0 2px var(--accent); }
.line .pin { top: 6px; right: 6px; }
.line .lock-badge { top: 9px; left: auto; right: 30px; position: absolute; }
.readonly .line { cursor: default; }

/* ── Popover — annotation lives ON the artifact (G8) ─────────────── */
.popover {
  position: fixed; z-index: 1200; width: 340px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.55); padding: 12px;
}
.pop-head { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.pop-head .kind { width: 26px; height: 26px; border-radius: 6px; background: var(--accent-bg); color: var(--accent); display: flex; align-items: center; justify-content: center; }
.pop-head .where { margin-left: auto; color: var(--faint); font-weight: 600; font-size: 11px; }
.pop-excerpt { margin: 10px 0; padding: 8px 10px; background: var(--bg); border-left: 3px solid var(--line); border-radius: 4px; color: #cfd7e3; font-size: 12px; }
.pop-note { font-size: 12px; color: var(--muted); margin: 8px 0; }
.pop-note.lock { color: var(--lock); }
textarea.field {
  width: 100%; min-height: 70px; resize: vertical; background: var(--bg); color: var(--text);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font: inherit;
}
textarea.field:focus { outline: none; border-color: var(--accent); }
.check { display: flex; align-items: flex-start; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted); cursor: pointer; }
.check input { margin-top: 2px; accent-color: var(--accent); }
.check b { color: var(--text); }
.pop-actions { display: flex; gap: 6px; margin-top: 12px; align-items: center; }

/* ── Panel — ONE dockable module (G8) ────────────────────────────── */
.panel {
  grid-area: panel; min-width: 0; min-height: 0; background: var(--chrome);
  display: flex; flex-direction: column; border-left: 1px solid var(--line);
}
body.dock-left   .panel { border-left: 0; border-right: 1px solid var(--line); }
body.dock-bottom .panel { border-left: 0; border-top: 1px solid var(--line); }
body.dock-float  .panel {
  position: fixed; z-index: 900; width: 380px; height: 520px; border: 1px solid var(--line);
  border-radius: 12px; box-shadow: 0 22px 60px rgba(0,0,0,.6); overflow: hidden;
  transition: left .25s ease, top .25s ease;
}
body.dock-float.dragging .panel { transition: none; }
body.dock-min .panel { display: none; }
.panel-head { display: flex; align-items: center; gap: 0; padding: 6px 6px 0; border-bottom: 1px solid var(--line); }
body.dock-float .panel-head { cursor: move; }
.tab {
  border: 0; background: none; color: var(--muted); font-weight: 600; padding: 8px 5px 9px; font-size: 12px;
  border-bottom: 2px solid transparent; display: inline-flex; gap: 4px; align-items: center; white-space: nowrap;
}
/* Four tabs + five dock buttons: side docks show labels only, the bottom dock has room for both,
   and the narrow breakpoint drops to icons (titles carry the names). */
.tab > i { display: none; }
body.dock-bottom .tab > i { display: inline; }
.tab.active { color: var(--text); border-bottom-color: var(--accent); }
.tab .count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--surface3); font-size: 10px; display: inline-flex; align-items: center; justify-content: center; }
.tab .count.unreq { background: var(--unreq); color: #2a1a00; }
.tab .count.acc { background: var(--accent); color: #0d1424; }
.dock-tools { margin-left: auto; display: flex; gap: 0; padding-bottom: 4px; }
.dock-tools .icon-btn { width: 21px; height: 24px; font-size: 11px; }
.panel-body { flex: 1; min-height: 0; overflow: auto; padding: 12px; }
.composer { border-top: 1px solid var(--line); padding: 10px 12px; background: var(--chrome); }
.composer textarea { min-height: 44px; }
body.dock-bottom .composer { display: flex; gap: 10px; align-items: flex-end; }
body.dock-bottom .composer textarea { min-height: 38px; }
.composer-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
body.dock-bottom .composer-row { margin-top: 0; }
.composer-hint { color: var(--faint); font-size: 11px; flex: 1; }

/* Minimized pill — bottom-right so it never sits on the toolbox dock */
.min-pill {
  position: fixed; right: 18px; bottom: 18px; z-index: 900; display: none; align-items: center; gap: 8px;
  height: 38px; padding: 0 14px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--line);
  box-shadow: 0 10px 30px rgba(0,0,0,.5); font-weight: 600;
}
body.dock-min .min-pill { display: inline-flex; }
.min-pill .dot { min-width: 20px; height: 20px; border-radius: 999px; background: var(--accent); color: #0d1424; font-size: 11px; display: inline-flex; align-items: center; justify-content: center; padding: 0 6px; }
.min-pill .dot.unreq { background: var(--unreq); color: #2a1a00; }

/* ── Panel content ──────────────────────────────────────────────── */
.sec-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 4px 0 8px; display: flex; align-items: center; gap: 6px; }
.sec-title.unreq { color: var(--unreq); }
.sec-title.req { color: var(--accent); }
.empty { color: var(--muted); padding: 18px 6px; text-align: center; }
.empty i { font-size: 22px; color: var(--faint); display: block; margin-bottom: 8px; }
.summary { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.summary span { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--surface2); color: var(--muted); }
.summary span b { color: var(--text); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
.card.unreq { border-color: rgba(255,181,71,.55); background: linear-gradient(0deg, var(--unreq-bg), var(--unreq-bg)), var(--surface); }
.card.done { opacity: .62; }
.card-top { display: flex; align-items: center; gap: 8px; }
.card-top .k { width: 22px; height: 22px; border-radius: 5px; background: var(--surface3); color: var(--muted); font-size: 11px; display: flex; align-items: center; justify-content: center; flex: none; }
.card-top .name { font-weight: 700; }
.card-top .where { margin-left: auto; color: var(--faint); font-size: 11px; white-space: nowrap; }
.diff { margin: 8px 0 6px; font-size: 12px; }
.diff .field { color: var(--faint); font-size: 10px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
.diff .before { color: #c48f8f; text-decoration: line-through; text-decoration-color: rgba(255,122,122,.6); }
.diff .after  { color: #e9f1ff; }
.diff .arrow { color: var(--faint); margin: 0 4px; }
.cause { font-size: 11px; color: var(--muted); display: flex; gap: 6px; align-items: baseline; }
.cause.unreq { color: var(--unreq); font-weight: 600; }
.card-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.state-tag { font-size: 11px; font-weight: 700; display: inline-flex; gap: 5px; align-items: center; }
.state-tag.ok { color: var(--ok); }
.state-tag.q { color: var(--accent); }

.pend { display: flex; gap: 10px; }
.pend .num { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #0d1424; font-weight: 800; font-size: 11px; display: flex; align-items: center; justify-content: center; flex: none; }
.pend .num.restore { background: var(--surface3); color: var(--text); }
.pend .body { flex: 1; min-width: 0; }
.pend .tgt { font-weight: 700; display: flex; gap: 6px; align-items: center; }
.pend .tgt .where { color: var(--faint); font-weight: 600; font-size: 11px; margin-left: auto; }
.pend .ins { margin-top: 4px; color: #cfd7e3; }
.badge { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px; background: var(--surface3); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.badge.verbatim { background: rgba(195,166,255,.18); color: var(--lock); }
.badge.region { background: var(--accent-bg); color: var(--accent); }

.hist { position: relative; padding-left: 18px; }
.hist::before { content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }
.hist-item { position: relative; margin-bottom: 12px; }
.hist-item::before { content: ''; position: absolute; left: -16px; top: 12px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface3); border: 2px solid var(--chrome); }
.hist-item.latest::before { background: var(--ok); }
.hist-item.working::before { background: var(--accent); }
.hist-item ul { margin: 6px 0 0; padding-left: 16px; color: var(--muted); font-size: 12px; }
.steps { margin-top: 8px; font-size: 12px; }
.steps div { display: flex; gap: 8px; align-items: center; color: var(--muted); padding: 2px 0; }
.steps .done { color: var(--ok); }
.steps .run { color: var(--accent); }

/* ── Toast ──────────────────────────────────────────────────────── */
.toast {
  position: fixed; left: 50%; top: 64px; transform: translateX(-50%); z-index: 2000;
  background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px;
  box-shadow: 0 12px 30px rgba(0,0,0,.5); max-width: 520px; opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: 1; }


/* ════════════════════════════════════════════════════════════════════
   PASS 2 — PROJECT BRIEF LAYER (G7, G10)
   ════════════════════════════════════════════════════════════════════ */
.brief-view { grid-area: stage; display: none; min-width: 0; min-height: 0; overflow: auto; position: relative; }
body.layer-brief .brief-view { display: block; }
body.layer-brief #stage, body.layer-brief .panel, body.layer-brief .min-pill { display: none !important; }
body.layer-brief .workspace { grid-template-columns: var(--rail-w) 1fr !important; grid-template-rows: 1fr !important; grid-template-areas: "rail stage" !important; }
body.layer-brief .act-only { display: none !important; }

.brief-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 20px; max-width: 1280px; margin: 0 auto; padding: 20px 22px 120px; }
.brief-aside { position: sticky; top: 16px; align-self: start; }
.bcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.bcard h3 { margin: 0 0 4px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
.bcard h3 i { color: var(--muted); }
.bcard .sub, .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; max-width: 75ch; }
.bhead { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 16px; }
.bhead h1 { margin: 2px 0 6px; font-size: 22px; display: flex; align-items: center; gap: 10px; }
.eyebrow { font-size: 11px; font-weight: 700; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
.vtag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface3); color: var(--muted); }
.goal { margin-left: auto; text-align: right; white-space: nowrap; }
.dl { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
.am { font-size: 12px; color: var(--faint); }
.muted { color: var(--muted); }

.bgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; }
.bf.wide { grid-column: 1 / -1; }
.bf label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
.inp { width: 100%; background: var(--bg); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 7px 9px; font: inherit; }
.inp:focus { outline: none; border-color: var(--accent); }
select.inp { appearance: auto; }
.bf.changed .inp { border-color: var(--accent); background: linear-gradient(0deg, var(--accent-bg), var(--accent-bg)), var(--bg); }
.bf.changed label::after { content: ' · edited'; color: var(--accent); text-transform: none; letter-spacing: 0; }
.was { display: none; font-size: 11px; color: var(--faint); margin-top: 4px; }
.bf.changed .was { display: block; }
.help { font-size: 11px; color: var(--faint); margin-top: 4px; }
.proposal { margin-top: 6px; display: flex; gap: 8px; align-items: center; padding: 7px 9px; border: 1px dashed rgba(124,156,255,.6); border-radius: 6px; background: var(--accent-bg); font-size: 12px; }
.proposal > i { color: var(--accent); }
.proposal.block { align-items: flex-start; }
.grow { flex: 1; min-width: 0; }

.walled { border-color: rgba(195,166,255,.35); }
.walled h3 i { color: var(--lock); }
.cons { display: flex; gap: 8px; align-items: center; padding: 6px 6px 6px 10px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; background: var(--bg); }
.cons > i { color: var(--lock); font-size: 11px; }
.cons.added { border-color: var(--accent); }
.cons.removed { opacity: .55; }
.cons.removed .grow { text-decoration: line-through; }
.cadd { display: flex; gap: 6px; margin-top: 10px; }

/* Generation plan */
.plan-wrap { overflow-x: auto; }
table.plan { width: 100%; border-collapse: collapse; min-width: 820px; }
.plan th { text-align: left; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.plan td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.plan tr[data-row] { cursor: pointer; }
.plan tr[data-row]:hover > td { background: var(--surface2); }
.plan tr.open > td { background: var(--surface2); border-bottom-color: transparent; }
.plan tr.focus > td { background: var(--accent-bg); }
.act-cell { display: flex; gap: 10px; }
.act-cell > i { color: var(--muted); margin-top: 3px; width: 16px; text-align: center; }
.an { font-weight: 700; }
.vi { color: var(--faint); margin-right: 4px; }
.inh { color: var(--muted); font-size: 12px; }
.ovr { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 999px; background: rgba(195,166,255,.16); color: var(--lock); }
.pts { display: flex; flex-wrap: wrap; gap: 4px; }
.pt { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 5px; background: var(--surface3); color: var(--text); white-space: nowrap; }
.pt i { font-size: 9px; color: var(--unreq); }
.pt.proposed { background: transparent; border: 1px dashed var(--accent); color: var(--accent); }
.pt .x { border: 0; background: none; color: inherit; padding: 0 0 0 2px; font-size: 10px; opacity: .7; }
.pt-prop { font-size: 11px; color: var(--accent); font-weight: 600; display: inline-flex; gap: 4px; align-items: center; }
.sts { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.st { font-weight: 700; font-size: 12px; }
.st.muted { color: var(--faint); font-weight: 600; }
.mb { display: inline-flex; gap: 5px; align-items: center; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface3); color: var(--muted); white-space: nowrap; }
.mb.ok { background: var(--ok-bg); color: var(--ok); }
.mb.warn { background: var(--unreq-bg); color: var(--unreq); }
.mb.acc { background: var(--accent-bg); color: var(--accent); }
.ra { white-space: nowrap; text-align: right; position: relative; }
.ra .btn + .btn { margin-left: 4px; }
.vmenu { position: absolute; right: 8px; top: 40px; z-index: 30; background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 14px 34px rgba(0,0,0,.5); padding: 6px; min-width: 220px; text-align: left; }
.vmenu .dl { padding: 4px 8px 2px; }
.vmenu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 5px; color: var(--text); }
.vmenu button:hover { background: var(--surface3); }
.vmenu button span { color: var(--faint); font-size: 11px; }
.detail > td { background: var(--surface2); }
.dgrid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; padding: 4px 4px 8px 26px; }
.ptrow { display: flex; gap: 8px; align-items: center; margin-bottom: 5px; font-size: 12px; color: #cfd7e3; }
.ovline { margin-top: 6px; font-size: 12px; color: #cfd7e3; }

/* Aside */
.ver { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.ver:last-child { border-bottom: 0; }
.ver b { color: var(--text); }
.ver.cur b::after { content: ' · current'; color: var(--ok); font-weight: 600; }
.outp { padding: 8px 0; border-bottom: 1px solid var(--line); }
.outp:last-child { border-bottom: 0; }
.outp .on { font-weight: 700; }
.outp .mb { margin-top: 6px; white-space: normal; }

/* Save bar — sticky at the top of the brief so it never sits under the toolbox */
.save-bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 22px; background: #1d2742; border-bottom: 1px solid var(--accent); }
.save-bar > i { color: var(--accent); }
.resume-bar { display: flex; align-items: center; gap: 10px; padding: 10px 22px; background: var(--unreq-bg); border-bottom: 1px solid rgba(255,181,71,.4); color: var(--unreq); font-weight: 600; }

/* Dialog */
.modal-back { position: fixed; inset: 0; z-index: 1500; background: rgba(5,8,12,.65); display: flex; align-items: flex-start; justify-content: center; padding: 56px 16px; overflow: auto; }
.modal { width: min(760px, 100%); background: var(--chrome); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.modal-head { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-head h2 { margin: 0; font-size: 16px; flex: 1; }
.modal-body { padding: 16px 18px; }
.modal-foot { display: flex; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
.chg-list { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 12px; margin-bottom: 14px; }
.chg { display: grid; grid-template-columns: 150px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
.chg:last-child { border-bottom: 0; }
.chg .cl { color: var(--muted); font-weight: 700; }
.chg .before { color: #c48f8f; text-decoration: line-through; }
.chg .after, .chg .add { color: #e9f1ff; }
.chg .add { color: var(--accent); }
.imp { display: grid; gap: 10px; }
.achip { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--surface2); margin: 0 4px 4px 0; }
.achip.muted { color: var(--faint); }
.g11 { display: flex; gap: 10px; margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: var(--unreq-bg); color: #ffd79a; font-size: 12px; }
.g11 i { color: var(--unreq); margin-top: 2px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.choice { display: flex; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--surface); }
.choice > i { font-size: 18px; color: var(--muted); margin-top: 2px; }
.choice.on { border-color: var(--accent); background: var(--accent-bg); }
.choice.on > i { color: var(--accent); }
.choice .cd { font-size: 12px; color: var(--muted); margin-top: 4px; }
.refresh-cost { margin-top: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }

/* Analysis */
.analysing { max-width: 560px; margin: 60px auto; }
.analysing h2 { margin: 0 0 6px; font-size: 16px; display: flex; gap: 10px; align-items: center; }
.arow { display: flex; gap: 10px; align-items: center; padding: 7px 0; color: var(--faint); }
.arow .am { margin-left: auto; }
.arow.done { color: var(--text); } .arow.done i { color: var(--ok); }
.arow.run { color: var(--text); } .arow.run i { color: var(--accent); }
.fwrap { max-width: 980px; margin: 0 auto; padding: 20px 22px 140px; }
.fhead { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 10px; }
.fhead h2 { margin: 0 0 4px; font-size: 20px; }
.fhead .summary { margin-left: auto; flex-wrap: nowrap; }
.summary .v-holds { color: var(--ok); } .summary .v-outdated { color: var(--unreq); } .summary .v-wrong { color: var(--danger); }
.summary .v-holds b, .summary .v-outdated b, .summary .v-wrong b { color: inherit; }
.fbulk { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; font-size: 12px; }
.fact-head { display: flex; gap: 10px; align-items: center; }
.fact-head > i { color: var(--muted); }
.fact.so { border-color: var(--accent); }
.frow { display: grid; grid-template-columns: 96px 1fr auto; gap: 12px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); margin-top: 10px; }
.frow.v-holds { padding: 6px 0; margin-top: 6px; opacity: .8; }
.frow.v-holds .fbody { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.vchip { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; text-align: center; }
.vchip.v-holds { background: var(--ok-bg); color: var(--ok); }
.vchip.v-outdated { background: var(--unreq-bg); color: var(--unreq); }
.vchip.v-wrong { background: rgba(255,122,122,.16); color: var(--danger); }
.fel { font-weight: 700; }
.fex { margin: 4px 0; padding: 6px 9px; background: var(--bg); border-left: 3px solid var(--line); border-radius: 4px; font-size: 12px; color: #cfd7e3; }
.frs { font-size: 12px; color: var(--muted); }
.ffix { margin-top: 6px; font-size: 12px; color: var(--accent); display: flex; gap: 6px; align-items: baseline; }
.inp.reason { margin-top: 8px; border-color: var(--danger); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-right: 1px solid var(--line); background: var(--surface2); padding: 5px 10px; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: #0d1424; }
.fbar { position: sticky; bottom: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 12px 22px; background: var(--chrome); border-top: 1px solid var(--line); }
@media (max-width: 1100px) {
  .brief-wrap { grid-template-columns: 1fr; }
  .brief-aside { position: static; }
  .choices, .dgrid { grid-template-columns: 1fr; }
}


/* ════════════════════════════════════════════════════════════════════
   PASS 3 — GATES (G1, G11): outputs layer + learner preview window
   ════════════════════════════════════════════════════════════════════ */
.outputs-view { grid-area: stage; display: none; min-width: 0; min-height: 0; overflow: auto; }
body.layer-outputs .outputs-view { display: block; }
body.layer-outputs #stage, body.layer-outputs .panel, body.layer-outputs .min-pill { display: none !important; }
body.layer-outputs .workspace { grid-template-columns: var(--rail-w) 1fr !important; grid-template-rows: 1fr !important; grid-template-areas: "rail stage" !important; }
body.layer-outputs .act-only { display: none !important; }

.out-wrap { max-width: 1280px; margin: 0 auto; padding: 20px 22px 120px; }
.ocard-head { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
.ocard-head > i { font-size: 18px; color: var(--muted); }
.ogrid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(300px, 1fr); gap: 22px; }
table.mini { width: 100%; border-collapse: collapse; font-size: 12px; }
.mini th { text-align: left; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 6px; border-bottom: 1px solid var(--line); }
.mini td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.pubbox { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
.pin-line { font-size: 12px; color: var(--muted); }
ul.why { margin: 4px 0 0; padding-left: 18px; font-size: 12px; color: #cfd7e3; }
ul.why li { margin-bottom: 3px; }
.before { color: #c48f8f; text-decoration: line-through; }
.gate { display: flex; gap: 8px; padding: 5px 0; font-size: 12px; align-items: flex-start; }
.gate i { margin-top: 2px; }
.gate i.ok { color: var(--ok); }
.gate i.no { color: var(--danger); }
.gate .bad { color: var(--muted); font-size: 11px; margin-top: 2px; }
.delta h4 { margin: 16px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.drow { display: flex; gap: 10px; align-items: flex-start; font-size: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); }
.drow > i { color: var(--muted); margin-top: 2px; }

/* Learner preview — a separate window, not a mode of the authoring surface (D44) */
.player-back { position: fixed; inset: 0; z-index: 1700; background: rgba(3,5,8,.82); display: flex; align-items: center; justify-content: center; padding: 22px; }
.pwin { width: min(1200px, 100%); height: min(800px, 100%); background: #0b0e13; border: 1px solid #2a3240; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 40px 100px rgba(0,0,0,.7); }
.pwin-bar { height: 40px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: #1b2029; border-bottom: 1px solid #2a3240; font-size: 12px; color: #9aa6b6; }
.dots span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #3a4250; margin-right: 5px; }
.url { flex: 1; background: #11151c; border-radius: 6px; padding: 4px 10px; color: #c9d2de; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.url i { color: var(--ok); margin-right: 6px; font-size: 10px; }
.ptag { background: var(--unreq-bg); color: var(--unreq); padding: 2px 9px; border-radius: 999px; font-weight: 700; white-space: nowrap; }
.pbody { flex: 1; display: flex; min-height: 0; }
.pmain { flex: 1; min-width: 0; overflow: auto; padding: 22px 28px; }
.ptitle { font-size: 18px; font-weight: 700; margin: 0 auto 12px; max-width: min(100%, calc(56vh * 16 / 9)); }
.pframe { position: relative; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; width: 100%; max-width: calc(56vh * 16 / 9); margin: 0 auto; background: #222; }
.lel { position: absolute; }
.pframe .decor { position: absolute; inset: 0; pointer-events: none; }
.caption { margin: 10px auto 0; max-width: 760px; min-height: 48px; text-align: center; font-size: 16px; line-height: 1.5; color: #fff; }
.pctrl { display: flex; align-items: center; gap: 12px; width: 100%; max-width: calc(56vh * 16 / 9); margin: 10px auto 0; }
.pbar { flex: 1; height: 6px; background: #2a3240; border-radius: 3px; position: relative; cursor: pointer; }
.pbar .watched { position: absolute; inset: 0 auto 0 0; background: #4b5568; border-radius: 3px; }
.pbar .played { position: absolute; inset: 0 auto 0 0; background: #fff; border-radius: 3px; }
.speed { display: inline-flex; border: 1px solid #2a3240; border-radius: 6px; overflow: hidden; }
.speed button { border: 0; background: #151a22; color: #9aa6b6; padding: 4px 9px; font-size: 12px; font-weight: 700; }
.speed button.on { background: #fff; color: #0b0e13; }
.plist { width: 280px; flex: none; border-left: 1px solid #2a3240; padding: 16px; overflow: auto; background: #0f1319; }
.pli { display: flex; gap: 10px; padding: 9px; border-radius: 6px; font-size: 12px; color: #9aa6b6; }
.pli b { color: #dfe6ef; }
.pli.cur { background: #1b2029; }
.pli.done > i { color: var(--ok); }
.standin { aspect-ratio: 16 / 9; width: 100%; max-width: calc(56vh * 16 / 9); margin: 0 auto; border: 1px dashed #3a4250; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; color: #9aa6b6; padding: 24px; }
.pdone { max-width: 720px; margin: 10px auto; }
.reach { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid #2a3240; font-size: 13px; align-items: start; }
@media (max-width: 1100px) { .ogrid { grid-template-columns: 1fr; } .plist { display: none; } }


/* ════════════════════════════════════════════════════════════════════
   PASS 5 — INFORMATION SET LAYER (ported from the parent; D13, D19–D24,
   D34, D43, D48). The layer ABOVE the D48 line: the subject is decided here.
   ════════════════════════════════════════════════════════════════════ */
.info-view { grid-area: stage; display: none; min-width: 0; min-height: 0; overflow: auto; position: relative; }
body.layer-info .info-view { display: block; }
body.layer-info #stage, body.layer-info .panel, body.layer-info .min-pill { display: none !important; }
body.layer-info .workspace { grid-template-columns: var(--rail-w) 1fr !important; grid-template-rows: 1fr !important; grid-template-areas: "rail stage" !important; }
body.layer-info .act-only { display: none !important; }

.line-note { display: flex; gap: 10px; align-items: center; margin: 0 0 16px; padding: 10px 14px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); font-size: 12px; }
.line-note i { color: var(--accent); }
.setchange { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 8px; background: var(--unreq-bg); border: 1px solid rgba(255,181,71,.4); margin-bottom: 16px; font-size: 12px; color: #ffd79a; }
.setchange > i { color: var(--unreq); margin-top: 2px; }

/* Point cards */
.ptcard { display: grid; grid-template-columns: 34px 1fr; gap: 14px; cursor: pointer; }
.ptcard:hover { border-color: var(--muted); }
.ptcard.archived { opacity: .7; }
.ptcard .idx { width: 34px; height: 34px; border-radius: 8px; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--text); }
.ptcard .ttl { font-weight: 700; font-size: 14px; }
.ptcard .summ { color: #cfd7e3; font-size: 13px; margin: 4px 0 8px; max-width: 75ch; }
.meta-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.meta-row .spacer { flex: 1; }
.req { display: inline-flex; gap: 6px; align-items: center; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--surface3); color: var(--muted); }
.req.met { background: var(--ok-bg); color: var(--ok); }
.req.unmet { background: var(--unreq-bg); color: var(--unreq); }
.req.archived { background: rgba(255,122,122,.16); color: var(--danger); }
.pill-src { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface3); color: var(--muted); display: inline-flex; gap: 5px; align-items: center; }
.pill-src.sourced { background: var(--ok-bg); color: var(--ok); }
.pill-src.model { background: var(--unreq-bg); color: var(--unreq); }
.pill-src.lib { background: var(--accent-bg); color: var(--accent); }
.pill-src.danger { background: rgba(255,122,122,.16); color: var(--danger); }
.pill-src.ver { background: var(--bg); border: 1px solid var(--line); }
.pill-src.cmt { cursor: pointer; }
.pill-src.cmt:hover { color: var(--text); }

/* Point document */
.doc-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; max-width: 1280px; margin: 0 auto; padding: 20px 22px 140px; }
.doc-back { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); background: none; border: 0; padding: 0; font-weight: 600; margin-bottom: 12px; }
.doc-back:hover { color: var(--text); }
.doc-head h1 { margin: 2px 0 8px; font-size: 20px; max-width: 70ch; }
.doc-title-in { width: 100%; background: transparent; border: 1px solid transparent; border-radius: 6px; padding: 4px 6px; margin-left: -6px; font: inherit; font-size: 20px; font-weight: 700; color: var(--text); }
.doc-title-in:hover { border-color: var(--line); }
.doc-title-in:focus { outline: none; border-color: var(--accent); background: var(--bg); }
.doc-sec { margin-top: 18px; }
.doc-sec .dl { display: flex; align-items: center; gap: 8px; }
.doc-sec .dl .btn { margin-left: auto; opacity: 0; transition: opacity .15s; }
.doc-sec:hover .dl .btn, .doc-sec.changed .dl .btn { opacity: 1; }
.doc-text { white-space: pre-wrap; font-size: 14px; line-height: 1.6; max-width: 75ch; color: #dfe6ef; padding: 8px 10px; margin-left: -10px; border-radius: 6px; border: 1px solid transparent; outline: none; }
.doc-text:hover { border-color: var(--line); }
.doc-text:focus { border-color: var(--accent); background: var(--bg); }
.doc-sec.changed .doc-text { border-color: var(--accent); background: linear-gradient(0deg, var(--accent-bg), var(--accent-bg)), var(--bg); }
.doc-sec.changed .dl::after { content: 'edited'; color: var(--accent); text-transform: none; letter-spacing: 0; font-weight: 600; }
.doc-sec .proposal { max-width: 75ch; margin-top: 8px; }
.doc-sec .proposal .ptext { white-space: pre-wrap; font-size: 13px; color: #dfe6ef; margin-top: 4px; }
.doc-aside { position: sticky; top: 16px; align-self: start; }
.usage-card { border-color: rgba(195,166,255,.35); }
.usage-card h3 i { color: var(--lock); }
.usage-item { display: flex; gap: 8px; align-items: flex-start; padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; background: var(--bg); font-size: 12px; color: #dfe6ef; }
.usage-item > i { color: var(--lock); font-size: 9px; margin-top: 5px; }
.usage-item .grow { flex: 1; }
.usage-item.added { border-color: var(--accent); }
.usage-item.removed { opacity: .55; }
.usage-item.removed .grow { text-decoration: line-through; }
.covtab td { font-size: 12px; }
.lc-row { display: flex; gap: 8px; align-items: center; }
.hist-ver { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.hist-ver:last-child { border-bottom: 0; }
.hist-ver b { color: var(--text); }
.drift { display: inline-flex; gap: 5px; align-items: center; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
.drift.behind { background: var(--unreq-bg); color: var(--unreq); }
.drift.archived { background: rgba(255,122,122,.16); color: var(--danger); }
.drift.cur { background: var(--surface3); color: var(--muted); }

/* Comment thread + library popovers reuse .vmenu geometry */
.cmt-pop { position: fixed; z-index: 1200; width: 380px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 18px 50px rgba(0,0,0,.55); padding: 12px; }
.cmt { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
.cmt:last-child { border-bottom: 0; }
.cmt .av { width: 26px; height: 26px; border-radius: 50%; color: #fff; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: none; }
.cmt .who { font-weight: 700; }
.cmt .who span { color: var(--faint); font-weight: 600; margin-left: 6px; }
.cmt .ex { margin-top: 6px; padding: 6px 9px; background: var(--bg); border-left: 3px solid var(--line); border-radius: 4px; color: #cfd7e3; }
.cmt .chg { color: var(--unreq); font-weight: 600; font-size: 11px; margin-top: 4px; }
.lib-item { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 9px 10px; margin-bottom: 6px; }
.lib-item:hover { border-color: var(--accent); }
.lib-item > i { color: var(--unreq); margin-top: 3px; }
.lib-item b { display: block; }
.lib-item .am { margin-top: 3px; }
@media (max-width: 1100px) { .doc-wrap { grid-template-columns: 1fr; } .doc-aside { position: static; } }


/* ════════════════════════════════════════════════════════════════════
   PASS 6a — ACTIVITIES LAYER: the project's library of activities. The
   review screen is one level DOWN from here.
   ════════════════════════════════════════════════════════════════════ */
.acts-view { grid-area: stage; display: none; min-width: 0; min-height: 0; overflow: auto; }
body.layer-actlist .acts-view { display: block; }
body.layer-actlist #stage, body.layer-actlist .panel, body.layer-actlist .min-pill { display: none !important; }
body.layer-actlist .workspace { grid-template-columns: var(--rail-w) 1fr !important; grid-template-rows: 1fr !important; grid-template-areas: "rail stage" !important; }
body.layer-actlist .act-only { display: none !important; }
.mod-group { margin-bottom: 22px; }
.mod-head { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.mod-head i { font-size: 13px; }
.mod-head .count { font-weight: 600; text-transform: none; letter-spacing: 0; }
.acard { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; }
.acard .an { font-size: 14px; }
.acard .pts { margin-top: 8px; }
.acard .sts { flex-direction: row; flex-wrap: wrap; margin-top: 8px; }
.acard .in-out { margin-top: 8px; font-size: 12px; color: var(--muted); }
.acard .in-out b { color: var(--text); font-weight: 600; }
.acard .ra { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.standin-body { border: 1px dashed var(--line); border-radius: 10px; padding: 28px; text-align: center; color: var(--muted); margin: 16px 0; }
.standin-body i { font-size: 30px; display: block; margin-bottom: 10px; color: var(--faint); }
.back-link { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); background: none; border: 0; padding: 0; font-weight: 600; }
.back-link:hover { color: var(--text); }
.stage-bar .back-link { margin-right: 6px; }

/* ════════════════════════════════════════════════════════════════════
   PASS 7 — SCENARIO REVIEW RENDERER (the generated-at-runtime proof)
   ════════════════════════════════════════════════════════════════════ */
body.mod-scenario #frame, body.mod-scenario .transport, body.mod-scenario #narr, body.mod-scenario #toolRegion { display: none !important; }
body.mod-scenario .stage-inner { max-width: 1180px; }
#scn { display: none; }
body.mod-scenario #scn { display: block; }

.phases { display: flex; gap: 2px; padding: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 16px; overflow-x: auto; }
.phase { flex: 1; min-width: 120px; border: 0; background: none; color: var(--muted); font-weight: 600; padding: 8px 10px; border-radius: 6px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; }
.phase:hover { background: var(--surface2); color: var(--text); }
.phase.on { background: var(--accent-bg); color: var(--text); }
.phase .ph-n { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
.phase .ph-sub { font-size: 11px; font-weight: 500; color: var(--faint); }
.phase .ph-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-left: 6px; vertical-align: middle; }
.phase .ph-dot.chg { background: var(--accent); box-shadow: 0 0 6px var(--accent); }
.phase .ph-dot.unreq { background: var(--unreq); box-shadow: 0 0 6px var(--unreq); }

.scn-note { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); font-size: 12px; margin-bottom: 14px; }
.scn-note i { color: var(--accent); margin-top: 2px; }
.scn-grid { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 18px; align-items: start; }
.scn-grid .reh-col { position: sticky; top: 0; }
.scn-page { max-width: 80ch; }
.scn-page.full { max-width: none; }

/* Elements — every targetable thing carries .sel + data-el. Same hover/selected/glow as video. */
.sel { position: relative; border-radius: 6px; cursor: pointer; transition: box-shadow .15s; border: 1px solid transparent; }
.sel:hover { box-shadow: 0 0 0 2px rgba(124,156,255,.7); }
.sel.selected { box-shadow: 0 0 0 2px var(--accent), 0 0 0 6px rgba(124,156,255,.25); }
.readonly .sel { cursor: default; } .readonly .sel:hover { box-shadow: none; }
.sel .pin { top: -8px; right: -8px; }
.sel .lock-badge { top: -8px; left: -8px; }
.el-block { padding: 8px 10px; margin: 0 0 8px; background: var(--surface); border-color: var(--line); font-size: 13px; line-height: 1.55; color: #dfe6ef; }
.el-block .lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin-bottom: 3px; display: flex; gap: 6px; align-items: center; }
.el-block .lbl .badge { text-transform: none; letter-spacing: 0; }
.el-block .sub2 { color: var(--muted); font-size: 12px; margin-top: 4px; }
.el-inline { display: inline-block; padding: 2px 6px; margin: 0 2px 4px 0; background: var(--surface2); border-color: var(--line); font-size: 12px; }
.cast { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.cast .el-block { margin: 0; }
.cast .nm { font-weight: 700; font-size: 14px; }
.cast .rl { color: var(--muted); font-size: 12px; }

/* Steps */
.step-card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
.step-card.active { border-color: var(--accent); }
.step-head { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
.step-head .num { width: 26px; height: 26px; border-radius: 7px; background: var(--surface3); display: flex; align-items: center; justify-content: center; font-weight: 800; flex: none; }
.step-head .ttl { font-weight: 700; font-size: 14px; }
.step-head .mode { font-size: 11px; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; margin-left: 8px; }
.step-head .beat { margin-left: auto; }
.step-card .sel.el-block { background: var(--bg); }
.lv-row { display: grid; grid-template-columns: 90px 1fr; gap: 8px; align-items: start; margin-bottom: 6px; }
.lv-tag { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; text-align: center; margin-top: 8px; }
.lv-tag.strong { background: var(--ok-bg); color: var(--ok); }
.lv-tag.neutral { background: var(--accent-bg); color: var(--accent); }
.lv-tag.unthoughtful { background: var(--unreq-bg); color: var(--unreq); }
.lv-fields .el-block { margin-bottom: 6px; }
.lv-ex { font-size: 12px; }
.lv-ex .q { color: var(--muted); }
.lv-ex .a { color: #dfe6ef; margin-top: 3px; }
.step-sec { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin: 10px 0 6px; }
.rub { display: flex; gap: 8px; align-items: center; }
.rub .mb { margin-left: auto; }

/* Rehearsal — its own register (parent): teal chrome on a darker ground */
.reh { background: #0c1218; border: 1px solid #1f3a3f; border-radius: 10px; display: flex; flex-direction: column; max-height: calc(100vh - 170px); min-height: 420px; }
.reh-bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid #1f3a3f; }
.reh-title { font-weight: 800; color: #7fd6cf; display: inline-flex; gap: 8px; align-items: center; }
.reh-title::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #35c7b8; box-shadow: 0 0 8px #35c7b8; }
.reh-modes { margin-left: auto; display: inline-flex; border: 1px solid #1f3a3f; border-radius: 6px; overflow: hidden; }
.reh-modes button { border: 0; border-right: 1px solid #1f3a3f; background: #0f171d; color: #8fb3b0; padding: 4px 10px; font-size: 12px; font-weight: 700; }
.reh-modes button:last-child { border-right: 0; }
.reh-modes button.on { background: #1f4a4a; color: #d6fffb; }
.reh-hint { padding: 6px 12px; font-size: 11px; color: #7f9a98; border-bottom: 1px solid #1f3a3f; }
.reh-step { padding: 8px 12px; font-size: 12px; color: #b9cfcc; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #1f3a3f; }
.reh-step b { color: #e3f6f3; }
.reh-nav { margin-left: auto; display: inline-flex; gap: 2px; }
.reh-nav .icon-btn { width: 24px; height: 24px; font-size: 11px; color: #8fb3b0; }
.reh-scroll { flex: 1; min-height: 0; overflow: auto; padding: 12px; }
.turn { display: flex; margin-bottom: 10px; }
.turn.coach { justify-content: flex-start; } .turn.learner { justify-content: flex-end; }
.turn-inner { max-width: 86%; }
.turn-who { font-size: 10px; font-weight: 700; color: #7f9a98; margin-bottom: 3px; text-transform: uppercase; letter-spacing: .05em; }
.turn.learner .turn-who { text-align: right; }
.bubble { padding: 8px 11px; border-radius: 10px; font-size: 13px; line-height: 1.5; color: #e3f6f3; background: #142127; border: 1px solid #1f3a3f; }
.turn.learner .bubble { background: #1b2a3a; border-color: #2a4560; }
.bubble.verbatim { border-style: solid; border-color: #2d5a57; }
.turn-foot { display: flex; gap: 6px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
.lvl-link { font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 999px; cursor: pointer; border: 0; }
.lvl-link.strong { background: var(--ok-bg); color: var(--ok); } .lvl-link.neutral { background: var(--accent-bg); color: var(--accent); } .lvl-link.unthoughtful { background: var(--unreq-bg); color: var(--unreq); }
.turn-act { border: 1px solid #1f3a3f; background: #0f171d; color: #b9cfcc; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.turn-act:hover { color: #e3f6f3; border-color: #35c7b8; }
.turn-act.kept { background: #1f4a4a; color: #d6fffb; border-color: #35c7b8; }
.verb-tag { font-size: 10px; color: #6f8a88; }
.roll-n { font-size: 10px; color: #6f8a88; margin-left: auto; }
.carry { display: flex; gap: 8px; padding: 8px 10px; background: #0f171d; border: 1px dashed #1f3a3f; border-radius: 8px; font-size: 11px; color: #9fb8b5; margin-bottom: 10px; }
.exhibit { display: flex; gap: 10px; padding: 10px; background: #0f171d; border: 1px solid #1f3a3f; border-radius: 8px; font-size: 12px; color: #b9cfcc; margin-bottom: 10px; }
.exhibit i { font-size: 22px; color: #35c7b8; }
.reh-foot { border-top: 1px solid #1f3a3f; padding: 10px 12px; }
.reh-input { display: flex; gap: 8px; }
.reh-box { flex: 1; background: #0f171d; border: 1px solid #1f3a3f; color: #e3f6f3; border-radius: 6px; padding: 7px 10px; font: inherit; }
.reh-box:focus { outline: none; border-color: #35c7b8; }
.reh-send { background: #35c7b8; border-color: #35c7b8; color: #06201d; }
.try { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 8px; font-size: 11px; color: #7f9a98; }
.try-btn { border: 1px solid #1f3a3f; background: #0f171d; color: #b9cfcc; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
.try-btn.strong:hover { border-color: var(--ok); } .try-btn.neutral:hover { border-color: var(--accent); } .try-btn.unthoughtful:hover { border-color: var(--unreq); }
.empty-row { font-size: 12px; color: #7f9a98; padding: 8px; }

/* Coverage page */
.cov-table td { font-size: 12.5px; }
.beat-ok { color: var(--ok); } .beat-no { color: var(--danger); }

/* Scenario learner player */
.sp-wrap { max-width: 760px; margin: 0 auto; }
.sp-narr { font-size: 15px; line-height: 1.6; color: #dfe6ef; padding: 14px 16px; background: #11161c; border-radius: 8px; margin-bottom: 14px; }
.sp-chat { background: #0f141a; border: 1px solid #2a3240; border-radius: 10px; padding: 14px; min-height: 260px; }
.sp-step { font-size: 11px; color: #9aa6b6; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; margin-bottom: 10px; display: flex; gap: 8px; align-items: center; }
.sp-step .mb { text-transform: none; letter-spacing: 0; }
.sp-input { display: flex; gap: 8px; margin-top: 12px; }
.sp-quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.sp-quick button { border: 1px solid #2a3240; background: #151a22; color: #c9d2de; font-size: 12px; padding: 4px 10px; border-radius: 999px; }
.sp-quick button:hover { border-color: #fff; }
.sp-debrief { margin-top: 12px; padding: 12px; background: #151a22; border-radius: 8px; font-size: 13px; color: #dfe6ef; }
.sp-debrief b { display: block; margin-bottom: 6px; }
.sp-debrief li { margin-bottom: 4px; }
.sp-progress { display: flex; gap: 6px; margin-bottom: 12px; }
.sp-progress span { flex: 1; height: 5px; border-radius: 3px; background: #2a3240; }
.sp-progress span.done { background: #4fc48a; } .sp-progress span.cur { background: #fff; }
@media (max-width: 1100px) { .scn-grid { grid-template-columns: 1fr; } .scn-grid .reh-col { position: static; } }

/* ── Pass 8 — spec editor (G14) and the coverage tab (G1) ───────── */
.spec-f { margin-top: 10px; }
.spec-f label { display: flex; gap: 6px; align-items: center; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 4px; }
.spec-f .inp { padding: 5px 8px; font-size: 12px; }
.spec-f.queued .inp { border-color: var(--accent); background: linear-gradient(0deg, var(--accent-bg), var(--accent-bg)), var(--bg); }
.spec-q { font-size: 10px; font-weight: 700; text-transform: none; letter-spacing: 0; color: var(--accent); margin-left: auto; display: inline-flex; gap: 6px; align-items: center; }
.spec-q .was { display: inline; color: var(--faint); margin: 0; }
.spec-q button { border: 0; background: none; color: var(--accent); font-size: 10px; padding: 0; text-decoration: underline; }
.spec-cons { display: flex; gap: 8px; align-items: center; font-size: 12px; color: #cfd7e3; padding: 4px 0; }
.spec-cons.pending-add { color: var(--accent); }
.spec-cons.pending-rem { color: var(--faint); text-decoration: line-through; }
