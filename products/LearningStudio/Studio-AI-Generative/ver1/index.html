  setTimeout(() => $('#popText')?.focus(), 0);
  avoidFloatingPanel(r);
}
function closePopover() { $('#popover').classList.add('hidden'); pop = null; }

function addPending() {
  const text = $('#popText').value.trim();
  if (!text) { $('#popText').focus(); return; }
  const verbatim = !!$('#popVerbatim')?.checked;
  const info = infoFor(pop.elId);
  if (pop.editing) {
    Object.assign(S.pending.find(p => p.n === pop.editing), { text, verbatim });
  } else {
    S.pending = S.pending.filter(p => !(p.elId === pop.elId && p.type === 'annotate' && pop.type !== 'region'));
    // an annotation on an unrequested change IS a decision about it (G6) — it is being addressed in the next task
    const g = genAt(S.viewing); (g.changes || []).forEach(c => { if (c.elId === pop.elId && !g.decisions[c.id]) g.decisions[c.id] = 'annotated'; });
    S.pending.push({ n: ++S.seq, type: pop.type || 'annotate', elId: pop.elId, text, verbatim, rect: pop.rect,
      label: pop.type === 'region' ? `Region · ${info.el.label}` : labelOf(info), where: whereOf(info) });
  }
  closePopover(); S.selected = null; render();
  toast(`Queued — <b>${S.pending.length}</b> item${S.pending.length > 1 ? 's' : ''} in Pending`);
}

function selectElement(elId, domEl) {
  if (isReadonly()) return;
  S.selected = elId; render();
  const target = document.querySelector(`[data-el="${elId}"]`) || domEl;
  const existing = S.pending.find(p => p.elId === elId && p.type === 'annotate');
  openPopover(target, { elId, type: 'annotate', editing: existing?.n });
}

/* Jump — seek to where the change shows, and pulse it even with the map off (G5). */
function jumpTo(elId, t) {
  S.playing = false; S.t = t; render();
  const node = document.querySelector(`[data-el="${elId}"]`);
  if (node) {
    node.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    node.classList.remove('jump-pulse'); void node.offsetWidth; node.classList.add('jump-pulse');
    avoidFloatingPanel(node.getBoundingClientRect());
  }
}

/* Floating panel never covers the selected element (G8). */
function avoidFloatingPanel(r) {
  if (S.dock !== 'float') return;
  const p = $('#panel'), pr = p.getBoundingClientRect();
  const overlap = !(r.right < pr.left || r.left > pr.right || r.bottom < pr.top || r.top > pr.bottom);
  if (!overlap) return;
  const goLeft = r.left + r.width / 2 > innerWidth / 2;
  p.style.left = (goLeft ? 70 : innerWidth - pr.width - 16) + 'px';
}

/* Send — one revision task (G9). */
function sendTask(opts = {}) {
  const instruction = $('#instruction').value.trim();
  const task = { items: clone(S.pending), instruction };
  closePopover(); S.selected = null; S.viewing = latestIdx(); S.tab = 'history';
  S.working = { ...task, step: 0 };
  render();
  if (opts.freeze) return;
  const tick = () => {
    S.working.step++;
    if (S.working.step < 3) { render(); setTimeout(tick, 800); return; }
    finishTask(task);
  };
  setTimeout(tick, 800);
}
function finishTask(task) {
  S.working = null;
  const gen = generate(task);
  S.pending = []; $('#instruction').value = '';
  S.viewing = latestIdx(); S.tab = 'changes'; S.changeMap = true;
  const first = gen.changes.find(c => c.kind === 'unreq') || gen.changes[0];
  if (first) S.t = first.t;
  render();
  const un = gen.changes.filter(c => c.kind === 'unreq').length;
  toast(`Generation ${gen.n} ready · ${gen.changes.length} change${gen.changes.length === 1 ? '' : 's'}${un ? ` · <span style="color:var(--unreq)">${un} unrequested</span>` : ''}`);
}

function changeById(id) { return viewedChanges().find(c => c.id === id); }
function decide(id, what) {
  const g = genAt(S.viewing), c = changeById(id);
  if (what === 'restore') {
    const info = infoFor(c.elId, S.viewing - 1) ;
    S.pending.push({ n: ++S.seq, type: 'restore', elId: c.elId, field: c.field, value: c.before,
      tint: c.field === 'label' ? info?.el.tint : undefined, label: c.label, where: c.where });
    g.decisions[id] = 'restore';
    toast(`Restore queued as #${S.seq} — it goes out with the next revision task`);
  } else g.decisions[id] = 'accepted';
  render();
}

/* ── Wiring ───────────────────────────────────────────────────── */
document.addEventListener('click', e => {
  if (S.tool === 'region' && e.target.closest('#frame')) return;      // mouseup of a region drag
  const t = e.target.closest('button, [data-el]');
  if (!t) {
    if (pop && !e.target.closest('#popover')) { closePopover(); S.selected = null; render(); }
    return;
  }
  const d = t.dataset;
  if (d.gen !== undefined && !t.disabled) { S.viewing = +d.gen; S.selected = null; closePopover(); render(); return; }
  if (d.tab) { S.tab = d.tab; render(); return; }
  if (d.dock) { setDock(d.dock); return; }
  if (d.jump) { const c = changeById(d.jump); jumpTo(c.elId, c.t); return; }
  if (d.accept) { decide(d.accept, 'accept'); return; }
  if (d.restore) { decide(d.restore, 'restore'); return; }
  if (d.annot) { const c = changeById(d.annot); jumpTo(c.elId, c.t); setTimeout(() => selectElement(c.elId), 60); return; }
  if (d.pjump) { const p = S.pending.find(x => x.n === +d.pjump); S.viewing = latestIdx(); const i = infoFor(p.elId); jumpTo(p.elId, i.sc.start + i.t); return; }
  if (d.pedit) { const p = S.pending.find(x => x.n === +d.pedit); const i = infoFor(p.elId); jumpTo(p.elId, i.sc.start + i.t); setTimeout(() => selectElement(p.elId), 60); return; }
  if (d.premove) {
    const p = S.pending.find(x => x.n === +d.premove);
    const gl = genAt(latestIdx());
    Object.keys(gl.decisions).forEach(k => { if (k.startsWith(p.elId + ':') && (gl.decisions[k] === 'restore' && p.type === 'restore' || gl.decisions[k] === 'annotated' && p.type === 'annotate')) delete gl.decisions[k]; });
    S.pending = S.pending.filter(x => x !== p); render(); return;
  }
  if (d.pop) {
    if (d.pop === 'close') { closePopover(); S.selected = null; render(); }
    if (d.pop === 'add') addPending();
    if (d.pop === 'lock') { S.locks[pop.elId] = { by: 'you' }; closePopover(); S.selected = null; render(); toast('Locked — the AI and you are both refused until it is unlocked'); }
    if (d.pop === 'unlock') { delete S.locks[pop.elId]; const id = pop.elId; closePopover(); render(); selectElement(id); }
    return;
  }
  if (d.layer) { setLayer(d.layer); return; }
  if (d.actlist !== undefined) { setLayer('activities'); return; }
  if (d.openactivity) { openActivity(d.openactivity); return; }
  if (t.id === 'briefChip') { B.focusRow = 'act-video'; B.scrollRow = true; B.expanded = null; setLayer('brief'); return; }
  if (d.pass3 !== undefined) { toast('Pass 3 — outputs and approval gates (G1, G11)'); return; }
  if (d.el && S.tool === 'select' && !e.target.closest('#panel')) { e.stopPropagation(); selectElement(d.el, t); }
});

/* Timeline scrub + playback */
$('#timeline').addEventListener('mousedown', e => {
  const tl = e.currentTarget, total = composedOf(S.viewing).reduce((n, s) => n + s.dur, 0);
  const seek = ev => { const r = tl.getBoundingClientRect(); S.t = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)) * total; render(); };
  closePopover(); S.playing = false; seek(e);
  const up = () => { removeEventListener('mousemove', seek); removeEventListener('mouseup', up); };
  addEventListener('mousemove', seek); addEventListener('mouseup', up);
});
let playTimer = null;
function togglePlay() {
  S.playing = !S.playing; closePopover();
  clearInterval(playTimer);
  if (S.playing) playTimer = setInterval(() => {
    const total = composedOf(S.viewing).reduce((n, s) => n + s.dur, 0);
    S.t += 0.1; if (S.t >= total - 0.06) { S.t = total - 0.06; S.playing = false; clearInterval(playTimer); }

/* Region tool — draw a box on a flat image (G4 fallback). */
$('#frame').addEventListener('mousedown', e => {
  if (S.tool !== 'region' || isReadonly()) return;
  const f = e.currentTarget, r = f.getBoundingClientRect();
  const x0 = (e.clientX - r.left) / r.width * 100, y0 = (e.clientY - r.top) / r.height * 100;
  const box = document.createElement('div'); box.className = 'region-draft'; f.appendChild(box);
  let rect = { x: x0, y: y0, w: 0, h: 0 };
  const move = ev => {
    const x1 = (ev.clientX - r.left) / r.width * 100, y1 = (ev.clientY - r.top) / r.height * 100;
    rect = { x: Math.min(x0, x1), y: Math.min(y0, y1), w: Math.abs(x1 - x0), h: Math.abs(y1 - y0) };
    Object.assign(box.style, { left: rect.x + '%', top: rect.y + '%', width: rect.w + '%', height: rect.h + '%' });
  };
  const up = () => {
    removeEventListener('mousemove', move); removeEventListener('mouseup', up);
    if (rect.w < 3 || rect.h < 3) { box.remove(); return; }
    const composed = composedOf(S.viewing);
    const sc = composed.find(s => S.t >= s.start && S.t < s.start + s.dur) || composed[composed.length - 1];
    openPopover(box, { elId: sc.bg.id, type: 'region', rect });
    const obs = new MutationObserver(() => { if ($('#popover').classList.contains('hidden')) { box.remove(); obs.disconnect(); } });
    obs.observe($('#popover'), { attributes: true });
  };
  addEventListener('mousemove', move); addEventListener('mouseup', up);
});

/* Dock + float drag (G8). Position is remembered per user — localStorage here. */
function setDock(d, opts = {}) {
  if (d !== 'min') S.lastDock = d;

  render();
}
$('#panelHead').addEventListener('mousedown', e => {

function commitSave(opts = {}) {
  const ch = briefChanges(), im = impact(ch), d = B.dialog;

  im.exempt.concat(im.notGen).forEach(r => r.briefV = B.version);
  // G11 — publish approvals are computed against their pin (publishState), so this save clears them by itself
  B.dialog = null;
  if (d.choice === 'refresh') {
    im.affected.forEach(r => startOver(r, d.keep));
    renderBrief();
    toast(`Brief v${B.version} saved · <b>${im.affected.length}</b> activit${im.affected.length === 1 ? 'y' : 'ies'} regenerated from scratch`);
  } else startAnalysis(ch, im.affected, opts);
}

/* Refresh one activity: a fresh generation, a new lineage. */
function startOver(r, keep = {}) {
  r.briefV = B.version; r.fresh = true; r.approval = 'none'; r.queued = 0; r.left = 0;
  if (r.id !== 'act-video') { r.gen += 1; return; }
  const prev = genAt(latestIdx()), scenes = clone(GEN1);
  // The fresh draw follows the CURRENT brief — e.g. the equipment decides the truck
  const truck = findRaw(scenes, 'sc1-truck');
  if (!/reach/i.test(B.saved.equipment)) { truck.label = truck.alt.label; truck.tint = truck.alt.tint; truck.alt = null; }
  // Kept locks carry their element verbatim into the new lineage
  Object.keys(S.locks).forEach(id => {
    if (keep['video|' + id] === false) { delete S.locks[id]; return; }
    const from = findRaw(prev.scenes, id), to = findRaw(scenes, id);
    if (from && to) Object.assign(to, clone(from));
  });
  S.gens.push({ n: prev.n + 1, scenes, task: null, fresh: `brief v${B.version}`, decisions: {}, changes: [] });
  S.viewing = latestIdx();
  S.pending = S.pending.filter(p => !p.fromBrief);
}

/* ── G10 action 2 — analyse ───────────────────────────────────── */
function startAnalysis(ch, rows, opts = {}) {
  B.mode = 'analysing'; B.analysis = { rows: rows.map(r => r.id), step: 0 };
  const finish = () => { B.findings = analyse(ch, rows); B.mode = 'findings'; renderBrief(); };
  if (opts.instant) return finish();
  renderBrief();
  if (opts.freeze) return;
  const tick = () => {
    if (B.mode !== 'analysing') return;
    B.analysis.step++;
    if (B.analysis.step < rows.length) { renderBrief(); setTimeout(tick, 380); } else finish();
  };
  setTimeout(tick, 380);
}
function analysingHTML() {
  const a = B.analysis;

    <div class="sub">Each activity's current generation is checked against what changed. Nothing is edited.</div>
    ${a.rows.map((id, i) => { const r = planRow(id); return `<div class="arow ${i < a.step ? 'done' : i === a.step ? 'run' : ''}"><i class="fa-solid ${i < a.step ? 'fa-check' : i === a.step ? 'fa-spinner fa-spin' : 'fa-circle-small'}"></i>${esc(r.title)}<span class="am">generation ${rowGen(r)}</span></div>`; }).join('')}</div>`;
}

/* The AI's read of each activity against each changed field. In the product
   this is a model call over the real content; here it is a scripted library
   keyed by field — but the VIDEO findings read its live current generation,
   so what Pass 1 did to the video changes what the analysis says. */
function analyse(ch, rows) {
  const vid = elementsOf(compose(genAt(latestIdx()).scenes));
  const acts = rows.map(r => ({ row: r, startOver: false, items: [] }));
  const rank = { holds: 0, outdated: 1, wrong: 2 };
  const put = (id, f) => {
    const a = acts.find(x => x.row.id === id); if (!a) return;
    const ex = a.items.find(x => x.el === f.el);
    if (ex) { if (rank[f.verdict] > rank[ex.verdict]) Object.assign(ex, f); return; }
    a.items.push({ id: 'f' + (++fseq), disp: null, why: '', ...f });
  };
  ch.forEach(c => {
    // an activity that overrides this field is untouched by it
    const P = (id, f) => { const a = acts.find(x => x.row.id === id); if (a && !a.row.overrides.includes(c.key)) put(id, f); };
    if (LIB[c.key]) LIB[c.key](c, P, vid);
  });
  acts.forEach(a => {
    if (!a.items.length) a.items.push({ id: 'f' + (++fseq), verdict: 'holds', el: 'Whole activity', reason: 'Nothing in this activity depends on what changed.', disp: null });
    a.items.sort((x, y) => rank[y.verdict] - rank[x.verdict]);
  });
  return { acts };
}
const LIB = {
  equipment(c, P, vid) {
    const truck = vid['sc1-truck'].el.label, kw = /reach/i.test(truck) ? 'reach' : 'counterbalance';
    const reach = /reach/i.test(c.after);
    P('act-video', new RegExp(kw, 'i').test(c.after)
      ? { verdict: 'holds', el: 'Forklift · scene 1', excerpt: truck, reason: `Already matches “${c.after}”.` }
      : { verdict: 'wrong', el: 'Forklift · scene 1', elId: 'sc1-truck', excerpt: truck, reason: `Depicts a ${truck.toLowerCase()}; the brief now specifies “${c.after}”.`, fix: `Show ${lcFirst(c.after)} instead` });
    P('act-video', { verdict: 'holds', el: 'Narration', reason: 'No truck type is named in the narration.' });

const allFindings = () => B.findings.acts.flatMap(a => a.items);

const fOpenHTML = open => open ? `<b>${open}</b> finding${open > 1 ? 's' : ''} still need${open > 1 ? '' : 's'} a decision` : `<span style="color:var(--ok)"><i class="fa-solid fa-circle-check"></i> Every finding has a decision</span>`;
function factHTML(a) {

function findingHTML(i) {
  const vl = { holds: 'Holds', outdated: 'Out of date', wrong: 'Wrong' }[i.verdict];
  if (i.verdict === 'holds') return `<div class="frow v-holds"><span class="vchip v-holds">${vl}</span><div class="fbody"><span class="fel">${esc(i.el)}</span><span class="frs">${esc(i.reason)}</span></div><span></span></div>`;
  const seg = `<div class="seg">${[['update', 'Update'], ['delete', 'Delete'], ['leave', 'Leave as is']].map(([k, l]) => `<button class="${i.disp === k ? 'on' : ''}" data-disp="${i.id}|${k}">${l}</button>`).join('')}</div>`;

      ${i.disp === 'delete' ? `<div class="ffix"><i class="fa-solid fa-trash"></i><span>Queues a removal${i.elId ? ' into this video’s Pending' : ''}</span></div>` : ''}
      ${i.verdict === 'wrong' && i.disp === 'leave' ? `<input class="inp reason" data-reason="${i.id}" placeholder="Why is this acceptable? Required — it travels to whoever approves the handoff (G11)" value="${esc(i.why || '')}">` : ''}

function updateFindingsChrome() {
  const open = openFindings();
  $('#fOpen').innerHTML = fOpenHTML(open);
  document.querySelector('[data-fapply]').disabled = !!open;
}
function applyFindings() {
  const v = B.version; let q = 0, so = 0, left = 0;
  B.findings.acts.forEach(a => {
    const r = a.row;
    if (a.startOver) { so++; startOver(r); return; }
    r.briefV = v;
    const ups = a.items.filter(i => i.disp === 'update' || i.disp === 'delete');
    r.left = a.items.filter(i => i.disp === 'leave').length; left += r.left;
    a.items.filter(i => i.disp === 'leave').forEach(i => B.leftAsIs.push({ act: r.id, el: i.el, verdict: i.verdict, why: i.why }));
    if (r.id === 'act-video') {
      // the SAME revision-task path as review (G9) — not a new editing path
      ups.forEach(i => {
        const info = infoFor(i.elId, latestIdx());
        S.pending.push({ n: ++S.seq, type: 'annotate', elId: i.elId, verbatim: false, fromBrief: v, remove: i.disp === 'delete',
          text: i.disp === 'delete' ? `Remove — brief v${v}: ${i.reason}` : `Brief v${v}: ${i.fix}`, label: labelOf(info), where: whereOf(info) });
      });
    } else r.queued = ups.length;
    q += ups.length;
    if (ups.length && r.approval === 'content') r.approval = 'carries';
  });
  B.mode = 'form'; B.findings = null;
  renderBrief();
  toast(`Applied · <b>${q}</b> update${q === 1 ? '' : 's'} queued${so ? ` · ${so} starting over` : ''}${left ? ` · ${left} left as is` : ''}`);
}

/* AI proposals ------------------------------------------------- */
function proposeAudience(aud) {
  const dr = AUDIENCE_DRAFTS[aud];
  ['setting', 'roles', 'equipment', 'terminology'].forEach(k => { if (dr[k] !== B.draft[k]) B.proposals[k] = dr[k]; else delete B.proposals[k]; });
}
function addVariation(baseId, kind) {
  const base = planRow(baseId), id = `${baseId}-v${++B.vseq}`;
  const common = { id, modality: base.modality, icon: base.icon, treatment: base.treatment, variantOf: base.id, points: {}, prov: {}, gen: 0, approval: 'none', goal: base.goal, briefV: B.version, queued: 0, left: 0, fresh: false };
  // Only audience variations exist at activity level (G2, G13). The points come
  // across as the AI's proposal; their depth judgments start over as `proposed`.
  const aud = kind.replace('Audience: ', '');
  const r = { ...common, title: `${base.title} — ${aud}`, audience: aud, overrides: ['audience', 'setting', 'roles', 'equipment'],
    ovValues: { audience: aud, ...AUDIENCE_DRAFTS[aud] },
    proposals: { points: { ...base.points }, note: 'the same points at the same depths. An audience variation changes depiction, never the subject (G2). Depth judgments start as proposed — a confirmation on the base does not carry (OQ Q4).' } };
  let at = B.plan.indexOf(base);
  B.plan.forEach((x, i) => { if (x.variantOf === base.id) at = i; });
  B.plan.splice(at + 1, 0, r);
  B.expanded = id; B.menu = null; B.focusRow = null;
}

/* Wiring ------------------------------------------------------- */
$('#briefView').addEventListener('click', e => {
  const t = e.target.closest('button, [data-row], [data-choice], input[type=checkbox]');
  if (!t) { if (B.menu) { B.menu = null; renderBrief(); } return; }
  const d = t.dataset;
  if (d.keeplock) { B.dialog.keep[d.keeplock] = t.checked; return; }
  if (d.paccept) { B.draft[d.paccept] = B.proposals[d.paccept]; delete B.proposals[d.paccept]; return renderBrief(); }
  if (d.pdismiss) { delete B.proposals[d.pdismiss]; return renderBrief(); }
  if (d.crem !== undefined) { B.draft.constraints.splice(+d.crem, 1); return renderBrief(); }
  if (d.cundo !== undefined) { B.draft.constraints.push(B.saved.constraints[+d.cundo]); return renderBrief(); }
  if (d.cadd !== undefined) { const v = $('#cAddInput').value.trim(); if (v) { B.draft.constraints.push(v); renderBrief(); } return; }
  if (d.csuggest !== undefined) {
    const s = SUGGESTED_CONSTRAINTS.find(c => !B.draft.constraints.includes(c) && !B.cProposals.includes(c));
    if (s) B.cProposals.push(s); else toast('No further suggestions');
    return renderBrief();
  }
  if (d.cpaccept !== undefined) { B.draft.constraints.push(B.cProposals.splice(+d.cpaccept, 1)[0]); return renderBrief(); }
  if (d.cpdismiss !== undefined) { B.cProposals.splice(+d.cpdismiss, 1); return renderBrief(); }
  if (d.bdiscard !== undefined) { B.draft = clone(B.saved); B.proposals = {}; B.cProposals = []; return renderBrief(); }
  if (d.bsave !== undefined) { B.dialog = { choice: null, keep: {} }; return renderBrief(); }
  if (d.dclose !== undefined) { B.dialog = null; return renderBrief(); }
  if (d.choice) { B.dialog.choice = d.choice; return renderBrief(); }
  if (d.dgo !== undefined) return commitSave();
  if (d.varmenu) { B.menu = B.menu === d.varmenu ? null : d.varmenu; return renderBrief(); }
  if (d.addvar) { const [id, k] = d.addvar.split('|'); addVariation(id, k); return renderBrief(); }
  if (d.propaccept) { const r = planRow(d.propaccept); r.points = r.proposals.points; r.prov = Object.fromEntries(Object.keys(r.points).map(p => [p, { state: 'proposed', at: 1, ptv: pointOf(p).version }])); r.proposals = null; toast('Points accepted — ready to generate'); return renderBrief(); }
  if (d.ptdismiss) { const [id, p] = d.ptdismiss.split('|'); delete planRow(id).proposals.points[p]; return renderBrief(); }
  if (d.generate) {
    const r = planRow(d.generate); r.genning = true; renderBrief();
    setTimeout(() => { r.genning = false; r.gen = 1; r.briefV = B.version; renderBrief(); toast(`Generation 1 ready · ${esc(r.title)}`); }, 1400);
    return;
  }
  if (d.openact) return openActivity(d.openact);
  if (d.row) { B.expanded = B.expanded === d.row ? null : d.row; B.focusRow = null; B.menu = null; return renderBrief(); }
  if (d.disp) { const [fid, k] = d.disp.split('|'); findF(fid).disp = k; return renderBrief(); }
  if (d.startover) { const a = B.findings.acts.find(x => x.row.id === d.startover); a.startOver = !a.startOver; return renderBrief(); }
  if (d.bulkleave !== undefined) { allFindings().forEach(i => { if (i.verdict === 'outdated' && !i.disp) i.disp = 'leave'; }); return renderBrief(); }
  if (d.fback !== undefined) { B.mode = 'form'; toast(`Decide later — those activities stay behind brief v${B.version}`); return renderBrief(); }
  if (d.fresume !== undefined) { B.mode = 'findings'; return renderBrief(); }
  if (d.fapply !== undefined) return applyFindings();
});

/* ════════════════════════════════════════════════════════════════════
   PASS 3 — GATES (G1, G11)
   Content approval: per activity, granted from the learner preview, pinned to
   a generation (D41). Publish approval: per output, pinned to the brief
   version + every activity's generation — any change clears it (G11).
   ════════════════════════════════════════════════════════════════════ */

// Which elements carry which points in the video. The generator CLAIMS these;
// the learner preview checks a learner actually reaches them.
const VIDEO_CLAIMS = { 'info-1': ['n1a', 'n3b'], 'info-2': ['n1c'] };

/* Content approval state for any activity row */
function rowApproval(r) {
  if (r.id === 'act-video') {
    const a = S.approval;
    if (!a) return 'none';
    if (a.gen !== genAt(latestIdx()).n) return 'stale';
    return S.pending.some(p => p.fromBrief) ? 'carries' : 'content';
  }
  return r.approval;   // 'content' | 'carries' | 'stale' | 'none'
}
const approvedGenOf = r => r.id === 'act-video' ? S.approval && S.approval.gen : r.approvedGen;
function approvalChip(r) {
  const a = rowApproval(r), ag = approvedGenOf(r);
  if (a === 'content') return `<span class="mb ok"><i class="fa-solid fa-circle-check"></i>Content approved · gen ${ag}</span>`;
  if (a === 'carries') return `<span class="mb ok" title="The content hasn't changed yet, so the approval holds. It goes stale when the queued updates regenerate it (D41)."><i class="fa-solid fa-circle-check"></i>Approved gen ${ag} · stale on next gen</span>`;
  if (a === 'stale') return `<span class="mb warn" title="Approved against an earlier generation — a person re-approves (D41)"><i class="fa-solid fa-clock"></i>Approved gen ${ag} — now gen ${rowGen(r)}</span>`;
  return `<span class="mb">Not approved</span>`;
}

/* Outputs ------------------------------------------------------ */
const outById = id => B.outputs.find(o => o.id === id);
const shortTitle = id => planRow(id).title.replace(/:.*$/, '');
const outPts = o => { const ids = [...new Set(o.acts.flatMap(a => Object.keys(planRow(a).points)))].sort(); return Object.fromEntries(ids.map(pid => { const p = pointOf(pid); return [pid, !p ? 'removed' : p.lifecycle === 'archived' ? 'archived' : 'v' + p.version]; })); };
const outSig = o => ({ brief: B.version, gens: Object.fromEntries(o.acts.map(a => [a, rowGen(planRow(a))])), pts: outPts(o) });
const sigKey = o => JSON.stringify(outSig(o));
const pinText = pin => `brief v${pin.brief} · ` + Object.entries(pin.gens).map(([a, g]) => `${shortTitle(a)} g${g}`).join(' · ') + (pin.pts ? ' · points ' + Object.entries(pin.pts).map(([pid, v]) => `${(pointOf(pid) || { short: pid }).short} ${v}`).join(', ') : '');

/* G11 — a publish approval applies only to the exact state it pinned */
function publishState(o) {
  if (!o.pin) return { state: 'none', why: [] };
  const cur = outSig(o), why = [];
  if (cur.brief !== o.pin.brief) why.push(`Brief v${o.pin.brief} → v${cur.brief}`);
  o.acts.forEach(a => { if (cur.gens[a] !== o.pin.gens[a]) why.push(`${planRow(a).title}: generation ${o.pin.gens[a] ?? '—'} → ${cur.gens[a]}`); });

   FLOW STATES — seeded, deterministic screens for the flow map.

function seedPending() {
  const add = (elId, text, verbatim) => { const i = infoFor(elId, latestIdx()); S.pending.push({ n: ++S.seq, type: 'annotate', elId, text, verbatim, label: labelOf(i), where: whereOf(i) }); };

}
function toG2() { seedPending(); const task = { items: clone(S.pending), instruction: $('#instruction').value.trim() }; finishTask(task); }

function applyFlowState(id, opts) {
  opts = opts || {};
  clearInterval(playTimer); closePopover(); clearInterval(pTimer); P = null; $('#player').innerHTML = '';
  let after = null;
  S = freshState(); I = freshInfo(); syncPoints(); B = freshBrief(); fseq = 0; $('#instruction').value = '';
  let dock = 'right';
  switch (id) {
    case 'activities': S.actView = 'list'; break;
    case 'activity-standin': S.actView = 'standin'; S.actOpen = 'act-scenario'; break;
    case 'g1': S.t = 1.2; break;
    case 'annotate': {
      S.t = compose(GEN1)[2].start + 1; S.selected = 'sc3-sign'; render();
      openPopover(document.querySelector('[data-el="sc3-sign"]'), { elId: 'sc3-sign', type: 'annotate', prefill: 'INSPECTION LOG — EVERY SHIFT', verbatim: true });
      return finish();
    }
    case 'region': {
      S.tool = 'region'; S.t = 1.2; render();
      const rect = { x: 6, y: 58, w: 30, h: 30 };
      const f = $('#frame'), box = document.createElement('div'); box.className = 'region-draft';
      Object.assign(box.style, { left: rect.x + '%', top: rect.y + '%', width: rect.w + '%', height: rect.h + '%' }); f.appendChild(box);
      openPopover(box, { elId: 'sc1-bg', type: 'region', rect, prefill: 'Floor is too clean — add worn yellow aisle striping here.' });
      return finish();
    }
    case 'pending': seedPending(); S.tab = 'pending'; S.t = compose(GEN1)[2].start + 1; break;
    case 'working': seedPending(); render(); sendTask({ freeze: true }); S.working.step = 1; break;
    case 'g2': toG2(); break;
    case 'jump-unreq': { toG2(); const c = genAt(1).changes.find(x => x.elId === 'ov-2b'); render(); jumpTo(c.elId, c.t); return finish(); }
    case 'restore': { toG2(); const c = genAt(1).changes.find(x => x.elId === 'ov-2b'); S.t = c.t; decide(c.id, 'restore'); const f = genAt(1).changes.find(x => x.field === 'fit'); if (f) decide(f.id, 'accept'); S.tab = 'pending'; break; }
    case 'g3': { toG2(); const c = genAt(1).changes.find(x => x.elId === 'ov-2b'); decide(c.id, 'restore'); const f = genAt(1).changes.find(x => x.field === 'fit'); if (f) decide(f.id, 'accept'); finishTask({ items: clone(S.pending), instruction: '' }); break; }
    case 'g1-readonly': toG2(); S.viewing = 0; break;
    case 'dock-bottom': toG2(); dock = 'bottom'; break;
    case 'dock-float': toG2(); dock = 'float'; break;
    case 'dock-min': toG2(); dock = 'min'; break;
    // ── Pass 2 — the project brief
    case 'brief': S.layer = 'brief'; break;
    case 'brief-variation': S.layer = 'brief'; addVariation('act-video', 'Audience: Fire service'); break;
    case 'brief-audience': S.layer = 'brief'; B.draft.audience = 'Fire service'; proposeAudience('Fire service'); break;
    case 'brief-dirty': S.layer = 'brief'; seedBriefEdit(false); break;
    case 'brief-save': S.layer = 'brief'; seedBriefEdit(true); B.dialog = { choice: 'analyse', keep: {} }; break;
    case 'brief-refresh': S.layer = 'brief'; seedBriefEdit(true); B.dialog = { choice: 'refresh', keep: {} }; break;
    case 'brief-analysing': S.layer = 'brief'; seedBriefEdit(true); B.dialog = { choice: 'analyse', keep: {} }; commitSave({ freeze: true }); B.analysis.step = 3; break;
    case 'brief-findings': S.layer = 'brief'; seedBriefEdit(true); B.dialog = { choice: 'analyse', keep: {} }; commitSave({ instant: true }); break;
    case 'brief-decided': S.layer = 'brief'; seedBriefEdit(true); B.dialog = { choice: 'analyse', keep: {} }; commitSave({ instant: true }); seedDecisions(); break;
    case 'brief-applied': S.layer = 'brief'; seedBriefEdit(true); B.dialog = { choice: 'analyse', keep: {} }; commitSave({ instant: true }); seedDecisions(); applyFindings(); break;
    // ── Pass 3 — gates
    case 'preview': after = () => { openPlayer({ mode: 'activity' }); P.t = 9.6; P.furthest = 15; renderPlayer(); }; break;
    case 'preview-done': toG2(); genAt(1).changes.filter(c => c.kind === 'unreq').forEach(c => genAt(1).decisions[c.id] = 'accepted');
      after = () => { openPlayer({ mode: 'activity' }); P.t = P.furthest = pTotal(); pItemDone(); renderPlayer(); }; break;
    case 'approved-g2': seedApprovedG2(); break;
    case 'outputs': S.layer = 'outputs'; break;
    case 'outputs-cleared': toG2(); S.layer = 'outputs'; break;
    case 'outputs-stale-sme': {   // a task touches the narration line that CARRIES P2 → its SME confirmation goes stale.
      // (P1 is also carried by the video, but the knowledge check delivers it at Mastery, so the video's judgment isn't the one the threshold reads — D14.)
      seedApprovedG2();
      const i = infoFor('n1c', latestIdx());
      S.pending.push({ n: ++S.seq, type: 'annotate', elId: 'n1c', text: 'Plainer — say it the way a shift lead would.', verbatim: false, label: labelOf(i), where: whereOf(i) });
      finishTask({ items: clone(S.pending), instruction: '' }); S.pending = [];
      S.layer = 'outputs'; break;
    }
    case 'outputs-brief': seedBriefEdit(true); B.dialog = { choice: 'analyse', keep: {} }; commitSave({ instant: true }); seedDecisions(); applyFindings(); S.layer = 'outputs'; break;
    case 'output-preview': seedApprovedG2(); S.layer = 'outputs';
      after = () => { openPlayer({ mode: 'output', outId: 'out-comp' }); pItemDone(); renderPlayer(); }; break;
    case 'publish-review': seedApprovedG2(); S.layer = 'outputs'; outById('out-comp').previewSig = sigKey(outById('out-comp')); B.pubDialog = 'out-comp'; break;
    case 'published': { seedApprovedG2(); S.layer = 'outputs'; const o = outById('out-comp'); o.previewSig = sigKey(o); o.pin = { ...outSig(o), on: 'Today' }; o.sentSig = sigKey(o); break; }
    // ── Pass 5 — the information set
    case 'info-set': S.layer = 'info'; break;
    case 'info-point': S.layer = 'info'; after = () => openPoint('info-3'); break;
    case 'info-propose': S.layer = 'info'; after = () => { openPoint('info-3'); proposeSection('claim'); }; break;
    case 'info-dirty': S.layer = 'info'; after = () => { seedPointEdit(); renderInfo(); }; break;
    case 'info-saved': S.layer = 'info'; after = () => { seedPointEdit(); savePoint(); }; break;
    case 'info-saved-plan': after = () => { seedPointEdit(); savePoint(); B.expanded = 'act-scenario'; setLayer('brief'); }; break;
    case 'info-archived': S.layer = 'info'; after = () => { openPoint('info-3'); archivePoint('info-3', true); }; break;
    case 'info-archived-outputs': after = () => { archivePoint('info-3', true); setLayer('outputs'); }; break;
    case 'info-library': S.layer = 'info'; after = () => { renderInfo(); const b = document.querySelector('[data-libopen]'); b.scrollIntoView({ block: 'center' }); infoPop(b, libraryHTML()); }; break;
    case 'info-removed': S.layer = 'info'; after = () => removePoint('info-2'); break;
    case 'brief-video-queued': seedBriefEdit(true); B.dialog = { choice: 'analyse', keep: {} }; commitSave({ instant: true }); seedDecisions(); applyFindings(); S.tab = 'pending'; S.t = 1.2; break;
    default: break;
  }
  setDock(dock, { silent: true });
  if (after) after();
  finish();
  function finish() { if (!opts.instant) window.scrollTo(0, 0); }
}
window.applyFlowState = applyFlowState;

/* Boot */
S = freshState(); I = freshInfo(); syncPoints(); B = freshBrief();
try { const d = localStorage.getItem('sag-dock'); if (d && d !== 'min') S.dock = S.lastDock = d; } catch (e) {}
