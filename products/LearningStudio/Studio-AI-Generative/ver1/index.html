/* ════════════════════════════════════════════════════════════════════
   COMPOSITION — derive timing and fit from content.
   ════════════════════════════════════════════════════════════════════ */
const words = s => s.trim().split(/\s+/).length;
function compose(scenes) {
  let start = 0;
  return scenes.map(sc => {
    let t = 0.6;
    const lines = sc.lines.filter(l => !l.removed).map(l => { const d = words(l.text) / 2.6 + 0.35; const o = { ...l, s: t, e: t + d }; t += d; return o; });
    const dur = t + 0.9;
    const at = ([lid, f]) => { const l = lines.find(x => x.id === lid) || lines[0]; return l.s + (l.e - l.s) * f; };
    const overlays = sc.overlays.filter(ov => !ov.removed).map(ov => {
      const w = ov.pinned ? { from: 0.3, to: dur - 0.3 }
              : ov.windowOverride ? ov.windowOverride
              : { from: at(ov.anchor.from), to: at(ov.anchor.to) };
      return { ...ov, window: w };
    });
    const objects = sc.objects.filter(o => !o.removed).map(o => o.kind === 'sign'
      ? { ...o, fit: o.fitOverride ?? Math.min(1, 24 / o.text.length) } : { ...o });
    const out = { ...sc, lines, overlays, objects, start, dur };
    start += dur;
    return out;
  });
}

/* Every element of a composed generation, with the fields that get diffed. */
const r1 = n => (Math.round(n * 2) / 2).toFixed(1);   // half-second grain: sub-second jitter isn't a change
function elementsOf(composed) {
  const map = {};
  composed.forEach(sc => {
    const bg = sc.bg;
    map[bg.id] = { el: bg, sc, kind: 'background', t: 0.4,
      fields: { image: `Generated image${bg.regen ? ' · redrawn ×' + bg.regen : ''}${bg.patches.length ? ` · ${bg.patches.length} region${bg.patches.length > 1 ? 's' : ''} regenerated` : ''}`, lighting: bg.lighting } };
    sc.objects.forEach(o => {
      map[o.id] = o.kind === 'sign'
        ? { el: o, sc, kind: 'sign', t: 0.4, fields: { text: o.text, fit: Math.round(o.fit * 100) + '%' } }
        : { el: o, sc, kind: 'object', t: 0.4, fields: { label: o.label } };
    });
    sc.overlays.forEach(ov => {
      const f = { text: ov.text.replace(/\|/g, ' · ') };
      if (!ov.pinned) f.window = `${r1(ov.window.from)}–${r1(ov.window.to)}s`;
      map[ov.id] = { el: ov, sc, kind: ov.kind, t: ov.window.from + 0.1, fields: f };
    });
    sc.lines.forEach((l, i) => map[l.id] = { el: l, sc, kind: 'line', idx: i, t: l.s + 0.05, fields: { text: l.text } });
  });
  return map;
}
function labelOf(info) {
  if (info.label) return info.label;
  if (info.kind === 'object') return info.el.label;
  if (info.kind === 'line') return `Narration line ${info.idx + 1}`;
  if (info.kind === 'background') return info.el.label;
  return KIND[info.kind].name;
}
const whereOf = info => info.where || `Scene ${info.sc.id.slice(-1)}`;

const genAt = i => R.gens[i];
const latestIdx = () => R.gens.length - 1;
const revLatest = rev => rev.gens[rev.gens.length - 1];
const adapt = () => ADAPT[R.id];
const isReadonly = () => R.viewing !== latestIdx() || !!R.working;
const composedOf = i => compose(genAt(i).scenes);

/* ════════════════════════════════════════════════════════════════════
   GENERATE — apply a revision task (G9) to produce generation n+1.
   Targeted elements change; untargeted elements are NOT regenerated, but the
   scene is RECOMPOSED — so timing and fit can still move (G6).
   ════════════════════════════════════════════════════════════════════ */
function findRaw(scenes, id) {
  for (const sc of scenes) {
    if (sc.bg.id === id) return sc.bg;
    for (const k of ['objects', 'overlays', 'lines']) { const f = sc[k].find(x => x.id === id); if (f) return f; }
  }
}
function videoApply(prev, task, lockedBefore) {
  const scenes = clone(prev.scenes);
  const claims = nextClaims(prev.claims || VIDEO_CLAIMS, task);
  task.items.forEach(it => {
    if (it.type === 'spec') { applySpecToRow(planRow(R.id), it); videoSpecEffect(scenes, it); return; }   // G14 — rides the task
    if (it.type === 'cover') { videoCover(scenes, claims, it); return; }                                  // a carrier for a claimed point
    const el = findRaw(scenes, it.elId);
    if (it.type === 'region') {
      el.patches.push({ ...it.rect, note: it.text });
      el.lighting = el.lighting.replace(/^(\w+)/, m => m === 'Cool' ? 'Neutral' : m === 'Warm' ? 'Warmer' : 'Softer ' + m.toLowerCase());
      return;
    }
    if (it.type === 'restore') {
      if (it.field === 'window') { const [a, b] = it.value.replace('s', '').split('–').map(Number); el.windowOverride = { from: a, to: b }; }
      else if (it.field === 'fit') el.fitOverride = parseInt(it.value) / 100;
      else if (it.field === 'label') { el.label = it.value; if (it.tint) el.tint = it.tint; }
      else if (it.field === 'lighting') el.lighting = it.value;
      else if (it.field === 'image') { el.patches = []; el.regen = 0; }
      else if (it.field === 'text') el.text = it.value.replace(/ · /g, '|');
      else if (it.field === 'removed') el.removed = false;
      return;
    }
    // annotation
    if (it.remove && el.kind !== 'background') { el.removed = true; return; }   // a 'Delete' from brief analysis (G10)
    if (el.kind === 'background') { el.regen = (el.regen || 0) + 1; return; }
    if (el.kind === 'object') { if (el.alt) { el.label = el.alt.label; el.tint = el.alt.tint; el.alt = null; } else el.label += ' (revised)'; return; }
    if (it.verbatim) {
      el.text = it.text.replace(/^["“']|["”']$/g, '');
      R.locks[it.elId] = { by: `#${it.n}`, verbatim: true };          // G4: verbatim lands exactly, then locks
    } else if (el.alt) {
      el.text = typeof el.alt === 'string' ? el.alt : el.alt.text; el.alt = null;
    } else {
      el.text = el.text.replace(/\.$/, '') + ' — revised.';
    }
  });
  const gen = { n: prev.n + 1, scenes, claims, task, decisions: {} };
  gen.changes = diff(elementsOf(compose(prev.scenes)), elementsOf(compose(scenes)), task, lockedBefore);
  return gen;
}
function generate(task) {
  const prev = genAt(latestIdx());
  const lockedBefore = new Set(Object.keys(R.locks));   // a lock set BY this task can't fail in it
  const gen = adapt().apply(prev, task, lockedBefore);
  R.gens.push(gen);
  return gen;
}

/* DIFF — computed by comparing two generations, never taken from the
   generator's account of what it did (G6). Attribution: a change is
   REQUESTED only if a task item targeted that element and that field. */
/* Does a task item account for a change to (element, field)?
   Element items (annotate / restore / pin / region) are matched by id.
   A SPEC item (G14) names no element: it declares a SCOPE — element kinds ×
   fields the edit is entitled to move (G15). A COVER item accounts for a new
   carrier element and for the coverage claim it adds. Anything outside is drift. */
function itemCovers(it, id, field, info, isNew) {
  if (it.type === 'spec') { const sc = (adapt().specScope[it.field] || {})[info.kind]; return !!sc && sc.includes(field); }
  if (it.type === 'cover') { const p = pointOf(it.pid); return (info.kind === 'coverage' && p && field === p.short) || (isNew && adapt().coverKinds.includes(info.kind)); }
  if (it.elId !== id) return false;
  if (field === 'removed') return true;
  const prim = KIND[info.kind] ? KIND[info.kind].primary : 'text';
  return it.type === 'restore' ? it.field === field : it.type === 'pin' ? true : it.type === 'region' ? field === 'image' : prim === '*' || field === prim;
}
function diff(A, B, task, lockedBefore) {
  const out = [];
  Object.keys(B).forEach(id => {
    const fa = A[id] ? A[id].fields : {}, fb = B[id].fields, info = B[id];
    // fields in both (or new), then fields the generation dropped (a coverage claim withdrawn)
    [...Object.keys(fb), ...Object.keys(fa).filter(f => !(f in fb))].forEach(field => {
      if (fa[field] === fb[field]) return;
      // a coverage claim the generator dropped because the SPEC no longer asks for the point is explained by the spec, not drift
      const specDrop = info.kind === 'coverage' && !(field in fb) && !planRow(R.id).points[(POINTS.find(p => p.short === field) || {}).id]
        ? { type: 'spec', n: null, text: `${field} is no longer claimed by the spec` } : null;
      const cause = task.items.find(it => itemCovers(it, id, field, info, !A[id])) || specDrop;
      out.push({ id: id + ':' + field, elId: id, field, before: fa[field] ?? '—', after: fb[field] ?? '— (dropped)',
        kind: cause ? 'req' : 'unreq', cause: cause || null, label: labelOf(info), where: whereOf(info),
        elKind: info.kind, t: info.sc ? info.sc.start + info.t : null, failedLock: !cause && lockedBefore.has(id) });
    });
  });
  Object.keys(A).forEach(id => {                      // elements that no longer exist
    if (B[id]) return;
    const info = A[id], cause = task.items.find(it => itemCovers(it, id, 'removed', info, false));
    out.push({ id: id + ':removed', elId: id, field: 'removed', before: labelOf(info), after: 'Removed', kind: cause ? 'req' : 'unreq',
      cause: cause || null, label: labelOf(info), where: whereOf(info), elKind: info.kind, t: info.sc ? info.sc.start + info.t : null, failedLock: !cause && lockedBefore.has(id) });
  });
  // unrequested first — they need a decision before approval
  return out.sort((x, y) => (x.kind === y.kind ? (x.t || 0) - (y.t || 0) : x.kind === 'unreq' ? -1 : 1));
}

/* ════════════════════════════════════════════════════════════════════
   RENDER
   ════════════════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = t => { const m = Math.floor(t / 60), s = Math.floor(t % 60); return `${m}:${String(s).padStart(2, '0')}`; };

function viewedChanges() { return genAt(R.viewing).changes || []; }
function changeClass(elId) {
  const ch = viewedChanges().filter(c => c.elId === elId && genAt(R.viewing).decisions[c.id] !== 'accepted');
  if (!ch.length) return '';
  return ch.some(c => c.kind === 'unreq') ? 'chg-unreq' : 'chg-req';
}
function pinFor(elId) { const p = R.pending.find(x => x.elId === elId && x.type !== 'region'); return p ? `<span class="pin">${p.n}</span>` : ''; }
function lockFor(elId) { return R.locks[elId] ? `<span class="lock-badge" title="Locked by ${R.locks[elId].by}"><i class="fa-solid fa-lock"></i></span>` : ''; }
function workFor(elId) { return R.working && R.working.items.some(i => i.elId === elId) ? ' is-working' : ''; }

function render() {
  const isVideo = R.id === 'act-video';
  document.body.classList.toggle('mod-scenario', !isVideo);
  let composed, total, sc, lt;
  if (isVideo) {
    composed = composedOf(R.viewing);
    total = composed.reduce((n, sc) => n + sc.dur, 0);
    S.t = Math.max(0, Math.min(S.t, total - 0.05));
    sc = composed.find(s => S.t >= s.start && S.t < s.start + s.dur) || composed[composed.length - 1];
    lt = S.t - sc.start;
  }
  const ro = isReadonly(), row = planRow(R.id);
  $('#actTitle').textContent = row.title;

  ['right', 'left', 'bottom', 'float', 'min'].forEach(d => document.body.classList.toggle('dock-' + d, S.dock === d));
  document.body.classList.toggle('layer-brief', S.layer === 'brief');
  document.body.classList.toggle('layer-outputs', S.layer === 'outputs');
  document.body.classList.toggle('layer-info', S.layer === 'info');
  document.body.classList.toggle('layer-actlist', S.layer === 'activities' && S.actView !== 'review');
  document.querySelectorAll('[data-layer]').forEach(b => b.classList.toggle('active', b.dataset.layer === S.layer));
  $('#crumbs').innerHTML = S.layer === 'activities' && S.actView === 'list' ? 'Forklift Safety &amp; Operation › <b>Activities</b>'
    : S.layer === 'activities' && S.actView === 'standin' ? `Forklift Safety &amp; Operation › <button class="back-link" data-actlist>Activities</button> › <b>${esc(planRow(S.actOpen).title)}</b>`
    : S.layer === 'brief' ? 'Forklift Safety &amp; Operation › <b>Project brief</b>'
    : S.layer === 'outputs' ? 'Forklift Safety &amp; Operation › <b>Outputs</b>'
    : S.layer === 'info' ? `Forklift Safety &amp; Operation › <b>Information set</b>${I.mode === 'doc' ? ' › ' + esc(pointOf(I.open).short) : ''}`
    : `Forklift Safety &amp; Operation › <button class="back-link" data-actlist>Activities</button> › <b>${esc(row.title)}</b>`;
  const vrow = row, behind = vrow.briefV < B.version, bq = R.pending.filter(p => p.fromBrief).length, sq = R.pending.filter(p => p.type === 'spec').length;
  $('#briefChip').innerHTML = `<i class="fa-regular fa-clipboard-list"></i>Forklift Brief v${B.version}${behind ? ' <span style="color:var(--unreq)">· behind</span>' : bq ? ` <span style="color:var(--accent)">· ${bq} update${bq > 1 ? 's' : ''} queued</span>` : ''} · ${vrow.modality} <span class="long">· ${vrow.treatment} · ${esc(vrow.audience || B.saved.audience)} · ${vrow.overrides.length} override${vrow.overrides.length === 1 ? '' : 's'}</span>${sq ? ` <span style="color:var(--accent)">· ${sq} spec edit${sq > 1 ? 's' : ''} queued</span>` : ''}`;
  $('#stageInner').classList.toggle('readonly', ro);
  $('#stageInner').classList.toggle('chg-on', S.changeMap);

  /* top bar */
  $('#genSwitch').innerHTML = '<span class="lbl">Generation</span>' + R.gens.map((g, i) =>
    `<button class="gen-btn ${i === R.viewing ? 'active' : ''} ${i === latestIdx() ? 'latest' : ''}" data-gen="${i}" title="Generation ${g.n}${i === latestIdx() ? ' (latest)' : ''}">${g.n}</button>`).join('')
    + (R.working ? `<button class="gen-btn" disabled><i class="fa-solid fa-spinner fa-spin"></i></button>` : '');
  const open = (genAt(latestIdx()).changes || []).filter(c => c.kind === 'unreq' && !genAt(latestIdx()).decisions[c.id]).length;
  // Readiness reads the LATEST generation: open unrequested changes block it (G6),
  // and so does a queued task — its content isn't a generation yet.
  const curN = genAt(latestIdx()).n, approvedNow = R.approval && R.approval.gen === curN;
  $('#readyChip').innerHTML = open
    ? `<span class="ready-chip warn"><i class="fa-solid fa-triangle-exclamation"></i>${open} unrequested change${open > 1 ? 's' : ''} need a decision</span>`
    : R.pending.length || R.working
    ? `<span class="ready-chip" style="background:var(--accent-bg);color:var(--accent)"><i class="fa-solid fa-list-check"></i>${R.working ? 'Generating' : R.pending.length + ' queued for generation ' + (genAt(latestIdx()).n + 1)}</span>`
    : approvedNow ? `<span class="ready-chip ok"><i class="fa-solid fa-circle-check"></i>Content approved · gen ${curN}</span>`
    : `<span class="ready-chip ok"><i class="fa-solid fa-circle-check"></i>Ready for learner preview${R.approval ? ` <span style="color:var(--unreq);font-weight:600">· approval is for gen ${R.approval.gen}</span>` : ''}</span>`;
  $('#learnerBtn').disabled = !!open || !!R.working || !!R.pending.length;
  $('#actMeta').textContent = isVideo ? `Video · ${fmt(total)} · ${composed.length} scenes · generation ${genAt(R.viewing).n}` : `Scenario · ${genAt(R.viewing).doc.steps.length} steps · coach-led · generation ${genAt(R.viewing).n}`;

  /* read-only banner */
  const rb = $('#roBanner');
  if (R.working) { rb.classList.remove('hidden'); rb.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <b>Generating ${genAt(latestIdx()).n + 1}…</b> Review is paused until the task finishes.`; }
  else if (R.viewing !== latestIdx()) { rb.classList.remove('hidden'); rb.innerHTML = `<i class="fa-regular fa-eye"></i> Viewing <b>generation ${genAt(R.viewing).n}</b> · read-only. Review continues from generation ${genAt(latestIdx()).n}. <button class="btn sm" data-gen="${latestIdx()}">Back to latest</button>`; }
  else rb.classList.add('hidden');

  /* tools */
  $('#toolSelect').classList.toggle('on', S.tool === 'select');
  $('#toolRegion').classList.toggle('on', S.tool === 'region');
  $('#mapToggle').classList.toggle('on', S.changeMap);

  if (isVideo) { renderFrame(sc, lt, ro); renderTimeline(composed, total, sc); renderNarration(sc, lt); }
  else renderScenario();
  renderPanel();
  if (S.layer === 'brief') renderBrief();
  if (S.layer === 'outputs') renderOutputs();
  if (S.layer === 'info') renderInfo();
  if (S.layer === 'activities' && S.actView !== 'review') renderActs();
}

const DECOR = {
  bay: `linear-gradient(180deg, transparent 62%, #1d232b 62%, #12161c),
        repeating-linear-gradient(90deg, rgba(240,140,40,.55) 0 6px, transparent 6px 120px),
        repeating-linear-gradient(180deg, transparent 0 58px, rgba(240,140,40,.45) 58px 64px),
        linear-gradient(160deg, #3a4757, #1d2631 70%)`,
  closeup: `linear-gradient(180deg, transparent 70%, #15120d 70%),
        linear-gradient(90deg, transparent 18%, #6f6a62 18% 30%, transparent 30% 58%, #6f6a62 58% 70%, transparent 70%),
        linear-gradient(150deg, #4a3d2a, #1d1a14 70%)`,
  office: `linear-gradient(180deg, transparent 74%, #2a2f36 74%),
        linear-gradient(90deg, transparent 8%, rgba(255,255,255,.06) 8% 40%, transparent 40%),
        linear-gradient(170deg, #4b5560, #2a3139 75%)`
};
const LIGHT_TINT = { 'Neutral': 'rgba(255,255,255,.05)', 'Warmer': 'rgba(255,170,90,.12)', 'Softer': 'rgba(150,190,255,.08)' };

function renderFrame(sc, lt, ro) {
  const f = $('#frame');
  f.classList.toggle('tool-region', S.tool === 'region' && !ro);
  const bgCls = changeClass(sc.bg.id);
  const tint = Object.keys(LIGHT_TINT).find(k => sc.bg.lighting.startsWith(k));
  let html = `<div class="decor" style="background:${DECOR[sc.bg.decor]}"></div>`;
  if (tint) html += `<div class="decor" style="background:${LIGHT_TINT[tint]}"></div>`;
  html += sc.bg.patches.map(p => `<div class="patch" style="left:${p.x}%;top:${p.y}%;width:${p.w}%;height:${p.h}%"></div>`).join('');
  // the background itself is an element: a click on empty frame selects it
  html += `<div class="el el-bg ${bgCls} ${R.selected === sc.bg.id ? 'selected' : ''}${workFor(sc.bg.id)}" data-el="${sc.bg.id}" style="inset:0;border-radius:0;z-index:0"></div>`;
  sc.objects.forEach(o => {
    const pos = `left:${o.x}%;top:${o.y}%;width:${o.w}%;height:${o.h}%;z-index:2`;
    const cls = `el ${changeClass(o.id)} ${R.selected === o.id ? 'selected' : ''}${workFor(o.id)}`;
    if (o.kind === 'sign') {
      html += `<div class="${cls} el-sign" data-el="${o.id}" style="${pos};font-size:${(17 * o.fit).toFixed(1)}px"><span class="sign-band"></span><span style="padding-top:6px">${esc(o.text)}</span>${pinFor(o.id)}${lockFor(o.id)}</div>`;
    } else {
      html += `<div class="${cls} el-object" data-el="${o.id}" style="${pos};color:${o.tint}"><i class="fa-solid ${o.icon}"></i>${pinFor(o.id)}${lockFor(o.id)}</div>`;
    }
  });
  sc.overlays.forEach(ov => {
    if (lt < ov.window.from || lt > ov.window.to) return;
    const cls = `el ${changeClass(ov.id)} ${R.selected === ov.id ? 'selected' : ''}${workFor(ov.id)}`;
    const inner = ov.kind === 'lower' ? `<div class="t">${esc(ov.text)}</div><div class="s">${esc(ov.sub)}</div>`
      : ov.kind === 'bullets' ? ov.text.split('|').map(b => `<div>${esc(b)}</div>`).join('')
      : esc(ov.text);
    html += `<div class="${cls} el-ov-${ov.kind}" data-el="${ov.id}" style="z-index:4">${inner}${pinFor(ov.id)}${lockFor(ov.id)}</div>`;
  });
  // pending region annotations stay visible on the image
  R.pending.filter(p => p.type === 'region' && p.elId === sc.bg.id && R.viewing === latestIdx())
    .forEach(p => html += `<div class="region-pending" style="left:${p.rect.x}%;top:${p.rect.y}%;width:${p.rect.w}%;height:${p.rect.h}%"><span class="pin">${p.n}</span></div>`);
  html += `<div class="scene-tag">Scene ${sc.id.slice(-1)} · ${esc(sc.name)}</div>`;
  f.innerHTML = html;
}

function renderTimeline(composed, total, cur) {
  const marks = S.changeMap ? viewedChanges().filter(c => genAt(R.viewing).decisions[c.id] !== 'accepted') : [];
  $('#timeline').innerHTML =
    `<div class="tl-scenes">${composed.map(sc => `<div class="tl-scene ${sc === cur ? 'cur' : ''}" style="flex:${sc.dur}">${sc.id.slice(-1)} · ${esc(sc.name)}</div>`).join('')}</div>`
    + marks.map(c => `<div class="tl-mark ${c.kind}" style="left:${(c.t / total) * 100}%" title="${esc(c.label)}"></div>`).join('')
    + `<div class="tl-head" style="left:${(S.t / total) * 100}%"></div>`;
  $('#tc').textContent = `${fmt(S.t)} / ${fmt(total)}`;
  $('#playBtn').innerHTML = `<i class="fa-solid ${S.playing ? 'fa-pause' : 'fa-play'}"></i>`;
}

function renderNarration(sc, lt) {
  $('#narr').innerHTML = `<div class="narr-head"><i class="fa-regular fa-waveform-lines"></i> Narration · Scene ${sc.id.slice(-1)} <span class="voice"><i class="fa-regular fa-microphone"></i> ${sc.voice}</span></div>`
    + sc.lines.map(l => {
      const cur = lt >= l.s && lt < l.e;
      return `<div class="line el-line ${cur ? 'cur' : ''} ${changeClass(l.id)} ${R.selected === l.id ? 'selected' : ''}${workFor(l.id)}" data-el="${l.id}">
        <span class="ts">${fmt(sc.start + l.s)}</span><span class="txt">${esc(l.text)}</span>${pinFor(l.id)}${lockFor(l.id)}</div>`;
    }).join('');
}

/* ── Panel ─────────────────────────────────────────────────────── */
function renderPanel() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === S.tab));
  document.querySelectorAll('[data-dock]').forEach(b => b.classList.toggle('on', b.dataset.dock === S.dock));
  const g = genAt(R.viewing), ch = g.changes || [];
  const open = ch.filter(c => c.kind === 'unreq' && !g.decisions[c.id]).length;
  const cc = $('#cntChanges'); cc.textContent = ch.length || ''; cc.className = 'count' + (open ? ' unreq' : '');
  cc.style.display = ch.length ? '' : 'none';
  const cp = $('#cntPending'); cp.textContent = R.pending.length; cp.className = 'count' + (R.pending.length ? ' acc' : '');
  cp.style.display = R.pending.length ? '' : 'none';
  const md = $('#minDot'); md.textContent = open ? open : R.pending.length; md.className = 'dot' + (open ? ' unreq' : '');
  const cov = coverageRows(g), covBad = cov.filter(c => c.claimed && (!c.carriers.length || c.prov.stale)).length;
  const cv = $('#cntCoverage'); cv.textContent = cov.filter(c => c.claimed).length || ''; cv.className = 'count' + (covBad ? ' unreq' : '');
  cv.style.display = cov.some(c => c.claimed) ? '' : 'none';

  const body = $('#panelBody');
  if (S.tab === 'changes') body.innerHTML = changesHTML(g);
  if (S.tab === 'pending') body.innerHTML = pendingHTML();
  if (S.tab === 'history') body.innerHTML = historyHTML();
  if (S.tab === 'coverage') body.innerHTML = coverageTabHTML(g, cov);

  const n = R.pending.length, instr = $('#instruction').value.trim();
  const ro = isReadonly();
  $('#sendBtn').disabled = ro || (!n && !instr);
  $('#instruction').disabled = ro;
  $('#sendLbl').textContent = `Send revision task${n ? ' · ' + n : ''}`;
  $('#composerHint').textContent = R.working ? 'Task running…' : ro ? 'Read-only — switch to the latest generation' :
    n ? `Generates ${genAt(latestIdx()).n + 1} from ${genAt(latestIdx()).n}. Everything else is kept.` : adapt().hint;
}

function changesHTML(g) {
  if (g.fresh) return `<div class="empty"><i class="fa-regular fa-arrows-rotate"></i>Fresh start from ${g.fresh} — a new lineage, so it isn't compared with generation ${g.n - 1}.<br><br>Locked elements you kept were carried over verbatim.</div>`;
  if (genAt(0) === g) return `<div class="empty"><i class="fa-regular fa-sparkles"></i>Generation ${g.n} is the first draw in this lineage from the activity spec — nothing to compare yet.<br><br>${adapt().hint} Annotations collect in <b>Pending</b> and go to the AI together.</div>`;
  const ch = g.changes;
  if (!ch.length) return `<div class="empty"><i class="fa-regular fa-equals"></i>No element differs from generation ${g.n - 1}.</div>`;
  const ro = isReadonly();
  const unreq = ch.filter(c => c.kind === 'unreq'), req = ch.filter(c => c.kind === 'req');
  const card = c => {
    const d = g.decisions[c.id];
    const causeTxt = c.cause
      ? (c.cause.type === 'restore' ? `<i class="fa-solid fa-rotate-left"></i> Restore requested (#${c.cause.n})`
         : c.cause.type === 'spec' ? `<i class="fa-regular fa-clipboard-list"></i> Spec${c.cause.n ? ' edit #' + c.cause.n : ''} — ${esc(c.cause.text)} <span class="badge">in scope</span>`
         : c.cause.type === 'cover' ? `<i class="fa-regular fa-location-dot"></i> #${c.cause.n} — ${esc(c.cause.text)}`
         : `<i class="fa-solid fa-message-pen"></i> #${c.cause.n} — “${esc(c.cause.text)}”${c.cause.verbatim ? ' <span class="badge verbatim">exact</span>' : ''}`)
      : c.failedLock ? `<i class="fa-solid fa-lock"></i> Locked element changed — failed lock`
      : `<i class="fa-solid fa-triangle-exclamation"></i> Unrequested — no request explains this`;
    const state = d === 'accepted' ? `<span class="state-tag ok"><i class="fa-solid fa-check"></i>${c.kind === 'unreq' ? 'Accepted' : 'Reviewed'}</span>`
      : d === 'restore' ? `<span class="state-tag q"><i class="fa-solid fa-rotate-left"></i>Restore queued in Pending</span>`
      : d === 'annotated' ? `<span class="state-tag q"><i class="fa-regular fa-message-pen"></i>Annotated — in the next task</span>` : '';
    return `<div class="card ${c.kind === 'unreq' ? 'unreq' : ''} ${d ? 'done' : ''}">
      <div class="card-top"><span class="k"><i class="fa-regular ${(KIND[c.elKind] || KIND.line).icon}"></i></span><span class="name">${esc(c.label)}</span><span class="where">${c.where}${c.t != null ? ' · ' + fmt(c.t) : ''}</span></div>
      <div class="diff"><div class="field">${FIELD_NAME[c.field]}</div><span class="before">${esc(c.before)}</span><span class="arrow">→</span><span class="after">${esc(c.after)}</span></div>
      <div class="cause ${c.cause ? '' : 'unreq'}">${causeTxt}</div>
      <div class="card-actions">
        <button class="btn sm" data-jump="${c.id}"><i class="fa-solid fa-crosshairs"></i>Jump</button>
        ${d || ro ? state : `
          <button class="btn sm" data-accept="${c.id}"><i class="fa-solid fa-check"></i>${c.kind === 'unreq' ? 'Accept' : 'Looks right'}</button>
          <button class="btn sm" data-restore="${c.id}"><i class="fa-solid fa-rotate-left"></i>Restore</button>
          <button class="btn sm" data-annot="${c.id}"><i class="fa-regular fa-message-pen"></i>Annotate</button>`}
      </div></div>`;
  };
  return `<div class="summary"><span>vs generation <b>${g.n - 1}</b></span><span><b>${req.length}</b> requested</span><span style="${unreq.length ? 'color:var(--unreq)' : ''}"><b style="color:inherit">${unreq.length}</b> unrequested</span></div>`
    + (unreq.length ? `<div class="sec-title unreq"><i class="fa-solid fa-triangle-exclamation"></i>Unrequested — decide before approval</div>${unreq.map(card).join('')}` : '')
    + (req.length ? `<div class="sec-title req" style="margin-top:14px"><i class="fa-solid fa-message-pen"></i>Requested</div>${req.map(card).join('')}` : '');
}

function pendingHTML() {
  if (!R.pending.length) return `<div class="empty"><i class="fa-regular fa-list-check"></i>Nothing queued.<br>Annotations, restores and lock changes collect here and go to the AI as <b>one revision task</b>.</div>`;
  return `<div class="sec-title">Revision task for generation ${genAt(latestIdx()).n + 1}</div>` + R.pending.map(p => {
    const badge = (p.fromBrief ? `<span class="badge region">brief v${p.fromBrief}</span>` : '') + (p.type === 'pin' ? '<span class="badge verbatim">pin · locks</span>' : p.type === 'restore' ? '<span class="badge">restore</span>' : p.type === 'region' ? '<span class="badge region">region</span>' : p.type === 'spec' ? '<span class="badge region">spec · G14</span>' : p.type === 'cover' ? '<span class="badge region">cover</span>' : p.verbatim ? '<span class="badge verbatim">exact · locks</span>' : '');
    const ins = p.type === 'restore' ? `Put ${FIELD_NAME[p.field].toLowerCase()} back to “${esc(p.value)}”` : esc(p.text);
    return `<div class="card"><div class="pend">
      <span class="num ${p.type === 'restore' ? 'restore' : ''}">${p.n}</span>
      <div class="body"><div class="tgt">${esc(p.label)} ${badge}<span class="where">${p.where}</span></div><div class="ins">${ins}</div>
        <div class="card-actions"><button class="btn sm" data-pjump="${p.n}"><i class="fa-solid fa-crosshairs"></i>Show</button>
        ${p.type === 'annotate' && !p.remove ? `<button class="btn sm" data-pedit="${p.n}"><i class="fa-regular fa-pen"></i>Edit</button>` : ''}
        <button class="btn sm" data-premove="${p.n}"><i class="fa-regular fa-trash"></i>Remove</button></div></div>
    </div></div>`;
  }).join('');
}

function historyHTML() {
  let html = '<div class="hist">';
  if (R.working) {
    const st = R.working.step || 0, steps = adapt().steps;
    html += `<div class="hist-item working card"><b>Generation ${genAt(latestIdx()).n + 1}</b> <span class="badge">working</span>
      <div class="steps">${steps.map((s, i) => `<div class="${i < st ? 'done' : i === st ? 'run' : ''}"><i class="fa-solid ${i < st ? 'fa-check' : i === st ? 'fa-spinner fa-spin' : 'fa-circle-small'}"></i>${s}</div>`).join('')}</div></div>`;
  }
  [...R.gens].reverse().forEach(g => {
    const i = R.gens.indexOf(g);
    const items = g.task ? g.task.items.map(it => `<li>#${it.n} ${esc(it.label)} — ${it.type === 'restore' ? 'restore ' + FIELD_NAME[it.field].toLowerCase() : esc(it.text)}</li>`).join('')
      + (g.task.instruction ? `<li>Instruction — ${esc(g.task.instruction)}</li>` : '') : '';
    const un = (g.changes || []).filter(c => c.kind === 'unreq').length;
    html += `<div class="hist-item card ${i === latestIdx() ? 'latest' : ''}">
      <div class="card-top"><b>Generation ${g.n}</b>${i === latestIdx() ? '<span class="badge" style="color:var(--ok)">latest</span>' : ''}
        <span class="where">${i === R.viewing ? 'viewing' : `<button class="btn sm" data-gen="${i}">Open</button>`}</span></div>
      <div class="cause" style="margin-top:4px">${g.task ? `From a revision task · ${(g.changes || []).length} changes${un ? ` · <span style="color:var(--unreq)">${un} unrequested</span>` : ''}` : (g.fresh ? `Fresh start from ${g.fresh} — new lineage` : i === 0 && g.n > 1 ? `Generations 1–${g.n - 1} predate this prototype's history` : 'From the activity spec · Forklift Brief v3')}</div>
      ${items ? `<ul>${items}</ul>` : ''}</div>`;
  });
  return html + '</div>';
}

/* ════════════════════════════════════════════════════════════════════
   INTERACTION
   ════════════════════════════════════════════════════════════════════ */
function toast(msg) { const t = $('#toast'); t.innerHTML = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }

function infoFor(elId, i = R.viewing) { return adapt().elements(genAt(i))[elId]; }
function infoForRev(rev, elId, i = rev.gens.length - 1) { return ADAPT[rev.id].elements(rev.gens[i])[elId]; }

/* Popover — opened ON the element (G8: annotation never lives in the panel). */
let pop = null;   // { elId, type, rect?, editing? }
function openPopover(anchorEl, spec) {
  const info = infoFor(spec.elId);
  const k = spec.type === 'region' ? 'region' : info.kind;
  const locked = R.locks[spec.elId] && spec.type !== 'region';
  const existing = spec.editing ? R.pending.find(p => p.n === spec.editing) : null;
  const isText = ['sign', 'lower', 'callout', 'bullets', 'line'].includes(k) || !!(KIND[k] && KIND[k].text);
  const excerpt = spec.type === 'region' ? `Region of “${esc(info.el.label)}” — a flat generated image, so this part is regenerated in place (inpainting).`
    : k === 'background' ? `${esc(info.el.label)} — flat generated image. Tip: use the <i class="fa-solid fa-vector-square"></i> region tool to target part of it.`
    : k === 'object' ? `${esc(info.el.label)} — a composed object, regenerated on its own`
    : k === 'coverage' ? 'The generation\'s coverage claims. Annotate to ask for a different depth or beat; the generator re-anchors and the change list shows what moved.'
    : KIND[k] && KIND[k].primary === '*' ? Object.entries(info.fields).map(([f, v]) => `<b>${FIELD_NAME[f]}:</b> ${esc(v)}`).join('<br>')
    : esc(info.fields[(KIND[k] && KIND[k].primary) || 'text'] || info.fields.text || info.fields.label || '');
  const p = $('#popover');
  p.innerHTML = `
    <div class="pop-head"><span class="kind"><i class="fa-regular ${KIND[k].icon}"></i></span>${spec.type === 'region' ? 'Image region' : esc(labelOf(info))}<span class="where">${whereOf(info)}</span></div>
    <div class="pop-excerpt">${excerpt}</div>
    ${locked ? `<div class="pop-note lock"><i class="fa-solid fa-lock"></i> Locked by ${R.locks[spec.elId].by}. A locked element refuses every change, the AI's and yours — unlock it first.</div>
      <div class="pop-actions"><button class="btn sm" data-pop="close">Close</button><div class="spacer"></div><button class="btn sm" data-pop="unlock"><i class="fa-solid fa-lock-open"></i>Unlock</button></div>`
    : `<textarea class="field" id="popText" placeholder="${isText ? 'What should change? Or the exact text to use.' : 'What should change?'}">${existing ? esc(existing.text) : spec.prefill ? esc(spec.prefill) : ''}</textarea>
      ${isText ? `<label class="check"><input type="checkbox" id="popVerbatim" ${existing?.verbatim || spec.verbatim ? 'checked' : ''}><span><b>Use my wording exactly.</b> It lands verbatim and is locked afterwards, so later edits can't reword it.</span></label>` : ''}
      <div class="pop-actions">
        <button class="btn sm" data-pop="close">Cancel</button>
        ${spec.type !== 'region' && !existing ? `<button class="btn sm" data-pop="lock" title="Freeze this element (D32)"><i class="fa-solid fa-lock"></i>Lock</button>` : ''}
        <div class="spacer"></div>
        <button class="btn sm primary" data-pop="add">${existing ? 'Update' : 'Add to pending'}</button>
      </div>`}`;
  p.classList.remove('hidden');
  const r = (anchorEl.getBoundingClientRect ? anchorEl.getBoundingClientRect() : anchorEl);
  let x = r.right + 12, y = r.top;
  if (x + 350 > innerWidth) x = Math.max(12, r.left - 352);
  if (x < 12) x = 12;
  y = Math.max(64, Math.min(y, innerHeight - p.offsetHeight - 12));
  p.style.left = x + 'px'; p.style.top = y + 'px';
  pop = spec;
  setTimeout(() => $('#popText')?.focus(), 0);
  avoidFloatingPanel(r);
}
function closePopover() { $('#popover').classList.add('hidden'); pop = null; }

function addPending() {
  const text = $('#popText').value.trim();
  if (!text) { $('#popText').focus(); return; }
  const verbatim = !!$('#popVerbatim')?.checked;
  if (verbatim && /\b(the AI|the assistant|the interface|the system|the coach will now)\b/i.test(text)) { toast('<b>Blocked</b> — exact wording that talks about the AI or the interface would reach the learner (D37, G4)'); return; }
  const info = infoFor(pop.elId);
  if (pop.editing) {
    Object.assign(R.pending.find(p => p.n === pop.editing), { text, verbatim });
  } else {
    R.pending = R.pending.filter(p => !(p.elId === pop.elId && p.type === 'annotate' && pop.type !== 'region'));
    // an annotation on an unrequested change IS a decision about it (G6) — it is being addressed in the next task
    const g = genAt(R.viewing); (g.changes || []).forEach(c => { if (c.elId === pop.elId && !g.decisions[c.id]) g.decisions[c.id] = 'annotated'; });
    R.pending.push({ n: ++R.seq, type: pop.type || 'annotate', elId: pop.elId, text, verbatim, rect: pop.rect,
      label: pop.type === 'region' ? `Region · ${info.el.label}` : labelOf(info), where: whereOf(info) });
  }
  closePopover(); R.selected = null; render();
  toast(`Queued — <b>${R.pending.length}</b> item${R.pending.length > 1 ? 's' : ''} in Pending`);
}

function selectElement(elId, domEl) {
  if (isReadonly()) return;
  R.selected = elId; render();
  const target = document.querySelector(`[data-el="${elId}"]`) || domEl;
  const existing = R.pending.find(p => p.elId === elId && p.type === 'annotate');
  openPopover(target, { elId, type: 'annotate', editing: existing?.n });
}

/* Jump — seek to where the change shows, and pulse it even with the map off (G5). */
function jumpTo(elId, t) {
  const info = infoFor(elId);
  if (R.id === 'act-video') { S.playing = false; if (t != null) S.t = t; } else if (info) adapt().jump(info);
  render();
  const node = document.querySelector(`[data-el="${elId}"]`);
  if (node) {
    node.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    node.classList.remove('jump-pulse'); void node.offsetWidth; node.classList.add('jump-pulse');
    avoidFloatingPanel(node.getBoundingClientRect());
  }
}

/* Floating panel never covers the selected element (G8). */
function avoidFloatingPanel(r) {
  if (S.dock !== 'float') return;
  const p = $('#panel'), pr = p.getBoundingClientRect();
  const overlap = !(r.right < pr.left || r.left > pr.right || r.bottom < pr.top || r.top > pr.bottom);
  if (!overlap) return;
  const goLeft = r.left + r.width / 2 > innerWidth / 2;
  p.style.left = (goLeft ? 70 : innerWidth - pr.width - 16) + 'px';
}

/* Send — one revision task (G9). */
function sendTask(opts = {}) {
  const instruction = $('#instruction').value.trim();
  const task = { items: clone(R.pending), instruction };
  closePopover(); R.selected = null; R.viewing = latestIdx(); S.tab = 'history';
  R.working = { ...task, step: 0 };
  render();
  if (opts.freeze) return;
  const tick = () => {
    R.working.step++;
    if (R.working.step < 3) { render(); setTimeout(tick, 800); return; }
    finishTask(task);
  };
  setTimeout(tick, 800);
}
function finishTask(task) {
  R.working = null;
  const gen = generate(task);
  R.pending = []; $('#instruction').value = '';
  R.viewing = latestIdx(); S.tab = 'changes'; S.changeMap = true;
  const first = gen.changes.find(c => c.kind === 'unreq') || gen.changes[0];
  if (first && R.id === 'act-video') S.t = first.t;
  render();
  const un = gen.changes.filter(c => c.kind === 'unreq').length;
  toast(`Generation ${gen.n} ready · ${gen.changes.length} change${gen.changes.length === 1 ? '' : 's'}${un ? ` · <span style="color:var(--unreq)">${un} unrequested</span>` : ''}`);
}

function changeById(id) { return viewedChanges().find(c => c.id === id); }
function decide(id, what) {
  const g = genAt(R.viewing), c = changeById(id);
  if (what === 'restore') {
    const info = R.viewing > 0 ? infoFor(c.elId, R.viewing - 1) : null;
    R.pending.push({ n: ++R.seq, type: 'restore', elId: c.elId, field: c.field, value: c.before,
      tint: c.field === 'label' ? info?.el.tint : undefined, label: c.label, where: c.where });
    g.decisions[id] = 'restore';
    toast(`Restore queued as #${R.seq} — it goes out with the next revision task`);
  } else g.decisions[id] = 'accepted';
  render();
}

/* ── Wiring ───────────────────────────────────────────────────── */
document.addEventListener('click', e => {
  if (S.tool === 'region' && e.target.closest('#frame')) return;      // mouseup of a region drag
  const t = e.target.closest('button, [data-el]');
  if (!t) {
    if (pop && !e.target.closest('#popover')) { closePopover(); R.selected = null; render(); }
    return;
  }
  const d = t.dataset;
  if (d.gen !== undefined && !t.disabled) { R.viewing = +d.gen; R.selected = null; closePopover(); render(); return; }
  if (d.tab) { S.tab = d.tab; render(); return; }
  if (d.dock) { setDock(d.dock); return; }
  if (d.jump) { const c = changeById(d.jump); jumpTo(c.elId, c.t); return; }
  if (d.accept) { decide(d.accept, 'accept'); return; }
  if (d.restore) { decide(d.restore, 'restore'); return; }
  if (d.annot) { const c = changeById(d.annot); jumpTo(c.elId, c.t); setTimeout(() => selectElement(c.elId), 60); return; }
  if (d.pjump) { const p = R.pending.find(x => x.n === +d.pjump); if (p.type === 'spec') return openSpec(R.id); if (p.type === 'cover') { S.tab = 'coverage'; return render(); } R.viewing = latestIdx(); const i = infoFor(p.elId); jumpTo(p.elId, i.sc ? i.sc.start + i.t : null); return; }
  if (d.pedit) { const p = R.pending.find(x => x.n === +d.pedit); const i = infoFor(p.elId); jumpTo(p.elId, i.sc ? i.sc.start + i.t : null); setTimeout(() => selectElement(p.elId), 60); return; }
  if (d.cjump) { const i = infoFor(d.cjump); if (i) jumpTo(d.cjump, i.sc ? i.sc.start + i.t : null); return; }
  if (d.coverit) { queueCover(R, d.coverit); render(); return; }
  if (d.openspec) { openSpec(d.openspec); return; }
  if (d.premove) {
    const p = R.pending.find(x => x.n === +d.premove);
    const gl = genAt(latestIdx());
    Object.keys(gl.decisions).forEach(k => { if (k.startsWith(p.elId + ':') && (gl.decisions[k] === 'restore' && p.type === 'restore' || gl.decisions[k] === 'annotated' && p.type === 'annotate')) delete gl.decisions[k]; });
    R.pending = R.pending.filter(x => x !== p); render(); return;
  }
  if (d.pop) {
    if (d.pop === 'close') { closePopover(); R.selected = null; render(); }
    if (d.pop === 'add') addPending();
    if (d.pop === 'lock') { R.locks[pop.elId] = { by: 'you' }; closePopover(); R.selected = null; render(); toast('Locked — the AI and you are both refused until it is unlocked'); }
    if (d.pop === 'unlock') { delete R.locks[pop.elId]; const id = pop.elId; closePopover(); render(); selectElement(id); }
    return;
  }
  if (d.layer) { setLayer(d.layer); return; }
  if (d.actlist !== undefined) { setLayer('activities'); return; }
  if (d.openactivity) { openActivity(d.openactivity); return; }
  if (t.id === 'briefChip') { openSpec(R.id); return; }
  if (d.pass3 !== undefined) { toast('Pass 3 — outputs and approval gates (G1, G11)'); return; }
  if (d.el && S.tool === 'select' && !e.target.closest('#panel')) { e.stopPropagation(); selectElement(d.el, t); }
});

$('#learnerBtn').addEventListener('click', () => { if (!$('#learnerBtn').disabled) openPlayer({ mode: 'activity' }); });
$('#minPill').addEventListener('click', () => setDock(S.lastDock));
$('#toolSelect').addEventListener('click', () => { S.tool = 'select'; render(); });
$('#toolRegion').addEventListener('click', () => { S.tool = 'region'; closePopover(); R.selected = null; render(); toast('Drag a box on the image to target part of it'); });
$('#mapToggle').addEventListener('click', () => { S.changeMap = !S.changeMap; render(); });
$('#instruction').addEventListener('input', renderPanel);
$('#sendBtn').addEventListener('click', () => sendTask());
document.addEventListener('keydown', e => {
  if (P) {
    if (e.key === 'Escape') closePlayer();
    if (e.key === ' ' && !e.target.matches('input, textarea')) { e.preventDefault(); pTogglePlay(); }
    if (e.key === 'Enter' && e.target.id === 'spBox' && e.target.value.trim()) spSend(e.target.value.trim());
    return;
  }
  if (e.target.matches('textarea, input, select') || S.layer === 'brief' || S.layer === 'info' || (S.layer === 'activities' && S.actView !== 'review')) { if (e.key === 'Escape') { closePopover(); R.selected = null; render(); } return; }
  if (e.key === 'Escape') { closePopover(); R.selected = null; render(); }
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  if (e.key === 'v') $('#toolSelect').click();
  if (e.key === 'r') $('#toolRegion').click();
});

/* Timeline scrub + playback */
$('#timeline').addEventListener('mousedown', e => {
  const tl = e.currentTarget, total = composedOf(R.viewing).reduce((n, s) => n + s.dur, 0);
  const seek = ev => { const r = tl.getBoundingClientRect(); S.t = Math.max(0, Math.min(1, (ev.clientX - r.left) / r.width)) * total; render(); };
  closePopover(); S.playing = false; seek(e);
  const up = () => { removeEventListener('mousemove', seek); removeEventListener('mouseup', up); };
  addEventListener('mousemove', seek); addEventListener('mouseup', up);
});
let playTimer = null;
function togglePlay() {
  S.playing = !S.playing; closePopover();
  clearInterval(playTimer);
  if (S.playing) playTimer = setInterval(() => {
    const total = composedOf(R.viewing).reduce((n, s) => n + s.dur, 0);
    S.t += 0.1; if (S.t >= total - 0.06) { S.t = total - 0.06; S.playing = false; clearInterval(playTimer); }
    render();
  }, 100);
  render();
}
$('#playBtn').addEventListener('click', togglePlay);

/* Region tool — draw a box on a flat image (G4 fallback). */
$('#frame').addEventListener('mousedown', e => {

function commitSave(opts = {}) {
  const ch = briefChanges(), im = impact(ch), d = B.dialog;
  B.version++;
  B.versions.unshift({ v: B.version, on: 'Today', note: ch.map(c => c.label).join(', ') + ' changed', ch });
  B.saved = clone(B.draft); B.proposals = {}; B.cProposals = [];
  im.exempt.concat(im.notGen).forEach(r => r.briefV = B.version);
  // G11 — publish approvals are computed against their pin (publishState), so this save clears them by itself
  B.dialog = null;
  if (d.choice === 'refresh') {
    im.affected.forEach(r => startOver(r, d.keep));
    renderBrief();
    toast(`Brief v${B.version} saved · <b>${im.affected.length}</b> activit${im.affected.length === 1 ? 'y' : 'ies'} regenerated from scratch`);
  } else startAnalysis(ch, im.affected, opts);

/* Refresh one activity: a fresh generation, a new lineage. */
function startOver(r, keep = {}) {
  r.briefV = B.version; r.fresh = true; r.approval = 'none'; r.queued = 0; r.left = 0;
  const rv = REV[r.id];
  if (!rv) { r.gen += 1; return; }
  const was = R; R = rv;
  rv.gens.push(ADAPT[r.id].fresh(revLatest(rv), keep));
  rv.viewing = rv.gens.length - 1;
  rv.pending = rv.pending.filter(p => !p.fromBrief);
  R = was;
}
function videoFresh(prev, keep) {
  const scenes = clone(GEN1);
  // The fresh draw follows the CURRENT brief — e.g. the equipment decides the truck
  const truck = findRaw(scenes, 'sc1-truck');
  if (!/reach/i.test(B.saved.equipment)) { truck.label = truck.alt.label; truck.tint = truck.alt.tint; truck.alt = null; }
  // Kept locks carry their element verbatim into the new lineage
  Object.keys(R.locks).forEach(id => {
    if (keep['act-video|' + id] === false) { delete R.locks[id]; return; }
    const from = findRaw(prev.scenes, id), to = findRaw(scenes, id);
    if (from && to) Object.assign(to, clone(from));
  });
  // a fresh draw claims exactly what the spec asks for (Pass 8)
  const spec = planRow('act-video').points, claims = {};
  Object.keys(spec).forEach(pid => { if (VIDEO_CLAIMS[pid]) claims[pid] = clone(VIDEO_CLAIMS[pid]); else videoCover(scenes, claims, { pid, depth: spec[pid] }); });
  return { n: prev.n + 1, scenes, claims, task: null, fresh: `brief v${B.version}`, decisions: {}, changes: [] };
}

/* ── G10 action 2 — analyse ───────────────────────────────────── */
function startAnalysis(ch, rows, opts = {}) {
  B.mode = 'analysing'; B.analysis = { rows: rows.map(r => r.id), step: 0, scopeTitle: opts.scopeTitle };
  const finish = () => { B.findings = analyse(ch, rows); B.findings.scope = opts.scope || null; B.mode = 'findings'; renderBrief(); };
  if (opts.instant) return finish();
  renderBrief();
  if (opts.freeze) return;
  const tick = () => {
    if (B.mode !== 'analysing') return;
    B.analysis.step++;
    if (B.analysis.step < rows.length) { renderBrief(); setTimeout(tick, 380); } else finish();
  };
  setTimeout(tick, 380);
}
function analysingHTML() {
  const a = B.analysis;
  return `<div class="bcard analysing"><h2><i class="fa-solid fa-magnifying-glass-chart" style="color:var(--accent)"></i>${a.scopeTitle || `Analysing against brief v${B.version}`}</h2>
    <div class="sub">Each activity's current generation is checked against what changed. Nothing is edited.</div>
    ${a.rows.map((id, i) => { const r = planRow(id); return `<div class="arow ${i < a.step ? 'done' : i === a.step ? 'run' : ''}"><i class="fa-solid ${i < a.step ? 'fa-check' : i === a.step ? 'fa-spinner fa-spin' : 'fa-circle-small'}"></i>${esc(r.title)}<span class="am">generation ${rowGen(r)}</span></div>`; }).join('')}</div>`;

/* The AI's read of each activity against each changed field. In the product
   this is a model call over the real content; here it is a scripted library
   keyed by field — but the VIDEO findings read its live current generation,
   so what Pass 1 did to the video changes what the analysis says. */
function analyse(ch, rows) {
  const vid = elementsOf(compose(revLatest(REV['act-video']).scenes));   // the video's latest, whichever activity is open
  const acts = rows.map(r => ({ row: r, startOver: false, items: [] }));
  const rank = { holds: 0, outdated: 1, wrong: 2, missing: 2 };
  const put = (id, f) => {
    const a = acts.find(x => x.row.id === id); if (!a) return;
    const ex = a.items.find(x => x.el === f.el);
    if (ex) { if (rank[f.verdict] > rank[ex.verdict]) Object.assign(ex, f); return; }
    a.items.push({ id: 'f' + (++fseq), disp: null, why: '', ...f });
  };
  ch.forEach(c => {
    // an activity that overrides this field is untouched by it
    const P = (id, f) => { const a = acts.find(x => x.row.id === id); if (a && !a.row.overrides.includes(c.key)) put(id, f); };
    if (LIB[c.key]) LIB[c.key](c, P, vid);
  });
  acts.forEach(a => {
    if (!a.items.length) a.items.push({ id: 'f' + (++fseq), verdict: 'holds', el: 'Whole activity', reason: 'Nothing in this activity depends on what changed.', disp: null });
    a.items.sort((x, y) => rank[y.verdict] - rank[x.verdict]);
  });
  return { acts };
}
/* Pass 8 — a POINTS edit on one activity's spec (G14, scoped G10). Reads the
   activity's live current generation: an added point may already be carried;
   a removed point names what carried it. */
const POINT_KEYS = { 'info-1': /inspect/i, 'info-2': /three.?point|mount|dismount/i, 'info-3': /capacity|attachment|data plate|supplementary|derat/i, 'info-4': /load low|tilt/i, 'info-5': /pedestrian|right of way/i, 'info-6': /tip-?over|stay in|compartment/i };
const MOD_DEPTH = { Video: 'awareness', Podcast: 'awareness', 'Job aid': 'awareness', Scenario: 'working', 'Knowledge check': 'mastery' };   // what a modality credibly reaches — guidance only (D15)
const SIM_CARRIERS = { 'act-podcast': 'Segment 2 · the hosts on the data plate', 'act-check': 'Item 1 · stem', 'act-jobaid': 'Checklist · row 1' };
function pointFindings(c, P) {

    const g = revLatest(rv), els = ADAPT[c.act].elements(g), kw = POINT_KEYS[c.pid];
    const hits = Object.values(els).filter(i => kw && Object.values(i.fields).some(v => typeof v === 'string' && kw.test(v)) && i.kind !== 'coverage' && i.kind !== 'purpose');
    if (hits.length) hits.slice(0, 2).forEach(i => P(c.act, { verdict: 'holds', el: `${labelOf(i)} · ${whereOf(i)}`, elId: i.id || i.el.id, excerpt: Object.values(i.fields).find(v => typeof v === 'string' && kw.test(v)), reason: `Already carries ${p.short}. Applying registers it as the carrier${c.act === 'act-scenario' ? ` — the beat is ${whereOf(i).split(' · ')[0].toLowerCase()}` : ''}.`, carrier: c.pid, depth: c.depth }));
    else P(c.act, { verdict: 'missing', el: `${p.short} · ${p.title}`, reason: `Nothing in generation ${g.n} carries it. The spec claims it now; the generation doesn't.`, fix: `Cover ${p.short} at ${DEPTH[c.depth]} — the generator adds a carrier the learner can't skip`, cover: c.pid, depth: c.depth });
    return;
  }

  if (!rv) { P(c.act, { verdict: 'outdated', el: SIM_CARRIERS[c.act] || 'Content carrying it', reason: `Carries ${p.short}, which the spec no longer claims.`, fix: 'Remove it', ops: 'remove' }); return; }

/* ════════════════════════════════════════════════════════════════════

// Which elements carry which points in the video. The generator CLAIMS these;

const VIDEO_CLAIMS = { 'info-1': ['n1a', 'n3b'], 'info-2': ['n1c'] };

/* Content approval state for any activity row */
function rowApproval(r) {
  const rv = REV[r.id];

    const a = rv.approval;

  if (a === 'carries') return `<span class="mb ok" title="The content hasn't changed yet, so the approval holds. It goes stale when the queued updates regenerate it (D41)."><i class="fa-solid fa-circle-check"></i>Approved gen ${ag} · stale on next gen</span>`;
  if (a === 'stale') return `<span class="mb warn" title="Approved against an earlier generation — a person re-approves (D41)"><i class="fa-solid fa-clock"></i>Approved gen ${ag} — now gen ${rowGen(r)}</span>`;
  return `<span class="mb">Not approved</span>`;
}

/* Outputs ------------------------------------------------------ */
const outById = id => B.outputs.find(o => o.id === id);

const outSig = o => ({ brief: B.version, struct: structOf(o).version, gens: Object.fromEntries(o.acts.map(a => [a, rowGen(planRow(a))])), pts: outPts(o) });
const sigKey = o => JSON.stringify(outSig(o));
const pinText = pin => `brief v${pin.brief} · structure v${pin.struct ?? 1} · ` + Object.entries(pin.gens).map(([a, g]) => `${shortTitle(a)} g${g}`).join(' · ') + (pin.pts ? ' · points ' + Object.entries(pin.pts).map(([pid, v]) => `${(pointOf(pid) || { short: pid }).short} ${v}`).join(', ') : '');

/* G11 — a publish approval applies only to the exact state it pinned */
function publishState(o) {
  if (!o.pin) return { state: 'none', why: [] };
  if (o.pin.struct == null) o.pin.struct = 1;              // seeded pins predate structures
  const cur = outSig(o), why = [];
  if (cur.brief !== o.pin.brief) why.push(`Brief v${o.pin.brief} → v${cur.brief}`);
  if (cur.struct !== o.pin.struct) why.push(`Structure v${o.pin.struct} → v${cur.struct}`);
  o.acts.forEach(a => { if (cur.gens[a] !== o.pin.gens[a]) why.push(`${planRow(a).title}: generation ${o.pin.gens[a] ?? '—'} → ${cur.gens[a]}`); });
  Object.keys({ ...cur.pts, ...(o.pin.pts || {}) }).forEach(pid => { const was = (o.pin.pts || {})[pid], now = cur.pts[pid]; if (was !== now) why.push(`${(pointOf(pid) || { short: pid }).short}: ${was || 'not claimed'} → ${now || 'no longer claimed'}`); });

/* The threshold: every point at its bar, from the best activity that carries it */
function threshold(o) {

  return POINTS.map(p => {
    const need = FORMATS[o.format].bar(p);
    let best = null, by = null;
    o.acts.forEach(a => { const d = planRow(a).points[p.id]; if (d && (!best || DEPTH_RANK[d] > DEPTH_RANK[best])) { best = d; by = a; } });
    const prov = by ? provOf(planRow(by), p.id) : null, drift = by ? driftOf(planRow(by), p.id) : null;
    const archived = p.lifecycle === 'archived', r = reach.per[p.id];
    return { ...p, need, best, by, prov, drift, archived, reach: r, ok: !archived && !!best && DEPTH_RANK[best] >= DEPTH_RANK[need] && r.n === r.m };

/* Provenance of one point on one activity, with staleness (G12): a confirmation

function provOf(r, pid) {

/* ════════════════════════════════════════════════════════════════════
   PASS 7 — SCENARIO: the generated-at-runtime proof.
   The parent's scenario authoring surface, ported as a REVIEW RENDERER.
   Everything the parent settled survives — the six-stage spine (as the
   structure of the generated artifact), the three practice modes, the
   live rehearsal with reroll and keep (D33), beats (D42), carryover — but
   nothing here is a form. Elements are targeted and annotated like the
   video's; the shared panel, locks, change map and revision tasks are the
   same code.
   ════════════════════════════════════════════════════════════════════ */
const LEVEL_LABEL = { unthoughtful: 'Unthoughtful', neutral: 'Neutral', strong: 'Strong' };
const LEVELS = ['unthoughtful', 'neutral', 'strong'];
const MODE_META = {
  coach_inquiry: { label: 'Coach inquiry', icon: 'fa-comments', asks: 'reasons out loud with a coach' },
  roleplay:      { label: 'Roleplay',      icon: 'fa-masks-theater', asks: 'holds a position against a character' },
  observe_react: { label: 'Observe & react', icon: 'fa-eye', asks: 'spots what is wrong in an exhibit' }
};
const PHASES = [
  { id: 'framing',     n: '1', name: 'Framing',     sub: 'what the learner reads first' },
  { id: 'world',       n: '2', name: 'World',       sub: 'setting, canon, cast' },
  { id: 'coverage',    n: '3', name: 'Coverage',    sub: 'claims and their beats' },
  { id: 'interaction', n: '4', name: 'Interaction', sub: 'the steps — rehearse here' },
  { id: 'coach',       n: '5', name: 'Coach',       sub: 'how the assistant is cast' },
  { id: 'close',       n: '6', name: 'Close',       sub: 'shipped verbatim on every path' }
];

/* Normalise the parent's seed: every list item gets a stable id, so an element
   keeps its identity across generations even when a sibling is removed. */
function normaliseScenario(src) {
  const d = clone(src), tag = (arr, pre, map) => (arr || []).map((x, i) => ({ id: `${pre}-${i + 1}`, ...(map ? map(x) : (typeof x === 'string' ? { text: x } : x)) }));
  d.opening.messages = tag(d.opening.messages, 'om');
  d.world.canon = tag(d.world.canon, 'cn');
  d.misconceptions = tag(d.misconceptions, 'mis');
  d.toneGuidelines = tag(d.toneGuidelines, 'tn');
  d.steps.forEach(st => {
    const io = st.interaction;
    io.openingMessages = tag(io.openingMessages, st.id + '-om');
    if (io.brief) io.brief = tag(io.brief, st.id + '-br');
    st.debrief.keyPoints = tag(st.debrief.keyPoints, st.id + '-kp');
  });
  d.closing.components = tag(d.closing.components, 'cmp');
  d.closing.sourceReferences = tag(d.closing.sourceReferences, 'ref');
  // Coverage claims are part of the generated artifact: the generator claims a
  // point, a depth, and the BEAT (step) that guarantees it (D42).
  d.covers = { 'info-3': { depth: 'working', beat: 'st-1' }, 'info-4': { depth: 'working', beat: 'st-2' }, 'info-5': { depth: 'working', beat: 'st-3' }, 'info-6': { depth: 'working', beat: 'st-2' } };
  return d;
}
function freshScenarioRev() {
  const doc = normaliseScenario(SCN0);
  return { id: 'act-scenario', gens: [{ n: 4, doc, task: null, decisions: {}, changes: [] }], viewing: 0, pending: [], seq: 0,
    locks: { 'close:summary': { by: 'SME', verbatim: true } }, selected: null, working: null, approval: { gen: 4, on: 'Oct 10' },
    phase: 'interaction', reh: { step: 0, mode: 'read', turns: [], rolls: 0 } };
}

/* ── Elements of a scenario generation ─────────────────────────── */
function scnElements(gen) {
  const d = gen.doc, map = {};
  const put = (id, kind, label, where, phase, fields, ref, step) => { map[id] = { id, kind, label, where, phase, fields, ref, step, el: ref }; };
  put('narrative', 'narrative', 'Narrative', 'Framing', 'framing', { text: d.narrative }, d);
  put('opening:purpose', 'purpose', 'Opening · purpose', 'Framing', 'framing', { text: d.opening.purpose }, d.opening);
  d.opening.messages.forEach((m, i) => put('opening:' + m.id, 'message', `Opening message ${i + 1}`, 'Framing', 'framing', { text: m.text }, m));
  put('world:setting', 'setting', 'Setting', 'World', 'world', { text: d.world.setting }, d.world);
  d.world.canon.forEach((c, i) => put('canon:' + c.id, 'fact', `Canon fact ${i + 1}`, 'World', 'world', { text: c.fact, reveal: c.revealWhen || 'always' }, c));
  d.world.characters.forEach(ch => put(ch.id, 'character', ch.name, 'World · cast', 'world', { role: ch.role, behavior: ch.behavior }, ch));
  d.misconceptions.forEach((m, i) => put('mis:' + m.id, 'misconception', `Misconception ${i + 1}`, 'Coach', 'coach', { text: m.misconception, redirect: m.redirect }, m));
  d.toneGuidelines.forEach((t, i) => put('tone:' + t.id, 'tone', `Tone guideline ${i + 1}`, 'Coach', 'coach', { text: t.text }, t));
  put('coachPersona', 'persona', 'Coach persona', 'Coach', 'coach', { text: d.coachPersona }, d);
  d.steps.forEach((st, si) => {

/* ════════════════════════════════════════════════════════════════════
   PASS 8 — SPEC EDITS (G14, G15) AND THE COVERAGE TAB (G1)
   An activity's spec has two kinds of field. TREATMENT fields (audience,
   treatment, assistant goal, activity constraints) are "how": an edit queues
   a `spec` item into the activity's Pending and rides the next revision task;
   the spec value lands with the generation. POINTS are "what": a change to
   the activity's claims, so adding or removing one opens the G10 choice —
   analyse or refresh — scoped to this one activity.
   Attribution for a spec item is by SCOPE, not by element (G15): the
   adapter declares which element kinds × fields the field may move; a
   change outside that is drift (G6) like any other.
   ════════════════════════════════════════════════════════════════════ */
const SPEC_FIELDS = {
  audience:    { label: 'Audience', type: 'select', options: () => Object.keys(AUDIENCE_DRAFTS), help: 'An override of the brief’s audience — depiction only, never the points (G2).' },
  treatment:   { label: 'Treatment', type: 'select', options: () => ['Standard', 'Refresher-length', 'Microlearning-length'], help: 'Length and weight — an instruction, not a bar. The bar lives on the output’s format (G13).' },
  goal:        { label: 'Assistant goal', type: 'text', help: 'How this activity casts the project assistant (D28).' },
  constraints: { label: 'Activity constraints', type: 'list', help: 'Standing constraints for this activity only — walled off like the brief’s (D23).' }

const specValue = (r, k) => k === 'audience' ? (r.audience || B.saved.audience) : k === 'constraints' ? (r.constraints || []) : r[k];

const sameVal = (a, b) => JSON.stringify(a) === JSON.stringify(b);

function queueSpec(r, field, to) {
  const f = SPEC_FIELDS[field];
  if (!rowGen(r)) { applySpecToRow(r, { field, to }); return toast(`${f.label} set — generation 1 will follow the spec`); }
  const from = specValue(r, field), q = specQueueOf(r), ex = specItem(r, field);
  if (sameVal(from, to)) { if (ex) q.splice(q.indexOf(ex), 1); return toast(`${f.label} is back to its current value — nothing queued`); }
  let text;
  if (field === 'constraints') { const add = to.filter(x => !from.includes(x)), rem = from.filter(x => !to.includes(x)); text = `${f.label}: ${[...add.map(x => '+ ' + x), ...rem.map(x => '− ' + x)].join(' · ')}`; }
  else text = `${f.label}: ${from} → ${to}`;
  const item = { type: 'spec', field, from, to, text, label: `Spec · ${f.label}`, where: 'Activity spec' };
  if (ex) Object.assign(ex, item);
  else { const rv = REV[r.id]; item.n = rv ? ++rv.seq : (r.specSeq = (r.specSeq || 0) + 1); q.push(item); }

/* The spec value lands with the generation the task produces. */
function applySpecToRow(r, it) {

    else { r.audience = aud; r.overrides = [...new Set([...r.overrides, ...ctx])]; r.ovValues = { ...(r.ovValues || {}), audience: aud, ...AUDIENCE_DRAFTS[aud] }; }
  } else r[it.field] = Array.isArray(it.to) ? [...it.to] : it.to;

/* What a spec field does to the VIDEO's content. Scripted stand-ins for the
   engine; what matters is that each effect stays inside the field's scope

function videoSpecEffect(scenes, it) {
  if (it.field === 'treatment') {
    const short = it.to !== 'Standard';
    scenes.forEach(sc => sc.lines.forEach(l => {
      if (short) { if (typeof l.alt === 'string' && !l.long) { l.long = l.text; l.text = l.alt; l.alt = null; } }
      else if (l.long) { l.alt = l.text; l.text = l.long; l.long = null; }

    }));

  if (it.field === 'audience') {
    const eq = (AUDIENCE_DRAFTS[it.to] || {}).equipment || '', truck = findRaw(scenes, 'sc1-truck');
