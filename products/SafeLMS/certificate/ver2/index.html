<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Training Certificate — Child Abuse: Mandatory Reporting</title>
<style>
  /* ============================================================
     Vector Solutions — Child Abuse: Mandatory Reporting Certificate
     (Template #2). Default SafeLMS cert elements + the NY legal
     citation custom to this one course.
     Self-contained template. Swappable fields carry IDs
     (see the template map comment at the bottom of this file).
     Prints to a single US Letter landscape page.
     ============================================================ */

  /* Print setup: single landscape Letter page, edge-to-edge */
  @page { size: letter landscape; margin: 0; }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    color: #1a1a1a;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* On screen: gray backdrop so the "paper" reads as a page */
  @media screen {
    body {
      background: #6b6b6b;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px;
      min-height: 100vh;
    }
  }

  /* The certificate "paper" — fixed US Letter landscape */
  .page {
    position: relative;
    width: 11in;
    height: 8.5in;
    background: #ffffff;
    padding: 40px 48px;
    overflow: hidden;
  }

  @media screen { .page { box-shadow: 0 6px 28px rgba(0, 0, 0, 0.35); } }
  @media print {
    body { background: #ffffff; }
    .page { box-shadow: none; }
  }

  /* ---------- Header row ---------- */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  /* Sponsor/site seal (CSS stand-in; swap for real logo image) */
  #site-seal {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: #1e2a5e;
    box-shadow: 0 0 0 1.5px #ffffff inset, 0 0 0 3px #1e2a5e inset;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  #site-seal svg { display: block; }

  /* Vector Solutions wordmark (stand-in; swap for real logo) */
  #vector-logo { text-align: right; line-height: 1.05; flex: 0 0 auto; }
  #vector-logo .wordmark {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: #3a4a5a;
    font-size: 20px;
    letter-spacing: -0.2px;
  }
  #vector-logo .chevron { display: inline-block; line-height: 0; }
  #vector-logo .wordmark b { font-weight: 700; }
  #vector-logo .wordmark .sol { font-weight: 400; }
  #vector-logo .tagline { font-size: 8px; color: #7a7a7a; margin-top: 2px; letter-spacing: 0.2px; }

  /* ---------- Centered main text stack ---------- */
  /* Lighter cert: more top offset + generous gaps so the shorter
     stack sits balanced toward the vertical center of the page. */
  .main-stack {
    max-width: 760px;
    margin: 78px auto 0;
    text-align: center;
  }
  .main-stack > div { margin-bottom: 26px; }

  .line-cert-title { font-size: 17px; font-weight: 700; }
  #issuer-org      { font-size: 16px; font-weight: 700; }
  #recipient-name  { font-size: 16px; font-weight: 700; }
  .line-has-completed { font-size: 14px; font-weight: 400; }

  /* Course title + its NY legal citation form one tight group */
  .course-group { margin-bottom: 26px; }
  #course-title { font-size: 19px; font-weight: 700; line-height: 1.35; margin-bottom: 8px; }
  /* Custom element for this course only (NY Chapter 25 citation) */
  #legal-citation { font-size: 14px; font-weight: 700; font-style: italic; color: #2a2a2a; }

  #course-duration { font-size: 15px; font-weight: 700; }
  .line-on { font-size: 14px; font-weight: 400; }
  #completion-date { font-size: 16px; font-weight: 700; text-decoration: underline; }
</style>
</head>
<body>
  <div class="page">

    <!-- ===================== Header ===================== -->
    <div class="header">
      <!-- Sponsor/site seal placeholder — swap for real logo image -->
      <div id="site-seal" title="Sponsor/site seal (placeholder — swap for real logo)">
        <svg width="30" height="26" viewBox="0 0 22 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 6 L8 6 L11 13 L18 1 L21 1 L12 19 L8 19 Z" fill="#ffffff"/>
        </svg>
      </div>

      <!-- Vector Solutions logo placeholder — swap for real logo image -->
      <div id="vector-logo">
        <div class="wordmark">
          <span class="chevron" aria-hidden="true">
            <svg width="22" height="20" viewBox="0 0 22 20" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 6 L8 6 L11 13 L18 1 L21 1 L12 19 L8 19 Z" fill="#2ea3d6"/>
            </svg>
          </span>
          <span><b>Vector</b><span class="sol">Solutions</span></span>
        </div>
        <div class="tagline">Vector Training, K-12 Edition</div>
      </div>
    </div>

    <!-- ================= Centered main stack ================= -->
    <div class="main-stack">
      <div class="line-cert-title">Certificate of Training Completion</div>

      <div id="issuer-org">Vector Solutions Online University</div>

      <div id="recipient-name">Jane Sample</div>

      <div class="line-has-completed">has completed</div>

      <!-- Course title (CTLE activity title) + NY citation custom to this course -->
      <div class="course-group">
        <div id="course-title">Child Abuse: Mandatory Reporting</div>
        <div id="legal-citation">NY Chapter 25 of the Laws of 2024</div>
      </div>

      <!-- Duration in minutes (NY requires hours; minutes accepted for now — A-2) -->
      <div id="course-duration">a training program requiring 15 minutes</div>

      <div class="line-on">on</div>

      <!-- Completion date only (NY requires from–to; date-only accepted for now — A-3) -->
      <div id="completion-date">Friday, April 10, 2026</div>
    </div>

  </div>

  <!-- ============================================================
       TEMPLATE #2 MAP — Child Abuse: Mandatory Reporting (fields by id)
       ------------------------------------------------------------
       #recipient-name   text  -> learner full name
       #course-title     text  -> CTLE activity title (course name)
       #legal-citation   text  -> NY citation custom to this course
       #course-duration  text  -> "a training program requiring N minutes"
       #completion-date  text  -> completion date (e.g. "Friday, April 10, 2026")
       #issuer-org       text  -> issuing org / program line
       #site-seal        node  -> replace inner CSS mark with real <img> seal/logo
       #vector-logo      node  -> replace inner wordmark with real <img> logo

       This is the lighter cert: default elements + the one NY citation.
       It intentionally omits the SSN/DOB/Venue/Sponsor/signature/CTLE
       statement block that Template #1 (V1) carries.

       Example (uncomment / adapt in your merge step):
       <script>
         const data = {
           recipientName:  'Jane Sample',
           courseTitle:    'Child Abuse: Mandatory Reporting',
           legalCitation:  'NY Chapter 25 of the Laws of 2024',
           courseDuration: 'a training program requiring 15 minutes',
           completionDate: 'Friday, April 10, 2026',
         };
         document.getElementById('recipient-name').textContent  = data.recipientName;
         document.getElementById('course-title').textContent     = data.courseTitle;
         document.getElementById('legal-citation').textContent   = data.legalCitation;
         document.getElementById('course-duration').textContent  = data.courseDuration;
         document.getElementById('completion-date').textContent  = data.completionDate;
       </script>
       ============================================================ -->
</body>
</html>
