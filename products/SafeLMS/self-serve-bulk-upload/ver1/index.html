      case 'linkMap': e.preventDefault(); go('map'); scrollTop(); break;
      case 'linkSettings': e.preventDefault(); go('settings'); scrollTop(); break;
      case 'removeRecip': setState({ recipients: state.recipients.filter(function (_, j) { return j !== +arg; }) }); break;
      case 'addRecip': {
        var inp = document.getElementById('recipInput');
        var v = inp && inp.value.trim();
        if (v) setState({ recipients: state.recipients.concat([{ name: v.split('@')[0], role: v }]) });
        break;
      }
      case 'toggleFail': setState({ notifyFail: !state.notifyFail }); break;
      case 'toggleSuccess': setState({ notifySuccess: !state.notifySuccess }); break;
      case 'toggleHelp': e.preventDefault(); setState({ openHelp: state.openHelp === arg ? null : arg }); break;
      case 'closeHelp': e.preventDefault(); setState({ openHelp: null }); break;
      case 'toggleDisc': {
        var d = {}; for (var dk in state.disc) d[dk] = state.disc[dk];
        d[arg] = !d[arg]; setState({ disc: d });
        break;
      }
      case 'toggleVariants': setState({ variantsCollapsed: !state.variantsCollapsed }); break;
      case 'attnSend': e.preventDefault(); setState({ attnSent: true }); break;
      case 'setVariant': {
        var parts = arg.split(':'), key = parts[0], val = parts[1];
        var vs = {}; for (var k in state.variants) vs[k] = state.variants[k]; vs[key] = val;
        var patch = { variants: vs };
        if (key === 'startTab') patch.tab = val;
        if (key === 'uploadVariant') { patch.fileId = null; patch.step = 'upload'; patch.acks = {}; }
        setState(patch);
        break;
      }
    }
  });

  // Keyboard access for non-button clickables (e.g. completed stepper steps).
  $app.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act], [role="switch"][data-act]')) { e.preventDefault(); e.target.click(); }
  });

  $app.addEventListener('change', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'mapColTarget') {
      // Column-oriented: data-arg is the file column, el.value is the chosen target.
      // Keep the field->column model: unmap this column from any field, then assign.
      var col = el.getAttribute('data-arg'), tgt = el.value;
      var m = {}; for (var k in state.mapping) m[k] = state.mapping[k];
      for (var ff in m) { if (m[ff] === col) m[ff] = NOT_IMPORTED; }
      if (tgt !== NOT_IMPORTED) m[tgt] = col;
      setState({ mapping: m });
    } else if (act === 'ack') {
      var id = el.getAttribute('data-arg');
      var a = {}; for (var kk in state.acks) a[kk] = state.acks[kk];
      var key = ackKey(id); a[key] = !a[key];
      setState({ acks: a });
    }
  });

  /* --------------------------------------------- Design Toolbox flow-map host */
  function reviewFor(fileId, pu, pj) {
    setState({ tab: 'import', view: 'import', importFull: true, fileId: fileId, mapping: defaultMapping(fileId),
      purgeUsers: !!pu, purgeJobs: !!pj, repSent: false, acks: {}, step: 'review', validating: false });
  }

  function applyFlowState(id) {
    switch (id) {
      case 'employees': setState({ view: 'employees', addEmp: false, importFull: false }); break;
      case 'log': setState({ view: 'log', addEmp: false, importFull: false, logOpen: 0, logFilter: 'all' }); break;
      case 'intro':   // former Intro page, now merged into Upload
      case 'upload': setState({ tab: 'import', view: 'import', importFull: true, step: 'upload', fileId: null, validating: false }); break;
      case 'map': setState({ tab: 'import', view: 'import', importFull: true, fileId: 'saml', mapping: defaultMapping('saml'), purgeUsers: false, purgeJobs: false, acks: {}, step: 'map', validating: false }); break;
      case 'settings': setState({ tab: 'import', view: 'import', importFull: true, fileId: 'confirm', mapping: defaultMapping('confirm'), purgeUsers: false, purgeJobs: false, repSent: false, acks: {}, step: 'settings', validating: false }); break;
      /* Manual import — one node per severity path */
      case 'review-info':     reviewFor('clean', false, false); break;  // INFO only — runs freely
      case 'review-confirm':  reviewFor('confirm', true, true); break;  // CONFIRM ×3 (+ info) — name change, deactivations, job removals
      case 'review-blocked':  reviewFor('blast', false, false); break;  // BLOCKED — blast radius
      case 'review-saml':     reviewFor('saml', false, false); break;   // BLOCKED — SAML mismatch
      case 'review-escalate': reviewFor('dupes', false, false); break;  // BLOCKED ×2 + CONTACT VECTOR
      case 'done': setState({ tab: 'import', view: 'import', importFull: true, fileId: 'confirm', doneCounts: summaryFor('confirm', false, false), step: 'done', validating: false }); break;
      /* Attention-needed step (V1 treatment = inline alert mode) */
      case 'attn-fixable':  setState({ tab: 'import', view: 'import', importFull: true, step: 'attn', attnSev: 'fixable', attnSent: false }); break;   // AMBER — you fix it
      case 'attn-escalate': setState({ tab: 'import', view: 'import', importFull: true, step: 'attn', attnSev: 'escalate', attnSent: false }); break; // RED — Vector's team
      default: break;
    }
    scrollTop();
  }
  window.applyFlowState = applyFlowState;

  function bootFromHash() {
    var m = (location.hash || '').match(/fm=([\w-]+)/);
    if (m) { try { applyFlowState(decodeURIComponent(m[1])); } catch (e) {} }
  }
  window.addEventListener('hashchange', bootFromHash);

  window.TOOLBOX_CONFIG = {
    flowMap: {
      title: 'Bulk User Import · V1 (Employees tab · split buttons) — Flow Map',
      applyState: 'applyFlowState',
      canvas: { w: 1680, h: 830 },
      flows: [
        { id: 'import', name: 'Manual import — severity paths', pill: 'A', color: '#c9d9f0',
          lane: { x: 20, y: 20, w: 1640, h: 790 }, labelXY: { x: 40, y: 46 } }
      ],
      nodes: [
        /* ── Manual import: wizard on the left, then one branch per severity ──
           Row 1 (y60): Info → Confirm → Done.  Row 2 (y420): the three stops. ── */
        { id: 'employees', flow: 'import', entry: true, x: 40, y: 250, step: 'Entry', name: 'Employees tab — split buttons', state: 'employees',
          desc: 'Bulk import now lives under the Employees tab. ver1 entry point = split buttons: a secondary “Add Single Employee” (opens the Add employee modal) beside a primary “Bulk Upload”. Clicking Bulk Upload takes the import FULL-SCREEN and lands on the Upload-file step (Manual-import banner + stepper + “Start from the SafeLMS template” card + drop zone). From there the drop zone / “browse” opens the file picker; picking a file continues to Map columns / Import settings.' },
        { id: 'upload', flow: 'import', x: 250, y: 250, step: 'Step 1', name: 'Upload file', state: 'upload',
          desc: 'Stepper, then the “Start with the SafeLMS template” card (Download button + template guide), the drop zone, and a Help Center line (best practices, common errors, how to get automated sync). ← Back returns to Employees. After Cancel import, lands here with an “Import cancelled” note. Nothing imports until reviewed.' },
        { id: 'map', flow: 'import', x: 500, y: 120, step: 'Step 2', name: 'Map columns', state: 'map',
          desc: 'Match your file columns to SafeLMS fields (skipped in the Template variant).' },
        { id: 'settings', flow: 'import', x: 500, y: 410, step: 'Step 3', name: 'Import settings', state: 'settings',
          desc: 'One off-by-default switch — “Deactivate anyone and any jobs not in this file” — with a live On/Off description directly under it. Before → after totals (active users, active jobs, updates) sit in a side panel like Review’s Change summary. Users-only or jobs-only deactivation isn’t self-serve: a banner routes to Vector Care via the Support Center.' },

        { id: 'review-info', flow: 'import', x: 700, y: 60, step: 'Review · Info', name: 'Info only — runs freely', state: 'review-info',
          desc: 'INFO tier only (e.g. 3 emails updated, new users created). Nothing to acknowledge — Run import is enabled immediately.' },
        { id: 'review-confirm', flow: 'import', x: 1030, y: 60, step: 'Review · Confirm', name: 'Confirm — acknowledge & run', state: 'review-confirm',
          desc: 'duplicate_user_in_system (name change, e.g. Jessyca → Jesse) + info; with the setting on, deactivation and job-ending lists (not in the catalog yet). Every WARNING is acknowledged before Run import unlocks. Review opens with “Your choices” (mapping + setting, each with Edit).' },
        { id: 'log', flow: 'import', x: 1360, y: 250, step: 'Log', name: 'Upload log', state: 'log',
          desc: 'Every upload on the site: when, file, who ran it, Manual vs Automated, result (Completed / Blocked / Cancelled / Failed) and what changed. Filter by method; rows expand for the setting used, alerts, and downloads. Reached from Employees → Upload log and the Import complete screen.' },
        { id: 'done', flow: 'import', x: 1360, y: 60, step: 'Done', name: 'Import complete', state: 'done',
          desc: 'Reached from the Info and Confirm paths. Irreversible once run — the design leans on prevention, not undo.' },

        { id: 'review-blocked', flow: 'import', x: 700, y: 420, step: 'Review · Copy review', name: 'Every catalog message', state: 'review-blocked',
          desc: 'Copy review: the last sample file raises all 44 messages from the Error & Notification Message Catalog (PMC 29424549907) in catalog order, each tagged with its key, so the copy and tiers can be checked against Confluence.' },
        { id: 'review-saml', flow: 'import', x: 1030, y: 420, step: 'Review · Blocking', name: 'Blocking — unreadable dates', state: 'review-saml',
          desc: 'broken_begin_date (BLOCKING, Where = Column H (BEGIN_DATE) · rows 14, 27, 88) + early_end_date (WARNING) + info.' },
        { id: 'review-escalate', flow: 'import', x: 1360, y: 420, step: 'Review · Blocking', name: 'Blocking — duplicate accounts', state: 'review-escalate',
          desc: 'duplicate_person (BLOCKING → Contact Vector support) + potential_duplicate_user (WARNING, each row shown as the duplicate account it would create) + duplicate_email_in_upload (WARNING).' },

        { id: 'attn-fixable', flow: 'import', x: 700, y: 620, step: 'Attention · amber', name: 'Alert mode — you fix it', state: 'attn-fixable',
          desc: 'V1 attention treatment = inline ALERT MODE, AMBER: a distinct colored card (not red) for a problem the customer fixes themselves — plain-language cause, A→B, “Fix it & upload again.”' },
        { id: 'attn-escalate', flow: 'import', x: 1030, y: 620, step: 'Attention · red', name: 'Alert mode — Vector’s team', state: 'attn-escalate',
          desc: 'Same alert mode in RED: reserved for a blocker only Vector can resolve (two site accounts share an email). “Send to Vector — we’ll take it from here” → CARE ref.' }
      ],
      edges: [
        ['employees', 'upload'],
        ['upload', 'map'], ['upload', 'settings'], ['map', 'settings'],
        ['settings', 'review-info'], ['settings', 'review-confirm'], ['settings', 'review-blocked'],
        ['settings', 'review-saml'], ['settings', 'review-escalate'],
        ['review-info', 'done'], ['review-confirm', 'done'], ['done', 'log'], ['employees', 'log']
      ]
    }
  };

  render();
  bootFromHash();
})();
</script>
