    var cols = COLS[state.fileId];
    // AC-1.2: one row per COLUMN IN THE CUSTOMER'S FILE; each column picks a target.
    /* "Import as" dropdown (2026-10-01): matches the live SafeLMS filter selector — a bordered
       button (blue ring while open) and a menu of radio rows; the selected row gets a filled
       blue check + light-blue highlight. Required fields carry a red * (now possible, unlike
       a native <select>). One menu open at a time: state.mapOpen = the file column. */
    function ddLabel(v) {
      var f = FIELDS.find(function (x) { return x.field === v; });
      return esc(v) + (f && f.req ? '<span class="dd-req" aria-hidden="true"> *</span>' : '');
    }
    function targetDD(colName, sel) {
      var open = state.mapOpen === colName;
      function opt(v) {
        var on = sel === v;
        return '<button type="button" class="dd-opt' + (on ? ' is-sel' : '') + '" role="option" aria-selected="' + on + '" data-act="ddPick" data-arg="' + esc(colName) + '" data-val="' + esc(v) + '">'
          + '<span class="dd-radio" aria-hidden="true">' + (on ? '<i class="fa-solid fa-check"></i>' : '') + '</span><span>' + ddLabel(v) + '</span></button>';
      }
      var menu = !open ? '' : '<div class="dd-menu" role="listbox" aria-label="Import ' + esc(colName) + ' as">'
        + opt(NOT_IMPORTED)
        + '<div class="dd-group">Standard fields</div>' + FIELDS.map(function (f) { return opt(f.field); }).join('')
        + '<div class="dd-group">Your site’s attributes</div>' + ATTRIBUTES.map(opt).join('')
        + '</div>';
      return '<div class="dd">'
        + '<button type="button" class="dd-trigger' + (open ? ' is-open' : '') + (sel === NOT_IMPORTED ? ' is-empty' : '') + '" data-act="ddToggle" data-arg="' + esc(colName) + '" aria-haspopup="listbox" aria-expanded="' + open + '">'
        + '<span class="dd-val">' + ddLabel(sel) + '</span><i class="fa-regular fa-chevron-down dd-chev" aria-hidden="true"></i></button>'
        + menu + '</div>';
    }
    var rows = cols.map(function (c) {
      var colName = c[0], sample = c[1];
      var target = fieldForCol(colName);
      var isUser = target === 'Username';
      return '<div class="map-grid map-row">'
        // Required fields show * inside the selector; the Username lock note sits under the selector and
        // follows whichever column is currently imported as Username (2026-10-01).
        + '<div><div class="mono" style="font-size:13px;font-weight:600;color:#1B2B3E;">'
        + esc(colName) + '</div>'
        + '</div>'
        + '<div class="mono" style="font-size:12.5px;color:#5B6B7E;">' + esc(sample) + '</div>'
        + '<div>' + targetDD(colName, target)
        + (isUser ? '<div class="map-hint"><i class="fa-solid fa-lock map-lock" aria-hidden="true"></i>An upload can add new usernames but can’t change an existing one.</div>' : '')
        + '</div>'
        + '</div>';
    }).join('');
    // Required targets (Username, First, Last) must each be claimed by some column.
    var reqMissing = FIELDS.filter(function (f) { return f.req; }).filter(function (f) {
      return !state.mapping[f.field] || state.mapping[f.field] === NOT_IMPORTED;
    });
    var complete = reqMissing.length === 0;
    var missHint = complete ? ''
      : '<div style="font-size:12.5px;color:#B54708;background:#FFFAEB;border:1px solid #F2D69B;border-radius:8px;padding:9px 12px;margin-top:14px;"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i> Still needed: point a column at ' + reqMissing.map(function (f) { return '<b>' + esc(f.field) + '</b>'; }).join(', ') + '. Username, first name and last name are required.</div>';
    return '<div class="fadeup"><div class="card" style="overflow:visible;">'   // visible so the dropdown menu isn't clipped
      + '<div style="padding:16px 20px;border-bottom:1px solid #EDF1F6;display:flex;justify-content:space-between;align-items:center;gap:16px;">'
      + '<div><div style="font-size:15px;font-weight:600;">Match your columns to SafeLMS fields</div>'
      + '<div style="font-size:13px;color:#5B6B7E;margin-top:3px;">We matched what we could. Change any that are wrong, or set them to “' + esc(NOT_IMPORTED) + '.”</div></div>'
      + '<div style="font-size:12px;color:#5B6B7E;background:#F0F4F9;border-radius:6px;padding:5px 10px;white-space:nowrap;">' + file.rows + ' rows detected</div></div>'
      + '<div class="map-grid map-head"><div>Column in your file</div><div>Sample from your file</div><div>Import as (SafeLMS field)</div></div>'
      + rows + '</div>'
      + missHint
      + '<div style="display:flex;justify-content:space-between;margin-top:18px;">'
      + '<button class="btn btn--ghost" data-act="back">← Back</button>'
      + '<button class="btn ' + (complete ? 'btn--primary' : 'btn--disabled') + '" data-act="next"' + (complete ? '' : ' disabled') + '>Continue to import settings →</button>'
      + '</div></div>';
  }

  /* Import settings — ONE all-or-nothing switch (users + jobs together). Off =
     add/update only; On = make the file the complete roster. purgeUsers /
     purgeJobs stay in lock-step so the review step keeps working.
     Layout (2026-09-25) mirrors Review: the choice on the left, the before → after
     totals in a 290px sticky side panel on the right. */
  function settingsSideHTML(on) {
    var sm = summaryFor(state.fileId, on, on);
    var uAfter = TOTAL + sm.add - sm.deact, jAfter = JOBS_TOTAL + sm.jobsAdded - sm.jobsRemoved;
    function tot(label, before, after, note) {
      return '<div class="set-tot"><div class="kpi-row"><span class="k">' + label + '</span>'
        + '<span class="v">' + before + ' <i class="fa-solid fa-arrow-right" aria-hidden="true"></i> ' + after + '</span></div>'
        + '<div class="set-tot-note">' + note + '</div></div>';
    }
    return '<div style="background:#fff;border:1px solid #E1E7EE;border-radius:10px;padding:18px 20px;">'
      + '<div class="kpi-eyebrow">After this import</div>'
      + '<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px;">'
      // Green = added, red = deactivated / ended (same colors as Review's Change summary).
      + tot('Active users', TOTAL, uAfter, '<span class="ba-add">+' + sm.add + ' new</span>' + (on && sm.deact ? ' · <span class="ba-rem">−' + sm.deact + ' deactivated</span>' : ''))
      + tot('Active positions', JOBS_TOTAL, jAfter, '<span class="ba-add">+' + sm.jobsAdded + ' new</span>' + (on && sm.jobsRemoved ? ' · <span class="ba-rem">−' + sm.jobsRemoved + ' ended</span>' : ''))
      + '</div><div class="divider" style="margin:14px 0;"></div>'
      + '<div class="kpi-row"><span class="k">Existing users updated</span><span class="v" style="color:#1257B8;">' + sm.mod + '</span></div>'
      + '<div style="font-size:12px;color:#8CA0B4;margin-top:12px;line-height:1.5;">Totals update as you flip the switch. You’ll see every change, person by person, on the next step.</div>'
      + '</div>';
  }

  function settingsHTML() {
    var on = state.purgeUsers && state.purgeJobs;

    // "Not sure?" is the pencil banner (2026-09-25); it flips to a confirmation once sent.
    var repBanner = state.repSent
      ? '<div class="care-banner is-sent">'
        + '<span class="cb-ico"><i class="fa-solid fa-circle-check" aria-hidden="true"></i></span>'
        + '<div class="cb-tx"><b>Sent to your Vector rep.</b> They’ll follow up by email to help you choose — nothing runs in the meantime.</div></div>'
      : '<div class="care-banner">'
        + '<span class="cb-ico"><i class="fa-solid fa-user-headset" aria-hidden="true"></i></span>'
        + '<div class="cb-tx"><b>Not sure which to choose?</b> Send this file to your Vector rep and they’ll help you decide.</div>'
        + '<button class="btn sm btn--outline-blue" data-act="askRep">Send to my Vector rep</button>'
        + '</div>';

    // The switch lives INSIDE the On/Off box and the whole box is the switch, so the
    // touch target is the full box (2026-09-29). The text under it follows its state.
    // Copy updated 2026-09-29. No "This file will deactivate N people…" count line here:
    // those counts can't be calculated at this step (see DEV-NOTES) — Review shows them.
    var effectText = on
      ? '<i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i><span><b>On:</b> Your site will match this file.'
        + '<ul><li>People not in the file are deactivated</li>'
        + '<li>Positions and locations not in the file are ended for the people who hold them</li>'
        + '<li>Training history is kept</li></ul></span>'
      : '<i class="fa-solid fa-circle-info" aria-hidden="true"></i><span><b>Off:</b> '
        + 'Adds and updates only. People and positions already on your site are left as they are.</span>';
    var optCard = '<div class="opt-effect opt-switchbox ' + (on ? 'is-on' : 'is-off') + '" data-act="togglePurgeAll" role="switch" aria-checked="' + on + '" tabindex="0" aria-labelledby="purge-lbl">'
      + '<div class="osb-head">'
      + '<div class="toggle" aria-hidden="true" style="flex:0 0 34px;background:' + (on ? '#D92D20' : '#C6D3E1') + ';">'
      + '<div class="toggle-knob" style="left:' + (on ? '17px' : '2px') + ';"></div></div>'
      + '<div class="opt-title" id="purge-lbl">Deactivate all people and positions not in this file</div></div>'
      + '<div class="osb-body">' + effectText + '</div></div>';
    var effect = '';

    // Users-only or positions-only deactivation isn't self-serve — plain helper text + Support Center.
    var care = '<div class="set-helper">This applies to both people and positions. To deactivate only one, contact Vector Care in the '
      + helpLink('support', 'Support Center') + '.</div>';

    return '<div class="fadeup"><div style="display:flex;gap:20px;align-items:flex-start;">'
      + '<div style="flex:1;min-width:0;">'   // full width now that the totals panel is gone
      // Header in the same shape as Map columns: what this step decides + one helpful line.
      + '<div style="font-size:15px;font-weight:600;">Choose how this file updates your site</div>'
      + '<div style="font-size:13px;color:#5B6B7E;margin:3px 0 14px;">By default this file only adds and updates people and positions. Turn this on only if the file is your complete list of staff and the positions they hold.</div>'
      + optCard + effect + care
      + '<div style="display:flex;justify-content:space-between;margin-top:22px;">'
      + '<button class="btn btn--ghost" data-act="back">← Back</button>'
      + '<button class="btn btn--primary" data-act="next">Review changes →</button>'
      + '</div></div>'
      // No "After this import" totals panel (2026-09-29): the counts can't be computed at this step.
      + '</div></div>';
  }

  /* Side-by-side "Now in SafeLMS → After you <accept/import/sync>" per changed row.
     Shows the current record, the resulting record, and (as a caption) what the
     file actually provides — so the consequence of accepting is concrete, and
     deactivations read as a loss (red). */
  function beforeAfter(diff, afterLabel, more) {
    var rows = diff.map(function (d) {
      var deact = /Deactivat/i.test(d.result);
      var head = (d.row && d.row !== '—') ? ('Row ' + d.row + ' · ' + d.field) : d.field;
      var sub = deact
        ? 'Missing from this file → loses access immediately · training history kept'
        : (d.incoming && d.incoming !== d.result ? 'From your file: ' + d.incoming : '');
      return '<div class="ba-row">'
        + '<div class="ba-head">' + esc(head) + '</div>'
        + '<div class="ba-grid">'
          + '<div class="ba-card ba-before"><div class="ba-label">Now in SafeLMS</div>'
          + '<div class="ba-val mono">' + esc(d.current) + '</div></div>'
          + '<div class="ba-arrow">→</div>'
          + '<div class="ba-card ba-after' + (deact ? ' is-loss' : '') + '">'
          + '<div class="ba-label">' + esc(afterLabel) + '</div>'
          + '<div class="ba-val mono' + (deact ? ' is-loss-text' : '') + '">' + esc(d.result) + '</div>'
          + (sub ? '<div class="ba-sub' + (deact ? ' is-loss-sub' : '') + '">' + esc(sub) + '</div>' : '')
          + '</div>'
        + '</div></div>';
    }).join('');
    return '<div class="ba">' + rows + (more ? '<div class="ba-more">' + esc(more) + '</div>' : '') + '</div>';
  }

  /* --- Review-alert detail helpers: before→after cards + a scannable table --- */
  function axArrow() { return '<i class="fa-solid fa-arrow-right-long" aria-hidden="true"></i>'; }

  // Two big cards with a large arrow between — a clear "from → to".
  function axBaCard(aLabel, aVal, bLabel, bVal) {
    return '<div class="ax-ba">'
      + '<div class="ax-ba-card ax-from"><div class="ax-ba-l">' + esc(aLabel) + '</div><div class="ax-ba-v">' + esc(aVal) + '</div></div>'
      + '<div class="ax-ba-arrow">' + axArrow() + '</div>'
      + '<div class="ax-ba-card ax-to"><div class="ax-ba-l">' + esc(bLabel) + '</div><div class="ax-ba-v">' + esc(bVal) + '</div></div>'
      + '</div>';
  }

  /* The FULL change list for an alert — every affected person/row, with a count
     and a CSV download; scrolls inside the box for long sets. Cells are strings or
     { v, c } where c = row | bad | lock | loss | to | from (see .axt-* styles). */
  function axList(L) {
    var th = L.head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('');
    var body = L.rows.map(function (r) {
      return '<tr>' + r.map(function (c, j) {
        var o = (c && typeof c === 'object') ? c : { v: c };
        var cls = o.c ? 'axt-' + o.c : (j === 0 ? 'axt-k' : '');
        return '<td' + (cls ? ' class="' + cls + '"' : '') + '>'
          + (o.lock ? '<i class="fa-solid fa-lock" aria-hidden="true" title="Can’t be changed by an upload"></i>' : '')
          + esc(o.v) + '</td>';
      }).join('') + '</tr>';
    }).join('');
    var n = L.rows.length;
    // No count label here — the drawer button already says "Hide N rows".
    return '<div class="axt-wrap' + (n > 8 ? ' is-long' : '') + '"><table class="axt"><thead><tr>' + th + '</tr></thead>'
      + '<tbody>' + body + '</tbody></table></div>';
  }

  /* One review alert: a short banner (chip + title) that opens with "View details".
     Details (2026-10-09): the catalog's second sentence, then "What's happening" and
     "What will happen" (+ "What to do" when Blocked), then the rows exactly as they are in
     the file. Click a row to see it after the import — one line under that row; clicking
     another row moves the line there (state.axOpen = "alertId|rowIndex", one at a time).
     logRun = the upload log's view of a failed automated run: no checkbox, no after-lines,
     and the warning's "How to fix it" (what to change in the file) instead. */
  // A WARNING that's been acknowledged turns blue "Reviewed" — done, but not a green "success".
  var REVIEWED = { chip: 'Reviewed', icon: 'fa-circle-check', chipBg: '#1257B8', border: '#C6D9F0', headBg: '#F5F9FE', titleColor: '#1B2B3E' };
  function cellHTML(c, j) {
    var o = (c && typeof c === 'object') ? c : { v: c };
    var cls = o.c ? 'axt-' + o.c : (j === 0 ? 'axt-k' : '');
    return '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(o.v) + '</td>';
  }
  /* Only rows where a value actually CHANGES are clickable (2026-10-09). Informational rows —
     new accounts, skipped / blocked rows, dates saved as-is — have no before and after, so they
     aren't. The selected row's change shows in its own section BELOW the "Rows from your file"
     box, styled like the rows above, columns lined up so the admin compares by eye:
       "After import" — just that row's line after the change (the box above is the before). */
  function plainV(c) { return (c && typeof c === 'object') ? c.v : c; }
  function hasChange(af) { for (var k in (af && af.set) || {}) { if (af.set[k].was) return true; } return false; }
  function afterSectionHTML(L, i) {
    // "After import" box (2026-10-09): just the selected row's line after the change — same
    // columns as "Rows from your file" (the before), no extra rows.
    var r = L.rows[i], af = L.afters[i], cells = cellHTML(r[0], 0);
    for (var j = 1; j < r.length; j++) {
      var o = (r[j] && typeof r[j] === 'object') ? r[j] : { v: r[j] }, ch = af.set[j];
      cells += '<td' + (o.c === 'row' ? ' class="axt-row"' : '') + '>' + esc(ch ? ch.v : o.v) + '</td>';
    }
    return '<div class="ax-after">'
      + '<div class="ax-note"><b>After import</b></div>'
      + '<div class="axt-wrap"><table class="axt"><thead><tr>' + L.head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('')
      + '<th></th></tr></thead><tbody><tr>' + cells + '<td></td></tr></tbody></table></div></div>';
  }

  /* The details line (2026-10-09), one copy everywhere: why it matters, then what happens
     ("If you import, …") or how to fix it (blocked), then "To fix it, …" on warnings. */
  function detailsLine(a) {
    var hard = a.tier === 'blocked' || a.tier === 'escalate';
    return (a.why || a.will || a.fix) ? [a.why, hard ? a.fix : a.will, hard ? '' : a.clean].filter(Boolean).join(' ') : (a.sub || '');
  }

  function alertHTML(a, logRun) {
    var acked = !logRun && !!state.acks[ackKey(a.id)];
    var t = (a.tier === 'confirm' && acked) ? REVIEWED : TIER[a.tier];
    var open = !!state.disc['ax:' + a.id];
    var copyReview = !logRun && state.fileId === 'blast';
    var hard = a.tier === 'blocked' || a.tier === 'escalate';

    /* The line under the title (2026-10-09): what the warning is about, then how it changes
       things — plain sentences in place of the catalog's short second line ("Expand to see
       which."), not a separate box. On the upload log, the second part is how to fix the file. */
    var body = '';
    var line = detailsLine(a);   // same copy on Review, the failed-upload page and in the CSV
    if (line) body += '<div class="alert-sub">' + esc(line) + '</div>';
    if (a.list) {
      var L = a.list, sel = -1, clickRows = [];
      var th = L.head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '<th></th>';
      var tb = L.rows.map(function (r, i) {
        var clickable = !logRun && !!L.afters && hasChange(L.afters[i]);
        var rid = a.id + '|' + i, isSel = clickable && state.axOpen === rid;
        if (clickable) clickRows.push(plainV(r[0]));
        if (isSel) sel = i;
        // Cue (2026-10-09): a clickable row's number is blue + underlined like a link — no button.
        return '<tr' + (clickable ? ' class="axr' + (isSel ? ' is-open' : '') + '" data-act="axRow" data-arg="' + rid + '" role="button" tabindex="0" aria-pressed="' + isSel + '"' : '') + '>'
          + r.map(function (c, j) { return j === 0 && clickable ? '<td class="axt-row axr-link">' + esc(plainV(c)) + '</td>' : cellHTML(c, j); }).join('')
          + '<td></td></tr>';
      }).join('');
      // The hint names the rows to click: "Click Row 23 or Row 118 to see the change."
      var hint = !clickRows.length ? ''
        : clickRows.length > 3 ? 'Click a blue row number to see the change.'
        : 'Click ' + (clickRows.length === 1 ? clickRows[0] : clickRows.slice(0, -1).join(', ') + ' or ' + clickRows[clickRows.length - 1]) + ' to see the change.';
      body += '<div class="ax-list">'
        + '<div class="ax-note"><b>From your file</b>' + (hint ? '<span class="ax-hint">' + esc(hint) + '</span>' : '') + '</div>'
        + '<div class="axt-wrap' + (L.rows.length > 8 ? ' is-long' : '') + '"><table class="axt"><thead><tr>' + th + '</tr></thead><tbody>' + tb + '</tbody></table></div>'
        // Over 20: the table stops at 20 and the CSV has the rest (2026-10-09).
        + (L.total > L.rows.length ? '<div class="ax-more"><i class="fa-solid fa-file-csv" aria-hidden="true"></i><span>Showing the first ' + L.rows.length + ' rows. '
          + (logRun ? 'Download the file to see all of them.' : 'To see all of them, <button class="ax-more-link" data-act="dlCsv">download the CSV</button>.') + '</span></div>' : '')
        + '</div>'
        + (sel >= 0 ? afterSectionHTML(L, sel) : '');
    }
    // No "What to do" box (removed 2026-10-09) — the line above the rows covers it; the CSV still lists it.
    // Blocked: questions go to an issue ticket in the Support Center (the "Submit a ticket" button was removed 2026-09-30).
    if (hard) body += '<div class="ax-ask">Have a question about this? <a href="' + HELP_LINKS.support + '" target="_blank" rel="noopener">Raise an issue ticket</a>.</div>';

    /* A Warning's "I've reviewed this" sits top right so it can be confirmed without opening
       it; View details is the second row, under the title (2026-10-01). */
    var ack = (a.tier === 'confirm' && !logRun)
      ? '<label class="ack-row ack-inline' + (acked ? ' is-acked' : '') + '">'
        + '<input type="checkbox" data-act="ack" data-arg="' + a.id + '"' + (acked ? ' checked' : '') + '>'
        + '<span>I’ve reviewed this</span></label>' : '';
    var toggle = body
      ? '<button class="ax-toggle" data-act="toggleDisc" data-arg="ax:' + a.id + '" aria-expanded="' + open + '">'
        + (open ? 'Hide details' : 'View details') + ' <i class="fa-solid fa-chevron-down" aria-hidden="true"></i></button>' : '';
    // Visual cue (2026-10-09): this alert has rows you can click to see how they change.
    var nChg = (!logRun && a.list && a.list.afters) ? a.list.afters.filter(hasChange).length : 0;
    if (nChg && !open) toggle += '<button class="ax-chg-tag" data-act="toggleDisc" data-arg="ax:' + a.id + '">'
      + '<i class="fa-solid fa-arrow-right-arrow-left" aria-hidden="true"></i>' + nChg + (nChg === 1 ? ' change' : ' changes') + ' to compare</button>';
    return '<div class="alert' + (open ? ' is-open' : '') + '" style="border-color:' + t.border + ';">'
      + '<div class="alert-head" style="background:' + t.headBg + ';">'
      + '<div style="flex:1;min-width:0;">'
      + '<div class="chip ax-eyebrow" style="background:' + t.chipBg + ';"><i class="fa-solid ' + t.icon + '" aria-hidden="true"></i>' + t.chip + '</div>'   // eyebrow (2026-10-01)
      + '<div class="alert-title" style="color:' + t.titleColor + ';">' + esc(a.title) + '</div>'
      // PROTOTYPE ONLY — the catalog key, shown only on the copy-review sample file so copy can be
      // checked against Confluence. Not part of the product: don't build it.
      + (copyReview ? '<div class="alert-key"><span class="ak-proto"><i class="fa-solid fa-flask" aria-hidden="true"></i>Prototype only</span>Catalog key: <code>' + esc(a.key) + '</code></div>' : '')
      + (toggle ? '<div class="ax-line2">' + toggle + '</div>' : '')
      + '</div>'
      + ack   // top right (2026-10-01)
      + '</div>'
      + (open && body ? '<div class="alert-body">' + body + '</div>' : '')
      + '</div>';
  }

  /* "Your choices" — what they picked on Map columns + Import settings, each with
     Edit, shown above the alerts on Review (2026-09-25). */
  function choicesHTML() {
    var on = state.purgeUsers && state.purgeJobs, cols = COLS[state.fileId] || [];
    var mapped = cols.filter(function (c) { return fieldForCol(c[0]) !== NOT_IMPORTED; });
    var skipped = cols.length - mapped.length;
    var mapCard = !isMap() ? '' : '<div class="choice">'
      + '<div class="choice-h"><span>Column mapping</span><button class="choice-edit" data-act="linkMap"><i class="fa-solid fa-pen" aria-hidden="true"></i> Edit</button></div>'
      + '<div class="choice-map">' + mapped.map(function (c) {
          return '<div class="cm-row"><span class="mono">' + esc(c[0]) + '</span><i class="fa-solid fa-arrow-right" aria-hidden="true"></i><b>' + esc(fieldForCol(c[0])) + '</b></div>';
        }).join('') + '</div>'
      + (skipped ? '<div class="choice-note">' + skipped + ' column' + (skipped === 1 ? '' : 's') + ' not imported</div>' : '')
      + '</div>';
    var setCard = '<div class="choice">'
      + '<div class="choice-h"><span>Import settings</span><button class="choice-edit" data-act="linkSettings"><i class="fa-solid fa-pen" aria-hidden="true"></i> Edit</button></div>'
      + '<div class="choice-set"><span class="log-pill ' + (on ? 'lp-blocked' : 'lp-manual') + '">' + (on ? 'On' : 'Off') + '</span> Deactivate all people and positions not in this file</div>'
      + '<div class="choice-note">' + (on ? 'Anyone and any position not in the file is deactivated / ended.' : 'Only adds and updates — no one is deactivated.') + '</div>'
      + '</div>';
    return '<div class="choices">' + mapCard + setCard + '</div>';
  }

  function reviewHTML() {
    var file = FILES.find(function (f) { return f.id === state.fileId; });
    if (state.validating) {
      return '<div class="fadeup"><div class="card" style="padding:48px 20px;text-align:center;">'
        + '<div class="spinner"></div>'
        + '<div style="font-size:14.5px;font-weight:600;">Checking this file against your site…</div>'
        + '<div style="font-size:13px;color:#5B6B7E;margin-top:4px;">Comparing ' + file.rows + ' rows to ' + TOTAL + ' existing users, your sign-on settings, and site configuration. Nothing has been changed yet.</div>'
        + '</div></div>';
    }
    var raw = buildAlerts();
    var alertsHtml = raw.length
      ? raw.map(function (a) { return alertHTML(a); }).join('')
      : '<div style="background:#ECFDF3;border:1px solid #A6E5C3;border-radius:10px;padding:16px 18px;font-size:13.5px;color:#067647;"><span style="font-weight:600;">No issues found.</span> Every row checks out against your site and your sign-on settings.</div>';

    // Blocked and escalate ('contact Vector') both hard-stop the import.
    var blocked = raw.filter(function (a) { return a.tier === 'blocked' || a.tier === 'escalate'; });
    var confirms = raw.filter(function (a) { return a.tier === 'confirm'; });
    var acked = confirms.filter(function (a) { return state.acks[ackKey(a.id)]; });
    var canSubmit = !state.validating && blocked.length === 0 && acked.length === confirms.length;
    var sum = summary();

    var side = '<div style="background:#fff;border:1px solid #E1E7EE;border-radius:10px;padding:18px 20px;">'
      // One CSV for everything (2026-09-30) — replaces per-alert downloads; opens a preview.
      + '<div class="side-csv"><div class="sc-t">The full list of what we found</div>'
      + '<div class="sc-s">Download the file to see every issue, the row and person it affects, and what to fix before you import.</div>'
      + '<button class="btn sm btn--outline-blue" data-act="dlCsv" style="width:100%;margin-top:10px;"><i class="fa-solid fa-file-csv" aria-hidden="true"></i> Download CSV</button></div>'
      + '<div class="divider" style="margin:16px 0;"></div>'
      + '<div class="kpi-eyebrow">Change summary</div>'
      + '<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px;">'
      + '<div class="kpi-row"><span class="k">New users added</span><span class="v" style="color:#067647;">' + sum.add + '</span></div>'
      + '<div class="kpi-row"><span class="k">Existing users updated</span><span class="v" style="color:#1257B8;">' + sum.mod + '</span></div>'
      + '<div class="kpi-row"><span class="k">Users deactivated</span><span class="v" style="color:' + (sum.deact > 0 ? '#B42318' : '#8CA0B4') + ';">' + sum.deact + '</span></div>'
      // Jobs only when roster mode actually ends some (keeps the default summary to 3 lines).
      + (sum.jobsRemoved > 0 ? '<div class="kpi-row"><span class="k">Positions ended</span><span class="v" style="color:#B42318;">' + sum.jobsRemoved + '</span></div>' : '')
      + '</div><div class="divider" style="margin:16px 0;"></div>';
    if (blocked.length) {
      side += '<div class="run-note is-red"><i class="fa-solid fa-ban" aria-hidden="true"></i><span><b>'
        + (blocked.length === 1 ? '1 blocked issue' : blocked.length + ' blocked issues') + '</b> must be fixed before this file can be imported. Fix the rows in your file, then upload your file again.</span></div>';
    } else if (confirms.length) {
      var left = confirms.length - acked.length;
      side += left
        ? '<div class="run-note is-yellow"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i><span><b>'
          + (left === 1 ? '1 warning needs' : left + ' warnings need') + ' your review.</b> Check “I’ve reviewed this” on '
          + (left === 1 ? 'it' : 'each one') + ' to run the import. ' + acked.length + ' of ' + confirms.length + ' done.</span></div>'
        : '<div class="run-note is-blue"><i class="fa-solid fa-circle-check" aria-hidden="true"></i><span><b>'
          + (confirms.length === 1 ? 'Warning reviewed.' : 'All ' + confirms.length + ' warnings reviewed.') + '</b> You’re ready to run the import.</span></div>';
    }
    side += '<button class="btn" data-act="runImport" style="width:100%;border:none;background:' + (canSubmit ? '#1257B8' : '#C6D3E1') + ';color:#fff;font-size:14px;font-weight:600;padding:11px 0;border-radius:8px;cursor:' + (canSubmit ? 'pointer' : 'not-allowed') + ';"' + (canSubmit ? '' : ' disabled') + '>Run import</button>'
      // "Replace file" -> "Cancel import" (2026-09-24): an unconfirmed upload is a
      // cancelled attempt; the user starts a whole new upload. Also the one way out
      // for a BLOCKED import. OPEN: does a cancelled upload appear in the upload log?
      + '<button class="btn btn--outline-red" data-act="cancelImport" style="width:100%;margin-top:8px;">Cancel import</button>'
      + '<div style="font-size:12px;color:#8CA0B4;margin-top:10px;line-height:1.5;">Nothing changes until you run it.</div>'
      // Support articles (2026-09-25 — replaces the Edit mapping / Change settings
      // links; the stepper already jumps back to earlier steps).
      + '<div class="divider" style="margin:14px 0;"></div>'
      + '<div class="side-help-h">Help articles</div>'
      + '<div class="side-help">'
      + helpLink('errors', 'Common upload errors')
      + helpLink('template', 'Bulk upload process & template')
      + helpLink('best', 'Best practices for structuring user data')
      + '</div></div>';

    // Header (2026-10-01) — same shape as Map columns / Import settings; the line under it
    // says what this page needs from them, by what the file has.
    var revSub = blocked.length
      ? 'This file can’t be imported yet. Fix the blocked rows in your file, then upload your file again.'
      : confirms.length
        ? 'Here’s what this file will change. Review each warning and check “I’ve reviewed this” to run the import.'
        : 'Here’s what this file will change. Nothing needs your review — run the import when you’re ready.';
    return '<div class="fadeup">'
      + '<div style="margin-bottom:14px;"><div style="font-size:15px;font-weight:600;">Review changes</div>'
      + '<div style="font-size:13px;color:#5B6B7E;margin-top:3px;">' + revSub + '</div></div>'
      + '<div style="display:flex;gap:20px;align-items:flex-start;">'
      + '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;">' + alertsHtml + '</div>'
      + '<div style="width:310px;flex:0 0 310px;position:sticky;top:24px;">' + side + '</div>'   // 24px gap under the blue header while scrolling
      + '</div></div>';
  }

  /* CSV preview (2026-09-30): the complete list as it opens in a spreadsheet. Each alert
     is a block — a title row, its column headers, one row per person/item, a blank row. */
  /* Download CSV (2026-10-09): a real what_we_found.csv download — every row of every
     alert (the page tables stop at 20). Same layout as the old preview: a title line per
     alert, "What to do" for blocked ones, a header row, the rows, then a blank line. */
  function csvText() {
    var groups = buildAlerts().filter(function (a) { return a.list && a.list.all && a.list.all.length; });
    var LABEL = { blocked: 'Blocked', escalate: 'Blocked', confirm: 'Warning', info: 'Info' };
    var lines = [];
    function q(v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    function line(list) { lines.push(list.map(q).join(',')); }
    groups.forEach(function (a) {
      var L = a.list;
      line([LABEL[a.tier] + ': ' + a.title]);
      var det = detailsLine(a); if (det) line([det]);
      line(['Type'].concat(L.head).concat(L.allAfters ? ['What happens'] : []));
      L.all.forEach(function (r, i) {
        line([LABEL[a.tier]].concat(r.map(function (c) { return (c && typeof c === 'object') ? c.v : c; }))
          .concat(L.allAfters ? [L.allAfters[i].note] : []));
      });
      line([]);
    });
    return lines.join('\r\n');
  }
  function downloadCsv() {
    // \ufeff = byte-order mark, so Excel reads the curly quotes and dashes correctly.
    var blob = new Blob(['\ufeff' + csvText()], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob), link = document.createElement('a');
    link.href = url; link.download = 'what_we_found.csv';
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function csvHTML() {
    var f = currentFile(), groups = buildAlerts().filter(function (a) { return a.list && a.list.rows.length; });
    var width = 2 + groups.reduce(function (w, a) { return Math.max(w, a.list.head.length); }, 1);   // + the What happens column
    var TINT = { blocked: '#FEF3F2', escalate: '#FEF3F2', confirm: '#FFFAEB', info: '#EEF4FC' };
    var LABEL = { blocked: 'Blocked', escalate: 'Blocked', confirm: 'Warning', info: 'Info' };
    var n = 0, body = '', count = 0;
    function cells(list, cls) {
      var out = '';
      for (var i = 0; i < width; i++) out += '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + (list[i] != null ? esc(list[i]) : '') + '</td>';
      return out;
    }
    function row(list, cls, bg) { n++; body += '<tr' + (bg ? ' style="background:' + bg + ';"' : '') + '><th class="cv-n">' + n + '</th>' + cells(list, cls) + '</tr>'; }
    // Group title: one cell spanning the row, so a long title doesn't widen column A.
    function title(text, bg) { n++; body += '<tr style="background:' + bg + ';"><th class="cv-n">' + n + '</th><td class="cv-g" colspan="' + width + '">' + esc(text) + '</td></tr>'; }
    groups.forEach(function (a) {
      title(LABEL[a.tier] + ': ' + a.title, TINT[a.tier]);
      var det = detailsLine(a); if (det) title(det, '#fff');
      var pad = width - 2 - a.list.head.length;
      function padTo(list) { for (var k = 0; k < pad; k++) list.push(''); return list; }
      row(padTo([''].concat(a.list.head)).concat(a.list.afters ? ['What happens'] : []), 'cv-h');
      a.list.rows.forEach(function (r, ri) {
        count++;
        row(padTo([LABEL[a.tier]].concat(r.map(function (c) { return (c && typeof c === 'object') ? c.v : c; })))
          .concat(a.list.afters ? [a.list.afters[ri].note] : []));
      });
      row([]);
    });
    var letters = '';
    for (var i = 0; i < width; i++) letters += '<th>' + String.fromCharCode(65 + i) + '</th>';
    return '<div class="modal-overlay" data-act="closeCsv">'
      + '<div class="modal csv-modal" data-act="noop" role="dialog" aria-modal="true" aria-labelledby="cv-title">'
      + '<div class="modal-head"><div><div class="modal-title" id="cv-title"><i class="fa-solid fa-file-csv" aria-hidden="true" style="color:#067647;margin-right:8px;"></i>what_we_found.csv</div>'
      + '<div class="modal-sub">' + (f ? esc(f.name) + ' · ' : '') + groups.length + ' groups · ' + count + ' rows. Prototype preview of the file.</div></div>'
      + '<button class="modal-x" data-act="closeCsv" aria-label="Close">✕</button></div>'
      + '<div class="modal-body" style="padding:0;"><div class="cv-wrap"><table class="cv"><thead><tr><th class="cv-n"></th>' + letters + '</tr></thead><tbody>' + body + '</tbody></table></div></div>'
      + '<div class="modal-foot"><span style="font-size:12.5px;color:#5B6B7E;">Opens in Excel, Google Sheets or Numbers.</span>'
      + '<div style="display:flex;gap:10px;"><button class="btn btn--ghost" data-act="closeCsv">Close</button>'
      + '<button class="btn btn--primary" data-act="dlCsv"><i class="fa-solid fa-download" aria-hidden="true"></i> Download CSV</button></div></div>'
      + '</div></div>';
  }

      + '<div style="background:#fff;border:1px solid #E1E7EE;border-radius:10px;padding:14px 18px;margin:18px 0;font-size:13px;color:#5B6B7E;text-align:left;">A confirmation was emailed to <span style="font-weight:600;color:#1B2B3E;">vpollock@ridgewood.k12.us</span>. This import is recorded in your <a href="#" data-act="goLog">upload log</a>, where you can see who ran it, when, and the alerts it raised.</div>'
      + '<div style="display:flex;gap:10px;justify-content:center;">'

      + '<button class="btn btn--ghost" data-act="restart">Start another import</button>'
      + '<button class="btn btn--primary" data-act="goEmployees">Back to Employees</button></div>'
      // Automated sync can't be self-served — offer the how-to article, not a sync page.
      + '<div style="font-size:12.5px;color:#5B6B7E;margin-top:16px;">Tired of uploading by hand? ' + helpLink('sync', 'How to get automated sync') + '</div></div>';

  /* Upload log (2026-09-25) — every upload on the site: when, which file, who ran
     it, manual vs automated, the result, and what changed. Blocked, cancelled and
     failed attempts are listed too (nothing changed). Rows expand for detail. */
  // Method is plain text with a muted icon — no colored tag, so the Result column is
  // the only thing in a row that uses color (2026-09-29).
  function methodText(m) {
    return '<span class="log-method"><i class="fa-solid ' + (m === 'auto' ? 'fa-arrows-rotate' : 'fa-user') + '" aria-hidden="true"></i>'
      + (m === 'auto' ? 'Automated' : 'Manual') + '</span>';
  }
  function logHTML() {
    var f = state.logFilter;
    var rows = state.log.map(function (r, i) { return { r: r, i: i }; })
      .filter(function (x) { return f === 'all' || x.r.method === f; });
    function seg(v, label, ico) {
      return '<button class="subtab' + (f === v ? ' is-active' : '') + '" data-act="logFilter" data-arg="' + v + '">'
        + (ico ? '<i class="fa-solid ' + ico + '" aria-hidden="true"></i>' : '') + label + '</button>';
    }
    var STATUS = {
      completed: ['lp-ok', 'fa-circle-check', 'Completed'],
      blocked:   ['lp-blocked', 'fa-ban', 'Blocked'],
      cancelled: ['lp-cancelled', 'fa-circle-xmark', 'Cancelled'],
      failed:    ['lp-blocked', 'fa-ban', 'Blocked']   // retired 2026-09-29 — shows as Blocked
    };
    function pill(cls, ico, label) { return '<span class="log-pill ' + cls + '"><i class="fa-solid ' + ico + '" aria-hidden="true"></i>' + label + '</span>'; }
    // One row per upload (2026-09-29): changes get their own number columns instead of a wrapped sentence.
    function changes(r) {
      // Didn't run: no "No changes" text — just the row's arrow (failed automated runs can't be approved, 2026-10-09).
      if (r.status !== 'completed') return '<div class="lg-span4"></div>';
      function n(v, danger) { return '<div class="lg-num' + (v ? (danger ? ' ba-rem' : '') : ' is-zero') + '">' + (v || 0) + '</div>'; }
      return n(r.add) + n(r.mod) + n(r.deact, true) + n(r.jobsEnd, true);
    }
    var body = rows.map(function (x) {
      var r = x.r, open = state.logOpen === x.i, st = STATUS[r.status];
      var row = '<div class="log-grid log-row' + (open ? ' is-open' : '') + '" data-act="logDetail" data-arg="' + x.i + '" role="button" tabindex="0">'
        + '<div class="lg-when">' + esc(r.at) + ', ' + esc(r.time) + '</div>'
        + '<div class="lg-1 fname" title="' + esc(r.file) + '">' + esc(r.file) + '</div>'
        + '<div class="lg-num">' + (r.rows || '—') + '</div>'
        + '<div class="lg-1 l1" title="' + esc(r.by) + '">' + esc(r.by) + '</div>'
        + '<div>' + pill(st[0], st[1], st[2]) + '</div>'
        + changes(r)
        + '<div class="chev"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></div>'
        + '</div>';
      return row;
    }).join('');
    return '<div class="fadeup">'
      + '<div class="log-head"><div><div class="log-title">Upload log</div>'
      + '<div class="log-sub">Every employee upload on this site — who ran it, whether it was manual or automated, and what changed.</div></div>'
      + '<button class="btn btn--primary" data-act="goBulk" style="display:inline-flex;align-items:center;gap:8px;"><i class="fa-solid fa-file-arrow-up" aria-hidden="true"></i> Bulk Upload</button></div>'
      // The log on the left; Vector Care + the failure email list in a right column (2026-10-09).
      + '<div class="log-layout"><div class="log-main">'
      + '<div class="log-card">'
      + '<div class="log-filters"><div class="subtabs">' + seg('all', 'All uploads') + seg('manual', 'Manual', 'fa-user') + seg('auto', 'Automated', 'fa-arrows-rotate') + '</div>'
      + '<div class="log-count">' + rows.length + ' upload' + (rows.length === 1 ? '' : 's') + '</div></div>'
      + '<div class="log-scroll"><div class="log-grid log-th"><div>When</div><div>File</div><div class="lg-num">Rows</div><div>Uploaded by</div><div>Result</div>'
      + '<div class="lg-num">Added</div><div class="lg-num">Updated</div><div class="lg-num">Deactivated</div><div class="lg-num">Positions ended</div><div></div></div>'
      + (body || '<div class="log-empty">No uploads match this filter.</div>')
      + '</div></div></div>'
      + '<aside class="log-side">'
      // Uploads can't be undone (PRD), so a mistake goes to Care (2026-09-30).
      + '<div class="care-banner side-care"><div class="sc-row"><span class="cb-ico"><i class="fa-solid fa-user-headset" aria-hidden="true"></i></span>'
      + '<div class="cb-tx"><b>Made a mistake in an upload?</b> Reach out to Vector Care and we’ll help you sort out the changes.</div></div>'
      + '<a class="btn sm btn--outline-blue" href="' + HELP_LINKS.support + '" target="_blank" rel="noopener">Contact Vector Care <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true" style="font-size:10px;"></i></a></div>'
      + '<div class="divider"></div>'
      + notifyCardHTML()
      + '</aside></div></div>';
  }

  /* Who gets the email when an automated upload fails (2026-10-09) — on the upload log,
     with an Edit list mode (remove people, add an email, Save / Cancel). */
  function notifyCardHTML() {
    var ed = state.recipEdit, list = ed ? state.recipDraft : state.recipients;
    function who(p) { return p.name ? '<b>' + esc(p.name) + '</b> <span>' + esc(p.email) + '</span>' : '<b>' + esc(p.email) + '</b>'; }
    var body;
    if (!ed) {
      body = (list.length
        ? '<div class="nc-people">' + list.map(function (p) {
            return '<div class="nc-person"><i class="fa-solid fa-user" aria-hidden="true"></i><div>'
              + (p.name ? '<b>' + esc(p.name) + '</b>' : '') + '<span>' + esc(p.email) + '</span></div></div>';
          }).join('') + '</div>'
        : '<div class="nc-empty">No one gets these emails yet. Add at least one admin so failed uploads don’t go unnoticed.</div>')
        + '<div class="nc-foot">' + (state.recipSaved ? '<span class="nc-saved"><i class="fa-solid fa-circle-check" aria-hidden="true"></i> Saved</span>' : '')

        // with Blocking issues the admin can only cancel, so it's Cancelled; only automated runs show Blocked.
        var hard = buildAlerts().filter(function (x) { return x.tier === 'blocked' || x.tier === 'escalate'; });
        state.log = logAttempt('cancelled', hard.length
          ? ['Cancelled on Review changes — it was blocked (' + (hard.length === 1 ? '1 issue' : hard.length + ' issues') + ')'].concat(hard.map(function (x) { return 'Blocked: ' + x.title; }), ['Nothing was changed'])
          : ['Cancelled on Review changes — nothing was changed']);
        setState({ fileId: null, step: 'upload', acks: {}, purgeUsers: false, purgeJobs: false, repSent: false, validating: false, cancelled: true }); scrollTop(); break;
      case 'askRep': e.preventDefault(); setState({ repSent: true }); break;
      case 'fixMapping': go('map'); scrollTop(); break;
      case 'replaceFile': setState({ fileId: null, step: 'upload' }); scrollTop(); break;
      case 'changeSettings': go('settings'); scrollTop(); break;
      case 'runImport': if (el.disabled) break; setState({ confirmRun: true }); break;   // 1st click -> confirmation modal
      case 'confirmRunNo': setState({ confirmRun: false }); break;
      case 'openCsv': setState({ csvOpen: true }); break;   // preview pop-up — no longer linked (2026-10-09)
      case 'dlCsv': downloadCsv(); break;
      case 'closeCsv': setState({ csvOpen: false }); break;
      case 'confirmRunYes':
        state.log = logAttempt('completed', buildAlerts().filter(function (x) { return x.tier === 'confirm'; })
          .map(function (x) { return 'Confirmed: ' + x.title; }));
        finishRun(summary(), 'employees', 0); break;
      case 'ddToggle': setState({ mapOpen: state.mapOpen === arg ? null : arg }); break;
      case 'ddPick': setColTarget(arg, el.getAttribute('data-val')); break;
      case 'closeToast': clearTimeout(toastTimer); setState({ toast: null }); break;
      case 'restart': setState({ fileId: null, step: 'upload', acks: {}, purgeUsers: false, purgeJobs: false, repSent: false }); scrollTop(); break;
      case 'bless': setState({ blessed: true }); break;
      case 'goStep':
        go(arg);   // going back keeps the file, mapping, setting and reviewed warnings (2026-10-02)
        scrollTop(); break;
      case 'linkUpload': e.preventDefault(); go('upload'); scrollTop(); break;
      case 'linkMap': e.preventDefault(); go('map'); scrollTop(); break;
      case 'linkSettings': e.preventDefault(); go('settings'); scrollTop(); break;
      /* Failed automated upload email list (upload log) */
      case 'recipEdit': setState({ recipEdit: true, recipDraft: state.recipients.slice(), recipVal: '', recipErr: '', recipSaved: false }); break;
      case 'recipEditLog': e.preventDefault();   // from a failed run's page: open the list on the upload log
        setState({ view: 'log', logOpen: null, recipEdit: true, recipDraft: state.recipients.slice(), recipVal: '', recipErr: '', recipSaved: false });
        scrollTop(); break;
      case 'recipRemove': setState({ recipDraft: state.recipDraft.filter(function (_, j) { return j !== +arg; }) }); break;
      case 'recipAdd': addRecipient(); break;
      case 'recipCancel': setState({ recipEdit: false, recipErr: '', recipVal: '' }); break;
      case 'recipSave': setState({ recipients: state.recipDraft.slice(), recipEdit: false, recipErr: '', recipVal: '', recipSaved: true }); break;
      /* Review: show one row after the import (clicking the open row closes it) */
      case 'axRow': setState({ axOpen: state.axOpen === arg ? null : arg }); break;
      case 'toggleFail': setState({ notifyFail: !state.notifyFail }); break;
      case 'toggleSuccess': setState({ notifySuccess: !state.notifySuccess }); break;
      case 'toggleHelp': e.preventDefault(); setState({ openHelp: state.openHelp === arg ? null : arg }); break;
      case 'closeHelp': e.preventDefault(); setState({ openHelp: null }); break;
      case 'toggleDisc': {   // (Hide details also closes that alert's after-line)
        if (state.axOpen && state.axOpen.indexOf(arg.slice(3) + '|') === 0) state.axOpen = null;
        var d = {}; for (var dk in state.disc) d[dk] = state.disc[dk];
        d[arg] = !d[arg]; setState({ disc: d });
        break;
      }
      case 'toggleVariants': setState({ variantsCollapsed: !state.variantsCollapsed }); break;
      case 'attnSend': e.preventDefault(); setState({ attnSent: true }); break;
      case 'setVariant': {
        var parts = arg.split(':'), key = parts[0], val = parts[1];
        var vs = {}; for (var k in state.variants) vs[k] = state.variants[k]; vs[key] = val;
        var patch = { variants: vs };
        if (key === 'startTab') patch.tab = val;
        if (key === 'uploadVariant') { patch.fileId = null; patch.step = 'upload'; patch.acks = {}; }
        setState(patch);
        break;
      }
    }
  });

  // Any click outside the Add Employee split button closes its menu (on document, so clicks
  // anywhere on the page count).
  document.addEventListener('click', function (e) {
    if (state.addMenu && !e.target.closest('.add-split')) setState({ addMenu: false });
  });

  // Keyboard access for non-button clickables (e.g. completed stepper steps).
  // Escape closes an open "Import as" menu (on document: re-renders can drop focus to <body>).
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && state.mapOpen != null) setState({ mapOpen: null });
    if (e.key === 'Escape' && state.addMenu) setState({ addMenu: false });
  });
  $app.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act], [role="switch"][data-act]')) { e.preventDefault(); e.target.click(); }
    if (e.key === 'Enter' && e.target.id === 'recipInput') { e.preventDefault(); addRecipient(); }
  });

  $app.addEventListener('change', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'keepCopy') {
      setState({ keepCopy: el.checked });
    } else if (act === 'ack') {
      var id = el.getAttribute('data-arg');
      var a = {}; for (var kk in state.acks) a[kk] = state.acks[kk];
      var key = ackKey(id); a[key] = !a[key];
      setState({ acks: a });
    }
  });

  /* --------------------------------------------- Design Toolbox flow-map host */
  function reviewFor(fileId, pu, pj) {
    setState({ tab: 'import', view: 'import', importFull: true, fileId: fileId, mapping: defaultMapping(fileId),
      purgeUsers: !!pu, purgeJobs: !!pj, repSent: false, acks: {}, disc: {}, axOpen: null, step: 'review', validating: false });
  }

  function applyFlowState(id) {
    state.confirmRun = false; state.csvOpen = false; state.toast = null; state.addMenu = false; state.axOpen = null; state.recipEdit = false;   // a flow-map jump never lands inside the Run pop-up
    switch (id) {
      case 'employees': setState({ view: 'employees', addEmp: false, importFull: false }); break;
      case 'add-menu': setState({ view: 'employees', addEmp: false, importFull: false, addMenu: true }); break;
      case 'log-auto': {   // a failed automated run's page (read-only)
        var ai = -1; state.log.forEach(function (r, i) { if (ai < 0 && r.msgs === 'auto') ai = i; });
        setState({ view: 'logDetail', importFull: false, logDetail: ai, disc: {} }); break;
      }
      case 'log-emails': setState({ view: 'log', addEmp: false, importFull: false, logFilter: 'all',
        recipEdit: true, recipDraft: state.recipients.slice(), recipVal: '', recipErr: '', recipSaved: false }); break;
      case 'log': setState({ view: 'log', addEmp: false, importFull: false, logFilter: 'all' }); break;
      case 'intro':   // former Intro page, now merged into Upload
      case 'upload': setState({ tab: 'import', view: 'import', importFull: true, step: 'upload', fileId: null, validating: false }); break;
      case 'map': setState({ tab: 'import', view: 'import', importFull: true, fileId: 'saml', mapping: defaultMapping('saml'), purgeUsers: false, purgeJobs: false, acks: {}, step: 'map', validating: false }); break;
      case 'settings': setState({ tab: 'import', view: 'import', importFull: true, fileId: 'confirm', mapping: defaultMapping('confirm'), purgeUsers: false, purgeJobs: false, repSent: false, acks: {}, step: 'settings', validating: false }); break;
      /* Manual import — one node per severity path */
      case 'review-info':     reviewFor('clean', false, false); break;  // INFO only — runs freely
      case 'review-confirm':  reviewFor('confirm', false, false);   // CONFIRM — name change + skipped rows (+ info);
        setState({ disc: { 'ax:duplicate_user_in_system': true }, axOpen: 'duplicate_user_in_system|0' }); break;   // opened, first row's after-line showing
      case 'review-blocked':  reviewFor('blast', false, false); break;  // BLOCKED — blast radius
      case 'review-saml':     reviewFor('saml', false, false); break;   // BLOCKED — SAML mismatch
      case 'review-escalate': reviewFor('dupes', false, false); break;  // BLOCKED ×2 + CONTACT VECTOR
      case 'done': setState({ view: 'employees', importFull: false, addEmp: false, fileId: null, step: 'upload',
        toast: { counts: summaryFor('confirm', true, true), keep: true, onLog: false } }); break;   // no auto-dismiss in the flow map
      /* Attention-needed step (V1 treatment = inline alert mode) */
      case 'attn-fixable':  setState({ tab: 'import', view: 'import', importFull: true, step: 'attn', attnSev: 'fixable', attnSent: false }); break;   // AMBER — you fix it
      case 'attn-escalate': setState({ tab: 'import', view: 'import', importFull: true, step: 'attn', attnSev: 'escalate', attnSent: false }); break; // RED — Vector's team
      default: break;
    }
    scrollTop();
  }
  window.applyFlowState = applyFlowState;

  function bootFromHash() {
    var m = (location.hash || '').match(/fm=([\w-]+)/);
    if (m) { try { applyFlowState(decodeURIComponent(m[1])); } catch (e) {} }
  }
  window.addEventListener('hashchange', bootFromHash);

  window.TOOLBOX_CONFIG = {
    flowMap: {
      title: 'Bulk User Import · V1 (Employees tab · split buttons) — Flow Map',
      applyState: 'applyFlowState',
      canvas: { w: 1680, h: 830 },
      flows: [
        { id: 'import', name: 'Manual import — severity paths', pill: 'A', color: '#c9d9f0',
          lane: { x: 20, y: 20, w: 1640, h: 790 }, labelXY: { x: 40, y: 46 } }
      ],
      nodes: [
        /* ── Manual import: wizard on the left, then one branch per severity ──
           Row 1 (y60): Info → Confirm → Done.  Row 2 (y420): the three stops. ── */
        { id: 'employees', flow: 'import', entry: true, x: 40, y: 250, step: 'Entry', name: 'Employees tab — Add Employee split button', state: 'add-menu',
          desc: 'Bulk import lives under the Employees tab. Entry point (2026-10-09) = one SafeLMS split button: the main action “Add Employee” opens the Add employee pop-up; the ▾ opens a menu with “Add single employee” and “Bulk upload”. Bulk upload opens the Bulk Upload page: the side nav stays, and a blue header reads “Bulk Upload” with a ← back arrow (back to Employees; an unfinished import is kept).' },
        { id: 'upload', flow: 'import', x: 250, y: 250, step: 'Step 1', name: 'Upload file', state: 'upload',
          desc: 'On the Bulk Upload page (side nav + blue “Bulk Upload” header, wider 1240px card). Stepper, then the “Start with the SafeLMS template” card (Download button + template guide), the drop zone, and a Help Center line (best practices, common errors, how to get automated sync). ← Back returns to Employees. After Cancel import, lands here with an “Import cancelled” note. Nothing imports until reviewed.' },
        { id: 'map', flow: 'import', x: 500, y: 120, step: 'Step 2', name: 'Map columns', state: 'map',
          desc: 'Match your file columns to SafeLMS fields (skipped in the Template variant).' },
        { id: 'settings', flow: 'import', x: 500, y: 410, step: 'Step 3', name: 'Import settings', state: 'settings',
          desc: 'One off-by-default switch — “Deactivate all people and positions not in this file” — with a live On/Off description directly under it. Users-only or positions-only deactivation isn’t self-serve: a banner routes to Vector Care via the Support Center.' },

        { id: 'review-info', flow: 'import', x: 700, y: 60, step: 'Review · Info', name: 'Info only — runs freely', state: 'review-info',
          desc: 'INFO tier only (e.g. 3 emails updated, new users created). Nothing to acknowledge — Run import is enabled immediately.' },
        { id: 'review-confirm', flow: 'import', x: 1030, y: 60, step: 'Review · Confirm', name: 'Confirm — acknowledge & run', state: 'review-confirm',
          desc: 'duplicate_user_in_system (name change, Jessyca → Jesse) + removed_rows + info. View details = one plain line on what the warning is about and how it changes things, then the rows exactly as uploaded. Only rows where a value changes are clickable — their row number is blue and underlined, and the hint names them (“Click Row 23 or Row 118 to see the change.”). Below the box, an “After import” box shows just that row’s line after the change. Informational rows (new accounts, skipped, blocked) aren’t clickable. Every WARNING is checked “I’ve reviewed this” before Run import unlocks. Run confirmation: Run stays blue; “Also download your current employee data” has a download icon on the left and the checkbox on the right.' },
        { id: 'log-auto', flow: 'import', x: 1030, y: 250, step: 'Log → Failed run', name: 'Automated upload failed — how to fix it', state: 'log-auto',
          desc: 'A failed automated upload can’t be reviewed or approved (2026-10-09) — they have to run it again. Its page says it didn’t run and nothing changed, then lists why: each Blocked / Warning alert opens to one line on what it’s about and how to fix the file, then the rows from the file. Side panel: Upload a corrected file, Download file, and the failure email list with “Edit the list”.' },
        { id: 'log', flow: 'import', x: 1360, y: 250, step: 'Log', name: 'Upload log', state: 'log',
          desc: 'Every upload on the site: when, file, rows, who ran it, result (Completed / Blocked — automated only / Cancelled) and what changed; runs that didn’t go show just the arrow. Role + Method columns dropped (2026-10-09) — filter All / Manual / Automated instead; each row opens its own page. Right column: “Made a mistake?” → Contact Vector Care, and “Failed automated upload emails” — who gets the email when an automated upload fails, with Edit list (remove people, add an email, Save / Cancel).' },
        { id: 'done', flow: 'import', x: 1360, y: 60, step: 'Done', name: 'Back on Employees + toast', state: 'done',
          desc: 'No “Import complete” page (2026-10-01): Run import lands back on Employees with a toast — “Your upload ran. N added · N updated…” + “You can see it in the upload log now.” (+ “A copy of your data from before it ran was downloaded.” when that box was checked on the Run confirmation). Clears after ~8s.' },

        { id: 'review-blocked', flow: 'import', x: 700, y: 420, step: 'Review · Copy review', name: 'Every catalog message', state: 'review-blocked',
          desc: 'Copy review: the last sample file raises every message from the Error & Notification Message Catalog (PMC 29424549907) most severe first, each tagged with its key, so the copy and tiers can be checked against Confluence.' },
        { id: 'review-saml', flow: 'import', x: 1030, y: 420, step: 'Review · Blocked', name: 'Blocked — unreadable dates', state: 'review-saml',
          desc: 'broken_begin_date (BLOCKING — rows 14, 27, 88 in the table; the header tags Column H · BEGIN_DATE) + early_end_date (WARNING) + info.' },
        { id: 'review-escalate', flow: 'import', x: 1360, y: 420, step: 'Review · Blocked', name: 'Blocked — duplicate accounts', state: 'review-escalate',
          desc: 'duplicate_person (BLOCKING → Submit a ticket) + potential_duplicate_user (WARNING, each row shown as the duplicate account it would create) + duplicate_email_in_upload (WARNING).' },

        { id: 'attn-fixable', flow: 'import', x: 700, y: 620, step: 'Attention · amber', name: 'Alert mode — you fix it', state: 'attn-fixable',
          desc: 'V1 attention treatment = inline ALERT MODE, AMBER: a distinct colored card (not red) for a problem the customer fixes themselves — plain-language cause, A→B, “Fix it & upload again.”' },
        { id: 'attn-escalate', flow: 'import', x: 1030, y: 620, step: 'Attention · red', name: 'Alert mode — Vector’s team', state: 'attn-escalate',
          desc: 'Same alert mode in RED: reserved for a blocker only Vector can resolve (two site accounts share an email). “Send to Vector — we’ll take it from here” → CARE ref.' }
      ],
      edges: [
        ['employees', 'upload'],
        ['upload', 'map'], ['upload', 'settings'], ['map', 'settings'],
        ['settings', 'review-info'], ['settings', 'review-confirm'], ['settings', 'review-blocked'],
        ['settings', 'review-saml'], ['settings', 'review-escalate'],
        ['review-info', 'done'], ['review-confirm', 'done'], ['done', 'log'], ['employees', 'log'], ['log', 'log-auto']
      ]
    }
  };

  render();
  bootFromHash();
})();
</script>
