<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SafeLMS — Bulk User Import · V1 (split buttons)</title>

<!-- Font Awesome 6 PRO (self-hosted at repo root; depth-relative). -->
<link rel="stylesheet" href="../../../../assets/fontawesome/css/all.min.css" />

<!-- IBM Plex — the design's typeface (Sans for UI, Mono for data values). -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>

<style>
  /* ==========================================================================
     Self-Serve Bulk User Import (SAFELMS-32693)
     Ported from the Claude Design source "Bulk User Import.dc.html".
     Vanilla HTML/CSS/JS — no frameworks (per project rules).
     ========================================================================== */

  :root {
    /* Brand / surface */
    --navy: #0E2A43; --navy-2: #16395B; --navy-3: #1B4266; --navy-track: #6B839C;
    --bg: #F2F5F9;
    /* Ink */
    --ink: #1B2B3E; --ink-2: #3D4F63; --muted: #5B6B7E; --muted-2: #8CA0B4;
    /* Lines */
    --line: #E1E7EE; --line-2: #EDF1F6; --line-3: #F3F6FA; --btn-border: #C6D3E1;
    /* Blue */
    --blue: #1257B8; --blue-2: #0C3F87; --blue-accent: #1F7AE0;
    /* Green */
    --green: #12B76A; --green-ink: #067647; --green-bg: #ECFDF3; --green-border: #A6E5C3;
    /* Amber */
    --amber: #DC8A12; --amber-ink: #8A5A0B; --amber-bg: #FFFAEB; --amber-border: #F2D69B;
    /* Red */
    --red: #D92D20; --red-ink: #B42318; --red-ink-2: #912018; --red-bg: #FEF3F2; --red-border: #F1C0BB;

    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); font-family: var(--sans); color: var(--ink); }
  a { color: var(--blue); text-decoration: none; }
  a:hover { color: var(--blue-2); text-decoration: underline; }
  input, select, button { font-family: var(--sans); }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeup { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .fadeup { animation: fadeup .25s ease; }

  /* ==========================================================================
     App shell — authentic VectorSolutions / SafeLMS product chrome.
     Matches the reference SafeLMS mocks (async-reports / reports): a compact
     white 160px sidebar with the VectorSolutions pinwheel logo + nav, a blue
     gradient topbar, and a gray content canvas. Only the chrome is SafeLMS;
     the bulk-import content keeps its own IBM Plex design language.
     ========================================================================== */
  .app { display: grid; grid-template-columns: 168px minmax(0, 1fr); grid-template-rows: 100vh;
    height: 100vh; overflow: hidden; }

  /* ---- Sidebar (white, hairline right border) ---- */
  .sidebar { background: #fff; border-right: 1px solid var(--line-2); padding: 14px 16px 12px;
    display: flex; flex-direction: column; min-height: 0; }
  .logo { display: flex; align-items: center; gap: 7px; padding: 2px; }
  .logo .wordmark { display: flex; flex-direction: column; line-height: 1; }
  .logo .wordmark .brand { font-weight: 700; font-size: 13px; letter-spacing: .1px; color: #374C61; }
  .logo .wordmark .brand sup { font-size: 7px; font-weight: 700; }
  .logo .wordmark .sub { font-size: 8px; margin-top: 3px; color: var(--muted); letter-spacing: .2px; }

  .user { display: flex; align-items: center; gap: 9px; margin: 18px 0 2px; padding: 0 2px; }
  .user .avatar { width: 28px; height: 28px; border-radius: 50%; background: #DCE7F2; color: var(--navy);
    font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: 0 0 28px; }
  .user .name { font-size: 12px; line-height: 1.3; color: #364153; min-width: 0; }
  .user .name span { color: var(--muted); }
  .user .name b { display: block; font-weight: 600; color: var(--ink); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }

  .nav-scroll { flex: 1; min-height: 0; overflow-y: auto; margin: 4px -6px 0; padding: 0 6px; }
  .nav-group { margin-top: 16px; }
  .nav-group .glabel { font-size: 10px; font-weight: 700; letter-spacing: .8px; color: var(--muted-2);
    padding: 4px 6px; margin-bottom: 2px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 5px;
    font-size: 12px; color: #364153; cursor: pointer; }
  .nav-item:hover { background: var(--line-3); }
  .nav-item .ico { width: 16px; display: flex; align-items: center; justify-content: center;
    color: #4A5565; flex: 0 0 16px; font-size: 12.5px; }
  .nav-item .chev { margin-left: auto; color: var(--muted-2); font-size: 9px; }
  .nav-item.is-active { font-weight: 700; color: var(--ink); background: #EAF1FC; }
  .nav-item.is-active .ico { color: var(--blue); }

  .sidebar-footer { display: grid; place-items: center; padding-top: 10px; }

  /* ---- Main column ---- */
  /* min-height:0 lets .main clamp to the 100vh grid row instead of growing to its
     content height — without it, tall content overflows the overflow:hidden shell
     and .scroll never becomes scrollable. */
  .main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }

  /* Blue topbar */
  .topbar { height: 60px; flex: 0 0 60px; color: #fff; display: flex; align-items: center; gap: 14px;
    padding: 0 24px; background: linear-gradient(180deg, #1747E6 0%, #1447E6 50%, #1038C8 100%); }
  .topbar .t-title { font-weight: 700; font-size: 20px; letter-spacing: .2px; white-space: nowrap; }
  .topbar .t-sub { font-size: 12.5px; color: #E9F0FF; opacity: .95; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .topbar-site { margin-left: auto; flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px;
    background: #fff; border-radius: 7px; padding: 7px 12px; color: var(--ink); font-size: 12.5px;
    font-weight: 600; cursor: pointer; white-space: nowrap; }
  .topbar-site .lbl { color: var(--muted); font-weight: 500; }
  .topbar-site .caret { color: var(--muted-2); font-size: 10px; }

  .scroll { flex: 1; min-height: 0; overflow-y: auto; background: #EEF1F5; }
  .content { max-width: 1060px; margin: 0 auto; padding: 22px 32px 72px; }

  /* ---- Tabs ---- */
  .tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--line); margin: 20px 0 24px; }
  .tab { padding: 9px 16px; font-size: 14px; font-weight: 500; color: var(--muted);
    border: none; background: none; border-bottom: 2px solid transparent; margin-bottom: -2px;
    cursor: pointer; display: flex; align-items: center; gap: 7px; }
  .tab.is-active { font-weight: 600; color: var(--blue); border-bottom-color: var(--blue); }
  .dot-red { width: 8px; height: 8px; border-radius: 50%; background: var(--red); display: inline-block; }

  /* ---- Stepper ---- */
  .stepper { display: flex; align-items: center; margin-bottom: 26px; }
  .step { display: flex; align-items: center; }
  .step-body { display: flex; align-items: center; gap: 8px; }
  .step-circle { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 12px; font-weight: 600; }
  .step-label { font-size: 13px; white-space: nowrap; }
  .step-conn { width: 44px; height: 1.5px; background: #D5DEE8; margin: 0 12px; }

  /* ---- Cards & generic ---- */
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; }
  .divider { height: 1px; background: var(--line-2); }

  /* ---- Buttons ---- */
  .btn { border: none; font-size: 13.5px; font-weight: 600; padding: 9px 16px; border-radius: 7px; cursor: pointer; }
  .btn.sm { font-size: 13px; padding: 8px 14px; }
  .btn--primary { background: var(--blue); color: #fff; }
  .btn--primary:hover { background: var(--blue-2); }
  .btn--ghost { border: 1px solid var(--btn-border); background: #fff; color: var(--ink-2); }
  .btn--ghost:hover { background: #F5F8FB; }
  .btn--outline-blue { border: 1px solid var(--btn-border); background: #fff; color: var(--blue); }
  .btn--outline-blue:hover { background: #F0F6FD; }
  .btn--danger { border: none; background: var(--red-ink); color: #fff; }
  .btn--danger:hover { background: var(--red-ink-2); }
  .btn--disabled { background: var(--btn-border); color: #fff; cursor: not-allowed; }

  /* ---- Upload ---- */
  .banner { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px;
    margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .dropzone { background: #fff; border: 1.5px dashed #B9C9DA; border-radius: 10px; padding: 36px 20px; text-align: center; }
  .dropzone-icon { width: 44px; height: 44px; border-radius: 10px; background: #EDF3FA; margin: 0 auto 10px;
    display: flex; align-items: center; justify-content: center; font-size: 19px; color: var(--blue); }
  .section-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted-2); margin-bottom: 10px; }
  .file-row { background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 12px 16px;
    display: flex; align-items: center; gap: 14px; cursor: pointer; transition: border-color .12s, box-shadow .12s; }
  .file-row:hover { border-color: var(--blue-accent); box-shadow: 0 1px 4px rgba(15,42,67,.08); }
  .file-badge { width: 34px; height: 34px; border-radius: 7px; background: #F0F4F9; display: flex;
    align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--muted); }
  .mono { font-family: var(--mono); }

  /* ---- Map grid ---- */
  .map-grid { display: grid; grid-template-columns: 180px 1fr 1fr 90px; }
  .map-head { font-size: 12px; font-weight: 600; color: var(--muted-2); text-transform: uppercase;
    letter-spacing: .6px; padding: 10px 20px; border-bottom: 1px solid var(--line-2); }
  .map-row { align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--line-3); }
  .map-select { width: 100%; padding: 7px 10px; border: 1px solid var(--btn-border); border-radius: 7px;
    font-size: 13px; background: #fff; color: var(--ink); }

  /* ---- Settings radios ---- */
  .radio-card { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 16px 18px;
    cursor: pointer; display: flex; gap: 12px; }
  .radio-card:hover { border-color: var(--blue-accent); }
  .radio-dot { width: 18px; height: 18px; border-radius: 50%; background: #fff; flex: 0 0 18px; margin-top: 1px; }

  /* ---- Review alerts ---- */
  .chip { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: #fff;
    border-radius: 5px; padding: 3px 8px; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 5px; }
  /* Severity icon travels inside the chip so the tier reads by SHAPE, not color
     alone (WCAG 1.4.1 — don't use color as the only visual means). */
  .chip i { font-size: 10.5px; }
  .alert { border: 1px solid; border-radius: 10px; overflow: hidden; background: #fff; }
  .alert-head { padding: 14px 18px; display: flex; gap: 12px; align-items: flex-start; }
  .alert-title { font-size: 14.5px; font-weight: 600; }
  .alert-body { padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
  .alert-line { font-size: 13.5px; line-height: 1.55; }
  .alert-line b { font-weight: 600; color: var(--muted); }
  .diff-grid { display: grid; grid-template-columns: 56px 130px 1fr 1fr 1fr; }
  .diff-head { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
    color: var(--muted-2); background: #F8FAFC; padding: 7px 12px; }
  .diff-row { font-size: 12.5px; padding: 7px 12px; border-top: 1px solid var(--line-3); align-items: center; }
  .more-link { font-size: 12px; color: var(--blue); border-top: 1px solid var(--line-3); padding: 7px 12px; cursor: pointer; }

  /* ---- Side-by-side "Now → After you accept" comparison ---- */
  .ba { display: flex; flex-direction: column; gap: 12px; }
  .ba-head { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
    color: var(--muted-2); margin-bottom: 6px; }
  .ba-grid { display: grid; grid-template-columns: 1fr 30px 1fr; align-items: stretch; }
  .ba-card { border: 1px solid var(--line-2); border-radius: 8px; padding: 10px 14px; }
  .ba-before { background: #F8FAFC; }
  .ba-after { background: #F7FAFE; border-color: #C6D9F0; }
  .ba-after.is-loss { background: #FEF7F6; border-color: var(--red-border); }
  .ba-arrow { display: flex; align-items: center; justify-content: center; color: var(--muted-2); font-size: 16px; }
  .ba-label { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--muted-2); }
  .ba-val { font-size: 13px; color: var(--ink); margin-top: 5px; font-weight: 500; word-break: break-word; }
  .ba-val.is-loss-text { color: var(--red-ink); }
  .ba-sub { font-size: 11.5px; color: var(--muted-2); margin-top: 5px; line-height: 1.45; }
  .ba-sub.is-loss-sub { color: var(--red-ink); }
  .ba-more { font-size: 12px; color: var(--blue); cursor: pointer; }
  @media (max-width: 620px) { .ba-grid { grid-template-columns: 1fr; } .ba-arrow { transform: rotate(90deg); padding: 3px 0; } }

  /* ---- KPI sidebar ---- */
  .kpi-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; color: var(--muted-2); }
  .kpi-row { display: flex; justify-content: space-between; align-items: baseline; }
  .kpi-row .k { font-size: 13.5px; color: var(--ink-2); }
  .kpi-row .v { font-size: 18px; font-weight: 700; }

  /* ---- Toggle ---- */
  .toggle { width: 34px; height: 19px; border-radius: 10px; position: relative; cursor: pointer; transition: background .15s; }
  .toggle-knob { width: 15px; height: 15px; border-radius: 50%; background: #fff; position: absolute; top: 2px; transition: left .15s; }

  /* ---- Settings: deactivate / remove options + live example ---- */
  .opt-row { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 15px 18px;
    display: flex; gap: 14px; align-items: flex-start; margin-bottom: 12px; }
  .opt-row.is-on.is-danger { border-color: var(--red-border); background: #FEF7F6; }
  .opt-main { flex: 1; min-width: 0; }
  .opt-title { font-size: 14px; font-weight: 600; }
  .opt-sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .ex-card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .ex-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--muted-2); margin-bottom: 8px; }
  .job-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; border-radius: 6px; padding: 3px 9px; margin: 3px 5px 0 0; }
  .job-keep { background: #F0F4F9; color: var(--ink-2); }
  .job-add { background: var(--green-bg); color: var(--green-ink); }
  .job-remove { background: var(--red-bg); color: var(--red-ink); text-decoration: line-through; }

  /* ---- File-picker modal (prototype stand-in for the OS file chooser) ---- */
  .modal-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(14,42,67,.45);
    display: flex; align-items: center; justify-content: center; padding: 24px; animation: fadeup .16s ease; }
  .modal { background: #fff; border-radius: 12px; width: 560px; max-width: 100%; max-height: 86vh;
    display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 64px rgba(0,0,0,.35); }
  .modal-head { padding: 18px 22px; border-bottom: 1px solid var(--line);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .modal-title { font-size: 16px; font-weight: 700; }
  .modal-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
  .modal-x { background: none; border: none; color: var(--muted-2); font-size: 17px; cursor: pointer;
    line-height: 1; padding: 3px 7px; border-radius: 6px; }
  .modal-x:hover { background: var(--line-3); color: var(--ink-2); }
  .modal-body { padding: 16px 22px; overflow-y: auto; }
  .modal-foot { padding: 13px 22px; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .modal-drop { border: 1.5px dashed #B9C9DA; border-radius: 10px; padding: 18px; text-align: center; margin-bottom: 16px; }

  /* ---- Settings placement: full-width tab bar under the blue topbar ---- */
  .settings-tabbar { flex: 0 0 auto; background: #fff; border-bottom: 1px solid var(--line);
    padding: 0 32px; display: flex; gap: 2px; overflow-x: auto; }
  .stab { padding: 13px 14px; font-size: 13.5px; font-weight: 500; color: var(--muted);
    border: none; background: none; border-bottom: 2px solid transparent; margin-bottom: -1px;
    cursor: pointer; white-space: nowrap; }
  .stab:hover:not(.is-active) { color: var(--ink-2); }
  .stab.is-active { color: var(--ink); font-weight: 600; border-bottom-color: var(--blue); }

  /* ---- Manual import / Automated sync secondary control (segmented) ---- */
  .subtabs { display: inline-flex; background: #E9EEF4; border-radius: 9px; padding: 3px; gap: 2px; margin-bottom: 22px; }
  .subtab { border: none; background: none; font-size: 13px; font-weight: 600; color: var(--muted);
    padding: 7px 15px; border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .subtab.is-active { background: #fff; color: var(--blue); box-shadow: 0 1px 2px rgba(16,24,40,.16); }

  /* ---- Manual-import walkthrough (overview): full card + compact strip ---- */
  .wt-card { display: flex; gap: 14px; background: #fff; border: 1px solid var(--line);
    border-left: 5px solid var(--blue); border-radius: 8px; padding: 16px 18px; margin-bottom: 20px;
    box-shadow: 0 1px 3px rgba(16,24,40,.06); }
  .wt-icon { flex: 0 0 34px; width: 34px; height: 34px; border-radius: 9px; background: #E1EBF9;
    color: var(--blue); display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .wt-title { font-size: 14.5px; font-weight: 700; }
  .wt-body { font-size: 13px; color: var(--ink-2); line-height: 1.55; margin-top: 3px; }
  .wt-link { margin-top: 7px; font-size: 12.5px; }
  .wt-strip { display: flex; align-items: center; gap: 9px; background: #F5F9FE; border: 1px solid #E1E7EE;
    border-radius: 8px; padding: 9px 14px; margin-bottom: 18px; font-size: 12.5px; color: var(--ink-2); }
  .wt-strip i { color: var(--blue); flex: 0 0 auto; }

  /* ---- Version B: automated sync stacked under manual import ---- */
  .stack-divider { height: 1px; background: var(--line); margin: 44px 0 0; }
  .stack-head { margin: 26px 0 20px; scroll-margin-top: 12px; }
  .stack-title { font-size: 17px; font-weight: 700; }
  .stack-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }

  /* ---- Prototype variant panel (mock-only affordance) ---- */
  /* Anchored bottom-LEFT, over the sidenav's empty lower region — never covers
     the content-area action buttons (Continue / Run import live on the right). */
  .variants { position: fixed; bottom: 14px; left: 14px; z-index: 900; width: 196px;
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,.28); padding: 12px 14px; font-size: 12px; }
  .variants-title { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
    color: var(--muted-2); display: flex; align-items: center; justify-content: space-between; }
  .variants-title .collapse { cursor: pointer; color: var(--muted-2); font-size: 13px; }
  .variants-row { margin-top: 9px; }
  .variants-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted-2); margin-bottom: 5px; }
  .seg { display: flex; border: 1px solid var(--btn-border); border-radius: 7px; overflow: hidden; }
  .seg button { flex: 1; border: none; background: #fff; font-size: 11px; padding: 6px 4px; cursor: pointer; color: var(--muted); }
  .seg button.is-on { background: var(--blue); color: #fff; font-weight: 600; }
  .seg button + button { border-left: 1px solid var(--btn-border); }
  .variants-hint { font-size: 10.5px; color: var(--muted-2); margin-top: 10px; line-height: 1.5; }
  .variants-hint a { font-weight: 600; }
  /* Before → after preview: a stacked list of state buttons. */
  .ba-list { display: flex; flex-direction: column; gap: 5px; }
  .ba-list button { border: 1px solid var(--btn-border); background: #fff; border-radius: 6px; font-size: 11px;
    padding: 7px 9px; cursor: pointer; color: var(--ink-2); text-align: left; line-height: 1.2; }
  .ba-list button:hover { background: #F5F8FB; }
  .ba-list button.is-on { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 600; }
  .variants.is-collapsed .variants-body { display: none; }

  .spinner { width: 28px; height: 28px; border: 3px solid #D5E3F3; border-top-color: var(--blue);
    border-radius: 50%; margin: 0 auto 14px; animation: spin .8s linear infinite; }

  /* ---- Progressive disclosure — a summary row is always visible; the detail
         opens on demand. Used across the automated-sync views so first entry
         stays light without losing any explanation. State-backed (state.disc)
         so open/closed survives the full re-render. ---- */
  .disc { border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; }
  .disc-sum { display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer; }
  .disc-sum:hover { background: #FAFBFD; }
  .disc-ico { width: 30px; height: 30px; border-radius: 8px; background: #EEF2F7; color: #5B6B7E;

    var repRow = state.repSent
      ? '<div style="margin-top:14px;background:#ECFDF3;border:1px solid #A6E5C3;border-radius:8px;padding:9px 12px;font-size:12.5px;color:#067647;"><span style="font-weight:600;">Sent to your Vector rep.</span> They’ll follow up by email to help you choose — nothing runs in the meantime.</div>'

      + '<div style="font-size:15px;font-weight:600;margin-bottom:4px;">What should happen to users and jobs that aren’t in this file?</div>'
      + '<div style="font-size:13px;color:#5B6B7E;margin-bottom:16px;">This site has ' + TOTAL + ' active users. Your file contains ' + file.rows + ' rows. Both options are off by default — nothing is removed unless you turn it on, and you’ll confirm the exact changes on the next step.</div>'
      + '<div style="display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;">'
      + '<div style="flex:1;min-width:330px;">'
      + optRow(pu, 'togglePurgeUsers', 'Deactivate users not in this file',
          'Any active user missing from the file loses access. Their training history is kept and they reactivate if they appear in a later file. Leave off for partial lists — new hires, one building, one department.')
      + optRow(pj, 'togglePurgeJobs', 'Remove positions &amp; locations not in this file',
          'For users in the file, any position or location they hold that isn’t in the file is removed — so the file becomes the exact record. Leave off to only add what’s new and keep everything else.')
      + '<div style="background:#F5F9FE;border:1px solid #E1E7EE;border-radius:9px;padding:12px 14px;font-size:12.5px;color:#3D4F63;line-height:1.7;">'
      + '<div style="font-weight:600;color:#1B2B3E;margin-bottom:3px;">With these settings</div>'
      + '• ' + (pu ? 'Users missing from your file are <b>deactivated</b>.' : 'Users missing from your file <b>stay active</b>.') + '<br>'
      + '• ' + (pj ? 'Each user’s positions &amp; locations are <b>synced to exactly match</b> the file.' : 'New positions &amp; locations are <b>added</b>; existing ones are <b>kept</b>.')
      + '</div>' + repRow
      + '</div>'
      + '<div style="flex:1;min-width:300px;"><div class="section-eyebrow" style="margin-bottom:10px;">What would change on your site</div>'
      + impactBreakdown()
      + '<div style="margin-top:14px;">' + exJobs + '</div></div>'
      + '</div>'
      + '<div style="display:flex;justify-content:space-between;margin-top:22px;">'
      + '<button class="btn btn--ghost" data-act="back">← Back</button>'
      + '<button class="btn btn--primary" data-act="next">Review changes →</button>'
      + '</div></div>';
  }

  /* Side-by-side "Now in SafeLMS → After you <accept/import/sync>" per changed row.
     Shows the current record, the resulting record, and (as a caption) what the
     file actually provides — so the consequence of accepting is concrete, and
     deactivations read as a loss (red). */
  function beforeAfter(diff, afterLabel, more) {
    var rows = diff.map(function (d) {
      var deact = /Deactivat/i.test(d.result);
      var head = (d.row && d.row !== '—') ? ('Row ' + d.row + ' · ' + d.field) : d.field;
      var sub = deact
        ? 'Missing from this file → loses access immediately · training history kept'
        : (d.incoming && d.incoming !== d.result ? 'From your file: ' + d.incoming : '');
      return '<div class="ba-row">'
        + '<div class="ba-head">' + esc(head) + '</div>'
        + '<div class="ba-grid">'
          + '<div class="ba-card ba-before"><div class="ba-label">Now in SafeLMS</div>'
          + '<div class="ba-val mono">' + esc(d.current) + '</div></div>'
          + '<div class="ba-arrow">→</div>'
          + '<div class="ba-card ba-after' + (deact ? ' is-loss' : '') + '">'
          + '<div class="ba-label">' + esc(afterLabel) + '</div>'
          + '<div class="ba-val mono' + (deact ? ' is-loss-text' : '') + '">' + esc(d.result) + '</div>'
          + (sub ? '<div class="ba-sub' + (deact ? ' is-loss-sub' : '') + '">' + esc(sub) + '</div>' : '')
          + '</div>'
        + '</div></div>';
    }).join('');
    return '<div class="ba">' + rows + (more ? '<div class="ba-more">' + esc(more) + '</div>' : '') + '</div>';
  }

  /* The A→B help tooltip for a review alert (V4). */
  function helpPopover(a) {
    var h = HELP[a.id]; if (!h) return '';
    return '<div class="help-pop">'
      + '<div class="help-pop-head"><span><i class="fa-solid fa-circle-question" aria-hidden="true"></i>What this means &amp; how to fix it</span>'
      + '<button class="help-x" data-act="closeHelp" aria-label="Close">✕</button></div>'
      + '<div class="help-pop-body">'
      + '<div class="hp-means">' + esc(h.means) + '</div>'
      + '<div class="ab-mini">'
      + '<div class="ab-mini-card ab-a"><div class="ab-mini-l">' + esc(h.ab.aLabel) + '</div><div class="ab-mini-v mono">' + esc(h.ab.a) + '</div></div>'
      + '<div class="ab-mini-arrow"><i class="fa-solid fa-arrow-right-long" aria-hidden="true"></i></div>'
      + '<div class="ab-mini-card ab-b"><div class="ab-mini-l">' + esc(h.ab.bLabel) + '</div><div class="ab-mini-v mono">' + esc(h.ab.b) + '</div></div>'
      + '</div>'
      + '<div class="hp-usually"><i class="fa-solid fa-lightbulb" aria-hidden="true"></i>' + esc(h.usually) + '</div>'
      + '<a class="hp-link" href="https://support.vectortrainingeducation.com/s/article/User-Data-File-Upload-Errors" target="_blank" rel="noopener">See all upload errors in Vector Help ↗</a>'
      + '</div></div>';
  }

  function alertHTML(a) {
    var t = TIER[a.tier];
    var acked = !!state.acks[ackKey(a.id)];
    var hasHelp = !!HELP[a.id];
    var helpOpen = state.openHelp === a.id;
    var body = '';

    // Compact: a single one-liner replaces the three laid-out description lines.
    // The full explanation + the A→B "how to fix" example live in the Help tooltip.
    var oneLine = String(a.what).split('. ')[0].replace(/\.$/, '') + '.';
    body += '<div class="alert-line">' + esc(oneLine) + '</div>';

    if (a.compare) {
      body += '<div style="display:flex;border:1px solid #F1C0BB;border-radius:8px;overflow:hidden;font-size:13px;">'
        + '<div style="flex:1;padding:10px 14px;background:#FEF7F6;"><div style="font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#8CA0B4;">Your sign-on sends</div><div class="mono" style="margin-top:4px;">' + esc(a.compare.idp) + '</div></div>'
        + '<div style="width:1px;background:#F1C0BB;"></div>'
        + '<div style="flex:1;padding:10px 14px;background:#FEF7F6;"><div style="font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#8CA0B4;">Your file sends</div><div class="mono" style="margin-top:4px;color:#B42318;">' + esc(a.compare.file) + '</div></div>'
        + '</div>';
    }
    if (a.lines) {
      body += '<div style="background:#F8FAFC;border:1px solid #EDF1F6;border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:5px;">'
        + a.lines.map(function (l) { return '<div class="mono" style="font-size:12.5px;color:#3D4F63;">' + esc(l.t) + '</div>'; }).join('') + '</div>';
    }
    if (a.diff) body += beforeAfter(a.diff, a.tier === 'confirm' ? 'After you accept' : 'After import', a.more);
    if (a.tier === 'confirm') {
      body += '<label style="display:flex;gap:10px;align-items:flex-start;background:#FFFAEB;border:1px solid #F2D69B;border-radius:8px;padding:11px 14px;cursor:pointer;">'
        + '<input type="checkbox" data-act="ack" data-arg="' + a.id + '"' + (acked ? ' checked' : '') + ' style="margin-top:2px;width:15px;height:15px;accent-color:#B54708;">'
        + '<span style="font-size:13px;line-height:1.5;color:#6B4A0A;">' + esc(a.ackLabel) + '</span></label>';
    }
    var btns = [];
    if (a.supportBtn)  btns.push('<button class="btn sm btn--primary" data-act="noop">Contact Vector support</button>');
    if (a.fixMapBtn)   btns.push('<button class="btn sm btn--danger" data-act="fixMapping">Fix column mapping</button>');
    if (a.replaceBtn)  btns.push('<button class="btn sm btn--ghost" data-act="replaceFile">Replace file</button>');
    if (a.settingsBtn) btns.push('<button class="btn sm btn--danger" data-act="changeSettings">Change import settings</button>');
    if (a.repBtn)      btns.push(state.repSent
      ? '<button class="btn sm btn--ghost" data-act="noop" style="color:#067647;border-color:#A6E5C3;">Sent to your Vector rep ✓</button>'
      : '<button class="btn sm btn--outline-blue" data-act="askRep">Not sure? Send to my Vector rep</button>');
    if (btns.length) body += '<div style="display:flex;gap:10px;flex-wrap:wrap;">' + btns.join('') + '</div>';

    return '<div class="alert" style="position:relative;border-color:' + t.border + ';">'
      + '<div class="alert-head" style="background:' + t.headBg + ';">'
      + '<div class="chip" style="background:' + t.chipBg + ';margin-top:1px;"><i class="fa-solid ' + t.icon + '" aria-hidden="true"></i>' + t.chip + '</div>'
      + '<div style="flex:1;"><div class="alert-title" style="color:' + t.titleColor + ';">' + esc(a.title) + '</div>'
      + (a.guardrail ? '<div style="font-size:11.5px;color:#B42318;font-weight:600;margin-top:2px;">Site-wide guardrail — blocked regardless of individual errors</div>' : '')
      + '</div>'
      + (hasHelp ? '<button class="help-btn' + (helpOpen ? ' is-open' : '') + '" data-act="toggleHelp" data-arg="' + a.id + '"><i class="fa-solid fa-circle-question" aria-hidden="true"></i>Help</button>' : '')
      + '</div><div class="alert-body">' + body + '</div>'
      + (helpOpen ? helpPopover(a) : '')
      + '</div>';
  }

  function reviewHTML() {
    var file = FILES.find(function (f) { return f.id === state.fileId; });
    if (state.validating) {
      return '<div class="fadeup"><div class="card" style="padding:48px 20px;text-align:center;">'
        + '<div class="spinner"></div>'
        + '<div style="font-size:14.5px;font-weight:600;">Checking this file against your site…</div>'
        + '<div style="font-size:13px;color:#5B6B7E;margin-top:4px;">Comparing ' + file.rows + ' rows to ' + TOTAL + ' existing users, your sign-on settings, and site configuration. Nothing has been changed yet.</div>'
        + '</div></div>';
    }
    var raw = buildAlerts();
    var alertsHtml = raw.length
      ? raw.map(alertHTML).join('')
      : '<div style="background:#ECFDF3;border:1px solid #A6E5C3;border-radius:10px;padding:16px 18px;font-size:13.5px;color:#067647;"><span style="font-weight:600;">No issues found.</span> Every row checks out against your site and your sign-on settings.</div>';

    // Blocked and escalate ('contact Vector') both hard-stop the import.
    var blocked = raw.filter(function (a) { return a.tier === 'blocked' || a.tier === 'escalate'; });
    var confirms = raw.filter(function (a) { return a.tier === 'confirm'; });
    var acked = confirms.filter(function (a) { return state.acks[ackKey(a.id)]; });
    var canSubmit = !state.validating && blocked.length === 0 && acked.length === confirms.length;
    var sum = summary();

    var side = '<div style="background:#fff;border:1px solid #E1E7EE;border-radius:10px;padding:18px 20px;">'
      + '<div class="kpi-eyebrow">If you run this import</div>'
      + '<div style="font-size:12px;color:#8CA0B4;margin-top:2px;">Compared against ' + TOTAL + ' existing users</div>'
      + '<div style="display:flex;flex-direction:column;gap:8px;margin-top:14px;">'
      + '<div class="kpi-row"><span class="k">New users added</span><span class="v" style="color:#067647;">' + sum.add + '</span></div>'
      + '<div class="kpi-row"><span class="k">Existing users updated</span><span class="v" style="color:#1257B8;">' + sum.mod + '</span></div>'
      + '<div class="kpi-row"><span class="k">Users deactivated</span><span class="v" style="color:' + (sum.deact > 0 ? '#B42318' : '#8CA0B4') + ';">' + sum.deact + '</span></div>'
      + '<div class="kpi-row"><span class="k">Positions/locations added</span><span class="v" style="color:#067647;">' + sum.jobsAdded + '</span></div>'
      + '<div class="kpi-row"><span class="k">Positions/locations removed</span><span class="v" style="color:' + (sum.jobsRemoved > 0 ? '#B42318' : '#8CA0B4') + ';">' + sum.jobsRemoved + '</span></div>'
      + '</div><div class="divider" style="margin:16px 0;"></div>';
    if (blocked.length) {
      side += '<div style="background:#FEF3F2;border:1px solid #F1C0BB;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#B42318;margin-bottom:12px;"><span style="font-weight:700;">'
        + (blocked.length === 1 ? '1 issue' : blocked.length + ' issues') + '</span> must be resolved before this import can run.</div>';
    }
    if (confirms.length && blocked.length === 0) {
      side += '<div style="font-size:12.5px;color:#5B6B7E;margin-bottom:12px;">' + acked.length + ' of ' + confirms.length + ' confirmation' + (confirms.length === 1 ? '' : 's') + ' acknowledged</div>';
    }
    side += '<button class="btn" data-act="runImport" style="width:100%;border:none;background:' + (canSubmit ? '#1257B8' : '#C6D3E1') + ';color:#fff;font-size:14px;font-weight:600;padding:11px 0;border-radius:8px;cursor:' + (canSubmit ? 'pointer' : 'not-allowed') + ';"' + (canSubmit ? '' : ' disabled') + '>Run import</button>'
      + '<div style="font-size:12px;color:#8CA0B4;margin-top:10px;line-height:1.5;">Nothing changes until you run it. Once it runs, it cannot be paused or undone.</div>'
      + '<div class="divider" style="margin:14px 0;"></div>'
      + '<div style="display:flex;flex-direction:column;gap:6px;font-size:13px;">'
      + '<a href="#" data-act="linkUpload">Replace file</a>'
      + (isMap() && !blocked.length ? '<a href="#" data-act="linkMap">Edit column mapping</a>' : '')
      + '<a href="#" data-act="linkSettings">Change import settings</a></div></div>';

    return '<div class="fadeup"><div style="display:flex;gap:20px;align-items:flex-start;">'
      + '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;">' + alertsHtml + '</div>'
      + '<div style="width:290px;flex:0 0 290px;position:sticky;top:0;">' + side + '</div>'
      + '</div></div>';
  }

  function doneHTML() {
    var dc = state.doneCounts || summary();
    return '<div class="fadeup" style="max-width:640px;margin:24px auto;text-align:center;">'
      + '<div style="width:52px;height:52px;border-radius:50%;background:#ECFDF3;border:1.5px solid #A6E5C3;color:#067647;font-size:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">✓</div>'
      + '<div style="font-size:19px;font-weight:700;">Import complete</div>'
      + '<div style="font-size:13.5px;color:#5B6B7E;margin-top:6px;">' + dc.add + ' users added, ' + dc.mod + ' updated, ' + dc.deact + ' deactivated on Ridgewood Public Schools — Staff.</div>'
      + '<div style="background:#fff;border:1px solid #E1E7EE;border-radius:10px;padding:14px 18px;margin:18px 0;font-size:13px;color:#5B6B7E;text-align:left;">A confirmation with the full change log was emailed to <span style="font-weight:600;color:#1B2B3E;">vpollock@ridgewood.k12.us</span>. You can also download it from the import history at any time.</div>'
      + '<div style="display:flex;gap:10px;justify-content:center;">'
      + '<button class="btn btn--ghost" data-act="restart">Start another import</button>'
      + '<button class="btn btn--primary" data-act="goSync">View automated sync</button></div></div>';
  }

  /* Manual-import walkthrough / overview. Full card frames what a manual import
     is (SafeLMS "pencil banner" pattern); compact strip is the persistent form. */
  function walkthroughHTML() {
    return '<div class="wt-card">'
      + '<div class="wt-icon"><i class="fa-solid fa-circle-info" aria-hidden="true"></i></div>'
      + '<div style="flex:1;min-width:0;"><div class="wt-title">Manual import</div>'
      + '<div class="wt-body">Upload a file to add, update, deactivate, or remove users on this site. Best for one-off changes — a new-hire batch, one building’s roster, year-end cleanup. Nothing changes until you review the exact changes and run it.</div>'
      + '<div class="wt-link"><a href="#" data-act="goSyncTab">Automated sync is already set up for this site — see its recent runs →</a></div>'
      + '</div></div>';
  }

  /* ===================================================================
     ATTENTION-NEEDED STEP — shared content, two severities that read by COLOR:
       fixable (AMBER) — the customer corrects the file and re-uploads.
       escalate (RED)  — the file can't fix it; Vector's team steps in.
     Red is reserved for "we take it from here." Each version renders this content
     with a DIFFERENT treatment; V1's treatment is inline "alert mode".
     =================================================================== */
  var ATTN_HELP_URL = 'https://support.vectortrainingeducation.com/s/article/User-Data-File-Upload-Errors';
  var ATTN = {
    fixable: { sev: 'fixable', badge: 'One thing to fix first', icon: 'fa-triangle-exclamation',
      title: 'Two rows look like the same person, entered twice',
      ctx: 'Rows 34 and 91 use two different usernames but the same email address — almost always one person added once by HR and once by athletics.',
      aL: 'Two rows, one email', aV: 'jsmith + john.smith', bL: 'Keep just one', bV: 'jsmith',
      lead: 'You can fix this one yourself.',
      how: 'Keep the username that already exists on your site, remove the other row, and upload the file again. Two accounts sharing an email can’t sign in reliably.',
      actLabel: 'Fix it & upload again', actAct: 'replaceFile' },
    escalate: { sev: 'escalate', badge: 'Our team takes it from here', icon: 'fa-headset',
      title: 'Two accounts on your site already share one email',
      ctx: 'cdelgado and c.delgado are two separate accounts that already both use cdelgado@ridgewood.k12.us. Your file can’t fix this — the duplicate is on the site, not in your file.',
      aL: 'On your site now', aV: 'cdelgado + c.delgado', bL: 'After Vector merges', bV: 'one account · history kept',
      lead: 'This one isn’t something your file can fix.',
      how: 'Only Vector can merge two accounts that already exist. Send it over and we’ll take care of it — your import picks up right where it left off once the merge is done.',
      actLabel: 'Send to Vector — we’ll take it from here', actAct: 'attnSend' }
  };
  function attnColors(sev) {
    return sev === 'fixable'
      ? { bg: '#FFFAEB', bd: '#F2D69B', fg: '#8A5A0B', btn: '#B54708' }
      : { bg: '#FEF3F2', bd: '#F1C0BB', fg: '#B42318', btn: '#B42318' };
  }
  function attnAB(a) {
    return '<div style="display:grid;grid-template-columns:1fr 30px 1fr;align-items:stretch;margin-top:18px;">'
      + '<div style="border:1px solid #F1C0BB;background:#FEF7F6;border-radius:9px;padding:12px 14px;"><div style="font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#8CA0B4;">' + esc(a.aL) + '</div><div class="mono" style="font-size:13.5px;color:#B42318;margin-top:5px;">' + esc(a.aV) + '</div></div>'
      + '<div style="display:flex;align-items:center;justify-content:center;color:#8CA0B4;"><i class="fa-solid fa-arrow-right-long" aria-hidden="true"></i></div>'
      + '<div style="border:1px solid #A6E5C3;background:#F0FBF5;border-radius:9px;padding:12px 14px;"><div style="font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#8CA0B4;">' + esc(a.bL) + '</div><div class="mono" style="font-size:13.5px;color:#067647;margin-top:5px;">' + esc(a.bV) + '</div></div>'
      + '</div>';
  }
  function attnActionRow(a, amber, c) {
    if (!amber && state.attnSent) {
      return '<div style="margin-top:18px;background:#ECFDF3;border:1px solid #A6E5C3;border-radius:10px;padding:13px 16px;font-size:13px;color:#067647;line-height:1.55;"><b><i class="fa-solid fa-circle-check" aria-hidden="true"></i> Sent to Vector — ref CARE-5573.</b> Your implementation team will merge the two accounts and email you when it’s done. Nothing else needed from you.</div>';
    }
    return '<div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;">'
      + '<button class="btn" data-act="' + a.actAct + '" style="background:' + c.btn + ';color:#fff;">' + esc(a.actLabel) + '</button>'
      + (amber ? '<a class="btn btn--ghost" href="' + ATTN_HELP_URL + '" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;text-decoration:none;">See upload-error help ↗</a>' : '')
      + '</div>';
  }

  /* V1 treatment — ALERT MODE (inline): the attention step stays in the flow but
     flips to a distinct colored card (amber = you fix it, red = Vector's team). */
  function attnAlertMode() {
    var a = ATTN[state.attnSev] || ATTN.fixable, amber = a.sev === 'fixable', c = attnColors(a.sev);
    return '<section data-screen-label="Attention — ' + (amber ? 'you can fix it' : 'Vector’s team') + '">'
      + '<div style="max-width:720px;">'
      + '<a href="#" class="sync-back" data-act="restart" style="margin-bottom:14px;"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Start over with a new file</a>'
      + '<div style="border:1.5px solid ' + c.bd + ';border-radius:14px;overflow:hidden;box-shadow:0 6px 22px -14px rgba(16,24,40,.4);">'
      + '<div style="background:' + c.bg + ';color:' + c.fg + ';padding:11px 18px;font-size:12.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:10px;">'
      + '<span style="width:26px;height:26px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;"><i class="fa-solid ' + a.icon + '" aria-hidden="true"></i></span>' + esc(a.badge) + '</div>'
      + '<div style="padding:18px 20px 20px;background:#fff;">'
      + '<div style="font-size:20px;font-weight:700;">' + esc(a.title) + '</div>'
      + '<div style="font-size:14px;color:#5B6B7E;margin-top:8px;line-height:1.6;">' + esc(a.ctx) + '</div>'
      + attnAB(a)
      + '<div style="margin-top:18px;background:' + c.bg + ';border:1px solid ' + c.bd + ';border-radius:10px;padding:13px 15px;"><div style="font-weight:700;color:' + c.fg + ';font-size:13px;margin-bottom:4px;">' + esc(a.lead) + '</div><div style="font-size:13px;color:#3D4F63;line-height:1.6;">' + esc(a.how) + '</div></div>'
      + attnActionRow(a, amber, c)
      + '</div></div></div></section>';
  }

  function importTab() {
    if (state.step === 'attn') return attnAlertMode();
    var body;
    switch (state.step) {
      case 'upload':   body = uploadHTML(); break;
      case 'map':      body = mapHTML(); break;
      case 'settings': body = settingsHTML(); break;
      case 'review':   body = reviewHTML(); break;
      case 'done':     body = doneHTML(); break;
      default:         body = uploadHTML();
    }
    var stepper = state.step !== 'done' ? stepperHTML() : '';
    // The manual import always leads with the walkthrough card on the Upload landing.
    var wt = (state.step === 'upload') ? walkthroughHTML() : '';
    return '<section data-screen-label="Manual import">' + wt + stepper + body + '</section>';
  }

  /* One compact strip that NAMES the current sync state, shown above any detail so
     the customer always knows which state they’re looking at. */
  function syncStatus(bg, col, ico, title, sub) {
    return '<div class="sync-status">'
      + '<div class="ss-badge" style="background:' + bg + ';color:' + col + ';"><i class="fa-solid ' + ico + '" aria-hidden="true"></i></div>'
      + '<div class="ss-main"><div class="ss-eyebrow">Automated sync</div>'
      + '<div class="ss-title">' + title + '</div>'
      + '<div class="ss-sub">' + sub + '</div></div></div>';
  }
  function syncStatusHeader() {
    var st = stage();
    if (st === 'active-healthy') {
      return syncStatus('#ECFDF3', '#067647', 'fa-circle-check', 'Up to date',
        'Last import today 6:42 AM · next check within 30 minutes. Nothing needs you.');
    }
    if (st === 'active-failed' && state.blessed) {
      return syncStatus('#ECFDF3', '#067647', 'fa-circle-check', 'Up to date',
        'You applied the waiting changes just now — your roster is current.');
    }
    return '';   // active-failed (unresolved) leads with the failure card itself
  }

  /* Compact sync status banner shown on the manual-import landing. It is the only
     automated-sync presence on the main page — one line: all-clean, needs-
     attention, or (earn-it) progress toward unlocking. Click opens the deeper page. */
  function syncBanner() {
    var st = stage(), tone, icon, text, cta = 'View';
    if (st === 'active-failed' && !state.blessed) {
      tone = 'warn'; icon = 'fa-triangle-exclamation';
      text = 'Automated sync needs attention — 1 file stopped this morning.';
      cta = 'Review';
    } else {
      tone = 'ok'; icon = 'fa-circle-check';
      text = 'Automated sync is on — everything’s clean. Last import today 6:42 AM.';
      cta = 'Manage';
    }
    var c = tone === 'ok' ? { bg: '#ECFDF3', bd: '#A6E5C3', fg: '#067647' }
      : tone === 'warn' ? { bg: '#FFFAEB', bd: '#F2D69B', fg: '#8A5A0B' }
      : { bg: '#EEF2F7', bd: '#DCE3EC', fg: '#5B6B7E' };
    return '<div class="sync-banner" data-act="openSync" style="background:' + c.bg + ';border:1px solid ' + c.bd + ';">'
      + '<span class="sb-ico" style="color:' + c.fg + ';"><i class="fa-solid ' + icon + '" aria-hidden="true"></i></span>'
      + '<span class="sb-text" style="color:' + c.fg + ';">' + text + '</span>'
      + '<span class="sb-cta" style="color:' + c.fg + ';">' + cta + ' <i class="fa-solid fa-chevron-right" aria-hidden="true" style="font-size:10px;"></i></span>'
      + '</div>';
  }

  /* Progressive-disclosure row — summary always visible, detail on demand. */
  function disc(id, ico, title, sub, detailHTML) {
    var open = !!state.disc[id];
    return '<div class="disc' + (open ? ' is-open' : '') + '">'
      + '<div class="disc-sum" data-act="toggleDisc" data-arg="' + id + '">'
      + '<div class="disc-ico"><i class="fa-solid ' + ico + '" aria-hidden="true"></i></div>'
      + '<div class="disc-tt"><div class="dt">' + title + '</div>'
      + (sub ? '<div class="ds">' + sub + '</div>' : '') + '</div>'
      + '<div class="disc-chev"><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></div></div>'
      + (open ? '<div class="disc-body"><div class="disc-body-inner">' + detailHTML + '</div></div>' : '')
      + '</div>';
  }

  /* The sync decision, summary-first: a clear tier chip + headline + one-line
     summary + the primary actions stay visible; the fuller explanation and the
     row-level data collapse behind a single expander — less to read on first
     entry, nothing lost. Chip carries severity by shape (WCAG 1.4.1). */
  function syncFailureCard() {
    var sc = SYNC_FAILS[syncScenario()] || SYNC_FAILS.confirm;
    var t = TIER[sc.tier];
    var lines = sc.lines.map(function (l) {
      return '<div class="alert-line"><b>' + esc(l[0]) + ' — </b>' + esc(l[1]) + '</div>';
    }).join('');
    var box = sc.rows
      ? '<div style="background:#F8FAFC;border:1px solid #EDF1F6;border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:5px;">'
        + sc.rows.map(function (r) { return '<div class="mono" style="font-size:12.5px;color:#3D4F63;">' + esc(r) + '</div>'; }).join('')
        + '</div>'
      : '';
    var diff = sc.diff ? beforeAfter(sc.diff, sc.diffLabel, sc.more) : '';
    var foot = sc.foot ? '<div style="font-size:12.5px;color:#8CA0B4;">' + esc(sc.foot) + '</div>' : '';
    var detail = '<div style="display:flex;flex-direction:column;gap:10px;">' + lines + box + diff + foot + '</div>';
    var btns = sc.buttons.map(function (b) {
      return '<button class="btn sm ' + b.cls + '" data-act="' + b.act + '">' + esc(b.label) + '</button>';
    }).join('');
    return '<div class="card" style="border-color:' + t.border + ';overflow:hidden;">'
      + '<div style="background:' + t.headBg + ';padding:14px 18px;display:flex;gap:12px;align-items:flex-start;">'
      + '<div class="chip" style="background:' + t.chipBg + ';margin-top:1px;"><i class="fa-solid ' + t.icon + '" aria-hidden="true"></i>' + t.chip + '</div>'
      + '<div><div style="font-size:14.5px;font-weight:600;color:' + t.titleColor + ';">' + esc(sc.title) + '</div>'
      + '<div style="font-size:12.5px;color:' + t.titleColor + ';opacity:.75;margin-top:3px;">' + esc(sc.meta) + '</div></div></div>'
      + '<div style="padding:16px 18px;display:flex;flex-direction:column;gap:12px;">'
      + '<div style="font-size:13.5px;color:#3D4F63;line-height:1.6;">' + esc(sc.summary) + '</div>'
      + '<div style="display:flex;gap:10px;flex-wrap:wrap;">' + btns + '</div>'
      + disc('syncfail-detail', 'fa-list-ul', sc.detailLabel || 'See the details', 'What happened, and the exact rows affected', detail)
      + '</div></div>';
  }

  /* Locked automated sync (stage 'qualifying'). The progress tracker is the hero;
     the how-it-works explanation and the run history collapse behind expanders so
     first entry is light. Returns the inner column only — syncTab() adds the
     state-naming header above it. */
  function lockedBody() {
    var d = syncDone(), toGo = SYNC_GATE - d, done = d >= SYNC_GATE;
    var segs = '';
    for (var i = 0; i < SYNC_GATE; i++) {
      segs += '<div style="flex:1;height:9px;border-radius:5px;background:' + (i < d ? '#12B76A' : '#E1E7EE') + ';"></div>';
    }
    var runs = [];
    if (done) runs.push({ mark: '✓', bg: '#12B76A', label: 'Clean import — 1 added, 5 updated', sub: 'Streak 4 of ' + SYNC_GATE + ' · unlocked automation', date: 'Today' });
    runs.push(
      { mark: '✓', bg: '#12B76A', label: 'Clean import — 2 added, 14 updated', sub: 'Streak 3 of ' + SYNC_GATE + (done ? '' : ' · one more unlocks automation'), date: 'Aug 28' },
      { mark: '✓', bg: '#12B76A', label: 'Clean import — 0 added, 9 updated',  sub: 'Streak 2 of ' + SYNC_GATE, date: 'Aug 21' },
      { mark: '✓', bg: '#12B76A', label: 'Clean import — 1 added, 6 updated',  sub: 'Streak 1 of ' + SYNC_GATE, date: 'Aug 14' },
      { mark: '✕', bg: '#D92D20', label: 'Import had errors — file arrived as .xlsx instead of .csv', sub: 'Streak reset — any error starts the count over', date: 'Aug 5' }
    );
    var runsHtml = runs.map(function (q) {
      return '<div style="display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-top:1px solid #F3F6FA;">'
        + '<div style="width:20px;height:20px;border-radius:50%;background:' + q.bg + ';color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex:0 0 20px;margin-top:1px;">' + q.mark + '</div>'
        + '<div style="flex:1;"><div style="font-size:12.5px;color:#1B2B3E;">' + esc(q.label) + '</div>'
        + '<div style="font-size:11.5px;color:#8CA0B4;margin-top:1px;">' + esc(q.sub) + '</div></div>'
        + '<div style="color:#8CA0B4;font-size:12px;white-space:nowrap;">' + q.date + '</div></div>';
    }).join('');
    runsHtml = runsHtml.replace('border-top:1px solid #F3F6FA;', 'border-top:0;');

    // Just unlocked — the 4th clean import came in.
    if (done) {
      var celebrate = '<div class="card" style="padding:24px 22px;text-align:center;">'
        + '<div style="width:54px;height:54px;border-radius:50%;background:#ECFDF3;border:1.5px solid #A6E5C3;color:#067647;font-size:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;"><i class="fa-solid fa-unlock" aria-hidden="true"></i></div>'
        + '<div style="font-size:19px;font-weight:800;">Automated sync is unlocked</div>'
        + '<div style="font-size:13px;color:#5B6B7E;margin:7px auto 0;max-width:430px;line-height:1.55;">Your 4th clean import just came in. SafeLMS will import your roster from SFTP automatically from now on — no manual upload.</div>'
        + '<div style="display:flex;gap:6px;max-width:380px;margin:18px auto 6px;">' + segs + '</div>'
        + '<div style="font-size:12px;color:#8CA0B4;">' + SYNC_GATE + ' of ' + SYNC_GATE + ' clean imports</div>'
        + '<div style="margin-top:18px;"><button class="btn btn--primary" data-act="setSync" data-arg="running">See it running →</button></div>'
        + '</div>';
      return celebrate + disc('locked-runs', 'fa-clock-rotate-left', 'Your recent imports', 'Latest: today', runsHtml);
    }

    var howDetail = 'Automated sync drops your roster file on your SFTP folder and SafeLMS imports it for you — no manual upload. '
      + 'Keep the format, columns, and file-name pattern identical each time; an import with any error resets the streak to zero.';

    var progress = '<div class="card" style="padding:20px 22px;">'
      + '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;">'
      + '<div style="font-size:14px;font-weight:700;">' + d + ' of ' + SYNC_GATE + ' clean imports</div>'
      + '<div style="font-size:12px;font-weight:700;color:#8A5A0B;background:#FFFAEB;border:1px solid #F2D69B;border-radius:6px;padding:5px 11px;white-space:nowrap;">' + toGo + ' to go</div></div>'
      + '<div style="display:flex;gap:6px;">' + segs + '</div>'
      + '<div style="font-size:12.5px;color:#5B6B7E;margin-top:12px;line-height:1.55;">Automated sync imports your roster for you once you’ve had <b>' + SYNC_GATE + ' clean manual imports in a row</b> — ' + toGo + ' more to go.</div>'
      + '<div style="display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap;">'
      + '<button class="btn btn--primary" data-act="goImport">Run a manual import →</button>'
      + '<span style="font-size:12px;color:#8CA0B4;">Unlocks after your ' + ordinal(SYNC_GATE) + ' clean import</span>'
      + '</div></div>';

    return progress
      + disc('locked-how', 'fa-circle-info', 'How automated sync works', 'Imports from SFTP · turns on after ' + SYNC_GATE + ' clean imports', howDetail)
      + disc('locked-runs', 'fa-clock-rotate-left', 'Your recent imports', 'Last checked Aug 19', runsHtml);
  }

  /* Automated sync — single, calm column. It leads with the state-naming header
     (or the failure card when a decision is waiting); the recent activity, the
     how-it-works, and the notification settings all collapse into expanders, so
     first entry is light while every explanation stays one click away. */
  function syncTab() {
    var st = stage();
    var qualifying = st === 'qualifying' || st === 'unlocked';   // both use the locked/progress view
    var failed = st === 'active-failed';
    var showFailure = failed && !state.blessed;
    var showResolved = failed && state.blessed;
    var healthy = st === 'active-healthy';

    var col = '';
    if (qualifying) {
      col = lockedBody();
    } else {
      if (showFailure) col += syncFailureCard();

      // Recent activity — collapsed; the summary line carries the latest event.
      var activity = (showResolved || healthy) ? [
        { label: 'ridgewood_staff_20260901.csv — imported' + (showResolved ? ' after your confirmation (2 added, 41 updated, 8 names)' : ''), when: showResolved ? 'Today, just now' : 'Today, 6:42 AM', dot: '#12B76A' },
        { label: 'ridgewood_staff_20260831.csv — imported (0 added, 6 updated)', when: 'Aug 31, 6:38 AM', dot: '#12B76A' },
        { label: 'ridgewood_staff_20260830.csv — imported (1 added, 3 updated)', when: 'Aug 30, 6:45 AM', dot: '#12B76A' },
        { label: 'ridgewood_staff_20260829.csv — imported (0 added, 11 updated)', when: 'Aug 29, 6:33 AM', dot: '#12B76A' }
      ] : [
        { label: 'ridgewood_staff_20260901.csv — stopped, waiting for your review', when: 'Today, 7:04 AM', dot: '#D92D20' },
        { label: 'ridgewood_staff_20260831.csv — imported (0 added, 6 updated)', when: 'Aug 31, 6:38 AM', dot: '#12B76A' },
        { label: 'ridgewood_staff_20260830.csv — imported (1 added, 3 updated)', when: 'Aug 30, 6:45 AM', dot: '#12B76A' },
        { label: 'ridgewood_staff_20260829.csv — imported (0 added, 11 updated)', when: 'Aug 29, 6:33 AM', dot: '#12B76A' }
      ];
      var actRows = activity.map(function (ev, i) {
        return '<div style="display:flex;align-items:center;gap:12px;padding:9px 0;' + (i ? 'border-top:1px solid #F3F6FA;' : '') + '">'
          + '<div style="width:9px;height:9px;border-radius:50%;background:' + ev.dot + ';flex:0 0 9px;"></div>'
          + '<div style="flex:1;font-size:12.5px;">' + esc(ev.label) + '</div>'
          + '<div style="font-size:12px;color:#8CA0B4;white-space:nowrap;">' + ev.when + '</div></div>';
      }).join('');
      col += disc('sync-activity', 'fa-clock-rotate-left', 'Recent sync activity',
        (showFailure ? '1 file waiting · last clean import Aug 31' : 'Last import ' + activity[0].when.toLowerCase()), actRows);

      // How your sync works — collapsed.
      var howDetail = 'SafeLMS checks your SFTP folder every 30 minutes for a file matching '
        + '<span class="mono" style="font-size:12px;background:#F0F4F9;padding:1px 5px;border-radius:4px;">ridgewood_staff_*.csv</span>. '
        + 'Keep the format, columns, and file-name pattern the same — changing any of them will stop the sync.';
      col += disc('sync-how', 'fa-circle-info', 'How your sync works', 'Checks SFTP every 30 min for ridgewood_staff_*.csv', howDetail);

      // Notifications — collapsed; the recipient editor + toggles live inside.
      var recips = state.recipients.map(function (r, i) {
        var initials = r.name.split(' ').map(function (w) { return w[0]; }).join('');
        return '<div style="display:flex;align-items:center;gap:10px;border:1px solid #EDF1F6;border-radius:8px;padding:8px 10px;">'
          + '<div style="width:28px;height:28px;border-radius:50%;background:#DCE7F2;color:#0E2A43;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 28px;">' + esc(initials) + '</div>'
          + '<div style="flex:1;min-width:0;"><div style="font-size:13px;font-weight:600;">' + esc(r.name) + '</div>'
          + '<div style="font-size:11.5px;color:#8CA0B4;">' + esc(r.role) + '</div></div>'
          + '<div data-act="removeRecip" data-arg="' + i + '" style="font-size:15px;color:#8CA0B4;cursor:pointer;padding:0 2px;">×</div></div>';
      }).join('');
      var notifDetail = '<div style="font-size:12.5px;color:#5B6B7E;margin-bottom:10px;line-height:1.5;">When a sync fails or needs confirmation, these people are emailed directly — not just whoever logs in next. They don’t need permission to run imports; the person who should know a sync broke often isn’t the one who runs it.</div>'
        + '<div style="display:flex;flex-direction:column;gap:8px;">' + recips + '</div>'
        + '<div style="display:flex;gap:8px;margin-top:10px;">'
        + '<input id="recipInput" placeholder="Add by email…" style="flex:1;min-width:0;padding:7px 10px;border:1px solid #C6D3E1;border-radius:7px;font-size:12.5px;">'
        + '<button class="btn sm btn--outline-blue" data-act="addRecip" style="padding:7px 12px;font-size:12.5px;">Add</button></div>'
        + '<div class="divider" style="margin:14px 0;"></div>'
        + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><span style="font-size:13px;color:#3D4F63;">Email when a sync needs attention</span>'
        + '<div class="toggle" data-act="toggleFail" style="background:' + (state.notifyFail ? '#12B76A' : '#C6D3E1') + ';"><div class="toggle-knob" style="left:' + (state.notifyFail ? '17px' : '2px') + ';"></div></div></div>'
        + '<div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:13px;color:#3D4F63;">Email a summary after each successful sync</span>'
        + '<div class="toggle" data-act="toggleSuccess" style="background:' + (state.notifySuccess ? '#12B76A' : '#C6D3E1') + ';"><div class="toggle-knob" style="left:' + (state.notifySuccess ? '17px' : '2px') + ';"></div></div></div>';
      col += disc('sync-notif', 'fa-bell', 'Notifications',
        state.recipients.length + ' ' + (state.recipients.length === 1 ? 'person' : 'people') + ' emailed when a sync needs attention', notifDetail);
    }

    var label = st === 'qualifying' ? 'Automated sync — not available yet' : st === 'unlocked' ? 'Automated sync — just unlocked' : 'Automated sync';
    return '<section data-screen-label="' + label + '">'
      + '<div style="display:flex;flex-direction:column;gap:12px;">'
      + syncStatusHeader() + col + '</div></section>';
  }

  var EMP_BACK = '<div class="sync-back" data-act="goEmployees"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to employees</div>';

  function render() {
    var main;
    if (state.view === 'employees') {
      // The Employees-tab landing: the list + this version's entry point.
      main = employeesLanding();
    } else if (state.view === 'sync') {
      // Automated-sync detail, reached from the import banner (sync is already set up).
      main = '<div class="content">'
        + '<div class="sync-back" data-act="backToImport"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to import</div>'
        + '<div style="font-size:20px;font-weight:700;">Automated sync</div>'
        + '<div style="font-size:13px;color:#5B6B7E;margin:2px 0 18px;">Vector has set up an automated roster sync for your site — it imports from SFTP on a schedule. Run a manual import any time from Employees.</div>'
        + syncTab() + '</div>';
    } else {
      // The bulk-import flow (launched from the Employees entry point). A compact
      // "automated sync is on" banner sits on the upload landing.
      var banner = (state.step === 'upload') ? syncBanner() : '';
      main = '<div class="content">' + EMP_BACK + banner + importTab() + '</div>';
    }

    $app.innerHTML = variantsPanel()
      + '<div class="app">' + sidebar()
      + '<div class="main">' + topbar() + settingsTabsBar() + '<div class="scroll">' + main + '</div></div></div>'
      + (state.fileModal ? fileModalHTML() : '')
      + (state.addEmp ? addEmployeeModal(false) : '');
  }

  /* -------------------------------------------------------------- interaction */
  function scrollTop() {
    var s = $app.querySelector('.scroll');
    if (s) s.scrollTop = 0;
    window.scrollTo(0, 0);
  }

  // Version B has no sync tab — "go to sync" scrolls to the stacked section instead.
  function scrollToSync(where) {
    var s = $app.querySelector('.scroll');
    if (!s) return;
    if (where === 'autosync') {
      var el = document.getElementById('autosync');
      if (el) { s.scrollTop = Math.max(0, el.offsetTop - 12); return; }
    }
    s.scrollTop = 0;
  }

  $app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var arg = el.getAttribute('data-arg');

    switch (act) {
      case 'noop': e.preventDefault(); break;
      /* Employees-tab entry points */
      case 'goEmployees': e.preventDefault(); setState({ view: 'employees', addEmp: false }); scrollTop(); break;
      case 'addSingle': e.preventDefault(); setState({ addEmp: true, empMode: 'single' }); break;
      case 'closeAddEmp': setState({ addEmp: false }); break;
      case 'empMode': setState({ empMode: arg }); break;
      case 'goBulk': e.preventDefault(); setState({ view: 'import', step: 'upload', fileId: null, addEmp: false, validating: false }); scrollTop(); break;
      case 'goImport':
        e.preventDefault(); setState({ view: 'import', step: 'upload', fileId: null, validating: false }); scrollTop(); break;
      case 'backToImport':
        e.preventDefault(); setState({ view: 'import' }); scrollTop(); break;
      case 'goSyncTab': case 'goSync': case 'openSync':
        e.preventDefault(); setState({ view: 'sync' }); scrollTop(); break;
      case 'pickFile': pickFile(arg); scrollTop(); break;
      case 'openFiles': e.preventDefault(); setState({ fileModal: true }); break;
      case 'closeFiles': setState({ fileModal: false }); break;
      case 'back': go(flow()[Math.max(0, flow().indexOf(state.step) - 1)]); scrollTop(); break;
      case 'next': go(flow()[Math.min(flow().length - 1, flow().indexOf(state.step) + 1)]); scrollTop(); break;
      case 'togglePurgeUsers': setState({ purgeUsers: !state.purgeUsers }); break;
      case 'togglePurgeJobs': setState({ purgeJobs: !state.purgeJobs }); break;
      case 'askRep': e.preventDefault(); setState({ repSent: true }); break;
      case 'fixMapping': go('map'); scrollTop(); break;
      case 'replaceFile': setState({ fileId: null, step: 'upload' }); scrollTop(); break;
      case 'changeSettings': go('settings'); scrollTop(); break;
      case 'runImport': setState({ doneCounts: summary(), step: 'done' }); scrollTop(); break;
      case 'restart': setState({ fileId: null, step: 'upload', acks: {}, purgeUsers: false, purgeJobs: false, repSent: false }); scrollTop(); break;
      case 'bless': setState({ blessed: true }); break;
      case 'linkUpload': e.preventDefault(); setState({ fileId: null, step: 'upload' }); scrollTop(); break;
      case 'linkMap': e.preventDefault(); go('map'); scrollTop(); break;
      case 'linkSettings': e.preventDefault(); go('settings'); scrollTop(); break;
      case 'removeRecip': setState({ recipients: state.recipients.filter(function (_, j) { return j !== +arg; }) }); break;
      case 'addRecip': {
        var inp = document.getElementById('recipInput');
        var v = inp && inp.value.trim();
        if (v) setState({ recipients: state.recipients.concat([{ name: v.split('@')[0], role: v }]) });
        break;
      }
      case 'toggleFail': setState({ notifyFail: !state.notifyFail }); break;
      case 'toggleSuccess': setState({ notifySuccess: !state.notifySuccess }); break;
      case 'toggleHelp': e.preventDefault(); setState({ openHelp: state.openHelp === arg ? null : arg }); break;
      case 'closeHelp': e.preventDefault(); setState({ openHelp: null }); break;
      case 'toggleDisc': {
        var d = {}; for (var dk in state.disc) d[dk] = state.disc[dk];
        d[arg] = !d[arg]; setState({ disc: d });
        break;
      }
      case 'toggleVariants': setState({ variantsCollapsed: !state.variantsCollapsed }); break;
      case 'attnSend': e.preventDefault(); setState({ attnSent: true }); break;
      case 'setSync': {
        e.preventDefault();
        var sv = {}; for (var sk in state.variants) sv[sk] = state.variants[sk];
        var m = { locked: 'qualifying', unlocked: 'unlocked', running: 'active-healthy', alert: 'active-failed' };
        sv.automationStage = m[arg] || 'qualifying';
        setState({ variants: sv, blessed: false });
        break;
      }
      case 'setVariant': {
        var parts = arg.split(':'), key = parts[0], val = parts[1];
        var vs = {}; for (var k in state.variants) vs[k] = state.variants[k]; vs[key] = val;
        var patch = { variants: vs };
        if (key === 'startTab') patch.tab = val;
        if (key === 'uploadVariant') { patch.fileId = null; patch.step = 'upload'; patch.acks = {}; }
        if (key === 'automationStage' || key === 'syncScenario') patch.blessed = false;
        setState(patch);
        break;
      }
    }
  });

  $app.addEventListener('change', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'mapChange') {
      var m = {}; for (var k in state.mapping) m[k] = state.mapping[k];
      m[el.getAttribute('data-arg')] = el.value;
      setState({ mapping: m });
    } else if (act === 'ack') {
      var id = el.getAttribute('data-arg');
      var a = {}; for (var kk in state.acks) a[kk] = state.acks[kk];
      var key = ackKey(id); a[key] = !a[key];
      setState({ acks: a });
    }
  });

  /* --------------------------------------------- Design Toolbox flow-map host */
  function setSyncState(stg, scn) {
    var v = {}; for (var k in state.variants) v[k] = state.variants[k];
    v.automationStage = stg;
    if (scn) v.syncScenario = scn;
    setState({ tab: 'sync', view: 'sync', blessed: false, variants: v });
  }

  function reviewFor(fileId, pu, pj) {
    setState({ tab: 'import', view: 'import', fileId: fileId, mapping: defaultMapping(fileId),
      purgeUsers: !!pu, purgeJobs: !!pj, repSent: false, acks: {}, step: 'review', validating: false });
  }

  function applyFlowState(id) {
    switch (id) {
      case 'employees': setState({ view: 'employees', addEmp: false }); break;
      case 'upload': setState({ tab: 'import', view: 'import', step: 'upload', fileId: null, validating: false }); break;
      case 'map': setState({ tab: 'import', view: 'import', fileId: 'saml', mapping: defaultMapping('saml'), purgeUsers: false, purgeJobs: false, acks: {}, step: 'map', validating: false }); break;
      case 'settings': setState({ tab: 'import', view: 'import', fileId: 'confirm', mapping: defaultMapping('confirm'), purgeUsers: false, purgeJobs: false, repSent: false, acks: {}, step: 'settings', validating: false }); break;
      /* Manual import — one node per severity path */
      case 'review-info':     reviewFor('clean', false, false); break;  // INFO only — runs freely
      case 'review-confirm':  reviewFor('confirm', true, true); break;  // CONFIRM ×3 (+ info) — name change, deactivations, job removals
      case 'review-blocked':  reviewFor('blast', false, false); break;  // BLOCKED — blast radius
      case 'review-saml':     reviewFor('saml', false, false); break;   // BLOCKED — SAML mismatch
      case 'review-escalate': reviewFor('dupes', false, false); break;  // BLOCKED ×2 + CONTACT VECTOR
      case 'done': setState({ tab: 'import', view: 'import', fileId: 'confirm', doneCounts: summaryFor('confirm', false, false), step: 'done', validating: false }); break;
      /* Attention-needed step (V1 treatment = inline alert mode) */
      case 'attn-fixable':  setState({ tab: 'import', view: 'import', step: 'attn', attnSev: 'fixable', attnSent: false }); break;   // AMBER — you fix it
      case 'attn-escalate': setState({ tab: 'import', view: 'import', step: 'attn', attnSev: 'escalate', attnSent: false }); break; // RED — Vector's team
      /* Automated sync — already set up; one node per severity path */
      case 'sync-healthy':  setSyncState('active-healthy', null); break;      // INFO — up to date
      case 'sync-failed':   setSyncState('active-failed', 'confirm'); break;  // CONFIRM — approve changes
      case 'sync-blocked':  setSyncState('active-failed', 'blocked'); break;  // BLOCKED — fix at source
      case 'sync-escalate': setSyncState('active-failed', 'escalate'); break; // CONTACT VECTOR
      default: break;
    }
    scrollTop();
  }
  window.applyFlowState = applyFlowState;

  function bootFromHash() {
    var m = (location.hash || '').match(/fm=([\w-]+)/);
    if (m) { try { applyFlowState(decodeURIComponent(m[1])); } catch (e) {} }
  }
  window.addEventListener('hashchange', bootFromHash);

  window.TOOLBOX_CONFIG = {
    flowMap: {
      title: 'Bulk User Import · V1 (Employees tab · split buttons) — Flow Map',
      applyState: 'applyFlowState',
      canvas: { w: 1680, h: 1300 },
      flows: [

          lane: { x: 20, y: 20, w: 1640, h: 790 }, labelXY: { x: 40, y: 46 } },
        { id: 'sync', name: 'Automated sync — severity paths', pill: 'B', color: '#c9b8f0',
          lane: { x: 20, y: 850, w: 1640, h: 420 }, labelXY: { x: 40, y: 876 } }
      ],
      nodes: [
        /* ── Manual import: wizard on the left, then one branch per severity ──
           Row 1 (y60): Info → Confirm → Done.  Row 2 (y420): the three stops. ── */
        { id: 'employees', flow: 'import', entry: true, x: 40, y: 250, step: 'Entry', name: 'Employees tab — split buttons', state: 'employees',
          desc: 'Bulk import now lives under the Employees tab. ver1 entry point = split buttons: a secondary “Add Single Employee” (opens the Add employee modal) beside a primary “Bulk Upload” (launches the import flow). Automated sync is already set up for the site.' },
        { id: 'upload', flow: 'import', x: 250, y: 250, step: 'Step 1', name: 'Upload file', state: 'upload',
          desc: 'Drag a file or pick a sample. Nothing imports until reviewed. The Template variant instead asks you to download the SafeLMS template first.' },
        { id: 'map', flow: 'import', x: 500, y: 120, step: 'Step 2', name: 'Map columns', state: 'map',
          desc: 'Match your file columns to SafeLMS fields (skipped in the Template variant).' },
        { id: 'settings', flow: 'import', x: 500, y: 410, step: 'Step 3', name: 'Import settings', state: 'settings',
          desc: 'Two off-by-default choices — Deactivate users / Remove positions & locations — with a live example of how a user’s record changes. Both are re-confirmed on review; a “send to your Vector rep” escape is offered.' },

        { id: 'review-info', flow: 'import', x: 700, y: 60, step: 'Review · Info', name: 'Info only — runs freely', state: 'review-info',
          desc: 'INFO tier only (e.g. 3 emails updated, new users created). Nothing to acknowledge — Run import is enabled immediately.' },
        { id: 'review-confirm', flow: 'import', x: 1030, y: 60, step: 'Review · Confirm', name: 'Confirm — acknowledge & run', state: 'review-confirm',
          desc: 'CONFIRM tier (name changes, user deactivations, position/location removals): each acknowledged before Run import unlocks, each with a “send to your rep” escape. INFO items ride along.' },
        { id: 'done', flow: 'import', x: 1360, y: 60, step: 'Done', name: 'Import complete', state: 'done',
          desc: 'Reached from the Info and Confirm paths. Irreversible once run — the design leans on prevention, not undo.' },

        { id: 'review-blocked', flow: 'import', x: 700, y: 420, step: 'Review · Blocked', name: 'Blocked — blast radius', state: 'review-blocked',
          desc: 'BLOCKED guardrail: an upload rewriting 98% of usernames is stopped outright. Only path forward is a fresh upload.' },
        { id: 'review-saml', flow: 'import', x: 1030, y: 420, step: 'Review · Blocked', name: 'Blocked — SAML mismatch', state: 'review-saml',
          desc: 'BLOCKED: the Username column doesn’t match the site’s SAML sign-on. (Feasibility is a PENDING PRD decision — may become CX-only.)' },

          desc: 'V1 attention treatment = inline ALERT MODE, AMBER: a distinct colored card (not red) for a problem the customer fixes themselves — plain-language cause, A→B, “Fix it & upload again.”' },
        { id: 'attn-escalate', flow: 'import', x: 1030, y: 620, step: 'Attention · red', name: 'Alert mode — Vector’s team', state: 'attn-escalate',

        /* ── Automated sync: already set up → healthy → the three tiers ── */

          desc: 'Sync stopped on CONFIRM-tier changes (name changes). Same row-level view; the customer approves and applies in place — no case.' },
        { id: 'sync-blocked', flow: 'sync', x: 1000, y: 900, step: 'Blocked', name: 'Blocked — fix at source', state: 'sync-blocked',
          desc: 'Sync stopped on a BLOCKED change (username format drift would rewrite most accounts). Can’t self-apply — fix the export or use the manual uploader.' },
        { id: 'sync-escalate', flow: 'sync', x: 1320, y: 900, step: 'Contact Vector', name: 'Contact Vector — email collision', state: 'sync-escalate',
          desc: 'Sync stopped on a pre-existing on-site email collision. Resolves only via Vector; the sync resumes after the merge.' }
      ],
      edges: [
        ['employees', 'upload'],
        ['upload', 'map'], ['upload', 'settings'], ['map', 'settings'],
        ['settings', 'review-info'], ['settings', 'review-confirm'], ['settings', 'review-blocked'],
        ['settings', 'review-saml'], ['settings', 'review-escalate'],
        ['review-info', 'done'], ['review-confirm', 'done'],
        ['sync-healthy', 'sync-failed'], ['sync-healthy', 'sync-blocked'], ['sync-healthy', 'sync-escalate']
      ]
    }
  };

  render();
  bootFromHash();
})();
</script>
