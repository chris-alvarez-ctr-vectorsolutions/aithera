  function alertHTML(a) {
    var t = TIER[a.tier];
    var acked = !!state.acks[ackKey(a.id)];
    var hasHelp = !!HELP[a.id];
    var helpOpen = state.openHelp === a.id;
    var body = '';

    // Compact: a single one-liner replaces the three laid-out description lines.
    // The full explanation + the A→B "how to fix" example live in the Help tooltip.
    var oneLine = String(a.what).split('. ')[0].replace(/\.$/, '') + '.';
    body += '<div class="alert-line">' + esc(oneLine) + '</div>';

    if (a.compare) {
      body += '<div style="display:flex;border:1px solid #F1C0BB;border-radius:8px;overflow:hidden;font-size:13px;">'
        + '<div style="flex:1;padding:10px 14px;background:#FEF7F6;"><div style="font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#8CA0B4;">Your sign-on sends</div><div class="mono" style="margin-top:4px;">' + esc(a.compare.idp) + '</div></div>'
        + '<div style="width:1px;background:#F1C0BB;"></div>'
        + '<div style="flex:1;padding:10px 14px;background:#FEF7F6;"><div style="font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#8CA0B4;">Your file sends</div><div class="mono" style="margin-top:4px;color:#B42318;">' + esc(a.compare.file) + '</div></div>'
        + '</div>';
    }
    if (a.lines) {
      body += '<div style="background:#F8FAFC;border:1px solid #EDF1F6;border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:5px;">'
        + a.lines.map(function (l) { return '<div class="mono" style="font-size:12.5px;color:#3D4F63;">' + esc(l.t) + '</div>'; }).join('') + '</div>';
    }
    if (a.diff) body += beforeAfter(a.diff, a.tier === 'confirm' ? 'After you accept' : 'After import', a.more);
    if (a.tier === 'confirm') {
      body += '<label style="display:flex;gap:10px;align-items:flex-start;background:#FFFAEB;border:1px solid #F2D69B;border-radius:8px;padding:11px 14px;cursor:pointer;">'
        + '<input type="checkbox" data-act="ack" data-arg="' + a.id + '"' + (acked ? ' checked' : '') + ' style="margin-top:2px;width:15px;height:15px;accent-color:#B54708;">'
        + '<span style="font-size:13px;line-height:1.5;color:#6B4A0A;">' + esc(a.ackLabel) + '</span></label>';
    }
    var btns = [];
    if (a.supportBtn)  btns.push('<button class="btn sm btn--primary" data-act="noop">Contact Vector support</button>');
    if (a.fixMapBtn)   btns.push('<button class="btn sm btn--danger" data-act="fixMapping">Fix column mapping</button>');
    if (a.replaceBtn)  btns.push('<button class="btn sm btn--ghost" data-act="replaceFile">Replace file</button>');
    if (a.settingsBtn) btns.push('<button class="btn sm btn--danger" data-act="changeSettings">Change import settings</button>');
    if (a.repBtn)      btns.push(state.repSent
      ? '<button class="btn sm btn--ghost" data-act="noop" style="color:#067647;border-color:#A6E5C3;">Sent to your Vector rep ✓</button>'
      : '<button class="btn sm btn--outline-blue" data-act="askRep">Not sure? Send to my Vector rep</button>');
    if (btns.length) body += '<div style="display:flex;gap:10px;flex-wrap:wrap;">' + btns.join('') + '</div>';

    return '<div class="alert" style="position:relative;border-color:' + t.border + ';">'
      + '<div class="alert-head" style="background:' + t.headBg + ';">'
      + '<div class="chip" style="background:' + t.chipBg + ';margin-top:1px;"><i class="fa-solid ' + t.icon + '" aria-hidden="true"></i>' + t.chip + '</div>'
      + '<div style="flex:1;"><div class="alert-title" style="color:' + t.titleColor + ';">' + esc(a.title) + '</div>'
      + (a.guardrail ? '<div style="font-size:11.5px;color:#B42318;font-weight:600;margin-top:2px;">Site-wide guardrail — blocked regardless of individual errors</div>' : '')
      + '</div>'
      + (hasHelp ? '<button class="help-btn' + (helpOpen ? ' is-open' : '') + '" data-act="toggleHelp" data-arg="' + a.id + '"><i class="fa-solid fa-circle-question" aria-hidden="true"></i>Help</button>' : '')
      + '</div><div class="alert-body">' + body + '</div>'
      + (helpOpen ? helpPopover(a) : '')
      + '</div>';
  }

  function reviewHTML() {
    var file = FILES.find(function (f) { return f.id === state.fileId; });
    if (state.validating) {
      return '<div class="fadeup"><div class="card" style="padding:48px 20px;text-align:center;">'
        + '<div class="spinner"></div>'
        + '<div style="font-size:14.5px;font-weight:600;">Checking this file against your site…</div>'
        + '<div style="font-size:13px;color:#5B6B7E;margin-top:4px;">Comparing ' + file.rows + ' rows to ' + TOTAL + ' existing users, your sign-on settings, and site configuration. Nothing has been changed yet.</div>'
        + '</div></div>';
    }
    var raw = buildAlerts();
    var alertsHtml = raw.length
      ? raw.map(alertHTML).join('')
      : '<div style="background:#ECFDF3;border:1px solid #A6E5C3;border-radius:10px;padding:16px 18px;font-size:13.5px;color:#067647;"><span style="font-weight:600;">No issues found.</span> Every row checks out against your site and your sign-on settings.</div>';

    // Blocked and escalate ('contact Vector') both hard-stop the import.
    var blocked = raw.filter(function (a) { return a.tier === 'blocked' || a.tier === 'escalate'; });
    var confirms = raw.filter(function (a) { return a.tier === 'confirm'; });
    var acked = confirms.filter(function (a) { return state.acks[ackKey(a.id)]; });
    var canSubmit = !state.validating && blocked.length === 0 && acked.length === confirms.length;
    var sum = summary();

    var side = '<div style="background:#fff;border:1px solid #E1E7EE;border-radius:10px;padding:18px 20px;">'
      + '<div class="kpi-eyebrow">If you run this import</div>'
      + '<div style="font-size:12px;color:#8CA0B4;margin-top:2px;">Compared against ' + TOTAL + ' existing users</div>'
      + '<div style="display:flex;flex-direction:column;gap:8px;margin-top:14px;">'
      + '<div class="kpi-row"><span class="k">New users added</span><span class="v" style="color:#067647;">' + sum.add + '</span></div>'
      + '<div class="kpi-row"><span class="k">Existing users updated</span><span class="v" style="color:#1257B8;">' + sum.mod + '</span></div>'
      + '<div class="kpi-row"><span class="k">Users deactivated</span><span class="v" style="color:' + (sum.deact > 0 ? '#B42318' : '#8CA0B4') + ';">' + sum.deact + '</span></div>'
      + '<div class="kpi-row"><span class="k">Positions/locations added</span><span class="v" style="color:#067647;">' + sum.jobsAdded + '</span></div>'
      + '<div class="kpi-row"><span class="k">Positions/locations removed</span><span class="v" style="color:' + (sum.jobsRemoved > 0 ? '#B42318' : '#8CA0B4') + ';">' + sum.jobsRemoved + '</span></div>'
      + '</div><div class="divider" style="margin:16px 0;"></div>';
    if (blocked.length) {
      side += '<div style="background:#FEF3F2;border:1px solid #F1C0BB;border-radius:8px;padding:10px 12px;font-size:12.5px;color:#B42318;margin-bottom:12px;"><span style="font-weight:700;">'
        + (blocked.length === 1 ? '1 issue' : blocked.length + ' issues') + '</span> must be resolved before this import can run.</div>';
    }
    if (confirms.length && blocked.length === 0) {
      side += '<div style="font-size:12.5px;color:#5B6B7E;margin-bottom:12px;">' + acked.length + ' of ' + confirms.length + ' confirmation' + (confirms.length === 1 ? '' : 's') + ' acknowledged</div>';
    }
    side += '<button class="btn" data-act="runImport" style="width:100%;border:none;background:' + (canSubmit ? '#1257B8' : '#C6D3E1') + ';color:#fff;font-size:14px;font-weight:600;padding:11px 0;border-radius:8px;cursor:' + (canSubmit ? 'pointer' : 'not-allowed') + ';"' + (canSubmit ? '' : ' disabled') + '>Run import</button>'
      + '<div style="font-size:12px;color:#8CA0B4;margin-top:10px;line-height:1.5;">Nothing changes until you run it. Once it runs, it cannot be paused or undone.</div>'
      + '<div class="divider" style="margin:14px 0;"></div>'
      + '<div style="display:flex;flex-direction:column;gap:6px;font-size:13px;">'
      + '<a href="#" data-act="linkUpload">Replace file</a>'
      + (isMap() && !blocked.length ? '<a href="#" data-act="linkMap">Edit column mapping</a>' : '')
      + '<a href="#" data-act="linkSettings">Change import settings</a></div></div>';

    return '<div class="fadeup"><div style="display:flex;gap:20px;align-items:flex-start;">'
      + '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;">' + alertsHtml + '</div>'
      + '<div style="width:290px;flex:0 0 290px;position:sticky;top:0;">' + side + '</div>'
      + '</div></div>';
  }

  function doneHTML() {
    var dc = state.doneCounts || summary();
    return '<div class="fadeup" style="max-width:640px;margin:24px auto;text-align:center;">'
      + '<div style="width:52px;height:52px;border-radius:50%;background:#ECFDF3;border:1.5px solid #A6E5C3;color:#067647;font-size:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;">✓</div>'
      + '<div style="font-size:19px;font-weight:700;">Import complete</div>'
      + '<div style="font-size:13.5px;color:#5B6B7E;margin-top:6px;">' + dc.add + ' users added, ' + dc.mod + ' updated, ' + dc.deact + ' deactivated on Ridgewood Public Schools — Staff.</div>'
      + '<div style="background:#fff;border:1px solid #E1E7EE;border-radius:10px;padding:14px 18px;margin:18px 0;font-size:13px;color:#5B6B7E;text-align:left;">A confirmation with the full change log was emailed to <span style="font-weight:600;color:#1B2B3E;">vpollock@ridgewood.k12.us</span>. You can also download it from the import history at any time.</div>'
      + '<div style="display:flex;gap:10px;justify-content:center;">'
      + '<button class="btn btn--ghost" data-act="restart">Start another import</button>'
      + '<button class="btn btn--primary" data-act="goSync">View automated sync</button></div></div>';
  }

  /* Manual-import walkthrough / overview. Full card frames what a manual import
     is (SafeLMS "pencil banner" pattern); compact strip is the persistent form. */
  function walkthroughHTML() {
    return '<div class="wt-card">'
      + '<div class="wt-icon"><i class="fa-solid fa-circle-info" aria-hidden="true"></i></div>'
      + '<div style="flex:1;min-width:0;"><div class="wt-title">Manual import</div>'
      + '<div class="wt-body">Upload a file to add, update, deactivate, or remove users on this site. Best for one-off changes — a new-hire batch, one building’s roster, year-end cleanup. Nothing changes until you review the exact changes and run it.</div>'
      + '<div class="wt-link"><a href="#" data-act="goSyncTab">Uploading the same roster on a schedule? Set up Automated sync →</a></div>'
      + '</div></div>';
  }

  /* ======================================================================
     V6 — GUIDED INTERVIEW (TurboTax / FreeTaxUSA style)
     One question per screen, a left section rail with checkmarks + progress,
     a running "Import summary" monitor, and a final "here's what you told us"
     review. The manual import IS the interview; automated sync stays deeper.
     ====================================================================== */

  var IV_SECTIONS = [
    { id: 'file',     label: 'Your file',       icon: 'fa-file-arrow-up' },
    { id: 'columns',  label: 'Your columns',    icon: 'fa-table-columns' },
    { id: 'existing', label: 'Existing users',  icon: 'fa-users-gear' },
    { id: 'checks',   label: 'Double-check',    icon: 'fa-clipboard-check' },
    { id: 'review',   label: 'Review & import', icon: 'fa-flag-checkered' }
  ];

  /* Curated interview "double-checks" per sample file — the tax-software analog of
     "we need to double-check a couple of things." Confirm-tier are Yes/No; a
     blocked/escalate check is a hard stop that ends the interview with a fix path. */
  var IV_CHECKS = {
    clean: [],
    confirm: [
      { id: 'name', tier: 'confirm',
        q: 'Is this the same person — just with a new name?',
        ctx: 'Row 87 matches an existing account by username, but the first name on the account is different from your file.',
        a: { l: 'On their account now', v: 'Susan Hartley' },
        b: { l: 'In your file', v: 'Sue Hartley' },
        yes: { t: 'Yes — same person, update the name', s: 'Keeps all of their training history.' },
        no:  { t: 'No — leave this row out', s: 'We’ll skip row 87 and import everyone else.' },
        why: 'Almost always this is a nickname or a legal name change (Susan → Sue). Either way their training history stays with the account. Only say “no” if you don’t recognize them as the same person.' }
    ],
    saml: [
      { id: 'saml', tier: 'blocked',
        q: 'Your usernames don’t match how people sign in',
        ctx: 'Ridgewood signs people in with single sign-on, which uses each person’s email as their username. The column you’re importing as Username holds first.last values instead.',
        a: { l: 'Your file sends', v: 'sarah.linden' },
        b: { l: 'Sign-in expects', v: 'slinden@ridgewood.k12.us' },
        why: 'Point the Username column at the column that holds the email address, then upload the file again — that’s the value single sign-on matches on.' }
    ],
    dupes: [
      { id: 'dupe-email', tier: 'blocked',
        q: 'Two rows look like the same person, entered twice',
        ctx: 'Rows 34 and 91 use two different usernames but the same email address — almost always one person added once by HR and once by athletics.',
        a: { l: 'Two rows, one email', v: 'jsmith  +  john.smith' },
        b: { l: 'Keep just one', v: 'jsmith' },
        why: 'Keep the username that already exists on your site, remove the other row, and upload the file again. Two accounts sharing an email can’t sign in reliably.' }
    ],
    blast: [
      { id: 'blast', tier: 'blocked',
        q: 'This file would change almost everyone’s sign-in',
        ctx: 'The username column in this file would be rewritten on 166 of 170 accounts (98%). Username is the one field that ties a person to their whole training record.',
        a: { l: 'This file sends', v: 'sarah.linden' },
        b: { l: 'Your site uses', v: 'slinden' },
        why: 'This usually means the file was exported in a different username format than your site uses. Fix the Username column at the source, then upload again.' }
    ]
  };

  function ivChecks() { return IV_CHECKS[state.fileId] || []; }
  function ivBlockers() { return ivChecks().filter(function (c) { return c.tier === 'blocked' || c.tier === 'escalate'; }); }
  function ivConfirmChecks() { return ivChecks().filter(function (c) { return c.tier === 'confirm'; }); }
  function ivUnansweredConfirms() { return ivConfirmChecks().filter(function (c) { return !state.ivAnswers['check:' + c.id]; }); }
  function ivReady() { return !!state.fileId && ivBlockers().length === 0 && ivUnansweredConfirms().length === 0; }

  /* The ordered list of interview screens, computed from the chosen file. */
  function ivSteps() {
    var s = [
      { section: 'file',     key: 'file' },
      { section: 'columns',  key: 'columns' },
      { section: 'existing', key: 'deactivate' },
      { section: 'existing', key: 'jobs' }
    ];
    if (ivBlockers().length) {
      s.push({ section: 'checks', key: 'blocked', check: ivBlockers()[0] });
    } else if (ivConfirmChecks().length) {
      ivConfirmChecks().forEach(function (c) { s.push({ section: 'checks', key: 'check:' + c.id, check: c }); });
    } else {
      s.push({ section: 'checks', key: 'checks-none' });
    }
    s.push({ section: 'review', key: 'review' });
    return s;
  }
  function ivStep() { var s = ivSteps(); return s[Math.min(state.ivPos, s.length - 1)]; }
  function ivAnswered(step) {
    var k = step.key;
    if (k === 'file' || k === 'checks-none' || k === 'review') return true;
    if (k === 'blocked') return false;                 // a hard stop is never "answered"
    return !!state.ivAnswers[k];
  }
  function ivFirstPosOf(sectionId) {
    var s = ivSteps();
    for (var i = 0; i < s.length; i++) { if (s[i].section === sectionId) return i; }
    return 0;
  }
  function ivPct() { var s = ivSteps(); return Math.round((state.ivPos / (s.length - 1)) * 100); }

  /* Left section rail — sections with check / active / upcoming state + a mini count. */
  function ivRail() {
    var steps = ivSteps(), pos = state.ivPos, rows = '';
    IV_SECTIONS.forEach(function (sec, si) {
      var idxs = [];
      steps.forEach(function (st, i) { if (st.section === sec.id) idxs.push(i); });
      if (!idxs.length) return;
      var first = idxs[0], last = idxs[idxs.length - 1];
      var done = pos > last, active = pos >= first && pos <= last;
      var cls = done ? 'is-done' : active ? 'is-active' : '';
      var mark = done ? '<i class="fa-solid fa-check"></i>' : (si + 1);
      var cnt = idxs.length > 1 && active ? '<span class="iv-sec-cnt">' + (idxs.indexOf(pos) + 1) + ' of ' + idxs.length + '</span>' : '';
      rows += '<div class="iv-sec ' + cls + '"><span class="iv-sec-ic">' + mark + '</span>'
        + '<span class="iv-sec-lb">' + esc(sec.label) + '</span>' + cnt + '</div>';
    });
    return '<nav class="iv-rail"><div class="iv-rail-h">Your import</div>' + rows + '</nav>';
  }

  /* Running "Import summary" monitor — the refund-tracker analog. Tallies live. */
  function ivMonitor() {
    var sum = state.fileId ? summary() : { add: 0, mod: 0, deact: 0, jobsRemoved: 0 };
    var tone, ic, icBg, st, ss;
    if (ivBlockers().length) {
      tone = { bg: '#FEF3F2', fg: '#B42318' }; ic = 'fa-circle-xmark'; st = 'Can’t import yet'; ss = '1 thing to fix first';
    } else if (ivUnansweredConfirms().length) {
      var n = ivUnansweredConfirms().length;
      tone = { bg: '#FFFAEB', fg: '#8A5A0B' }; ic = 'fa-clipboard-question'; st = 'Almost there';
      ss = n + ' thing' + (n === 1 ? '' : 's') + ' to double-check';
    } else if (state.fileId) {
      tone = { bg: '#ECFDF3', fg: '#067647' }; ic = 'fa-circle-check'; st = 'Ready to import'; ss = 'Everything checks out';
    } else {
      tone = { bg: '#EEF2F7', fg: '#5B6B7E' }; ic = 'fa-hourglass-start'; st = 'Getting started'; ss = 'Answer a few questions';
    }
    function row(k, v, col) {
      return '<div class="iv-mon-row"><span class="k">' + k + '</span><span class="v" style="color:' + col + ';">' + v + '</span></div>';
    }
    return '<aside class="iv-monitor"><div class="iv-mon-h">Import summary</div>'
      + '<div class="iv-mon-status"><div class="iv-mon-badge" style="background:' + tone.bg + ';color:' + tone.fg + ';"><i class="fa-solid ' + ic + '" aria-hidden="true"></i></div>'
      + '<div><div class="iv-mon-st" style="color:' + tone.fg + ';">' + st + '</div><div class="iv-mon-ss">' + ss + '</div></div></div>'
      + '<div class="iv-mon-rows">'
      + row('New users', sum.add, '#067647')
      + row('Updates', sum.mod, '#1257B8')
      + row('Deactivations', sum.deact, sum.deact > 0 ? '#B42318' : '#8CA0B4')
      + row('Positions removed', sum.jobsRemoved, sum.jobsRemoved > 0 ? '#B42318' : '#8CA0B4')
      + '</div></aside>';
  }

  function ivAssist(text) {
    return '<div class="iv-assist"><span class="iv-face"><i class="fa-solid fa-headset" aria-hidden="true"></i></span>'
      + '<span><b>Import Assistant</b> · ' + text + '</span></div>';
  }
  function ivWhyBlock(text) {
    var open = state.ivWhy;
    return '<div class="iv-why' + (open ? ' is-open' : '') + '">'
      + '<div class="iv-why-sum" data-act="ivWhy"><i class="fa-solid fa-circle-question" aria-hidden="true"></i>Why are we asking?<i class="fa-solid fa-chevron-down chev" aria-hidden="true"></i></div>'
      + (open ? '<div class="iv-why-body">' + text + '</div>' : '') + '</div>';
  }
  function ivChoice(key, val, title, sub, rec) {
    var picked = state.ivAnswers[key] === val;
    return '<button class="iv-choice' + (picked ? ' is-picked' : '') + '" data-act="ivAnswer" data-arg="' + key + '=' + val + '">'
      + '<span class="iv-radio"></span>'
      + '<span style="flex:1;min-width:0;"><span class="iv-choice-t">' + esc(title) + (rec ? '<span class="iv-pill-rec">Recommended</span>' : '') + '</span>'
      + (sub ? '<span class="iv-choice-s">' + esc(sub) + '</span>' : '') + '</span></button>';
  }
  function ivAB(c) {
    return '<div class="iv-ab">'
      + '<div class="iv-ab-card a"><div class="iv-ab-l">' + esc(c.a.l) + '</div><div class="iv-ab-v mono">' + esc(c.a.v) + '</div></div>'
      + '<div class="iv-ab-arrow"><i class="fa-solid fa-arrow-right-long" aria-hidden="true"></i></div>'
      + '<div class="iv-ab-card b"><div class="iv-ab-l">' + esc(c.b.l) + '</div><div class="iv-ab-v mono">' + esc(c.b.v) + '</div></div>'
      + '</div>';
  }

  /* One interview screen. */
  function ivQuestionCard(step) {
    var file = FILES.find(function (f) { return f.id === state.fileId; });
    var k = step.key;

    if (k === 'file') {
      return '<div class="iv-q">' + ivAssist('Let’s start with the file you want to import.')
        + '<div class="iv-eyebrow">Your file</div>'
        + '<div class="iv-headline">Here’s the file you picked — does this look right?</div>'
        + '<div class="iv-lede">Nothing is imported yet. We’ll walk through a few questions, double-check anything that needs it, and only import once you say so.</div>'
        + '<div class="iv-rev-card" style="margin-top:22px;"><div class="iv-rev-row">'
        + '<div class="iv-rev-ic"><i class="fa-solid fa-file-csv"></i></div>'
        + '<div class="iv-rev-main"><div class="iv-rev-a mono" style="font-weight:600;">' + esc(file.name) + '</div>'
        + '<div class="iv-rev-q" style="margin-top:2px;">' + file.rows + ' rows detected · ' + esc(file.note) + '</div></div>'
        + '<button class="iv-rev-edit" data-act="ivPickDiff">Choose a different file</button></div></div></div>';
    }

    if (k === 'columns') {
      var ans = state.ivAnswers.columns;
      var list = FIELDS.map(function (f) {
        var val = state.mapping[f.field] || NOT_IMPORTED;
        var cols = COLS[state.fileId];
        var src = cols.find(function (c) { return c[0] === val; });
        return '<div class="iv-rev-row" style="padding:11px 16px;"><div class="iv-rev-ic"><i class="fa-solid fa-check"></i></div>'
          + '<div class="iv-rev-main"><div class="iv-rev-a"><b>' + esc(f.field) + '</b> &nbsp;←&nbsp; <span class="mono">' + esc(val) + '</span></div>'
          + '<div class="iv-rev-q" style="margin-top:2px;">Sample from your file: ' + esc(src ? src[1] : '—') + '</div></div></div>';
      }).join('');
      var reviewGrid = '';
      if (ans === 'review') {
        var cols = COLS[state.fileId];
        var colOptions = [{ v: NOT_IMPORTED }].concat(cols.map(function (c) { return { v: c[0] }; }));
        reviewGrid = '<div class="iv-rev-card" style="margin-top:14px;">' + FIELDS.map(function (f) {
          var val = state.mapping[f.field] || NOT_IMPORTED;
          var opts = colOptions.map(function (o) { return '<option value="' + esc(o.v) + '"' + (o.v === val ? ' selected' : '') + '>' + esc(o.v) + '</option>'; }).join('');
          return '<div class="iv-rev-row" style="padding:11px 16px;align-items:center;"><div class="iv-rev-main"><div class="iv-rev-q">' + esc(f.field) + (f.req ? ' *' : '') + '</div></div>'
            + '<select class="map-select" style="max-width:230px;" data-act="mapChange" data-arg="' + esc(f.field) + '">' + opts + '</select></div>';
        }).join('') + '</div>';
      }
      return '<div class="iv-q">' + ivAssist('We lined up your columns automatically. Give them a quick look.')
        + '<div class="iv-eyebrow">Your columns</div>'
        + '<div class="iv-headline">We matched all ' + FIELDS.length + ' columns from ' + esc(file.name) + '</div>'
        + '<div class="iv-lede">We read the headers in your file and matched them to SafeLMS fields. Take a look — does this look correct?</div>'
        + '<div class="iv-rev-card" style="margin-top:20px;">' + list + '</div>'
        + '<div class="iv-choices" style="margin-top:18px;">'
        + ivChoice('columns', 'yes', 'Yes, these are matched correctly', 'Everything lined up — let’s move on.', false)
        + ivChoice('columns', 'review', 'Let me adjust a column', 'Open the matches and change any that are off.', false)
        + '</div>' + reviewGrid + '</div>';
    }

    if (k === 'deactivate') {
      return '<div class="iv-q">' + ivAssist('A couple of questions about people already on your site.')
        + '<div class="iv-eyebrow">Existing users · question 1 of 2</div>'
        + '<div class="iv-headline">Some people on your site aren’t in this file. What should happen to them?</div>'
        + '<div class="iv-lede">This site has ' + TOTAL + ' active users. Your file has ' + file.rows + ' rows, so some existing people may not be included.</div>'
        + '<div class="iv-choices">'
        + ivChoice('deactivate', 'keep', 'Keep everyone active', 'People missing from the file stay exactly as they are. Best for a partial list — new hires, one building, one department.', true)
        + ivChoice('deactivate', 'deactivate', 'Deactivate anyone not in this file', 'People missing from the file lose access. Their history is kept and they come back if a later file includes them. Only for a complete roster.', false)
        + '</div>'
        + ivWhyBlock('“Deactivate” signs out every active user who isn’t in the file — here that could be up to ' + (TOTAL - file.rows) + ' people. If this file is only part of your staff, keep everyone active so no one is locked out by accident.') + '</div>';
    }

    if (k === 'jobs') {
      return '<div class="iv-q">' + ivAssist('Last one about existing users, then we’ll double-check the file.')
        + '<div class="iv-eyebrow">Existing users · question 2 of 2</div>'
        + '<div class="iv-headline">What about each person’s positions and locations?</div>'
        + '<div class="iv-lede">Your file lists positions and locations for each person. We can add new ones, or make each person’s record exactly match the file.</div>'
        + '<div class="iv-choices">'
        + ivChoice('jobs', 'add', 'Just add what’s new, keep the rest', 'New positions and locations are added; anything a person already has is kept. Nothing is removed.', true)
        + ivChoice('jobs', 'exact', 'Make positions & locations exactly match the file', 'Any position or location a person holds that isn’t in the file is removed — along with the training tied to it.', false)
        + '</div>'
        + ivWhyBlock('“Exactly match” removes any position or location that isn’t in your file, and the training assigned to it goes with it. Only choose this when the file is the complete, current list of everyone’s positions and locations.') + '</div>';
    }

    if (k === 'check:name' || (step.check && step.check.tier === 'confirm')) {
      var c = step.check;
      var ak = 'check:' + c.id;
      return '<div class="iv-q">' + ivAssist('One thing to double-check before we import.')
        + '<div class="iv-eyebrow">Double-check</div>'
        + '<div class="iv-headline">' + esc(c.q) + '</div>'
        + '<div class="iv-lede">' + esc(c.ctx) + '</div>'
        + ivAB(c)
        + '<div class="iv-choices">'
        + '<button class="iv-choice' + (state.ivAnswers[ak] === 'yes' ? ' is-picked' : '') + '" data-act="ivAnswer" data-arg="' + ak + '=yes">'
        + '<span class="iv-radio"></span><span style="flex:1;"><span class="iv-choice-t">' + esc(c.yes.t) + '</span><span class="iv-choice-s">' + esc(c.yes.s) + '</span></span></button>'
        + '<button class="iv-choice' + (state.ivAnswers[ak] === 'no' ? ' is-picked' : '') + '" data-act="ivAnswer" data-arg="' + ak + '=no">'
        + '<span class="iv-radio"></span><span style="flex:1;"><span class="iv-choice-t">' + esc(c.no.t) + '</span><span class="iv-choice-s">' + esc(c.no.s) + '</span></span></button>'
        + '</div>' + ivWhyBlock(esc(c.why)) + '</div>';
    }

    if (k === 'blocked') {
      var b = step.check;
      return '<div class="iv-q">' + ivAssist('We hit something we can’t import as-is.')
        + '<div class="iv-eyebrow" style="color:var(--red-ink);">Double-check · needs fixing</div>'
        + '<div class="iv-headline">' + esc(b.q) + '</div>'
        + '<div class="iv-lede">' + esc(b.ctx) + '</div>'
        + ivAB(b)
        + '<div style="margin-top:20px;background:#FEF3F2;border:1px solid var(--red-border);border-radius:11px;padding:15px 17px;">'
        + '<div style="font-size:13.5px;font-weight:700;color:var(--red-ink);margin-bottom:5px;"><i class="fa-solid fa-circle-info" aria-hidden="true"></i> How to fix it</div>'
        + '<div style="font-size:13px;color:var(--ink-2);line-height:1.6;">' + esc(b.why) + '</div></div>'
        + '<div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;">'
        + '<button class="iv-cont" data-act="ivPickDiff">Fix it &amp; upload again</button>'
        + '<a class="btn btn--ghost" href="https://support.vectortrainingeducation.com/s/article/User-Data-File-Upload-Errors" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;text-decoration:none;">See upload-error help ↗</a>'
        + '</div></div>';
    }

    if (k === 'checks-none') {
      return '<div class="iv-q">' + ivAssist('Good news — I checked your file and found no problems.')
        + '<div class="iv-eyebrow" style="color:var(--green-ink);">Double-check</div>'
        + '<div class="iv-headline">Nothing to fix — this file is clean</div>'
        + '<div class="iv-lede">Every row lines up with your site, your sign-in settings, and the answers you gave. There’s nothing here that needs your confirmation.</div>'
        + '<div style="margin-top:22px;background:#ECFDF3;border:1px solid var(--green-border);border-radius:11px;padding:16px 18px;display:flex;gap:12px;align-items:center;">'
        + '<div style="width:34px;height:34px;border-radius:50%;background:#fff;color:var(--green-ink);display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 34px;"><i class="fa-solid fa-check"></i></div>'
        + '<div style="font-size:13.5px;color:var(--green-ink);line-height:1.5;">All ' + file.rows + ' rows check out. Head to the review to import.</div></div></div>';
    }

    if (k === 'review') return ivReviewCard();
    return '';
  }

  /* Final "here's what you told us" review — every answer restated, each editable. */
  function ivReviewCard() {
    var file = FILES.find(function (f) { return f.id === state.fileId; });
    var sum = summary();
    function rev(sectionId, ic, q, a, iccls) {
      return '<div class="iv-rev-row"><div class="iv-rev-ic ' + (iccls || '') + '"><i class="fa-solid ' + ic + '"></i></div>'
        + '<div class="iv-rev-main"><div class="iv-rev-q">' + q + '</div><div class="iv-rev-a">' + a + '</div></div>'
        + '<button class="iv-rev-edit" data-act="ivEdit" data-arg="' + sectionId + '">Edit</button></div>';
    }
    var deact = state.ivAnswers.deactivate === 'deactivate';
    var jobs = state.ivAnswers.jobs === 'exact';
    var rows = '';
    rows += rev('file', 'fa-check', 'Your file', '<span class="mono">' + esc(file.name) + '</span> · ' + file.rows + ' rows');
    rows += rev('columns', 'fa-check', 'Your columns', 'All ' + FIELDS.length + ' columns matched');
    rows += rev('existing', deact ? 'fa-triangle-exclamation' : 'fa-check', 'People not in this file',
      deact ? '<b>Deactivate</b> anyone not in the file · ' + sum.deact + ' would lose access' : 'Keep everyone active — nothing removed',
      deact ? 'warn' : '');
    rows += rev('existing', jobs ? 'fa-triangle-exclamation' : 'fa-check', 'Positions & locations',
      jobs ? '<b>Exactly match</b> the file · ' + sum.jobsRemoved + ' removed' : 'Add what’s new, keep the rest',
      jobs ? 'warn' : '');
    ivConfirmChecks().forEach(function (c) {
      var ans = state.ivAnswers['check:' + c.id];
      rows += rev('checks', ans ? 'fa-check' : 'fa-clipboard-question',
        'Double-check: ' + esc(c.q).replace(/[?].*$/, '?'),
        ans === 'yes' ? esc(c.yes.t) : ans === 'no' ? esc(c.no.t) : '<span style="color:var(--amber-ink);">Not answered yet</span>',
        ans ? '' : 'warn');
    });

    var ready = ivReady();
    var note = deact || jobs
      ? '<div style="margin-top:14px;background:#FFFAEB;border:1px solid var(--amber-border);border-radius:10px;padding:12px 15px;font-size:12.5px;color:var(--amber-ink);line-height:1.55;"><b>Heads up:</b> this import removes access or assignments (highlighted above). This can’t be undone once you import. Use <b>Edit</b> to change any answer.</div>'
      : '';
    return '<div class="iv-q">' + ivAssist('Here’s everything you told me — take one last look.')
      + '<div class="iv-eyebrow">Review &amp; import</div>'
      + '<div class="iv-headline">Let’s double-check before we import</div>'
      + '<div class="iv-lede">This is exactly what will happen when you import. Nothing has changed on your site yet.</div>'
      + '<div class="iv-rev-card" style="margin-top:20px;">' + rows + '</div>' + note
      // V6 placement — optional automated-sync section, offered here on review.
      + '<div style="margin-top:16px;display:flex;gap:12px;align-items:center;background:#F5F9FE;border:1px solid #C6D9F0;border-radius:11px;padding:13px 16px;">'
      + '<span style="width:32px;height:32px;border-radius:9px;background:#E1EBF9;color:#1257B8;display:flex;align-items:center;justify-content:center;font-size:14px;flex:0 0 32px;"><i class="fa-solid fa-rotate" aria-hidden="true"></i></span>'
      + '<div style="flex:1;min-width:0;font-size:12.5px;color:#3D4F63;line-height:1.5;"><b style="color:#1B2B3E;">Optional:</b> do this automatically next time — set up automated sync so this roster imports on a schedule.</div>'
      + '<button class="btn btn--outline-blue sm" data-act="goSync" style="white-space:nowrap;">Set it up →</button></div>'
      + '<div class="iv-nav">'
      + '<button class="iv-back" data-act="ivBack"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back</button>'
      + '<button class="iv-cont' + (ready ? '' : ' is-off') + '" data-act="runImport"' + (ready ? '' : ' disabled') + '>Import ' + file.rows + ' rows</button>'
      + '</div></div>';
  }

  /* Welcome / intro — shown before a file is chosen. */
  function ivIntro() {
    var steps = IV_SECTIONS.map(function (s) {
      return '<span class="iv-sp"><i class="fa-solid ' + s.icon + '"></i>' + esc(s.label) + '</span>';
    }).join('');
    return '<div class="iv-intro">'
      + '<div class="iv-hero-ic"><i class="fa-solid fa-clipboard-list" aria-hidden="true"></i></div>'
      + '<div style="font-size:24px;font-weight:700;letter-spacing:-.2px;">Let’s import your users, step by step</div>'
      + '<div style="font-size:14.5px;color:var(--muted);margin-top:10px;line-height:1.6;max-width:500px;margin-left:auto;margin-right:auto;">I’ll ask a few plain-language questions, double-check anything that needs a closer look, and show you exactly what will happen before importing. Nothing changes on your site until you say go.</div>'
      + '<div class="iv-steps-preview">' + steps + '</div>'
      + '<button class="iv-cont" data-act="openFiles" style="font-size:15px;padding:13px 30px;"><i class="fa-solid fa-cloud-arrow-up" aria-hidden="true" style="margin-right:8px;"></i>Choose your file to begin</button>'
      + '<div style="font-size:12.5px;color:var(--muted-2);margin-top:14px;">.csv or .xlsx · about 2 minutes</div></div>';
  }

  function importTab() {
    if (state.step === 'done') {
      return '<section data-screen-label="Import complete">' + doneHTML() + '</section>';
    }
    if (state.step !== 'iv' || !state.fileId) {
      return '<section data-screen-label="Interview · welcome">' + ivIntro() + '</section>';
    }
    var step = ivStep();
    var s = ivSteps();
    var last = state.ivPos >= s.length - 1;
    var nav = (step.key === 'review' || step.key === 'blocked') ? '' : ('<div class="iv-nav">'
      + (state.ivPos > 0 ? '<button class="iv-back" data-act="ivBack"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back</button>' : '<span></span>')
      + '<button class="iv-cont' + (ivAnswered(step) ? '' : ' is-off') + '" data-act="ivNext"' + (ivAnswered(step) ? '' : ' disabled') + '>Continue <i class="fa-solid fa-arrow-right" aria-hidden="true" style="margin-left:6px;"></i></button>'
      + '</div>');
    var center = '<div>'
      + '<div class="iv-top"><span class="iv-crumb">Question <b>' + (state.ivPos + 1) + '</b> of <b>' + s.length + '</b></span><span class="iv-pct">' + ivPct() + '% complete</span></div>'
      + '<div class="iv-bar"><i style="width:' + Math.max(6, ivPct()) + '%;"></i></div>'
      + ivQuestionCard(step) + nav + '</div>';
    return '<section data-screen-label="Interview · ' + esc(step.section) + '"><div class="iv-wrap">'
      + ivRail() + center + ivMonitor() + '</div></section>';
  }

  /* One compact strip that NAMES the current sync state, shown above any detail so
     the customer always knows which state they’re looking at. */
  function syncStatus(bg, col, ico, title, sub) {
    return '<div class="sync-status">'
      + '<div class="ss-badge" style="background:' + bg + ';color:' + col + ';"><i class="fa-solid ' + ico + '" aria-hidden="true"></i></div>'
      + '<div class="ss-main"><div class="ss-eyebrow">Automated sync</div>'
      + '<div class="ss-title">' + title + '</div>'
      + '<div class="ss-sub">' + sub + '</div></div></div>';
  }
  function syncStatusHeader() {
    var st = stage();
    if (st === 'unlocked') {
      return syncStatus('#ECFDF3', '#067647', 'fa-unlock', 'Just unlocked',
        'Your 4th clean import came in — automated sync is on and will run from now on.');
    }
    if (st === 'qualifying') {
      var toGo = SYNC_GATE - SYNC_DONE;
      return syncStatus('#EEF2F7', '#5B6B7E', 'fa-lock', 'Not available yet',
        toGo + ' clean import' + (toGo === 1 ? '' : 's') + ' to go before this turns on.');
    }
    if (st === 'active-healthy') {
      return syncStatus('#ECFDF3', '#067647', 'fa-circle-check', 'Up to date',
        'Last import today 6:42 AM · next check within 30 minutes. Nothing needs you.');
    }
    if (st === 'active-failed' && state.blessed) {
      return syncStatus('#ECFDF3', '#067647', 'fa-circle-check', 'Up to date',
        'You applied the waiting changes just now — your roster is current.');
    }
    return '';   // active-failed (unresolved) leads with the failure card itself
  }

  /* Compact sync status banner shown on the manual-import landing. It is the only
     automated-sync presence on the main page — one line: all-clean, needs-
     attention, or (earn-it) progress toward unlocking. Click opens the deeper page. */
  function syncBanner() {
    var st = stage(), tone, icon, text, cta = 'View';
    if (st === 'unlocked') {
      tone = 'ok'; icon = 'fa-unlock';
      text = 'Automated sync just unlocked — your 4th clean import came in.';
      cta = 'See it';
    } else if (st === 'qualifying') {
      var toGo = SYNC_GATE - SYNC_DONE;
      tone = 'neutral'; icon = 'fa-lock';
      text = 'Automated sync unlocks after ' + toGo + ' more clean import' + (toGo === 1 ? '' : 's') + ' — you’re ' + SYNC_DONE + ' of ' + SYNC_GATE + '.';
      cta = 'View progress';
    } else if (st === 'active-failed' && !state.blessed) {
      tone = 'warn'; icon = 'fa-triangle-exclamation';
      text = 'Automated sync needs attention — 1 file stopped this morning.';
      cta = 'Review';
    } else {
      tone = 'ok'; icon = 'fa-circle-check';
      text = 'Automated sync — everything’s clean. Last import today 6:42 AM.';
    }
    var c = tone === 'ok' ? { bg: '#ECFDF3', bd: '#A6E5C3', fg: '#067647' }
      : tone === 'warn' ? { bg: '#FFFAEB', bd: '#F2D69B', fg: '#8A5A0B' }
      : { bg: '#EEF2F7', bd: '#DCE3EC', fg: '#5B6B7E' };
    return '<div class="sync-banner" data-act="openSync" style="background:' + c.bg + ';border:1px solid ' + c.bd + ';">'
      + '<span class="sb-ico" style="color:' + c.fg + ';"><i class="fa-solid ' + icon + '" aria-hidden="true"></i></span>'
      + '<span class="sb-text" style="color:' + c.fg + ';">' + text + '</span>'
      + '<span class="sb-cta" style="color:' + c.fg + ';">' + cta + ' <i class="fa-solid fa-chevron-right" aria-hidden="true" style="font-size:10px;"></i></span>'
      + '</div>';
  }

  /* Progressive-disclosure row — summary always visible, detail on demand. */
  function disc(id, ico, title, sub, detailHTML) {
    var open = !!state.disc[id];
    return '<div class="disc' + (open ? ' is-open' : '') + '">'
      + '<div class="disc-sum" data-act="toggleDisc" data-arg="' + id + '">'
      + '<div class="disc-ico"><i class="fa-solid ' + ico + '" aria-hidden="true"></i></div>'
      + '<div class="disc-tt"><div class="dt">' + title + '</div>'
      + (sub ? '<div class="ds">' + sub + '</div>' : '') + '</div>'
      + '<div class="disc-chev"><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></div></div>'
      + (open ? '<div class="disc-body"><div class="disc-body-inner">' + detailHTML + '</div></div>' : '')
      + '</div>';
  }

  /* The sync decision, summary-first: a clear tier chip + headline + one-line
     summary + the primary actions stay visible; the fuller explanation and the
     row-level data collapse behind a single expander — less to read on first
     entry, nothing lost. Chip carries severity by shape (WCAG 1.4.1). */
  function syncFailureCard() {
    var sc = SYNC_FAILS[syncScenario()] || SYNC_FAILS.confirm;
    var t = TIER[sc.tier];
    var lines = sc.lines.map(function (l) {
      return '<div class="alert-line"><b>' + esc(l[0]) + ' — </b>' + esc(l[1]) + '</div>';
    }).join('');
    var box = sc.rows
      ? '<div style="background:#F8FAFC;border:1px solid #EDF1F6;border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:5px;">'
        + sc.rows.map(function (r) { return '<div class="mono" style="font-size:12.5px;color:#3D4F63;">' + esc(r) + '</div>'; }).join('')
        + '</div>'
      : '';
    var diff = sc.diff ? beforeAfter(sc.diff, sc.diffLabel, sc.more) : '';
    var foot = sc.foot ? '<div style="font-size:12.5px;color:#8CA0B4;">' + esc(sc.foot) + '</div>' : '';
    var detail = '<div style="display:flex;flex-direction:column;gap:10px;">' + lines + box + diff + foot + '</div>';
    var btns = sc.buttons.map(function (b) {
      return '<button class="btn sm ' + b.cls + '" data-act="' + b.act + '">' + esc(b.label) + '</button>';
    }).join('');
    return '<div class="card" style="border-color:' + t.border + ';overflow:hidden;">'
      + '<div style="background:' + t.headBg + ';padding:14px 18px;display:flex;gap:12px;align-items:flex-start;">'
      + '<div class="chip" style="background:' + t.chipBg + ';margin-top:1px;"><i class="fa-solid ' + t.icon + '" aria-hidden="true"></i>' + t.chip + '</div>'
      + '<div><div style="font-size:14.5px;font-weight:600;color:' + t.titleColor + ';">' + esc(sc.title) + '</div>'
      + '<div style="font-size:12.5px;color:' + t.titleColor + ';opacity:.75;margin-top:3px;">' + esc(sc.meta) + '</div></div></div>'
      + '<div style="padding:16px 18px;display:flex;flex-direction:column;gap:12px;">'
      + '<div style="font-size:13.5px;color:#3D4F63;line-height:1.6;">' + esc(sc.summary) + '</div>'
      + '<div style="display:flex;gap:10px;flex-wrap:wrap;">' + btns + '</div>'
      + disc('syncfail-detail', 'fa-list-ul', sc.detailLabel || 'See the details', 'What happened, and the exact rows affected', detail)
      + '</div></div>';
  }

  /* Locked automated sync (stage 'qualifying'). The progress tracker is the hero;
     the how-it-works explanation and the run history collapse behind expanders so
     first entry is light. Returns the inner column only — syncTab() adds the
     state-naming header above it. */
  function lockedBody() {
    var d = syncDone(), toGo = SYNC_GATE - d, done = d >= SYNC_GATE;
    var segs = '';
    for (var i = 0; i < SYNC_GATE; i++) {
      segs += '<div style="flex:1;height:9px;border-radius:5px;background:' + (i < d ? '#12B76A' : '#E1E7EE') + ';"></div>';
    }
    var runs = [];
    if (done) runs.push({ mark: '✓', bg: '#12B76A', label: 'Clean import — 1 added, 5 updated', sub: 'Streak 4 of ' + SYNC_GATE + ' · unlocked automation', date: 'Today' });
    runs.push(
      { mark: '✓', bg: '#12B76A', label: 'Clean import — 2 added, 14 updated', sub: 'Streak 3 of ' + SYNC_GATE + (done ? '' : ' · one more unlocks automation'), date: 'Aug 28' },
      { mark: '✓', bg: '#12B76A', label: 'Clean import — 0 added, 9 updated',  sub: 'Streak 2 of ' + SYNC_GATE, date: 'Aug 21' },
      { mark: '✓', bg: '#12B76A', label: 'Clean import — 1 added, 6 updated',  sub: 'Streak 1 of ' + SYNC_GATE, date: 'Aug 14' },
      { mark: '✕', bg: '#D92D20', label: 'Import had errors — file arrived as .xlsx instead of .csv', sub: 'Streak reset — any error starts the count over', date: 'Aug 5' }
    );
    var runsHtml = runs.map(function (q) {
      return '<div style="display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-top:1px solid #F3F6FA;">'
        + '<div style="width:20px;height:20px;border-radius:50%;background:' + q.bg + ';color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex:0 0 20px;margin-top:1px;">' + q.mark + '</div>'
        + '<div style="flex:1;"><div style="font-size:12.5px;color:#1B2B3E;">' + esc(q.label) + '</div>'
        + '<div style="font-size:11.5px;color:#8CA0B4;margin-top:1px;">' + esc(q.sub) + '</div></div>'
        + '<div style="color:#8CA0B4;font-size:12px;white-space:nowrap;">' + q.date + '</div></div>';
    }).join('');
    runsHtml = runsHtml.replace('border-top:1px solid #F3F6FA;', 'border-top:0;');

    // Just unlocked — the 4th clean import came in.
    if (done) {
      var celebrate = '<div class="card" style="padding:24px 22px;text-align:center;">'
        + '<div style="width:54px;height:54px;border-radius:50%;background:#ECFDF3;border:1.5px solid #A6E5C3;color:#067647;font-size:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;"><i class="fa-solid fa-unlock" aria-hidden="true"></i></div>'
        + '<div style="font-size:19px;font-weight:800;">Automated sync is unlocked</div>'
        + '<div style="font-size:13px;color:#5B6B7E;margin:7px auto 0;max-width:430px;line-height:1.55;">Your 4th clean import just came in. SafeLMS will import your roster from SFTP automatically from now on — no manual upload.</div>'
        + '<div style="display:flex;gap:6px;max-width:380px;margin:18px auto 6px;">' + segs + '</div>'
        + '<div style="font-size:12px;color:#8CA0B4;">' + SYNC_GATE + ' of ' + SYNC_GATE + ' clean imports</div>'
        + '<div style="margin-top:18px;"><button class="btn btn--primary" data-act="setSync" data-arg="running">See it running →</button></div>'
        + '</div>';
      return celebrate + disc('locked-runs', 'fa-clock-rotate-left', 'Your recent imports', 'Latest: today', runsHtml);
    }

    var howDetail = 'Automated sync drops your roster file on your SFTP folder and SafeLMS imports it for you — no manual upload. '
      + 'Keep the format, columns, and file-name pattern identical each time; an import with any error resets the streak to zero.';

    var progress = '<div class="card" style="padding:20px 22px;">'
      + '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;">'
      + '<div style="font-size:14px;font-weight:700;">' + d + ' of ' + SYNC_GATE + ' clean imports</div>'
      + '<div style="font-size:12px;font-weight:700;color:#8A5A0B;background:#FFFAEB;border:1px solid #F2D69B;border-radius:6px;padding:5px 11px;white-space:nowrap;">' + toGo + ' to go</div></div>'
      + '<div style="display:flex;gap:6px;">' + segs + '</div>'
      + '<div style="font-size:12.5px;color:#5B6B7E;margin-top:12px;line-height:1.55;">Automated sync imports your roster for you once you’ve had <b>' + SYNC_GATE + ' clean manual imports in a row</b> — ' + toGo + ' more to go.</div>'
      + '<div style="display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap;">'
      + '<button class="btn btn--primary" data-act="goImport">Run a manual import →</button>'
      + '<span style="font-size:12px;color:#8CA0B4;">Unlocks after your ' + ordinal(SYNC_GATE) + ' clean import</span>'
      + '</div></div>';

    return progress
      + disc('locked-how', 'fa-circle-info', 'How automated sync works', 'Imports from SFTP · turns on after ' + SYNC_GATE + ' clean imports', howDetail)
      + disc('locked-runs', 'fa-clock-rotate-left', 'Your recent imports', 'Last checked Aug 19', runsHtml);
  }

  /* Automated sync — single, calm column. It leads with the state-naming header
     (or the failure card when a decision is waiting); the recent activity, the
     how-it-works, and the notification settings all collapse into expanders, so
     first entry is light while every explanation stays one click away. */
  function syncTab() {
    var st = stage();
    var qualifying = st === 'qualifying' || st === 'unlocked';   // both use the locked/progress view
    var failed = st === 'active-failed';
    var showFailure = failed && !state.blessed;
    var showResolved = failed && state.blessed;
    var healthy = st === 'active-healthy';

    var col = '';
    if (qualifying) {
      col = lockedBody();
    } else {
      if (showFailure) col += syncFailureCard();

      // Recent activity — collapsed; the summary line carries the latest event.
      var activity = (showResolved || healthy) ? [
        { label: 'ridgewood_staff_20260901.csv — imported' + (showResolved ? ' after your confirmation (2 added, 41 updated, 8 names)' : ''), when: showResolved ? 'Today, just now' : 'Today, 6:42 AM', dot: '#12B76A' },
        { label: 'ridgewood_staff_20260831.csv — imported (0 added, 6 updated)', when: 'Aug 31, 6:38 AM', dot: '#12B76A' },
        { label: 'ridgewood_staff_20260830.csv — imported (1 added, 3 updated)', when: 'Aug 30, 6:45 AM', dot: '#12B76A' },
        { label: 'ridgewood_staff_20260829.csv — imported (0 added, 11 updated)', when: 'Aug 29, 6:33 AM', dot: '#12B76A' }
      ] : [
        { label: 'ridgewood_staff_20260901.csv — stopped, waiting for your review', when: 'Today, 7:04 AM', dot: '#D92D20' },
        { label: 'ridgewood_staff_20260831.csv — imported (0 added, 6 updated)', when: 'Aug 31, 6:38 AM', dot: '#12B76A' },
        { label: 'ridgewood_staff_20260830.csv — imported (1 added, 3 updated)', when: 'Aug 30, 6:45 AM', dot: '#12B76A' },
        { label: 'ridgewood_staff_20260829.csv — imported (0 added, 11 updated)', when: 'Aug 29, 6:33 AM', dot: '#12B76A' }
      ];
      var actRows = activity.map(function (ev, i) {
        return '<div style="display:flex;align-items:center;gap:12px;padding:9px 0;' + (i ? 'border-top:1px solid #F3F6FA;' : '') + '">'
          + '<div style="width:9px;height:9px;border-radius:50%;background:' + ev.dot + ';flex:0 0 9px;"></div>'
          + '<div style="flex:1;font-size:12.5px;">' + esc(ev.label) + '</div>'
          + '<div style="font-size:12px;color:#8CA0B4;white-space:nowrap;">' + ev.when + '</div></div>';
      }).join('');
      col += disc('sync-activity', 'fa-clock-rotate-left', 'Recent sync activity',
        (showFailure ? '1 file waiting · last clean import Aug 31' : 'Last import ' + activity[0].when.toLowerCase()), actRows);

      // How your sync works — collapsed.
      var howDetail = 'SafeLMS checks your SFTP folder every 30 minutes for a file matching '
        + '<span class="mono" style="font-size:12px;background:#F0F4F9;padding:1px 5px;border-radius:4px;">ridgewood_staff_*.csv</span>. '
        + 'Keep the format, columns, and file-name pattern the same — changing any of them will stop the sync.';
      col += disc('sync-how', 'fa-circle-info', 'How your sync works', 'Checks SFTP every 30 min for ridgewood_staff_*.csv', howDetail);

      // Notifications — collapsed; the recipient editor + toggles live inside.
      var recips = state.recipients.map(function (r, i) {
        var initials = r.name.split(' ').map(function (w) { return w[0]; }).join('');
        return '<div style="display:flex;align-items:center;gap:10px;border:1px solid #EDF1F6;border-radius:8px;padding:8px 10px;">'
          + '<div style="width:28px;height:28px;border-radius:50%;background:#DCE7F2;color:#0E2A43;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:0 0 28px;">' + esc(initials) + '</div>'
          + '<div style="flex:1;min-width:0;"><div style="font-size:13px;font-weight:600;">' + esc(r.name) + '</div>'
          + '<div style="font-size:11.5px;color:#8CA0B4;">' + esc(r.role) + '</div></div>'
          + '<div data-act="removeRecip" data-arg="' + i + '" style="font-size:15px;color:#8CA0B4;cursor:pointer;padding:0 2px;">×</div></div>';
      }).join('');
      var notifDetail = '<div style="font-size:12.5px;color:#5B6B7E;margin-bottom:10px;line-height:1.5;">When a sync fails or needs confirmation, these people are emailed directly — not just whoever logs in next. They don’t need permission to run imports; the person who should know a sync broke often isn’t the one who runs it.</div>'
        + '<div style="display:flex;flex-direction:column;gap:8px;">' + recips + '</div>'
        + '<div style="display:flex;gap:8px;margin-top:10px;">'
        + '<input id="recipInput" placeholder="Add by email…" style="flex:1;min-width:0;padding:7px 10px;border:1px solid #C6D3E1;border-radius:7px;font-size:12.5px;">'
        + '<button class="btn sm btn--outline-blue" data-act="addRecip" style="padding:7px 12px;font-size:12.5px;">Add</button></div>'
        + '<div class="divider" style="margin:14px 0;"></div>'
        + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><span style="font-size:13px;color:#3D4F63;">Email when a sync needs attention</span>'
        + '<div class="toggle" data-act="toggleFail" style="background:' + (state.notifyFail ? '#12B76A' : '#C6D3E1') + ';"><div class="toggle-knob" style="left:' + (state.notifyFail ? '17px' : '2px') + ';"></div></div></div>'
        + '<div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-size:13px;color:#3D4F63;">Email a summary after each successful sync</span>'
        + '<div class="toggle" data-act="toggleSuccess" style="background:' + (state.notifySuccess ? '#12B76A' : '#C6D3E1') + ';"><div class="toggle-knob" style="left:' + (state.notifySuccess ? '17px' : '2px') + ';"></div></div></div>';
      col += disc('sync-notif', 'fa-bell', 'Notifications',
        state.recipients.length + ' ' + (state.recipients.length === 1 ? 'person' : 'people') + ' emailed when a sync needs attention', notifDetail);
    }

    var label = st === 'qualifying' ? 'Automated sync — not available yet' : st === 'unlocked' ? 'Automated sync — just unlocked' : 'Automated sync';
    return '<section data-screen-label="' + label + '">'
      + '<div style="display:flex;flex-direction:column;gap:12px;">'
      + syncStatusHeader() + col + '</div></section>';
  }

  /* V6 PLACEMENT — automated sync is an OPTIONAL section OF THE INTERVIEW: it
     renders inside the same interview chrome (section rail + Import-summary
     monitor), shown as a 6th "Automated sync" section with the import sections
     marked done. Reached from the Review screen and the done screen. */
  function ivSyncView() {
    var rail = '<nav class="iv-rail"><div class="iv-rail-h">Your import</div>'
      + IV_SECTIONS.map(function (sec, si) {
          return '<div class="iv-sec is-done"><span class="iv-sec-ic"><i class="fa-solid fa-check"></i></span>'
            + '<span class="iv-sec-lb">' + esc(sec.label) + '</span></div>';
        }).join('')
      + '<div class="iv-sec is-active"><span class="iv-sec-ic"><i class="fa-solid fa-rotate" aria-hidden="true"></i></span>'
      + '<span class="iv-sec-lb">Automated sync</span><span class="iv-sec-cnt">optional</span></div></nav>';
    var center = '<div>'
      + ivAssist('Optional — set this up and you won’t have to run the interview each time.')
      + '<div class="iv-eyebrow">Optional next step</div>'
      + '<div class="iv-headline">Want this to happen automatically?</div>'
      + '<div class="iv-lede">Automated sync pulls the same roster from SFTP on a schedule and runs the very same checks you just went through — pausing for you only when something needs a decision. It’s an optional add-on; your manual import already did everything for today.</div>'
      + '<div style="margin-top:20px;">' + syncTab() + '</div>'
      + '<div class="iv-nav"><button class="iv-back" data-act="backToImport"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to the interview</button><span></span></div>'
      + '</div>';
    return '<div class="iv-wrap">' + rail + center + ivMonitor() + '</div>';
  }

  function render() {
    var main;
    if (state.view === 'sync') {
      main = '<div class="content">' + ivSyncView() + '</div>';
    } else {
      // Main page: the interview. No banner — automated sync is an optional
      // section reached from Review / the done screen (see ivSyncView).
      main = '<div class="content">' + importTab() + '</div>';
    }

    $app.innerHTML = variantsPanel()
      + '<div class="app">' + sidebar()
      + '<div class="main">' + topbar() + settingsTabsBar() + '<div class="scroll">' + main + '</div></div></div>'
      + (state.fileModal ? fileModalHTML() : '');
  }

  /* -------------------------------------------------------------- interaction */
  function scrollTop() {
    var s = $app.querySelector('.scroll');
    if (s) s.scrollTop = 0;
    window.scrollTo(0, 0);
  }

  // Version B has no sync tab — "go to sync" scrolls to the stacked section instead.
  function scrollToSync(where) {
    var s = $app.querySelector('.scroll');
    if (!s) return;
    if (where === 'autosync') {
      var el = document.getElementById('autosync');
      if (el) { s.scrollTop = Math.max(0, el.offsetTop - 12); return; }
    }
    s.scrollTop = 0;
  }

  $app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    var arg = el.getAttribute('data-arg');

    switch (act) {
      case 'noop': e.preventDefault(); break;
      case 'goImport': case 'backToImport':
        e.preventDefault(); setState({ view: 'import' }); scrollTop(); break;
      case 'goSyncTab': case 'goSync': case 'openSync':
        e.preventDefault(); setState({ view: 'sync' }); scrollTop(); break;
      case 'pickFile': pickFile(arg); scrollTop(); break;
      case 'openFiles': e.preventDefault(); setState({ fileModal: true }); break;
      case 'closeFiles': setState({ fileModal: false }); break;
      /* ---- V6 interview navigation ---- */
      case 'ivNext': {
        var ivS = ivSteps();
        if (!ivAnswered(ivS[state.ivPos])) break;
        setState({ ivPos: Math.min(ivS.length - 1, state.ivPos + 1), ivWhy: false });
        scrollTop(); break;
      }
      case 'ivBack':
        setState({ ivPos: Math.max(0, state.ivPos - 1), ivWhy: false }); scrollTop(); break;
      case 'ivWhy': e.preventDefault(); setState({ ivWhy: !state.ivWhy }); break;
      case 'ivPickDiff': e.preventDefault(); setState({ fileModal: true }); break;
      case 'ivEdit': e.preventDefault(); setState({ ivPos: ivFirstPosOf(arg), ivWhy: false }); scrollTop(); break;
      case 'ivAnswer': {
        e.preventDefault();
        var ivp = arg.split('='), ivk = ivp[0], ivv = ivp[1];
        var iva = {}; for (var iak in state.ivAnswers) iva[iak] = state.ivAnswers[iak];
        iva[ivk] = ivv;
        var ivpatch = { ivAnswers: iva };
        if (ivk === 'deactivate') ivpatch.purgeUsers = (ivv === 'deactivate');
        if (ivk === 'jobs') ivpatch.purgeJobs = (ivv === 'exact');
        setState(ivpatch);
        break;
      }
      case 'back': go(flow()[Math.max(0, flow().indexOf(state.step) - 1)]); scrollTop(); break;
      case 'next': go(flow()[Math.min(flow().length - 1, flow().indexOf(state.step) + 1)]); scrollTop(); break;
      case 'togglePurgeUsers': setState({ purgeUsers: !state.purgeUsers }); break;
      case 'togglePurgeJobs': setState({ purgeJobs: !state.purgeJobs }); break;
      case 'askRep': e.preventDefault(); setState({ repSent: true }); break;
      case 'fixMapping': go('map'); scrollTop(); break;
      case 'replaceFile': setState({ fileId: null, step: 'upload' }); scrollTop(); break;
      case 'changeSettings': go('settings'); scrollTop(); break;
      case 'runImport': setState({ doneCounts: summary(), step: 'done' }); scrollTop(); break;
      case 'restart': setState({ fileId: null, step: 'upload', acks: {}, purgeUsers: false, purgeJobs: false, repSent: false }); scrollTop(); break;
      case 'bless': setState({ blessed: true }); break;
      case 'linkUpload': e.preventDefault(); setState({ fileId: null, step: 'upload' }); scrollTop(); break;
      case 'linkMap': e.preventDefault(); go('map'); scrollTop(); break;
      case 'linkSettings': e.preventDefault(); go('settings'); scrollTop(); break;
      case 'removeRecip': setState({ recipients: state.recipients.filter(function (_, j) { return j !== +arg; }) }); break;
      case 'addRecip': {
        var inp = document.getElementById('recipInput');
        var v = inp && inp.value.trim();
        if (v) setState({ recipients: state.recipients.concat([{ name: v.split('@')[0], role: v }]) });
        break;
      }
      case 'toggleFail': setState({ notifyFail: !state.notifyFail }); break;
      case 'toggleSuccess': setState({ notifySuccess: !state.notifySuccess }); break;
      case 'toggleHelp': e.preventDefault(); setState({ openHelp: state.openHelp === arg ? null : arg }); break;
      case 'closeHelp': e.preventDefault(); setState({ openHelp: null }); break;
      case 'toggleDisc': {
        var d = {}; for (var dk in state.disc) d[dk] = state.disc[dk];
        d[arg] = !d[arg]; setState({ disc: d });
        break;
      }
      case 'toggleVariants': setState({ variantsCollapsed: !state.variantsCollapsed }); break;
      case 'setSync': {
        e.preventDefault();
        var sv = {}; for (var sk in state.variants) sv[sk] = state.variants[sk];
        var m = { off: 'qualifying', running: 'active-healthy', alert: 'active-failed' };
        sv.automationStage = m[arg] || 'qualifying';
        setState({ variants: sv, blessed: false });
        break;
      }
      case 'setVariant': {
        var parts = arg.split(':'), key = parts[0], val = parts[1];
        var vs = {}; for (var k in state.variants) vs[k] = state.variants[k]; vs[key] = val;
        var patch = { variants: vs };
        if (key === 'startTab') patch.tab = val;
        if (key === 'uploadVariant') { patch.fileId = null; patch.step = 'upload'; patch.acks = {}; }
        if (key === 'automationStage' || key === 'syncScenario') patch.blessed = false;
        setState(patch);
        break;
      }
    }
  });

  $app.addEventListener('change', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (act === 'mapChange') {
      var m = {}; for (var k in state.mapping) m[k] = state.mapping[k];
      m[el.getAttribute('data-arg')] = el.value;
      setState({ mapping: m });
    } else if (act === 'ack') {
      var id = el.getAttribute('data-arg');
      var a = {}; for (var kk in state.acks) a[kk] = state.acks[kk];
      var key = ackKey(id); a[key] = !a[key];
      setState({ acks: a });
    }
  });

  /* --------------------------------------------- Design Toolbox flow-map host */
  function setSyncState(stg, scn) {
    var v = {}; for (var k in state.variants) v[k] = state.variants[k];
    v.automationStage = stg;
    if (scn) v.syncScenario = scn;
    setState({ tab: 'sync', view: 'sync', blessed: false, variants: v });
  }

  function reviewFor(fileId, pu, pj) {
    setState({ tab: 'import', view: 'import', fileId: fileId, mapping: defaultMapping(fileId),
      purgeUsers: !!pu, purgeJobs: !!pj, repSent: false, acks: {}, step: 'review', validating: false });
  }

  /* V6: jump the guided interview to a given file + question position (+ answers). */
  function ivGoto(fileId, pos, ans) {
    var a = ans || {};
    setState({ tab: 'import', view: 'import', fileId: fileId, mapping: defaultMapping(fileId),
      step: 'iv', ivPos: pos, ivAnswers: a, ivWhy: false,
      purgeUsers: a.deactivate === 'deactivate', purgeJobs: a.jobs === 'exact',
      repSent: false, acks: {}, validating: false });
  }

  function applyFlowState(id) {
    switch (id) {
      /* Manual import = the guided interview (one node per section + a branch at Double-check) */
      case 'upload': setState({ tab: 'import', view: 'import', step: 'upload', fileId: null, ivPos: 0, ivAnswers: {}, validating: false }); break;
      case 'iv-file':     ivGoto('confirm', 0); break;   // Your file — confirm the picked file
      case 'iv-columns':  ivGoto('confirm', 1); break;   // Your columns — matched checklist
      case 'iv-existing': ivGoto('confirm', 2); break;   // Existing users — deactivate question
      case 'iv-checks-clean':   ivGoto('clean', 4); break;    // Double-check — nothing to fix
      case 'iv-checks-confirm': ivGoto('confirm', 4); break;  // Double-check — a Yes/No confirm (name change)
      case 'iv-checks-blocked': ivGoto('dupes', 4); break;    // Double-check — a hard stop with a fix path
      case 'iv-review': ivGoto('confirm', 5, { columns: 'yes', deactivate: 'keep', jobs: 'add', 'check:name': 'yes' }); break;
      case 'done': setState({ tab: 'import', view: 'import', fileId: 'confirm', doneCounts: summaryFor('confirm', false, false), step: 'done', validating: false }); break;
      /* Automated sync — one node per severity path */
      case 'sync-locked':   setSyncState('qualifying', null); break;          // NOT AVAILABLE — qualifying ("N to go")
      case 'sync-healthy':  setSyncState('active-healthy', null); break;      // INFO — up to date
      case 'sync-failed':   setSyncState('active-failed', 'confirm'); break;  // CONFIRM — approve changes
      case 'sync-blocked':  setSyncState('active-failed', 'blocked'); break;  // BLOCKED — fix at source
      case 'sync-escalate': setSyncState('active-failed', 'escalate'); break; // CONTACT VECTOR
      default: break;
    }
    scrollTop();
  }
  window.applyFlowState = applyFlowState;

  function bootFromHash() {
    var m = (location.hash || '').match(/fm=([\w-]+)/);
    if (m) { try { applyFlowState(decodeURIComponent(m[1])); } catch (e) {} }
  }
  window.addEventListener('hashchange', bootFromHash);

  window.TOOLBOX_CONFIG = {
    flowMap: {
      title: 'Self-Serve Bulk User Import — Flow Map',
      applyState: 'applyFlowState',
      canvas: { w: 1680, h: 1300 },
      flows: [
        { id: 'import', name: 'Guided interview — section walk', pill: 'A', color: '#c9d9f0',
          lane: { x: 20, y: 20, w: 1640, h: 790 }, labelXY: { x: 40, y: 46 } },
        { id: 'sync', name: 'Automated sync — severity paths', pill: 'B', color: '#c9b8f0',
          lane: { x: 20, y: 850, w: 1640, h: 420 }, labelXY: { x: 40, y: 876 } }
      ],
      nodes: [
        /* ── Manual import = the GUIDED INTERVIEW: a linear section walk with a
           branch at Double-check (clean / confirm / blocked). ── */
        { id: 'upload', flow: 'import', entry: true, x: 40, y: 250, step: 'Welcome', name: 'Interview intro', state: 'upload',
          desc: 'TurboTax-style welcome: what the interview will cover, then “Choose your file to begin.” Nothing imports until the final review.' },
        { id: 'iv-file', flow: 'import', x: 300, y: 250, step: '1 · Your file', name: 'Confirm your file', state: 'iv-file',
          desc: 'First question: confirm the picked file (name + row count) or choose a different one. The section rail + running Import-summary monitor appear here.' },
        { id: 'iv-columns', flow: 'import', x: 560, y: 250, step: '2 · Your columns', name: 'Match your columns', state: 'iv-columns',
          desc: 'Shows the auto-matched columns as a checklist and asks a yes/adjust question. “Let me adjust” reveals the mapping dropdowns inline.' },
        { id: 'iv-existing', flow: 'import', x: 820, y: 250, step: '3 · Existing users', name: 'Two questions', state: 'iv-existing',
          desc: 'Two plain-language questions (deactivate users not in file? / make positions & locations exactly match?) — the deactivate/remove model, each with a “Why are we asking?” expander and safe recommended default.' },

        { id: 'iv-checks-clean', flow: 'import', x: 1090, y: 90, step: '4 · Double-check', name: 'Nothing to fix', state: 'iv-checks-clean',
          desc: 'Clean path: “Nothing to fix — this file is clean.” Straight on to the review.' },
        { id: 'iv-checks-confirm', flow: 'import', x: 1090, y: 250, step: '4 · Double-check', name: 'Confirm (Yes/No)', state: 'iv-checks-confirm',
          desc: 'A confirm-tier double-check asked as a Yes/No with an A→B example (e.g. Susan → Sue: same person?). Must be answered to reach the review.' },
        { id: 'iv-checks-blocked', flow: 'import', x: 1090, y: 410, step: '4 · Double-check', name: 'Hard stop + fix path', state: 'iv-checks-blocked',
          desc: 'A blocked/escalate double-check ends the interview with “How to fix it” + Fix &amp; upload again (and a link to Vector upload-error help). No Continue.' },

        { id: 'iv-review', flow: 'import', x: 1360, y: 160, step: '5 · Review', name: 'Here’s what you told us', state: 'iv-review',
          desc: 'Restates every answer with per-row Edit links (jump back to that section) and a “heads up” note for any destructive choice, then Import N rows (enabled only when ready).' },
        { id: 'done', flow: 'import', x: 1360, y: 330, step: 'Done', name: 'Import complete', state: 'done',
          desc: 'Reached from the review. Irreversible once run — the design leans on prevention, not undo.' },

        /* ── Automated sync: locked (qualifying) → healthy → the three tiers ── */
        { id: 'sync-locked', flow: 'sync', entry: true, x: 40, y: 900, step: 'Not available', name: 'Locked — qualifying', state: 'sync-locked',
          desc: 'Automated sync is locked until 4 clean manual imports in a row. Shows the "N to go" tracker and why the tab is unavailable. (Gate = 4 per the PRD.)' },
        { id: 'sync-healthy', flow: 'sync', x: 360, y: 900, step: 'Info', name: 'Info — up to date', state: 'sync-healthy',
          desc: 'The clean path: the last sync applied its changes, nothing is waiting, next check within 30 min.' },
        { id: 'sync-failed', flow: 'sync', x: 680, y: 900, step: 'Confirm', name: 'Confirm — approve changes', state: 'sync-failed',
          desc: 'Sync stopped on CONFIRM-tier changes (name changes). Same row-level view; the customer approves and applies in place — no case.' },
        { id: 'sync-blocked', flow: 'sync', x: 1000, y: 900, step: 'Blocked', name: 'Blocked — fix at source', state: 'sync-blocked',
          desc: 'Sync stopped on a BLOCKED change (username format drift would rewrite most accounts). Can’t self-apply — fix the export or use the manual uploader.' },
        { id: 'sync-escalate', flow: 'sync', x: 1320, y: 900, step: 'Contact Vector', name: 'Contact Vector — email collision', state: 'sync-escalate',
          desc: 'Sync stopped on a pre-existing on-site email collision. Resolves only via Vector; the sync resumes after the merge.' }
      ],
      edges: [
        ['upload', 'iv-file'], ['iv-file', 'iv-columns'], ['iv-columns', 'iv-existing'],
        ['iv-existing', 'iv-checks-clean'], ['iv-existing', 'iv-checks-confirm'], ['iv-existing', 'iv-checks-blocked'],
        ['iv-checks-clean', 'iv-review'], ['iv-checks-confirm', 'iv-review'],
        ['iv-review', 'done'],
        ['sync-locked', 'sync-healthy'],
        ['sync-healthy', 'sync-failed'], ['sync-healthy', 'sync-blocked'], ['sync-healthy', 'sync-escalate']
      ]
    }
  };

  render();
  bootFromHash();
})();
</script>
