<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SafeLMS — Bulk User Import</title>

<!-- Font Awesome 6 PRO (self-hosted at repo root; depth-relative). -->
<link rel="stylesheet" href="../../../../assets/fontawesome/css/all.min.css" />

<!-- IBM Plex — the design's typeface (Sans for UI, Mono for data values). -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>

<style>
  /* ==========================================================================
     Self-Serve Bulk User Import (SAFELMS-32693)
     Ported from the Claude Design source "Bulk User Import.dc.html".
     Vanilla HTML/CSS/JS — no frameworks (per project rules).
     ========================================================================== */

  :root {
    /* Brand / surface */
    --navy: #0E2A43; --navy-2: #16395B; --navy-3: #1B4266; --navy-track: #6B839C;
    --bg: #F2F5F9;
    /* Ink */
    --ink: #1B2B3E; --ink-2: #3D4F63; --muted: #5B6B7E; --muted-2: #8CA0B4;
    /* Lines */
    --line: #E1E7EE; --line-2: #EDF1F6; --line-3: #F3F6FA; --btn-border: #C6D3E1;
    /* Blue */
    --blue: #1257B8; --blue-2: #0C3F87; --blue-accent: #1F7AE0;
    /* Green */
    --green: #12B76A; --green-ink: #067647; --green-bg: #ECFDF3; --green-border: #A6E5C3;
    /* Amber */
    --amber: #DC8A12; --amber-ink: #8A5A0B; --amber-bg: #FFFAEB; --amber-border: #F2D69B;
    /* Red */
    --red: #D92D20; --red-ink: #B42318; --red-ink-2: #912018; --red-bg: #FEF3F2; --red-border: #F1C0BB;

    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); font-family: var(--sans); color: var(--ink); }
  a { color: var(--blue); text-decoration: none; }
  a:hover { color: var(--blue-2); text-decoration: underline; }
  input, select, button { font-family: var(--sans); }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeup { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .fadeup { animation: fadeup .25s ease; }

  /* ==========================================================================
     App shell — authentic VectorSolutions / SafeLMS product chrome.
     Matches the reference SafeLMS mocks (async-reports / reports): a compact
     white 160px sidebar with the VectorSolutions pinwheel logo + nav, a blue
     gradient topbar, and a gray content canvas. Only the chrome is SafeLMS;
     the bulk-import content keeps its own IBM Plex design language.
     ========================================================================== */
  .app { display: grid; grid-template-columns: 168px minmax(0, 1fr); grid-template-rows: 100vh;
    height: 100vh; overflow: hidden; }

  /* ---- Sidebar (white, hairline right border) ---- */
  .sidebar { background: #fff; border-right: 1px solid var(--line-2); padding: 14px 16px 12px;
    display: flex; flex-direction: column; min-height: 0; }
  .logo { display: flex; align-items: center; gap: 7px; padding: 2px; }
  .logo .wordmark { display: flex; flex-direction: column; line-height: 1; }
  .logo .wordmark .brand { font-weight: 700; font-size: 13px; letter-spacing: .1px; color: #374C61; }
  .logo .wordmark .brand sup { font-size: 7px; font-weight: 700; }
  .logo .wordmark .sub { font-size: 8px; margin-top: 3px; color: var(--muted); letter-spacing: .2px; }

  .user { display: flex; align-items: center; gap: 9px; margin: 18px 0 2px; padding: 0 2px; }
  .user .avatar { width: 28px; height: 28px; border-radius: 50%; background: #DCE7F2; color: var(--navy);
    font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: 0 0 28px; }
  .user .name { font-size: 12px; line-height: 1.3; color: #364153; min-width: 0; }
  .user .name span { color: var(--muted); }
  .user .name b { display: block; font-weight: 600; color: var(--ink); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }

  .nav-scroll { flex: 1; min-height: 0; overflow-y: auto; margin: 4px -6px 0; padding: 0 6px; }
  .nav-group { margin-top: 16px; }
  .nav-group .glabel { font-size: 10px; font-weight: 700; letter-spacing: .8px; color: var(--muted-2);
    padding: 4px 6px; margin-bottom: 2px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 5px;
    font-size: 12px; color: #364153; cursor: pointer; }
  .nav-item:hover { background: var(--line-3); }
  .nav-item .ico { width: 16px; display: flex; align-items: center; justify-content: center;
    color: #4A5565; flex: 0 0 16px; font-size: 12.5px; }
  .nav-item .chev { margin-left: auto; color: var(--muted-2); font-size: 9px; }
  .nav-item.is-active { font-weight: 700; color: var(--ink); background: #EAF1FC; }
  .nav-item.is-active .ico { color: var(--blue); }

  .sidebar-footer { display: grid; place-items: center; padding-top: 10px; }

  /* ---- Main column ---- */
  /* min-height:0 lets .main clamp to the 100vh grid row instead of growing to its
     content height — without it, tall content overflows the overflow:hidden shell
     and .scroll never becomes scrollable. */
  .main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }

  /* Blue topbar */
  .topbar { height: 60px; flex: 0 0 60px; color: #fff; display: flex; align-items: center; gap: 14px;
    padding: 0 24px; background: linear-gradient(180deg, #1747E6 0%, #1447E6 50%, #1038C8 100%); }
  .topbar .t-title { font-weight: 700; font-size: 20px; letter-spacing: .2px; white-space: nowrap; }
  .topbar .t-sub { font-size: 12.5px; color: #E9F0FF; opacity: .95; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .topbar-site { margin-left: auto; flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px;
    background: #fff; border-radius: 7px; padding: 7px 12px; color: var(--ink); font-size: 12.5px;
    font-weight: 600; cursor: pointer; white-space: nowrap; }
  .topbar-site .lbl { color: var(--muted); font-weight: 500; }
  .topbar-site .caret { color: var(--muted-2); font-size: 10px; }

  .scroll { flex: 1; min-height: 0; overflow-y: auto; background: #EEF1F5; }
  .content { max-width: 1060px; margin: 0 auto; padding: 22px 32px 72px; }

  /* ---- Tabs ---- */
  .tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--line); margin: 20px 0 24px; }
  .tab { padding: 9px 16px; font-size: 14px; font-weight: 500; color: var(--muted);
    border: none; background: none; border-bottom: 2px solid transparent; margin-bottom: -2px;
    cursor: pointer; display: flex; align-items: center; gap: 7px; }
  .tab.is-active { font-weight: 600; color: var(--blue); border-bottom-color: var(--blue); }
  .dot-red { width: 8px; height: 8px; border-radius: 50%; background: var(--red); display: inline-block; }

  /* ---- Stepper ---- */
  .stepper { display: flex; align-items: center; margin-bottom: 26px; }
  .step { display: flex; align-items: center; }
  .step-body { display: flex; align-items: center; gap: 8px; }
  .step-circle { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 12px; font-weight: 600; }
  .step-label { font-size: 13px; white-space: nowrap; }
  .step-conn { width: 44px; height: 1.5px; background: #D5DEE8; margin: 0 12px; }

  /* ---- Cards & generic ---- */
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; }
  .divider { height: 1px; background: var(--line-2); }

  /* ---- Buttons ---- */
  .btn { border: none; font-size: 13.5px; font-weight: 600; padding: 9px 16px; border-radius: 7px; cursor: pointer; }
  .btn.sm { font-size: 13px; padding: 8px 14px; }
  .btn--primary { background: var(--blue); color: #fff; }
  .btn--primary:hover { background: var(--blue-2); }
  .btn--ghost { border: 1px solid var(--btn-border); background: #fff; color: var(--ink-2); }
  .btn--ghost:hover { background: #F5F8FB; }
  .btn--outline-blue { border: 1px solid var(--btn-border); background: #fff; color: var(--blue); }
  .btn--outline-blue:hover { background: #F0F6FD; }
  .btn--danger { border: none; background: var(--red-ink); color: #fff; }
  .btn--danger:hover { background: var(--red-ink-2); }
  .btn--disabled { background: var(--btn-border); color: #fff; cursor: not-allowed; }

  /* ---- Upload ---- */
  .banner { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px;
    margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .dropzone { background: #fff; border: 1.5px dashed #B9C9DA; border-radius: 10px; padding: 36px 20px; text-align: center; }
  .dropzone-icon { width: 44px; height: 44px; border-radius: 10px; background: #EDF3FA; margin: 0 auto 10px;
    display: flex; align-items: center; justify-content: center; font-size: 19px; color: var(--blue); }
  .section-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted-2); margin-bottom: 10px; }
  .file-row { background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 12px 16px;
    display: flex; align-items: center; gap: 14px; cursor: pointer; transition: border-color .12s, box-shadow .12s; }
  .file-row:hover { border-color: var(--blue-accent); box-shadow: 0 1px 4px rgba(15,42,67,.08); }
  .file-badge { width: 34px; height: 34px; border-radius: 7px; background: #F0F4F9; display: flex;
    align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--muted); }
  .mono { font-family: var(--mono); }

  /* ---- Map grid ---- */
  .map-grid { display: grid; grid-template-columns: 180px 1fr 1fr 90px; }
  .map-head { font-size: 12px; font-weight: 600; color: var(--muted-2); text-transform: uppercase;
    letter-spacing: .6px; padding: 10px 20px; border-bottom: 1px solid var(--line-2); }
  .map-row { align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--line-3); }
  .map-select { width: 100%; padding: 7px 10px; border: 1px solid var(--btn-border); border-radius: 7px;
    font-size: 13px; background: #fff; color: var(--ink); }

  /* ---- Settings radios ---- */
  .radio-card { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 16px 18px;
    cursor: pointer; display: flex; gap: 12px; }
  .radio-card:hover { border-color: var(--blue-accent); }
  .radio-dot { width: 18px; height: 18px; border-radius: 50%; background: #fff; flex: 0 0 18px; margin-top: 1px; }

  /* ---- Review alerts ---- */
  .chip { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: #fff;
    border-radius: 5px; padding: 3px 8px; white-space: nowrap;
    display: inline-flex; align-items: center; gap: 5px; }
  /* Severity icon travels inside the chip so the tier reads by SHAPE, not color
     alone (WCAG 1.4.1 — don't use color as the only visual means). */
  .chip i { font-size: 10.5px; }
  .alert { border: 1px solid; border-radius: 10px; overflow: hidden; background: #fff; }
  .alert-head { padding: 14px 18px; display: flex; gap: 12px; align-items: flex-start; }
  .alert-title { font-size: 14.5px; font-weight: 600; }
  .alert-body { padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
  .alert-line { font-size: 13.5px; line-height: 1.55; }
  .alert-line b { font-weight: 600; color: var(--muted); }
  .diff-grid { display: grid; grid-template-columns: 56px 130px 1fr 1fr 1fr; }
  .diff-head { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
    color: var(--muted-2); background: #F8FAFC; padding: 7px 12px; }
  .diff-row { font-size: 12.5px; padding: 7px 12px; border-top: 1px solid var(--line-3); align-items: center; }
  .more-link { font-size: 12px; color: var(--blue); border-top: 1px solid var(--line-3); padding: 7px 12px; cursor: pointer; }

  /* ---- Side-by-side "Now → After you accept" comparison ---- */
  .ba { display: flex; flex-direction: column; gap: 12px; }
  .ba-head { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
    color: var(--muted-2); margin-bottom: 6px; }
  .ba-grid { display: grid; grid-template-columns: 1fr 30px 1fr; align-items: stretch; }
  .ba-card { border: 1px solid var(--line-2); border-radius: 8px; padding: 10px 14px; }
  .ba-before { background: #F8FAFC; }
  .ba-after { background: #F7FAFE; border-color: #C6D9F0; }
  .ba-after.is-loss { background: #FEF7F6; border-color: var(--red-border); }
  .ba-arrow { display: flex; align-items: center; justify-content: center; color: var(--muted-2); font-size: 16px; }
  .ba-label { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--muted-2); }
  .ba-val { font-size: 13px; color: var(--ink); margin-top: 5px; font-weight: 500; word-break: break-word; }
  .ba-val.is-loss-text { color: var(--red-ink); }
  .ba-sub { font-size: 11.5px; color: var(--muted-2); margin-top: 5px; line-height: 1.45; }
  .ba-sub.is-loss-sub { color: var(--red-ink); }
  .ba-more { font-size: 12px; color: var(--blue); cursor: pointer; }
  @media (max-width: 620px) { .ba-grid { grid-template-columns: 1fr; } .ba-arrow { transform: rotate(90deg); padding: 3px 0; } }

  /* ---- KPI sidebar ---- */
  .kpi-eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; color: var(--muted-2); }
  .kpi-row { display: flex; justify-content: space-between; align-items: baseline; }
  .kpi-row .k { font-size: 13.5px; color: var(--ink-2); }
  .kpi-row .v { font-size: 18px; font-weight: 700; }

  /* ---- Toggle ---- */
  .toggle { width: 34px; height: 19px; border-radius: 10px; position: relative; cursor: pointer; transition: background .15s; }
  .toggle-knob { width: 15px; height: 15px; border-radius: 50%; background: #fff; position: absolute; top: 2px; transition: left .15s; }

  /* ---- Settings: deactivate / remove options + live example ---- */
  .opt-row { background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 15px 18px;
    display: flex; gap: 14px; align-items: flex-start; margin-bottom: 12px; }
  .opt-row.is-on.is-danger { border-color: var(--red-border); background: #FEF7F6; }
  .opt-main { flex: 1; min-width: 0; }
  .opt-title { font-size: 14px; font-weight: 600; }
  .opt-sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .ex-card { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; }
  .ex-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--muted-2); margin-bottom: 8px; }
  .job-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; border-radius: 6px; padding: 3px 9px; margin: 3px 5px 0 0; }
  .job-keep { background: #F0F4F9; color: var(--ink-2); }
  .job-add { background: var(--green-bg); color: var(--green-ink); }
  .job-remove { background: var(--red-bg); color: var(--red-ink); text-decoration: line-through; }

  /* ---- File-picker modal (prototype stand-in for the OS file chooser) ---- */
  .modal-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(14,42,67,.45);
    display: flex; align-items: center; justify-content: center; padding: 24px; animation: fadeup .16s ease; }
  .modal { background: #fff; border-radius: 12px; width: 560px; max-width: 100%; max-height: 86vh;
    display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 24px 64px rgba(0,0,0,.35); }
  .modal-head { padding: 18px 22px; border-bottom: 1px solid var(--line);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .modal-title { font-size: 16px; font-weight: 700; }
  .modal-sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
  .modal-x { background: none; border: none; color: var(--muted-2); font-size: 17px; cursor: pointer;
    line-height: 1; padding: 3px 7px; border-radius: 6px; }
  .modal-x:hover { background: var(--line-3); color: var(--ink-2); }
  .modal-body { padding: 16px 22px; overflow-y: auto; }
  .modal-foot { padding: 13px 22px; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .modal-drop { border: 1.5px dashed #B9C9DA; border-radius: 10px; padding: 18px; text-align: center; margin-bottom: 16px; }

  /* ---- Settings placement: full-width tab bar under the blue topbar ---- */
  .settings-tabbar { flex: 0 0 auto; background: #fff; border-bottom: 1px solid var(--line);
    padding: 0 32px; display: flex; gap: 2px; overflow-x: auto; }
  .stab { padding: 13px 14px; font-size: 13.5px; font-weight: 500; color: var(--muted);
    border: none; background: none; border-bottom: 2px solid transparent; margin-bottom: -1px;
    cursor: pointer; white-space: nowrap; }
  .stab:hover:not(.is-active) { color: var(--ink-2); }
  .stab.is-active { color: var(--ink); font-weight: 600; border-bottom-color: var(--blue); }

  /* ---- Manual import / Automated sync secondary control (segmented) ---- */
  .subtabs { display: inline-flex; background: #E9EEF4; border-radius: 9px; padding: 3px; gap: 2px; margin-bottom: 22px; }
  .subtab { border: none; background: none; font-size: 13px; font-weight: 600; color: var(--muted);
    padding: 7px 15px; border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .subtab.is-active { background: #fff; color: var(--blue); box-shadow: 0 1px 2px rgba(16,24,40,.16); }

  /* ---- Manual-import walkthrough (overview): full card + compact strip ---- */
  .wt-card { display: flex; gap: 14px; background: #fff; border: 1px solid var(--line);
    border-left: 5px solid var(--blue); border-radius: 8px; padding: 16px 18px; margin-bottom: 20px;
    box-shadow: 0 1px 3px rgba(16,24,40,.06); }
  .wt-icon { flex: 0 0 34px; width: 34px; height: 34px; border-radius: 9px; background: #E1EBF9;
    color: var(--blue); display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .wt-title { font-size: 14.5px; font-weight: 700; }
  .wt-body { font-size: 13px; color: var(--ink-2); line-height: 1.55; margin-top: 3px; }
  .wt-link { margin-top: 7px; font-size: 12.5px; }
  .wt-strip { display: flex; align-items: center; gap: 9px; background: #F5F9FE; border: 1px solid #E1E7EE;
    border-radius: 8px; padding: 9px 14px; margin-bottom: 18px; font-size: 12.5px; color: var(--ink-2); }
  .wt-strip i { color: var(--blue); flex: 0 0 auto; }

  /* ---- Version B: automated sync stacked under manual import ---- */
  .stack-divider { height: 1px; background: var(--line); margin: 44px 0 0; }
  .stack-head { margin: 26px 0 20px; scroll-margin-top: 12px; }
  .stack-title { font-size: 17px; font-weight: 700; }
  .stack-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }

  /* ---- Prototype variant panel (mock-only affordance) ---- */
  /* Anchored bottom-LEFT, over the sidenav's empty lower region — never covers
     the content-area action buttons (Continue / Run import live on the right). */
  .variants { position: fixed; bottom: 14px; left: 14px; z-index: 900; width: 196px;
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,.28); padding: 12px 14px; font-size: 12px; }
  .variants-title { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
    color: var(--muted-2); display: flex; align-items: center; justify-content: space-between; }
  .variants-title .collapse { cursor: pointer; color: var(--muted-2); font-size: 13px; }
  .variants-row { margin-top: 9px; }
  .variants-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted-2); margin-bottom: 5px; }
  .seg { display: flex; border: 1px solid var(--btn-border); border-radius: 7px; overflow: hidden; }
  .seg button { flex: 1; border: none; background: #fff; font-size: 11px; padding: 6px 4px; cursor: pointer; color: var(--muted); }
  .seg button.is-on { background: var(--blue); color: #fff; font-weight: 600; }
  .seg button + button { border-left: 1px solid var(--btn-border); }
  .variants-hint { font-size: 10.5px; color: var(--muted-2); margin-top: 10px; line-height: 1.5; }
  .variants-hint a { font-weight: 600; }
  /* Before → after preview: a stacked list of state buttons. */
  .ba-list { display: flex; flex-direction: column; gap: 5px; }
  .ba-list button { border: 1px solid var(--btn-border); background: #fff; border-radius: 6px; font-size: 11px;
    padding: 7px 9px; cursor: pointer; color: var(--ink-2); text-align: left; line-height: 1.2; }
  .ba-list button:hover { background: #F5F8FB; }
  .ba-list button.is-on { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 600; }
  .variants.is-collapsed .variants-body { display: none; }

  .spinner { width: 28px; height: 28px; border: 3px solid #D5E3F3; border-top-color: var(--blue);
    border-radius: 50%; margin: 0 auto 14px; animation: spin .8s linear infinite; }

  /* ---- Progressive disclosure — a summary row is always visible; the detail
         opens on demand. Used across the automated-sync views so first entry
         stays light without losing any explanation. State-backed (state.disc)
         so open/closed survives the full re-render. ---- */
  .disc { border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; }
  .disc-sum { display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer; }
  .disc-sum:hover { background: #FAFBFD; }
  .disc-ico { width: 30px; height: 30px; border-radius: 8px; background: #EEF2F7; color: #5B6B7E;

  function stepperHTML() {

  function mapHTML() {

    var colOptions = [{ v: NOT_IMPORTED }].concat(cols.map(function (c) { return { v: c[0] }; }));

      + '<div style="font-size:12px;color:#5B6B7E;background:#F0F4F9;border-radius:6px;padding:5px 10px;white-space:nowrap;">' + file.rows + ' rows detected</div></div>'

      + '</div></div>';

  /* "Everything that would change" — itemized deactivations and job removals with
     per-item people counts, so the scope + permanence are visible while choosing. */
  function impactBreakdown() {
    var pu = state.purgeUsers, pj = state.purgeJobs, sum = summary();
    if (!pu && !pj) {
      return '<div class="ex-card" style="margin-bottom:0;"><div style="font-size:13px;color:#3D4F63;line-height:1.6;">'

    }
    var out = '<div style="background:#FEF7F6;border:1px solid #F1C0BB;border-radius:8px;padding:10px 13px;font-size:12.5px;color:#B42318;margin-bottom:12px;line-height:1.5;">'
      + '<b>This is permanent.</b> Deactivations and removals — and the training tied to a removed job — can’t be undone once you run the import.</div>';

    if (pu) {
      var ds = IMPACT.deacts.slice(0, 3);
      out += '<div class="ex-card" style="margin-bottom:10px;">'
        + '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">'
        + '<div class="ex-eyebrow" style="margin:0;">Users deactivated</div>'
        + '<div style="font-size:13px;font-weight:700;color:#B42318;white-space:nowrap;">' + sum.deact + ' people lose access</div></div>'
        + ds.map(function (d) {
            return '<div style="display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:6px 0;border-top:1px solid #F3F6FA;">'
              + '<div><span style="font-weight:600;">' + esc(d.name) + '</span> <span class="mono" style="color:#8CA0B4;font-size:11.5px;">' + esc(d.user) + '</span></div>'

        + '</div>';
    }
    if (pj) {
      var js = IMPACT.jobs.slice(0, 3);
      out += '<div class="ex-card" style="margin-bottom:0;">'
        + '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;">'
        + '<div class="ex-eyebrow" style="margin:0;">Positions &amp; locations removed</div>'
        + '<div style="font-size:13px;font-weight:700;color:#B42318;white-space:nowrap;">' + sum.jobsRemoved + ' removed · ' + sum.jobsPeople + ' people</div></div>'
        + js.map(function (j) {
            return '<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12.5px;padding:6px 0;border-top:1px solid #F3F6FA;">'
              + '<div><span class="job-chip job-remove" style="margin:0;">' + esc(j.pos + ' · ' + j.loc) + '</span>'
              + (j.note ? ' <span style="color:#8CA0B4;font-size:11.5px;">(' + esc(j.note) + ')</span>' : '') + '</div>'
              + '<div style="color:#B42318;white-space:nowrap;">from ' + j.people + ' ' + (j.people === 1 ? 'person' : 'people') + '</div></div>';
          }).join('')
        + '<div class="ba-more" style="margin-top:6px;">Show all ' + sum.jobsRemoved + ' changes</div>'
        + '<div style="font-size:12px;color:#5B6B7E;margin-top:9px;line-height:1.5;border-top:1px solid #F3F6FA;padding-top:9px;">Touches <b>' + sum.pos + ' positions</b> across <b>' + sum.loc + ' locations</b>. Removing a job also removes the training assigned to it.</div>'
        + '</div>';
    }
    return out;
  }

  /* Import settings — two independent, off-by-default choices ("deactivate/remove",
     the customer wording for purge), each destructive. Shows the full itemized
     impact (who/what changes and how many people) as the toggles flip, so the
     scope is concrete before anything runs. Re-confirmed with a review next step. */
  function settingsHTML() {
    var file = FILES.find(function (f) { return f.id === state.fileId; });
    var pu = state.purgeUsers, pj = state.purgeJobs;

    function optRow(on, act, title, sub) {
      return '<div class="opt-row' + (on ? ' is-on is-danger' : '') + '">'

        + '<div class="toggle-knob" style="left:' + (on ? '17px' : '2px') + ';"></div></div>'
        + '<div class="opt-main"><div class="opt-title">' + title + '</div><div class="opt-sub">' + sub + '</div></div></div>';
    }

    // Per-person example — a user in the file whose jobs differ (remove-jobs effect)
    var chips = '<span class="job-chip job-keep">Teacher · Lincoln Elementary</span>'
      + (pj ? '<span class="job-chip job-remove">Coach · Ridgewood High</span>'
            : '<span class="job-chip job-keep">Coach · Ridgewood High</span>')
      + '<span class="job-chip job-add">+ Counselor · Lincoln Elementary</span>';
    var jobNote = pj
      ? 'Coach · Ridgewood High is <b>removed</b> and Counselor · Lincoln Elementary is <b>added</b> — her record becomes an exact mirror of the file.'
      : 'Counselor · Lincoln Elementary is <b>added</b>; everything she already has is <b>kept</b> — nothing is removed.';
    var exJobs = '<div class="ex-card" style="margin-bottom:0;">'
      + '<div class="ex-eyebrow">A user in your file with changed jobs — Maya Torres</div>'
      + '<div style="font-size:12px;color:#5B6B7E;margin-bottom:6px;">Her positions &amp; locations after import:</div>'
      + '<div style="margin-bottom:9px;">' + chips + '</div>'
      + '<div style="font-size:12px;color:#3D4F63;line-height:1.5;">' + jobNote + '</div></div>';

    var repRow = state.repSent
      ? '<div style="margin-top:14px;background:#ECFDF3;border:1px solid #A6E5C3;border-radius:8px;padding:9px 12px;font-size:12.5px;color:#067647;"><span style="font-weight:600;">Sent to your Vector rep.</span> They’ll follow up by email to help you choose — nothing runs in the meantime.</div>'
      : '<div style="font-size:12.5px;color:#5B6B7E;margin-top:14px;">Not sure which to choose? <a href="#" data-act="askRep">Send this file to your Vector rep for help →</a></div>';

    return '<div class="fadeup" style="max-width:900px;">'
      + '<div style="font-size:15px;font-weight:600;margin-bottom:4px;">What should happen to users and jobs that aren’t in this file?</div>'
      + '<div style="font-size:13px;color:#5B6B7E;margin-bottom:16px;">This site has ' + TOTAL + ' active users. Your file contains ' + file.rows + ' rows. Both options are off by default — nothing is removed unless you turn it on, and you’ll confirm the exact changes on the next step.</div>'
      + '<div style="display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;">'
      + '<div style="flex:1;min-width:330px;">'
      + optRow(pu, 'togglePurgeUsers', 'Deactivate users not in this file',
          'Any active user missing from the file loses access. Their training history is kept and they reactivate if they appear in a later file. Leave off for partial lists — new hires, one building, one department.')
      + optRow(pj, 'togglePurgeJobs', 'Remove positions &amp; locations not in this file',
          'For users in the file, any position or location they hold that isn’t in the file is removed — so the file becomes the exact record. Leave off to only add what’s new and keep everything else.')
      + '<div style="background:#F5F9FE;border:1px solid #E1E7EE;border-radius:9px;padding:12px 14px;font-size:12.5px;color:#3D4F63;line-height:1.7;">'
      + '<div style="font-weight:600;color:#1B2B3E;margin-bottom:3px;">With these settings</div>'
      + '• ' + (pu ? 'Users missing from your file are <b>deactivated</b>.' : 'Users missing from your file <b>stay active</b>.') + '<br>'
      + '• ' + (pj ? 'Each user’s positions &amp; locations are <b>synced to exactly match</b> the file.' : 'New positions &amp; locations are <b>added</b>; existing ones are <b>kept</b>.')
      + '</div>' + repRow
      + '</div>'
      + '<div style="flex:1;min-width:300px;"><div class="section-eyebrow" style="margin-bottom:10px;">What would change on your site</div>'
      + impactBreakdown()
      + '<div style="margin-top:14px;">' + exJobs + '</div></div>'
      + '</div>'
      + '<div style="display:flex;justify-content:space-between;margin-top:22px;">'
      + '<button class="btn btn--ghost" data-act="back">← Back</button>'
      + '<button class="btn btn--primary" data-act="next">Review changes →</button>'
      + '</div></div>';
  }

  /* Side-by-side "Now in SafeLMS → After you <accept/import/sync>" per changed row.
     Shows the current record, the resulting record, and (as a caption) what the
     file actually provides — so the consequence of accepting is concrete, and
     deactivations read as a loss (red). */
  function beforeAfter(diff, afterLabel, more) {
    var rows = diff.map(function (d) {
      var deact = /Deactivat/i.test(d.result);
      var head = (d.row && d.row !== '—') ? ('Row ' + d.row + ' · ' + d.field) : d.field;
      var sub = deact
        ? 'Missing from this file → loses access immediately · training history kept'
        : (d.incoming && d.incoming !== d.result ? 'From your file: ' + d.incoming : '');
      return '<div class="ba-row">'
        + '<div class="ba-head">' + esc(head) + '</div>'
        + '<div class="ba-grid">'
          + '<div class="ba-card ba-before"><div class="ba-label">Now in SafeLMS</div>'
          + '<div class="ba-val mono">' + esc(d.current) + '</div></div>'
          + '<div class="ba-arrow">→</div>'
          + '<div class="ba-card ba-after' + (deact ? ' is-loss' : '') + '">'
          + '<div class="ba-label">' + esc(afterLabel) + '</div>'
          + '<div class="ba-val mono' + (deact ? ' is-loss-text' : '') + '">' + esc(d.result) + '</div>'
          + (sub ? '<div class="ba-sub' + (deact ? ' is-loss-sub' : '') + '">' + esc(sub) + '</div>' : '')
          + '</div>'
        + '</div></div>';
    }).join('');
    return '<div class="ba">' + rows + (more ? '<div class="ba-more">' + esc(more) + '</div>' : '') + '</div>';
  }
