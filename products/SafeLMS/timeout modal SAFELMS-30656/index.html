  <style>

    /* ── Screen-reader-only live region ── */
    .sr-only {

    .loggedout-icon {

    /* ── Demo control panel ── */

    .demo-btn {
      font-family: 'Open Sans', sans-serif; font-size: 12px; font-weight: 600;
      border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.1); color: white;
      border-radius: 4px; padding: 5px 12px; cursor: pointer; transition: background 0.15s;

    .demo-btn:hover { background: rgba(255,255,255,0.2); }

<body>

  <!-- ════════════════════════════════════════════════════════
       SESSION TIMEOUT WARNING — vaadin-dialog
       WCAG 2.2.1: Timing Adjustable — Level A

       Accessibility notes for production:
       • vaadin-dialog renders role="dialog" by default. Override to
         role="alertdialog" on the overlay element (see JS below) so
         screen readers announce the warning immediately.
       • aria-labelledby and aria-describedby are set on the overlay
         element in the opened-changed handler.
       • vaadin-dialog handles focus trapping and focus restoration natively.
       • no-close-on-outside-click prevents accidental dismissal.
       • Esc key closes the dialog — wire that to extendSession() via
         the opened-changed event (closing = user intent to stay).
       ════════════════════════════════════════════════════════ -->
  <vaadin-dialog id="timeout-dialog" no-close-on-outside-click data-file="products/SafeLMS/timeout modal SAFELMS-30656/index.html" data-line="135"></vaadin-dialog>


  <!-- ════ LOGGED-OUT SCREEN ════ -->
  <div class="loggedout-screen" id="loggedout-screen" data-file="products/SafeLMS/timeout modal SAFELMS-30656/index.html" data-line="139">
    <div class="loggedout-box" aria-labelledby="loggedout-title" data-file="products/SafeLMS/timeout modal SAFELMS-30656/index.html" data-line="140">
      <div class="loggedout-icon" aria-hidden="true" data-file="products/SafeLMS/timeout modal SAFELMS-30656/index.html" data-line="141">
        <i class="fa-solid fa-right-from-bracket"></i>
      </div>
      <div class="loggedout-title" id="loggedout-title" data-file="products/SafeLMS/timeout modal SAFELMS-30656/index.html" data-line="144">You've Been Logged Out</div>
      <p class="loggedout-msg">
        Your session expired due to inactivity. Any unsaved work has been preserved.

      </p>
      <vaadin-button theme="primary" id="btn-login-again" style="margin-top:8px;" data-file="products/SafeLMS/timeout modal SAFELMS-30656/index.html" data-line="149">
        <i class="fa-solid fa-arrow-right-to-bracket" slot="prefix"></i>
        Log In Again
      </vaadin-button>
    </div>
    <div class="loggedout-watermark" data-file="products/SafeLMS/timeout modal SAFELMS-30656/index.html" data-line="154">VectorSolutions SafeLMS</div>
  </div>


  <!-- ════ SESSION-EXTENDED NOTIFICATION ════ -->
  <vaadin-notification id="extend-notification" duration="5000" position="bottom-end" data-file="products/SafeLMS/timeout modal SAFELMS-30656/index.html" data-line="159"></vaadin-notification>


  <!-- ════ DEMO CONTROL PANEL ════ -->
  <div class="demo-panel" role="region" aria-label="Prototype demo controls" data-file="products/SafeLMS/timeout modal SAFELMS-30656/index.html" data-line="163">
    <span class="demo-panel-label" data-file="products/SafeLMS/timeout modal SAFELMS-30656/index.html" data-line="164">Demo</span>
    <button class="demo-btn" id="demo-open" data-file="products/SafeLMS/timeout modal SAFELMS-30656/index.html" data-line="165">
      <i class="fa-solid fa-clock"></i> Show Warning Dialog
    </button>
    <div class="demo-divider" data-file="products/SafeLMS/timeout modal SAFELMS-30656/index.html" data-line="168"></div>
    <button class="demo-btn danger" id="demo-expire" data-file="products/SafeLMS/timeout modal SAFELMS-30656/index.html" data-line="169">
      <i class="fa-solid fa-hourglass-end"></i> Simulate Session Expired
    </button>
    <div class="demo-divider" data-file="products/SafeLMS/timeout modal SAFELMS-30656/index.html" data-line="172"></div>
    <button class="demo-btn" id="demo-reset" data-file="products/SafeLMS/timeout modal SAFELMS-30656/index.html" data-line="173">
      <i class="fa-solid fa-rotate-left"></i> Reset
    </button>
    <span class="demo-note" data-file="products/SafeLMS/timeout modal SAFELMS-30656/index.html" data-line="176">SAFELMS-30656 · WCAG 2.2.1 Timing Adjustable (Level A) · Session timer: 8 hrs inactivity</span>
  </div>


  <script>
    const dialog       = document.getElementById('timeout-dialog');
    const loggedout    = document.getElementById('loggedout-screen');
    const notification = document.getElementById('extend-notification');

    // ── Dialog renderers ──────────────────────────────────────

    dialog.headerRenderer = (root) => {
      if (root.firstChild) return;
      const wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex; align-items:center; gap:14px;';
      wrap.innerHTML = `
        <div class="session-warning-icon" aria-hidden="true">
          <i class="fa-regular fa-clock"></i>
        </div>
        <span id="session-title" style="font-size:18px; font-weight:700; color:#1c3050;">
          Still there?
        </span>
      `;
      root.appendChild(wrap);
    };

    dialog.renderer = (root) => {
      if (root.firstChild) return;

      const desc = document.createElement('p');
      desc.id = 'session-desc';
      desc.style.cssText = 'font-size:14px; color:rgba(0,0,0,0.75); line-height:1.6; margin:0;';
      desc.textContent = "You've been inactive for a while. To help keep your account secure, your session is about to expire and you'll be signed out automatically.";

      // Screen-reader live region — announces warning to AT immediately
      const srLive = document.createElement('div');
      srLive.className = 'sr-only';
      srLive.setAttribute('role', 'status');
      srLive.setAttribute('aria-live', 'assertive');
      srLive.setAttribute('aria-atomic', 'true');
      srLive.textContent = 'Warning: your session is about to expire. Select Continue session to stay logged in.';

      root.appendChild(desc);
      root.appendChild(srLive);
    };

    dialog.footerRenderer = (root) => {
      if (root.firstChild) return;

      const signOutBtn = document.createElement('vaadin-button');
      signOutBtn.setAttribute('theme', 'secondary');
      signOutBtn.textContent = 'Sign out';
      signOutBtn.addEventListener('click', handleSignOut);

      const continueBtn = document.createElement('vaadin-button');
      continueBtn.setAttribute('theme', 'primary');
      continueBtn.textContent = 'Continue session';
      continueBtn.addEventListener('click', handleContinueSession);

      const btnWrap = document.createElement('div');
      btnWrap.className = 'dialog-footer-btns';
      btnWrap.appendChild(signOutBtn);
      btnWrap.appendChild(continueBtn);
      root.appendChild(btnWrap);
    };

    // ── Override role to alertdialog for WCAG compliance ─────
    dialog.addEventListener('opened-changed', (e) => {
      if (e.detail.value) {
        requestAnimationFrame(() => {
          const overlay = document.querySelector('vaadin-dialog-overlay');
          if (overlay) {
            overlay.setAttribute('role', 'alertdialog');
            overlay.setAttribute('aria-labelledby', 'session-title');
            overlay.setAttribute('aria-describedby', 'session-desc');
          }
        });
      }
    });

    // ── Action handlers ───────────────────────────────────────

    function handleContinueSession() {
      dialog.opened = false;
      // In production: call session refresh API here
      notification.renderer = (root) => {
        if (root.firstChild) return;
        const wrap = document.createElement('div');
        wrap.style.cssText = 'display:flex; align-items:center; gap:10px; font-size:13px; font-family:Open Sans,sans-serif;';
        wrap.innerHTML = `
          <i class="fa-solid fa-circle-check" style="color:#16a34a; font-size:16px;" aria-hidden="true"></i>
          <span><strong>Session extended.</strong> You have 8 hours before the next inactivity check.</span>
        `;
        root.appendChild(wrap);
      };
      notification.opened = true;
      dialog.opened = true; // keep open for demo
    }

    function handleSignOut() {
      dialog.opened = false;
      loggedout.classList.add('visible');
      requestAnimationFrame(() => document.getElementById('btn-login-again').focus());
    }

    // ── Demo controls ─────────────────────────────────────────

    document.getElementById('demo-open').addEventListener('click', () => {
      dialog.opened = true;
    });

    document.getElementById('demo-expire').addEventListener('click', () => {
      dialog.opened = false;
      loggedout.classList.add('visible');
      requestAnimationFrame(() => document.getElementById('btn-login-again').focus());
    });

    document.getElementById('demo-reset').addEventListener('click', () => {
      loggedout.classList.remove('visible');
      dialog.opened = true;
    });

    document.getElementById('btn-login-again').addEventListener('click', () => {
      loggedout.classList.remove('visible');
      dialog.opened = true;
    });

    // ── Open on load ──────────────────────────────────────────
    dialog.opened = true;
  </script>

    <!-- GitHub Pages share pill (auto-derives URL from path) -->
    <style>
      .gh-share-pill {
        position: fixed;
        bottom: 16px;
        right: 16px;
        z-index: 2147483000;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #18181b;
        color: #fff;
        padding: 9px 14px;
        border-radius: 999px;
        font: 600 12px/1 'SF Mono', Menlo, Consolas, monospace;
        border: none;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
        opacity: 0.85;
        transition: opacity 0.15s ease, transform 0.15s ease;
        text-decoration: none;
      }
      .gh-share-pill:hover { opacity: 1; transform: translateY(-2px); }
      .gh-share-pill.is-copied { background: #10b981; }
    </style>
    <button class="gh-share-pill" id="ghSharePill" type="button" aria-label="Copy live GitHub Pages URL" data-file="products/SafeLMS/timeout modal SAFELMS-30656/index.html" data-line="332">🔗 Share Link</button>
    <script>
      (function() {
        const pill = document.getElementById('ghSharePill');
        if (!pill) return;
        const m = window.location.pathname.match(/\/products\/([^/]+)\/(.+?)\/(?:index\.html)?$/i);
        const url = m
          ? `https://vectorlearning.github.io/ux-mockups/products/${m[1]}/${m[2]}/`
          : 'https://vectorlearning.github.io/ux-mockups/';
        pill.title = url;
        pill.addEventListener('click', () => {
          navigator.clipboard.writeText(url).then(() => {
            pill.innerHTML = '✓ Copied!';
            pill.classList.add('is-copied');
            setTimeout(() => {
              pill.innerHTML = '🔗 Share Link';
              pill.classList.remove('is-copied');
            }, 1500);
          });
        });
      })();
    </script>
