// STATE
// ─────────────────────────────────────────────────────────────────────────────
let currentStep  = 0;
let checkState   = {};   // key → 'pass' | 'deficiency' | 'na' | null  (kind: check)
let answers      = {};   // key → typed answer (yes-no | numeric | text | select | etc.)
let attachments  = {};   // key → { photos: [{name}], note: string }
let defNotes     = {};   // key → string  (legacy deficiency description field)
let workOrders   = {};   // key → { woId, urgency, createdAt }
let replacements = {};   // key → { failedAssetTag, replacement: {id,sn,location}, swappedAt }
let attestA      = false;
let activeSteps  = [];
let promotedVerifyKey = null; // currently expanded verify row (mobile)

// Which kinds count as "answered" for footer/next-button gating.
// `optional: true` on an item exempts it from this gate.
function isItemAnswered(it) {
  if (it.optional) return true;
  switch (it.kind || 'check') {
    case 'check':       return checkState[it.key] != null;
    case 'yes-no':      return answers[it.key] === 'yes' || answers[it.key] === 'no';
    case 'numeric':
    case 'count':       return answers[it.key] != null && answers[it.key] !== '';
    case 'text':
    case 'long-text':   return typeof answers[it.key] === 'string' && answers[it.key].trim() !== '';
    case 'select':      return !!answers[it.key];
    case 'multi-select':return Array.isArray(answers[it.key]) && answers[it.key].length > 0;
    case 'signature':   return !!answers[it.key]; // signed-name string
    case 'date':
    case 'datetime':    return !!answers[it.key];
    case 'acknowledge': return answers[it.key] === true;
    case 'info':        return true; // info is read-only; viewed-on-advance
    default:            return true;
  }
}

// Numeric items auto-flag as deficiency when value crosses threshold.
function isNumericFailed(it) {
  if (it.kind !== 'numeric' && it.kind !== 'count') return false;
  const v = answers[it.key];
  if (v == null || v === '') return false;
  const n = Number(v);
  if (Number.isNaN(n)) return false;
  if (it.kind === 'count') {
    return typeof it.par === 'number' && n < it.par;
  }
  const t = it.threshold;
  if (!t) return false;
  if (typeof t.min === 'number' && n < t.min) return true;
  if (typeof t.max === 'number' && n > t.max) return true;
  return false;
}

// True if this item should surface the deficiency form (description + WO +
// replacement). Applies to: kind:check marked deficiency; OR kind:numeric/count
// that auto-failed its threshold/par.
function isItemFlagged(it) {
  if ((it.kind || 'check') === 'check') return checkState[it.key] === 'deficiency';
  if (it.kind === 'numeric' || it.kind === 'count') return isNumericFailed(it);
  return false;
}

function buildActiveSteps() {
  activeSteps = STEPS.slice();
  document.getElementById('stepCounter').textContent = `Step 1 of ${activeSteps.length}`;
}

function initState() {
  checkState = {}; answers = {}; attachments = {}; defNotes = {};
  workOrders = {}; replacements = {};
  attestA = false;
  promotedVerifyKey = null;
  STEPS.filter(s => s.type === 'check').forEach(s =>
    s.items.forEach(it => {
      const kind = it.kind || 'check';
      if (kind === 'check') checkState[it.key] = null;
      // Seed defaults so the input renders the right initial value.
      if (it.default !== undefined) {
        if (it.default === 'today')  answers[it.key] = new Date().toISOString().slice(0,10);
        else if (it.default === 'now') {
          const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
          answers[it.key] = d.toISOString().slice(0,16);
        } else {
          answers[it.key] = it.default;
        }
      }
    })
  );
}

// Find the step + item that owns a given key.
function findItemByKey(key) {
  for (const s of STEPS) {
    if (s.type !== 'check') continue;
    const it = s.items.find(i => i.key === key);
    if (it) return { step: s, item: it };
  }
  return null;
}

// Mint a mock work-order id. Persisted in workOrders[key] so re-renders keep it.
let _woCounter = 2847;
function nextWoId() { return 'WO-' + (++_woCounter); }

// ─────────────────────────────────────────────────────────────────────────────
// RAIL (desktop left column)
// ─────────────────────────────────────────────────────────────────────────────
function renderRail() {
  const rail = document.getElementById('ceremonyRail');
  rail.innerHTML = '';

  const rigLabel = document.createElement('div');
  rigLabel.className = 'rail-section-label';
  rigLabel.textContent = 'Rig Check';
  rail.appendChild(rigLabel);

  activeSteps.forEach((step, i) => {
    const isCompleted = i < currentStep;
    const isActive    = i === currentStep;

    const el = document.createElement('div');
    el.className = 'rail-step ' + (isCompleted ? 'completed' : isActive ? 'active' : 'locked');
    if (isCompleted || isActive) {
      el.style.cursor = 'pointer';
      el.addEventListener('click', () => goToStep(i));
    }

    const dot = document.createElement('div');
    dot.className = 'rail-step-dot';
    if (isCompleted) {
      dot.innerHTML = '<i class="fa-solid fa-check" style="font-size:9px;"></i>';
    } else {
      dot.textContent = String(i + 1);
      if (!isActive) dot.style.opacity = '0.4';
    }

    const lbl = document.createElement('div');
    lbl.className = 'rail-step-label';
    lbl.textContent = step.title;
    if (!isCompleted && !isActive) lbl.style.opacity = '0.5';

    el.appendChild(dot);
    el.appendChild(lbl);

    // Summary badge on completed steps
    if (isCompleted) {
      const badge = document.createElement('span');
      badge.style.cssText = 'font-size:10px; font-weight:700; padding:2px 6px; border-radius:4px; margin-left:auto; flex-shrink:0;';
      if (step.type === 'check') {
        const defs = step.items.filter(it => checkState[it.key] === 'deficiency').length;
        if (defs > 0) {
          badge.style.background = 'rgba(239,68,68,0.15)'; badge.style.color = '#f87171';
          badge.textContent = defs + ' def';
        } else {
          badge.style.background = 'rgba(16,185,129,0.15)'; badge.style.color = '#34d399';
          badge.textContent = 'Pass';
        }
      } else if (step.type === 'attest') {
        badge.style.background = 'rgba(16,185,129,0.15)'; badge.style.color = '#34d399';
        badge.textContent = 'Done';
      }
      el.appendChild(badge);
    }

    rail.appendChild(el);
  });

  // Rail note — summary of WOs/replacements so far
  const woCount = Object.keys(workOrders).length;
  const repCount = Object.keys(replacements).length;
  const note = document.createElement('div');
  note.className = 'rail-note';
  if (woCount === 0) {
    note.innerHTML = '<strong style="color:#c4cce0;">Apparatus rig check</strong><br>Engine 7 · Daily shift-start.';
  } else {
    note.innerHTML = `<strong style="color:#c4cce0;"><i class="fa-solid fa-ticket" style="margin-right:4px; color:#fbbf24;"></i>${woCount} work order${woCount > 1 ? 's' : ''}</strong>` +
      (repCount > 0 ? `<br>${repCount} replacement${repCount > 1 ? 's' : ''} from station stock` : '<br>No replacements selected');
  }
  rail.appendChild(note);

  updateProgressStrip();
}

// ─────────────────────────────────────────────────────────────────────────────
// MOBILE PROGRESS STRIP
// ─────────────────────────────────────────────────────────────────────────────
function updateProgressStrip() {
  const pips = document.getElementById('progressPips');
  const label = document.getElementById('stripLabel');
  if (!pips || !label) return;

  pips.innerHTML = '';
  activeSteps.forEach((step, i) => {
    const pip = document.createElement('div');
    pip.className = 'progress-pip ' + (i < currentStep ? 'done' : i === currentStep ? 'active' : '');
    pips.appendChild(pip);
  });

  const step = activeSteps[currentStep];
  label.textContent = `Step ${currentStep + 1} of ${activeSteps.length} — ${step.title}`;
  document.getElementById('stepCounter').textContent = `Step ${currentStep + 1} of ${activeSteps.length}`;
}

// ─────────────────────────────────────────────────────────────────────────────
// STEP OVERVIEW BOTTOM SHEET
// ─────────────────────────────────────────────────────────────────────────────
function openStepSheet() {
  const body = document.getElementById('stepSheetBody');
  body.innerHTML = '';

  // Rig check section
  const rigLabel = document.createElement('div');
  rigLabel.className = 'step-overview-section-label';
  rigLabel.textContent = 'Rig Check';
  body.appendChild(rigLabel);

  activeSteps.forEach((step, i) => {
    const item = document.createElement('div');
    item.className = 'step-overview-item';
    item.addEventListener('click', () => { closeStepSheet(); goToStep(i); });

    const dotState = i < currentStep ? 'completed' : i === currentStep ? 'active' : 'pending';
    const dotContent = i < currentStep ? '<i class="fa-solid fa-check" style="font-size:9px;"></i>' : String(i + 1);

    let badgeHTML = '';
    if (i < currentStep && step.type === 'check') {
      const defs = step.items.filter(it => checkState[it.key] === 'deficiency').length;
      badgeHTML = defs > 0
        ? `<span class="step-overview-badge def">${defs} def</span>`
        : `<span class="step-overview-badge pass">Pass</span>`;
    }

    item.innerHTML = `
      <div class="step-overview-dot ${dotState}">${dotContent}</div>
      <div class="step-overview-info">
        <div class="step-overview-title">${step.title}</div>
        <div class="step-overview-meta">${step.meta}</div>
      </div>
      ${badgeHTML}
    `;
    body.appendChild(item);
  });

  document.getElementById('stepSheetBackdrop').classList.add('open');
  document.getElementById('stepSheet').classList.add('open');
}

function closeStepSheet() {
  document.getElementById('stepSheetBackdrop').classList.remove('open');
  document.getElementById('stepSheet').classList.remove('open');
}

// ─────────────────────────────────────────────────────────────────────────────
// STEP ROUTING
// ─────────────────────────────────────────────────────────────────────────────
function renderStep() {
  const step = activeSteps[currentStep];
  updateProgressStrip();
  if (step.type === 'check')  renderCheckStep(step);
  else if (step.type === 'attest') renderAttestStep(step);
}

// ─────────────────────────────────────────────────────────────────────────────
// RIG CHECK STEP
// ─────────────────────────────────────────────────────────────────────────────
function renderCheckStep(step) {
  const container = document.getElementById('ceremonyContent');
  const unmarked  = step.items.filter(it => checkState[it.key] === null).length;
  const allMarked = unmarked === 0;
  promotedVerifyKey = null;

  container.innerHTML = `
    <div class="ceremony-state-bar">
      <span class="status-pill info">Rig Check — In Progress</span>
      <span class="sep">·</span>
      <span><i class="fa-solid fa-user" style="margin-right:4px;"></i>Engineer Reyes, A.</span>
      <span class="sep">·</span>
      <span><i class="fa-solid fa-truck" style="margin-right:4px;"></i>Engine 7 · Station 7</span>
    </div>

    <div class="step-card">
      <div class="step-card-header">
        <div>
          <div class="step-card-title">
            <i class="fa-solid ${step.icon}" style="margin-right:8px; color:#a5b4fc;"></i>${step.title}
          </div>
          <div class="step-card-meta">${step.meta}</div>
        </div>
        <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
          <span class="status-pill ${allMarked ? 'ok' : 'info'}" id="stepBadge">
            ${allMarked ? 'All marked' : (step.items.length - unmarked) + ' / ' + step.items.length + ' marked'}
          </span>
          <button class="btn-pass-all" id="passAllBtn" onclick="passAllItems()" ${step.items.every(it => checkState[it.key] === 'pass') ? 'style="display:none"' : ''}>
            <i class="fa-solid fa-check-double"></i> Pass All
          </button>
        </div>
      </div>

      <div class="step-card-body">
        <div class="verify-section" id="verifySection">
          ${step.items.map(it => renderVerifyRow(it)).join('')}
        </div>
      </div>

      <div class="step-card-footer">
        ${currentStep > 0
          ? `<button class="btn-back" onclick="goToStep(${currentStep - 1})">Back</button>`
          : '<div></div>'}
        <vaadin-button theme="primary" id="nextBtn" ${allMarked ? '' : 'disabled'} onclick="advanceStep()">
          ${activeSteps[currentStep + 1]?.type === 'attest'
            ? 'Officer Attestation <i class="fa-solid fa-signature" style="margin-left:6px;"></i>'
            : 'Next Step <i class="fa-solid fa-arrow-right" style="margin-left:6px;"></i>'}
        </vaadin-button>
      </div>
    </div>
  `;

  restoreDefNotes(step);
  wireVerifyRows(step);
}

// ─────────────────────────────────────────────────────────────────────────────
// VERIFY ROW DISPATCHER
// Each step item carries a `kind`. The row dispatches on kind, renders the
// kind-specific controls, and (for kinds that support it) appends universal
// photo + note slots.
// ─────────────────────────────────────────────────────────────────────────────
function renderVerifyRow(item) {
  const kind = item.kind || 'check';

  // info and acknowledge are full-row presentation; no dot/controls layout.
  if (kind === 'info')        return renderInfoRow(item);
  if (kind === 'acknowledge') return renderAckRow(item);
  if (kind === 'signature')   return renderSignatureRow(item);

  const dotClass = computeDotClass(item);
  const kindChip = kindChipHtml(kind);

  return `
    <div id="wrap-${item.key}">
      <div class="verify-row" id="vrow-${item.key}">
        <div class="verify-row-dot ${dotClass}" id="dot-${item.key}"></div>
        <div class="verify-row-name">
          ${item.label}${kindChip}
          ${item.sub ? `<div class="verify-row-sub">${item.sub}</div>` : ''}
          ${renderSlotButtons(item)}
          ${renderSlotExpansion(item)}
        </div>
        <div class="verify-controls" id="ctrl-${item.key}">
          ${renderKindControls(item)}
        </div>
      </div>

      <!-- Deficiency form (kind:check deficiency, OR kind:numeric/count auto-fail) -->
      <div class="deficiency-inline ${isItemFlagged(item) ? 'visible' : ''}" id="deskdef-${item.key}">
        ${isItemFlagged(item) ? buildDeficiencyForm(item.key) : ''}
      </div>
    </div>
  `;
}

// Map kind → the dot-state class for the row left-rail indicator.
function computeDotClass(item) {
  const kind = item.kind || 'check';
  if (kind === 'check') return checkState[item.key] || '';
  if (isItemFlagged(item)) return 'deficiency';
  if (isItemAnswered(item)) return kind === 'check' ? 'pass' : 'answered';
  return '';
}

function kindChipHtml(kind) {
  if (kind === 'check') return ''; // implicit / no chip
  const map = {
    'yes-no':       { i: 'fa-circle-question', t: 'Yes / No' },
    'numeric':      { i: 'fa-gauge-high',      t: 'Reading' },
    'text':         { i: 'fa-keyboard',        t: 'Text' },
    'long-text':    { i: 'fa-align-left',      t: 'Notes' },
    'select':       { i: 'fa-list',            t: 'Choice' },
    'multi-select': { i: 'fa-list-check',      t: 'Multi-pick' },
    'count':        { i: 'fa-hashtag',         t: 'Count' },
    'date':         { i: 'fa-calendar-day',    t: 'Date' },
    'datetime':     { i: 'fa-clock',           t: 'Date/Time' },
  };
  const c = map[kind];
  if (!c) return '';
  return ` <span class="kind-chip"><i class="fa-solid ${c.i}"></i> ${c.t}</span>`;
}

// Render kind-specific controls (the right side of the row).
function renderKindControls(item) {
  const kind = item.kind || 'check';
  const key  = item.key;
  switch (kind) {
    case 'check': {
      const s = checkState[key];
      return `
        <button class="verify-btn pass ${s === 'pass' ? 'selected' : ''}"
          onclick="markItem(event,'${key}','pass')">
          <i class="fa-solid fa-check"></i> Pass
        </button>
        <button class="verify-btn deficiency ${s === 'deficiency' ? 'selected' : ''}"
          onclick="markItem(event,'${key}','deficiency')">
          <i class="fa-solid fa-triangle-exclamation"></i> Deficiency
        </button>
        <button class="verify-btn na ${s === 'na' ? 'selected' : ''}"
          onclick="markItem(event,'${key}','na')">N/A</button>`;
    }
    case 'yes-no': {
      const a = answers[key];
      return `
        <button class="yn-btn ${a === 'yes' ? 'selected yes' : ''}"
          onclick="setYesNo(event,'${key}','yes')">
          <i class="fa-solid fa-check"></i> Yes
        </button>
        <button class="yn-btn ${a === 'no' ? 'selected no' : ''}"
          onclick="setYesNo(event,'${key}','no')">
          <i class="fa-solid fa-xmark"></i> No
        </button>`;
    }
    case 'numeric': {
      const v = answers[key] ?? '';
      const failed = isNumericFailed(item);
      const tLabel = item.threshold?.label || '';
      return `
        <div class="num-control">
          ${tLabel ? `<span class="threshold-pill ${failed ? 'failed' : ''}" title="${item.thresholdSource || ''}">
            <i class="fa-solid fa-bullseye"></i> ${tLabel}
          </span>` : ''}
          <vaadin-number-field theme="outlined" id="num-${key}"
            placeholder="—"
          ></vaadin-number-field>
          ${item.unit ? `<span class="num-unit">${item.unit}</span>` : ''}
        </div>`;
    }
    case 'text': {
      const v = answers[key] ?? '';
      const expected = item.expectedValue;
      let indicator = '';
      if (expected != null && v !== '') {
        const match = String(v).trim().toLowerCase() === String(expected).trim().toLowerCase();
        indicator = `<div class="text-match-indicator ${match ? 'match' : 'mismatch'}">
          <i class="fa-solid ${match ? 'fa-circle-check' : 'fa-triangle-exclamation'}"></i>
          ${match ? 'Matches expected' : 'Does not match expected — flagged on record'}
        </div>`;
      }
      return `
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:0;">
          <vaadin-text-field theme="outlined" class="text-control" id="txt-${key}"
            placeholder="${escapeAttr(item.placeholder || '')}"
          ></vaadin-text-field>
          ${indicator}
        </div>`;
    }
    case 'long-text': {
      const v = answers[key] ?? '';
      // Long-text is intrinsically wide; put it under the name on its own line.
      return `
        <vaadin-text-area theme="outlined" class="longtext-control" id="ltxt-${key}"
          rows="3"
          placeholder="${escapeAttr(item.placeholder || '')}"
        ></vaadin-text-area>`;
    }
    case 'select': {
      const v = answers[key] ?? '';
      // Render a native <select> wrapped to look like a control. Avoids
      // vaadin-select async-items wiring noise in this fast-iterate prototype.
      const opts = (item.options || []).map(o =>
        `<option value="${escapeAttr(o.value)}" ${o.value === v ? 'selected' : ''}>${o.label}</option>`
      ).join('');
      return `
        <select class="select-control native-select"
          onchange="setText('${key}', this.value)">
          <option value="" ${!v ? 'selected' : ''}>— select —</option>
          ${opts}
        </select>`;
    }
    case 'multi-select': {
      const selected = Array.isArray(answers[key]) ? answers[key] : [];
      const required = item.required || [];
      const chips = (item.options || []).map(o => {
        const isSel = selected.includes(o.value);
        const isReq = required.includes(o.value) && !isSel;
        return `<span class="ms-chip ${isSel ? 'selected' : ''} ${isReq ? 'required-unselected' : ''}"
          onclick="toggleMulti('${key}','${escapeAttr(o.value)}')">
          ${isSel ? '<i class="fa-solid fa-check"></i>' : ''}
          ${o.label}
        </span>`;
      }).join('');
      return `<div class="ms-chip-group">${chips}</div>`;
    }
    case 'count': {
      const v = answers[key] ?? '';
      const par = item.par;
      const low = isNumericFailed(item);
      return `
        <div class="num-control">
          ${par != null ? `<span class="count-par ${low ? 'low' : ''}"><i class="fa-solid fa-bullseye"></i> Par ${par}</span>` : ''}
          <vaadin-number-field theme="outlined" id="num-${key}"
            placeholder="—"
          ></vaadin-number-field>
          ${item.unit ? `<span class="num-unit">${item.unit}</span>` : ''}
        </div>`;
    }
    case 'date': {
      return `<vaadin-date-picker theme="outlined" id="dt-${key}"></vaadin-date-picker>`;
    }
    case 'datetime': {
      return `<vaadin-date-time-picker theme="outlined" id="dt-${key}"></vaadin-date-time-picker>`;
    }
    default:
      return '';
  }
}

// info-card row — purely informational
function renderInfoRow(item) {
  return `
    <div id="wrap-${item.key}">
      <div class="info-card">
        <div class="info-card-icon"><i class="fa-solid ${item.infoIcon || 'fa-circle-info'}"></i></div>
        <div class="info-card-body">
          <div class="info-card-title">${item.label}</div>
          <div class="info-card-text">${item.sub || ''}</div>
        </div>
      </div>
    </div>`;
}

// acknowledge row — info + required checkbox
function renderAckRow(item) {
  const acked = answers[item.key] === true;
  return `
    <div id="wrap-${item.key}">
      <div class="ack-row ${acked ? 'acked' : ''}">
        <div class="info-card-icon" style="${acked ? 'background:rgba(16,185,129,0.15); color:#34d399;' : ''}">
          <i class="fa-solid ${acked ? 'fa-circle-check' : 'fa-bell'}"></i>
        </div>
        <div class="ack-body">
          <div class="info-card-title">${item.label}</div>
          <div class="info-card-text">${item.sub || ''}</div>
          <div style="margin-top:8px;">
            <vaadin-checkbox label="I confirm" ${acked ? 'checked' : ''}></vaadin-checkbox>
          </div>
          ${renderSlotButtons(item)}
          ${renderSlotExpansion(item)}
        </div>
      </div>
    </div>`;
}

// signature row — name + role + sign button (typed name authenticator for prototype)
function renderSignatureRow(item) {
  const signed = !!answers[item.key];
  return `
    <div id="wrap-${item.key}">
      <div class="verify-row signature-row" id="vrow-${item.key}">
        <div style="display:flex; align-items:flex-start; gap:12px; width:100%;">
          <div class="verify-row-dot ${signed ? 'answered' : ''}" id="dot-${item.key}"></div>
          <div class="verify-row-name" style="flex:1;">
            ${item.label}<span class="kind-chip"><i class="fa-solid fa-signature"></i> Signature</span>
            ${item.sub ? `<div class="verify-row-sub">${item.sub}</div>` : ''}
          </div>
        </div>
        <div class="signature-pad-shell ${signed ? 'signed' : ''}">
          ${signed ? `
            <div class="signature-signed-meta">
              <i class="fa-solid fa-circle-check"></i> Signed by ${answers[item.key]}
              <span style="margin-left:10px; color:#8b96b0; font-weight:500;">${new Date().toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'})}</span>
            </div>
            <div style="font-family:'Brush Script MT', cursive; font-size:28px; color:#a5b4fc;
                        padding:6px 12px; background:rgba(255,255,255,0.04); border-radius:8px;
                        text-align:center; letter-spacing: 1px;">
              ${answers[item.key]}
            </div>
            <vaadin-button theme="tertiary small" onclick="clearSignature('${item.key}')">
              <i class="fa-solid fa-rotate-left" slot="prefix"></i> Clear
            </vaadin-button>
          ` : `
            <div style="font-size:12px; color:#9aa3b8;">
              <i class="fa-solid fa-pen-nib" style="margin-right:6px; color:#a5b4fc;"></i>
              Type your name to sign. In production this would be a drawn signature pad
              or biometric authentication.
            </div>
            <vaadin-text-field theme="outlined" placeholder="${escapeAttr(item.signerName || 'Type your full name')}"
              id="sig-${item.key}"
              style="width:100%;"
              oninput="document.getElementById('sigBtn-${item.key}').disabled = !this.value.trim();"
            ></vaadin-text-field>
            <div>
              <vaadin-button theme="primary small" id="sigBtn-${item.key}" disabled
                onclick="captureSignature('${item.key}')">
                <i class="fa-solid fa-signature" slot="prefix"></i> Sign
              </vaadin-button>
            </div>
          `}
        </div>
      </div>
    </div>`;
}

// ── Universal slot buttons (photo + note). signature kind opts out.
// Slot button — ONE combined affordance per row.
// If the row allows either a photo or a note (or both), a single chip toggles
// the expansion that holds both fields together. Chip label adapts to what
// the row supports and what's already attached.
function renderSlotButtons(item) {
  const kind = item.kind || 'check';
  if (kind === 'signature' || kind === 'info') return '';
  if (!item.allowPhoto && !item.allowNote) return '';

  const a = attachments[item.key] || {};
  const photoCount = (a.photos || []).length;
  const hasNote    = !!(a.note && a.note.trim());
  const hasContent = photoCount > 0 || hasNote;

  // Idle label depends on which slots the row supports.
  const idleLabel =
    item.allowPhoto && item.allowNote ? 'Add photo or note' :
    item.allowPhoto                   ? 'Add photo'         :
                                        'Add note';
  const idleIcon =
    item.allowPhoto && item.allowNote ? 'fa-paperclip' :
    item.allowPhoto                   ? 'fa-camera'    :
                                        'fa-note-sticky';

  // Active label summarizes what's attached.
  let activeBits = [];
  if (photoCount > 0) activeBits.push(`<i class="fa-solid fa-camera"></i> ${photoCount} photo${photoCount > 1 ? 's' : ''}`);
  if (hasNote)        activeBits.push(`<i class="fa-solid fa-note-sticky"></i> Note`);
  const label = hasContent
    ? activeBits.join(' &middot; ')
    : `<i class="fa-solid ${idleIcon}"></i> ${idleLabel}`;

  return `<div class="row-slots">
    <span class="row-slot-btn ${hasContent ? 'has-content' : ''}" onclick="toggleSlot('${item.key}')">
      ${label}
    </span>
  </div>`;
}

// Slot expansion — single panel holding both photo and note fields when
// the row supports both. Hidden by default; toggled by the combined chip.
function renderSlotExpansion(item) {
  const kind = item.kind || 'check';
  if (kind === 'signature' || kind === 'info') return '';
  if (!item.allowPhoto && !item.allowNote) return '';
  const a = attachments[item.key] || {};
  return `
    <div class="slot-expansion" id="slotexp-${item.key}">
      ${item.allowPhoto ? `
        <div class="slot-section-label">
          <i class="fa-solid fa-camera"></i> Photos
        </div>
        <vaadin-button theme="secondary small" onclick="mockAddPhoto('${item.key}')">
          <i class="fa-solid fa-camera" slot="prefix"></i> Capture / Upload
        </vaadin-button>
        <div class="photo-thumb-strip" id="photos-${item.key}">
          ${(a.photos || []).map((p, i) => `
            <div class="photo-thumb">
              <i class="fa-solid fa-image"></i>
              <span class="photo-thumb-name">${p.name}</span>
              <span class="photo-thumb-x" onclick="removePhoto('${item.key}', ${i})"><i class="fa-solid fa-xmark"></i></span>
            </div>`).join('')}
        </div>
      ` : ''}
      ${item.allowNote ? `
        <div class="slot-section-label" style="margin-top:${item.allowPhoto ? '14px' : '0'};">
          <i class="fa-solid fa-note-sticky"></i> Note
        </div>
        <vaadin-text-area theme="outlined" placeholder="Brief description, context, or follow-up"
          rows="2" style="width:100%;"></vaadin-text-area>
      ` : ''}
    </div>`;
}

// Tiny escaper for putting strings inside HTML attribute values.
function escapeAttr(s) {
  return String(s ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

function buildDeficiencyForm(key) {
  const lookup = findItemByKey(key);
  const item = lookup?.item;
  const isReplaceable = !!item?.assetTag;
  const wo  = workOrders[key];
  const rep = replacements[key];

  // Urgency options — fleet workflow 1.6 step 2: officer assesses urgency.
  const urgency = wo?.urgency || 'normal';

  const failedChip = isReplaceable ? `
    <div class="asset-chip failed">
      <div class="asset-chip-icon"><i class="fa-solid fa-ban"></i></div>
      <div class="asset-chip-body">
        <div class="asset-chip-id">${item.assetTag} · ${item.variantLabel || 'Asset'}</div>
        <div class="asset-chip-sub">${item.slot ? item.slot + ' · ' : ''}SN ${item.assetSn || '—'}</div>
      </div>
      <span class="asset-chip-tag">Failed → OOS</span>
    </div>` : '';

  const replacementChip = rep ? `
    <div class="swap-arrow"><i class="fa-solid fa-arrow-down"></i></div>
    <div class="asset-chip replacement">
      <div class="asset-chip-icon"><i class="fa-solid fa-circle-check"></i></div>
      <div class="asset-chip-body">
        <div class="asset-chip-id">${rep.replacement.id} · ${item.variantLabel || 'Asset'}</div>
        <div class="asset-chip-sub">${rep.replacement.location} · ${rep.replacement.condition}</div>
      </div>
      <span class="asset-chip-tag">Swapped in</span>
    </div>` : '';

  // Header changes for numeric/count auto-fails so the language matches the
  // trigger ("Out-of-spec reading" instead of "Deficiency").
  const kind = item?.kind || 'check';
  const autoFail = (kind === 'numeric' || kind === 'count') && isNumericFailed(item);
  const headerLabel = autoFail
    ? 'Out-of-spec reading — describe & route'
    : 'Deficiency — describe & route';
  const headerSub = autoFail
    ? (kind === 'count'
        ? `Count ${answers[key]} is below par ${item.par}. Document the cause and route.`
        : `Reading ${answers[key]}${item.unit ? ' ' + item.unit : ''} is below threshold ${item.threshold?.label || ''}. Document the cause and route.`)
    : null;

  return `
    <div class="deficiency-inline-label">
      <i class="fa-solid fa-triangle-exclamation"></i> ${headerLabel}
    </div>
    ${headerSub ? `<div style="font-size:11.5px; color:#9aa3b8; margin-bottom:8px;">${headerSub}</div>` : ''}

    <vaadin-text-area theme="outlined" id="defnote-${key}" label="Description"
      style="width:100%;" rows="2" value="${defNotes[key] || ''}"
      placeholder="e.g., Cylinder gauge reads 78% — below 90% threshold"></vaadin-text-area>

    <div style="margin-top:10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
      <label style="font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:#8b96b0;">Urgency</label>
      <vaadin-select theme="outlined" id="urgency-${key}" value="${urgency}" style="width:160px;"
        onchange="setUrgency('${key}', this.value)"></vaadin-select>
    </div>

    ${failedChip}
    ${replacementChip}

    <div style="margin-top:12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:12px;">
      ${!wo ? `
      <vaadin-button theme="secondary small" onclick="createWO('${key}')" id="woBtn-${key}">
        <i class="fa-solid fa-ticket" slot="prefix"></i> Create Work Order
      </vaadin-button>` : `
      <span style="display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:#fbbf24;
                   padding:5px 10px; border-radius:6px; background:rgba(245,158,11,0.10); border:1px solid rgba(245,158,11,0.30);">
        <i class="fa-solid fa-ticket"></i> ${wo.woId} created · routed to Fleet Manager
      </span>`}

      ${isReplaceable && !rep ? `
      <vaadin-button theme="primary small" onclick="openReplacementPicker('${key}')" id="repBtn-${key}">
        <i class="fa-solid fa-right-left" slot="prefix"></i> Find Replacement Asset
      </vaadin-button>` : ''}

      ${rep ? `
      <span style="display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:#34d399;
                   padding:5px 10px; border-radius:6px; background:rgba(16,185,129,0.10); border:1px solid rgba(16,185,129,0.30);">
        <i class="fa-solid fa-circle-check"></i> Replacement assigned — swap recorded
      </span>
      <vaadin-button theme="tertiary small" onclick="undoReplacement('${key}')">
        <i class="fa-solid fa-rotate-left" slot="prefix"></i> Undo swap
      </vaadin-button>` : ''}
    </div>

    ${isReplaceable && !rep && wo ? `
    <div style="margin-top:8px; font-size:11.5px; color:#9aa3b8; line-height:1.5;">
      <i class="fa-solid fa-circle-info" style="color:#a5b4fc; margin-right:4px;"></i>
      Work order created. Apparatus still needs ${item.variantLabel || 'this asset'} for in-service status —
      pull a replacement from station stock or place Engine 7 OOS at attestation.
    </div>` : ''}
  `;
}

// Populate vaadin-select urgency options after the row is in the DOM.
function wireUrgencySelect(key) {
  setTimeout(() => {
    const el = document.getElementById('urgency-' + key);
    if (!el) return;
    el.items = [
      { label: 'Normal — non-blocking', value: 'normal' },
      { label: 'Priority — same shift', value: 'priority' },
      { label: 'Urgent — apparatus may be OOS', value: 'urgent' },
    ];
    el.value = workOrders[key]?.urgency || 'normal';
  }, 30);
}

function setUrgency(key, value) {
  if (workOrders[key]) {
    workOrders[key].urgency = value;
  } else {
    // Stash so it carries into the WO when created.
    workOrders[key] = { _pendingUrgency: value };
  }
}

function wireVerifyRows(step) {
  restoreDefNotes(step);
  // Wire urgency selects for any items currently in deficiency state.
  step.items.forEach(it => {
    if (isItemFlagged(it)) wireUrgencySelect(it.key);
  });
  // Wire kind-specific controls that need real event listeners (vaadin
  // components fire custom events that can't be bound via inline attrs).
  step.items.forEach(it => wireRowControls(it));
}

function wireRowControls(item) {
  const kind = item.kind || 'check';
  const key  = item.key;

  // Helper: seed an element's `value` programmatically, then attach the
  // change listener. Order matters: seeding before attaching avoids a
  // value-changed → setNumeric → rerenderRow → wireRowControls → seed → loop.
  const seedThenWire = (el, seedValue, eventName, handler) => {
    if (!el || el._wired) return;
    if (seedValue !== undefined && seedValue !== null && seedValue !== '') {
      el.value = (typeof seedValue === 'number') ? String(seedValue) : seedValue;
    }
    el._wired = true;
    el.addEventListener(eventName, handler);
  };

  setTimeout(() => {
    if (kind === 'numeric' || kind === 'count') {
      seedThenWire(
        document.getElementById('num-' + key),
        answers[key],
        'value-changed',
        e => {
          // Ignore the synthetic value-changed that fires for empty → empty.
          if (e.detail.value === '' && (answers[key] == null || answers[key] === '')) return;
          // Also ignore when the new value matches state (programmatic seed).
          if (String(e.detail.value) === String(answers[key])) return;
          setNumeric(key, e.detail.value);
        }
      );
    }
    if (kind === 'date' || kind === 'datetime') {
      seedThenWire(
        document.getElementById('dt-' + key),
        answers[key],
        'value-changed',
        e => {
          if (e.detail.value === answers[key]) return;
          setText(key, e.detail.value);
        }
      );
    }
    if (kind === 'acknowledge') {
      const el = document.querySelector(`#wrap-${key} vaadin-checkbox`);
      if (el && !el._wired) {
        el._wired = true;
        el.addEventListener('checked-changed', e => {
          if (!!e.detail.value === !!answers[key]) return;
          setAck(key, e.detail.value);
        });
      }
    }
    if (kind === 'text' || kind === 'long-text') {
      seedThenWire(
        document.getElementById((kind === 'text' ? 'txt-' : 'ltxt-') + key),
        answers[key],
        'value-changed',
        e => {
          if ((e.detail.value || '') === (answers[key] || '')) return;
          setText(key, e.detail.value);
        }
      );
    }
    if (kind === 'signature') {
      const sigField = document.getElementById('sig-' + key);
      if (sigField && !sigField._wired) {
        sigField._wired = true;
        sigField.addEventListener('value-changed', e => {
          const btn = document.getElementById('sigBtn-' + key);
          if (btn) btn.disabled = !(e.detail.value && e.detail.value.trim());
        });
      }
    }
    // Wire note-slot textarea once it's in the DOM (slot is conditionally
    // present; only inside the expansion panel).
    if (item.allowNote) {
      const ta = document.querySelector(`#slotexp-${key} vaadin-text-area`);
      if (ta && !ta._wired) {
        const cur = attachments[key]?.note;
        if (cur != null) ta.value = cur;
        ta._wired = true;
        ta.addEventListener('value-changed', e => {
          if ((e.detail.value || '') === (attachments[key]?.note || '')) return;
          setSlotNote(key, e.detail.value);
        });
      }
    }
  }, 40);
}

function markItem(event, key, result) {
  event.stopPropagation();
  saveCurrentDefNotes();

  checkState[key] = (checkState[key] === result) ? null : result;

  // Update dot
  const dot = document.getElementById('dot-' + key);
  if (dot) { dot.className = 'verify-row-dot ' + (checkState[key] || ''); }

  // Refresh verify buttons
  ['pass','deficiency','na'].forEach(t => {
    const btn = document.querySelector(`#ctrl-${key} .verify-btn.${t}`);
    if (btn) btn.classList.toggle('selected', checkState[key] === t);
  });

  // Show/hide deficiency form
  const isDef = checkState[key] === 'deficiency';
  const deskDef = document.getElementById('deskdef-' + key);
  if (deskDef) {
    deskDef.classList.toggle('visible', isDef);
    deskDef.innerHTML = isDef ? buildDeficiencyForm(key) : '';
    if (isDef) {
      restoreDefNoteForKey(key);
      wireUrgencySelect(key);
    }
  }

  updateFooterState();
}

// ─────────────────────────────────────────────────────────────────────────────
// PER-KIND HANDLERS
// All handlers follow the same pattern: write into state, then either
// surgically update the row (cheap) or re-render the whole row (when controls
// or the deficiency form need to redraw — e.g., numeric crossing threshold).
// ─────────────────────────────────────────────────────────────────────────────

function setYesNo(event, key, value) {
  event.stopPropagation();
  answers[key] = (answers[key] === value) ? null : value;
  rerenderRow(key);
  updateFooterState();
}

function setNumeric(key, value) {
  const item = findItemByKey(key)?.item;
  if (!item) return;
  // Empty string clears the answer. Otherwise store as number.
  if (value === '' || value == null) {
    delete answers[key];
  } else {
    const n = Number(value);
    answers[key] = Number.isNaN(n) ? value : n;
  }
  // Rerender so the threshold pill flips state and the deficiency form
  // attaches/detaches on auto-fail.
  rerenderRow(key);
  updateFooterState();
}

function setText(key, value) {
  answers[key] = value;
  // Live-update the match indicator without re-rendering the whole row to
  // avoid input cursor jumps. Cheap surgical update for text/long-text/select/date.
  const item = findItemByKey(key)?.item;
  if (item?.kind === 'text' && item.expectedValue != null) {
    rerenderRow(key);
  } else {
    // Update dot + slot-button counts
    const dot = document.getElementById('dot-' + key);
    if (dot) dot.className = 'verify-row-dot ' + computeDotClass(item);
  }
  updateFooterState();
}

function toggleMulti(key, value) {
  const cur = Array.isArray(answers[key]) ? answers[key].slice() : [];
  const idx = cur.indexOf(value);
  if (idx >= 0) cur.splice(idx, 1); else cur.push(value);
  answers[key] = cur;
  rerenderRow(key);
  updateFooterState();
}

function setAck(key, checked) {
  answers[key] = !!checked;
  rerenderRow(key);
  updateFooterState();
}

function captureSignature(key) {
  const input = document.getElementById('sig-' + key);
  const name = (input?.value || '').trim();
  if (!name) return;
  answers[key] = name;
  rerenderRow(key);
  updateFooterState();
  showToast(`Signed: ${name}`, 'fa-signature', 2500);
}

function clearSignature(key) {
  delete answers[key];
  rerenderRow(key);
  updateFooterState();
}

// ── Universal photo + note slots ─────────────────────────────────────────────
let _openSlot = {}; // key → 'photo' | 'note' | null  (which slot panel is open)
function toggleSlot(key /*, which */) {
  // Single expansion panel per row; clicking either button toggles it.
  const panel = document.getElementById('slotexp-' + key);
  if (!panel) return;
  const open = panel.classList.toggle('open');
  _openSlot[key] = open ? 'open' : null;
}

let _photoCounter = 0;
function mockAddPhoto(key) {
  // Mock photo capture — in production this would open camera or file picker.
  _photoCounter++;
  attachments[key] = attachments[key] || {};
  attachments[key].photos = attachments[key].photos || [];
  attachments[key].photos.push({
    name: `IMG_${String(Date.now()).slice(-6)}-${_photoCounter}.jpg`,
    capturedAt: new Date().toISOString(),
  });
  rerenderRow(key);
  // Keep slot panel open
  const panel = document.getElementById('slotexp-' + key);
  if (panel) panel.classList.add('open');
  _openSlot[key] = 'open';
}

function removePhoto(key, idx) {
  const a = attachments[key];
  if (!a?.photos) return;
  a.photos.splice(idx, 1);
  rerenderRow(key);
  const panel = document.getElementById('slotexp-' + key);
  if (panel) panel.classList.add('open');
}

function setSlotNote(key, value) {
  attachments[key] = attachments[key] || {};
  attachments[key].note = value;
  // Update the combined slot chip's label without re-rendering the row, so
  // the textarea keeps focus mid-typing.
  refreshSlotChip(key);
}

// Recompute the combined chip's label + state. Called by setSlotNote
// (surgical update — preserves focus) and after add/remove photo.
function refreshSlotChip(key) {
  const item = findItemByKey(key)?.item;
  if (!item) return;
  const btn = document.querySelector(`#wrap-${key} .row-slot-btn`);
  if (!btn) return;
  const a = attachments[key] || {};
  const photoCount = (a.photos || []).length;
  const hasNote    = !!(a.note && a.note.trim());
  const hasContent = photoCount > 0 || hasNote;

  let html;
  if (hasContent) {
    const bits = [];
    if (photoCount > 0) bits.push(`<i class="fa-solid fa-camera"></i> ${photoCount} photo${photoCount > 1 ? 's' : ''}`);
    if (hasNote)        bits.push(`<i class="fa-solid fa-note-sticky"></i> Note`);
    html = bits.join(' &middot; ');
  } else {
    const idleLabel =
      item.allowPhoto && item.allowNote ? 'Add photo or note' :
      item.allowPhoto                   ? 'Add photo'         :
                                          'Add note';
    const idleIcon =
      item.allowPhoto && item.allowNote ? 'fa-paperclip' :
      item.allowPhoto                   ? 'fa-camera'    :
                                          'fa-note-sticky';
    html = `<i class="fa-solid ${idleIcon}"></i> ${idleLabel}`;
  }
  btn.classList.toggle('has-content', hasContent);
  btn.innerHTML = html;
}

// Re-render a single row in place. Cheap; preserves the rest of the step DOM.
function rerenderRow(key) {
  const item = findItemByKey(key)?.item;
  if (!item) return;
  saveCurrentDefNotes();
  const wrap = document.getElementById('wrap-' + key);
  if (!wrap) return;
  wrap.outerHTML = renderVerifyRow(item);
  // Re-wire interactive sub-components for this row.
  restoreDefNoteForKey(key);
  if (isItemFlagged(item)) wireUrgencySelect(key);
  wireRowControls(item);
  // Restore the slot expansion's open/closed state.
  if (_openSlot[key] === 'open') {
    const panel = document.getElementById('slotexp-' + key);
    if (panel) panel.classList.add('open');
  }
}

// "Pass All" applies only to kind:check items (the original pass/def/na flow).
// Other kinds need an explicit answer and are skipped.
function passAllItems() {
  const step = activeSteps[currentStep];
  if (!step || step.type !== 'check') return;
  saveCurrentDefNotes();
  step.items.forEach(it => {
    if ((it.kind || 'check') === 'check') checkState[it.key] = 'pass';
  });
  const section = document.getElementById('verifySection');
  if (section) section.innerHTML = step.items.map(it => renderVerifyRow(it)).join('');
  wireVerifyRows(step);
  updateFooterState();
  const btn = document.getElementById('passAllBtn');
  if (btn) btn.style.display = 'none';
}

function updateFooterState() {
  const step = activeSteps[currentStep];
  if (!step || step.type !== 'check') return;
  const total     = step.items.length;
  const answered  = step.items.filter(isItemAnswered).length;
  const allMarked = answered === total;

  const badge   = document.getElementById('stepBadge');
  const nextBtn = document.getElementById('nextBtn');
  if (badge) {
    badge.textContent = allMarked ? 'All marked' : `${answered} / ${total} marked`;
    badge.className = 'status-pill ' + (allMarked ? 'ok' : 'info');
  }
  if (nextBtn) { nextBtn.disabled = !allMarked; }

  // Pass-All button is only useful when every check-kind item is unset or
  // not-passed. Hide it if there are no check-kind items in this step.
  const checkItems = step.items.filter(it => (it.kind || 'check') === 'check');
  const passAllBtn = document.getElementById('passAllBtn');
  if (passAllBtn) {
    if (checkItems.length === 0 || checkItems.every(it => checkState[it.key] === 'pass')) {
      passAllBtn.style.display = 'none';
    } else {
      passAllBtn.style.display = '';
    }
  }
}

function restoreDefNotes(step) {
  step.items.forEach(it => restoreDefNoteForKey(it.key));
}

function restoreDefNoteForKey(key) {
  if (!defNotes[key]) return;
  setTimeout(() => {
    const el = document.getElementById('defnote-' + key);
    if (el) el.value = defNotes[key];
  }, 50);
}

function saveCurrentDefNotes() {
  const step = activeSteps[currentStep];
  if (step?.type !== 'check') return;
  step.items.forEach(it => {
    const el = document.getElementById('defnote-' + it.key);
    if (el) defNotes[it.key] = el.value || '';
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// WORK ORDER + REPLACEMENT FLOW
// Workflow 1.6 (fire): deficiency → WO routed to Fleet Manager (1.5).
// Workflow 1.1.1 step 4b: equipment swap from station spare equipment.
// ─────────────────────────────────────────────────────────────────────────────
function createWO(key) {
  const noteEl = document.getElementById('defnote-' + key);
  if (noteEl) defNotes[key] = noteEl.value || '';
  const urgEl = document.getElementById('urgency-' + key);
  const urgency = (urgEl?.value) || workOrders[key]?._pendingUrgency || 'normal';

  const lookup = findItemByKey(key);
  workOrders[key] = {
    woId: nextWoId(),
    urgency,
    createdAt: new Date().toISOString(),
    description: defNotes[key] || '',
    itemLabel: lookup?.item.label || key,
    assetTag:  lookup?.item.assetTag || null,
  };

  // Re-render this row's deficiency block in place so the WO badge replaces
  // the button and the "Find Replacement" button appears if applicable.
  const deskDef = document.getElementById('deskdef-' + key);
  if (deskDef) {
    deskDef.innerHTML = buildDeficiencyForm(key);
    restoreDefNoteForKey(key);
    wireUrgencySelect(key);
  }

  renderRail();
  showToast(`${workOrders[key].woId} created · ${lookup?.item.label || key} · routed to Fleet Manager`, 'fa-ticket');
}

// Open the picker dialog. Replacement candidates come from REPLACEMENT_POOL
// keyed by the item's variantKey.
let _pickerCurrentKey = null;
let _pickerSelectedId = null;
function openReplacementPicker(key) {
  const lookup = findItemByKey(key);
  if (!lookup?.item.assetTag || !lookup.item.variantKey) return;

  _pickerCurrentKey = key;
  _pickerSelectedId = null;

  const dialog = document.getElementById('replacementDialog');
  dialog.headerTitle = 'Find Replacement Asset';
  dialog.renderer = (root) => {
    root.innerHTML = '';
    const item = lookup.item;
    const pool = REPLACEMENT_POOL[item.variantKey] || [];

    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'width:min(560px, 90vw); max-height:60vh; overflow-y:auto;';
    wrapper.innerHTML = `
      <div class="picker-summary">
        <strong>${item.label}</strong> failed inspection on Engine 7.
        Failed asset <strong>${item.assetTag}</strong> will be marked
        out-of-service and unassigned from <em>${item.slot || 'this slot'}</em>.
        Pick a replacement from station stock to keep Engine 7 in service.
      </div>
      <div class="picker-section-label">
        In-stock — ${item.variantLabel || item.variantKey}
        <span style="text-transform:none; letter-spacing:0; font-weight:500; color:#9aa3b8; margin-left:6px;">
          (${pool.length} available)
        </span>
      </div>
      ${pool.length > 0 ? pool.map(opt => `
        <div class="picker-option" data-id="${opt.id}" onclick="pickerSelect('${opt.id}')">
          <div class="picker-option-radio"></div>
          <div class="picker-option-body">
            <div class="picker-option-id">${opt.id}${opt.sn !== '—' ? ` · SN ${opt.sn}` : ''}</div>
            <div class="picker-option-meta">${opt.location} · ${opt.condition}${opt.cylPressure ? ' · ' + opt.cylPressure : ''}</div>
          </div>
          <span class="picker-option-badge">Available</span>
        </div>
      `).join('') : `
        <div style="padding:14px; text-align:center; color:#8b96b0; font-size:12.5px;
                    background:rgba(239,68,68,0.06); border:1px dashed rgba(239,68,68,0.30); border-radius:8px;">
          <i class="fa-solid fa-triangle-exclamation" style="color:#f87171; margin-right:6px;"></i>
          No in-stock replacements available at any station.
          The work order is the only recourse — apparatus may need to go OOS.
        </div>
      `}
    `;
    root.appendChild(wrapper);
  };
  dialog.footerRenderer = (root) => {
    root.innerHTML = '';
    const cancel = document.createElement('vaadin-button');
    cancel.setAttribute('theme', 'tertiary');
    cancel.textContent = 'Cancel';
    cancel.addEventListener('click', () => { dialog.opened = false; });

    const confirm = document.createElement('vaadin-button');
    confirm.setAttribute('theme', 'primary');
    confirm.id = 'pickerConfirmBtn';
    confirm.setAttribute('disabled', '');
    confirm.innerHTML = '<i class="fa-solid fa-right-left" slot="prefix"></i>Confirm Swap';
    confirm.addEventListener('click', confirmReplacement);

    root.appendChild(cancel);
    root.appendChild(confirm);
  };
  dialog.opened = true;
}

function pickerSelect(id) {
  _pickerSelectedId = id;
  document.querySelectorAll('.picker-option').forEach(el => {
    el.classList.toggle('selected', el.dataset.id === id);
  });
  const btn = document.getElementById('pickerConfirmBtn');
  if (btn) btn.removeAttribute('disabled');
}

function confirmReplacement() {
  if (!_pickerCurrentKey || !_pickerSelectedId) return;
  const key = _pickerCurrentKey;
  const lookup = findItemByKey(key);
  const pool = REPLACEMENT_POOL[lookup.item.variantKey] || [];
  const picked = pool.find(o => o.id === _pickerSelectedId);
  if (!picked) return;

  // Ensure a WO exists — replacement is the operational fix, the WO is the
  // maintenance record for the failed asset's eventual repair/disposition.
  if (!workOrders[key] || !workOrders[key].woId) createWO(key);

  replacements[key] = {
    failedAssetTag: lookup.item.assetTag,
    failedSn:       lookup.item.assetSn,
    slot:           lookup.item.slot,
    replacement:    picked,
    swappedAt:      new Date().toISOString(),
  };

  // Remove picked asset from the in-stock pool so it can't be picked again
  // for another deficiency in this same ceremony.
  REPLACEMENT_POOL[lookup.item.variantKey] = pool.filter(o => o.id !== picked.id);

  document.getElementById('replacementDialog').opened = false;
  _pickerCurrentKey = null;
  _pickerSelectedId = null;

  // Re-render the deficiency block to show the swap chips + Undo button.
  const deskDef = document.getElementById('deskdef-' + key);
  if (deskDef) {
    deskDef.innerHTML = buildDeficiencyForm(key);
    restoreDefNoteForKey(key);
    wireUrgencySelect(key);
  }
  renderRail();
  showToast(`Swap recorded — ${lookup.item.assetTag} → OOS, ${picked.id} assigned to ${lookup.item.slot || 'slot'}`, 'fa-right-left', 5000);
}

function undoReplacement(key) {
  const rep = replacements[key];
  if (!rep) return;
  const lookup = findItemByKey(key);
  // Return the asset to the pool.
  const pool = REPLACEMENT_POOL[lookup.item.variantKey] || [];
  REPLACEMENT_POOL[lookup.item.variantKey] = [rep.replacement, ...pool];
  delete replacements[key];

  const deskDef = document.getElementById('deskdef-' + key);
  if (deskDef) {
    deskDef.innerHTML = buildDeficiencyForm(key);
    restoreDefNoteForKey(key);
    wireUrgencySelect(key);
  }
  renderRail();
  showToast(`Swap undone — ${rep.replacement.id} returned to stock`, 'fa-rotate-left');
}


// ─────────────────────────────────────────────────────────────────────────────
// OFFICER ATTESTATION STEP
// Company officer signs off on apparatus readiness (per workflow 1.3.2).
// If unresolved deficiencies remain, attestation records "in service with
// noted deficiencies" or "OOS" based on officer judgment (Principle 7).
// ─────────────────────────────────────────────────────────────────────────────
function renderAttestStep(step) {
  const container = document.getElementById('ceremonyContent');

  // Aggregate deficiencies across all check steps. Includes:
  //   · kind:check items explicitly marked 'deficiency'
  //   · kind:numeric / kind:count items that auto-failed their threshold/par
  //   · kind:text items whose value mismatches an expectedValue (soft discrepancy)
  // Tracks which have a replacement vs. WO-only so the summary distinguishes
  // resolved-in-ceremony from work-orders-pending.
  const rigDefs = activeSteps.filter(s => s.type === 'check')
    .flatMap(s => s.items.filter(it => {
        if (isItemFlagged(it)) return true; // check def OR numeric/count fail
        if (it.kind === 'text' && it.expectedValue != null) {
          const v = answers[it.key];
          return v && String(v).trim().toLowerCase() !== String(it.expectedValue).trim().toLowerCase();
        }
        return false;
      }).map(it => ({
        key: it.key,
        kind: it.kind || 'check',
        label: it.label,
        section: s.title,
        assetTag: it.assetTag || null,
        replaced: !!replacements[it.key],
        wo: workOrders[it.key] || null,
        readingValue: (it.kind === 'numeric' || it.kind === 'count') ? answers[it.key] : null,
        readingUnit: it.unit || null,
        textValue: it.kind === 'text' ? answers[it.key] : null,
        textExpected: it.kind === 'text' ? it.expectedValue : null,
      })));

  // Also surface free-form answers that have business value to show on the
  // record summary (mileage, engine hours, completion timestamp, narrative).
  const recordedReadings = activeSteps.filter(s => s.type === 'check')
    .flatMap(s => s.items
      .filter(it => answers[it.key] != null && answers[it.key] !== ''
        && ['numeric','count','date','datetime','long-text','select'].includes(it.kind)
        && !isItemFlagged(it)) // failures are already in rigDefs
      .map(it => ({
        key: it.key, kind: it.kind, label: it.label, section: s.title,
        value: answers[it.key], unit: it.unit || null,
        options: it.options || null,
      })));

  // Photos + notes attached to any item.
  const totalPhotos = Object.values(attachments).reduce((n, a) => n + (a.photos?.length || 0), 0);
  const totalNotes  = Object.values(attachments).filter(a => a.note && a.note.trim()).length;

  const replacedCount  = rigDefs.filter(d => d.replaced).length;
  const woOnlyCount    = rigDefs.filter(d => !d.replaced && d.wo).length;
  const unresolvedCount = rigDefs.filter(d => !d.replaced && !d.wo).length;
  const hasAnyIssues   = rigDefs.length > 0;

  container.innerHTML = `
    <div class="ceremony-state-bar">
      <span class="status-pill ${attestA ? 'ok' : 'info'}">
        Officer Attestation — ${attestA ? 'Complete' : 'Awaiting'}
      </span>
      <span class="sep">·</span>
      <span>Engine 7 · Station 7 · Alpha Shift</span>
    </div>

    <!-- Record summary -->
    <div class="step-card" style="margin-bottom:16px;">
      <div class="step-card-header">
        <div>
          <div class="step-card-title">Apparatus Rig Check — Record Summary</div>
          <div class="step-card-meta">Officer review before in-service sign-off. Work orders and replacements are part of this record.</div>
        </div>
        <span class="status-pill ${hasAnyIssues ? 'warn' : 'ok'}">
          ${hasAnyIssues ? `${rigDefs.length} deficienc${rigDefs.length > 1 ? 'ies' : 'y'}` : 'All sections pass'}
        </span>
      </div>
      <div class="step-card-body">

        <div class="summary-section">
          <div class="summary-section-label">Rig Check — Sections</div>
          ${activeSteps.filter(s => s.type === 'check').map(s => {
            const defs = s.items.filter(it => isItemFlagged(it)).length;
            const items = s.items.length;
            return `
            <div class="summary-row">
              <i class="fa-solid ${defs > 0 ? 'fa-triangle-exclamation' : 'fa-circle-check'}"
                 style="color:${defs > 0 ? '#f87171' : '#34d399'}; width:14px;"></i>
              <span class="summary-row-label">${s.title}
                <span style="font-size:11px; color:#8b96b0; margin-left:6px;">${items} item${items > 1 ? 's' : ''}</span>
              </span>
              <span class="summary-row-result" style="color:${defs > 0 ? '#f87171' : '#34d399'};">
                ${defs > 0 ? defs + ' deficienc' + (defs !== 1 ? 'ies' : 'y') : 'Pass'}
              </span>
            </div>`;
          }).join('')}
        </div>

        ${recordedReadings.length > 0 ? `
        <div class="summary-section">
          <div class="summary-section-label">Recorded Values</div>
          ${recordedReadings.map(r => {
            let display = r.value;
            if (r.kind === 'select') {
              const opt = r.options?.find(o => o.value === r.value);
              display = opt?.label || r.value;
            } else if (r.kind === 'long-text') {
              display = r.value.length > 60 ? r.value.slice(0,60) + '…' : r.value;
            } else if (r.unit) {
              display = `${r.value} ${r.unit}`;
            }
            return `
            <div class="summary-row">
              <i class="fa-solid fa-circle-dot" style="color:#a5b4fc; width:14px;"></i>
              <span class="summary-row-label">${r.label}
                <span style="font-size:11px; color:#8b96b0; margin-left:6px;">${r.section}</span>
              </span>
              <span class="summary-row-result" style="color:#c4cce0; font-weight:600;">${display}</span>
            </div>`;
          }).join('')}
        </div>` : ''}

        ${(totalPhotos > 0 || totalNotes > 0) ? `
        <div class="summary-section">
          <div class="summary-section-label">Attachments</div>
          <div class="summary-row">
            <i class="fa-solid fa-paperclip" style="color:#a5b4fc; width:14px;"></i>
            <span class="summary-row-label">Photos &amp; notes captured during check</span>
            <span class="summary-row-result" style="color:#c4cce0; font-weight:600;">
              ${totalPhotos > 0 ? `${totalPhotos} photo${totalPhotos > 1 ? 's' : ''}` : ''}
              ${totalPhotos > 0 && totalNotes > 0 ? ' · ' : ''}
              ${totalNotes > 0 ? `${totalNotes} note${totalNotes > 1 ? 's' : ''}` : ''}
            </span>
          </div>
        </div>` : ''}

        ${rigDefs.length > 0 ? `
        <div class="summary-section">
          <div class="summary-section-label" style="color:#f87171;">
            Deficiencies — ${rigDefs.length} item${rigDefs.length > 1 ? 's' : ''}
            ${replacedCount > 0 ? `<span style="color:#34d399; margin-left:8px;">· ${replacedCount} replaced from stock</span>` : ''}
            ${woOnlyCount > 0 ? `<span style="color:#fbbf24; margin-left:8px;">· ${woOnlyCount} WO pending</span>` : ''}
          </div>
          ${rigDefs.map(d => {
            const rep = replacements[d.key];
            const woId = d.wo?.woId;
            let triggerChip = '';
            if (d.kind === 'numeric' || d.kind === 'count') {
              triggerChip = `<span style="color:#f87171;"><i class="fa-solid fa-gauge-high"></i> Reading: ${d.readingValue}${d.readingUnit ? ' ' + d.readingUnit : ''}</span>`;
            } else if (d.kind === 'text') {
              triggerChip = `<span style="color:#fbbf24;"><i class="fa-solid fa-keyboard"></i> "${d.textValue}" ≠ "${d.textExpected}"</span>`;
            }
            return `
            <div class="summary-row" style="align-items:flex-start;">
              <i class="fa-solid fa-triangle-exclamation" style="color:#f87171; width:14px; margin-top:3px;"></i>
              <div style="flex:1;">
                <div><span style="color:#c4cce0; font-weight:600;">${d.label}</span>
                  <span style="font-size:11px; color:#8b96b0; margin-left:8px;">${d.section}</span></div>
                <div style="margin-top:4px; font-size:11.5px; display:flex; gap:12px; flex-wrap:wrap;">
                  ${triggerChip}
                  ${woId ? `<span style="color:#fbbf24;"><i class="fa-solid fa-ticket"></i> ${woId}</span>` : ''}
                  ${rep ? `<span style="color:#34d399;"><i class="fa-solid fa-right-left"></i> ${d.assetTag} → ${rep.replacement.id}</span>` : ''}
                  ${!rep && d.assetTag && woId ? `<span style="color:#f87171;"><i class="fa-solid fa-ban"></i> ${d.assetTag} → OOS, no replacement</span>` : ''}
                </div>
                ${defNotes[d.key] ? `<div style="margin-top:3px; font-size:11px; color:#9aa3b8; font-style:italic;">"${defNotes[d.key]}"</div>` : ''}
              </div>
            </div>`;
          }).join('')}
        </div>` : ''}

        <div class="summary-section">
          <div class="summary-section-label">Readiness Determination</div>
          ${unresolvedCount > 0 ? `
          <div class="state-callout discrepancy" style="margin-bottom:0;">
            <i class="fa-solid fa-triangle-exclamation" style="flex-shrink:0; margin-top:1px;"></i>
            <div>
              <div class="state-callout-title">Officer judgment required</div>
              <div>${unresolvedCount} deficienc${unresolvedCount > 1 ? 'ies' : 'y'} without replacement or work order. Officer may sign off in service with noted deficiency (if it does not prevent safe response, per workflow 1.3.2) or place apparatus OOS.</div>
            </div>
          </div>` : hasAnyIssues ? `
          <div class="state-callout success" style="margin-bottom:0;">
            <i class="fa-solid fa-circle-check" style="flex-shrink:0; margin-top:1px;"></i>
            <div>
              <div class="state-callout-title">In service — deficiencies addressed</div>
              <div>${replacedCount > 0 ? `${replacedCount} item${replacedCount > 1 ? 's' : ''} replaced from station stock. ` : ''}${woOnlyCount > 0 ? `${woOnlyCount} work order${woOnlyCount > 1 ? 's' : ''} routed to Fleet Manager. ` : ''}Apparatus cleared for response.</div>
            </div>
          </div>` : `
          <div class="state-callout success" style="margin-bottom:0;">
            <i class="fa-solid fa-circle-check" style="flex-shrink:0; margin-top:1px;"></i>
            <div>
              <div class="state-callout-title">In service — fully ready</div>
              <div>All sections pass. Apparatus cleared for response.</div>
            </div>
          </div>`}
        </div>

      </div>
    </div>

    <!-- Attestation -->
    <div class="step-card">
      <div class="step-card-header">
        <div>
          <div class="step-card-title">
            <i class="fa-solid fa-signature" style="margin-right:8px; color:#a5b4fc;"></i>Company Officer Attestation
          </div>
          <div class="step-card-meta">
            The company officer is accountable for the readiness determination
            and signs off on this record (workflow 1.3.2).
            ${hasAnyIssues ? '<strong>Deficiencies are recorded with this attestation — they do not block sign-off.</strong>' : ''}
          </div>
        </div>
        <span class="status-pill ${attestA ? 'ok' : 'info'}" id="attestBadge">
          ${attestA ? 'Attested' : 'Pending'}
        </span>
      </div>

      <div class="step-card-body">

        <div class="auth-row">
          <div class="auth-person">
            <div class="auth-name">Capt. S. Chen</div>
            <div class="auth-role">Company Officer · F03-CAPT · Engine 7 · Alpha Shift</div>
          </div>
          ${attestA ? `
          <div class="auth-status done">
            <i class="fa-solid fa-circle-check"></i> Attested — 06:38
          </div>` : `
          <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            <span class="auth-status waiting"><i class="fa-solid fa-clock"></i> Pending</span>
            <vaadin-button theme="primary small" onclick="attest()">
              <i class="fa-solid fa-signature" slot="prefix"></i>
              Sign off on apparatus readiness
            </vaadin-button>
          </div>`}
        </div>

        ${attestA ? `
        <div style="margin-top:12px; padding:10px 14px; background:rgba(16,185,129,0.10); border-radius:8px; font-size:12px; color:#c4cce0;">
          <i class="fa-solid fa-circle-check" style="margin-right:6px; color:#34d399;"></i>
          <strong>Record is ready to submit.</strong>
          On submit: Engine 7 status → ${unresolvedCount > 0 ? '<em>in service with noted deficiency</em>' : '<em>in service · checked</em>'};
          ${Object.keys(workOrders).length > 0 ? `${Object.keys(workOrders).length} work order${Object.keys(workOrders).length > 1 ? 's' : ''} routed to Fleet Manager (1.5);` : ''}
          ${Object.keys(replacements).length > 0 ? `${Object.keys(replacements).length} asset swap${Object.keys(replacements).length > 1 ? 's' : ''} committed to inventory.` : ''}
        </div>` : ''}

      </div>

      <div class="step-card-footer">
        <button class="btn-back" onclick="goToStep(activeSteps.length - 2)">Back</button>
        <vaadin-button theme="primary" id="submitRecordBtn" ${attestA ? '' : 'disabled'} onclick="submitRecord()">
          <i class="fa-solid fa-paper-plane" slot="prefix"></i>
          Submit Rig Check Record
        </vaadin-button>
      </div>
    </div>
  `;
}

function attest() {
  attestA = true;
  renderStep();
  renderRail();
  showToast('Officer attestation recorded. Record is ready to submit.', 'fa-circle-check', 3000);
}

function submitRecord() {
  document.getElementById('headerPill').textContent = 'Submitted';
  document.getElementById('headerPill').className = 'status-pill ok';
  const woCount = Object.keys(workOrders).length;
  const repCount = Object.keys(replacements).length;
  let msg = 'Apparatus rig check submitted — Engine 7, Alpha Shift, ' +
            new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + '. ';
  if (woCount > 0)  msg += `${woCount} work order${woCount > 1 ? 's' : ''} routed to Fleet Manager. `;
  if (repCount > 0) msg += `${repCount} asset swap${repCount > 1 ? 's' : ''} committed. `;
  msg += '<a href="index.html">Return to Home →</a>';
  showToast(msg, 'fa-circle-check', 8000);
  setTimeout(() => { window.location.href = 'index.html'; }, 4000);
}

// ─────────────────────────────────────────────────────────────────────────────
// NAVIGATION
// ─────────────────────────────────────────────────────────────────────────────
function advanceStep() {
  saveCurrentDefNotes();
  currentStep++;
  promotedVerifyKey = null;
  renderRail();
  renderStep();
  window.scrollTo(0, 0);
}

function goToStep(index) {
  saveCurrentDefNotes();
  currentStep = index;
  promotedVerifyKey = null;
  renderRail();
  renderStep();
  window.scrollTo(0, 0);
}

function resetCeremony() {
  initState();
  currentStep = 0;
  document.getElementById('headerPill').textContent = 'In Progress';
  document.getElementById('headerPill').className = 'status-pill info';
  renderRail();
  renderStep();
  window.scrollTo(0, 0);
  showToast('Ceremony reset — starting from Step 1.', 'fa-rotate-left');
}

function suspendCeremony() {
  showToast('Ceremony suspended — state preserved. Resume from the Home task queue.', 'fa-pause', 4000);
}

// ─────────────────────────────────────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────────────────────────────────────
function showToast(msg, icon = 'fa-circle-info', duration = 4000) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `
    <i class="fa-solid ${icon} toast-icon"></i>
    <span>${msg}</span>
    <button class="toast-close" onclick="this.closest('.toast').remove()">
      <i class="fa-solid fa-xmark"></i>
    </button>`;
  container.appendChild(toast);
  if (duration > 0) setTimeout(() => toast.remove(), duration);
}

// ─────────────────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────────────────
// ─────────────────────────────────────────────────────────────────────────────
// SANDBOX MODE — when invoked with ?deploymentId=…, swap STEPS with a
// compiled version of the assigned checklist before init runs. Falls back
// to the hard-coded demo (with a warning banner) if the lookup fails.
// ─────────────────────────────────────────────────────────────────────────────
function applySandboxDeployment() {
  const params = new URLSearchParams(location.search);
  const depId  = params.get('deploymentId');
  if (!depId) return; // standalone demo path — leave STEPS untouched

  if (!window.Store || !window.SandboxCompile) {
    showSandboxFallbackBanner('Sandbox scripts failed to load — showing default demo.');
    return;
  }

  const found = window.Store.findDeployment(depId);
  if (!found) {
    showSandboxFallbackBanner('Deployment not found in this browser — showing default demo.');
    return;
  }
  const { checklist, deployment } = found;
  const vehicle = window.Store.getVehicle(deployment.vehicleTag);

  const compiled = window.SandboxCompile.compileChecklistToSteps(
    checklist,
    (blockId) => window.Store.getBlock(blockId)
  );

  if (!compiled.length) {
    showSandboxFallbackBanner(
      `"${checklist.name}" has no deployable steps — showing default demo.`);
    return;
  }

  STEPS = compiled;

  // Update header text so the ceremony matches the assigned vehicle.
  const vehicleName = vehicle ? vehicle.name : deployment.vehicleTag;
  document.title = `CheckIt-2 — ${checklist.name}: ${vehicleName}`;
  const titleEl = document.querySelector('.ceremony-title');
  if (titleEl) titleEl.textContent = `${vehicleName} — ${checklist.name}`;
  const subEl = document.querySelector('.ceremony-subtitle');
  if (subEl) {
    const station = vehicle ? vehicle.station : '';
    const stamp = new Date().toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
    subEl.innerHTML = `<span>${station ? station + ' · ' : ''}${stamp}</span>`;
  }
}

function showSandboxFallbackBanner(msg) {
  const banner = document.createElement('div');
  banner.style.cssText =
    'position:sticky; top:0; z-index:50;' +
    'background:#f59e0b; color:#000; padding:10px 16px;' +
    'font-size:13px; font-weight:600; text-align:center;';
  banner.innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="margin-right:8px;"></i>${msg}`;
  document.body.insertBefore(banner, document.body.firstChild);
}

document.addEventListener('DOMContentLoaded', () => {
  applySandboxDeployment();

  const returnTo = sessionStorage.getItem('returnTo') ||
                   sessionStorage.getItem('ceremonyReturn');
  const backBtn  = document.getElementById('backBtn');
  if (backBtn && returnTo) {
    backBtn.href = returnTo;
    const label = returnTo.includes('index') ? 'Home' :
                  returnTo.includes('fleet') ? 'Fleet' :
                  returnTo.includes('sandbox') ? 'Sandbox' : 'Back';
    backBtn.setAttribute('aria-label', 'Back to ' + label);
  }
  initState();
  buildActiveSteps();
  renderRail();
  renderStep();
});

</script>
