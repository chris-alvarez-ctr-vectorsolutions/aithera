<!DOCTYPE html>
<html lang="en" data-theme="dark" theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CheckIt-2 — Apparatus Rig Check: Engine 7</title>
  <script type="module" src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.5.1/core.iife.js"></script>
  <script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.1.1/styles.js"></script>
  <link rel="stylesheet" href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  <link rel="stylesheet" href="_shell.css" />
  <link rel="stylesheet" href="_mobile.css" />
  <link rel="stylesheet" href="_theme.css" />

  <style>

    /* ==============================
       CEREMONY SHELL
       Full-viewport layout: fixed header + scrollable body
       Desktop: left step rail + right content
       Mobile: sticky progress strip replaces rail; content is full-width
       ============================== */

    html {
      background-color: #0e1628;
    }
    html[data-theme="light"] {
      background-color: #f0f2f8;
    }
    body {
      margin: 0;
      overflow-x: hidden;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 80% 50% at 20% 0%,   rgba(56,96,186,0.35) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 20%,  rgba(139,60,160,0.25) 0%, transparent 55%),
        radial-gradient(ellipse 70% 60% at 50% 80%,  rgba(20,100,140,0.20) 0%, transparent 60%),
        #0e1628;
      background-attachment: fixed;
    }
    html[data-theme="light"] body {
      background: #f0f2f8;
    }

    .ceremony-shell {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── Header ── */
    .ceremony-header {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      height: 56px;
      background: rgba(20,30,52,0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 1px 0 rgba(255,255,255,0.05), 0 2px 16px rgba(0,0,0,0.3);
      flex-shrink: 0;
    }

    html[data-theme="light"] .ceremony-header {
      background: rgba(255,255,255,0.90);
      border-bottom-color: rgba(0,0,0,0.07);
      box-shadow: 0 1px 0 rgba(255,255,255,0.9), 0 2px 12px rgba(0,0,0,0.06);
    }

    .ceremony-back-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      font-size: 14px;
      color: rgba(165,180,252,0.9);
      text-decoration: none;
      border-radius: 6px;
      transition: background 0.12s, color 0.12s;
      flex-shrink: 0;
    }
    .ceremony-back-btn:hover { background: rgba(255,255,255,0.08); color: #a5b4fc; }
    html[data-theme="light"] .ceremony-back-btn { color: #4338ca; }
    html[data-theme="light"] .ceremony-back-btn:hover { background: rgba(99,102,241,0.08); }

    .ceremony-context {
      flex: 1;
      min-width: 0;
    }

    .ceremony-title {
      font-size: 14px;
      font-weight: 700;
      color: #f0f2f8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    html[data-theme="light"] .ceremony-title { color: #1a2340; }

    .ceremony-subtitle {
      font-size: 11px;
      color: #8b96b0;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 1px;
    }
    html[data-theme="light"] .ceremony-subtitle { color: #6b7a99; }

    .fused-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 7px;
      border-radius: 4px;
      background: rgba(99,102,241,0.20);
      color: #a5b4fc;
      border: 1px solid rgba(99,102,241,0.35);
      white-space: nowrap;
    }
    html[data-theme="light"] .fused-badge {
      background: rgba(99,102,241,0.10);
      color: #4338ca;
      border-color: rgba(99,102,241,0.25);
    }

    /* Header right cluster: step counter + status pill + actions */
    .ceremony-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .step-counter {
      font-size: 12px;
      font-weight: 600;
      color: #9aa3b8;
      background: rgba(255,255,255,0.07);
      padding: 4px 10px;
      border-radius: 10px;
      white-space: nowrap;
    }
    html[data-theme="light"] .step-counter { color: #6b7a99; background: rgba(0,0,0,0.06); }

    /* Hide step counter, status pill, and actions on mobile — strip takes over */
    @media (max-width: 899px) {
      .step-counter { display: none; }
      .ceremony-header-right .ceremony-header-actions { display: none; }
      .ceremony-header-right #headerPill { display: none; }
    }

    /* ── Mobile progress strip ──
       Pinned below the ceremony header on mobile only.
       Tapping opens the step overview bottom sheet. */
    .progress-strip {
      display: none; /* shown via media query */
      position: sticky;
      top: 56px; /* sits below ceremony-header */
      z-index: 90;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: rgba(13,20,40,0.97);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      cursor: pointer;
      user-select: none;
      transition: background 0.12s;
    }
    .progress-strip:hover { background: rgba(255,255,255,0.05); }
    html[data-theme="light"] .progress-strip {
      background: rgba(255,255,255,0.97);
      border-bottom-color: rgba(0,0,0,0.07);
    }
    html[data-theme="light"] .progress-strip:hover { background: rgba(99,102,241,0.04); }

    @media (max-width: 899px) {
      .progress-strip { display: flex; }
    }

    .progress-strip-steps {
      display: flex;
      gap: 3px;
      align-items: center;
      flex-shrink: 0;
    }

    .progress-pip {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.20);
      transition: background 0.2s, width 0.2s;
    }
    .progress-pip.done    { background: rgba(165,180,252,0.7); }
    .progress-pip.active  { background: #a5b4fc; width: 14px; border-radius: 3px; }
    html[data-theme="light"] .progress-pip { background: rgba(0,0,0,0.12); }
    html[data-theme="light"] .progress-pip.done   { background: rgba(99,102,241,0.5); }
    html[data-theme="light"] .progress-pip.active { background: #6366f1; }

    .progress-strip-text {
      flex: 1;
      min-width: 0;
    }

    .progress-strip-label {
      font-size: 13px;
      font-weight: 600;
      color: #e2e6f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    html[data-theme="light"] .progress-strip-label { color: #1a2340; }

    .progress-strip-sub {
      font-size: 11px;
      color: #8b96b0;
      margin-top: 1px;
    }
    html[data-theme="light"] .progress-strip-sub { color: #6b7a99; }

    .progress-strip-caret {
      font-size: 11px;
      color: #6b7a99;
      flex-shrink: 0;
    }

    /* ── Step overview bottom sheet ──
       Reuses .bottom-sheet infrastructure from _mobile.css.
       Custom content inside. */
    .step-overview-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      cursor: pointer;
      transition: background 0.1s;
    }
    .step-overview-item:last-child { border-bottom: none; }
    .step-overview-item:hover { background: rgba(255,255,255,0.04); margin: 0 -20px; padding: 11px 20px; }
    html[data-theme="light"] .step-overview-item { border-bottom-color: rgba(0,0,0,0.06); }
    html[data-theme="light"] .step-overview-item:hover { background: rgba(99,102,241,0.04); }

    .step-overview-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .step-overview-dot.completed { background: rgba(99,102,241,0.20); color: #a5b4fc; }
    .step-overview-dot.active    { background: #6366f1; color: #fff; }
    .step-overview-dot.pending   { background: rgba(255,255,255,0.08); color: #8b96b0; }
    html[data-theme="light"] .step-overview-dot.completed { background: rgba(99,102,241,0.12); color: #4338ca; }
    html[data-theme="light"] .step-overview-dot.active    { background: #6366f1; color: #fff; }
    html[data-theme="light"] .step-overview-dot.pending   { background: rgba(0,0,0,0.07); color: #6b7a99; }

    .step-overview-info { flex: 1; min-width: 0; }

    .step-overview-title {
      font-size: 13px;
      font-weight: 600;
      color: #e2e6f0;
    }
    html[data-theme="light"] .step-overview-title { color: #1a2340; }

    .step-overview-meta {
      font-size: 11px;
      color: #8b96b0;
      margin-top: 1px;
    }
    html[data-theme="light"] .step-overview-meta { color: #6b7a99; }

    .step-overview-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .step-overview-badge.pass  { background: rgba(16,185,129,0.15); color: #34d399; }
    .step-overview-badge.def   { background: rgba(239,68,68,0.15);  color: #f87171; }
    .step-overview-badge.warn  { background: rgba(245,158,11,0.15); color: #fbbf24; }
    .step-overview-badge.match { background: rgba(16,185,129,0.15); color: #34d399; }
    html[data-theme="light"] .step-overview-badge.pass  { background: rgba(5,150,105,0.10);  color: #059669; }
    html[data-theme="light"] .step-overview-badge.def   { background: rgba(220,38,38,0.10);  color: #dc2626; }
    html[data-theme="light"] .step-overview-badge.warn  { background: rgba(180,83,9,0.10);   color: #b45309; }
    html[data-theme="light"] .step-overview-badge.match { background: rgba(5,150,105,0.10);  color: #059669; }

    .step-overview-section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7a99;
      padding: 10px 0 4px;
    }
    html[data-theme="light"] .step-overview-section-label { color: #8b96b0; }

    /* ── Body: desktop two-column layout ── */
    .ceremony-body {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* ── Desktop left step rail ── */
    .ceremony-rail {
      width: 224px;
      flex-shrink: 0;
      border-right: 1px solid rgba(255,255,255,0.07);
      padding: 20px 0;
      overflow-y: auto;
      position: sticky;
      top: 56px;
      height: calc(100vh - 56px);
    }
    html[data-theme="light"] .ceremony-rail { border-right-color: rgba(0,0,0,0.07); }

    @media (max-width: 899px) {
      .ceremony-rail { display: none; }
    }

    .rail-section-label {
      padding: 6px 16px 3px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #6b7a99;
    }
    html[data-theme="light"] .rail-section-label { color: #8b96b0; }

    .rail-divider {
      height: 1px;
      background: rgba(255,255,255,0.07);
      margin: 8px 16px;
    }
    html[data-theme="light"] .rail-divider { background: rgba(0,0,0,0.07); }

    .rail-step {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      border-radius: 0;
      transition: background 0.1s;
    }
    .rail-step.completed { cursor: pointer; }
    .rail-step.completed:hover { background: rgba(255,255,255,0.05); }
    html[data-theme="light"] .rail-step.completed:hover { background: rgba(99,102,241,0.05); }

    .rail-step-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
      border: 1.5px solid rgba(255,255,255,0.15);
      color: #8b96b0;
      background: transparent;
    }
    .rail-step.active .rail-step-dot {
      background: #6366f1;
      border-color: #6366f1;
      color: #fff;
    }
    .rail-step.completed .rail-step-dot {
      background: rgba(99,102,241,0.20);
      border-color: rgba(99,102,241,0.40);
      color: #a5b4fc;
    }
    html[data-theme="light"] .rail-step-dot { border-color: rgba(0,0,0,0.12); color: #6b7a99; }
    html[data-theme="light"] .rail-step.active .rail-step-dot { background: #6366f1; border-color: #6366f1; color: #fff; }
    html[data-theme="light"] .rail-step.completed .rail-step-dot { background: rgba(99,102,241,0.12); border-color: rgba(99,102,241,0.30); color: #4338ca; }

    .rail-step-label {
      font-size: 12.5px;
      font-weight: 500;
      color: #9aa3b8;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rail-step.active .rail-step-label { color: #e2e6f0; font-weight: 600; }
    .rail-step.completed .rail-step-label { color: #c4cce0; }
    html[data-theme="light"] .rail-step-label { color: #6b7a99; }
    html[data-theme="light"] .rail-step.active .rail-step-label { color: #1a2340; }
    html[data-theme="light"] .rail-step.completed .rail-step-label { color: #3d4f6e; }

    /* ── Content area ── */
    .ceremony-content {
      flex: 1;
      min-width: 0;
      padding: 20px 24px 80px;
      overflow-y: auto;
    }

    @media (max-width: 899px) {
      /* overflow-y: auto creates a containing block that traps fixed children —
         let the body scroll on mobile instead */
      .ceremony-content {
        padding: 16px 16px 136px;
        overflow-y: visible;
      }
    }

    /* ── State bar ── */
    .ceremony-state-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 8px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      font-size: 12px;
      color: #9aa3b8;
      margin-bottom: 16px;
    }
    .ceremony-state-bar .sep { color: rgba(255,255,255,0.15); }
    html[data-theme="light"] .ceremony-state-bar {
      background: rgba(255,255,255,0.72);
      border-color: rgba(0,0,0,0.08);
      color: #6b7a99;
    }
    html[data-theme="light"] .ceremony-state-bar .sep { color: rgba(0,0,0,0.15); }

    /* ── Step card ── */
    .step-card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px;
      box-shadow: 0 1px 0 rgba(255,255,255,0.08) inset, 0 4px 24px rgba(0,0,0,0.25);
      overflow: hidden;
      margin-bottom: 16px;
    }
    @media (max-width: 899px) {
      /* backdrop-filter creates a containing block that traps fixed children —
         disable it on mobile so the fixed footer escapes to the viewport */
      .step-card {
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
    }

    html[data-theme="light"] .step-card {
      background: rgba(255,255,255,0.72);
      border-color: rgba(255,255,255,0.9);
      box-shadow: 0 1px 0 #fff inset, 0 4px 24px rgba(99,102,241,0.07);
    }

    .step-card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
    }
    html[data-theme="light"] .step-card-header {
      border-bottom-color: rgba(0,0,0,0.06);
      background: rgba(255,255,255,0.50);
    }

    .step-card-title {
      font-size: 15px;
      font-weight: 700;
      color: #f0f2f8;
      line-height: 1.3;
      margin-bottom: 4px;
    }
    html[data-theme="light"] .step-card-title { color: #1a2340; }

    .step-card-meta {
      font-size: 12px;
      color: #8b96b0;
      line-height: 1.5;
    }
    html[data-theme="light"] .step-card-meta { color: #6b7a99; }

    /* ── Step card body ── */
    .step-card-body { padding: 16px 20px; }

    /* ── Step card footer ──
       Desktop: sticky within the card column.
       Mobile: fixed to viewport bottom. */
    .step-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      position: sticky;
      bottom: 0;
    }

    @media (max-width: 899px) {
      .step-card-footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 80;
        padding: 12px 16px;
        background: rgba(13,20,40,0.97);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-top: 1px solid rgba(255,255,255,0.10);
        /* safe area for notched phones */
        padding-bottom: calc(12px + env(safe-area-inset-bottom));
      }
    }

    html[data-theme="light"] .step-card-footer {
      border-top-color: rgba(0,0,0,0.06);
      background: rgba(255,255,255,0.65);
    }
    @media (max-width: 899px) {
      html[data-theme="light"] .step-card-footer {
        background: rgba(240,242,248,0.97);
        border-top-color: rgba(0,0,0,0.10);
      }
    }

    .step-footer-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Pass All button — small ghost, lives in step card header */
    .btn-pass-all {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 28px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1.5px solid rgba(52,211,153,0.35);
      background: rgba(16,185,129,0.08);
      color: #34d399;
      font-size: 11.5px;
      font-weight: 700;
      font-family: 'Open Sans', sans-serif;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s, border-color 0.12s;
    }
    .btn-pass-all:hover {
      background: rgba(16,185,129,0.16);
      border-color: rgba(52,211,153,0.55);
    }
    html[data-theme="light"] .btn-pass-all {
      border-color: rgba(5,150,105,0.30);
      background: rgba(5,150,105,0.07);
      color: #059669;
    }
    html[data-theme="light"] .btn-pass-all:hover {
      background: rgba(5,150,105,0.13);
      border-color: rgba(5,150,105,0.45);
    }

    /* Ghost back button — dark-safe, no Vaadin secondary white-fill problem */
    .btn-back {
      display: inline-flex;
      align-items: center;
      height: 36px;
      padding: 0 14px;
      border-radius: 6px;
      border: 1.5px solid rgba(255,255,255,0.18);
      background: transparent;
      color: #9aa3b8;
      font-size: 13px;
      font-weight: 600;
      font-family: 'Open Sans', sans-serif;
      cursor: pointer;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
      white-space: nowrap;
    }
    .btn-back:hover {
      background: rgba(255,255,255,0.07);
      color: #c4cce0;
      border-color: rgba(255,255,255,0.28);
    }
    html[data-theme="light"] .btn-back {
      border-color: rgba(0,0,0,0.15);
      color: #6b7a99;
    }
    html[data-theme="light"] .btn-back:hover {
      background: rgba(0,0,0,0.05);
      color: #1a2340;
      border-color: rgba(0,0,0,0.25);
    }

    /* ── Verify rows ── */
    .verify-section {
      display: flex;
      flex-direction: column;
    }

    /* Controls always visible inline on both desktop and mobile */
    .verify-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .verify-row:last-child { border-bottom: none; }
    html[data-theme="light"] .verify-row { border-bottom-color: rgba(0,0,0,0.06); }

    /* Status dot — shows answer state on dense row */
    .verify-row-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 7px;
      background: rgba(255,255,255,0.15);
      transition: background 0.15s;
    }
    .verify-row-dot.pass { background: #34d399; }
    .verify-row-dot.deficiency { background: #f87171; }
    html[data-theme="light"] .verify-row-dot { background: rgba(0,0,0,0.12); }
    html[data-theme="light"] .verify-row-dot.pass { background: #059669; }
    html[data-theme="light"] .verify-row-dot.deficiency { background: #dc2626; }

    .verify-row-name {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      color: #c4cce0;
      padding-top: 3px;
    }
    html[data-theme="light"] .verify-row-name { color: #1a2340; }

    .verify-row-sub {
      font-size: 11px;
      color: #8b96b0;
      margin-top: 2px;
      font-weight: 400;
    }
    html[data-theme="light"] .verify-row-sub { color: #6b7a99; }

    /* Controls always visible inline on all viewports */
    .verify-controls {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      align-self: flex-start;
      padding-top: 1px;
    }

    /* Hide chevron everywhere — no promote pattern */
    .verify-row-chevron { display: none; }

    .verify-btn {
      padding: 5px 12px;
      border-radius: 6px;
      border: 1.5px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Open Sans', sans-serif;
      transition: all 0.12s;
      color: #9aa3b8;
      white-space: nowrap;
    }
    .verify-btn:hover { background: rgba(255,255,255,0.10); color: #e2e6f0; }
    .verify-btn.pass.selected { background: rgba(16,185,129,0.15); border-color: #34d399; color: #34d399; }
    .verify-btn.deficiency.selected { background: rgba(239,68,68,0.15); border-color: #f87171; color: #f87171; }
    .verify-btn.na.selected { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.25); color: #e2e6f0; }
    html[data-theme="light"] .verify-btn { border-color: rgba(0,0,0,0.12); background: rgba(255,255,255,0.80); color: #6b7a99; }
    html[data-theme="light"] .verify-btn:hover { background: rgba(0,0,0,0.04); color: #1a2340; }
    html[data-theme="light"] .verify-btn.pass.selected { background: rgba(5,150,105,0.10); border-color: #059669; color: #059669; }
    html[data-theme="light"] .verify-btn.deficiency.selected { background: rgba(220,38,38,0.10); border-color: #dc2626; color: #dc2626; }
    html[data-theme="light"] .verify-btn.na.selected { background: rgba(0,0,0,0.07); border-color: rgba(0,0,0,0.20); color: #3d4f6e; }

    /* On mobile, stack label above controls and use larger touch targets */
    @media (max-width: 599px) {
      .verify-row { flex-wrap: wrap; gap: 8px; }
      .verify-row-name { flex-basis: 100%; padding-top: 0; }
      .verify-row-dot { margin-top: 4px; }
      .verify-controls { padding-top: 0; gap: 8px; }
      .verify-btn { padding: 8px 14px; font-size: 13px; min-height: 36px; }
    }

    /* ── Deficiency inline form ── */
    .deficiency-inline {
      display: none;
      background: rgba(239,68,68,0.08);
      border-left: 3px solid #ef4444;
      border-radius: 0 6px 6px 0;
      padding: 12px 16px;
      margin-top: 2px;
    }
    .deficiency-inline.visible { display: block; }
    html[data-theme="light"] .deficiency-inline { background: rgba(220,38,38,0.06); border-left-color: #dc2626; }

    .deficiency-inline-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #f87171;
      margin-bottom: 8px;
    }
    html[data-theme="light"] .deficiency-inline-label { color: #dc2626; }

    /* ── CS section header ── */
    .cs-section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
    }
    html[data-theme="light"] .cs-section-header {
      border-bottom-color: rgba(0,0,0,0.06);
      background: rgba(255,255,255,0.50);
    }

    .cs-section-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(99,102,241,0.20);
      color: #a5b4fc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    html[data-theme="light"] .cs-section-icon { background: rgba(99,102,241,0.12); color: #4338ca; }

    /* ── Seal row ── */
    .seal-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      font-size: 13px;
      flex-wrap: wrap;
    }
    html[data-theme="light"] .seal-row { border-bottom-color: rgba(0,0,0,0.06); }

    .seal-label { flex: 1; min-width: 140px; }
    .seal-label-main { font-weight: 600; color: #c4cce0; }
    .seal-label-sub { font-size: 11px; color: #8b96b0; margin-top: 2px; }
    html[data-theme="light"] .seal-label-main { color: #1a2340; }
    html[data-theme="light"] .seal-label-sub { color: #6b7a99; }

    /* ── Blind notice ── */
    .blind-notice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: rgba(99,102,241,0.10);
      border-left: 3px solid #6366f1;
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: 12px;
      color: #c4cce0;
      line-height: 1.5;
    }
    html[data-theme="light"] .blind-notice {
      background: rgba(99,102,241,0.07);
      border-left-color: #6366f1;
      color: #1a2340;
    }

    /* ── CS count rows ── */
    .cs-count-row {
      display: grid;
      grid-template-columns: 1fr 130px;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .cs-count-row:last-child { border-bottom: none; }
    html[data-theme="light"] .cs-count-row { border-bottom-color: rgba(0,0,0,0.06); }

    @media (max-width: 899px) {
      .cs-count-row { grid-template-columns: 1fr 110px; }
    }

    .cs-count-name { font-size: 13px; font-weight: 600; color: #c4cce0; }
    .cs-count-sched { font-size: 11px; color: #8b96b0; margin-top: 2px; }
    html[data-theme="light"] .cs-count-name { color: #1a2340; }
    html[data-theme="light"] .cs-count-sched { color: #6b7a99; }

    /* ── Diff table ── */
    .diff-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .diff-table th {
      text-align: left;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #8b96b0;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.03);
    }
    .diff-table td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #c4cce0; }
    .diff-table tr:last-child td { border-bottom: none; }
    .diff-table tr.flagged td { background: rgba(239,68,68,0.07); }
    .diff-table .delta-cell { font-weight: 700; color: #f87171; }
    html[data-theme="light"] .diff-table th { color: #6b7a99; background: rgba(0,0,0,0.03); border-bottom-color: rgba(0,0,0,0.08); }
    html[data-theme="light"] .diff-table td { color: #1a2340; border-bottom-color: rgba(0,0,0,0.05); }
    html[data-theme="light"] .diff-table tr.flagged td { background: rgba(220,38,38,0.05); }
    html[data-theme="light"] .diff-table .delta-cell { color: #dc2626; }

    @media (max-width: 899px) {
      /* Collapse lot and delta columns on narrow screens */
      .diff-table .col-lot,
      .diff-table .col-delta { display: none; }
    }

    /* ── Auth rows (attestation) ── */
    .auth-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-wrap: wrap;
    }
    .auth-row:last-child { border-bottom: none; }
    html[data-theme="light"] .auth-row { border-bottom-color: rgba(0,0,0,0.06); }

    .auth-person { flex: 1; min-width: 120px; }
    .auth-name { font-size: 13px; font-weight: 700; color: #e2e6f0; }
    .auth-role { font-size: 11px; color: #8b96b0; margin-top: 2px; }
    html[data-theme="light"] .auth-name { color: #1a2340; }
    html[data-theme="light"] .auth-role { color: #6b7a99; }

    .auth-status { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; }
    .auth-status.done { color: #34d399; }
    .auth-status.waiting { color: #8b96b0; }
    html[data-theme="light"] .auth-status.done { color: #059669; }
    html[data-theme="light"] .auth-status.waiting { color: #6b7a99; }

    /* ── Summary sections ── */
    .summary-section { margin-bottom: 16px; }
    .summary-section-label {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #8b96b0;
      margin-bottom: 8px;
    }
    html[data-theme="light"] .summary-section-label { color: #6b7a99; }

    .summary-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 12.5px;
    }
    .summary-row:last-child { border-bottom: none; }
    html[data-theme="light"] .summary-row { border-bottom-color: rgba(0,0,0,0.05); }
    .summary-row-label { flex: 1; color: #c4cce0; }
    .summary-row-result { font-weight: 600; }
    html[data-theme="light"] .summary-row-label { color: #1a2340; }

    /* ── Callout block (state callout) ── */
    .state-callout {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 8px;
      border-left: 3px solid;
      margin-bottom: 16px;
      font-size: 12.5px;
    }
    .state-callout-title { font-weight: 700; margin-bottom: 3px; }
    .state-callout-desc { color: #9aa3b8; line-height: 1.5; }
    html[data-theme="light"] .state-callout-desc { color: #6b7a99; }

    .state-callout.required {
      background: rgba(99,102,241,0.10);
      border-left-color: #6366f1;
      color: #c4cce0;
    }
    .state-callout.required .state-callout-title { color: #a5b4fc; }
    .state-callout.optional {
      background: rgba(255,255,255,0.05);
      border-left-color: rgba(255,255,255,0.20);
      color: #9aa3b8;
    }
    .state-callout.optional .state-callout-title { color: #c4cce0; }
    .state-callout.success {
      background: rgba(16,185,129,0.10);
      border-left-color: #10b981;
      color: #c4cce0;
    }
    .state-callout.success .state-callout-title { color: #34d399; }
    .state-callout.discrepancy {
      background: rgba(245,158,11,0.08);
      border-left-color: #f59e0b;
      color: #c4cce0;
    }
    .state-callout.discrepancy .state-callout-title { color: #fbbf24; }
    .state-callout.mismatch {
      background: rgba(239,68,68,0.08);
      border-left-color: #ef4444;
      color: #c4cce0;
    }
    .state-callout.mismatch .state-callout-title { color: #f87171; }

    html[data-theme="light"] .state-callout.required  { background: rgba(99,102,241,0.07); color: #1a2340; }
    html[data-theme="light"] .state-callout.required .state-callout-title { color: #4338ca; }
    html[data-theme="light"] .state-callout.optional  { background: rgba(0,0,0,0.04); border-left-color: rgba(0,0,0,0.15); color: #6b7a99; }
    html[data-theme="light"] .state-callout.optional .state-callout-title { color: #3d4f6e; }
    html[data-theme="light"] .state-callout.success   { background: rgba(5,150,105,0.07); border-left-color: #059669; color: #1a2340; }
    html[data-theme="light"] .state-callout.success .state-callout-title { color: #059669; }
    html[data-theme="light"] .state-callout.discrepancy { background: rgba(180,83,9,0.07); border-left-color: #d97706; color: #1a2340; }
    html[data-theme="light"] .state-callout.discrepancy .state-callout-title { color: #b45309; }
    html[data-theme="light"] .state-callout.mismatch  { background: rgba(220,38,38,0.07); border-left-color: #dc2626; color: #1a2340; }
    html[data-theme="light"] .state-callout.mismatch .state-callout-title { color: #dc2626; }

    /* ── Status pills (reused from shell) ── */
    .status-pill {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 8px;
      white-space: nowrap;
    }
    .status-pill.info    { background: rgba(99,102,241,0.15);  color: #a5b4fc; }
    .status-pill.ok      { background: rgba(16,185,129,0.15);  color: #34d399; }
    .status-pill.warn    { background: rgba(245,158,11,0.15);  color: #fbbf24; }
    .status-pill.error   { background: rgba(239,68,68,0.15);   color: #f87171; }
    .status-pill.neutral { background: rgba(255,255,255,0.08); color: #9aa3b8; }
    html[data-theme="light"] .status-pill.info    { background: rgba(99,102,241,0.10);  color: #4338ca; }
    html[data-theme="light"] .status-pill.ok      { background: rgba(5,150,105,0.10);   color: #059669; }
    html[data-theme="light"] .status-pill.warn    { background: rgba(180,83,9,0.10);    color: #b45309; }
    html[data-theme="light"] .status-pill.error   { background: rgba(220,38,38,0.10);   color: #dc2626; }
    html[data-theme="light"] .status-pill.neutral { background: rgba(0,0,0,0.07);       color: #6b7a99; }

    /* ── Rail note ── */
    .rail-note {
      margin: 16px 12px 0;
      padding: 10px 12px;
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.5;
      color: #8b96b0;
    }
    html[data-theme="light"] .rail-note { background: rgba(0,0,0,0.04); color: #6b7a99; }

    /* ── Toast (standalone — no shell wrapper on ceremony page) ── */
    .toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      pointer-events: none;
    }
    .toast {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(30,40,65,0.97);
      border: 1px solid rgba(255,255,255,0.10);
      backdrop-filter: blur(16px);
      color: #e2e6f0;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      pointer-events: all;
      max-width: min(480px, calc(100vw - 32px));
    }
    html[data-theme="light"] .toast {
      background: rgba(255,255,255,0.97);
      border-color: rgba(0,0,0,0.08);
      color: #1a2340;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }
    .toast-icon { font-size: 14px; color: #a5b4fc; flex-shrink: 0; }
    html[data-theme="light"] .toast-icon { color: #6366f1; }
    .toast a { color: #a5b4fc; font-weight: 600; }
    html[data-theme="light"] .toast a { color: #4338ca; }
    .toast-close {
      background: none; border: none; cursor: pointer; color: #6b7a99;
      font-size: 12px; padding: 0; line-height: 1; flex-shrink: 0;
    }

    /* ── Asset chips (failed / replacement) ──
       Visible inside the inline deficiency form once a WO is created.
       Two-line layout: identity (tag/SN) + variant/location. */
    .asset-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 8px;
      font-size: 12px;
      margin-top: 8px;
    }
    html[data-theme="light"] .asset-chip {
      background: rgba(255,255,255,0.70);
      border-color: rgba(0,0,0,0.08);
    }
    .asset-chip.failed     { border-left: 3px solid #ef4444; }
    .asset-chip.replacement{ border-left: 3px solid #10b981; }
    .asset-chip-icon {
      width: 28px; height: 28px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; flex-shrink: 0;
    }
    .asset-chip.failed .asset-chip-icon {
      background: rgba(239,68,68,0.15); color: #f87171;
    }
    .asset-chip.replacement .asset-chip-icon {
      background: rgba(16,185,129,0.15); color: #34d399;
    }
    html[data-theme="light"] .asset-chip.failed .asset-chip-icon {
      background: rgba(220,38,38,0.10); color: #dc2626;
    }
    html[data-theme="light"] .asset-chip.replacement .asset-chip-icon {
      background: rgba(5,150,105,0.10); color: #059669;
    }
    .asset-chip-body { flex: 1; min-width: 0; }
    .asset-chip-id {
      font-weight: 700; color: #e2e6f0; font-size: 12.5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    html[data-theme="light"] .asset-chip-id { color: #1a2340; }
    .asset-chip-sub { font-size: 11px; color: #8b96b0; margin-top: 1px; }
    html[data-theme="light"] .asset-chip-sub { color: #6b7a99; }
    .asset-chip-tag {
      font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px;
      text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0;
    }
    .asset-chip.failed .asset-chip-tag {
      background: rgba(239,68,68,0.15); color: #f87171;
    }
    .asset-chip.replacement .asset-chip-tag {
      background: rgba(16,185,129,0.15); color: #34d399;
    }
    html[data-theme="light"] .asset-chip.failed .asset-chip-tag {
      background: rgba(220,38,38,0.10); color: #dc2626;
    }
    html[data-theme="light"] .asset-chip.replacement .asset-chip-tag {
      background: rgba(5,150,105,0.10); color: #059669;
    }

    /* Arrow between failed → replacement chips */
    .swap-arrow {
      display: flex; align-items: center; justify-content: center;
      margin: 2px 0 -2px 14px;
      font-size: 11px; color: #6b7a99;
    }

    /* ════════════════════════════════════════════════════════════════════
       VAADIN FORM-CONTROL VISIBILITY OVERRIDES
       The Lumo `theme="outlined"` border is nearly invisible on our dark
       glass card. These overrides force a visible border + subtle inset
       background on every vaadin form control we use, plus light-mode
       variants for contrast there too.
       ════════════════════════════════════════════════════════════════════ */
    .ceremony-content vaadin-text-field,
    .ceremony-content vaadin-text-area,
    .ceremony-content vaadin-password-field,
    .ceremony-content vaadin-number-field,
    .ceremony-content vaadin-date-picker,
    .ceremony-content vaadin-date-time-picker,
    .ceremony-content vaadin-select {
      /* Lumo CSS variables — the cleanest way to control input chrome */
      --lumo-contrast-10pct:   rgba(255,255,255,0.08);   /* idle bg */
      --lumo-contrast-20pct:   rgba(255,255,255,0.20);   /* border */
      --lumo-contrast-30pct:   rgba(255,255,255,0.32);   /* hover border */
      --lumo-contrast-50pct:   rgba(255,255,255,0.55);   /* placeholder */
      --lumo-contrast-60pct:   rgba(255,255,255,0.65);
      --lumo-contrast-80pct:   #c4cce0;
      --lumo-body-text-color:  #e2e6f0;
      --lumo-secondary-text-color: #9aa3b8;
      --lumo-primary-color:    #6366f1;
      --lumo-primary-color-50pct: rgba(99,102,241,0.50);
      --lumo-error-color:      #f87171;
    }
    html[data-theme="light"] .ceremony-content vaadin-text-field,
    html[data-theme="light"] .ceremony-content vaadin-text-area,
    html[data-theme="light"] .ceremony-content vaadin-password-field,
    html[data-theme="light"] .ceremony-content vaadin-number-field,
    html[data-theme="light"] .ceremony-content vaadin-date-picker,
    html[data-theme="light"] .ceremony-content vaadin-date-time-picker,
    html[data-theme="light"] .ceremony-content vaadin-select {
      --lumo-contrast-10pct:   rgba(0,0,0,0.05);
      --lumo-contrast-20pct:   rgba(0,0,0,0.20);
      --lumo-contrast-30pct:   rgba(0,0,0,0.35);
      --lumo-contrast-50pct:   rgba(0,0,0,0.45);
      --lumo-contrast-80pct:   #1a2340;
      --lumo-body-text-color:  #1a2340;
      --lumo-secondary-text-color: #6b7a99;
    }

    /* Force a visible 1.5px border on the input-field container.
       Vaadin renders the "outlined" border via ::part(input-field).
       We also paint a subtle inset background so the field has form even
       when empty. */
    .ceremony-content vaadin-text-field::part(input-field),
    .ceremony-content vaadin-text-area::part(input-field),
    .ceremony-content vaadin-number-field::part(input-field),
    .ceremony-content vaadin-date-picker::part(input-field),
    .ceremony-content vaadin-date-time-picker::part(input-field),
    .ceremony-content vaadin-select::part(input-field) {
      background: rgba(255,255,255,0.06) !important;
      border: 1.5px solid rgba(255,255,255,0.22) !important;
      border-radius: 6px !important;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04) !important;
      transition: border-color 0.12s, background 0.12s !important;
    }
    .ceremony-content vaadin-text-field:hover::part(input-field),
    .ceremony-content vaadin-text-area:hover::part(input-field),
    .ceremony-content vaadin-number-field:hover::part(input-field),
    .ceremony-content vaadin-date-picker:hover::part(input-field),
    .ceremony-content vaadin-date-time-picker:hover::part(input-field),
    .ceremony-content vaadin-select:hover::part(input-field) {
      border-color: rgba(165,180,252,0.55) !important;
      background: rgba(255,255,255,0.09) !important;
    }
    .ceremony-content vaadin-text-field[focused]::part(input-field),
    .ceremony-content vaadin-text-area[focused]::part(input-field),
    .ceremony-content vaadin-number-field[focused]::part(input-field),
    .ceremony-content vaadin-date-picker[focused]::part(input-field),
    .ceremony-content vaadin-date-time-picker[focused]::part(input-field),
    .ceremony-content vaadin-select[focused]::part(input-field) {
      border-color: #6366f1 !important;
      background: rgba(99,102,241,0.08) !important;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15) !important;
    }
    html[data-theme="light"] .ceremony-content vaadin-text-field::part(input-field),
    html[data-theme="light"] .ceremony-content vaadin-text-area::part(input-field),
    html[data-theme="light"] .ceremony-content vaadin-number-field::part(input-field),
    html[data-theme="light"] .ceremony-content vaadin-date-picker::part(input-field),
    html[data-theme="light"] .ceremony-content vaadin-date-time-picker::part(input-field),
    html[data-theme="light"] .ceremony-content vaadin-select::part(input-field) {
      background: #fff !important;
      border-color: rgba(0,0,0,0.20) !important;
      box-shadow: inset 0 1px 0 rgba(0,0,0,0.02) !important;
    }
    html[data-theme="light"] .ceremony-content vaadin-text-field[focused]::part(input-field),
    html[data-theme="light"] .ceremony-content vaadin-text-area[focused]::part(input-field),
    html[data-theme="light"] .ceremony-content vaadin-number-field[focused]::part(input-field),
    html[data-theme="light"] .ceremony-content vaadin-date-picker[focused]::part(input-field),
    html[data-theme="light"] .ceremony-content vaadin-date-time-picker[focused]::part(input-field),
    html[data-theme="light"] .ceremony-content vaadin-select[focused]::part(input-field) {
      background: #fff !important;
      border-color: #6366f1 !important;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.18) !important;
    }

    /* Make text inside the input itself readable on dark theme.
       Vaadin's internal <input> inherits from --lumo-body-text-color which
       we've remapped above, but enforce here too in case theming bypasses it. */
    .ceremony-content vaadin-text-field input,
    .ceremony-content vaadin-text-area textarea,
    .ceremony-content vaadin-number-field input,
    .ceremony-content vaadin-date-picker input,
    .ceremony-content vaadin-date-time-picker input,
    .ceremony-content vaadin-select input {
      color: #e2e6f0 !important;
      font-family: 'Open Sans', sans-serif !important;
    }
    html[data-theme="light"] .ceremony-content vaadin-text-field input,
    html[data-theme="light"] .ceremony-content vaadin-text-area textarea,
    html[data-theme="light"] .ceremony-content vaadin-number-field input,
    html[data-theme="light"] .ceremony-content vaadin-date-picker input,
    html[data-theme="light"] .ceremony-content vaadin-date-time-picker input,
    html[data-theme="light"] .ceremony-content vaadin-select input {
      color: #1a2340 !important;
    }
    /* Date-picker calendar-icon button needs to be visible too */
    .ceremony-content vaadin-date-picker::part(toggle-button),
    .ceremony-content vaadin-date-time-picker::part(toggle-button) {
      color: #a5b4fc !important;
    }
    html[data-theme="light"] .ceremony-content vaadin-date-picker::part(toggle-button),
    html[data-theme="light"] .ceremony-content vaadin-date-time-picker::part(toggle-button) {
      color: #4338ca !important;
    }

    /* Checkbox visibility — Lumo's default check box is faint on dark glass */
    .ceremony-content vaadin-checkbox {
      --lumo-contrast-30pct: rgba(255,255,255,0.45);
      --lumo-contrast-60pct: #c4cce0;
      --lumo-primary-color:  #6366f1;
      --lumo-primary-contrast-color: #fff;
      --lumo-body-text-color: #e2e6f0;
    }
    html[data-theme="light"] .ceremony-content vaadin-checkbox {
      --lumo-contrast-30pct: rgba(0,0,0,0.35);
      --lumo-body-text-color: #1a2340;
    }
    .ceremony-content vaadin-checkbox::part(checkbox) {
      border: 2px solid rgba(255,255,255,0.45) !important;
      background: rgba(255,255,255,0.06) !important;
      border-radius: 4px !important;
      width: 20px !important; height: 20px !important;
    }
    html[data-theme="light"] .ceremony-content vaadin-checkbox::part(checkbox) {
      border-color: rgba(0,0,0,0.35) !important;
      background: #fff !important;
    }
    .ceremony-content vaadin-checkbox[checked]::part(checkbox) {
      background: #6366f1 !important;
      border-color: #6366f1 !important;
    }

    /* Vaadin date-picker dropdown panels need explicit theme matching too —
       they render outside the ceremony-content tree. Apply globally and they
       stay readable. */
    vaadin-date-picker-overlay,
    vaadin-date-time-picker-overlay,
    vaadin-select-overlay {
      --lumo-base-color: #1a2340;
      --lumo-body-text-color: #e2e6f0;
      --lumo-secondary-text-color: #9aa3b8;
    }
    html[data-theme="light"] vaadin-date-picker-overlay,
    html[data-theme="light"] vaadin-date-time-picker-overlay,
    html[data-theme="light"] vaadin-select-overlay {
      --lumo-base-color: #fff;
      --lumo-body-text-color: #1a2340;
      --lumo-secondary-text-color: #6b7a99;
    }

    /* ════════════════════════════════════════════════════════════════════
       MULTI-KIND STEP ITEM ROWS
       Each item in a check step picks one kind; the row layout is shared
       (dot + name + controls), the controls differ by kind.
       ════════════════════════════════════════════════════════════════════ */

    /* Kind chip — small label in the row name area showing the item kind */
    .kind-chip {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 9.5px; font-weight: 700;
      padding: 1px 6px; border-radius: 4px;
      text-transform: uppercase; letter-spacing: 0.05em;
      background: rgba(99,102,241,0.12); color: #a5b4fc;
      vertical-align: 2px; margin-left: 8px;
    }
    html[data-theme="light"] .kind-chip {
      background: rgba(99,102,241,0.08); color: #4338ca;
    }
    .kind-chip i { font-size: 9px; }

    /* Generic 'answered' state on the row dot (non-check kinds) */
    .verify-row-dot.answered { background: #a5b4fc; }
    html[data-theme="light"] .verify-row-dot.answered { background: #6366f1; }

    /* yes-no controls — same shape as pass/def buttons, different palette */
    .yn-btn {
      padding: 5px 14px; border-radius: 6px;
      border: 1.5px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      font-size: 11.5px; font-weight: 700; cursor: pointer;
      color: #9aa3b8; font-family: 'Open Sans', sans-serif;
      transition: all 0.12s; white-space: nowrap;
    }
    .yn-btn:hover { background: rgba(255,255,255,0.10); color: #e2e6f0; }
    .yn-btn.selected.yes { background: rgba(99,102,241,0.15); border-color: #6366f1; color: #a5b4fc; }
    .yn-btn.selected.no  { background: rgba(245,158,11,0.15); border-color: #f59e0b; color: #fbbf24; }
    html[data-theme="light"] .yn-btn { border-color: rgba(0,0,0,0.12); background: rgba(255,255,255,0.80); color: #6b7a99; }
    html[data-theme="light"] .yn-btn:hover { background: rgba(0,0,0,0.04); color: #1a2340; }
    html[data-theme="light"] .yn-btn.selected.yes { background: rgba(99,102,241,0.08); border-color: #6366f1; color: #4338ca; }
    html[data-theme="light"] .yn-btn.selected.no  { background: rgba(180,83,9,0.08); border-color: #d97706; color: #b45309; }

    /* Numeric input row — compact field + unit chip + threshold pill */
    .num-control {
      display: flex; align-items: center; gap: 6px;
      flex-wrap: wrap; justify-content: flex-end;
    }
    .num-control vaadin-number-field { width: 110px; }
    .num-unit {
      font-size: 11px; font-weight: 700; color: #9aa3b8;
      padding: 4px 8px; border-radius: 4px;
      background: rgba(255,255,255,0.05);
    }
    html[data-theme="light"] .num-unit { background: rgba(0,0,0,0.05); color: #6b7a99; }
    .threshold-pill {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 10.5px; font-weight: 700;
      padding: 2px 7px; border-radius: 4px;
      background: rgba(99,102,241,0.12); color: #a5b4fc;
      white-space: nowrap;
    }
    .threshold-pill.failed { background: rgba(239,68,68,0.15); color: #f87171; }
    html[data-theme="light"] .threshold-pill { background: rgba(99,102,241,0.08); color: #4338ca; }
    html[data-theme="light"] .threshold-pill.failed { background: rgba(220,38,38,0.08); color: #dc2626; }

    /* Text / long-text inputs */
    .text-control { width: 280px; max-width: 100%; }
    .longtext-control { width: 100%; }
    @media (max-width: 599px) {
      .text-control { width: 100%; }
    }
    /* Text expected-match indicator */
    .text-match-indicator {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; font-weight: 700; margin-top: 5px;
    }
    .text-match-indicator.match    { color: #34d399; }
    .text-match-indicator.mismatch { color: #fbbf24; }
    html[data-theme="light"] .text-match-indicator.match    { color: #059669; }
    html[data-theme="light"] .text-match-indicator.mismatch { color: #b45309; }

    /* Select / multi-select */
    .select-control { width: 220px; }
    @media (max-width: 599px) { .select-control { width: 100%; } }
    .native-select {
      padding: 6px 8px; border-radius: 6px;
      border: 1.5px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.04);
      color: #e2e6f0; font-size: 13px;
      font-family: 'Open Sans', sans-serif;
    }
    html[data-theme="light"] .native-select {
      border-color: rgba(0,0,0,0.15);
      background: rgba(255,255,255,0.85);
      color: #1a2340;
    }

    /* Multi-select chip group (token chips, not vaadin combobox) */
    .ms-chip-group {
      display: flex; flex-wrap: wrap; gap: 6px; padding-top: 2px;
      justify-content: flex-end;
    }
    .ms-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 5px 10px; border-radius: 14px;
      border: 1.5px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      font-size: 11.5px; color: #9aa3b8; cursor: pointer;
      transition: all 0.12s; white-space: nowrap;
    }
    .ms-chip:hover { background: rgba(255,255,255,0.08); color: #e2e6f0; }
    .ms-chip.selected {
      background: rgba(99,102,241,0.15);
      border-color: #6366f1;
      color: #a5b4fc; font-weight: 600;
    }
    .ms-chip.required-unselected {
      border-color: rgba(245,158,11,0.40);
      color: #fbbf24;
    }
    html[data-theme="light"] .ms-chip { border-color: rgba(0,0,0,0.12); background: rgba(255,255,255,0.80); color: #6b7a99; }
    html[data-theme="light"] .ms-chip:hover { background: rgba(0,0,0,0.04); color: #1a2340; }
    html[data-theme="light"] .ms-chip.selected { background: rgba(99,102,241,0.08); border-color: #6366f1; color: #4338ca; }

    /* Count control — numeric + par chip */
    .count-par {
      font-size: 10.5px; font-weight: 700;
      padding: 2px 7px; border-radius: 4px;
      background: rgba(255,255,255,0.05); color: #9aa3b8;
      white-space: nowrap;
    }
    .count-par.low { background: rgba(239,68,68,0.15); color: #f87171; }
    html[data-theme="light"] .count-par { background: rgba(0,0,0,0.05); color: #6b7a99; }
    html[data-theme="light"] .count-par.low { background: rgba(220,38,38,0.08); color: #dc2626; }

    /* Signature row — special: full width below name, no controls in row */
    .verify-row.signature-row { flex-direction: column; align-items: stretch; }
    .signature-pad-shell {
      margin-top: 10px;
      padding: 14px;
      border: 1.5px dashed rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      display: flex; flex-direction: column; gap: 10px;
    }
    html[data-theme="light"] .signature-pad-shell { border-color: rgba(0,0,0,0.15); background: rgba(255,255,255,0.55); }
    .signature-pad-shell.signed {
      border-style: solid;
      border-color: rgba(16,185,129,0.40);
      background: rgba(16,185,129,0.06);
    }
    html[data-theme="light"] .signature-pad-shell.signed { border-color: #059669; background: rgba(5,150,105,0.05); }
    .signature-signed-meta { font-size: 12px; color: #34d399; font-weight: 600; }
    html[data-theme="light"] .signature-signed-meta { color: #059669; }

    /* Date / datetime control widths */
    vaadin-date-picker, vaadin-date-time-picker { width: 200px; max-width: 100%; }

    /* Info card — read-only display, no input */
    .info-card {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 16px; margin: 4px 0;
      background: rgba(99,102,241,0.08);
      border-left: 3px solid #6366f1;
      border-radius: 0 8px 8px 0;
    }
    html[data-theme="light"] .info-card { background: rgba(99,102,241,0.06); border-left-color: #6366f1; }
    .info-card-icon {
      width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: #a5b4fc; background: rgba(99,102,241,0.15);
    }
    html[data-theme="light"] .info-card-icon { color: #4338ca; background: rgba(99,102,241,0.10); }
    .info-card-body { flex: 1; min-width: 0; font-size: 13px; line-height: 1.55; }
    .info-card-title { font-weight: 700; color: #e2e6f0; margin-bottom: 4px; }
    html[data-theme="light"] .info-card-title { color: #1a2340; }
    .info-card-text { color: #c4cce0; }
    html[data-theme="light"] .info-card-text { color: #1a2340; }

    /* Acknowledge — info-card style but with a checkbox at the right */
    .ack-row {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 16px; margin: 4px 0;
      background: rgba(99,102,241,0.06);
      border-left: 3px solid #6366f1;
      border-radius: 0 8px 8px 0;
    }
    .ack-row.acked { background: rgba(16,185,129,0.08); border-left-color: #10b981; }
    html[data-theme="light"] .ack-row { background: rgba(99,102,241,0.05); }
    html[data-theme="light"] .ack-row.acked { background: rgba(5,150,105,0.05); border-left-color: #059669; }
    .ack-body { flex: 1; min-width: 0; }

    /* ── Universal photo + note slots ──
       Available on every kind except signature. Stays small and unobtrusive
       until the user opens them. */
    .row-slots {
      display: flex; align-items: center; gap: 8px;
      margin-top: 6px; padding-left: 16px;
      flex-wrap: wrap;
    }
    .row-slot-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 9px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.03);
      font-size: 10.5px; font-weight: 600;
      color: #8b96b0; cursor: pointer;
      transition: all 0.12s;
    }
    .row-slot-btn:hover { background: rgba(255,255,255,0.08); color: #e2e6f0; }
    .row-slot-btn.has-content {
      background: rgba(99,102,241,0.12);
      border-color: rgba(99,102,241,0.30);
      color: #a5b4fc;
    }
    html[data-theme="light"] .row-slot-btn { border-color: rgba(0,0,0,0.10); background: rgba(255,255,255,0.60); color: #6b7a99; }
    html[data-theme="light"] .row-slot-btn:hover { background: rgba(0,0,0,0.04); color: #1a2340; }
    html[data-theme="light"] .row-slot-btn.has-content { background: rgba(99,102,241,0.08); border-color: rgba(99,102,241,0.25); color: #4338ca; }

    .slot-expansion {
      width: 100%;
      margin-top: 8px; padding: 10px 14px;
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      display: none;
    }
    .slot-expansion.open { display: block; }
    html[data-theme="light"] .slot-expansion { background: rgba(0,0,0,0.03); }

    /* Section heads inside the slot expansion — uniform across photo + note */
    .slot-section-label {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
      color: #8b96b0;
      margin-bottom: 6px;
    }
    .slot-section-label i { font-size: 11px; color: #a5b4fc; }
    html[data-theme="light"] .slot-section-label { color: #6b7a99; }
    html[data-theme="light"] .slot-section-label i { color: #4338ca; }

    .photo-thumb-strip {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px;
    }
    .photo-thumb {
      width: 64px; height: 64px; border-radius: 6px; flex-shrink: 0;
      background: rgba(99,102,241,0.10);
      border: 1px solid rgba(99,102,241,0.30);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #a5b4fc;
      position: relative;
    }
    html[data-theme="light"] .photo-thumb { background: rgba(99,102,241,0.06); border-color: rgba(99,102,241,0.25); color: #4338ca; }
    .photo-thumb-name {
      position: absolute; bottom: 2px; left: 2px; right: 2px;
      font-size: 8.5px; color: #fff; background: rgba(0,0,0,0.55);
      padding: 1px 3px; border-radius: 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .photo-thumb-x {
      position: absolute; top: -6px; right: -6px;
      width: 18px; height: 18px; border-radius: 50%;
      background: #ef4444; color: #fff;
      border: 2px solid #0e1628;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; cursor: pointer;
    }
    html[data-theme="light"] .photo-thumb-x { border-color: #f0f2f8; }

    /* ── Replacement picker dialog (vaadin-dialog renderer target) ── */
    .picker-summary {
      padding: 12px 14px;
      background: rgba(99,102,241,0.10);
      border: 1px solid rgba(99,102,241,0.20);
      border-radius: 8px;
      font-size: 12.5px;
      color: #c4cce0;
      line-height: 1.55;
      margin-bottom: 14px;
    }
    html[data-theme="light"] .picker-summary {
      background: rgba(99,102,241,0.07);
      border-color: rgba(99,102,241,0.20);
      color: #1a2340;
    }
    .picker-summary strong { color: #e2e6f0; }
    html[data-theme="light"] .picker-summary strong { color: #1a2340; }

    .picker-section-label {
      font-size: 10.5px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: #8b96b0; margin: 12px 0 6px;
    }
    html[data-theme="light"] .picker-section-label { color: #6b7a99; }

    .picker-option {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px;
      border: 1.5px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.03);
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 6px;
      transition: background 0.12s, border-color 0.12s;
    }
    .picker-option:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(165,180,252,0.40);
    }
    .picker-option.selected {
      background: rgba(99,102,241,0.10);
      border-color: #6366f1;
    }
    html[data-theme="light"] .picker-option {
      background: rgba(255,255,255,0.80);
      border-color: rgba(0,0,0,0.10);
    }
    html[data-theme="light"] .picker-option:hover {
      background: rgba(99,102,241,0.04);
      border-color: rgba(99,102,241,0.40);
    }
    html[data-theme="light"] .picker-option.selected {
      background: rgba(99,102,241,0.06);
      border-color: #6366f1;
    }
    .picker-option-radio {
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.30);
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    }
    .picker-option.selected .picker-option-radio {
      border-color: #6366f1;
      background: #6366f1;
    }
    .picker-option.selected .picker-option-radio::after {
      content: ''; width: 8px; height: 8px; border-radius: 50%; background: #fff;
    }
    html[data-theme="light"] .picker-option-radio { border-color: rgba(0,0,0,0.25); }

    .picker-option-body { flex: 1; min-width: 0; }
    .picker-option-id {
      font-weight: 700; font-size: 13px; color: #e2e6f0;
    }
    html[data-theme="light"] .picker-option-id { color: #1a2340; }
    .picker-option-meta {
      font-size: 11.5px; color: #8b96b0; margin-top: 2px;
    }
    html[data-theme="light"] .picker-option-meta { color: #6b7a99; }

    .picker-option-badge {
      font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px;
      text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0;
      background: rgba(16,185,129,0.15); color: #34d399;
    }
    html[data-theme="light"] .picker-option-badge {
      background: rgba(5,150,105,0.10); color: #059669;
    }

  </style>
