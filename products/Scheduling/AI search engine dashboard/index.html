<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CallBack — Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --lumo-primary-color: #0271CE;
    --lumo-header-text-color: rgba(24,39,58,.94);
    --lumo-body-text-color: rgba(0,0,0,.87);
    --lumo-secondary-text-color: rgba(0,0,0,.6);
    --lumo-error-color: #D83E38;
    --lumo-success-color: #158444;
    --lumo-warning-color: #E0782E;
    --lumo-font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  html, body { height: 100%; margin: 0; }
  body { background: #F4F5F7; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
  button { font-family: inherit; }
  select { font-family: inherit; }
  input  { font-family: inherit; }

  @keyframes cbPulse {
    0%,100% { opacity: 1; }
    50%     { opacity: .35; }
  }
  @keyframes cbToast {
    from { transform: translateY(6px); opacity: 0; }
    to   { transform: translateY(0);   opacity: 1; }
  }
  @keyframes cbSlideIn {
    from { transform: translateY(6px); opacity: 0; }
    to   { transform: translateY(0);   opacity: 1; }
  }
  @keyframes fieldReveal {
    from { transform: translateY(8px); opacity: 0; }
    to   { transform: translateY(0);   opacity: 1; }
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<!-- =====================================================================
     PRIMITIVES
     ===================================================================== -->
<script type="text/babel">
/* global React */
const { useState } = React;

const ICONS = {
  search:    <path d="M15.89 14.48l3.15 3.15c.38.38.38 1-.01 1.4-.39.39-1.01.39-1.4 0l-3.15-3.15a6 6 0 1 1 1.41-1.4zM11 15.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9z"/>,
  check:     <path d="M7.5 11.7l-1.3-1.3a1 1 0 0 0-1.4 1.4L9 16a1 1 0 0 0 1.4 0l8.3-8.3a1 1 0 0 0-1.4-1.4L9.7 14z"/>,
  cross:     <path d="M6.4 6.4l11.2 11.2M17.6 6.4L6.4 17.6" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" fill="none"/>,
  plus:      <path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" fill="none"/>,
  angleDown: <path d="M7 10l5 5 5-5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
  bell:      <path d="M16.99 16.49v-4.5a5 5 0 0 0-10 0v4.5L5 18.5h14zM10 20h4a2 2 0 0 1-4 0z"/>,
  user:      <path d="M12 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 1.5c-3.86 0-7 2.26-7 5.5h14c0-3.24-3.14-5.5-7-5.5z"/>,
  cog:       <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8 3.5l-1.5-.4-.5-1.1.8-1.4-1.7-1.7-1.4.8-1.1-.4-.4-1.5h-2.4l-.4 1.5-1.1.4-1.4-.8L6.2 8.6l.8 1.4-.5 1.1-1.5.4V14l1.5.4.5 1.1-.8 1.4 1.7 1.7 1.4-.8 1.1.4.4 1.5h2.4l.4-1.5 1.1-.4 1.4.8 1.7-1.7-.8-1.4.5-1.1 1.5-.4z"/>,
  home:      <path d="M4 20V8l8-4 8 4v12h-5v-7h-6v7z"/>,
  grid:      <path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/>,
  chart:     <path d="M4 20h16v-2H4v2zM4 4v10l4-3 3 4 4-5 5 4V4H4z"/>,
  edit:      <path d="M14.06 4.94l5 5-9.54 9.54-5 .47.47-5zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75z"/>,
  trash:     <path d="M8 7V4h8v3h4v2h-1v12H5V9H4V7h4zm2-1h4V5h-4v1zM7 9v10h10V9H7z"/>,
  ellipsis:  <g><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></g>,
  menu:      <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/>,
  error:     <path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm1 11h-2V9h2v6zm0 3h-2v-2h2v2z"/>,
  filter:    <path d="M4 5h16l-6 8v5l-4 2v-7z"/>,
};

function Icon({ name, size = 18, color = 'currentColor', style }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={color} style={{ flex: 'none', ...style }}>
      {ICONS[name] || null}
    </svg>
  );
}

function Button({ variant = 'secondary', color = 'default', size = 'm', icon, children, onClick, disabled, style }) {
  const palette = {
    default:     { fg: '#0271CE', bd: '#0271CE' },
    destructive: { fg: '#D83E38', bd: '#D83E38' },
    contrast:    { fg: '#192434', bd: 'rgba(0,0,0,.3)' },
  }[color];
  const h = size === 's' ? 30 : 36;
  const styles = {
    primary:   { background: color === 'default' ? '#0271CE' : color === 'destructive' ? '#D83E38' : '#192434', color: '#fff', border: '1px solid transparent' },
    secondary: { background: '#fff', color: palette.fg, border: `1px solid ${palette.bd}` },
    tertiary:  { background: 'transparent', color: palette.fg, border: '1px solid transparent' },
  }[variant];
  return (
    <button onClick={onClick} disabled={disabled} style={{
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 6,
      height: h, padding: icon && !children ? 0 : '0 14px', width: icon && !children ? h : 'auto',
      borderRadius: 4, font: '500 14px/1 Inter,sans-serif', cursor: disabled ? 'not-allowed' : 'pointer',
      opacity: disabled ? 0.5 : 1, transition: 'background .15s, opacity .15s', ...styles, ...style,
    }}>
      {icon && <Icon name={icon} size={16} />}
      {children}
    </button>
  );
}

function TextField({ label, value, onChange, type = 'text', placeholder, error, helper, style }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', ...style }}>
      {label && <label style={{ font: '500 13px/1.3 Inter,sans-serif', color: 'rgba(24,39,58,.94)', marginBottom: 4 }}>{label}</label>}
      <input type={type} value={value ?? ''} onChange={e => onChange?.(e.target.value)} placeholder={placeholder} style={{
        height: 36, padding: '0 12px', border: `1px solid ${error ? '#D83E38' : 'rgba(0,0,0,.3)'}`, borderRadius: 4,
        background: '#fff', font: '400 16px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)', outline: 'none',
      }}
        onFocus={e => !error && (e.target.style.borderColor = '#0271CE')}
        onBlur={e  => !error && (e.target.style.borderColor = 'rgba(0,0,0,.3)')}
      />
      {error  ? <p style={{ font: '400 13px/1.3 Inter,sans-serif', color: '#CA150C', margin: '4px 0 0' }}>{error}</p>
              : helper && <p style={{ font: '400 13px/1.3 Inter,sans-serif', color: 'rgba(0,0,0,.6)', margin: '4px 0 0' }}>{helper}</p>}
    </div>
  );
}

function Badge({ color = 'contrast', children }) {
  const c = {
    primary:  { bg: 'rgba(2,113,206,.1)',   fg: '#0271CE' },
    success:  { bg: 'rgba(21,132,68,.1)',   fg: '#158444' },
    error:    { bg: 'rgba(216,62,56,.1)',   fg: '#CA150C' },
    warning:  { bg: 'rgba(224,120,46,.1)',  fg: '#E0782E' },
    contrast: { bg: 'rgba(28,52,84,.08)',   fg: '#192434' },
  }[color];
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 4,
      height: 22, padding: '0 10px', borderRadius: 11,
      background: c.bg, color: c.fg, font: '500 12px/1 Inter,sans-serif',
    }}>
      {color !== 'primary' && color !== 'contrast' && <span style={{ width: 6, height: 6, borderRadius: '50%', background: 'currentColor' }} />}
      {children}
    </span>
  );
}

const USER_COLORS = ['#195049','#1A4C61','#4A2253','#693C12','#612018','#1C375A','#3D4543'];
function Avatar({ name = '', size = 32, colorIndex }) {
  const idx = colorIndex ?? (name.charCodeAt(0) % USER_COLORS.length);
  const initials = name.split(' ').map(s => s[0]).join('').slice(0,2).toUpperCase();
  return (
    <div style={{
      width: size, height: size, borderRadius: '50%', background: USER_COLORS[idx],
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
      color: '#fff', font: `600 ${Math.round(size * 0.38)}px/1 Inter,sans-serif`, flex: 'none',
    }}>{initials}</div>
  );
}

function Checkbox({ checked, onChange, indeterminate }) {
  return (
    <span onClick={() => onChange?.(!checked)} style={{
      width: 16, height: 16, borderRadius: 4, cursor: 'pointer',
      border: `2px solid ${checked || indeterminate ? '#0271CE' : 'rgba(0,0,0,.3)'}`,
      background: checked || indeterminate ? '#0271CE' : '#fff',
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flex: 'none',
    }}>
      {checked && <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4l3 3 5-6" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>}
      {indeterminate && !checked && <span style={{ width: 8, height: 2, background: '#fff' }} />}
    </span>
  );
}

Object.assign(window, { Icon, Button, TextField, Badge, Avatar, Checkbox, USER_COLORS });
</script>

<script type="text/babel">
/* global React */

const SHELL_NAV = [
  { key: 'crew',      label: 'Crew Scheduling',  icon: 'calendar-user' },
  { key: 'assistant', label: 'Assistant',        icon: 'magic' },
  { key: 'callbacks', label: 'CallBacks',        icon: 'phone', active: true },
  { key: 'bidding',   label: 'Shift Bidding',    icon: 'check-square-o' },
  { key: 'notify',    label: 'Notify',           icon: 'envelope' },
  { key: 'timeoff',   label: 'Time Offs',        icon: 'calendar-clock' },
  { key: 'absence',   label: 'Absence',          icon: 'user-clock' },
  { key: 'bulletin',  label: 'Bulletin Board',   icon: 'clipboard-text' },
  { key: 'trade',     label: 'Trade Board',      icon: 'exchange' },
  { key: 'employees', label: 'Employees',        icon: 'users', badge: '221/500' },
  { key: 'forms',     label: 'Forms',            icon: 'file-text' },

const OUTER_ICON_PATHS = {

  home:            'M4 10l8-6 8 6v10h-5v-7H9v7H4z',
  'calendar-user': 'M5 5h14v3H5zm0 5h14v10H5zm4 3h6v1H9zm-1 3h8v1H8z',
  magic:           'M14 3l1.5 3L19 7l-3 1.5L14 12l-1.5-3L9 7l3-.5L14 3zM5 13l1 2 2 1-2 1-1 2-1-2-2-1 2-1 1-2zm11 4l.8 1.7 1.7.8-1.7.8L16 22l-.8-1.7-1.7-.8 1.7-.8L16 17z',
  'check-square-o':'M4 4h16v16H4zm3 8l3 3 7-7',

  'user-clock':    'M9 11a3 3 0 100-6 3 3 0 000 6zm-6 9c0-3.3 2.7-6 6-6s6 2.7 6 6H3zm14-2a4 4 0 100-8 4 4 0 000 8zm0-2v-3l2 1',
  'clipboard-text':'M8 4h8v2H8zm-2 2h12v14H6zm3 5h6m-6 3h6m-6 3h4',
  exchange:        'M4 8h13l-3-3m3 3l-3 3M20 16H7l3-3m-3 3l3 3',
  users:           'M8 11a3 3 0 100-6 3 3 0 000 6zm8 0a3 3 0 100-6 3 3 0 000 6zm-8 2c-3 0-5 1.5-5 4v1h10v-1c0-2.5-2-4-5-4zm8 0c-.6 0-1.2.1-1.7.2 1 .9 1.7 2.2 1.7 3.8v1h5v-1c0-2.5-2-4-5-4z',
  'file-text':     'M6 3h9l4 4v14H6zm9 0v5h5M8 12h8m-8 3h8m-8 3h5',
  'bar-chart':     'M4 20V9h3v11zm6 0V4h3v16zm6 0v-7h3v7z',
  clock:           'M12 4a8 8 0 100 16 8 8 0 000-16zm0 4v4l3 2',
  'list-ol':       'M8 6h12M8 12h12M8 18h12M3 5h1v3M3 11h2l-2 2h2m-2 4h2v1H3v-1z',
};
const STROKE_ICONS = new Set(['check-square-o','envelope','calendar-clock','user-clock','clipboard-text','exchange','file-text','clock','list-ol']);

function OuterIcon({ name, size = 18, color }) {
  const d = OUTER_ICON_PATHS[name];
  if (!d) return <span style={{ width: size, height: size, display: 'inline-block' }} />;
  const isStroke = STROKE_ICONS.has(name);
  return (
    <svg width={size} height={size} viewBox="0 0 24 24"
      fill={isStroke ? 'none' : (color || 'currentColor')}
      stroke={isStroke ? (color || 'currentColor') : 'none'}
      strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" style={{ flex: 'none' }}>
      <path d={d} />
    </svg>
  );
}

const SUB_ICONS = {
  dashboard: <><circle cx="12" cy="12" r="9"/><path d="M12 12l5-3"/><path d="M12 12v6"/></>,
  forceHire: <><circle cx="10" cy="8" r="3"/><path d="M4 19c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M18 8v6m-3-3h6"/></>,
  scales:    <><path d="M12 4v16M5 7h14"/><path d="M5 7l-2 6a3 3 0 006 0zm14 0l-2 6a3 3 0 006 0z"/></>,
  lists:     <><circle cx="9" cy="8" r="3"/><path d="M3 19c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="7" r="2"/><path d="M15 17c0-2 1-4 4-4"/></>,
  history:   <><path d="M4 12a8 8 0 108-8 8 8 0 00-8 8z"/><path d="M4 6V3M4 6h3"/><path d="M12 8v4l3 2"/></>,
  rankings:  <><path d="M5 20V10M5 20l-2-2m2 2l2-2"/><path d="M10 5h11M10 10h8M10 15h6"/></>,
};

function SubIcon({ name, size = 16, color = 'currentColor' }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" style={{ flex: 'none' }}>
      {SUB_ICONS[name]}
    </svg>
  );
}

function OuterSidebar() {
  return (
    <aside style={{ width: 66, background: '#fff', borderRight: '1px solid rgba(0,0,0,.08)', display: 'flex', flexDirection: 'column', alignItems: 'stretch', flex: 'none' }}>
      <div style={{ height: 56, display: 'flex', alignItems: 'center', justifyContent: 'center', borderBottom: '1px solid rgba(0,0,0,.06)' }}>
        <svg width="22" height="18" viewBox="0 0 24 20"><path d="M3 3h4l5 14L17 3h4" stroke="#1c2430" strokeWidth="2.4" fill="none" strokeLinejoin="round"/></svg>
      </div>
      <nav style={{ flex: 1, overflowY: 'auto', padding: '4px 0' }}>
        {SHELL_NAV.map(n => (
          <div key={n.key} title={n.label} style={{
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            height: 44, position: 'relative', cursor: 'pointer',
            color: n.active ? '#0271CE' : 'rgba(28,46,69,.72)',
            background: n.active ? 'rgba(2,113,206,.08)' : 'transparent',
            borderLeft: n.active ? '3px solid #0271CE' : '3px solid transparent',
          }}>
            <OuterIcon name={n.icon} size={20} />
            {n.badge && (
              <span style={{
                position: 'absolute', right: 6, top: 6,
                background: '#0271CE', color: '#fff', font: '600 9px/1 Inter,sans-serif',
                padding: '2px 4px', borderRadius: 6, letterSpacing: '.02em',
              }}>{n.badge}</span>
            )}
          </div>
        ))}
      </nav>
    </aside>

}

function TopBar() {
  return (
    <header style={{ height: 48, flex: 'none', display: 'flex', alignItems: 'center', padding: '0 16px', background: '#fff', borderBottom: '1px solid rgba(0,0,0,.08)', gap: 14 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer' }}>
        <div style={{ width: 26, height: 26, borderRadius: '50%', background: '#D9DFE6' }} />

        <SubIcon name="history" size={12} color="rgba(0,0,0,.4)" />
      </div>
      <button style={{ height: 26, padding: '0 10px', borderRadius: 4, border: '1px solid rgba(0,0,0,.15)', background: '#fff', font: '500 12px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)', display: 'inline-flex', alignItems: 'center', gap: 4, cursor: 'pointer' }}>

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.6)" strokeWidth="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4m8-4v4"/></svg>
      <div style={{ position: 'relative', cursor: 'pointer' }}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="rgba(0,0,0,.7)"><path d="M12 3a5 5 0 00-5 5v4l-2 3h14l-2-3V8a5 5 0 00-5-5zm0 18a2 2 0 002-2h-4a2 2 0 002 2z"/></svg>

      <span style={{ height: 22, padding: '0 8px', borderRadius: 3, background: '#192434', color: '#fff', font: '600 11px/22px Inter,sans-serif', letterSpacing: '.04em' }}>admin</span>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '0 8px', height: 28, background: 'rgba(2,113,206,.08)', borderRadius: 3 }}>
        <div style={{ width: 20, height: 20, background: '#0271CE', color: '#fff', font: '600 9px/1 Inter,sans-serif', display: 'flex', alignItems: 'center', justifyContent: 'center', textAlign: 'center' }}>YOUR<br/>LOGO</div>

      <div style={{ flex: 1 }} />

        <span style={{ font: '500 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)' }}>Michael_Fulton_Demo</span>

function SubSidebar({ active, onChange }) {
  const items = [
    { key: 'dashboard',  label: 'Dashboard',          icon: 'dashboard' },

function Sparkline({ data, color = '#0271CE', height = 40, width = 220 }) {
  const max = Math.max(...data), min = Math.min(...data);
  const range = max - min || 1;
  const stepX = width / (data.length - 1);
  const points = data.map((v, i) => `${i * stepX},${height - ((v - min) / range) * (height - 4) - 2}`).join(' ');
  const area = `M0,${height} L${points.split(' ').join(' L')} L${width},${height} Z`;
  return (
    <svg width={width} height={height} style={{ display: 'block' }}>
      <path d={area} fill={color} opacity=".08" />
      <polyline points={points} fill="none" stroke={color} strokeWidth="1.8" strokeLinejoin="round" strokeLinecap="round" />
    </svg>
  );
}

function FHAvatar({ name, size = 30 }) {
  const bg = USER_COLORS[name.charCodeAt(0) % USER_COLORS.length];
  const initials = name.split(' ').map(p => p[0]).join('').slice(0, 2).toUpperCase();
  return (
    <div style={{ width: size, height: size, borderRadius: '50%', background: bg, display: 'flex', alignItems: 'center', justifyContent: 'center', font: `600 ${Math.round(size * 0.36)}px/1 Inter,sans-serif`, color: '#fff', flex: 'none' }}>
      {initials}
    </div>
  );
}

function SortingBadge({ sorting }) {
  const map = {
    'Manual':              { bg: 'rgba(0,0,0,.07)',        color: 'rgba(0,0,0,.6)'  },
    'Last Force Hire Date':{ bg: 'rgba(2,113,206,.1)',     color: '#0259A8'          },
    'Callback Rankings':   { bg: 'rgba(21,132,68,.1)',     color: '#158444'          },
  };
  const { bg, color } = map[sorting] || map['Manual'];
  return <span style={{ background: bg, color, font: '500 11px/1 Inter,sans-serif', padding: '3px 8px', borderRadius: 4 }}>{sorting}</span>;
}

/* Employee tag-input with autocomplete */
function EmployeeTagInput({ value, onChange }) {
  const [query, setQuery] = useFH('');
  const [open, setOpen]   = useFH(false);
  const suggestions = query.length > 0
    ? FH_ALL_EMPLOYEES.filter(e => e.toLowerCase().includes(query.toLowerCase()) && !value.includes(e)).slice(0, 6)
    : [];
  const add    = n => { onChange([...value, n]); setQuery(''); };
  const remove = n => onChange(value.filter(e => e !== n));
  return (
    <div style={{ position: 'relative' }}>
      <div onClick={() => document.getElementById('fh-emp-in')?.focus()}
        style={{ minHeight: 42, border: open ? '1.5px solid #0271CE' : '1px solid rgba(0,0,0,.18)', borderRadius: 4, padding: '6px 8px', display: 'flex', flexWrap: 'wrap', gap: 5, cursor: 'text', background: '#fff' }}>
        {value.map(n => (
          <span key={n} style={{ display: 'inline-flex', alignItems: 'center', gap: 4, background: 'rgba(2,113,206,.1)', color: '#0271CE', font: '500 12px/1 Inter,sans-serif', padding: '4px 8px', borderRadius: 4 }}>
            {n}
            <button onMouseDown={() => remove(n)} style={{ background: 'none', border: 'none', padding: 0, cursor: 'pointer', color: '#0271CE', fontSize: 15, lineHeight: 1, display: 'flex', alignItems: 'center' }}>×</button>
          </span>
        ))}
        <input id="fh-emp-in" value={query}
          onChange={e => setQuery(e.target.value)}
          onFocus={() => setOpen(true)}
          onBlur={() => setTimeout(() => setOpen(false), 150)}
          placeholder={value.length === 0 ? 'Type a name to add employees…' : ''}
          style={{ border: 'none', outline: 'none', font: '400 13px/1.4 Inter,sans-serif', minWidth: 180, flex: 1, padding: '3px 0', background: 'transparent' }} />
      </div>
      {open && suggestions.length > 0 && (
        <div style={{ position: 'absolute', top: '100%', left: 0, right: 0, marginTop: 4, background: '#fff', border: '1px solid rgba(0,0,0,.12)', borderRadius: 6, boxShadow: '0 4px 16px rgba(0,0,0,.12)', zIndex: 200, overflow: 'hidden' }}>
          {suggestions.map(n => (
            <div key={n} onMouseDown={() => add(n)}
              style={{ padding: '9px 14px', display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer', font: '400 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)' }}
              onMouseEnter={e => e.currentTarget.style.background = 'rgba(2,113,206,.06)'}
              onMouseLeave={e => e.currentTarget.style.background = ''}>
              <FHAvatar name={n} size={24} /> {n}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* Create / Edit form */
function FHListForm({ initial, onSave, onCancel }) {
  const blank = { name: '', sorting: 'Manual', tieBreaker: 'Seniority', employees: [] };
  const [form, setForm] = useFH(initial || blank);
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const isEdit = !!initial;
  const canSave = form.name.trim() && form.employees.length > 0;

  const iStyle = { width: '100%', height: 38, padding: '0 10px', border: '1px solid rgba(0,0,0,.18)', borderRadius: 4, font: '400 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)', background: '#fff', outline: 'none', boxSizing: 'border-box' };
  const Label = ({ text, note }) => (
    <div style={{ marginBottom: 6 }}>
      <span style={{ font: '500 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.9)' }}>{text}</span>
      {note && <span style={{ font: '400 12px/1 Inter,sans-serif', color: 'rgba(0,0,0,.45)', marginLeft: 8 }}>{note}</span>}
    </div>
  );

  return (
    <div style={{ maxWidth: 580, padding: '28px 32px' }}>
      <h2 style={{ font: '600 20px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)', margin: '0 0 26px' }}>
        {isEdit ? 'Edit list' : 'New Force Hire List'}
      </h2>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 22 }}>

        {/* Name */}
        <div>
          <Label text="Name" />
          <input value={form.name} onChange={e => set('name', e.target.value)} placeholder="Enter a name for this list" style={iStyle} />
        </div>

        {/* Sorting */}
        <div>
          <Label text="Sorting" note="— how employees are ordered" />
          <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>
            {SORTING_OPTS.map(opt => (
              <label key={opt} style={{ flex: 1, display: 'flex', alignItems: 'center', gap: 8, padding: '10px 12px', border: form.sorting === opt ? '1.5px solid #0271CE' : '1px solid rgba(0,0,0,.15)', borderRadius: 6, cursor: 'pointer', background: form.sorting === opt ? 'rgba(2,113,206,.05)' : '#fff', transition: 'all .12s' }}>
                <input type="radio" name="fh-sort" checked={form.sorting === opt} onChange={() => set('sorting', opt)} style={{ accentColor: '#0271CE', margin: 0 }} />
                <span style={{ font: '500 12px/1.3 Inter,sans-serif', color: form.sorting === opt ? '#0271CE' : 'rgba(24,39,58,.87)' }}>{opt}</span>
              </label>
            ))}
          </div>
          <div style={{ padding: '10px 14px', background: 'rgba(0,0,0,.03)', borderRadius: 5, font: '400 12px/1.55 Inter,sans-serif', color: 'rgba(0,0,0,.55)', borderLeft: '3px solid rgba(0,0,0,.1)' }}>
            {SORTING_HINTS[form.sorting]}
          </div>
        </div>

        {/* Tie breaker */}
        <div>
          <Label text="Tie breaker" note="— used when employees have equal standing" />
          <select value={form.tieBreaker} onChange={e => set('tieBreaker', e.target.value)} style={iStyle}>
            {TIE_BREAKER_OPTS.map(o => <option key={o}>{o}</option>)}
          </select>
        </div>

        {/* Employees */}
        <div>
          <Label text="Employees" note={`— ${form.employees.length} selected`} />
          <EmployeeTagInput value={form.employees} onChange={v => set('employees', v)} />
        </div>

      </div>

      <div style={{ display: 'flex', gap: 10, marginTop: 30, justifyContent: 'flex-end' }}>
        <button onClick={onCancel} style={{ height: 36, padding: '0 16px', background: '#fff', border: '1px solid rgba(0,0,0,.2)', borderRadius: 4, font: '500 14px/1 Inter,sans-serif', color: 'rgba(0,0,0,.7)', cursor: 'pointer' }}>Cancel</button>
        <button onClick={() => canSave && onSave(form)} disabled={!canSave}
          style={{ height: 36, padding: '0 20px', background: canSave ? '#2BA76C' : 'rgba(0,0,0,.18)', color: '#fff', border: 'none', borderRadius: 4, font: '500 14px/1 Inter,sans-serif', cursor: canSave ? 'pointer' : 'not-allowed' }}>
          {isEdit ? 'Save changes' : 'Create list'}
        </button>
      </div>
    </div>
  );
}

/* Top-level view */
function ForceHireView({ onBack }) {
  const [lists, setLists]   = useFH(FH_LISTS_INITIAL);
  const [view, setView]     = useFH('index');   // 'index' | 'detail' | 'new' | 'edit'
  const [activeId, setActiveId] = useFH(null);
  const activeList = lists.find(l => l.id === activeId);

  const openList = id => { setActiveId(id); setView('detail'); };

  const handleSave = form => {
    if (view === 'new') {
      const nl = { ...form, id: Date.now(), log: [{ user: 'You', action: 'Created list', date: 'Just now' }] };
      setLists(ls => [...ls, nl]);
      setActiveId(nl.id); setView('detail');
    } else {
      setLists(ls => ls.map(l => l.id === activeId ? { ...l, ...form, log: [{ user: 'You', action: 'Updated list', date: 'Just now' }, ...l.log] } : l));
      setView('detail');
    }
  };

  const handleDelete = () => {
    const rest = lists.filter(l => l.id !== activeId);
    setLists(rest);
    if (rest.length) { setActiveId(rest[0].id); setView('detail'); }
    else { setView('index'); setActiveId(null); }
  };

  const breadcrumb = view === 'index' ? 'Force Hire'
    : view === 'new'  ? 'Force Hire  /  New list'
    : view === 'edit' ? `Force Hire  /  ${activeList?.name}  /  Edit`
    : `Force Hire  /  ${activeList?.name}`;

  const Sep = () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.22)" strokeWidth="2" strokeLinecap="round"><path d="M9 18l6-6-6-6"/></svg>;
  const CrumbLink = ({ label, onClick }) => (
    <button onClick={onClick} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 0, font: '400 13px/1 Inter,sans-serif', color: 'rgba(0,0,0,.45)', display: 'inline-flex', alignItems: 'center', gap: 4 }}
      onMouseEnter={e => e.currentTarget.style.color = '#0271CE'}
      onMouseLeave={e => e.currentTarget.style.color = 'rgba(0,0,0,.45)'}>
      {label}
    </button>
  );

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
      <PageHeader title={
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>
          <CrumbLink label="Dashboard" onClick={onBack} />
          <Sep />
          {view === 'index'
            ? <span style={{ color: 'rgba(24,39,58,.94)', font: '600 15px/1 Inter,sans-serif' }}>Force Hire</span>
            : <><CrumbLink label="Force Hire" onClick={() => setView('index')} /><Sep /></>
          }
          {view === 'detail' && activeList && (
            <span style={{ color: 'rgba(24,39,58,.94)', font: '600 15px/1 Inter,sans-serif' }}>{activeList.name}</span>
          )}
          {view === 'edit' && activeList && (
            <><CrumbLink label={activeList.name} onClick={() => setView('detail')} /><Sep />
            <span style={{ color: 'rgba(24,39,58,.94)', font: '600 15px/1 Inter,sans-serif' }}>Edit</span></>
          )}
          {view === 'new' && (
            <span style={{ color: 'rgba(24,39,58,.94)', font: '600 15px/1 Inter,sans-serif' }}>New list</span>
          )}
        </span>
      }>
        {(view === 'index' || view === 'detail') && (
          <button onClick={() => setView('new')} style={{ height: 34, padding: '0 14px', background: '#2BA76C', color: '#fff', border: 'none', borderRadius: 4, cursor: 'pointer', font: '500 14px/1 Inter,sans-serif', display: 'inline-flex', alignItems: 'center', gap: 7, boxShadow: '0 1px 4px rgba(43,167,108,.3)' }}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.4" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>
            New list
          </button>
        )}
      </PageHeader>

      {view === 'index' && <FHListIndex lists={lists} onSelect={openList} onNew={() => setView('new')} />}
      {view === 'detail' && activeList && <FHListDetail list={activeList} allLists={lists} onNavigate={openList} onEdit={() => setView('edit')} onDelete={handleDelete} />}
      {(view === 'new' || view === 'edit') && (
        <div style={{ flex: 1, overflowY: 'auto', background: '#fff' }}>
          <FHListForm
            initial={view === 'edit' ? { name: activeList.name, sorting: activeList.sorting, tieBreaker: activeList.tieBreaker, employees: [...activeList.employees] } : null}
            onSave={handleSave}
            onCancel={() => setView(activeList ? 'detail' : 'index')}
          />
        </div>
      )}
    </div>
  );
}

Object.assign(window, { ForceHireView });
</script>

          <div style={{ flex: 1, padding: '24px 28px', overflowY: 'auto' }}>

            {step === 1 && <>
              {/* Name */}
              <div style={{ marginBottom: 22 }}>
                <label style={{ font: '500 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.9)', display: 'block', marginBottom: 6 }}>Approach name</label>
                <div style={{ display: 'flex', alignItems: 'center', gap: 0, border: '1px solid rgba(0,0,0,.18)', borderRadius: 4, overflow: 'hidden' }}>
                  <div style={{ width: 38, height: 42, background: 'rgba(0,0,0,.04)', borderRight: '1px solid rgba(0,0,0,.1)', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none' }}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.4)" strokeWidth="1.6" strokeLinecap="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
                  </div>
                  <input value={name} onChange={e => setName(e.target.value)} placeholder="Name the approach…"
                    style={{ flex: 1, height: 42, padding: '0 12px', border: 'none', font: '400 15px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)', outline: 'none', background: 'transparent' }} />
                </div>
              </div>

              {/* Tiers */}
              <div>
                <div style={{ font: '500 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.9)', marginBottom: 8 }}>Tiers <span style={{ font: '400 12px/1 Inter,sans-serif', color: 'rgba(0,0,0,.45)' }}>— the system contacts Tier 1 first, then escalates</span></div>
                <div style={{ border: '1px solid rgba(0,0,0,.1)', borderRadius: 6, overflow: 'hidden' }}>
                  {CRITERIA_TYPES.map(ct => (
                    <div key={ct.key} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '11px 16px', borderBottom: '1px solid rgba(0,0,0,.06)', cursor: 'pointer', background: tiers.some(t => t.criteria === ct.key) ? 'rgba(2,113,206,.04)' : '#fff', transition: 'background .1s' }}
                      onClick={() => {
                        const exists = tiers.find(t => t.criteria === ct.key);
                        if (exists) removeTier(exists.id);
                        else setTiers(prev => [...prev, { id: Date.now(), criteria: ct.key, value: '' }]);
                      }}>
                      <div style={{ width: 18, height: 18, borderRadius: 3, border: tiers.some(t => t.criteria === ct.key) ? '1.5px solid #0271CE' : '1.5px solid rgba(0,0,0,.25)', background: tiers.some(t => t.criteria === ct.key) ? '#0271CE' : '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none' }}>
                        {tiers.some(t => t.criteria === ct.key) && <svg width="10" height="10" viewBox="0 0 24 24" fill="#fff"><path d="M7.5 11.7l-1.3-1.3a1 1 0 00-1.4 1.4L9 16a1 1 0 001.4 0l8.3-8.3a1 1 0 00-1.4-1.4L9.7 14z"/></svg>}
                      </div>
                      <span style={{ font: '600 12px/1 Inter,sans-serif', color: '#0271CE', width: 72, flex: 'none' }}>{ct.label}</span>
                      <span style={{ font: '400 13px/1 Inter,sans-serif', color: 'rgba(0,0,0,.6)' }}>{ct.desc}</span>
                    </div>
                  ))}
                </div>
              </div>
            </>}

            {step === 2 && <>
              <div style={{ font: '500 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.9)', marginBottom: 16 }}>Options</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>

                {/* Wait time */}
                <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                  <span style={{ font: '400 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.87)', flex: 1 }}>Wait time between tiers</span>
                  <input type="number" value={opts.waitTime} onChange={e => setOpt('waitTime', e.target.value)}
                    style={{ ...iStyle, width: 60, textAlign: 'center' }} />
                  <select value={opts.waitUnit} onChange={e => setOpt('waitUnit', e.target.value)} style={{ ...iStyle, width: 90 }}>
                    <option>hours</option><option>minutes</option>
                  </select>
                  <span style={{ font: '400 12px/1 Inter,sans-serif', color: 'rgba(0,0,0,.4)' }}>set to 0 to disable</span>
                </div>

                {[
                  { key: 'closeOutPrev',     label: 'Close out previous tier when contacting next tier' },
                  { key: 'doNotContactNext', label: 'Do not contact next tier if Callback has candidates in current tier' },
                ].map(o => (
                  <div key={o.key} style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                    <ARToggle checked={opts[o.key]} onChange={v => setOpt(o.key, v)} />
                    <span style={{ font: '400 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.87)' }}>{o.label}</span>
                  </div>
                ))}

                <div style={{ borderTop: '1px solid rgba(0,0,0,.06)', paddingTop: 16 }}>
                  {[
                    { toggleKey: 'overrideMaxHours', valKey: 'maxHours',   label: 'Override max. consecutive hours', hint: 'set to 0 for no limit' },
                    { toggleKey: 'overrideBuffer',   valKey: 'bufferHours', label: 'Override buffer period',         hint: 'set to 0 for no limit' },
                  ].map(o => (
                    <div key={o.toggleKey} style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 12 }}>
                      <ARToggle checked={opts[o.toggleKey]} onChange={v => setOpt(o.toggleKey, v)} />
                      <span style={{ font: '400 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.87)', flex: 1 }}>{o.label}</span>
                      {opts[o.toggleKey] && <>
                        <input type="number" value={opts[o.valKey]} onChange={e => setOpt(o.valKey, e.target.value)} style={{ ...iStyle, width: 70 }} />
                        <span style={{ font: '400 12px/1 Inter,sans-serif', color: 'rgba(0,0,0,.5)' }}>hours</span>
                        <span style={{ font: '400 11px/1 Inter,sans-serif', color: 'rgba(0,0,0,.35)' }}>{o.hint}</span>
                      </>}
                    </div>
                  ))}
                  <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                    <ARToggle checked={opts.overrideFTO} onChange={v => setOpt('overrideFTO', v)} />
                    <span style={{ font: '400 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.87)', flex: 1 }}>Override forced time off types</span>
                    {opts.overrideFTO && <input value={opts.ftoTypes} onChange={e => setOpt('ftoTypes', e.target.value)} placeholder="e.g. Vacation, Sick" style={{ ...iStyle, flex: 1 }} />}
                  </div>
                </div>
              </div>
            </>}

            {step === 3 && <>
              <div style={{ font: '500 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.9)', marginBottom: 16 }}>Review your approach</div>
              <div style={{ background: 'rgba(2,113,206,.04)', border: '1px solid rgba(2,113,206,.15)', borderRadius: 8, padding: 18, marginBottom: 20 }}>
                <div style={{ font: '600 15px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)', marginBottom: 10 }}>{name || '(unnamed)'}</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                  <div style={{ font: '400 13px/1.5 Inter,sans-serif', color: 'rgba(0,0,0,.7)' }}>
                    <b>Tiers:</b> {tiers.length > 0 ? tiers.map(t => t.criteria).join(' → ') : 'None selected'}
                  </div>
                  <div style={{ font: '400 13px/1.5 Inter,sans-serif', color: 'rgba(0,0,0,.7)' }}>
                    <b>Wait between tiers:</b> {opts.waitTime} {opts.waitUnit} {opts.waitTime == 0 ? '(disabled — contacts all tiers simultaneously)' : ''}
                  </div>
                  {opts.closeOutPrev && <div style={{ font: '400 13px/1.5 Inter,sans-serif', color: 'rgba(0,0,0,.7)' }}>✓ Close out previous tier when escalating</div>}
                  {opts.doNotContactNext && <div style={{ font: '400 13px/1.5 Inter,sans-serif', color: 'rgba(0,0,0,.7)' }}>✓ Don't contact next tier if current tier has candidates</div>}
                  {opts.overrideMaxHours && <div style={{ font: '400 13px/1.5 Inter,sans-serif', color: 'rgba(0,0,0,.7)' }}>✓ Max consecutive hours: {opts.maxHours}h</div>}
                </div>
              </div>
              <div style={{ padding: '14px 16px', background: 'linear-gradient(135deg, rgba(124,58,237,.06), rgba(99,102,241,.04))', border: '1px solid rgba(124,58,237,.15)', borderRadius: 8, font: '400 13px/1.6 Inter,sans-serif', color: 'rgba(24,39,58,.8)' }}>
                <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start' }}>
                  <span style={{ font: '16px/1', flex: 'none', marginTop: 1 }}>✨</span>
                  <span><b>AI summary:</b> This approach will contact <b>{tiers.map(t => t.criteria).join(', ') || 'no groups'}</b> {tiers.length > 1 ? `in ${tiers.length} tiers` : ''}{opts.waitTime > 0 ? `, waiting ${opts.waitTime} ${opts.waitUnit} between tiers` : ', simultaneously across all tiers'}.</span>
                </div>
              </div>
            </>}

          </div>

          {/* Right: AI assistant panel */}
          <div style={{ width: 240, borderLeft: '1px solid rgba(0,0,0,.07)', background: 'linear-gradient(180deg, rgba(124,58,237,.03) 0%, #fff 100%)', padding: '20px 16px', display: 'flex', flexDirection: 'column', gap: 12 }}>
            <div style={{ display: 'flex', gap: 8, alignItems: 'flex-start' }}>
              <div style={{ width: 28, height: 28, borderRadius: 8, background: 'linear-gradient(135deg,#7C3AED,#5B21B6)', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none' }}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>
              </div>
              <div style={{ font: '400 12px/1.55 Inter,sans-serif', color: 'rgba(24,39,58,.75)', padding: '6px 10px', background: 'rgba(124,58,237,.07)', borderRadius: '0 10px 10px 10px', border: '1px solid rgba(124,58,237,.12)' }}>
                {AI_TIPS[step - 1] || AI_TIPS[0]}
              </div>
            </div>
            <div style={{ font: '600 10px/1 Inter,sans-serif', color: 'rgba(0,0,0,.35)', textTransform: 'uppercase', letterSpacing: '.07em', marginTop: 4 }}>Step {step} of 3</div>
            <div style={{ flex: 1 }} />
            <div style={{ font: '400 11px/1.5 Inter,sans-serif', color: 'rgba(0,0,0,.4)', borderTop: '1px solid rgba(0,0,0,.06)', paddingTop: 12 }}>
              The Callback Methodology: Select Approach → Apply Rule → Calling list is generated → Employees are notified → Rankings adjust in real-time.
            </div>
          </div>
        </div>

        {/* Footer */}
        <div style={{ padding: '14px 24px', borderTop: '1px solid rgba(0,0,0,.08)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <button onClick={() => step > 1 ? setStep(s => s - 1) : onClose()}
            style={{ height: 36, padding: '0 16px', background: '#fff', border: '1px solid rgba(0,0,0,.18)', borderRadius: 4, font: '500 14px/1 Inter,sans-serif', color: 'rgba(0,0,0,.6)', cursor: 'pointer' }}>
            {step === 1 ? 'Cancel' : '← Back'}
          </button>
          {step < 3
            ? <button onClick={() => canNext && setStep(s => s + 1)} disabled={!canNext}
                style={{ height: 36, padding: '0 20px', background: canNext ? '#0271CE' : 'rgba(0,0,0,.15)', color: '#fff', border: 'none', borderRadius: 4, font: '500 14px/1 Inter,sans-serif', cursor: canNext ? 'pointer' : 'not-allowed' }}>
                Continue →
              </button>
            : <button onClick={() => onSave({ name, tiers, opts })}
                style={{ height: 36, padding: '0 20px', background: '#2BA76C', color: '#fff', border: 'none', borderRadius: 4, font: '500 14px/1 Inter,sans-serif', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 7 }}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                Save approach
              </button>
          }
        </div>
      </div>
    </div>
  );
}

/* ── New Rule wizard ───────────────────────────────────────────────────────── */

const ACCUMULATION_SUBTYPES = [
  { key: 'hours',  label: 'Hours Based',  icon: 'M12 8v4l2 2M12 3a9 9 0 100 18A9 9 0 0012 3z', desc: 'Order employees based on the accumulated length of all callbacks they participated in. You can count callbacks they accepted, denied, were contacted for, etc. Reordering is possible by manually adjusting the hours.' },
  { key: 'turns',  label: 'Turns Based',  icon: 'M3 6h18M3 12h18M3 18h18', desc: 'Order employees based on the number of callbacks they participated in. You can count callbacks they accepted, denied, were contacted for, etc. Reordering is possible by manually adjusting the ranking numbers.' },
];
const STATIC_SUBTYPES = [
  { key: 'manual',   label: 'Manual Adjustment Only', icon: 'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2', desc: 'Employees only move in the list when manually re-ordered by an administrator with the proper permission. Newly added employees go to the end of the list.' },
  { key: 'seniority',label: 'Seniority Based',         icon: 'M8 12h.01M12 12h.01M16 12h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z', desc: 'Order employees by their hire/promotion date. Reordering is only possible by changing the hire or promotion date. Any arbitrary tie-breaker can be set up for people with the same hire date.' },
  { key: 'empid',    label: 'By Employee ID #',        icon: 'M7 20l4-16m2 16l4-16M6 9h14M4 15h14', desc: 'Order employees by their employee ID. Uses an alphanumerical natural sorting algorithm that ignores case and tries to order numbers in numerical order.' },
  { key: 'random',   label: 'Random / Lottery',        icon: 'M4 4l4 4m0-4L4 8M20 4l-4 4m4 0l-4-4M4 20l4-4m0 4l-4-4M20 20l-4-4m4 0l-4 4', desc: 'Order employees in a random fashion.' },
];

const RULE_STEPS = [
  { key: 'type',      label: 'Rule Type',    emoji: '🗂️'  },
  { key: 'scope',     label: 'Scope',        emoji: '🎯'  },
  { key: 'tracking',  label: 'Tracking',     emoji: '📊'  },
  { key: 'filters',   label: 'Filters',      emoji: '🔍'  },
  { key: 'save',      label: 'Name & Save',  emoji: '✨'  },
];

function NewRuleWizard({ onSave, onClose }) {
  const [step, setStep]           = useAR(1);
  const [name, setName]           = useAR('');
  const [ruleType, setRuleType]   = useAR('rotating');
  const [subType, setSubType]     = useAR('standard');
  const [settings, setSettings]   = useAR({
    affects: 'approach',
    selectedApproaches: [],
    cbStatuses: ['Active / Done Calling','Filled / Partially Filled'],
    cbResponses: ['Accepted'],
    includePrevShifts: true,
    evaluates: 'callbacks',
    minShift: '', maxShift: '',
  });

  const setSetting = (k, v) => setSettings(s => ({ ...s, [k]: v }));
  const toggleArr  = (key, val) => {
    const arr = settings[key];
    setSetting(key, arr.includes(val) ? arr.filter(x => x !== val) : [...arr, val]);
  };

  const STEP_COLORS = ['#0271CE', '#E07828', '#158444', '#7C3AED', '#2BA76C'];

  const AI_TIPS = [
    'Rotating (Rolodex) rules move employees to the end of the list after each callback — great for fair rotation. Accumulation tracks totals over time. Static keeps employees in a fixed order.',
    'Selecting "Selected Approaches only" lets you target this rule precisely — useful when different job types need different ranking logic.',
    'Include all callback statuses and responses you want this rule to learn from. "Accepted" responses are most commonly used to track fair distribution.',
    'Shift length filters help prevent very short or very long shifts from skewing employee rankings unfairly. Leave blank to include all shifts.',
    'Give your rule a descriptive name — other admins will see it when building approaches. You can always edit it later from this page.',
  ];

  const CB_STATUSES  = ['Active / Done Calling','Filled / Partially Filled','Not Filled','Cancelled'];
  const CB_RESPONSES = ['Accepted','Denied','No answer'];
  const iStyle = { height: 34, padding: '0 10px', border: '1px solid rgba(0,0,0,.18)', borderRadius: 4, font: '400 13px/1 Inter,sans-serif', background: '#fff', outline: 'none' };

  const activeColor = STEP_COLORS[step - 1];
  const subTypes = ruleType === 'rotating' ? ROTATING_SUBTYPES : ruleType === 'accumulation' ? ACCUMULATION_SUBTYPES : STATIC_SUBTYPES;

  return (
    <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,.45)', zIndex: 500, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      <div style={{ width: 920, maxHeight: '90vh', background: '#fff', borderRadius: 12, boxShadow: '0 24px 64px rgba(0,0,0,.22)', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

        {/* Header */}
        <div style={{ padding: '16px 24px', borderBottom: '1px solid rgba(0,0,0,.08)', display: 'flex', alignItems: 'center', gap: 12 }}>
          <div style={{ width: 32, height: 32, borderRadius: 8, background: `linear-gradient(135deg,${activeColor},${activeColor}bb)`, display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'background .3s' }}>
            <SubIcon name="scales" size={15} color="#fff" />
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ font: '600 16px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)' }}>New Rule</div>
            <div style={{ font: '400 12px/1 Inter,sans-serif', color: 'rgba(0,0,0,.45)', marginTop: 3 }}>Applied to an approach to determine employee ranking</div>
          </div>
          <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'rgba(0,0,0,.35)', padding: 4, display: 'flex' }}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>

        {/* Colorful stepper */}
        <div style={{ padding: '16px 32px', borderBottom: '1px solid rgba(0,0,0,.07)', background: '#fafbfc', display: 'flex', alignItems: 'center' }}>
          {RULE_STEPS.map((s, i) => {
            const idx = i + 1;
            const done    = step > idx;
            const current = step === idx;
            const color   = STEP_COLORS[i];
            return (
              <React.Fragment key={s.key}>
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, minWidth: 72 }}>
                  <div style={{
                    width: 38, height: 38, borderRadius: '50%',
                    background: done ? color : current ? color : 'rgba(0,0,0,.07)',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    border: current ? `3px solid ${color}` : done ? `3px solid ${color}` : '3px solid rgba(0,0,0,.1)',
                    boxShadow: current ? `0 0 0 5px ${color}22` : 'none',
                    transition: 'all .25s',
                    font: '700 13px/1 Inter,sans-serif',
                    color: done || current ? '#fff' : 'rgba(0,0,0,.3)',
                  }}>
                    {done ? '✓' : current ? <span style={{ fontSize: 17, lineHeight: 1 }}>{s.emoji}</span> : <span style={{ fontSize: 13 }}>{idx}</span>}
                  </div>
                  <span style={{ font: `${current ? 700 : done ? 500 : 400} 11px/1.2 Inter,sans-serif`, color: current ? color : done ? color : 'rgba(0,0,0,.4)', textAlign: 'center', whiteSpace: 'nowrap' }}>{s.label}</span>
                </div>
                {i < RULE_STEPS.length - 1 && (
                  <div style={{ flex: 1, height: 3, borderRadius: 2, background: step > i + 1 ? `linear-gradient(90deg,${STEP_COLORS[i]},${STEP_COLORS[i+1]})` : 'rgba(0,0,0,.09)', marginBottom: 18, transition: 'background .3s' }} />
                )}
              </React.Fragment>
            );
          })}
        </div>

        <div style={{ flex: 1, overflowY: 'auto', display: 'flex', minHeight: 0 }}>

          {/* Left: form */}
          <div style={{ flex: 1, padding: '24px 28px', overflowY: 'auto' }}>

            {/* ── Step 1: Rule Type ── */}
            {step === 1 && <>
              <div style={{ font: '600 14px/1 Inter,sans-serif', color: 'rgba(24,39,58,.9)', marginBottom: 4 }}>Select a rule type</div>
              <div style={{ font: '400 12px/1 Inter,sans-serif', color: 'rgba(0,0,0,.5)', marginBottom: 14 }}>How should employee rankings be ordered?</div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 10, marginBottom: 20 }}>
                {RULE_TYPES.map(rt => (
                  <div key={rt.key}
                    onClick={() => { setRuleType(rt.key); setSubType(rt.key === 'rotating' ? 'standard' : rt.key === 'accumulation' ? 'hours' : 'manual'); }}
                    style={{ border: ruleType === rt.key ? `2px solid ${STEP_COLORS[0]}` : '1px solid rgba(0,0,0,.12)', borderRadius: 10, padding: '16px 14px', cursor: 'pointer', background: ruleType === rt.key ? 'rgba(2,113,206,.05)' : '#fff', transition: 'all .15s', textAlign: 'center' }}>
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={ruleType === rt.key ? STEP_COLORS[0] : 'rgba(0,0,0,.4)'} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" style={{ marginBottom: 8 }}>
                      <path d={rt.icon}/>
                    </svg>
                    <div style={{ font: `${ruleType === rt.key ? 600 : 500} 13px/1.2 Inter,sans-serif`, color: ruleType === rt.key ? STEP_COLORS[0] : 'rgba(24,39,58,.87)', marginBottom: 5 }}>{rt.label}</div>
                    <div style={{ font: '400 11px/1.4 Inter,sans-serif', color: 'rgba(0,0,0,.45)' }}>{rt.desc?.slice(0, 58)}…</div>
                  </div>
                ))}
              </div>

              <div style={{ font: '500 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.87)', marginBottom: 10 }}>Choose a variant</div>
              <div style={{ border: '1px solid rgba(0,0,0,.1)', borderRadius: 8, overflow: 'hidden' }}>
                {subTypes.map((st, i) => (
                  <div key={st.key} onClick={() => setSubType(st.key)}
                    style={{ padding: '13px 16px', borderBottom: i < subTypes.length - 1 ? '1px solid rgba(0,0,0,.06)' : 'none', background: subType === st.key ? 'rgba(2,113,206,.05)' : '#fff', cursor: 'pointer', transition: 'background .12s' }}>
                    <div style={{ display: 'flex', gap: 12, alignItems: 'flex-start' }}>
                      <div style={{ width: 30, height: 30, borderRadius: '50%', border: `2px solid ${subType === st.key ? STEP_COLORS[0] : 'rgba(0,0,0,.18)'}`, display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none', marginTop: 1, background: subType === st.key ? `${STEP_COLORS[0]}18` : 'transparent', transition: 'all .15s' }}>
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={subType === st.key ? STEP_COLORS[0] : 'rgba(0,0,0,.35)'} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                          <path d={st.icon || 'M12 12m-3 0a3 3 0 106 0 3 3 0 10-6 0'}/>
                        </svg>
                      </div>
                      <div>
                        <div style={{ font: `${subType === st.key ? 600 : 500} 13px/1 Inter,sans-serif`, color: subType === st.key ? STEP_COLORS[0] : 'rgba(24,39,58,.87)', marginBottom: 5 }}>{st.label}</div>
                        <div style={{ font: '400 12px/1.5 Inter,sans-serif', color: 'rgba(0,0,0,.5)' }}>{st.desc}</div>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </>}

            {/* ── Step 2: Scope ── */}
            {step === 2 && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                <div>
                  <div style={{ font: '600 14px/1 Inter,sans-serif', color: 'rgba(24,39,58,.9)', marginBottom: 4 }}>What does this rule apply to?</div>
                  <div style={{ font: '400 12px/1 Inter,sans-serif', color: 'rgba(0,0,0,.5)', marginBottom: 16 }}>Control which approaches this rule will affect when a callback runs.</div>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                  {[
                    ['approach', 'The approach used for this Callback', 'Automatically applies based on which approach the callback uses.'],
                    ['all',      'All Approaches',                       'This rule will apply globally across every approach in your account.'],
                    ['selected', 'Selected Approaches only',             'Choose specific approaches to attach this rule to.'],
                  ].map(([val, lbl, desc]) => (
                    <div key={val} onClick={() => setSetting('affects', val)}
                      style={{ display: 'flex', alignItems: 'flex-start', gap: 12, padding: '14px 16px', border: `1.5px solid ${settings.affects === val ? STEP_COLORS[1] : 'rgba(0,0,0,.1)'}`, borderRadius: 9, cursor: 'pointer', background: settings.affects === val ? `${STEP_COLORS[1]}08` : '#fff', transition: 'all .15s' }}>
                      <div style={{ width: 18, height: 18, borderRadius: '50%', border: `2px solid ${settings.affects === val ? STEP_COLORS[1] : 'rgba(0,0,0,.25)'}`, background: settings.affects === val ? STEP_COLORS[1] : '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none', marginTop: 2, transition: 'all .15s' }}>
                        {settings.affects === val && <div style={{ width: 7, height: 7, borderRadius: '50%', background: '#fff' }} />}
                      </div>
                      <div>
                        <div style={{ font: `${settings.affects === val ? 600 : 500} 13px/1 Inter,sans-serif`, color: settings.affects === val ? STEP_COLORS[1] : 'rgba(24,39,58,.87)', marginBottom: 5 }}>{lbl}</div>
                        <div style={{ font: '400 12px/1.4 Inter,sans-serif', color: 'rgba(0,0,0,.5)' }}>{desc}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ── Step 3: Tracking ── */}
            {step === 3 && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
                <div>
                  <div style={{ font: '600 14px/1 Inter,sans-serif', color: 'rgba(24,39,58,.9)', marginBottom: 4 }}>Which callbacks count toward rankings?</div>
                  <div style={{ font: '400 12px/1 Inter,sans-serif', color: 'rgba(0,0,0,.5)', marginBottom: 4 }}>Define which callback history gets used when calculating employee order.</div>
                </div>
                <div>
                  <div style={{ font: '500 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.87)', marginBottom: 10 }}>Callback statuses</div>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8 }}>
                    {CB_STATUSES.map(s => (
                      <label key={s} style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '10px 12px', border: `1.5px solid ${settings.cbStatuses.includes(s) ? STEP_COLORS[2] : 'rgba(0,0,0,.1)'}`, borderRadius: 6, cursor: 'pointer', background: settings.cbStatuses.includes(s) ? `${STEP_COLORS[2]}08` : '#fff', transition: 'all .12s' }}>
                        <input type="checkbox" checked={settings.cbStatuses.includes(s)} onChange={() => toggleArr('cbStatuses', s)} style={{ accentColor: STEP_COLORS[2], width: 14, height: 14, flex: 'none' }} />
                        <span style={{ font: `${settings.cbStatuses.includes(s) ? 600 : 400} 12px/1 Inter,sans-serif`, color: settings.cbStatuses.includes(s) ? STEP_COLORS[2] : 'rgba(24,39,58,.8)' }}>{s}</span>
                      </label>
                    ))}
                  </div>
                </div>
                <div>
                  <div style={{ font: '500 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.87)', marginBottom: 10 }}>Callback responses</div>
                  <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                    {CB_RESPONSES.map(r => (
                      <label key={r} style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '10px 12px', border: `1.5px solid ${settings.cbResponses.includes(r) ? STEP_COLORS[2] : 'rgba(0,0,0,.1)'}`, borderRadius: 6, cursor: 'pointer', background: settings.cbResponses.includes(r) ? `${STEP_COLORS[2]}08` : '#fff', transition: 'all .12s' }}>
                        <input type="checkbox" checked={settings.cbResponses.includes(r)} onChange={() => toggleArr('cbResponses', r)} style={{ accentColor: STEP_COLORS[2], width: 14, height: 14, flex: 'none' }} />
                        <span style={{ font: `${settings.cbResponses.includes(r) ? 600 : 400} 12px/1 Inter,sans-serif`, color: settings.cbResponses.includes(r) ? STEP_COLORS[2] : 'rgba(24,39,58,.8)' }}>{r}</span>
                      </label>
                    ))}
                  </div>
                </div>
                <label style={{ display: 'inline-flex', alignItems: 'center', gap: 8, cursor: 'pointer' }}>
                  <input type="checkbox" checked={settings.includePrevShifts} onChange={e => setSetting('includePrevShifts', e.target.checked)} style={{ accentColor: STEP_COLORS[2], width: 14, height: 14 }} />
                  <span style={{ font: '400 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.87)' }}>Include previously created shifts in rankings</span>
                </label>
                <div>
                  <div style={{ font: '500 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.87)', marginBottom: 10 }}>Rule evaluates</div>
                  <div style={{ display: 'flex', gap: 8 }}>
                    {[['callbacks','Callbacks only'],['all','All shifts']].map(([val, lbl]) => (
                      <label key={val} style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '10px 14px', border: `1.5px solid ${settings.evaluates === val ? STEP_COLORS[2] : 'rgba(0,0,0,.1)'}`, borderRadius: 6, cursor: 'pointer', background: settings.evaluates === val ? `${STEP_COLORS[2]}08` : '#fff', transition: 'all .12s' }}>
                        <input type="radio" name="ruleEval" checked={settings.evaluates === val} onChange={() => setSetting('evaluates', val)} style={{ accentColor: STEP_COLORS[2] }} />
                        <span style={{ font: `${settings.evaluates === val ? 600 : 400} 13px/1 Inter,sans-serif`, color: settings.evaluates === val ? STEP_COLORS[2] : 'rgba(24,39,58,.8)' }}>{lbl}</span>
                      </label>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* ── Step 4: Filters ── */}
            {step === 4 && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 22 }}>
                <div>
                  <div style={{ font: '600 14px/1 Inter,sans-serif', color: 'rgba(24,39,58,.9)', marginBottom: 4 }}>Shift length filters</div>
                  <div style={{ font: '400 12px/1 Inter,sans-serif', color: 'rgba(0,0,0,.5)', marginBottom: 4 }}>Optionally limit which shifts qualify based on their length. Leave blank to include all.</div>
                </div>
                {[['Minimum shift length','minShift','greater than or equal to'],['Maximum shift length','maxShift','less than or equal to']].map(([label, key, op]) => (
                  <div key={key} style={{ border: `1.5px solid ${settings[key] ? STEP_COLORS[3] : 'rgba(0,0,0,.1)'}`, borderRadius: 10, padding: '16px 18px', background: settings[key] ? `${STEP_COLORS[3]}06` : '#fff', transition: 'all .15s' }}>
                    <div style={{ font: '500 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.87)', marginBottom: 12 }}>{label}</div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                      <select style={{ ...iStyle, flex: 1 }} defaultValue={op}>
                        <option>greater than or equal to</option>
                        <option>greater than</option>
                        <option>less than or equal to</option>
                        <option>less than</option>
                        <option>equal to</option>
                      </select>
                      <input type="number" value={settings[key]} onChange={e => setSetting(key, e.target.value)} placeholder="—" style={{ ...iStyle, width: 80 }} />
                      <span style={{ font: '400 13px/1 Inter,sans-serif', color: 'rgba(0,0,0,.5)' }}>hours</span>
                    </div>
                  </div>
                ))}
                <div style={{ padding: '12px 14px', background: `${STEP_COLORS[3]}08`, border: `1px solid ${STEP_COLORS[3]}25`, borderRadius: 8 }}>
                  <div style={{ font: '500 12px/1 Inter,sans-serif', color: STEP_COLORS[3], marginBottom: 6 }}>💡 Tip</div>
                  <div style={{ font: '400 12px/1.55 Inter,sans-serif', color: 'rgba(0,0,0,.6)' }}>Leaving both fields blank means <b>all shift lengths</b> will be included. Filters here are applied on top of any approach-level settings.</div>
                </div>
              </div>
            )}

            {/* ── Step 5: Name & Save ── */}
            {step === 5 && <>
              <div style={{ font: '600 14px/1 Inter,sans-serif', color: 'rgba(24,39,58,.9)', marginBottom: 4 }}>Name your rule</div>
              <div style={{ font: '400 12px/1 Inter,sans-serif', color: 'rgba(0,0,0,.5)', marginBottom: 16 }}>Give it a clear, descriptive name so others know when to use it.</div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 0, border: `1.5px solid ${name.trim() ? STEP_COLORS[4] : 'rgba(0,0,0,.18)'}`, borderRadius: 6, overflow: 'hidden', marginBottom: 20, transition: 'border-color .15s' }}>
                <div style={{ width: 40, height: 46, background: 'rgba(0,0,0,.04)', borderRight: '1px solid rgba(0,0,0,.1)', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none' }}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.4)" strokeWidth="1.6" strokeLinecap="round"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4z"/></svg>
                </div>
                <input value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Overtime Accumulation — Firefighter 2"
                  style={{ flex: 1, height: 46, padding: '0 12px', border: 'none', font: '400 14px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)', outline: 'none', background: 'transparent' }} />
              </div>
              <div style={{ background: 'rgba(2,113,206,.04)', border: '1px solid rgba(2,113,206,.15)', borderRadius: 8, padding: 16, marginBottom: 16 }}>
                <div style={{ font: '600 11px/1 Inter,sans-serif', color: 'rgba(0,0,0,.4)', textTransform: 'uppercase', letterSpacing: '.05em', marginBottom: 12 }}>Configuration summary</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 7, font: '400 13px/1.5 Inter,sans-serif', color: 'rgba(0,0,0,.7)' }}>
                  <div>🗂️ <b>Type:</b> {RULE_TYPES.find(r => r.key === ruleType)?.label} — {subTypes.find(s => s.key === subType)?.label}</div>
                  <div>🎯 <b>Scope:</b> {settings.affects === 'approach' ? 'Approach used for Callback' : settings.affects === 'all' ? 'All Approaches' : 'Selected Approaches only'}</div>
                  <div>📊 <b>Statuses:</b> {settings.cbStatuses.join(', ') || 'None'}</div>
                  <div>📊 <b>Responses:</b> {settings.cbResponses.join(', ') || 'None'}</div>
                  <div>📊 <b>Evaluates:</b> {settings.evaluates === 'callbacks' ? 'Callbacks only' : 'All shifts'}{settings.includePrevShifts ? ' (incl. prev shifts)' : ''}</div>
                  {(settings.minShift || settings.maxShift) && (
                    <div>🔍 <b>Filters:</b> {[settings.minShift ? `min ${settings.minShift}h` : '', settings.maxShift ? `max ${settings.maxShift}h` : ''].filter(Boolean).join(', ')}</div>
                  )}
                </div>
              </div>
              <div style={{ padding: '14px 16px', background: 'linear-gradient(135deg,rgba(43,167,108,.07),rgba(2,113,206,.05))', border: '1px solid rgba(43,167,108,.2)', borderRadius: 8 }}>
                <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start' }}>
                  <span style={{ font: '16px/1', flex: 'none', marginTop: 1 }}>✨</span>
                  <span style={{ font: '400 13px/1.6 Inter,sans-serif', color: 'rgba(24,39,58,.8)' }}><b>AI summary:</b> A <b>{RULE_TYPES.find(r => r.key === ruleType)?.label} — {subTypes.find(s => s.key === subType)?.label}</b> rule tracking <b>{settings.cbResponses.join(' & ') || 'no'}</b> responses across <b>{settings.cbStatuses.length}</b> callback status{settings.cbStatuses.length !== 1 ? 'es' : ''}. Rankings will be recalculated in real-time as callbacks are completed.</span>
                </div>
              </div>
            </>}

          </div>

          {/* Right: AI tips */}
          <div style={{ width: 215, borderLeft: '1px solid rgba(0,0,0,.07)', background: 'linear-gradient(180deg,rgba(124,58,237,.04) 0%,#fff 100%)', padding: '20px 14px', display: 'flex', flexDirection: 'column', gap: 12, flexShrink: 0 }}>
            <div style={{ display: 'flex', gap: 8, alignItems: 'flex-start' }}>
              <div style={{ width: 28, height: 28, borderRadius: 8, background: 'linear-gradient(135deg,#7C3AED,#5B21B6)', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none' }}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>
              </div>
              <div style={{ font: '400 12px/1.55 Inter,sans-serif', color: 'rgba(24,39,58,.75)', padding: '6px 10px', background: 'rgba(124,58,237,.07)', borderRadius: '0 10px 10px 10px', border: '1px solid rgba(124,58,237,.12)' }}>
                {AI_TIPS[step - 1]}
              </div>
            </div>
            <div style={{ font: '600 10px/1 Inter,sans-serif', color: 'rgba(0,0,0,.35)', textTransform: 'uppercase', letterSpacing: '.07em', marginTop: 4 }}>Step {step} of {RULE_STEPS.length}</div>
          </div>
        </div>

        {/* Footer */}
        <div style={{ padding: '14px 24px', borderTop: '1px solid rgba(0,0,0,.08)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <button onClick={() => step > 1 ? setStep(s => s - 1) : onClose()}
            style={{ height: 36, padding: '0 16px', background: '#fff', border: '1px solid rgba(0,0,0,.18)', borderRadius: 4, font: '500 14px/1 Inter,sans-serif', color: 'rgba(0,0,0,.6)', cursor: 'pointer' }}>
            {step === 1 ? 'Cancel' : '← Back'}
          </button>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <div style={{ display: 'flex', gap: 4 }}>
              {RULE_STEPS.map((_, i) => (
                <div key={i} style={{ width: step === i+1 ? 22 : 6, height: 6, borderRadius: 3, background: step > i ? STEP_COLORS[i] : step === i+1 ? STEP_COLORS[i] : 'rgba(0,0,0,.12)', transition: 'all .2s' }} />
              ))}
            </div>
            {step < RULE_STEPS.length
              ? <button onClick={() => setStep(s => s + 1)} style={{ height: 36, padding: '0 20px', background: activeColor, color: '#fff', border: 'none', borderRadius: 4, font: '500 14px/1 Inter,sans-serif', cursor: 'pointer', transition: 'background .3s' }}>Continue →</button>
              : <button onClick={() => name.trim() && onSave({ name, ruleType, subType, settings })} disabled={!name.trim()}
                  style={{ height: 36, padding: '0 20px', background: name.trim() ? STEP_COLORS[4] : 'rgba(0,0,0,.15)', color: '#fff', border: 'none', borderRadius: 4, font: '500 14px/1 Inter,sans-serif', cursor: name.trim() ? 'pointer' : 'not-allowed', display: 'inline-flex', alignItems: 'center', gap: 7, transition: 'background .2s' }}>
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                  Save rule
                </button>
            }
          </div>
        </div>
      </div>
    </div>
  );
}

        <button onClick={() => setShowNewApproach(true)} style={{ height: 34, padding: '0 14px', background: '#fff', color: '#0271CE', border: '1px solid rgba(2,113,206,.4)', borderRadius: 4, cursor: 'pointer', font: '500 14px/1 Inter,sans-serif', display: 'inline-flex', alignItems: 'center', gap: 7, marginRight: 8 }}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>
          New Approach
        </button>
        <button onClick={() => setShowNewRule(true)} style={{ height: 34, padding: '0 14px', background: '#0271CE', color: '#fff', border: 'none', borderRadius: 4, cursor: 'pointer', font: '500 14px/1 Inter,sans-serif', display: 'inline-flex', alignItems: 'center', gap: 7 }}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.4" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>

          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 12 }}>
            <div style={{ width: 30, height: 30, borderRadius: 8, background: 'linear-gradient(135deg,#7C3AED,#5B21B6)', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none' }}>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>

                  <div style={{ font: '400 11px/1 Inter,sans-serif', color: 'rgba(0,0,0,.45)', marginTop: 2, whiteSpace: 'nowrap' }}>{s.desc}</div>

    if (form.ruleType === 'hours') primary = a.hours - b.hours;
    else if (form.ruleType === 'hire_date') primary = new Date(a.hireDate) - new Date(b.hireDate);
    else if (form.ruleType === 'rolodex') primary = 0;
    else primary = a.hours - b.hours;
    if (primary !== 0) return primary;
    if (form.tieBreaker === 'Seniority (hire date)') return new Date(a.hireDate) - new Date(b.hireDate);
    if (form.tieBreaker === 'Last shift worked') return a.lastShift.localeCompare(b.lastShift);
    if (form.tieBreaker === 'Last callback date') return a.lastCallback.localeCompare(b.lastCallback);
    return a.name.localeCompare(b.name);
  });
}

  parts.push(`Callback list for ${approachLabel} ranked by ${typeLabels[form.ruleType] || 'fewest overtime hours'}`);
  if (form.lookBack) parts[0] += ` over a ${form.lookBack}-day window`;

    parts.push(`Shift filter: ${range}`);
  }
  return parts.join('. ') + '.';
}
