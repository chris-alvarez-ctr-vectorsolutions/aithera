<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CallBack — Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --lumo-primary-color: #0271CE;
    --lumo-header-text-color: rgba(24,39,58,.94);
    --lumo-body-text-color: rgba(0,0,0,.87);
    --lumo-secondary-text-color: rgba(0,0,0,.6);
    --lumo-error-color: #D83E38;
    --lumo-success-color: #158444;
    --lumo-warning-color: #E0782E;
    --lumo-font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  html, body { height: 100%; margin: 0; }
  body { background: #F4F5F7; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
  button { font-family: inherit; }
  select { font-family: inherit; }
  input  { font-family: inherit; }

  @keyframes cbPulse {
    0%,100% { opacity: 1; }
    50%     { opacity: .35; }
  }
  @keyframes cbToast {
    from { transform: translateY(6px); opacity: 0; }
    to   { transform: translateY(0);   opacity: 1; }
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<!-- =====================================================================
     PRIMITIVES
     ===================================================================== -->
<script type="text/babel">
/* global React */
const { useState } = React;

const ICONS = {
  search:    <path d="M15.89 14.48l3.15 3.15c.38.38.38 1-.01 1.4-.39.39-1.01.39-1.4 0l-3.15-3.15a6 6 0 1 1 1.41-1.4zM11 15.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9z"/>,
  check:     <path d="M7.5 11.7l-1.3-1.3a1 1 0 0 0-1.4 1.4L9 16a1 1 0 0 0 1.4 0l8.3-8.3a1 1 0 0 0-1.4-1.4L9.7 14z"/>,
  cross:     <path d="M6.4 6.4l11.2 11.2M17.6 6.4L6.4 17.6" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" fill="none"/>,
  plus:      <path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" fill="none"/>,
  angleDown: <path d="M7 10l5 5 5-5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
  bell:      <path d="M16.99 16.49v-4.5a5 5 0 0 0-10 0v4.5L5 18.5h14zM10 20h4a2 2 0 0 1-4 0z"/>,
  user:      <path d="M12 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 1.5c-3.86 0-7 2.26-7 5.5h14c0-3.24-3.14-5.5-7-5.5z"/>,
  cog:       <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8 3.5l-1.5-.4-.5-1.1.8-1.4-1.7-1.7-1.4.8-1.1-.4-.4-1.5h-2.4l-.4 1.5-1.1.4-1.4-.8L6.2 8.6l.8 1.4-.5 1.1-1.5.4V14l1.5.4.5 1.1-.8 1.4 1.7 1.7 1.4-.8 1.1.4.4 1.5h2.4l.4-1.5 1.1-.4 1.4.8 1.7-1.7-.8-1.4.5-1.1 1.5-.4z"/>,
  home:      <path d="M4 20V8l8-4 8 4v12h-5v-7h-6v7z"/>,
  grid:      <path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/>,
  chart:     <path d="M4 20h16v-2H4v2zM4 4v10l4-3 3 4 4-5 5 4V4H4z"/>,
  edit:      <path d="M14.06 4.94l5 5-9.54 9.54-5 .47.47-5zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75z"/>,
  trash:     <path d="M8 7V4h8v3h4v2h-1v12H5V9H4V7h4zm2-1h4V5h-4v1zM7 9v10h10V9H7z"/>,
  ellipsis:  <g><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></g>,
  menu:      <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/>,
  error:     <path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm1 11h-2V9h2v6zm0 3h-2v-2h2v2z"/>,
  filter:    <path d="M4 5h16l-6 8v5l-4 2v-7z"/>,
};

function Icon({ name, size = 18, color = 'currentColor', style }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={color} style={{ flex: 'none', ...style }}>
      {ICONS[name] || null}
    </svg>
  );
}

function Button({ variant = 'secondary', color = 'default', size = 'm', icon, children, onClick, disabled, style }) {
  const palette = {
    default:     { fg: '#0271CE', bd: '#0271CE' },
    destructive: { fg: '#D83E38', bd: '#D83E38' },
    contrast:    { fg: '#192434', bd: 'rgba(0,0,0,.3)' },
  }[color];
  const h = size === 's' ? 30 : 36;
  const styles = {
    primary:   { background: color === 'default' ? '#0271CE' : color === 'destructive' ? '#D83E38' : '#192434', color: '#fff', border: '1px solid transparent' },
    secondary: { background: '#fff', color: palette.fg, border: `1px solid ${palette.bd}` },
    tertiary:  { background: 'transparent', color: palette.fg, border: '1px solid transparent' },
  }[variant];
  return (
    <button onClick={onClick} disabled={disabled} style={{
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 6,
      height: h, padding: icon && !children ? 0 : '0 14px', width: icon && !children ? h : 'auto',
      borderRadius: 4, font: '500 14px/1 Inter,sans-serif', cursor: disabled ? 'not-allowed' : 'pointer',
      opacity: disabled ? 0.5 : 1, transition: 'background .15s, opacity .15s', ...styles, ...style,
    }}>
      {icon && <Icon name={icon} size={16} />}
      {children}
    </button>
  );
}

function TextField({ label, value, onChange, type = 'text', placeholder, error, helper, style }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', ...style }}>
      {label && <label style={{ font: '500 13px/1.3 Inter,sans-serif', color: 'rgba(24,39,58,.94)', marginBottom: 4 }}>{label}</label>}
      <input type={type} value={value ?? ''} onChange={e => onChange?.(e.target.value)} placeholder={placeholder} style={{
        height: 36, padding: '0 12px', border: `1px solid ${error ? '#D83E38' : 'rgba(0,0,0,.3)'}`, borderRadius: 4,
        background: '#fff', font: '400 16px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)', outline: 'none',
      }}
        onFocus={e => !error && (e.target.style.borderColor = '#0271CE')}
        onBlur={e  => !error && (e.target.style.borderColor = 'rgba(0,0,0,.3)')}
      />
      {error  ? <p style={{ font: '400 13px/1.3 Inter,sans-serif', color: '#CA150C', margin: '4px 0 0' }}>{error}</p>
              : helper && <p style={{ font: '400 13px/1.3 Inter,sans-serif', color: 'rgba(0,0,0,.6)', margin: '4px 0 0' }}>{helper}</p>}
    </div>
  );
}

function Badge({ color = 'contrast', children }) {
  const c = {
    primary:  { bg: 'rgba(2,113,206,.1)',   fg: '#0271CE' },
    success:  { bg: 'rgba(21,132,68,.1)',   fg: '#158444' },
    error:    { bg: 'rgba(216,62,56,.1)',   fg: '#CA150C' },
    warning:  { bg: 'rgba(224,120,46,.1)',  fg: '#E0782E' },
    contrast: { bg: 'rgba(28,52,84,.08)',   fg: '#192434' },
  }[color];
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 4,
      height: 22, padding: '0 10px', borderRadius: 11,
      background: c.bg, color: c.fg, font: '500 12px/1 Inter,sans-serif',
    }}>
      {color !== 'primary' && color !== 'contrast' && <span style={{ width: 6, height: 6, borderRadius: '50%', background: 'currentColor' }} />}
      {children}
    </span>
  );
}

const USER_COLORS = ['#195049','#1A4C61','#4A2253','#693C12','#612018','#1C375A','#3D4543'];
function Avatar({ name = '', size = 32, colorIndex }) {
  const idx = colorIndex ?? (name.charCodeAt(0) % USER_COLORS.length);
  const initials = name.split(' ').map(s => s[0]).join('').slice(0,2).toUpperCase();
  return (
    <div style={{
      width: size, height: size, borderRadius: '50%', background: USER_COLORS[idx],
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
      color: '#fff', font: `600 ${Math.round(size * 0.38)}px/1 Inter,sans-serif`, flex: 'none',
    }}>{initials}</div>
  );
}

function Checkbox({ checked, onChange, indeterminate }) {
  return (
    <span onClick={() => onChange?.(!checked)} style={{
      width: 16, height: 16, borderRadius: 4, cursor: 'pointer',
      border: `2px solid ${checked || indeterminate ? '#0271CE' : 'rgba(0,0,0,.3)'}`,
      background: checked || indeterminate ? '#0271CE' : '#fff',
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flex: 'none',
    }}>
      {checked && <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4l3 3 5-6" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>}
      {indeterminate && !checked && <span style={{ width: 8, height: 2, background: '#fff' }} />}
    </span>
  );
}

Object.assign(window, { Icon, Button, TextField, Badge, Avatar, Checkbox, USER_COLORS });
</script>

<script type="text/babel">
/* global React */

const SHELL_NAV = [
  { key: 'crew',      label: 'Crew Scheduling',  icon: 'calendar-user' },
  { key: 'assistant', label: 'Assistant',        icon: 'magic' },
  { key: 'callbacks', label: 'CallBacks',        icon: 'phone', active: true },
  { key: 'bidding',   label: 'Shift Bidding',    icon: 'check-square-o' },
  { key: 'notify',    label: 'Notify',           icon: 'envelope' },
  { key: 'timeoff',   label: 'Time Offs',        icon: 'calendar-clock' },
  { key: 'absence',   label: 'Absence',          icon: 'user-clock' },
  { key: 'bulletin',  label: 'Bulletin Board',   icon: 'clipboard-text' },
  { key: 'trade',     label: 'Trade Board',      icon: 'exchange' },
  { key: 'employees', label: 'Employees',        icon: 'users', badge: '221/500' },
  { key: 'forms',     label: 'Forms',            icon: 'file-text' },

  { key: 'timeclock', label: 'TimeClock',        icon: 'clock' },
  { key: 'logs',      label: 'Logs',             icon: 'list-ol' },

const OUTER_ICON_PATHS = {
  phone:           'M18.5 15.5l-2.3-.3a1 1 0 00-.9.28l-1.67 1.67a14 14 0 01-6.1-6.1l1.67-1.67a1 1 0 00.28-.9L9.18 6.2a1 1 0 00-1-.83H5.33A1 1 0 004.34 6.5 16 16 0 0018.83 20a1 1 0 001.12-.98v-2.84a1 1 0 00-.86-.97z',
  home:            'M4 10l8-6 8 6v10h-5v-7H9v7H4z',
  'calendar-user': 'M5 5h14v3H5zm0 5h14v10H5zm4 3h6v1H9zm-1 3h8v1H8z',
  magic:           'M14 3l1.5 3L19 7l-3 1.5L14 12l-1.5-3L9 7l3-.5L14 3zM5 13l1 2 2 1-2 1-1 2-1-2-2-1 2-1 1-2zm11 4l.8 1.7 1.7.8-1.7.8L16 22l-.8-1.7-1.7-.8 1.7-.8L16 17z',
  'check-square-o':'M4 4h16v16H4zm3 8l3 3 7-7',
  envelope:        'M3 6h18v12H3zm0 0l9 7 9-7',
  'calendar-clock':'M5 5h14v14H5zm0 4h14M8 3v4m8-4v4m-1 8a3 3 0 100-6 3 3 0 000 6zm0-3v-2m0 2l1.5 1',
  'user-clock':    'M9 11a3 3 0 100-6 3 3 0 000 6zm-6 9c0-3.3 2.7-6 6-6s6 2.7 6 6H3zm14-2a4 4 0 100-8 4 4 0 000 8zm0-2v-3l2 1',
  'clipboard-text':'M8 4h8v2H8zm-2 2h12v14H6zm3 5h6m-6 3h6m-6 3h4',
  exchange:        'M4 8h13l-3-3m3 3l-3 3M20 16H7l3-3m-3 3l3 3',
  users:           'M8 11a3 3 0 100-6 3 3 0 000 6zm8 0a3 3 0 100-6 3 3 0 000 6zm-8 2c-3 0-5 1.5-5 4v1h10v-1c0-2.5-2-4-5-4zm8 0c-.6 0-1.2.1-1.7.2 1 .9 1.7 2.2 1.7 3.8v1h5v-1c0-2.5-2-4-5-4z',
  'file-text':     'M6 3h9l4 4v14H6zm9 0v5h5M8 12h8m-8 3h8m-8 3h5',
  'bar-chart':     'M4 20V9h3v11zm6 0V4h3v16zm6 0v-7h3v7z',
  clock:           'M12 4a8 8 0 100 16 8 8 0 000-16zm0 4v4l3 2',
  'list-ol':       'M8 6h12M8 12h12M8 18h12M3 5h1v3M3 11h2l-2 2h2m-2 4h2v1H3v-1z',
};
const STROKE_ICONS = new Set(['check-square-o','envelope','calendar-clock','user-clock','clipboard-text','exchange','file-text','clock','list-ol']);

function OuterIcon({ name, size = 18, color }) {
  const d = OUTER_ICON_PATHS[name];
  if (!d) return <span style={{ width: size, height: size, display: 'inline-block' }} />;
  const isStroke = STROKE_ICONS.has(name);
  return (
    <svg width={size} height={size} viewBox="0 0 24 24"
      fill={isStroke ? 'none' : (color || 'currentColor')}
      stroke={isStroke ? (color || 'currentColor') : 'none'}
      strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" style={{ flex: 'none' }}>
      <path d={d} />
    </svg>
  );
}

const SUB_ICONS = {
  dashboard: <><circle cx="12" cy="12" r="9"/><path d="M12 12l5-3"/><path d="M12 12v6"/></>,
  forceHire: <><circle cx="10" cy="8" r="3"/><path d="M4 19c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M18 8v6m-3-3h6"/></>,
  scales:    <><path d="M12 4v16M5 7h14"/><path d="M5 7l-2 6a3 3 0 006 0zm14 0l-2 6a3 3 0 006 0z"/></>,
  lists:     <><circle cx="9" cy="8" r="3"/><path d="M3 19c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="7" r="2"/><path d="M15 17c0-2 1-4 4-4"/></>,
  history:   <><path d="M4 12a8 8 0 108-8 8 8 0 00-8 8z"/><path d="M4 6V3M4 6h3"/><path d="M12 8v4l3 2"/></>,
  rankings:  <><path d="M5 20V10M5 20l-2-2m2 2l2-2"/><path d="M10 5h11M10 10h8M10 15h6"/></>,
};

function SubIcon({ name, size = 16, color = 'currentColor' }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke={color} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" style={{ flex: 'none' }}>
      {SUB_ICONS[name]}
    </svg>
  );
}

function OuterSidebar() {
  return (
    <aside style={{ width: 66, background: '#fff', borderRight: '1px solid rgba(0,0,0,.08)', display: 'flex', flexDirection: 'column', alignItems: 'stretch', flex: 'none' }}>
      <div style={{ height: 56, display: 'flex', alignItems: 'center', justifyContent: 'center', borderBottom: '1px solid rgba(0,0,0,.06)' }}>
        <svg width="22" height="18" viewBox="0 0 24 20"><path d="M3 3h4l5 14L17 3h4" stroke="#1c2430" strokeWidth="2.4" fill="none" strokeLinejoin="round"/></svg>
      </div>
      <nav style={{ flex: 1, overflowY: 'auto', padding: '4px 0' }}>
        {SHELL_NAV.map(n => (
          <div key={n.key} title={n.label} style={{
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            height: 44, position: 'relative', cursor: 'pointer',
            color: n.active ? '#0271CE' : 'rgba(28,46,69,.72)',
            background: n.active ? 'rgba(2,113,206,.08)' : 'transparent',
            borderLeft: n.active ? '3px solid #0271CE' : '3px solid transparent',
          }}>
            <OuterIcon name={n.icon} size={20} />
            {n.badge && (
              <span style={{
                position: 'absolute', right: 6, top: 6,
                background: '#0271CE', color: '#fff', font: '600 9px/1 Inter,sans-serif',
                padding: '2px 4px', borderRadius: 6, letterSpacing: '.02em',
              }}>{n.badge}</span>
            )}
          </div>
        ))}
      </nav>
    </aside>
  );
}

function TopBar() {
  return (
    <header style={{ height: 48, flex: 'none', display: 'flex', alignItems: 'center', padding: '0 16px', background: '#fff', borderBottom: '1px solid rgba(0,0,0,.08)', gap: 14 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer' }}>
        <div style={{ width: 26, height: 26, borderRadius: '50%', background: '#D9DFE6' }} />
        <span style={{ font: '500 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)' }}>Virginia Pollock</span>
        <SubIcon name="history" size={12} color="rgba(0,0,0,.4)" />
      </div>
      <button style={{ height: 26, padding: '0 10px', borderRadius: 4, border: '1px solid rgba(0,0,0,.15)', background: '#fff', font: '500 12px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)', display: 'inline-flex', alignItems: 'center', gap: 4, cursor: 'pointer' }}>
        Quick + <svg width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>
      </button>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.6)" strokeWidth="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4m8-4v4"/></svg>
      <div style={{ position: 'relative', cursor: 'pointer' }}>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="rgba(0,0,0,.7)"><path d="M12 3a5 5 0 00-5 5v4l-2 3h14l-2-3V8a5 5 0 00-5-5zm0 18a2 2 0 002-2h-4a2 2 0 002 2z"/></svg>
        <span style={{ position: 'absolute', top: -4, right: -6, background: '#0271CE', color: '#fff', font: '600 10px/1 Inter,sans-serif', padding: '2px 5px', borderRadius: 8 }}>2</span>

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.6)" strokeWidth="1.6"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 115 0c0 1.5-2.5 2-2.5 4m0 3v.01"/></svg>
      <span style={{ height: 22, padding: '0 8px', borderRadius: 3, background: '#192434', color: '#fff', font: '600 11px/22px Inter,sans-serif', letterSpacing: '.04em' }}>admin</span>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '0 8px', height: 28, background: 'rgba(2,113,206,.08)', borderRadius: 3 }}>
        <div style={{ width: 20, height: 20, background: '#0271CE', color: '#fff', font: '600 9px/1 Inter,sans-serif', display: 'flex', alignItems: 'center', justifyContent: 'center', textAlign: 'center' }}>YOUR<br/>LOGO</div>
        <span style={{ font: '500 12px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)' }}>Michael_Fulton_Demo</span>
      </div>
      <div style={{ flex: 1 }} />
      <svg width="16" height="16" viewBox="0 0 24 24" fill="rgba(0,0,0,.5)"><path d="M14.7 6.3a4.5 4.5 0 11-6.3 6.3L3 18v3h3l5.4-5.4a4.5 4.5 0 006.3-6.3z"/></svg>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '0 10px', height: 30, background: '#fff', border: '1px solid rgba(0,0,0,.15)', borderRadius: 3, cursor: 'pointer' }}>
        <span style={{ font: '600 13px/1 Inter,sans-serif', color: '#0271CE' }}>#5380</span>
        <span style={{ font: '500 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)' }}>Michael_Fulton_Demo</span>

function SubSidebar({ active, onChange }) {
  const items = [
    { key: 'dashboard',  label: 'Dashboard',          icon: 'dashboard' },
    { key: 'forceHire',  label: 'Force Hire',         icon: 'forceHire' },
    { key: 'approaches', label: 'Approaches & Rules', icon: 'scales' },
    { key: 'lists',      label: 'Lists',              icon: 'lists' },
    { key: 'history',    label: 'History',            icon: 'history' },
    { key: 'rankings',   label: 'Rankings',           icon: 'rankings' },

function Sparkline({ data, color = '#0271CE', height = 40, width = 220 }) {
  const max = Math.max(...data), min = Math.min(...data);
  const range = max - min || 1;
  const stepX = width / (data.length - 1);
  const points = data.map((v, i) => `${i * stepX},${height - ((v - min) / range) * (height - 4) - 2}`).join(' ');
  const area = `M0,${height} L${points.split(' ').join(' L')} L${width},${height} Z`;
  return (
    <svg width={width} height={height} style={{ display: 'block' }}>
      <path d={area} fill={color} opacity=".08" />
      <polyline points={points} fill="none" stroke={color} strokeWidth="1.8" strokeLinejoin="round" strokeLinecap="round" />
    </svg>
  );
}

function Card({ title, subtitle, accent, children, pad = 16, actions }) {

          </div>
          {accent}
          {actions}
        </div>
      )}
      <div style={{ padding: pad, flex: 1 }}>{children}</div>
    </div>
  );
}

    </div>
  );
}

function FormInput({ value, onChange, placeholder, type = 'text' }) {
  return (
    <input type={type} value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder}
      style={{ width: '100%', height: 38, padding: '0 12px', border: '1px solid rgba(0,0,0,.18)', borderRadius: 6, font: '400 14px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)', outline: 'none', background: '#fff' }}
      onFocus={e => e.target.style.borderColor = '#7C3AED'}
      onBlur={e  => e.target.style.borderColor = 'rgba(0,0,0,.18)'}
    />
  );
}

// ── RuleBuilderView ───────────────────────────────────────────────────────────
function RuleBuilderView({ seed, onBack }) {
  const templateName  = seed?.template?.name || null;
  const initialPrompt = seed?.text || null;

  const [phase, setPhase]           = useState(templateName || initialPrompt ? 'chat' : 'intro');
  const [suggSetIdx, setSuggSetIdx] = useState(0);
  const [introInput, setIntroInput] = useState('');

  const flow    = FLOWS[templateName] || FLOWS.default;
  const firstAi = flow[0];
  const initMsgs = [
    ...(initialPrompt ? [{ role: 'user', text: initialPrompt }] : []),
    { role: 'ai', text: firstAi.text, chips: firstAi.chips },
  ];

  const [messages, setMessages] = useState(initMsgs);
  const [input, setInput]       = useState('');
  const [typing, setTyping]     = useState(false);
  const [saved, setSaved]       = useState(false);

  const guessType = (name) => {
    if (!name) return 'hours';
    const n = name.toLowerCase();
    if (n.includes('hour')) return 'hours';
    if (n.includes('turn')) return 'turns';
    if (n.includes('hire') || n.includes('seniority')) return 'hire_date';
    if (n.includes('rolodex')) return 'rolodex';
    return 'custom';
  };

  const [form, setForm] = useState({
    ruleName:            templateName || (initialPrompt ? initialPrompt.slice(0, 48) : 'New Rule'),
    ruleType:            guessType(templateName || initialPrompt),
    ruleAffects:         'all',
    selectedApproaches:  [],
    callbackStatuses:    ['Dispatched', 'Accepted'],
    callbackResponses:   ['Accept', 'Decline'],
    minShift:            '',
    maxShift:            '',
    lookBack:            '',
    forecast:            '',
  });

  const patchForm = (updates) => setForm(f => ({ ...f, ...updates }));

  const msgEndRef = useRef(null);
  useEffect(() => { msgEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, typing]);

  const userMsgs    = messages.filter(m => m.role === 'user');
  const nextFlowIdx = userMsgs.length;

  const parseAndPatch = (text) => {
    const lower = text.toLowerCase();
    const updates = {};
    const nameMatch = text.match(/(?:call it|name it|named?)\s+"?([^"]+)"?/i) || text.match(/"([^"]+)"/);
    if (nameMatch) updates.ruleName = nameMatch[1];
    if (lower.includes('hours')) updates.ruleType = 'hours';
    else if (lower.includes('turns')) updates.ruleType = 'turns';
    else if (lower.includes('hire date') || lower.includes('seniority')) updates.ruleType = 'hire_date';
    if (lower.includes('all approaches') || lower.includes('all approach')) { updates.ruleAffects = 'all'; }
    else if (['firefighter','captains','patrol','bay guard','battalion'].some(a => lower.includes(a))) { updates.ruleAffects = 'selected'; }
    const minM = text.match(/min(?:imum)?\s*(?:shift)?\s*(?:is|:)?\s*(\d+)/i);
    if (minM) updates.minShift = minM[1];
    const maxM = text.match(/max(?:imum)?\s*(?:shift)?\s*(?:is|:)?\s*(\d+)/i);
    if (maxM) updates.maxShift = maxM[1];
    const lbM = text.match(/look\s*back\s*(?:of|:)?\s*(\d+)/i);
    if (lbM) updates.lookBack = lbM[1];
    const fcM = text.match(/forecast\s*(?:of|:)?\s*(\d+)/i);
    if (fcM) updates.forecast = fcM[1];
    if (Object.keys(updates).length) patchForm(updates);
  };

  const send = (text) => {
    if (!text.trim() || typing) return;
    parseAndPatch(text);
    setMessages(m => [...m, { role: 'user', text }]);
    setInput('');
    setTyping(true);
    setTimeout(() => {
      const nextAi = flow[nextFlowIdx];
      if (nextAi) setMessages(m => [...m, { role: 'ai', text: nextAi.text, chips: nextAi.chips }]);
      setTyping(false);
    }, 800 + Math.random() * 400);
  };

  const startOver = () => { setPhase('intro'); setMessages(initMsgs); setInput(''); setTyping(false); setSuggSetIdx(0); setIntroInput(''); };

  const startChat = (tplName, promptText) => {
    const f = FLOWS[tplName] || FLOWS.default;
    const msgs = [
      ...(promptText ? [{ role: 'user', text: promptText }] : []),
      { role: 'ai', text: f[0].text, chips: f[0].chips },
    ];
    setMessages(msgs);
    if (tplName) patchForm({ ruleName: tplName, ruleType: guessType(tplName) });
    setInput('');
    setPhase('chat');
  };

  const toggleArr = (arr, item) => arr.includes(item) ? arr.filter(x => x !== item) : [...arr, item];

  if (saved) {
    return (
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', background: '#F4F5F7', gap: 16 }}>
        <div style={{ width: 68, height: 68, borderRadius: '50%', background: 'linear-gradient(135deg,#7C3AED,#5B21B6)', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 4px 20px rgba(124,58,237,.35)' }}>
          <svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M9 16l-4-4 1.4-1.4L9 13.2l8.6-8.6L19 6z"/></svg>
        </div>
        <div style={{ font: '600 22px/1.2 Inter,sans-serif', color: 'rgba(24,39,58,.94)' }}>Rule saved!</div>
        <div style={{ font: '400 15px/1.6 Inter,sans-serif', color: 'rgba(0,0,0,.6)', textAlign: 'center', maxWidth: 360 }}>
          <b>{form.ruleName}</b> is now active and will be applied to the next callback that matches your configuration.
        </div>
        <button onClick={onBack} style={{ marginTop: 8, height: 42, padding: '0 28px', background: 'linear-gradient(135deg,#7C3AED,#5B21B6)', color: '#fff', border: 'none', borderRadius: 8, font: '500 15px/1 Inter,sans-serif', cursor: 'pointer', boxShadow: '0 2px 10px rgba(124,58,237,.35)' }}>Back to Dashboard</button>
      </div>
    );
  }

  const sharedHeader = (
    <div style={{ padding: '20px 32px', background: 'linear-gradient(135deg, #7C3AED 0%, #6D28D9 50%, #5B21B6 100%)', position: 'relative', overflow: 'hidden', flex: 'none' }}>

        <div style={{ width: 1, height: 26, background: 'rgba(255,255,255,.25)' }} />
        <div style={{ width: 46, height: 46, borderRadius: 12, background: 'rgba(255,255,255,.18)', border: '1px solid rgba(255,255,255,.28)', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none', backdropFilter: 'blur(4px)' }}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>
        </div>
        <div>

  if (phase === 'intro') {

    return (
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', background: '#fff' }}>
        {sharedHeader}

        {/* Scrollable chat area */}
        <div style={{ flex: 1, overflowY: 'auto', padding: '36px 0', display: 'flex', flexDirection: 'column' }}>
          <div style={{ maxWidth: 700, width: '100%', margin: '0 auto', padding: '0 32px', display: 'flex', flexDirection: 'column', gap: 28 }}>

            {/* AI greeting */}
            <div style={{ display: 'flex', gap: 14, alignItems: 'flex-start' }}>
              <div style={{ width: 36, height: 36, borderRadius: '50%', background: 'linear-gradient(135deg, #A855F7, #EC4899, #F43F5E)', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none', boxShadow: '0 2px 8px rgba(168,85,247,.35)' }}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ font: '600 11px/1 Inter,sans-serif', color: 'rgba(0,0,0,.38)', marginBottom: 7, letterSpacing: '.05em' }}>AI ASSISTANT</div>

            {/* Suggestion cards — right aligned */}
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 10 }}>

              <button onClick={() => setSuggSetIdx(i => (i + 1) % SUGGESTION_SETS.length)}

                onMouseEnter={e => { e.currentTarget.style.background = 'rgba(124,58,237,.09)'; }}
                onMouseLeave={e => { e.currentTarget.style.background = 'rgba(124,58,237,.04)'; }}
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M3 12a9 9 0 109-9"/><path d="M3 3v6h6"/></svg>
                Show More Suggestions
              </button>
            </div>

          </div>
        </div>

        {/* Intro input */}
        <div style={{ padding: '16px 32px 24px', borderTop: '1px solid rgba(0,0,0,.07)', background: '#fff', flex: 'none' }}>
          <div style={{ maxWidth: 700, margin: '0 auto', position: 'relative' }}>
            <textarea value={introInput} onChange={e => setIntroInput(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (introInput.trim()) startChat(null, introInput.trim()); } }}
              placeholder="Or describe what kind of rule you want to build…"
              rows={2}
              style={{ width: '100%', padding: '14px 56px 14px 20px', border: '1.5px solid rgba(124,58,237,.25)', borderRadius: 28, outline: 'none', font: '400 15px/1.55 Inter,sans-serif', color: 'rgba(24,39,58,.94)', background: 'rgba(124,58,237,.02)', resize: 'none', display: 'block', transition: 'border-color .15s, background .15s', boxShadow: '0 2px 12px rgba(124,58,237,.08)' }}
              onFocus={e => { e.target.style.borderColor = '#7C3AED'; e.target.style.background = 'rgba(124,58,237,.04)'; }}
              onBlur={e  => { e.target.style.borderColor = 'rgba(124,58,237,.25)'; e.target.style.background = 'rgba(124,58,237,.02)'; }}
            />
            <button onClick={() => { if (introInput.trim()) startChat(null, introInput.trim()); }}
              style={{ position: 'absolute', right: 10, bottom: 10, width: 38, height: 38, borderRadius: '50%', background: introInput.trim() ? 'linear-gradient(135deg,#7C3AED,#5B21B6)' : 'rgba(0,0,0,.1)', border: 'none', cursor: introInput.trim() ? 'pointer' : 'default', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'background .15s', boxShadow: introInput.trim() ? '0 2px 8px rgba(124,58,237,.4)' : 'none' }}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round"><path d="M2 12l20-9-9 20-2-9z"/></svg>
            </button>
          </div>
        </div>
      </div>
    );

            <div key={i}>
              {m.role === 'ai' && (
                <div style={{ display: 'flex', gap: 14, alignItems: 'flex-start' }}>
                  <div style={{ width: 36, height: 36, borderRadius: '50%', background: 'linear-gradient(135deg, #A855F7, #EC4899, #F43F5E)', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none', boxShadow: '0 2px 8px rgba(168,85,247,.35)' }}>

              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M3 12a9 9 0 109-9"/><path d="M3 3v6h6"/></svg>

              <option value="hours">Hours Based</option>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              {[{ v: 'all', l: 'All Approaches' }, { v: 'selected', l: 'Selected Approaches' }].map(opt => (
                <label key={opt.v} style={{ display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer' }} onClick={() => patchForm({ ruleAffects: opt.v })}>
                  <span style={{ width: 16, height: 16, borderRadius: '50%', border: `2px solid ${form.ruleAffects === opt.v ? '#7C3AED' : 'rgba(0,0,0,.28)'}`, background: form.ruleAffects === opt.v ? '#7C3AED' : '#fff', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flex: 'none', transition: 'all .15s' }}>
                    {form.ruleAffects === opt.v && <span style={{ width: 5, height: 5, borderRadius: '50%', background: '#fff' }} />}
                  </span>
                  <span style={{ font: '400 14px/1 Inter,sans-serif', color: 'rgba(24,39,58,.87)' }}>{opt.l}</span>
                </label>
              ))}
              {form.ruleAffects === 'selected' && (
                <div style={{ marginLeft: 26, padding: '10px 14px', background: '#fff', borderRadius: 6, border: '1px solid rgba(0,0,0,.1)', display: 'flex', flexDirection: 'column', gap: 8 }}>
                  {ALL_APPROACHES_LIST.map(a => (
                    <label key={a} style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer' }}>
                      <Checkbox checked={form.selectedApproaches.includes(a)} onChange={v => patchForm({ selectedApproaches: v ? [...form.selectedApproaches, a] : form.selectedApproaches.filter(x => x !== a) })} />
                      <span style={{ font: '400 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.87)' }}>{a}</span>
                    </label>
                  ))}
                </div>
              )}
            </div>
          </FormGroup>

          <FormGroup label="Callback Statuses">
            <div style={{ padding: '10px 14px', background: '#fff', borderRadius: 6, border: '1px solid rgba(0,0,0,.1)', display: 'flex', flexDirection: 'column', gap: 8 }}>
              {ALL_STATUSES_LIST.map(s => (
                <label key={s} style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer' }}>
                  <Checkbox checked={form.callbackStatuses.includes(s)} onChange={() => patchForm({ callbackStatuses: toggleArr(form.callbackStatuses, s) })} />
                  <span style={{ font: '400 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.87)' }}>{s}</span>
                </label>
              ))}
            </div>
          </FormGroup>

          <FormGroup label="Callback Responses">
            <div style={{ padding: '10px 14px', background: '#fff', borderRadius: 6, border: '1px solid rgba(0,0,0,.1)', display: 'flex', flexDirection: 'column', gap: 8 }}>
              {ALL_RESPONSES_LIST.map(r => (
                <label key={r} style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer' }}>
                  <Checkbox checked={form.callbackResponses.includes(r)} onChange={() => patchForm({ callbackResponses: toggleArr(form.callbackResponses, r) })} />
                  <span style={{ font: '400 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.87)' }}>{r}</span>
                </label>
              ))}
            </div>
          </FormGroup>

          <FormGroup label="Shift Length">
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
              <div>
                <div style={{ font: '500 11px/1 Inter,sans-serif', color: 'rgba(0,0,0,.45)', marginBottom: 5, letterSpacing: '.03em' }}>Min (hours)</div>
                <FormInput value={form.minShift} onChange={v => patchForm({ minShift: v })} placeholder="e.g. 4" type="number" />
              </div>
              <div>
                <div style={{ font: '500 11px/1 Inter,sans-serif', color: 'rgba(0,0,0,.45)', marginBottom: 5, letterSpacing: '.03em' }}>Max (hours)</div>
                <FormInput value={form.maxShift} onChange={v => patchForm({ maxShift: v })} placeholder="e.g. 12" type="number" />
              </div>
            </div>
          </FormGroup>

          <FormGroup label="Ranking Reference Range">
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
              <div>
                <div style={{ font: '500 11px/1 Inter,sans-serif', color: 'rgba(0,0,0,.45)', marginBottom: 5, letterSpacing: '.03em' }}>Look back (days)</div>
                <FormInput value={form.lookBack} onChange={v => patchForm({ lookBack: v })} placeholder="e.g. 30" type="number" />
              </div>
              <div>
                <div style={{ font: '500 11px/1 Inter,sans-serif', color: 'rgba(0,0,0,.45)', marginBottom: 5, letterSpacing: '.03em' }}>Forecast (days)</div>
                <FormInput value={form.forecast} onChange={v => patchForm({ forecast: v })} placeholder="e.g. 7" type="number" />
              </div>
            </div>
          </FormGroup>

          <div style={{ height: 8 }} />
        </div>

        <div style={{ padding: '16px 24px', borderTop: '1px solid rgba(0,0,0,.08)', background: '#fff', display: 'flex', gap: 10, flex: 'none' }}>
          <button onClick={onBack} style={{ flex: 1, height: 40, background: '#fff', color: 'rgba(24,39,58,.8)', border: '1px solid rgba(0,0,0,.18)', borderRadius: 6, font: '500 14px/1 Inter,sans-serif', cursor: 'pointer' }}>Cancel</button>
          <button onClick={() => setSaved(true)} style={{ flex: 2, height: 40, background: 'linear-gradient(135deg,#7C3AED,#5B21B6)', color: '#fff', border: 'none', borderRadius: 6, font: '600 14px/1 Inter,sans-serif', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8, boxShadow: '0 2px 10px rgba(124,58,237,.4)' }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M9 16l-4-4 1.4-1.4L9 13.2l8.6-8.6L19 6z"/></svg>
            Save Rule
          </button>
        </div>
      </div>
    </div>
  );
}

// ── Dashboard sub-components ──────────────────────────────────────────────────
const selectStyle = {
  height: 28, padding: '0 22px 0 8px', border: '1px solid rgba(0,0,0,.15)', borderRadius: 4,
  font: '500 12px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)', background: '#fff',
};

function TweakRow({ label, children }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 10 }}>
      <span style={{ color: 'rgba(0,0,0,.7)' }}>{label}</span>
      {children}
    </div>
  );
}

function TweaksPanel({ open, tweaks, setTweaks }) {
  if (!open) return null;
  const set = (k, v) => setTweaks(t => ({ ...t, [k]: v }));
  return (
    <div style={{ position: 'fixed', right: 16, bottom: 16, width: 280, background: '#fff', borderRadius: 8, boxShadow: '0 8px 32px rgba(28,48,74,.26)', border: '1px solid rgba(0,0,0,.1)', padding: 16, zIndex: 9999, font: '400 13px/1.4 Inter,sans-serif' }}>
      <div style={{ font: '600 14px/1 Inter,sans-serif', marginBottom: 12, color: '#1c2430' }}>Tweaks</div>
      <TweakRow label="Quick actions layout">
        <select value={tweaks.quickActionsLayout} onChange={e => set('quickActionsLayout', e.target.value)} style={selectStyle}>
          <option value="three-column">3 columns</option>
          <option value="tabs">Tabs</option>
          <option value="stacked">Stacked</option>
        </select>
      </TweakRow>
      <TweakRow label="Active callbacks">
        <select value={tweaks.activeCallbacksPosition} onChange={e => set('activeCallbacksPosition', e.target.value)} style={selectStyle}>
          <option value="top">Show at top</option>
          <option value="hidden">Hide</option>
        </select>
      </TweakRow>
      <TweakRow label="AI Assistant">
        <label style={{ display: 'inline-flex', alignItems: 'center', gap: 6, cursor: 'pointer' }}>
          <input type="checkbox" checked={tweaks.showAIAssistant} onChange={e => set('showAIAssistant', e.target.checked)} />
          Visible
        </label>
      </TweakRow>
      <TweakRow label="Density">
        <select value={tweaks.layoutDensity} onChange={e => set('layoutDensity', e.target.value)} style={selectStyle}>
          <option value="comfortable">Comfortable</option>
          <option value="compact">Compact</option>
        </select>
      </TweakRow>
    </div>
  );
}

function TrendCard() {
  const data = [72,78,74,80,83,79,82,85,81,86,84,88,85,89,87,83,86,90,88,84,87,89,91,88,86,89,92,90,87,86];
  return (
    <Card title="Fill rate — last 30 days" subtitle="Daily percentage of positions filled"
      accent={<span style={{ font: '600 13px/1 Inter,sans-serif', color: '#158444' }}>▲ 4.2%</span>}>
      <div style={{ display: 'flex', alignItems: 'end', gap: 20 }}>
        <div style={{ font: '700 32px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)' }}>86%<span style={{ font: '500 14px/1 Inter,sans-serif', color: 'rgba(0,0,0,.55)', marginLeft: 6 }}>avg</span></div>
        <div style={{ flex: 1 }}>
          <Sparkline data={data} width={520} height={60} color="#0271CE" />
          <div style={{ display: 'flex', justifyContent: 'space-between', font: '400 11px/1 Inter,sans-serif', color: 'rgba(0,0,0,.55)', marginTop: 6 }}>
            <span>Mar 18</span><span>Apr 1</span><span>Apr 17</span>
          </div>
        </div>
      </div>
    </Card>
  );
}

function QuickActionTabs() {
  const [tab, setTab] = useState('forceHire');
  const tabs = [{ key: 'forceHire', label: 'Force Hire' }, { key: 'history', label: 'History' }, { key: 'rankings', label: 'Rankings' }];
  return (
    <div>
      <div style={{ display: 'flex', gap: 4, marginBottom: 12, borderBottom: '1px solid rgba(0,0,0,.08)' }}>
        {tabs.map(t => (
          <button key={t.key} onClick={() => setTab(t.key)} style={{ padding: '8px 14px', border: 'none', background: 'transparent', borderBottom: tab === t.key ? '2px solid #0271CE' : '2px solid transparent', font: `${tab === t.key ? 600 : 500} 14px/1.2 Inter,sans-serif`, color: tab === t.key ? '#0271CE' : 'rgba(24,39,58,.94)', cursor: 'pointer', marginBottom: -1 }}>{t.label}</button>
        ))}
      </div>
      {tab === 'forceHire' && <ForceHireCard />}
      {tab === 'history'   && <HistoryCard />}
      {tab === 'rankings'  && <RankingsCard />}
    </div>
  );
}

// ── App root ──────────────────────────────────────────────────────────────────
function App() {
  const [subNav, setSubNav]         = useState('dashboard');
  const [tweaks, setTweaks]         = useState(TWEAKS_DEFAULT);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const [building, setBuilding]     = useState(null); // null = dashboard, else { type, template?, text? }

  const pad = tweaks.layoutDensity === 'compact' ? 14 : 20;
  const gap = tweaks.layoutDensity === 'compact' ? 12 : 16;

  const quickActions = tweaks.quickActionsLayout === 'stacked' ? (
    <div style={{ display: 'flex', flexDirection: 'column', gap }}><ForceHireCard /><HistoryCard /><RankingsCard /></div>
  ) : tweaks.quickActionsLayout === 'tabs' ? <QuickActionTabs /> : (
    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap }}><ForceHireCard /><HistoryCard /><RankingsCard /></div>
  );

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden', background: '#F4F5F7' }}>
      <OuterSidebar />
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
        <TopBar />
        <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
          {!building && <SubSidebar active={subNav} onChange={setSubNav} />}
          <main style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

            {building ? (
              /* ── Full-screen rule builder ── */
              <RuleBuilderView seed={building} onBack={() => setBuilding(null)} />
            ) : (
              /* ── Dashboard ── */
              <>
                <PageHeader title="Dashboard">
                  <button onClick={() => setTweaksOpen(o => !o)} style={{ height: 34, padding: '0 12px', background: tweaksOpen ? 'rgba(2,113,206,.08)' : '#fff', color: '#0271CE', border: '1px solid rgba(2,113,206,.3)', borderRadius: 4, cursor: 'pointer', font: '500 13px/1 Inter,sans-serif', display: 'inline-flex', alignItems: 'center', gap: 6, marginRight: 8 }}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
                    Tweaks
                  </button>
                  <button style={{ height: 34, padding: '0 14px', background: '#2BA76C', color: '#fff', border: 'none', borderRadius: 4, cursor: 'pointer', font: '500 14px/1 Inter,sans-serif', display: 'inline-flex', alignItems: 'center', gap: 8, boxShadow: '0 1px 2px rgba(43,167,108,.3)' }}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="#fff"><path d="M18.5 15.5l-2.3-.3a1 1 0 00-.9.28l-1.67 1.67a14 14 0 01-6.1-6.1l1.67-1.67a1 1 0 00.28-.9L9.18 6.2a1 1 0 00-1-.83H5.33A1 1 0 004.34 6.5 16 16 0 0018.83 20a1 1 0 001.12-.98v-2.84a1 1 0 00-.86-.97z"/></svg>
                    New CallBack
                    <span style={{ width: 1, height: 14, background: 'rgba(255,255,255,.3)', margin: '0 2px' }}/>
                    <svg width="8" height="5" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="#fff" strokeWidth="1.6"/></svg>
                  </button>
                </PageHeader>

                <div style={{ flex: 1, overflowY: 'auto', padding: pad }}>
                  {tweaks.showAIAssistant && (
                    <div style={{ marginBottom: gap }}>
                      <AIAssistantCard onStart={seed => setBuilding(seed)} />
                    </div>
                  )}

                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap, marginBottom: gap }}>
                    <KpiTile label="Open callbacks"        value="7"       delta="+2 since yesterday"  tone="warn"    icon={<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18.5 15.5l-2.3-.3a1 1 0 00-.9.28l-1.67 1.67a14 14 0 01-6.1-6.1l1.67-1.67a1 1 0 00.28-.9L9.18 6.2a1 1 0 00-1-.83H5.33A1 1 0 004.34 6.5 16 16 0 0018.83 20a1 1 0 001.12-.98v-2.84a1 1 0 00-.86-.97z"/></svg>} />
                    <KpiTile label="Fill rate (30d)"       value="86%"     delta="▲ 4.2% vs last month" tone="up"      icon={<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M4 20V9h3v11zm6 0V4h3v16zm6 0v-7h3v7z"/></svg>} />
                    <KpiTile label="Positions filled today" value="12 / 15" delta="3 still open"        tone="neutral" icon={<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16l-4-4 1.4-1.4L9 13.2l8.6-8.6L19 6z"/></svg>} />
                    <KpiTile label="Avg. time to fill"     value="42m"     delta="▼ 8m this week"       tone="up"      icon={<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" strokeWidth="1.6"/><path d="M12 8v4l3 2" stroke="currentColor" strokeWidth="1.6" fill="none"/></svg>} />
                  </div>

                  {tweaks.activeCallbacksPosition === 'top' && (
                    <div style={{ display: 'grid', gridTemplateColumns: '2fr 1fr', gap, marginBottom: gap }}>
                      <div style={{ display: 'flex', flexDirection: 'column', gap }}>
                        <ActiveCallbacksCard callbacks={ACTIVE_CALLBACKS} />
                        <TrendCard />
                      </div>
                      <div style={{ display: 'flex', flexDirection: 'column', gap }}>
                        <ActivityFeed items={ACTIVITY} />
                      </div>
                    </div>
                  )}

                  <div style={{ marginBottom: 8, display: 'flex', alignItems: 'baseline', gap: 10 }}>
                    <h3 style={{ font: '600 16px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)', margin: 0 }}>Quick actions</h3>
                    <span style={{ font: '400 12px/1 Inter,sans-serif', color: 'rgba(0,0,0,.55)' }}>Force Hire · History · Rankings — drill in without leaving the dashboard</span>
                  </div>
                  {quickActions}
                  <div style={{ height: 24 }} />
                </div>
              </>
            )}

          </main>
        </div>
      </div>
      {!building && <TweaksPanel open={tweaksOpen} tweaks={tweaks} setTweaks={setTweaks} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
