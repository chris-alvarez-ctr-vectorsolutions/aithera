<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script
    type="module"
    src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.19.0/core.iife.js">
    </script>

    <!-- Vector Web Components JavaScript -->
    <!-- Important! This should always be imported as script -->
    <script
    src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.5.0/styles.js">
    </script>

    <!-- Our Standard font face - Open Sans -->
    <link
    rel="stylesheet"
    href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css"
    />

    <!-- Font Awesome 6 Icons (Default Icon Library) -->
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
</head>
<body>

    <!-- GitHub Pages share pill (auto-derives URL from path) — keep at the end of <body> -->
    <style>
      .gh-share-pill {
        position: fixed;
        bottom: 16px;
        right: 16px;
        z-index: 2147483000;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #18181b;
        color: #fff;
        padding: 9px 14px;
        border-radius: 999px;
        font: 600 12px/1 'SF Mono', Menlo, Consolas, monospace;
        border: none;
        cursor: pointer;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
        opacity: 0.85;
        transition: opacity 0.15s ease, transform 0.15s ease;
        text-decoration: none;
      }
      .gh-share-pill:hover { opacity: 1; transform: translateY(-2px); }
      .gh-share-pill.is-copied { background: #10b981; }
    </style>
    <button class="gh-share-pill" id="ghSharePill" type="button" aria-label="Copy live GitHub Pages URL">🔗 Share Link</button>
    <script>
      (function() {
        const pill = document.getElementById('ghSharePill');
        if (!pill) return;
        const m = window.location.pathname.match(/\/products\/([^/]+)\/(.+?)\/(?:index\.html)?$/i);
        const url = m
          ? `https://vectorlearning.github.io/ux-mockups/products/${m[1]}/${m[2]}/`
          : 'https://vectorlearning.github.io/ux-mockups/';
        pill.title = url;
        pill.addEventListener('click', () => {
          navigator.clipboard.writeText(url).then(() => {
            pill.innerHTML = '✓ Copied!';
            pill.classList.add('is-copied');
            setTimeout(() => {
              pill.innerHTML = '🔗 Share Link';
              pill.classList.remove('is-copied');
            }, 1500);
          });
        });
      })();
    </script>
</body>
</html>
