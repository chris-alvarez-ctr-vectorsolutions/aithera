<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CallBack — Rules Engine (Vector)</title>

<!-- Vector Web Components -->
<script type="module" src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.19.0/core.iife.js"></script>
<script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.5.0/styles.js"></script>
<link rel="stylesheet" href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css" />

<!-- Inter font — preserved from original CallBack design to keep the friendly feel -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<!-- Font Awesome 6 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
  :root {
    --primary: #0271CE;
    --header-text: rgba(24,39,58,.94);
    --body-text: rgba(0,0,0,.87);
    --secondary-text: rgba(0,0,0,.6);
    --error: #D83E38;
    --success: #158444;
    --warning: #E0782E;
    --bg: #F4F5F7;

    /* AI / Rules Engine purple palette */
    --ai-purple-1: #7C3AED;
    --ai-purple-2: #6D28D9;
    --ai-purple-3: #5B21B6;
    --ai-pink: #EC4899;
    --ai-rose: #F43F5E;
    --ai-violet: #A855F7;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }

  @keyframes cbPulse  { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes cbSlideIn { from { transform: translateY(6px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes fieldReveal { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ── App shell ──────────────────────────────────────────────────── */
  .app { display: flex; height: 100vh; overflow: hidden; background: var(--bg); }
  .main-col { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
  .content-row { flex: 1; display: flex; overflow: hidden; }
  .page { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

  /* ── Outer sidebar (66px) ───────────────────────────────────────── */
  .outer-sb {
    width: 66px; flex: none; background: #fff;
    border-right: 1px solid rgba(0,0,0,.08);
    display: flex; flex-direction: column;
  }
  .outer-sb-logo {
    height: 56px; display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid rgba(0,0,0,.06);
  }
  .outer-sb-nav { flex: 1; overflow-y: auto; padding: 4px 0; }
  .outer-sb-item {
    display: flex; align-items: center; justify-content: center;
    height: 44px; position: relative; cursor: pointer;
    color: rgba(28,46,69,.72);
    border-left: 3px solid transparent;
  }
  .outer-sb-item.active {
    color: var(--primary);
    background: rgba(2,113,206,.08);
    border-left-color: var(--primary);
  }
  .outer-sb-item:hover:not(.active) { background: rgba(0,0,0,.03); }
  .outer-sb-badge {
    position: absolute; right: 6px; top: 6px;
    background: var(--primary); color: #fff;
    font: 600 9px/1 'Inter', sans-serif;
    padding: 2px 4px; border-radius: 6px;
  }

  /* ── Top bar ────────────────────────────────────────────────────── */
  .topbar {
    height: 48px; flex: none; display: flex; align-items: center;
    padding: 0 16px; background: #fff;
    border-bottom: 1px solid rgba(0,0,0,.08); gap: 14px;
  }
  .topbar-user { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .topbar-avatar { width: 26px; height: 26px; border-radius: 50%; background: #D9DFE6; }
  .topbar-user-name { font: 500 13px/1 'Inter', sans-serif; color: var(--header-text); }
  .topbar-quick {
    height: 26px; padding: 0 10px; border-radius: 4px;
    border: 1px solid rgba(0,0,0,.15); background: #fff;
    font: 500 12px/1 'Inter', sans-serif; color: var(--header-text);
    display: inline-flex; align-items: center; gap: 4px; cursor: pointer;
  }
  .topbar-bell { position: relative; cursor: pointer; }
  .topbar-bell-badge {
    position: absolute; top: -4px; right: -6px;
    background: var(--primary); color: #fff;
    font: 600 10px/1 'Inter', sans-serif;
    padding: 2px 5px; border-radius: 8px;
  }
  .topbar-pill {
    height: 22px; padding: 0 8px; border-radius: 3px;
    background: #192434; color: #fff;
    font: 600 11px/22px 'Inter', sans-serif; letter-spacing: .04em;
  }
  .topbar-org {
    display: flex; align-items: center; gap: 6px;
    padding: 0 8px; height: 28px;
    background: rgba(2,113,206,.08); border-radius: 3px;
  }
  .topbar-org-logo {
    width: 20px; height: 20px; background: var(--primary); color: #fff;
    font: 600 9px/1 'Inter', sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center;
  }
  .topbar-spacer { flex: 1; }
  .topbar-search-pill {
    display: flex; align-items: center; gap: 8px;
    padding: 0 10px; height: 30px; background: #fff;
    border: 1px solid rgba(0,0,0,.15); border-radius: 3px; cursor: pointer;
  }
  .topbar-brand { display: flex; align-items: center; gap: 8px; }
  .topbar-brand-title { font: 700 13px/1 'Inter', sans-serif; color: #1c2430; }
  .topbar-brand-sub  { font: 500 9px/1.4 'Inter', sans-serif; color: rgba(0,0,0,.55); }

  /* ── Sub sidebar ────────────────────────────────────────────────── */
  .sub-sb {
    width: 220px; flex: none; background: #fff;
    border-right: 1px solid rgba(0,0,0,.08);
    display: flex; flex-direction: column;
  }
  .sub-sb-head {
    height: 48px; display: flex; align-items: center; gap: 10px;
    padding: 0 14px; border-bottom: 1px solid rgba(0,0,0,.08);
  }
  .sub-sb-title { font: 600 18px/1 'Inter', sans-serif; color: #1c2430; }
  .sub-sb-add {
    width: 28px; height: 28px; border-radius: 4px;
    background: #2BA76C; color: #fff; border: none; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .sub-sb-nav { padding: 6px 8px; }
  .sub-sb-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 8px 10px; margin-bottom: 2px; border: none; cursor: pointer;
    background: transparent; border-radius: 4px;
    color: var(--header-text);
    font: 500 14px/1 'Inter', sans-serif; text-align: left;
  }
  .sub-sb-item.active {
    background: rgba(2,113,206,.08); color: var(--primary);
    font-weight: 600;
  }
  .sub-sb-item:hover:not(.active) { background: rgba(0,0,0,.03); }

  /* ── Page header ────────────────────────────────────────────────── */
  .page-head {
    height: 56px; padding: 0 24px; background: #fff;
    border-bottom: 1px solid rgba(0,0,0,.08);
    display: flex; align-items: center; gap: 14px; flex: none;
  }
  .page-head h2 {
    font: 500 20px/1 'Inter', sans-serif;
    color: var(--header-text); margin: 0;
  }

  /* ── Hide all views by default ──────────────────────────────────── */
  .view { display: none; flex: 1; overflow: hidden; flex-direction: column; }
  .view.active { display: flex; }

  /* GitHub share pill */
  .gh-share-pill {
    position: fixed; bottom: 16px; right: 16px; z-index: 2147483000;
    display: inline-flex; align-items: center; gap: 8px;
    background: #18181b; color: #fff;
    padding: 9px 14px; border-radius: 999px;
    font: 600 12px/1 'SF Mono', Menlo, Consolas, monospace;
    border: none; cursor: pointer;
    box-shadow: 0 6px 20px rgba(0,0,0,.22);
    opacity: .85; transition: opacity .15s, transform .15s;
  }
  .gh-share-pill:hover { opacity: 1; transform: translateY(-2px); }
  .gh-share-pill.is-copied { background: #10b981; }
</style>

<style>
  /* ── Dashboard / AI Assistant card ──────────────────────────────── */
  .dash-wrap { flex: 1; overflow-y: auto; padding: 20px; }
  .dash-inner { max-width: 720px; margin: 0 auto; }

  .ai-card {
    background: #fff; border-radius: 8px;
    border: 1px solid rgba(0,0,0,.08);
    box-shadow: 0 1px 4px rgba(28,48,74,.07);
    overflow: hidden;
  }
  .ai-card-head {
    padding: 16px 22px;
    background: linear-gradient(90deg, #6D29B8, #4A2CC9 70%, #3D2CC9);
    color: #fff; display: flex; align-items: center; gap: 13px;
  }
  .ai-card-head-icon {
    width: 38px; height: 38px; border-radius: 10px; flex: none;
    background: rgba(255,255,255,.18);
    display: flex; align-items: center; justify-content: center;
  }
  .ai-card-head-title { font: 700 16px/1.2 'Inter', sans-serif; }
  .ai-card-head-sub { font: 400 12px/1 'Inter', sans-serif; opacity: .72; margin-top: 3px; }

  .ai-card-body { padding: 18px 20px 14px; display: flex; flex-direction: column; gap: 20px; }
  .ai-greeting { display: flex; gap: 10px; align-items: flex-start; }
  .ai-avatar-sm {
    width: 24px; height: 24px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, #E94F8A, #B240E0);
    display: flex; align-items: center; justify-content: center;
  }
  .ai-greeting-text {
    font: 400 13px/1.55 'Inter', sans-serif;
    color: rgba(24,39,58,.87); padding-top: 3px;
  }

  .ai-prompt-list { display: flex; flex-direction: column; gap: 7px; }
  .ai-prompt-label {
    font: 400 11px/1 'Inter', sans-serif; color: rgba(0,0,0,.45);
  }
  .ai-prompt-btn {
    display: flex; align-items: center; gap: 13px;
    padding: 11px 14px; background: #fff;
    border: 1px solid rgba(0,0,0,.09); border-radius: 9px;
    cursor: pointer; text-align: left;
    box-shadow: 0 1px 3px rgba(28,48,74,.04);
    transition: all .15s;
  }
  .ai-prompt-btn:hover {
    border-color: rgba(109,41,184,.4);
    box-shadow: 0 2px 10px rgba(109,41,184,.13);
  }
  .ai-prompt-icon {
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    background: rgba(109,41,184,.1); color: #7C3AED;
    display: flex; align-items: center; justify-content: center;
  }
  .ai-prompt-title {
    font: 600 13px/1.2 'Inter', sans-serif;
    color: rgba(24,39,58,.94); margin-bottom: 3px;
  }
  .ai-prompt-desc {
    font: 400 11px/1.4 'Inter', sans-serif; color: rgba(0,0,0,.5);
  }

  .ai-prompt-more {
    display: flex; align-items: center; gap: 13px;
    padding: 11px 14px; background: #fff;
    border: 1.5px dashed rgba(109,41,184,.35); border-radius: 9px;
    cursor: pointer; text-align: left; transition: all .15s;
  }
  .ai-prompt-more:hover {
    background: rgba(109,41,184,.04);
    border-color: rgba(109,41,184,.65);
  }
  .ai-prompt-more .ai-prompt-title { color: #6D28D9; }

  .ai-input-area {
    padding: 10px 16px 16px;
    border-top: 1px solid rgba(0,0,0,.06);
    background: rgba(109,41,184,.02);
  }
  .ai-input-wrap { position: relative; }
  .ai-input {
    width: 100%; height: 42px; padding: 0 46px 0 14px;
    border: 1px solid rgba(109,41,184,.2); border-radius: 8px;
    outline: none; background: #fff;
    font: 400 13px/1 'Inter', sans-serif; color: rgba(24,39,58,.94);
  }
  .ai-input:focus { border-color: #7C3AED; }
  .ai-input-send {
    position: absolute; right: 5px; top: 5px;
    width: 32px; height: 32px; border-radius: 6px;
    border: none; cursor: pointer;
    background: rgba(109,41,184,.25); color: #fff;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  .ai-input-send.active {
    background: linear-gradient(135deg, #6D29B8, #4A2CC9);
    cursor: pointer;
  }
  .ai-bring-row {
    margin-top: 10px; display: flex; align-items: center; gap: 7px;
  }
  .ai-bring-label {
    font: 400 11.5px/1 'Inter', sans-serif; color: rgba(0,0,0,.4);
  }
  .ai-bring-btn {
    display: inline-flex; align-items: center; gap: 5px;
    height: 24px; padding: 0 4px;
    background: transparent; border: none;
    font: 600 12px/1 'Inter', sans-serif; color: #6D28D9;
    cursor: pointer; border-radius: 4px;
  }
  .ai-bring-btn:hover { color: #5B21B6; text-decoration: underline; }
</style>

<style>
  /* ── Rule Builder ───────────────────────────────────────────────── */
  .rb-row { flex: 1; display: flex; overflow: hidden; }
  .rb-chat-col {
    flex: 1; display: flex; flex-direction: column;
    background: #fff; overflow: hidden; min-width: 0;
  }
  .rb-cfg-col {
    width: 460px; flex: none; display: flex; flex-direction: column;
    background: #F8F7FC; border-left: 1px solid rgba(0,0,0,.08); overflow: hidden;
  }
  .rb-cfg-col.collapsed { width: 40px; }
  .rb-cfg-collapsed-btn {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    background: none; border: none; cursor: pointer; padding: 16px 0;
    color: rgba(0,0,0,.45); height: 100%; width: 100%;
  }
  .rb-cfg-collapsed-btn span {
    writing-mode: vertical-rl; text-transform: uppercase;
    letter-spacing: .07em; font: 500 10px/1 'Inter', sans-serif;
  }

  .rb-hero {
    padding: 20px 32px; flex: none;
    background: linear-gradient(135deg, #7C3AED 0%, #6D28D9 50%, #5B21B6 100%);
    position: relative; overflow: hidden;
  }
  .rb-hero::before, .rb-hero::after {
    content: ''; position: absolute; border-radius: 50%; pointer-events: none;
  }
  .rb-hero::before {
    top: -30px; right: 60px; width: 110px; height: 110px;
    background: rgba(167,139,250,.22); filter: blur(28px);
  }
  .rb-hero::after {
    bottom: -18px; left: 100px; width: 85px; height: 85px;
    background: rgba(196,181,253,.16); filter: blur(22px);
  }
  .rb-hero-content {
    display: flex; align-items: center; gap: 16px; position: relative;
  }
  .rb-back-btn {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.25); border-radius: 6px;
    padding: 6px 12px; color: #fff;
    font: 500 13px/1 'Inter', sans-serif; cursor: pointer;
  }
  .rb-hero-divider { width: 1px; height: 26px; background: rgba(255,255,255,.25); }
  .rb-hero-icon {
    width: 46px; height: 46px; border-radius: 12px; flex: none;
    background: rgba(255,255,255,.18);
    border: 1px solid rgba(255,255,255,.28);
    display: flex; align-items: center; justify-content: center;
  }
  .rb-hero-title { font: 700 18px/1.2 'Inter', sans-serif; color: #fff; letter-spacing: -.01em; }
  .rb-hero-sub { font: 400 13px/1.3 'Inter', sans-serif; color: rgba(255,255,255,.72); margin-top: 2px; }

  .rb-thread {
    flex: 1; overflow-y: auto; padding: 36px 40px;
    display: flex; flex-direction: column; gap: 36px;
  }

  .msg-ai { display: flex; gap: 14px; align-items: flex-start; }
  .ai-avatar-lg {
    width: 36px; height: 36px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, #A855F7, #EC4899, #F43F5E);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(168,85,247,.35);
  }
  .msg-ai-body { flex: 1; min-width: 0; }
  .msg-ai-label {
    font: 600 11px/1 'Inter', sans-serif;
    color: rgba(0,0,0,.38); margin-bottom: 7px; letter-spacing: .05em;
  }
  .msg-ai-text {
    font: 400 15px/1.75 'Inter', sans-serif;
    color: rgba(24,39,58,.87); white-space: pre-wrap;
  }

  .msg-user-wrap {
    display: flex; flex-direction: column;
    align-items: flex-end; gap: 4px;
  }
  .msg-user {
    max-width: 68%; padding: 10px 18px;
    border-radius: 18px 18px 4px 18px;
    background: rgba(124,58,237,.09); color: #4C1D95;
    font: 500 14px/1.6 'Inter', sans-serif;
    border: 1.5px solid rgba(124,58,237,.22);
  }
  .msg-user-skipped {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 16px; border-radius: 20px;
    background: rgba(0,0,0,.04); border: 1px solid rgba(0,0,0,.1);
    color: rgba(0,0,0,.4); font: 400 13px/1 'Inter', sans-serif;
  }
  .msg-origin-wrap {
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  }
  .msg-origin-label {
    font: 500 11px/1 'Inter', sans-serif; color: rgba(0,0,0,.35);
    letter-spacing: .04em; text-transform: uppercase;
  }
  .msg-origin {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: linear-gradient(135deg, rgba(124,58,237,.08), rgba(99,102,241,.05));
    border: 1.5px solid rgba(124,58,237,.2);
    border-radius: 16px 16px 4px 16px;
  }
  .msg-origin-icon {
    width: 28px; height: 28px; border-radius: 7px; flex: none;
    background: linear-gradient(135deg, #7C3AED, #5B21B6);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(124,58,237,.3);
  }
  .msg-origin-label-text {
    font: 600 14px/1.3 'Inter', sans-serif; color: rgba(24,39,58,.9);
  }

  .chips-stack {
    display: flex; flex-direction: column;
    align-items: flex-start; gap: 7px; margin-top: 18px;
  }
  .chip {
    height: 36px; padding: 0 20px; border-radius: 20px;
    border: 1.5px solid rgba(124,58,237,.3);
    background: rgba(124,58,237,.05); color: #7C3AED;
    font: 500 14px/1 'Inter', sans-serif; cursor: pointer;
    transition: all .15s; white-space: nowrap;
  }
  .chip:hover {
    background: rgba(124,58,237,.13); border-color: #7C3AED;
  }
  .chip.dashed {
    border-style: dashed; border-color: rgba(124,58,237,.25);
    background: transparent; color: rgba(0,0,0,.42);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .chip.dashed:hover { border-color: rgba(124,58,237,.55); color: #7C3AED; background: transparent; }
  .chip-skip {
    height: 26px; padding: 0 2px;
    background: none; border: none; color: rgba(0,0,0,.32);
    font: 400 13px/1 'Inter', sans-serif; cursor: pointer;
    text-decoration: underline; text-decoration-style: dotted;
    text-underline-offset: 3px;
  }
  .chip-skip:hover { color: rgba(0,0,0,.58); }

  .chip-multi-row {
    display: flex; flex-wrap: wrap; gap: 7px; align-items: flex-start;
  }
  .chip.selected {
    background: rgba(124,58,237,.12); border-color: #7C3AED;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip-confirm {
    height: 34px; padding: 0 16px; border-radius: 8px;
    background: linear-gradient(135deg, #7C3AED, #5B21B6);
    color: #fff; border: none;
    font: 600 13px/1 'Inter', sans-serif; cursor: pointer;
    margin-top: 2px; white-space: nowrap;
  }

  .typing-bubble {
    padding: 14px 18px; border-radius: 4px 18px 18px 18px;
    background: rgba(0,0,0,.04);
    display: inline-flex; gap: 5px; align-items: center;
  }
  .typing-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #A855F7; opacity: .6;
    animation: cbPulse 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: .22s; }
  .typing-dot:nth-child(3) { animation-delay: .44s; }

  /* Chat input footer */
  .rb-input-footer {
    padding: 14px 24px 20px;
    border-top: 1px solid rgba(0,0,0,.07);
    background: #fff; flex: none;
  }
  .rb-input-wrap { position: relative; }
  .rb-input {
    width: 100%; padding: 11px 52px 11px 16px;
    border: 1px solid rgba(0,0,0,.15); border-radius: 12px;
    outline: none; font: 400 14px/1.55 'Inter', sans-serif;
    color: rgba(24,39,58,.94); background: rgba(124,58,237,.02);
    resize: none; display: block;
  }
  .rb-input:focus {
    border-color: #7C3AED; background: rgba(124,58,237,.04);
  }
  .rb-input-send {
    position: absolute; right: 10px; bottom: 10px;
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(0,0,0,.1); border: none;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s; cursor: default;
  }
  .rb-input-send.active {
    background: linear-gradient(135deg, #7C3AED, #5B21B6);
    cursor: pointer; box-shadow: 0 2px 8px rgba(124,58,237,.4);
  }
  .rb-start-over {
    display: inline-flex; align-items: center; gap: 5px;
    background: none; border: 1px solid rgba(0,0,0,.15);
    border-radius: 6px; padding: 5px 11px;
    color: rgba(0,0,0,.55);
    font: 500 12px/1 'Inter', sans-serif; cursor: pointer;
  }

  /* Right panel — rule config */
  .rb-cfg-head {
    background: #fff; border-bottom: 1px solid rgba(0,0,0,.08); flex: none;
    padding: 9px 14px 9px 16px; display: flex; align-items: center; gap: 8px;
  }
  .rb-cfg-head-title {
    font: 600 13px/1.3 'Inter', sans-serif; color: var(--header-text);

/* ===== Helpers ================================================ */
function escapeHTML(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function rankEmployees(form) {
  return [...MOCK_EMPLOYEES].sort((a, b) => {
    let primary = 0;
    if (form.ruleType === 'hours') primary = a.hours - b.hours;
    else if (form.ruleType === 'hire_date') primary = new Date(a.hireDate) - new Date(b.hireDate);
    else if (form.ruleType === 'rolodex') primary = 0;
    else primary = a.hours - b.hours;
    if (primary !== 0) return primary;
    if (form.tieBreaker === 'Seniority (hire date)') return new Date(a.hireDate) - new Date(b.hireDate);
    if (form.tieBreaker === 'Last shift worked') return a.lastShift.localeCompare(b.lastShift);
    if (form.tieBreaker === 'Last callback date') return a.lastCallback.localeCompare(b.lastCallback);
    return a.name.localeCompare(b.name);
  });
}

function guessType(name) {
  if (!name) return 'hours';
  const n = name.toLowerCase();
  if (n.includes('hour')) return 'hours';
  if (n.includes('turn')) return 'turns';
  if (n.includes('random') || n.includes('lottery')) return 'custom';
  if (n.includes('employee id') || n.includes('by id')) return 'custom';
  if (n.includes('hire') || n.includes('seniority')) return 'hire_date';
  if (n.includes('rolodex')) return 'rolodex';
  return 'custom';
}

function buildSummary(form) {
  const parts = [];
  const approachLabel = form.ruleAffects === 'all' ? 'all approaches' :
    form.selectedApproaches.length ? form.selectedApproaches.join(' & ') : 'selected approaches';
  const typeLabels = { hours: 'fewest overtime hours', turns: 'fewest turns', hire_date: 'most seniority (hire date)', rolodex: 'Rolodex rotation', custom: 'custom ranking' };
  parts.push(`Callback list for ${approachLabel} ranked by ${typeLabels[form.ruleType] || 'fewest overtime hours'}`);
  if (form.lookBack) parts[0] += ` over a ${form.lookBack}-day window`;
  if (form.tieBreaker) parts.push(`Ties broken by ${form.tieBreaker.toLowerCase()}`);
  if (form.declineAction) parts.push(`Declines: ${form.declineAction.toLowerCase()}`);
  if (form.minShift || form.maxShift) {
    const range = [form.minShift && `min ${form.minShift}h`, form.maxShift && `max ${form.maxShift}h`].filter(Boolean).join(', ');
    parts.push(`Shift filter: ${range}`);
  }
  return parts.join('. ') + '.';
}

  `;

  dash.querySelectorAll('[data-suggestion]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = +btn.dataset.suggestion;

      state.building = { template: { name: s.title } };
      renderApp();
    });
  });
  document.getElementById('dashMore').addEventListener('click', () => {
    state.dashPage = state.dashPage === 0 ? 1 : 0;
    renderDashboard();
  });
  const input = document.getElementById('dashInput');
  const send  = document.getElementById('dashSend');
  const update = () => send.classList.toggle('active', !!input.value.trim());
  input.addEventListener('input', update);
  const submit = () => {
    if (!input.value.trim()) return;
    state.building = { text: input.value.trim() };
    renderApp();
  };
  send.addEventListener('click', submit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
}

/* ===== Rule Builder ============================================ */
const builderState = {
  messages: [],
  input: '',
  typing: false,
  saved: false,
  cfgOpen: true,
  stickyOpen: true,
  customAnswer: false,
  chipSelections: new Set(),
  summaryTab: 'preview',
  suggSetIdx: 0,
  form: {},
  revealedFields: new Set(),
  flow: [],
  templateName: null,
};

function initBuilder(seed) {
  const templateName = seed?.template?.name || null;
  const initialPrompt = seed?.text || null;
  const flow = FLOWS[templateName] || FLOWS.default;
  const firstAi = flow[0];
  const introAiText = 'Hi! I can help you create custom rules for ranking employees in overtime and callback shifts.\nDescribe the rule you need, or choose a suggestion below!';

  builderState.flow = flow;
  builderState.templateName = templateName;
  builderState.saved = false;
  builderState.cfgOpen = true;
  builderState.stickyOpen = true;
  builderState.customAnswer = false;
  builderState.chipSelections = new Set();
  builderState.input = '';
  builderState.typing = false;
  builderState.summaryTab = 'preview';
  builderState.suggSetIdx = 0;

  if (templateName || initialPrompt) {
    builderState.messages = [
      { role: 'ai', text: introAiText },
      { role: 'origin', label: templateName || initialPrompt },
      { role: 'ai', text: firstAi.text, chips: firstAi.chips, multi: firstAi.multi },
    ];
  } else {
    builderState.messages = [
      { role: 'ai', text: introAiText },
      { role: 'suggestions' },
    ];
  }

  builderState.form = {
    ruleName:            templateName || (initialPrompt ? initialPrompt.slice(0, 48) : 'New Rule'),
    ruleType:            guessType(templateName || initialPrompt),
    ruleAffects:         'all',
    selectedApproaches:  [],
    minShift: '', maxShift: '', lookBack: '', forecast: '',
    tieBreaker: '', declineAction: '',
    penaltyPoints: '', declineScope: '', declineCooldown: '',
    turnsCounting: '', tieBreakerOrder: '', rolodexReset: '',
  };

  const revealed = new Set(['ruleName']);
  if (templateName || initialPrompt) revealed.add('ruleType');
  builderState.revealedFields = revealed;
}

function renderBuilder(seed) {
  if (!builderState.flow.length || builderState.__seedKey !== JSON.stringify(seed)) {
    initBuilder(seed);
    builderState.__seedKey = JSON.stringify(seed);
  }

  const view = document.querySelector('.view-builder');

  if (builderState.saved) {
    view.innerHTML = `
      <div class="saved-state">
        <div class="saved-icon">
          <i class="fa-solid fa-check" style="font-size:30px;color:#fff"></i>
        </div>
        <div class="saved-title">Rule saved!</div>
        <div class="saved-msg">
          <b>${escapeHTML(builderState.form.ruleName)}</b> is now active and will be applied to the next callback that matches your configuration.
        </div>
        <button class="saved-btn" id="savedBack">Back to Dashboard</button>
      </div>
    `;
    document.getElementById('savedBack').addEventListener('click', () => {
      state.building = null;
      renderApp();
    });
    return;
  }

  view.innerHTML = `
    <div class="rb-row">
      <div class="rb-chat-col">
        ${renderBuilderHero()}
        <div class="rb-thread" id="rbThread">
          ${renderMessages()}
          ${builderState.typing ? renderTyping() : ''}
        </div>
        ${renderBuilderInputFooter()}
      </div>
      ${builderState.cfgOpen ? renderCfgPanel() : renderCfgCollapsed()}
    </div>
  `;

  wireBuilder();
  scrollThread();
}

  }).join('');

function scrollThread() {
  const t = document.getElementById('rbThread');
  if (t) t.scrollTop = t.scrollHeight;
}

function patchForm(updates) {
  Object.assign(builderState.form, updates);
  Object.keys(updates).forEach(k => builderState.revealedFields.add(k));
}

function parseAndPatch(text) {
  const lower = text.toLowerCase();
  const updates = {};
  if (lower.includes('hours')) updates.ruleType = 'hours';
  else if (lower.includes('turns')) updates.ruleType = 'turns';
  else if (lower.includes('hire date') || lower.includes('seniority')) updates.ruleType = 'hire_date';
  else if (lower.includes('rolodex')) updates.ruleType = 'rolodex';

  const approachNames = ['Firefighter 2','Captains','Patrol Deputy','Bay Guard','Battalion Chief','FF3'];
  if (lower.includes('all approaches') || lower.includes('all approach') || lower.includes('all ranks')) {
    updates.ruleAffects = 'all';
  } else {
    const matched = approachNames.filter(a => lower.includes(a.toLowerCase()));
    if (matched.length > 0) {
      updates.ruleAffects = 'selected';
      updates.selectedApproaches = matched;
    }
  }
  const lbDaysM = text.match(/^(\d+)\s*days?$/i);
  if (lbDaysM) updates.lookBack = lbDaysM[1];

  if (lower.includes('seniority') || lower.includes('hire date')) updates.tieBreaker = 'Seniority (hire date)';
  else if (lower.includes('last shift')) updates.tieBreaker = 'Last shift worked';
  else if (lower.includes('last callback')) updates.tieBreaker = 'Last callback date';
  else if (lower.includes('alphabetical')) updates.tieBreaker = 'Alphabetical';

  if (lower.includes('back of list') || lower.includes('move to back') || lower.includes('back of the list')) updates.declineAction = 'Move to back of list';
  else if (lower.includes('stay in position') || lower.includes('stay at')) updates.declineAction = 'Stay in position';
  else if (lower.includes('penalty')) updates.declineAction = 'Penalty points';

  if (Object.keys(updates).length) patchForm(updates);
}

function userMsgsCount() {
  return builderState.messages.filter(m => m.role === 'user').length;
}

function sendChat(text, opts = {}) {
  const isSkip = !!opts.skip;
  if (!isSkip && !text.trim()) return;
  if (builderState.typing) return;
  if (!isSkip) parseAndPatch(text);
  builderState.messages = builderState.messages.filter(m => m.role !== 'suggestions');
  builderState.messages.push({ role: 'user', text, skipped: isSkip });
  builderState.input = '';
  builderState.customAnswer = false;
  builderState.typing = true;
  renderBuilder(state.building);

  setTimeout(() => {
    const flowOffset = builderState.templateName ? 1 : 0;
    const nextIdx = userMsgsCount() + flowOffset;
    const nextAi = builderState.flow[nextIdx];
    if (nextAi) {
      builderState.messages.push({ role: 'ai', text: nextAi.text, chips: nextAi.chips, multi: nextAi.multi });
    }
    builderState.typing = false;
    renderBuilder(state.building);
  }, 800 + Math.random() * 400);
}

function wireBuilder() {
  const view = document.querySelector('.view-builder');

  const back = view.querySelector('#rbBack');
  if (back) back.addEventListener('click', () => {
    state.building = null;
    renderApp();
  });

  // Chip buttons (single-select)
  view.querySelectorAll('[data-chip]').forEach(btn => {
    btn.addEventListener('click', () => sendChat(btn.dataset.chip));
  });
  // Chip buttons (multi-select)
  view.querySelectorAll('[data-chip-multi]').forEach(btn => {
    btn.addEventListener('click', () => {
      const c = btn.dataset.chipMulti;
      const sels = builderState.chipSelections;
      if (c === 'All approaches' || c === 'All ranks') {
        sels.has(c) ? sels.clear() : (sels.clear(), sels.add(c));
      } else {
        sels.delete('All approaches');
        sels.delete('All ranks');
        sels.has(c) ? sels.delete(c) : sels.add(c);
      }
      renderBuilder(state.building);
    });
  });
  const confirm = view.querySelector('#chipConfirm');
  if (confirm) confirm.addEventListener('click', () => {
    const v = Array.from(builderState.chipSelections).join(', ');
    builderState.chipSelections = new Set();
    sendChat(v);
  });
  const skip = view.querySelector('#chipSkip');
  if (skip) skip.addEventListener('click', () => sendChat('', { skip: true }));

  const custom = view.querySelector('#customAnswerBtn');
  if (custom) custom.addEventListener('click', () => {
    builderState.customAnswer = true;
    renderBuilder(state.building);
    setTimeout(() => view.querySelector('#rbInput')?.focus(), 50);
  });

  const customSkip = view.querySelector('#customSkip');
  if (customSkip) customSkip.addEventListener('click', () => sendChat('', { skip: true }));
  const customBack = view.querySelector('#customBack');
  if (customBack) customBack.addEventListener('click', () => {
    builderState.customAnswer = false;
    renderBuilder(state.building);
  });

  const startOver = view.querySelector('#rbStartOver');
  if (startOver) startOver.addEventListener('click', () => {
    initBuilder({});
    builderState.__seedKey = JSON.stringify({});
    state.building = {};
    renderBuilder(state.building);
  });

  // Suggestions
  view.querySelectorAll('[data-suggest-name]').forEach(btn => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.suggestName;
      state.building = { template: { name } };
      builderState.__seedKey = null;
      renderBuilder(state.building);
    });
  });
  const more = view.querySelector('#moreSuggestions');
  if (more) more.addEventListener('click', () => {
    builderState.suggSetIdx = (builderState.suggSetIdx + 1) % SUGGESTION_SETS.length;
    renderBuilder(state.building);
  });

  // Input
  const input = view.querySelector('#rbInput');
  const send  = view.querySelector('#rbSend');
  if (input) {
    input.addEventListener('input', e => {
      builderState.input = e.target.value;
      send.classList.toggle('active', !!e.target.value.trim());
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendChat(builderState.input);
      }
    });
  }
  if (send) send.addEventListener('click', () => sendChat(builderState.input));

  // Config panel
  const cfgCollapse = view.querySelector('#rbCfgCollapse');
  if (cfgCollapse) cfgCollapse.addEventListener('click', () => {
    builderState.cfgOpen = false;
    renderBuilder(state.building);
  });
  const cfgExpand = view.querySelector('#rbCfgExpand');
  if (cfgExpand) cfgExpand.addEventListener('click', () => {
    builderState.cfgOpen = true;
    renderBuilder(state.building);
  });

  // Tabs in summary card
  view.querySelectorAll('[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      builderState.summaryTab = btn.dataset.tab;
      renderBuilder(state.building);
    });
  });

  // Form inputs
  const ruleName = view.querySelector('#frmRuleName');
  if (ruleName) ruleName.addEventListener('value-changed', e => {
    builderState.form.ruleName = e.detail.value;
  });
  const ruleType = view.querySelector('#frmRuleType');
  if (ruleType) ruleType.addEventListener('change', e => {
    patchForm({ ruleType: e.target.value });
    renderBuilder(state.building);
  });
  const tieBreaker = view.querySelector('#frmTieBreaker');
  if (tieBreaker) tieBreaker.addEventListener('change', e => {
    patchForm({ tieBreaker: e.target.value });
    renderBuilder(state.building);
  });
  const declineAction = view.querySelector('#frmDeclineAction');
  if (declineAction) declineAction.addEventListener('change', e => {
    patchForm({ declineAction: e.target.value });
    renderBuilder(state.building);
  });
  const ruleAffects = view.querySelector('#frmRuleAffects');
  if (ruleAffects) ruleAffects.addEventListener('value-changed', e => {
    patchForm({ ruleAffects: e.detail.value });
    renderBuilder(state.building);
  });
  view.querySelectorAll('[data-add-approach]').forEach(btn => {
    btn.addEventListener('click', () => {
      const list = [...builderState.form.selectedApproaches, btn.dataset.addApproach];
      patchForm({ selectedApproaches: list });
      renderBuilder(state.building);
    });
  });
  view.querySelectorAll('[data-remove-approach]').forEach(btn => {
    btn.addEventListener('click', () => {
      const list = builderState.form.selectedApproaches.filter(x => x !== btn.dataset.removeApproach);
      patchForm({ selectedApproaches: list });
      renderBuilder(state.building);
    });
  });
  ['MinShift', 'MaxShift', 'LookBack', 'Forecast'].forEach(name => {
    const el = view.querySelector(`#frm${name}`);
    if (el) el.addEventListener('value-changed', e => {
      const key = name.charAt(0).toLowerCase() + name.slice(1);
      builderState.form[key] = e.detail.value;
    });
  });

  // Actions
  const cancel = view.querySelector('#rbCancel');
  if (cancel) cancel.addEventListener('click', () => {
    state.building = null;
    renderApp();
  });
  const save = view.querySelector('#rbSave');
  if (save) save.addEventListener('click', () => {
    builderState.saved = true;
    renderBuilder(state.building);
  });
}

      <div style="display:flex;flex-direction:column">
        <span class="hist-filter-label">Select approach</span>
        <vaadin-combo-box theme="outlined" id="histApproach" value="${escapeHTML(historyState.approach)}" style="min-width:160px"></vaadin-combo-box>
      </div>
      <div style="display:flex;flex-direction:column">
        <span class="hist-filter-label">Select rule</span>
        <vaadin-combo-box theme="outlined" id="histRule" value="${escapeHTML(historyState.rule)}" style="min-width:200px"></vaadin-combo-box>
      </div>
      <button class="hist-go" id="histGo">Go</button>
    </div>

    <div class="hist-stats">
      <div class="stat-card">
        <div style="flex:1;min-width:0">
          <div class="stat-label">Grand Total</div>
          <div class="stat-value">${totalHours.toLocaleString()}</div>
          <div class="stat-unit">hours</div>
        </div>
        <div class="stat-icon" style="background:#0271CE18">
          <i class="fa-solid fa-clock" style="font-size:18px;color:#0271CE"></i>
        </div>
      </div>
      <div class="stat-card">
        <div style="flex:1;min-width:0">
          <div class="stat-label">Callbacks</div>
          <div class="stat-value">${callbackHours.toLocaleString()}</div>
          <div class="stat-unit">hours</div>
        </div>
        <div class="stat-icon" style="background:#E0782E18">
          <i class="fa-solid fa-phone" style="font-size:18px;color:#E0782E"></i>
        </div>
      </div>
      <div class="stat-card">
        <div style="flex:1;min-width:0">
          <div class="stat-label">Scheduler Hours</div>
          <div class="stat-value">${schedulerHours.toLocaleString()}</div>
          <div class="stat-unit">hours</div>
        </div>
        <div class="stat-icon" style="background:#2BA76C18">
          <i class="fa-solid fa-user-clock" style="font-size:18px;color:#2BA76C"></i>
        </div>
      </div>
    </div>

    <div class="hist-table-card">
      <div class="hist-toolbar">
        <span class="hist-toolbar-title">Shift Records</span>
        <span class="hist-toolbar-count">${filteredRows.length}</span>
        <div class="hist-divider"></div>
        <span style="font:400 12px/1 'Inter',sans-serif;color:rgba(0,0,0,.4)">Showing:</span>
        <span class="hist-show-chip">${escapeHTML(historyState.applied.employee)}</span>
        <span class="hist-show-chip">${escapeHTML(historyState.applied.approach)}</span>
        <span class="hist-show-chip">${escapeHTML(historyState.applied.rule)}</span>
        <div class="hist-divider"></div>
        <div style="display:flex;align-items:center;gap:5px">
          <i class="fa-regular fa-calendar" style="font-size:10px;color:rgba(0,0,0,.35)"></i>
          <span style="font:400 12px/1 'Inter',sans-serif;color:rgba(0,0,0,.45)">
            Ranking period: <strong style="color:rgba(24,39,58,.7);font-weight:500">1/1/2026 – 1/1/2027</strong>
          </span>
        </div>
        <div style="flex:1"></div>
        <vaadin-text-field theme="outlined" id="histSearch" placeholder="Search assignments…" value="${escapeHTML(historyState.search)}" style="width:200px">
          <i class="fa-solid fa-magnifying-glass" slot="prefix" style="font-size:12px;color:rgba(0,0,0,.35)"></i>
        </vaadin-text-field>
      </div>
      <div style="overflow-x:auto">
        <table class="hist-table">
          <thead>
            <tr>
              <th>ID</th><th>Assignment</th><th>Callback</th><th>Start</th><th>End</th><th>Work Type</th><th>Hours</th>
            </tr>
          </thead>
          <tbody>
            ${filteredRows.map(row => `
              <tr>
                <td class="hist-id">${row.id}</td>
                <td class="hist-assignment">${escapeHTML(row.assignment)}</td>
                <td>${row.callback || '<span style="color:rgba(0,0,0,.2)">—</span>'}</td>
                <td>${escapeHTML(row.start)}</td>
                <td>${escapeHTML(row.end)}</td>
                <td><span class="worktype-pill">${escapeHTML(row.workType)}</span></td>
                <td><span class="hours-pill">${row.hours}h</span></td>
              </tr>
            `).join('')}
          </tbody>
          <tfoot>
            <tr style="background:#F4F5F7">
              <td colSpan="6" style="padding:10px 16px;font:600 12px/1 'Inter',sans-serif;color:rgba(0,0,0,.55);border-top:2px solid rgba(0,0,0,.08)">Total</td>
              <td style="border-top:2px solid rgba(0,0,0,.08)"><span class="hours-pill total">${filteredTotal}h</span></td>
            </tr>
          </tfoot>
        </table>
      </div>
    </div>
  `;

  const empCombo = wrap.querySelector('#histEmployee');
  const appCombo = wrap.querySelector('#histApproach');
  const ruleCombo = wrap.querySelector('#histRule');
  if (empCombo) {
    empCombo.items = EMPLOYEES;
    empCombo.addEventListener('value-changed', e => { historyState.employee = e.detail.value; });
  }
  if (appCombo) {
    appCombo.items = APPROACHES_DATA.map(a => a.name);
    appCombo.addEventListener('value-changed', e => { historyState.approach = e.detail.value; });
  }
  if (ruleCombo) {
    ruleCombo.items = RULES_DATA.map(r => r.name);
    ruleCombo.addEventListener('value-changed', e => { historyState.rule = e.detail.value; });
  }

  const go = wrap.querySelector('#histGo');
  if (go) go.addEventListener('click', () => {
    historyState.applied = { employee: historyState.employee, approach: historyState.approach, rule: historyState.rule };
    renderHistory();
  });

  const search = wrap.querySelector('#histSearch');
  if (search) search.addEventListener('value-changed', e => {
    historyState.search = e.detail.value;
    renderHistory();
  });
}

renderApp();
</script>
</body>
</html>
