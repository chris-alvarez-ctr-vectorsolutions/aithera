<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Tracker Event — Sidebar</title>

<!-- Vector Web Components -->
<script type="module" src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.19.0/core.iife.js"></script>
<script src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.5.0/styles.js"></script>
<link rel="stylesheet" href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css" />

<!-- Font Awesome 6 PRO (self-hosted) -->
<link rel="stylesheet" href="../../../../assets/fontawesome/css/all.min.css" />

<style>
  :root {
    /* Training-Tracker / Scheduling event accent (product purple #7c3aed family) */
    --tt-purple:      #6b3fb5;
    --tt-purple-band: #f2ecfb;
    --tt-purple-bar:  #6d54c8;
    --ot-purple:      #7c3aed;
    --tt-orange:      #ef6c1a;

    --ink:       #2f3033;
    --ink-soft:  #4a4d52;
    --muted:     #6b7075;
    --line:      #e2e4e8;
    --pill-line: #cdd0d6;
    --page-bg:   #eceef1;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page-bg);
    font-family: 'Open Sans', 'Segoe UI', Arial, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center;
    padding: 40px 16px;
  }

  /* ── Events sidebar panel (one column of the Scheduling day view) ── */
  .panel {
    width: 300px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 6px;
    box-shadow: 0 2px 10px rgba(20,30,50,.08);
    overflow: hidden;
    align-self: flex-start;
  }

  /* vaadin-details drive the collapsible "Events" and event sections. */
  vaadin-details { margin: 0; }
  vaadin-details::part(summary) { padding: 12px 14px; }
  vaadin-details::part(content) { padding: 0; }

  /* Top-level "Events" section (toggle on the left, matching the day view) */
  .events > vaadin-details-summary { font-size: 15px; font-weight: 700; color: var(--ink); }

  /* Purple "Training Tracker Event" band (was "TargetSolutions events") */
  .tt-band {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 14px;
    background: var(--tt-purple-band);
    color: var(--tt-purple);
    font-size: 14px; font-weight: 700;
    border-top: 1px solid var(--line);
  }
  .tt-band .angles { font-size: 13px; }

  /* The event, with its thick purple left accent bar. Its collapse chevron
     sits on the RIGHT (row-reverse), matching the production event card. */
  .event { border-left: 4px solid var(--tt-purple-bar); position: relative; }
  .event::part(summary) { padding: 12px 34px 8px 14px; }             /* right padding leaves room for the chevron */
  .event > vaadin-details-summary::part(toggle) { display: none; }   /* hide native left chevron; use a right-aligned one instead */
  .event > vaadin-details-summary { font-size: 15px; font-weight: 700; color: var(--ink); display: flex; align-items: center; }
  .event > vaadin-details-summary .lock { color: var(--ink-soft); font-size: 13px; margin-right: 8px; }
  /* Collapse chevron pinned to the event's top-right (matches production) */
  .event > .ev-chev { position: absolute; right: 14px; top: 15px; color: var(--muted); font-size: 13px; pointer-events: none; }
  .event::part(content) { padding: 0 14px 14px; }

  .event-time { font-size: 13px; color: var(--ink-soft); }
  .event-ot   { margin-top: 4px; font-size: 13px; font-weight: 600; color: var(--ot-purple); }

  /* Thin divider hairline */
  .rule { height: 1px; background: var(--line); margin: 11px 0; }

  .subtype { font-size: 13px; margin-bottom: 10px; }
  .subtype .k { color: var(--muted); }
  .subtype .v { color: var(--ink); font-weight: 600; }

  /* Roster — one bordered row per attendee */
  .roster { display: flex; flex-direction: column; gap: 8px; }
  .person {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 11px;
    border: 1px solid var(--pill-line);
    border-radius: 5px;
    font-size: 13px; color: var(--ink); background: #fff;
  }
  /* Orange badge = attendee sourced from Training Tracker */
  .tt-badge {
    flex: 0 0 auto; width: 18px; height: 18px; border-radius: 4px;
    background: var(--tt-orange); color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 9px;
  }
</style>
</head>
<body>

<!-- ============================================================
     TRAINING TRACKER EVENT — Scheduling day-view sidebar column.
     Built from Vector components (vaadin-details collapsibles) +
     theme tokens. Only content change vs. today: the source band
     reads "Training Tracker Event" (was "TargetSolutions events").
     ============================================================ -->
<div class="panel">
  <vaadin-details class="events" opened>
    <vaadin-details-summary slot="summary">Events</vaadin-details-summary>

    <!-- Renamed source band -->
    <div class="tt-band">
      <span>Training Tracker Event</span>
      <i class="fa-solid fa-angles-up angles"></i>
    </div>

    <!-- The scheduled event -->
    <vaadin-details class="event" opened>
      <vaadin-details-summary slot="summary">
        <i class="fa-solid fa-lock lock"></i>SWAT Training
      </vaadin-details-summary>
      <i class="fa-solid fa-chevron-up ev-chev"></i>

      <div class="event-time">8am - 4pm (8 hours)</div>
      <div class="event-ot">Overtime [205]</div>

      <div class="rule"></div>

      <div class="subtype"><span class="k">Sub Type:</span> <span class="v">Training</span></div>

      <div class="roster">
        <div class="person"><span>Michael Esse</span></div>
        <div class="person"><span>Mike Hangen</span></div>
        <div class="person"><span>Leslye Harrell</span></div>
        <div class="person"><span>Jimmy Hernandez</span></div>
        <div class="person"><span>Alvin Ivy</span></div>
        <div class="person"><span class="tt-badge"><i class="fa-solid fa-graduation-cap"></i></span><span>Mary Olsen</span></div>
        <div class="person"><span class="tt-badge"><i class="fa-solid fa-graduation-cap"></i></span><span>Jaime Pierson</span></div>
        <div class="person"><span class="tt-badge"><i class="fa-solid fa-graduation-cap"></i></span><span>Victoria Ziegler</span></div>
      </div>
    </vaadin-details>
  </vaadin-details>
</div>


<!-- ── Design Toolbox: Flow Map scaffold ────────────────────────────────── -->
<script>
  function applyFlowState(id, opts) {
    opts = opts || {};
    switch (id) {
      case 'sidebar':
        break;              /* single-screen mock */
      default:
        break;
    }
    if (!opts.instant) window.scrollTo(0, 0);
  }
  window.applyFlowState = applyFlowState;

  function bootFromHash() {
    var m = (location.hash || '').match(/fm=([\w-]+)/);
    if (m) { try { applyFlowState(decodeURIComponent(m[1]), { instant: true }); } catch (e) {} }
  }
  bootFromHash();
  window.addEventListener('hashchange', bootFromHash);

  window.TOOLBOX_CONFIG = {
    flowMap: {
      title: 'Frontline Integration — Flow Map',
      applyState: 'applyFlowState',
      canvas: { w: 1240, h: 440 },
      flows: [
        { id: 'main', name: 'Main Flow', pill: 'A', color: '#c9b8f0',
          lane: { x: 20, y: 20, w: 1200, h: 400 }, labelXY: { x: 40, y: 40 } }
      ],
      nodes: [
        { id: 'sidebar', flow: 'main', entry: true, x: 60, y: 170,
          step: 'Day view', name: 'Training Tracker Event', state: 'sidebar',
          desc: 'Scheduling day-view sidebar. Source band renamed "TargetSolutions events" → "Training Tracker Event". Attendees synced from Training Tracker carry an orange badge.' }
      ],
      edges: []
    }
  };
</script>

<!-- Design Toolbox: pin-and-comment review widget + flow map (comments ENABLED). -->
<script src="../../../../designtoolbox/toolbox.js"></script>
</body>
</html>
