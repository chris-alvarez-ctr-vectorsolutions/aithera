function RuleBuilderView({ seed, onBack, onSaved }) {
  const templateName    = seed?.template?.name || null;
  const initialPrompt   = seed?.text || null;
  const seededApproaches= seed?.approaches || null;
  const seededAllAppr   = !!seed?.allApproaches;
  const existingRule    = seed?.existingRule || null;
  const hasSeededGroups = !!(seededApproaches && seededApproaches.length > 0);

  const [suggSetIdx, setSuggSetIdx] = useState(0);

  const flow    = FLOWS[activeTplName] || FLOWS.default;
  const firstAi = flow[0];
  const introAiText = 'Hi! I can help you create custom rules for ranking employees in overtime and callback shifts.\nDescribe the rule you need, or choose a suggestion below!';
  const originLabel = templateName || initialPrompt || null;

  // When entering with groups pre-selected (from the dashboard / banner picker), we skip
  // the first AI question (which always asks "Which group does this apply to?") and jump
  // straight to flow[1]. The pre-selected groups appear as an `origin`-style chip banner.
  const approachOriginText = hasSeededGroups
    ? (seededAllAppr ? 'All approaches' : seededApproaches.join(', '))
    : null;

  // When opening an existing rule, lead with a single summary message and a
  // mix of exploratory + change chips. The orange "Editing: X" banner and
  // "Welcome back" line are intentionally omitted — the user knows which rule
  // they clicked into. The full configuration stays hidden behind the panel
  // collapse button until the user picks "Let's change something".
  const existingTop  = existingRule ? rankEmployees(existingRule.config)[0]?.name : null;
  const existingThird = existingRule ? rankEmployees(existingRule.config)[2]?.name : null;
  const editExploratoryChips = existingRule ? [
    existingTop  ? `Why is ${existingTop} first?`              : 'Why is the top employee first?',
    existingTop  ? `How many hours does ${existingTop} have?` : 'How many hours does the top employee have?',
    existingThird ? `Where is ${existingThird} in the ranking?` : 'Where is a specific person in the ranking?',
    EDIT_CHANGE_TRIGGER,
    EDIT_SAVE_CHIP,
  ] : [];
  const initMsgs = existingRule
    ? [
        { role: 'ai', text: `This is the rule that you pulled up.\n\n${summarizeRule(existingRule)}\n\nAsk a quick question about it, or jump in to change something.`, chips: editExploratoryChips },
      ]
    : (templateName || initialPrompt) ? [
        { role: 'ai', text: introAiText },
        { role: 'origin', label: originLabel },
        ...(approachOriginText ? [{ role: 'origin', label: `Applies to: ${approachOriginText}`, variant: 'approach' }] : []),
        // If groups were pre-picked we skip flow[0] (the "which group?" question) and start at flow[1].
        ...(hasSeededGroups && flow.length > 1
          ? [{ role: 'ai', text: flow[1].text, chips: flow[1].chips }]
          : [{ role: 'ai', text: firstAi.text, chips: firstAi.chips }]),
      ] : hasSeededGroups ? [
        { role: 'ai', text: introAiText },
        { role: 'origin', label: `Applies to: ${approachOriginText}`, variant: 'approach' },
        { role: 'ai', text: "Got it — I'll build a rule for those groups. Pick a ranking type below, or describe what you need." },
        { role: 'suggestions' },
      ] : [
        { role: 'ai', text: introAiText },
        { role: 'suggestions' },
      ];

  const [messages, setMessages] = useState(initMsgs);
  // Tracks the template the user picked via the in-builder suggestion cards (selectSuggestion).
  // This lets us swap to that template's flow without re-mounting RuleBuilderView.
  const [activeTplName, setActiveTplName] = useState(templateName);
  const [selectionUsed, setSelectionUsed] = useState(false);
  // Edit-mode: when an existing-rule is being edited and the user has picked a "Change X"
  // chip, this holds the field key we expect the next user message to update.
  const [editAwaitingFor, setEditAwaitingFor] = useState(null);
  const [input, setInput]       = useState('');
  const [typing, setTyping]     = useState(false);
  // When entering edit mode, start with the config panel collapsed — the user
  // asked to keep it out of the way until they explicitly want to make changes.
  const [cfgOpen, setCfgOpen]           = useState(!existingRule);
  // Drive the inline Preview Mode from inside the builder so the user can
  // jump to / from the simulator without losing their in-progress rule.
  const [previewing, setPreviewing]     = useState(false);
  // Ref for the chat thread container — used to auto-scroll to the bottom
  // whenever a new message is appended (typically right after a chip click).
  const chatThreadRef                   = useRef(null);
  const [stickyOpen, setStickyOpen]     = useState(true);
  const [customAnswer, setCustomAnswer] = useState(false);
  const [chipSelections, setChipSelections] = useState(new Set());

  const skippedCount = messages.filter(m => m.role === 'user' && m.skipped).length;

  const guessType = (name) => {
    if (!name) return 'hours';
    const n = name.toLowerCase();
    // Specific multi-word matches go first so "Accumulating Rolodex" doesn't fall into "rolodex".
    if (n.includes('accumulating rolodex')) return 'turns';
    if (n.includes('standard rolodex')) return 'rolodex';
    if (n.includes('employee id') || n.includes('by id')) return 'employee_id';
    if (n.includes('random') || n.includes('lottery')) return 'random';
    if (n.includes('hour')) return 'hours';
    if (n.includes('turn')) return 'turns';
    if (n.includes('hire') || n.includes('seniority')) return 'hire_date';
    if (n.includes('rolodex')) return 'rolodex';
    return 'custom';
  };

  const [form, setForm] = useState({
    ruleName:            existingRule?.config?.ruleName || templateName || (initialPrompt ? initialPrompt.slice(0, 48) : 'New Rule'),
    ruleType:            existingRule?.config?.ruleType || guessType(templateName || initialPrompt),
    ruleAffects:         existingRule?.config?.ruleAffects || (seededAllAppr ? 'all' : (hasSeededGroups ? 'selected' : 'all')),
    selectedApproaches:  existingRule?.config?.selectedApproaches || (hasSeededGroups && !seededAllAppr ? [...seededApproaches] : []),
    callbackStatuses:    ['Dispatched', 'Accepted'],
    callbackResponses:   ['Accept', 'Decline'],
    minShift:            '',
    maxShift:            '',
    lookBack:            '',
    forecast:            '',
    tieBreaker:          '',
    declineAction:       '',
    penaltyPoints:       '',
    declineScope:        '',
    declineCooldown:     '',
    turnsCounting:       '',
    tieBreakerOrder:     '',
    rolodexReset:        '',
    // New call-and-response fields for the six prompt flows:
    rolodexAcceptMove:   '',  // Standard Rolodex: post-accept movement
    responseTime:        '',  // Standard Rolodex: per-employee response window
    accumulationType:    '',  // Accumulating Rolodex: hours vs callbacks
    accumulationLimit:   '',  // Accumulating Rolodex: limit value before rotating
    resetCadence:        '',  // Accumulation Hours: reset cycle
    hoursCountedOutcomes:'',  // Accumulation Hours: which outcomes count
    seniorityDateType:   '',  // Static Seniority: hire vs promotion date
    sortDirection:       '',  // Static By ID: asc / desc
    newHirePlacement:    '',  // Static By ID: where new hires land
    caseSensitivity:     '',  // Static By ID: ignore case or not
    randomizeFrequency:  '',  // Random: how often to re-randomize
    randomWeighting:     '',  // Random: pure / weighted-by-gap / weighted-by-hours
    randomGuardrail:     '',  // Random: optional fairness guardrail
    // ── Common operational settings (asked at the tail of every flow) ──
    ruleEvaluates:       '',  // 'Callbacks only' | 'All shifts'
    includePrevShifts:   '',  // 'Yes' | 'No'
  });

  // Tracks which config fields have been surfaced by chat answers
  const [revealedFields, setRevealedFields] = useState(() => {
    const init = new Set(['ruleName']);
    if (templateName || initialPrompt || existingRule) init.add('ruleType');
    if (hasSeededGroups || existingRule) init.add('ruleAffects');
    if (existingRule) {
      // In edit mode, surface every field that has a non-empty value in the existing rule's config.
      const cfg = existingRule.config || {};
      for (const k of Object.keys(cfg)) {
        const v = cfg[k];
        if (v !== '' && v !== null && v !== undefined && !(Array.isArray(v) && v.length === 0)) init.add(k);
      }
    }
    return init;
  });

  // Tracks the most recently added field for the right-panel "newest field" highlight.
  // Cleared after ~2.4s so the glow fades on its own.
  const [newestField, setNewestField] = useState(null);
  useEffect(() => {
    if (!newestField) return;
    const t = setTimeout(() => setNewestField(null), 2400);
    return () => clearTimeout(t);
  }, [newestField]);

  const patchForm = (updates, opts = {}) => {
    setForm(f => ({ ...f, ...updates }));
    setRevealedFields(r => {
      const next = new Set(r);
      const newlyAdded = [];
      Object.keys(updates).forEach(k => {
        if (!next.has(k)) newlyAdded.push(k);
        next.add(k);
      });
      // Pick the last newly-added field as the one to highlight. Skip 'ruleName' since
      // that's the always-visible header field and shouldn't pulse on every keystroke.
      const focusField = newlyAdded.filter(k => k !== 'ruleName').pop();
      if (focusField) setNewestField(focusField);
      return next;
    });
    if (opts.fromUser) {
      for (const [key, val] of Object.entries(updates)) {
        const branch = BRANCH_MAP[key]?.[val];
        if (!branch) continue;
        setMessages(m => [...m, { role: 'user', text: branch.userMsg, fromForm: true }]);
        setTyping(true);
        setTimeout(() => {
          if (branch.ai) setMessages(m => [...m, { role: 'ai', text: branch.ai.text, chips: branch.ai.chips || [] }]);
          setTyping(false);
        }, 700 + Math.random() * 300);
        break;
      }
    }
  };

  // Hand the saved rule back up to App. App pushes it into RULES_DATA (with
  // `isNew: true` for fresh rules) and routes the user to Approaches & Rules
  // with a toast banner.
  const commitSave = () => {
    onSaved?.({ form, existingRule });
  };

  // All configurable fields are visible on the right panel from the start.
  // revealedFields is still tracked so the highlight glow can pulse when the
  // chat fills in a previously-untouched field — but every field renders
  // regardless of whether the chat has reached it yet.
  const shown = () => true;

  // Glow ring + tinted background applied to the newest revealed field on the right panel
  // so users notice when a fresh configuration field appears after a chat answer.
  // Auto-fades after ~2.4s via the `newestField` useEffect timer above.
  const HL_STYLE = {
    borderRadius: 8,
    boxShadow: '0 0 0 2px rgba(124,58,237,.55), 0 0 22px 2px rgba(124,58,237,.32)',
    background: 'linear-gradient(135deg, rgba(124,58,237,.07), rgba(99,102,241,.04))',
    transition: 'box-shadow .35s ease, background .35s ease',
    padding: 10,
    marginLeft: -10,
    marginRight: -10,
  };
  const highlight = (...keys) => keys.includes(newestField) ? HL_STYLE : null;

  const msgEndRef    = useRef(null);
  const textareaRef  = useRef(null);
  const panelScrollRef = useRef(null);
  const prevRevealedSize = useRef(0);
  useEffect(() => { msgEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, typing]);
  // When a new configuration field appears in the right panel during chat,
  // smoothly scroll the panel so the user sees the build progressing on the side.
  useEffect(() => {
    if (revealedFields.size > prevRevealedSize.current && panelScrollRef.current) {
      // Tiny delay so the freshly-revealed field has rendered before we scroll.
      setTimeout(() => {
        const c = panelScrollRef.current;
        if (c) c.scrollTo({ top: c.scrollHeight, behavior: 'smooth' });
      }, 60);
    }
    prevRevealedSize.current = revealedFields.size;
  }, [revealedFields]);
  // Auto-toggle the sticky summary based on scroll position. When the user is at the
  // top of the form, the summary is expanded; scroll down a little and it collapses
  // into a compact pill (still pinned to the top), freeing up vertical room for the form.
  useEffect(() => {
    const el = panelScrollRef.current;
    if (!el) return;
    const onScroll = () => {
      const y = el.scrollTop;
      if (y > 36) setStickyOpen(false);
      else if (y < 8) setStickyOpen(true);
    };
    el.addEventListener('scroll', onScroll, { passive: true });
    return () => el.removeEventListener('scroll', onScroll);
  }, []);

  const userMsgs    = messages.filter(m => m.role === 'user');
  // When entering from a template/prompt, flow[0] is already pre-loaded in initMsgs
  // with no user message yet, so offset by 1 to avoid repeating it.
  // flow[0] is always the "Which group does this apply to?" question. When the user has
  // already picked groups upstream (dashboard / banner picker), we render flow[1] as the
  // first AI message and shift the offset by +1 so the next response advances correctly.
  // `selectionUsed` flips to true once the user picks a template via the in-builder suggestion
  // cards (selectSuggestion); that path adds the user-tpl message AND displays the next AI
  // question in one shot, so the offset arithmetic differs from initial-seed entry.
  const flowOffset  = selectionUsed
                    ? (hasSeededGroups ? 1 : 0)
                    : (hasSeededGroups && (templateName || initialPrompt)) ? 2
                    : (templateName || initialPrompt) ? 1
                    : 0;
  const nextFlowIdx = userMsgs.length + flowOffset;

  const parseAndPatch = (text) => {
    const lower = text.toLowerCase();
    const updates = {};
    // Rule name
    const nameMatch = text.match(/(?:call it|name it|named?)\s+"?([^"]+)"?/i) || text.match(/"([^"]+)"/);
    if (nameMatch) updates.ruleName = nameMatch[1];
    // Rule type
    if (lower.includes('hours')) updates.ruleType = 'hours';
    else if (lower.includes('turns')) updates.ruleType = 'turns';
    else if (lower.includes('hire date') || lower.includes('seniority')) updates.ruleType = 'hire_date';
    else if (lower.includes('rolodex')) updates.ruleType = 'rolodex';
    // Approach / group — handles single or comma-joined multi-select values
    const approachNames = ['Firefighter 2','Captains','Patrol Deputy','Bay Guard','Battalion Chief','FF3'];
    if (lower.includes('all approaches') || lower.includes('all approach')) {
      updates.ruleAffects = 'all';
    } else {
      const matched = approachNames.filter(a => lower.includes(a.toLowerCase()));
      if (matched.length > 0) {
        updates.ruleAffects = 'selected';
        updates.selectedApproaches = matched;
      }
    }
    // Lookback window from chip answers like "30 days" / "14 days"
    const lbDaysM = text.match(/^(\d+)\s*days?$/i);
    if (lbDaysM) updates.lookBack = lbDaysM[1];
    // Shift lengths
    const minM = text.match(/min(?:imum)?\s*(?:shift)?\s*(?:is|:)?\s*(\d+)/i);
    if (minM) updates.minShift = minM[1];
    const maxM = text.match(/max(?:imum)?\s*(?:shift)?\s*(?:is|:)?\s*(\d+)/i);
    if (maxM) updates.maxShift = maxM[1];
    // Explicit lookback / forecast
    const lbM = text.match(/look\s*back\s*(?:of|:)?\s*(\d+)/i);
    if (lbM) updates.lookBack = lbM[1];
    const fcM = text.match(/forecast\s*(?:of|:)?\s*(\d+)/i);
    if (fcM) updates.forecast = fcM[1];
    // Tiebreaker
    if (lower.includes('seniority') || lower.includes('hire date')) updates.tieBreaker = 'Seniority (hire date)';
    else if (lower.includes('last shift')) updates.tieBreaker = 'Last shift worked';
    else if (lower.includes('last callback')) updates.tieBreaker = 'Last callback date';
    else if (lower.includes('alphabetical')) updates.tieBreaker = 'Alphabetical';
    // Decline action
    if (lower.includes('back of the list') || lower.includes('back of list') || lower.includes('move to back')) updates.declineAction = 'Move to back of list';
    else if (lower.includes('stay in position') || lower.includes('stay at')) updates.declineAction = 'Stay in position';
    else if (lower.includes('penalty')) updates.declineAction = 'Penalty points';
    // Penalty points value — chip answers like "2 points", "5 points"
    const pointsM = text.match(/^(\d+)\s*points?$/i);
    if (pointsM) updates.penaltyPoints = pointsM[1];
    // Decline scope (who it applies to)
    if (lower === 'all reasons') updates.declineScope = 'All reasons';
    else if (lower === 'voluntary only') updates.declineScope = 'Voluntary only';
    else if (lower === 'involuntary only') updates.declineScope = 'Involuntary only';
    // Re-offer cooldown
    if (lower === 'no cooldown') updates.declineCooldown = 'None';
    else if (lower === '1 hour') updates.declineCooldown = '1 hour';
    else if (lower === '4 hours') updates.declineCooldown = '4 hours';
    // Turns counting method
    if (lower === 'all turns') updates.turnsCounting = 'All turns';
    else if (lower === 'accepted only') updates.turnsCounting = 'Accepted only';
    else if (lower === 'accepted + weighted') updates.turnsCounting = 'Accepted + weighted';
    // Rolodex reset behavior
    if (lower === 'yes, reset each cycle') updates.rolodexReset = 'Reset each cycle';
    else if (lower === 'no, keep rotating') updates.rolodexReset = 'Keep rotating';
    else if (lower === 'reset manually') updates.rolodexReset = 'Manual reset';
    // ── New call-and-response fields ─────────────────────────────────────────
    // Standard Rolodex: where employees land after accepting / declining
    if (lower === 'move to end of list' || lower === 'move to back of list') {
      // Apply to both post-accept and post-decline so the panel reveals both fields
      // in turn — the flow asks accept first, then decline next.
      if (!form.rolodexAcceptMove) updates.rolodexAcceptMove = 'Move to end of list';
      else updates.declineAction = 'Move to back of list';
    } else if (lower === 'stay at the top') updates.rolodexAcceptMove = 'Stay at the top';
    // Response time window (e.g. "2 minutes")
    const respM = text.match(/^(\d+)\s*minutes?$/i);
    if (respM) updates.responseTime = `${respM[1]} min`;
    // Accumulating Rolodex: what accumulates and at what limit
    if (lower === 'hours worked') updates.accumulationType = 'Hours worked';
    else if (lower === 'callbacks accepted') updates.accumulationType = 'Callbacks accepted';
    else if (lower === 'both, weighted') updates.accumulationType = 'Hours + callbacks, weighted';
    const limHoursM = text.match(/^(\d+)\s*hours?$/i);
    if (limHoursM) updates.accumulationLimit = `${limHoursM[1]} hours`;
    const limCbM = text.match(/^(\d+)\s*callbacks?$/i);
    if (limCbM) updates.accumulationLimit = `${limCbM[1]} callbacks`;
    // Reset cadence (Accumulation — Hours Based)
    if (lower.startsWith('annually')) updates.resetCadence = 'Annually (fiscal year)';
    else if (lower === 'quarterly') updates.resetCadence = 'Quarterly';
    else if (lower === 'monthly') updates.resetCadence = 'Monthly';
    else if (lower.startsWith('never')) updates.resetCadence = 'Never (rolling total)';
    // Hours-based: which outcomes count
    if (lower === 'accepted + denied') updates.hoursCountedOutcomes = 'Accepted + denied';
    else if (lower === 'anyone contacted') updates.hoursCountedOutcomes = 'Anyone contacted';
    else if (lower === 'custom mix') updates.hoursCountedOutcomes = 'Custom mix';
    else if (lower === 'accepted only' && /which callback outcomes/i.test(messages[messages.length - 1]?.text || '')) updates.hoursCountedOutcomes = 'Accepted only';
    // Static — Seniority Based: date type
    if (lower === 'hire date') updates.seniorityDateType = 'Hire date';
    else if (lower === 'rank/promotion date' || lower === 'promotion date') updates.seniorityDateType = 'Rank/promotion date';
    else if (lower === 'mix: hire date as tiebreaker') updates.seniorityDateType = 'Mix: promotion date + hire date tiebreaker';
    // Static — By Employee ID: sort direction / placement / case
    if (lower.startsWith('ascending')) updates.sortDirection = 'Ascending';
    else if (lower.startsWith('descending')) updates.sortDirection = 'Descending';
    if (lower === 'natural position by id') updates.newHirePlacement = 'Natural position by ID';
    else if (lower === 'top of list') updates.newHirePlacement = 'Top of list';
    else if (lower === 'bottom of list') updates.newHirePlacement = 'Bottom of list';
    if (lower.startsWith('yes, ignore case')) updates.caseSensitivity = 'Ignore case';
    else if (lower.startsWith('no, case-sensitive')) updates.caseSensitivity = 'Case-sensitive';
    // Random / Lottery: frequency, weighting, guardrail
    if (lower === 'every callback') updates.randomizeFrequency = 'Every callback';
    else if (lower === 'every shift') updates.randomizeFrequency = 'Every shift';
    else if (lower === 'daily') updates.randomizeFrequency = 'Daily';
    else if (lower === 'weekly') updates.randomizeFrequency = 'Weekly';
    if (lower === 'pure random') updates.randomWeighting = 'Pure random';
    else if (lower === 'weight by last callback gap') updates.randomWeighting = 'Weight by last callback gap';
    else if (lower === 'weight by total hours') updates.randomWeighting = 'Weight by total hours';
    if (lower === 'no guardrails') updates.randomGuardrail = 'No guardrails';
    else if (lower === 'cap consecutive picks') updates.randomGuardrail = 'Cap consecutive picks';
    else if (lower === 'cool-down after a pick') updates.randomGuardrail = 'Cool-down after a pick';
    // ── Common operational settings ─────────────────────────────────────────
    // Rule evaluates: callbacks only vs all shifts
    if (lower === 'callbacks only') updates.ruleEvaluates = 'Callbacks only';
    else if (lower === 'all shifts') updates.ruleEvaluates = 'All shifts';
    // Include shifts created before rule activation
    if (lower.startsWith('yes, include past'))   updates.includePrevShifts = 'Yes';
    else if (lower.startsWith('no, only new'))   updates.includePrevShifts = 'No';
    // Shift-length filter shortcuts
    if (lower === 'no filter — any length' || lower === 'no filter' || lower === 'no filter - any length') {
      updates.minShift = '';
      updates.maxShift = '';
    } else if (lower === 'min 4 hours') {
      updates.minShift = '4';
    } else if (lower === 'min 8 hours') {
      updates.minShift = '8';
    } else if (lower === 'min 4 / max 12') {
      updates.minShift = '4'; updates.maxShift = '12';
    }
    // Forecast preset
    if (/^no forecast$/i.test(text)) updates.forecast = '';
    // Callback statuses — multi-select; chip answer comes joined with commas
    if (/active\s*\/\s*done calling|filled\s*\/\s*partially filled|not filled|cancelled|all statuses/i.test(text)) {
      if (/all statuses/i.test(text)) {
        updates.callbackStatuses = ['Active / Done Calling','Filled / Partially Filled','Not Filled','Cancelled'];
      } else {
        const picked = [];
        if (/active\s*\/\s*done calling/i.test(text))     picked.push('Active / Done Calling');
        if (/filled\s*\/\s*partially filled/i.test(text)) picked.push('Filled / Partially Filled');
        if (/not filled/i.test(text))                     picked.push('Not Filled');
        if (/cancelled/i.test(text))                      picked.push('Cancelled');
        if (picked.length) updates.callbackStatuses = picked;
      }
    }
    // Callback responses — multi-select
    if (/^(accepted|denied|no answer|all responses)(,\s*(accepted|denied|no answer))*$/i.test(text)) {
      if (/all responses/i.test(text)) {
        updates.callbackResponses = ['Accepted','Denied','No answer'];
      } else {
        const picked = [];
        if (/\baccepted\b/i.test(text))   picked.push('Accepted');
        if (/\bdenied\b/i.test(text))     picked.push('Denied');
        if (/\bno answer\b/i.test(text))  picked.push('No answer');
        if (picked.length) updates.callbackResponses = picked;
      }
    }
    // Tiebreaker sort direction
    if (lower === 'a → z') updates.tieBreakerOrder = 'A → Z';
    else if (lower === 'z → a') updates.tieBreakerOrder = 'Z → A';
    else if (lower === 'more recent = higher') updates.tieBreakerOrder = 'More recent first';
    else if (lower === 'more recent = lower') updates.tieBreakerOrder = 'Older first';
    else if (lower === 'yes, longest gap first') updates.tieBreakerOrder = 'Longest gap first';
    else if (lower === 'no, most recent first') updates.tieBreakerOrder = 'Most recent first';
    else if (lower === 'yes, most senior first' || lower === 'most senior first') updates.tieBreakerOrder = 'Most senior first';
    else if (lower === 'least senior first') updates.tieBreakerOrder = 'Least senior first';
    if (Object.keys(updates).length) patchForm(updates);
  };

  // True once the user has supplied enough info that a Preview Mode jump
  // would actually rank a real roster: a rule type is chosen and either
  // "All approaches" is selected or at least one approach is picked.
  const minInfoComplete = !!form.ruleType
    && (form.ruleAffects === 'all' || (form.selectedApproaches && form.selectedApproaches.length > 0));

  const send = (text, opts = {}) => {
    const isSkip = !!opts.skip;
    if (!isSkip && !text.trim() || typing) return;

    // ── Universal chat handlers (apply in both edit + build modes) ──
    // 1) "What is X?" — answer like an AI tutor and don't advance the flow.
    const ruleTypeKey = matchRuleTypeQuestion(text);
    if (ruleTypeKey && RULE_TYPE_EXPLANATIONS[ruleTypeKey]) {
      setMessages(m => [...m, { role: 'user', text }]);
      setInput('');
      setTyping(true);
      setTimeout(() => {
        setMessages(m => [...m, { role: 'ai', text: RULE_TYPE_EXPLANATIONS[ruleTypeKey] }]);
        setTyping(false);
      }, 600);
      return;
    }
    // 2) Save / Preview / Adjust chips from the end-of-flow "what's next?" message.
    if (text === 'Save rule') {
      setMessages(m => [...m, { role: 'user', text }]);
      setInput('');
      setTimeout(() => commitSave(), 350);
      return;
    }
    if (text === 'Preview ranking') {
      setMessages(m => [...m, { role: 'user', text }]);
      setInput('');
      setPreviewing(true);
      return;
    }
    if (text === 'Adjust something') {
      setMessages(m => [...m, { role: 'user', text }]);
      setInput('');
      setTyping(true);
      setTimeout(() => {
        setMessages(m => [...m, { role: 'ai', text: "What would you like to change?", chips: EDIT_MENU_CHIPS }]);
        setTyping(false);
      }, 400);
      return;
    }
    // 3) "Change X" chip from the adjust menu — applies in both build + edit
    //    mode so the user can iterate on the rule from inside a fresh build.
    if (!existingRule && EDIT_ASK[text]) {
      const ask = EDIT_ASK[text];
      setMessages(m => [...m, { role: 'user', text }]);
      setEditAwaitingFor(ask.field);
      setInput('');
      setCustomAnswer(false);
      setTyping(true);
      setTimeout(() => {
        setMessages(m => [...m, { role: 'ai', text: ask.text, chips: ask.chips, multi: ask.multi }]);
        setTyping(false);
      }, 600);
      return;
    }
    if (!existingRule && editAwaitingFor) {
      parseAndPatch(text);
      setMessages(m => [...m, { role: 'user', text, skipped: isSkip }]);
      setEditAwaitingFor(null);
      setInput('');
      setCustomAnswer(false);
      setTyping(true);
      setTimeout(() => {
        setMessages(m => [...m, { role: 'ai', text: "Updated — I've applied that to the configuration on the right. Want to save the rule, preview it, or change something else?", chips: ['Save rule','Preview ranking','Adjust something'] }]);
        setTyping(false);
      }, 600);
      return;
    }

    // ── Edit-mode dispatch ──
    // When editing an existing rule we don't walk a linear FLOWS[] array. Instead we
    // bounce between the small edit menu and one focused "change X?" question at a time.
    if (existingRule) {
      // Rebuild the exploratory chip set fresh each turn so the embedded names
      // reflect the current ranking (which can shift if the user changes the
      // tiebreaker, decline behavior, etc.).
      const expChips = () => {
        const ranked = rankEmployees(form);
        const top = ranked[0]?.name, third = ranked[2]?.name;
        return [
          top   ? `Why is ${top} first?`              : 'Why is the top employee first?',
          top   ? `How many hours does ${top} have?` : 'How many hours does the top employee have?',
          third ? `Where is ${third} in the ranking?` : 'Where is a specific person in the ranking?',
          EDIT_CHANGE_TRIGGER,
          EDIT_SAVE_CHIP,
        ];
      };

      // Save and exit
      if (text === EDIT_SAVE_CHIP) {
        setMessages(m => [...m, { role: 'user', text }]);
        setInput('');
        setTimeout(() => commitSave(), 350);
        return;
      }
      // User wants to start making changes → open the config panel and show the change menu
      if (text === EDIT_CHANGE_TRIGGER) {
        setMessages(m => [...m, { role: 'user', text }]);
        setInput('');
        setCfgOpen(true);
        setTyping(true);
        setTimeout(() => {
          setMessages(m => [...m, { role: 'ai', text: "Opened the rule configuration on the right — pick what you'd like to change.", chips: EDIT_MENU_CHIPS }]);
          setTyping(false);
        }, 500);
        return;
      }
      // Exploratory: "Why is X first?"
      const whyMatch = text.match(/^Why is (.+) first\?$/);
      if (whyMatch) {
        const top = rankEmployees(form)[0];
        setMessages(m => [...m, { role: 'user', text }]);
        setInput('');
        setTyping(true);
        setTimeout(() => {
          const reasonByType = {
            hours:       `${top?.name} is first because they have the fewest accumulated callback hours (${top?.hours}h).`,
            rolodex:     `${top?.name} is at the top of the Rolodex right now — no one ahead of them has accepted yet.`,
            hire_date:   `${top?.name} is first because they're the most senior employee (hired ${top?.hireDate}).`,
            employee_id: `${top?.name} sorts first alphanumerically by employee name.`,
            random:      `${top?.name} drew the highest random ranking this cycle.`,
            turns:       `${top?.name} is first because the accumulating counter still has them below the rotation limit.`,
          };
          const aiText = reasonByType[form.ruleType] || `${top?.name} is first per this rule's ranking factor.`;
          setMessages(m => [...m, { role: 'ai', text: aiText, chips: expChips() }]);
          setTyping(false);
        }, 500);
        return;
      }
      // Exploratory: "How many hours does X have?"
      const hoursMatch = text.match(/^How many hours does (.+) have\?$/);
      if (hoursMatch) {
        const name = hoursMatch[1];
        const emp = MOCK_EMPLOYEES.find(e => e.name === name);
        setMessages(m => [...m, { role: 'user', text }]);
        setInput('');
        setTyping(true);
        setTimeout(() => {
          const aiText = emp
            ? `${emp.name} has ${emp.hours} accumulated callback hours. Last callback was ${emp.lastCallback}; last shift was ${emp.lastShift}.`
            : `I couldn't find that employee in the current roster.`;
          setMessages(m => [...m, { role: 'ai', text: aiText, chips: expChips() }]);
          setTyping(false);
        }, 500);
        return;
      }
      // Exploratory: "Where is X in the ranking?"
      const whereMatch = text.match(/^Where is (.+) in the ranking\?$/);
      if (whereMatch) {
        const name = whereMatch[1];
        const ranked = rankEmployees(form);
        const idx = ranked.findIndex(e => e.name === name);
        setMessages(m => [...m, { role: 'user', text }]);
        setInput('');
        setTyping(true);
        setTimeout(() => {
          const aiText = idx >= 0
            ? `${name} is currently #${idx + 1} out of ${ranked.length} in the predicted call order (${ranked[idx].hours}h, hired ${ranked[idx].hireDate}).`
            : `I couldn't find that employee in the current roster.`;
          setMessages(m => [...m, { role: 'ai', text: aiText, chips: expChips() }]);
          setTyping(false);
        }, 500);
        return;
      }
      // User picked one of the edit menu chips → show the corresponding question
      if (EDIT_ASK[text]) {
        const ask = EDIT_ASK[text];
        setMessages(m => [...m, { role: 'user', text }]);
        setEditAwaitingFor(ask.field);
        setInput('');
        setCustomAnswer(false);
        setTyping(true);
        setTimeout(() => {
          setMessages(m => [...m, { role: 'ai', text: ask.text, chips: ask.chips, multi: ask.multi }]);
          setTyping(false);
        }, 700);
        return;
      }
      // User is answering an edit question → patch the form, then re-show the menu
      if (editAwaitingFor) {
        parseAndPatch(text);
        setMessages(m => [...m, { role: 'user', text, skipped: isSkip }]);
        setEditAwaitingFor(null);
        setInput('');
        setCustomAnswer(false);
        setTyping(true);
        setTimeout(() => {
          setMessages(m => [...m, { role: 'ai', text: "Updated — I've applied that to the configuration on the right. Anything else you'd like to change?", chips: EDIT_MENU_CHIPS }]);
          setTyping(false);
        }, 700);
        return;
      }
      // Fallback for free-form input mid-edit: parse and offer the menu again
      parseAndPatch(text);
      setMessages(m => [...m, { role: 'user', text }]);
      setInput('');
      setCustomAnswer(false);
      setTyping(true);
      setTimeout(() => {
        setMessages(m => [...m, { role: 'ai', text: "Got it. Anything else you'd like to change?", chips: EDIT_MENU_CHIPS }]);
        setTyping(false);
      }, 700);
      return;
    }

    // ── Normal build-from-scratch flow ──
    if (!isSkip) parseAndPatch(text);
    setMessages(m => [...m.filter(msg => msg.role !== 'suggestions'), { role: 'user', text, skipped: isSkip }]);
    setInput('');
    setCustomAnswer(false);
    setTyping(true);
    setTimeout(() => {
      const nextAi = flow[nextFlowIdx];
      if (nextAi) setMessages(m => [...m, { role: 'ai', text: nextAi.text, chips: nextAi.chips }]);
      setTyping(false);
    }, 800 + Math.random() * 400);
  };

  const handleSkip = () => send('', { skip: true });

  const blankForm = {
    ruleName: 'New Rule', ruleType: 'hours', ruleAffects: 'all', selectedApproaches: [],
    callbackStatuses: ['Dispatched', 'Accepted'], callbackResponses: ['Accept', 'Decline'],
    minShift: '', maxShift: '', lookBack: '', forecast: '', tieBreaker: '', declineAction: '',
    penaltyPoints: '', declineScope: '', declineCooldown: '',
    turnsCounting: '', tieBreakerOrder: '', rolodexReset: '',
    rolodexAcceptMove: '', responseTime: '', accumulationType: '', accumulationLimit: '',
    resetCadence: '', hoursCountedOutcomes: '', seniorityDateType: '',
    sortDirection: '', newHirePlacement: '', caseSensitivity: '',
    randomizeFrequency: '', randomWeighting: '', randomGuardrail: '',
    ruleEvaluates: '', includePrevShifts: '',
  };
  const startOver = () => {
    setMessages([{ role: 'ai', text: introAiText }, { role: 'suggestions' }]);
    setForm(blankForm);
    setInput('');
    setTyping(false);
    setSuggSetIdx(0);
    setRevealedFields(new Set());
    setChipSelections(new Set());
    setStickyOpen(true);
    setActiveTplName(null);
    setSelectionUsed(false);
    setNewestField(null);
  };

  const selectSuggestion = (tplName) => {
    const f = FLOWS[tplName] || FLOWS.default;
    // If groups were pre-picked upstream (dashboard/banner picker), skip flow[0] — that's
    // the "Which group?" question, which we've already answered. Jump to flow[1] instead.
    const startIdx = hasSeededGroups && f.length > 1 ? 1 : 0;
    setActiveTplName(tplName);
    setSelectionUsed(true);
    setMessages([
      { role: 'user', text: tplName },
      ...(hasSeededGroups && approachOriginText
        ? [{ role: 'origin', label: `Applies to: ${approachOriginText}`, variant: 'approach' }]
        : []),
      { role: 'ai', text: f[startIdx].text, chips: f[startIdx].chips },
    ]);
    patchForm({ ruleName: tplName, ruleType: guessType(tplName) });
    setInput('');
  };

  const toggleArr = (arr, item) => arr.includes(item) ? arr.filter(x => x !== item) : [...arr, item];

  const sharedHeader = (
    <div style={{ padding: '20px 32px', background: 'linear-gradient(135deg, #7C3AED 0%, #6D28D9 50%, #5B21B6 100%)', position: 'relative', overflow: 'hidden', flex: 'none' }}>
      <div style={{ position: 'absolute', top: -30, right: 60, width: 110, height: 110, borderRadius: '50%', background: 'rgba(167,139,250,.22)', filter: 'blur(28px)', pointerEvents: 'none' }} />
      <div style={{ position: 'absolute', bottom: -18, left: 100, width: 85, height: 85, borderRadius: '50%', background: 'rgba(196,181,253,.16)', filter: 'blur(22px)', pointerEvents: 'none' }} />
      <div style={{ display: 'flex', alignItems: 'center', gap: 16, position: 'relative' }}>
        <button onClick={onBack} style={{ display: 'inline-flex', alignItems: 'center', gap: 5, background: 'rgba(255,255,255,.15)', border: '1px solid rgba(255,255,255,.25)', borderRadius: 6, padding: '6px 12px', color: '#fff', font: '500 13px/1 Inter,sans-serif', cursor: 'pointer', flex: 'none' }}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          Back
        </button>
        <div style={{ width: 1, height: 26, background: 'rgba(255,255,255,.25)' }} />
        <div style={{ width: 46, height: 46, borderRadius: 12, background: 'rgba(255,255,255,.18)', border: '1px solid rgba(255,255,255,.28)', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none', backdropFilter: 'blur(4px)' }}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>
        </div>
        <div>
          <div style={{ font: '700 18px/1.2 Inter,sans-serif', color: '#fff', letterSpacing: '-.01em' }}>Add new rule</div>
        </div>

        <div style={{ flex: 1 }} />

        {/* Preview Mode button — surfaces once the user has supplied the
            minimum info needed for the simulator to rank a real roster.
            Lets them jump into Preview from anywhere in the flow. */}
        {minInfoComplete && (
          <button onClick={() => setPreviewing(true)}
            style={{ display: 'inline-flex', alignItems: 'center', gap: 6, background: 'rgba(255,255,255,.18)', border: '1px solid rgba(255,255,255,.32)', borderRadius: 6, padding: '7px 14px', color: '#fff', font: '600 13px/1 Inter,sans-serif', cursor: 'pointer', flex: 'none', backdropFilter: 'blur(4px)' }}
            onMouseEnter={e => { e.currentTarget.style.background = 'rgba(255,255,255,.25)'; }}
            onMouseLeave={e => { e.currentTarget.style.background = 'rgba(255,255,255,.18)'; }}>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            Preview Mode
          </button>
        )}

      </div>
    </div>
  );

  // When the user jumps into Preview Mode from the builder, hand control to
  // the SimulatorView; its own Back button returns us to the chat + config.
  if (previewing) {
    return <SimulatorView seed={{ form }} onBack={() => setPreviewing(false)} />;
  }

  return (
    <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>

      {/* ── LEFT: AI Chat ── */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: '#fff', overflow: 'hidden', minWidth: 0 }}>

        {sharedHeader}

        {/* Message thread */}
        <div style={{ flex: 1, overflowY: 'auto', padding: '36px 40px', display: 'flex', flexDirection: 'column', gap: 36 }}>

          {messages.map((m, i) => (
            <div key={i}>
              {m.role === 'ai' && (
                <div style={{ display: 'flex', gap: 14, alignItems: 'flex-start' }}>
                  <div style={{ width: 36, height: 36, borderRadius: '50%', background: 'linear-gradient(135deg, #A855F7, #EC4899, #F43F5E)', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none', boxShadow: '0 2px 8px rgba(168,85,247,.35)' }}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>

                    {m.chips && i === messages.reduce((last, msg, idx) => msg.role === 'ai' ? idx : last, -1) && !typing && !customAnswer && (

                              </button>

                                <div style={{ font: '400 11px/1.3 Inter,sans-serif', color: 'rgba(0,0,0,.45)', marginBottom: 2 }}>Select all that apply</div>

                                      <Checkbox label="Select all" bold checked={allSelected}
                                        onClick={() => setChipSelections(prev => {
                                          const s = new Set();
                                          if (!allSelected) s.add(allChip);
                                          return s;
                                        })} />
                                      <div style={{ width: 1, height: 18, background: 'rgba(124,58,237,.2)' }} />
                                    </>

                                  {itemChips.map(c => {

                                    return (
                                      <Checkbox key={c} label={c} checked={sel}

                                          const s = new Set(prev);
                                          if (allChip && s.has(allChip)) s.delete(allChip);
                                          s.has(c) ? s.delete(c) : s.add(c);
                                          return s;
                                        })} />
                                    );
                                  })}
                                </div>
                                {chipSelections.size > 0 && (
                                  <button onClick={() => { const v = Array.from(chipSelections).join(', '); setChipSelections(new Set()); send(v); }}

                                    Confirm · {allSelected ? 'all' : chipSelections.size} selected
                                  </button>
                                )}
                            <button onClick={() => { setCustomAnswer(true); setTimeout(() => textareaRef.current?.focus(), 50); }}
                              style={{ height: 36, padding: '0 20px', borderRadius: 20, border: '1.5px dashed rgba(124,58,237,.25)', background: 'transparent', color: 'rgba(0,0,0,.42)', font: '500 14px/1 Inter,sans-serif', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 8, transition: 'all .15s', whiteSpace: 'nowrap' }}
                              onMouseEnter={e => { e.currentTarget.style.borderColor = 'rgba(124,58,237,.55)'; e.currentTarget.style.color = '#7C3AED'; }}
                              onMouseLeave={e => { e.currentTarget.style.borderColor = 'rgba(124,58,237,.25)'; e.currentTarget.style.color = 'rgba(0,0,0,.42)'; }}>
                              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4z"/></svg>
                              Something else
                            </button>
                            <button onClick={handleSkip}
                              style={{ height: 26, padding: '0 2px', background: 'none', border: 'none', color: 'rgba(0,0,0,.32)', font: '400 13px/1 Inter,sans-serif', cursor: 'pointer', textDecoration: 'underline', textDecorationStyle: 'dotted', textUnderlineOffset: 3, marginTop: 1 }}
                              onMouseEnter={e => e.currentTarget.style.color = 'rgba(0,0,0,.58)'}
                              onMouseLeave={e => e.currentTarget.style.color = 'rgba(0,0,0,.32)'}>
                              Skip for now
                            </button>
                              </>
                            );
                          })()
                        ) : m.freeform ? (
                          <FreeformChips chips={m.chips} onSend={send} onSkip={handleSkip} />
                        ) : (
                          /* ── Single-select mode ── */
                          <>
                            {m.chips.map(c => (
                              <button key={c} onClick={() => send(c)}
                                style={{ height: 36, padding: '0 20px', borderRadius: 20, border: '1.5px solid rgba(124,58,237,.3)', background: 'rgba(124,58,237,.05)', color: '#7C3AED', font: '500 14px/1 Inter,sans-serif', cursor: 'pointer', transition: 'all .15s', whiteSpace: 'nowrap' }}
                                onMouseEnter={e => { e.currentTarget.style.background = 'rgba(124,58,237,.13)'; e.currentTarget.style.borderColor = '#7C3AED'; }}
                                onMouseLeave={e => { e.currentTarget.style.background = 'rgba(124,58,237,.05)'; e.currentTarget.style.borderColor = 'rgba(124,58,237,.3)'; }}
                              >{c}</button>
                            ))}
                            <button onClick={() => { setCustomAnswer(true); setTimeout(() => textareaRef.current?.focus(), 50); }}
                              style={{ height: 36, padding: '0 20px', borderRadius: 20, border: '1.5px dashed rgba(124,58,237,.25)', background: 'transparent', color: 'rgba(0,0,0,.42)', font: '500 14px/1 Inter,sans-serif', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 8, transition: 'all .15s', whiteSpace: 'nowrap' }}
                              onMouseEnter={e => { e.currentTarget.style.borderColor = 'rgba(124,58,237,.55)'; e.currentTarget.style.color = '#7C3AED'; }}
                              onMouseLeave={e => { e.currentTarget.style.borderColor = 'rgba(124,58,237,.25)'; e.currentTarget.style.color = 'rgba(0,0,0,.42)'; }}>
                              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4z"/></svg>
                              Something else
                            </button>
                            <button onClick={handleSkip}
                              style={{ height: 26, padding: '0 2px', background: 'none', border: 'none', color: 'rgba(0,0,0,.32)', font: '400 13px/1 Inter,sans-serif', cursor: 'pointer', textDecoration: 'underline', textDecorationStyle: 'dotted', textUnderlineOffset: 3, marginTop: 1 }}
                              onMouseEnter={e => e.currentTarget.style.color = 'rgba(0,0,0,.58)'}
                              onMouseLeave={e => e.currentTarget.style.color = 'rgba(0,0,0,.32)'}>
                              Skip for now
                            </button>
                          </>
                        )}
                      </div>
                    )}
                  </div>
                </div>
              )}
              {m.role === 'user' && (
                m.skipped ? (
                  <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
                    <div style={{ display: 'inline-flex', alignItems: 'center', gap: 7, padding: '7px 16px', borderRadius: 20, background: 'rgba(0,0,0,.04)', border: '1px solid rgba(0,0,0,.1)', color: 'rgba(0,0,0,.4)', font: '400 13px/1 Inter,sans-serif' }}>
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                      Skipped for now
                    </div>
                  </div>
                ) : (
                  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4 }}>
                    <div style={{ maxWidth: '68%', padding: '10px 18px', borderRadius: '18px 18px 4px 18px', background: 'rgba(124,58,237,.09)', color: '#4C1D95', font: '500 14px/1.6 Inter,sans-serif', border: '1.5px solid rgba(124,58,237,.22)' }}>
                      {m.text}
                    </div>
                    {m.fromForm && (
                      <div style={{ display: 'inline-flex', alignItems: 'center', gap: 4, font: '400 10px/1 Inter,sans-serif', color: 'rgba(0,0,0,.35)' }}>
                        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        edited in panel
                      </div>
                    )}
                  </div>
                )
              )}
              {m.role === 'origin' && (() => {
                const variantConfig = {
                  edit:     { label: 'Editing rule',  bg: 'linear-gradient(135deg, rgba(245,158,11,.12), rgba(234,88,12,.08))', border: 'rgba(245,158,11,.35)', avatar: 'linear-gradient(135deg,#F59E0B,#EA580C)',
                              icon: <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> },
                  approach: { label: 'Applies to',    bg: 'linear-gradient(135deg, rgba(59,130,246,.1), rgba(99,102,241,.06))', border: 'rgba(59,130,246,.28)', avatar: 'linear-gradient(135deg,#3B82F6,#2563EB)',
                              icon: <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg> },
                  default:  { label: 'You started with', bg: 'linear-gradient(135deg, rgba(124,58,237,.08), rgba(99,102,241,.05))', border: 'rgba(124,58,237,.2)', avatar: 'linear-gradient(135deg,#7C3AED,#5B21B6)',
                              icon: <svg width="13" height="13" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg> },
                }[m.variant || 'default'];
                return (
                  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 6 }}>
                    <div style={{ font: '500 11px/1 Inter,sans-serif', color: 'rgba(0,0,0,.35)', letterSpacing: '.04em', textTransform: 'uppercase' }}>{variantConfig.label}</div>
                    <div style={{ display: 'inline-flex', alignItems: 'center', gap: 10, padding: '10px 14px', background: variantConfig.bg, border: `1.5px solid ${variantConfig.border}`, borderRadius: '16px 16px 4px 16px' }}>
                      <div style={{ width: 28, height: 28, borderRadius: 7, background: variantConfig.avatar, display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none', boxShadow: '0 2px 6px rgba(0,0,0,.18)' }}>
                        {variantConfig.icon}
                      </div>
                      <span style={{ font: '600 14px/1.3 Inter,sans-serif', color: 'rgba(24,39,58,.9)' }}>{m.label}</span>
                    </div>
                  </div>
                );
              })()}
              {m.role === 'suggestions' && !typing && !customAnswer && (
                /* Rule-type picker — chip bubbles matching the rest of the chat's
                   single-select questions, with "Something else" and "Skip for now"
                   affordances so the first step feels consistent with later steps. */
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: 7, marginLeft: 50, marginTop: 4 }}>
                  <div style={{ font: '400 12px/1 Inter,sans-serif', color: 'rgba(0,0,0,.45)', marginBottom: 2 }}>Pick a rule type:</div>
                  {SUGGESTION_SETS.flat().map((s, si) => (
                    <button key={si} onClick={() => selectSuggestion(s.name)}
                      style={{ height: 36, padding: '0 20px', borderRadius: 20, border: '1.5px solid rgba(124,58,237,.3)', background: 'rgba(124,58,237,.05)', color: '#7C3AED', font: '500 14px/1 Inter,sans-serif', cursor: 'pointer', transition: 'all .15s', whiteSpace: 'nowrap' }}
                      onMouseEnter={e => { e.currentTarget.style.background = 'rgba(124,58,237,.13)'; e.currentTarget.style.borderColor = '#7C3AED'; }}
                      onMouseLeave={e => { e.currentTarget.style.background = 'rgba(124,58,237,.05)'; e.currentTarget.style.borderColor = 'rgba(124,58,237,.3)'; }}>
                      {s.name}
                    </button>
                  ))}
                  <button onClick={() => { setCustomAnswer(true); setTimeout(() => textareaRef.current?.focus(), 50); }}
                    style={{ height: 36, padding: '0 20px', borderRadius: 20, border: '1.5px dashed rgba(124,58,237,.25)', background: 'transparent', color: 'rgba(0,0,0,.42)', font: '500 14px/1 Inter,sans-serif', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 8, transition: 'all .15s', whiteSpace: 'nowrap' }}
                    onMouseEnter={e => { e.currentTarget.style.borderColor = 'rgba(124,58,237,.55)'; e.currentTarget.style.color = '#7C3AED'; }}
                    onMouseLeave={e => { e.currentTarget.style.borderColor = 'rgba(124,58,237,.25)'; e.currentTarget.style.color = 'rgba(0,0,0,.42)'; }}>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4z"/></svg>
                    Something else
                  </button>
                  <button onClick={handleSkip}
                    style={{ height: 26, padding: '0 2px', background: 'none', border: 'none', color: 'rgba(0,0,0,.32)', font: '400 13px/1 Inter,sans-serif', cursor: 'pointer', textDecoration: 'underline', textDecorationStyle: 'dotted', textUnderlineOffset: 3, marginTop: 1 }}
                    onMouseEnter={e => e.currentTarget.style.color = 'rgba(0,0,0,.58)'}
                    onMouseLeave={e => e.currentTarget.style.color = 'rgba(0,0,0,.32)'}>

            </div>

          {typing && (

// Explicit approach → roster mapping. In production, each approach is an
// admin-curated list of who's eligible to take that position. We mirror that
// here so the simulator only shows the people who would actually be called.
// Each approach has at least 5 members.
const APPROACH_ROSTERS = {
  'Firefighter 2':   ['Maria Rodriguez','Chris Anderson','Michael Chen','Sarah Williams','Emily Davis','John Smith','James Wilson','Alissa Mendez'],
  'Captains':        ['Robert Johnson','James Wilson','John Smith','Scot Davis','Evan Garcia'],
  'Patrol Deputy':   ['Maria Rodriguez','Michael Chen','Chris Anderson','Emily Davis','James Wilson'],
  'Bay Guard':       ['Sarah Williams','Karen Martinez','Emily Davis','John Smith','Alissa Mendez'],
  'Battalion Chief': ['Scot Davis','Evan Garcia','Robert Johnson','James Wilson','John Smith'],
  'FF3':             ['Chris Anderson','James Wilson','Maria Rodriguez','Michael Chen','Emily Davis'],
};

// Standard 24/48 fire schedule: A works day 0/3/6, B works day 1/4/7, C day 2/5/8.
const PLATOONS = ['A','B','C'];
function platoonForDay(dayIndex) {
  const idx = ((dayIndex % 3) + 3) % 3;
  return PLATOONS[idx];
}

function daysBetween(a, b) {
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}

// Treat the simulator's clock as starting at "today". Day 0 = today, day 1 = tomorrow, etc.
function shiftStatusAt(person, scenarioDate, baselineDate) {
  const dayOffset = daysBetween(baselineDate, scenarioDate);
  if (person.pto) {
    if (dayOffset >= person.pto.startOffset && dayOffset <= person.pto.endOffset) {
      return { code: person.pto.kind, label: person.pto.kind === 'sick' ? 'Sick' : 'Vacation', available: false };
    }
  }
  const onPlatoon = platoonForDay(dayOffset);
  if (person.platoon === onPlatoon) return { code: 'on-shift', label: 'On shift', available: true };
  // Pre-shift / post-shift: people coming on next day or just off
  const nextPlatoon = platoonForDay(dayOffset + 1);
  if (person.platoon === nextPlatoon) return { code: 'next', label: 'Off — on next', available: true };
  return { code: 'off', label: 'Off', available: true };
}

const STATUS_STYLE = {
  'on-shift': { bg: '#dcfce7', fg: '#166534', dot: '#22c55e' },
  'next':     { bg: '#dbeafe', fg: '#1d4ed8', dot: '#3b82f6' },
  'off':      { bg: 'rgba(0,0,0,.06)', fg: 'rgba(0,0,0,.55)', dot: 'rgba(0,0,0,.3)' },
  'vacation': { bg: '#fef3c7', fg: '#92400e', dot: '#f59e0b' },
  'sick':     { bg: '#fee2e2', fg: '#991b1b', dot: '#ef4444' },
};

// Deterministic seeded "random" — same (seed, key) always returns the same
// value in [0, 1). Used to give each reset a different-but-stable roster shake
// so the predicted-call-order list visibly shifts between simulation runs.
function seededRand(seed, key) {
  let h = (seed | 0) * 2654435761;
  for (let i = 0; i < key.length; i++) {
    h = ((h << 5) - h + key.charCodeAt(i)) | 0;
  }
  return ((h >>> 0) % 100000) / 100000;
}

// Rank the roster for a scenario at a specific date/time, accounting for prior
// step outcomes (Rolodex: people who accepted move to the back). Filters down
// to the people on the chosen approach's roster — no one else is shown. The
// optional `seed` lets each reset re-shake hours / lastCallback so the order
// shifts slightly without changing the underlying rule.
function rankRosterForScenario({ rule, scenarioDate, baselineDate, approach, history, seed = 0 }) {
  const rosterNames = APPROACH_ROSTERS[approach] || [];
  const annotated = CALLBACK_ROSTER
    .filter(p => rosterNames.includes(p.name))
    .map(p => {
      // Small per-seed perturbations: ±3h on accumulated hours and ±2 on
      // lastCallback. Static fields (hireDate, name, qualifiers) are untouched
      // so static rules still produce the same canonical order.
      const hourJitter = Math.round((seededRand(seed, p.name + ':h') - 0.5) * 6);
      const callJitter = Math.round((seededRand(seed, p.name + ':c') - 0.5) * 4);
      return {
        ...p,
        hours:        Math.max(0, p.hours + hourJitter),
        lastCallback: Math.max(0, p.lastCallback + callJitter),
        status: shiftStatusAt(p, scenarioDate, baselineDate),
      };
    });

  // Apply rolodex history: each accept pushes that person to the bottom of the
  // queue for subsequent callbacks. Accept index 0 = most recent accept.
  const acceptanceHistory = new Map();
  history.forEach((step, i) => {
    if (step.acceptedBy) acceptanceHistory.set(step.acceptedBy, i);
  });

  const sortKey = (p) => {
    const accIdx = acceptanceHistory.get(p.name);
    if (rule.ruleType === 'rolodex' && accIdx != null) return [1, accIdx];
    if (rule.ruleType === 'turns'    && accIdx != null) return [1, accIdx];
    if (rule.ruleType === 'hours' || !rule.ruleType) return [0, p.hours];
    if (rule.ruleType === 'turns')      return [0, 0];
    if (rule.ruleType === 'hire_date')  return [0, new Date(p.hireDate).getTime()];
    if (rule.ruleType === 'employee_id') return [0, p.name];
    if (rule.ruleType === 'random')      return [0, seededRand(seed + history.length, p.name)];
    return [0, p.hours];
  };

  return annotated.sort((a, b) => {
    if (a.status.available !== b.status.available) return a.status.available ? -1 : 1;
    const [ag, av] = sortKey(a), [bg, bv] = sortKey(b);
    if (ag !== bg) return ag - bg;
    if (typeof av === 'string') return av.localeCompare(bv);
    return av - bv;
  });
}

// ── SimulatorView ────────────────────────────────────────────────────────────
function SimulatorView({ seed, onBack }) {
  // Pull the full rule list from the App so the user can swap rules from inside
  // the simulator. Falls back to an empty list if RULES_DATA isn't yet exposed.
  const availableRules = (window.RULES_DATA && window.RULES_DATA.length > 0) ? window.RULES_DATA : [];

  // Default to the seeded rule (when launched from the rule builder) or the
  // first existing rule otherwise.
  const findSeedRuleId = () => {
    if (seed?.form?.ruleName) {
      const match = availableRules.find(r => r.name === seed.form.ruleName || r.config?.ruleName === seed.form.ruleName);
      if (match) return match.id;
    }
    return availableRules[0]?.id || null;
  };
  const [selectedRuleId, setSelectedRuleId] = useSimSt(findSeedRuleId);

  const activeRule = availableRules.find(r => r.id === selectedRuleId) || (seed?.form ? { id: 'in-progress', name: seed.form.ruleName || 'In-progress rule', config: seed.form } : null);
  const ruleForm   = activeRule?.config || activeRule || { ruleType: 'hours', ruleAffects: 'all', selectedApproaches: [], ruleName: 'New Rule' };

  // Default approach: first approach the selected rule covers, or 'Firefighter 2'.
  const seededApproach = (ruleForm.ruleAffects === 'selected' && ruleForm.selectedApproaches?.length)
    ? ruleForm.selectedApproaches[0]
    : 'Firefighter 2';

  const baselineDate = useSimMemo(() => new Date(2026, 4, 19, 8, 0, 0), []);

  const [startDate, setStartDate] = useSimSt(new Date(baselineDate.getTime() + 86400000));
  const [duration, setDuration]   = useSimSt(24);
  const [deadline, setDeadline]   = useSimSt(new Date(baselineDate.getTime() + 14400000));
  const [waitMin, setWaitMin]     = useSimSt(0);
  const [positions, setPositions] = useSimSt(1);
  const [approach, setApproach]   = useSimSt(seededApproach);
  const [stepHistory, setStepHistory] = useSimSt([]);
  const [overridePick, setOverridePick] = useSimSt('');
  // simulationSeed shakes the predicted-call-order slightly each reset so the
  // ranking visibly changes between runs even when the rule itself doesn't.
  const [simulationSeed, setSimulationSeed] = useSimSt(() => Math.floor(Math.random() * 100000));
  const [chat, setChat] = useSimSt(() => {
    // Lead with a quick summary of the rule the user pulled up so the preview
    // matches the rule-edit experience.
    const summary = (window.summarizeRule && activeRule)
      ? window.summarizeRule(activeRule)
      : '';
    const intro = summary
      ? `Here's a quick summary of "${activeRule?.name || 'this rule'}":\n\n${summary}\n\nUse the chips below to ask scenario questions, or kick off a callback on the right.`
      : `Welcome to Preview Mode. I'll run "${activeRule?.name || 'this rule'}" against a hypothetical callback for the chosen approach. Use the chips below to ask scenario questions, or kick off a callback on the right.`;
    return [{ role: 'ai', text: intro }];
  });
  const [chatInput, setChatInput] = useSimSt('');
  // Auto-scroll the scenario-assistant thread to the bottom whenever a new
  // message appears (typically after a quick-prompt chip click).
  const simChatRef = useSimRef(null);
  useSimEffect(() => {
    const el = simChatRef.current;
    if (el) el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
  }, [chat]);

  const MAX_STEPS = 7;
  const currentStepIdx = stepHistory.length;
  const isFinished     = currentStepIdx >= MAX_STEPS;

  const activeDate = useSimMemo(() => new Date(startDate.getTime() + currentStepIdx * 86400000), [startDate, currentStepIdx]);

  const ranking = useSimMemo(() => rankRosterForScenario({
    rule: ruleForm, scenarioDate: activeDate, baselineDate, approach, history: stepHistory, seed: simulationSeed,
  }), [ruleForm, activeDate, baselineDate, approach, stepHistory, simulationSeed]);

  // For movement indicators: compute the ranking that *was* shown at the start
  // of the previous step (i.e. before that step's outcome was applied).
  const previousRanking = useSimMemo(() => {
    if (stepHistory.length === 0) return null;
    const prevDate    = new Date(startDate.getTime() + (stepHistory.length - 1) * 86400000);
    const prevHistory = stepHistory.slice(0, -1);
    return rankRosterForScenario({ rule: ruleForm, scenarioDate: prevDate, baselineDate, approach, history: prevHistory, seed: simulationSeed });
  }, [ruleForm, baselineDate, approach, stepHistory, startDate, simulationSeed]);

  const eligible = ranking.filter(p => p.status.available);

  const autoSimulate = () => {
    if (eligible.length === 0) return;
    if (eligible.length === 1) {
      setStepHistory(h => [...h, { date: activeDate, attempts: [{ name: eligible[0].name, outcome: 'accepted' }], acceptedBy: eligible[0].name }]);
      return;
    }
    // Randomize how many people decline before someone accepts. Weighted to
    // favor "top accepts immediately" or "one decline then accept" so the
    // chain still feels rule-driven, with occasional longer fallouts to make
    // the preview feel like a real dispatch.
    const weights = [0.35, 0.4, 0.15, 0.08, 0.02]; // 0, 1, 2, 3, 4 declines
    const r = Math.random();
    let declineCount = 0, cum = 0;
    for (let i = 0; i < weights.length; i++) {
      cum += weights[i];
      if (r <= cum) { declineCount = i; break; }
    }
    declineCount = Math.min(declineCount, eligible.length - 1);
    const attempts = [];
    for (let i = 0; i < declineCount; i++) {
      attempts.push({ name: eligible[i].name, outcome: 'declined' });
    }
    const accepter = eligible[declineCount];
    attempts.push({ name: accepter.name, outcome: 'accepted' });
    setStepHistory(h => [

          random:      `${top.name} drew the highest random ranking this cycle.`,

        };
        return reasonByType[ruleForm.ruleType] || `${top.name} is first per the rule's ranking factor (${ruleForm.ruleType || 'hours'}).`;
      }
      if (chip === 'What if they decline?') {
        if (eligible.length < 2) return `Only ${eligible.length} available person right now — if they decline, the callback would end unfilled.`;
        return `If ${eligible[0].name} declines, the next call goes to ${eligible[1].name} (${eligible[1].hours}h, ${eligible[1].station}). The rule's decline behavior ("${ruleForm.declineAction || 'not set'}") would then update ${eligible[0].name}'s standing.`;
      }
      if (chip === 'Who is on shift today?') {
        const onShift = ranking.filter(p => p.status.code === 'on-shift');
        return `Today (platoon ${platoonForDay(daysBetween(baselineDate, activeDate))}): ${onShift.map(p => p.name).join(', ') || '— no one on this approach is on-shift today.'}`;
      }
      if (chip === 'Run a new callback') {
        if (isFinished) return "You've hit the 7-callback limit. Reset to run more.";
        autoSimulate();
        return `Ran callback #${currentStepIdx + 1}. Check the chain on the right — accepted employees will move on the next callback per the rule.`;
      }
      return `Hmm, not sure I follow. Try one of the suggestion chips, or describe the situation.`;
    })();
    setChat(h => [...h, { role: 'user', text: chip }, { role: 'ai', text: ai }]);
  };

  const sendFreeform = () => {
    const t = chatInput.trim();
    if (!t) return;
    handleChip(t);
    setChatInput('');
  };

  const chips = [
    'New scenario',
    eligible.length > 0 ? `Why is ${eligible[0].name} first?` : 'Why is no one available?',
    'What if they decline?',
    'Who is on shift today?',
    'Run a new callback',
  ];

  // ── Render ──
  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: '#F4F5F7', overflow: 'hidden', position: 'relative' }}>
      {/* Top banner mimicking the production "Add new CallBacks" header */}

        </button>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.7)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <h2 style={{ margin: 0, font: '600 19px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)' }}>Preview Mode — Rule Simulator</h2>

          Reset simulation

            <div style={{ display: 'flex', alignItems: 'center', gap: 0, marginBottom: 12, paddingBottom: 10, borderBottom: '1px dashed rgba(0,0,0,.08)' }}>

// Movement indicator like a music chart: shows ↑ / ↓ / — based on how a person's
// rank changed since the previous callback step.
function MovementArrow({ delta, hasPrev }) {
  if (!hasPrev) return <span style={{ width: 14, flex: 'none' }} />;
  if (delta === 0) {
    return <span style={{ width: 14, flex: 'none', color: 'rgba(0,0,0,.3)', font: '700 13px/1 Inter,sans-serif', textAlign: 'center' }}>—</span>;
  }
  const up = delta > 0;
  const color = up ? '#158444' : '#D83E38';
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 1, color, flex: 'none', minWidth: 18 }}>
      <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style={{ transform: up ? 'rotate(0)' : 'rotate(180deg)' }}>
        <path d="M12 4l8 10h-5v6h-6v-6H4z"/>
      </svg>
      <span style={{ font: '700 10px/1 Inter,sans-serif' }}>{Math.abs(delta)}</span>
    </span>
  );
}

// ── Tiny helpers + presentational sub-components ──
const selectStyle = { height: 34, padding: '0 32px 0 10px', border: '1px solid rgba(0,0,0,.18)', borderRadius: 5, font: '400 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.9)', background: '#fff', cursor: 'pointer', outline: 'none', appearance: 'none', backgroundImage: "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23888' stroke-width='1.4' fill='none' stroke-linecap='round'/></svg>\")", backgroundRepeat: 'no-repeat', backgroundPosition: 'right 10px center' };
const inputStyle  = { height: 34, padding: '0 10px', border: '1px solid rgba(0,0,0,.18)', borderRadius: 5, font: '400 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.9)', background: '#fff', outline: 'none' };

function ruleTypeLabel(t) {
  return { hours: 'Hours Based', rolodex: 'Standard Rolodex', turns: 'Accumulating Rolodex', hire_date: 'Seniority', employee_id: 'Employee ID', random: 'Random / Lottery' }[t] || 'Custom';
}

function formatDate(d) {
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day   = String(d.getDate()).padStart(2, '0');
  const year  = d.getFullYear();
  let hr = d.getHours(); const min = String(d.getMinutes()).padStart(2, '0');
  const ampm = hr >= 12 ? 'PM' : 'AM';
  hr = hr % 12 || 12;
  return `${month}/${day}/${year} ${hr}:${min} ${ampm}`;
}

function SimSection({ icon, title, children }) {
  const iconPaths = {
    clock:   <><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></>,
    scales:  <><path d="M12 4v16M5 7h14"/><path d="M5 7l-2 6a3 3 0 006 0zm14 0l-2 6a3 3 0 006 0z"/></>,
    filter:  <><path d="M3 4h18l-7 9v7l-4-2v-5z"/></>,
    sparkle: <><path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></>,
  };
  return (
    <div style={{ background: '#fff', border: '1px solid rgba(0,0,0,.08)', borderRadius: 8, padding: '12px 16px', marginBottom: 12, boxShadow: '0 1px 3px rgba(28,48,74,.04)' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.5)" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" style={{ flex: 'none' }}>{iconPaths[icon]}</svg>
        <span style={{ font: '600 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.9)' }}>{title}</span>
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>{children}</div>
    </div>
  );
}

function SimRow({ label, children }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 10, minHeight: 32 }}>
      <span style={{ width: 110, font: '400 12.5px/1.3 Inter,sans-serif', color: 'rgba(0,0,0,.6)', flex: 'none' }}>{label}</span>
      <div style={{ flex: 1, display: 'flex', alignItems: 'center', gap: 5, flexWrap: 'nowrap', minWidth: 0 }}>{children}</div>
    </div>
  );
}

function DateTimeInputs({ date, onDateChange }) {
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day   = String(date.getDate()).padStart(2, '0');
  const year  = date.getFullYear();
  let hr12 = date.getHours();
  const ampm = hr12 >= 12 ? 'PM' : 'AM';
  hr12 = hr12 % 12 || 12;
  const min = date.getMinutes();
  // Compact widths so the date + hour + minute + AM/PM fit on a single line.
  const tightSelect = { ...selectStyle, padding: '0 22px 0 8px', backgroundPosition: 'right 6px center' };
  return (
    <>
      <input value={`${month}/${day}/${year}`} readOnly style={{ ...inputStyle, width: 104, padding: '0 8px' }} />
      <select value={hr12} onChange={e => {
        const newHr12 = Number(e.target.value);
        const newH24 = (ampm === 'PM' ? (newHr12 === 12 ? 12 : newHr12 + 12) : (newHr12 === 12 ? 0 : newHr12));
        const next = new Date(date); next.setHours(newH24); onDateChange(next);
      }} style={{ ...tightSelect, width: 54 }}>
        {Array.from({ length: 12 }, (_, i) => i + 1).map(h => <option key={h} value={h}>{h}</option>)}
      </select>
      <select value={String(min).padStart(2, '0')} onChange={e => { const next = new Date(date); next.setMinutes(Number(e.target.value)); onDateChange(next); }} style={{ ...tightSelect, width: 58 }}>
        {[0,15,30,45].map(m => <option key={m} value={String(m).padStart(2,'0')}>{String(m).padStart(2,'0')}</option>)}
      </select>
      <select value={ampm} onChange={e => {
        const nextAmpm = e.target.value;
        const newH24 = (nextAmpm === 'PM' ? (hr12 === 12 ? 12 : hr12 + 12) : (hr12 === 12 ? 0 : hr12));
        const next = new Date(date); next.setHours(newH24); onDateChange(next);
      }} style={{ ...tightSelect, width: 60 }}>
        <option>AM</option><option>PM</option>
      </select>
    </>
  );
}

Object.assign(window, { SimulatorView });
</script>

                  const clickable = !isArchived && !!r.config;
                  return (
                    <div key={r.id}
                      onMouseEnter={() => setHoveredRow(rowKey)}
                      onMouseLeave={() => setHoveredRow(null)}
                      onClick={() => clickable && onStart?.({ existingRule: r })}
                      style={{

                      }}>
                      {isArchived && (

                        </div>
                      )}
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 6, flexWrap: 'wrap', marginBottom: 3 }}>
                          <span style={{ font: '600 13.5px/1.3 Inter,sans-serif', color: isArchived ? 'rgba(24,39,58,.52)' : 'rgba(24,39,58,.94)' }}>{r.name}</span>
                          {r.aiCreated && <AIBadge />}
                          {r.isNew && (
                            <span style={{
                              display: 'inline-flex', alignItems: 'center', gap: 3,
                              height: 18, padding: '0 7px',
                              borderRadius: 9,
                              background: 'linear-gradient(135deg, #16A34A, #15803D)',
                              color: '#fff',
                              font: '700 10px/1 Inter,sans-serif',
                              textTransform: 'uppercase', letterSpacing: '.06em',
                              whiteSpace: 'nowrap', flexShrink: 0,
                              boxShadow: '0 1px 3px rgba(21,128,61,.35)',
                            }}>New</span>
                          )}
                        </div>
                        <div style={{ font: '400 11.5px/1.4 Inter,sans-serif', color: 'rgba(0,0,0,.36)' }}>{r.desc}</div>
                      </div>
                      {clickable && hoveredRow === rowKey && (
                        <div style={{ flex: 'none', display: 'inline-flex', alignItems: 'center', gap: 4, paddingTop: 2, font: '600 11px/1 Inter,sans-serif', color: '#0271CE' }}>
                          Edit

                        </div>
                      )}
                      {isArchived && r.archivedDate && (
                        <div style={{ font: '400 11px/1 Inter,sans-serif', color: 'rgba(0,0,0,.28)', flex: 'none', whiteSpace: 'nowrap', paddingTop: 2 }}>
                          Archived {r.archivedDate}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>

          </div>
        </div>

      </div>
      )}
    </div>
  );
}
