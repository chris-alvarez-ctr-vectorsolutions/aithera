<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CallBack — Rules Engine</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  :root {
    --lumo-primary-color: #0271CE;
    --lumo-header-text-color: rgba(24,39,58,.94);
    --lumo-body-text-color: rgba(0,0,0,.87);
    --lumo-secondary-text-color: rgba(0,0,0,.6);
    --lumo-error-color: #D83E38;
    --lumo-success-color: #158444;
    --lumo-warning-color: #E0782E;
    --lumo-font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  html, body { height: 100%; margin: 0; }
  body { background: #F4F5F7; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
  button { font-family: inherit; }
  select { font-family: inherit; }
  input  { font-family: inherit; }

  @keyframes cbPulse {
    0%,100% { opacity: 1; }
    50%     { opacity: .35; }
  }
  @keyframes cbToast {
    from { transform: translateY(6px); opacity: 0; }
    to   { transform: translateY(0);   opacity: 1; }
  }
  @keyframes cbSlideIn {
    from { transform: translateY(6px); opacity: 0; }
    to   { transform: translateY(0);   opacity: 1; }
  }
  @keyframes fieldReveal {
    from { transform: translateY(8px); opacity: 0; }
    to   { transform: translateY(0);   opacity: 1; }
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(0,0,0,.18); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
<div id="app"></div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>


<!-- =====================================================================
     PRIMITIVES
     ===================================================================== -->
<script type="text/babel">
/* global React */
const { useState } = React;

const ICONS = {
  search:    <path d="M15.89 14.48l3.15 3.15c.38.38.38 1-.01 1.4-.39.39-1.01.39-1.4 0l-3.15-3.15a6 6 0 1 1 1.41-1.4zM11 15.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9z"/>,
  check:     <path d="M7.5 11.7l-1.3-1.3a1 1 0 0 0-1.4 1.4L9 16a1 1 0 0 0 1.4 0l8.3-8.3a1 1 0 0 0-1.4-1.4L9.7 14z"/>,
  cross:     <path d="M6.4 6.4l11.2 11.2M17.6 6.4L6.4 17.6" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" fill="none"/>,
  plus:      <path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" fill="none"/>,
  angleDown: <path d="M7 10l5 5 5-5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
  bell:      <path d="M16.99 16.49v-4.5a5 5 0 0 0-10 0v4.5L5 18.5h14zM10 20h4a2 2 0 0 1-4 0z"/>,
  user:      <path d="M12 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 1.5c-3.86 0-7 2.26-7 5.5h14c0-3.24-3.14-5.5-7-5.5z"/>,
  cog:       <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8 3.5l-1.5-.4-.5-1.1.8-1.4-1.7-1.7-1.4.8-1.1-.4-.4-1.5h-2.4l-.4 1.5-1.1.4-1.4-.8L6.2 8.6l.8 1.4-.5 1.1-1.5.4V14l1.5.4.5 1.1-.8 1.4 1.7 1.7 1.4-.8 1.1.4.4 1.5h2.4l.4-1.5 1.1-.4 1.4.8 1.7-1.7-.8-1.4.5-1.1 1.5-.4z"/>,
  home:      <path d="M4 20V8l8-4 8 4v12h-5v-7h-6v7z"/>,
  grid:      <path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/>,
  chart:     <path d="M4 20h16v-2H4v2zM4 4v10l4-3 3 4 4-5 5 4V4H4z"/>,
  edit:      <path d="M14.06 4.94l5 5-9.54 9.54-5 .47.47-5zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75z"/>,
  trash:     <path d="M8 7V4h8v3h4v2h-1v12H5V9H4V7h4zm2-1h4V5h-4v1zM7 9v10h10V9H7z"/>,
  ellipsis:  <g><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></g>,
  menu:      <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/>,
  error:     <path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm1 11h-2V9h2v6zm0 3h-2v-2h2v2z"/>,
  filter:    <path d="M4 5h16l-6 8v5l-4 2v-7z"/>,
};

function Icon({ name, size = 18, color = 'currentColor', style }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={color} style={{ flex: 'none', ...style }}>
      {ICONS[name] || null}
    </svg>
  );
}

function Button({ variant = 'secondary', color = 'default', size = 'm', icon, children, onClick, disabled, style }) {
  const palette = {
    default:     { fg: '#0271CE', bd: '#0271CE' },
    destructive: { fg: '#D83E38', bd: '#D83E38' },
    contrast:    { fg: '#192434', bd: 'rgba(0,0,0,.3)' },
  }[color];
  const h = size === 's' ? 30 : 36;
  const styles = {
    primary:   { background: color === 'default' ? '#0271CE' : color === 'destructive' ? '#D83E38' : '#192434', color: '#fff', border: '1px solid transparent' },
    secondary: { background: '#fff', color: palette.fg, border: `1px solid ${palette.bd}` },
    tertiary:  { background: 'transparent', color: palette.fg, border: '1px solid transparent' },
  }[variant];
  return (
    <button onClick={onClick} disabled={disabled} style={{
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 6,
      height: h, padding: icon && !children ? 0 : '0 14px', width: icon && !children ? h : 'auto',
      borderRadius: 4, font: '500 14px/1 Inter,sans-serif', cursor: disabled ? 'not-allowed' : 'pointer',
      opacity: disabled ? 0.5 : 1, transition: 'background .15s, opacity .15s', ...styles, ...style,
    }}>
      {icon && <Icon name={icon} size={16} />}
      {children}
    </button>
  );
}

function TextField({ label, value, onChange, type = 'text', placeholder, error, helper, style }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', ...style }}>
      {label && <label style={{ font: '500 13px/1.3 Inter,sans-serif', color: 'rgba(24,39,58,.94)', marginBottom: 4 }}>{label}</label>}
      <input type={type} value={value ?? ''} onChange={e => onChange?.(e.target.value)} placeholder={placeholder} style={{
        height: 36, padding: '0 12px', border: `1px solid ${error ? '#D83E38' : 'rgba(0,0,0,.3)'}`, borderRadius: 4,
        background: '#fff', font: '400 16px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)', outline: 'none',
      }}
        onFocus={e => !error && (e.target.style.borderColor = '#0271CE')}
        onBlur={e  => !error && (e.target.style.borderColor = 'rgba(0,0,0,.3)')}
      />
      {error  ? <p style={{ font: '400 13px/1.3 Inter,sans-serif', color: '#CA150C', margin: '4px 0 0' }}>{error}</p>
              : helper && <p style={{ font: '400 13px/1.3 Inter,sans-serif', color: 'rgba(0,0,0,.6)', margin: '4px 0 0' }}>{helper}</p>}
    </div>
  );
}

function Badge({ color = 'contrast', children }) {
  const c = {
    primary:  { bg: 'rgba(2,113,206,.1)',   fg: '#0271CE' },
    success:  { bg: 'rgba(21,132,68,.1)',   fg: '#158444' },
    error:    { bg: 'rgba(216,62,56,.1)',   fg: '#CA150C' },
    warning:  { bg: 'rgba(224,120,46,.1)',  fg: '#E0782E' },
    contrast: { bg: 'rgba(28,52,84,.08)',   fg: '#192434' },
  }[color];
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 4,
      height: 22, padding: '0 10px', borderRadius: 11,
      background: c.bg, color: c.fg, font: '500 12px/1 Inter,sans-serif',
    }}>
      {color !== 'primary' && color !== 'contrast' && <span style={{ width: 6, height: 6, borderRadius: '50%', background: 'currentColor' }} />}
      {children}
    </span>
  );
}

const USER_COLORS = ['#195049','#1A4C61','#4A2253','#693C12','#612018','#1C375A','#3D4543'];
function Avatar({ name = '', size = 32, colorIndex }) {
  const idx = colorIndex ?? (name.charCodeAt(0) % USER_COLORS.length);
  const initials = name.split(' ').map(s => s[0]).join('').slice(0,2).toUpperCase();
  return (
    <div style={{
      width: size, height: size, borderRadius: '50%', background: USER_COLORS[idx],
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
      color: '#fff', font: `600 ${Math.round(size * 0.38)}px/1 Inter,sans-serif`, flex: 'none',
    }}>{initials}</div>
  );
}

function Checkbox({ checked, onChange, indeterminate }) {
  return (
    <span onClick={() => onChange?.(!checked)} style={{
      width: 16, height: 16, borderRadius: 4, cursor: 'pointer',
      border: `2px solid ${checked || indeterminate ? '#0271CE' : 'rgba(0,0,0,.3)'}`,
      background: checked || indeterminate ? '#0271CE' : '#fff',
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flex: 'none',
    }}>
      {checked && <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4l3 3 5-6" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>}
      {indeterminate && !checked && <span style={{ width: 8, height: 2, background: '#fff' }} />}
    </span>
  );
}

Object.assign(window, { Icon, Button, TextField, Badge, Avatar, Checkbox, USER_COLORS });
</script>

};
const STROKE_ICONS = new Set(['check-square-o','envelope','calendar-clock','user-clock','clipboard-text','exchange','file-text','clock','list-ol']);

function OuterIcon({ name, size = 18, color }) {
  const d = OUTER_ICON_PATHS[name];
  if (!d) return <span style={{ width: size, height: size, display: 'inline-block' }} />;
  const isStroke = STROKE_ICONS.has(name);

  [
    { name: 'Hours Based Callback',   desc: 'Automatically rank employees based on hours worked. Includes callbacks accepted by the user.', iconD: 'M12 2a10 10 0 100 20A10 10 0 0012 2zm0 5v5l3 2', stroke: true },

const MOCK_EMPLOYEES = [
  { name: 'Marta Chen',       hours: 24, hireDate: '2014-03-12', lastCallback: '2 days ago',  lastShift: 'yesterday'  },
  { name: 'Priya Sharma',     hours: 28, hireDate: '2016-07-20', lastCallback: '5 days ago',  lastShift: '3 days ago' },
  { name: 'James Okonkwo',    hours: 31, hireDate: '2013-11-01', lastCallback: '1 day ago',   lastShift: '2 days ago' },
  { name: 'Kelsey Lifeguard', hours: 19, hireDate: '2019-02-14', lastCallback: '8 days ago',  lastShift: '4 days ago' },
  { name: 'Marcus Rivera',    hours: 35, hireDate: '2011-09-08', lastCallback: '3 days ago',  lastShift: '6 days ago' },
  { name: 'Dana Hollis',      hours: 22, hireDate: '2017-05-30', lastCallback: '10 days ago', lastShift: 'yesterday'  },
];

function rankEmployees(form) {
  return [...MOCK_EMPLOYEES].sort((a, b) => {
    let primary = 0;
    if (form.ruleType === 'hours') primary = a.hours - b.hours;
    else if (form.ruleType === 'hire_date') primary = new Date(a.hireDate) - new Date(b.hireDate);
    else if (form.ruleType === 'rolodex') primary = 0;
    else primary = a.hours - b.hours;
    if (primary !== 0) return primary;
    if (form.tieBreaker === 'Seniority (hire date)') return new Date(a.hireDate) - new Date(b.hireDate);
    if (form.tieBreaker === 'Last shift worked') return a.lastShift.localeCompare(b.lastShift);
    if (form.tieBreaker === 'Last callback date') return a.lastCallback.localeCompare(b.lastCallback);
    return a.name.localeCompare(b.name);
  });
}

function buildSummary(form) {
  const parts = [];
  const approachLabel = form.ruleAffects === 'all' ? 'all approaches' :
    form.selectedApproaches.length ? form.selectedApproaches.join(' & ') : 'selected approaches';
  const typeLabels = { hours: 'fewest overtime hours', turns: 'fewest turns', hire_date: 'most seniority (hire date)', rolodex: 'Rolodex rotation', custom: 'custom ranking' };
  parts.push(`Callback list for ${approachLabel} ranked by ${typeLabels[form.ruleType] || 'fewest overtime hours'}`);
  if (form.lookBack) parts[0] += ` over a ${form.lookBack}-day window`;
  if (form.tieBreaker) parts.push(`Ties broken by ${form.tieBreaker.toLowerCase()}`);
  if (form.declineAction) parts.push(`Declines: ${form.declineAction.toLowerCase()}`);
  if (form.minShift || form.maxShift) {
    const range = [form.minShift && `min ${form.minShift}h`, form.maxShift && `max ${form.maxShift}h`].filter(Boolean).join(', ');
    parts.push(`Shift filter: ${range}`);
  }
  return parts.join('. ') + '.';
}

  const summary = buildSummary(form);
  const hasDetails = form.tieBreaker || form.declineAction || form.lookBack || form.ruleAffects === 'selected';

  return (
    <div style={{ marginBottom: 0, background: 'linear-gradient(135deg, rgba(124,58,237,.06) 0%, rgba(99,102,241,.04) 100%)', border: '1px solid rgba(124,58,237,.18)', borderRadius: 10, overflow: 'hidden' }}>

          </div>
          <div style={{ font: '600 11px/1 Inter,sans-serif', color: '#7C3AED', textTransform: 'uppercase', letterSpacing: '.06em', flex: 1 }}>Rule Summary</div>
        </div>
        <div style={{ font: '400 13px/1.7 Inter,sans-serif', color: 'rgba(24,39,58,.8)' }}>
          {hasDetails ? summary : <span style={{ color: 'rgba(0,0,0,.4)', fontStyle: 'italic' }}>Answer the AI's questions to see your rule take shape…</span>}
        </div>
      </div>
      {/* Preview Ranking toggle */}
      <button onClick={() => setPreviewOpen(o => !o)}
        style={{ width: '100%', padding: '9px 16px', display: 'flex', alignItems: 'center', gap: 8, background: previewOpen ? 'rgba(124,58,237,.07)' : 'rgba(124,58,237,.03)', border: 'none', borderTop: '1px solid rgba(124,58,237,.14)', cursor: 'pointer', textAlign: 'left', transition: 'background .15s' }}
        onMouseEnter={e => { if (!previewOpen) e.currentTarget.style.background = 'rgba(124,58,237,.06)'; }}
        onMouseLeave={e => { if (!previewOpen) e.currentTarget.style.background = 'rgba(124,58,237,.03)'; }}>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={previewOpen ? '#7C3AED' : 'rgba(124,58,237,.6)'} strokeWidth="2" strokeLinecap="round" style={{ flex: 'none', transition: 'transform .2s', transform: previewOpen ? 'rotate(180deg)' : 'rotate(0deg)' }}><path d="M6 9l6 6 6-6"/></svg>
        <span style={{ font: '500 11px/1 Inter,sans-serif', color: previewOpen ? '#7C3AED' : 'rgba(124,58,237,.75)', flex: 1 }}>Preview Ranking</span>
        {!previewOpen && topEmp && (
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, font: '400 11px/1 Inter,sans-serif', color: 'rgba(0,0,0,.4)' }}>
            <span style={{ font: '600 10px/1 Inter,sans-serif', color: '#7C3AED', background: 'rgba(124,58,237,.1)', padding: '2px 5px', borderRadius: 3, textTransform: 'uppercase', letterSpacing: '.04em' }}>Next</span>
            {topEmp.name}
          </span>
        )}

function RichSelect({ value, onChange, options, placeholder }) {
  const [open, setOpen] = useState(false);
  const [dropPos, setDropPos] = useState(null);
  const ref = useRef(null);
  const btnRef = useRef(null);
  const dropRef = useRef(null);
  const selected = options.find(o => o.value === value);

  const openDrop = () => {
    if (btnRef.current) {
      const r = btnRef.current.getBoundingClientRect();
      setDropPos({ top: r.bottom + 4, left: r.left, width: r.width });
    }
    setOpen(true);
  };

  useEffect(() => {
    if (!open) return;
    const update = () => {
      if (btnRef.current) {
        const r = btnRef.current.getBoundingClientRect();
        setDropPos({ top: r.bottom + 4, left: r.left, width: r.width });
      }
    };
    const handler = (e) => {
      const inBtn  = ref.current  && ref.current.contains(e.target);
      const inDrop = dropRef.current && dropRef.current.contains(e.target);
      if (!inBtn && !inDrop) setOpen(false);
    };
    window.addEventListener('scroll', update, true);
    window.addEventListener('resize', update);
    document.addEventListener('mousedown', handler);
    return () => {
      window.removeEventListener('scroll', update, true);
      window.removeEventListener('resize', update);
      document.removeEventListener('mousedown', handler);
    };
  }, [open]);

  const dropdown = open && dropPos && ReactDOM.createPortal(
    <div ref={dropRef} style={{ position: 'fixed', top: dropPos.top, left: dropPos.left, width: dropPos.width, zIndex: 9999,
      background: '#fff', border: '1px solid rgba(0,0,0,.12)', borderRadius: 8,
      boxShadow: '0 6px 24px rgba(0,0,0,.13)', overflow: 'hidden' }}>
      {options.map((opt, i) => {
        const isSel = opt.value === value;
        return (
          <button key={opt.value}
            onClick={() => { onChange(opt.value); setOpen(false); }}
            style={{ width: '100%', padding: '10px 12px', display: 'flex', alignItems: 'center', gap: 11,
              background: isSel ? 'rgba(124,58,237,.07)' : 'transparent',
              border: 'none', borderBottom: i < options.length - 1 ? '1px solid rgba(0,0,0,.06)' : 'none',
              cursor: 'pointer', textAlign: 'left', transition: 'background .12s' }}
            onMouseEnter={e => { if (!isSel) e.currentTarget.style.background = 'rgba(124,58,237,.04)'; }}
            onMouseLeave={e => { if (!isSel) e.currentTarget.style.background = 'transparent'; }}>
            <div style={{ width: 36, height: 36, borderRadius: 8, flex: 'none',
              background: isSel ? 'rgba(124,58,237,.14)' : 'rgba(124,58,237,.08)',
              display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <i className={opt.icon} style={{ fontSize: 14, color: '#7C3AED' }} />
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ font: '600 13px/1.2 Inter,sans-serif', color: isSel ? '#7C3AED' : 'rgba(24,39,58,.94)', marginBottom: 2 }}>{opt.title}</div>
              <div style={{ font: '400 11px/1.4 Inter,sans-serif', color: 'rgba(0,0,0,.5)' }}>{opt.desc}</div>
            </div>
            {isSel && (
              <svg width="14" height="14" viewBox="0 0 24 24" fill="#7C3AED" style={{ flex: 'none' }}><path d="M9 16l-4-4 1.4-1.4L9 13.2l8.6-8.6L19 6z"/></svg>
            )}
          </button>
        );
      })}
    </div>,
    document.body
  );

  return (
    <div ref={ref} style={{ position: 'relative' }}>
      <button ref={btnRef} onClick={() => open ? setOpen(false) : openDrop()}
        style={{ width: '100%', height: 40, padding: '0 10px', display: 'flex', alignItems: 'center', gap: 10,
          border: `1px solid ${open ? '#7C3AED' : 'rgba(0,0,0,.18)'}`, borderRadius: 6,
          background: '#fff', cursor: 'pointer', outline: 'none', transition: 'border-color .15s',
          boxShadow: open ? '0 0 0 2px rgba(124,58,237,.12)' : 'none' }}>
        {selected ? <>
          <div style={{ width: 26, height: 26, borderRadius: 6, background: 'rgba(124,58,237,.1)', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none' }}>
            <i className={selected.icon} style={{ fontSize: 12, color: '#7C3AED' }} />
          </div>
          <span style={{ flex: 1, font: '500 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)', textAlign: 'left' }}>{selected.title}</span>
        </> : (
          <span style={{ flex: 1, font: '400 13px/1 Inter,sans-serif', color: 'rgba(0,0,0,.4)', textAlign: 'left' }}>{placeholder || 'Select…'}</span>
        )}
        <svg width="10" height="6" viewBox="0 0 10 6" fill="none" style={{ flex: 'none', transition: 'transform .2s', transform: open ? 'rotate(180deg)' : 'none' }}>
          <path d="M1 1l4 4 4-4" stroke="rgba(0,0,0,.45)" strokeWidth="1.4" strokeLinecap="round"/>
        </svg>
      </button>
      {dropdown}
    </div>
  );
}

function RuleBuilderView({ seed, onBack }) {
  const templateName  = seed?.template?.name || null;
  const initialPrompt = seed?.text || null;

  const [suggSetIdx, setSuggSetIdx] = useState(0);

  const flow    = FLOWS[templateName] || FLOWS.default;
  const firstAi = flow[0];
  const introAiText = 'Hi! I can help you create custom rules for ranking employees in overtime and callback shifts.\nDescribe the rule you need, or choose a suggestion below!';
  const originLabel = templateName || initialPrompt || null;
  const initMsgs = (templateName || initialPrompt) ? [
    { role: 'ai', text: introAiText },
    { role: 'origin', label: originLabel },
    { role: 'ai', text: firstAi.text, chips: firstAi.chips },
  ] : [
    { role: 'ai', text: introAiText },
    { role: 'suggestions' },
  ];

  const [messages, setMessages] = useState(initMsgs);
  const [input, setInput]       = useState('');
  const [typing, setTyping]     = useState(false);
  const [saved, setSaved]       = useState(false);
  const [cfgOpen, setCfgOpen]           = useState(true);
  const [stickyOpen, setStickyOpen]     = useState(true);
  const [customAnswer, setCustomAnswer] = useState(false);
  const [chipSelections, setChipSelections] = useState(new Set());

  const skippedCount = messages.filter(m => m.role === 'user' && m.skipped).length;

  const guessType = (name) => {
    if (!name) return 'hours';
    const n = name.toLowerCase();
    if (n.includes('hour')) return 'hours';
    if (n.includes('turn')) return 'turns';
    if (n.includes('hire') || n.includes('seniority')) return 'hire_date';
    if (n.includes('rolodex')) return 'rolodex';
    return 'custom';
  };

  const [form, setForm] = useState({
    ruleName:            templateName || (initialPrompt ? initialPrompt.slice(0, 48) : 'New Rule'),
    ruleType:            guessType(templateName || initialPrompt),
    ruleAffects:         'all',
    selectedApproaches:  [],
    callbackStatuses:    ['Dispatched', 'Accepted'],
    callbackResponses:   ['Accept', 'Decline'],
    minShift:            '',
    maxShift:            '',
    lookBack:            '',
    forecast:            '',
    tieBreaker:          '',
    declineAction:       '',
    penaltyPoints:       '',
    declineScope:        '',
    declineCooldown:     '',
    turnsCounting:       '',
    tieBreakerOrder:     '',
    rolodexReset:        '',
  });

  // Tracks which config fields have been surfaced by chat answers
  const [revealedFields, setRevealedFields] = useState(() => {
    const init = new Set(['ruleName']);
    if (templateName || initialPrompt) init.add('ruleType');
    return init;
  });

  const patchForm = (updates, opts = {}) => {
    setForm(f => ({ ...f, ...updates }));
    setRevealedFields(r => {
      const next = new Set(r);
      Object.keys(updates).forEach(k => next.add(k));
      return next;
    });
    if (opts.fromUser) {
      for (const [key, val] of Object.entries(updates)) {
        const branch = BRANCH_MAP[key]?.[val];
        if (!branch) continue;
        setMessages(m => [...m, { role: 'user', text: branch.userMsg, fromForm: true }]);
        setTyping(true);
        setTimeout(() => {
          if (branch.ai) setMessages(m => [...m, { role: 'ai', text: branch.ai.text, chips: branch.ai.chips || [] }]);
          setTyping(false);
        }, 700 + Math.random() * 300);
        break;
      }
    }
  };

  const shown = (key) => revealedFields.has(key);

  const msgEndRef    = useRef(null);
  const textareaRef  = useRef(null);
  useEffect(() => { msgEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages, typing]);

  const userMsgs    = messages.filter(m => m.role === 'user');
  // When entering from a template/prompt, flow[0] is already pre-loaded in initMsgs
  // with no user message yet, so offset by 1 to avoid repeating it.
  const flowOffset  = (templateName || initialPrompt) ? 1 : 0;
  const nextFlowIdx = userMsgs.length + flowOffset;

  const parseAndPatch = (text) => {
    const lower = text.toLowerCase();
    const updates = {};
    // Rule name
    const nameMatch = text.match(/(?:call it|name it|named?)\s+"?([^"]+)"?/i) || text.match(/"([^"]+)"/);
    if (nameMatch) updates.ruleName = nameMatch[1];
    // Rule type
    if (lower.includes('hours')) updates.ruleType = 'hours';
    else if (lower.includes('turns')) updates.ruleType = 'turns';
    else if (lower.includes('hire date') || lower.includes('seniority')) updates.ruleType = 'hire_date';
    else if (lower.includes('rolodex')) updates.ruleType = 'rolodex';
    // Approach / group — handles single or comma-joined multi-select values
    const approachNames = ['Firefighter 2','Captains','Patrol Deputy','Bay Guard','Battalion Chief','FF3'];
    if (lower.includes('all approaches') || lower.includes('all approach')) {
      updates.ruleAffects = 'all';
    } else {
      const matched = approachNames.filter(a => lower.includes(a.toLowerCase()));
      if (matched.length > 0) {
        updates.ruleAffects = 'selected';
        updates.selectedApproaches = matched;
      }
    }
    // Lookback window from chip answers like "30 days" / "14 days"
    const lbDaysM = text.match(/^(\d+)\s*days?$/i);
    if (lbDaysM) updates.lookBack = lbDaysM[1];
    // Shift lengths
    const minM = text.match(/min(?:imum)?\s*(?:shift)?\s*(?:is|:)?\s*(\d+)/i);
    if (minM) updates.minShift = minM[1];
    const maxM = text.match(/max(?:imum)?\s*(?:shift)?\s*(?:is|:)?\s*(\d+)/i);
    if (maxM) updates.maxShift = maxM[1];
    // Explicit lookback / forecast
    const lbM = text.match(/look\s*back\s*(?:of|:)?\s*(\d+)/i);
    if (lbM) updates.lookBack = lbM[1];
    const fcM = text.match(/forecast\s*(?:of|:)?\s*(\d+)/i);
    if (fcM) updates.forecast = fcM[1];
    // Tiebreaker
    if (lower.includes('seniority') || lower.includes('hire date')) updates.tieBreaker = 'Seniority (hire date)';
    else if (lower.includes('last shift')) updates.tieBreaker = 'Last shift worked';
    else if (lower.includes('last callback')) updates.tieBreaker = 'Last callback date';
    else if (lower.includes('alphabetical')) updates.tieBreaker = 'Alphabetical';
    // Decline action
    if (lower.includes('back of the list') || lower.includes('back of list') || lower.includes('move to back')) updates.declineAction = 'Move to back of list';
    else if (lower.includes('stay in position') || lower.includes('stay at')) updates.declineAction = 'Stay in position';
    else if (lower.includes('penalty')) updates.declineAction = 'Penalty points';
    // Penalty points value — chip answers like "2 points", "5 points"
    const pointsM = text.match(/^(\d+)\s*points?$/i);
    if (pointsM) updates.penaltyPoints = pointsM[1];
    // Decline scope (who it applies to)
    if (lower === 'all reasons') updates.declineScope = 'All reasons';
    else if (lower === 'voluntary only') updates.declineScope = 'Voluntary only';
    else if (lower === 'involuntary only') updates.declineScope = 'Involuntary only';
    // Re-offer cooldown
    if (lower === 'no cooldown') updates.declineCooldown = 'None';
    else if (lower === '1 hour') updates.declineCooldown = '1 hour';
    else if (lower === '4 hours') updates.declineCooldown = '4 hours';
    // Turns counting method
    if (lower === 'all turns') updates.turnsCounting = 'All turns';
    else if (lower === 'accepted only') updates.turnsCounting = 'Accepted only';
    else if (lower === 'accepted + weighted') updates.turnsCounting = 'Accepted + weighted';
    // Rolodex reset behavior
    if (lower === 'yes, reset each cycle') updates.rolodexReset = 'Reset each cycle';
    else if (lower === 'no, keep rotating') updates.rolodexReset = 'Keep rotating';
    else if (lower === 'reset manually') updates.rolodexReset = 'Manual reset';
    // Tiebreaker sort direction
    if (lower === 'a → z') updates.tieBreakerOrder = 'A → Z';
    else if (lower === 'z → a') updates.tieBreakerOrder = 'Z → A';
    else if (lower === 'more recent = higher') updates.tieBreakerOrder = 'More recent first';
    else if (lower === 'more recent = lower') updates.tieBreakerOrder = 'Older first';
    else if (lower === 'yes, longest gap first') updates.tieBreakerOrder = 'Longest gap first';
    else if (lower === 'no, most recent first') updates.tieBreakerOrder = 'Most recent first';
    else if (lower === 'yes, most senior first' || lower === 'most senior first') updates.tieBreakerOrder = 'Most senior first';
    else if (lower === 'least senior first') updates.tieBreakerOrder = 'Least senior first';
    if (Object.keys(updates).length) patchForm(updates);
  };

  const send = (text, opts = {}) => {
    const isSkip = !!opts.skip;
    if (!isSkip && !text.trim() || typing) return;
    if (!isSkip) parseAndPatch(text);
    setMessages(m => [...m.filter(msg => msg.role !== 'suggestions'), { role: 'user', text, skipped: isSkip }]);
    setInput('');
    setCustomAnswer(false);
    setTyping(true);
    setTimeout(() => {
      const nextAi = flow[nextFlowIdx];
      if (nextAi) setMessages(m => [...m, { role: 'ai', text: nextAi.text, chips: nextAi.chips }]);
      setTyping(false);
    }, 800 + Math.random() * 400);
  };

  const handleSkip = () => send('', { skip: true });

  const blankForm = {
    ruleName: 'New Rule', ruleType: 'hours', ruleAffects: 'all', selectedApproaches: [],
    callbackStatuses: ['Dispatched', 'Accepted'], callbackResponses: ['Accept', 'Decline'],
    minShift: '', maxShift: '', lookBack: '', forecast: '', tieBreaker: '', declineAction: '',
    penaltyPoints: '', declineScope: '', declineCooldown: '',
    turnsCounting: '', tieBreakerOrder: '', rolodexReset: '',
  };
  const startOver = () => {
    setMessages([{ role: 'ai', text: introAiText }, { role: 'suggestions' }]);
    setForm(blankForm);
    setInput('');
    setTyping(false);
    setSuggSetIdx(0);
    setRevealedFields(new Set());
    setChipSelections(new Set());
    setStickyOpen(true);
  };

  const selectSuggestion = (tplName) => {
    const f = FLOWS[tplName] || FLOWS.default;
    setMessages([{ role: 'user', text: tplName }, { role: 'ai', text: f[0].text, chips: f[0].chips }]);
    patchForm({ ruleName: tplName, ruleType: guessType(tplName) });
    setInput('');
  };

  const toggleArr = (arr, item) => arr.includes(item) ? arr.filter(x => x !== item) : [...arr, item];

  if (saved) {
    return (
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', background: '#F4F5F7', gap: 16 }}>
        <div style={{ width: 68, height: 68, borderRadius: '50%', background: 'linear-gradient(135deg,#7C3AED,#5B21B6)', display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 4px 20px rgba(124,58,237,.35)' }}>
          <svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M9 16l-4-4 1.4-1.4L9 13.2l8.6-8.6L19 6z"/></svg>
        </div>
        <div style={{ font: '600 22px/1.2 Inter,sans-serif', color: 'rgba(24,39,58,.94)' }}>Rule saved!</div>
        <div style={{ font: '400 15px/1.6 Inter,sans-serif', color: 'rgba(0,0,0,.6)', textAlign: 'center', maxWidth: 360 }}>
          <b>{form.ruleName}</b> is now active and will be applied to the next callback that matches your configuration.
        </div>
        <button onClick={onBack} style={{ marginTop: 8, height: 42, padding: '0 28px', background: 'linear-gradient(135deg,#7C3AED,#5B21B6)', color: '#fff', border: 'none', borderRadius: 8, font: '500 15px/1 Inter,sans-serif', cursor: 'pointer', boxShadow: '0 2px 10px rgba(124,58,237,.35)' }}>Back to Dashboard</button>
      </div>
    );
  }

  const sharedHeader = (
    <div style={{ padding: '20px 32px', background: 'linear-gradient(135deg, #7C3AED 0%, #6D28D9 50%, #5B21B6 100%)', position: 'relative', overflow: 'hidden', flex: 'none' }}>
      <div style={{ position: 'absolute', top: -30, right: 60, width: 110, height: 110, borderRadius: '50%', background: 'rgba(167,139,250,.22)', filter: 'blur(28px)', pointerEvents: 'none' }} />
      <div style={{ position: 'absolute', bottom: -18, left: 100, width: 85, height: 85, borderRadius: '50%', background: 'rgba(196,181,253,.16)', filter: 'blur(22px)', pointerEvents: 'none' }} />
      <div style={{ display: 'flex', alignItems: 'center', gap: 16, position: 'relative' }}>
        <button onClick={onBack} style={{ display: 'inline-flex', alignItems: 'center', gap: 5, background: 'rgba(255,255,255,.15)', border: '1px solid rgba(255,255,255,.25)', borderRadius: 6, padding: '6px 12px', color: '#fff', font: '500 13px/1 Inter,sans-serif', cursor: 'pointer', flex: 'none' }}>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          Back
        </button>
        <div style={{ width: 1, height: 26, background: 'rgba(255,255,255,.25)' }} />
        <div style={{ width: 46, height: 46, borderRadius: 12, background: 'rgba(255,255,255,.18)', border: '1px solid rgba(255,255,255,.28)', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none', backdropFilter: 'blur(4px)' }}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>
        </div>
        <div>
          <div style={{ font: '700 18px/1.2 Inter,sans-serif', color: '#fff', letterSpacing: '-.01em' }}>Callback Ranking Rules Engine</div>
          <div style={{ font: '400 13px/1.3 Inter,sans-serif', color: 'rgba(255,255,255,.72)', marginTop: 2 }}>Build intelligent callback rules with AI</div>
        </div>
      </div>
    </div>
  );

  return (
    <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>

      {/* ── LEFT: AI Chat ── */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: '#fff', overflow: 'hidden', minWidth: 0 }}>

        {sharedHeader}

        {/* Message thread */}
        <div style={{ flex: 1, overflowY: 'auto', padding: '36px 40px', display: 'flex', flexDirection: 'column', gap: 36 }}>

          {messages.map((m, i) => (
            <div key={i}>
              {m.role === 'ai' && (
                <div style={{ display: 'flex', gap: 14, alignItems: 'flex-start' }}>

                    <div style={{ font: '400 15px/1.75 Inter,sans-serif', color: 'rgba(24,39,58,.87)', whiteSpace: 'pre-wrap' }}>

                            <button onClick={() => { setCustomAnswer(true); setTimeout(() => textareaRef.current?.focus(), 50); }}

                              onMouseEnter={e => { e.currentTarget.style.borderColor = 'rgba(124,58,237,.55)'; e.currentTarget.style.color = '#7C3AED'; }}
                              onMouseLeave={e => { e.currentTarget.style.borderColor = 'rgba(124,58,237,.25)'; e.currentTarget.style.color = 'rgba(0,0,0,.42)'; }}>
                              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4z"/></svg>
                              Something else
                            </button>
                            <button onClick={handleSkip}
                              style={{ height: 26, padding: '0 2px', background: 'none', border: 'none', color: 'rgba(0,0,0,.32)', font: '400 13px/1 Inter,sans-serif', cursor: 'pointer', textDecoration: 'underline', textDecorationStyle: 'dotted', textUnderlineOffset: 3, marginTop: 1 }}
                              onMouseEnter={e => e.currentTarget.style.color = 'rgba(0,0,0,.58)'}
                              onMouseLeave={e => e.currentTarget.style.color = 'rgba(0,0,0,.32)'}>
                              Skip for now
                            </button>
                          </>
                        ) : m.freeform ? (
                          <FreeformChips chips={m.chips} onSend={send} onSkip={handleSkip} />
                        ) : (
                          /* ── Single-select mode ── */
                          <>
                            {m.chips.map(c => (
                              <button key={c} onClick={() => send(c)}
                                style={{ height: 36, padding: '0 20px', borderRadius: 20, border: '1.5px solid rgba(124,58,237,.3)', background: 'rgba(124,58,237,.05)', color: '#7C3AED', font: '500 14px/1 Inter,sans-serif', cursor: 'pointer', transition: 'all .15s', whiteSpace: 'nowrap' }}
                                onMouseEnter={e => { e.currentTarget.style.background = 'rgba(124,58,237,.13)'; e.currentTarget.style.borderColor = '#7C3AED'; }}
                                onMouseLeave={e => { e.currentTarget.style.background = 'rgba(124,58,237,.05)'; e.currentTarget.style.borderColor = 'rgba(124,58,237,.3)'; }}
                              >{c}</button>
                            ))}
                            <button onClick={() => { setCustomAnswer(true); setTimeout(() => textareaRef.current?.focus(), 50); }}
                              style={{ height: 36, padding: '0 20px', borderRadius: 20, border: '1.5px dashed rgba(124,58,237,.25)', background: 'transparent', color: 'rgba(0,0,0,.42)', font: '500 14px/1 Inter,sans-serif', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 8, transition: 'all .15s', whiteSpace: 'nowrap' }}
                              onMouseEnter={e => { e.currentTarget.style.borderColor = 'rgba(124,58,237,.55)'; e.currentTarget.style.color = '#7C3AED'; }}
                              onMouseLeave={e => { e.currentTarget.style.borderColor = 'rgba(124,58,237,.25)'; e.currentTarget.style.color = 'rgba(0,0,0,.42)'; }}>
                              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4z"/></svg>
                              Something else
                            </button>
                            <button onClick={handleSkip}
                              style={{ height: 26, padding: '0 2px', background: 'none', border: 'none', color: 'rgba(0,0,0,.32)', font: '400 13px/1 Inter,sans-serif', cursor: 'pointer', textDecoration: 'underline', textDecorationStyle: 'dotted', textUnderlineOffset: 3, marginTop: 1 }}
                              onMouseEnter={e => e.currentTarget.style.color = 'rgba(0,0,0,.58)'}
                              onMouseLeave={e => e.currentTarget.style.color = 'rgba(0,0,0,.32)'}>
                              Skip for now
                            </button>
                          </>
                        )}
                      </div>
                    )}
                  </div>
                </div>
              )}
              {m.role === 'user' && (
                m.skipped ? (
                  <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
                    <div style={{ display: 'inline-flex', alignItems: 'center', gap: 7, padding: '7px 16px', borderRadius: 20, background: 'rgba(0,0,0,.04)', border: '1px solid rgba(0,0,0,.1)', color: 'rgba(0,0,0,.4)', font: '400 13px/1 Inter,sans-serif' }}>
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                      Skipped for now
                    </div>
                  </div>
                ) : (
                  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4 }}>
                    <div style={{ maxWidth: '68%', padding: '10px 18px', borderRadius: '18px 18px 4px 18px', background: 'rgba(124,58,237,.09)', color: '#4C1D95', font: '500 14px/1.6 Inter,sans-serif', border: '1.5px solid rgba(124,58,237,.22)' }}>
                      {m.text}
                    </div>
                    {m.fromForm && (
                      <div style={{ display: 'inline-flex', alignItems: 'center', gap: 4, font: '400 10px/1 Inter,sans-serif', color: 'rgba(0,0,0,.35)' }}>
                        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        edited in panel
                      </div>
                    )}
                  </div>
                )
              )}
              {m.role === 'origin' && (
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 6 }}>
                  <div style={{ font: '500 11px/1 Inter,sans-serif', color: 'rgba(0,0,0,.35)', letterSpacing: '.04em', textTransform: 'uppercase' }}>You started with</div>
                  <div style={{ display: 'inline-flex', alignItems: 'center', gap: 10, padding: '10px 14px', background: 'linear-gradient(135deg, rgba(124,58,237,.08), rgba(99,102,241,.05))', border: '1.5px solid rgba(124,58,237,.2)', borderRadius: '16px 16px 4px 16px' }}>
                    <div style={{ width: 28, height: 28, borderRadius: 7, background: 'linear-gradient(135deg,#7C3AED,#5B21B6)', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none', boxShadow: '0 2px 6px rgba(124,58,237,.3)' }}>
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>
                    </div>
                    <span style={{ font: '600 14px/1.3 Inter,sans-serif', color: 'rgba(24,39,58,.9)' }}>{m.label}</span>
                  </div>
                </div>
              )}
              {m.role === 'suggestions' && (
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 8 }}>
                  <div style={{ font: '400 12px/1 Inter,sans-serif', color: 'rgba(0,0,0,.45)', marginBottom: 2 }}>Help me build a rule based on:</div>
                  {SUGGESTION_SETS[suggSetIdx].map((s, si) => (
                    <button key={si} onClick={() => selectSuggestion(s.name)}
                      style={{ textAlign: 'left', background: '#fff', border: '1.5px solid rgba(0,0,0,.1)', borderRadius: 10, padding: '11px 14px', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 12, transition: 'border-color .15s, box-shadow .15s', boxShadow: '0 1px 3px rgba(0,0,0,.05)' }}
                      onMouseEnter={e => { e.currentTarget.style.borderColor = 'rgba(124,58,237,.35)'; e.currentTarget.style.boxShadow = '0 3px 10px rgba(124,58,237,.12)'; }}
                      onMouseLeave={e => { e.currentTarget.style.borderColor = 'rgba(0,0,0,.1)'; e.currentTarget.style.boxShadow = '0 1px 3px rgba(0,0,0,.05)'; }}
                    >
                      <div style={{ width: 32, height: 32, borderRadius: 8, background: 'linear-gradient(135deg, #3B82F6 0%, #2563EB 100%)', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none', boxShadow: '0 1px 4px rgba(59,130,246,.28)' }}>
                        <svg width="15" height="15" viewBox="0 0 24 24" fill={s.stroke ? 'none' : '#fff'} stroke={s.stroke ? '#fff' : 'none'} strokeWidth={s.stroke ? '1.8' : '0'} strokeLinecap="round" strokeLinejoin="round"><path d={s.iconD}/></svg>
                      </div>
                      <div>
                        <div style={{ font: '600 13px/1.2 Inter,sans-serif', color: 'rgba(24,39,58,.94)', marginBottom: 3 }}>{s.name}</div>
                        <div style={{ font: '400 11px/1.4 Inter,sans-serif', color: 'rgba(0,0,0,.5)' }}>{s.desc}</div>
                      </div>
                    </button>
                  ))}
                  <button onClick={() => setSuggSetIdx(idx => (idx + 1) % SUGGESTION_SETS.length)}
                    style={{ textAlign: 'left', background: 'transparent', border: '1px dashed rgba(0,0,0,.2)', borderRadius: 10, padding: '8px 14px', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 7, transition: 'border-color .15s', whiteSpace: 'nowrap' }}
                    onMouseEnter={e => { e.currentTarget.style.borderColor = 'rgba(124,58,237,.4)'; }}
                    onMouseLeave={e => { e.currentTarget.style.borderColor = 'rgba(0,0,0,.2)'; }}
                  >
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.4)" strokeWidth="2.2" strokeLinecap="round"><path d="M4 12A8 8 0 1113 4M4 4v5h5"/></svg>

                  {suggSetIdx > 0 && (
                    <button onClick={() => setSuggSetIdx(0)}
                      style={{ textAlign: 'left', background: 'transparent', border: 'none', padding: '4px 2px', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 6, whiteSpace: 'nowrap' }}

                <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>
              </div>

                ))}
              </div>
            </div>

          <div ref={msgEndRef} />

                  <div style={{ animation: 'fieldReveal .3s ease both', marginTop: 10, paddingLeft: 14, borderLeft: '2px solid rgba(124,58,237,.18)' }}>
                    <div style={{ font: '600 10px/1 Inter,sans-serif', color: 'rgba(0,0,0,.4)', textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: 7 }}>Points per decline</div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                      <input type="number" value={form.penaltyPoints} onChange={e => patchForm({ penaltyPoints: e.target.value })} placeholder="e.g. 2"
                        style={{ width: 80, height: 34, padding: '0 10px', border: '1px solid rgba(0,0,0,.15)', borderRadius: 6, font: '400 14px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)', outline: 'none', background: '#fff' }}
                        onFocus={e => e.target.style.borderColor = '#7C3AED'} onBlur={e => e.target.style.borderColor = 'rgba(0,0,0,.15)'} />
                      <span style={{ font: '400 13px/1 Inter,sans-serif', color: 'rgba(0,0,0,.5)' }}>points</span>
                    </div>
                  </div>
                )}
                {shown('declineScope') && form.declineAction === 'Move to back of list' && (
                  <div style={{ animation: 'fieldReveal .3s ease both', marginTop: 10, paddingLeft: 14, borderLeft: '2px solid rgba(124,58,237,.18)' }}>
                    <div style={{ font: '600 10px/1 Inter,sans-serif', color: 'rgba(0,0,0,.4)', textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: 7 }}>Apply to</div>
                    <select value={form.declineScope} onChange={e => patchForm({ declineScope: e.target.value })}
                      style={{ width: '100%', height: 34, padding: '0 32px 0 10px', border: '1px solid rgba(0,0,0,.15)', borderRadius: 6, font: '400 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)', background: '#fff', cursor: 'pointer', outline: 'none', appearance: 'none', backgroundImage: "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23888' stroke-width='1.4' fill='none' stroke-linecap='round'/></svg>\")", backgroundRepeat: 'no-repeat', backgroundPosition: 'right 10px center' }}>
                      <option value="All reasons">All reasons</option>
                      <option value="Voluntary only">Voluntary only</option>
                      <option value="Involuntary only">Involuntary only</option>
                    </select>
                  </div>
                )}
                {shown('declineCooldown') && form.declineAction === 'Stay in position' && (
                  <div style={{ animation: 'fieldReveal .3s ease both', marginTop: 10, paddingLeft: 14, borderLeft: '2px solid rgba(124,58,237,.18)' }}>
                    <div style={{ font: '600 10px/1 Inter,sans-serif', color: 'rgba(0,0,0,.4)', textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: 7 }}>Re-offer cooldown</div>
                    <select value={form.declineCooldown} onChange={e => patchForm({ declineCooldown: e.target.value })}
                      style={{ width: '100%', height: 34, padding: '0 32px 0 10px', border: '1px solid rgba(0,0,0,.15)', borderRadius: 6, font: '400 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)', background: '#fff', cursor: 'pointer', outline: 'none', appearance: 'none', backgroundImage: "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23888' stroke-width='1.4' fill='none' stroke-linecap='round'/></svg>\")", backgroundRepeat: 'no-repeat', backgroundPosition: 'right 10px center' }}>
                      <option value="None">No cooldown</option>
                      <option value="1 hour">1 hour</option>
                      <option value="4 hours">4 hours</option>
                    </select>
                  </div>
                )}
              </FormGroup>
            </div>
          )}

          <div style={{ height: 8 }} />
        </div>

        <div style={{ padding: '16px 24px', borderTop: '1px solid rgba(0,0,0,.08)', background: '#fff', display: 'flex', gap: 10, flex: 'none' }}>
          <button onClick={onBack} style={{ flex: 1, height: 40, background: '#fff', color: 'rgba(24,39,58,.8)', border: '1px solid rgba(0,0,0,.18)', borderRadius: 6, font: '500 14px/1 Inter,sans-serif', cursor: 'pointer' }}>Cancel</button>
          <button onClick={() => skippedCount === 0 && setSaved(true)} disabled={skippedCount > 0}
            style={{ flex: 2, height: 40, background: skippedCount > 0 ? 'rgba(0,0,0,.08)' : 'linear-gradient(135deg,#7C3AED,#5B21B6)', color: skippedCount > 0 ? 'rgba(0,0,0,.3)' : '#fff', border: 'none', borderRadius: 6, font: '600 14px/1 Inter,sans-serif', cursor: skippedCount > 0 ? 'not-allowed' : 'pointer', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 8, boxShadow: skippedCount > 0 ? 'none' : '0 2px 10px rgba(124,58,237,.4)', transition: 'all .2s' }}
            title={skippedCount > 0 ? `Answer ${skippedCount} skipped question${skippedCount > 1 ? 's' : ''} first` : undefined}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16l-4-4 1.4-1.4L9 13.2l8.6-8.6L19 6z"/></svg>
            Save Rule
          </button>
        </div>
      </div>
      )}
    </div>
  );
}
</script>

<script type="text/babel">
/* global React */
const { useState: useAppSt } = React;

// ── Approaches & Rules page data ─────────────────────────────────────────────
const APPROACHES_DATA = [
  { id: 1, name: 'Captains',                  tag: 'Capt' },
  { id: 2, name: 'Bay Guard',                 tag: 'Bay Guard' },
  { id: 3, name: 'Firefighter',               tag: 'Firefighter' },
  { id: 4, name: 'New Approach',              tag: 'Firefighter' },
  { id: 5, name: 'Battalion Chief Training',  tiers: ['Battalion Chief', 'Captain', 'Firefighter'] },
  { id: 6, name: 'Firefighter 2',             tag: 'Firefighter' },
  { id: 7, name: 'FF3',                       tag: 'Firefighter' },
  { id: 8, name: 'Michael Only',              tag: 'Michael Only' },
  { id: 9, name: 'Patrol Deputy',             tag: 'Firefighter' },
];

const RULES_DATA = [
  { id: 1, name: 'Overtime - Hours Based',      desc: 'Hours Based sorter, includes callbacks accepted by the user.' },
  { id: 2, name: 'Rolodex',                     desc: 'Standard Rolodex sorter, includes callbacks accepted by the user.' },
  { id: 3, name: 'Gelsey test turns based',     desc: 'Turns Based sorter, includes callbacks accepted by the user.' },
  { id: 4, name: 'New Accumulating Rolodex',    desc: 'Accumulating Rolodex sorter, includes callbacks accepted by the user.' },
  { id: 5, name: 'Testing Counting Past Shifts',desc: 'Hours Based sorter, includes callbacks accepted by the user.' },
];

function DragHandle() {
  return (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style={{ flex: 'none', cursor: 'grab' }}>
      <path d="M11 4h2v2h-2zm0 14h2v2h-2zm-7-7h2v2H4zm14 0h2v2h-2zM11 11h2v2h-2zm-4-4h2v2H7zm0 8h2v2H7zm8-8h2v2h-2zm0 8h2v2h-2z"/>
    </svg>
  );
}

function ApproachesRulesPage() {
  const [hoveredApproach, setHoveredApproach] = useAppSt(null);
  const [hoveredRule,     setHoveredRule]     = useAppSt(null);

  return (
    <div style={{ flex: 1, overflowY: 'auto', padding: 24, display: 'flex', gap: 20, alignItems: 'flex-start', background: '#F4F5F7' }}>

      {/* ── Left: Approaches ── */}
      <div style={{ flex: 1, background: '#fff', border: '1px solid rgba(0,0,0,.1)', borderRadius: 6, padding: '20px 24px', minWidth: 0 }}>
        <div style={{ marginBottom: 16 }}>
          <div style={{ font: '700 18px/1.2 Inter,sans-serif', color: 'rgba(24,39,58,.94)', marginBottom: 4 }}>Approaches</div>
          <div style={{ font: '400 13px/1.4 Inter,sans-serif', color: 'rgba(0,0,0,.45)' }}>(used to fill Overtime / CallBack Shifts, also known as a 'List')</div>
        </div>
        <div style={{ border: '1px solid rgba(0,0,0,.1)', borderRadius: 4, overflow: 'hidden' }}>
          {APPROACHES_DATA.map((a, i) => (
            <div key={a.id}
              onMouseEnter={() => setHoveredApproach(a.id)}
              onMouseLeave={() => setHoveredApproach(null)}
              style={{
                display: 'flex', alignItems: 'flex-start', gap: 14, padding: '11px 14px',
                borderBottom: i < APPROACHES_DATA.length - 1 ? '1px solid rgba(0,0,0,.07)' : 'none',
                background: hoveredApproach === a.id ? 'rgba(2,113,206,.03)' : '#fff',
                transition: 'background .12s',
              }}>
              <div style={{ color: 'rgba(0,0,0,.25)', paddingTop: 3, flex: 'none' }}>
                <DragHandle />
              </div>
              <div>
                <div style={{ font: '600 14px/1.3 Inter,sans-serif', color: 'rgba(24,39,58,.94)' }}>{a.name}</div>
                {a.tiers ? (
                  <div style={{ font: '400 12px/1.7 Inter,sans-serif', color: 'rgba(0,0,0,.42)', marginTop: 1 }}>
                    {a.tiers.map((t, ti) => <div key={ti}>Tier {ti + 1}: [{t}]</div>)}
                  </div>
                ) : (
                  <div style={{ font: '400 12px/1.4 Inter,sans-serif', color: 'rgba(0,0,0,.42)', marginTop: 1 }}>[{a.tag}]</div>
                )}
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* ── Right: Rules ── */}
      <div style={{ flex: 1, background: '#fff', border: '1px solid rgba(0,0,0,.1)', borderRadius: 6, padding: '20px 24px', minWidth: 0 }}>
        <div style={{ marginBottom: 16 }}>
          <div style={{ font: '700 18px/1.2 Inter,sans-serif', color: 'rgba(24,39,58,.94)', marginBottom: 4 }}>Rules</div>
          <div style={{ font: '400 13px/1.4 Inter,sans-serif', color: 'rgba(0,0,0,.45)' }}>(applied to an Approach, to determine ranking)</div>
        </div>
        <div style={{ border: '1px solid rgba(0,0,0,.1)', borderRadius: 4, overflow: 'hidden' }}>
          {RULES_DATA.map((r, i) => (
            <div key={r.id}
              onMouseEnter={() => setHoveredRule(r.id)}
              onMouseLeave={() => setHoveredRule(null)}
              style={{
                padding: '13px 16px',
                borderBottom: i < RULES_DATA.length - 1 ? '1px solid rgba(0,0,0,.07)' : 'none',
                background: hoveredRule === r.id ? 'rgba(2,113,206,.03)' : '#fff',
                cursor: 'pointer', transition: 'background .12s',
              }}>
              <div style={{ font: '600 14px/1.3 Inter,sans-serif', color: 'rgba(24,39,58,.94)', marginBottom: 3 }}>{r.name}</div>
              <div style={{ font: '400 12px/1.4 Inter,sans-serif', color: 'rgba(0,0,0,.42)' }}>{r.desc}</div>
            </div>
          ))}
        </div>
      </div>

    </div>
  );
}

const SUB_LABELS = {
  dashboard:  'Dashboard',
  forceHire:  'Force Hire',
  approaches: 'Approaches & Rules',
  lists:      'Lists',
  history:    'History',
  rankings:   'Rankings',
  worksites:  'Manage Worksites',
};

function App() {
  const [building, setBuilding] = useAppSt(null);
  const [subNav, setSubNav]     = useAppSt('dashboard');

  const handleSubNav = (key) => {
    setSubNav(key);
    setBuilding(null);
  };

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden', background: '#F4F5F7' }}>
      <OuterSidebar />
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
        <TopBar />
        <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
          <SubSidebar active={subNav} onChange={handleSubNav} />
          <main style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
            {subNav === 'dashboard' ? (
              building ? (
                <RuleBuilderView seed={building} onBack={() => setBuilding(null)} />
              ) : (
                <>
                  <PageHeader title="Dashboard" />
                  <div style={{ flex: 1, overflowY: 'auto', padding: 20 }}>
                    <div style={{ maxWidth: 720, margin: '0 auto' }}>
                      <AIAssistantCard onStart={seed => setBuilding(seed)} />
                    </div>
                  </div>
                </>
              )
            ) : subNav === 'approaches' ? (
              <ApproachesRulesPage />
            ) : (
              <>
                <PageHeader title={SUB_LABELS[subNav] || subNav} />
                <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 12, color: 'rgba(0,0,0,.3)' }}>
                  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>
                  <span style={{ font: '400 14px/1 Inter,sans-serif' }}>{SUB_LABELS[subNav]} — content coming soon</span>
                </div>
              </>
            )}
          </main>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
