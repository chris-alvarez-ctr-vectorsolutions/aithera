function platoonForDay(dayIndex) {
  const idx = ((dayIndex % 3) + 3) % 3;
  return PLATOONS[idx];
}

function daysBetween(a, b) {
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}

// Treat the simulator's clock as starting at "today". Day 0 = today, day 1 = tomorrow, etc.
function shiftStatusAt(person, scenarioDate, baselineDate) {
  const dayOffset = daysBetween(baselineDate, scenarioDate);
  if (person.pto) {
    if (dayOffset >= person.pto.startOffset && dayOffset <= person.pto.endOffset) {
      return { code: person.pto.kind, label: person.pto.kind === 'sick' ? 'Sick' : 'Vacation', available: false };
    }
  }
  const onPlatoon = platoonForDay(dayOffset);
  if (person.platoon === onPlatoon) return { code: 'on-shift', label: 'On shift', available: true };
  // Pre-shift / post-shift: people coming on next day or just off
  const nextPlatoon = platoonForDay(dayOffset + 1);
  if (person.platoon === nextPlatoon) return { code: 'next', label: 'Off — on next', available: true };
  return { code: 'off', label: 'Off', available: true };
}

const STATUS_STYLE = {
  'on-shift': { bg: '#dcfce7', fg: '#166534', dot: '#22c55e' },
  'next':     { bg: '#dbeafe', fg: '#1d4ed8', dot: '#3b82f6' },
  'off':      { bg: 'rgba(0,0,0,.06)', fg: 'rgba(0,0,0,.55)', dot: 'rgba(0,0,0,.3)' },
  'vacation': { bg: '#fef3c7', fg: '#92400e', dot: '#f59e0b' },
  'sick':     { bg: '#fee2e2', fg: '#991b1b', dot: '#ef4444' },
};

// Deterministic seeded "random" — same (seed, key) always returns the same
// value in [0, 1). Used to give each reset a different-but-stable roster shake
// so the predicted-call-order list visibly shifts between simulation runs.
function seededRand(seed, key) {
  let h = (seed | 0) * 2654435761;
  for (let i = 0; i < key.length; i++) {
    h = ((h << 5) - h + key.charCodeAt(i)) | 0;
  }
  return ((h >>> 0) % 100000) / 100000;
}

// Rank the roster for a scenario at a specific date/time, accounting for prior
// step outcomes (Rolodex: people who accepted move to the back). Filters down
// to the people on the chosen approach's roster — no one else is shown. The
// optional `seed` lets each reset re-shake hours / lastCallback so the order
// shifts slightly without changing the underlying rule.
function rankRosterForScenario({ rule, scenarioDate, baselineDate, approach, history, seed = 0 }) {
  const rosterNames = APPROACH_ROSTERS[approach] || [];
  const annotated = CALLBACK_ROSTER
    .filter(p => rosterNames.includes(p.name))
    .map(p => {
      // Small per-seed perturbations: ±3h on accumulated hours and ±2 on
      // lastCallback. Static fields (hireDate, name, qualifiers) are untouched
      // so static rules still produce the same canonical order.
      const hourJitter = Math.round((seededRand(seed, p.name + ':h') - 0.5) * 6);
      const callJitter = Math.round((seededRand(seed, p.name + ':c') - 0.5) * 4);
      return {
        ...p,
        hours:        Math.max(0, p.hours + hourJitter),
        lastCallback: Math.max(0, p.lastCallback + callJitter),
        status: shiftStatusAt(p, scenarioDate, baselineDate),
      };
    });

  // Apply rolodex history: each accept pushes that person to the bottom of the
  // queue for subsequent callbacks. Accept index 0 = most recent accept.
  const acceptanceHistory = new Map();
  history.forEach((step, i) => {
    if (step.acceptedBy) acceptanceHistory.set(step.acceptedBy, i);
  });

  const sortKey = (p) => {
    const accIdx = acceptanceHistory.get(p.name);
    if (rule.ruleType === 'rolodex' && accIdx != null) return [1, accIdx];
    if (rule.ruleType === 'turns'    && accIdx != null) return [1, accIdx];
    if (rule.ruleType === 'hours' || !rule.ruleType) return [0, p.hours];
    if (rule.ruleType === 'turns')      return [0, 0];
    if (rule.ruleType === 'hire_date')  return [0, new Date(p.hireDate).getTime()];
    if (rule.ruleType === 'employee_id') return [0, p.name];
    if (rule.ruleType === 'random')      return [0, seededRand(seed + history.length, p.name)];
    return [0, p.hours];
  };

  // Tiering: eligible (off-shift available) on top, on-shift in the middle
  // (they can't take a callback), unavailable (PTO/sick) at the bottom.
  const tier = (p) => {
    if (!p.status.available) return 2;
    if (p.status.code === 'on-shift') return 1;
    return 0;
  };
  return annotated.sort((a, b) => {
    const ta = tier(a), tb = tier(b);
    if (ta !== tb) return ta - tb;
    const [ag, av] = sortKey(a), [bg, bv] = sortKey(b);
    if (ag !== bg) return ag - bg;
    if (typeof av === 'string') return av.localeCompare(bv);
    return av - bv;
  });
}

// ── SimulatorView ────────────────────────────────────────────────────────────
function SimulatorView({ seed, onBack }) {
  // Pull the full rule list from the App so the user can swap rules from inside
  // the simulator. Falls back to an empty list if RULES_DATA isn't yet exposed.
  const availableRules = (window.RULES_DATA && window.RULES_DATA.length > 0) ? window.RULES_DATA : [];

  // When the user enters Preview Mode cold from the Rules section (no seed
  // from the builder), start with no rule/approach picked so the right panel
  // shows an empty state until they make an explicit choice.
  const isFreshStart = !seed;

  // Default to the seeded rule (when launched from the rule builder), or null
  // for fresh-start so the user picks explicitly.
  const findSeedRuleId = () => {
    if (isFreshStart) return null;
    if (seed?.form?.ruleName) {
      const match = availableRules.find(r => r.name === seed.form.ruleName || r.config?.ruleName === seed.form.ruleName);
      if (match) return match.id;
    }
    return availableRules[0]?.id || null;
  };
  const [selectedRuleId, setSelectedRuleId] = useSimSt(findSeedRuleId);

  const activeRule = availableRules.find(r => r.id === selectedRuleId) || (seed?.form ? { id: 'in-progress', name: seed.form.ruleName || 'In-progress rule', config: seed.form } : null);
  const ruleForm   = activeRule?.config || activeRule || { ruleType: 'hours', ruleAffects: 'all', selectedApproaches: [], ruleName: 'New Rule' };

  // Fresh-start: leave approach empty so the user picks. Otherwise, default to
  // the first approach the seeded rule covers (or Firefighter 2 as a fallback).
  const seededApproach = isFreshStart
    ? ''
    : ((ruleForm.ruleAffects === 'selected' && ruleForm.selectedApproaches?.length)
        ? ruleForm.selectedApproaches[0]
        : 'Firefighter 2');

  const baselineDate = useSimMemo(() => new Date(2026, 4, 19, 8, 0, 0), []);

  const [startDate, setStartDate] = useSimSt(new Date(baselineDate.getTime() + 86400000));
  const [duration, setDuration]   = useSimSt(24);
  const [deadline, setDeadline]   = useSimSt(new Date(baselineDate.getTime() + 14400000));
  const [waitMin, setWaitMin]     = useSimSt(0);
  const [positions, setPositions] = useSimSt(1);
  const [approach, setApproach]   = useSimSt(seededApproach);
  const [stepHistory, setStepHistory] = useSimSt([]);
  const [overridePick, setOverridePick] = useSimSt('');
  // Left-panel tab: 'settings' lets the user pick approach + rule and configure
  // the callback shift; 'chat' is the scenario assistant. Default to settings
  // on fresh start so the first thing the user sees is the picker.
  const [leftTab, setLeftTab] = useSimSt(isFreshStart ? 'settings' : 'chat');
  // Both picks required before the right panel exits its empty state.
  const isReady = !!activeRule && !!approach;
  // simulationSeed shakes the predicted-call-order slightly each reset so the
  // ranking visibly changes between runs even when the rule itself doesn't.
  const [simulationSeed, setSimulationSeed] = useSimSt(() => Math.floor(Math.random() * 100000));
  const [chat, setChat] = useSimSt(() => {
    // Fresh start: the user hasn't picked yet — wait for the picks before
    // populating the AI summary. The Callback Settings tab is what's open.
    if (isFreshStart) {
      return [{ role: 'ai', text: "Welcome to Preview Mode. Pick a rule and an approach in Callback Settings — once both are set, I'll summarize the rule and you'll see the predicted call order on the right." }];
    }
    // Lead with a quick summary of the rule the user pulled up so the preview
    // matches the rule-edit experience.
    const summary = (window.summarizeRule && activeRule)
      ? window.summarizeRule(activeRule)
      : '';
    const intro = summary
      ? `Here's a quick summary of "${activeRule?.name || 'this rule'}":\n\n${summary}\n\nUse the chips below to ask scenario questions, or kick off a callback on the right.`
      : `Welcome to Preview Mode. I'll run "${activeRule?.name || 'this rule'}" against a hypothetical callback for the chosen approach. Use the chips below to ask scenario questions, or kick off a callback on the right.`;
    return [{ role: 'ai', text: intro }];
  });
  const [chatInput, setChatInput] = useSimSt('');
  // Auto-scroll the scenario-assistant thread to the bottom whenever a new
  // message appears (typically after a quick-prompt chip click).
  const simChatRef = useSimRef(null);
  useSimEffect(() => {
    const el = simChatRef.current;
    if (el) el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' });
  }, [chat]);

  // Once the user has picked both a rule AND an approach (fresh-start case),
  // populate the AI summary in the chat thread. The ref guard prevents this
  // from re-running on subsequent picks within the same session.
  const hasInjectedSummary = useSimRef(!isFreshStart);
  useSimEffect(() => {
    if (hasInjectedSummary.current) return;
    if (!activeRule || !approach) return;
    hasInjectedSummary.current = true;
    const summary = (window.summarizeRule && activeRule) ? window.summarizeRule(activeRule) : '';
    const intro = summary
      ? `Here's a quick summary of "${activeRule?.name || 'this rule'}":\n\n${summary}\n\nSwitch to the AI Chat tab to ask scenario questions, or run a callback on the right.`
      : `Locked in "${activeRule?.name || 'this rule'}" for the ${approach} approach. Switch to the AI Chat tab to ask scenario questions, or run a callback on the right.`;
    setChat(c => [...c, { role: 'ai', text: intro }]);
  }, [activeRule, approach]);

  const MAX_STEPS = 7;
  const currentStepIdx = stepHistory.length;
  const isFinished     = currentStepIdx >= MAX_STEPS;

  const activeDate = useSimMemo(() => new Date(startDate.getTime() + currentStepIdx * 86400000), [startDate, currentStepIdx]);

  const ranking = useSimMemo(() => rankRosterForScenario({
    rule: ruleForm, scenarioDate: activeDate, baselineDate, approach, history: stepHistory, seed: simulationSeed,
  }), [ruleForm, activeDate, baselineDate, approach, stepHistory, simulationSeed]);

  // For movement indicators: compute the ranking that *was* shown at the start
  // of the previous step (i.e. before that step's outcome was applied).
  const previousRanking = useSimMemo(() => {
    if (stepHistory.length === 0) return null;
    const prevDate    = new Date(startDate.getTime() + (stepHistory.length - 1) * 86400000);
    const prevHistory = stepHistory.slice(0, -1);
    return rankRosterForScenario({ rule: ruleForm, scenarioDate: prevDate, baselineDate, approach, history: prevHistory, seed: simulationSeed });
  }, [ruleForm, baselineDate, approach, stepHistory, startDate, simulationSeed]);

  // On-shift people can't take a callback (already working), so they're
  // excluded from the eligible pool that drives auto-simulate + dropdown.
  const eligible = ranking.filter(p => p.status.available && p.status.code !== 'on-shift');

  const autoSimulate = () => {
    if (eligible.length === 0) return;
    if (eligible.length === 1) {
      setStepHistory(h => [...h, { date: activeDate, attempts: [{ name: eligible[0].name, outcome: 'accepted' }], acceptedBy: eligible[0].name }]);
      return;
    }
    // Randomize how many people decline before someone accepts. Weighted to
    // favor "top accepts immediately" or "one decline then accept" so the
    // chain still feels rule-driven, with occasional longer fallouts to make
    // the preview feel like a real dispatch.
    const weights = [0.35, 0.4, 0.15, 0.08, 0.02]; // 0, 1, 2, 3, 4 declines
    const r = Math.random();
    let declineCount = 0, cum = 0;
    for (let i = 0; i < weights.length; i++) {
      cum += weights[i];
      if (r <= cum) { declineCount = i; break; }
    }
    declineCount = Math.min(declineCount, eligible.length - 1);
    const attempts = [];
    for (let i = 0; i < declineCount; i++) {
      attempts.push({ name: eligible[i].name, outcome: 'declined' });
    }
    const accepter = eligible[declineCount];
    attempts.push({ name: accepter.name, outcome: 'accepted' });
    setStepHistory(h => [
      ...h,
      { date: activeDate, attempts, acceptedBy: accepter.name },
    ]);
  };

  const overrideAccept = (name) => {
    if (!name) return;
    setStepHistory(h => [
      ...h,
      { date: activeDate, attempts: [{ name, outcome: 'accepted (manual override)' }], acceptedBy: name, manual: true },
    ]);
    setOverridePick('');
  };

  const resetSimulation = () => {
    setStepHistory([]);
    // Re-shake the seed so the predicted-call-order shifts subtly each reset —
    // gives "ranking changing" feedback even when the rule hasn't changed.
    setSimulationSeed(s => (s + 1 + Math.floor(Math.random() * 9973)) | 0);
    setChat([{ role: 'ai', text: 'Simulation reset. Roster shuffled — ready to run a fresh callback from day 1.' }]);
  };

  const handleChip = (chip) => {
    const ai = (() => {
      if (chip === 'New scenario') {
        const opts = Object.keys(APPROACH_ROSTERS);
        const next = opts[Math.floor(Math.random() * opts.length)];
        setApproach(next);
        setStartDate(new Date(baselineDate.getTime() + Math.floor(Math.random() * 5 + 1) * 86400000));
        setDuration([8, 12, 24][Math.floor(Math.random() * 3)]);
        resetSimulation();
        return `Generated a new scenario — approach is now ${next}. Ranking updated on the right.`;
      }
      if (chip.startsWith('Why is ')) {
        const top = ranking.find(p => p.status.available);
        if (!top) return 'No one is available — everyone on this approach is off-shift, on PTO, or out sick today.';
        const reasonByType = {
          hours:       `${top.name} is first because they have the fewest accumulated callback hours (${top.hours}h) among the available roster.`,
          rolodex:     `${top.name} is first because they're at the top of the Rolodex right now — no one ahead of them has accepted yet.`,
          hire_date:   `${top.name} is first because they're the most senior available employee on-shift today (hired ${top.hireDate}).`,
          employee_id: `${top.name} is first because they sort first alphanumerically among available employees.`,
          random:      `${top.name} drew the highest random ranking this cycle.`,
          turns:       `${top.name} is first because the accumulating counter still has them below the rotation limit.`,
        };
        return reasonByType[ruleForm.ruleType] || `${top.name} is first per the rule's ranking factor (${ruleForm.ruleType || 'hours'}).`;
      }
      if (chip === 'What if they decline?') {
        if (eligible.length < 2) return `Only ${eligible.length} available person right now — if they decline, the callback would end unfilled.`;
        return `If ${eligible[0].name} declines, the next call goes to ${eligible[1].name} (${eligible[1].hours}h, ${eligible[1].station}). The rule's decline behavior ("${ruleForm.declineAction || 'not set'}") would then update ${eligible[0].name}'s standing.`;
      }
      if (chip === 'Who is on shift today?') {
        const onShift = ranking.filter(p => p.status.code === 'on-shift');
        return `Today (platoon ${platoonForDay(daysBetween(baselineDate, activeDate))}): ${onShift.map(p => p.name).join(', ') || '— no one on this approach is on-shift today.'}`;
      }
      if (chip === 'Run a new callback') {
        if (isFinished) return "You've hit the 7-callback limit. Reset to run more.";
        autoSimulate();
        return `Ran callback #${currentStepIdx + 1}. Check the chain on the right — accepted employees will move on the next callback per the rule.`;
      }
      return `Hmm, not sure I follow. Try one of the suggestion chips, or describe the situation.`;
    })();
    setChat(h => [...h, { role: 'user', text: chip }, { role: 'ai', text: ai }]);
  };

  const sendFreeform = () => {
    const t = chatInput.trim();
    if (!t) return;
    handleChip(t);
    setChatInput('');
  };

  const chips = [
    'New scenario',
    eligible.length > 0 ? `Why is ${eligible[0].name} first?` : 'Why is no one available?',
    'What if they decline?',
    'Who is on shift today?',
    'Run a new callback',
  ];

  // ── Render ──
  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: '#F4F5F7', overflow: 'hidden', position: 'relative' }}>
      {/* Top banner mimicking the production "Add new CallBacks" header */}
      <div style={{ background: '#fff', borderBottom: '1px solid rgba(0,0,0,.08)', padding: '12px 24px', display: 'flex', alignItems: 'center', gap: 14, flex: 'none' }}>
        <button onClick={onBack} aria-label="Back" title="Back" style={{ width: 32, height: 32, borderRadius: '50%', border: '1px solid rgba(0,0,0,.18)', background: '#fff', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', color: 'rgba(0,0,0,.7)' }}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </button>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(0,0,0,.7)" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <h2 style={{ margin: 0, font: '600 19px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)' }}>Preview Mode — Rule Simulator</h2>
        <span style={{ font: '400 12px/1 Inter,sans-serif', color: 'rgba(0,0,0,.45)', marginLeft: 6 }}>· Generic hypothetical — nothing dispatched live</span>
        <div style={{ flex: 1 }} />
        <button onClick={resetSimulation}
          style={{ height: 34, padding: '0 14px', borderRadius: 6, border: '1px solid rgba(0,0,0,.15)', background: '#fff', color: 'rgba(0,0,0,.7)', font: '500 13px/1 Inter,sans-serif', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 6 }}>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>
          Reset simulation
        </button>
      </div>

      {/* Body */}
      <div style={{ flex: 1, overflow: 'hidden', display: 'flex', gap: 0 }}>

        {/* LEFT: tabbed panel — AI Chat (scenario assistant) and Callback Settings
            (the form below). Tabs let the form breathe on smaller screens
            and keep the chat focused when the user wants scenario answers. */}
        <div style={{ width: '52%', display: 'flex', flexDirection: 'column', borderRight: '1px solid rgba(0,0,0,.08)', overflow: 'hidden' }}>

          {/* Tab bar — sticky at the top of the left column */}
          <div style={{ display: 'flex', borderBottom: '1px solid rgba(0,0,0,.08)', background: '#fff', flex: 'none' }}>
            {[['chat', 'AI Chat'], ['settings', 'Callback Settings']].map(([val, label]) => (
              <button key={val} onClick={() => setLeftTab(val)}
                style={{
                  padding: '12px 18px 13px',
                  background: 'none', border: 'none', cursor: 'pointer',
                  borderBottom: leftTab === val ? '2px solid #7C3AED' : '2px solid transparent',
                  marginBottom: -1,
                  font: `${leftTab === val ? 600 : 500} 13px/1 Inter,sans-serif`,
                  color: leftTab === val ? '#7C3AED' : 'rgba(0,0,0,.55)',
                  transition: 'color .15s',
                  display: 'inline-flex', alignItems: 'center', gap: 6,
                }}>
                {val === 'chat' ? (
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>
                ) : (
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33h0a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51h0a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82v0a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                )}
                {label}
              </button>

          </div>

          {/* Tab body — scrollable. Tall bottom padding so dropdowns near

          <div style={{ flex: 1, overflowY: 'auto', padding: '16px 24px 320px' }}>

          {leftTab === 'chat' && (

              <div style={{ width: 24, height: 24, borderRadius: '50%', background: 'rgba(255,255,255,.22)', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none' }}>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>

            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 4, padding: '0 12px 8px' }}>
              {chips.map(c => (
                <button key={c} onClick={() => handleChip(c)}
                  style={{ height: 24, padding: '0 9px', borderRadius: 12, border: '1.5px solid rgba(124,58,237,.3)', background: 'rgba(124,58,237,.05)', color: '#7C3AED', font: '500 11px/1 Inter,sans-serif', cursor: 'pointer', whiteSpace: 'nowrap', transition: 'all .15s' }}
                  onMouseEnter={e => { e.currentTarget.style.background = 'rgba(124,58,237,.13)'; }}
                  onMouseLeave={e => { e.currentTarget.style.background = 'rgba(124,58,237,.05)'; }}>
                  {c}
                </button>
              ))}
            </div>
            {/* Input row */}
            <div style={{ position: 'relative', borderTop: '1px solid rgba(0,0,0,.06)', padding: '8px 10px' }}>
              <input value={chatInput} onChange={e => setChatInput(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter') { const t = chatInput.trim(); if (t) { handleChip(t); setChatInput(''); } } }}
                placeholder="Ask a scenario question…"
                style={{ width: '100%', height: 32, padding: '0 38px 0 12px', border: '1.5px solid rgba(124,58,237,.25)', borderRadius: 7, outline: 'none', font: '500 12px/1 Inter,sans-serif', background: '#fff' }}
                onFocus={e => e.target.style.borderColor = '#7C3AED'}
                onBlur={e => e.target.style.borderColor = 'rgba(124,58,237,.25)'} />
              <button onClick={() => { const t = chatInput.trim(); if (t) { handleChip(t); setChatInput(''); } }}
                style={{ position: 'absolute', right: 14, top: 12, width: 24, height: 24, borderRadius: 5, border: 'none', background: chatInput.trim() ? 'linear-gradient(135deg,#7C3AED,#5B21B6)' : 'rgba(124,58,237,.2)', color: '#fff', cursor: chatInput.trim() ? 'pointer' : 'default', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.4" strokeLinecap="round"><path d="M2 12l20-9-9 20-2-9z"/></svg>
              </button>
            </div>
          </div>
          )}

          {leftTab === 'settings' && (
          <>
          {/* Inline nudge when the user lands on Preview Mode cold — calls out
              that picks below populate the AI summary + preview list on the right. */}
          {!isReady && (
            <div style={{ background: 'linear-gradient(135deg, rgba(124,58,237,.06), rgba(91,33,182,.03))', border: '1px solid rgba(124,58,237,.2)', borderRadius: 8, padding: '10px 14px', marginBottom: 12, display: 'flex', alignItems: 'flex-start', gap: 10 }}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="#7C3AED" style={{ flex: 'none', marginTop: 1 }}><path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>
              <div style={{ font: '400 12.5px/1.5 Inter,sans-serif', color: 'rgba(24,39,58,.85)' }}>
                Pick an <strong>Approach</strong> and a <strong>Rule</strong> below — once both are set, the AI summary will appear in the AI Chat tab and the predicted call order will populate on the right.
              </div>
            </div>
          )}

          <SimSection icon="scales" title="Select Approach + Rule">
            <SimRow label="Positions to fill">
              <input type="number" value={positions} onChange={e => setPositions(Number(e.target.value))} style={{ ...inputStyle, width: 80 }} />
            </SimRow>
            <SimRow label="using Approach">
              <select value={approach} onChange={e => { setApproach(e.target.value); resetSimulation(); }} style={selectStyle}>
                <option value="">— Pick an approach —</option>
                {Object.keys(APPROACH_ROSTERS).map(a => <option key={a} value={a}>{a}</option>)}
              </select>
            </SimRow>
            <SimRow label="applying Rule">
              {availableRules.length > 0 ? (
                <select value={selectedRuleId || ''} onChange={e => { setSelectedRuleId(e.target.value ? Number(e.target.value) : null); resetSimulation(); }} style={selectStyle}>
                  <option value="">— Pick a rule —</option>
                  {availableRules.map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
                </select>
              ) : (
                <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '7px 11px', background: 'rgba(124,58,237,.06)', border: '1px solid rgba(124,58,237,.25)', borderRadius: 5, font: '500 13px/1 Inter,sans-serif', color: '#7C3AED' }}>
                  {activeRule?.name || 'New Rule'}
                </span>
              )}
              <span style={{ font: '400 11px/1 Inter,sans-serif', color: 'rgba(0,0,0,.5)', marginLeft: 4 }}>· {ruleTypeLabel(ruleForm.ruleType)}</span>
            </SimRow>
          </SimSection>

          <SimSection icon="clock" title="Choose CallBack Shift date / time">
            <SimRow label="Start">
              <DateTimeInputs date={startDate} onDateChange={d => { setStartDate(d); resetSimulation(); }} />
            </SimRow>
            <SimRow label="End">
              <span style={{ font: '500 13px/1.6 Inter,sans-serif', color: 'rgba(0,0,0,.65)' }}>{formatDate(new Date(startDate.getTime() + duration * 3600000))} <span style={{ color: 'rgba(0,0,0,.4)', marginLeft: 8 }}>· {duration} hours</span></span>
            </SimRow>
            <SimRow label="Duration">
              <select value={duration} onChange={e => setDuration(Number(e.target.value))} style={selectStyle}>
                {[4, 8, 12, 24, 48].map(h => <option key={h} value={h}>{h} hours</option>)}
              </select>
            </SimRow>
            <SimRow label="Fill Deadline">
              <DateTimeInputs date={deadline} onDateChange={setDeadline} />
            </SimRow>
            <SimRow label="Wait time">
              <input type="number" value={waitMin} onChange={e => setWaitMin(Number(e.target.value))} style={{ ...inputStyle, width: 80 }} />
              <span style={{ marginLeft: 8, font: '400 13px/1 Inter,sans-serif', color: 'rgba(0,0,0,.55)' }}>minutes</span>
            </SimRow>
          </SimSection>

          <SimSection icon="filter" title="Auto-applied filters">
            <div style={{ font: '400 12.5px/1.6 Inter,sans-serif', color: 'rgba(0,0,0,.6)' }}>
              <div>· Roster scope: <strong>{approach ? `${(APPROACH_ROSTERS[approach] || []).length} people on the ${approach} approach` : 'pick an approach to see scope'}</strong></div>
              <div>· Filtering employees on PTO / sick days at scenario time</div>
              <div>· On-shift employees are excluded from the eligible callback pool</div>
              <div>· Rolodex acceptance from prior steps moves accepters to bottom</div>
            </div>
          </SimSection>
          </>
          )}

          </div>
        </div>

        {/* RIGHT: empty until rule + approach picked. Once ready:
            TOP = stepper + callback chain results,
            MIDDLE = predicted call order list (scrollable),
            BOTTOM = "who accepts" dropdown + Run callback button. */}
        <div style={{ width: '48%', display: 'flex', flexDirection: 'column', background: '#fff', overflow: 'hidden' }}>

          {!isReady && (
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '40px 32px', textAlign: 'center', background: 'linear-gradient(180deg, #FAFAFC 0%, #fff 100%)' }}>
              <div style={{ width: 56, height: 56, borderRadius: '50%', background: 'linear-gradient(135deg, rgba(124,58,237,.12), rgba(91,33,182,.06))', display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 18 }}>
                <svg width="26" height="26" viewBox="0 0 24 24" fill="#7C3AED"><path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg>
              </div>
              <div style={{ font: '600 15px/1.3 Inter,sans-serif', color: 'rgba(24,39,58,.9)', marginBottom: 8 }}>Pick an approach and a rule to start</div>
              <div style={{ font: '400 13px/1.55 Inter,sans-serif', color: 'rgba(0,0,0,.55)', maxWidth: 360 }}>
                Once you set both in the <strong>Callback Settings</strong> tab on the left, I'll summarize the rule in chat and show the predicted call order here.
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginTop: 22, font: '500 12px/1 Inter,sans-serif', color: 'rgba(0,0,0,.45)' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                  <span style={{ width: 16, height: 16, borderRadius: '50%', border: `1.5px solid ${approach ? '#7C3AED' : 'rgba(0,0,0,.2)'}`, background: approach ? '#7C3AED' : '#fff', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', color: '#fff' }}>
                    {approach ? <svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16l-4-4 1.4-1.4L9 13.2l8.6-8.6L19 6z"/></svg> : null}
                  </span>
                  Approach
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                  <span style={{ width: 16, height: 16, borderRadius: '50%', border: `1.5px solid ${selectedRuleId ? '#7C3AED' : 'rgba(0,0,0,.2)'}`, background: selectedRuleId ? '#7C3AED' : '#fff', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', color: '#fff' }}>
                    {selectedRuleId ? <svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16l-4-4 1.4-1.4L9 13.2l8.6-8.6L19 6z"/></svg> : null}
                  </span>
                  Rule
                </div>
              </div>
            </div>
          )}

          {isReady && (
          <>
          {/* TOP: callback chain stepper + the running results once callbacks
              have been kicked off. Sits above the predicted-call-order list. */}
          <div style={{ padding: '14px 22px 12px', borderBottom: '1px solid rgba(0,0,0,.07)', flex: 'none', background: '#FAFAFC' }}>
            <div style={{ font: '600 11px/1 Inter,sans-serif', color: 'rgba(0,0,0,.5)', textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: 10 }}>Callback chain {currentStepIdx > 0 && `· ${currentStepIdx} of ${MAX_STEPS} run`}</div>

            {/* Stepper — horizontal chain showing callbacks #1 through #N. */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 0, marginBottom: 10 }}>
              {Array.from({ length: MAX_STEPS }, (_, i) => {
                const done    = i < currentStepIdx;
                const active  = i === currentStepIdx && !isFinished;
                const bg      = done ? '#7C3AED' : active ? '#fff' : 'rgba(0,0,0,.06)';
                const ringCol = done ? '#7C3AED' : active ? '#7C3AED' : 'rgba(0,0,0,.18)';
                const txtCol  = done ? '#fff'    : active ? '#7C3AED' : 'rgba(0,0,0,.45)';
                return (
                  <React.Fragment key={i}>
                    <div title={`Callback #${i + 1}`} style={{
                      width: 22, height: 22, borderRadius: '50%',
                      background: bg, border: `1.5px solid ${ringCol}`,
                      display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
                      font: '700 10px/1 Inter,sans-serif', color: txtCol, flex: 'none',
                      boxShadow: active ? '0 0 0 3px rgba(124,58,237,.18)' : 'none',
                      transition: 'all .2s',
                    }}>
                      {done ? (
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16l-4-4 1.4-1.4L9 13.2l8.6-8.6L19 6z"/></svg>
                      ) : (i + 1)}
                    </div>
                    {i < MAX_STEPS - 1 && (
                      <div style={{ flex: 1, height: 2, background: i < currentStepIdx ? '#7C3AED' : 'rgba(0,0,0,.1)', transition: 'background .2s' }} />
                    )}
                  </React.Fragment>
                );
              })}
            </div>

            {/* Callback results — populated as each step runs. Empty until run. */}
            {stepHistory.length === 0 ? (
              <div style={{ font: '400 12px/1.4 Inter,sans-serif', color: 'rgba(0,0,0,.5)', padding: '4px 0' }}>
                No callbacks run yet. Pick who accepts at the bottom (or leave on Random) and run callback #1.
              </div>
            ) : (
              <div style={{ maxHeight: 150, overflowY: 'auto', paddingRight: 4 }}>
                {stepHistory.map((step, i) => (
                  <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 10, padding: '6px 0', borderBottom: i < stepHistory.length - 1 ? '1px dashed rgba(0,0,0,.07)' : 'none' }}>
                    <div style={{ width: 18, height: 18, borderRadius: '50%', background: '#7C3AED', color: '#fff', font: '700 10px/1 Inter,sans-serif', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none', marginTop: 2 }}>{i + 1}</div>
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={{ font: '500 12px/1.3 Inter,sans-serif', color: 'rgba(24,39,58,.85)' }}>
                        {formatDate(step.date)} {step.manual && <span style={{ font: '500 10px/1 Inter,sans-serif', color: '#7C3AED', marginLeft: 5 }}>· manual override</span>}
                      </div>
                      <div style={{ font: '400 11.5px/1.4 Inter,sans-serif', color: 'rgba(0,0,0,.55)', marginTop: 2 }}>
                        {step.attempts.map((a, j) => (
                          <span key={j} style={{ color: a.outcome.startsWith('accepted') ? '#158444' : '#D83E38' }}>
                            {a.name} · {a.outcome}{j < step.attempts.length - 1 ? ' → ' : ''}
                          </span>
                        ))}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* MIDDLE: predicted call order list (scrollable). */}
          <div style={{ padding: '12px 22px 6px', flex: 'none' }}>
            <div style={{ font: '600 12px/1 Inter,sans-serif', color: 'rgba(0,0,0,.5)', textTransform: 'uppercase', letterSpacing: '.06em', marginBottom: 6 }}>Predicted call order</div>
            <div style={{ font: '400 12px/1.4 Inter,sans-serif', color: 'rgba(0,0,0,.55)' }}>
              For callback <strong>#{currentStepIdx + 1}</strong> at <strong>{formatDate(activeDate)}</strong> · platoon {platoonForDay(daysBetween(baselineDate, activeDate))} is on-shift
              {currentStepIdx > 0 && <span style={{ marginLeft: 8, color: 'rgba(124,58,237,.7)', fontWeight: 500 }}>· arrows show how each person moved since callback #{currentStepIdx}</span>}
            </div>
          </div>

          {/* Roster list — movement arrows compare to previousRanking */}
          <div style={{ flex: 1, overflowY: 'auto', padding: '4px 18px 14px' }}>
            {ranking.map((p, idx) => {
              const st = STATUS_STYLE[p.status.code] || STATUS_STYLE['off'];
              // Gray out anyone who can't actually take this callback —
              // both PTO/sick (status not available) AND on-shift (already working).
              const dim = !p.status.available || p.status.code === 'on-shift';
              const prevIdx = previousRanking ? previousRanking.findIndex(x => x.name === p.name) : -1;
              const delta = previousRanking && prevIdx >= 0 ? prevIdx - idx : 0;
              return (
                <div key={p.name} style={{
                  display: 'flex', alignItems: 'center', gap: 10, padding: '9px 10px', borderRadius: 6,
                  background: idx === 0 && !dim ? 'linear-gradient(135deg, rgba(124,58,237,.08), rgba(91,33,182,.04))' : 'transparent',
                  border: idx === 0 && !dim ? '1px solid rgba(124,58,237,.22)' : '1px solid transparent',
                  opacity: dim ? .55 : 1,
                  marginBottom: 4,
                }}>
                  <div style={{ width: 22, height: 22, borderRadius: '50%', background: idx === 0 && !dim ? 'linear-gradient(135deg,#7C3AED,#5B21B6)' : 'rgba(0,0,0,.07)', color: idx === 0 && !dim ? '#fff' : 'rgba(0,0,0,.55)', font: '700 11px/1 Inter,sans-serif', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none' }}>{idx + 1}</div>
                  {/* Movement indicator (music-chart style) */}
                  <MovementArrow delta={delta} hasPrev={previousRanking != null} />
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ font: '600 13px/1.3 Inter,sans-serif', color: 'rgba(24,39,58,.9)', display: 'flex', alignItems: 'center', gap: 6 }}>
                      {p.name}
                      {idx === 0 && !dim && <span style={{ font: '700 9px/1 Inter,sans-serif', color: '#fff', background: 'linear-gradient(135deg,#7C3AED,#5B21B6)', padding: '3px 6px', borderRadius: 3, textTransform: 'uppercase', letterSpacing: '.05em' }}>Next</span>}
                    </div>
                    <div style={{ font: '400 11px/1.3 Inter,sans-serif', color: 'rgba(0,0,0,.5)', marginTop: 2 }}>
                      {p.qualifiers.join(' · ')} · {p.station} · {p.hours}h · plat {p.platoon}
                    </div>
                  </div>
                  <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '4px 9px', borderRadius: 12, background: st.bg, color: st.fg, font: '600 10.5px/1 Inter,sans-serif', flex: 'none' }}>
                    <span style={{ width: 6, height: 6, borderRadius: '50%', background: st.dot, flex: 'none' }} />
                    {p.status.label}
                  </span>
                </div>
              );
            })}
            {ranking.length === 0 && (
              <div style={{ padding: '20px 8px', font: '400 12px/1.4 Inter,sans-serif', color: 'rgba(0,0,0,.4)', textAlign: 'center' }}>
                No one on the {approach} approach yet. Pick a different approach above.
              </div>
            )}
          </div>

          {/* BOTTOM: "who gets the callback" picker + Run simulation button.
              Stays anchored at the bottom of the right panel so the primary
              action is always reachable while the user scrolls the list. */}
          <div style={{ borderTop: '1px solid rgba(0,0,0,.07)', padding: '12px 18px', background: '#FAFAFC', flex: 'none' }}>
            {!isFinished && (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                <div style={{ font: '600 11px/1 Inter,sans-serif', color: 'rgba(0,0,0,.5)', textTransform: 'uppercase', letterSpacing: '.06em' }}>
                  Who accepts callback #{currentStepIdx + 1}?
                </div>
                {/* Single dropdown: "Random (system decides)" first, then every
                    eligible person. Picking Random calls autoSimulate() — the
                    rule walks the list until someone accepts. Picking a name
                    calls overrideAccept() to test a specific outcome. */}
                <select
                  value={overridePick || '__random__'}
                  onChange={e => setOverridePick(e.target.value === '__random__' ? '' : e.target.value)}
                  style={{ ...selectStyle, padding: '0 28px 0 10px', height: 34, font: '500 13px/1 Inter,sans-serif', width: '100%' }}>
                  <option value="__random__">🎲 Random (system decides)</option>
                  <optgroup label="Pick a specific person">
                    {eligible.map(p => (
                      <option key={p.name} value={p.name}>{p.name} · {p.station} · {p.hours}h</option>
                    ))}
                  </optgroup>
                </select>
                <div style={{ font: '400 11.5px/1.45 Inter,sans-serif', color: 'rgba(0,0,0,.55)' }}>
                  {overridePick
                    ? `${overridePick} will accept — useful for testing what callback #${currentStepIdx + 2} looks like after this specific outcome.`
                    : (eligible.length >= 2
                        ? `Calls go down the list from ${eligible[0]?.name} until someone accepts — outcome varies per run.`
                        : eligible.length === 1
                          ? `${eligible[0]?.name} accepts.`
                          : 'No one available.')}
                </div>
                <button onClick={() => overridePick ? overrideAccept(overridePick) : autoSimulate()}
                  style={{ marginTop: 4, height: 36, padding: '0 16px', borderRadius: 7, border: 'none', background: 'linear-gradient(135deg,#7C3AED,#5B21B6)', color: '#fff', font: '600 13px/1 Inter,sans-serif', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 6, boxShadow: '0 2px 6px rgba(124,58,237,.3)', alignSelf: 'flex-end' }}>
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M5 3l14 9-14 9z"/></svg>
                  Run callback #{currentStepIdx + 1}
                </button>
              </div>
            )}
            {isFinished && (
              <div style={{ padding: '8px 12px', background: 'rgba(124,58,237,.08)', border: '1px solid rgba(124,58,237,.2)', borderRadius: 6, font: '400 12px/1.4 Inter,sans-serif', color: '#5B21B6' }}>
                Hit the {MAX_STEPS}-callback limit. Reset to run more.
              </div>
            )}
          </div>
          </>
          )}
        </div>
      </div>
    </div>
  );
}

// Movement indicator like a music chart: shows ↑ / ↓ / — based on how a person's
// rank changed since the previous callback step.
function MovementArrow({ delta, hasPrev }) {
  if (!hasPrev) return <span style={{ width: 14, flex: 'none' }} />;
  if (delta === 0) {
    return <span style={{ width: 14, flex: 'none', color: 'rgba(0,0,0,.3)', font: '700 13px/1 Inter,sans-serif', textAlign: 'center' }}>—</span>;
  }
  const up = delta > 0;
  const color = up ? '#158444' : '#D83E38';
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 1, color, flex: 'none', minWidth: 18 }}>
      <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" style={{ transform: up ? 'rotate(0)' : 'rotate(180deg)' }}>
        <path d="M12 4l8 10h-5v6h-6v-6H4z"/>
      </svg>
      <span style={{ font: '700 10px/1 Inter,sans-serif' }}>{Math.abs(delta)}</span>
    </span>
  );
}

// ── Tiny helpers + presentational sub-components ──
const selectStyle = { height: 34, padding: '0 32px 0 10px', border: '1px solid rgba(0,0,0,.18)', borderRadius: 5, font: '400 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.9)', background: '#fff', cursor: 'pointer', outline: 'none', appearance: 'none', backgroundImage: "url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23888' stroke-width='1.4' fill='none' stroke-linecap='round'/></svg>\")", backgroundRepeat: 'no-repeat', backgroundPosition: 'right 10px center' };
const inputStyle  = { height: 34, padding: '0 10px', border: '1px solid rgba(0,0,0,.18)', borderRadius: 5, font: '400 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.9)', background: '#fff', outline: 'none' };

function ruleTypeLabel(t) {
  return { hours: 'Hours Based', rolodex: 'Standard Rolodex', turns: 'Accumulating Rolodex', hire_date: 'Seniority', employee_id: 'Employee ID', random: 'Random / Lottery' }[t] || 'Custom';
}

function formatDate(d) {
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day   = String(d.getDate()).padStart(2, '0');
  const year  = d.getFullYear();
  let hr = d.getHours(); const min = String(d.getMinutes()).padStart(2, '0');
  const ampm = hr >= 12 ? 'PM' : 'AM';
  hr = hr % 12 || 12;
  return `${month}/${day}/${year} ${hr}:${min} ${ampm}`;
}

function SimSection({ icon, title, children }) {
  const iconPaths = {
    clock:   <><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></>,
    scales:  <><path d="M12 4v16M5 7h14"/><path d="M5 7l-2 6a3 3 0 006 0zm14 0l-2 6a3 3 0 006 0z"/></>,
    filter:  <><path d="M3 4h18l-7 9v7l-4-2v-5z"/></>,
    sparkle: <><path d="M12 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></>,
  };
  return (

function DateTimeInputs({ date, onDateChange }) {
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day   = String(date.getDate()).padStart(2, '0');
  const year  = date.getFullYear();
  let hr12 = date.getHours();
  const ampm = hr12 >= 12 ? 'PM' : 'AM';
  hr12 = hr12 % 12 || 12;
  const min = date.getMinutes();
  // Compact widths so the date + hour + minute + AM/PM fit on a single line.
  const tightSelect = { ...selectStyle, padding: '0 22px 0 8px', backgroundPosition: 'right 6px center' };
  return (
    <>
      <input value={`${month}/${day}/${year}`} readOnly style={{ ...inputStyle, width: 104, padding: '0 8px' }} />
      <select value={hr12} onChange={e => {
        const newHr12 = Number(e.target.value);
        const newH24 = (ampm === 'PM' ? (newHr12 === 12 ? 12 : newHr12 + 12) : (newHr12 === 12 ? 0 : newHr12));
        const next = new Date(date); next.setHours(newH24); onDateChange(next);
      }} style={{ ...tightSelect, width: 54 }}>
        {Array.from({ length: 12 }, (_, i) => i + 1).map(h => <option key={h} value={h}>{h}</option>)}
      </select>
      <select value={String(min).padStart(2, '0')} onChange={e => { const next = new Date(date); next.setMinutes(Number(e.target.value)); onDateChange(next); }} style={{ ...tightSelect, width: 58 }}>
        {[0,15,30,45].map(m => <option key={m} value={String(m).padStart(2,'0')}>{String(m).padStart(2,'0')}</option>)}
      </select>
      <select value={ampm} onChange={e => {
        const nextAmpm = e.target.value;
        const newH24 = (nextAmpm === 'PM' ? (hr12 === 12 ? 12 : hr12 + 12) : (hr12 === 12 ? 0 : hr12));

      }} style={{ ...tightSelect, width: 60 }}>
        <option>AM</option><option>PM</option>
      </select>
    </>
  );
}

// block) can pull the rule list at render time.
window.RULES_DATA = RULES_DATA;

function App() {
  const [building, setBuilding] = useAppSt(null);
  const [subNav, setSubNav]     = useAppSt('approaches');
  // Toast banner shown at the top of Approaches & Rules after a save. We carry
  // the rule's name + a kind ('saved' for new rules, 'updated' for edits) so
  // the banner copy matches the action.
  const [savedToast, setSavedToast] = useAppSt(null);
  // Used to force ApproachesRulesPage to re-read the (mutated) RULES_DATA after
  // a save — by remounting it with a fresh key.
  const [rulesVersion, setRulesVersion] = useAppSt(0);

  const handleSubNav = (key) => {
    setSubNav(key);
    // Don't drop in-progress rule when switching tabs — preserves the user's work.
  };

  // Save handler: push or update RULES_DATA in place, then route to Approaches &
  // Rules and show the saved-toast banner.
  const handleRuleSaved = ({ form, existingRule }) => {
    if (existingRule) {
      const idx = RULES_DATA.findIndex(r => r.id === existingRule.id);
      if (idx >= 0) {
        RULES_DATA[idx] = {
          ...RULES_DATA[idx],
          name: form.ruleName || RULES_DATA[idx].name,
          desc: buildSummary(form),
          config: { ...form },
        };
      }
      setSavedToast({ name: form.ruleName || existingRule.name, kind: 'updated' });
    } else {
      const nextId = RULES_DATA.reduce((m, r) => Math.max(m, r.id), 0) + 1;
      // Drop the new rule at the TOP of the list so it's the first thing the
      // user sees when they land back on Approaches & Rules.
      RULES_DATA.unshift({
        id: nextId,
        name: form.ruleName || 'New Rule',
        desc: buildSummary(form),
        config: { ...form },
        aiCreated: true,
        isNew: true,
      });
      setSavedToast({ name: form.ruleName || 'New Rule', kind: 'saved' });
    }
    window.RULES_DATA = RULES_DATA;
    setRulesVersion(v => v + 1);
    setBuilding(null);
    setSubNav('approaches');
  };

  return (
    <div style={{ display: 'flex', height: '100vh', overflow: 'hidden', background: '#F4F5F7' }}>
      <OuterSidebar />
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
        <TopBar />
        <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
          {/* Hide the sub-sidebar while the rule builder owns the screen — keeps
              the user focused on the two-pane chat + configuration layout. */}
          {!building && <SubSidebar active={subNav} onChange={handleSubNav} />}
          <main style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', position: 'relative' }}>
            {building ? (
              /* Rule builder takes over the main area regardless of which tab launched it. */
              <RuleBuilderView seed={building} onBack={() => setBuilding(null)} onSaved={handleRuleSaved} />
            ) : subNav === 'dashboard' ? (
              <>
                <PageHeader title="Dashboard" />
                <div style={{ flex: 1, overflowY: 'auto', padding: 20 }}>
                  <div style={{ maxWidth: 720, margin: '0 auto' }}>
                    <AIAssistantCard onStart={seed => setBuilding(seed)} />
                  </div>
                </div>
              </>
            ) : subNav === 'approaches' ? (
              <ApproachesRulesPage key={rulesVersion} onStart={seed => setBuilding(seed)} savedToast={savedToast} onDismissToast={() => setSavedToast(null)} />
            ) : subNav === 'history' ? (
              <HistoryPage />
            ) : (
              <>
                <PageHeader title={SUB_LABELS[subNav] || subNav} />
                <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column', gap: 12, color: 'rgba(0,0,0,.3)' }}>
                  <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>
                  <span style={{ font: '400 14px/1 Inter,sans-serif' }}>{SUB_LABELS[subNav]} — content coming soon</span>
                </div>
              </>
            )}
          </main>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
<script src="../../../commentwidget/feedback-widget.js"></script>
</body>
</html>
