<script type="text/babel">
/* global React */
const { useState } = React;

const ICONS = {
  search:    <path d="M15.89 14.48l3.15 3.15c.38.38.38 1-.01 1.4-.39.39-1.01.39-1.4 0l-3.15-3.15a6 6 0 1 1 1.41-1.4zM11 15.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9z"/>,
  check:     <path d="M7.5 11.7l-1.3-1.3a1 1 0 0 0-1.4 1.4L9 16a1 1 0 0 0 1.4 0l8.3-8.3a1 1 0 0 0-1.4-1.4L9.7 14z"/>,
  cross:     <path d="M6.4 6.4l11.2 11.2M17.6 6.4L6.4 17.6" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" fill="none"/>,
  plus:      <path d="M12 5v14M5 12h14" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" fill="none"/>,
  angleDown: <path d="M7 10l5 5 5-5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" fill="none"/>,
  bell:      <path d="M16.99 16.49v-4.5a5 5 0 0 0-10 0v4.5L5 18.5h14zM10 20h4a2 2 0 0 1-4 0z"/>,
  user:      <path d="M12 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 1.5c-3.86 0-7 2.26-7 5.5h14c0-3.24-3.14-5.5-7-5.5z"/>,
  cog:       <path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm8 3.5l-1.5-.4-.5-1.1.8-1.4-1.7-1.7-1.4.8-1.1-.4-.4-1.5h-2.4l-.4 1.5-1.1.4-1.4-.8L6.2 8.6l.8 1.4-.5 1.1-1.5.4V14l1.5.4.5 1.1-.8 1.4 1.7 1.7 1.4-.8 1.1.4.4 1.5h2.4l.4-1.5 1.1-.4 1.4.8 1.7-1.7-.8-1.4.5-1.1 1.5-.4z"/>,
  home:      <path d="M4 20V8l8-4 8 4v12h-5v-7h-6v7z"/>,
  grid:      <path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/>,
  chart:     <path d="M4 20h16v-2H4v2zM4 4v10l4-3 3 4 4-5 5 4V4H4z"/>,
  edit:      <path d="M14.06 4.94l5 5-9.54 9.54-5 .47.47-5zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75z"/>,
  trash:     <path d="M8 7V4h8v3h4v2h-1v12H5V9H4V7h4zm2-1h4V5h-4v1zM7 9v10h10V9H7z"/>,
  ellipsis:  <g><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></g>,
  menu:      <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/>,
  error:     <path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm1 11h-2V9h2v6zm0 3h-2v-2h2v2z"/>,
  filter:    <path d="M4 5h16l-6 8v5l-4 2v-7z"/>,
};

function Icon({ name, size = 18, color = 'currentColor', style }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={color} style={{ flex: 'none', ...style }}>
      {ICONS[name] || null}
    </svg>
  );
}

function Button({ variant = 'secondary', color = 'default', size = 'm', icon, children, onClick, disabled, style }) {
  const palette = {
    default:     { fg: '#0271CE', bd: '#0271CE' },
    destructive: { fg: '#D83E38', bd: '#D83E38' },
    contrast:    { fg: '#192434', bd: 'rgba(0,0,0,.3)' },
  }[color];
  const h = size === 's' ? 30 : 36;
  const styles = {
    primary:   { background: color === 'default' ? '#0271CE' : color === 'destructive' ? '#D83E38' : '#192434', color: '#fff', border: '1px solid transparent' },
    secondary: { background: '#fff', color: palette.fg, border: `1px solid ${palette.bd}` },
    tertiary:  { background: 'transparent', color: palette.fg, border: '1px solid transparent' },
  }[variant];
  return (
    <button onClick={onClick} disabled={disabled} style={{
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 6,
      height: h, padding: icon && !children ? 0 : '0 14px', width: icon && !children ? h : 'auto',
      borderRadius: 4, font: '500 14px/1 Inter,sans-serif', cursor: disabled ? 'not-allowed' : 'pointer',
      opacity: disabled ? 0.5 : 1, transition: 'background .15s, opacity .15s', ...styles, ...style,
    }}>
      {icon && <Icon name={icon} size={16} />}
      {children}
    </button>
  );
}

function TextField({ label, value, onChange, type = 'text', placeholder, error, helper, style }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', ...style }}>
      {label && <label style={{ font: '500 13px/1.3 Inter,sans-serif', color: 'rgba(24,39,58,.94)', marginBottom: 4 }}>{label}</label>}
      <input type={type} value={value ?? ''} onChange={e => onChange?.(e.target.value)} placeholder={placeholder} style={{
        height: 36, padding: '0 12px', border: `1px solid ${error ? '#D83E38' : 'rgba(0,0,0,.3)'}`, borderRadius: 4,
        background: '#fff', font: '400 16px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)', outline: 'none',
      }}
        onFocus={e => !error && (e.target.style.borderColor = '#0271CE')}
        onBlur={e  => !error && (e.target.style.borderColor = 'rgba(0,0,0,.3)')}
      />
      {error  ? <p style={{ font: '400 13px/1.3 Inter,sans-serif', color: '#CA150C', margin: '4px 0 0' }}>{error}</p>
              : helper && <p style={{ font: '400 13px/1.3 Inter,sans-serif', color: 'rgba(0,0,0,.6)', margin: '4px 0 0' }}>{helper}</p>}
    </div>
  );
}

function Badge({ color = 'contrast', children }) {
  const c = {
    primary:  { bg: 'rgba(2,113,206,.1)',   fg: '#0271CE' },
    success:  { bg: 'rgba(21,132,68,.1)',   fg: '#158444' },
    error:    { bg: 'rgba(216,62,56,.1)',   fg: '#CA150C' },
    warning:  { bg: 'rgba(224,120,46,.1)',  fg: '#E0782E' },
    contrast: { bg: 'rgba(28,52,84,.08)',   fg: '#192434' },
  }[color];
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 4,
      height: 22, padding: '0 10px', borderRadius: 11,
      background: c.bg, color: c.fg, font: '500 12px/1 Inter,sans-serif',
    }}>
      {color !== 'primary' && color !== 'contrast' && <span style={{ width: 6, height: 6, borderRadius: '50%', background: 'currentColor' }} />}
      {children}
    </span>
  );
}

const USER_COLORS = ['#195049','#1A4C61','#4A2253','#693C12','#612018','#1C375A','#3D4543'];
function Avatar({ name = '', size = 32, colorIndex }) {
  const idx = colorIndex ?? (name.charCodeAt(0) % USER_COLORS.length);
  const initials = name.split(' ').map(s => s[0]).join('').slice(0,2).toUpperCase();
  return (
    <div style={{
      width: size, height: size, borderRadius: '50%', background: USER_COLORS[idx],
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
      color: '#fff', font: `600 ${Math.round(size * 0.38)}px/1 Inter,sans-serif`, flex: 'none',
    }}>{initials}</div>
  );
}

function Checkbox({ checked, onChange, indeterminate }) {
  return (
    <span onClick={() => onChange?.(!checked)} style={{
      width: 16, height: 16, borderRadius: 4, cursor: 'pointer',
      border: `2px solid ${checked || indeterminate ? '#0271CE' : 'rgba(0,0,0,.3)'}`,
      background: checked || indeterminate ? '#0271CE' : '#fff',
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flex: 'none',
    }}>
      {checked && <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4l3 3 5-6" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>}
      {indeterminate && !checked && <span style={{ width: 8, height: 2, background: '#fff' }} />}
    </span>
  );
}

Object.assign(window, { Icon, Button, TextField, Badge, Avatar, Checkbox, USER_COLORS });
</script>

// Plain-English explanations the AI gives when the user asks "What is X?" mid-build.

const RULE_TYPE_EXPLANATIONS = {
  rolodex:     "A **Standard Rolodex** rule cycles through your roster in a fixed order. Whoever sits at the top of the rotation gets called first; once they accept, they move to the back of the list and the next person up takes the lead. It's best when you want callbacks evenly distributed in a predictable sequence.",
  turns:       "An **Accumulating Rolodex** counts each employee's accepted callbacks (or hours) and rotates them to the back once they hit a configured limit. Until then, the regular rolodex order applies. It's a good fit when you want to cap how often any one person can take callbacks in a cycle.",
  hours:       "An **Accumulation — Hours Based** rule ranks employees by fewest accumulated overtime hours — whoever has worked the least gets called first. The counter resets on a cycle you choose (annually, quarterly, monthly, or rolling).",
  hire_date:   "A **Static — Seniority Based** rule orders employees by hire (or promotion) date — most senior first by default. The order doesn't shift between callbacks; it's the same list every time, with a tiebreaker for employees who share the same date.",
  employee_id: "A **Static — By Employee ID** rule uses a natural alphanumerical sort on employee ID/name. Like seniority it's a fixed list — useful when you want a deterministic, easy-to-explain order.",
  random:      "A **Random / Lottery** rule generates a fresh random order on a schedule (every callback, daily, weekly, etc). You can weight it (pure random, weighted by gap since last callback, or weighted by hours) and add guardrails so the same person isn't called repeatedly.",
};

// Match a user's "what is X?" question to one of the rule-type keys above.
function matchRuleTypeQuestion(text) {
  const m = text.match(/^\s*what(?:'s| is| are)\s+(?:an?\s+|the\s+)?(.+?)\s*\??\s*$/i);
  if (!m) return null;
  const q = m[1].toLowerCase();
  if (/accumulating\s*rolodex|accumulating/.test(q))       return 'turns';
  if (/standard\s*rolodex|^rolodex$|\brolodex\b/.test(q))  return 'rolodex';
  if (/hours[- ]based|accumulation.*hours|overtime hours|hours/.test(q)) return 'hours';
  if (/seniority|hire\s*date/.test(q))                     return 'hire_date';
  if (/employee\s*id|by\s*id|alphanumer/.test(q))          return 'employee_id';
  if (/random|lottery/.test(q))                            return 'random';

// ── Preview Mode: scenario pool used by the AI to generate fresh hypotheticals ─
// Rather than a fixed carousel, the AI mixes and matches these fragments so each
// "different scenario" feels new, and the user can tweak any axis (approach,
// duration, urgency) directly via chips.
const SCENARIO_PARTS = {
  approaches: ['Firefighter 2', 'Captains', 'Patrol Deputy', 'Bay Guard', 'Battalion Chief', 'FF3'],
  durations:  ['2 hours', '4 hours', '6 hours', '8 hours', '12 hours', '24 hours'],
  urgencies:  [
    { label: 'Low',      color: '#158444' },
    { label: 'Standard', color: '#0271CE' },
    { label: 'High',     color: '#D83E38' },
    { label: 'Critical', color: '#9333EA' },
  ],
  whens:      ['Tonight · 22:00', 'Tomorrow · 06:00', 'Today · 14:30', 'Saturday · 08:00', 'Sunday · 16:00', 'Friday · 18:00'],
  triggers:   [
    n => `Engine ${n} needs fire watch coverage for the night shift.`,
    () => `Captain on B-shift called in sick — relief needed.`,
    () => `Mutual-aid request — additional staffing during a high-volume call period.`,
    () => `Spec-ops standby for a planned event.`,
    () => `Last-minute vacation gap — backfill needed.`,
    n => `Station ${n} short-staffed after a mid-shift call-out.`,
  ],
};

const pickRandom = (arr, exclude) => {
  const pool = exclude == null ? arr : arr.filter(x => (typeof x === 'object' ? x.label : x) !== exclude);
  return pool[Math.floor(Math.random() * pool.length)];
};

function generateScenario(prev) {
  const approach = pickRandom(SCENARIO_PARTS.approaches, prev?.approach);
  const duration = pickRandom(SCENARIO_PARTS.durations, prev?.duration);
  const urgency  = pickRandom(SCENARIO_PARTS.urgencies, prev?.urgency);
  const when     = pickRandom(SCENARIO_PARTS.whens, prev?.when);
  const trigger  = pickRandom(SCENARIO_PARTS.triggers);
  const detail   = trigger(Math.floor(Math.random() * 30) + 1);
  return {
    title:        `${duration} · ${urgency.label.toLowerCase()} urgency — ${approach}`,
    detail,
    approach,
    duration,
    when,
    urgency:      urgency.label,
    urgencyColor: urgency.color,
  };
}

// Suggestion chips offered after each scenario change. Mix scenario tweaks with

const SCENARIO_CHIPS = [
  'Different scenario',
  'Bump urgency higher',
  'Try a longer shift',
  'Try a shorter shift',
  'Switch approach',
];

// Step-by-step dispatch sim. Uses the rule's decline behavior so the preview reflects
// the rule the user just built, not a generic flow.
function simulateCallFlow(form, ranked) {
  const t = (mins) => `${String(Math.floor(mins / 60)).padStart(2,'0')}:${String(mins % 60).padStart(2,'0')}`;
  const declineLabel = form.declineAction === 'Move to back of list' ? 'Moves to end of list'
    : form.declineAction === 'Stay in position' ? 'Keeps current position'
    : form.declineAction === 'Penalty points' ? `Penalty: ${form.penaltyPoints || 'set'} pts`
    : 'No follow-up rule set';
  // Mock dispatch: #1 declines, #2 accepts (typical real-world pattern).
  return [
    { step: 1, name: ranked[0]?.name || '—', action: 'Auto-call placed', meta: `Top of predicted order`, outcome: 'Declined', outcomeNote: '1 min 12s — listed as unavailable', tone: 'decline', followUp: declineLabel, timestamp: t(0) },
    { step: 2, name: ranked[1]?.name || '—', action: 'Auto-call placed', meta: `Next in line per rule`, outcome: 'Accepted', outcomeNote: '42s — confirmed via SMS', tone: 'accept', followUp: 'Callback filled — dispatch logged', timestamp: t(2) },
  ];
}

function simulateAiAnswer(q, form, scenario) {
  const l = q.toLowerCase();
  if (l.includes('decline')) {
    const action = form.declineAction || 'a default action (not yet set)';
    const flow = form.declineAction === 'Move to back of list'
      ? "they go to the end of the list and the next person is contacted in order"
      : form.declineAction === 'Stay in position'
      ? "they keep their current rank; the next person is contacted, and they'll be eligible again on the next callback"
      : form.declineAction === 'Penalty points'
      ? `they accrue ${form.penaltyPoints || 'the configured'} penalty points and the next person is contacted`
      : "the system continues to the next person but doesn't change their standing";
    const fourth = rankEmployees(form)[3]?.name || 'the 4th-ranked employee';
    return `Your rule's decline action is "${action}", so when an employee declines ${flow}. If your top 3 all decline in sequence, you'd reach #4 in the predicted order before someone accepts — for this scenario, that's likely ${fourth}.`;
  }
  if (l.includes('tie')) {
    const tb = form.tieBreaker || 'seniority (the default tiebreaker)';
    const dir = form.tieBreakerOrder ? `, ${form.tieBreakerOrder.toLowerCase()} preferred` : '';
    return `Tied employees are ordered by ${tb.toLowerCase()}${dir}. So if two people have identical primary scores, the rule walks the tiebreaker as a deterministic deciding factor — no coin flip.`;
  }
  if (l.includes('fiscal') || l.includes('reset') || l.includes('new year')) {
    if (form.resetCadence) return `Your reset cadence is "${form.resetCadence}". At the start of each new period the accumulated hours/turns wipe back to zero, and the first cycle after reset falls back to ${form.tieBreaker?.toLowerCase() || 'seniority (the tiebreaker)'} for ordering. New employees added mid-period start at zero alongside everyone else.`;
    return `You haven't picked a reset cadence yet. Without one, the counter runs as a rolling total. Most departments set this to "Annually (fiscal year)" or "Quarterly" so the playing field resets predictably.`;
  }
  if (l.includes('pto') || l.includes('unavailable') || l.includes('vacation') || l.includes('sick')) {
    return `Employees marked unavailable (PTO, sick, off-shift, etc.) for the requested time window are skipped automatically — their position is preserved and they're re-evaluated for the next callback. The rule isn't penalized either way.`;
  }
  if (l.includes('first') || l.includes('top')) {
    const top = rankEmployees(form)[0];
    return top ? `Right now, ${top.name} is at the top of the predicted call order for this scenario. They'd be auto-dialed first; if they don't respond within the response window, your rule's decline behavior kicks in and we move to ${rankEmployees(form)[1]?.name || 'the next-ranked employee'}.` : 'No employees match this scenario yet — pick an approach to populate the predicted list.';
  }
  return `For this scenario (${scenario.title}), the rule would walk the predicted call order on the left, applying your tiebreaker and decline behavior at each step. Try giving me a more specific situation — e.g. "what if Marta and Priya are tied" — and I'll trace it through for you.`;
}

function PreviewModal({ form, onClose, onApplyToConfig }) {
  const [scenario, setScenario] = useState(() => generateScenario());
  const [chat, setChat] = useState(() => [
    { role: 'ai', text: "Here's a hypothetical to try your rule against. Want me to generate a different one, tweak this scenario, or apply something here to your rule?", chips: SCENARIO_CHIPS },
  ]);
  const [aiInput, setAiInput] = useState('');
  // Predicted order responds to the active scenario — apply the scenario's
  // approach as a filter, and use the rule's tiebreaker / ranking factor for
  // ordering. This is mock data, but the simulation should feel scenario-driven.
  const ranked = rankEmployees(form).slice(0, 4);
  const flow   = simulateCallFlow(form, ranked);

  // Whether the active scenario's approach is missing from the rule's selected
  // approaches — surfaces the "Apply to rule" affordance.
  const scenarioApproachNotInRule =
    form.ruleAffects === 'selected' && !(form.selectedApproaches || []).includes(scenario.approach);

  const pushChat = (userText, aiText, chips = SCENARIO_CHIPS) => {
    setChat(h => [
      ...h,
      { role: 'user', text: userText },
      { role: 'ai',   text: aiText, chips },
    ]);
  };

  const handleChip = (chip) => {
    if (chip === 'Different scenario') {
      const next = generateScenario(scenario);
      setScenario(next);
      pushChat(chip, `New hypothetical: ${next.detail} (${next.duration}, ${next.urgency.toLowerCase()} urgency for ${next.approach}). The predicted call order updated above.`);
      return;
    }
    if (chip === 'Bump urgency higher') {
      const order = SCENARIO_PARTS.urgencies;
      const idx   = order.findIndex(u => u.label === scenario.urgency);
      const next  = order[Math.min(idx + 1, order.length - 1)];
      const updated = { ...scenario, urgency: next.label, urgencyColor: next.color, title: `${scenario.duration} · ${next.label.toLowerCase()} urgency — ${scenario.approach}` };
      setScenario(updated);
      pushChat(chip, idx === order.length - 1 ? `Already at the top urgency tier (${next.label}). Nothing higher.` : `Bumped urgency to ${next.label}. Same call order, but the dispatcher would expect a faster response window in production.`);
      return;
    }
    if (chip === 'Try a longer shift' || chip === 'Try a shorter shift') {
      const order = SCENARIO_PARTS.durations;
      const idx   = order.indexOf(scenario.duration);
      const dir   = chip === 'Try a longer shift' ? 1 : -1;
      const next  = order[Math.min(order.length - 1, Math.max(0, idx + dir))];
      const updated = { ...scenario, duration: next, title: `${next} · ${scenario.urgency.toLowerCase()} urgency — ${scenario.approach}` };
      setScenario(updated);
      pushChat(chip, `Changed duration to ${next}. If your rule has a shift-length filter (min ${form.minShift || '—'}h, max ${form.maxShift || '—'}h), this scenario ${(form.minShift && Number(next) < Number(form.minShift)) || (form.maxShift && Number(next) > Number(form.maxShift)) ? 'would be filtered out' : 'still qualifies'}.`);
      return;
    }
    if (chip === 'Switch approach') {
      const approach = pickRandom(SCENARIO_PARTS.approaches, scenario.approach);
      const updated = { ...scenario, approach, title: `${scenario.duration} · ${scenario.urgency.toLowerCase()} urgency — ${approach}` };
      setScenario(updated);
      pushChat(chip, `Switched the scenario approach to ${approach}. ${form.ruleAffects === 'selected' && !(form.selectedApproaches || []).includes(approach) ? `Heads up — your rule doesn't currently include ${approach}, so it wouldn't fire on this scenario. Want to add it to your rule?` : `Your rule already covers ${approach}, so it would fire.`}`);
      return;
    }
    if (chip === 'Apply this approach to rule' && onApplyToConfig) {
      onApplyToConfig({ addApproach: scenario.approach });
      pushChat(chip, `Done — ${scenario.approach} added to your rule's selected approaches. The Rule Configuration panel on the right reflects the change.`);
      return;
    }
    if (chip === 'Apply this shift length to rule' && onApplyToConfig) {
      const n = parseInt(scenario.duration, 10);
      onApplyToConfig({ minShift: String(Math.max(1, n - 2)), maxShift: String(n + 2) });
      pushChat(chip, `Applied a shift-length filter centered on ${scenario.duration}. Check the Rule Configuration panel for the new min/max values.`);
      return;
    }
    // Fallback — treat as free-form question
    askFreeform(chip);
  };

  const askFreeform = (q) => {
    if (!q.trim()) return;
    const text = q.trim();
    setChat(h => [...h, { role: 'user', text }, { role: 'ai', text: simulateAiAnswer(text, form, scenario), chips: SCENARIO_CHIPS }]);
    setAiInput('');
  };
  return ReactDOM.createPortal(
    <div onClick={onClose}
      style={{ position: 'fixed', inset: 0, zIndex: 10000,
        background: 'rgba(20, 14, 40, .55)', backdropFilter: 'blur(3px)',
        display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24,
        animation: 'cbToast .2s ease both' }}>
      <div onClick={e => e.stopPropagation()}
        style={{ width: '100%', maxWidth: 820, maxHeight: '92vh', display: 'flex', flexDirection: 'column',
          background: '#fff', borderRadius: 14, overflow: 'hidden',
          boxShadow: '0 30px 80px rgba(28,18,68,.45), 0 4px 12px rgba(0,0,0,.18)' }}>

        {/* Header */}
        <div style={{ padding: '18px 22px', background: 'linear-gradient(135deg,#7C3AED 0%,#6D28D9 50%,#5B21B6 100%)', display: 'flex', alignItems: 'center', gap: 14, position: 'relative', overflow: 'hidden' }}>
          <div style={{ position: 'absolute', top: -20, right: 80, width: 90, height: 90, borderRadius: '50%', background: 'rgba(167,139,250,.25)', filter: 'blur(20px)', pointerEvents: 'none' }} />
          <div style={{ width: 40, height: 40, borderRadius: 10, background: 'rgba(255,255,255,.18)', border: '1px solid rgba(255,255,255,.28)', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none' }}>
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </div>

              Simulating <strong>{form.ruleName || 'this rule'}</strong> against a hypothetical scenario · no go-live impact
            </div>

                        {/* Conditional "apply to config" affordances based on scenario state. */}
                        {isLast && scenarioApproachNotInRule && onApplyToConfig && (
                          <button onClick={() => handleChip('Apply this approach to rule')}
                            style={{ height: 28, padding: '0 12px', borderRadius: 14, border: 'none', background: 'linear-gradient(135deg,#7C3AED,#5B21B6)', color: '#fff', font: '600 12px/1 Inter,sans-serif', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 5, boxShadow: '0 1px 5px rgba(124,58,237,.35)', whiteSpace: 'nowrap' }}>
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.6" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>
                            Add {scenario.approach} to rule
                          </button>
                        )}
                        {isLast && onApplyToConfig && (!form.minShift && !form.maxShift) && (
                          <button onClick={() => handleChip('Apply this shift length to rule')}
                            style={{ height: 28, padding: '0 12px', borderRadius: 14, border: '1.5px solid rgba(124,58,237,.4)', background: 'transparent', color: '#7C3AED', font: '600 12px/1 Inter,sans-serif', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 5, whiteSpace: 'nowrap' }}>
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>

            </div>

            {/* Free-form input — user can describe a custom scenario or ask a follow-up */}
            <div style={{ position: 'relative' }}>
              <input
                value={aiInput}
                onChange={e => setAiInput(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter') askFreeform(aiInput); }}
                placeholder="Describe a scenario or ask a follow-up… e.g. 'What if the top 3 decline?'"
                style={{ width: '100%', height: 38, padding: '0 44px 0 14px', border: '1.5px solid rgba(124,58,237,.3)', borderRadius: 8, outline: 'none', background: '#fff', font: '500 12.5px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)' }}

              />
              <button onClick={() => askFreeform(aiInput)}

                  boxShadow: aiInput.trim() ? '0 2px 6px rgba(124,58,237,.35)' : 'none' }}>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12l20-9-9 20-2-9z"/></svg>
              </button>
            </div>
          </div>

        </div>

        {/* Footer — no more carousel; close + reset hypotheticals only. */}
        <div style={{ padding: '12px 22px', borderTop: '1px solid rgba(0,0,0,.07)', background: '#FAFAFC', display: 'flex', alignItems: 'center', gap: 10 }}>
          <span style={{ flex: 1, font: '400 11px/1.4 Inter,sans-serif', color: 'rgba(0,0,0,.45)' }}>
            Generic hypothetical — no historical data needed. Nothing applied to your rule until you confirm.
          </span>
          <button onClick={() => { setScenario(generateScenario(scenario)); setChat([{ role: 'ai', text: "Reset — here's a fresh hypothetical. Want me to generate another, tweak this one, or apply something to your rule?", chips: SCENARIO_CHIPS }]); }}
            style={{ height: 36, padding: '0 14px', borderRadius: 7, border: '1px solid rgba(124,58,237,.35)', background: '#fff', color: '#7C3AED', font: '600 13px/1 Inter,sans-serif', cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 6 }}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>
            Reset hypothetical
          </button>
          <button onClick={onClose}
            style={{ height: 36, padding: '0 18px', borderRadius: 7, border: 'none', background: 'linear-gradient(135deg,#7C3AED,#5B21B6)', color: '#fff', font: '600 13px/1 Inter,sans-serif', cursor: 'pointer', boxShadow: '0 2px 8px rgba(124,58,237,.35)' }}>
            Close preview
          </button>
        </div>

      </div>
    </div>,
    document.body
  );
}

function rankEmployees(form) {
  return [...MOCK_EMPLOYEES].sort((a, b) => {
    let primary = 0;
    if (form.ruleType === 'hours') primary = a.hours - b.hours;
    else if (form.ruleType === 'hire_date') primary = new Date(a.hireDate) - new Date(b.hireDate);
    else if (form.ruleType === 'rolodex') primary = 0;
    else if (form.ruleType === 'employee_id') primary = a.name.localeCompare(b.name);
    else if (form.ruleType === 'random') primary = 0; // mock data preview — keep stable order
    else primary = a.hours - b.hours;
    if (primary !== 0) return primary;
    if (form.tieBreaker === 'Seniority (hire date)') return new Date(a.hireDate) - new Date(b.hireDate);
    if (form.tieBreaker === 'Last shift worked') return a.lastShift.localeCompare(b.lastShift);
    if (form.tieBreaker === 'Last callback date') return a.lastCallback.localeCompare(b.lastCallback);
    return a.name.localeCompare(b.name);
  });
}

function buildSummary(form) {
  const parts = [];
  const approachLabel = form.ruleAffects === 'all' ? 'all approaches' :
    form.selectedApproaches.length ? form.selectedApproaches.join(' & ') : 'selected approaches';
  const typeLabels = {
    hours:       'fewest accumulated callback hours',
    turns:       'an accumulating rolodex (rotate after a set limit)',
    hire_date:   'seniority (hire or promotion date)',
    rolodex:     'a standard rolodex rotation',
    employee_id: 'natural alphanumerical sort on employee ID',
    random:      'a random / lottery order',
    custom:      'custom ranking',
  };
  parts.push(`Callback list for ${approachLabel} ranked by ${typeLabels[form.ruleType] || 'fewest accumulated callback hours'}`);
  if (form.lookBack) parts[0] += ` over a ${form.lookBack}-day window`;
  if (form.tieBreaker) parts.push(`Ties broken by ${form.tieBreaker.toLowerCase()}`);
  if (form.declineAction) parts.push(`Declines: ${form.declineAction.toLowerCase()}`);
  if (form.minShift || form.maxShift) {
    const range = [form.minShift && `min ${form.minShift}h`, form.maxShift && `max ${form.maxShift}h`].filter(Boolean).join(', ');
    parts.push(`Shift filter: ${range}`);
  }
  return parts.join('. ') + '.';
}

function RuleSummary({ form }) {
  // Preview Ranking tab is the default — when the AI assistant builds and the
  // configuration scrolls up, the user can see the live ranking change as they
  // make selections.
  const [tab, setTab] = useState('preview');
  const summary = buildSummary(form);
  const hasDetails = form.tieBreaker || form.declineAction || form.lookBack || form.ruleAffects === 'selected';
  const topEmp = rankEmployees(form)[0];

  const TabBtn = ({ value, label }) => {
    const active = tab === value;
    return (
      <button onClick={() => setTab(value)}
        style={{
          padding: '8px 12px 9px', background: 'none', border: 'none', cursor: 'pointer',
          borderBottom: active ? '2px solid #7C3AED' : '2px solid transparent',
          marginBottom: -1,
          font: `${active ? 600 : 500} 11px/1 Inter,sans-serif`,
          color: active ? '#7C3AED' : 'rgba(124,58,237,.55)',
          textTransform: 'uppercase', letterSpacing: '.06em', transition: 'color .15s',
        }}>
        {label}
      </button>
    );
  };

  return (
    <div style={{ marginBottom: 0, background: 'linear-gradient(135deg, rgba(124,58,237,.06) 0%, rgba(99,102,241,.04) 100%)', border: '1px solid rgba(124,58,237,.18)', borderRadius: 10, overflow: 'hidden' }}>
      {/* Tab strip — Preview Ranking first, Rule Summary second */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 4, padding: '0 12px', borderBottom: '1px solid rgba(124,58,237,.16)', background: 'rgba(255,255,255,.5)' }}>
        <TabBtn value="preview" label="Preview Ranking" />
        <TabBtn value="summary" label="Rule Summary" />
      </div>

      {/* Tab content */}
      {tab === 'preview' ? (
        <div style={{ padding: '10px 12px 12px' }}>
          <PreviewRankingList form={form} compact />
        </div>
      ) : (
        <div style={{ padding: '12px 14px' }}>
          <div style={{ font: '400 13px/1.65 Inter,sans-serif', color: 'rgba(24,39,58,.8)' }}>
            {hasDetails ? summary : <span style={{ color: 'rgba(0,0,0,.4)', fontStyle: 'italic' }}>Answer the AI's questions to see your rule take shape…</span>}
          </div>
        </div>
      )}
    </div>
  );
}

function PreviewRankingList({ form, compact }) {
  const rankedAll = rankEmployees(form);
  // In the tabbed compact view, keep the list short so it fits a laptop screen
  // without dominating the panel — show top 4 plus a "more" hint.
  const ranked = compact ? rankedAll.slice(0, 4) : rankedAll;
  const hiddenCount = rankedAll.length - ranked.length;
  const getMetric = (emp) => {
    if (form.ruleType === 'hire_date') return emp.hireDate.slice(0,7);
    if (form.ruleType === 'rolodex') return '—';
    return `${emp.hours}h`;
  };
  return (
    <div style={{ marginBottom: compact ? 0 : 22, marginTop: 0 }}>
      <div style={{ background: '#fff', border: `1px solid ${compact ? 'rgba(124,58,237,.2)' : 'rgba(0,0,0,.1)'}`, borderRadius: 8, overflow: 'hidden', boxShadow: compact ? '0 1px 6px rgba(124,58,237,.08)' : 'none' }}>
        {ranked.map((emp, idx) => (
          <div key={emp.name} style={{
            display: 'flex', alignItems: 'center', gap: 9,
            padding: compact ? '7px 11px' : '9px 14px',
            borderBottom: idx < ranked.length - 1 ? '1px solid rgba(0,0,0,.06)' : 'none',
            background: idx === 0 ? 'linear-gradient(135deg, rgba(124,58,237,.08) 0%, rgba(91,33,182,.04) 100%)' : 'transparent',
            borderLeft: idx === 0 ? '3px solid #7C3AED' : '3px solid transparent',
          }}>
            <div style={{ width: 20, height: 20, borderRadius: '50%', background: idx === 0 ? 'linear-gradient(135deg,#7C3AED,#5B21B6)' : idx === 1 ? 'rgba(124,58,237,.15)' : 'rgba(0,0,0,.07)', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none', boxShadow: idx === 0 ? '0 1px 4px rgba(124,58,237,.3)' : 'none' }}>
              <span style={{ font: `${idx === 0 ? 700 : 500} 10px/1 Inter,sans-serif`, color: idx === 0 ? '#fff' : idx === 1 ? '#7C3AED' : 'rgba(0,0,0,.4)' }}>{idx + 1}</span>
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <span style={{ font: `${idx === 0 ? 600 : 500} 12.5px/1.1 Inter,sans-serif`, color: idx === 0 ? 'rgba(24,39,58,.96)' : 'rgba(24,39,58,.8)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{emp.name}</span>
                {idx === 0 && <span style={{ font: '700 8.5px/1 Inter,sans-serif', color: '#fff', background: 'linear-gradient(135deg,#7C3AED,#5B21B6)', padding: '2px 5px', borderRadius: 3, textTransform: 'uppercase', letterSpacing: '.05em', flex: 'none' }}>NEXT</span>}
              </div>
              {!compact && (
                <div style={{ font: '400 11px/1 Inter,sans-serif', color: idx === 0 ? 'rgba(124,58,237,.6)' : 'rgba(0,0,0,.4)', marginTop: 3 }}>Last callback: {emp.lastCallback}</div>
              )}
            </div>
            <div style={{ font: '600 11.5px/1 Inter,sans-serif', color: idx === 0 ? '#7C3AED' : 'rgba(0,0,0,.4)', flex: 'none', background: idx === 0 ? 'rgba(124,58,237,.08)' : 'transparent', padding: idx === 0 ? '3px 7px' : '0', borderRadius: idx === 0 ? 4 : 0 }}>{getMetric(emp)}</div>
          </div>
        ))}
      </div>
      <div style={{ font: '400 10.5px/1.3 Inter,sans-serif', color: 'rgba(0,0,0,.35)', marginTop: 5, textAlign: 'center' }}>
        {compact && hiddenCount > 0
          ? `+${hiddenCount} more — reflects current rule configuration`
          : 'Mock data — reflects current rule configuration'}
      </div>
    </div>
  );
}

function FormGroup({ label, children }) {

function RichSelect({ value, onChange, options, placeholder }) {
  const [open, setOpen] = useState(false);
  const [dropPos, setDropPos] = useState(null);
  const ref = useRef(null);
  const btnRef = useRef(null);
  const dropRef = useRef(null);
  const selected = options.find(o => o.value === value);

  const openDrop = () => {
    if (btnRef.current) {
      const r = btnRef.current.getBoundingClientRect();
      setDropPos({ top: r.bottom + 4, left: r.left, width: r.width });
    }
    setOpen(true);
  };

  useEffect(() => {
    if (!open) return;
    const update = () => {
      if (btnRef.current) {
        const r = btnRef.current.getBoundingClientRect();
        setDropPos({ top: r.bottom + 4, left: r.left, width: r.width });
      }
    };
    const handler = (e) => {
      const inBtn  = ref.current  && ref.current.contains(e.target);
      const inDrop = dropRef.current && dropRef.current.contains(e.target);
      if (!inBtn && !inDrop) setOpen(false);
    };
    window.addEventListener('scroll', update, true);
    window.addEventListener('resize', update);
    document.addEventListener('mousedown', handler);
    return () => {
      window.removeEventListener('scroll', update, true);
      window.removeEventListener('resize', update);
      document.removeEventListener('mousedown', handler);
    };
  }, [open]);

  const dropdown = open && dropPos && ReactDOM.createPortal(
    <div ref={dropRef} style={{ position: 'fixed', top: dropPos.top, left: dropPos.left, width: dropPos.width, zIndex: 9999,
      background: '#fff', border: '1px solid rgba(0,0,0,.12)', borderRadius: 8,
      boxShadow: '0 6px 24px rgba(0,0,0,.13)', overflow: 'hidden' }}>
      {options.map((opt, i) => {
        const isSel = opt.value === value;
        return (
          <button key={opt.value}
            onClick={() => { onChange(opt.value); setOpen(false); }}
            style={{ width: '100%', padding: '10px 12px', display: 'flex', alignItems: 'center', gap: 11,
              background: isSel ? 'rgba(124,58,237,.07)' : 'transparent',
              border: 'none', borderBottom: i < options.length - 1 ? '1px solid rgba(0,0,0,.06)' : 'none',
              cursor: 'pointer', textAlign: 'left', transition: 'background .12s' }}
            onMouseEnter={e => { if (!isSel) e.currentTarget.style.background = 'rgba(124,58,237,.04)'; }}
            onMouseLeave={e => { if (!isSel) e.currentTarget.style.background = 'transparent'; }}>
            <div style={{ width: 36, height: 36, borderRadius: 8, flex: 'none',
              background: isSel ? 'rgba(124,58,237,.14)' : 'rgba(124,58,237,.08)',
              display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <i className={opt.icon} style={{ fontSize: 14, color: '#7C3AED' }} />
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ font: '600 13px/1.2 Inter,sans-serif', color: isSel ? '#7C3AED' : 'rgba(24,39,58,.94)', marginBottom: 2 }}>{opt.title}</div>
              <div style={{ font: '400 11px/1.4 Inter,sans-serif', color: 'rgba(0,0,0,.5)' }}>{opt.desc}</div>
            </div>
            {isSel && (
              <svg width="14" height="14" viewBox="0 0 24 24" fill="#7C3AED" style={{ flex: 'none' }}><path d="M9 16l-4-4 1.4-1.4L9 13.2l8.6-8.6L19 6z"/></svg>
            )}
          </button>
        );
      })}
    </div>,
    document.body
  );

  return (
    <div ref={ref} style={{ position: 'relative' }}>
      <button ref={btnRef} onClick={() => open ? setOpen(false) : openDrop()}
        style={{ width: '100%', height: 40, padding: '0 10px', display: 'flex', alignItems: 'center', gap: 10,
          border: `1px solid ${open ? '#7C3AED' : 'rgba(0,0,0,.18)'}`, borderRadius: 6,
          background: '#fff', cursor: 'pointer', outline: 'none', transition: 'border-color .15s',
          boxShadow: open ? '0 0 0 2px rgba(124,58,237,.12)' : 'none' }}>
        {selected ? <>
          <div style={{ width: 26, height: 26, borderRadius: 6, background: 'rgba(124,58,237,.1)', display: 'flex', alignItems: 'center', justifyContent: 'center', flex: 'none' }}>
            <i className={selected.icon} style={{ fontSize: 12, color: '#7C3AED' }} />
          </div>
          <span style={{ flex: 1, font: '500 13px/1 Inter,sans-serif', color: 'rgba(24,39,58,.94)', textAlign: 'left' }}>{selected.title}</span>
        </> : (
          <span style={{ flex: 1, font: '400 13px/1 Inter,sans-serif', color: 'rgba(0,0,0,.4)', textAlign: 'left' }}>{placeholder || 'Select…'}</span>
        )}
        <svg width="10" height="6" viewBox="0 0 10 6" fill="none" style={{ flex: 'none', transition: 'transform .2s', transform: open ? 'rotate(180deg)' : 'none' }}>
          <path d="M1 1l4 4 4-4" stroke="rgba(0,0,0,.45)" strokeWidth="1.4" strokeLinecap="round"/>
        </svg>
      </button>
      {dropdown}
    </div>
  );
}

// ── Existing-rule edit mode ─────────────────────────────────────────────────
// When a user clicks a rule row in the Approaches & Rules page, we open the
// builder pre-filled with that rule's config. The chat replaces the "build from
// scratch" flow with a summary + a small set of high-leverage change options.
// Shown only after the user explicitly asks to make changes. Until then the
// initial chips mix exploratory questions ("Why is X first?") with the high-
// leverage "Let's change something" / "All good — save" pair.
const EDIT_MENU_CHIPS       = ['Change groups', 'Change tiebreaker', 'Change reset cadence', 'Change decline behavior', 'All good — save'];
const EDIT_CHANGE_TRIGGER   = "Let's change something";
const EDIT_SAVE_CHIP        = 'All good — save';
const EDIT_ASK = {
  'Change groups':           { text: "Which approach(es) should this rule apply to now?", chips: ['Firefighter 2','Captains','Patrol Deputy','Bay Guard','Battalion Chief','FF3','All approaches'], multi: true, field: 'selectedApproaches' },
  'Change tiebreaker':       { text: "How should ties be broken?",                        chips: ['Seniority (hire date)','Last shift worked','Last callback date','Alphabetical'],                 field: 'tieBreaker' },
  'Change reset cadence':    { text: "When should the counter reset?",                    chips: ['Annually (fiscal year)','Quarterly','Monthly','Never (rolling total)'],                          field: 'resetCadence' },
  'Change decline behavior': { text: "What should happen when someone declines?",         chips: ['Move to back of list','Stay in position','Penalty points'],                                       field: 'declineAction' },
};

function summarizeRule(rule) {
  const c = rule.config || {};
  const typeLabel = {
    hours: 'Accumulation — Hours Based', rolodex: 'Standard Rolodex',
    turns: 'Accumulating Rolodex',       hire_date: 'Static — Seniority Based',
    employee_id: 'Static — By Employee ID', random: 'Random / Lottery',
  }[c.ruleType] || c.ruleType || 'custom';
  const article = /^[aeiou]/i.test(typeLabel) ? 'an' : 'a';

  // Join approach names naturally: "A", "A and B", "A, B, and C".
  const formatList = (arr) => {
    if (!arr || !arr.length) return '';
    if (arr.length === 1) return arr[0];
    if (arr.length === 2) return `${arr[0]} and ${arr[1]}`;
    return `${arr.slice(0, -1).join(', ')}, and ${arr[arr.length - 1]}`;
  };
  const groupsText = c.ruleAffects === 'selected' && (c.selectedApproaches || []).length
    ? formatList(c.selectedApproaches)
    : 'all approaches';

  const sentences = [];
  sentences.push(`This is ${article} ${typeLabel} rule, applied to ${groupsText}.`);

  // Standard Rolodex specifics — post-accept movement + per-employee response window.
  if (c.rolodexAcceptMove || c.responseTime) {
    const parts = [];
    if (c.rolodexAcceptMove) parts.push(`employees are ${c.rolodexAcceptMove.toLowerCase()}`);
    if (c.responseTime)      parts.push(`each has ${c.responseTime} to respond`);
    sentences.push(`After accepting a callback, ${parts.join(', and ')}.`);
  }

  // Accumulating Rolodex specifics — what accumulates + the rotation limit.
  if (c.accumulationType || c.accumulationLimit) {
    if (c.accumulationType && c.accumulationLimit) {
      sentences.push(`Employees accumulate ${c.accumulationType.toLowerCase()} and rotate to the back of the list once they reach ${c.accumulationLimit}.`);
    } else if (c.accumulationType) {
      sentences.push(`Employees accumulate ${c.accumulationType.toLowerCase()}.`);
    } else {
      sentences.push(`Employees rotate to the back of the list once they reach ${c.accumulationLimit}.`);
    }
  }

  // Hours / turns — reset cadence + which outcomes count toward the counter.
  if (c.resetCadence || c.hoursCountedOutcomes) {
    const parts = [];
    if (c.resetCadence)         parts.push(`resets ${c.resetCadence.toLowerCase()}`);
    if (c.hoursCountedOutcomes) parts.push(`counts ${c.hoursCountedOutcomes.toLowerCase()}`);
    sentences.push(`The counter ${parts.join(' and ')}.`);
  }

  // Tiebreaker.
  if (c.tieBreaker) {
    let s = `Ties are broken by ${c.tieBreaker.toLowerCase()}`;
    if (c.tieBreakerOrder) s += ` (${c.tieBreakerOrder.toLowerCase()})`;
    sentences.push(s + '.');
  }

  // Decline behavior — phrase based on which action was picked.
  if (c.declineAction) {
    let s;
    if (c.declineAction === 'Move to back of list') {
      s = `If someone declines, they're moved to the back of the list`;
      if (c.declineScope) s += ` (${c.declineScope.toLowerCase()})`;
    } else if (c.declineAction === 'Stay in position') {
      s = `If someone declines, they keep their current position`;
      if (c.declineCooldown) s += ` with a ${c.declineCooldown.toLowerCase()} cooldown before they can be offered again`;
    } else if (c.declineAction === 'Penalty points') {
      s = `Each decline costs ${c.penaltyPoints || 'some'} penalty point${c.penaltyPoints === '1' ? '' : 's'}`;
    } else {
      s = `On decline: ${c.declineAction.toLowerCase()}`;
    }
    sentences.push(s + '.');
  }

  return sentences.join(' ');
}
