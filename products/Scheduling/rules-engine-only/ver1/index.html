<style>
  /* =====================================================================
     CallBack — Rules Engine (vanilla JS + Vector Web Components)
     Converted from the original React/Babel prototype: same screens, same
     flows, same copy — rebuilt on the repo-standard stack. Base colors map
     to the Vector theme's Lumo tokens; the purple "AI" accent palette is a
     deliberate design accent for every AI-driven surface.
     ===================================================================== */
  :root {
    /* Semantic tokens — resolve to the Vector theme values where they exist. */
    --ink:        var(--lumo-header-text-color, rgba(24,39,58,.94));
    --body-ink:   var(--lumo-body-text-color, rgba(0,0,0,.87));
    --muted:      var(--lumo-secondary-text-color, rgba(0,0,0,.6));
    --faint:      rgba(0,0,0,.45);
    --primary:    var(--lumo-primary-color, #0271CE);
    --error:      var(--lumo-error-color, #D83E38);
    --success:    var(--lumo-success-color, #158444);
    --warning:    var(--lumo-warning-color, #E0782E);
    --hairline:   rgba(0,0,0,.08);
    --page-bg:    #F4F5F7;

    --ai-deep:    #5B21B6;

    --ai-grad:    linear-gradient(135deg, #7C3AED, #5B21B6);
    --ai-grad-3:  linear-gradient(135deg, #7C3AED 0%, #6D28D9 50%, #5B21B6 100%);

  /* ── Approaches & Rules page ──────────────────────────────────────── */
  .ar-page { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--page-bg); }

  .diagram-pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 10px; background: rgba(124,58,237,.08); color: var(--ai-mid); font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; flex: none; }
  .method-body { padding: 14px 18px 18px; border-top: 1px solid rgba(0,0,0,.07); background: #FAFBFC; }

  .method-badge { position: absolute; top: -7px; left: 6px; width: 18px; height: 18px; border-radius: 50%; color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }

  hire_date:   "A **Static — Seniority Based** rule orders employees by hire (or promotion) date — most senior first by default. The order doesn't shift between callbacks; it's the same list every time, with a tiebreaker for employees who share the same date.",
  employee_id: "A **Static — By Employee ID** rule uses a natural alphanumerical sort on employee ID/name. Like seniority it's a fixed list — useful when you want a deterministic, easy-to-explain order.",
  random:      "A **Random / Lottery** rule generates a fresh random order on a schedule (every callback, daily, weekly, etc). You can weight it (pure random, weighted by gap since last callback, or weighted by hours) and add guardrails so the same person isn't called repeatedly.",
};

// Match a user's "what is X?" question to one of the rule-type keys above.
function matchRuleTypeQuestion(text) {
  const m = text.match(/^\s*what(?:'s| is| are)\s+(?:an?\s+|the\s+)?(.+?)\s*\??\s*$/i);
  if (!m) return null;
  const q = m[1].toLowerCase();
  if (/accumulating\s*rolodex|accumulating/.test(q))       return 'turns';
  if (/standard\s*rolodex|^rolodex$|\brolodex\b/.test(q))  return 'rolodex';
  if (/hours[- ]based|accumulation.*hours|overtime hours|hours/.test(q)) return 'hours';
  if (/seniority|hire\s*date/.test(q))                     return 'hire_date';
  if (/employee\s*id|by\s*id|alphanumer/.test(q))          return 'employee_id';
  if (/random|lottery/.test(q))                            return 'random';
  return null;
}

const pickRandom = (arr, exclude) => {
  const pool = exclude == null ? arr : arr.filter(x => (typeof x === 'object' ? x.label : x) !== exclude);
  return pool[Math.floor(Math.random() * pool.length)];
};

function generateScenario(prev) {
  const approach = pickRandom(SCENARIO_PARTS.approaches, prev?.approach);
  const duration = pickRandom(SCENARIO_PARTS.durations, prev?.duration);
  const urgency  = pickRandom(SCENARIO_PARTS.urgencies, prev?.urgency);
  const when     = pickRandom(SCENARIO_PARTS.whens, prev?.when);
  const trigger  = pickRandom(SCENARIO_PARTS.triggers);
  const detail   = trigger(Math.floor(Math.random() * 30) + 1);
  return {
    title:        `${duration} · ${urgency.label.toLowerCase()} urgency — ${approach}`,
    detail,
    approach,
    duration,
    when,
    urgency:      urgency.label,
    urgencyColor: urgency.color,
  };
}

// Step-by-step dispatch sim. Uses the rule's decline behavior so the preview reflects
// the rule the user just built, not a generic flow.
function simulateCallFlow(form, ranked) {
  const t = (mins) => `${String(Math.floor(mins / 60)).padStart(2,'0')}:${String(mins % 60).padStart(2,'0')}`;
  const declineLabel = form.declineAction === 'Move to back of list' ? 'Moves to end of list'
    : form.declineAction === 'Stay in position' ? 'Keeps current position'
    : form.declineAction === 'Penalty points' ? `Penalty: ${form.penaltyPoints || 'set'} pts`
    : 'No follow-up rule set';
  // Mock dispatch: #1 declines, #2 accepts (typical real-world pattern).
  return [
    { step: 1, name: ranked[0]?.name || '—', action: 'Auto-call placed', meta: `Top of predicted order`, outcome: 'Declined', outcomeNote: '1 min 12s — listed as unavailable', tone: 'decline', followUp: declineLabel, timestamp: t(0) },
    { step: 2, name: ranked[1]?.name || '—', action: 'Auto-call placed', meta: `Next in line per rule`, outcome: 'Accepted', outcomeNote: '42s — confirmed via SMS', tone: 'accept', followUp: 'Callback filled — dispatch logged', timestamp: t(2) },
  ];
}

function simulateAiAnswer(q, form, scenario) {
  const l = q.toLowerCase();
  if (l.includes('decline')) {
    const action = form.declineAction || 'a default action (not yet set)';
    const flow = form.declineAction === 'Move to back of list'
      ? "they go to the end of the list and the next person is contacted in order"
      : form.declineAction === 'Stay in position'
      ? "they keep their current rank; the next person is contacted, and they'll be eligible again on the next callback"
      : form.declineAction === 'Penalty points'
      ? `they accrue ${form.penaltyPoints || 'the configured'} penalty points and the next person is contacted`
      : "the system continues to the next person but doesn't change their standing";
    const fourth = rankEmployees(form)[3]?.name || 'the 4th-ranked employee';
    return `Your rule's decline action is "${action}", so when an employee declines ${flow}. If your top 3 all decline in sequence, you'd reach #4 in the predicted order before someone accepts — for this scenario, that's likely ${fourth}.`;
  }
  if (l.includes('tie')) {
    const tb = form.tieBreaker || 'seniority (the default tiebreaker)';
    const dir = form.tieBreakerOrder ? `, ${form.tieBreakerOrder.toLowerCase()} preferred` : '';
    return `Tied employees are ordered by ${tb.toLowerCase()}${dir}. So if two people have identical primary scores, the rule walks the tiebreaker as a deterministic deciding factor — no coin flip.`;
  }
  if (l.includes('fiscal') || l.includes('reset') || l.includes('new year')) {
    if (form.resetCadence) return `Your reset cadence is "${form.resetCadence}". At the start of each new period the accumulated hours/turns wipe back to zero, and the first cycle after reset falls back to ${form.tieBreaker?.toLowerCase() || 'seniority (the tiebreaker)'} for ordering. New employees added mid-period start at zero alongside everyone else.`;
    return `You haven't picked a reset cadence yet. Without one, the counter runs as a rolling total. Most departments set this to "Annually (fiscal year)" or "Quarterly" so the playing field resets predictably.`;
  }
  if (l.includes('pto') || l.includes('unavailable') || l.includes('vacation') || l.includes('sick')) {
    return `Employees marked unavailable (PTO, sick, off-shift, etc.) for the requested time window are skipped automatically — their position is preserved and they're re-evaluated for the next callback. The rule isn't penalized either way.`;
  }
  if (l.includes('first') || l.includes('top')) {
    const top = rankEmployees(form)[0];
    return top ? `Right now, ${top.name} is at the top of the predicted call order for this scenario. They'd be auto-dialed first; if they don't respond within the response window, your rule's decline behavior kicks in and we move to ${rankEmployees(form)[1]?.name || 'the next-ranked employee'}.` : 'No employees match this scenario yet — pick an approach to populate the predicted list.';
  }
  return `For this scenario (${scenario.title}), the rule would walk the predicted call order on the left, applying your tiebreaker and decline behavior at each step. Try giving me a more specific situation — e.g. "what if Marta and Priya are tied" — and I'll trace it through for you.`;
}

// ── rankEmployees + buildSummary (carried verbatim from the React mock) ──
function rankEmployees(form) {
  return [...MOCK_EMPLOYEES].sort((a, b) => {
    let primary = 0;
    if (form.ruleType === 'hours') primary = a.hours - b.hours;
    else if (form.ruleType === 'hire_date') primary = new Date(a.hireDate) - new Date(b.hireDate);
    else if (form.ruleType === 'rolodex') primary = 0;
    else if (form.ruleType === 'employee_id') primary = a.name.localeCompare(b.name);
    else if (form.ruleType === 'random') primary = 0; // mock data preview — keep stable order
    else primary = a.hours - b.hours;
    if (primary !== 0) return primary;
    if (form.tieBreaker === 'Seniority (hire date)') return new Date(a.hireDate) - new Date(b.hireDate);
    if (form.tieBreaker === 'Last shift worked') return a.lastShift.localeCompare(b.lastShift);
    if (form.tieBreaker === 'Last callback date') return a.lastCallback.localeCompare(b.lastCallback);
    return a.name.localeCompare(b.name);
  });
}

function buildSummary(form) {
  const parts = [];
  const approachLabel = form.ruleAffects === 'all' ? 'all approaches' :
    form.selectedApproaches.length ? form.selectedApproaches.join(' & ') : 'selected approaches';
  const typeLabels = {
    hours:       'fewest accumulated callback hours',
    turns:       'an accumulating rolodex (rotate after a set limit)',
    hire_date:   'seniority (hire or promotion date)',
    rolodex:     'a standard rolodex rotation',
    employee_id: 'natural alphanumerical sort on employee ID',
    random:      'a random / lottery order',
    custom:      'custom ranking',
  };
  parts.push(`Callback list for ${approachLabel} ranked by ${typeLabels[form.ruleType] || 'fewest accumulated callback hours'}`);
  if (form.lookBack) parts[0] += ` over a ${form.lookBack}-day window`;
  if (form.tieBreaker) parts.push(`Ties broken by ${form.tieBreaker.toLowerCase()}`);
  if (form.callMethod) parts.push(form.callMethod === 'candidate' ? 'Goes out to everyone at once (candidate method)' : 'Goes out one at a time (wait-time method)');
  if (form.notifyChannel) parts.push(`Notified via ${form.notifyChannel.toLowerCase()}`);
  if (form.declineAction) parts.push(`Declines: ${form.declineAction.toLowerCase()}`);
  if (form.recycleList === 'Yes') parts.push(`Recycles the list until filled${form.stillOpenNotice === 'Yes' ? ', notifying everyone it’s still open each pass' : ''}`);
  if (form.hardShiftDays && form.hardShiftDays !== "Don't flag hard shifts") {
    const incentive = form.hardShiftIncentive && form.hardShiftIncentive !== 'No incentive — just flag them'
      ? `, incentivized with ${(form.hardShiftDetail || form.hardShiftIncentive).toLowerCase()}`
      : '';
    parts.push(`${form.hardShiftDays} flagged as hard shifts${incentive}`);
  }
  if (form.minShift || form.maxShift) {
    const range = [form.minShift && `min ${form.minShift}h`, form.maxShift && `max ${form.maxShift}h`].filter(Boolean).join(', ');
    parts.push(`Shift filter: ${range}`);
  }
  return parts.join('. ') + '.';
}

function summarizeRule(rule) {
  const c = rule.config || {};
  const typeLabel = {
    hours: 'Accumulation — Hours Based', rolodex: 'Standard Rolodex',
    turns: 'Accumulating Rolodex',       hire_date: 'Static — Seniority Based',
    employee_id: 'Static — By Employee ID', random: 'Random / Lottery',
  }[c.ruleType] || c.ruleType || 'custom';
  const article = /^[aeiou]/i.test(typeLabel) ? 'an' : 'a';

  // Join approach names naturally: "A", "A and B", "A, B, and C".
  const formatList = (arr) => {
    if (!arr || !arr.length) return '';
    if (arr.length === 1) return arr[0];
    if (arr.length === 2) return `${arr[0]} and ${arr[1]}`;
    return `${arr.slice(0, -1).join(', ')}, and ${arr[arr.length - 1]}`;
  };
  const groupsText = c.ruleAffects === 'selected' && (c.selectedApproaches || []).length
    ? formatList(c.selectedApproaches)
    : 'all approaches';

  const sentences = [];
  sentences.push(`This is ${article} ${typeLabel} rule, applied to ${groupsText}.`);

  // Standard Rolodex specifics — post-accept movement + per-employee response window.
  if (c.rolodexAcceptMove || c.responseTime) {
    const parts = [];
    if (c.rolodexAcceptMove) parts.push(`employees are ${c.rolodexAcceptMove.toLowerCase()}`);
    if (c.responseTime)      parts.push(`each has ${c.responseTime} to respond`);
    sentences.push(`After accepting a callback, ${parts.join(', and ')}.`);
  }

  // Accumulating Rolodex specifics — what accumulates + the rotation limit.
  if (c.accumulationType || c.accumulationLimit) {
    if (c.accumulationType && c.accumulationLimit) {
      sentences.push(`Employees accumulate ${c.accumulationType.toLowerCase()} and rotate to the back of the list once they reach ${c.accumulationLimit}.`);
    } else if (c.accumulationType) {
      sentences.push(`Employees accumulate ${c.accumulationType.toLowerCase()}.`);
    } else {
      sentences.push(`Employees rotate to the back of the list once they reach ${c.accumulationLimit}.`);
    }
  }

  // Hours / turns — reset cadence + which outcomes count toward the counter.
  if (c.resetCadence || c.hoursCountedOutcomes) {
    const parts = [];
    if (c.resetCadence)         parts.push(`resets ${c.resetCadence.toLowerCase()}`);
    if (c.hoursCountedOutcomes) parts.push(`counts ${c.hoursCountedOutcomes.toLowerCase()}`);
    sentences.push(`The counter ${parts.join(' and ')}.`);
  }

  // Tiebreaker.
  if (c.tieBreaker) {
    let s = `Ties are broken by ${c.tieBreaker.toLowerCase()}`;
    if (c.tieBreakerOrder) s += ` (${c.tieBreakerOrder.toLowerCase()})`;
    sentences.push(s + '.');
  }

  // Decline behavior — phrase based on which action was picked.
  if (c.declineAction) {
    let s;
    if (c.declineAction === 'Move to back of list') {
      s = `If someone declines, they're moved to the back of the list`;
      if (c.declineScope) s += ` (${c.declineScope.toLowerCase()})`;
    } else if (c.declineAction === 'Stay in position') {
      s = `If someone declines, they keep their current position`;
      if (c.declineCooldown) s += ` with a ${c.declineCooldown.toLowerCase()} cooldown before they can be offered again`;
    } else if (c.declineAction === 'Penalty points') {
      s = `Each decline costs ${c.penaltyPoints || 'some'} penalty point${c.penaltyPoints === '1' ? '' : 's'}`;
    } else {
      s = `On decline: ${c.declineAction.toLowerCase()}`;
    }
    sentences.push(s + '.');
  }

  return sentences.join(' ');
}

// ── Operational filter vocabularies for Preview Mode's "Add details" drawer ──
// These mirror the real CallBack form's optional filter sections. Qualifiers and
// Groups (stations) read straight off the roster; Classification has no roster
// field, so we assign each person a stable classification via a name hash so the
// filter still narrows the predicted order deterministically.
const ALL_QUALIFIERS     = ['FF','Driver','Engineer','PM','Cpt','BC'];
const ALL_GROUPS         = ['Station 1','Station 3','Station 5','Battalion 3','Logistics'];
const ALL_CLASSIFICATIONS = ['Full-time','Part-time','Paid-on-call','Volunteer'];
function classificationFor(name) {
  return ALL_CLASSIFICATIONS[Math.floor(seededRand(7, name + ':cls') * ALL_CLASSIFICATIONS.length)];
}

// Standard 24/48 fire schedule: A works day 0/3/6, B works day 1/4/7, C day 2/5/8.
const PLATOONS = ['A','B','C'];
function platoonForDay(dayIndex) {
  const idx = ((dayIndex % 3) + 3) % 3;
  return PLATOONS[idx];
}

function daysBetween(a, b) {
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}

// Treat the simulator's clock as starting at "today". Day 0 = today, day 1 = tomorrow, etc.
function shiftStatusAt(person, scenarioDate, baselineDate) {
  const dayOffset = daysBetween(baselineDate, scenarioDate);
  if (person.pto) {
    if (dayOffset >= person.pto.startOffset && dayOffset <= person.pto.endOffset) {
      return { code: person.pto.kind, label: person.pto.kind === 'sick' ? 'Sick' : 'Vacation', available: false };
    }
  }
  const onPlatoon = platoonForDay(dayOffset);
  if (person.platoon === onPlatoon) return { code: 'on-shift', label: 'On shift', available: true };
  // Pre-shift / post-shift: people coming on next day or just off
  const nextPlatoon = platoonForDay(dayOffset + 1);
  if (person.platoon === nextPlatoon) return { code: 'next', label: 'Off — on next', available: true };
  return { code: 'off', label: 'Off', available: true };
}

// Deterministic seeded "random" — same (seed, key) always returns the same
// value in [0, 1). Used to give each reset a different-but-stable roster shake
// so the predicted-call-order list visibly shifts between simulation runs.
function seededRand(seed, key) {
  let h = (seed | 0) * 2654435761;
  for (let i = 0; i < key.length; i++) {
    h = ((h << 5) - h + key.charCodeAt(i)) | 0;
  }
  return ((h >>> 0) % 100000) / 100000;
}

// Rank the roster for a scenario at a specific date/time, accounting for prior
// step outcomes (Rolodex: people who accepted move to the back). Filters down
// to the people on the chosen approach's roster — no one else is shown. The
// optional `seed` lets each reset re-shake hours / lastCallback so the order
// shifts slightly without changing the underlying rule.
function rankRosterForScenario({ rule, scenarioDate, baselineDate, approach, history, seed = 0, filters = null }) {
  const rosterNames = APPROACH_ROSTERS[approach] || [];

  // Optional operational filters from the "Add details" drawer. Applied on top
  // of the approach roster. Per the real CallBack form, the "ALL qualifiers"
  // filter overrides the "ANY qualifiers" filter, so we only honor ANY when ALL
  // is empty.
  const passesFilters = (p) => {
    if (!filters) return true;
    if (filters.qualAll && filters.qualAll.length) {
      if (!filters.qualAll.every(q => p.qualifiers.includes(q))) return false;
    } else if (filters.qualAny && filters.qualAny.length) {
      if (!filters.qualAny.some(q => p.qualifiers.includes(q))) return false;
    }
    if (filters.groups && filters.groups.length) {
      const inGroup = filters.groups.includes(p.station);
      if (filters.groupMode === 'exclude' ? inGroup : !inGroup) return false;
    }
    if (filters.classifications && filters.classifications.length) {
      if (!filters.classifications.includes(classificationFor(p.name))) return false;
    }
    return true;
  };

  // Hours accrued during this simulation run: each accepted callback adds its
  // shift duration to the accepter's running total, so accumulated hours climb
  // step-by-step (and, for hours-based rules, that person drops in the order).
  const accruedHoursMap = new Map();
  history.forEach(step => {
    if (step.acceptedBy) {
      accruedHoursMap.set(step.acceptedBy, (accruedHoursMap.get(step.acceptedBy) || 0) + (step.shiftHours || 0));
    }
  });

  const annotated = CALLBACK_ROSTER
    .filter(p => rosterNames.includes(p.name) && passesFilters(p))
    .map(p => {
      // Small per-seed perturbations: ±3h on accumulated hours and ±2 on
      // lastCallback. Static fields (hireDate, name, qualifiers) are untouched
      // so static rules still produce the same canonical order.
      const hourJitter = Math.round((seededRand(seed, p.name + ':h') - 0.5) * 6);
      const callJitter = Math.round((seededRand(seed, p.name + ':c') - 0.5) * 4);
      const accrued    = accruedHoursMap.get(p.name) || 0;
      return {
        ...p,
        hours:        Math.max(0, p.hours + hourJitter) + accrued,
        accruedBonus: accrued,
        lastCallback: Math.max(0, p.lastCallback + callJitter),
        status: shiftStatusAt(p, scenarioDate, baselineDate),
      };
    });

  // Apply rolodex history: each accept pushes that person to the bottom of the
  // queue for subsequent callbacks. Accept index 0 = most recent accept.
  const acceptanceHistory = new Map();
  history.forEach((step, i) => {
    if (step.acceptedBy) acceptanceHistory.set(step.acceptedBy, i);
  });

  const sortKey = (p) => {
    const accIdx = acceptanceHistory.get(p.name);
    if (rule.ruleType === 'rolodex' && accIdx != null) return [1, accIdx];
    if (rule.ruleType === 'turns'    && accIdx != null) return [1, accIdx];
    if (rule.ruleType === 'hours' || !rule.ruleType) return [0, p.hours];
    if (rule.ruleType === 'turns')      return [0, 0];
    if (rule.ruleType === 'hire_date')  return [0, new Date(p.hireDate).getTime()];
    if (rule.ruleType === 'employee_id') return [0, p.name];
    if (rule.ruleType === 'random')      return [0, seededRand(seed + history.length, p.name)];
    return [0, p.hours];
  };

  // Tiering: eligible (off-shift available) on top, on-shift in the middle
  // (they can't take a callback), unavailable (PTO/sick) at the bottom.
  const tier = (p) => {
    if (!p.status.available) return 2;
    if (p.status.code === 'on-shift') return 1;
    return 0;
  };
  return annotated.sort((a, b) => {
    const ta = tier(a), tb = tier(b);
    if (ta !== tb) return ta - tb;
    const [ag, av] = sortKey(a), [bg, bv] = sortKey(b);
    if (ag !== bg) return ag - bg;
    if (typeof av === 'string') return av.localeCompare(bv);
    return av - bv;
  });
}

function formatDate(d) {
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day   = String(d.getDate()).padStart(2, '0');
  const year  = d.getFullYear();
  let hr = d.getHours(); const min = String(d.getMinutes()).padStart(2, '0');
  const ampm = hr >= 12 ? 'PM' : 'AM';
  hr = hr % 12 || 12;
  return `${month}/${day}/${year} ${hr}:${min} ${ampm}`;
}

function renderApp() {
  const root = byId('app');
  let main;
  if (app.building) {
    main = '<div id="mainView" class="app-main"></div>'; // builder fills after paint
  } else if (app.creatingApproach) {
    main = '<div id="mainView" class="app-main"></div>';
  } else {
    main = '<div id="mainView" class="app-main"></div>';
  }
  // Builder/create-approach modes hide the shell chrome (full-bleed views).
  const chrome = !app.building;
  root.innerHTML = `
    ${chrome ? outerSidebarHtml() : ''}
    <div class="app-col">
      ${chrome ? topBarHtml() : ''}
      <div class="app-row">
        ${chrome ? subSidebarHtml() : ''}
        ${main}
      </div>
    </div>`;
  renderMain();
}

function renderMain() {
  const el = byId('mainView');
  if (!el) return;
  if (app.building)                    { renderRuleBuilder(el, app.building); return; }
  if (app.creatingApproach)            { renderCreateApproach(el); return; }
  if (app.subNav === 'dashboard')      { renderDashboardTab(el); return; }
  if (app.subNav === 'approaches')     { renderApproachesRules(el); return; }
  if (app.subNav === 'history')        { renderHistoryPage(el); return; }
  el.innerHTML = `
    ${pageHeaderHtml(SUB_LABELS[app.subNav] || app.subNav)}
    <div style="flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:rgba(0,0,0,.3)">
      <i class="fa-regular fa-window-maximize" style="font-size:36px"></i>
      <span style="font-size:14px">${esc(SUB_LABELS[app.subNav] || app.subNav)} — content coming soon</span>
    </div>`;
}

// Approaches exist in v2/engine flows, or once created in v1.
function hasApproaches() {
  return app.flowVersion === 'v2' || app.flowVersion === 'engine' || app.approachesCreated;
}
function newApproachEntry() {
  return (app.flowVersion === 'v1' && app.approachesCreated)
    ? { id: 9001, name: app.createdName || 'New Approach', tag: 'New approach', isNew: true }
    : null;
}

function switchFlow(v) {
  app.flowVersion = v;
  app.approachesCreated = false;
  app.createdName = '';
  app.creatingApproach = false;
  app.savedToast = null;
  app.subNav = 'approaches';
  app.building = v === 'engine' ? {} : null;
  syncFlowPill();
  renderApp();
}
function syncFlowPill() {
  document.querySelectorAll('.version-switcher .vs-btn').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-flow') === app.flowVersion);
  });
}

function handleRuleSaved({ form, existingRule }) {
  if (existingRule) {
    const idx = RULES_DATA.findIndex(r => r.id === existingRule.id);
    if (idx >= 0) {
      RULES_DATA[idx] = { ...RULES_DATA[idx], name: form.ruleName || RULES_DATA[idx].name, desc: buildSummary(form), config: { ...form } };
    }
    app.savedToast = { name: form.ruleName || existingRule.name, kind: 'updated' };
  } else {
    const nextId = RULES_DATA.reduce((m, r) => Math.max(m, r.id), 0) + 1;
    RULES_DATA.unshift({ id: nextId, name: form.ruleName || 'New Rule', desc: buildSummary(form), config: { ...form }, aiCreated: true, isNew: true });
    app.savedToast = { name: form.ruleName || 'New Rule', kind: 'saved' };
  }
  app.building = null;
  app.subNav = 'approaches';
  renderApp();
}

function startBuilder(seed) {
  if (seed && seed.existingRule) app.setupAcknowledged = true;
  app.building = seed || {};
  renderApp();
}

        </button>` : ''}
      </div>
    </div>

      </div>
    </div>
  </div>`;

  const input = byId('aiacInput');
  input.addEventListener('input', () => {

    const send = byId('aiacSend');
    send.style.background = dash.input.trim() ? 'var(--ai-grad)' : 'rgba(124,58,237,.25)';
    send.style.cursor = dash.input.trim() ? 'pointer' : 'default';
  });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') aiacSend(); });
  byId('aiacSend').addEventListener('click', aiacSend);

  function aiacSend() {
    if (!dash.input.trim()) return;
    const groups = Array.from(dash.selected);
    startBuilder({ text: dash.input.trim(), approaches: groups, allApproaches: groups.length > 0 && PICKER_GROUPS.every(g => dash.selected.has(g)) });

  wrap.querySelectorAll('[data-aiac]').forEach(b => b.addEventListener('click', () => {

      const g = b.dataset.group;

      dash.selected = all ? new Set() : new Set(PICKER_GROUPS);
      renderAiAssistantCard(wrap);
    } else if (kind === 'continue') {
      const groups = Array.from(dash.selected);
      if (groups.length) startBuilder({ approaches: groups, allApproaches: PICKER_GROUPS.every(g => dash.selected.has(g)) });
    } else if (kind === 'file') {
      startBuilder({ source: 'file' });
    }
  }));
}

function fmtFillTs(s) {
  if (!s) return null;
  const [datePart, timePart] = s.split(' ');
  const [y, mo, d] = datePart.split('-').map(Number);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let [hr, min] = timePart.split(':').map(Number);
  const ampm = hr >= 12 ? 'PM' : 'AM';
  hr = hr % 12 || 12;
  return `${months[mo - 1]} ${d}, ${hr}:${String(min).padStart(2, '0')} ${ampm}`;
}

/* =====================================================================
   RULE BUILDER — dual-pane AI chat + rule configuration panel.
   Faithful port of the React RuleBuilderView: same flows, same copy,
   same branch logic. State lives in `bld`; the chat thread and config
   panel re-render independently so typing never loses focus.
   ===================================================================== */

let bld = null;

// EDIT_MENU_CHIPS / EDIT_CHANGE_TRIGGER / EDIT_SAVE_CHIP come from the carried-over data block.

function guessType(name) {
  if (!name) return 'hours';
  const n = name.toLowerCase();
  if (n.includes('accumulating rolodex')) return 'turns';
  if (n.includes('standard rolodex')) return 'rolodex';
  if (n.includes('employee id') || n.includes('by id')) return 'employee_id';
  if (n.includes('random') || n.includes('lottery')) return 'random';
  if (n.includes('hour')) return 'hours';
  if (n.includes('turn')) return 'turns';
  if (n.includes('hire') || n.includes('seniority')) return 'hire_date';
  if (n.includes('rolodex')) return 'rolodex';
  return 'custom';
}

function blankFormFor(seed) {
  const templateName = seed?.template?.name || null;
  const initialPrompt = seed?.text || null;
  const seededApproaches = seed?.approaches || null;
  const seededAllAppr = !!seed?.allApproaches;
  const existingRule = seed?.existingRule || null;
  const hasSeededGroups = !!(seededApproaches && seededApproaches.length > 0);
  return {
    ruleName: existingRule?.config?.ruleName || templateName || (initialPrompt ? initialPrompt.slice(0, 48) : 'New Rule'),
    ruleType: existingRule?.config?.ruleType || guessType(templateName || initialPrompt),
    ruleAffects: existingRule?.config?.ruleAffects || (seededAllAppr ? 'all' : (hasSeededGroups ? 'selected' : 'all')),
    selectedApproaches: existingRule?.config?.selectedApproaches || (hasSeededGroups && !seededAllAppr ? [...seededApproaches] : []),
    callbackStatuses: existingRule?.config?.callbackStatuses || ['Dispatched', 'Accepted'],
    callbackResponses: existingRule?.config?.callbackResponses || ['Accept', 'Decline'],
    minShift: existingRule?.config?.minShift || '', maxShift: existingRule?.config?.maxShift || '',
    lookBack: existingRule?.config?.lookBack || '', forecast: existingRule?.config?.forecast || '',
    tieBreaker: existingRule?.config?.tieBreaker || '', declineAction: existingRule?.config?.declineAction || '',
    penaltyPoints: existingRule?.config?.penaltyPoints || '', declineScope: existingRule?.config?.declineScope || '',
    declineCooldown: existingRule?.config?.declineCooldown || '',
    turnsCounting: existingRule?.config?.turnsCounting || '', tieBreakerOrder: existingRule?.config?.tieBreakerOrder || '',
    rolodexReset: existingRule?.config?.rolodexReset || '',
    rolodexAcceptMove: existingRule?.config?.rolodexAcceptMove || '', responseTime: existingRule?.config?.responseTime || '',
    accumulationType: existingRule?.config?.accumulationType || '', accumulationLimit: existingRule?.config?.accumulationLimit || '',
    resetCadence: existingRule?.config?.resetCadence || '', hoursCountedOutcomes: existingRule?.config?.hoursCountedOutcomes || '',
    seniorityDateType: existingRule?.config?.seniorityDateType || '',
    sortDirection: existingRule?.config?.sortDirection || '', newHirePlacement: existingRule?.config?.newHirePlacement || '',
    caseSensitivity: existingRule?.config?.caseSensitivity || '',
    randomizeFrequency: existingRule?.config?.randomizeFrequency || '', randomWeighting: existingRule?.config?.randomWeighting || '',
    randomGuardrail: existingRule?.config?.randomGuardrail || '',
    ruleEvaluates: existingRule?.config?.ruleEvaluates || '', includePrevShifts: existingRule?.config?.includePrevShifts || '',
    callMethod: existingRule?.config?.callMethod || 'wait',
    notifyChannel: existingRule?.config?.notifyChannel || '', notifyCadence: existingRule?.config?.notifyCadence || '',
    nextDayRetry: existingRule?.config?.nextDayRetry || '', nextDayCadence: existingRule?.config?.nextDayCadence || '',
    recycleList: existingRule?.config?.recycleList || '', stillOpenNotice: existingRule?.config?.stillOpenNotice || '',
    hardShiftDays: existingRule?.config?.hardShiftDays || '', hardShiftIncentive: existingRule?.config?.hardShiftIncentive || '',
    hardShiftDetail: existingRule?.config?.hardShiftDetail || '',
  };
}

function initBuilder(seed) {
  const templateName = seed?.template?.name || null;
  const initialPrompt = seed?.text || null;
  const seededApproaches = seed?.approaches || null;
  const seededAllAppr = !!seed?.allApproaches;
  const existingRule = seed?.existingRule || null;
  const hasSeededGroups = !!(seededApproaches && seededApproaches.length > 0);
  const introAiText = 'Hi! I can help you create custom rules for ranking employees in overtime and callback shifts.\nDescribe the rule you need, or choose a suggestion below!';
  const originLabel = templateName || initialPrompt || null;
  const approachOriginText = hasSeededGroups ? (seededAllAppr ? 'All approaches' : seededApproaches.join(', ')) : null;

  const form = blankFormFor(seed);
  const flow = FLOWS[templateName] || FLOWS.default;
  const firstAi = flow[0];

  const existingTop = existingRule ? rankEmployees(existingRule.config)[0]?.name : null;
  const existingThird = existingRule ? rankEmployees(existingRule.config)[2]?.name : null;
  const editExploratoryChips = existingRule ? [
    existingTop ? `Why is ${existingTop} first?` : 'Why is the top employee first?',
    existingTop ? `How many hours does ${existingTop} have?` : 'How many hours does the top employee have?',
    existingThird ? `Where is ${existingThird} in the ranking?` : 'Where is a specific person in the ranking?',
    EDIT_CHANGE_TRIGGER, EDIT_SAVE_CHIP,
  ] : [];

  const initMsgs = existingRule
    ? [{ role: 'ai', text: `This is the rule that you pulled up.\n\n${summarizeRule(existingRule)}\n\nAsk a quick question about it, or jump in to change something.`, chips: editExploratoryChips }]
    : (templateName || initialPrompt) ? [
        { role: 'ai', text: introAiText },
        { role: 'origin', label: originLabel },
        ...(approachOriginText ? [{ role: 'origin', label: `Applies to: ${approachOriginText}`, variant: 'approach' }] : []),
        ...(hasSeededGroups && flow.length > 1
          ? [{ role: 'ai', text: flow[1].text, chips: flow[1].chips, multi: flow[1].multi }]
          : [{ role: 'ai', text: firstAi.text, chips: firstAi.chips, multi: firstAi.multi }]),
      ] : hasSeededGroups ? [
        { role: 'ai', text: introAiText },
        { role: 'origin', label: `Applies to: ${approachOriginText}`, variant: 'approach' },
        { role: 'ai', text: "Got it — I'll build a rule for those groups. Pick a ranking type below, or describe what you need." },
        { role: 'suggestions' },
      ] : [
        { role: 'ai', text: "Hi! Let's create a new rule.\n\nShould I guide you step by step, or would you rather describe it in your own words or upload your MOU?",
          chips: ['Guide me step by step', 'Describe it in my own words', 'Upload my MOU'] },
      ];

  const noSeedFresh = !hasSeededGroups && !existingRule && !templateName && !initialPrompt;
  const revealed = new Set(['ruleName']);
  if (templateName || initialPrompt || existingRule) revealed.add('ruleType');
  if (hasSeededGroups || existingRule) revealed.add('ruleAffects');
  if (existingRule) {
    const cfg = existingRule.config || {};
    for (const k of Object.keys(cfg)) {
      const v = cfg[k];
      if (v !== '' && v !== null && v !== undefined && !(Array.isArray(v) && v.length === 0)) revealed.add(k);
    }
  }

  bld = {
    seed, templateName, initialPrompt, seededApproaches, seededAllAppr, existingRule, hasSeededGroups,
    approachOriginText, form, messages: initMsgs,
    activeTplName: templateName, selectionUsed: false,
    awaitingSetupChoice: noSeedFresh, awaitingInitialApproach: false, awaitingFirstDescription: false,
    awaitingMou: false, fillQueue: null, initialApproachAnswered: false,
    subResumeIdx: null, subQCount: 0, editAwaitingFor: null,
    input: '', typing: false, composerSpotlight: false, customAnswer: false,
    chipSelections: new Set(), attachments: [], cfgOpen: true, previewing: false,
    revealedFields: revealed, newestField: null, newestFieldTimer: null,
    panelEditCount: 0, richOpen: null,
  };
}

function bldFlow() { return FLOWS[bld.activeTplName] || FLOWS.default; }

function bldFlowOffset() {
  return bld.selectionUsed
    ? ((bld.hasSeededGroups || bld.initialApproachAnswered) ? 1 : 0)
    : (bld.hasSeededGroups && (bld.templateName || bld.initialPrompt)) ? 2
    : (bld.templateName || bld.initialPrompt) ? 1
    : 0;
}
function bldNextFlowIdx() {
  const userMsgs = bld.messages.filter(m => m.role === 'user');
  return userMsgs.length + bldFlowOffset() - bld.subQCount;
}
function skippedCount() { return bld.messages.filter(m => m.role === 'user' && m.skipped).length; }
function minInfoComplete() {
  return !!bld.form.ruleType && (bld.form.ruleAffects === 'all' || (bld.form.selectedApproaches && bld.form.selectedApproaches.length > 0));
}

// ── Field patching (chat- and panel-driven) ─────────────────────────
const PANEL_PROMPT_EVERY = 3;
function patchForm(updates, opts = {}) {
  Object.assign(bld.form, updates);
  const newlyAdded = [];
  Object.keys(updates).forEach(k => {
    if (!bld.revealedFields.has(k)) newlyAdded.push(k);
    bld.revealedFields.add(k);
  });
  if (opts.fromChat) {
    const focusField = newlyAdded.filter(k => k !== 'ruleName').pop();
    if (focusField) setNewestField(focusField);
  }

  if (!opts.fromChat) {
    for (const [key, val] of Object.entries(updates)) {
      if (PANEL_RECORD_SKIP.has(key)) continue;
      if (val === '' || val == null) continue;
      if (Array.isArray(val) && val.length === 0) continue;
      bld.panelEditCount += 1;
      const isNudge = bld.panelEditCount % PANEL_PROMPT_EVERY === 0;
      const NUDGE_TEXT = 'Would you like to save the rule, preview the ranking, or change anything else?';
      const NUDGE_CHIPS = ['Save rule', 'Preview ranking', 'Adjust something'];
      const branch = BRANCH_MAP[key]?.[val];
      if (branch) {
        bld.messages.push({ role: 'user', text: branch.userMsg, fromForm: true });
        aiReplyLater(() => {
          if (isNudge) bld.messages.push({ role: 'ai', text: NUDGE_TEXT, chips: NUDGE_CHIPS });
          else if (branch.ai) bld.messages.push({ role: 'ai', text: branch.ai.text, chips: branch.ai.chips || [] });
        }, 700 + Math.random() * 300);
      } else {
        const label = FIELD_LABELS[key] || key;
        const valueStr = Array.isArray(val) ? val.join(', ') : String(val);
        bld.messages.push({ role: 'user', text: `${label} → ${valueStr}`, fromForm: true });
        aiReplyLater(() => {
          if (isNudge) bld.messages.push({ role: 'ai', text: NUDGE_TEXT, chips: NUDGE_CHIPS });
          else bld.messages.push({ role: 'ai', text: "Got it — let's build on top of that." });
        }, 500 + Math.random() * 200);
      }
      break; // one chat record per patchForm call
    }
  }
  renderBuilderPanel();
}

function setNewestField(field) {
  bld.newestField = field;
  clearTimeout(bld.newestFieldTimer);
  bld.newestFieldTimer = setTimeout(() => { if (!bld) return; bld.newestField = null; renderBuilderPanel(); }, 2400);
}

function aiReplyLater(mutate, delay) {
  bld.typing = true;
  renderBuilderChat();
  setTimeout(() => {
    if (!bld) return; // builder was closed while the reply was pending
    mutate();
    bld.typing = false;
    renderBuilderChat();
  }, delay || 700);
}

// ── parseAndPatch — carried over from the React mock (adapted to bld) ─
function parseAndPatch(text) {
  const lower = text.toLowerCase();
  const updates = {};
  const form = bld.form;
  const messages = bld.messages;
  const nameMatch = text.match(/(?:call it|name it|named?)\s+"?([^"]+)"?/i) || text.match(/"([^"]+)"/);
  if (nameMatch) updates.ruleName = nameMatch[1];
  if (lower.includes('hours')) updates.ruleType = 'hours';
  else if (lower.includes('turns')) updates.ruleType = 'turns';
  else if (lower.includes('hire date') || lower.includes('seniority')) updates.ruleType = 'hire_date';
  else if (lower.includes('rolodex')) updates.ruleType = 'rolodex';
  const approachNames = ['Firefighter 2', 'Captains', 'Patrol Deputy', 'Bay Guard', 'Battalion Chief', 'FF3'];
  if (lower.includes('all approaches') || lower.includes('all approach')) {
    updates.ruleAffects = 'all';
  } else {
    const matched = approachNames.filter(a => lower.includes(a.toLowerCase()));
    if (matched.length > 0) { updates.ruleAffects = 'selected'; updates.selectedApproaches = matched; }
  }
  const lbDaysM = text.match(/^(\d+)\s*days?$/i);
  if (lbDaysM) updates.lookBack = lbDaysM[1];
  const minM = text.match(/min(?:imum)?\s*(?:shift)?\s*(?:is|:)?\s*(\d+)/i);
  if (minM) updates.minShift = minM[1];
  const maxM = text.match(/max(?:imum)?\s*(?:shift)?\s*(?:is|:)?\s*(\d+)/i);
  if (maxM) updates.maxShift = maxM[1];
  const lbM = text.match(/look\s*back\s*(?:of|:)?\s*(\d+)/i);
  if (lbM) updates.lookBack = lbM[1];
  const fcM = text.match(/forecast\s*(?:of|:)?\s*(\d+)/i);
  if (fcM) updates.forecast = fcM[1];
  if (lower.includes('seniority') || lower.includes('hire date')) updates.tieBreaker = 'Seniority (hire date)';
  else if (lower.includes('last shift')) updates.tieBreaker = 'Last shift worked';
  else if (lower.includes('last callback')) updates.tieBreaker = 'Last callback date';
  else if (lower.includes('alphabetical')) updates.tieBreaker = 'Alphabetical';
  if (lower.includes('back of the list') || lower.includes('back of list') || lower.includes('move to back')) updates.declineAction = 'Move to back of list';
  else if (lower.includes('stay in position') || lower.includes('stay at')) updates.declineAction = 'Stay in position';
  else if (lower.includes('penalty')) updates.declineAction = 'Penalty points';
  const pointsM = text.match(/^(\d+)\s*points?$/i);
  if (pointsM) updates.penaltyPoints = pointsM[1];
  if (lower === 'all reasons') updates.declineScope = 'All reasons';
  else if (lower === 'voluntary only') updates.declineScope = 'Voluntary only';
  else if (lower === 'involuntary only') updates.declineScope = 'Involuntary only';
  if (lower === 'no cooldown') updates.declineCooldown = 'None';
  else if (lower === '1 hour') updates.declineCooldown = '1 hour';
  else if (lower === '4 hours') updates.declineCooldown = '4 hours';
  if (lower === 'all turns') updates.turnsCounting = 'All turns';
  else if (lower === 'accepted only') updates.turnsCounting = 'Accepted only';
  else if (lower === 'accepted + weighted') updates.turnsCounting = 'Accepted + weighted';
  if (lower === 'yes, reset each cycle') updates.rolodexReset = 'Reset each cycle';
  else if (lower === 'no, keep rotating') updates.rolodexReset = 'Keep rotating';
  else if (lower === 'reset manually') updates.rolodexReset = 'Manual reset';
  if (lower === 'move to end of list' || lower === 'move to back of list') {
    if (!form.rolodexAcceptMove) updates.rolodexAcceptMove = 'Move to end of list';
    else updates.declineAction = 'Move to back of list';
  } else if (lower === 'stay at the top') updates.rolodexAcceptMove = 'Stay at the top';
  const respM = text.match(/^(\d+)\s*minutes?$/i);
  if (respM) updates.responseTime = `${respM[1]} min`;
  if (lower === 'hours worked') updates.accumulationType = 'Hours worked';
  else if (lower === 'callbacks accepted') updates.accumulationType = 'Callbacks accepted';
  else if (lower === 'both, weighted') updates.accumulationType = 'Hours + callbacks, weighted';
  const limHoursM = text.match(/^(\d+)\s*hours?$/i);
  if (limHoursM) updates.accumulationLimit = `${limHoursM[1]} hours`;
  const limCbM = text.match(/^(\d+)\s*callbacks?$/i);
  if (limCbM) updates.accumulationLimit = `${limCbM[1]} callbacks`;
  if (lower.startsWith('annually')) updates.resetCadence = 'Annually (fiscal year)';
  else if (lower === 'quarterly') updates.resetCadence = 'Quarterly';
  else if (lower === 'monthly') updates.resetCadence = 'Monthly';
  else if (lower.startsWith('never')) updates.resetCadence = 'Never (rolling total)';
  if (lower === 'accepted + denied') updates.hoursCountedOutcomes = 'Accepted + denied';
  else if (lower === 'anyone contacted') updates.hoursCountedOutcomes = 'Anyone contacted';
  else if (lower === 'custom mix') updates.hoursCountedOutcomes = 'Custom mix';
  else if (lower === 'accepted only' && /which callback outcomes/i.test(messages[messages.length - 1]?.text || '')) updates.hoursCountedOutcomes = 'Accepted only';
  if (lower === 'hire date') updates.seniorityDateType = 'Hire date';
  else if (lower === 'rank/promotion date' || lower === 'promotion date') updates.seniorityDateType = 'Rank/promotion date';
  else if (lower === 'mix: hire date as tiebreaker') updates.seniorityDateType = 'Mix: promotion date + hire date tiebreaker';
  if (lower.startsWith('ascending')) updates.sortDirection = 'Ascending';
  else if (lower.startsWith('descending')) updates.sortDirection = 'Descending';
  if (lower === 'natural position by id') updates.newHirePlacement = 'Natural position by ID';
  else if (lower === 'top of list') updates.newHirePlacement = 'Top of list';
  else if (lower === 'bottom of list') updates.newHirePlacement = 'Bottom of list';
  if (lower.startsWith('yes, ignore case')) updates.caseSensitivity = 'Ignore case';
  else if (lower.startsWith('no, case-sensitive')) updates.caseSensitivity = 'Case-sensitive';
  if (lower === 'every callback') updates.randomizeFrequency = 'Every callback';
  else if (lower === 'every shift') updates.randomizeFrequency = 'Every shift';
  else if (lower === 'daily') updates.randomizeFrequency = 'Daily';
  else if (lower === 'weekly') updates.randomizeFrequency = 'Weekly';
  if (lower === 'pure random') updates.randomWeighting = 'Pure random';
  else if (lower === 'weight by last callback gap') updates.randomWeighting = 'Weight by last callback gap';
  else if (lower === 'weight by total hours') updates.randomWeighting = 'Weight by total hours';
  if (lower === 'no guardrails') updates.randomGuardrail = 'No guardrails';
  else if (lower === 'cap consecutive picks') updates.randomGuardrail = 'Cap consecutive picks';
  else if (lower === 'cool-down after a pick') updates.randomGuardrail = 'Cool-down after a pick';
  if (lower === 'callbacks only') updates.ruleEvaluates = 'Callbacks only';
  else if (lower === 'all shifts') updates.ruleEvaluates = 'All shifts';
  if (lower.startsWith('yes, include past')) updates.includePrevShifts = 'Yes';
  else if (lower.startsWith('no, only new')) updates.includePrevShifts = 'No';
  if (lower === 'no filter — any length' || lower === 'no filter' || lower === 'no filter - any length') {
    updates.minShift = ''; updates.maxShift = '';
  } else if (lower === 'min 4 hours') updates.minShift = '4';
  else if (lower === 'min 8 hours') updates.minShift = '8';
  else if (lower === 'min 4 / max 12') { updates.minShift = '4'; updates.maxShift = '12'; }
  if (/^no forecast$/i.test(text)) updates.forecast = '';
  if (/active\s*\/\s*done calling|filled\s*\/\s*partially filled|not filled|cancelled|all statuses/i.test(text)) {
    if (/all statuses/i.test(text)) {
      updates.callbackStatuses = ['Active / Done Calling', 'Filled / Partially Filled', 'Not Filled', 'Cancelled'];
    } else {
      const picked = [];
      if (/active\s*\/\s*done calling/i.test(text)) picked.push('Active / Done Calling');
      if (/filled\s*\/\s*partially filled/i.test(text)) picked.push('Filled / Partially Filled');
      if (/not filled/i.test(text)) picked.push('Not Filled');
      if (/cancelled/i.test(text)) picked.push('Cancelled');
      if (picked.length) updates.callbackStatuses = picked;
    }
  }
  if (/^(accepted|denied|no answer|all responses)(,\s*(accepted|denied|no answer))*$/i.test(text)) {
    if (/all responses/i.test(text)) {
      updates.callbackResponses = ['Accepted', 'Denied', 'No answer'];
    } else {
      const picked = [];
      if (/\baccepted\b/i.test(text)) picked.push('Accepted');
      if (/\bdenied\b/i.test(text)) picked.push('Denied');
      if (/\bno answer\b/i.test(text)) picked.push('No answer');
      if (picked.length) updates.callbackResponses = picked;
    }
  }
  if (lower === 'a → z') updates.tieBreakerOrder = 'A → Z';
  else if (lower === 'z → a') updates.tieBreakerOrder = 'Z → A';
  else if (lower === 'more recent = higher') updates.tieBreakerOrder = 'More recent first';
  else if (lower === 'more recent = lower') updates.tieBreakerOrder = 'Older first';
  else if (lower === 'yes, longest gap first') updates.tieBreakerOrder = 'Longest gap first';
  else if (lower === 'no, most recent first') updates.tieBreakerOrder = 'Most recent first';
  else if (lower === 'yes, most senior first' || lower === 'most senior first') updates.tieBreakerOrder = 'Most senior first';
  else if (lower === 'least senior first') updates.tieBreakerOrder = 'Least senior first';
  if (Object.keys(updates).length) patchForm(updates, { fromChat: true });
  return updates;
}

// ── Guided fill-in after a describe / MOU extraction ────────────────
function beginGuidedFill(extracted, source) {
  const answered = new Set(Object.keys(extracted || {}));
  if (answered.has('selectedApproaches')) answered.add('ruleAffects');
  const queue = GUIDED_FILL.filter(q => !answered.has(q.field));
  const filled = [...answered].filter(k => FIELD_LABELS[k] && k !== 'ruleName' && k !== 'selectedApproaches').map(k => FIELD_LABELS[k]);
  const lead = filled.length
    ? `I pulled ${filled.length === 1 ? 'one setting' : `${filled.length} settings`} from your ${source} and filled ${filled.length === 1 ? 'it' : 'them'} in on the right${filled.length <= 3 ? ` — ${filled.join(', ').toLowerCase()}` : ''}.`
    : `Got it — I've started a rule from your ${source}.`;
  aiReplyLater(() => {
    if (queue.length) {
      const q = queue[0];
      bld.messages.push({ role: 'ai', text: `${lead}\n\nLet's fill in the blanks together. ${q.text}`, chips: q.chips, multi: q.multi });
      bld.fillQueue = queue;
    } else {
      bld.messages.push({ role: 'ai', text: `${lead}\n\nThat covers everything — save it, preview the ranking, or adjust anything?`, chips: ['Save rule', 'Preview ranking', 'Adjust something'] });
    }
  }, 800);
}

function commitSave() { handleRuleSaved({ form: bld.form, existingRule: bld.existingRule }); }

function enterPreview() {
  if (bld.previewing) return;
  bld.previewing = true;
  bld.messages.push({ role: 'ai', text: "Entering preview mode — the panel on the right is now a live callback simulator. Pick who accepts and run the chain to watch the order and accrued hours shift. Say “Exit preview” or hit Exit when you're done.", chips: ['Exit preview'] });
  renderBuilderShell();
}
function exitPreview() {
  bld.previewing = false;
  bld.messages.push({ role: 'ai', text: 'Exited preview mode — back to building. Adjust anything on the right, then save when you\'re ready.', chips: ['Save rule', 'Preview ranking', 'Adjust something'] });
  renderBuilderShell();
}

function startOver() {
  bld.messages = [{ role: 'ai', text: "Hi! Let's create a new rule.\n\nShould I guide you step by step, or would you rather describe it in your own words or upload your MOU?", chips: ['Guide me step by step', 'Describe it in my own words', 'Upload my MOU'] }];
  bld.awaitingSetupChoice = true;
  bld.awaitingInitialApproach = false;
  bld.initialApproachAnswered = false;
  bld.awaitingFirstDescription = false;
  bld.awaitingMou = false;
  bld.fillQueue = null;
  bld.composerSpotlight = false;
  bld.form = blankFormFor(null);
  bld.input = '';
  bld.typing = false;
  bld.revealedFields = new Set();
  bld.chipSelections = new Set();
  bld.activeTplName = null;
  bld.selectionUsed = false;
  bld.newestField = null;
  bld.subResumeIdx = null;
  bld.subQCount = 0;
  bld.attachments = [];
  bld.panelEditCount = 0;
  renderBuilderShell();
}

function selectSuggestion(tplName) {
  const f = FLOWS[tplName] || FLOWS.default;
  const f0IsApproaches = /approach/i.test(f[0]?.text || '');
  const approachesKnown = bld.hasSeededGroups || bld.initialApproachAnswered;
  const skipApproaches = approachesKnown && f0IsApproaches && f.length > 1;
  const startIdx = skipApproaches ? 1 : 0;
  const intro = (f[0]?.text || '').split('\n\n')[0];
  const firstAi = skipApproaches
    ? { role: 'ai', text: `${intro}\n\n${f[1].text}`, chips: f[1].chips, multi: f[1].multi }
    : { role: 'ai', text: f[startIdx].text, chips: f[startIdx].chips, multi: f[startIdx].multi };
  const originLabel = bld.hasSeededGroups
    ? bld.approachOriginText
    : bld.initialApproachAnswered
      ? (bld.form.ruleAffects === 'all' ? 'All approaches' : (bld.form.selectedApproaches || []).join(', '))
      : '';
  bld.activeTplName = tplName;
  bld.selectionUsed = true;
  bld.subResumeIdx = null;
  bld.subQCount = 0;
  bld.messages = [
    { role: 'user', text: tplName },
    ...(skipApproaches && originLabel ? [{ role: 'origin', label: `Applies to: ${originLabel}`, variant: 'approach' }] : []),
    firstAi,
  ];
  patchForm({ ruleName: tplName, ruleType: guessType(tplName) }, { fromChat: true });
  bld.input = '';
  renderBuilderChat();
  syncComposer();
}

// ── send() — the chat dispatcher (mirrors the React logic 1:1) ──────
function send(text, opts = {}) {
  const isSkip = !!opts.skip;
  if (bld.typing) return;
  if (!isSkip && !text.trim() && !(bld.awaitingMou && bld.attachments.length)) return;
  if (bld.composerSpotlight) bld.composerSpotlight = false;

  const pushUser = (t, extra) => bld.messages.push({ role: 'user', text: t, ...(extra || {}) });
  const clearInput = () => { bld.input = ''; bld.customAnswer = false; syncComposer(); };

  // 1) "What is X?" — tutor answer, no flow advance.
  const ruleTypeKey = matchRuleTypeQuestion(text);
  if (ruleTypeKey && RULE_TYPE_EXPLANATIONS[ruleTypeKey]) {
    pushUser(text); clearInput();
    aiReplyLater(() => bld.messages.push({ role: 'ai', text: RULE_TYPE_EXPLANATIONS[ruleTypeKey] }), 600);
    return;
  }
  // 2) Save / Preview / Adjust.
  if (text === 'Save rule') { pushUser(text); clearInput(); renderBuilderChat(); setTimeout(() => commitSave(), 350); return; }
  if (text === 'Preview ranking' || text === 'Preview' || (!bld.previewing && /^(preview|preview mode|run a preview)$/i.test(text.trim()))) {
    pushUser(text); clearInput(); enterPreview(); return;
  }
  if (text === 'Exit preview' || (bld.previewing && /^(exit preview|exit|close preview|done previewing|back to building)$/i.test(text.trim()))) {
    pushUser(text); clearInput(); exitPreview(); return;
  }
  if (text === 'Adjust something') {
    pushUser(text); clearInput();
    aiReplyLater(() => bld.messages.push({ role: 'ai', text: 'What would you like to change?', chips: EDIT_MENU_CHIPS }), 400);
    return;
  }
  // 2.5) Setup-mode choice.
  if (bld.awaitingSetupChoice && !bld.existingRule) {
    bld.awaitingSetupChoice = false;
    clearInput();
    if (text === 'Guide me step by step') {
      pushUser(text);
      bld.messages.push({ role: 'ai', text: "Great — let's walk through it together.\n\nWhich employees would you like to apply rules to?", chips: ['Firefighter 2', 'Captains', 'Patrol Deputy', 'Bay Guard', 'Battalion Chief', 'FF3', 'All approaches'], multi: true });
      bld.awaitingInitialApproach = true;
    } else if (text === 'Upload my MOU') {
      pushUser(text);
      bld.messages.push({ role: 'ai', text: "Sure — attach your MOU below (PDF, DOCX, or text) and send it. I'll pull out the callback rules, fill in what I can on the right, then we'll fill in the blanks together." });
      bld.awaitingMou = true;
      bld.composerSpotlight = true;
    } else {
      const echo = text && text !== 'Describe it in my own words' ? text : 'Describe it in my own words';
      pushUser(echo);
      bld.messages.push({ role: 'ai', text: "Go ahead — describe the rule you'd like in your own words below." });
      bld.awaitingFirstDescription = true;
      bld.composerSpotlight = true;
    }
    renderBuilderChat(); syncComposer();
    return;
  }
  // 2.6) First free-text description.
  if (bld.awaitingFirstDescription && !bld.existingRule) {
    bld.awaitingFirstDescription = false;
    const extracted = parseAndPatch(text);
    pushUser(text, { skipped: isSkip }); clearInput();
    beginGuidedFill(extracted, 'description');
    return;
  }
  // 2.7) MOU upload sent — simulate an extraction.
  if (bld.awaitingMou && !bld.existingRule) {
    bld.awaitingMou = false;
    const fileLabel = bld.attachments.length ? bld.attachments.map(f => f.name).join(', ') : (text.trim() || 'your MOU');
    pushUser(bld.attachments.length ? `📎 ${fileLabel}` : text);
    bld.attachments = [];
    clearInput();
    const extracted = { ruleType: 'hours', ruleAffects: 'selected', selectedApproaches: ['Firefighter 2', 'Captains'], hoursCountedOutcomes: 'Accepted only', resetCadence: 'Annually (fiscal year)' };
    patchForm(extracted, { fromChat: true });
    beginGuidedFill(extracted, 'MOU');
    return;
  }
  // 2.8) Guided fill-in answer.
  if (bld.fillQueue && !bld.existingRule) {
    if (!isSkip) parseAndPatch(text);
    pushUser(text, { skipped: isSkip }); clearInput();
    const rest = bld.fillQueue.slice(1);
    bld.fillQueue = rest.length ? rest : null;
    aiReplyLater(() => {
      if (rest.length) {
        const q = rest[0];
        bld.messages.push({ role: 'ai', text: q.text, chips: q.chips, multi: q.multi });
      } else {
        bld.messages.push({ role: 'ai', text: "That's everything filled in on the right. Save the rule, preview the ranking, or adjust anything?", chips: ['Save rule', 'Preview ranking', 'Adjust something'] });
      }
    }, 700 + Math.random() * 300);
    return;
  }
  // 3) Guided setup's opening approaches question.
  if (bld.awaitingInitialApproach && !bld.existingRule) {
    parseAndPatch(text);
    pushUser(text);
    bld.messages.push({ role: 'ai', text: "Got it — I'll build a rule for those groups. Pick a ranking type below, or describe what you need." });
    bld.messages.push({ role: 'suggestions' });
    bld.awaitingInitialApproach = false;
    bld.initialApproachAnswered = true;
    clearInput(); renderBuilderChat();
    return;
  }
  // 4) "Change X" chips (works in fresh-build mode too).
  if (!bld.existingRule && EDIT_ASK[text]) {
    const ask = EDIT_ASK[text];
    pushUser(text);
    bld.editAwaitingFor = ask.field;
    clearInput();
    aiReplyLater(() => bld.messages.push({ role: 'ai', text: ask.text, chips: ask.chips, multi: ask.multi }), 600);
    return;
  }
  if (!bld.existingRule && bld.editAwaitingFor) {
    parseAndPatch(text);
    pushUser(text, { skipped: isSkip });
    bld.editAwaitingFor = null;
    clearInput();
    aiReplyLater(() => bld.messages.push({ role: 'ai', text: "Updated — I've applied that to the configuration on the right. Want to save the rule, preview it, or change something else?", chips: ['Save rule', 'Preview ranking', 'Adjust something'] }), 600);
    return;
  }

  // ── Edit-mode dispatch ──
  if (bld.existingRule) {
    const expChips = () => {
      const ranked = rankEmployees(bld.form);
      const top = ranked[0]?.name, third = ranked[2]?.name;
      return [
        top ? `Why is ${top} first?` : 'Why is the top employee first?',
        top ? `How many hours does ${top} have?` : 'How many hours does the top employee have?',
        third ? `Where is ${third} in the ranking?` : 'Where is a specific person in the ranking?',
        EDIT_CHANGE_TRIGGER, EDIT_SAVE_CHIP,
      ];
    };
    if (text === EDIT_SAVE_CHIP) { pushUser(text); clearInput(); renderBuilderChat(); setTimeout(() => commitSave(), 350); return; }
    if (text === EDIT_CHANGE_TRIGGER) {
      pushUser(text); clearInput();
      bld.cfgOpen = true;
      aiReplyLater(() => bld.messages.push({ role: 'ai', text: "Opened the rule configuration on the right — pick what you'd like to change.", chips: EDIT_MENU_CHIPS }), 500);
      renderBuilderShell();
      return;
    }
    const whyMatch = text.match(/^Why is (.+) first\?$/);
    if (whyMatch) {
      const top = rankEmployees(bld.form)[0];
      pushUser(text); clearInput();
      aiReplyLater(() => {
        const reasonByType = {
          hours: `${top?.name} is first because they have the fewest accumulated callback hours (${top?.hours}h).`,
          rolodex: `${top?.name} is at the top of the Rolodex right now — no one ahead of them has accepted yet.`,
          hire_date: `${top?.name} is first because they're the most senior employee (hired ${top?.hireDate}).`,
          employee_id: `${top?.name} sorts first alphanumerically by employee name.`,
          random: `${top?.name} drew the highest random ranking this cycle.`,
          turns: `${top?.name} is first because the accumulating counter still has them below the rotation limit.`,
        };
        bld.messages.push({ role: 'ai', text: reasonByType[bld.form.ruleType] || `${top?.name} is first per this rule's ranking factor.`, chips: expChips() });
      }, 500);
      return;
    }
    const hoursMatch = text.match(/^How many hours does (.+) have\?$/);
    if (hoursMatch) {
      const emp = MOCK_EMPLOYEES.find(e => e.name === hoursMatch[1]);
      pushUser(text); clearInput();
      aiReplyLater(() => {
        bld.messages.push({ role: 'ai', text: emp ? `${emp.name} has ${emp.hours} accumulated callback hours. Last callback was ${emp.lastCallback}; last shift was ${emp.lastShift}.` : "I couldn't find that employee in the current roster.", chips: expChips() });
      }, 500);
      return;
    }
    const whereMatch = text.match(/^Where is (.+) in the ranking\?$/);
    if (whereMatch) {
      const ranked = rankEmployees(bld.form);
      const idx = ranked.findIndex(e => e.name === whereMatch[1]);
      pushUser(text); clearInput();
      aiReplyLater(() => {
        bld.messages.push({ role: 'ai', text: idx >= 0 ? `${whereMatch[1]} is currently #${idx + 1} out of ${ranked.length} in the predicted call order (${ranked[idx].hours}h, hired ${ranked[idx].hireDate}).` : "I couldn't find that employee in the current roster.", chips: expChips() });
      }, 500);
      return;
    }
    if (EDIT_ASK[text]) {
      const ask = EDIT_ASK[text];
      pushUser(text);
      bld.editAwaitingFor = ask.field;
      clearInput();
      aiReplyLater(() => bld.messages.push({ role: 'ai', text: ask.text, chips: ask.chips, multi: ask.multi }), 700);
      return;
    }
    if (bld.editAwaitingFor) {
      parseAndPatch(text);
      pushUser(text, { skipped: isSkip });
      bld.editAwaitingFor = null;
      clearInput();
      aiReplyLater(() => bld.messages.push({ role: 'ai', text: "Updated — I've applied that to the configuration on the right. Anything else you'd like to change?", chips: EDIT_MENU_CHIPS }), 700);
      return;
    }
    parseAndPatch(text);
    pushUser(text); clearInput();
    aiReplyLater(() => bld.messages.push({ role: 'ai', text: 'Got it. Anything else you\'d like to change?', chips: EDIT_MENU_CHIPS }), 700);
    return;
  }

  // ── Sub-question answer ──
  if (bld.subResumeIdx !== null) {
    if (!isSkip) parseAndPatch(text);
    const resume = bld.subResumeIdx;
    pushUser(text, { skipped: isSkip });
    bld.subResumeIdx = null;
    bld.subQCount += 1;
    clearInput();
    aiReplyLater(() => {
      const nextAi = bldFlow()[resume];
      if (nextAi) bld.messages.push({ role: 'ai', text: nextAi.text, chips: nextAi.chips, multi: nextAi.multi });
    }, 800 + Math.random() * 400);
    return;
  }

  // ── Normal build-from-scratch flow ──
  if (!isSkip) parseAndPatch(text);
  const sub = !isSkip && bld.activeTplName && REPLY_SUBQS[bld.activeTplName] ? REPLY_SUBQS[bld.activeTplName][text] : null;
  if (sub) {
    const resume = bldNextFlowIdx();
    bld.messages = bld.messages.filter(m => m.role !== 'suggestions');
    pushUser(text);
    bld.subResumeIdx = resume;
    clearInput();
    aiReplyLater(() => bld.messages.push({ role: 'ai', text: sub.text, chips: sub.chips, multi: sub.multi }), 800 + Math.random() * 400);
    return;
  }
  bld.messages = bld.messages.filter(m => m.role !== 'suggestions');
  const idx = bldNextFlowIdx();
  pushUser(text, { skipped: isSkip });
  clearInput();
  aiReplyLater(() => {
    const nextAi = bldFlow()[idx];
    if (nextAi) bld.messages.push({ role: 'ai', text: nextAi.text, chips: nextAi.chips, multi: nextAi.multi });
  }, 800 + Math.random() * 400);
}
const handleSkip = () => send('', { skip: true });

function chipButtonsHtml(m) {
  // Single-select chips + "Something else" + "Skip for now".
  return `
    <div class="chip-col">
      ${(m.chips || []).map(c => `<button class="chip-btn" data-rb="chip" data-chip="${esc(c)}">${esc(c)}</button>`).join('')}
      <button class="chip-btn chip-btn--dashed" data-rb="custom-answer"><i class="fa-solid fa-pencil" style="font-size:11px"></i> Something else</button>
      <button class="skip-link" data-rb="skip">Skip for now</button>
    </div>`;
}

function multiChipsHtml(m) {
  const allChip = m.chips.find(c => /^All\s/i.test(c));
  const itemChips = m.chips.filter(c => c !== allChip);
  const allSelected = !!allChip && (bld.chipSelections.has(allChip) || itemChips.every(c => bld.chipSelections.has(c)));
  const check = (label, checked, data, bold) => `
    <button class="multi-check ${checked ? 'checked' : ''}" data-rb="multi-toggle" data-chip="${esc(data)}" style="${bold ? 'font-weight:600' : ''}">
      <span class="box">${checked ? '<i class="fa-solid fa-check"></i>' : ''}</span>${esc(label)}
    </button>`;
  return `
    <div class="chip-col">
      <div style="font-size:11px;color:rgba(0,0,0,.45);margin-bottom:2px">Select all that apply</div>
      <div class="multi-box">
        ${allChip ? `${check('Select all', allSelected, '__ALL__', true)}<div style="height:1px;width:100%;background:rgba(124,58,237,.2);margin:2px 0"></div>` : ''}
        ${itemChips.map(c => check(c, bld.chipSelections.has(c) || (allChip && bld.chipSelections.has(allChip)), c)).join('')}
      </div>
      ${bld.chipSelections.size > 0 ? `<button data-rb="multi-confirm" style="height:34px;padding:0 16px;border-radius:8px;background:var(--ai-grad);color:#fff;border:none;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;white-space:nowrap">Confirm · ${allSelected ? 'all' : bld.chipSelections.size} selected</button>` : ''}
      <button class="chip-btn chip-btn--dashed" data-rb="custom-answer"><i class="fa-solid fa-pencil" style="font-size:11px"></i> Something else</button>
      <button class="skip-link" data-rb="skip">Skip for now</button>
    </div>`;
}

function suggestionsHtml() {
  return `
    <div class="chip-col" style="margin-left:50px;margin-top:4px">
      <div style="font-size:12px;color:rgba(0,0,0,.45);margin-bottom:2px">Pick a rule type:</div>
      ${SUGGESTION_SETS.flat().map(s => `<button class="chip-btn" data-rb="suggestion" data-name="${esc(s.name)}">${esc(s.name)}</button>`).join('')}
      <button class="chip-btn chip-btn--dashed" data-rb="custom-answer"><i class="fa-solid fa-pencil" style="font-size:11px"></i> Something else</button>
      <button class="skip-link" data-rb="skip">Skip for now</button>
      <div style="display:flex;align-items:center;gap:7px;margin-top:8px;padding-top:8px;border-top:1px dashed rgba(0,0,0,.1);align-self:stretch">
        <span style="font-size:11.5px;color:rgba(0,0,0,.4)">Already have one?</span>
        <button class="tertiary-link" data-rb="rules-file" style="height:22px"><i class="fa-solid fa-upload" style="font-size:10px"></i> Bring in a Rules file</button>

}

const ORIGIN_VARIANTS = {
  edit:     { label: 'Editing rule',     bg: 'linear-gradient(135deg, rgba(245,158,11,.12), rgba(234,88,12,.08))', border: 'rgba(245,158,11,.35)', avatar: 'linear-gradient(135deg,#F59E0B,#EA580C)', icon: '<i class="fa-solid fa-pen-to-square"></i>' },
  approach: { label: 'Applies to',       bg: 'linear-gradient(135deg, rgba(59,130,246,.1), rgba(99,102,241,.06))',  border: 'rgba(59,130,246,.28)', avatar: 'linear-gradient(135deg,#3B82F6,#2563EB)', icon: '<i class="fa-solid fa-users"></i>' },
  default:  { label: 'You started with', bg: 'linear-gradient(135deg, rgba(124,58,237,.08), rgba(99,102,241,.05))', border: 'rgba(124,58,237,.2)',  avatar: 'linear-gradient(135deg,#7C3AED,#5B21B6)', icon: sparkSvg(13) },

function freeformHtml(m) {
  return `
    <div style="margin-top:18px" id="ffWrap">
      <textarea id="ffText" rows="2" placeholder="Describe your ranking logic in your own words…" style="width:100%;padding:10px 14px;border:1.5px solid rgba(124,58,237,.22);border-radius:10px;outline:none;font-size:13px;line-height:1.55;color:var(--ink);background:rgba(124,58,237,.02);resize:none;display:block;margin-bottom:10px;font-family:var(--font)"></textarea>
      <div style="font-size:11px;color:rgba(0,0,0,.38);margin-bottom:7px">For example:</div>
      <div style="display:flex;flex-direction:column;gap:5px;margin-bottom:14px">

            <span style="font-size:10px;font-weight:500;color:rgba(124,58,237,.45);white-space:nowrap;letter-spacing:.02em">use →</span>
          </button>`).join('')}
      </div>
