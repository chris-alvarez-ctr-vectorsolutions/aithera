        <button class="skip-link" data-rb="skip">Skip for now</button>
        <button id="ffSend" style="height:34px;padding:0 18px;border-radius:8px;background:rgba(0,0,0,.08);color:rgba(0,0,0,.3);border:none;font-size:13px;font-weight:600;cursor:default;transition:all .15s">Continue →</button>
      </div>
    </div>`;
}

function renderBuilderChat() {
  const thread = byId('rbThread');
  if (!thread) return;
  const lastAiIdx = bld.messages.reduce((last, msg, idx) => msg.role === 'ai' ? idx : last, -1);
  thread.innerHTML = bld.messages.map((m, i) => {
    if (m.role === 'ai') {
      const showChips = m.chips && i === lastAiIdx && !bld.typing && !bld.customAnswer;
      return `
        <div class="msg-ai">
          ${aiAvatar(36)}
          <div style="flex:1;min-width:0">
            <div class="who">AI ASSISTANT</div>
            <div class="text">${esc(stripBold(m.text))}</div>
            ${showChips ? (m.multi ? multiChipsHtml(m) : m.freeform ? freeformHtml(m) : chipButtonsHtml(m)) : ''}
          </div>
        </div>`;
    }
    if (m.role === 'user') {
      if (m.skipped) return `<div class="msg-skip"><span class="pill"><i class="fa-solid fa-arrow-right" style="font-size:11px"></i> Skipped for now</span></div>`;
      return `
        <div class="msg-user">
          <div class="bubble">${esc(m.text)}</div>
          ${m.fromForm ? '<span class="from-form"><i class="fa-solid fa-pen-to-square" style="font-size:8px"></i> edited in panel</span>' : ''}
        </div>`;
    }
    if (m.role === 'origin') {
      const v = ORIGIN_VARIANTS[m.variant || 'default'];
      return `
        <div class="msg-origin">
          <span class="o-label">${v.label}</span>
          <span class="o-chip" style="background:${v.bg};border:1.5px solid ${v.border}">
            <span class="o-icon" style="background:${v.avatar}">${v.icon}</span>${esc(m.label)}
          </span>
        </div>`;
    }
    if (m.role === 'suggestions') return (!bld.typing && !bld.customAnswer) ? suggestionsHtml() : '';
    return '';
  }).join('') + (bld.typing ? `
    <div class="msg-ai">${aiAvatar(36)}<div class="typing-dots"><span></span><span></span><span></span></div></div>` : '');
  thread.scrollTop = thread.scrollHeight;

  // Freeform block wiring (textarea + example rows).
  const ffText = byId('ffText');
  if (ffText) {
    const ffSend = byId('ffSend');
    const paint = () => {
      const on = ffText.value.trim();
      ffSend.style.background = on ? 'var(--ai-grad)' : 'rgba(0,0,0,.08)';
      ffSend.style.color = on ? '#fff' : 'rgba(0,0,0,.3)';
      ffSend.style.cursor = on ? 'pointer' : 'default';
      ffSend.style.boxShadow = on ? '0 2px 8px rgba(124,58,237,.35)' : 'none';
    };
    ffText.addEventListener('input', paint);
    thread.querySelectorAll('.ff-example').forEach(b => b.addEventListener('click', () => {
      ffText.value = b.dataset.ff; paint();
      thread.querySelectorAll('.ff-example').forEach(x => x.classList.toggle('sel', x === b));
    }));
    ffSend.addEventListener('click', () => { if (ffText.value.trim()) send(ffText.value); });
  }
}

// ── Composer footer ──────────────────────────────────────────────────
function composerPlaceholder() {
  if (bld.awaitingMou) return 'Attach your MOU below, add a note if you like, then send…';
  if (bld.composerSpotlight) return "Start here — describe the rule you'd like in your own words…";
  if (bld.messages.some(m => m.role === 'suggestions')) return "Describe the rule you'd like to create, or pick a suggestion above…";
  return 'Type a response or tap a suggestion above…';
}

function renderBuilderFoot() {
  const foot = byId('rbFoot');
  if (!foot) return;
  foot.innerHTML = `
    ${!bld.messages.some(m => m.role === 'suggestions') ? `
      <div style="display:flex;align-items:center;justify-content:flex-end;margin-bottom:8px">
        <button class="start-over-btn" data-rb="start-over"><i class="fa-solid fa-rotate-left" style="font-size:10px"></i> Start Over</button>
      </div>` : ''}
    <div id="rbCallout"></div>
    <div style="position:relative;border-radius:12px" id="rbComposerWrap">
      <textarea id="rbComposer" class="rb-composer" rows="2"></textarea>
      <button class="rb-send" id="rbSend"><i class="fa-solid fa-paper-plane" style="font-size:13px"></i></button>
    </div>
    <div style="margin-top:9px">
      <input type="file" id="rbFile" multiple style="display:none" />
      <button class="attach-btn" data-rb="attach"><i class="fa-solid fa-paperclip" style="font-size:12px"></i> Attach files</button>
      <div id="rbAttachChips" style="display:flex;flex-wrap:wrap;gap:7px;margin-top:9px"></div>
    </div>`;

  const ta = byId('rbComposer');
  ta.value = bld.input;
  ta.addEventListener('input', () => { bld.input = ta.value; paintSend(); });
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(ta.value); }
  });
  byId('rbSend').addEventListener('click', () => send(ta.value));
  byId('rbFile').addEventListener('change', (e) => {
    const incoming = Array.from(e.target.files || []).map(f => ({ name: f.name, size: f.size }));
    if (incoming.length) bld.attachments.push(...incoming);
    e.target.value = '';
    paintAttachments(); paintSend();
  });
  syncComposer();
}

function fmtFileSize(bytes) {
  if (!bytes && bytes !== 0) return '';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function paintSend() {
  const send = byId('rbSend');
  if (!send) return;
  const can = bld.input.trim() || (bld.awaitingMou && bld.attachments.length > 0);
  send.style.background = can ? 'var(--ai-grad)' : 'rgba(0,0,0,.1)';
  send.style.cursor = can ? 'pointer' : 'default';
  send.style.boxShadow = can ? '0 2px 8px rgba(124,58,237,.4)' : 'none';
}

function paintAttachments() {
  const wrap = byId('rbAttachChips');
  if (!wrap) return;
  wrap.innerHTML = bld.attachments.map((f, i) => `
    <span class="attach-chip">
      <i class="fa-regular fa-file" style="font-size:11px;flex:none"></i>
      <span class="name">${esc(f.name)}</span>
      ${f.size != null ? `<span style="font-size:11px;color:rgba(91,33,182,.55);flex:none">${fmtFileSize(f.size)}</span>` : ''}
      <button class="rm" data-rb="rm-attach" data-idx="${i}" aria-label="Remove ${esc(f.name)}"><i class="fa-solid fa-xmark"></i></button>
    </span>`).join('');
}

function syncComposer() {
  const ta = byId('rbComposer');
  if (!ta) return;
  ta.value = bld.input;
  ta.placeholder = composerPlaceholder();
  ta.rows = bld.composerSpotlight ? 4 : 2;
  ta.classList.toggle('spotlight', bld.composerSpotlight);
  const wrap = byId('rbComposerWrap');
  wrap.style.animation = bld.composerSpotlight ? 'composerCue 1.5s ease-out 2' : 'none';
  wrap.style.boxShadow = bld.composerSpotlight ? '0 0 0 3px rgba(124,58,237,.12), 0 6px 18px rgba(124,58,237,.16)' : 'none';
  const callout = byId('rbCallout');
  if (callout) callout.innerHTML = bld.customAnswer ? `
    <div class="custom-callout">
      <div style="width:34px;height:34px;border-radius:9px;background:var(--ai-grad);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 2px 6px rgba(124,58,237,.4);color:#fff"><i class="fa-solid fa-pen-to-square" style="font-size:15px"></i></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:2px">
        <span style="font-size:14px;font-weight:700;color:var(--ai-deep);letter-spacing:-.005em">Type your custom answer</span>
        <span style="font-size:12px;line-height:1.3;color:rgba(91,33,182,.78)">Write what you want below, then press Enter or hit Send.</span>
      </div>
      <i class="fa-solid fa-arrow-down" style="flex:none;color:var(--ai);font-size:17px;animation:caArrow 1.4s ease-in-out infinite"></i>
      <div style="display:flex;align-items:center;gap:6px;flex:none">
        <button data-rb="back-to-options" style="display:inline-flex;align-items:center;gap:5px;background:#fff;border:1.5px solid rgba(124,58,237,.4);border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;color:var(--ai-mid);padding:7px 11px"><i class="fa-solid fa-arrow-left" style="font-size:9px"></i> Back to options</button>
        <button class="skip-link" data-rb="skip" style="color:rgba(91,33,182,.6)">Skip</button>
      </div>
    </div>` : '';
  paintAttachments();
  paintSend();
  if (bld.composerSpotlight || bld.customAnswer) setTimeout(() => ta.focus(), 60);
}

// ── Config panel ─────────────────────────────────────────────────────
function nativeSelectHtml(field, value, options, placeholder) {
  return `
    <select class="native-select ${value ? '' : 'placeholder'}" data-field-select="${field}">
      <option value="">${esc(placeholder || 'Not set')}</option>
      ${options.map(o => `<option value="${esc(o)}" ${o === value ? 'selected' : ''}>${esc(o)}</option>`).join('')}
    </select>`;
}

function richSelectHtml(field, value, options, placeholder) {
  const selected = options.find(o => o.value === value);
  return `
    <div class="rich-select" data-rich="${field}">
      <button class="rich-trigger ${bld.richOpen === field ? 'open' : ''}" data-rich-trigger="${field}">
        ${selected ? `
          <span class="rt-icon"><i class="${esc(selected.icon)}"></i></span>
          <span style="flex:1;font-size:13px;font-weight:500;color:var(--ink);text-align:left">${esc(selected.title)}</span>`
        : `<span style="flex:1;font-size:13px;color:rgba(0,0,0,.4);text-align:left">${esc(placeholder || 'Select…')}</span>`}
        <i class="fa-solid fa-chevron-down" style="flex:none;font-size:9px;color:rgba(0,0,0,.45);transition:transform .2s;${bld.richOpen === field ? 'transform:rotate(180deg)' : ''}"></i>
      </button>
    </div>`;
}

function openRichDropdown(field, options, anchor) {
  closeRichDropdown();
  const r = anchor.getBoundingClientRect();
  const drop = document.createElement('div');
  drop.className = 'rich-drop';
  drop.id = 'richDrop';
  drop.style.top = (r.bottom + 4) + 'px';
  drop.style.left = r.left + 'px';
  drop.style.width = r.width + 'px';
  drop.innerHTML = options.map(opt => `
    <button class="rich-opt ${opt.value === bld.form[field] ? 'sel' : ''}" data-rich-opt="${esc(opt.value)}">
      <span class="ro-icon"><i class="${esc(opt.icon)}"></i></span>
      <span style="flex:1;min-width:0">
        <span style="display:block;font-size:13px;font-weight:600;color:${opt.value === bld.form[field] ? 'var(--ai)' : 'var(--ink)'};margin-bottom:2px">${esc(opt.title)}</span>
        <span style="display:block;font-size:11px;line-height:1.4;color:rgba(0,0,0,.5)">${esc(opt.desc)}</span>
      </span>
      ${opt.value === bld.form[field] ? '<i class="fa-solid fa-check" style="color:var(--ai);font-size:12px;flex:none"></i>' : ''}
    </button>`).join('');
  drop.querySelectorAll('[data-rich-opt]').forEach(b => b.addEventListener('click', () => {
    const v = b.dataset.richOpt;
    closeRichDropdown();
    if (field === 'notifyChannel') patchForm({ notifyChannel: v, notifyCadence: '', nextDayCadence: '' });
    else patchForm({ [field]: v });
  }));
  document.body.appendChild(drop);
  bld.richOpen = field;
}
function closeRichDropdown() {
  const d = byId('richDrop');
  if (d) d.remove();
  bld.richOpen = null;
  document.querySelectorAll('.rich-trigger.open').forEach(t => t.classList.remove('open'));
}
document.addEventListener('mousedown', (e) => {
  if (byId('richDrop') && !e.target.closest('#richDrop') && !e.target.closest('.rich-trigger')) closeRichDropdown();
});

function fmsHtml(field, values, options) {
  const set = new Set(values || []);
  return `
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      ${options.map(opt => `
        <button class="fms-chip ${set.has(opt) ? 'on' : ''}" data-fms="${field}" data-opt="${esc(opt)}">
          ${set.has(opt) ? '<i class="fa-solid fa-check" style="font-size:8px"></i>' : ''}${esc(opt)}
        </button>`).join('')}
    </div>`;
}

function fieldWrap(field, inner, opts = {}) {
  const hl = (bld.newestField && (field === bld.newestField || (opts.hlKeys || []).includes(bld.newestField))) ? ' field-hl' : '';
  const sub = opts.sub ? ' sub-field' : '';
  return `<div class="field-reveal${hl}${sub}" data-field="${field}">${inner}</div>`;
}
function formGroup(label, inner) {
  return `<div class="form-group"><div class="fg-label">${esc(label)}</div>${inner}</div>`;
}
function radioRowsHtml(field, options, current) {
  return `<div style="display:flex;flex-direction:column;gap:10px">
    ${options.map(opt => `
      <label class="radio-row ${current === opt.v ? 'on' : ''}" data-radio="${field}" data-value="${esc(opt.v)}">
        <span class="radio-dot">${current === opt.v ? '<i></i>' : ''}</span>
        <span>${esc(opt.l)}</span>
      </label>`).join('')}
  </div>`;
}

function renderBuilderPanel() {
  const scroll = byId('cfgScroll');
  if (!scroll || bld.previewing) return;
  const f = bld.form;
  const top = rankEmployees(f)[0];
  const skips = skippedCount();

  byId('cfgHead').innerHTML = `
    <div class="cfg-head-row">
      <span style="font-size:13px;font-weight:600;color:var(--ink);flex:none">Rule configuration</span>
      <div style="flex:1"></div>
      ${top ? `<span class="next-pill"><span class="next-tag">Next</span><span style="overflow:hidden;text-overflow:ellipsis;max-width:140px">${esc(top.name)}</span></span>` : ''}
      <button data-rb="close-config" title="Collapse panel" aria-label="Collapse panel" style="width:20px;height:20px;border-radius:4px;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0;color:rgba(0,0,0,.42)"><i class="fa-solid fa-chevron-right" style="font-size:10px"></i></button>
    </div>`;

  const sect = (title, subtitle, first) => `
    <div class="panel-section ${first ? 'first' : ''}">
      <div class="ps-title"><span class="ps-bar"></span><span class="ps-text">${esc(title)}</span></div>
      ${subtitle ? `<div class="ps-sub">${esc(subtitle)}</div>` : ''}
    </div>`;

  let html = `
    ${skips > 0 ? `
    <div class="skipped-nudge">
      <div style="padding:7px 11px;background:rgba(224,120,46,.07);border:1px solid rgba(224,120,46,.28);border-radius:7px">
        <div style="font-size:11px;font-weight:600;color:#B2571A;display:flex;align-items:center;gap:5px">
          <i class="fa-solid fa-triangle-exclamation" style="font-size:10px;flex:none"></i>
          <span style="flex:1">${skips} question${skips > 1 ? 's' : ''} skipped</span>
          <span style="font-size:10.5px;font-weight:400;color:rgba(0,0,0,.5)">— revisit before saving</span>
        </div>
      </div>
    </div>` : ''}
    <div style="padding:16px 24px 8px">
    ${sect('Rule settings', 'Who it covers, how it ranks, and which shifts count.', true)}

document.addEventListener('click', (e) => {
  if (!bld || !app.building) return;
  const t = (sel) => e.target.closest(sel);
  let el;
  if ((el = t('[data-rb="back"]')))            { app.building = null; bld = null; renderApp(); }
  else if ((el = t('[data-rb="toggle-preview"]'))) { bld.previewing ? exitPreview() : enterPreview(); }
  else if ((el = t('[data-rb="open-config"]')))  { bld.cfgOpen = true; renderBuilderShell(); }
  else if ((el = t('[data-rb="close-config"]'))) { bld.cfgOpen = false; renderBuilderShell(); }
  else if ((el = t('[data-rb="save-rule"]')))    { if (skippedCount() === 0) commitSave(); }
  else if ((el = t('[data-rb="start-over"]')))   { startOver(); }
  else if ((el = t('[data-rb="chip"]')))         { send(el.dataset.chip); }
  else if ((el = t('[data-rb="skip"]')))         { handleSkip(); }
  else if ((el = t('[data-rb="suggestion"]')))   { selectSuggestion(el.dataset.name); }
  else if ((el = t('[data-rb="custom-answer"]'))) { bld.customAnswer = true; renderBuilderChat(); syncComposer(); }
  else if ((el = t('[data-rb="back-to-options"]'))) { bld.customAnswer = false; renderBuilderChat(); syncComposer(); }
  else if ((el = t('[data-rb="attach"]')))       { byId('rbFile')?.click(); }
  else if ((el = t('[data-rb="rm-attach"]')))    { bld.attachments.splice(Number(el.dataset.idx), 1); paintAttachments(); paintSend(); }
  else if ((el = t('[data-rb="focus-chat"]')))   { byId('rbComposer')?.focus(); }
  else if ((el = t('[data-rb="rm-approach"]')))  { patchForm({ selectedApproaches: bld.form.selectedApproaches.filter(x => x !== el.dataset.approach) }); }
  else if ((el = t('[data-rb="add-approach-chip"]'))) { patchForm({ selectedApproaches: [...bld.form.selectedApproaches, el.dataset.approach] }); }
  else if ((el = t('[data-rb="toggle-still-open"]'))) { patchForm({ stillOpenNotice: bld.form.stillOpenNotice === 'Yes' ? 'No' : 'Yes' }); }
  else if ((el = t('[data-rb="multi-toggle"]'))) {
    const chip = el.dataset.chip;
    const lastAi = [...bld.messages].reverse().find(m => m.role === 'ai' && m.chips);
    const allChip = (lastAi?.chips || []).find(c => /^All\s/i.test(c));
    if (chip === '__ALL__') {
      const itemChips = (lastAi?.chips || []).filter(c => c !== allChip);
      const allSelected = !!allChip && (bld.chipSelections.has(allChip) || itemChips.every(c => bld.chipSelections.has(c)));
      bld.chipSelections = new Set();
      if (!allSelected && allChip) bld.chipSelections.add(allChip);
    } else {
      if (allChip && bld.chipSelections.has(allChip)) bld.chipSelections.delete(allChip);
      bld.chipSelections.has(chip) ? bld.chipSelections.delete(chip) : bld.chipSelections.add(chip);
    }
    renderBuilderChat();
  }
  else if ((el = t('[data-rb="multi-confirm"]'))) {
    const v = Array.from(bld.chipSelections).join(', ');
    bld.chipSelections = new Set();
    send(v);
  }
  else if ((el = t('[data-rb="rules-file"]'))) {
    bld.messages.push({ role: 'user', text: 'Bring in a Rules file' });
    bld.messages.push({ role: 'ai', text: "Sure — drop in your rules file (CSV, JSON, or YAML) and I'll parse the definitions so you can review them before saving." });
    renderBuilderChat();
  }
});

   SIMULATOR (Preview Mode) — full-page + embedded (panelOnly) variants.

let sim = null;
const SIM_MAX_STEPS = 7;

function initSimulator(opts) {
  const seed = opts.seed;
  const isFreshStart = !seed;
  const availableRules = RULES_DATA.length > 0 ? RULES_DATA : [];
  let selectedRuleId = null;
  if (!isFreshStart) {
    if (seed?.form?.ruleName) {
      const match = availableRules.find(r => r.name === seed.form.ruleName || r.config?.ruleName === seed.form.ruleName);
      if (match) selectedRuleId = match.id;
    }
    if (selectedRuleId == null) selectedRuleId = availableRules[0]?.id || null;
  }
  const baselineDate = new Date(2026, 4, 19, 8, 0, 0);
  sim = {
    opts, seed, isFreshStart, panelOnly: !!opts.panelOnly, onBack: opts.onBack,
    selectedRuleId, baselineDate,
    startDate: new Date(baselineDate.getTime() + 86400000),
    chainStart: null,
    duration: 24, deadline: new Date(baselineDate.getTime() + 14400000),
    waitMin: 0, positions: 1,
    approach: '', stepHistory: [],
    detailsOpen: false,
    fClassifications: [], groupMode: 'include', fGroups: [], qualAny: [], qualAll: [],
    overridePick: '', revisitIdx: null,
    leftTab: isFreshStart ? 'settings' : 'chat',
    simulationSeed: Math.floor(Math.random() * 100000),
    chat: [], chatInput: '',
    injectedSummary: !isFreshStart,
    rsTab: 'preview', rsExpanded: false,
  };
  sim.chainStart = sim.startDate;
  const activeRule = simActiveRule();
  const ruleForm = activeRule?.config || activeRule || {};
  sim.approach = isFreshStart ? '' : ((ruleForm.ruleAffects === 'selected' && ruleForm.selectedApproaches?.length) ? ruleForm.selectedApproaches[0] : 'Firefighter 2');
  if (isFreshStart) {
    sim.chat = [{ role: 'ai', text: "Welcome to Preview Mode. Pick a rule and an approach in Callback Settings — once both are set, I'll summarize the rule and you'll see the predicted call order on the right." }];
  } else {
    const summary = activeRule ? summarizeRule(activeRule) : '';
    sim.chat = [{ role: 'ai', text: summary
      ? `Here's a quick summary of "${activeRule?.name || 'this rule'}":\n\n${summary}\n\nUse the chips below to ask scenario questions, or kick off a callback on the right.`
      : `Welcome to Preview Mode. I'll run "${activeRule?.name || 'this rule'}" against a hypothetical callback for the chosen approach. Use the chips below to ask scenario questions, or kick off a callback on the right.` }];
  }
}

function simActiveRule() {
  return RULES_DATA.find(r => r.id === sim.selectedRuleId)
    || (sim.seed?.form ? { id: 'in-progress', name: sim.seed.form.ruleName || 'In-progress rule', config: sim.seed.form } : null);
}
function simRuleForm() {
  const r = simActiveRule();
  return r?.config || r || { ruleType: 'hours', ruleAffects: 'all', selectedApproaches: [], ruleName: 'New Rule' };
}
function simFilters() {
  return { classifications: sim.fClassifications, groupMode: sim.groupMode, groups: sim.fGroups, qualAny: sim.qualAny, qualAll: sim.qualAll };
}
function simRanking() {
  return rankRosterForScenario({ rule: simRuleForm(), scenarioDate: sim.startDate, baselineDate: sim.baselineDate, approach: sim.approach, history: sim.stepHistory, seed: sim.simulationSeed, filters: simFilters() });
}
function simPrevRanking() {
  if (sim.stepHistory.length === 0) return null;
  const prevDate = sim.stepHistory[sim.stepHistory.length - 1].date;
  const prevHistory = sim.stepHistory.slice(0, -1);
  return rankRosterForScenario({ rule: simRuleForm(), scenarioDate: prevDate, baselineDate: sim.baselineDate, approach: sim.approach, history: prevHistory, seed: sim.simulationSeed, filters: simFilters() });
}
function simEligible(ranking) { return ranking.filter(p => p.status.available && p.status.code !== 'on-shift'); }

function simAdvanceDay() { sim.startDate = new Date(sim.startDate.getTime() + 86400000); }

function simAutoSimulate() {
  const eligible = simEligible(simRanking());
  if (eligible.length === 0) return;
  if (eligible.length === 1) {
    sim.stepHistory.push({ date: sim.startDate, attempts: [{ name: eligible[0].name, outcome: 'accepted' }], acceptedBy: eligible[0].name, shiftHours: sim.duration });
    simAdvanceDay(); rerenderSim();
    return;
  }
  const weights = [0.35, 0.4, 0.15, 0.08, 0.02];
  const r = Math.random();
  let declineCount = 0, cum = 0;
  for (let i = 0; i < weights.length; i++) { cum += weights[i]; if (r <= cum) { declineCount = i; break; } }
  declineCount = Math.min(declineCount, eligible.length - 1);
  const attempts = [];
  for (let i = 0; i < declineCount; i++) attempts.push({ name: eligible[i].name, outcome: 'declined' });
  const accepter = eligible[declineCount];
  attempts.push({ name: accepter.name, outcome: 'accepted' });
  sim.stepHistory.push({ date: sim.startDate, attempts, acceptedBy: accepter.name, shiftHours: sim.duration });
  simAdvanceDay(); rerenderSim();
}

function simOverrideAccept(name) {
  if (!name) return;
  sim.stepHistory.push({ date: sim.startDate, attempts: [{ name, outcome: 'accepted (manual override)' }], acceptedBy: name, manual: true, shiftHours: sim.duration });
  sim.overridePick = '';
  simAdvanceDay(); rerenderSim();
}

function simReset(toDate) {
  sim.stepHistory = [];
  sim.revisitIdx = null;
  sim.startDate = toDate instanceof Date ? toDate : sim.chainStart;
  sim.simulationSeed = (sim.simulationSeed + 1 + Math.floor(Math.random() * 9973)) | 0;
  sim.chat = [{ role: 'ai', text: 'Simulation reset. Roster shuffled — ready to run a fresh callback from day 1.' }];
  rerenderSim();
}

function simHandleChip(chip) {
  const ranking = simRanking();
  const eligible = simEligible(ranking);
  const ruleForm = simRuleForm();
  const ai = (() => {
    if (chip === 'New scenario') {
      const opts = Object.keys(APPROACH_ROSTERS);
      const next = opts[Math.floor(Math.random() * opts.length)];
      sim.approach = next;
      sim.duration = [8, 12, 24][Math.floor(Math.random() * 3)];
      sim.stepHistory = []; sim.revisitIdx = null;
      sim.startDate = new Date(sim.baselineDate.getTime() + Math.floor(Math.random() * 5 + 1) * 86400000);
      sim.simulationSeed = (sim.simulationSeed + 1 + Math.floor(Math.random() * 9973)) | 0;
      return `Generated a new scenario — approach is now ${next}. Ranking updated on the right.`;
    }
    if (chip.startsWith('Why is ')) {
      const top = ranking.find(p => p.status.available);
      if (!top) return 'No one is available — everyone on this approach is off-shift, on PTO, or out sick today.';
      const reasonByType = {
        hours: `${top.name} is first because they have the fewest accumulated callback hours (${top.hours}h) among the available roster.`,
        rolodex: `${top.name} is first because they're at the top of the Rolodex right now — no one ahead of them has accepted yet.`,
        hire_date: `${top.name} is first because they're the most senior available employee on-shift today (hired ${top.hireDate}).`,
        employee_id: `${top.name} is first because they sort first alphanumerically among available employees.`,
        random: `${top.name} drew the highest random ranking this cycle.`,
        turns: `${top.name} is first because the accumulating counter still has them below the rotation limit.`,
      };
      return reasonByType[ruleForm.ruleType] || `${top.name} is first per the rule's ranking factor (${ruleForm.ruleType || 'hours'}).`;
    }
    if (chip === 'What if they decline?') {
      if (eligible.length < 2) return `Only ${eligible.length} available person right now — if they decline, the callback would end unfilled.`;
      return `If ${eligible[0].name} declines, the next call goes to ${eligible[1].name} (${eligible[1].hours}h, ${eligible[1].station}). The rule's decline behavior ("${ruleForm.declineAction || 'not set'}") would then update ${eligible[0].name}'s standing.`;
    }
    if (chip === 'Who is on shift today?') {
      const onShift = ranking.filter(p => p.status.code === 'on-shift');
      return `Today (platoon ${platoonForDay(daysBetween(sim.baselineDate, sim.startDate))}): ${onShift.map(p => p.name).join(', ') || '— no one on this approach is on-shift today.'}`;
    }
    if (chip === 'Run a new callback') {
      if (sim.stepHistory.length >= SIM_MAX_STEPS) return "You've hit the 7-callback limit. Reset to run more.";
      simAutoSimulate();
      return `Ran callback #${sim.stepHistory.length}. Check the chain on the right — accepted employees will move on the next callback per the rule.`;
    }
    return 'Hmm, not sure I follow. Try one of the suggestion chips, or describe the situation.';
  })();
  sim.chat.push({ role: 'user', text: chip }, { role: 'ai', text: ai });
  rerenderSim();
}

function rerenderSim() { if (sim && sim.mountEl) renderSimulator(sim.mountEl, sim.opts, true); }

function dateTimeInputsHtml(date, editable) {
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  const year = date.getFullYear();
  let hr12 = date.getHours();
  const ampm = hr12 >= 12 ? 'PM' : 'AM';
  hr12 = hr12 % 12 || 12;
  const min = date.getMinutes();
  return `
    ${editable
      ? `<input type="date" data-sim-dt="date" value="${year}-${month}-${day}" class="sim-input" style="width:140px;padding:0 8px;cursor:pointer" />`
      : `<input value="${month}/${day}/${year}" readonly class="sim-input" style="width:104px;padding:0 8px" />`}
    <select data-sim-dt="hour" class="sim-select" style="width:54px;padding:0 22px 0 8px;background-position:right 6px center">${Array.from({ length: 12 }, (_, i) => i + 1).map(h => `<option ${h === hr12 ? 'selected' : ''}>${h}</option>`).join('')}</select>
    <select data-sim-dt="min" class="sim-select" style="width:58px;padding:0 22px 0 8px;background-position:right 6px center">${[0, 15, 30, 45].map(m => `<option ${m === (min - min % 15) ? 'selected' : ''}>${String(m).padStart(2, '0')}</option>`).join('')}</select>
    <select data-sim-dt="ampm" class="sim-select" style="width:60px;padding:0 22px 0 8px;background-position:right 6px center"><option ${ampm === 'AM' ? 'selected' : ''}>AM</option><option ${ampm === 'PM' ? 'selected' : ''}>PM</option></select>`;
}

          ${i < SIM_MAX_STEPS - 1 ? `<span style="flex:1;height:2px;background:${i < currentStepIdx ? 'var(--ai)' : 'rgba(0,0,0,.1)'};transition:background .2s"></span>` : ''}`;
      }).join('')}
    </div>`;

  const chainRows = sim.stepHistory.length === 0
    ? '<div style="font-size:12px;line-height:1.4;color:rgba(0,0,0,.5);padding:4px 0">No callbacks run yet. Pick who accepts at the bottom (or leave on Random) and run callback #1.</div>'
    : `<div style="max-height:150px;overflow-y:auto;padding-right:4px">
        ${sim.stepHistory.map((step, i) => {
          const revisiting = sim.revisitIdx === i;
          return `
          <div data-sim="revisit" data-idx="${i}" style="display:flex;align-items:flex-start;gap:10px;padding:6px 8px;border-radius:6px;cursor:pointer;${i < sim.stepHistory.length - 1 ? 'border-bottom:1px dashed rgba(0,0,0,.07);' : ''}background:${revisiting ? 'rgba(124,58,237,.08)' : 'transparent'};${revisiting ? 'box-shadow:inset 0 0 0 1px rgba(124,58,237,.35);' : ''}">
            <span style="width:18px;height:18px;border-radius:50%;background:var(--ai);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;margin-top:2px">${i + 1}</span>
            <div style="flex:1;min-width:0">
              <div style="font-size:12px;font-weight:500;line-height:1.3;color:rgba(24,39,58,.85);display:flex;align-items:center;gap:6px;flex-wrap:wrap">
                ${formatDate(step.date)} ${step.manual ? '<span style="font-size:10px;font-weight:500;color:var(--ai)">· manual override</span>' : ''}
                ${step.acceptedBy && step.shiftHours > 0 ? `<span style="font-size:10px;font-weight:700;color:var(--success);background:rgba(21,132,68,.12);padding:2px 6px;border-radius:8px">${esc(step.acceptedBy)} +${step.shiftHours}h</span>` : ''}

  const rankingList = !panelOnly ? `

          : `<span style="display:inline-flex;align-items:center;gap:1px;color:${delta > 0 ? 'var(--success)' : 'var(--error)'};flex:none;min-width:18px"><i class="fa-solid fa-arrow-${delta > 0 ? 'up' : 'down'}" style="font-size:9px"></i><span style="font-size:10px;font-weight:700">${Math.abs(delta)}</span></span>`;
        return `
        <div style="display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;margin-bottom:4px;background:${idx === 0 && !dim ? 'linear-gradient(135deg, rgba(124,58,237,.08), rgba(91,33,182,.04))' : 'transparent'};border:1px solid ${idx === 0 && !dim ? 'rgba(124,58,237,.22)' : 'transparent'};opacity:${dim ? .55 : 1}">
          <div style="flex:none;width:62px;text-align:center">
            <div style="font-size:22px;font-weight:700;line-height:1;color:${idx === 0 && !dim ? 'var(--ai-deep)' : 'rgba(24,39,58,.92)'}">${p.hours}<span style="font-size:12px;font-weight:600;color:rgba(0,0,0,.4)">h</span></div>
            ${p.accruedBonus > 0 ? `<div style="display:inline-block;margin-top:4px;font-size:10px;font-weight:700;color:var(--success);background:rgba(21,132,68,.12);padding:2px 6px;border-radius:8px">+${p.accruedBonus}h</div>` : ''}
          </div>
          ${movement}
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600;line-height:1.3;color:rgba(24,39,58,.9);display:flex;align-items:center;gap:6px">${esc(p.name)}${idx === 0 && !dim ? '<span class="next-tag">Next</span>' : ''}</div>
            <div style="font-size:11px;line-height:1.3;color:rgba(0,0,0,.5);margin-top:2px">#${idx + 1} · ${p.qualifiers.join(' · ')} · ${esc(p.station)} · plat ${esc(p.platoon)}</div>
          </div>
          <span class="status-pill" style="background:${st.bg};color:${st.fg}"><span class="dot" style="background:${st.dot}"></span>${esc(p.status.label)}</span>
        </div>`;
      }).join('')}
      ${ranking.length === 0 ? `<div style="padding:20px 8px;font-size:12px;line-height:1.4;color:rgba(0,0,0,.4);text-align:center">No one on the ${esc(sim.approach)} approach yet. Pick a different approach above.</div>` : ''}
    </div>` : '<div style="flex:1;min-height:0"></div>';

  const bottomBar = `
    <div style="border-top:1px solid rgba(0,0,0,.07);padding:12px 18px;background:#FAFAFC;flex:none">
      ${!isFinished ? `
      <div style="display:flex;flex-direction:column;gap:8px">
        <div class="muted-cap">Who accepts callback #${currentStepIdx + 1}?</div>
        <div style="position:relative">
          <button class="who-select-trigger" id="whoTrigger">
            <span style="flex:1;font-size:13px;font-weight:500;color:rgba(24,39,58,.92);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${sim.overridePick ? `${esc(sim.overridePick)} · ${esc((eligible.find(p => p.name === sim.overridePick) || {}).station || '')} · ${(eligible.find(p => p.name === sim.overridePick) || {}).hours || ''}h` : '🎲 Random (system decides)'}</span>
            <i class="fa-solid fa-chevron-up" style="flex:none;font-size:9px;color:rgba(0,0,0,.45)"></i>
          </button>
        </div>
        <div style="font-size:11.5px;line-height:1.45;color:rgba(0,0,0,.55)">
          ${sim.overridePick
            ? `${esc(sim.overridePick)} will accept — useful for testing what callback #${currentStepIdx + 2} looks like after this specific outcome.`
            : (eligible.length >= 2 ? `Calls go down the list from ${esc(eligible[0]?.name)} until someone accepts — outcome varies per run.` : eligible.length === 1 ? `${esc(eligible[0]?.name)} accepts.` : 'No one available.')}
        </div>
        <button data-sim="run" style="margin-top:4px;height:36px;padding:0 16px;border-radius:7px;border:none;background:var(--ai-grad);color:#fff;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 2px 6px rgba(124,58,237,.3);align-self:flex-end"><i class="fa-solid fa-play" style="font-size:10px"></i> Run callback #${currentStepIdx + 1}</button>
      </div>` : `
      <div style="padding:8px 12px;background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.2);border-radius:6px;font-size:12px;line-height:1.4;color:var(--ai-deep)">Hit the ${SIM_MAX_STEPS}-callback limit. Reset to run more.</div>`}
    </div>`;

  const rightCol = `
    <div class="sim-right ${panelOnly ? 'full' : ''}">
      ${!isReady ? `
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;text-align:center;background:linear-gradient(180deg, #FAFAFC 0%, #fff 100%)">
        <div style="width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg, rgba(124,58,237,.12), rgba(91,33,182,.06));display:flex;align-items:center;justify-content:center;margin-bottom:18px">${sparkSvg(26, '#7C3AED')}</div>
        <div style="font-size:15px;font-weight:600;line-height:1.3;color:rgba(24,39,58,.9);margin-bottom:8px">Pick an approach and a rule to start</div>
        <div style="font-size:13px;line-height:1.55;color:rgba(0,0,0,.55);max-width:360px">Once you set both in the <strong>Callback Settings</strong> tab on the left, I'll summarize the rule in chat and show the predicted call order here.</div>
        <div style="display:flex;align-items:center;gap:14px;margin-top:22px;font-size:12px;font-weight:500;color:rgba(0,0,0,.45)">
          <span style="display:flex;align-items:center;gap:6px"><span style="width:16px;height:16px;border-radius:50%;border:1.5px solid ${sim.approach ? 'var(--ai)' : 'rgba(0,0,0,.2)'};background:${sim.approach ? 'var(--ai)' : '#fff'};display:inline-flex;align-items:center;justify-content:center;color:#fff">${sim.approach ? '<i class="fa-solid fa-check" style="font-size:7px"></i>' : ''}</span>Approach</span>
          <span style="display:flex;align-items:center;gap:6px"><span style="width:16px;height:16px;border-radius:50%;border:1.5px solid ${sim.selectedRuleId ? 'var(--ai)' : 'rgba(0,0,0,.2)'};background:${sim.selectedRuleId ? 'var(--ai)' : '#fff'};display:inline-flex;align-items:center;justify-content:center;color:#fff">${sim.selectedRuleId ? '<i class="fa-solid fa-check" style="font-size:7px"></i>' : ''}</span>Rule</span>
        </div>
      </div>` : `
      ${panelOnly ? `
      <div style="padding:12px 18px;border-bottom:1px solid rgba(0,0,0,.07);background:#fff;flex:none;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span style="font-size:11.5px;font-weight:500;color:rgba(0,0,0,.5);flex:none">Shift start</span>
          ${dateTimeInputsHtml(sim.startDate, true)}
          <button class="jump-btn" data-sim="jump" data-days="7" style="height:26px">+1 wk</button>
          ${currentStepIdx > 0 ? `<span style="font-size:10px;font-weight:600;color:var(--ai);background:rgba(124,58,237,.1);padding:3px 6px;border-radius:9px;white-space:nowrap">#${currentStepIdx + 1}</span>` : ''}
          <span style="font-size:11.5px;font-weight:500;color:rgba(0,0,0,.5);flex:none;margin-left:6px">Duration</span>
          <select class="sim-select" data-sim-select="duration" style="height:30px;font-size:12px">${[4, 8, 12, 24, 48].map(h => `<option value="${h}" ${h === sim.duration ? 'selected' : ''}>${h} hours</option>`).join('')}</select>
        </div>
        ${callbackFiltersHtml(true, ranking)}
        ${ruleSummaryBoxHtml(ruleForm, ranking)}
      </div>` : ''}
      <div style="padding:14px 22px 12px;border-bottom:1px solid rgba(0,0,0,.07);flex:none;background:#FAFAFC">
        <div class="muted-cap" style="margin-bottom:10px;display:flex;align-items:center;gap:8px">
          <span>Callback chain ${currentStepIdx > 0 ? `· ${currentStepIdx} of ${SIM_MAX_STEPS} run` : ''}</span>
          ${currentStepIdx > 0 ? '<span style="font-size:10px;font-weight:500;color:rgba(0,0,0,.4);text-transform:none;letter-spacing:0">· click a completed step to revisit it</span>' : ''}
        </div>
        ${stepper}
        ${chainRows}
      </div>
      ${rankingList}
      ${bottomBar}`}
    </div>`;

  el.innerHTML = `
  <div class="sim">
    ${!panelOnly ? `
    <div class="sim-topbar">
      <button data-sim="back" aria-label="Back" title="Back" style="width:32px;height:32px;border-radius:50%;border:1px solid rgba(0,0,0,.18);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:rgba(0,0,0,.7)"><i class="fa-solid fa-arrow-left" style="font-size:13px"></i></button>
      <i class="fa-regular fa-eye" style="font-size:18px;color:rgba(0,0,0,.7)"></i>
      <h2 style="margin:0;font-size:19px;font-weight:600;color:var(--ink)">Preview Mode — Rule Simulator</h2>
      <span style="font-size:12px;color:rgba(0,0,0,.45);margin-left:6px">· Generic hypothetical — nothing dispatched live</span>
      <div style="flex:1"></div>
      <vaadin-button theme="secondary small" data-sim="reset"><i class="fa-solid fa-rotate-left" style="font-size:10px;margin-right:5px"></i> Reset simulation</vaadin-button>
    </div>` : `
    <div class="sim-compact-head">
      <i class="fa-regular fa-eye" style="font-size:14px;flex:none"></i>
      <span style="font-size:13px;font-weight:700;flex:1">Preview Mode</span>
      <button data-sim="reset" title="Reset simulation" style="height:28px;padding:0 10px;border-radius:6px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;font-size:11.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:5px;flex:none"><i class="fa-solid fa-rotate-left" style="font-size:9px"></i> Reset</button>
      <button data-sim="back" style="height:28px;padding:0 11px;border-radius:6px;border:none;background:#fff;color:var(--ai-mid);font-size:11.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;flex:none"><i class="fa-solid fa-xmark" style="font-size:9px"></i> Exit preview</button>
    </div>`}
    <div class="sim-body">
      ${!panelOnly ? `
      <div class="sim-left">
        <div class="sim-tabbar">
          <button class="sim-tab ${sim.leftTab === 'chat' ? 'active' : ''}" data-sim="tab" data-tab="chat">${sparkSvg(12, 'currentColor')} AI Chat</button>
          <button class="sim-tab ${sim.leftTab === 'settings' ? 'active' : ''}" data-sim="tab" data-tab="settings"><i class="fa-solid fa-gear" style="font-size:12px"></i> Callback Settings</button>
        </div>
        <div class="sim-left-scroll">
          ${sim.leftTab === 'chat' ? chatCard : settingsTab}
        </div>
      </div>` : ''}
      ${rightCol}
    </div>
  </div>`;

  hydrateSimulator(el);
}

function hydrateSimulator(el) {
  const chatThread = byId('simChatThread');
  if (chatThread) chatThread.scrollTop = chatThread.scrollHeight;

  const chatInput = byId('simChatInput');
  if (chatInput) {
    chatInput.value = sim.chatInput;
    const sendBtn = byId('simChatSend');
    const paint = () => {
      sendBtn.style.background = chatInput.value.trim() ? 'var(--ai-grad)' : 'rgba(124,58,237,.2)';
      sendBtn.style.cursor = chatInput.value.trim() ? 'pointer' : 'default';
    };
    chatInput.addEventListener('input', () => { sim.chatInput = chatInput.value; paint(); });
    chatInput.addEventListener('keydown', (e) => { if (e.key === 'Enter' && chatInput.value.trim()) { const t = chatInput.value.trim(); sim.chatInput = ''; simHandleChip(t); } });
    sendBtn.addEventListener('click', () => { if (chatInput.value.trim()) { const t = chatInput.value.trim(); sim.chatInput = ''; simHandleChip(t); } });
    paint();
  }

  el.querySelectorAll('[data-sim-select]').forEach(sel => {
    sel.addEventListener('change', () => {
      const kind = sel.dataset.simSelect;
      if (kind === 'approach') { sim.approach = sel.value; simReset(); maybeInjectSummary(); }
      else if (kind === 'rule') { sim.selectedRuleId = sel.value ? Number(sel.value) : null; simReset(); maybeInjectSummary(); }
      else if (kind === 'duration') { sim.duration = Number(sel.value); rerenderSim(); }
    });
  });
  el.querySelectorAll('[data-sim-input]').forEach(inp => {
    inp.addEventListener('input', () => { sim[inp.dataset.simInput] = Number(inp.value); });
  });
  el.querySelectorAll('[data-sim-dt]').forEach(ctl => {
    ctl.addEventListener('change', () => {
      const d = new Date(sim.startDate);
      const kind = ctl.dataset.simDt;
      if (kind === 'date' && ctl.value) { const [y, m, dd] = ctl.value.split('-').map(Number); d.setFullYear(y, m - 1, dd); }
      else if (kind === 'hour' || kind === 'ampm') {
        const wrap = ctl.closest('.sim-row, [style]') || el;
        const hourSel = el.querySelector('[data-sim-dt="hour"]');
        const ampmSel = el.querySelector('[data-sim-dt="ampm"]');
        let hr12 = Number(hourSel?.value || 8);
        const ampm = ampmSel?.value || 'AM';
        d.setHours(ampm === 'PM' ? (hr12 === 12 ? 12 : hr12 + 12) : (hr12 === 12 ? 0 : hr12));
      }
      else if (kind === 'min') d.setMinutes(Number(ctl.value));
      sim.startDate = d;
      rerenderSim();
    });
  });

  // Who-accepts dropdown — opens upward over the pinned bottom bar.
  const whoTrigger = byId('whoTrigger');
  if (whoTrigger) whoTrigger.addEventListener('click', () => {
    const existing = byId('whoMenu');
    if (existing) { existing.remove(); return; }
    const r = whoTrigger.getBoundingClientRect();
    const eligible = simEligible(simRanking());
    const menu = document.createElement('div');
    menu.className = 'who-menu';
    menu.id = 'whoMenu';
    menu.style.bottom = (window.innerHeight - r.top + 6) + 'px';
    menu.style.left = r.left + 'px';
    menu.style.width = r.width + 'px';
    menu.innerHTML = `
      <div style="overflow-y:auto">
        <button class="who-opt ${!sim.overridePick ? 'on' : ''}" data-who=""><span>🎲 Random (system decides)</span>${!sim.overridePick ? '<i class="fa-solid fa-check" style="color:var(--ai);font-size:11px"></i>' : ''}</button>
        <div style="padding:6px 12px 4px;font-size:10px;font-weight:600;color:rgba(0,0,0,.4);text-transform:uppercase;letter-spacing:.06em;background:#FAFAFC">Pick a specific person</div>
        ${eligible.map(p => `<button class="who-opt ${sim.overridePick === p.name ? 'on' : ''}" data-who="${esc(p.name)}"><span>${esc(p.name)} · ${esc(p.station)} · ${p.hours}h</span>${sim.overridePick === p.name ? '<i class="fa-solid fa-check" style="color:var(--ai);font-size:11px"></i>' : ''}</button>`).join('')}
      </div>`;
    menu.querySelectorAll('[data-who]').forEach(b => b.addEventListener('click', () => {
      sim.overridePick = b.dataset.who;
      menu.remove();
      rerenderSim();
    }));
    document.body.appendChild(menu);
    const closer = (ev) => {
      if (!menu.contains(ev.target) && ev.target !== whoTrigger && !whoTrigger.contains(ev.target)) {
        menu.remove();
        document.removeEventListener('mousedown', closer);
      }
    };
    document.addEventListener('mousedown', closer);
  });
}

function maybeInjectSummary() {
  if (!sim || sim.injectedSummary) return;
  const activeRule = simActiveRule();
  if (!activeRule || !sim.approach) return;
  sim.injectedSummary = true;
  const summary = activeRule ? summarizeRule(activeRule) : '';
  const intro = summary
    ? `Here's a quick summary of "${activeRule?.name || 'this rule'}":\n\n${summary}\n\nSwitch to the AI Chat tab to ask scenario questions, or run a callback on the right.`
    : `Locked in "${activeRule?.name || 'this rule'}" for the ${sim.approach} approach. Switch to the AI Chat tab to ask scenario questions, or run a callback on the right.`;
  sim.chat.push({ role: 'ai', text: intro });
  rerenderSim();
}

// Simulator delegated actions.
document.addEventListener('click', (e) => {
  if (!sim || !sim.mountEl || !document.contains(sim.mountEl)) return;
  const t = (sel) => e.target.closest(sel);
  let el;
  if ((el = t('[data-sim="back"]')))          { const cb = sim.onBack; sim = null; if (cb) cb(); }
  else if ((el = t('[data-sim="reset"]')))    { simReset(); }
  else if ((el = t('[data-sim="tab"]')))      { sim.leftTab = el.dataset.tab; rerenderSim(); }
  else if ((el = t('[data-sim="chip"]')))     { simHandleChip(el.dataset.chip); }
  else if ((el = t('[data-sim="run"]')))      { sim.overridePick ? simOverrideAccept(sim.overridePick) : simAutoSimulate(); }
  else if ((el = t('[data-sim="jump"]')))     { sim.startDate = new Date(sim.startDate.getTime() + Number(el.dataset.days) * 86400000); rerenderSim(); }
  else if ((el = t('[data-sim="revisit"]')))  { const i = Number(el.dataset.idx); sim.revisitIdx = sim.revisitIdx === i ? null : i; rerenderSim(); }
  else if ((el = t('[data-sim="toggle-filters"]'))) { sim.detailsOpen = !sim.detailsOpen; rerenderSim(); }
  else if ((el = t('[data-sim="apply-filters"]')))  { sim.detailsOpen = false; rerenderSim(); }
  else if ((el = t('[data-sim="clear-filters"]')))  { sim.fClassifications = []; sim.fGroups = []; sim.qualAny = []; sim.qualAll = []; rerenderSim(); }
  else if ((el = t('[data-sim="group-mode"]')))     { sim.groupMode = el.dataset.mode; rerenderSim(); }
  else if ((el = t('[data-sim="rs-tab"]')))   { sim.rsTab = el.dataset.tab; rerenderSim(); }
  else if ((el = t('[data-sim="rs-expand"]'))) { sim.rsExpanded = !sim.rsExpanded; rerenderSim(); }
  else if ((el = t('[data-sim-filter]'))) {
    const kind = el.dataset.simFilter, val = el.dataset.val;
    const listKey = { cls: 'fClassifications', grp: 'fGroups', qany: 'qualAny', qall: 'qualAll' }[kind];
    const list = sim[listKey];
    sim[listKey] = list.includes(val) ? list.filter(v => v !== val) : [...list, val];
    rerenderSim();
  }
});

// Close the filters dropdown when clicking outside it (compact mode).
document.addEventListener('mousedown', (e) => {
  if (!sim || !sim.detailsOpen || !sim.panelOnly) return;
  const wrap = byId('simFilters');
  if (wrap && !wrap.contains(e.target)) { sim.detailsOpen = false; rerenderSim(); }
});

/* ── Boot ───────────────────────────────────────────────────────────── */
// The FLOW pill sits after this script in the document (and toolbox.js
// adopts it into the shared dock), so bind by delegation instead of
// querying at parse time.
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.version-switcher .vs-btn[data-flow]');
  if (btn) switchFlow(btn.getAttribute('data-flow'));
});
renderApp();
</script>

<!-- FLOW switcher — static pill adopted by designtoolbox/toolbox.js into the
     shared Toolbox dock. Default flow is "Rule step" (v2). -->
<div class="version-switcher" role="group" aria-label="Switch flow">
  <span class="vs-controller-label">FLOW</span>
  <button type="button" class="vs-btn" data-flow="engine" title="Lands inside the dual-screen rule builder (as if Add New Rule was just clicked)">Rules engine</button>
  <button type="button" class="vs-btn" data-flow="v1" title="Fresh account — no approaches yet; create your first approach">First setup</button>
  <button type="button" class="vs-btn active" data-flow="v2" title="Approaches created — create your first rule">Rule step</button>
</div>

<script src="../../../../designtoolbox/toolbox.js"></script>
</body>
</html>
