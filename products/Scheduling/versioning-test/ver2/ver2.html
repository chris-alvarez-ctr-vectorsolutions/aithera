<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Wireframe — Dark</title>
    <script
    type="module"
    src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.19.0/core.iife.js">
    </script>

    <!-- Vector Web Components JavaScript -->
    <!-- Important! This should always be imported as script -->
    <script
    src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.5.0/styles.js">
    </script>

    <!-- Our Standard font face - Open Sans -->
    <link
    rel="stylesheet"
    href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css"
    />

    <!-- Font Awesome 6 Icons (Default Icon Library) -->
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <style>
      /* ---- Wireframe sketch styling — DARK MODE --------------------------
         Same low-fidelity structure as V1, re-skinned on dark surfaces:
         dark backgrounds, lighter dashed placeholder boxes, muted text. */
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font-family: "Open Sans", system-ui, sans-serif; background: #12161c; color: #c3ccd6; }

      /* App shell: topbar + sidebar + main content grid */
      .app { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 56px 1fr; height: 100%; }

      /* Topbar */
      .topbar { grid-column: 1 / 3; display: flex; align-items: center; gap: 16px; padding: 0 20px; background: #1a2029; border-bottom: 2px dashed #3a4552; }
      .logo-box { width: 120px; height: 24px; border: 2px dashed #4a5563; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 11px; letter-spacing: .5px; color: #8a97a6; }
      .topbar .spacer { flex: 1; }
      .avatar { width: 32px; height: 32px; border-radius: 50%; border: 2px dashed #4a5563; display: flex; align-items: center; justify-content: center; color: #8a97a6; }

      /* Sidebar nav */
      .sidebar { background: #1a2029; border-right: 2px dashed #3a4552; padding: 16px 12px; }
      .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 6px; margin-bottom: 4px; font-size: 14px; color: #9aa5b1; cursor: pointer; }
      .nav-item i { width: 18px; text-align: center; color: #6b7787; }
      .nav-item.active { background: #263041; color: #e8edf2; font-weight: 600; }
      .nav-item.active i { color: #c3ccd6; }

      /* Main content */
      .main { padding: 24px; overflow: auto; }
      .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
      .page-title { font-size: 20px; font-weight: 700; color: #e8edf2; margin: 0; }

      /* Stat cards row */
      .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
      .stat { background: #1a2029; border: 2px dashed #3a4552; border-radius: 8px; padding: 16px; }
      .stat .label { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #6b7787; margin-bottom: 8px; }
      .stat .value { height: 28px; width: 60%; background: #2e3947; border-radius: 4px; }
      .stat .trend { height: 12px; width: 40%; background: #263041; border-radius: 4px; margin-top: 10px; }

      /* Chart + side panel row */
      .row { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 20px; }
      .panel { background: #1a2029; border: 2px dashed #3a4552; border-radius: 8px; padding: 16px; }
      .panel h3 { margin: 0 0 14px; font-size: 14px; color: #9aa5b1; }
      .chart-placeholder { height: 220px; border: 2px dashed #3a4552; border-radius: 6px; display: flex; align-items: flex-end; gap: 10px; padding: 16px; }
      .bar { flex: 1; background: #2e3947; border-radius: 3px 3px 0 0; }

      /* Little scribble list for the side panel */
      .list-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #263041; }
      .list-item .dot { width: 28px; height: 28px; border-radius: 50%; background: #263041; flex: none; }
      .list-item .lines { flex: 1; }
      .list-item .lines .l1 { height: 10px; width: 70%; background: #2e3947; border-radius: 3px; margin-bottom: 6px; }
      .list-item .lines .l2 { height: 8px; width: 45%; background: #263041; border-radius: 3px; }

      /* Table placeholder */
      .table-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th { text-align: left; padding: 10px 8px; color: #6b7787; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; border-bottom: 2px dashed #3a4552; }
      td { padding: 12px 8px; border-bottom: 1px solid #263041; }
      .cell { height: 12px; background: #2e3947; border-radius: 3px; }
      .cell.short { width: 50%; }
      .cell.mid { width: 75%; }
    </style>
</head>
<body>
  <div class="app">

    <!-- Topbar -->
    <header class="topbar">
      <div class="logo-box">LOGO</div>
      <div class="spacer"></div>
      <vaadin-button theme="tertiary"><i class="fa-solid fa-magnifying-glass"></i></vaadin-button>
      <vaadin-button theme="tertiary"><i class="fa-regular fa-bell"></i></vaadin-button>
      <div class="avatar"><i class="fa-solid fa-user"></i></div>
    </header>

    <!-- Sidebar navigation -->
    <nav class="sidebar">
      <div class="nav-item active"><i class="fa-solid fa-gauge"></i> Dashboard</div>
      <div class="nav-item"><i class="fa-solid fa-calendar-days"></i> Schedule</div>
      <div class="nav-item"><i class="fa-solid fa-users"></i> People</div>
      <div class="nav-item"><i class="fa-solid fa-chart-column"></i> Reports</div>
      <div class="nav-item"><i class="fa-solid fa-gear"></i> Settings</div>
    </nav>

    <!-- Main content -->
    <main class="main">
      <div class="page-head">
        <h1 class="page-title">Version 2 Testing — Dark Mode</h1>
        <vaadin-button theme="primary"><i class="fa-solid fa-plus"></i>&nbsp; New</vaadin-button>
      </div>

      <!-- Stat cards -->
      <section class="stats">
        <div class="stat"><div class="label">Metric A</div><div class="value"></div><div class="trend"></div></div>
        <div class="stat"><div class="label">Metric B</div><div class="value"></div><div class="trend"></div></div>
        <div class="stat"><div class="label">Metric C</div><div class="value"></div><div class="trend"></div></div>
        <div class="stat"><div class="label">Metric D</div><div class="value"></div><div class="trend"></div></div>
      </section>

      <!-- Chart + activity list -->
      <section class="row">
        <div class="panel">
          <h3>Overview</h3>
          <div class="chart-placeholder">
            <div class="bar" style="height: 40%"></div>
            <div class="bar" style="height: 65%"></div>
            <div class="bar" style="height: 50%"></div>
            <div class="bar" style="height: 80%"></div>
            <div class="bar" style="height: 35%"></div>
            <div class="bar" style="height: 70%"></div>
            <div class="bar" style="height: 55%"></div>
          </div>
        </div>
        <div class="panel">
          <h3>Recent activity</h3>
          <div class="list-item"><div class="dot"></div><div class="lines"><div class="l1"></div><div class="l2"></div></div></div>
          <div class="list-item"><div class="dot"></div><div class="lines"><div class="l1"></div><div class="l2"></div></div></div>
          <div class="list-item"><div class="dot"></div><div class="lines"><div class="l1"></div><div class="l2"></div></div></div>
          <div class="list-item"><div class="dot"></div><div class="lines"><div class="l1"></div><div class="l2"></div></div></div>
        </div>
      </section>

      <!-- Data table -->
      <section class="panel">
        <div class="table-head">
          <h3 style="margin:0">Records</h3>
        </div>
        <table>
          <thead>
            <tr><th>Name</th><th>Status</th><th>Owner</th><th>Updated</th></tr>
          </thead>
          <tbody>
            <tr><td><div class="cell mid"></div></td><td><div class="cell short"></div></td><td><div class="cell short"></div></td><td><div class="cell short"></div></td></tr>
            <tr><td><div class="cell"></div></td><td><div class="cell short"></div></td><td><div class="cell short"></div></td><td><div class="cell short"></div></td></tr>
            <tr><td><div class="cell mid"></div></td><td><div class="cell short"></div></td><td><div class="cell short"></div></td><td><div class="cell short"></div></td></tr>
            <tr><td><div class="cell"></div></td><td><div class="cell short"></div></td><td><div class="cell short"></div></td><td><div class="cell short"></div></td></tr>
            <tr><td><div class="cell mid"></div></td><td><div class="cell short"></div></td><td><div class="cell short"></div></td><td><div class="cell short"></div></td></tr>
          </tbody>
        </table>
      </section>
    </main>
  </div>

  <!-- Design Toolbox (review/handoff tooling — not part of the product).
       Adds the comment widget + flow-map dock; the loader merges the V1/V2
       version buttons into this same bottom-center pill. -->
  <script src="../../../../designtoolbox/toolbox.js"></script>
</body>
</html>
