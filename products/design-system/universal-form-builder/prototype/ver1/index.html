<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Builder — Prototype</title>
    <script
    type="module"
    src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.22.3/core.iife.js">
    </script>
    <!-- Vector Web Components JavaScript — always a plain script, loaded before components render -->
    <script
    src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.9.3/styles.js">
    </script>
    <link
    rel="stylesheet"
    href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css"
    />
    <!-- Font Awesome 6 PRO, self-hosted; depth-relative: this feature sits one folder deeper than usual, FIVE levels below the repo root. -->
    <link
    rel="stylesheet"
    href="../../../../../assets/fontawesome/css/all.min.css"
    />

<style>
  /* ====================================================================
     FORM BUILDER — PROTOTYPE (pass 1)

     One authoring shell, driven by a PROFILE (Check It or Evaluations).
     Everything the builder edits is the FormDefinition from 03 §8; the UI
     reads three registries (mechanisms, extensions, rules) and one profile.
     See 08-prototype-build-brief.md for the assumptions (P1–P8).

     Chrome tokens are prefixed --fb-. Design tokens come from Vector themes
     v1.9.3 (--lumo-*) and are quoted from context/themes/v1.9.3/CONTEXT.md.
     ==================================================================== */
  :root {
    --fb-topbar-h: 56px;
    --fb-page-bg:  #f4f6f9;     /* solid, not --lumo-contrast-5pct: that is translucent */
    --fb-card-bg:  #ffffff;
    --fb-line:     #dbe1e8;
    --fb-line-soft:#eef1f4;
    --fb-line-strong:#c6cfda;
    --fb-zebra:    #fbfcfd;
    --fb-zebra-deep:#f4f6f9;
    --fb-ink-900:  #1f2937;
    --fb-ink-700:  #374151;
    --fb-ink-500:  #6b7280;
    --fb-accent:   var(--lumo-primary-color, #0271ce);
    --fb-gutter:   16px;
    --fb-indent:   22px;
    --fb-dur: 180ms; --fb-dur-fast: 110ms; --fb-ease: cubic-bezier(.2,.7,.2,1);
  }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--lumo-font-family, 'Open Sans', sans-serif);
    font-size: var(--lumo-font-size-m, 14px);
    color: var(--lumo-body-text-color, #000000de);
    background: var(--fb-page-bg);
  }
  /* vwc-switch draws its track from its own box; a border-box reset collapses
     it. No universal reset in this file, but belt and braces. */
  vwc-switch { box-sizing: content-box; }
  h1, h2, h3, h4, p { margin: 0; }
  button { font-family: inherit; }

  /* ====================================================================
     APP FRAME — fixed viewport; only the content column scrolls
     ==================================================================== */
  .fb-app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* Top bar. The product's own chrome is NOT recreated here: the Form Builder
     is reached from each product's library page, so the bar only says which
     product you are in. Its accent colour comes from the profile. */
  .fb-topbar {
    height: var(--fb-topbar-h); flex-shrink: 0;
    background: var(--fb-card-bg); border-bottom: 1px solid var(--fb-line);
    border-top: 4px solid var(--fb-product-accent, var(--fb-accent));
    display: flex; align-items: center; gap: 14px; padding: 0 22px;
  }
  .fb-product { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .fb-product-mark {
    width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center;
    background: var(--fb-product-accent, var(--fb-accent)); color: #fff; font-size: 14px;
  }
  .fb-product-name { font-weight: 700; font-size: 15px; }
  .fb-product-sub { font-size: 12px; color: var(--fb-ink-500); }
  .fb-crumbs { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--fb-ink-500); margin-left: 10px; }
  .fb-crumbs i { font-size: 10px; }
  .fb-crumbs b { color: var(--fb-ink-900); font-weight: 600; }
  .fb-topbar-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }

  /* The profile switch is a PROTOTYPE control — it stands in for "which
     product you opened the builder from". Styled as tooling, not product. */
  .fb-proto {
    display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 10px;
    border: 1px dashed var(--fb-line-strong); border-radius: 999px;
    font-size: 11.5px; color: var(--fb-ink-500);
  }
  .fb-proto .fb-seg { border-radius: 999px; }
  .fb-proto .fb-seg-opt { padding: 3px 11px; }
  .fb-avatar {
    width: 34px; height: 34px; border-radius: 50%; background: #e4ebf3; color: #1b3b5f;
    display: grid; place-items: center; font-size: 13px; font-weight: 700;
  }

  .fb-content { flex: 1; min-width: 0; overflow-y: auto; padding: 22px 26px 90px; }
  .fb-main[data-view="library"] .fb-view--library { display: block; }
  .fb-main[data-view="builder"] .fb-view--builder { display: block; }
  .fb-view { display: none; }
  .fb-view--builder { max-width: 1240px; margin-inline: auto; }

  /* ---- Page head ------------------------------------------------------ */
  .fb-head { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 18px; }
  .fb-title { font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
  .fb-sub { margin-top: 5px; font-size: 13.5px; color: var(--fb-ink-500); max-width: 72ch; }
  .fb-head-actions { margin-left: auto; display: flex; gap: 8px; flex-shrink: 0; align-items: center; }
  .fb-tabbar { margin-bottom: 16px; border-bottom: 1px solid var(--fb-line); }
  /* A universal reset would zero vaadin-tab host padding; none here, but
     re-grant it anyway so the tabs cannot collapse. */
  vaadin-tab { padding: 8px 16px; }
  .fb-tab-count {
    margin-left: 7px; font-size: 11px; font-weight: 700; line-height: 1; padding: 3px 6px; border-radius: 9px;
    background: var(--lumo-contrast-10pct, #1a38601a); color: var(--fb-ink-700);
  }

  /* ---- Panel: the standard content surface --------------------------- */
  .fb-panel {
    background: var(--fb-card-bg); border: 1px solid var(--fb-line);
    border-radius: var(--lumo-border-radius-m, .5em); margin-bottom: 18px; overflow: hidden;
    box-shadow: var(--lumo-box-shadow-xs, 0 1px 4px -1px #1c304a85);
  }
  .fb-panel-head { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--fb-line-soft); }
  .fb-panel-title { font-size: 15px; font-weight: 700; }
  .fb-filters { display: flex; align-items: flex-end; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--fb-line-soft); flex-wrap: wrap; }
  .fb-filters-fields { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; flex: 1; }
  .fb-filters-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  vaadin-grid { border: 0; }
  .fb-grid-clickable { --fb-row-hover: var(--lumo-contrast-5pct, #193b670d); }
  .fb-grid-clickable::part(row):hover { background: var(--fb-row-hover); cursor: pointer; }
  .fb-cell-main { font-weight: 600; }
  .fb-cell-sub { font-size: 12px; color: var(--fb-ink-500); margin-top: 1px; }
  .fb-empty { text-align: center; padding: 40px 20px; color: var(--fb-ink-500); }
  .fb-empty i { font-size: 28px; margin-bottom: 10px; color: var(--lumo-contrast-40pct, #1c324f61); }
  .fb-empty h3 { font-size: 15px; color: var(--fb-ink-900); margin-bottom: 4px; }

  /* Confidence tag — every surface and seeded value can carry one so a
     reviewer knows what they are looking at (08 "Confidence tags"). */
  .fb-conf {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700;
    letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px;
    border: 1px solid var(--fb-line-strong); color: var(--fb-ink-500); background: var(--fb-card-bg);
    white-space: nowrap;
  }
  .fb-conf[data-c="code"]       { color: var(--lumo-success-text-color, #0a7637); border-color: var(--lumo-success-color-50pct, #16884680); }
  .fb-conf[data-c="design"]     { color: var(--lumo-primary-text-color, #0271ce); border-color: var(--lumo-primary-color-50pct, #0271cec2); }
  .fb-conf[data-c="inferred"]   { color: var(--lumo-warning-text-color, #995211); border-color: var(--lumo-warning-color, #e0782e); }
  .fb-conf[data-c="assumption"] { color: #6d28d9; border-color: #c4b5fd; }
  .fb-conf i { font-size: 9px; }

  /* ====================================================================
     BUILDER
     ==================================================================== */
  .fb-back { display: inline-flex; align-items: baseline; gap: 7px; font-size: 13px; margin-bottom: 10px; cursor: pointer;
             color: var(--fb-ink-700); text-decoration: underline; text-decoration-color: var(--lumo-contrast-40pct, #1c324f61); }
  .fb-back i { font-size: 10px; }
  .fb-head--editor { align-items: flex-end; margin-bottom: 14px; }
  .fb-head--editor .fb-head-actions { align-self: flex-start; margin-top: 2px; }
  .fb-editor-titleline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .fb-title--editor { font-size: 21px; }
  .fb-editor-meta { font-size: 12.5px; color: var(--fb-ink-500); margin-top: 4px; display: flex; gap: 14px; flex-wrap: wrap; }
  .fb-editor-meta i { margin-right: 5px; color: var(--lumo-contrast-40pct, #1c324f61); }

  .fb-builder-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
  @media (max-width: 1100px) { .fb-builder-grid { grid-template-columns: 1fr; } }

  /* Region subheading on the page ground, labelling the cards below it. */
  .fb-subhead { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; }
  .fb-subhead h2 { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--fb-ink-500); }
  .fb-subhead .fb-subhead-actions { margin-left: auto; display: flex; gap: 4px; }

  /* The structure: one card per section, a gap between. */
  .fb-structure { display: flex; flex-direction: column; gap: 2px; }
  .fb-section {
    background: var(--fb-card-bg); border: 1px solid var(--fb-line);
    border-radius: var(--lumo-border-radius-m, .5em);
    box-shadow: var(--lumo-box-shadow-xs, 0 1px 4px -1px #1c304a85);
  }
  .fb-section.is-selected { border-color: var(--fb-accent); box-shadow: 0 0 0 1px var(--fb-accent); }
  .fb-section-head {
    display: flex; align-items: center; gap: 11px; padding: 10px var(--fb-gutter);
    background: var(--fb-zebra); border-bottom: 1px solid var(--fb-line);
    border-radius: calc(var(--lumo-border-radius-m, .5em) - 1px) calc(var(--lumo-border-radius-m, .5em) - 1px) 0 0;
  }
  .fb-section.is-collapsed .fb-section-head { border-bottom: 0; border-radius: calc(var(--lumo-border-radius-m, .5em) - 1px); }
  .fb-section.is-collapsed .fb-section-body { display: none; }
  .fb-section-ord {
    width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; flex-shrink: 0;
    background: var(--lumo-contrast-10pct, #1a38601a); font-size: 11px; font-weight: 700; color: var(--fb-ink-700);
  }
  .fb-section-name { font-size: 14.5px; font-weight: 700; cursor: pointer; flex: 1; min-width: 0; }
  .fb-section-name:hover { color: var(--lumo-primary-text-color, #0271ce); }
  .fb-section-meta { font-size: 12px; color: var(--fb-ink-500); white-space: nowrap; }
  .fb-section-acts { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .fb-section-help { font-size: 12.5px; color: var(--fb-ink-500); padding: 8px var(--fb-gutter) 0; }

  /* Item lane: questions, displays and blocks interleave in one order. */
  .fb-lane { display: flex; flex-direction: column; padding: 6px var(--fb-gutter) 10px; }
  .fb-gap { height: 6px; flex-shrink: 0; border-radius: 3px; transition: height var(--fb-dur) var(--fb-ease), background var(--fb-dur-fast); }
  .is-dragging-item .fb-gap { height: 9px; }
  .is-dragging-item .fb-gap.is-over { height: 34px; background: var(--lumo-primary-color-10pct, #0271ce1a); box-shadow: inset 0 0 0 1px var(--fb-accent); }

  /* A question row. Plain at rest; a card when selected. */
  .fb-item {
    display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px;
    border: 1px solid transparent; border-radius: var(--lumo-border-radius-s, .25em);
    cursor: pointer; transition: background var(--fb-dur-fast), border-color var(--fb-dur-fast);
  }
  .fb-item:hover { background: var(--fb-zebra-deep); }
  .fb-item.is-selected { background: var(--lumo-primary-color-10pct, #0271ce1a); border-color: var(--fb-accent); }
  .fb-item.is-dragging { opacity: .4; }
  .fb-item:focus-visible { outline: 2px solid var(--fb-accent); outline-offset: -2px; }
  .fb-grip { color: var(--lumo-contrast-40pct, #1c324f61); cursor: grab; font-size: 13px; opacity: 0; transition: opacity .12s; padding-top: 7px; flex-shrink: 0; }
  .fb-item:hover .fb-grip, .fb-item:focus-within .fb-grip, .fb-block-row:hover .fb-grip { opacity: 1; }
  @media (hover: none) { .fb-grip { opacity: 1; } }
  .fb-item.no-drag .fb-grip { visibility: hidden; }
  .fb-item-num {
    width: 22px; font-size: 11.5px; font-weight: 700; color: var(--fb-ink-500); flex-shrink: 0;
    font-variant-numeric: tabular-nums; padding-top: 7px; text-align: right;
  }
  .fb-mech-tile {
    width: 30px; height: 30px; border-radius: 7px; flex-shrink: 0; display: grid; place-items: center;
    font-size: 13px; background: var(--lumo-contrast-5pct, #193b670d); color: var(--fb-ink-700);
  }
  .fb-mech-tile[data-m="scale"]     { background: #ede9fe; color: #6d28d9; }
  .fb-mech-tile[data-m="choice"]    { background: #dbeafe; color: #1d4ed8; }
  .fb-mech-tile[data-m="text"]      { background: #e0f2fe; color: #0369a1; }
  .fb-mech-tile[data-m="measure"]   { background: #dcfce7; color: #15803d; }
  .fb-mech-tile[data-m="datetime"]  { background: #fef3c7; color: #b45309; }
  .fb-mech-tile[data-m="lookup"]    { background: #fce7f3; color: #be185d; }
  .fb-mech-tile[data-m="evidence"]  { background: #ffedd5; color: #c2410c; }
  .fb-mech-tile[data-m="script"]    { background: #e0e7ff; color: #4338ca; }
  .fb-mech-tile[data-m="attest"]    { background: #d1fae5; color: #047857; }
  .fb-mech-tile[data-m="calculate"] { background: #f3e8ff; color: #7e22ce; }
  .fb-mech-tile[data-m="repeat"]    { background: #cffafe; color: #0e7490; }
  .fb-mech-tile[data-m="nested"]    { background: #cffafe; color: #0e7490; }
  .fb-mech-tile[data-m="timer"]     { background: #fee2e2; color: #b91c1c; }
  .fb-mech-tile[data-m="display"]   { background: #f3f4f6; color: #4b5563; }
  .fb-item-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .fb-item-title { font-size: 13.5px; font-weight: 600; line-height: 1.35; }
  .fb-item-title.is-placeholder { color: var(--fb-ink-500); font-style: italic; font-weight: 400; }
  .fb-item-summary { font-size: 12px; color: var(--fb-ink-500); line-height: 1.4; }
  .fb-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
  .fb-chip {
    display: inline-flex; align-items: center; gap: 4px; font-size: 11px; line-height: 1; padding: 3px 7px;
    border-radius: 4px; background: var(--lumo-contrast-5pct, #193b670d); color: var(--fb-ink-700); white-space: nowrap;
  }
  .fb-chip i { font-size: 9.5px; color: var(--fb-ink-500); }
  .fb-chip.is-req { background: var(--lumo-error-color-10pct, #e71d131a); color: var(--lumo-error-text-color, #ca150c); }
  .fb-chip.is-req i { color: inherit; }
  .fb-chip.is-who { background: #ede9fe; color: #5b21b6; }
  .fb-chip.is-who i { color: inherit; }
  .fb-chip.is-rule { background: var(--lumo-warning-color-10pct, #ffcc001a); color: var(--lumo-warning-text-color, #995211); }
  .fb-chip.is-rule i { color: inherit; }
  .fb-item-acts { flex-shrink: 0; display: flex; align-items: center; gap: 2px; }

  /* Display items (headings, instructions) read as what they are. */
  .fb-item--display .fb-item-title { font-weight: 700; }
  .fb-item--display[data-style="instruction"] .fb-item-title { font-weight: 400; color: var(--fb-ink-700); }

  /* A content block: bordered card with a label row and sealed steps. The
     contrast with plain question rows is what tells the two apart. */
  .fb-block {
    border: 1px solid var(--fb-line); border-radius: var(--lumo-border-radius-s, .25em);
    background: var(--fb-zebra-deep); margin: 2px 0;
  }
  .fb-block.is-selected { border-color: var(--fb-accent); box-shadow: 0 0 0 1px var(--fb-accent); }
  .fb-block-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; cursor: pointer; }
  .fb-block-row .fb-grip { padding-top: 0; }
  .fb-block-tile { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; background: #1b3b5f; color: #fff; font-size: 12px; flex-shrink: 0; }
  .fb-block-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .fb-block-name { font-size: 13.5px; font-weight: 600; }
  .fb-block-meta { font-size: 11.5px; color: var(--fb-ink-500); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .fb-linkdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .fb-linkdot[data-s="template"] { background: #6d28d9; }
  .fb-linkdot[data-s="block"]    { background: var(--fb-accent); }
  .fb-linkdot[data-s="unique"]   { background: var(--fb-ink-500); }
  .fb-block-steps { padding: 2px 10px 8px 50px; display: none; }
  .fb-block.is-open .fb-block-steps { display: block; }
  .fb-block-step { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12.5px; border-bottom: 1px dashed var(--fb-line-soft); }
  .fb-block-step:last-child { border-bottom: 0; }
  .fb-block-step .fb-mech-tile { width: 22px; height: 22px; font-size: 10px; border-radius: 5px; }
  .fb-block-step-t { flex: 1; min-width: 0; }
  .fb-block-step-s { font-size: 11.5px; color: var(--fb-ink-500); }
  .fb-sealed { font-size: 11px; color: var(--fb-ink-500); display: inline-flex; align-items: center; gap: 5px; }

  /* Add row under a lane. */
  .fb-lane-add { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; padding: 4px 0 0 32px; }

  /* ---- Row overflow menu (ported from Checklist Management) ------------ */
  .fb-rowmenu { position: relative; flex-shrink: 0; }
  .fb-rowmenu-list {
    position: absolute; top: calc(100% + 4px); right: 0; z-index: 30; min-width: 200px; padding: 5px;
    background: var(--fb-card-bg); border: 1px solid var(--lumo-contrast-20pct, #1c375a29);
    border-radius: var(--lumo-border-radius-m, .5em); box-shadow: var(--lumo-box-shadow-s, 0 2px 4px -1px #1c375a29, 0 3px 12px -1px #1c345442);
    display: flex; flex-direction: column;
  }
  .fb-rowmenu-list.is-up { top: auto; bottom: calc(100% + 4px); }
  .fb-rowmenu-opt {
    appearance: none; background: none; border: 0; text-align: left; padding: 8px 10px; font: inherit; font-size: 13px;
    cursor: pointer; color: var(--fb-ink-900); border-radius: var(--lumo-border-radius-s, .25em);
    display: flex; align-items: center; gap: 10px; white-space: nowrap;
  }
  .fb-rowmenu-opt i { width: 15px; text-align: center; color: var(--fb-ink-500); font-size: 12.5px; }
  .fb-rowmenu-opt:hover:not(:disabled) { background: var(--lumo-contrast-5pct, #1c375a0d); }
  .fb-rowmenu-opt:focus-visible { outline: 2px solid var(--fb-accent); outline-offset: -2px; }
  .fb-rowmenu-opt:disabled { opacity: .38; cursor: default; }
  .fb-rowmenu-opt.is-danger { color: var(--lumo-error-text-color, #ca150c); }
  .fb-rowmenu-opt.is-danger i { color: inherit; }
  .fb-rowmenu-sep { height: 1px; margin: 4px 2px; background: var(--lumo-contrast-10pct, #1c375a1a); }

  /* ====================================================================
     INSPECTOR — the right column. Sticky; staged sections.
     ==================================================================== */
  .fb-inspector { position: sticky; top: 0; }
  .fb-insp {
    background: var(--fb-card-bg); border: 1px solid var(--fb-line); border-radius: var(--lumo-border-radius-m, .5em);
    box-shadow: var(--lumo-box-shadow-xs, 0 1px 4px -1px #1c304a85);
    max-height: calc(100vh - var(--fb-topbar-h) - 44px); display: flex; flex-direction: column;
    /* Dense authoring form: step inputs down to --lumo-size-s (themes v1.9.3). */
    --lumo-size-m: var(--lumo-size-s, 1.875rem);
    --lumo-font-size-m: 13px;
  }
  .fb-insp-head { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--fb-line); background: var(--fb-zebra); border-radius: calc(var(--lumo-border-radius-m, .5em) - 1px) calc(var(--lumo-border-radius-m, .5em) - 1px) 0 0; }
  .fb-insp-kind { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--fb-ink-500); }

<body>

<div class="fb-app">
  <!-- ============================ TOP BAR ============================

  <header class="fb-topbar" id="topbar">

<script>
/* ======================================================================
   REGISTRIES — shared core (layer 1 in 06-shared-vs-product.md)

   MECHANISMS: the 15 core mechanisms from 03 §4. Each declares what it
   collects, its customization dimensions, defaults, a one-line canvas
   summary, and which answerers it allows (FB-M-03). Inspector panels live
   in MECH_INSPECTORS further down — this block is data.
   ====================================================================== */
const MECHANISMS = {
  display:   { name: 'Display',      icon: 'fa-heading',        group: 'layout',
               collects: 'Nothing: a heading, instruction or note',
               dims: ['style', 'alignment', 'rich text'],
               defaults: () => ({ style: 'heading', align: 'left' }),
               allowed: ['none'] },
  scale:     { name: 'Scale',        icon: 'fa-chart-simple',   group: 'question',
               collects: 'A position on ordered levels',
               dims: ['levels (2–8)', 'value', 'title', 'description', 'exclude from averages', 'level rules', 'colours', 'presets'],
               defaults: () => ({ levels: [
                 { value: 1, title: 'Level 1', description: '', excludeAvg: false, requireDuration: false },
                 { value: 2, title: 'Level 2', description: '', excludeAvg: false, requireDuration: false },
                 { value: 3, title: 'Level 3', description: '', excludeAvg: false, requireDuration: false } ],
                 scaleRef: null, linked: false }),
               allowed: ['initiator','subject','participants-view','participants-record-exsubject','participants-record','none'] },
  choice:    { name: 'Choice',       icon: 'fa-list-ul',        group: 'question',

               dims: ['single / multi', 'options', 'value', 'exclude from averages', 'meaning per option', '"Other" text', 'format', 'columns'],
               defaults: () => ({ multi: false, options: [
                 { id: 'o1', label: 'Option A', value: null, meaning: 'none', excludeAvg: false },
                 { id: 'o2', label: 'Option B', value: null, meaning: 'none', excludeAvg: false } ],
                 allowOther: false, otherRequiresComment: false, format: 'list', columns: 1, labels: null }),
               allowed: ['initiator','subject','participants-view','participants-record-exsubject','participants-record','none'] },
  text:      { name: 'Text',         icon: 'fa-font',           group: 'question',
               collects: 'Words',
               dims: ['lines', 'max length', 'placeholder', 'format (plain / rich)', 'AI assist'],
               defaults: () => ({ lines: 'single', maxLength: null, placeholder: '', format: 'plain', aiAssist: false }),
               allowed: ['initiator','subject','participants-view','participants-record-exsubject','participants-record','none'] },
  measure:   { name: 'Measure',      icon: 'fa-ruler-horizontal', group: 'question',
               collects: 'A number',
               dims: ['unit', 'format', 'precision', 'accepted range', 'par', 'entry method'],
               defaults: () => ({ format: 'number', unit: '', precision: 0, min: null, max: null, par: null, entry: 'field', noun: '' }),
               allowed: ['initiator','subject','participants-view','participants-record-exsubject','participants-record','none'] },
  datetime:  { name: 'Date & time',  icon: 'fa-calendar-day',   group: 'question',
               collects: 'A moment',
               dims: ['date / time / both', 'default', 'range', 'relative constraints'],
               defaults: () => ({ capture: 'date', default: 'none', min: null, max: null }),
               allowed: ['initiator','subject','participants-view','participants-record-exsubject','participants-record','none'] },
  lookup:    { name: 'Lookup',       icon: 'fa-magnifying-glass', group: 'question',
               collects: 'A reference to a product record',
               dims: ['entity', 'filter by parent', 'auto-fill', 'default (me)', 'manual entry'],
               defaults: () => ({ entity: null, filterBy: null, populates: [], defaultMe: false, allowManual: false }),
               allowed: ['initiator','subject','participants-view','participants-record-exsubject','participants-record','none'] },
  evidence:  { name: 'Evidence',     icon: 'fa-paperclip',      group: 'question',
               collects: 'Files and media',
               dims: ['methods', 'off / allowed / required', 'limits', 'location capture', 'tags'],
               defaults: () => ({ methods: ['photo', 'file'], maxFiles: 10, location: false }),
               allowed: ['initiator','subject','participants-view','participants-record-exsubject','participants-record'] },
  script:    { name: 'Script',       icon: 'fa-comments',       group: 'question',
               collects: 'Timed, attributed entries',

/* Build a question from a mechanism + preset in a profile's vocabulary. */
function mkQ(profileId, mechanism, presetId, title, o) {
  o = o || {};
  const prof = PROFILES[profileId];
  const q = {
    id: o.id || uid('q'), identity: o.identity || null, mechanism, preset: presetId || null,
    title: title || '', details: o.details || '', required: o.required !== false,
    answeredBy: { relation: mechanism === 'display' || mechanism === 'repeat' || mechanism === 'nested' || mechanism === 'timer' ? 'none' : 'initiator' },
    config: MECHANISMS[mechanism].defaults(),
    capture: { comment: 'off', evidence: { mode: 'off', methods: ['photo'] } },
    extensions: {}, presentation: { controlPosition: 'under', divider: false, background: '' }, rules: []
  };
  if (q.identity == null) q.identity = q.id;
  const preset = presetId && prof.presets.find(p => p.id === presetId);
  if (preset && preset.apply) preset.apply(q);
  if (o.config) Object.assign(q.config, o.config);
  if (o.capture) { if (o.capture.comment) q.capture.comment = o.capture.comment; if (o.capture.evidence) Object.assign(q.capture.evidence, o.capture.evidence); }
  if (o.who) q.answeredBy = { relation: o.who };
  if (o.ext) q.extensions = o.ext;
  if (o.rules) q.rules = o.rules;
  if (o.outcomes) q.outcomes = o.outcomes;      // Check It fail outcomes (pass 3 makes them rule effects)
  if (o.labels) q.config.labels = o.labels;     // Q41 response relabel
  if (o.pres) Object.assign(q.presentation, o.pres);
  return q;
}
function mkSection(title, items, o) {
  o = o || {};
  return { id: o.id || uid('s'), title, help: o.help || '', layout: o.layout || 1, collapsed: !!o.collapsed, locked: !!o.locked, items };
}
function mkBlockRef(blockId, contextLabel, linkState, expanded) {
  return { type: 'block', instanceId: uid('i'), blockId, contextLabel: contextLabel || '', linkState: linkState || 'block', expanded: !!expanded };
}
function mkForm(profileId, o) {

}

  formId: null,             // open form

  dirty: false,

const V  = k => P().vocab[k] || k;
const lib = () => LIB[state.profile];
const currentForm = () => lib().forms.find(f => f.id === state.formId) || null;
const blockById = id => lib().blocks.find(b => b.id === id);
const scaleById = id => (lib().scales || []).find(s => s.id === id);
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';

const escHtml = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

/* el(tag, attrs, children): attrs keys starting with "on" are listeners,
   "class"/"className" the class, "html" innerHTML, "text" textContent,
   "style" a cssText string, "props" a map of DOM properties, anything else
   an attribute. */
function el(tag, attrs, children) {
  const n = document.createElement(tag);
  attrs = attrs || {};
  Object.keys(attrs).forEach(k => {
    const v = attrs[k];
    if (v == null || v === false) return;
    if (k === 'class' || k === 'className') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;

  // 1) State driver — put the page into the screen for node `id`.
  function applyFlowState(id, opts) {
    opts = opts || {};
    const go = (profile, fn) => { if (state.profile !== profile) { state.profile = profile; renderShell(); } fn(); };
    switch (id) {
      case 'library-ci': go('checkit', () => { state.libTab = 'forms'; setView('library'); }); break;
      case 'library-ev': go('evaluations', () => { state.libTab = 'forms'; setView('library'); }); break;
      case 'library-blocks-ev': go('evaluations', () => { state.libTab = 'blocks'; setView('library'); }); break;
      case 'library-scales-ev': go('evaluations', () => { state.libTab = 'scales'; setView('library'); }); break;
      case 'setup-ev': go('evaluations', () => { state.libTab = 'forms'; setView('library'); setTimeout(() => openSetupDialog(), 60); }); break;
      case 'builder-ci': go('checkit', () => { state.formId = 'apparatus-morning'; state.sel = { kind: 'form' }; setView('builder'); }); break;
      case 'builder-ev': go('evaluations', () => { state.formId = 'classroom-observation'; state.sel = { kind: 'form' }; setView('builder'); }); break;
      case 'question-ev': go('evaluations', () => { state.formId = 'classroom-observation'; const f = currentForm(); const s = f.sections[2]; state.sel = { kind: 'item', sectionId: s.id, id: s.items[0].id }; setView('builder'); }); break;
      case 'question-ci': go('checkit', () => { state.formId = 'apparatus-morning'; const f = currentForm(); const s = f.sections[0]; state.sel = { kind: 'item', sectionId: s.id, id: s.items[4].id }; setView('builder'); }); break;
      case 'block-ci': go('checkit', () => { state.formId = 'apparatus-morning'; const f = currentForm(); const s = f.sections[1]; state.sel = { kind: 'block', sectionId: s.id, instanceId: s.items[0].instanceId }; setView('builder'); }); break;
      case 'picker-ev': go('evaluations', () => { state.formId = 'classroom-observation'; state.sel = { kind: 'form' }; setView('builder'); setTimeout(() => openPicker(currentForm().sections[2].id), 60); }); break;
      case 'picker-ci': go('checkit', () => { state.formId = 'apparatus-morning'; state.sel = { kind: 'form' }; setView('builder'); setTimeout(() => openPicker(currentForm().sections[0].id), 60); }); break;
      default: go('checkit', () => { state.libTab = 'forms'; setView('library'); }); break;
    }
    if (!opts.instant) window.scrollTo(0, 0);
  }
  window.applyFlowState = applyFlowState;

  // 2) Boot: shell first, then honour #fm=<state>, else the Check It library.
  renderShell();
  function bootFromHash() {
    var m = (location.hash || '').match(/fm=([\w-]+)/);
    if (m) { try { applyFlowState(decodeURIComponent(m[1]), { instant: true }); return true; } catch (e) {} }
    return false;
  }
  if (!bootFromHash()) setView('library');
  window.addEventListener('hashchange', bootFromHash);

  // 3) Flow-map config.
  window.TOOLBOX_CONFIG = {
    flowMap: {
      title: 'Form Builder — Flow Map',
      applyState: 'applyFlowState',
      canvas: { w: 1500, h: 620 },
      flows: [
        { id: 'ci', name: 'Check It profile', pill: 'A', color: '#c9d6e6', lane: { x: 20, y: 20, w: 1460, h: 280 }, labelXY: { x: 40, y: 40 } },
        { id: 'ev', name: 'Evaluations profile', pill: 'B', color: '#c9ddf5', lane: { x: 20, y: 320, w: 1460, h: 280 }, labelXY: { x: 40, y: 340 } }
      ],
      nodes: [
        { id: 'library-ci', flow: 'ci', entry: true, x: 60,  y: 110, step: '1', name: 'Checklist Library', state: 'library-ci', desc: 'One library per product: checklists, templates, content blocks. Check It vocabulary throughout.' },
        { id: 'builder-ci', flow: 'ci', x: 360, y: 110, step: '2', name: 'Builder: Apparatus Morning Check', state: 'builder-ci', desc: 'Canvas + inspector. Local steps interleave with linked content blocks (seen in design).' },
        { id: 'question-ci', flow: 'ci', x: 660, y: 110, step: '3', name: 'Step inspector: nested check', state: 'question-ci', desc: 'Nested mechanism with Check It’s look-back and minimum-passing settings as profile dimensions.' },
        { id: 'block-ci', flow: 'ci', x: 960, y: 110, step: '4', name: 'Content block in place', state: 'block-ci', desc: 'A sealed block instance with its link state and context label.' },
        { id: 'picker-ci', flow: 'ci', x: 1260, y: 110, step: '5', name: 'Add step: presets', state: 'picker-ci', desc: 'Mechanism → preset, filtered by the Check It profile. Pass/Fail, Count vs. par, Nested check…' },
        { id: 'library-ev', flow: 'ev', entry: true, x: 60,  y: 410, step: '1', name: 'Forms library', state: 'library-ev', desc: 'Same shell, Evaluations vocabulary: forms, form sections, scales. Statuses incl. Superseded and Publish-Restricted.' },
        { id: 'setup-ev', flow: 'ev', x: 360, y: 410, step: '2', name: 'New form: setup', state: 'setup-ev', desc: 'Kind + Mode + Template (P2) and who can start it. Mode locks after publish, said up front.' },
        { id: 'builder-ev', flow: 'ev', x: 660, y: 410, step: '3', name: 'Builder: Classroom Observation', state: 'builder-ev', desc: 'Danielson domains as linked blocks; form settings grouped, conditional, with lock warnings and extension chips.' },
        { id: 'question-ev', flow: 'ev', x: 960, y: 410, step: '4', name: 'Question inspector: who answers', state: 'question-ev', desc: 'Relationship-based who-answers with the per-mechanism allowed matrix (code-confirmed).' },
        { id: 'picker-ev', flow: 'ev', x: 1260, y: 410, step: '5', name: 'Add question: presets', state: 'picker-ev', desc: 'The same mechanisms wearing Evaluations presets: Rating Scale, Choose One, Signature (non-locking)…' }
      ],
      edges: [
        ['library-ci', 'builder-ci'], ['builder-ci', 'question-ci'], ['builder-ci', 'block-ci'], ['builder-ci', 'picker-ci'],
        ['library-ev', 'setup-ev'], ['setup-ev', 'builder-ev'], ['builder-ev', 'question-ev'], ['builder-ev', 'picker-ev']
      ]
    }
  };
</script>
