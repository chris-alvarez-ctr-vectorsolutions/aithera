name: Scenario Simulator — JSON contract

# The Scenario Editor and the production engine are joined by nothing but JSON.
# This job runs the three checks that guard that joint, all in one harness
# (products/aithera/scenario-simulator/tools/roundtrip-check.js):
#
#   1. ROUND TRIP  — open each of the dev team's live scenario documents in our
#                    export chain and export it again unedited. Any difference is
#                    content an author loses or a field their loader rejects.
#   2. COVERAGE    — every leaf those documents carry must be reachable by an
#                    editor field. This is the half a round trip cannot see: two
#                    lists were once bound to index 0, hiding 152 authored fields,
#                    and the round trip stayed green throughout because untouched
#                    data exports perfectly well. Baselined, so only a NEW gap
#                    fails; the baseline is meant to shrink.
#   3. SCHEMA PIN  — their JSON Schema is vendored under tools/pinned/ and
#                    compared against the live file. js/scenario-v4.js
#                    transcribes its rules by hand, so a change on their side is
#                    a change an author hits before we do.
#
# WHY IT NEEDS A TOKEN. Checks 1 and 3 read from VectorLearning/scenario-simulator-poc,
# a different repository, so the default GITHUB_TOKEN is not enough — it is scoped
# to this repo. Add a fine-grained PAT with *Contents: read* on that repo as the
# repository secret SCENSIM_POC_TOKEN.
#
# Until that secret exists the job does NOT fail the build — it emits a warning
# annotation on every run instead. A check that silently never runs is the exact
# failure mode this harness was written to end, so it has to stay visible; but
# blocking every push on a secret nobody has created yet would just get the whole
# workflow disabled.

on:
  push:
    branches: [main]
    paths:
      - 'products/aithera/scenario-simulator/js/**'
      - 'products/aithera/scenario-simulator/tools/**'
  pull_request:
    paths:
      - 'products/aithera/scenario-simulator/js/**'
      - 'products/aithera/scenario-simulator/tools/**'
  # Their schema can move without us pushing anything, so check on a timer too.
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scensim-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check the token is present
        id: token
        env:
          POC_TOKEN: ${{ secrets.SCENSIM_POC_TOKEN }}
        run: |
          if [ -z "$POC_TOKEN" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Contract check skipped::SCENSIM_POC_TOKEN is not set, so the round-trip and schema checks cannot read VectorLearning/scenario-simulator-poc. Add a fine-grained PAT with Contents:read on that repo as the SCENSIM_POC_TOKEN secret. Field coverage needs those documents too, so nothing ran."
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Round trip, field coverage, and schema drift
        if: steps.token.outputs.have == 'true'
        working-directory: products/aithera/scenario-simulator
        env:
          # roundtrip-check.js shells out to `gh`, which reads this.
          GH_TOKEN: ${{ secrets.SCENSIM_POC_TOKEN }}
        run: node tools/roundtrip-check.js
