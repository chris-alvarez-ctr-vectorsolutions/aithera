name: Build product dashboards

# Regenerates each enrolled product's dashboard/meta.json (folder list, dev-handoff
# flags, recent-activity log) whenever mocks change, and commits the result back.
# This is what makes the product dashboards "auto-update on push" — nobody edits
# meta.json by hand. See scripts/build-dashboards.js and designtoolbox/dashboard.js.

on:
  push:
    branches: [main]
    paths:
      - 'products/**'
      - 'products.json'
      - 'scripts/build-dashboards.js'
      - 'scripts/build-updated-stamps.js'
      - 'scripts/relink-catalog.js'
      - 'designtoolbox/dashboard.js'
      - '.github/workflows/dashboards.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dashboards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the changelog)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Follow renames in the catalog (self-healing dashboard links)
        # If this push renamed/moved a mock file, rewrite the products.json rel
        # / versions.json path that pointed at it so the dashboard card never
        # goes dead. The change rides the same silent bot commit below.
        run: |
          set -euo pipefail
          BASE='${{ github.event.before }}'
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1 2>/dev/null || echo '')
          fi
          if [ -n "$BASE" ]; then
            node scripts/relink-catalog.js "$BASE" "${{ github.sha }}"
          else
            echo "no usable base ref — skipping relink."
          fi

      - name: Regenerate dashboard meta.json
        run: node scripts/build-dashboards.js

      - name: Regenerate experiment "updated" stamps
        run: node scripts/build-updated-stamps.js

      - name: Commit if anything changed
        run: |
          # meta.json + updated stamps from the build steps, plus any
          # products.json / versions.json rewrites from the relink step.
          git add products.json
          git add -A products/
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # [skip ci] prevents this commit from re-triggering the workflow.
            git commit -m "chore(dashboards): regenerate meta.json + relink renamed mocks [skip ci]"
            # main moves fast here (designers push in bursts, and this job takes
            # minutes on the full-history checkout) — a plain push loses the race
            # and fails the run. Rebase the bot commit onto whatever landed in
            # the meantime and retry instead of failing.
            for attempt in 1 2 3 4 5; do
              if git push; then exit 0; fi
              echo "push rejected (main moved during the run) — rebasing and retrying ($attempt/5)…"
              git pull --rebase
            done
            echo "::error::Could not push dashboard regeneration after 5 rebase retries."
            exit 1
          fi
