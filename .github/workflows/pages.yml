name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: editor/package-lock.json

      - name: Build editor
        run: |
          cd editor
          npm ci
          npm run build

      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a --exclude='_site' \
                   --exclude='.git' \
                   --exclude='.github' \
                   --exclude='.claude' \
                   --exclude='editor' \
                   --exclude='node_modules' \
                   ./ _site/
          mkdir -p _site/editor
          cp -R editor/dist/. _site/editor/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
