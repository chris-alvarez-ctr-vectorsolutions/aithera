<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Immersive Panorama</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #fff; }
  #stage { position: fixed; inset: 0; cursor: grab; touch-action: none; }
  #stage.dragging { cursor: grabbing; }
  canvas { display: block; }
  .hud {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: rgba(0,0,0,0.55); backdrop-filter: blur(10px);
    padding: 10px 16px; border-radius: 999px; font-size: 13px;
    letter-spacing: 0.02em; pointer-events: none;
    border: 1px solid rgba(255,255,255,0.12);
  }
  .badge {
    position: fixed; top: 18px; left: 18px;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(10px);
    padding: 8px 14px; border-radius: 999px; font-size: 12px;
    border: 1px solid rgba(255,255,255,0.12);
    text-transform: uppercase; letter-spacing: 0.12em;
  }
  .controls {
    position: fixed; top: 18px; right: 18px; display: flex; gap: 8px;
  }
  .controls button {
    width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(0,0,0,0.55); color: #fff; backdrop-filter: blur(10px);
    font-size: 18px; cursor: pointer; display: grid; place-items: center;
  }
  .controls button:hover { background: rgba(255,255,255,0.15); }
</style>
</head>
<body>
  <div id="stage"></div>
  <div class="badge">Scene · Tanker Spill</div>
  <div class="controls">
    <button id="zoom-in" title="Zoom in">+</button>
    <button id="zoom-out" title="Zoom out">−</button>
    <button id="reset" title="Reset view">⟳</button>
    <button id="close" title="Close experiment" aria-label="Close">✕</button>
  </div>
  <div class="hud">Drag to look around · Scroll or pinch to zoom</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const stage = document.getElementById('stage');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1100);
camera.target = new THREE.Vector3(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
stage.appendChild(renderer.domElement);

const geometry = new THREE.SphereGeometry(500, 96, 64);
geometry.scale(-1, 1, 1);
const texture = new THREE.TextureLoader().load('assets/panoramas/tanker-spill.png', t => {
  t.colorSpace = THREE.SRGBColorSpace;
});
const sphere = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ map: texture }));
scene.add(sphere);

let lon = 180, lat = 0;
let fov = 75;
const minFov = 30, maxFov = 100;

let isDown = false, downX = 0, downY = 0, downLon = 0, downLat = 0;

stage.addEventListener('pointerdown', e => {
  isDown = true; stage.classList.add('dragging');
  stage.setPointerCapture(e.pointerId);
  downX = e.clientX; downY = e.clientY; downLon = lon; downLat = lat;
});
stage.addEventListener('pointermove', e => {
  if (!isDown) return;
  const factor = fov / innerHeight;
  lon = downLon - (e.clientX - downX) * factor;
  lat = downLat + (e.clientY - downY) * factor;
});
stage.addEventListener('pointerup', e => { isDown = false; stage.classList.remove('dragging'); });
stage.addEventListener('pointercancel', () => { isDown = false; stage.classList.remove('dragging'); });

stage.addEventListener('wheel', e => {
  e.preventDefault();
  fov = THREE.MathUtils.clamp(fov + e.deltaY * 0.05, minFov, maxFov);
}, { passive: false });

// Pinch zoom
const pointers = new Map();
let pinchStartDist = 0, pinchStartFov = 75;
stage.addEventListener('pointerdown', e => pointers.set(e.pointerId, e));
stage.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, e);
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (!pinchStartDist) { pinchStartDist = dist; pinchStartFov = fov; }
    else fov = THREE.MathUtils.clamp(pinchStartFov * (pinchStartDist / dist), minFov, maxFov);
    isDown = false;
  }
});
const clearPointer = e => {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinchStartDist = 0;
};
stage.addEventListener('pointerup', clearPointer);
stage.addEventListener('pointercancel', clearPointer);

document.getElementById('zoom-in').onclick = () => fov = Math.max(minFov, fov - 8);
document.getElementById('zoom-out').onclick = () => fov = Math.min(maxFov, fov + 8);
document.getElementById('reset').onclick = () => { lon = 180; lat = 0; fov = 75; };
document.getElementById('close').onclick = () => {
  if (history.length > 1 && document.referrer) history.back();
  else location.href = 'index.html';
};

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  lat = Math.max(-85, Math.min(85, lat));
  const phi = THREE.MathUtils.degToRad(90 - lat);
  const theta = THREE.MathUtils.degToRad(lon);
  camera.target.x = 500 * Math.sin(phi) * Math.cos(theta);
  camera.target.y = 500 * Math.cos(phi);
  camera.target.z = 500 * Math.sin(phi) * Math.sin(theta);
  camera.lookAt(camera.target);
  camera.fov = fov;
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
