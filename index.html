    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Open Sans', sans-serif;
            background: var(--lumo-contrast-5pct, #f4f5f7);
            color: var(--lumo-body-text-color, #1a1a1a);
            min-height: 100vh;
        }

        /* ── Header ── */
        .site-header {
            background: #fff;
            border-bottom: 1px solid #e2e4e8;
            padding: 0 32px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand {
            font-size: 15px;
            font-weight: 700;
            color: #0066cc;
            display: flex;
            align-items: center;
            gap: 9px;
            text-decoration: none;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f4f5f7;
            border: 1px solid #d0d3d9;
            border-radius: 6px;
            padding: 5px 12px;
            width: 240px;
        }

        .search-box i { color: #9aa0ac; font-size: 12px; }

        .search-box input {
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 13px;
            color: #1a1a1a;
            outline: none;
            width: 100%;
        }

        .search-box input::placeholder { color: #9aa0ac; }

        /* ── Page ── */
        .page {
            max-width: 960px;
            margin: 0 auto;
            padding: 36px 24px 80px;
        }

        .page-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }

        .page-sub {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 28px;
        }

        /* ── Landing: product grid ── */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(224px, 1fr));
            gap: 14px;
        }

        .product-card {
            background: #fff;
            border: 1px solid #e2e4e8;
            border-radius: 10px;
            padding: 18px 18px 16px;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            transition: box-shadow 0.12s ease, transform 0.12s ease, border-color 0.12s ease;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-card:hover {
            border-color: #c4d4f0;
            box-shadow: 0 6px 18px rgba(20, 40, 80, 0.10);
            transform: translateY(-2px);
        }

        .product-card[hidden] { display: none; }

        .product-dot {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 15px;
            flex-shrink: 0;
        }

        .product-card .pc-label { font-size: 15px; font-weight: 700; color: #1a1a1a; }

        .product-card .pc-meta {
            font-size: 12px;
            color: #9aa0ac;
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: auto;
        }

        .product-card .pc-meta .dot-sep { width: 3px; height: 3px; border-radius: 50%; background: #c4c9d2; }

        /* dashboard cards: clicking the card opens the product dashboard */
        .product-card .pc-label .fa-arrow-up-right-from-square { margin-left: 4px; }

        .product-card .pc-desc {
            font-size: 12px;
            line-height: 1.5;
            color: #6b7280;
        }

        .product-card .pc-all-link {
            font-size: 12px;
            color: #6b7280;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: auto;
        }
        .product-card .pc-all-link:hover { color: #0066cc; text-decoration: underline; }

        /* ── Detail view ── */
        .detail[hidden], .landing[hidden] { display: none; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            font-weight: 600;
            color: #0066cc;
            text-decoration: none;
            margin-bottom: 18px;
        }
        .back-link:hover { text-decoration: underline; }

        .detail-head {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 6px;
        }

        .detail-head .product-dot { width: 42px; height: 42px; font-size: 17px; border-radius: 9px; }

        .detail-title { font-size: 22px; font-weight: 700; }

        a.detail-title {
            color: #0066cc;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 9px;
        }
        a.detail-title:hover { text-decoration: underline; }
        a.detail-title .fa-arrow-up-right-from-square { font-size: 13px; }

        .detail-dash-note {
            font-size: 12px;
            color: #9aa0ac;
            margin-left: 56px;
            margin-bottom: 22px;
        }
        .detail-head + .proto-table-wrap { margin-top: 22px; }

        /* ── Prototype table ── */
        .proto-table-wrap {
            background: #fff;
            border: 1px solid #e2e4e8;
            border-radius: 10px;
            overflow: hidden;
        }

        .proto-table { width: 100%; border-collapse: collapse; }

        .proto-table thead th {
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 11px 16px;
            background: #fafbfc;
            border-bottom: 1px solid #e2e4e8;
        }

        .proto-table th.col-jira { width: 150px; }
        .proto-table th.col-date { width: 130px; }

        .proto-table tbody tr.proto-row { border-top: 1px solid #f0f1f3; transition: background 0.1s ease; }
        .proto-table tbody tr.proto-row:hover { background: #f0f4ff; }
        .proto-table tbody tr.proto-row:first-child { border-top: none; }
        .proto-table tbody tr[hidden] { display: none; }

        .proto-table td { padding: 10px 16px; font-size: 13px; vertical-align: middle; }

        .proto-name {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            color: #1a1a1a;
            text-decoration: none;
            font-weight: 500;
        }
        .proto-name .file-icon { color: #b0b8c4; font-size: 12px; }
        .proto-row:hover .proto-name { color: #0044aa; }
        .proto-row:hover .proto-name .file-icon { color: #4d8fe0; }
        .proto-name .ext-icon { color: #d0d3d9; font-size: 10px; opacity: 0; transition: opacity 0.1s ease; }
        .proto-row:hover .proto-name .ext-icon { opacity: 1; color: #0066cc; }

        /* indent rows that live inside a sub-folder group */
        .proto-row.in-group .proto-name { padding-left: 22px; }

        .jira-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #0066cc;
            text-decoration: none;
            background: #eef4ff;
            border: 1px solid #d6e4fb;
            border-radius: 5px;
            padding: 2px 8px;
        }
        .jira-link:hover { background: #e0ecff; }
        .jira-empty { color: #c4c9d2; font-size: 13px; }

        .date-cell { color: #6b7280; font-size: 12px; white-space: nowrap; }

        /* group header row */
        tr.group-row td {
            padding: 8px 16px;
            font-size: 11px;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            background: #fafbfc;
            border-top: 1px solid #f0f1f3;
        }
        tr.group-row[hidden] { display: none; }
        tr.group-row td .sf-icon { color: #9aa0ac; margin-right: 8px; }

        /* ── Empty / no-results state ── */
        .empty-state {
            display: none;
            text-align: center;
            padding: 60px 0;
            color: #9aa0ac;
        }
        .empty-state.visible { display: block; }
        .empty-state i { font-size: 28px; margin-bottom: 12px; opacity: 0.5; display: block; }
        .empty-state p { font-size: 14px; }

                { name: 'Notifications',      href: 'products/design-system/notifications/',  modified: '2026-04-17' },
                { folder: 'Design System Expansion', items: [
                    { name: 'Gallery',   href: 'products/design-system/vector-design-system-expansion/gallery.html',   modified: '2026-05-27' },
                    { name: 'Reference', href: 'products/design-system/vector-design-system-expansion/reference.html', modified: '2026-05-27' },
                ]},
            ],
        },
        {
            label: 'Target Solutions', slug: 'target-solutions', icon: 'fa-bullseye', color: '#94a3b8',
            items: [
                { name: 'Overview', href: 'products/target-solutions/', modified: '2025-12-09' },
            ],
        },
    ];

    // ── Helpers ───────────────────────────────────────────────────────────────

    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    // "2026-06-23" → "Jun 23, 2026" (parsed manually to avoid timezone shifts)
    function fmtDate(iso) {
        if (!iso) return '';
        const [y, m, d] = iso.split('-').map(Number);
        return `${MONTHS[m - 1]} ${d}, ${y}`;
    }

    // Flatten a product's items into the leaf file entries (skips folder wrappers)
    function flattenItems(items) {
        return items.flatMap(item => item.folder ? flattenItems(item.items) : [item]);
    }

    function latestModified(items) {
        return flattenItems(items).reduce((max, it) =>
            (it.modified && it.modified > max) ? it.modified : max, '');
    }

    function bySlug(slug) {
        return PRODUCTS.find(p => p.slug === slug);
    }

    // ── Landing render ──────────────────────────────────────────────────────

    function renderLanding() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        PRODUCTS.forEach(product => {
            const leaves = flattenItems(product.items);
            const count  = leaves.length;
            const latest = latestModified(product.items);

            // Searchable haystack: product name + every prototype name
            const haystack = (product.label + ' ' + leaves.map(l => l.name).join(' ')).toLowerCase();

            const card = document.createElement('button');
            card.className = 'product-card';
            card.dataset.search = haystack;

            if (product.dashboardHref) {
                // Card opens the product dashboard directly; a footer link still
                // exposes the full prototype list.
                card.addEventListener('click', () => window.open(product.dashboardHref, '_blank'));
                card.innerHTML = `
                    <div class="product-dot" style="background:${product.color}">
                        <i class="fa-solid ${product.icon}"></i>
                    </div>
                    <div class="pc-label">
                        ${product.label}
                        <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:11px;color:#9aa0ac"></i>
                    </div>
                    <p class="pc-desc">${product.description || ''}</p>
                    <a class="pc-all-link" href="#${product.slug}">
                        View all ${count} prototype${count === 1 ? '' : 's'}
                        <i class="fa-solid fa-arrow-right" style="font-size:10px"></i>
                    </a>`;
                // Stop the footer link from also triggering the dashboard open
                card.querySelector('.pc-all-link').addEventListener('click', e => e.stopPropagation());
            } else {
                card.addEventListener('click', () => { location.hash = product.slug; });
                card.innerHTML = `
                    <div class="product-dot" style="background:${product.color}">
                        <i class="fa-solid ${product.icon}"></i>
                    </div>
                    <div class="pc-label">${product.label}</div>
                    <div class="pc-meta">
                        <span>${count} prototype${count === 1 ? '' : 's'}</span>
                        ${latest ? `<span class="dot-sep"></span><span>Updated ${fmtDate(latest)}</span>` : ''}
                    </div>`;
            }
            grid.appendChild(card);
        });
    }

    // ── Detail render ───────────────────────────────────────────────────────

    function protoRow(item, inGroup) {
        const tr = document.createElement('tr');
        tr.className = 'proto-row' + (inGroup ? ' in-group' : '');
        tr.dataset.label = item.name.toLowerCase();

        const jiraCell = item.jira
            ? `<a class="jira-link" href="${JIRA_BASE}${item.jira}" target="_blank" rel="noopener">
                   <i class="fa-brands fa-jira"></i>${item.jira}</a>`
            : `<span class="jira-empty">—</span>`;

        tr.innerHTML = `
            <td>
                <a class="proto-name" href="${item.href}" target="_blank">
                    <i class="fa-regular fa-file-lines file-icon"></i>
                    <span class="file-name">${item.name}</span>
                    <i class="fa-solid fa-arrow-up-right-from-square ext-icon"></i>
                </a>
            </td>
            <td>${jiraCell}</td>
            <td class="date-cell">${fmtDate(item.modified)}</td>`;
        return tr;
    }

    function renderDetail(product) {
        const detail = document.getElementById('detail');

        // Title: a plain heading, or a link to the dashboard for products that have one
        const titleHtml = product.dashboardHref
            ? `<a class="detail-title" href="${product.dashboardHref}" target="_blank">
                   ${product.label}
                   <i class="fa-solid fa-arrow-up-right-from-square"></i>
               </a>`
            : `<span class="detail-title">${product.label}</span>`;

        detail.innerHTML = `
            <a class="back-link" href="#"><i class="fa-solid fa-arrow-left"></i> All products</a>
            <div class="detail-head">
                <div class="product-dot" style="background:${product.color}">
                    <i class="fa-solid ${product.icon}"></i>
                </div>
                ${titleHtml}
            </div>
            ${product.dashboardHref ? `<p class="detail-dash-note">Opens the ${product.label} dashboard in a new tab.</p>` : ''}
            <div class="proto-table-wrap">
                <table class="proto-table">
                    <thead>
                        <tr>
                            <th>Prototype</th>
                            <th class="col-jira">Jira</th>
                            <th class="col-date">Last modified</th>
                        </tr>
                    </thead>
                    <tbody id="protoBody"></tbody>
                </table>
            </div>`;

        const body = detail.querySelector('#protoBody');
        product.items.forEach(item => {
            if (item.folder) {
                const groupTr = document.createElement('tr');
                groupTr.className = 'group-row';
                groupTr.dataset.folder = item.folder.toLowerCase();
                groupTr.innerHTML = `<td colspan="3"><i class="fa-solid fa-folder-open sf-icon"></i>${item.folder}</td>`;
                body.appendChild(groupTr);
                item.items.forEach(child => body.appendChild(protoRow(child, true)));
            } else {
                body.appendChild(protoRow(item, false));
            }
        });
    }

    // ── Routing ───────────────────────────────────────────────────────────────

    function route() {
        const slug    = location.hash.replace(/^#\/?/, '').trim();
        const product = slug ? bySlug(slug) : null;
        const landing = document.getElementById('landing');
        const detail  = document.getElementById('detail');

        if (product) {
            renderDetail(product);
            landing.hidden = true;
            detail.hidden  = false;
            document.title = `${product.label} — UX Mockups`;
        } else {
            landing.hidden = false;
            detail.hidden  = true;
            detail.innerHTML = '';
            document.title = 'UX Mockups — Vector Solutions';
        }

        // Re-apply any active search filter to the freshly rendered view
        applyFilter();
        window.scrollTo(0, 0);
    }

    // ── Search ──────────────────────────────────────────────────────────────

    function applyFilter() {
        const input  = document.getElementById('searchInput');
        const empty  = document.getElementById('emptyState');
        const emptyQ = document.getElementById('emptyQ');
        const q       = input.value.trim().toLowerCase();
        const onDetail = !document.getElementById('detail').hidden;

        let anyVisible = false;

        if (onDetail) {
            // Filter table rows; show a group header only if it has a visible child
            const rows = document.querySelectorAll('.proto-table .proto-row');
            rows.forEach(row => {
                const match = !q || row.dataset.label.includes(q);
                row.hidden = !match;
                if (match) anyVisible = true;
            });

            document.querySelectorAll('.proto-table .group-row').forEach(group => {
                let sib = group.nextElementSibling, hasVisible = false;
                while (sib && sib.classList.contains('proto-row')) {
                    if (!sib.hidden) hasVisible = true;
                    sib = sib.nextElementSibling;
                }
                group.hidden = !hasVisible;
            });
        } else {
            // Filter product cards by product name or any contained prototype name
            document.querySelectorAll('.product-card').forEach(card => {
                const match = !q || card.dataset.search.includes(q);
                card.hidden = !match;
                if (match) anyVisible = true;
            });
        }

        empty.classList.toggle('visible', !anyVisible && !!q);
        emptyQ.textContent = input.value.trim();
    }

    // ── Bootstrap ─────────────────────────────────────────────────────────────

    renderLanding();
    document.getElementById('searchInput').addEventListener('input', applyFilter);
    window.addEventListener('hashchange', route);
    route();
    </script>

</body>
</html>
