<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UX Mockups — Vector Solutions</title>

    <script type="module"
        src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.19.0/core.iife.js">
    </script>
    <script
        src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.5.0/styles.js">
    </script>
    <link rel="stylesheet"
        href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css"/>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Open Sans', sans-serif;
            background: var(--lumo-contrast-5pct, #f4f5f7);
            color: var(--lumo-body-text-color, #1a1a1a);
            min-height: 100vh;
        }

        /* ── Header ── */
        .site-header {
            background: #fff;
            border-bottom: 1px solid #e2e4e8;
            padding: 0 32px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand {
            font-size: 15px;
            font-weight: 700;
            color: #0066cc;
            display: flex;
            align-items: center;
            gap: 9px;
            text-decoration: none;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f4f5f7;
            border: 1px solid #d0d3d9;
            border-radius: 6px;
            padding: 5px 12px;
            width: 240px;
        }

        .search-box i { color: #9aa0ac; font-size: 12px; }

        .search-box input {
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 13px;
            color: #1a1a1a;
            outline: none;
            width: 100%;
        }

        .search-box input::placeholder { color: #9aa0ac; }

        /* ── Page ── */
        .page {
            max-width: 960px;
            margin: 0 auto;
            padding: 36px 24px 80px;
        }

        .page-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }

        .page-sub {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 28px;
        }

        /* ── Landing: product grid ── */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(224px, 1fr));
            gap: 14px;
        }

        .product-card {
            background: #fff;
            border: 1px solid #e2e4e8;
            border-radius: 10px;
            padding: 18px 18px 16px;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            transition: box-shadow 0.12s ease, transform 0.12s ease, border-color 0.12s ease;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .product-card:hover {
            border-color: #c4d4f0;
            box-shadow: 0 6px 18px rgba(20, 40, 80, 0.10);
            transform: translateY(-2px);
        }

        .product-card[hidden] { display: none; }

        .product-dot {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 15px;
            flex-shrink: 0;
        }

        .product-card .pc-label { font-size: 15px; font-weight: 700; color: #1a1a1a; }

        .product-card .pc-meta {
            font-size: 12px;
            color: #9aa0ac;
            display: flex;
            align-items: center;
            gap: 7px;
            margin-top: auto;
        }

        .product-card .pc-meta .dot-sep { width: 3px; height: 3px; border-radius: 50%; background: #c4c9d2; }

        .product-card .pc-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .product-card .pc-label .fa-arrow-up-right-from-square { font-size: 11px; color: #9aa0ac; }
        .product-card:hover .pc-label .fa-arrow-up-right-from-square { color: #0066cc; }

        /* ── Empty / no-results state ── */
        .empty-state {
            display: none;
            text-align: center;
            padding: 60px 0;
            color: #9aa0ac;
        }
        .empty-state.visible { display: block; }
        .empty-state i { font-size: 28px; margin-bottom: 12px; opacity: 0.5; display: block; }
        .empty-state p { font-size: 14px; }
    </style>
</head>
<body>

    <header class="site-header">
        <a class="brand" href="#">
            <i class="fa-solid fa-layer-group"></i>
            UX Mockups
        </a>
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search prototypes…" autocomplete="off">
        </div>
    </header>

    <div class="page">
        <!-- Landing: product list -->
        <section class="landing" id="landing">
            <h1 class="page-title">Prototypes by Product</h1>
            <p class="page-sub">Select a product to open its dashboard.</p>
            <div class="product-grid" id="grid"></div>
        </section>


        <div class="empty-state" id="emptyState">
            <i class="fa-solid fa-magnifying-glass"></i>
            <p>No results for "<span id="emptyQ"></span>"</p>
        </div>
    </div>

    <script>
    // Landing index — reads the curated catalog (products.json), the SAME source
    // the per-product dashboards build from, so each card's prototype count
    // matches its dashboard exactly. Every card opens that product's dashboard.
    const CATALOG_URL = 'products.json';
    let PRODUCTS = [];

    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    // "2026-06-23" -> "Jun 23, 2026" (parsed manually to avoid timezone shifts)
    function fmtDate(iso) {
        if (!iso) return '';
        const [y, m, d] = iso.split('-').map(Number);
        if (!y || !m || !d) return '';
        return `${MONTHS[m - 1]} ${d}, ${y}`;
    }

    // Flatten a product's items into leaf prototypes (skips folder groups).
    function flattenItems(items) {
        return (items || []).flatMap(it => it.items ? flattenItems(it.items) : [it]);
    }
    // Curated fallback: the hand-set `modified` field in products.json. Only used
    // when a product has no generated dashboard/meta.json to read a live date from.
    function latestModified(items) {
        return flattenItems(items).reduce((max, it) =>
            (it.modified && it.modified > max) ? it.modified : max, '');
    }

    // Live date: the newest real design change from a product's generated
    // dashboard/meta.json (git-derived, auto-updated on every push — the SAME
    // source the per-product dashboard uses). Returns a YYYY-MM-DD string or ''.
    function latestFromMeta(meta) {
        const arr = (meta && Array.isArray(meta.recentChanges)) ? meta.recentChanges : [];
        return arr.reduce((max, e) => {
            const d = (e && e.date) ? String(e.date).slice(0, 10) : '';
            return d > max ? d : max;
        }, '');
    }

    function renderLanding() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        PRODUCTS.forEach(product => {
            const leaves  = flattenItems(product.items);
            const count   = leaves.length;
            // Prefer the live git-derived date; fall back to the curated field.
            const latest  = product._latest || latestModified(product.items);
            const dashHref = `products/${product.folder}/dashboard/`;
            const haystack = (product.label + ' ' + leaves.map(l => l.name).join(' ')).toLowerCase();

            const card = document.createElement('button');
            card.className = 'product-card';
            card.dataset.search = haystack;
            // The whole card opens the product's dashboard in a new tab.
            card.addEventListener('click', () => window.open(dashHref, '_blank'));
            card.innerHTML = `
                <div class="product-dot" style="background:${product.color}">
                    <i class="fa-solid ${product.icon}"></i>
                </div>
                <div class="pc-label">
                    ${product.label}
                    <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </div>
                <div class="pc-meta">
                    <span>${count} prototype${count === 1 ? '' : 's'}</span>
                    ${latest ? `<span class="dot-sep"></span><span>Updated ${fmtDate(latest)}</span>` : ''}
                </div>`;
            grid.appendChild(card);
        });
    }

    function applyFilter() {
        const input  = document.getElementById('searchInput');
        const empty  = document.getElementById('emptyState');
        const emptyQ = document.getElementById('emptyQ');
        const q = input.value.trim().toLowerCase();

        let anyVisible = false;
        document.querySelectorAll('.product-card').forEach(card => {
            const match = !q || card.dataset.search.includes(q);
            card.hidden = !match;
            if (match) anyVisible = true;
        });

        empty.classList.toggle('visible', !anyVisible && !!q);
        emptyQ.textContent = input.value.trim();
    }

    // ── Bootstrap ──────────────────────────────────────────────────────────────
    document.getElementById('searchInput').addEventListener('input', applyFilter);
    fetch(CATALOG_URL, { cache: 'no-cache' })
        .then(r => { if (!r.ok) throw new Error('products.json ' + r.status); return r.json(); })
        .then(data => {
            PRODUCTS = Array.isArray(data.products) ? data.products : [];
            // Overlay each product's live git-derived date from its generated
            // dashboard/meta.json (auto-updated on push). Per-fetch failures fall
            // back to the curated `modified` field, so a product without a
            // dashboard still shows a date.
            return Promise.all(PRODUCTS.map(p =>
                fetch(`products/${p.folder}/dashboard/meta.json`, { cache: 'no-cache' })
                    .then(r => r.ok ? r.json() : null)
                    .then(meta => { p._latest = latestFromMeta(meta); })
                    .catch(() => { p._latest = ''; })
            ));
        })
        .then(() => {
            renderLanding();
            applyFilter();
        })
        .catch(err => {
            document.getElementById('grid').innerHTML =
                '<p style="color:#9aa0ac;font-size:13px;line-height:1.6;">Couldn\'t load products.json (' +
                err.message + '). If you opened this file directly (file://), run a local server from the ' +
                'repo root (e.g. <code>python3 -m http.server</code>) and open via http://localhost.</p>';
        });
    </script>

</body>
</html>
