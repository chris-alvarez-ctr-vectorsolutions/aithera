<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UX Mockups — Vector Solutions</title>

    <script type="module"
        src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.19.0/core.iife.js">
    </script>
    <script
        src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.5.0/styles.js">
    </script>
    <link rel="stylesheet"
        href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css"/>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Open Sans', sans-serif;
            background: var(--lumo-contrast-5pct, #f4f5f7);
            color: var(--lumo-body-text-color, #1a1a1a);
            min-height: 100vh;
        }

        /* ── Header ── */
        .site-header {
            background: var(--lumo-base-color, #fff);
            border-bottom: 1px solid var(--lumo-contrast-10pct, #e2e4e8);
            padding: 0 32px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .site-header__brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 700;
            color: var(--lumo-primary-color, #0066cc);
            text-decoration: none;
            white-space: nowrap;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-search {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--lumo-contrast-5pct, #f4f5f7);
            border: 1px solid var(--lumo-contrast-20pct, #c8cdd4);
            border-radius: 6px;
            padding: 6px 12px;
            width: 240px;
        }

        .header-search i { color: var(--lumo-secondary-text-color, #767676); font-size: 13px; }

        .header-search input {
            border: none;
            background: transparent;
            font-family: 'Open Sans', sans-serif;
            font-size: 13px;
            color: var(--lumo-body-text-color, #1a1a1a);
            outline: none;
            width: 100%;
        }

        .header-search input::placeholder { color: var(--lumo-secondary-text-color, #9aa0a8); }

        .cache-status {
            font-size: 11px;
            color: var(--lumo-secondary-text-color, #9aa0a8);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .refresh-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--lumo-secondary-text-color, #9aa0a8);
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 11px;
            transition: color 0.15s ease;
        }

        .refresh-btn:hover { color: var(--lumo-primary-color, #0066cc); }

        /* ── Page layout ── */
        .page-content {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 32px 80px;
        }

        .page-title   { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .page-subtitle { font-size: 14px; color: var(--lumo-secondary-text-color, #6b7280); margin-bottom: 40px; }

        /* ── Loading / error ── */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 80px 0;
            color: var(--lumo-secondary-text-color, #6b7280);
            font-size: 14px;
        }

        .loading-state vwc-spinner { --vwc-spinner-size: 32px; }

        .error-state {
            text-align: center;
            padding: 60px 0;
            color: var(--lumo-error-color, #e53e3e);
            font-size: 14px;
        }

        .error-state i { font-size: 28px; margin-bottom: 12px; opacity: 0.6; display: block; }
        .error-state a { color: var(--lumo-primary-color, #0066cc); }

        /* ── Product section ── */
        .product-section { margin-bottom: 48px; }
        .product-section[hidden] { display: none; }

        .product-section__header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .product-section__icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #fff;
            flex-shrink: 0;
        }

        .product-section__title { font-size: 16px; font-weight: 700; }
        .product-section__count { font-size: 12px; color: var(--lumo-secondary-text-color, #6b7280); font-weight: 400; margin-left: 4px; }

        /* ── Prototype cards ── */
        .prototype-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }

        .prototype-card {
            background: var(--lumo-base-color, #fff);
            border: 1px solid var(--lumo-contrast-10pct, #e2e4e8);
            border-radius: 8px;
            padding: 16px 18px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.1s ease;
        }

        .prototype-card:hover {
            border-color: var(--lumo-primary-color, #0066cc);
            box-shadow: 0 2px 10px rgba(0, 102, 204, 0.1);
            transform: translateY(-1px);
        }

        .prototype-card[hidden] { display: none; }

        .prototype-card__icon {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .prototype-card__body { flex: 1; min-width: 0; }
        .prototype-card__name { font-size: 13px; font-weight: 600; line-height: 1.3; margin-bottom: 3px; }
        .prototype-card__tag  { font-size: 11px; color: var(--lumo-secondary-text-color, #8b92a0); }
        .prototype-card__arrow {
            color: var(--lumo-contrast-30pct, #bbb);
            font-size: 11px;
            align-self: center;
            flex-shrink: 0;
            transition: color 0.15s ease;
        }
        .prototype-card:hover .prototype-card__arrow { color: var(--lumo-primary-color, #0066cc); }

        /* ── Empty state ── */
        .empty-state { display: none; text-align: center; padding: 60px 0; color: var(--lumo-secondary-text-color, #6b7280); }
        .empty-state i { font-size: 32px; margin-bottom: 12px; opacity: 0.4; display: block; }
        .empty-state p { font-size: 14px; }
        .empty-state.visible { display: block; }

        /* ── Product colors ── */
        .color-convergence { background: #6366f1; }
        .color-ehs         { background: #ef4444; }
        .color-ehs-prevent { background: #f97316; }
        .color-safelms     { background: #0ea5e9; }
        .color-evaluations { background: #10b981; }
        .color-scheduling  { background: #8b5cf6; }
        .color-keystone    { background: #ec4899; }
        .color-learning    { background: #14b8a6; }
        .color-design      { background: #64748b; }
        .color-default     { background: #94a3b8; }

        .bg-convergence { background: #eef2ff; color: #4338ca; }
        .bg-ehs         { background: #fef2f2; color: #b91c1c; }
        .bg-ehs-prevent { background: #fff7ed; color: #c2410c; }
        .bg-safelms     { background: #f0f9ff; color: #0369a1; }
        .bg-evaluations { background: #ecfdf5; color: #065f46; }
        .bg-scheduling  { background: #f5f3ff; color: #6d28d9; }
        .bg-keystone    { background: #fdf4ff; color: #86198f; }
        .bg-learning    { background: #f0fdfa; color: #0f766e; }
        .bg-design      { background: #f8fafc; color: #475569; }
        .bg-default     { background: #f1f5f9; color: #64748b; }
    </style>
</head>
<body>

    <header class="site-header">
        <a class="site-header__brand" href="#">
            <i class="fa-solid fa-layer-group"></i>
            UX Mockups
        </a>
        <div class="header-right">
            <div class="header-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search prototypes…" autocomplete="off">
            </div>
            <div class="cache-status" id="cacheStatus">
                <span id="cacheLabel"></span>
                <button class="refresh-btn" id="refreshBtn" title="Force refresh prototype list" aria-label="Refresh">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="page-content">
        <h1 class="page-title">Prototype Index</h1>
        <p class="page-subtitle">Click any prototype to open it. New files committed to <code>main</code> appear here automatically.</p>

        <div id="loadingState" class="loading-state">
            <vwc-spinner></vwc-spinner>
            <span>Loading prototypes…</span>
        </div>

        <div id="errorState" class="error-state" hidden>
            <i class="fa-solid fa-circle-exclamation"></i>
            <p id="errorMsg"></p>
        </div>

        <div id="productContainer"></div>

        <div class="empty-state" id="emptyState">
            <i class="fa-solid fa-magnifying-glass"></i>
            <p>No prototypes match "<span id="emptyQuery"></span>"</p>
        </div>
    </main>

    <script>
    (function () {
        // ── Config ─────────────────────────────────────────────────────────────

        const REPO      = 'VectorLearning/ux-mockups';
        const API_URL   = `https://api.github.com/repos/${REPO}/git/trees/main?recursive=1`;
        const CACHE_KEY = 'ux-mockups-tree-v1';
        const CACHE_TTL = 10 * 60 * 1000; // 10 minutes

        // Directories to skip (relative to repo root, no trailing slash)
        const EXCLUDE_DIRS = ['products/Demo', 'products/test'];

        // Preferred display order for known products; unknowns appended alphabetically
        const PRODUCT_ORDER = [
            'Convergence', 'EHS', 'EHS-Prevent',
            'SafeLMS', 'Evaluations', 'Scheduling',
            'Keystone-Tenants', 'LearningStudio', 'design-system', 'target-solutions',
        ];

        const PRODUCT_CONFIG = {
            'Convergence':      { label: 'Convergence',      icon: 'fa-arrows-merge',    color: 'convergence' },
            'EHS':              { label: 'EHS',               icon: 'fa-helmet-safety',   color: 'ehs'         },
            'EHS-Prevent':      { label: 'EHS Prevent',       icon: 'fa-shield-halved',   color: 'ehs-prevent' },
            'SafeLMS':          { label: 'SafeLMS',           icon: 'fa-graduation-cap',  color: 'safelms'     },
            'Evaluations':      { label: 'Evaluations',       icon: 'fa-clipboard-check', color: 'evaluations' },
            'Scheduling':       { label: 'Scheduling',        icon: 'fa-calendar-alt',    color: 'scheduling'  },
            'Keystone-Tenants': { label: 'Keystone Tenants',  icon: 'fa-building',        color: 'keystone'    },
            'LearningStudio':   { label: 'LearningStudio',    icon: 'fa-pen-ruler',       color: 'learning'    },
            'design-system':    { label: 'Design System',     icon: 'fa-swatchbook',      color: 'design'      },
            'target-solutions': { label: 'Target Solutions',  icon: 'fa-bullseye',        color: 'default'     },
        };

        // Keyword → icon rules for prototype cards (first match wins)
        const ICON_RULES = [
            [/mobile/,                      'fa-mobile-screen'],
            [/dashboard/,                   'fa-gauge'],
            [/report/,                      'fa-chart-bar'],
            [/home(page)?/,                 'fa-house'],
            [/nav|navigation|location/,     'fa-compass'],
            [/modal|dialog/,                'fa-window-restore'],
            [/form/,                        'fa-wpforms'],
            [/incident|investigation/,      'fa-triangle-exclamation'],
            [/rule|engine/,                 'fa-gears'],
            [/ai|search/,                   'fa-magnifying-glass-chart'],
            [/timeout|session/,             'fa-clock'],
            [/component|redesign/,          'fa-puzzle-piece'],
            [/path|learning/,               'fa-road'],
            [/record/,                      'fa-clipboard-list'],
            [/notification/,                'fa-bell'],
            [/content|portal/,              'fa-folder-open'],
            [/course/,                      'fa-book-open'],
            [/scenario/,                    'fa-diagram-project'],
            [/media/,                       'fa-photo-film'],
            [/event|calendar/,              'fa-calendar-days'],
            [/color|theme/,                 'fa-swatchbook'],
            [/qualification/,               'fa-square-check'],
            [/user/,                        'fa-users'],
            [/tenant/,                      'fa-building-user'],
            [/overview|index/,              'fa-table-list'],
            [/async/,                       'fa-arrows-rotate'],
        ];

        // ── Helpers ────────────────────────────────────────────────────────────

        function toTitle(str) {
            return str
                .replace(/\.html$/, '')
                .replace(/([a-z])([A-Z])/g, '$1 $2')   // camelCase → spaces
                .replace(/([a-zA-Z])(\d)/g, '$1 $2')   // letter+digit → spaces
                .replace(/\s+-\s+/g, ' — ')             // "foo - bar" → em dash
                .replace(/[-_]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim()
                .split(' ')
                .filter(Boolean)
                .map(w => w[0].toUpperCase() + w.slice(1))
                .join(' ');
        }

        function protoIcon(name, tag) {
            const hay = (name + ' ' + tag).toLowerCase();
            for (const [re, icon] of ICON_RULES) {
                if (re.test(hay)) return icon;
            }
            return 'fa-file-lines';
        }

        // Given a full file path like "products/Convergence/learning-paths/index.html",
        // return { product, name, tag, href }.
        function parsePath(filePath) {
            const parts   = filePath.split('/');
            const product = parts[1];
            const rest    = parts.slice(2);          // segments after product
            const last    = rest[rest.length - 1];
            let name, tag, href;

            if (last === 'index.html') {
                const dirs = rest.slice(0, -1);      // path segments before index.html
                if (dirs.length === 0) {
                    // products/{product}/index.html → product root overview
                    name = 'Overview';
                    tag  = '';
                } else {
                    // Use all directory names joined — most descriptive
                    name = dirs.map(toTitle).join(' — ');
                    tag  = dirs.length > 1 ? dirs.slice(0, -1).map(toTitle).join(' / ') : '';
                }
                href = `products/${product}/${dirs.join('/')}/`.replace(/\/\/$/, '/');
            } else {
                const dirs = rest.slice(0, -1);
                name = toTitle(last);
                tag  = dirs.map(toTitle).join(' / ');
                href = filePath;
            }

            return { product, name, tag, href };
        }

        // ── Rendering ──────────────────────────────────────────────────────────

        function renderProduct(productKey, paths) {
            const cfg = PRODUCT_CONFIG[productKey] || {
                label: toTitle(productKey),
                icon:  'fa-folder',
                color: 'default',
            };

            const protos = paths
                .map(parsePath)
                .sort((a, b) => a.name.localeCompare(b.name));

            const section = document.createElement('section');
            section.className = 'product-section';
            section.dataset.product = productKey.toLowerCase().replace(/-/g, ' ');

            section.innerHTML = `
                <div class="product-section__header">
                    <div class="product-section__icon color-${cfg.color}">
                        <i class="fa-solid ${cfg.icon}"></i>
                    </div>
                    <span class="product-section__title">
                        ${cfg.label}
                        <span class="product-section__count">(${protos.length})</span>
                    </span>
                </div>
                <div class="prototype-grid">
                    ${protos.map(p => `
                        <a class="prototype-card" href="${p.href}" target="_blank"
                           data-name="${p.name.toLowerCase()}"
                           data-tag="${p.tag.toLowerCase()}">
                            <div class="prototype-card__icon bg-${cfg.color}">
                                <i class="fa-solid ${protoIcon(p.name, p.tag)}"></i>
                            </div>
                            <div class="prototype-card__body">
                                <div class="prototype-card__name">${p.name}</div>
                                ${p.tag ? `<div class="prototype-card__tag">${p.tag}</div>` : ''}
                            </div>
                            <i class="fa-solid fa-arrow-up-right-from-square prototype-card__arrow"></i>
                        </a>`).join('')}
                </div>`;

            return section;
        }

        // ── Data fetching ──────────────────────────────────────────────────────

        async function getTree() {
            // Serve from cache if fresh
            try {
                const raw = localStorage.getItem(CACHE_KEY);
                if (raw) {
                    const { ts, data } = JSON.parse(raw);
                    if (Date.now() - ts < CACHE_TTL) return { data, ts, cached: true };
                }
            } catch (_) {}

            const res = await fetch(API_URL);
            if (!res.ok) {
                if (res.status === 403) throw new Error('GitHub API rate limit reached — try again in an hour, or open the repo while signed in.');
                throw new Error(`GitHub API returned ${res.status}. Make sure the repo is public and GitHub Pages is enabled.`);
            }
            const data = await res.json();
            if (data.message) throw new Error(`GitHub API: ${data.message}`);

            const ts = Date.now();
            try { localStorage.setItem(CACHE_KEY, JSON.stringify({ ts, data })); } catch (_) {}
            return { data, ts, cached: false };
        }

        // ── Search ─────────────────────────────────────────────────────────────

        function initSearch() {
            const input      = document.getElementById('searchInput');
            const emptyState = document.getElementById('emptyState');
            const emptyQuery = document.getElementById('emptyQuery');

            input.addEventListener('input', () => {
                const q = input.value.trim().toLowerCase();
                let anyVisible = false;

                document.querySelectorAll('.prototype-card').forEach(card => {
                    const match = !q
                        || card.dataset.name.includes(q)
                        || card.dataset.tag.includes(q)
                        || card.closest('.product-section').dataset.product.includes(q);
                    card.hidden = !match;
                    if (match) anyVisible = true;
                });

                document.querySelectorAll('.product-section').forEach(sec => {
                    const hasVisible = [...sec.querySelectorAll('.prototype-card')].some(c => !c.hidden);
                    sec.hidden = !hasVisible;
                });

                emptyState.classList.toggle('visible', !anyVisible && !!q);
                emptyQuery.textContent = input.value.trim();
            });
        }

        // ── Bootstrap ──────────────────────────────────────────────────────────

        async function init() {
            try {
                const { data, ts, cached } = await getTree();

                const htmlFiles = (data.tree || []).filter(f =>
                    f.type === 'blob' &&
                    f.path.startsWith('products/') &&
                    f.path.endsWith('.html') &&
                    !EXCLUDE_DIRS.some(ex => f.path === ex + '/index.html' || f.path.startsWith(ex + '/'))
                );

                // Group by top-level product directory
                const byProduct = {};
                for (const f of htmlFiles) {
                    const product = f.path.split('/')[1];
                    (byProduct[product] = byProduct[product] || []).push(f.path);
                }

                const ordered = [
                    ...PRODUCT_ORDER.filter(p => byProduct[p]),
                    ...Object.keys(byProduct).filter(p => !PRODUCT_ORDER.includes(p)).sort(),
                ];

                const container = document.getElementById('productContainer');
                for (const p of ordered) {
                    container.appendChild(renderProduct(p, byProduct[p]));
                }

                document.getElementById('loadingState').hidden = true;

                // Cache status label
                const ago = Math.round((Date.now() - ts) / 60000);
                document.getElementById('cacheLabel').textContent = cached
                    ? `Cached ${ago < 1 ? 'just now' : ago + 'm ago'}`
                    : 'Just synced';

                initSearch();

            } catch (err) {
                document.getElementById('loadingState').hidden = true;
                const errEl = document.getElementById('errorState');
                errEl.hidden = false;
                document.getElementById('errorMsg').innerHTML =
                    `${err.message} &nbsp;—&nbsp; <a href="#" id="retryLink">Retry</a>`;
                document.getElementById('retryLink')?.addEventListener('click', e => {
                    e.preventDefault();
                    localStorage.removeItem(CACHE_KEY);
                    location.reload();
                });
            }
        }

        document.getElementById('refreshBtn').addEventListener('click', () => {
            localStorage.removeItem(CACHE_KEY);
            location.reload();
        });

        init();
    })();
    </script>
</body>
</html>
