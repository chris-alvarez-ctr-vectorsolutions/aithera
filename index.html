    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Open Sans', sans-serif;
            background: var(--lumo-contrast-5pct, #f4f5f7);
            color: var(--lumo-body-text-color, #1a1a1a);
            min-height: 100vh;
        }

        /* ── Header ── */
        .site-header {
            background: #fff;
            border-bottom: 1px solid #e2e4e8;
            padding: 0 32px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand {
            font-size: 15px;
            font-weight: 700;
            color: #0066cc;
            display: flex;
            align-items: center;
            gap: 9px;
            text-decoration: none;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f4f5f7;
            border: 1px solid #d0d3d9;
            border-radius: 6px;
            padding: 5px 12px;
            width: 220px;
        }

        .search-box i { color: #9aa0ac; font-size: 12px; }

        .search-box input {
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 13px;
            color: #1a1a1a;
            outline: none;
            width: 100%;
        }

        .search-box input::placeholder { color: #9aa0ac; }

        /* ── Page ── */
        .page {
            max-width: 780px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        .page-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; }

        .page-sub {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 32px;
        }

        /* ── Product block ── */
        .product-wrap { margin-bottom: 10px; }
        .product-wrap[hidden] { display: none; }

        .product-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: #fff;
            border: 1px solid #e2e4e8;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
            transition: background 0.1s ease;
        }

        .product-header:hover { background: #f8f9ff; }

        .product-header.is-open {
            border-radius: 8px 8px 0 0;
            border-bottom-color: transparent;
        }

        .product-dot {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 12px;
            flex-shrink: 0;
        }

        .product-label { font-size: 14px; font-weight: 700; flex: 1; }

        .product-count {
            font-size: 12px;
            color: #9aa0ac;
            background: #f4f5f7;
            border-radius: 10px;
            padding: 2px 8px;
        }

        .product-chevron {
            color: #9aa0ac;
            font-size: 11px;
            transition: transform 0.2s ease;
        }

        .product-header.is-open .product-chevron { transform: rotate(180deg); }

        /* ── Items pane ── */
        .product-body {
            background: #fff;
            border: 1px solid #e2e4e8;
            border-top: none;
            border-radius: 0 0 8px 8px;
            overflow: hidden;
        }

        /* ── File row ── */
        .file-row {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 8px 16px 8px 44px;
            text-decoration: none;
            color: #1a1a1a;
            font-size: 13px;
            border-top: 1px solid #f0f1f3;
            transition: background 0.1s ease;
        }

        .file-row:first-child { border-top: none; }

        .file-row:hover { background: #f0f4ff; color: #0044aa; }

        .file-row .file-icon { color: #b0b8c4; font-size: 12px; flex-shrink: 0; }
        .file-row:hover .file-icon { color: #4d8fe0; }

        .file-row .file-name { flex: 1; }

        .file-row .ext-icon {
            color: #d0d3d9;
            font-size: 10px;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.1s ease;
        }

        .file-row:hover .ext-icon { opacity: 1; color: #0066cc; }

        .file-row[hidden] { display: none; }

        /* ── Sub-folder ── */
        .subfolder-wrap { }
        .subfolder-wrap[hidden] { display: none; }

        .subfolder-header {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 7px 16px 7px 28px;
            font-size: 11px;
            font-weight: 700;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            background: #fafbfc;
            border-top: 1px solid #f0f1f3;
            cursor: pointer;
            user-select: none;
            transition: background 0.1s ease;
        }

        .subfolder-header:hover { background: #f3f4f6; }

        .subfolder-header .sf-icon { color: #9aa0ac; font-size: 12px; }
        .subfolder-header .sf-chevron {
            margin-left: auto;
            color: #b0b8c4;
            font-size: 10px;
            transition: transform 0.2s ease;
        }
        .subfolder-header.is-open .sf-chevron { transform: rotate(180deg); }

        /* Files inside sub-folder get extra indent */
        .subfolder-body .file-row { padding-left: 60px; }

        /* ── Empty / no-results state ── */
        .empty-state {
            display: none;
            text-align: center;
            padding: 60px 0;
            color: #9aa0ac;
        }

        .empty-state i { font-size: 28px; margin-bottom: 12px; opacity: 0.5; display: block; }
        .empty-state p { font-size: 14px; }

    // ── Helpers ───────────────────────────────────────────────────────────────

    function countFiles(items) {
        return items.reduce((n, item) => {
            if (item.href)   return n + 1;
            if (item.items)  return n + countFiles(item.items);
            return n;
        }, 0);
    }

    // ── Rendering ─────────────────────────────────────────────────────────────

    function makeFileRow(item) {
        const a = document.createElement('a');
        a.className  = 'file-row';
        a.href       = item.href;
        a.target     = '_blank';
        a.dataset.label = item.name.toLowerCase();
        a.innerHTML  = `
            <i class="fa-regular fa-file-lines file-icon"></i>
            <span class="file-name">${item.name}</span>
            <i class="fa-solid fa-arrow-up-right-from-square ext-icon"></i>`;
        return a;
    }

    function makeSubfolder(item) {
        const wrap = document.createElement('div');
        wrap.className = 'subfolder-wrap';
        wrap.dataset.folder = item.folder.toLowerCase();

        const header = document.createElement('div');
        header.className = 'subfolder-header is-open';
        header.innerHTML = `
            <i class="fa-solid fa-folder-open sf-icon"></i>
            <span>${item.folder}</span>
            <i class="fa-solid fa-chevron-down sf-chevron"></i>`;

        const body = document.createElement('div');
        body.className = 'subfolder-body';
        item.items.forEach(child => body.appendChild(makeFileRow(child)));

        header.addEventListener('click', () => {
            const open = header.classList.toggle('is-open');
            header.querySelector('.sf-icon').className =
                `fa-solid ${open ? 'fa-folder-open' : 'fa-folder'} sf-icon`;
            body.hidden = !open;
        });

        wrap.append(header, body);
        return wrap;
    }

    function makeProduct(product) {
        const total = countFiles(product.items);

        const wrap = document.createElement('div');
        wrap.className = 'product-wrap';
        wrap.dataset.product = product.label.toLowerCase();

        const header = document.createElement('div');
        header.className = 'product-header is-open';
        header.innerHTML = `
            <div class="product-dot" style="background:${product.color}">
                <i class="fa-solid ${product.icon}"></i>
            </div>
            <span class="product-label">${product.label}</span>
            <span class="product-count">${total}</span>
            <i class="fa-solid fa-chevron-down product-chevron"></i>`;

        const body = document.createElement('div');
        body.className = 'product-body';

        product.items.forEach(item => {
            if (item.href)   body.appendChild(makeFileRow(item));
            if (item.folder) body.appendChild(makeSubfolder(item));
        });

        header.addEventListener('click', () => {
            const open = header.classList.toggle('is-open');
            body.hidden = !open;
        });

        wrap.append(header, body);
        return wrap;
    }

    // ── Search ────────────────────────────────────────────────────────────────

    function initSearch() {
        const input  = document.getElementById('searchInput');
        const empty  = document.getElementById('emptyState');
        const emptyQ = document.getElementById('emptyQ');

        input.addEventListener('input', () => {
            const q = input.value.trim().toLowerCase();
            let anyVisible = false;

            document.querySelectorAll('.product-wrap').forEach(productEl => {
                const productName = productEl.dataset.product;
                let productHasMatch = false;

                // Direct file rows
                productEl.querySelectorAll('.product-body > .file-row').forEach(row => {
                    const match = !q || row.dataset.label.includes(q) || productName.includes(q);
                    row.hidden = !match;
                    if (match) productHasMatch = true;
                });

                // Sub-folder wraps
                productEl.querySelectorAll('.subfolder-wrap').forEach(sfWrap => {
                    const sfName = sfWrap.dataset.folder;
                    let sfHasMatch = false;

                    sfWrap.querySelectorAll('.file-row').forEach(row => {
                        const match = !q || row.dataset.label.includes(q) || sfName.includes(q) || productName.includes(q);
                        row.hidden = !match;
                        if (match) sfHasMatch = true;
                    });

                    sfWrap.hidden = !!q && !sfHasMatch;
                    if (!sfWrap.hidden) productHasMatch = true;

                    // Force-open sub-folders when searching
                    if (q && sfHasMatch) {
                        const sfHeader = sfWrap.querySelector('.subfolder-header');
                        const sfBody   = sfWrap.querySelector('.subfolder-body');
                        sfHeader.classList.add('is-open');
                        sfHeader.querySelector('.sf-icon').className = 'fa-solid fa-folder-open sf-icon';
                        sfBody.hidden = false;
                    }
                });

                productEl.hidden = !!q && !productHasMatch;
                if (!productEl.hidden) anyVisible = true;

                // Force-open product when searching
                if (q && productHasMatch) {
                    const ph = productEl.querySelector('.product-header');
                    ph.classList.add('is-open');
                    productEl.querySelector('.product-body').hidden = false;
                }
            });

            empty.classList.toggle('visible', !anyVisible && !!q);
            emptyQ.textContent = input.value.trim();
        });
    }

    // ── Bootstrap ─────────────────────────────────────────────────────────────

    const tree = document.getElementById('tree');
    PRODUCTS.forEach(p => tree.appendChild(makeProduct(p)));
    initSearch();
