<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comment Activity Log · ux-mockups</title>
<style>
  :root {
    --amber: #f59e0b; --amber-dark: #d97706; --ink: #1f2937; --muted: #6b7280;
    --line: #e7e3d8; --bg: #fbf9f2; --card: #fffdf3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px;
  }
  header {
    background: #111827; color: #fff; padding: 18px 24px;
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .sub { color: #9ca3af; font-size: 13px; }
  header .count { margin-left: auto; color: #fcd34d; font-size: 13px; }

  .toolbar {
    display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
    padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--card);
    position: sticky; top: 0; z-index: 5;
  }
  .toolbar label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 3px; }
  .toolbar select, .toolbar input {
    font: inherit; padding: 6px 9px; border: 1px solid #e3dcc7; border-radius: 7px;
    background: #fffaeb; color: var(--ink); min-width: 140px;
  }
  .toolbar input:focus, .toolbar select:focus { outline: none; border-color: var(--amber); box-shadow: 0 0 0 3px rgba(245,158,11,.18); }
  .toolbar .grow { flex: 1; min-width: 200px; }
  button.refresh {
    align-self: flex-end; font: inherit; cursor: pointer; padding: 7px 14px; border-radius: 7px;
    border: 1px solid var(--amber-dark); background: var(--amber); color: #fff; font-weight: 600;
  }
  button.refresh:hover { background: var(--amber-dark); }

  .wrap { padding: 0 24px 40px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  thead th {
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    padding: 10px 12px; border-bottom: 2px solid var(--line); position: sticky; top: 64px; background: var(--bg);
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th .arrow { color: var(--amber-dark); font-size: 10px; }
  tbody td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tbody tr:hover { background: #fffaeb; }
  .when { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  .author { font-weight: 600; }
  .comment { max-width: 420px; }
  .reply-to { margin-top: 3px; font-size: 12px; color: var(--muted); font-style: italic; border-left: 2px solid var(--line); padding-left: 7px; }
  .page a { color: #2563eb; text-decoration: none; word-break: break-word; }
  .page a:hover { text-decoration: underline; }
  .pin { color: var(--muted); font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  .badge {
    display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
  }
  .badge.created     { background: #dbeafe; color: #1e40af; }
  .badge.edited      { background: #fef3c7; color: #92400e; }
  .badge.reply       { background: #ede9fe; color: #5b21b6; }
  .badge.done        { background: #d1fae5; color: #065f46; }
  .badge.reopened    { background: #fef9c3; color: #854d0e; }
  .badge.deleted     { background: #fee2e2; color: #991b1b; }
  .badge.restored    { background: #d1fae5; color: #065f46; }
  .badge.re-anchored { background: #e0e7ff; color: #3730a3; }
  .badge.undo        { background: #f3f4f6; color: #374151; }
  .badge.settings    { background: #f3f4f6; color: #374151; }

  .state { padding: 60px 24px; text-align: center; color: var(--muted); }
  .state.error { color: #991b1b; }
  .state code { background: #fff; border: 1px solid var(--line); padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>🗒️ Comment Activity Log</h1>
  <span class="sub">ux-mockups feedback — append-only history</span>
  <span class="count" id="count"></span>
</header>

<div class="toolbar">
  <label>Action
    <select id="f-action"><option value="">All actions</option></select>
  </label>
  <label>Product
    <select id="f-product"><option value="">All products</option></select>
  </label>
  <label class="grow">Search
    <input id="f-search" type="search" placeholder="Filter by author, comment, or page…">
  </label>
  <button class="refresh" id="refresh">Refresh</button>
</div>

<div class="wrap">
  <div id="status" class="state">Loading activity…</div>
  <table id="table" hidden>
    <thead>
      <tr>
        <th data-sort="ts">When <span class="arrow"></span></th>
        <th data-sort="action">Action <span class="arrow"></span></th>
        <th data-sort="author">Author <span class="arrow"></span></th>
        <th data-sort="product">Product <span class="arrow"></span></th>
        <th data-sort="url">Page <span class="arrow"></span></th>
        <th data-sort="comment">Comment <span class="arrow"></span></th>
        <th data-sort="pinId">Pin <span class="arrow"></span></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script>
  // Same Worker the feedback widget talks to.
  const WORKER_URL = 'https://ux-mockups-feedback.vectorsolutions-ux.workers.dev';

  // The mockups site root (…/ux-mockups), derived from this page's own location
  // (…/ux-mockups/commentwidget/log.html). Used to read the canonical mock list
  // and to match a dropdown choice against an event's stored page URL.
  const PAGES_BASE = location.href.replace(/\/commentwidget\/log\.html.*$/, '');
  const INDEX_URL = PAGES_BASE + '/index.html';

  // Every action the Worker can log, with friendly labels. Listed up front so
  // the filter is meaningful even before any of these have occurred yet.
  const ACTIONS = [
    ['created',     'Created'],
    ['edited',      'Edited'],
    ['reply',       'Reply'],
    ['done',        'Resolved (done)'],
    ['reopened',    'Reopened'],
    ['deleted',     'Deleted'],
    ['restored',    'Restored'],
    ['re-anchored', 'Re-anchored'],
    ['undo',        'Undo'],
    ['settings',    'Settings change'],
  ];

  const els = {
    status: document.getElementById('status'),
    table: document.getElementById('table'),
    rows: document.getElementById('rows'),
    count: document.getElementById('count'),
    fAction: document.getElementById('f-action'),
    fProduct: document.getElementById('f-product'),
    fSearch: document.getElementById('f-search'),
    refresh: document.getElementById('refresh'),
  };

  let allEvents = [];
  let productOptions = [];   // [{ value:'u:<url>', label, group }] built from the mock registry
  let sortKey = 'ts';
  let sortDir = -1; // newest first

  // Derive a short "Product / page" label from the canonical page URL.
  function pageLabel(url) {
    const m = (url || '').match(/\/products\/(.+?)\/?$/i);
    return m ? decodeURIComponent(m[1]) : (url || '—');
  }

  function fmtWhen(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return iso || '';
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const opts = sameDay
      ? { hour: '2-digit', minute: '2-digit' }
      : { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
    return d.toLocaleString(undefined, opts);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  // Action filter is a fixed, known set — built once, independent of the data.
  function buildActionFilter() {
    els.fAction.innerHTML = '<option value="">All actions</option>' +
      ACTIONS.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
  }

  // Read the canonical mock list (the PRODUCTS array in index.html) so the
  // Product dropdown lists every mock — not just ones that already have
  // comments — and stays in sync as mocks are added or removed there. The array
  // is { name, href } / { folder, items:[…] } entries; we just need each name +
  // href pair, which a flat regex captures across the whole (nested) array.
  async function loadProducts() {
    try {
      const html = await (await fetch(INDEX_URL)).text();
      const re = /name:\s*'((?:[^'\\]|\\.)*)'\s*,\s*href:\s*'((?:[^'\\]|\\.)*)'/g;
      const opts = [];
      let m;
      while ((m = re.exec(html))) {
        const name = m[1].replace(/\\(['\\])/g, '$1');
        const href = m[2].replace(/\\(['\\])/g, '$1');
        if (!/^products\//.test(href)) continue;
        const segs = href.replace(/^products\//, '').replace(/\/$/, '').split('/');
        const group = decodeURIComponent(segs[0] || '');           // top-level product
        const mid = segs.slice(1, -1).map(decodeURIComponent).join(' / '); // intermediate folders
        const label = mid ? `${mid} / ${name}` : name;
        // encodeURI so spaces etc. match the %-encoded URL the widget stores.
        const url = PAGES_BASE + '/' + encodeURI(href);
        opts.push({ value: 'u:' + url, label, group });
      }
      productOptions = opts;
    } catch (_) {
      productOptions = []; // viewer still works; falls back to log-derived urls below
    }
  }

  // Build the grouped Product dropdown: an <optgroup> per product, an
  // "— All <Product> —" entry to filter a whole product, then each mock. Any
  // page that has events but isn't in the registry is added under its product
  // (or "Other") so nothing is hidden.
  function buildProductFilter(events) {
    const groups = new Map();
    for (const o of productOptions) {
      if (!groups.has(o.group)) groups.set(o.group, []);
      groups.get(o.group).push({ value: o.value, label: o.label });
    }
    const known = new Set(productOptions.map(o => o.value.slice(2)));
    for (const e of events) {
      if (!e.url || known.has(e.url)) continue;
      known.add(e.url);
      const prod = e.product || 'Other';
      if (!groups.has(prod)) groups.set(prod, []);
      groups.get(prod).push({ value: 'u:' + e.url, label: pageLabel(e.url) + ' (from log)' });
    }
    let html = '<option value="">All products</option>';
    for (const product of [...groups.keys()].sort((a, b) => a.localeCompare(b))) {
      html += `<optgroup label="${esc(product)}">`;
      html += `<option value="p:${esc(product)}">— All ${esc(product)} —</option>`;
      for (const o of groups.get(product).sort((a, b) => a.label.localeCompare(b.label))) {
        html += `<option value="${esc(o.value)}">${esc(o.label)}</option>`;
      }
      html += '</optgroup>';
    }
    const prev = els.fProduct.value;
    els.fProduct.innerHTML = html;
    if (prev && [...els.fProduct.options].some(o => o.value === prev)) els.fProduct.value = prev;
  }

  function applyFilters() {
    const a = els.fAction.value;
    const p = els.fProduct.value;   // ''=all, 'u:<url>'=one mock, 'p:<product>'=whole product
    const q = els.fSearch.value.trim().toLowerCase();
    return allEvents.filter(e => {
      if (a && e.action !== a) return false;
      if (p.startsWith('u:') && e.url !== p.slice(2)) return false;
      if (p.startsWith('p:') && (e.product || '') !== p.slice(2)) return false;
      if (q) {
        const hay = `${e.author} ${e.comment} ${e.product} ${e.url} ${e.pinId} ${e.action}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
  }

  function sortEvents(events) {
    return [...events].sort((x, y) => {
      const a = (x[sortKey] ?? '').toString().toLowerCase();
      const b = (y[sortKey] ?? '').toString().toLowerCase();
      if (a < b) return -1 * sortDir;
      if (a > b) return 1 * sortDir;
      return 0;
    });
  }

  function render() {
    const events = sortEvents(applyFilters());
    els.count.textContent = `${events.length} event${events.length === 1 ? '' : 's'}` +
      (events.length !== allEvents.length ? ` (of ${allEvents.length})` : '');

    // sort arrows
    document.querySelectorAll('thead th').forEach(th => {
      const arrow = th.querySelector('.arrow');
      arrow.textContent = th.dataset.sort === sortKey ? (sortDir === 1 ? '▲' : '▼') : '';
    });

    if (!events.length) {
      els.table.hidden = true;
      els.status.hidden = false;
      els.status.className = 'state';
      els.status.textContent = allEvents.length ? 'No events match these filters.' : 'No activity recorded yet.';
      return;
    }

    els.status.hidden = true;
    els.table.hidden = false;
    els.rows.innerHTML = events.map(e => `
      <tr>
        <td class="when" title="${esc(e.ts)}">${esc(fmtWhen(e.ts))}</td>
        <td><span class="badge ${esc(e.action)}">${esc(e.action)}</span></td>
        <td class="author">${esc(e.author)}</td>
        <td>${esc(e.product || '—')}</td>
        <td class="page">${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(pageLabel(e.url))}</a>` : '—'}</td>
        <td class="comment">${esc(e.comment || '')}${e.action === 'reply' && e.parent ? `<div class="reply-to">↳ in reply to: “${esc(e.parent)}”</div>` : ''}</td>
        <td class="pin">${esc(e.pinId || '')}</td>
      </tr>`).join('');
  }

  // Fetch the activity events (the log itself).
  async function loadEvents() {
    const res = await fetch(`${WORKER_URL}/log?limit=2000`);
    if (!res.ok) throw new Error(`Server returned ${res.status}`);
    const data = await res.json();
    allEvents = Array.isArray(data.events) ? data.events : [];
  }

  // Reload everything: events + the mock registry, then rebuild the product
  // dropdown (so newly-added mocks and any new pages with activity show up).
  async function load() {
    els.status.hidden = false;
    els.table.hidden = true;
    els.status.className = 'state';
    els.status.textContent = 'Loading activity…';
    try {
      await Promise.all([loadEvents(), loadProducts()]);
      buildProductFilter(allEvents);
      render();
    } catch (err) {
      els.table.hidden = true;
      els.status.hidden = false;
      els.status.className = 'state error';
      els.status.innerHTML =
        `Couldn't load the log: ${esc(err.message)}.<br><br>` +
        `If you opened this file directly, the browser blocks the request (CORS). ` +
        `View it on the live site instead: <code>https://vectorlearning.github.io/ux-mockups/commentwidget/log.html</code>, ` +
        `or run a local server on port 8000.`;
    }
  }

  // Wire controls
  buildActionFilter();
  els.fAction.addEventListener('change', render);
  els.fProduct.addEventListener('change', render);
  els.fSearch.addEventListener('input', render);
  els.refresh.addEventListener('click', load);
  document.querySelectorAll('thead th').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.sort;
      if (sortKey === key) sortDir *= -1;
      else { sortKey = key; sortDir = key === 'ts' ? -1 : 1; }
      render();
    });
  });

  load();
</script>
</body>
</html>
