# Cloudflare Worker config for the ux-mockups feedback widget.
#
# Setup steps:
#   1. Install wrangler:           npm install -g wrangler
#   2. Authenticate:               wrangler login
#   3. Create the KV namespace:    wrangler kv:namespace create PINS_KV
#      → paste the returned `id` value into [[kv_namespaces]] below.
#   4. Set secrets (do NOT commit these):
#      wrangler secret put CONFLUENCE_TOKEN
#      wrangler secret put CONFLUENCE_EMAIL
#   5. Deploy:                     wrangler deploy

name = "ux-mockups-feedback"
main = "index.js"
compatibility_date = "2025-05-01"

# --- KV namespace -------------------------------------------------------------
# Replace `id` with the value returned by `wrangler kv:namespace create PINS_KV`.
[[kv_namespaces]]
binding = "PINS_KV"
id = "8d8bb696cc8242bf85fd708f210d13bf"

# --- Non-secret env vars ------------------------------------------------------
# These can live in source. Secrets (token, email) are set via `wrangler secret put`.
[vars]
# Confluence Cloud domain (no protocol, no trailing slash).
CONFLUENCE_DOMAIN = "lmsportal.atlassian.net"

# Confluence page ID where logs are appended.
# Source page: https://lmsportal.atlassian.net/wiki/spaces/PMC/pages/28919529490/Designer+Workflow+Claude+Code+VS+Code
CONFLUENCE_PAGE_ID = "28919529490"

# Comma-separated list of origins allowed to call this Worker.
# Add your GitHub Pages domain plus any local dev origins.
ALLOWED_ORIGIN = "https://vectorlearning.github.io,http://localhost:8000,http://127.0.0.1:8000"

# --- Secrets (set via `wrangler secret put`, do not list here) ----------------
# CONFLUENCE_TOKEN  — Atlassian API token from id.atlassian.com/manage-profile/security/api-tokens
# CONFLUENCE_EMAIL  — Email address associated with that API token
