         The path is depth-relative, like the Design Toolbox include. Every mock lives

<!-- ── Design Toolbox: Flow Map scaffold ──────────────────────────────────────
     Every new mock ships with THREE things: the version loader (the feature
     folder's index.html + versions.json), the comment widget, and this flow map.
     The flow map is the 🗺 button in the bottom toolbox dock; it shows your
     screens as nodes with live thumbnails and per-step dev notes.

     It needs a tiny host contract, all defined below:
       1) applyFlowState(id) — put the page into the screen for a node's `state`
       2) #fm=<state> hash boot — so thumbnails / deep links land on that screen
       3) window.TOOLBOX_CONFIG.flowMap — the node + edge config

     The starter map has ONE entry node. As you build screens, add a `case` to
     applyFlowState AND a matching node (+ edge) below — and rename `title`.
     Full docs: designtoolbox/README.md ("Flow Map"). -->
<script>
  // 1) State driver — put the page into the screen for node `id`.
  //    Add one `case` per screen. A single-screen mock's entry case can stay a
  //    no-op (the page already shows that screen).
  function applyFlowState(id, opts) {
    opts = opts || {};
    switch (id) {
      case 'screen1':
        /* TODO: set the page to Screen 1 (show a view, open a dialog, etc.).
           Left blank because a fresh canvas already shows its one screen. */
        break;
      default:
        break;                       // unknown state → the entry screen
    }
    if (!opts.instant) window.scrollTo(0, 0);
  }
  window.applyFlowState = applyFlowState;

  // 2) Hash boot — honor #fm=<state> on load and on change.
  function bootFromHash() {
    var m = (location.hash || '').match(/fm=([\w-]+)/);
    if (m) { try { applyFlowState(decodeURIComponent(m[1]), { instant: true }); } catch (e) {} }
  }
  bootFromHash();
  window.addEventListener('hashchange', bootFromHash);

  // 3) Flow-map config — add one node per screen, wire them with edges.
  window.TOOLBOX_CONFIG = {
    flowMap: {
      title: 'Flow Map',             // rename to "<Feature> — Flow Map"
      applyState: 'applyFlowState',
      canvas: { w: 1240, h: 440 },
      flows: [
        { id: 'main', name: 'Main Flow', pill: 'A', color: '#c9b8f0',
          lane: { x: 20, y: 20, w: 1200, h: 400 }, labelXY: { x: 40, y: 40 } }
      ],
      nodes: [
        { id: 'screen1', flow: 'main', entry: true, x: 60, y: 170,
          step: 'Entry', name: 'Screen 1', state: 'screen1',
          desc: 'The starting screen. Rename this and add more nodes as you build.' }
      ],
      edges: [
        // ['screen1', 'screen2'],
      ]
    }
  };
</script>
