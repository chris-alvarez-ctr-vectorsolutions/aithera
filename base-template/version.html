<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script
    type="module"
    src="https://cdn.vsp-prod.com/web-components/@vector-web-components/core/v1.19.0/core.iife.js">
    </script>

    <!-- Vector Web Components JavaScript -->
    <!-- Important! This should always be imported as script -->
    <script
    src="https://cdn.vsp-prod.com/web-components/@vector-web-components/themes/v1.5.0/styles.js">
    </script>

    <!-- Our Standard font face - Open Sans -->
    <link
    rel="stylesheet"
    href="https://cdn.vsp-prod.com/web-components/@vector-web-components/assets/v1.0.0/fonts/open-sans/v43/open-sans.css"
    />

    <!-- Font Awesome 6 PRO Icons (Default Icon Library) — self-hosted at the repo root.

         Self-hosted rather than a Kit or the Pro CDN because both of those are
         domain-locked, and a domain lock breaks `file://` — designers must be able
         to double-click an HTML file and still see icons.

         The path is depth-relative, like the Design Toolbox include. Every mock lives
         at products/<Product>/<feature>/verN/index.html — four levels below the repo
         root — so `../../../../` is correct for any mock scaffolded from this template.
         (That makes the link dead in this template file itself, which sits one level
         down. That is expected; it resolves once copied into verN/.)

         Pro unlocks fa-light, fa-thin, fa-duotone and fa-sharp on top of fa-solid /
         fa-regular / fa-brands. Pro 6 is a superset of Free 6, so anything that worked
         on the old CDN link still works. -->
    <link
    rel="stylesheet"
    href="../../../../assets/fontawesome/css/all.min.css"
    />
</head>
<body>

<!-- Design Toolbox: the pin-and-comment review widget + the flow map.
     Every mock ships with this so reviewers can drop comments on it without any
     extra setup (see designtoolbox/FEEDBACK-WIDGET.md and designtoolbox/README.md).
     The flow map only appears once the mock defines a flow config, so this one line
     is safe on a blank canvas.

     Depth-relative, like the Font Awesome link above: mocks live at
     products/<Product>/<feature>/verN/index.html, four levels below the repo root.
     (Dead in this template file itself, which sits one level down. Expected.)

     Review tooling only - NOT part of the product. Strip this script before
     production, and set window.TOOLBOX = { comments: false } in dev_handoff builds. -->
<script src="../../../../designtoolbox/toolbox.js"></script>
</body>
</html>
