# Cloudflare Worker config for the ux-mockups feedback widget.
#
# Setup steps:
#   1. Install wrangler:           npm install -g wrangler
#   2. Authenticate:               wrangler login
#   3. Create the KV namespace:    wrangler kv:namespace create PINS_KV
#      → paste the returned `id` value into [[kv_namespaces]] below.
#   4. Deploy:                     wrangler deploy

name = "ux-mockups-feedback"
main = "index.js"
compatibility_date = "2025-05-01"

# --- KV namespace -------------------------------------------------------------
# Replace `id` with the value returned by `wrangler kv:namespace create PINS_KV`.
[[kv_namespaces]]
binding = "PINS_KV"
id = "8d8bb696cc8242bf85fd708f210d13bf"

# --- Non-secret env vars ------------------------------------------------------
[vars]
# Comma-separated list of origins allowed to call this Worker.
# Add your GitHub Pages domain plus any local dev origins.
ALLOWED_ORIGIN = "https://vectorlearning.github.io,http://localhost:8000,http://127.0.0.1:8000"
