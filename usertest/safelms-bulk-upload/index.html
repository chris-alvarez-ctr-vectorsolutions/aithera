<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SafeLMS — Employees</title>
<!-- USABILITY-TEST COPY (Userbrain, 2026-10). Standalone: no loader, no Design Toolbox,
     not in versions.json / products.json. Delete the usertest/ folder after the sessions. -->
<meta name="robots" content="noindex, nofollow" />

<!-- Font Awesome 6 PRO (self-hosted at repo root; depth-relative). -->
<link rel="stylesheet" href="../../assets/fontawesome/css/all.min.css" />

<!-- IBM Plex — the design's typeface (Sans for UI, Mono for data values). -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>

<style>
  /* ==========================================================================
     Self-Serve Bulk User Import (SAFELMS-32693)
     Ported from the Claude Design source "Bulk User Import.dc.html".
     Vanilla HTML/CSS/JS — no frameworks (per project rules).
     ========================================================================== */

  :root {
    /* Brand / surface */
    --navy: #0E2A43; --navy-2: #16395B; --navy-3: #1B4266; --navy-track: #6B839C;
    --bg: #F2F5F9;
    /* Ink */
    --ink: #1B2B3E; --ink-2: #3D4F63; --muted: #5B6B7E; --muted-2: #8CA0B4;
    /* Lines */
    --line: #E1E7EE; --line-2: #EDF1F6; --line-3: #F3F6FA; --btn-border: #C6D3E1;
    /* Blue */
    --blue: #1257B8; --blue-2: #0C3F87; --blue-accent: #1F7AE0;
    /* Green */
    --green: #12B76A; --green-ink: #067647; --green-bg: #ECFDF3; --green-border: #A6E5C3;
    /* Amber */
    --amber: #DC8A12; --amber-ink: #8A5A0B; --amber-bg: #FFFAEB; --amber-border: #F2D69B;
    /* Red */
    --red: #D92D20; --red-ink: #B42318; --red-ink-2: #912018; --red-bg: #FEF3F2; --red-border: #F1C0BB;

    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); font-family: var(--sans); color: var(--ink); }
  a { color: var(--blue); text-decoration: none; }
  a:hover { color: var(--blue-2); text-decoration: underline; }
  input, select, button { font-family: var(--sans); }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes fadeup { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .fadeup { animation: fadeup .25s ease; }
  /* In-place re-renders (toggles, disclosures) skip the entrance animations so the
     rebuilt DOM doesn't flash; render() sets this when the screen hasn't changed. */
  .no-anim, .no-anim * { animation: none !important; }
  /* Stepper: completed steps are links back to that page */
  .step-body.is-link { cursor: pointer; border-radius: 6px; }
  .step-body.is-link:hover .step-label { color: var(--blue) !important; text-decoration: underline; }
  .step-body.is-link:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  /* The full-screen import overlay fades in ONCE when it opens; moving between its
     steps only animates the step content, so the Employees page never shows through. */
  .import-full.is-static { animation: none; }

  /* ---- Upload step: template + Help Center resource cards ---- */
  .tpl-card { display: flex; gap: 16px; align-items: flex-start; background: #F5F9FE; border: 1.5px solid #B9D1F0;
    border-radius: 12px; padding: 18px 20px; margin-bottom: 12px; }
  .tpl-card .tpl-ico { flex: 0 0 44px; width: 44px; height: 44px; border-radius: 10px; background: #E1EBF9; color: var(--blue);
    display: flex; align-items: center; justify-content: center; font-size: 20px; }
  @media (max-width: 720px) { .tpl-card { flex-wrap: wrap; } }
  .intro-res { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .intro-res-card { display: flex; gap: 12px; align-items: flex-start; background: #fff; border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 16px; }
  .intro-res-card .ico { flex: 0 0 34px; width: 34px; height: 34px; border-radius: 9px; background: #E1EBF9;
    color: var(--blue); display: flex; align-items: center; justify-content: center; font-size: 15px; }
  @media (max-width: 820px) { .intro-res { grid-template-columns: 1fr; } }

  /* ---- Import settings: before -> after totals live in a side panel, the same
         290px sticky card as Review's Change summary (2026-09-25). ---- */
  /* Each total is its own tinted tile so the metrics read as separate blocks. */
  .set-tot { background: #F5F8FB; border: 1px solid #E1E7EE; border-radius: 8px; padding: 10px 12px; }
  .set-tot .kpi-row .v { display: inline-flex; align-items: center; gap: 7px; }
  .set-tot .kpi-row .v i { font-size: 11px; color: #8CA0B4; }
  .set-tot-note { font-size: 12px; color: #5B6B7E; margin-top: 2px; text-align: right; }
  .ba-add { color: #067647; font-weight: 600; }
  .ba-rem { color: #B42318; font-weight: 600; }
  /* Live description of the switch, directly under it — flips with the toggle. */
  .opt-effect { display: flex; gap: 10px; align-items: flex-start; border-radius: 9px; padding: 11px 14px;
    font-size: 13px; line-height: 1.55; margin: 0 0 12px; }
  .opt-effect i { margin-top: 3px; }
  .opt-effect.is-off { background: #F5F9FE; border: 1px solid #E1E7EE; color: #3D4F63; }
  .opt-effect.is-off i { color: #1257B8; }
  .opt-effect.is-on { background: #FEF3F2; border: 1px solid #F1C0BB; color: #7A271A; }
  .opt-effect.is-on i { color: #D92D20; }
  /* Switch-in-box: the whole On/Off box is the switch (bigger touch target). */
  .opt-switchbox { display: block; cursor: pointer; padding: 14px 16px; margin: 20px 0 16px;
    transition: border-color .15s, background .15s; }
  .opt-switchbox.is-off:hover { background: #EDF4FD; border-color: #B9CBE2; }
  .opt-switchbox.is-on:hover { background: #FDEBE9; border-color: #E8A69E; }
  .opt-switchbox:focus-visible { outline: 2px solid #1257B8; outline-offset: 2px; }
  .opt-switchbox .opt-title { color: #1B2B3E; }
  .osb-head { display: flex; align-items: center; gap: 12px; }
  .osb-body { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0 0 46px; }  /* lines up under the title */
  .osb-body ul { margin: 4px 0 0 18px; line-height: 1.6; }
  /* "Only users or only jobs?" -> Vector Care banner (pencil-banner style). */
  .care-banner { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 6px;
    border: 1px solid var(--line); border-left: 5px solid var(--blue); padding: 13px 16px; margin-top: 4px;
    box-shadow: 0 1px 3px rgba(16,24,40,.08); }
  .care-banner .cb-ico { flex: 0 0 34px; width: 34px; height: 34px; border-radius: 9px; background: #E1EBF9; color: var(--blue);
    display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .care-banner .cb-tx { flex: 1; min-width: 0; font-size: 13px; color: #3D4F63; line-height: 1.5; }
  .care-banner .cb-tx b { color: var(--ink); }
  .care-banner .btn { white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
  @media (max-width: 720px) { .care-banner { flex-wrap: wrap; } }
  .care-banner.is-sent { border-left-color: #12B76A; }
  .care-banner.is-sent .cb-ico { background: #ECFDF3; color: #067647; }
  .set-helper { font-size: 12.5px; color: #5B6B7E; line-height: 1.5; margin-top: 12px; }
  .side-help-h { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--muted-2); margin-bottom: 7px; }
  .side-help { display: flex; flex-direction: column; gap: 7px; font-size: 12.5px; }

  /* ---- Upload log ---- */
  .log-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 4px 0 16px; flex-wrap: wrap; }
  .log-title { font-size: 20px; font-weight: 700; }
  .log-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .log-card { background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(16,24,40,.10), 0 1px 2px rgba(16,24,40,.06); }
  .log-filters { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
  .log-filters .subtabs { margin: 0; }
  .log-count { margin-left: auto; font-size: 12.5px; color: var(--muted); }
  /* One line per upload (2026-09-29) — more columns instead of stacked 2nd lines.
     When · File · Rows · Uploaded by · Role · Method · Result · Added · Updated · Deactivated · Jobs ended · › */
  .log-scroll { overflow-x: auto; }
  .log-grid { display: grid; min-width: 1070px;
    grid-template-columns: 140px minmax(130px, 1.6fr) 36px minmax(100px, 1fr) minmax(90px, 1.1fr) 92px 100px 48px 58px 84px 74px 12px;
    gap: 10px; align-items: center; }
  .log-grid .lg-when { white-space: nowrap; color: var(--ink); }
  .log-grid .lg-1 { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log-grid .lg-num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .log-grid .lg-num.is-zero { color: #A9B6C4; }
  .log-grid .lg-span4 { grid-column: span 4; text-align: right; white-space: nowrap; font-size: 12.5px; }
  .log-grid .lg-muted { color: var(--muted); }
  .log-method { display: inline-flex; align-items: center; gap: 7px; color: #3D4F63; white-space: nowrap; }
  .log-method i { color: #8CA0B4; font-size: 11px; }
  .log-th { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--muted-2);
    padding: 10px 20px; border-bottom: 1px solid var(--line-2); }
  .log-row { padding: 12px 20px; border-bottom: 1px solid var(--line-3); cursor: pointer; font-size: 13px; }
  .log-row:hover { background: #FAFBFD; }
  .log-row .l1 { font-weight: 600; color: var(--ink); }
  .log-row .l2 { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .log-row .fname { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .log-row .chev { color: var(--muted-2); font-size: 11px; transition: transform .15s; }
  .log-row.is-open .chev { transform: rotate(90deg); }
  .log-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; border-radius: 6px;
    padding: 4px 9px; border: 1px solid; white-space: nowrap; }
  .log-pill i { font-size: 11px; }
  .lp-manual { color: #3D4F63; background: #F0F4F9; border-color: #DCE3EC; }
  .lp-auto { color: #5B3FB8; background: #F4F1FD; border-color: #DCD3F7; }
  .lp-ok { color: #067647; background: #ECFDF3; border-color: #A6E5C3; }
  .lp-blocked, .lp-failed { color: #B42318; background: #FEF3F2; border-color: #F1C0BB; }
  .lp-cancelled { color: #5B6B7E; background: #F3F6FA; border-color: #E1E7EE; }
  .log-detail { background: #F8FAFC; border-bottom: 1px solid var(--line-2); padding: 14px 20px 16px 182px;
    display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: var(--ink-2); }
  .log-detail .ld-k { font-weight: 600; color: var(--ink); }
  .log-detail ul { margin: 0 0 0 18px; line-height: 1.6; }
  .log-review { color: #1257B8; font-weight: 600; white-space: nowrap; }
  .log-review i { font-size: 10.5px; }
  .auto-banner { display: flex; gap: 12px; align-items: flex-start; background: #F4F1FD; border: 1px solid #DCD3F7;
    border-radius: 10px; padding: 12px 16px; margin-bottom: 18px; }
  .auto-banner .ab-ico { flex: 0 0 32px; width: 32px; height: 32px; border-radius: 8px; background: #fff; color: #5B3FB8;
    display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .auto-banner .ab-t { font-size: 14px; font-weight: 700; color: #3B2A7A; }
  .auto-banner .ab-s { font-size: 12.5px; color: #4A3D7A; margin-top: 2px; line-height: 1.5; }
  .ld-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .ld-fact, .ld-card { background: #fff; border: 1px solid #E1E7EE; border-radius: 10px; padding: 12px 14px; }
  .ld-fact .k { font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: #8CA0B4; margin-bottom: 6px; }
  .ld-fact .v { font-size: 13.5px; font-weight: 600; color: #1B2B3E; }
  .ld-fact .l2 { font-size: 12px; font-weight: 400; color: #5B6B7E; margin-top: 2px; }
  .ld-notes { margin: 0 0 0 18px; font-size: 13px; color: #3D4F63; line-height: 1.7; }
  @media (max-width: 900px) { .ld-facts { grid-template-columns: 1fr; } }
  .log-empty { padding: 28px 20px; text-align: center; font-size: 13px; color: var(--muted); }
  @media (max-width: 1000px) { .log-detail { padding-left: 20px; } }   /* narrow screens scroll the log sideways */

  /* ==========================================================================
     App shell — authentic VectorSolutions / SafeLMS product chrome.
     Matches the reference SafeLMS mocks (async-reports / reports): a compact
     white 160px sidebar with the VectorSolutions pinwheel logo + nav, a blue
     gradient topbar, and a gray content canvas. Only the chrome is SafeLMS;
     the bulk-import content keeps its own IBM Plex design language.
     ========================================================================== */
  .app { display: grid; grid-template-columns: 168px minmax(0, 1fr); grid-template-rows: 100vh;
    height: 100vh; overflow: hidden; }

  /* ---- Sidebar (white, hairline right border) ---- */
  .sidebar { background: #fff; border-right: 1px solid var(--line-2); padding: 14px 16px 12px;
    display: flex; flex-direction: column; min-height: 0; }
  .logo { display: flex; align-items: center; gap: 7px; padding: 2px; }
  .logo .wordmark { display: flex; flex-direction: column; line-height: 1; }
  .logo .wordmark .brand { font-weight: 700; font-size: 13px; letter-spacing: .1px; color: #374C61; }
  .logo .wordmark .brand sup { font-size: 7px; font-weight: 700; }
  .logo .wordmark .sub { font-size: 8px; margin-top: 3px; color: var(--muted); letter-spacing: .2px; }

  .user { display: flex; align-items: center; gap: 9px; margin: 18px 0 2px; padding: 0 2px; }
  .user .avatar { width: 28px; height: 28px; border-radius: 50%; background: #DCE7F2; color: var(--navy);
    font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex: 0 0 28px; }
  .user .name { font-size: 12px; line-height: 1.3; color: #364153; min-width: 0; }
  .user .name span { color: var(--muted); }
  .user .name b { display: block; font-weight: 600; color: var(--ink); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }

  .nav-scroll { flex: 1; min-height: 0; overflow-y: auto; margin: 4px -6px 0; padding: 0 6px; }
  .nav-group { margin-top: 16px; }
  .nav-group .glabel { font-size: 10px; font-weight: 700; letter-spacing: .8px; color: var(--muted-2);
    padding: 4px 6px; margin-bottom: 2px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 5px;
    font-size: 12px; color: #364153; cursor: pointer; }
  .nav-item:hover { background: var(--line-3); }
  .nav-item .ico { width: 16px; display: flex; align-items: center; justify-content: center;
    color: #4A5565; flex: 0 0 16px; font-size: 12.5px; }
  .nav-item .chev { margin-left: auto; color: var(--muted-2); font-size: 9px; }
  .nav-item.is-active { font-weight: 700; color: var(--ink); background: #EAF1FC; }
  .nav-item.is-active .ico { color: var(--blue); }

  .sidebar-footer { display: grid; place-items: center; padding-top: 10px; }

  /* ---- Main column ---- */
  /* min-height:0 lets .main clamp to the 100vh grid row instead of growing to its
     content height — without it, tall content overflows the overflow:hidden shell
     and .scroll never becomes scrollable. */
  .main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }

  /* Blue topbar */
  /* --cw = the width of the body column below (.content / .emp-content). The blue
     header and the tab bar use it as side padding, so "Employees" and the first tab
     start exactly where the body content starts (2026-09-29). */
  .main { --cw: 1180px; }
  .main.is-narrow { --cw: 1060px; }
  .topbar { height: 60px; flex: 0 0 60px; color: #fff; display: flex; align-items: center; gap: 14px;
    padding: 0 max(32px, calc((100% - var(--cw)) / 2 + 32px)); background:   /* min 32px = .content's own side padding */ linear-gradient(180deg, #1747E6 0%, #1447E6 50%, #1038C8 100%); }
  .topbar .t-title { font-weight: 700; font-size: 20px; letter-spacing: .2px; white-space: nowrap; }
  .topbar .t-sub { font-size: 12.5px; color: #E9F0FF; opacity: .95; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .topbar-site { margin-left: auto; flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px;
    background: #fff; border-radius: 7px; padding: 7px 12px; color: var(--ink); font-size: 12.5px;
    font-weight: 600; cursor: pointer; white-space: nowrap; }
  .topbar-site .lbl { color: var(--muted); font-weight: 500; }
  .topbar-site .caret { color: var(--muted-2); font-size: 10px; }

  .scroll { flex: 1; min-height: 0; overflow-y: auto; background: #F2F5F8; }   /* live screen canvas */
  .content { max-width: 1060px; margin: 0 auto; padding: 22px 32px 72px; }

  /* ---- Tabs ---- */
  .tabs { display: flex; gap: 2px; border-bottom: 2px solid var(--line); margin: 20px 0 24px; }
  .tab { padding: 9px 16px; font-size: 14px; font-weight: 500; color: var(--muted);
    border: none; background: none; border-bottom: 2px solid transparent; margin-bottom: -2px;
    cursor: pointer; display: flex; align-items: center; gap: 7px; }
  .tab.is-active { font-weight: 600; color: var(--blue); border-bottom-color: var(--blue); }
  .dot-red { width: 8px; height: 8px; border-radius: 50%; background: var(--red); display: inline-block; }

  /* ---- Stepper ---- */
  .stepper { display: flex; align-items: center; margin-bottom: 26px; }
  .step { display: flex; align-items: center; }
  .step-body { display: flex; align-items: center; gap: 8px; }
  .step-circle { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 12px; font-weight: 600; }
  .step-label { font-size: 13px; white-space: nowrap; }
  .step-conn { width: 44px; height: 1.5px; background: #D5DEE8; margin: 0 12px; }

  /* ---- Cards & generic ---- */
  .card { background: #fff; border: 1px solid var(--line); border-radius: 10px; }
  .divider { height: 1px; background: var(--line-2); }

  /* ---- Buttons ---- */
  .btn { border: none; font-size: 13.5px; font-weight: 600; padding: 9px 16px; border-radius: 7px; cursor: pointer; }
  .btn.sm { font-size: 13px; padding: 8px 14px; }
  .btn--primary { background: var(--blue); color: #fff; }
  .btn--primary:hover { background: var(--blue-2); }
  .btn--ghost { border: 1px solid var(--btn-border); background: #fff; color: var(--ink-2); }
  /* Secondary destructive button (red outline) */
  .btn--outline-red { border: 1px solid #D92D20; background: #fff; color: #B42318; }
  .btn--outline-red:hover { background: #FEF3F2; }
  .btn--ghost:hover { background: #F5F8FB; }
  .btn--outline-blue { border: 1px solid var(--btn-border); background: #fff; color: var(--blue); }
  .btn--outline-blue:hover { background: #F0F6FD; }
  .btn--danger { border: none; background: var(--red-ink); color: #fff; }
  .btn--danger:hover { background: var(--red-ink-2); }
  .btn--disabled { background: var(--btn-border); color: #fff; cursor: not-allowed; }

  /* ---- Upload ---- */
  .banner { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px;
    margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .dropzone { background: #fff; border: 1.5px dashed #B9C9DA; border-radius: 10px; padding: 36px 20px; text-align: center; }
  .dropzone-icon { width: 44px; height: 44px; border-radius: 10px; background: #EDF3FA; margin: 0 auto 10px;
    display: flex; align-items: center; justify-content: center; font-size: 19px; color: var(--blue); }
  .section-eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted-2); margin-bottom: 10px; }
  .file-row { background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 12px 16px;
    display: flex; align-items: center; gap: 14px; cursor: pointer; transition: border-color .12s, box-shadow .12s; }
  .file-row:hover { border-color: var(--blue-accent); box-shadow: 0 1px 4px rgba(15,42,67,.08); }
  .file-badge { width: 34px; height: 34px; border-radius: 7px; background: #F0F4F9; display: flex;
    align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--muted); }
  .mono { font-family: var(--mono); }

  /* ---- Map grid ---- */
  .map-grid { display: grid; grid-template-columns: minmax(140px, 1fr) minmax(130px, 1fr) 260px; }
  .map-head { font-size: 12px; font-weight: 600; color: var(--muted-2); text-transform: uppercase;
    letter-spacing: .6px; padding: 10px 20px; border-bottom: 1px solid var(--line-2); }
  .map-row { align-items: center; padding: 10px 20px; border-bottom: 1px solid var(--line-3); }
  /* Lock sits in the left gutter so column names stay aligned; the hint lines up under the name. */

  .fp-side .fp-grp { font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--muted-2); padding: 9px 8px 4px; }

  .fp-side .fp-item i { color: var(--muted-2); width: 15px; text-align: center; font-size: 13px; }
  .fp-side .fp-item.is-active { background: #E6EEFB; color: var(--blue-2); font-weight: 600; }
  .fp-side .fp-item.is-active i { color: var(--blue); }
  .fp-main { flex: 1; min-width: 0; overflow-y: auto; padding: 12px 14px; background: #fff; }
  .fp-proto { border: 1.5px dashed #C6D3E1; background: #F3F5F8; border-radius: 10px; padding: 10px 10px 8px; }
  .fp-proto-hd { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; margin: 2px 2px 9px; }
  .fp-proto-tag { font-size: 10px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; color: #8A5A0B;
    background: #FFF7E6; border: 1px solid #F2D69B; border-radius: 5px; padding: 2px 8px; white-space: nowrap; }
  .fp-proto-note { font-size: 11.5px; color: var(--muted); }
  .fp-file { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 8px; cursor: pointer;
    filter: grayscale(1); opacity: .78; transition: background .1s, opacity .1s, filter .1s; }
  .fp-file + .fp-file { border-top: 1px solid #E7ECF2; }
  .fp-file:hover { background: #EAF1FC; opacity: 1; filter: grayscale(0); }
  .fp-file .fp-ico { width: 30px; flex: 0 0 30px; text-align: center; font-size: 23px; color: #217346; }
  .fp-file .fp-nm { flex: 1; min-width: 0; }
  .fp-file .fp-nm .n { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fp-file .fp-nm .m { font-size: 11px; color: var(--muted-2); margin-top: 1px; }
  .fp-file .fp-sz { font-size: 11.5px; color: var(--muted-2); white-space: nowrap; }
  .fp-foot { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); background: #FAFBFD; }
  .fp-namefield { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); min-width: 0; }
  .fp-namefield input { flex: 1; min-width: 0; border: 1px solid var(--btn-border); border-radius: 7px; padding: 7px 10px; font-size: 12.5px; color: var(--ink); background: #fff; }

  /* ---- Settings placement: full-width tab bar under the blue topbar ---- */
  .settings-tabbar { flex: 0 0 auto; background: #fff; border-bottom: 1px solid var(--line);
    padding: 0 max(18px, calc((100% - var(--cw)) / 2 + 18px));   /* +32px column padding − 14px tab padding = label aligns */ display: flex; gap: 2px; overflow-x: auto; }
  /* Tabs still scroll sideways on narrow screens, but without a visible scroll bar. */
  .settings-tabbar { scrollbar-width: none; }
  .settings-tabbar::-webkit-scrollbar { display: none; }
  .stab { padding: 13px 14px; font-size: 13.5px; font-weight: 500; color: var(--muted);
    border: none; background: none; border-bottom: 2px solid transparent; margin-bottom: -1px;
    cursor: pointer; white-space: nowrap; }
  .stab:hover:not(.is-active) { color: var(--ink-2); }
  .stab.is-active { color: var(--ink); font-weight: 600; border-bottom-color: var(--blue); }

  /* ---- Manual import / Automated sync secondary control (segmented) ---- */
  .subtabs { display: inline-flex; background: #E9EEF4; border-radius: 9px; padding: 3px; gap: 2px; margin-bottom: 22px; }
  .subtab { border: none; background: none; font-size: 13px; font-weight: 600; color: var(--muted);
    padding: 7px 15px; border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .subtab.is-active { background: #fff; color: var(--blue); box-shadow: 0 1px 2px rgba(16,24,40,.16); }


  /* ---- Version B: automated sync stacked under manual import ---- */
  .stack-divider { height: 1px; background: var(--line); margin: 44px 0 0; }
  .stack-head { margin: 26px 0 20px; scroll-margin-top: 12px; }
  .stack-title { font-size: 17px; font-weight: 700; }
  .stack-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }

  /* ---- Prototype variant panel (mock-only affordance) ---- */
  /* Anchored bottom-LEFT, over the sidenav's empty lower region — never covers
     the content-area action buttons (Continue / Run import live on the right). */
  .variants { position: fixed; bottom: 14px; left: 14px; z-index: 900; width: 196px;
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 6px 20px rgba(0,0,0,.28); padding: 12px 14px; font-size: 12px; }
  .variants-title { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase;
    color: var(--muted-2); display: flex; align-items: center; justify-content: space-between; }
  .variants-title .collapse { cursor: pointer; color: var(--muted-2); font-size: 13px; }
  .variants-row { margin-top: 9px; }
  .variants-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted-2); margin-bottom: 5px; }
  .seg { display: flex; border: 1px solid var(--btn-border); border-radius: 7px; overflow: hidden; }
  .seg button { flex: 1; border: none; background: #fff; font-size: 11px; padding: 6px 4px; cursor: pointer; color: var(--muted); }
  .seg button.is-on { background: var(--blue); color: #fff; font-weight: 600; }
  .seg button + button { border-left: 1px solid var(--btn-border); }
  .variants-hint { font-size: 10.5px; color: var(--muted-2); margin-top: 10px; line-height: 1.5; }
  .variants-hint a { font-weight: 600; }
  /* Before → after preview: a stacked list of state buttons. */
  .ba-list { display: flex; flex-direction: column; gap: 5px; }
  .ba-list button { border: 1px solid var(--btn-border); background: #fff; border-radius: 6px; font-size: 11px;
    padding: 7px 9px; cursor: pointer; color: var(--ink-2); text-align: left; line-height: 1.2; }
  .ba-list button:hover { background: #F5F8FB; }
  .ba-list button.is-on { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 600; }
  .variants.is-collapsed .variants-body { display: none; }

  .spinner { width: 28px; height: 28px; border: 3px solid #D5E3F3; border-top-color: var(--blue);
    border-radius: 50%; margin: 0 auto 14px; animation: spin .8s linear infinite; }

  /* ---- Progressive disclosure — a summary row is always visible; the detail
         opens on demand. Used across the automated-sync views so first entry
         stays light without losing any explanation. State-backed (state.disc)
         so open/closed survives the full re-render. ---- */
  .disc { border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; }
  .disc-sum { display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer; }
  .disc-sum:hover { background: #FAFBFD; }
  .disc-ico { width: 30px; height: 30px; border-radius: 8px; background: #EEF2F7; color: #5B6B7E;
    display: flex; align-items: center; justify-content: center; font-size: 13px; flex: 0 0 30px; }
  .disc-tt { flex: 1; min-width: 0; }
  .disc-tt .dt { font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .disc-tt .ds { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .disc-chev { color: var(--muted-2); font-size: 12px; transition: transform .15s; flex: 0 0 auto; }
  .disc.is-open .disc-chev { transform: rotate(180deg); }
  .disc-body { border-top: 1px solid var(--line-3); }
  .disc-body-inner { padding: 13px 16px 15px; font-size: 12.5px; color: var(--ink-2); line-height: 1.6; }


  /* ---- V4 error help tooltip — a click-open popover on each review alert with
         a what-it-means line, an A→B before/after example, and a "usually…" hint.
         The alert is the positioning context; the popover overlays following
         content. ---- */
  .help-btn { border: 1px solid var(--btn-border); background: #fff; color: var(--blue); border-radius: 20px;
    font-size: 12px; font-weight: 600; padding: 4px 11px; cursor: pointer; display: inline-flex;
    align-items: center; gap: 6px; white-space: nowrap; flex: 0 0 auto; }
  .help-btn:hover { background: #F0F6FD; }
  .help-btn.is-open { background: var(--blue); color: #fff; border-color: var(--blue); }
  .help-pop { position: absolute; top: 50px; right: 16px; z-index: 60; width: 390px; max-width: calc(100% - 32px);
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 16px 42px rgba(16,24,40,.24); overflow: hidden; animation: fadeup .14s ease; }
  .help-pop-head { display: flex; justify-content: space-between; align-items: center; padding: 11px 14px;
    background: #F5F9FE; border-bottom: 1px solid var(--line-2); font-size: 12.5px; font-weight: 700; color: var(--ink); }
  .help-pop-head i { color: var(--blue); margin-right: 6px; }
  .help-x { border: none; background: none; color: var(--muted-2); font-size: 14px; cursor: pointer; padding: 2px 7px; border-radius: 6px; }
  .help-x:hover { background: #E9EEF4; color: var(--ink-2); }
  .help-pop-body { padding: 13px 15px; display: flex; flex-direction: column; gap: 12px; }
  .hp-means { font-size: 12.5px; color: var(--ink-2); line-height: 1.55; }
  .ab-mini { display: grid; grid-template-columns: 1fr 28px 1fr; align-items: stretch; }
  .ab-mini-card { border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 11px; }
  .ab-mini-card.ab-a { background: #FEF7F6; border-color: var(--red-border); }
  .ab-mini-card.ab-b { background: #F0FBF5; border-color: var(--green-border); }
  .ab-mini-l { font-size: 10px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; color: var(--muted-2); }
  .ab-mini-v { font-size: 12px; color: var(--ink); margin-top: 4px; word-break: break-word; line-height: 1.4; }
  .ab-a .ab-mini-v { color: var(--red-ink); }
  .ab-b .ab-mini-v { color: var(--green-ink); }
  .ab-mini-arrow { display: flex; align-items: center; justify-content: center; color: var(--muted-2); font-size: 13px; }
  .hp-usually { font-size: 12.5px; color: var(--ink); background: #FFFBEB; border: 1px solid var(--amber-border);
    border-radius: 8px; padding: 9px 11px; line-height: 1.5; }
  .hp-usually i { color: var(--amber); margin-right: 6px; }
  .hp-link { font-size: 12px; font-weight: 600; }

  /* ---- Deeper-page back link ---- */
  .sync-back { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600;
    color: var(--blue); margin-bottom: 16px; cursor: pointer; }
  .sync-back:hover { text-decoration: none; color: var(--blue-2); }

  /* ==========================================================================
     Employees tab — the new home for bulk user import. The landing reproduces
     the K-12 "Employees" screen (toolbar + filters + paginated list); the
     bulk-import flow is launched from a per-version ENTRY POINT and swaps into
     the same content area (with a "back to employees" link).
     ========================================================================== */
  .emp-content { max-width: 1180px; }
  .emp-toolbar { display: flex; align-items: center; gap: 10px; margin: 14px 0 10px; flex-wrap: wrap; }
  .emp-toolbar .spacer { flex: 1; }
  .emp-entry { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .btn--lg { font-size: 15px; padding: 12px 22px; border-radius: 8px; display: inline-flex; align-items: center; gap: 9px; }
  /* Toolbar buttons + search sampled from the live SafeLMS Employees screen (2026-09-29):
     primary = navy gradient; secondary = borderless tinted fill with blue text;
     search = borderless white pill, magnifier on the right. All 38px tall. */
  .tb-btn { height: 38px; border: none; border-radius: 6px; padding: 0 18px; font-size: 14px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 9px; white-space: nowrap; font-family: var(--sans); }
  .tb-primary { color: #fff; background: linear-gradient(100deg, #043782 0%, #0858CC 100%); box-shadow: 0 2px 6px rgba(4,55,130,.28); }
  .tb-primary:hover { background: linear-gradient(100deg, #032C6A 0%, #064BB0 100%); }
  .tb-secondary { color: #0747A6; background: #E8EDF2; }
  .tb-secondary:hover { background: #DDE5EE; }
  .tb-secondary i { color: #738DC6; }
  .emp-search { display: flex; align-items: center; gap: 9px; background: #fff; border: none; height: 38px;
    border-radius: 19px; padding: 0 16px 0 18px; min-width: 205px; }
  .emp-search input { border: none; outline: none; font-size: 14px; flex: 1; min-width: 0; color: var(--ink); background: transparent; }
  .emp-search input::placeholder { color: #5B799D; }
  .emp-search i { color: #8EA8C0; font-size: 15px; }
  .btn--export { display: inline-flex; align-items: center; gap: 8px; }

  .emp-card { background: #fff; border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 1px 3px rgba(16,24,40,.06); overflow: hidden; }
  .emp-filters { display: flex; gap: 14px; padding: 18px 22px; border-bottom: 1px solid var(--line-2); flex-wrap: wrap; }
  .emp-filter { display: flex; align-items: center; gap: 10px; border: 1px solid var(--btn-border);
    border-radius: 8px; padding: 9px 14px; font-size: 13px; background: #fff; cursor: pointer; }
  .emp-filter .fl-lbl { color: var(--muted); }
  .emp-filter .fl-val { font-weight: 600; color: var(--ink); }
  .emp-filter .caret { color: var(--muted-2); font-size: 10px; margin-left: 2px; }
  .emp-count-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px 8px; gap: 12px; }
  .emp-count { font-size: 12.5px; font-weight: 700; letter-spacing: .4px; color: var(--blue); text-transform: uppercase; }
  .pager { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--btn-border); border-radius: 24px; overflow: hidden; }
  .pager button { border: none; background: #fff; font-size: 12.5px; font-weight: 600; padding: 8px 14px; color: #005DBD; cursor: pointer; }
  .pager button:hover { background: #F5F8FB; }
  .pager .pg-cur { color: var(--ink); font-weight: 600; }
  .emp-row { display: flex; align-items: center; gap: 16px; padding: 13px 22px; border-top: 1px solid var(--line-3); }
  .emp-row:hover { background: #FAFBFD; }
  .emp-avatar { width: 40px; height: 40px; border-radius: 50%; background: #EDF1F6; color: #B0BDCC;
    display: flex; align-items: center; justify-content: center; font-size: 17px; flex: 0 0 40px; }
  .emp-id { flex: 1; min-width: 0; }
  .emp-id .en { font-size: 14px; font-weight: 600; color: var(--ink); }
  .emp-id .eu { font-size: 13px; color: var(--muted); margin-top: 2px; word-break: break-all; }
  .emp-group { display: flex; align-items: center; gap: 11px; width: 300px; flex: 0 0 300px; }
  .emp-group .gico { width: 34px; height: 34px; border-radius: 7px; background: #E6F0FE; color: #1B4C86;
    display: flex; align-items: center; justify-content: center; font-size: 14px; flex: 0 0 34px; }
  .emp-group .gt { font-size: 13px; min-width: 0; }
  .emp-group .gt b { font-weight: 600; display: block; }
  .emp-group .gt span { color: var(--muted); }
  .emp-status { display: inline-flex; align-items: center; font-size: 12.5px; font-weight: 600; color: var(--green-ink);
    background: #E2FAEE; color: #387555; border: none; border-radius: 6px; padding: 5px 12px; flex: 0 0 auto; }
  .emp-chev { color: var(--muted-2); font-size: 13px; flex: 0 0 auto; }
  @media (max-width: 860px) { .emp-group { display: none; } }

  /* Sample School District seal (sidebar footer, matches the reference screen) */
  .seal { width: 62px; height: 62px; border-radius: 50%; border: 2px solid #1B4C86; color: #1B4C86;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    font-size: 6.5px; font-weight: 700; letter-spacing: .3px; line-height: 1.25; text-transform: uppercase; gap: 1px; }
  .seal i { font-size: 15px; color: #C0392B; }

  /* ---- Add Employee modal (single + optional bulk) ---- */
  .modal--wide { width: 760px; }
  .ae-mode { display: inline-flex; background: #E9EEF4; border-radius: 9px; padding: 3px; gap: 2px; margin-bottom: 22px; }
  .ae-mode button { border: none; background: none; font-size: 13px; font-weight: 600; color: var(--muted);
    padding: 9px 18px; border-radius: 7px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .ae-mode button.is-on { background: #fff; color: var(--blue); box-shadow: 0 1px 2px rgba(16,24,40,.16); }
  .ae-save { background: #57A773; color: #fff; border: none; font-size: 14px; font-weight: 600;
    padding: 10px 20px; border-radius: 8px; display: inline-flex; align-items: center; gap: 9px; cursor: pointer; }
  .ae-save:hover { background: #4A9464; }
  .ae-head-ico { width: 40px; height: 40px; border-radius: 10px; background: #EAF1FC; color: var(--blue);
    display: flex; align-items: center; justify-content: center; font-size: 17px; flex: 0 0 40px; }
  .ae-sect-title { font-size: 18px; font-weight: 700; margin: 0 0 6px; }
  .ae-underline { width: 44px; height: 3px; background: #C9D9F0; border-radius: 2px; margin-bottom: 18px; }
  .ae-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px 20px; }
  .ae-field { min-width: 0; }
  .ae-field.full { grid-column: 1 / -1; max-width: 50%; }
  .ae-field label { display: flex; justify-content: space-between; align-items: baseline; font-size: 13.5px; font-weight: 700; margin-bottom: 6px; }
  .ae-field label .req { color: var(--red); font-size: 12px; }
  .ae-field input { width: 100%; padding: 11px 13px; border: 1px solid var(--btn-border); border-radius: 8px; font-size: 13.5px; color: var(--ink); }
  .ae-field input::placeholder { color: var(--muted-2); }
  .ae-divider { height: 1px; background: var(--line); margin: 26px 0; }
  .ae-info { display: flex; align-items: center; gap: 13px; background: #fff; border: 1px solid var(--line);
    border-left: 4px solid var(--blue); box-shadow: 0 1px 3px rgba(16,24,40,.08); border-radius: 6px; padding: 14px 16px; margin-top: 14px; }
  .ae-info .i-ico { width: 30px; height: 30px; border-radius: 50%; background: var(--blue); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 14px; flex: 0 0 30px; }
  .ae-info .i-tx { font-size: 14px; font-weight: 600; color: var(--ink); }
  .ae-add-group { background: #EAF1FC; border: none; border-radius: 12px; padding: 24px; display: flex;
    align-items: center; justify-content: center; gap: 12px; color: var(--blue); font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; }
  .ae-add-group:hover { background: #E0EBFB; }
  .ae-req-tag { color: var(--red); font-size: 13.5px; font-weight: 700; }

  /* Bulk section inside the Add Employee modal (modal-entry versions) */
  .ae-bulk-drop { border: 1.5px dashed #B9C9DA; border-radius: 12px; padding: 34px 20px; text-align: center; background: #FAFCFF; cursor: pointer; }
  .ae-bulk-drop:hover { border-color: var(--blue-accent); background: #F5F9FE; }
  .ae-bulk-steps { display: flex; gap: 10px; margin: 18px 0 4px; }
  .ae-bulk-step { flex: 1; background: #F7FAFE; border: 1px solid #E1EAF4; border-radius: 9px; padding: 12px 14px; }
  .ae-bulk-step .n { width: 22px; height: 22px; border-radius: 50%; background: var(--blue); color: #fff;
    font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
  .ae-bulk-step .t { font-size: 12.5px; color: var(--ink-2); line-height: 1.45; }

  /* ---- Full-screen bulk import (ver1) --------------------------------------
     After the Bulk Upload button opens the file picker and a file is chosen,
     the import takes over the whole viewport — pushing the sidebar/topbar
     chrome aside — with its own slim header (file id + close) over the flow. */
  .import-full { position: fixed; inset: 0; z-index: 950; background: #EEF1F5;
    display: flex; flex-direction: column; animation: fadeup .18s ease; }
  /* Side padding = the card's offset, so the title and ✕ line up with the 1060px card below. */
  .import-full-bar { flex: 0 0 60px; height: 60px; background: #fff; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; padding: 0 max(22px, calc((100% - 1060px) / 2)); }
  .import-full-bar .iff-id { display: flex; align-items: center; gap: 13px; min-width: 0; }
  .import-full-bar .iff-t { line-height: 1.2; min-width: 0; }
  .import-full-bar .iff-t b { display: block; font-size: 15px; font-weight: 700; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .import-full-bar .iff-t span { font-size: 12.5px; color: var(--muted); }
  .import-full-body { flex: 1; min-height: 0; overflow-y: auto; }
  /* Hide the page scroll bars (still scrollable by wheel/trackpad/keys) so the layout
     never shifts sideways when content grows past the viewport. */
  .import-full-body, .scroll { scrollbar-width: none; }
  .import-full-body::-webkit-scrollbar, .scroll::-webkit-scrollbar { display: none; }
  /* The import flow sits in ONE floating white card on the gray canvas (SafeLMS
     reports card spec: 12px radius, soft shadow, no border) instead of floating loose. */
  .import-full-body > .content { background: #fff; border-radius: 12px;
    box-shadow: 0 1px 3px rgba(16,24,40,.10), 0 1px 2px rgba(16,24,40,.06);
    margin: 24px auto 48px; padding: 26px 32px 30px; }

  /* ---- Condensed catalog alerts + "Your choices" on Review (2026-09-25) ---- */
  .alert-sub { font-size: 12.5px; color: #3D4F63; margin-top: 2px; line-height: 1.45; }
  .alert-key { font-family: var(--mono); font-size: 11px; color: #8CA0B4; margin-top: 4px; }
  .alert-head + .alert-body { border-top: 1px solid rgba(16,24,40,.04); }
  /* Checkbox sits in a tinted box: yellow while it needs review, blue once reviewed. */
  .ack-row { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: #6B4A0A; cursor: pointer;
    background: #FFFAEB; border: 1px solid #F2D69B; border-radius: 8px; padding: 11px 14px; }

  // "Column D (USER_ID)" — the spreadsheet letter + header of a column in the picked file.
  function colRef(fileId, header) {
    var cols = COLS[fileId] || [];
    for (var i = 0; i < cols.length; i++) {
      if (cols[i][0] === header) return 'Column ' + String.fromCharCode(65 + i) + ' (' + header + ')';
    }

  }

  /* Upload log — every upload on the site, manual or automated, and who ran it.

  var LOG_SEED = [
    { at: 'Sep 24, 2026', time: '4:12 PM', file: 'fall_roster_final.csv', rows: 164, by: 'Deborah Kim', role: 'District admin',

    { at: 'Sep 24, 2026', time: '2:00 AM', file: 'safeschools_staff_2026-09-24.csv', rows: 171, by: 'Automated sync', role: 'SafeSchools · nightly (SFTP)',
      method: 'auto', status: 'blocked', roster: true, reviewId: 'auto',
      notes: ['Stopped: warnings need an admin’s approval — automated uploads can’t approve warnings on their own', 'Nothing was changed'] },
    { at: 'Sep 23, 2026', time: '3:41 PM', file: 'safeschools_export_full.csv', rows: 168, by: 'Mark Osei', role: 'Technology Director',
      method: 'manual', status: 'cancelled', roster: false,
      notes: ['Cancelled on Review changes — it was blocked: a username matches more than one active user on your site (row 48)', 'Nothing was changed'] },
    { at: 'Sep 23, 2026', time: '2:00 AM', file: 'safeschools_staff_2026-09-23.csv', rows: 170, by: 'Automated sync', role: 'SafeSchools · nightly (SFTP)',
      method: 'auto', status: 'completed', add: 0, mod: 6, deact: 0, jobsEnd: 0, roster: true, notes: [] },
    { at: 'Sep 22, 2026', time: '11:15 AM', file: 'athletics_coaches.xlsx', rows: 18, by: 'Dana Whitfield', role: 'HR Coordinator',
      method: 'manual', status: 'cancelled', roster: false, notes: ['Cancelled on Review changes — nothing was changed'] },
    { at: 'Sep 22, 2026', time: '2:00 AM', file: 'safeschools_staff_2026-09-22.csv', rows: 0, by: 'Automated sync', role: 'SafeSchools · nightly (SFTP)',
      method: 'auto', status: 'blocked', roster: true, notes: ['No file received from SafeSchools — nothing was changed', 'Vector Care was notified automatically'] },
    { at: 'Sep 18, 2026', time: '9:30 AM', file: 'sept_new_hires.csv', rows: 45, by: 'Deborah Kim', role: 'District admin',
      method: 'manual', status: 'completed', add: 42, mod: 3, deact: 0, jobsEnd: 0, roster: false, notes: ['3 email updates'] },
    { at: 'Sep 15, 2026', time: '2:00 AM', file: 'safeschools_staff_2026-09-15.csv', rows: 169, by: 'Automated sync', role: 'SafeSchools · nightly (SFTP)',
      method: 'auto', status: 'completed', add: 2, mod: 9, deact: 1, jobsEnd: 1, roster: true, notes: [] }

  /* Sample files for the prototype picker — ordered CLEANEST FIRST → MOST ISSUES

  // Test copy: realistic names, mixed order, no tags or hints about how clean a file is.
  var FILES = [
    { id: 'confirm', name: 'staff_export_fall.csv',      rows: 164 },
    { id: 'clean',   name: 'new_hires_2027.csv',         rows: 45 },
    { id: 'saml',    name: 'staff_update_october.csv',   rows: 156 },   // the blocker in the test script
    { id: 'dupes',   name: 'district_roster_2026.csv',   rows: 152 },
    { id: 'blast',   name: 'all_staff_master.csv',       rows: 168 }
  ];

  var COLS = {
    clean:   [['First Name','Maya'],['Last Name','Torres'],['Email','mtorres@ridgewood.k12.us'],['Username','mtorres@ridgewood.k12.us'],['Building','Lincoln Elementary'],['Job Title','Teacher — Grade 3']],
    confirm: [['First Name','Sue'],['Last Name','Hartley'],['Email','shartley@ridgewood.k12.us'],['Username','shartley@ridgewood.k12.us'],['Building','Ridgewood High'],['Job Title','Counselor']],
    saml:    [['FIRST','Sarah'],['LAST','Linden'],['EMAIL_ADDR','slinden@ridgewood.k12.us'],['USERNAME','slinden'],['BUILDING','District Office'],['JOB_TITLE','Registrar'],['TITLE','Registrar II'],['BEGIN_DATE','2024-13-45']],
    dupes:   [['First Name','John'],['Last Name','Smith'],['Email','jsmith@ridgewood.k12.us'],['Username','john.smith'],['Building','Ridgewood High'],['Job Title','Athletics Coach']],
    blast:   [['FIRST_NAME','Alan'],['LAST_NAME','Pruitt'],['EMAIL','apruitt@ridgewood.k12.us'],['USER_ID','apruitt'],['SITE','Kennedy Middle'],['ROLE','Custodian'],['TITLE','Head Custodian'],['BEGIN_DATE','2024-13-45'],['END_DATE','06/31/2025']]
  };

  // Mapping TARGETS. The first six line up (by position) with the sample files'
  // columns so the auto-match pre-fills correctly. Required = Username, First name,
  // Last name only (AC-1.4); Email is optional. Building/position CODES are

  // 2026-09-30: External Unique ID + Building code added (designer call, supersedes the

  var FIELDS = [
    { field: 'First name', req: true },  { field: 'Last name', req: true },
    { field: 'Email', req: false },      { field: 'Username', req: true },
    { field: 'Title', req: false },      { field: 'Begin date', req: false },

  var ATTRIBUTES = ['Employee ID', 'Department', 'Grade level', 'Hire date'];

  FILES.push({ id: 'auto',  name: 'safeschools_staff_2026-09-24.csv', rows: 171, hidden: true },
             { id: 'autob', name: 'safeschools_staff_2026-09-25.csv', rows: 171, hidden: true });
  COLS.auto = COLS.autob = COLS.saml;

  var NOT_IMPORTED = 'Don’t import';   // a choice, not a status (2026-10-01); shown gray in the selector

  var YELLOW = { chipBg: '#DC8A12', border: '#F2D69B', headBg: '#FFFAEB', titleColor: '#8A5A0B' };
  var RED = { chipBg: '#D92D20', border: '#F1C0BB', headBg: '#FEF3F2', titleColor: '#B42318' };
  function yellow(o) { for (var k in YELLOW) o[k] = YELLOW[k]; return o; }
  function red(o) { for (var k in RED) o[k] = RED[k]; return o; }
  var TIER = {
    blocked:  red({ chip: 'Blocked',         icon: 'fa-ban',                  proceedLabel: 'Why it’s blocked' }),
    escalate: red({ chip: 'Contact Vector', icon: 'fa-headset',              proceedLabel: 'Why Vector has to do this' }),
    confirm:  yellow({ chip: 'Warning',        icon: 'fa-triangle-exclamation', proceedLabel: 'If you proceed' }),
    info:     { chip: 'Info',           icon: 'fa-circle-info',          chipBg: '#5B8DC9', border: '#E1E7EE', headBg: '#F5F9FE', titleColor: '#1B2B3E', proceedLabel: 'What it means' }
  };

  /* ------------------------------------------------------------------ state */
  var state = {
    variants: { uploadVariant: 'column-mapping', startTab: 'import' },
    tab: null,
    addEmp: false,       // Add Employee modal open
    empMode: 'single',   // Add Employee modal mode: 'single' | 'bulk' (used by modal-entry versions)
    step: 'upload',
    fileId: null,
    mapping: {},
    purgeUsers: false,   // deactivate users not in the file
    purgeJobs: false,    // remove positions/locations not in the file
    repSent: false,      // "sent to your Vector rep" acknowledgement

  // Which SafeLMS target (if any) a given file column currently maps to. The
  // mapping state stays keyed field->column; this inverts it for the column view.
  function fieldForCol(col) {

  function pickFile(id) {

  function currentFile() {
    for (var i = 0; i < FILES.length; i++) { if (FILES[i].id === state.fileId) return FILES[i]; }

  function go(step) {
    if (step === 'review') {

     when purgeJobs. jobsAdded always applies (new position/location combos). */

  function samlMismatch() {
    if (state.fileId !== 'saml') return false;

  /* ==========================================================================

     "Error & Notification Message Catalog" (PMC 29424549907), keyed by Rich's
     %key_msgs keys. Tier + admin-facing copy are copied from the catalog, so
     the mock doubles as a copy check. Detail rule (9/23 review): row-level
     messages list each affected row; count/summary messages have no detail.
       tier:  blocked (BLOCKING) | confirm (WARNING) | info (INFO)
       msg:   admin-facing message; {count} is filled in. 1st sentence = title.
       head/rows: the expanded list (omit for count/summary-only).
       where: BLOCKING only — row(s) + column to look at, shown without expanding.
       fix:   BLOCKING only — one-line "what to do".
     ========================================================================== */
  var CATALOG_URL = 'https://lmsportal.atlassian.net/wiki/spaces/PMC/pages/29424549907';
  function pRows(n, seed, extra) {
    return people(n, seed).map(function (p, i) {
      var r = [{ v: 'Row ' + (seed % 50 + 2 + i * 3), c: 'row' }, { v: p.user, c: 'row' }, p.first, p.last];
      return extra ? r.concat(extra(p, i)) : r;
    });
  }
  var PERSON_HEAD = ['Row', 'Username', 'First name', 'Last name'];
  function codeRows(list) { return list.map(function (x) { return x.map(function (v, j) { return j === 0 ? { v: v, c: 'row' } : v; }); }); }
  var DUP = { v: 'Duplicate account', c: 'loss' };
  var NEWV = { v: 'No match — will be new', c: 'from' };

  // Username / first / last only (catalog: "username, first & last name").

  function mapHTML() {
    var file = FILES.find(function (f) { return f.id === state.fileId; });
    var cols = COLS[state.fileId];
    // AC-1.2: one row per COLUMN IN THE CUSTOMER'S FILE; each column picks a target.
    /* "Import as" dropdown (2026-10-01): matches the live SafeLMS filter selector — a bordered
       button (blue ring while open) and a menu of radio rows; the selected row gets a filled
       blue check + light-blue highlight. Required fields carry a red * (now possible, unlike
       a native <select>). One menu open at a time: state.mapOpen = the file column. */
    function ddLabel(v) {
      var f = FIELDS.find(function (x) { return x.field === v; });
      return esc(v) + (f && f.req ? '<span class="dd-req" aria-hidden="true"> *</span>' : '');
    }
    function targetDD(colName, sel) {
      var open = state.mapOpen === colName;
      function opt(v) {
        var on = sel === v;
        return '<button type="button" class="dd-opt' + (on ? ' is-sel' : '') + '" role="option" aria-selected="' + on + '" data-act="ddPick" data-arg="' + esc(colName) + '" data-val="' + esc(v) + '">'
          + '<span class="dd-radio" aria-hidden="true">' + (on ? '<i class="fa-solid fa-check"></i>' : '') + '</span><span>' + ddLabel(v) + '</span></button>';
      }
      var menu = !open ? '' : '<div class="dd-menu" role="listbox" aria-label="Import ' + esc(colName) + ' as">'
        + opt(NOT_IMPORTED)
        + '<div class="dd-group">Standard fields</div>' + FIELDS.map(function (f) { return opt(f.field); }).join('')
        + '<div class="dd-group">Your site’s attributes</div>' + ATTRIBUTES.map(opt).join('')
        + '</div>';
      return '<div class="dd">'
        + '<button type="button" class="dd-trigger' + (open ? ' is-open' : '') + (sel === NOT_IMPORTED ? ' is-empty' : '') + '" data-act="ddToggle" data-arg="' + esc(colName) + '" aria-haspopup="listbox" aria-expanded="' + open + '">'
        + '<span class="dd-val">' + ddLabel(sel) + '</span><i class="fa-regular fa-chevron-down dd-chev" aria-hidden="true"></i></button>'
        + menu + '</div>';
    }
    var rows = cols.map(function (c) {
      var colName = c[0], sample = c[1];
      var target = fieldForCol(colName);
      var isUser = target === 'Username';
      return '<div class="map-grid map-row">'
        // Required fields show * inside the selector; the Username lock note sits under the selector and
        // follows whichever column is currently imported as Username (2026-10-01).
        + '<div><div class="mono" style="font-size:13px;font-weight:600;color:#1B2B3E;">'
        + esc(colName) + '</div>'
        + '</div>'
        + '<div class="mono" style="font-size:12.5px;color:#5B6B7E;">' + esc(sample) + '</div>'
        + '<div>' + targetDD(colName, target)
        + (isUser ? '<div class="map-hint"><i class="fa-solid fa-lock map-lock" aria-hidden="true"></i>An upload can add new usernames but can’t change an existing one.</div>' : '')
        + '</div>'
        + '</div>';
    }).join('');
    // Required targets (Username, First, Last) must each be claimed by some column.
    var reqMissing = FIELDS.filter(function (f) { return f.req; }).filter(function (f) {
      return !state.mapping[f.field] || state.mapping[f.field] === NOT_IMPORTED;
    });
    var complete = reqMissing.length === 0;
    var missHint = complete ? ''
      : '<div style="font-size:12.5px;color:#B54708;background:#FFFAEB;border:1px solid #F2D69B;border-radius:8px;padding:9px 12px;margin-top:14px;"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i> Still needed: point a column at ' + reqMissing.map(function (f) { return '<b>' + esc(f.field) + '</b><span style="color:#D92D20;"> *</span>'; }).join(', ') + '. Username, first name and last name are required.</div>';
    return '<div class="fadeup"><div class="card" style="overflow:visible;">'   // visible so the dropdown menu isn't clipped
      + '<div style="padding:16px 20px;border-bottom:1px solid #EDF1F6;display:flex;justify-content:space-between;align-items:center;gap:16px;">'
      + '<div><div style="font-size:15px;font-weight:600;">Match your columns to SafeLMS fields</div>'
      + '<div style="font-size:13px;color:#5B6B7E;margin-top:3px;">We matched what we could. Change any that are wrong, or set them to “' + esc(NOT_IMPORTED) + '.”</div></div>'
      + '<div style="font-size:12px;color:#5B6B7E;background:#F0F4F9;border-radius:6px;padding:5px 10px;white-space:nowrap;">' + file.rows + ' rows detected</div></div>'
      + '<div class="map-grid map-head"><div>Column in your file</div><div>Sample from your file</div><div>Import as (SafeLMS field)</div></div>'
      + rows + '</div>'
      + missHint
      + '<div style="display:flex;justify-content:space-between;margin-top:18px;">'
      + '<button class="btn btn--ghost" data-act="back">← Back</button>'
      + '<button class="btn ' + (complete ? 'btn--primary' : 'btn--disabled') + '" data-act="next"' + (complete ? '' : ' disabled') + '>Continue to import settings →</button>'
      + '</div></div>';
  }

  /* Import settings — ONE all-or-nothing switch (users + jobs together). Off =
     add/update only; On = make the file the complete roster. purgeUsers /
     purgeJobs stay in lock-step so the review step keeps working.
     Layout (2026-09-25) mirrors Review: the choice on the left, the before → after
     totals in a 290px sticky side panel on the right. */
  function settingsSideHTML(on) {
    var sm = summaryFor(state.fileId, on, on);
    var uAfter = TOTAL + sm.add - sm.deact, jAfter = JOBS_TOTAL + sm.jobsAdded - sm.jobsRemoved;
    function tot(label, before, after, note) {
      return '<div class="set-tot"><div class="kpi-row"><span class="k">' + label + '</span>'
        + '<span class="v">' + before + ' <i class="fa-solid fa-arrow-right" aria-hidden="true"></i> ' + after + '</span></div>'
        + '<div class="set-tot-note">' + note + '</div></div>';
    }
    return '<div style="background:#fff;border:1px solid #E1E7EE;border-radius:10px;padding:18px 20px;">'
      + '<div class="kpi-eyebrow">After this import</div>'
      + '<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px;">'
      // Green = added, red = deactivated / ended (same colors as Review's Change summary).
      + tot('Active users', TOTAL, uAfter, '<span class="ba-add">+' + sm.add + ' new</span>' + (on && sm.deact ? ' · <span class="ba-rem">−' + sm.deact + ' deactivated</span>' : ''))
      + tot('Active positions', JOBS_TOTAL, jAfter, '<span class="ba-add">+' + sm.jobsAdded + ' new</span>' + (on && sm.jobsRemoved ? ' · <span class="ba-rem">−' + sm.jobsRemoved + ' ended</span>' : ''))
      + '</div><div class="divider" style="margin:14px 0;"></div>'
      + '<div class="kpi-row"><span class="k">Existing users updated</span><span class="v" style="color:#1257B8;">' + sm.mod + '</span></div>'
      + '<div style="font-size:12px;color:#8CA0B4;margin-top:12px;line-height:1.5;">Totals update as you flip the switch. You’ll see every change, person by person, on the next step.</div>'
      + '</div>';
  }

  function settingsHTML() {
    var on = state.purgeUsers && state.purgeJobs;

    // "Not sure?" is the pencil banner (2026-09-25); it flips to a confirmation once sent.
    var repBanner = state.repSent
      ? '<div class="care-banner is-sent">'
        + '<span class="cb-ico"><i class="fa-solid fa-circle-check" aria-hidden="true"></i></span>'
        + '<div class="cb-tx"><b>Sent to your Vector rep.</b> They’ll follow up by email to help you choose — nothing runs in the meantime.</div></div>'
      : '<div class="care-banner">'
        + '<span class="cb-ico"><i class="fa-solid fa-user-headset" aria-hidden="true"></i></span>'
        + '<div class="cb-tx"><b>Not sure which to choose?</b> Send this file to your Vector rep and they’ll help you decide.</div>'
        + '<button class="btn sm btn--outline-blue" data-act="askRep">Send to my Vector rep</button>'
        + '</div>';

    // The switch lives INSIDE the On/Off box and the whole box is the switch, so the
    // touch target is the full box (2026-09-29). The text under it follows its state.
    // Copy updated 2026-09-29. No "This file will deactivate N people…" count line here:
    // those counts can't be calculated at this step (see DEV-NOTES) — Review shows them.
    var effectText = on
      ? '<i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i><span><b>On:</b> Your site will match this file.'
        + '<ul><li>People not in the file are deactivated</li>'
        + '<li>Positions and locations not in the file are ended for the people who hold them</li>'
        + '<li>Training history is kept</li></ul></span>'
      : '<i class="fa-solid fa-circle-info" aria-hidden="true"></i><span><b>Off:</b> '
        + 'Adds and updates only. People and positions already on your site are left as they are.</span>';
    var optCard = '<div class="opt-effect opt-switchbox ' + (on ? 'is-on' : 'is-off') + '" data-act="togglePurgeAll" role="switch" aria-checked="' + on + '" tabindex="0" aria-labelledby="purge-lbl">'
      + '<div class="osb-head">'
      + '<div class="toggle" aria-hidden="true" style="flex:0 0 34px;background:' + (on ? '#D92D20' : '#C6D3E1') + ';">'
      + '<div class="toggle-knob" style="left:' + (on ? '17px' : '2px') + ';"></div></div>'
      + '<div class="opt-title" id="purge-lbl">Deactivate all people and positions not in this file</div></div>'
      + '<div class="osb-body">' + effectText + '</div></div>';
    var effect = '';

    // Users-only or positions-only deactivation isn't self-serve — plain helper text + Support Center.
    var care = '<div class="set-helper">This applies to both people and positions. To deactivate only one, contact Vector Care in the '
      + helpLink('support', 'Support Center') + '.</div>';

    return '<div class="fadeup"><div style="display:flex;gap:20px;align-items:flex-start;">'
      + '<div style="flex:1;min-width:0;">'   // full width now that the totals panel is gone
      // Header in the same shape as Map columns: what this step decides + one helpful line.
      + '<div style="font-size:15px;font-weight:600;">Choose how this file updates your site</div>'
      + '<div style="font-size:13px;color:#5B6B7E;margin:3px 0 14px;">By default this file only adds and updates people and positions. Turn this on only if the file is your complete list of staff and the positions they hold.</div>'
      + optCard + effect + care
      + '<div style="display:flex;justify-content:space-between;margin-top:22px;">'
      + '<button class="btn btn--ghost" data-act="back">← Back</button>'
      + '<button class="btn btn--primary" data-act="next">Review changes →</button>'
      + '</div></div>'
      // No "After this import" totals panel (2026-09-29): the counts can't be computed at this step.
      + '</div></div>';
  }

  /* Side-by-side "Now in SafeLMS → After you <accept/import/sync>" per changed row.
     Shows the current record, the resulting record, and (as a caption) what the
     file actually provides — so the consequence of accepting is concrete, and
     deactivations read as a loss (red). */
  function beforeAfter(diff, afterLabel, more) {
    var rows = diff.map(function (d) {
      var deact = /Deactivat/i.test(d.result);
      var head = (d.row && d.row !== '—') ? ('Row ' + d.row + ' · ' + d.field) : d.field;
      var sub = deact
        ? 'Missing from this file → loses access immediately · training history kept'
        : (d.incoming && d.incoming !== d.result ? 'From your file: ' + d.incoming : '');
      return '<div class="ba-row">'
        + '<div class="ba-head">' + esc(head) + '</div>'
        + '<div class="ba-grid">'
          + '<div class="ba-card ba-before"><div class="ba-label">Now in SafeLMS</div>'
          + '<div class="ba-val mono">' + esc(d.current) + '</div></div>'
          + '<div class="ba-arrow">→</div>'
          + '<div class="ba-card ba-after' + (deact ? ' is-loss' : '') + '">'
          + '<div class="ba-label">' + esc(afterLabel) + '</div>'
          + '<div class="ba-val mono' + (deact ? ' is-loss-text' : '') + '">' + esc(d.result) + '</div>'
          + (sub ? '<div class="ba-sub' + (deact ? ' is-loss-sub' : '') + '">' + esc(sub) + '</div>' : '')
          + '</div>'
        + '</div></div>';
    }).join('');
    return '<div class="ba">' + rows + (more ? '<div class="ba-more">' + esc(more) + '</div>' : '') + '</div>';
  }

  /* --- Review-alert detail helpers: before→after cards + a scannable table --- */
  function axArrow() { return '<i class="fa-solid fa-arrow-right-long" aria-hidden="true"></i>'; }

  // Two big cards with a large arrow between — a clear "from → to".
  function axBaCard(aLabel, aVal, bLabel, bVal) {
    return '<div class="ax-ba">'
      + '<div class="ax-ba-card ax-from"><div class="ax-ba-l">' + esc(aLabel) + '</div><div class="ax-ba-v">' + esc(aVal) + '</div></div>'
      + '<div class="ax-ba-arrow">' + axArrow() + '</div>'
      + '<div class="ax-ba-card ax-to"><div class="ax-ba-l">' + esc(bLabel) + '</div><div class="ax-ba-v">' + esc(bVal) + '</div></div>'
      + '</div>';
  }

  /* The FULL change list for an alert — every affected person/row, with a count
     and a CSV download; scrolls inside the box for long sets. Cells are strings or
     { v, c } where c = row | bad | lock | loss | to | from (see .axt-* styles). */
  function axList(L) {
    var th = L.head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('');
    var body = L.rows.map(function (r) {
      return '<tr>' + r.map(function (c, j) {
        var o = (c && typeof c === 'object') ? c : { v: c };
        var cls = o.c ? 'axt-' + o.c : (j === 0 ? 'axt-k' : '');
        return '<td' + (cls ? ' class="' + cls + '"' : '') + '>'
          + (o.lock ? '<i class="fa-solid fa-lock" aria-hidden="true" title="Can’t be changed by an upload"></i>' : '')
          + esc(o.v) + '</td>';
      }).join('') + '</tr>';
    }).join('');
    var n = L.rows.length;
    // No count label here — the drawer button already says "Hide N rows".
    return '<div class="axt-wrap' + (n > 8 ? ' is-long' : '') + '"><table class="axt"><thead><tr>' + th + '</tr></thead>'
      + '<tbody>' + body + '</tbody></table></div>';
  }

  /* One review alert, condensed (2026-09-25): chip + the catalog message (title +
     one short line). BLOCKING adds "Where" (row + column) always visible. The
     "Show list" toggle appears only for row-level messages and opens just the
     list (+ one "what to do" line for BLOCKING). Count/summary messages: no toggle. */
  // A WARNING that's been acknowledged turns blue "Reviewed" — done, but not a green "success".
  var REVIEWED = { chip: 'Reviewed', icon: 'fa-circle-check', chipBg: '#1257B8', border: '#C6D9F0', headBg: '#F5F9FE', titleColor: '#1B2B3E' };
  /* Review alerts are short banners (2026-09-30): chip + title only, so the page reads as
     a list of titles. "View details" opens the rest — the sub-line, the full list (scrolls
     when long), "What to do", and for a Warning the checkbox (so it's confirmed after it's
     seen). No per-alert downloads: one "Download CSV" at the top of the side panel holds every list. */
  function alertHTML(a) {
    var acked = !!state.acks[ackKey(a.id)];
    var t = (a.tier === 'confirm' && acked) ? REVIEWED : TIER[a.tier];
    var open = !!state.disc['ax:' + a.id];
    var copyReview = false;   // test copy: never show catalog keys
    var hard = a.tier === 'blocked' || a.tier === 'escalate';

    var body = '';
    if (a.sub) body += '<div class="alert-sub">' + esc(a.sub) + '</div>';
    if (a.list) {
      var ct = a.list.col;
      var th = a.list.head.map(function (h, j) {
        return '<th>' + esc(h) + (ct && ct.tag && ct.at === j ? '<span class="axt-col">' + esc(ct.tag) + '</span>' : '') + '</th>';
      }).join('');
      var tb = a.list.rows.map(function (r) {
        return '<tr>' + r.map(function (c, j) {
          var o = (c && typeof c === 'object') ? c : { v: c };
          var cls = o.c ? 'axt-' + o.c : (j === 0 ? 'axt-k' : '');
          return '<td' + (cls ? ' class="' + cls + '"' : '') + '>'
            + (o.lock ? '<i class="fa-solid fa-lock" aria-hidden="true" title="Can’t be changed by an upload"></i>' : '') + esc(o.v) + '</td>';
        }).join('') + '</tr>';
      }).join('');
      body += '<div class="ax-list">'
        + (a.list.note ? '<div class="ax-note">' + esc(a.list.note) + '</div>' : '')
        + '<div class="axt-wrap' + (a.list.rows.length > 8 ? ' is-long' : '') + '"><table class="axt"><thead><tr>' + th + '</tr></thead><tbody>' + tb + '</tbody></table></div>'
        + '</div>';
    }
    if (a.fix) body += '<div class="ax-todo"><span class="ax-lbl">What to do:</span> ' + esc(a.fix) + '</div>';
    // Blocked: questions go to an issue ticket in the Support Center (the "Submit a ticket" button was removed 2026-09-30).
    if (hard) body += '<div class="ax-ask">Have a question about this? <a href="' + HELP_LINKS.support + '" target="_blank" rel="noopener">Raise an issue ticket</a>.</div>';

    /* A Warning's "I've reviewed this" sits top right so it can be confirmed without opening
       it; View details is the second row, under the title (2026-10-01). */
    var ack = a.tier === 'confirm'
      ? '<label class="ack-row ack-inline' + (acked ? ' is-acked' : '') + '">'
        + '<input type="checkbox" data-act="ack" data-arg="' + a.id + '"' + (acked ? ' checked' : '') + '>'
        + '<span>I’ve reviewed this</span></label>' : '';
    var toggle = body
      ? '<button class="ax-toggle" data-act="toggleDisc" data-arg="ax:' + a.id + '" aria-expanded="' + open + '">'
        + (open ? 'Hide details' : 'View details') + ' <i class="fa-solid fa-chevron-down" aria-hidden="true"></i></button>' : '';
    return '<div class="alert' + (open ? ' is-open' : '') + '" style="border-color:' + t.border + ';">'
      + '<div class="alert-head" style="background:' + t.headBg + ';">'
      + '<div style="flex:1;min-width:0;">'
      + '<div class="chip ax-eyebrow" style="background:' + t.chipBg + ';"><i class="fa-solid ' + t.icon + '" aria-hidden="true"></i>' + t.chip + '</div>'   // eyebrow (2026-10-01)
      + '<div class="alert-title" style="color:' + t.titleColor + ';">' + esc(a.title) + '</div>'
      + (copyReview ? '<div class="alert-key">' + esc(a.key) + '</div>' : '')
      + (toggle ? '<div class="ax-line2">' + toggle + '</div>' : '')
      + '</div>'
      + ack   // top right (2026-10-01)
      + '</div>'
      + (open && body ? '<div class="alert-body">' + body + '</div>' : '')
      + '</div>';
  }

  /* "Your choices" — what they picked on Map columns + Import settings, each with
     Edit, shown above the alerts on Review (2026-09-25). */
  function choicesHTML() {
    var on = state.purgeUsers && state.purgeJobs, cols = COLS[state.fileId] || [];
    var mapped = cols.filter(function (c) { return fieldForCol(c[0]) !== NOT_IMPORTED; });
    var skipped = cols.length - mapped.length;
    var mapCard = !isMap() ? '' : '<div class="choice">'
      + '<div class="choice-h"><span>Column mapping</span><button class="choice-edit" data-act="linkMap"><i class="fa-solid fa-pen" aria-hidden="true"></i> Edit</button></div>'
      + '<div class="choice-map">' + mapped.map(function (c) {
          return '<div class="cm-row"><span class="mono">' + esc(c[0]) + '</span><i class="fa-solid fa-arrow-right" aria-hidden="true"></i><b>' + esc(fieldForCol(c[0])) + '</b></div>';
        }).join('') + '</div>'
      + (skipped ? '<div class="choice-note">' + skipped + ' column' + (skipped === 1 ? '' : 's') + ' not imported</div>' : '')
      + '</div>';
    var setCard = '<div class="choice">'
      + '<div class="choice-h"><span>Import settings</span><button class="choice-edit" data-act="linkSettings"><i class="fa-solid fa-pen" aria-hidden="true"></i> Edit</button></div>'
      + '<div class="choice-set"><span class="log-pill ' + (on ? 'lp-blocked' : 'lp-manual') + '">' + (on ? 'On' : 'Off') + '</span> Deactivate all people and positions not in this file</div>'
      + '<div class="choice-note">' + (on ? 'Anyone and any position not in the file is deactivated / ended.' : 'Only adds and updates — no one is deactivated.') + '</div>'
      + '</div>';
    return '<div class="choices">' + mapCard + setCard + '</div>';
  }

  function reviewHTML() {
    var file = FILES.find(function (f) { return f.id === state.fileId; });
    if (state.validating) {
      return '<div class="fadeup"><div class="card" style="padding:48px 20px;text-align:center;">'
        + '<div class="spinner"></div>'
        + '<div style="font-size:14.5px;font-weight:600;">Checking this file against your site…</div>'
        + '<div style="font-size:13px;color:#5B6B7E;margin-top:4px;">Comparing ' + file.rows + ' rows to ' + TOTAL + ' existing users, your sign-on settings, and site configuration. Nothing has been changed yet.</div>'
        + '</div></div>';
    }
    var raw = buildAlerts();
    var alertsHtml = raw.length
      ? raw.map(alertHTML).join('')
      : '<div style="background:#ECFDF3;border:1px solid #A6E5C3;border-radius:10px;padding:16px 18px;font-size:13.5px;color:#067647;"><span style="font-weight:600;">No issues found.</span> Every row checks out against your site and your sign-on settings.</div>';

    // Blocked and escalate ('contact Vector') both hard-stop the import.
    var blocked = raw.filter(function (a) { return a.tier === 'blocked' || a.tier === 'escalate'; });
    var confirms = raw.filter(function (a) { return a.tier === 'confirm'; });
    var acked = confirms.filter(function (a) { return state.acks[ackKey(a.id)]; });
    var canSubmit = !state.validating && blocked.length === 0 && acked.length === confirms.length;
    var sum = summary();

    var side = '<div style="background:#fff;border:1px solid #E1E7EE;border-radius:10px;padding:18px 20px;">'
      // One CSV for everything (2026-09-30) — replaces per-alert downloads; opens a preview.
      + '<div class="side-csv"><div class="sc-t">The full list of what we found</div>'
      + '<div class="sc-s">Download the file to see every issue, the row and person it affects, and what to fix before you import.</div>'
      + '<button class="btn sm btn--outline-blue" data-act="openCsv" style="width:100%;margin-top:10px;"><i class="fa-solid fa-file-csv" aria-hidden="true"></i> Download CSV</button></div>'
      + '<div class="divider" style="margin:16px 0;"></div>'
      + '<div class="kpi-eyebrow">Change summary</div>'
      + '<div style="display:flex;flex-direction:column;gap:8px;margin-top:12px;">'
      + '<div class="kpi-row"><span class="k">New users added</span><span class="v" style="color:#067647;">' + sum.add + '</span></div>'
      + '<div class="kpi-row"><span class="k">Existing users updated</span><span class="v" style="color:#1257B8;">' + sum.mod + '</span></div>'
      + '<div class="kpi-row"><span class="k">Users deactivated</span><span class="v" style="color:' + (sum.deact > 0 ? '#B42318' : '#8CA0B4') + ';">' + sum.deact + '</span></div>'
      // Jobs only when roster mode actually ends some (keeps the default summary to 3 lines).
      + (sum.jobsRemoved > 0 ? '<div class="kpi-row"><span class="k">Positions ended</span><span class="v" style="color:#B42318;">' + sum.jobsRemoved + '</span></div>' : '')
      + '</div><div class="divider" style="margin:16px 0;"></div>';
    if (blocked.length) {
      side += '<div class="run-note is-red"><i class="fa-solid fa-ban" aria-hidden="true"></i><span><b>'
        + (blocked.length === 1 ? '1 blocked issue' : blocked.length + ' blocked issues') + '</b> must be fixed in your file before this import can run. Fix those rows, then upload the file again.</span></div>';
    } else if (confirms.length) {
      var left = confirms.length - acked.length;
      side += left
        ? '<div class="run-note is-yellow"><i class="fa-solid fa-triangle-exclamation" aria-hidden="true"></i><span><b>'
          + (left === 1 ? '1 warning needs' : left + ' warnings need') + ' your review.</b> Check “I’ve reviewed this” on '
          + (left === 1 ? 'it' : 'each one') + ' to run the import. ' + acked.length + ' of ' + confirms.length + ' done.</span></div>'
        : '<div class="run-note is-blue"><i class="fa-solid fa-circle-check" aria-hidden="true"></i><span><b>'
          + (confirms.length === 1 ? 'Warning reviewed.' : 'All ' + confirms.length + ' warnings reviewed.') + '</b> You’re ready to run the import.</span></div>';
    }
    side += '<button class="btn" data-act="runImport" style="width:100%;border:none;background:' + (canSubmit ? '#1257B8' : '#C6D3E1') + ';color:#fff;font-size:14px;font-weight:600;padding:11px 0;border-radius:8px;cursor:' + (canSubmit ? 'pointer' : 'not-allowed') + ';"' + (canSubmit ? '' : ' disabled') + '>' + (state.autoReview != null ? 'Approve &amp; run import' : 'Run import') + '</button>'
      // "Replace file" -> "Cancel import" (2026-09-24): an unconfirmed upload is a
      // cancelled attempt; the user starts a whole new upload. Also the one way out
      // for a BLOCKED import. OPEN: does a cancelled upload appear in the upload log?
      + (state.autoReview != null
        ? '<div style="font-size:12px;color:#8CA0B4;margin-top:10px;line-height:1.5;">Nothing changes until you approve it. Tonight’s automated upload still runs as usual.</div>'
        : '<button class="btn btn--outline-red" data-act="cancelImport" style="width:100%;margin-top:8px;">Cancel import</button>'
          + '<div style="font-size:12px;color:#8CA0B4;margin-top:10px;line-height:1.5;">Nothing changes until you run it.</div>')
      // Support articles (2026-09-25 — replaces the Edit mapping / Change settings
      // links; the stepper already jumps back to earlier steps).
      + '<div class="divider" style="margin:14px 0;"></div>'
      + '<div class="side-help-h">Help articles</div>'
      + '<div class="side-help">'
      + helpLink('errors', 'Common upload errors')
      + helpLink('template', 'Bulk upload process & template')
      + helpLink('best', 'Best practices for structuring user data')
      + '</div></div>';

    // Header (2026-10-01) — same shape as Map columns / Import settings; the line under it
    // says what this page needs from them, by what the file has.
    var revSub = blocked.length
      ? 'This file can’t be imported yet. Fix the blocked rows in your file — or delete them — then upload it again.'
      : confirms.length
        ? 'Here’s what this file will change. Review each warning and check “I’ve reviewed this” — once they’re all reviewed, you can run the import.'
        : 'Here’s what this file will change. Nothing needs your review — run the import when you’re ready.';

  /* CSV preview (2026-09-30): the complete list as it opens in a spreadsheet. Each alert

  function csvHTML() {
    var f = currentFile(), groups = buildAlerts().filter(function (a) { return a.list && a.list.rows.length; });
    var width = 1 + groups.reduce(function (w, a) { return Math.max(w, a.list.head.length); }, 1);
    var TINT = { blocked: '#FEF3F2', escalate: '#FEF3F2', confirm: '#FFFAEB', info: '#EEF4FC' };
    var LABEL = { blocked: 'Blocked', escalate: 'Blocked', confirm: 'Warning', info: 'Info' };
    var n = 0, body = '', count = 0;
    function cells(list, cls) {
      var out = '';
      for (var i = 0; i < width; i++) out += '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + (list[i] != null ? esc(list[i]) : '') + '</td>';
      return out;
    }
    function row(list, cls, bg) { n++; body += '<tr' + (bg ? ' style="background:' + bg + ';"' : '') + '><th class="cv-n">' + n + '</th>' + cells(list, cls) + '</tr>'; }
    // Group title: one cell spanning the row, so a long title doesn't widen column A.
    function title(text, bg) { n++; body += '<tr style="background:' + bg + ';"><th class="cv-n">' + n + '</th><td class="cv-g" colspan="' + width + '">' + esc(text) + '</td></tr>'; }

  // Method is plain text with a muted icon — no colored tag, so the Result column is

    var STATUS = {

      failed:    ['lp-blocked', 'fa-ban', 'Blocked']   // retired 2026-09-29 — shows as Blocked

    function pill(cls, ico, label) { return '<span class="log-pill ' + cls + '"><i class="fa-solid ' + ico + '" aria-hidden="true"></i>' + label + '</span>'; }
    // One row per upload (2026-09-29): changes get their own number columns instead of a wrapped sentence.
    function changes(r) {

      if (r.reviewId && !runHasBlock(r.reviewId)) return '<div class="lg-span4"><span class="log-review">Review &amp; approve</span></div>';
      if (r.status !== 'completed') return '<div class="lg-span4"></div>';
      function n(v, danger) { return '<div class="lg-num' + (v ? (danger ? ' ba-rem' : '') : ' is-zero') + '">' + (v || 0) + '</div>'; }
      return n(r.add) + n(r.mod) + n(r.deact, true) + n(r.jobsEnd, true);

    var body = rows.map(function (x) {

      + '<div class="log-card">'
